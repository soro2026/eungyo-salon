<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EG 뮤세움 — 시간의 서가</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
 *  bibliotheca.html v1.5 — 0807 · EG 뮤세움 · 시간의 서가
 *    v1.6 — 서고의 음악(구 museum.html 열두 곡 승계) · 낭독 더킹
 *           책 모달 이식 — 3D 표지 → 펼침 → 4겹이 한 겹씩 한 쪽 (분더카머 3층 문법)
 *    v1.7 — OX 차단 세 겹 중 셋째 겹 (첫째=game_core.js · 둘째=DB 트리거)
 *
 *  2뷰: 정문(gate 16:9 · 밤낮 4벌) → [암전] → 서고(hall 9:16 · 밤낮 4벌)
 *  그림: tour-assets/museum/{code}_gate_{m|d|e|n}.webp · {code}_hall_{m|d|e|n}.webp
 *  곳:   terra_pins (kind='museum') — 좌표·museum_no·shelf_rect 한 행에
 *  책:   quiz_log — 내가 만난 책. 사람마다 다르다.
 *
 *  ⭐⭐ 미술관과 결정적으로 다른 것 (0807 소로):
 *    미술관   오늘의 그림 한 점. 전 회원이 같은 것을 본다
 *    뮤세움   내가 만난 책 전부. 사람마다 다르고, 날마다 늘어난다
 *    → 그래서 벽감이 비어서 시작한다. 배경에 선반도 책도 없는 까닭이다.
 *
 *  ⭐ 시간순 한 줄기. 카테고리 분류는 분더카머 3층 치타델레가 맡는다(0807 갈라섬).
 *    여기 물음은 「나는 어떻게 걸어왔는가」이고, 거기 물음은 「나는 어떤 사람인가」다.
 *
 *  ⚠⚠ 패럴랙스를 쓰지 않는다. 콜레주 2층은 배경과 본문을 다른 속도로 흘렸으나,
 *    거기는 배경 책이 흐릿해 어긋남이 「깊이」로 읽힌다. 뮤세움 벽감은 또렷한 빈
 *    나무판이라 조금만 어긋나도 책이 몰딩 위로 올라탄다. 배경은 고정이다.
 *
 *  ⭐ 그래서 페이지 넘김이다(0807 소로 결정). 과거 책을 지우지 않는다 —
 *    뮤세움은 EG에서 아무것도 안 사라지는 유일한 곳이고, 한스푼 강물원칙이
 *    「흘려보낸 것도 뮤세움에는 남는다」로 성립하는 근거가 여기다.
 *
 *  ⚠ 순회 공식은 terra.html · admin_museum_assets.html과 반드시 같아야 한다.
 *      당번 = 명단[ KST날수 mod 곳수 ]
 *    ⭐ 다만 **서가는 어느 서고에서 열든 하나다.** 순회가 가르는 것은 방의 얼굴과
 *      도장뿐이다(알베르게 원칙 1호 — 몸통은 곳의 얼굴, 각인은 그날의 것).
 * ============================================================ */
:root{--gold:#c9a24a;--gold-l:#e9cf9c;--ink:#2E4A7A;
  /* 서가 판짜기 — 여기 셋만 고치면 한 페이지 권수가 바뀐다 */
  --racks:3;              /* 벽감 안 단 수 */
  --per-rack:12;          /* 한 단 권수 */
}
*{margin:0;padding:0;box-sizing:border-box;}
/* 스크롤바는 어디에도 두지 않는다 — 굴러가되 보이지 않는다(0805 소로) */
*{scrollbar-width:none;-ms-overflow-style:none;}
*::-webkit-scrollbar{width:0;height:0;display:none;}
html,body{height:100%;background:#0d0a07;color:#e8ddc4;
  font-family:'Gowun Batang',serif;overflow:hidden;}

.view{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .6s;}
.view.on{opacity:1;pointer-events:auto;}

/* ── 정문 ── */
#gate{background:#000 center/cover no-repeat;display:grid;place-items:end center;
  padding-bottom:max(7vh,54px);cursor:pointer;}
#gateHead{position:absolute;left:0;right:0;top:clamp(16px,4vh,44px);text-align:center;
  text-shadow:0 2px 18px rgba(0,0,0,.65);}
#gateHead .g-eyebrow{font-family:'Cormorant Garamond',serif;font-size:clamp(10px,1.3vw,12px);
  letter-spacing:.34em;color:rgba(233,207,156,.85);}
#gateHead .g-name{font-size:clamp(19px,3vw,27px);color:#f5efdd;margin-top:9px;letter-spacing:.05em;}
#gateHead .g-city{font-family:'Cormorant Garamond',serif;font-size:clamp(10px,1.2vw,12px);
  letter-spacing:.28em;color:rgba(232,221,196,.62);margin-top:7px;}
#enterBtn{font:inherit;font-size:13.5px;letter-spacing:.2em;color:#f0e8d4;
  background:rgba(10,8,5,.52);border:1px solid rgba(233,207,156,.65);border-radius:26px;
  padding:13px 34px;cursor:pointer;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  transition:all .3s;}
#enterBtn:hover{background:rgba(201,162,74,.28);}

/* ── 암전 ── */
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;
  transition:opacity 1s;z-index:20;}
#fade.on{opacity:1;}

/* ── 서고 ── */
#hall{background:#000;overflow-y:auto;overflow-x:hidden;}
#hallFit{position:relative;margin:0 auto;}
#hallImg{display:block;width:100%;height:auto;}

/* ⭐ 서가 — 벽감(shelf_rect) 좌표에 통째로 앉는다. 배경과 한 몸으로 움직인다 */
#shelf{position:absolute;display:flex;flex-direction:column;}
.rack{flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-height:0;}
.row{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:0;min-height:0;}
/* 한 권 = 그림 + 그 위에 얹힌 제목.
   ⚠ 감싸개(.bk)의 높이가 곧 책등 높이여야 한다 — 줄 전체 높이가 되면
     글씨가 책등 위 빈 곳까지 퍼져 허공에 뜬다. img를 display:block으로 두어
     감싸개가 그림에 딱 맞게 오므라들도록 한다. */
.bk{position:relative;flex:none;cursor:pointer;transition:transform .22s ease;}
.bk:hover{transform:translateY(-7px);}
.spine{display:block;height:100%;width:auto;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));}
/* 책등 제목 — 치타델레 .f4-book-text 계보(0807).
   ⚠ 0807 소로 — 첫판이 너무 작고 가늘었다. 굵기 700 · clamp 상한 20px로 올렸다.
     벽감은 화면 따라 커지므로 치타델레의 11px 고정을 그대로 쓰면 큰 화면에서 개미가 된다. */
.bkt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;text-orientation:mixed;
  font-size:clamp(11px,1.05vw,20px);font-weight:700;color:rgba(255,255,255,.96);
  letter-spacing:.02em;line-height:1.18;padding:7% 2px;overflow:hidden;
  text-shadow:0 1px 3px rgba(0,0,0,.98), 0 0 6px rgba(0,0,0,.85), 0 0 14px rgba(0,0,0,.6);
  pointer-events:none;}

/* 선반 널 — CSS 오크 + 기간 각인. ⭐ 배경에 선반이 없으므로 이것이 유일한 선반이다 */
.plank{height:11%;min-height:9px;border-radius:2px;position:relative;flex:none;
  background:linear-gradient(180deg,#6b4a26 0%,#48311a 42%,#2f1f10 100%);
  box-shadow:0 5px 12px rgba(0,0,0,.55), inset 0 1px 0 rgba(201,162,74,.28);}
.plank::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:4px;
  background:linear-gradient(180deg,rgba(0,0,0,.42),transparent);}
.pl-when,.pl-n{position:absolute;top:50%;transform:translateY(-50%);
  font-size:clamp(7px,.72vw,11px);letter-spacing:.16em;white-space:nowrap;
  color:rgba(226,192,126,.92);
  text-shadow:0 -1px 0 rgba(0,0,0,.75), 0 1px 0 rgba(255,232,180,.14);}
.pl-when{left:2.2%;font-family:'Cormorant Garamond',serif;}
.pl-n{right:2.2%;font-family:'Cormorant Garamond',serif;color:rgba(226,192,126,.62);}

/* 빈 서가 — 아직 한 권도 없을 때 */
#empty{position:absolute;left:0;right:0;top:38%;text-align:center;
  font-size:clamp(11px,1.3vw,14px);line-height:2.2;color:rgba(233,207,156,.62);
  text-shadow:0 2px 14px rgba(0,0,0,.8);pointer-events:none;}

/* ── 머리 · 페이저 ── */
#hallHead{position:fixed;left:0;right:0;top:clamp(12px,3vh,30px);text-align:center;
  pointer-events:none;text-shadow:0 2px 16px rgba(0,0,0,.75);}
#hallHead .h-name{font-family:'Cormorant Garamond',serif;font-size:clamp(10px,1.2vw,12.5px);
  letter-spacing:.3em;color:rgba(233,207,156,.8);}
#hallHead .h-sum{display:block;font-size:clamp(10px,1.1vw,12px);
  color:rgba(232,221,196,.55);margin-top:6px;letter-spacing:.06em;}

#pager{position:fixed;left:50%;transform:translateX(-50%);z-index:9;
  bottom:calc(20px + env(safe-area-inset-bottom));
  display:none;align-items:center;gap:14px;
  background:rgba(14,10,6,.66);border:1px solid rgba(201,162,74,.42);border-radius:24px;
  padding:8px 10px;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  box-shadow:0 4px 18px rgba(0,0,0,.55);}
#pager.on{display:flex;}
#pager button{font:inherit;font-size:15px;color:rgba(233,207,156,.9);background:none;
  border:none;cursor:pointer;padding:2px 10px;transition:color .2s;}
#pager button:hover:not(:disabled){color:#fff;}
#pager button:disabled{opacity:.25;cursor:default;}
#pgWhen{font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.14em;
  color:var(--gold-l);min-width:14ch;text-align:center;}
#pgWhen b{display:block;font-family:'Gowun Batang',serif;font-size:10px;
  letter-spacing:.1em;color:rgba(232,221,196,.45);font-weight:400;margin-top:2px;}



/* ── 서고의 음악 단추 — 구 museum.html에서 옮겨온 것 ── */
#bgmBtn{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top));z-index:12;
  font-size:15px;line-height:1;background:rgba(14,10,6,.6);
  border:1px solid rgba(201,162,74,.4);border-radius:50%;width:38px;height:38px;
  cursor:pointer;display:none;transition:background .2s;}
#bgmBtn.on{display:block;}
#bgmBtn:hover{background:rgba(201,162,74,.16);}


/* ══ 책 모달 — 분더카머 3층(치타델레)에서 그대로 옮겨 왔다 · 0807 ═══════════
   ⭐ 이 문법의 뿌리는 구 museum.html이고, 3층이 그것을 복제하며 손본 것이 최신판이다
     (마우스 기울임·단건 조회는 3층에만 있다). 그래서 3층 쪽을 옮겼다.
   ⚠⚠ **f4 접두사를 안 바꿨다.** 뮤세움에 「4층」은 뜻이 없지만, 이름을 갈면
     두 방의 코드를 나란히 놓고 대조할 수 없게 된다. 지금 같은 물건이 세 곳에 산다
     (구 뮤세움 · 분더카머 3층 · 여기). 한 곳을 고치면 셋을 다 고쳐야 하고,
     이름이 같아야 그 일이 가능하다.
   ⏱ 정석은 eg_book.js 한 부품으로 빼는 것이다 — 대청소 딱지에 등재. ══ */
.f4book-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(42,32,20,0.0);
    z-index: 9500;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: background 1.2s ease;
  }
.f4book-modal-overlay.open { display: flex; }
.f4book-modal-overlay.bg-light { background: rgba(200,190,170,0.85); }
/* ── 3D 표지 씬 ── */
  .f4cover-scene {
    perspective: 900px;
    perspective-origin: 50% 45%;
    position: relative;
  }
.f4cover-book-3d {
    width: 200px; height: 280px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateY(-26deg) rotateX(4deg);
    transition: transform 0.5s cubic-bezier(0.23,1,0.32,1);
    will-change: transform;
    cursor: pointer;
  }
.f4cover-face-front {
    position: absolute;
    width: 200px; height: 280px;
    border-radius: 0 5px 5px 0;
    overflow: hidden;
    backface-visibility: hidden;
    box-shadow: inset -3px 0 8px rgba(0,0,0,0.1);
    pointer-events: none;
  }
.f4cover-book-3d {
    width: 200px; height: 280px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateY(-26deg) rotateX(4deg);
    transition: transform 0.5s cubic-bezier(0.23,1,0.32,1);
    will-change: transform;
    cursor: pointer;
    pointer-events: all;
  }
.f4cover-gloss {
    position: absolute; top:0; left:0;
    width:52%; height:100%;
    background: linear-gradient(to right,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.05) 55%,transparent 100%);
    pointer-events:none; z-index:20;
  }
.f4cover-holo {
    position:absolute; inset:0;
    background: linear-gradient(118deg,transparent 0%,rgba(255,80,140,0.07) 18%,rgba(80,200,255,0.09) 34%,rgba(100,255,140,0.07) 50%,rgba(255,210,50,0.08) 66%,rgba(180,80,255,0.07) 82%,transparent 100%);
    mix-blend-mode:screen; pointer-events:none; z-index:19; opacity:0.55;
  }
.f4cover-face-spine {
    position:absolute;
    width:72px; height:280px;
    left:-72px; top:0;
    transform-origin:right center;
    transform:rotateY(-90deg);
    border-radius:4px 0 0 4px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
.f4cover-face-spine::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(to right,rgba(0,0,0,0.3),transparent 55%);
  }
.f4cover-spine-text {
    writing-mode:vertical-rl; transform:rotate(180deg);
    font-size:0.54rem; letter-spacing:0.14em;
    position:relative; z-index:1;
    white-space:nowrap; overflow:hidden; max-height:88%;
    font-family:'Noto Serif KR',serif; font-weight:600;
  }
.f4cover-shadow {
    position:absolute;
    bottom:-44px; left:-80px;
    width:280px; height:55px;
    background:radial-gradient(ellipse at 45% 5%,rgba(0,0,0,0.45) 0%,rgba(0,0,0,0.15) 40%,transparent 70%);
    transform:rotateX(90deg) scaleY(0.5);
    filter:blur(10px); pointer-events:none;
    transition:opacity 0.4s;
  }
.f4cover-eg-sticker {
    position:absolute; width:32px; height:32px;
    border-radius:50%;
    background:conic-gradient(from 0deg,#ff6b9d,#c44dff,#4dc8ff,#4dff91,#fff34d,#ff914d,#ff6b9d);
    z-index:25; box-shadow:0 0 10px rgba(150,100,255,0.35);
    display:flex; align-items:center; justify-content:center;
    font-size:0.4rem; font-weight:700; color:rgba(255,255,255,0.9);
    font-family:'Cormorant Garamond',serif;
    bottom:28px; right:10px;
  }
.f4cover-hint {
    position:absolute; bottom:-36px; left:50%;
    transform:translateX(-50%);
    font-size:0.58rem; letter-spacing:0.15em;
    color:rgba(201,168,76,0.5);
    white-space:nowrap;
    transition:opacity 0.3s;
  }
/* ── 내부 페이지 래퍼 (3D 표지에서 전환) ── */

  .f4book-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 340px;
    min-height: 520px;
    height: auto;
    display: flex;
    flex-direction: column;
    overflow: visible;
    border-radius: 2px 12px 12px 2px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    z-index: 9600;
  }
.f4book-modal.visible {
    visibility: visible;
    pointer-events: all;
  }
/* active 스타일은 JS showInnerPages에서 직접 style로 제어 */
  /* ── 애플북스 방식: 현재 페이지가 위에서 슬라이드아웃, 다음 페이지는 바닥 고정 ── */
  .f4book-page-view {
    will-change: transform;
    box-sizing: border-box;
  }
/* active 클래스는 JS에서 style로 직접 제어 */

  /* 표지 */
  .f4page-cover {
    background: #1E1108;
    border-left: 10px solid #120D04;
    height: 460px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 40px 28px 32px;
    position: relative;
    overflow: hidden;
  }
.f4page-cover::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
    );
  }
.f4cover-content { position: relative; }
.f4cover-cat-label {
    font-size: 9px;
    letter-spacing: 0.3em;
    color: rgba(201,168,76,0.5);
    font-family: 'Courier New', monospace;
    margin-bottom: 20px;
  }
.f4cover-main-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 28px;
    font-weight: 600;
    color: #F8F4EE;
    line-height: 1.3;
    margin-bottom: 16px;
  }
.f4cover-divider {
    width: 40px; height: 1px;
    background: rgba(201,168,76,0.3);
    margin-bottom: 16px;
  }
.f4cover-keyword-text {
    font-size: 12px;
    color: rgba(248,244,238,0.35);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    line-height: 1.7;
  }
.f4cover-footer { position: relative; display: flex; align-items: center; justify-content: space-between; }
.f4cover-eg {
    width: 40px; height: 40px;
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: rgba(201,168,76,0.4);
    font-family: 'Cormorant Garamond', serif;
  }
.f4cover-num {
    font-size: 9px;
    color: rgba(201,168,76,0.25);
    font-family: 'Courier New', monospace;
    letter-spacing: 0.15em;
  }
/* 내지 */
  .f4page-inner {
    background: #F7F2E8;
    border-left: 10px solid #E8E0CC;
    position: relative;
    overflow-y: auto;
    height: 100%;
  }
.f4page-lines {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      0deg, transparent, transparent 27px,
      rgba(180,160,120,0.12) 27px, rgba(180,160,120,0.12) 28px
    );
    pointer-events: none;
  }
.f4page-inner-content {
    position: relative;
    padding: 32px 24px 80px;
    z-index: 15;
  }
/* 외부 링크가 nav-zone에 가로채이지 않도록 */
  .f4page-inner-content a {
    position: relative;
    z-index: 20;
    pointer-events: auto;
  }
.f4page-layer-tag {
    font-size: 8px;
    letter-spacing: 0.25em;
    color: rgba(100,80,40,0.4);
    font-family: 'Courier New', monospace;
    border-bottom: 1px solid rgba(180,160,120,0.2);
    padding-bottom: 10px;
    margin-bottom: 16px;
  }
.f4page-layer-heading {
    font-family: 'Cormorant Garamond', Georgia, serif;

<script>
const SUPA_URL='https://cyhlotwdisjvoxvfkpnd.supabase.co';
const SUPA_KEY='sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
const supa=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{storageKey:'eungyo-auth'}});
const asset=(code,slot)=>`${SUPA_URL}/storage/v1/object/public/tour-assets/museum/${code}_${slot}.webp`;
const HALL_RATIO=941/1672;
const $=s=>document.querySelector(s);
console.log("%c[EG] bibliotheca v1.4 · 0807 벽감 편집기 · 그림 대기", "color:#c9a24a");

const qs=new URLSearchParams(location.search);
const CODE=qs.get('code')||'trinity';

/* 한 페이지 판짜기 — CSS 변수와 같은 값이어야 한다 */
const RACKS=3, PER_RACK=12, PER_PAGE=RACKS*PER_RACK;

let HALL=null, HALLS=null, SHELF=null, BOOKS=[], PAGE=0, UID=null, moved=false;

/* ?edit — 살롱지기만. 손님은 이 갈래를 통째로 안 탄다(천문대 0801 문법) */
const EDIT = new URLSearchParams(location.search).has('edit');
/* ⚠ 폴백이 곧 기본값이다 — 트리니티 실측값(0807). 새 서고는 여기서 출발해 손으로 맞춘다 */
const SHELF_DEFAULT = { L:28, T:33, W:44, H:39 };

/* 책등 그림 · 높이 — ⚠ museum.html · 치타델레(Floor4)와 **같은 해시**여야 한다.
   같은 책이 세 곳에서 다른 얼굴이면 그것은 다른 책으로 읽힌다. */
const BOOK_IMAGES=['book01','book02','book03','book04','book05','book06','book07','book08','book09','book10'];
function bookImg(answer){
  let h=0; for(const c of String(answer)) h=(h*31+c.charCodeAt(0))&0xfffff;
  return BOOK_IMAGES[h % BOOK_IMAGES.length]+'.webp';
}
/* ⚠ 책등에 설 수 있는 길이 — 넘치면 줄인다(0807).
   answer는 「퀴즈 정답」이지 「책 이름」이 아니다. 그래서 이따금 문장이 통째로 온다
   (0807 실측: 248권 중 29자짜리 한 건 — 시시포스 문제의 답이 통째로 책등이 됐다).
   ⭐ 13자로 둔 근거(0807 실측): 248권 중 **244권이 12자 이하**다. 13자로 끊으면
     「차라투스트라는이렇게말했다」(13자)까지 살고, 그 위 넷만 줄어든다.
     ⚠ 첫판은 20자였는데 화면에서 두 줄로 퍼져 서가가 답답해졌다 — 소로 지적.
       세로쓰기는 한 줄에 열서넛이 한계다. 넘으면 두 줄이 되어 책등 폭을 다 먹는다.
   ⚠ 자르되 감추지 않는다 — 감싸개 title에 전체가 있어 올리면 다 보인다. */
const SPINE_MAX = 13;
const shortTitle = t => {
  const s = String(t ?? '');
  return s.length > SPINE_MAX ? s.slice(0, SPINE_MAX - 1) + '…' : s;
};

/* 키 변주 — 획일하면 서가가 아니라 색종이 띠가 된다(콜레주 0722 수술) */
function bookScale(answer){
  let h=0; for(const c of String(answer)) h=(h*17+c.charCodeAt(0))&0xfffff;
  const s=[.88,.92,.96,1,.94,.90,.98,.86,1,.93];
  return s[h % s.length];
}

/* ── 시각 — egSky 한 벌. 없으면 낮 (함정 AF: 물러날 때는 소리를 낸다) ── */
function phase(){
  try{
    if(window.egSky && egSky.phase) return egSky.phase();
    console.warn('[EG] eg_sky.js가 없습니다 — 시각 판정이 낮으로 고정됩니다');
    return 'd';
  }catch(e){ console.warn('[EG] phase 실패:', e); return 'd'; }
}
function kstDay(){ return Math.floor((Date.now() + 9*3600*1000) / 86400000); }

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>`${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}`;
const md =d=>`${d.getMonth()+1}. ${d.getDate()}`;

function fail(msg){ $('#err').style.display='grid'; $('#err').innerHTML=msg; }

/* 그림 후보를 차례로 걸어 본다 — 저녁이 없으면 낮으로 */
function bgChain(el, cands, asImg, ready){
  const step=i=>{
    if(i>=cands.length) return;
    const im=new Image();
    im.onload=()=>{ asImg ? el.src=im.src : el.style.backgroundImage=`url(${im.src})`;
                    if(ready) ready(im); };
    im.onerror=()=>step(i+1);
    im.src=cands[i];
  };
  step(0);
}

async function boot(){
  if(window.top === window.self) document.body.classList.add('standalone');

  const { data:halls, error:he } = await supa.from('terra_pins')
    .select('code,name,city,active,meta').eq('kind','museum').order('sort');
  if(he || !halls || !halls.length) return fail('서고 목록을 불러오지 못했습니다.<br>잠시 뒤 다시 들러 주세요.');
  HALL  = halls.find(h=>h.code===CODE) || halls[0];
  HALLS = halls;

  /* 벽감 — 없으면 어림값. 폴백이 기본값이다(함정 AE) */
  SHELF = { ...SHELF_DEFAULT, ...((HALL.meta && HALL.meta.shelf_rect) || {}) };
  layoutShelf();

  const t=phase();
  bgChain($('#gate'), [asset(HALL.code,'gate_'+t), asset(HALL.code,'gate_d')], false);
  bgChain($('#hallImg'), [asset(HALL.code,'hall_'+t), asset(HALL.code,'hall_d')], true);

  $('#gName').textContent = HALL.name;
  $('#gCity').textContent = ((HALL.meta&&HALL.meta.city_en)||'') +
    ((HALL.meta&&HALL.meta.country)? ' · '+HALL.meta.country : '');
  $('#hName').textContent = (HALL.meta&&HALL.meta.name_en) || HALL.name;

  /* ⭐ 편집으로 들어오면 대문을 건너뛴다 — 일곱 채를 도는데 매번 문을 지날 순 없다.
     ⚠⚠ 0807 사고 — 곧장 들어갔더니 편집기가 안 떴다. 손님 경로는 대문에서 몇 초
       머무는 동안 실내 그림이 실리는데, 이 길은 그 참이 없다. 그림이 없으면
       #hallFit 높이가 0이라 카메라가 물러나고, 편집기는 그 onDone 에 매달려 있었다.
     → 그림이 실린 뒤에 들어간다. 그리고 카메라가 어찌 되든 편집기는 뜨게 안전망을 둔다. */
  if(EDIT){
    await loadBooks();
    const im=$('#hallImg');
    if(im.complete && im.naturalHeight) enterHall();
    else {
      im.addEventListener('load', enterHall, {once:true});
      im.addEventListener('error', enterHall, {once:true});   /* 그림이 없어도 편집은 열린다 */
      setTimeout(enterHall, 2500);                            /* 그래도 안 오면 */
    }
    setTimeout(setupEdit, 3200);       /* ⚠ 안전망 — 카메라가 헛돌아도 편집기는 뜬다 */
    return;
  }

  $('#gate').classList.add('on');
  $('#enterBtn').addEventListener('click', enterHall);
  $('#gate').addEventListener('click', e=>{ if(e.target.id==='gate') enterHall(); });

  await loadBooks();
}

function layoutShelf(){
  const s=$('#shelf'); if(!s) return;
  s.style.left=SHELF.L+'%'; s.style.top=SHELF.T+'%';
  s.style.width=SHELF.W+'%'; s.style.height=SHELF.H+'%';
}

/* ══════════════════════════════════════════════════════════
   벽감 좌표 편집기 (?edit · 살롱지기 전용) — 0807
   ⚠ 천문대 observatorium.html?edit 을 그대로 옮겼다. 저기는 원(cx·cy·r),
     여기는 사각형(L·T·W·H)이라 모서리 손잡이가 넷 붙는다.
   ⚠ terra_pins 쓰기는 소로 계정에만 열려 있다(RLS). 남이 열어도 저장이 안 된다.
   ⭐ 편집 중에도 책이 선 채로 따라 움직인다 — 몰딩을 넘는지는 책을 세워 봐야 안다.
   ══════════════════════════════════════════════════════════ */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

let edOn = false;
async function setupEdit(){
  if(edOn) return; edOn = true;        /* ⚠ 안전망과 onDone 이 겹쳐 두 번 불린다 */
  const { data:{ user } } = await supa.auth.getUser();
  if(!user){
    /* ⚠ 조용히 물러나지 않는다 — 왜 안 열렸는지 화면이 말한다(함정 AF) */
    edOn = false;
    $('#ed').classList.add('on');
    $('#ed').innerHTML = '<h3>SHELF · 벽감 자리</h3>'
      + '<div class="tip" style="margin:0">편집은 살롱지기 로그인 뒤에 열립니다.<br>'
      + '은교살롱에 로그인한 뒤 이 주소로 다시 들러 주십시오.</div>';
    return;
  }

  $('#shelf').classList.add('edit');
  $('#ed').classList.add('on');
  $('#pager').classList.remove('on');      /* 편집 중에는 넘김을 감춘다 */

  /* 모서리 손잡이 넷 — 서가를 지울 때 함께 지워지지 않게 따로 붙인다 */
  ['tl','tr','bl','br'].forEach(k=>{
    const h=document.createElement('div');
    h.className='hdl '+k; h.dataset.k=k;
    $('#shelf').appendChild(h);
  });

  /* 일곱 채를 한 화면에서 돈다 */
  $('#edPick').innerHTML = (HALLS||[]).map(h=>
    `<option value="${esc(h.code)}"${h.code===HALL.code?' selected':''}>`
    + `${esc(h.name)}${h.active?'':' (잠듦)'}</option>`).join('');
  $('#edPick').onchange = e => {
    const u=new URL(location.href);
    u.searchParams.set('code', e.target.value); u.searchParams.set('edit','1');
    location.href=u.toString();
  };

  const box=$('#shelf');
  let drag=null;
  box.addEventListener('pointerdown', e=>{
    e.preventDefault(); e.stopPropagation();
    const fit=$('#hallFit').getBoundingClientRect();
    const k=e.target && e.target.dataset ? e.target.dataset.k : null;
    box.setPointerCapture(e.pointerId);
    if(!k) box.classList.add('grab');
    drag={ fit, k,
      dx:(e.clientX-fit.left)/fit.width*100 - SHELF.L,
      dy:(e.clientY-fit.top)/fit.height*100 - SHELF.T,
      o:{...SHELF} };
  });
  box.addEventListener('pointermove', e=>{
    if(!drag) return;
    const x=(e.clientX-drag.fit.left)/drag.fit.width*100;
    const y=(e.clientY-drag.fit.top)/drag.fit.height*100;
    const o=drag.o;
    if(!drag.k){                                   /* 통째로 옮기기 */
      SHELF.L=clamp(x-drag.dx, 0, 100-SHELF.W);
      SHELF.T=clamp(y-drag.dy, 0, 100-SHELF.H);
    }else{                                          /* 모서리로 크기 바꾸기 */
      const R=o.L+o.W, B=o.T+o.H;
      if(drag.k==='tl'){ SHELF.L=clamp(x,0,R-4); SHELF.W=R-SHELF.L;
                         SHELF.T=clamp(y,0,B-4); SHELF.H=B-SHELF.T; }
      if(drag.k==='tr'){ SHELF.W=clamp(x-o.L,4,100-o.L);
                         SHELF.T=clamp(y,0,B-4); SHELF.H=B-SHELF.T; }
      if(drag.k==='bl'){ SHELF.L=clamp(x,0,R-4); SHELF.W=R-SHELF.L;
                         SHELF.H=clamp(y-o.T,4,100-o.T); }
      if(drag.k==='br'){ SHELF.W=clamp(x-o.L,4,100-o.L);
                         SHELF.H=clamp(y-o.T,4,100-o.T); }
    }
    layoutShelf(); edRead();
  });
  const drop=()=>{ drag=null; box.classList.remove('grab'); };
  box.addEventListener('pointerup', drop);
  box.addEventListener('pointercancel', drop);

  /* 화살표 미세조정 — 손으로 못 잡는 0.2% */
  addEventListener('keydown', e=>{
    if(!EDIT) return;
    const k=e.key, st=0.2;
    if(e.shiftKey){
      if(k==='ArrowRight')      SHELF.W=clamp(SHELF.W+st,4,100-SHELF.L);
      else if(k==='ArrowLeft')  SHELF.W=clamp(SHELF.W-st,4,100-SHELF.L);
      else if(k==='ArrowDown')  SHELF.H=clamp(SHELF.H+st,4,100-SHELF.T);
      else if(k==='ArrowUp')    SHELF.H=clamp(SHELF.H-st,4,100-SHELF.T);
      else return;
    }else{
      if(k==='ArrowLeft')       SHELF.L=clamp(SHELF.L-st,0,100-SHELF.W);
      else if(k==='ArrowRight') SHELF.L=clamp(SHELF.L+st,0,100-SHELF.W);
      else if(k==='ArrowUp')    SHELF.T=clamp(SHELF.T-st,0,100-SHELF.H);
      else if(k==='ArrowDown')  SHELF.T=clamp(SHELF.T+st,0,100-SHELF.H);
      else return;
    }
    e.preventDefault();
    ['L','T','W','H'].forEach(q=> SHELF[q]=+SHELF[q].toFixed(2));
    layoutShelf(); edRead();
  });
  edRead();
}
function edRead(){
  $('#edL').textContent=SHELF.L.toFixed(1);
  $('#edT').textContent=SHELF.T.toFixed(1);
  $('#edW').textContent=SHELF.W.toFixed(1);
  $('#edH').textContent=SHELF.H.toFixed(1);
}
async function edSave(){
  const rect={ L:+SHELF.L.toFixed(2), T:+SHELF.T.toFixed(2),
               W:+SHELF.W.toFixed(2), H:+SHELF.H.toFixed(2) };
  const meta={ ...(HALL.meta||{}), shelf_rect:rect };
  const { error } = await supa.from('terra_pins').update({meta})
    .eq('kind','museum').eq('code',HALL.code);
  if(error){ edSay('저장 실패 — '+esc(error.message), true); return; }
  /* ⚠ 「잘 됐겠지」 금지 — 쓰고 나서 되읽어 눈으로 본다 */
  const { data:back } = await supa.from('terra_pins')
    .select('meta').eq('kind','museum').eq('code',HALL.code).single();
  const got = back && back.meta && back.meta.shelf_rect;
  if(!got || got.L!==rect.L || got.T!==rect.T || got.W!==rect.W || got.H!==rect.H){
    edSay('되읽으니 값이 다릅니다', true); return; }
  HALL.meta=meta;
  edSay(`${esc(HALL.name)} · ${rect.L} / ${rect.T} / ${rect.W} / ${rect.H} 저장 ✔`);
}
function edSay(m, bad){
  const t=$('#edSay') || (()=>{ const d=document.createElement('div');
    d.id='edSay'; $('#ed').appendChild(d); return d; })();
  t.style.color = bad ? 'rgba(233,180,140,.9)' : 'rgba(180,214,170,.9)';
  t.innerHTML=m;
}
function edReset(){ SHELF={...SHELF_DEFAULT}; layoutShelf(); edRead(); }
function edTry(){
  $('#shelf').classList.remove('edit'); $('#ed').classList.remove('on');
  $('#shelf').querySelectorAll('.hdl').forEach(h=>h.remove());
  paint();                       /* 넘김을 되살린다 */
}

/* ── 내가 만난 책 ──────────────────────────────────────────
   ⭐ 같은 책을 여러 번 풀어도 한 권이다. **처음 만난 날**이 그 책의 자리를 정한다.
     나중 만남으로 순서가 바뀌면 서가가 기록이 아니라 최근 목록이 된다.
   ⚠ 칼럼은 uid다(user_id 아님) — museum.html 실측. */
/* ⚠⚠ 0807 — 소로 서가에 「O」 한 권, 「X」 한 권이 서 있었다.
   OX는 책 한 권을 만난 것이 아니라 사실 하나를 확인한 것이므로 서가에 안 세운다.

   ⭐ 이것은 **셋째 겹**이다. 앞의 두 겹이 이미 막는다 —
     ① game_core.js logQuizToMuseum() 이 안 보낸다
     ② DB 트리거 trg_quiz_log_reject_ox 가 조용히 버린다 (근원 · 어느 화면이든)
     여기 남겨 두는 까닭: 트리거가 서기 전에 쌓인 옛 행이 언젠가 되살아나도 안 서게.

   ⚠ seed_id 끝의 -OX 는 **믿을 수 없다.** 실측 — OX 문항 65개 중 seed가 -OX로
     끝나는 것은 56개뿐이다(topic-비틀스-1 · 카프카 처럼 이름만 있는 것이 아홉).
     진짜 근거는 questions.question_type='ox' 이고, 그것은 트리거가 본다.
     화면은 quiz_log만 읽으므로 여기서는 answer로 가른다 — 실측 65/65가 걸린다. */
function isOX(r){
  const a=(r.answer||'').trim();
  if(a==='O' || a==='X' || a==='o' || a==='x') return true;
  return /(-|_)OX$/i.test(r.seed_id||'');   /* 보조 — 놓치는 아홉은 위 두 겹이 잡는다 */
}

async function loadBooks(){
  const { data:{ user } } = await supa.auth.getUser();
  if(!user){ BOOKS=[]; paint(); return; }
  UID = user.id;

  const { data, error } = await supa.from('quiz_log')
    .select('answer,category,created_at,seed_id').eq('uid', UID).order('created_at');
  if(error){ console.warn('[EG] quiz_log를 못 읽었습니다:', error.message); BOOKS=[]; paint(); return; }

  const first = new Map();
  (data||[]).forEach(r=>{
    if(!r.answer) return;
    if(isOX(r)) return;                 /* ⚠ 0807 — 「O」·「X」가 책으로 서 있었다 */
    if(!first.has(r.answer)) first.set(r.answer,
      { answer:r.answer, category:r.category, at:new Date(r.created_at), seed:r.seed_id || '' });
  });
  BOOKS = [...first.values()];          /* created_at 오름차순 그대로 — 만난 순서 */
  PAGE = 0;                             /* 0 = 가장 최근 묶음 */
  paint();
}

/* 페이지 0 = 최신 36권. 뒤로 갈수록 과거.
   ⚠ 마지막(가장 오래된) 페이지만 36권이 안 될 수 있다 — 그쪽을 덜 채운다.
     최신 쪽을 덜 채우면 새 책이 들어올 때마다 전 페이지가 밀린다. */
function pageCount(){ return Math.max(1, Math.ceil(BOOKS.length / PER_PAGE)); }
function pageBooks(p){
  const end = BOOKS.length - p*PER_PAGE;
  return BOOKS.slice(Math.max(0, end-PER_PAGE), Math.max(0, end));
}

function paint(){
  const box=$('#shelf');
  const list=pageBooks(PAGE);
  $('#empty').style.display = BOOKS.length ? 'none' : 'block';

  const racks=[];
  for(let r=0; r<RACKS; r++){
    const seg=list.slice(r*PER_RACK, (r+1)*PER_RACK);
    if(!seg.length){ racks.push('<div class="rack"></div>'); continue; }
    const spines=seg.map((b,i)=>
      `<div class="bk" data-i="${r*PER_RACK+i}" title="${esc(b.answer)}"
            style="height:${(94*bookScale(b.answer)).toFixed(1)}%">
         <img class="spine" src="${bookImg(b.answer)}" alt="${esc(b.answer)}" loading="lazy">
         <span class="bkt">${esc(shortTitle(b.answer))}</span>
       </div>`).join('');
    /* 널 각인 — 그 단의 기간. 페이지 번호가 아니라 시간이 말한다 */
    const a=seg[0].at, z=seg[seg.length-1].at;
    const when = (a.getFullYear()===z.getFullYear())
      ? `${ymd(a)} — ${md(z)}` : `${ymd(a)} — ${ymd(z)}`;
    racks.push(
      `<div class="rack"><div class="row">${spines}</div>
        <div class="plank"><span class="pl-when">${esc(when)}</span>
        <span class="pl-n">${seg.length}</span></div></div>`);
  }
  box.innerHTML = racks.join('');
  /* ⚠ innerHTML로 갈아 끼우면 모서리 손잡이가 함께 날아간다 — 편집 중이면 되심는다 */
  if (box.classList.contains('edit')){
    ['tl','tr','bl','br'].forEach(k=>{
      const h=document.createElement('div'); h.className='hdl '+k; h.dataset.k=k;
      box.appendChild(h);
    });
  }
  box.querySelectorAll('.bk').forEach(el=>
    el.addEventListener('click', ()=>openCard(list[+el.dataset.i])));

  /* 머리 · 페이저 */
  const N=pageCount();
  $('#hSum').textContent = BOOKS.length
    ? `${BOOKS.length}권${N>1 ? ` · ${N}쪽 가운데 ${N-PAGE}쪽` : ''}` : '';
  const pg=$('#pager');
  pg.classList.toggle('on', N>1 && !$('#shelf').classList.contains('edit'));
  if(N>1){
    const a=list[0], z=list[list.length-1];
    $('#pgWhen').innerHTML = a && z
      ? `${esc(ymd(a.at))} — ${esc(ymd(z.at))}<b>${list.length}권</b>` : '';
    $('#pgPrev').disabled = (PAGE >= N-1);      /* 더 예전이 없다 */
    $('#pgNext').disabled = (PAGE <= 0);        /* 이미 최신이다 */
  }
}

function turn(d){
  const N=pageCount();
  const n=Math.min(Math.max(PAGE+d, 0), N-1);
  if(n===PAGE) return;
  PAGE=n; paint();
  if(typeof playPageSound==='function') playPageSound();   /* 사그락 */
}

/* ── 책 카드 ─────────────────────────────────────────────
   ⭐ 0807 — 책등을 누르면 그 책의 4겹이 열린다.
     서가는 「무엇을 만났는가」이고 4겹은 「그때 무엇을 알았는가」다.
   ⚠ 4겹은 quiz_log에 없다. seed_id로 questions에 붙는다 — 실측 270종 중 258종이 붙었다.
     붙는 것은 전부 4겹이 차 있고, 못 붙는 열두 종은 옛 문제라 seed가 갈렸다.
   ⚠ 한 answer에 seed가 여럿인 것이 열 종 있다(「간디」가 톨스토이 두 문제에서 나온다).
     **처음 만난 그 문제**의 4겹을 쓴다 — 서가 순서를 정하는 기준과 같아야 한다.
   ⭐ 열 때 한 건만 받아 온다. 258종을 미리 받으면 문 여는 데만 몇 초가 걸린다. */
function openCard(b){
  if(!b || (EDIT && $('#shelf').classList.contains('edit'))) return;
  f4OpenBook(b);          /* 책등을 누르면 곧장 표지가 선다 — 중간 카드는 없다 */
}


addEventListener('keydown', e=>{
  const reading = document.getElementById('f4bookModalOverlay').classList.contains('open');
  if(e.key==='Escape'){ if(reading) f4CloseBook(); return; }
  /* ⚠ 책을 읽는 중에는 화살표가 **책장**을 넘긴다. 서가가 아니다.
     둘이 같은 손잡이를 나눠 쓰면 읽다가 서가가 통째로 바뀐다. */
  if(reading){
    if(e.key==='ArrowLeft')  f4TurnPage(-1);
    if(e.key==='ArrowRight') f4TurnPage(1);
    return;
  }
  if(e.key==='ArrowLeft')  turn(1);
  if(e.key==='ArrowRight') turn(-1);
});

/* ── 도장 — 알베르게 원칙(몸통은 곳의 얼굴, 각인은 그날의 것) ──
   ⚠ 뮤세움 원판은 아직 하나도 안 구워졌다. 안 구운 도장은 그냥 없으므로(결정문 30호)
     지금은 아무 일도 안 일어난다. 원판이 서는 날 코드 수정 없이 살아난다.
   ⭐ 각인은 「그 책 제목」이다(알베르게 1호 표). 오늘 꽂은 책이 없으면 곳만 남는다. */
function stampHere(){
  if(!window.EGStamp) return;
  const hs = HALLS || [];
  /* ⚠ 0808 검거 — 여기 'peregrinatio'(르 그랑 투르)가 적혀 있었다. 미술관 배관을
     복제하면서 area만 안 고친 흔적. 당번 서고에 든 날은 opt.kind가 덮어써 티가 안 났으나
     당번이 아닌 서고에 들면 **르 그랑 투르 입국 도장**이 놓였다.
     뮤세움은 자기 우주를 갖고 있다 — area는 'musaeum'이고 입국 도장은 mus_intrare다. */
  const opt = { supa: supa, area:'musaeum', bottom: 96 };
  if(hs.length && HALL){
    const duty = hs[ ((kstDay() % hs.length) + hs.length) % hs.length ];
    if(duty && duty.code === HALL.code){
      /* ⚠ 0808 검거 — 'bib_'였다. 콘솔(admin_credencial GROW 표)은 'mus_'로 심는다.
         한쪽만 맞으면 셸이 못 찾은 채 조용히 물러나 아무도 못 알아챈다.
         우주 접두사는 입국·체류가 한 벌이다(mca_ · coc_ · obs_ 전부 그렇다). */
      opt.kind = 'mus_' + HALL.code;
      opt.subject = HALL.code;
      /* 오늘 꽂힌 책 — 없으면 각인 없이 곳의 얼굴만 찍힌다(폴백이 기본값 · 함정 AE)
         ⚠ answer가 정답 문장인 채로 오는 것이 있다(0807 딱지 · 29자 시시포스).
           책등은 shortTitle이 막지만 각인은 원문이 그대로 들어가고 있었다.
           각인은 도장 **밖**에 새겨져 잘릴 데가 없으므로 여기서 줄인다. */
      const today = new Date(); today.setHours(0,0,0,0);
      const mine = BOOKS.filter(b=>b.at>=today);
      if(mine.length) opt.inscription = inkTitle(mine[mine.length-1].answer);
    }
  }
  EGStamp.offer(opt);
}
/* 각인용 줄이기 — 책등(13자)보다는 넉넉하되 도장 밖에서 넘치지 않을 만큼 */
const INK_MAX = 20;
function inkTitle(s){
  s = String(s ?? '').trim();
  return s.length > INK_MAX ? s.slice(0, INK_MAX - 1) + '…' : s;
}

/* ── 입장 — 암전 뒤 카메라가 천장에서 내려와 벽감에 안착한다 ── */
function enterHall(){
  if(moved) return; moved=true;
  $('#fade').classList.add('on');
  setTimeout(()=>{
    $('#gate').classList.remove('on');
    $('#hall').classList.add('on');

    /* ⭐ 착지는 벽감 **전체**가 아니라 **맨 윗단**이다(0807 소로).
       카메라는 rect 한가운데를 화면 한가운데에 앉힌다. 벽감 전체를 주면
       중심이 2단 언저리라 최신 책이 화면 위로 잘린다 — 「약간 아래서 멈춤」이 그것이었다.
       한 단 반만 주면 중심이 위로 올라와 최신 단이 눈앞에 온다.
       ⚠ 서가 배치는 SHELF 그대로다. 여기서 바꾸는 것은 **카메라가 보는 곳**뿐이다. */
    const CAM={ L:SHELF.L, T:SHELF.T, W:SHELF.W, H:SHELF.H/RACKS*1.5 };
    const opts={ box:'#hall', fit:'#hallFit', ratio:HALL_RATIO, rect:CAM,
      onDone(){ if(EDIT) setupEdit(); else stampHere(); } };

    /* 폰(세로 화면)은 스크롤 길이가 0이라 카메라가 헛돈다 — 바로 앉힌다 */
    const scrollable = (innerWidth/innerHeight) >= HALL_RATIO;
    setTimeout(()=>$('#fade').classList.remove('on'), 60);
    if(scrollable && window.EGCamera) EGCamera.enter(opts);
    else if(window.EGCamera) EGCamera.settle(opts);
    else if(EDIT) setupEdit();
    else stampHere();          /* 카메라 부품이 안 실렸어도 도장은 놓는다(함정 AE) */
  }, 1050);
}
addEventListener('resize', ()=>{ if(window.EGCamera) EGCamera.relayout(); });


/* ══ 책 모달 — 분더카머 3층에서 옮겨온 부품 (f4 접두사 유지 · 위 CSS 머리말 참조) ══
   ⚠⚠ 손대지 말 것 셋 —
     ① f4 이름을 갈지 말 것. 세 집이 같은 이름을 써야 대조가 된다.
     ② supa 조회 한 줄 말고는 원본과 같아야 한다. 고칠 일이 생기면 세 집을 함께.
     ③ 표지는 책 이름의 해시로 팔레트·글꼴·판짜기를 뽑는다 — 같은 책은 늘 같은 표지다.
        무작위로 바꾸면 어제 본 책이 오늘 다른 얼굴로 선다(도장 시안 15호와 같은 정신). */
(function(){
  const F4_COVER_PALETTES = [
    { band:'linear-gradient(135deg,#1e3a6e,#2c5282)', bandTxt:'rgba(255,220,150,0.85)', bg:'linear-gradient(170deg,#f4f0e8,#ece6da)', accent:'#2c5282', title:'#1a1a2e', spine:'linear-gradient(to right,#1a2f50,#2c4a7a)', spineTxt:'rgba(255,220,150,0.85)' },
    { band:'linear-gradient(135deg,#c0452a,#a03820)', bandTxt:'rgba(255,230,180,0.85)', bg:'linear-gradient(170deg,#fdf6ee,#f5ebe0)', accent:'#a03820', title:'#2d1810', spine:'linear-gradient(to right,#7a3020,#c0502a)', spineTxt:'rgba(255,240,200,0.9)' },
    { band:'none', bandTxt:'', bg:'#f8f8f6', accent:'#222', title:'#111', spine:'#1a1a1a', spineTxt:'rgba(255,255,255,0.7)' },
    { band:'linear-gradient(135deg,#1a5c3a,#0e3d26)', bandTxt:'rgba(180,255,200,0.8)', bg:'linear-gradient(170deg,#f0f7f4,#e4f0ea)', accent:'#1a5c3a', title:'#0a2e1c', spine:'linear-gradient(to right,#0a3020,#1a5c3a)', spineTxt:'rgba(200,255,220,0.85)' },
    { band:'linear-gradient(135deg,#7a1a3a,#5a1228)', bandTxt:'rgba(255,200,220,0.85)', bg:'linear-gradient(170deg,#fdf0f4,#f5e4ec)', accent:'#8a2040', title:'#2d0818', spine:'linear-gradient(to right,#4a0820,#8a2040)', spineTxt:'rgba(255,200,220,0.85)' },
    { band:'linear-gradient(135deg,#3d2e00,#c9a84c,#3d2e00)', bandTxt:'rgba(255,240,180,0.9)', bg:'linear-gradient(160deg,#fdfbf4,#f8f3e4,#f2ecd4)', accent:'#b08c28', title:'#1a1200', spine:'linear-gradient(to right,#1a1200,#3d2e00)', spineTxt:'rgba(220,185,80,0.9)' },
    { band:'linear-gradient(135deg,#0a1e38,#162d50)', bandTxt:'rgba(160,210,255,0.85)', bg:'linear-gradient(170deg,#f0f4f8,#e4ecf4)', accent:'#1a3a6e', title:'#0a1828', spine:'linear-gradient(to right,#06121e,#0a1e38)', spineTxt:'rgba(160,210,255,0.85)' },
    { band:'linear-gradient(135deg,#2a1a08,#5a3a18)', bandTxt:'rgba(220,190,120,0.9)', bg:'linear-gradient(170deg,#faf4e8,#f2e8d0)', accent:'#7a5020', title:'#2a1808', spine:'linear-gradient(to right,#1a1008,#3a2010)', spineTxt:'rgba(220,190,120,0.9)' },
    { band:'linear-gradient(135deg,#1a1030,#2e1a50)', bandTxt:'rgba(200,170,255,0.85)', bg:'linear-gradient(170deg,#f4f0fc,#ece4f8)', accent:'#5a30a0', title:'#1a0830', spine:'linear-gradient(to right,#0e0820,#1a1030)', spineTxt:'rgba(200,170,255,0.85)' },
    { band:'linear-gradient(135deg,#0a2818,#1a5030)', bandTxt:'rgba(150,240,180,0.85)', bg:'linear-gradient(170deg,#f0faf4,#e4f8ec)', accent:'#1a6040', title:'#081e10', spine:'linear-gradient(to right,#061408,#0a2818)', spineTxt:'rgba(150,240,180,0.85)' },
  ];
  const F4_COVER_TYPOS = [
    { font:"'Noto Serif KR',serif",     size:'1.6rem',  weight:'900', extra:'' },
    { font:"'Noto Sans KR',sans-serif", size:'1.55rem', weight:'900', extra:'' },
    { font:"'Noto Sans KR',sans-serif", size:'1.45rem', weight:'100', extra:'letter-spacing:0.08em' },
    { font:"'Cormorant Garamond',serif",size:'1.75rem', weight:'300', extra:'font-style:italic;letter-spacing:0.05em' },
    { font:"'Playfair Display',serif",  size:'1.5rem',  weight:'700', extra:'' },
  ];
  const F4_COVER_LAYOUTS = ['band_body', 'full_center', 'minimal'];
  function f4StrHash(s){ let h=0; for(let c of String(s)) h=(h*31+c.charCodeAt(0))&0xfffff; return h; }

  let f4CurrentPage = 0, f4TotalPages = 0, f4IsAnimating = false, f4CurrentBook = null, f4ModalInited = false;
  const f4PageAudio = new Audio('page_turn.mp3'); f4PageAudio.volume = 0.7;
  function f4PlaySound(){ try{ f4PageAudio.currentTime = 0; f4PageAudio.play().catch(()=>{}); }catch(e){} }

  // *별표* 강조 → 또렷한 볼드 산세리프 (뮤세움과 동일 규약)
  function f4RenderMarkdown(text){
    if(!text) return '';
    return String(text)
      .replace(/\*\*([^*\n]+?)\*\*/g, '<strong style="font-family:\'Noto Sans KR\',\'맑은 고딕\',sans-serif;font-weight:700;color:#2a1f08">$1</strong>')
      .replace(/\*([^*\n]+?)\*/g, '<strong style="font-family:\'Noto Sans KR\',\'맑은 고딕\',sans-serif;font-weight:600;color:#3a2a10">$1</strong>');
  }

  // ── 3D 표지 빌드 ──────────────────────────────
  function f4BuildCover(book){
    const h    = f4StrHash(book.answer);
    const pal  = F4_COVER_PALETTES[h % F4_COVER_PALETTES.length];
    const typo = F4_COVER_TYPOS[(h >> 4) % F4_COVER_TYPOS.length];
    const lay  = F4_COVER_LAYOUTS[(h >> 8) % F4_COVER_LAYOUTS.length];
    const { band, bandTxt, bg, accent, title: tc, spine, spineTxt } = pal;
    const { font, size, weight, extra } = typo;

    document.getElementById('f4coverSpine').style.background = spine;
    document.getElementById('f4coverSpineText').style.color = spineTxt;
    document.getElementById('f4coverSpineText').textContent = book.answer;

    const catLabel = book.category || '';
    const keyword  = book.keyword  || '';
    let html = '';

    if (lay === 'band_body' && band !== 'none') {
      const bandH = 64 + (h % 26);
      html = `
        <div style="display:flex;flex-direction:column;height:100%;background:${bg}">
          <div style="width:100%;height:${bandH}px;background:${band};position:relative;flex-shrink:0;overflow:hidden">
            <div style="position:absolute;bottom:8px;left:14px;right:14px;height:1px;background:linear-gradient(to right,transparent,${bandTxt.replace('0.85','0.45').replace('0.9','0.45')},transparent)"></div>
            <div style="position:absolute;bottom:16px;left:14px;font-family:'Cormorant Garamond',serif;font-size:0.56rem;letter-spacing:0.16em;color:${bandTxt};font-style:italic">${catLabel}</div>
          </div>
          <div style="flex:1;padding:12px 14px 10px;display:flex;flex-direction:column;justify-content:space-between">
            <div>
              <div style="font-size:0.44rem;letter-spacing:0.25em;color:${accent};font-weight:700;text-transform:uppercase;margin-bottom:6px">EG</div>
              <div style="font-family:${font};font-size:${size};font-weight:${weight};color:${tc};line-height:1.15;${extra}">${book.answer}</div>
              <div style="width:24px;height:1.5px;background:${accent};margin:8px 0;opacity:0.4"></div>
              <div style="font-family:'Cormorant Garamond',serif;font-size:0.55rem;color:${tc};font-style:italic;line-height:1.55;opacity:0.6">${keyword ? '"'+keyword+'"' : ''}</div>
            </div>
            <div style="border-top:1px solid ${accent}22;padding-top:8px;display:flex;justify-content:space-between;align-items:flex-end">
              <div style="font-family:'Cormorant Garamond',serif;font-size:0.44rem;color:${accent};font-style:italic;opacity:0.6">서가</div>
            </div>
          </div>
        </div>`;
    } else if (lay === 'full_center') {
      html = `
        <div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 14px;text-align:center;background:${bg};position:relative">
          <div style="font-size:0.42rem;letter-spacing:0.3em;color:${accent};font-weight:700;text-transform:uppercase;margin-bottom:6px">EG</div>
          <div style="font-size:1rem;color:${accent};letter-spacing:0.5em;margin:3px 0;opacity:0.2">— ✦ —</div>
          <div style="font-family:${font};font-size:${size};font-weight:${weight};color:${tc};line-height:1.15;${extra};margin:6px 0">${book.answer}</div>
          <div style="font-family:'Cormorant Garamond',serif;font-size:0.58rem;color:${accent};font-style:italic;margin-top:4px;letter-spacing:0.1em;opacity:0.7">${catLabel}</div>
          <div style="width:44px;height:1px;background:linear-gradient(to right,transparent,${accent},transparent);margin:10px auto;opacity:0.45"></div>
          <div style="font-family:'Cormorant Garamond',serif;font-size:0.52rem;color:${tc};font-style:italic;line-height:1.6;opacity:0.55">${keyword ? '"'+keyword+'"' : ''}</div>
          <div style="margin-top:auto;padding-top:10px;border-top:1px solid ${accent}22;width:100%">
            <div style="font-size:0.4rem;color:${accent};letter-spacing:0.2em;opacity:0.45">서가</div>
          </div>
        </div>`;
    } else {
      html = `
        <div style="width:100%;height:100%;display:flex;flex-direction:column;padding:20px 14px 12px;background:${bg};position:relative">
          <div style="font-size:0.42rem;letter-spacing:0.3em;color:${accent};opacity:0.55;text-transform:uppercase">EG</div>
          <div style="font-family:'Playfair Display',serif;font-size:2.8rem;font-weight:900;color:${accent};opacity:0.06;line-height:1;position:absolute;right:8px;top:8px">EG</div>
          <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
            <div style="font-family:${font};font-size:${size};font-weight:${weight};color:${tc};line-height:1.1;${extra}">${book.answer}</div>
            <div style="font-size:0.5rem;color:${accent};letter-spacing:0.12em;margin-top:5px;opacity:0.65">${catLabel}</div>
            <div style="width:100%;height:2px;background:${accent};margin:10px 0;opacity:0.45"></div>
            <div style="font-size:0.52rem;color:${tc};font-style:italic;line-height:1.6;opacity:0.52">${keyword ? '"'+keyword+'"' : ''}</div>
          </div>
          <div style="display:flex;justify-content:flex-end">
            <div style="font-size:0.4rem;color:${accent};letter-spacing:0.15em;opacity:0.4">서가</div>
          </div>
        </div>`;
    }
    document.getElementById('f4coverInner').innerHTML = html;
    document.getElementById('f4coverFaceFront').style.background = bg;
  }

  // ── 책 열기 (단건 조회 → 표지) ────────────────
  async function f4OpenBook(b){
    /* ⚠ 서가는 seed로, 분더카머는 seed_id로 부른다. 둘 다 받는다. */
    if(b && !b.seed_id && b.seed) b = Object.assign({}, b, { seed_id:b.seed });
    f4IsAnimating = false;
    const overlay = document.getElementById('f4bookModalOverlay');
    overlay.classList.add('open');                 // 즉시 화면 반응(배경 페이드)

    // questions 단건 조회로 4레이어·부제·큐레이션링크 획득
    const book = { answer:b.answer, category:b.category, keyword:'', library:{}, curation_links:null,
                   metAt: b.at ? ymd(b.at) : '' };            /* 만난 날 — 마지막 쪽에 선다 */
    try{
      /* ⚠ 분더카머는 sbFetch(생 REST)를 쓰지만 이 집은 supabase-js(supa)를 쓴다.
           빌려온 코드에서 밖을 부르는 곳은 여기 하나뿐이었다(담 넘기 검사 실측). */
      const { data:rows } = await supa.from('questions')
        .select('answer,keyword,category,library,curation_links')
        .eq('seed_id', b.seed_id || b.seed || '').limit(1);
      if(rows && rows[0]){
        const q = rows[0];
        book.keyword = q.keyword || '';
        book.library = q.library || {};
        book.curation_links = q.curation_links || null;
        if(q.category) book.category = q.category;
      }
    }catch(e){ console.warn('[F4] library 조회 실패', e); }
    f4CurrentBook = book;

    f4BuildCover(book);
    document.getElementById('f4coverScene').style.visibility = 'visible';
    document.getElementById('f4coverScene').style.pointerEvents = 'auto';
    document.getElementById('f4bookModal').classList.remove('visible');
    document.getElementById('f4coverShadow').style.opacity = '1';
    setTimeout(()=> overlay.classList.add('bg-light'), 50);
    f4AttachTilt();
  }

  function f4AttachTilt(){
    const scene  = document.getElementById('f4coverScene');
    const book3d = document.getElementById('f4coverBook3D');
    scene.onmousemove = e => {
      if(f4IsAnimating) return;
      const r = scene.getBoundingClientRect();
      const dx = (e.clientX - (r.left + r.width/2))  / (r.width/2);
      const dy = (e.clientY - (r.top  + r.height/2)) / (r.height/2);
      book3d.style.transform = `rotateY(${-26 + dx*14}deg) rotateX(${4 - dy*8}deg)`;
      book3d.style.transition = 'transform 0.06s linear';
    };
    scene.onmouseleave = () => {
      if(f4IsAnimating) return;
      book3d.style.transform = 'rotateY(-26deg) rotateX(4deg)';
      book3d.style.transition = 'transform 0.5s cubic-bezier(0.23,1,0.32,1)';
    };
  }

  // ── 표지 클릭 → 내부 진입 (줌인) ──────────────
  function f4EnterBook(){
    if(f4IsAnimating) return;
    f4IsAnimating = true;
    const book3d = document.getElementById('f4coverBook3D');
    const shadow = document.getElementById('f4coverShadow');
    book3d.style.transition = 'transform 0.48s cubic-bezier(0.23,1,0.32,1)';
    book3d.style.transform  = 'rotateY(0deg) rotateX(0deg)';
    shadow.style.opacity    = '0';
    setTimeout(()=>{
      book3d.style.transition = 'transform 1.0s cubic-bezier(0.25,0,0.2,1), opacity 0.55s ease 0.45s';
      book3d.style.transform  = 'rotateY(0deg) rotateX(0deg) scale(3.8)';
      book3d.style.opacity    = '0';
    }, 450);
    setTimeout(()=>{
      document.getElementById('f4coverScene').style.visibility = 'hidden';
      document.getElementById('f4coverScene').style.pointerEvents = 'none';
      // 표지 리셋(다음 열기 대비)
      book3d.style.transition = 'none';
      book3d.style.transform  = 'rotateY(-26deg) rotateX(4deg)';
      book3d.style.opacity    = '1';
      f4ShowInnerPages();
      f4IsAnimating = false;
    }, 1100);
  }

  function f4ShowInnerPages(){
    const book = f4CurrentBook;
    f4CurrentPage = 0;
    const lib = book.library || {};
    const pages = f4BuildPages(book, lib);
    if(pages.length === 0){
      pages.push(f4MakeInnerPage('EG', book.answer, '아직 해설이 준비되지 않았습니다.', 1));
      pages.push(f4MakeLastPage(book, 2));
    }
    f4TotalPages = pages.length;

    const pagesEl = document.getElementById('f4bookPages');
    const navEl = pagesEl.querySelector('.f4book-nav');
    pagesEl.innerHTML = '';
    if(navEl) pagesEl.appendChild(navEl);

    pages.forEach((p, i) => {
      p.style.display       = 'flex';
      p.style.flexDirection = 'column';
      p.style.width         = '100%';
      p.style.height        = '460px';
      p.style.position      = 'absolute';
      p.style.top           = '0';
      p.style.left          = '0';
      p.style.right         = '0';
      p.style.zIndex        = i === 0 ? '12' : '1';
      p.style.transform     = i === 0 ? 'translateX(0)' : 'translateX(100%)';
      p.style.transition    = 'none';
      if(p.classList.contains('f4page-inner')){
        p.style.overflowX = 'hidden';
        p.style.overflowY = 'auto';
        p.style.webkitOverflowScrolling = 'touch';
      } else {
        p.style.overflow = 'hidden';
      }
      p.addEventListener('click', (ev) => {
        if(ev.target.closest('a, button, [data-no-flip]')) return;
        const rect = p.getBoundingClientRect();
        const x = ev.clientX - rect.left;
        if(x < rect.width * 0.35) f4TurnPage(-1);
        else if(x > rect.width * 0.65) f4TurnPage(1);
      });
      pagesEl.appendChild(p);
    });

    f4RenderDots();
    f4UpdateNavZones();

    const modal = document.getElementById('f4bookModal');
    modal.classList.add('visible');
    modal.style.visibility = 'visible';
    modal.style.opacity = '0';
    const vw = window.innerWidth, vh = window.innerHeight;
    modal.style.top  = Math.round((vh - 520) / 2) + 'px';
    modal.style.left = Math.round((vw - 340) / 2) + 'px';
    modal.style.transform = 'scale(0.96)';
    modal.style.transition = 'none';
    modal.getBoundingClientRect();
    modal.style.transition = 'opacity 0.38s ease, transform 0.38s ease';
    setTimeout(()=>{
      modal.style.opacity = '1';
      modal.style.transform = 'scale(1)';
      modal.style.pointerEvents = 'all';
    }, 30);
  }

  // ── 페이지 넘기기 (애플북스 슬라이드) ──────────
  function f4TurnPage(dir){
    if(f4IsAnimating) return;
    const next = f4CurrentPage + dir;
    if(next < 0 || next >= f4TotalPages) return;
    f4IsAnimating = true;
    f4PlaySound();
    const pagesEl  = document.getElementById('f4bookPages');
    const allPages = pagesEl.querySelectorAll('.f4book-page-view');
    const outPage  = allPages[f4CurrentPage];
    const inPage   = allPages[next];
    if(dir > 0){
      inPage.style.zIndex = '11';  inPage.style.transform = 'translateX(0)';  inPage.style.transition = 'none';
      outPage.style.zIndex = '12'; outPage.style.transition = 'none';         outPage.style.transform = 'translateX(0)';
      requestAnimationFrame(()=>{
        outPage.style.transition = 'transform 0.48s cubic-bezier(0.32,0.72,0,1)';
        outPage.style.transform  = 'translateX(-100%)';
      });
    } else {
      outPage.style.zIndex = '11'; outPage.style.transform = 'translateX(0)';  outPage.style.transition = 'none';
      inPage.style.zIndex = '13';  inPage.style.transition = 'none';           inPage.style.transform = 'translateX(100%)';
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
        inPage.style.transition = 'transform 0.48s cubic-bezier(0.32,0.72,0,1)';
        inPage.style.transform  = 'translateX(0)';
      }); });
    }
    setTimeout(()=>{
      f4CurrentPage = next;
      inPage.scrollTop = 0;
      inPage.style.zIndex  = '12';
      outPage.style.zIndex = '1';
      f4RenderDots();
      f4UpdateNavZones();
      f4IsAnimating = false;
    }, 490);
  }

  function f4UpdateNavZones(){
    const l = document.getElementById('f4navLeft');
    const r = document.getElementById('f4navRight');
    if(l) l.style.display = f4CurrentPage === 0              ? 'none' : 'flex';
    if(r) r.style.display = f4CurrentPage === f4TotalPages-1 ? 'none' : 'flex';
  }

  function f4RenderDots(){
    const dots = document.getElementById('f4bookDots');
    dots.innerHTML = '';
    for(let i = 0; i < f4TotalPages; i++){
      const dot = document.createElement('div');
      dot.className = 'f4book-page-dot' + (i === f4CurrentPage ? ' active' : '');
      dots.appendChild(dot);
    }
  }

  function f4CloseBook(){
    const overlay = document.getElementById('f4bookModalOverlay');
    document.getElementById('f4coverScene').style.visibility = 'visible';
    document.getElementById('f4coverScene').style.pointerEvents = 'auto';
    overlay.classList.remove('open', 'bg-light');
    const book3d = document.getElementById('f4coverBook3D');
    book3d.style.transition = 'none';
    book3d.style.transform  = 'rotateY(-26deg) rotateX(4deg)';
    book3d.style.opacity    = '1';
    document.getElementById('f4coverShadow').style.opacity = '1';
    const modal = document.getElementById('f4bookModal');
    modal.style.transition = 'opacity 0.38s ease, transform 0.38s ease';
    modal.style.opacity = '0';
    modal.style.transform = 'scale(0.96)';
    modal.style.pointerEvents = 'none';
    setTimeout(()=>{
      modal.style.visibility = 'hidden';
      modal.style.opacity = '0';
      modal.classList.remove('visible');
    }, 400);
    f4IsAnimating = false;
  }

  function f4OverlayClick(e){
    if(e.target === document.getElementById('f4bookModalOverlay')) f4CloseBook();
  }

  // ── 페이지 구성 (지식·사유·연결·큐레이션·마지막) ──
  function f4BuildPages(book, lib){
    const pages = [];
    if(lib.knowledge)  pages.push(f4MakeInnerPage('LAYER 1 · 지식', '알고 이해하기', lib.knowledge, pages.length + 1));
    if(lib.thought)    pages.push(f4MakeInnerPage('LAYER 2 · 사유', '생각하고 느끼기', lib.thought, pages.length + 1));
    if(lib.connection) pages.push(f4MakeInnerPage('LAYER 3 · 연결', '삶과 이어보기', lib.connection, pages.length + 1));
    if(lib.curation)        pages.push(f4MakeCurationPage(lib.curation, pages.length + 1, book.curation_links));
    else if(book.curation_links) pages.push(f4MakeCurationPage('', pages.length + 1, book.curation_links));
    pages.push(f4MakeLastPage(book, pages.length + 1));
    return pages;
  }

  function f4MakeInnerPage(tag, heading, body, num){
    const div = document.createElement('div');
    div.className = 'f4book-page-view f4page-inner';
    div.innerHTML = `
      <div class="f4page-lines"></div>
      <div class="f4page-inner-content">
        <div class="f4page-layer-tag">${tag}</div>
        <div class="f4page-layer-heading">${heading}</div>
        <div class="f4page-layer-body">${f4RenderMarkdown(body)}</div>
      </div>
      <div class="f4page-num-inner">${num}</div>
      <div class="f4page-corner"></div>`;
    return div;
  }

  function f4MakeCurationPage(curation, num, links){
    const div = document.createElement('div');
    div.className = 'f4book-page-view f4page-inner';
    const items = (curation || '').split('/').map(s => s.trim()).filter(Boolean);
    const itemsHtml = items.map(item => `
      <div style="padding:10px 0;border-bottom:1px solid rgba(180,160,120,0.15);font-size:13px;color:#3D2F10;font-family:'Noto Serif KR',serif;line-height:1.6">
        ${f4RenderMarkdown(item)}
      </div>`).join('');
    let linksHtml = '';
    if(links && (links.books || links.library_call_number || links.youtube_keywords)){
      linksHtml = f4RenderCurationLinks(links);
    }
    div.innerHTML = `
      <div class="f4page-lines"></div>
      <div class="f4page-inner-content">
        <div class="f4page-layer-tag">LAYER 4 · 큐레이션</div>
        <div class="f4page-layer-heading">더 깊이 들어가기</div>
        ${itemsHtml}
        ${linksHtml}
      </div>
      <div class="f4page-num-inner">${num}</div>
      <div class="f4page-corner"></div>`;
    return div;
  }

  // curation_links → HTML (책 찾기 / 도서관 청구기호 / 유튜브)
  function f4RenderCurationLinks(links){
    const sections = [];
    const linkStyle = "color:#8B6F2A;text-decoration:none;border-bottom:1px solid rgba(139,111,42,0.3);padding-bottom:1px";
    const stopProp = `onclick="event.stopPropagation()" ontouchstart="event.stopPropagation()"`;
    if(links.books && links.books.length > 0){
      const bookCards = links.books.map(b => {
        const title = b.title || '';
        const meta = [b.translator && `${b.translator} 옮김`, b.publisher].filter(Boolean).join(' · ');
        const parts = b.isbn ? [b.isbn] : [title, b.author, (b.translator || b.publisher)].filter(Boolean);
        const q = encodeURIComponent(parts.join(' '));
        const stores = [
          `<a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener" ${stopProp} style="${linkStyle}">책 찾기</a>`,
        ];
        const storesHtml = `<div style="margin-top:6px;font-size:11px;letter-spacing:0.05em">${stores.join(' · ')}</div>`;
        return `
          <div style="padding:10px 0;border-bottom:1px solid rgba(180,160,120,0.12);font-family:'Noto Serif KR',serif;">
            <div style="font-size:13px;color:#3D2F10;font-weight:500">${title}</div>
            ${meta ? `<div style="font-size:11px;color:rgba(80,60,30,0.6);margin-top:3px">${meta}</div>` : ''}
            ${storesHtml}
          </div>`;
      }).join('');
      sections.push(`
        <div style="margin-top:18px">
          <div style="font-size:10px;letter-spacing:0.18em;color:rgba(120,90,40,0.55);font-family:'Courier New',monospace;margin-bottom:6px">📖 책</div>
          ${bookCards}
        </div>`);
    }
    if(links.library_call_number){
      sections.push(`
        <div style="margin-top:18px">
          <div style="font-size:10px;letter-spacing:0.18em;color:rgba(120,90,40,0.55);font-family:'Courier New',monospace;margin-bottom:6px">🏛 도서관 청구기호</div>
          <div style="font-size:13px;color:#3D2F10;font-family:'Noto Serif KR',serif">${links.library_call_number}</div>
        </div>`);
    }
    if(links.youtube_keywords){
      const kw = encodeURIComponent(links.youtube_keywords);
      sections.push(`
        <div style="margin-top:18px">
          <div style="font-size:10px;letter-spacing:0.18em;color:rgba(120,90,40,0.55);font-family:'Courier New',monospace;margin-bottom:6px">▶ 영상</div>
          <a href="https://www.youtube.com/results?search_query=${kw}" target="_blank" rel="noopener" ${stopProp} style="${linkStyle};font-size:13px;font-family:'Noto Serif KR',serif">${links.youtube_keywords}</a>
        </div>`);
    }
    return sections.join('');
  }

  // 마지막 페이지 — 지성소로 돌아가기
  function f4MakeLastPage(book, num){
    const div = document.createElement('div');
    div.className = 'f4book-page-view f4page-philemon';
    div.innerHTML = `
      <div class="f4page-lines"></div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;">
        <div style="font-size:22px;margin-bottom:20px;opacity:0.4">✦</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:16px;color:#4a3820;margin-bottom:10px;letter-spacing:0.05em">${book.answer}</div>
        <div style="width:32px;height:1px;background:rgba(180,150,80,0.3);margin:12px auto"></div>
        <div style="font-size:11px;color:rgba(100,80,40,0.45);letter-spacing:0.18em;font-family:'Courier New',monospace;margin-bottom:24px">마지막 페이지입니다</div>
        <div style="font-size:10px;color:rgba(100,80,40,0.3);font-family:'Noto Serif KR',serif;line-height:1.9;margin-bottom:28px">이 책을 끝까지 읽었습니다.<br>${book.metAt ? book.metAt+' 에 만난 책입니다.' : '서가의 한 칸이 그만큼 깊어졌습니다.'}</div>
        <button class="f4-last-back" style="padding:8px 24px;border:1px solid rgba(180,150,80,0.3);border-radius:20px;background:rgba(201,168,76,0.07);color:rgba(160,120,50,0.8);font-size:11px;font-family:'Noto Serif KR',serif;letter-spacing:0.12em;cursor:pointer;transition:all 0.15s">서가로 돌아가기</button>
      </div>
      <div style="position:absolute;bottom:14px;right:24px;font-size:10px;color:rgba(100,80,40,0.25);font-family:'Courier New',monospace">${num}</div>`;
    const btn = div.querySelector('.f4-last-back');
    if(btn) btn.addEventListener('click', f4CloseBook);
    return div;
  }

  // ── 모달 이벤트 바인딩 (1회) ──────────────────
  function f4InitModal(){
    if(f4ModalInited) return;
    f4ModalInited = true;
    const overlay = document.getElementById('f4bookModalOverlay');
    document.getElementById('f4coverBook3D').addEventListener('click', f4EnterBook);
    overlay.addEventListener('click', f4OverlayClick);
    const closeBtn = document.querySelector('.f4book-close-btn');
    if(closeBtn) closeBtn.addEventListener('click', f4CloseBook);
    const l = document.getElementById('f4navLeft');
    const r = document.getElementById('f4navRight');
    if(l) l.addEventListener('click', ()=>f4TurnPage(-1));
    if(r) r.addEventListener('click', ()=>f4TurnPage(1));

    // 터치 스와이프 (실시간 드래그)
    let sx = 0, sy = 0, dragging = false, dragPage = null, onLink = false;
    overlay.addEventListener('touchstart', e => {
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; dragging = false;
      onLink = !!(e.target.closest && e.target.closest('a, button, [data-no-flip]'));
      const all = document.getElementById('f4bookPages').querySelectorAll('.f4book-page-view');
      dragPage = all[f4CurrentPage] || null;
    }, { passive:true });
    overlay.addEventListener('touchmove', e => {
      if(!dragPage || f4IsAnimating || onLink) return;
      const dx = e.touches[0].clientX - sx;
      const dy = e.touches[0].clientY - sy;
      if(!dragging && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) dragging = true;
      if(!dragging) return;
      if(dx < 0 && f4CurrentPage < f4TotalPages - 1){ dragPage.style.transition = 'none'; dragPage.style.transform = `translateX(${dx}px)`; }
      else if(dx > 0 && f4CurrentPage > 0){ dragPage.style.transition = 'none'; dragPage.style.transform = `translateX(${dx}px)`; }
    }, { passive:true });
    overlay.addEventListener('touchend', e => {
      if(onLink){ onLink = false; return; }
      if(!dragging || !dragPage) return;
      const dx = e.changedTouches[0].clientX - sx;
      const th = 60;
      if(dx < -th && f4CurrentPage < f4TotalPages - 1) f4TurnPage(1);
      else if(dx > th && f4CurrentPage > 0) f4TurnPage(-1);
      else { dragPage.style.transition = 'transform 0.32s cubic-bezier(0.23,1,0.32,1)'; dragPage.style.transform = 'translateX(0)'; }
      dragging = false; dragPage = null;
    }, { passive:true });
  }

  /* ⚠ 서가(블록 바깥)가 부르는 이름만 창구로 내준다 — 나머지는 안에 둔다.
     terra에서 세 번 사고가 난 「담 넘기」를 여기서 되풀이하지 않는다. */
  window.f4OpenBook  = f4OpenBook;
  window.f4CloseBook = f4CloseBook;
  window.f4TurnPage  = f4TurnPage;
  window.f4InitModal = f4InitModal;
})();

/* ══ 서고의 음악 ═══════════════════════════════════════════
   구 museum.html에서 그대로 옮겨 왔다 — 열두 곡, 들어올 때 한 곡이 뽑히고
   나갈 때까지 그 곡이 돈다. 곡을 늘리려면 BGM_N만 올리면 된다.

   ⚠⚠ 나갈 때 src=''로 비우지 않는다. 빈 문자열은 브라우저가 **페이지 주소로 풀어**
     없는 파일을 받으러 가고, 그 error가 한참 뒤에 울린다(0807 낭독에서 잡은 병).
     removeAttribute + load() 가 정석이다.

   ⭐⭐ 낭독이 흐르는 동안에는 물러선다(0807 소로). 죽지 않고 잦아든다 —
     손님이 켠 것이 방이 저 혼자 켠 것보다 앞선다. 낭독이 멎으면 되돌아온다.
   ⚠ 다만 손님이 🔇로 끈 것은 낭독이 끝나도 안 깨운다. 그건 손님의 뜻이고,
     되살리면 좀비가 된다.
   ⚠ terra는 방 안에서 소리가 나면 낭독을 물리는 그물을 쳐 두었다(2853행).
     그래서 <audio>에 data-eg-bgm 표식을 단다 — 그물이 이 표식을 보고 지나간다.
     표식이 없으면 서고에 들어서는 순간 해설이 뚝 끊긴다. ══ */
const BGM_N=12, BGM_FULL=0.18, BGM_DUCK=0.03;
const bgm=$('#bgm');
let bgmOn=false, bgmMuted=false, bgmFadeTimer=null;

function bgmInit(){
  if(EDIT) return;                    /* 좌표를 맞추는 중에는 음악을 안 튼다 */
  const n=String(Math.floor(Math.random()*BGM_N)+1).padStart(2,'0');
  bgm.src='muse_bgm_'+n+'.mp3';
  bgm.volume=BGM_FULL;
  $('#bgmBtn').classList.add('on');
  bgmPlay();
  /* 자동재생을 막는 브라우저가 있다 — 첫 손짓에 살아난다(구 뮤세움과 같은 안전망) */
  if(!bgmOn) addEventListener('click', function once(){ if(!bgmOn && !bgmMuted) bgmPlay(); }, {once:true});
}
function bgmPlay(){
  bgm.play().then(()=>{ bgmOn=true;  bgmPaint(); })
            .catch(()=>{ bgmOn=false; bgmPaint(); });
}
function bgmPaint(){ $('#bgmBtn').textContent = (bgmOn && !bgmMuted) ? '🎵' : '🔇'; }
function toggleBgm(){
  if(bgmOn){ bgm.pause(); bgmOn=false; bgmMuted=true; }
  else { bgmMuted=false; bgmPlay(); }
  bgmPaint();
}
/* 0.6초에 걸쳐 잦아들고, 같은 속도로 되돌아온다. 뚝 끊으면 낭독보다 더 거슬린다. */
function bgmFadeTo(v, ms){
  if(bgmFadeTimer) clearInterval(bgmFadeTimer);
  const from=bgm.volume, steps=Math.max(1, Math.round((ms||600)/50));
  let i=0;
  bgmFadeTimer=setInterval(()=>{
    i++;
    bgm.volume=Math.max(0, Math.min(1, from+(v-from)*i/steps));
    if(i>=steps){ clearInterval(bgmFadeTimer); bgmFadeTimer=null; }
  }, 50);
}
/* terra가 낭독의 사실을 내려보낸다(부모 → 자식 · voice-state). 여기서 만들지 않는다 —
   하나의 사실이 두 화면에 살면 어긋난다. */
addEventListener('message', e=>{
  const d=e && e.data;
  if(!d || d.eg!=='voice-state') return;
  bgmFadeTo(d.playing ? BGM_DUCK : BGM_FULL, 600);
});
/* 방을 떠날 때 — 소리를 놓아준다 */
function bgmRelease(){
  try{
    bgm.pause();
    bgm.removeAttribute('src');   /* ⚠ src='' 가 아니다 */
    bgm.load();
  }catch(e){}
  bgmOn=false;
}
addEventListener('pagehide', bgmRelease);

/* 종이 넘기는 소리 — 소로가 직접 녹음하신 사그락 소리(구 museum.html 주석).
   ⚠ new Audio()는 문서에 안 붙으므로 terra의 play 그물에 애초에 안 걸린다. */
const pageSnd=new Audio('page_turn.mp3');
pageSnd.volume=.55;
function playPageSound(){
  try{ pageSnd.currentTime=0; pageSnd.play().catch(()=>{}); }catch(e){}
}

function goBack(){ bgmRelease(); location.href='terra.html'; }

console.log('[EG] bibliotheca v1.8 · 0808 · 도장 area·접두사 검거(musaeum/mus_) · 각인 20자');
boot();
bgmInit();
f4InitModal();      /* 책 모달 손잡이 — 한 번만 묶는다 */
</script>
