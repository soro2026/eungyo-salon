<style>
/* ============================================================
 *  EG 전당(Palais) 셸 v0.4 — 0718 저녁
 *  3뷰: 대문(gate) → 헌사홀(hall) → 무대(stage)
 *  그림: Storage popup-assets/palais/{org}/{gate|hall|hall_wide|screen}_{m|d|e|n}.webp
 *  설정: palais_orgs (스크린 좌표·큐레이션·편지) — admin_palais.html에서 입고
 *  주소: palais.html?org=ildangbaek
 *  · 진입: 빛이 3초에 걸쳐 화면을 삼킴 / 홀→무대는 페이드아웃·인
 *  · 오늘의 한 편: 큐레이션 목록을 달력으로 하루 1편 순환
 * ============================================================ */

:root{
  --marble : #ece5d9;
  --bronze : #a67c3d;
  --bronze-lit : #d9b168;
  --lamp   : #f6e0a8;
  --void   : #0d0b08;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:var(--void);}
body{font-family:'Gowun Batang','Noto Serif KR',serif;color:var(--marble);-webkit-font-smoothing:antialiased;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
:focus-visible{outline:2px solid var(--bronze-lit);outline-offset:3px;}

.view{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity 1.1s ease;}
.view.on{opacity:1;pointer-events:auto;}

/* ═════════ 1. 대문 ═════════ */
#gate{cursor:pointer;z-index:10;}
#gateBg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  background-color:#1a1712;
  transition:background-image .6s ease;
}
.gate-hint{
  position:absolute;left:50%;bottom:clamp(26px,5vh,60px);transform:translateX(-50%);
  font-size:clamp(12px,1.3vw,15px);letter-spacing:.26em;text-indent:.26em;
  color:rgba(246,224,168,.0);text-shadow:0 1px 10px rgba(0,0,0,.5);
  animation:hintIn 2s 1.4s ease forwards;white-space:nowrap;
}
@keyframes hintIn{to{color:rgba(246,224,168,.82);}}

/* 진입 — 빛이 천천히 화면을 삼킨다 (3.2s) */
#flash{
  position:fixed;z-index:60;left:50%;top:58%;
  width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle,#fffdf4 0%,var(--lamp) 38%,rgba(246,224,168,0) 70%);
  transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;
}
#flash.go{animation:swallow 3.2s cubic-bezier(.42,0,.2,1) forwards;}
@keyframes swallow{
  0%  {transform:translate(-50%,-50%) scale(0);   opacity:0;}
  12% {opacity:.55;}
  38% {opacity:.9;}
  78% {transform:translate(-50%,-50%) scale(190); opacity:1;}
  100%{transform:translate(-50%,-50%) scale(280); opacity:0;}
}

/* ═════════ 2. 헌사홀 ═════════ */
#hall{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;cursor:pointer;z-index:9;}
#hall::-webkit-scrollbar{display:none;}
#camera{
  position:relative;width:100%;
  background-size:cover;background-position:center top;background-color:#141210;
}
.hall-hint{
  position:fixed;left:50%;bottom:clamp(22px,4vh,48px);transform:translateX(-50%);
  font-size:clamp(11px,1.15vw,14px);letter-spacing:.3em;text-indent:.3em;
  color:rgba(166,124,61,.0);white-space:nowrap;pointer-events:none;
  transition:color 1s ease;
}
#hall.on .hall-hint{color:rgba(166,124,61,.75);transition-delay:2.4s;}

/* ═════════ 3. 무대 ═════════ */
#stage{z-index:8;background:var(--void);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;}
#stage::-webkit-scrollbar{display:none;}
#stageFit{position:relative;margin:0 auto;}       /* 세로: 꽉 채움 / 가로: 폭 맞춤 + 상하 스크롤 */
#stageImg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;}

/* 영상 자리 — 그림 속 흰 스크린 면(%)에 고정 */
#play{
  position:absolute;
  left:14.6%; top:53.1%; width:71%; height:18.6%;
  cursor:pointer; overflow:hidden;
  background:transparent;
}
#play .veil{                                   /* 파사드: 흰 막 위 살포시 */
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.9em;
  background:linear-gradient(180deg, rgba(250,247,240,.0), rgba(240,234,222,.06));
  transition:background .5s ease;
}
#play:hover .veil{background:linear-gradient(180deg, rgba(250,247,240,.04), rgba(240,234,222,.12));}
.play-eyebrow{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(8px,1.9vmin,13px);letter-spacing:.5em;text-indent:.5em;
  color:rgba(120,96,52,.85);
}
.play-title{
  font-family:'Noto Serif KR',serif;font-weight:300;
  font-size:clamp(12px,2.6vmin,20px);line-height:1.55;text-align:center;
  color:#42392c;max-width:86%;
}
.play-ring{
  width:clamp(34px,7vmin,54px);aspect-ratio:1;border-radius:50%;
  border:1px solid rgba(120,96,52,.6);display:grid;place-items:center;
  transition:transform .4s ease,border-color .4s ease;
}
.play-ring::after{
  content:'';width:0;height:0;margin-left:3px;
  border-left:clamp(9px,1.8vmin,13px) solid rgba(120,96,52,.85);
  border-top:clamp(6px,1.1vmin,8px) solid transparent;
  border-bottom:clamp(6px,1.1vmin,8px) solid transparent;
}
#play:hover .play-ring{transform:scale(1.08);border-color:rgba(120,96,52,.95);}
#playerBox{position:absolute;inset:0;display:none;background:#000;}
#playerBox.on{display:block;}
#playerBox .mock{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  color:rgba(243,236,224,.6);font-size:clamp(10px,2vmin,14px);line-height:2;letter-spacing:.08em;
}
#playerBox .stop{color:var(--bronze-lit);border-bottom:1px solid rgba(217,177,104,.4);padding-bottom:2px;}

/* ═════════ 헌사홀 바닥 — 방명록 ═════════
   꽃을 놓고 한 줄 남긴다. 한 번에 한 사람, 제자리에서 조용히 갈린다. */
#guest{
  position:fixed;left:0;right:0;bottom:0;z-index:22;
  display:none;flex-direction:column;align-items:center;
  padding-bottom:clamp(10px,2vh,20px);
  pointer-events:none;
}
#hall.on ~ #guest{display:flex;}

/* 한 사람씩 제자리에서 교체 */
#guestFloat{
  position:relative;width:min(92vw,820px);height:clamp(56px,9vh,74px);
  display:grid;place-items:center;overflow:hidden;pointer-events:none;
}
.gf-line{
  grid-area:1/1;max-width:100%;text-align:center;
  font-size:clamp(12.5px,1.5vw,15px);letter-spacing:.02em;line-height:1.7;
  color:rgba(246,241,232,.97);
  /* 띠 없이 — 글자 뒤에만 아주 옅은 그늘을 겹쳐 낮·밤 모두 읽히게 */
  text-shadow:0 1px 2px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.6), 0 0 26px rgba(0,0,0,.45);
  opacity:0;transition:opacity .9s ease;
  padding:0 10px;
}
.gf-line.on{opacity:1;}
.gf-line b{color:var(--bronze-lit);font-weight:400;margin-right:.55em;}

/* 바닥 줄 — 놓인 꽃 + 버튼 */
#guestBar{
  display:flex;align-items:flex-end;gap:13px;pointer-events:auto;
  padding:7px 13px;border-radius:99px;
  background:rgba(6,5,4,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
#flowerRow{display:flex;align-items:flex-end;gap:3px;height:30px;}
#flowerRow img{height:30px;width:auto;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));}
#guestBtn{
  font-size:12px;letter-spacing:.18em;text-indent:.18em;white-space:nowrap;
  color:var(--bronze-lit);border:1px solid rgba(166,124,61,.45);
  border-radius:99px;padding:6px 15px;transition:.25s;
}
#guestBtn:hover{background:rgba(217,177,104,.14);border-color:var(--bronze-lit);}

/* 작성 패널 */
#guestForm{
  display:none;pointer-events:auto;width:min(92vw,540px);margin-bottom:10px;
  background:rgba(8,7,5,.92);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  border:1px solid rgba(166,124,61,.4);border-radius:12px;padding:16px 16px 14px;
}
#guestForm.on{display:block;}
.gfm-label{font-size:11px;letter-spacing:.16em;color:rgba(217,177,104,.75);margin-bottom:7px;}
.gfm-flowers{
  display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:11px;
}
.gfm-flowers button{
  aspect-ratio:1;border-radius:9px;border:1px solid transparent;
  display:grid;place-items:center;opacity:.45;transition:.2s;padding:3px;
  background:rgba(255,255,255,.03);
}
.gfm-flowers button:hover{opacity:.8;}
.gfm-flowers button.on{opacity:1;border-color:rgba(217,177,104,.7);background:rgba(217,177,104,.12);}
.gfm-flowers img{width:100%;height:100%;object-fit:contain;}
#guestForm input,#guestForm textarea{
  width:100%;background:rgba(38,34,28,.9);border:1px solid rgba(166,124,61,.3);
  border-radius:7px;color:var(--marble);padding:8px 11px;font:inherit;font-size:13px;
}
#guestForm textarea{resize:vertical;min-height:64px;line-height:1.7;margin-top:8px;}
#guestForm input:focus,#guestForm textarea:focus{outline:none;border-color:var(--bronze);}
.gfm-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;}
.gfm-msg{font-size:11.5px;color:rgba(236,229,217,.55);line-height:1.6;}
.gfm-send{
  font-size:12px;letter-spacing:.16em;color:#1a150d;background:var(--bronze);
  border-radius:99px;padding:7px 18px;white-space:nowrap;font-weight:700;
}
.gfm-send:hover{background:var(--bronze-lit);}

/* 뷰 사이 페이드 장막 */
#fader{
  position:fixed;inset:0;z-index:55;background:var(--void);
  opacity:0;pointer-events:none;transition:opacity 1.1s ease;
}
#fader.on{opacity:1;}


@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
</style>

<body>

<!-- 1. 대문 -->
<div id="gate" class="view on" role="button" tabindex="0" aria-label="전당에 들어가기">
  <div id="gateBg"></div>
  <div class="gate-hint">언제나 열려 있습니다</div>
</div>

<div id="flash"></div>

<!-- 2. 헌사홀 -->
<div id="hall" class="view" role="button" tabindex="0" aria-label="무대로 들어가기">
  <div id="camera"></div>
  <div class="hall-hint">화면을 누르면 무대로 이어집니다</div>
</div>

<!-- 3. 무대 -->
<div id="stage" class="view">
  <div id="stageFit">
    <img id="stageImg" alt="">
    <div id="play" role="button" tabindex="0" aria-label="오늘의 한 편 재생">
      <div class="veil">
        <div class="play-eyebrow">HODIE · 오늘의 한 편</div>
        <div id="playTitle" class="play-title"></div>

      </div>

  <div id="guestFloat"></div>

    <div class="gfm-label">놓을 꽃</div>
    <div class="gfm-flowers" id="gfmFlowers"></div>
    <input id="gfmWho" placeholder="이름" maxlength="20">

      <div class="gfm-msg" id="gfmNote"></div>

    </div>

  <div id="guestBar">
    <div id="flowerRow"></div>

</div>

<script>
/* ============================================================
 *  DB에서 읽어온다 — palais.html?org=ildangbaek
 * ============================================================ */
const SUPA_URL='https://cyhlotwdisjvoxvfkpnd.supabase.co';
const SUPA_KEY='sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
const BUCKET='popup-assets', PREFIX='palais/';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{storageKey:'eungyo-auth',persistSession:true}});
const ORG=(new URLSearchParams(location.search).get('org')||'ildangbaek').toLowerCase();

let PALAIS={ name:'', epoch:null, curation:[], letters:[] };
let SCREEN_RECT={L:14.6,T:53.1,W:71.0,H:18.6};
const STAGE_RATIO=1080/1920;                    // 무대 그림 가로/세로
const asset=slot=>`${SUPA_URL}/storage/v1/object/public/${BUCKET}/${PREFIX}${ORG}/${slot}.webp`;

/* ============================================================
 *  서울 하늘 4구간 (아침 m: 일출−2h~+2h / 낮 d / 저녁 e: 일몰−2h~일몰 / 밤 n)
 * ============================================================ */
/* ══ 하늘 4구간 — eg_sky.js 한 벌로 이관 (0729) ══
   NOAA 계산은 eg_sky.js에 있다. 여기서 다시 재지 않는다.
   옛 방식(getTimezoneOffset 보정)은 손님 지역 서머타임 전환일에
   한 시간 어긋났다 — 부품은 Date.now() 눈금만 보므로 그 병이 없다. */
function todPhase(){ return egSky.phase(); }


const $=s=>document.querySelector(s);
let FORCED=null, CUR=null;

/* 그림 물리기 — 후보를 순서대로 시도 (시간대판 없으면 낮판 등) */
function setBgChain(el, cands, asImg=false){
  const step=i=>{
    if(i>=cands.length) return;
    const im=new Image();
    im.onload=()=>{ asImg ? el.src=cands[i] : el.style.backgroundImage=`url(${cands[i]})`; };
    im.onerror=()=>step(i+1);
    im.src=cands[i];
  };
  step(0);
}
const isLandscape=()=> innerWidth > innerHeight;
let CUR_ORIENT=null;
function applyTOD(){
  const t=FORCED||todPhase();
  const orient=isLandscape()?'w':'p';
  if(t===CUR && orient===CUR_ORIENT) return;
  CUR=t; CUR_ORIENT=orient;
  setBgChain($('#gateBg'),[asset(`gate_${t}`),asset('gate_d')]);
  /* 홀: 가로 화면은 가로판(wide) 우선 — 세로 그림을 노트북 폭으로 늘리면 각인이 뭉개진다 */
  const hallCands = orient==='w'
    ? [asset(`hall_wide_${t}`),asset('hall_wide_d'),asset(`hall_${t}`),asset('hall_d')]
    : [asset(`hall_${t}`),asset('hall_d')];
  setBgChain($('#camera'),hallCands);
  setBgChain($('#stageImg'),[asset(`screen_${t}`),asset('screen_d')],true);
  const nowEl=$('#todNow'); if(nowEl) nowEl.textContent={m:'아침',d:'낮',e:'저녁',n:'밤'}[t];
}

/* ============================================================
 *  홀 배치 + 하강
 *  · 세로 화면: 9:16 그림 세로로 세우고 천장→헌사 하강 (기존)
 *  · 가로 화면: 16:9 가로판을 화면에 꽉 채움 — 하강 대신 즉시 헌사 대면
 * ============================================================ */
function layoutHall(){
  const vw=innerWidth, vh=innerHeight;
  const camH = isLandscape() ? vh : Math.max(vh*1.5, vw*16/9);
  $('#camera').style.height=camH+'px';
  return camH;
}
let descended=false;
function descend(){
  const camH=layoutHall();
  const hall=$('#hall'), vh=innerHeight;
  if(isLandscape()){ hall.scrollTop=0; descended=true; return; }
  const target=Math.max(0, camH*0.52 - vh*0.5);   // 헌사 각인이 화면 중앙에
  if(matchMedia('(prefers-reduced-motion: reduce)').matches || descended){ hall.scrollTop=target; return; }
  hall.scrollTop=0;
  const t0=performance.now(), DUR=2600;
  const ease=x=>1-Math.pow(1-x,3);
  let cancelled=false;
  hall.addEventListener('pointerdown',()=>{cancelled=true;hall.scrollTop=target;},{once:true});
  (function step(now){
    if(cancelled) return;
    const p=Math.min(1,(now-t0)/DUR);
    hall.scrollTop=target*ease(p);
    if(p<1) requestAnimationFrame(step); else descended=true;
  })(performance.now());
}

/* ============================================================
 *  무대 배치
 *  · 세로 화면: 그림이 화면을 꽉 채움(cover)
 *  · 가로 화면: 그림 폭 = 화면 폭, 위아래 스크롤. 입장 시 스크린이 화면 중앙에.
 *  영상 자리는 그림 %에 절대 고정이라 어느 쪽이든 어긋나지 않는다.
 * ============================================================ */
function layoutStage(){
  const vw=innerWidth, vh=innerHeight;
  const fit=$('#stageFit');
  if(vw/vh < STAGE_RATIO){                 // 세로 화면 → cover
    let h=vh, w=h*STAGE_RATIO;
    if(w<vw){ w=vw; h=w/STAGE_RATIO; }
    fit.style.width=w+'px'; fit.style.height=h+'px';
    fit.style.marginLeft=((vw-w)/2)+'px'; fit.style.marginTop=((vh-h)/2)+'px';
  }else{                                   // 가로 화면 → 폭 맞춤 + 세로 스크롤
    const w=vw, h=w/STAGE_RATIO;
    fit.style.width=w+'px'; fit.style.height=h+'px';
    fit.style.marginLeft='0'; fit.style.marginTop='0';
  }
}
function centerStageScreen(){              // 스크린 중심을 화면 중앙에
  const vh=innerHeight;
  const h=$('#stageFit').getBoundingClientRect().height;
  const mid=(SCREEN_RECT.T + SCREEN_RECT.H/2)/100*h;
  $('#stage').scrollTop=Math.max(0, mid - vh*0.5);
}

/* ============================================================
 *  오늘의 한 편 — 달력이 회전판
 * ============================================================ */
function todaysPick(){
  const list=PALAIS.curation||[];
  if(!list.length) return null;
  const base=PALAIS.epoch ? new Date(PALAIS.epoch+'T00:00:00+09:00') : new Date();
  const days=Math.floor((Date.now()-base)/86400000);
  const i=((days%list.length)+list.length)%list.length;
  return list[i];
}
/* DB 좌표를 영상 자리에 실제로 물린다 */
function applyRect(){
  const p=$('#play');
  p.style.left=SCREEN_RECT.L+'%'; p.style.top=SCREEN_RECT.T+'%';
  p.style.width=SCREEN_RECT.W+'%'; p.style.height=SCREEN_RECT.H+'%';
}

/* ============================================================
 *  전환들
 * ============================================================ */
function goHall(){                       // 대문 → (빛 3.2s) → 홀
  const f=$('#flash');
  f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  setTimeout(()=>{
    $('#gate').classList.remove('on');
    $('#hall').classList.add('on');
    descend();
    /* EG Credencial 입국 도장 (0804 · 9-1) — 대문(#gate)이 아니라 홀에 들어선 뒤.
       이 파일의 supabase 클라이언트 이름은 supa가 아니라 sb다. */
    if (window.EGStamp) EGStamp.offer({ supa: sb, area:'palatium' });
  }, 1750);                              // 빛이 화면을 다 덮은 시점에 교대
}
function goStage(){                      // 홀 → 페이드아웃 → 무대 페이드인
  const fd=$('#fader');
  fd.classList.add('on');
  setTimeout(()=>{
    $('#hall').classList.remove('on');
    layoutStage();
    $('#stage').classList.add('on');
    $('#guestForm').classList.remove('on');
    fd.classList.remove('on');
    /* 0804 — 무대에 들어서는 3초. 음악관(concert.html)과 완전히 같은 카메라다.
       무대 그림도 9:16이라, 곧장 스크린이 앉으면 천장도 객석도 화면 밖이었다.
       ⚠ 부품이 안 실려도 무대는 선다 — 옛 방식으로 물러선다. */
    const camOpts = { box:'#stage', fit:'#stageFit', ratio:STAGE_RATIO, rect:SCREEN_RECT };
    const scrollable = (innerWidth/innerHeight) >= STAGE_RATIO;   /* 폰은 스크롤 0 */
    if (window.EGCamera && scrollable) EGCamera.enter(camOpts);
    else if (window.EGCamera) EGCamera.settle(camOpts);
    else centerStageScreen();
  }, 1150);
}
$('#gate').addEventListener('click', goHall);
$('#gate').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();goHall();}});
$('#hall').addEventListener('click', ()=>{ if(descended) goStage(); });
$('#hall').addEventListener('keydown',e=>{if(e.key==='Enter') goStage();});

/* 무대 스크린 재생 — 실제 유튜브 */
function play(){
  const pick=todaysPick();
  if(!pick||!pick.id){ return; }
  const box=$('#playerBox');
  box.innerHTML=`<iframe src="https://www.youtube.com/embed/${pick.id}?autoplay=1&rel=0&modestbranding=1"
    allow="autoplay; encrypted-media; fullscreen" allowfullscreen frameborder="0"
    style="width:100%;height:100%;border:0;display:block"></iframe>
    <button class="stop" style="position:absolute;right:6px;top:6px;z-index:3;font-size:11px;
      letter-spacing:.16em;color:#d9b168;background:rgba(0,0,0,.55);padding:3px 10px;border-radius:99px;">닫기</button>`;
  box.classList.add('on');
}
function stop(){
  $('#playerBox').classList.remove('on');
  $('#playerBox').innerHTML='';
}
$('#play').addEventListener('click', e=>{
  if(e.target.classList.contains('stop')){ stop(); return; }
  if(!$('#playerBox').classList.contains('on')) play();
});

/* ============================================================
 *  붓질
 * ============================================================ */
function paint(){
  document.title=`전당 · ${PALAIS.name||''} — EG Paris`;
  const pick=todaysPick();
  $('#playTitle').textContent = pick ? (pick.t||'') : '';
  /* 제목이 비어 있으면 유튜브 oEmbed로 즉석 조회 (키 불필요) */
  if(pick && pick.id && !pick.t){
    fetch(`https://www.youtube.com/oembed?url=https%3A//www.youtube.com/watch%3Fv%3D${pick.id}&format=json`)
      .then(r=>r.ok?r.json():null)
      .then(j=>{ if(j&&j.title) $('#playTitle').textContent=j.title; })
      .catch(()=>{});
  }
}

/* ============================================================
 *  방명록 — 헌사홀 바닥. 꽃을 놓고 한 줄 남긴다.
 *  · 꽃: 공용 자산 12종 (_shared/flower01~12.webp) — 팝업 방명록과 같은 꽃밭
 *  · 메시지: 한 번에 한 사람. 흐르지도 떠오르지도 않고 제자리에서 조용히 갈린다
 * ============================================================ */
const FLOWER_N=12;
const flowerURL=i=>`${SUPA_URL}/storage/v1/object/public/${BUCKET}/_shared/flower`
  + String(Math.min(FLOWER_N,Math.max(1,i||1))).padStart(2,'0') + '.webp';

let NOTES=[], noteTimer=null, noteIdx=0, myFlower=1;

async function loadNotes(){
  const { data, error } = await sb.from('palais_notes')
    .select('who,msg,flower').eq('org',ORG).order('created_at',{ascending:false}).limit(60);
  if(error){ console.warn('방명록 읽기 실패:',error.message); return; }
  NOTES=data||[];
  paintFlowers();
  startNotes();
}
function paintFlowers(){
  const n=Math.min(NOTES.length,12);
  $('#flowerRow').innerHTML=Array.from({length:n},(_,i)=>
    `<img src="${flowerURL(NOTES[i].flower)}" alt="">`).join('');
}
/* 한 사람씩 교체 — 지웠다 켜는 게 아니라 겹쳐 두고 투명도만 넘긴다 */
function startNotes(){
  clearInterval(noteTimer);
  const box=$('#guestFloat');
  if(!NOTES.length){ box.innerHTML=''; return; }
  const swap=()=>{
    const n=NOTES[noteIdx%NOTES.length]; noteIdx++;
    const el=document.createElement('div');
    el.className='gf-line';
    el.innerHTML=(n.who?`<b>${esc(n.who)}</b>`:'')+esc(n.msg);
    box.appendChild(el);
    requestAnimationFrame(()=>el.classList.add('on'));
    const prev=box.querySelectorAll('.gf-line');
    if(prev.length>1){
      const old=prev[0];
      old.classList.remove('on');
      setTimeout(()=>old.remove(),1000);
    }
  };
  swap();
  if(NOTES.length>1) noteTimer=setInterval(swap, 5200);
}
const esc=s=>String(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

/* 작성 패널 */
(function guestUI(){
  $('#gfmFlowers').innerHTML=Array.from({length:FLOWER_N},(_,i)=>
    `<button data-i="${i+1}" class="${i===0?'on':''}"><img src="${flowerURL(i+1)}" alt=""></button>`).join('');
  $('#gfmFlowers').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    myFlower=+b.dataset.i;
    $('#gfmFlowers').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
  });
  $('#guestBtn').addEventListener('click',async e=>{
    e.stopPropagation();
    const form=$('#guestForm');
    form.classList.toggle('on');
    if(form.classList.contains('on')){
      const { data:{ session } } = await sb.auth.getSession();
      $('#gfmNote').textContent = session
        ? '남기신 꽃과 한 줄이 이 홀 바닥에 놓입니다.'
        : '은교살롱에 로그인하시면 남길 수 있습니다.';
      $('#gfmSend').style.display = session ? '' : 'none';
      if(session && !$('#gfmWho').value){
        const meta=session.user?.user_metadata||{};
        $('#gfmWho').value = meta.nickname || meta.name || '';
      }
      $('#gfmMsg').focus();
    }
  });
  ['#guestForm','#guestBar'].forEach(sel=>{
    $(sel).addEventListener('click',e=>e.stopPropagation());   // 홀 클릭(무대 진입)과 분리
  });
  $('#gfmSend').addEventListener('click',async e=>{
    e.stopPropagation();
    const msg=$('#gfmMsg').value.trim();
    if(!msg){ $('#gfmNote').textContent='한 줄만 적어 주세요.'; return; }
    $('#gfmSend').disabled=true; $('#gfmNote').textContent='놓는 중…';
    const { error } = await sb.from('palais_notes')
      .insert({ org:ORG, who:$('#gfmWho').value.trim()||null, msg, flower:myFlower });
    $('#gfmSend').disabled=false;
    if(error){ $('#gfmNote').textContent='실패했습니다: '+error.message; return; }
    $('#gfmMsg').value=''; $('#gfmNote').textContent='놓였습니다. 고맙습니다.';
    noteIdx=0; await loadNotes();
    setTimeout(()=>$('#guestForm').classList.remove('on'),1200);
  });
})();

/* ── DB에서 이 전당을 불러온다 ── */
async function loadOrg(){
  const { data, error } = await sb.from('palais_orgs').select('*').eq('code',ORG).maybeSingle();
  if(error||!data){ console.warn('전당을 찾지 못했습니다:',ORG,error&&error.message); return; }
  PALAIS={ name:data.name||'', epoch:data.epoch||null,
           curation:Array.isArray(data.curation)?data.curation:[],
           letters:Array.isArray(data.letters)?data.letters:[] };
  if(data.screen_rect) SCREEN_RECT=Object.assign({},SCREEN_RECT,data.screen_rect);
  applyRect(); paint(); loadNotes();
}


applyRect(); applyTOD(); layoutHall(); layoutStage(); loadOrg();
setInterval(applyTOD,10*60*1000);
addEventListener('resize',()=>{
  layoutHall(); layoutStage(); applyTOD();
  if($('#hall').classList.contains('on')) descend();
  if($('#stage').classList.contains('on')) centerStageScreen();
});
addEventListener('load',()=>{
  ['m','d','e','n'].forEach(t=>{
    ['gate','hall','hall_wide','screen'].forEach(k=>{ new Image().src=asset(`${k}_${t}`); });
  });
});
