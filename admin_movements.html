<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>EG — 오늘의 움직임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
:root{
  --bg:#12100c; --panel:#1b1710; --panel2:#221c14;
  --ink:#ece3d0; --dim:#9a8d72; --soft:#c8baa0;
  --gold:#d8b860; --gold2:#c9a84c; --line:rgba(216,184,96,.22);
  --ok:#7fb38a; --warn:#d59b57;
}
body{ background:var(--bg); color:var(--ink); font-family:'Noto Serif KR',serif; min-height:100vh; }
a{ color:var(--gold2); }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

header{ display:flex; align-items:baseline; gap:14px; padding:18px 22px 14px;
  border-bottom:1px solid var(--line); flex-wrap:wrap; }
h1{ font-family:'Cormorant Garamond',serif; font-size:25px; font-weight:600; letter-spacing:.5px; }
h1 .g{ color:var(--gold); }
.sub{ font-size:11.5px; color:var(--dim); letter-spacing:.14em; }
.right{ margin-left:auto; display:flex; align-items:center; gap:10px; }

#gate{ max-width:340px; margin:14vh auto; padding:26px; background:var(--panel);
  border:1px solid var(--line); border-radius:12px; }
#gate h2{ font-family:'Cormorant Garamond',serif; font-size:20px; margin-bottom:14px; color:var(--gold); }
#gate p{ font-size:13px; color:var(--dim); line-height:1.8; }
input,select{ width:100%; background:#151109; border:1px solid var(--line); border-radius:8px;
  color:var(--ink); font-family:inherit; font-size:14px; padding:10px 12px; margin-top:9px; }
.b{ background:var(--panel2); border:1px solid var(--line); border-radius:8px; color:var(--soft);
  font-family:inherit; font-size:13px; padding:8px 14px; cursor:pointer; }
.b:hover{ border-color:var(--gold); color:var(--ink); }
.b.gold{ background:var(--gold); border-color:var(--gold); color:#1a1408; font-weight:500; }
.b.wide{ width:100%; margin-top:14px; }

main{ padding:18px 22px 70px; max-width:920px; margin:0 auto; }

/* 눈금 */
.tiles{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:20px; }
@media(max-width:640px){ .tiles{ grid-template-columns:repeat(3,1fr); } }
.tile{ background:var(--panel); border:1px solid var(--line); border-radius:11px;
  padding:15px 12px; text-align:center; }
.tile b{ display:block; font-family:'Cormorant Garamond',serif; font-size:30px;
  font-weight:500; color:var(--gold); line-height:1.1; }
.tile span{ display:block; font-size:11px; color:var(--dim); letter-spacing:.14em; margin-top:6px; }
.tile.zero b{ color:var(--dim); }

.note{ font-size:12px; color:var(--dim); line-height:1.9; margin-bottom:20px;
  padding:12px 15px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
.note b{ color:var(--soft); font-weight:400; }

/* 흐름 */
.day{ font-size:12px; color:var(--gold2); letter-spacing:.16em; margin:22px 0 10px; }
.ev{ display:grid; grid-template-columns:58px 46px 1fr; gap:12px; align-items:baseline;
  padding:11px 14px; background:var(--panel); border:1px solid var(--line);
  border-radius:10px; margin-bottom:7px; }
@media(max-width:640px){ .ev{ grid-template-columns:52px 42px 1fr; gap:8px; } }
.ev .t{ font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; }
.ev .k{ font-size:11px; letter-spacing:.1em; text-align:center; padding:2px 0;
  border:1px solid var(--line); border-radius:5px; color:var(--soft); }
.ev.k-intro_opened .k{ color:var(--warn); border-color:rgba(213,155,87,.4); }
.ev.k-invite_requested .k{ color:var(--gold); border-color:rgba(216,184,96,.45); }
.ev.k-entered .k{ color:var(--ok); border-color:rgba(127,179,138,.45); }
.ev .w{ font-size:14px; }
.ev .w b{ font-weight:500; color:var(--ink); }
.ev .w span{ color:var(--dim); font-size:12.5px; }

.empty{ padding:44px 20px; text-align:center; color:var(--dim); font-size:13.5px; line-height:2; }
.toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
  background:var(--panel2); border:1px solid var(--line); border-radius:9px;
  padding:10px 18px; font-size:13px; opacity:0; pointer-events:none; transition:.24s; z-index:40; }
.toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast.bad{ border-color:rgba(196,106,94,.5); }
</style>
</head>
<body>

<section id="gate">
  <h2>살롱지기</h2>
  <p>오늘의 움직임을 보시려면 들어와 주세요.</p>
  <input type="email" id="em" placeholder="이메일" autocomplete="username">
  <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password">
  <button class="b gold wide" id="loginBtn">들어가기</button>
</section>

<div id="app" style="display:none">
<header>
  <h1>오늘의 <span class="g">움직임</span></h1>
  <span class="sub">편지에서 파리까지</span>
  <div class="right">
    <select id="days" style="width:auto;margin:0">
      <option value="1">오늘</option>
      <option value="7">이레</option>
      <option value="14" selected>보름</option>
      <option value="90">석 달</option>
    </select>
    <button class="b" id="refresh">새로 읽기</button>
  </div>
</header>

<main>
  <div class="tiles" id="tiles"></div>
  <div class="note">
    ⭐ 이 화면은 <b>메일에 기대지 않습니다.</b> 알림이 한 통도 오지 않아도 여기 적힌 것은 정확합니다.<br>
    「열람」은 편지의 전용 링크를 눌러 상세페이지를 연 것이고, 아직 신청은 아닙니다.
  </div>
  <div id="flow"><div class="empty">불러오는 중…</div></div>
</main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPA_URL = 'https://cyhlotwdisjvoxvfkpnd.supabase.co';
const SUPA_KEY = 'sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
const sb = createClient(SUPA_URL, SUPA_KEY, {
  auth:{ storageKey:'eungyo-auth', persistSession:true, autoRefreshToken:true }
});

const $ = s => document.querySelector(s);
const esc = v => (v==null?'':String(v)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT=null;
function toast(m, bad){
  const t=$('#toast'); t.textContent=m; t.classList.toggle('bad',!!bad); t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'), 2600);
}

/* ── 문 ── */
$('#loginBtn').addEventListener('click', async ()=>{
  const email=$('#em').value.trim(), password=$('#pw').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ toast('들어가지 못했습니다 — '+error.message, true); return; }
  boot();
});
$('#pw').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#loginBtn').click(); });

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $('#gate').style.display=''; $('#app').style.display='none'; return; }
  $('#gate').style.display='none'; $('#app').style.display='';
  await load();
}

/* ── 읽기 ── */
async function load(){
  const days = Number($('#days').value) || 14;

  const [{ data:cnt, error:e1 }, { data:rows, error:e2 }] = await Promise.all([
    sb.rpc('eg_movements_count', { p_days: days }),
    sb.rpc('eg_movements',       { p_days: days }),
  ]);
  if(e1||e2){ toast('읽지 못했습니다 — '+((e1||e2).message), true); return; }

  /* 눈금 — 보냄 → 열람 → 신청 → 입장 → 체험중 */
  const order = ['보냄','열람','신청','입장','체험중'];
  $('#tiles').innerHTML = order.map(k=>{
    const v = (cnt && cnt[k]) || 0;
    return `<div class="tile${v?'':' zero'}"><b>${v}</b><span>${k}</span></div>`;
  }).join('');

  /* 흐름 — 날짜별로 묶는다 */
  const list = Array.isArray(rows) ? rows : [];
  if(!list.length){
    $('#flow').innerHTML = '<div class="empty">아직 아무 움직임이 없습니다.<br>명단에서 첫 편지를 보내시면 여기에 쌓입니다.</div>';
    return;
  }
  let html='', lastDay='';
  for(const r of list){
    const day = (r.at_kst||'').slice(0,5);
    const time = (r.at_kst||'').slice(6);
    if(day !== lastDay){ html += `<div class="day">${esc(day)}</div>`; lastDay = day; }
    html += `<div class="ev k-${esc(r.kind)}">
      <div class="t">${esc(time)}</div>
      <div class="k">${esc(r.kind_ko)}</div>
      <div class="w"><b>${esc(r.who)}</b> <span>${esc(r.line)}</span></div>
    </div>`;
  }
  $('#flow').innerHTML = html;
}

$('#refresh').addEventListener('click', ()=>{ load(); toast('새로 읽었습니다'); });
$('#days').addEventListener('change', load);

boot();
</script>
</body>
</html>
