<!-- ══ 방 배관 (0815) — 콜레주 1층 혈통 ══════════════════════════
     ⚠ eg_sky.js는 시간대(m|d|e|n)만 쓰려고 싣는다. 콜레주와 같은 판을 쓴다.
     ⚠ eg_camera.js는 sweep만 쓴다 — enter는 크기를 덮어써서 이 방을 깬다. -->
<script src="eg_sky.js?v=0806a"></script>
<script src="eg_camera.js?v=0804a"></script>
<script>
(function(){
  var P   = new URLSearchParams(location.search);
  var TOD = ['m','d','e','n'].indexOf(P.get('tod')) >= 0 ? P.get('tod')
          : (window.egSky && egSky.phase ? egSky.phase() : 'd');
  /* ⭐ 색 표가 이 표찰 하나로 갈린다. 그림과 색이 늘 같은 시간대를 본다 —
       두 곳에서 따로 정하면 낮 그림 위에 밤 종이가 앉는 날이 온다. */
  document.body.setAttribute('data-tod', TOD);

  /* 그림 물리기 — 후보 순서대로, 없으면 낮판. 전부 실패하면 f-fallback 유지 */
  function setBg(el, cands){
    if(!el) return;
    (function step(i){
      if(i >= cands.length) return;
      var im = new Image();
      im.onload  = function(){ el.style.backgroundImage = 'url(' + cands[i] + ')';
                               el.classList.remove('f-fallback'); };
      im.onerror = function(){ step(i+1); };
      im.src = cands[i];
    })(0);
  }
  /* ⚠ 임시 — 자화상 제 그림이 구워질 때까지 콜레주 1층을 빌려 쓴다(0815 소로).
       제 그림이 오면 이 줄의 college_hall1_ 만 persona_hall_ 로 바꾸면 된다. */
  function wear(tod){
    document.body.setAttribute('data-tod', tod);
    setBg(document.getElementById('canvas0'),
          ['college_hall1_' + tod + '.webp', 'college_hall1_d.webp']);
  }
  wear(TOD);
  /* ⭐ 편집기(?edit=1)가 벽 넉 벌을 갈아 끼울 때 쓰는 유일한 손잡이.
     ⚠ 시간대는 여기서만 정한다 — 두 곳에서 정하면 낮 벽에 밤 잉크가 앉는 날이 온다. */
  window.EGPersonaRoom = { wear: wear, tod: function(){ return document.body.getAttribute('data-tod'); } };

  /* 들어서는 3초 — 천장 우물반자에서 시작해 바닥 대리석을 스치고 금테 패널에 안착.
     ⚠ sweep은 크기를 안 건드린다(0804 규약). 카드가 벽에 붙은 채로 스크롤만 움직인다.
     ⚠ 폰·짧은 화면은 sweep이 스스로 즉시 앉힌다(max<40). */
  function roll(){
    var sc = document.getElementById('sc0');
    if(!sc || !window.EGCamera) return;
    sc.scrollTop = 0;
    /* ⭐ 0818 소로 — 타륜 메뉴로 들어오면 들어서는 3초가 살고,
         배낭의 **미니 타륜**(terra 직행 키 · jump=1)으로 오면 금테 패널 앞에 곧장 선다.
       ⚠ 신호 이름은 분더카머 ▲ 와 같은 `jump=1`이다. 보내는 쪽은 terra —
         한쪽만 고치면 연출이 조용히 살아 있거나 조용히 죽는다.
       ⚠ sweep 은 instant 를 이미 알고 있다(eg_camera 규약). 새로 만든 손잡이가 아니다. */
    /* ⚠ 0818 — `PANEL` 은 이 파일의 다른 블록이 이미 쓰는 이름이다(2205행 · 지금 선 단).
         여기는 IIFE 안이라 가려지지만, 같은 이름이 두 뜻으로 살면 다음 사람이 헷갈린다.
         새 이름을 지을 때는 grep 부터 — 0815 함정 ㉤과 같은 자리다. */
    var Q = null, JUMP = false, FRAMED_ON = '';
    try{ Q = new URLSearchParams(location.search);
         JUMP = Q.get('jump') === '1';
         FRAMED_ON = Q.get('panel') || (Q.get('ledger')==='1' ? 'apple' : (Q.get('mail')==='1' ? 'mail' : ''));
    }catch(e){}

    /* ⭐ 0818 소로 — 액자로 곧장 들어오면 「목이 잘리는 느낌」. 카메라는 겨냥한 것의
         한가운데를 화면 복판에 놓으므로, 액자가 열린 판에서는 그 머리(제목)가 위로 넘어간다.
       ⚠ 공용 부품(eg_camera)에 손잡이를 더하지 않는다 — 그것을 부르는 집이 여럿이라
         꼬리표를 함께 올려야 하고, 이 한 곳을 위해 다섯 집을 흔들 까닭이 없다.
         여기서 화면 높이의 10%만 도로 올린다. */
    function lift(){
      if (!FRAMED_ON) return;
      try{ sc.scrollTop = Math.max(0, sc.scrollTop - sc.clientHeight * 0.10); }catch(e){}
    }
    function shown(){ try{ document.body.classList.add('eg-shown'); }catch(e){} }
    if (JUMP) document.body.classList.add('eg-jump');
    setTimeout(shown, 900);            /* ⚠ 안전 시계 — 어느 신호가 어긋나도 화면은 반드시 보인다 */

    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      EGCamera.sweep({ box:'#sc0', target:'#tg-board', dir:'down', instant: JUMP,
                       onDone: function(){
                         /* 액자는 이 뒤에 열릴 수도 있다 — 두 겹 뒤에 한 번 더 올린다 */
                         lift();
                         requestAnimationFrame(function(){ requestAnimationFrame(function(){
                           lift(); shown();
                         });});
                       } });
      if (!JUMP) shown();              /* 연출로 들어오면 처음부터 보인다 */
    });});
  }
  if(document.readyState === 'loading') addEventListener('DOMContentLoaded', roll);
  else roll();
})();
</script>
<script>

/* ══ 시트 여닫기 (0815) — 여섯이 한 문법을 쓴다 ══════════════════
   ⚠ 우편함·황금사과는 제 팝업이 따로 있다. 시트가 그 위에 겹치지 않게
     그 둘은 시트를 열지 않고 옛 팝업을 그대로 부른다. */
let SHEET = null;
function openSheet(k){
  if(k === 'mail'){  if(typeof openMail   === 'function'){ openMail();   return; } }

  closeSheet();
  const el = document.getElementById('sheet-' + k);
  if(!el) return;
  document.getElementById('sheet-back')?.classList.add('on');
  el.hidden = false; SHEET = el;
  document.body.style.overflow = 'hidden';
  if(k === 'cred' && typeof drawPoster === 'function') drawPoster();
  /* ⚠ 0816 — 글모음은 시트가 아니라 벽의 액자다. FRAMED.writing.draw 가 부른다.
       여기 남겨 두면 같은 문이 둘이 된다(v166 — 같은 문을 두 개 달지 않는다). */
}
function closeSheet(){
  document.getElementById('sheet-back')?.classList.remove('on');
  if(SHEET){ SHEET.hidden = true; SHEET = null; }
  document.body.style.overflow = '';
}
/* ══ 단 갈아 끼우기 (0816 소로) ═══════════════════════════════════
   ⭐ 「계정과 구독」은 팝업을 열지 않는다. 벽의 격자가 통째로 갈린다.
   ⚠ 뿌리 단이 두 줄, 계정 단이 한 줄이라 그냥 갈면 벽이 출렁인다.
     나가기 직전에 뿌리 높이를 재어 상자에 박고, 돌아오면 푼다. */
let PANEL = 'root';
function showPanel(name){
  const box = document.getElementById('e-panels');
  /* ⚠ 단이 격자만은 아니다 — 액자(.e-poster)도 단이다. 클래스가 아니라 값으로 고른다 */
  const all = document.querySelectorAll('#e-panels > [data-panel]');
  if(!box || !all.length) return;
  const cur = document.querySelector('#e-panels > [data-panel]:not([hidden])');
  const to  = document.querySelector('#e-panels > [data-panel="' + name + '"]');
  if(!to || cur === to) return;

  /* ⚠ 떠나는 단의 뒷정리(leave)가 먼저다 — 우편함 iframe 비우기가 여기 산다 */
  const leaving = FRAMED[PANEL];
  if(leaving && leaving.leave){ try{ leaving.leave(); }catch(e){} }

  /* ⚠ 액자는 벽을 통째로 쓰므로 붙들 높이가 없다. 붙들면 오히려 종이가 잘린다 */
  if(name === 'root' || FRAMED[name]){ box.style.minHeight = ''; }
  else if(cur){ box.style.minHeight = cur.offsetHeight + 'px'; }

  all.forEach(g => { g.hidden = (g !== to); g.classList.remove('panel-in'); });
  /* ⚠ hidden을 풀어도 애니메이션은 스스로 다시 돌지 않는다. 한 번 흘려보내야 한다 */
  void to.offsetWidth;
  to.classList.add('panel-in');

  PANEL = name;
  const fr = FRAMED[name] || null;

  /* ⭐ 액자 밖 크롬(제목·돌아가기·⋯)은 액자 단에서만 벽에 선다. 제목은 그 단의 이름이다 */
  const chrome = document.getElementById('tr-chrome');
  if(chrome) chrome.hidden = !fr;
  const ttl = document.querySelector('#tr-chrome .tr-title');
  if(ttl && fr) ttl.textContent = fr.title;
  /* ⚠ ⋯ 동그라미는 고를 것이 있는 단에서만 뜬다 */
  const menu = document.querySelector('#tr-chrome .tr-menu');
  if(menu) menu.hidden = !(fr && fr.menu && fr.menu.length);
  if(typeof openTDrop === 'function') openTDrop(false);

  if(fr){
    /* ⚠ 핀은 열 때마다 다시 읽는다 — 다른 창에서 바꿔 두었을 수 있다.
       ⚠ 우편함만 기본이 「전부」다(mailFrame이 스스로 읽는다) — 여기서 덮지 않는다 */
    if(fr.menu.includes('span') && name !== 'mail')
      PICK[name].span = tPin(name) || TSPAN_DEF;
    try{ fr.draw(); }catch(e){ console.warn('[EG] 액자 그리기', name, e); }
  }
  /* 띠는 뿌리에서 숨고, 하위 단에서 가름선 아래에 뜬다.
     ⚠ 단을 더할 때 TITLE에 이름 한 줄을 같이 더할 것. 안 더하면 코드 이름이 그대로 뜬다.
     ⭐ 액자 단은 FRAMED가 이름을 갖고 있으므로 저절로 따라온다. */
  const TITLE = Object.assign({ account:'계정과 구독' },
    Object.fromEntries(Object.entries(FRAMED).map(([k, v]) => [k, v.title])));
  /* ⭐ 단 이름을 몸에 심는다 — CSS가 단마다 다른 옷을 입힐 수 있게 된다.
     ⭐⭐ data-framed 는 「이 단은 벽을 통째로 쓴다」는 표식 하나뿐이다.
       액자 옷(머리·가름선·발이 물러나고 종이가 금테를 채우는 것)이 이 한 글자에 달렸다. */
  document.body.setAttribute('data-panel', name);
  if(fr) document.body.setAttribute('data-framed', '1');
  else   document.body.removeAttribute('data-framed');
  const bar = document.getElementById('e-bar');
  const whr = document.getElementById('e-where');
  if(whr) whr.textContent = (name === 'root') ? '' : (TITLE[name] || name);
  if(bar){
    bar.hidden = (name === 'root');
    if(!bar.hidden){ void bar.offsetWidth; }   /* 띠도 다시 드러나게 */
  }
}
document.getElementById('e-back')?.addEventListener('click', () => showPanel('root'));

document.addEventListener('click', e => {
  const b = e.target.closest('.cm'); if(!b) return;
  if(b.dataset.go){ showPanel(b.dataset.go); return; }      /* 벽을 간다 */
  if(b.dataset.act === 'invite'){ openInvite(); return; }   /* 바로 하는 일 */
  if(b.dataset.sheet) openSheet(b.dataset.sheet);           /* 팝업을 연다 */
});
/* ⚠ Esc — 팝업이 떠 있으면 팝업을 닫고, 아니면 뿌리 단으로 돌아간다 */
addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(SHEET){ closeSheet(); return; }
  if(PANEL !== 'root') showPanel('root');
});

</script>

<script>
/* ══════════════════════════════════════════════════════════════════
   각인 편집기 (0816b) — 소로 전용. 콩파뇽 화면에는 한 줄도 안 지어진다.

   여는 문 셋 — 어느 것이든 하나면 된다
     ① 주소에  ?edit=1
     ② Ctrl+Alt+E   (맥은 Cmd+Alt+E)
     ③ 오른쪽 위 관자 「EG UNIVERSE」를 세 번 톡톡  ← 액자 안에서 가장 확실
   ⚠ ②③이 있는 까닭 — 자화상은 지구(terra)의 **액자 안**에서도 열린다.
     그때는 주소가 액자 것이라 ?edit=1을 붙일 데가 없다(0816 소로).
     ③은 마우스만으로 되므로 액자 안에서 가장 확실하다.

   한 번 켜면 이 브라우저에 기억된다. 끌 때도 같은 문을 쓴다.
   ⚠⚠ 편집기가 **꺼져 있으면 슬라이더 값이 화면에 안 먹는다.** 일부러 그렇게 두었다 —
     실험하다 만 값이 콩파뇽 화면에 뜨는 일을 막는다. 확정은 파일 머리의 :root 에 적는다.
   ══════════════════════════════════════════════════════════════════ */
(function(){
  var KEYS = {
    'ph':       { def:6.2,  min:3.5, max:11,  step:0.1,  label:'사진 크기',  sec:'사진과 머리' },
    'head-pad': { def:3.2,  min:0,   max:12,  step:0.1,  label:'오른쪽 밀기' },
    'head-gap': { def:2.0,  min:0.3, max:6,   step:0.1,  label:'사진과 글' },
    'u-scale':  { def:1.00, min:0.7, max:1.7, step:0.01, label:'글자 크기',  sec:'새김 덩어리' },
    'slab-max': { def:580,  min:380, max:800, step:4,    label:'폭',        unit:'px' },
    'slab-h':   { def:64,   min:40,  max:100, step:1,    label:'높이',      unit:'%' },
    'slab-top': { def:38.3, min:28,  max:52,  step:0.1,  label:'세로 위치',  unit:'%' },
    'ico':      { def:2.85, min:2,   max:5,   step:0.05, label:'아이콘 원',  sec:'격자' },
    'row-gap':  { def:2.0,  min:0.8, max:5,   step:0.1,  label:'행 간격' },
    /* ⚠ 이 넷은 액자 안에서만 눈에 보인다. 「교양의 흔적들」이나 「황금사과」를 먼저 여십시오.
         앞의 둘은 금테와 흰 매트 사이, 뒤의 둘은 종이 안쪽이다. */
    'frame-x':  { def:1.1,  min:0,   max:5,   step:0.05, label:'매트 좌우', sec:'액자' },
    'frame-y':  { def:0.9,  min:0,   max:5,   step:0.05, label:'매트 상하' },
    'pad-x':    { def:1.1,  min:0,   max:5,   step:0.05, label:'종이 좌우' },
    'pad-y':    { def:1.2,  min:0,   max:5,   step:0.05, label:'종이 상하' }
  };
  var ORDER = ['ph','head-pad','head-gap','u-scale','slab-max','slab-h','slab-top',
               'ico','row-gap','frame-x','frame-y','pad-x','pad-y'];
  var STORE = 'eg-persona-edit-0816';   /* 슬라이더 값 */
  var ONKEY = 'eg-persona-edit-on';     /* 문이 열려 있나 */
  var built = false, styleEl = null;

  function ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  function CSS(){ return [
  /* ⚠⚠ 0816 소로 — 「편집기가 안 보인다」. 오른쪽 위에 두었더니 지구(terra)의
       액자 ✕에 가려 있었다. 액자 안의 z-index는 **액자 밖 요소를 이기지 못한다.**
       120이든 9999든 마찬가지다. 자리를 옮기는 것만이 처방이다.
     ⭐ 왼쪽 위로 옮긴다 — 액자의 문(✕)은 늘 오른쪽 위에 선다. */
  '#ed{position:fixed;top:12px;left:12px;z-index:120;width:272px;',
  ' font-family:"Gowun Batang",serif;color:#d6dee8;background:rgba(9,13,21,0.86);',
  ' -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);',
  ' border:1px solid rgba(255,255,255,0.15);border-radius:14px;',
  ' box-shadow:0 12px 34px rgba(0,0,0,0.5);max-height:calc(100vh - 24px);',
  ' display:flex;flex-direction:column}',
  '#ed-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;',
  ' border-bottom:1px solid rgba(255,255,255,0.12);font-size:12.5px;cursor:pointer;user-select:none}',
  '#ed-head b{font-weight:400;color:#f0f4f8}#ed-head span{color:#7f8ea2;font-size:11px}',
  '#ed-body{padding:10px 12px 12px;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}',
  '#ed-body::-webkit-scrollbar{display:none}',
  'body.ed-fold #ed-body{display:none}',
  '.ed-sec{font-size:10.5px;letter-spacing:0.16em;color:#6f7f94;margin:11px 0 7px}',
  '.ed-sec:first-child{margin-top:2px}',
  '.ed-row{display:flex;align-items:center;gap:8px;margin:6px 0}',
  '.ed-row label{flex:0 0 78px;font-size:11.5px;color:#a9b6c6}',
  '.ed-row input[type=range]{flex:1 1 0;min-width:0;height:16px;accent-color:#8fb7dd;',
  ' background:transparent;cursor:pointer}',
  '.ed-row .v{flex:0 0 46px;text-align:right;font-size:11px;color:#8fb7dd;',
  ' font-variant-numeric:tabular-nums}',
  '.ed-btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}',
  '.ed-btns button{font:inherit;font-size:11.5px;cursor:pointer;color:#cbd5e1;background:transparent;',
  ' border:1px solid rgba(255,255,255,0.17);border-radius:999px;padding:4px 11px}',
  '.ed-btns button.on{background:rgba(255,255,255,0.15);color:#fff;border-color:rgba(255,255,255,0.42)}',
  '#ed-out{width:100%;height:112px;margin-top:8px;display:none;background:rgba(0,0,0,0.42);',
  ' color:#bfe0ff;border:1px solid rgba(255,255,255,0.16);border-radius:8px;padding:8px;',
  ' font-family:ui-monospace,Menlo,monospace;font-size:10.5px;line-height:1.5;resize:vertical}',
  '#ed-out.on{display:block}',
  'body.ed-guide #tg-board{outline:1px dashed rgba(255,120,120,0.7)}',
  'body.ed-guide .slab{outline:1px dashed rgba(120,200,255,0.55)}',
  'body.ed-guide .e-head{outline:1px dashed rgba(150,255,180,0.45)}',
  '@media (max-width:760px){#ed{width:auto;left:10px;right:10px;top:10px}}',
  /* 켜고 끈 것을 눈으로 알리는 한 줄 — 안 보이면 「안 켜졌다」와 구별이 안 된다 */
  '.ed-toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:130;',
  ' font-family:"Gowun Batang",serif;font-size:12.5px;letter-spacing:.03em;color:#e8eef6;',
  ' background:rgba(9,13,21,0.88);border:1px solid rgba(255,255,255,0.16);',
  ' border-radius:999px;padding:8px 18px;opacity:1;transition:opacity .5s;pointer-events:none}'
  ].join(''); }

  function fmt(k,v){ var u=KEYS[k].unit;
    return u ? (Math.round(v*10)/10)+u : (Math.round(v*100)/100).toFixed(2); }
  function setVal(k,v){
    document.documentElement.style.setProperty('--'+k, v);
    var sl=document.getElementById('s-'+k), o=document.getElementById('v-'+k);
    if(sl && parseFloat(sl.value)!==v) sl.value=v;
    if(o) o.textContent=fmt(k,v);
  }
  function readAll(){ var o={};
    ORDER.forEach(function(k){ var sl=document.getElementById('s-'+k);
      o[k]= sl ? parseFloat(sl.value) : KEYS[k].def; }); return o; }
  function save(){ lsSet(STORE, JSON.stringify(readAll())); }

  function build(){
    if(built) return; built = true;
    styleEl = document.createElement('style');
    styleEl.id='ed-style'; styleEl.textContent=CSS();
    document.head.appendChild(styleEl);

    var rows='';
    ORDER.forEach(function(k){ var d=KEYS[k];
      if(d.sec) rows += '<div class="ed-sec">'+d.sec+'</div>';
      rows += '<div class="ed-row"><label>'+d.label+'</label>'
           +  '<input type="range" id="s-'+k+'" min="'+d.min+'" max="'+d.max
           +  '" step="'+d.step+'"><span class="v" id="v-'+k+'"></span></div>';
    });
    var box=document.createElement('div'); box.id='ed';
    box.innerHTML =
      '<div id="ed-head"><b>각인 편집기</b><span id="ed-fold">접기 ▾</span></div>'
    + '<div id="ed-body">'
    +   '<div class="ed-sec">벽</div>'
    +   '<div class="ed-btns" id="ed-tod">'
    +     '<button data-t="m">아침</button><button data-t="d">한낮</button>'
    +     '<button data-t="e">저녁</button><button data-t="n">밤</button></div>'
    +   rows
    +   '<div class="ed-sec">도구</div>'
    +   '<div class="ed-btns"><button id="ed-guide">가늠자</button>'
    +     '<button id="ed-reset">되돌리기</button><button id="ed-copy">값 뽑기</button>'
    +     '<button id="ed-off">편집기 끄기</button></div>'
    +   '<textarea id="ed-out" readonly spellcheck="false"></textarea>'
    + '</div>';
    document.body.appendChild(box);

    var saved={}; try{ saved=JSON.parse(ls(STORE))||{}; }catch(e){}
    ORDER.forEach(function(k){
      setVal(k, (typeof saved[k]==='number') ? saved[k] : KEYS[k].def);
      var sl=document.getElementById('s-'+k);
      if(sl) sl.addEventListener('input', function(){ setVal(k, parseFloat(sl.value)); save(); });
    });

    function paintTod(t){ document.querySelectorAll('#ed-tod button').forEach(function(x){
      x.classList.toggle('on', x.dataset.t===t); }); }
    document.getElementById('ed-tod').addEventListener('click', function(ev){
      var x=ev.target.closest('button'); if(!x) return;
      if(window.EGPersonaRoom) EGPersonaRoom.wear(x.dataset.t);
      else document.body.setAttribute('data-tod', x.dataset.t);
      paintTod(x.dataset.t);
    });
    paintTod(document.body.getAttribute('data-tod')||'d');

    document.getElementById('ed-copy').addEventListener('click', function(){
      var v=readAll();
      var txt='/* 교양자화상 각인판 — 소로 확정 치수. 이 파일 머리의 :root 에 덮어쓴다 */\n'
        +':root{\n'
        +'  --u-scale:  '+v['u-scale'].toFixed(2)+';\n'
        +'  --slab-max: '+Math.round(v['slab-max'])+';\n'
        +'  --slab-h:   '+Math.round(v['slab-h'])+';\n'
        +'  --slab-top: '+v['slab-top'].toFixed(1)+';\n'
        +'  --ph:       '+v['ph'].toFixed(1)+';\n'
        +'  --head-pad: '+v['head-pad'].toFixed(1)+';\n'
        +'  --head-gap: '+v['head-gap'].toFixed(1)+';\n'
        +'  --ico:      '+v['ico'].toFixed(2)+';\n'
        +'  --row-gap:  '+v['row-gap'].toFixed(1)+';\n'
        +'  --frame-x:  '+v['frame-x'].toFixed(2)+';\n'
        +'  --frame-y:  '+v['frame-y'].toFixed(2)+';\n'
        +'  --pad-x:    '+v['pad-x'].toFixed(2)+';\n'
        +'  --pad-y:    '+v['pad-y'].toFixed(2)+';\n'
        +'}';
      var out=document.getElementById('ed-out');
      out.classList.add('on'); out.value=txt; out.select();
      try{ navigator.clipboard.writeText(txt); }catch(e){}
    });
    document.getElementById('ed-reset').addEventListener('click', function(){
      try{ localStorage.removeItem(STORE); }catch(e){}
      ORDER.forEach(function(k){ setVal(k, KEYS[k].def); });
      document.getElementById('ed-out').classList.remove('on');
    });
    document.getElementById('ed-guide').addEventListener('click', function(){
      document.body.classList.toggle('ed-guide'); this.classList.toggle('on');
    });
    document.getElementById('ed-off').addEventListener('click', function(ev){
      ev.stopPropagation(); turn(false);
    });
    document.getElementById('ed-head').addEventListener('click', function(){
      var f=document.body.classList.toggle('ed-fold');
      document.getElementById('ed-fold').textContent = f ? '펴기 ▸' : '접기 ▾';
    });
    console.log('%c[EG] 각인 편집기 켜짐 — 손잡이 아홉. 「값 뽑기」로 CSS를 받으십시오.','color:#8fb7dd');
  }

  function destroy(){
    if(!built) return; built=false;
    /* ⚠ 인라인 치수를 반드시 걷는다 — 안 걷으면 실험하다 만 값이 화면에 남는다 */
    ORDER.forEach(function(k){ document.documentElement.style.removeProperty('--'+k); });
    var box=document.getElementById('ed'); if(box) box.remove();
    if(styleEl){ styleEl.remove(); styleEl=null; }
    document.body.classList.remove('ed-guide','ed-fold');
    console.log('%c[EG] 각인 편집기 꺼짐 — 파일에 박힌 치수로 돌아갑니다.','color:#7f8ea2');
  }
  function toast(msg){
    var t = document.createElement('div');
    t.textContent = msg;
    /* ⚠ 끌 때는 편집기 스타일이 이미 걷혔다. 알림은 제 옷을 안고 떠야 한다 */
    t.style.cssText = 'position:fixed;left:50%;bottom:30px;transform:translateX(-50%);'
      + 'z-index:130;font-family:"Gowun Batang",serif;font-size:12.5px;color:#e8eef6;'
      + 'background:rgba(9,13,21,0.88);border:1px solid rgba(255,255,255,0.16);'
      + 'border-radius:999px;padding:8px 18px;transition:opacity .5s;pointer-events:none;';
    document.body.appendChild(t);
    setTimeout(function(){ t.style.opacity = '0'; }, 1500);
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2100);
  }
  function turn(on){
    lsSet(ONKEY, on ? '1' : '0');
    if(on){ build();  toast('각인 편집기를 켰습니다 · 왼쪽 위'); }
    else  { destroy(); toast('각인 편집기를 껐습니다'); }
  }

  /* ── 여는 문 ① 주소 ── */
  var byUrl=false;
  try{ byUrl = new URLSearchParams(location.search).get('edit')==='1'; }catch(e){}
  if(byUrl) lsSet(ONKEY,'1');
  if(byUrl || ls(ONKEY)==='1') build();

  /* ── 여는 문 ② Ctrl+Alt+E ── */
  addEventListener('keydown', function(ev){
    if(!(ev.ctrlKey || ev.metaKey) || !ev.altKey) return;
    if((ev.key||'').toLowerCase()!=='e' && ev.code!=='KeyE') return;
    ev.preventDefault(); turn(!built);
  }, true);

  /* ── 여는 문 ③ 관자 세 번 톡톡 (액자 안에서 가장 확실하다) ──
     ⚠ 처음엔 다섯 번·900ms로 두었는데 사람 손에 빡빡했다(0816 소로).
       세 번·2초로 푼다. 지나가다 잘못 누를 만큼 헐겁지도 않다. */
  (function(){
    var n=0, t=0;
    document.addEventListener('click', function(ev){
      if(!ev.target.closest('.e-eyebrow')) return;
      clearTimeout(t); n++;
      t=setTimeout(function(){ n=0; }, 2000);
      if(n>=3){ n=0; turn(!built); }
    });
  })();
})();
</script>
