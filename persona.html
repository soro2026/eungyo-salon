<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교양자화상 — 포스터 크레덴시알 (시안 v3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+KR:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }

  :root{
    --ink:#ece3d0;          /* 밝은 상아 글자 */
    --ink-soft:#c8baa0;
    --ink-dim:#9a8d72;
    --gold:#d8b860;
    --gold-deep:#c9a84c;
    --line:rgba(216,184,96,0.22);
    --card:rgba(24,17,10,0.74);
    --card-edge:rgba(216,184,96,0.22);
    --plus:#7fb38a;         /* 수입 (은은한 초록빛 금) */
    --minus:#b58a6a;        /* 지출 (흙빛) */
  }

  body{
    font-family:'Noto Serif KR', serif;
    color:var(--ink);
    min-height:100vh;
    background:#0d0905;
    position:relative;
    overflow-x:hidden;
  }

  /* ══ 방 — 콜레주 1층 혈통 (0815) ═════════════════════════════
   *  ⚠ 옛 방식: persona_bg.webp를 position:fixed + cover로 깔았다.
   *    그림이 1672×941 가로판이라 훑을 세로가 없어 카메라가 못 돌았다.
   *  ⭐ 새 방식: 941/1672 세로 캔버스가 곧 스크롤 본문이 된다(#sc0).
   *    카드는 캔버스 위 %좌표에 앉아 벽과 한 몸으로 움직인다.
   *  ⚠ 스크롤 주체가 body → #sc0로 옮겨간다. sweep이 상자를 요구한다. */
  html,body{ height:100%; }
  #sc0{
    position:fixed; inset:0; z-index:0;
    overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    /* ⭐ 그림이 끝난 아래를 이 바탕색이 잇는다 — 옛 #canvas0::after의 일을 넘겨받았다 */
    background:var(--e-floor,#0d121c);
  }
  #canvas0{
    position:relative; width:100%;
    aspect-ratio:941/1672; min-height:100vh;
    background-repeat:no-repeat;
    background-size:cover;
    background-position:center top;
    /* ⚠ 0815 폰에서 잡음 — 캔버스는 941/1672로 서는데 카드가 그보다 길다.
         그림이 먼저 끝나고 아래가 검은 허공이 됐다. 벽널 색을 이어 붙여 막는다.
         ⭐ 근본 처방은 카드를 패널 안에 앉히는 것이다(콘텐츠 재편 때). */
    background-color:var(--e-floor,#141a26);
  }
  /* ⚠⚠ 0816 소로 지적 — 「카메라가 땅속을 파고 들었다 다시 올라온다」.
       진범이 여기 있었다. ::after는 캔버스 밖으로 나간 절대 요소라 그림에는 안 붙지만
       **스크롤 상자의 scrollHeight는 늘린다.** 실측: 캔버스 2559 + 헛땅 1800 = 4359.
       sweep은 「맨 아래까지 훑고 목표로 올라오는」 움직임이라, 그 맨 아래가
       그림 바닥이 아니라 캄캄한 헛땅 1800px 끝이 되어 있었다.
     ⭐ 바닥 잇기는 요소가 아니라 **스크롤 상자의 바탕색**이 맡는다(#sc0).
       요소가 없으니 스크롤도 안 늘어나고, 그림이 짧은 화면에서도 아래가 안 뚫린다.
     ⚠ 여기에 다시 ::after를 세우지 말 것. 세우는 순간 카메라가 또 땅을 판다. */
  /* 그림이 아직 안 왔을 때만 서는 폴백 — 콜레주 1층과 같은 색 */
  #canvas0.f-fallback{ background-image:
    radial-gradient(ellipse at 50% 0%, rgba(201,162,74,.10) 0%, transparent 55%),
    linear-gradient(180deg,#1b2338 0%,#14100b 100%); }

  /* 안착 자리 — 금테 패널 안쪽 (0815 실측). 카메라가 여기로 온다 */
  .tgt{ position:absolute; left:50%; transform:translateX(-50%); }



  /* ══════════════════════════════════════════════════════════════
     각인판 (0816a) — 종이를 걷어내고 벽에 직접 새긴다
     ⭐ 소로 0815 결정: 「종이를 차라리 걷어내고 배경에 각인으로」
     ⚠ 아래 시안 표(--c-*)는 지우지 않는다. 시트 여섯이 아직 종이 위에 선다.
       벽은 각인(--e-*), 팝업은 종이(--c-*). 두 표가 나란히 산다.
     ⚠ 치수 아홉은 ?edit=1 편집기가 만진다. 손으로 고칠 때도 여기만 고친다.
     ══════════════════════════════════════════════════════════════ */
  :root{
    --u-scale:  1;        /* 글자 단위 배율 */
    --slab-max: 580;      /* 새김 폭 상한 (px) */
    --slab-h:   64;       /* 새김 높이 (벽 대비 %) */
    --slab-top: 38.3;     /* 벽에서의 세로 위치 (%) — 금테 패널 안쪽 실측 */
    --ph:       6.2;      /* 사진 크기 (단위 배수) */
    --head-pad: 3.2;      /* 머리를 오른쪽으로 밀기 */
    --head-gap: 2.0;      /* 사진 ↔ 글 사이 */
    --ico:      2.85;     /* 아이콘 원 크기 */
    --row-gap:  2.0;      /* 격자 행 간격 */
    /* ⚠ 0816 소로 — 흰 매트가 금테 몰딩 위로 올라앉아 액자 테가 안 보였다.
         실측 좌표(22/78 · 38.3/78.7)는 **몰딩 안쪽 선**이라, 딱 맞추면 선을 덮는다.
         조금 들여야 테가 드러난다. 단위는 --u 배수 — 화면이 커져도 비율이 산다. */
    --frame-x:  1.1;      /* 액자 좌우 안여백 (매트 바깥 — 금테가 드러나는 만큼) */
    --frame-y:  0.9;      /* 액자 상하 안여백 */
    /* ⚠ 0817 — 매트 안여백은 액자의 성질이라 단마다 달라지면 안 된다(같은 액자니까).
         단마다 다른 것은 **종이 안쪽**이다. 도장 격자와 출납부 표는 필요한 여백이 다르다. */
    --pad-x:    1.1;      /* 종이 좌우 안여백 */
    --pad-y:    1.2;      /* 종이 상하 안여백 */
  }

  /* 각인 색 표 — 벽 넉 벌이 전부 어두우므로 잉크는 넉 벌 다 밝다.
     갈리는 것은 온도다. 벽 실측: m #302D2E · d #42536A · e #211C1A · n #0C131F */
  body[data-tod]{                       /* d · 한낮 청회 */
    --e-ink:#f3f8fc; --e-sub:#aebecd; --e-mute:#8598a9; --e-acc:#a9cfec;
    --e-line:rgba(226,241,255,0.26); --e-line-soft:rgba(226,241,255,0.13);
    --e-halo:rgba(198,226,250,0.13); --e-cut:rgba(0,0,0,0.62); --e-floor:#26303f;
  }
  body[data-tod="m"]{                   /* 아침 회갈 — 밀빛 */
    --e-ink:#f5f2e9; --e-sub:#c8bfae; --e-mute:#a09689; --e-acc:#e0cd9c;
    --e-line:rgba(255,248,232,0.24); --e-line-soft:rgba(255,248,232,0.12);
    --e-halo:rgba(240,228,198,0.12); --e-cut:rgba(0,0,0,0.62); --e-floor:#221f20;
  }
  body[data-tod="e"]{                   /* 저녁 적갈 — 살구빛 */
    --e-ink:#f8ece3; --e-sub:#cbb2a3; --e-mute:#a08b7f; --e-acc:#e3ac8d;
    --e-line:rgba(255,238,224,0.24); --e-line-soft:rgba(255,238,224,0.12);
    --e-halo:rgba(240,206,180,0.12); --e-cut:rgba(0,0,0,0.66); --e-floor:#171211;
  }
  body[data-tod="n"]{                   /* 밤 남흑 — 금빛 */
    --e-ink:#f1e9d3; --e-sub:#a4abc0; --e-mute:#818aa2; --e-acc:#d9bd74;
    --e-line:rgba(217,189,116,0.30); --e-line-soft:rgba(217,189,116,0.14);
    --e-halo:rgba(217,189,116,0.13); --e-cut:rgba(0,0,0,0.70); --e-floor:#080d15;
  }

  /* 새김 — 이 판의 서명. 벽 위에 얹지 않고 벽을 파고 도료를 채운 것처럼 둔다.
     ⚠ 아래 짙은 그늘 하나 + 둘레의 여린 빛 하나. 더 얹으면 스티커가 된다. */
  .cut{
    text-shadow:
      0 1px 1px var(--e-cut),
      0 2px 6px rgba(0,0,0,0.34),
      0 0 var(--e-glow,20px) var(--e-halo);
  }

  /* ══ 시안 판 — ⚠ 이제 시트(팝업) 전용이다. 벽은 위 각인 표를 쓴다 ═════
   *  ⭐ 색은 이 표 한 곳에서만 나온다. 네 시간대를 body[data-tod]로 갈아 끼운다.
   *    star.html의 SIAN 표와 같은 문법 — 별이 늘어도 손댈 곳이 없던 그 방식.
   *  ⚠ 오늘은 한낮(4d)만 켠다. 나머지 셋은 값만 심어 두고 배경 그림을 기다린다. */
  body[data-tod]{
    --c-card1:#f2f6f9; --c-card2:#e3ecf3; --c-wm:rgba(70,110,150,0.09);
    --c-ink:#22303c;   --c-sub:#7a8a99;  --c-muted:#8b9aa9; --c-accent:#3f6e96;
    --c-photo:#d9e5ee; --c-cbor:#c2d3e1; --c-cbg:#f8fbfd;
    --c-bdg:#3f6e96;   --c-bdgink:#f8fbfd;
  }
  body[data-tod="m"]{  /* 4b 세이지 그린 — 월든의 숲 (아침) */
    --c-card1:#eef0e4; --c-card2:#e2e7d4; --c-wm:rgba(90,110,70,0.10);
    --c-ink:#2d3524;   --c-sub:#7d8768;  --c-muted:#8b957a; --c-accent:#5f7340;
    --c-photo:#dde2ca; --c-cbor:#c6cfad; --c-cbg:#f6f8ee;
    --c-bdg:#5f7340;   --c-bdgink:#f6f8ee;
  }
  body[data-tod="e"]{  /* 4c 버건디 — 살롱의 벨벳 (저녁) */
    --c-card1:#f4e9e4; --c-card2:#ecdcd4; --c-wm:rgba(110,40,45,0.09);
    --c-ink:#3a1f22;   --c-sub:#96766e;  --c-muted:#a3837b; --c-accent:#7e2f36;
    --c-photo:#e5d1c9; --c-cbor:#d8bcb2; --c-cbg:#faf3ef;
    --c-bdg:#7e2f36;   --c-bdgink:#faf3ef;
  }
  body[data-tod="n"]{  /* 4a 자정 남색 — 별밤의 서재 (야간) ⭐ 콜레주 1층 벽과 같은 색 */
    --c-card1:#1b2338; --c-card2:#141a2c; --c-wm:rgba(205,174,96,0.09);
    --c-ink:#eee6cf;   --c-sub:#8f97b0;  --c-muted:#7d86a2; --c-accent:#d4b568;
    --c-photo:#2a3350; --c-cbor:#3a4463; --c-cbg:#222b45;
    --c-bdg:#d4b568;   --c-bdgink:#1b2338;
  }

  /* ══ 새김 덩어리 — 옛 증서(.cert)를 갈음한다 ══════════════════════
   *  ⭐ 폭을 못 박는다 — 패널 폭을 다 쓰면 아이콘 셋이 옆으로 흩어진다.
   *  ⚠ 높이도 못 박는다 — 벽이 화면보다 길 때(1440폭에서 1034>900)
   *    머리와 격자가 갈라져 가운데가 텅 빈다. 조여서 벽 한복판에 앉힌다. */
  .slab{
    --u: calc(clamp(10px, 2.35cqw, 17px) * var(--u-scale));
    --e-glow: calc(var(--u) * 1.4);
    width:min(96%, calc(var(--slab-max) * 1px));
    height:min(calc(var(--slab-h) * 1%), 82vh);
    margin:0 auto;
    display:flex; flex-direction:column; justify-content:space-between;
    color:var(--e-ink);
  }

  /* 관자 줄 — 오른쪽에 관자, 왼쪽에 돌아가는 문 (시안 3c의 「머리 오른쪽」을 이어받는다)
     ⚠ 자식이 하나뿐일 때 space-between은 그것을 왼쪽으로 보낸다.
       flex-end + margin-right:auto 라야 문이 없을 때도 관자가 오른쪽에 남는다. */
  .e-top{ display:flex; align-items:baseline; justify-content:flex-end;
    gap:calc(var(--u) * 0.8); }
  .e-eyebrow{
    font-family:'Cormorant Garamond',serif;
    font-size:calc(var(--u) * 0.86); letter-spacing:0.36em;
    color:var(--e-mute); font-weight:500; margin-right:-0.36em;
    cursor:default; user-select:none;
  }
  /* ⚠ 0.36em은 EG UNIVERSE 같은 라틴 대문자를 위한 값이다.
       한글에 그대로 쓰면 「계 정 과 구 독」으로 흩어진다. 띠의 이름은 좁게 준다. */
  .e-back{
    background:none; border:0; padding:0; font-family:inherit;
    font-size:calc(var(--u) * 0.86); color:var(--e-sub); cursor:pointer;
    letter-spacing:0.02em; transition:color .18s;
  }
  .e-back:hover{ color:var(--e-ink); }

  /* 머리: 사진 + 이름 */
  .e-head{
    display:grid; grid-template-columns:calc(var(--u) * var(--ph)) 1fr;
    gap:0 calc(var(--u) * var(--head-gap)); align-items:center;
    padding-left:calc(var(--u) * var(--head-pad));
  }
  .e-photo{
    width:calc(var(--u) * var(--ph)); height:calc(var(--u) * var(--ph));
    border-radius:calc(var(--u) * 0.5); overflow:hidden; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond',serif;
    font-size:calc(var(--u) * var(--ph) * 0.38);
    color:var(--e-sub); letter-spacing:0.04em; background:rgba(0,0,0,0.24);
    /* 벽에 끼워 넣은 사진 — 테두리 한 줄과 안쪽 그늘로 「박아 넣은」 것이 된다 */
    border:1px solid var(--e-line);
    box-shadow:inset 0 1px 7px rgba(0,0,0,0.55), 0 1px 0 var(--e-line-soft);
    transition:opacity .2s;
  }
  .e-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .e-photo.avatar-loading{ opacity:.45; }   /* ⚠ JS가 이 이름을 붙인다 */
  .e-who{ min-width:0; }
  .e-role{
    font-family:'Cormorant Garamond',serif; font-size:calc(var(--u) * 0.78);
    letter-spacing:0.3em; color:var(--e-mute); margin-bottom:calc(var(--u) * 0.35);
  }
  .e-nick{
    font-family:'Cormorant Garamond',serif; font-weight:600;
    font-size:calc(var(--u) * 2.05); line-height:1.06; letter-spacing:0.005em;
    color:var(--e-ink); word-break:break-all;
  }
  .e-chip{ font-size:calc(var(--u) * 0.86); color:var(--e-acc); margin-top:calc(var(--u) * 0.5); }
  .e-chip .st{ margin-right:calc(var(--u) * 0.28); }
  .e-sub{ font-size:calc(var(--u) * 0.8); color:var(--e-mute); margin-top:calc(var(--u) * 0.28); }
  .e-sub b{ color:var(--e-sub); font-weight:400; }

  /* 가름선 — 벽에 그은 한 줄 */
  .e-rule{
    height:1px; width:100%;
    background:linear-gradient(90deg, transparent, var(--e-line) 14%, var(--e-line) 86%, transparent);
    box-shadow:0 1px 0 var(--e-cut);
  }

  /* ══ 단 — 벽이 갈린다 ═════════════════════════════════════════
   *  ⚠ 단마다 줄 수가 다르다(뿌리 두 줄 · 계정 한 줄). 그대로 두면 갈릴 때
   *    벽이 출렁인다. 뿌리 단 높이를 붙들어 두 단이 같은 자리를 쓴다. */
  /* ⚠ 뿌리(두 줄)가 붙든 높이 안에서 계정(한 줄)이 위로 몰려 아래가 텅 빈다.
       상자를 격자로 두고 가운데 정렬하면 어느 단이든 같은 눈높이에 선다. */
  .e-panels{ position:relative; display:grid; align-items:center; }
  /* 가름선 아래 띠 — 돌아가는 문(왼쪽)과 지금 있는 단의 이름(오른쪽)
     ⚠ absolute로 얹는다. 흐름에 넣으면 단 높이가 늘어 벽이 출렁인다. */
  .e-bar{
    position:absolute; top:0; left:0; right:0; z-index:1;
    display:flex; align-items:baseline; justify-content:space-between;
    animation:panelIn .42s cubic-bezier(.2,.7,.3,1);
  }
  .e-bar[hidden]{ display:none; }
  /* ⚠ 액자에서는 띠를 안 쓴다 — 제목·돌아가기가 액자 밖으로 나갔다(0816 소로) */
  body[data-framed] .e-bar{ display:none; }
  .e-where{
    font-family:'Gowun Batang',serif; font-size:calc(var(--u) * 0.86);
    letter-spacing:0.12em; color:var(--e-mute);
  }
  @media (prefers-reduced-motion: reduce){ .e-bar{ animation:none; } }

  /* ══ 교양의 흔적들 — 벽의 액자 (0816) ═════════════════════════
   *  ⭐ 금테 몰딩이 액자다. 이 단일 때는 머리·가름선·발이 물러나고
   *    종이가 #tg-board(금테 안쪽)를 꽉 채운다.
   *  ⚠ .slab의 폭·높이 조임(min(96%,580px)/64%)은 메뉴를 위한 값이다.
   *    액자에는 그것이 족쇄가 된다 — 이 단에서만 푼다. */
  body[data-framed] .e-top,
  body[data-framed] .e-head,
  body[data-framed] .e-rule,
  body[data-framed] .e-foot{ display:none; }
  body[data-framed] .slab{ width:100%; height:100%; }
  /* ⚠ e-panels는 격자(grid)다. align-items:center인 채로 두면 칸이 내용만큼 자라
       종이가 액자 아래로 삐져나온다(0816 실측: 1116 > 1034). stretch로 눌러 앉힌다. */
  body[data-framed] .e-panels{
    height:100%; min-height:0 !important; align-items:stretch;
    /* ⭐ 종이를 금테 안쪽 선에서 조금 들인다 — 그래야 테가 드러난다 */
    padding:calc(var(--u) * var(--frame-y)) calc(var(--u) * var(--frame-x));
  }

  .e-poster{
    position:relative; height:100%; min-height:0; overflow:hidden;
    display:flex; flex-direction:column;
    animation:panelIn .42s cubic-bezier(.2,.7,.3,1);
  }
  .e-poster[hidden]{ display:none; }

  /* ⭐ 흰 매트 — 진짜 액자는 종이가 테에 바로 닿지 않는다(0816 소로).
     ⚠ 5%를 폭 기준으로만 주면 세로가 얇아진다. 위아래는 종횡비만큼 더 준다. */
  .pmat{
    position:relative; flex:1 1 auto; min-height:0; overflow:hidden;
    display:flex; flex-direction:column;
    padding:4% 5%;
    background:linear-gradient(158deg,#fbfaf7,#f2efe8);
    box-shadow:inset 0 0 calc(var(--u) * 2.2) rgba(30,22,10,0.10);
  }
  /* 종이 — 매트에 얹힌 인쇄물. 얇은 그늘로 매트에서 살짝 떠 보인다 */
  body[data-framed] .poster{
    flex:1 1 auto; min-height:0; overflow-y:auto;
    border-radius:1px; border:0;
    box-shadow:0 1px 5px rgba(40,30,14,0.16), 0 0 0 1px rgba(120,96,52,0.14);
    padding:calc(var(--u) * var(--pad-y)) calc(var(--u) * var(--pad-x))
            calc(var(--u) * var(--pad-y) * 1.16);
    scrollbar-width:none; -ms-overflow-style:none;
  }
  body[data-framed] .poster::-webkit-scrollbar{ display:none; }
  body[data-framed] .poster-foot{
    flex:0 0 auto; margin:0; padding:calc(var(--u) * 0.6) 0 0; color:#9a8d72;
  }

  /* 유리 — 대각선으로 한 번 스치는 빛. 누를 것을 가리지 않는다 */
  .pglass{
    position:absolute; inset:0; z-index:3; pointer-events:none;
    background:linear-gradient(112deg,
      rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.06) 26%,
      rgba(255,255,255,0) 42%, rgba(255,255,255,0) 100%);
    box-shadow:inset 0 0 calc(var(--u) * 2.6) rgba(20,14,6,0.26);
  }

  /* ══ 액자 밖 — 제목 · 돌아가기 · 동그라미 (0816 소로) ═══════════
   *  ⚠ 좌표는 배경 실측이다. 어림잡지 말 것.
   *    액자 위 벽 y 30.6~34.2% · 금테 안쪽 좌 22% 우 78% · 오른 벽 x 78.5~86.0% */
  /* ⚠⚠ 캔버스 %로 잡으면 안 된다(0816 실측). 액자가 화면보다 길어 위쪽이 잘리는데,
       캔버스 31%는 화면 밖 -68px에 떨어진다. **액자와 같은 상자에 앉히고**
       bottom:100%로 액자 위에 붙여야 늘 액자 바로 위에 선다.
     ⚠ --u는 .slab 안에서만 산다. 여기는 그 밖이라 제 값을 따로 세운다
       (2.35cqw of 56vw ≒ 1.32vw). 안 세우면 동그라미가 2px로 오그라든다. */
  #tr-chrome{
    position:absolute; left:22%; width:56%; top:38.3%; height:40.4%;
    z-index:4; pointer-events:none;
    --u: calc(clamp(10px, 1.32vw, 17px) * var(--u-scale));
  }
  #tr-chrome[hidden]{ display:none; }
  #tr-chrome > *{ pointer-events:auto; }
  #tr-chrome .tr-title,
  #tr-chrome .tr-back{
    position:absolute; bottom:calc(100% + var(--u) * 0.55);
    /* 벽에 새긴 글씨 — 각인 문법 그대로 */
    text-shadow:0 1px 1px var(--e-cut), 0 2px 6px rgba(0,0,0,0.34),
                0 0 calc(var(--u) * 1.4) var(--e-halo);
  }
  /* ⭐ 소로 — 제목은 고딕으로 각인 */
  #tr-chrome .tr-title{
    left:0; color:var(--e-ink); font-weight:700;
    font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    font-size:calc(var(--u) * 1.15); letter-spacing:0.06em;
  }
  #tr-chrome .tr-back{
    right:0; background:none; border:0; padding:0; cursor:pointer;
    font-family:'Gowun Batang',serif; font-size:calc(var(--u) * 0.9);
    color:var(--e-sub); letter-spacing:0.02em; transition:color .18s;
  }
  #tr-chrome .tr-back:hover{ color:var(--e-ink); }

  /* 동그라미 — 액자 오른쪽 벽. 돌아가기 아래에 선다 */
  /* 액자 오른쪽 바깥 벽 — 돌아가기 아래에 선다(0816 소로) */
  .tr-menu{ position:absolute; left:calc(100% + var(--u) * 0.85); top:calc(var(--u) * 0.6); }
  .tr-dots{
    width:calc(var(--u) * 2.5); height:calc(var(--u) * 2.5); border-radius:50%;
    background:transparent; border:1px solid var(--e-line); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    gap:calc(var(--u) * 0.22); padding:0;
    box-shadow:0 1px 0 var(--e-line-soft), inset 0 1px 2px rgba(0,0,0,0.4);
    transition:border-color .18s, box-shadow .18s;
  }
  .tr-dots span{
    width:calc(var(--u) * 0.24); height:calc(var(--u) * 0.24); border-radius:50%;
    background:var(--e-ink); box-shadow:0 1px 1px var(--e-cut);
  }
  .tr-dots:hover, .tr-dots[aria-expanded="true"]{
    border-color:var(--e-acc);
    box-shadow:0 0 calc(var(--u) * 1.2) var(--e-halo), inset 0 1px 2px rgba(0,0,0,0.4);
  }

  /* 펼치는 목록 — 글자다. 줄이 늘어도 그대로 버틴다 */
  .tr-drop{
    position:absolute; top:calc(100% + var(--u) * 0.55); left:50%;
    transform:translateX(-50%); min-width:calc(var(--u) * 8.6);
    background:rgba(12,16,24,0.92); -webkit-backdrop-filter:blur(9px);
    backdrop-filter:blur(9px);
    border:1px solid var(--e-line); border-radius:calc(var(--u) * 0.6);
    box-shadow:0 10px 28px rgba(0,0,0,0.45);
    padding:calc(var(--u) * 0.35) 0; overflow:hidden;
    animation:panelIn .22s cubic-bezier(.2,.7,.3,1);
  }
  .tr-drop[hidden]{ display:none; }
  .tr-item{
    display:flex; align-items:center; gap:calc(var(--u) * 0.5); width:100%;
    background:none; border:0; cursor:pointer; text-align:left;
    font-family:'Gowun Batang',serif; font-size:calc(var(--u) * 0.88);
    color:var(--e-sub); padding:calc(var(--u) * 0.42) calc(var(--u) * 0.85);
    white-space:nowrap; transition:background .15s, color .15s;
  }
  .tr-item:hover{ background:rgba(255,255,255,0.07); color:var(--e-ink); }
  .tr-item.on{ color:var(--e-ink); }
  .tr-item .lb{ flex:1 1 auto; }
  .tr-item .ck{ color:var(--e-acc); opacity:0; font-size:calc(var(--u) * 0.8); }
  .tr-item.on .ck{ opacity:1; }
  /* ⚠ 0817 — 목록이 두 묶음이 되었다(시간 축 · 갈래). 가름선과 작은 머리로 나눈다 */
  .tr-sep{ height:1px; margin:calc(var(--u) * 0.3) 0; background:var(--e-line); }
  /* 봉랍 곁값 — 안 읽은 편지가 있을 때만 뿌리 단 줄 오른쪽에 붉게 선다(0817) */
  #r-mail-side.sealed{ color:#c96a5e; }

  .tr-gh{
    font-family:'Cormorant Garamond',serif; font-size:calc(var(--u) * 0.72);
    letter-spacing:0.16em; color:var(--e-mute);
    padding:calc(var(--u) * 0.3) calc(var(--u) * 0.85) calc(var(--u) * 0.14);
  }
  /* 핀 — 눌러 고정하면 다음에 여기부터 열린다. 재촉이 아니라 취향이다 */
  .tr-pin{
    flex:0 0 auto; background:none; border:0; cursor:pointer; padding:0
      calc(var(--u) * 0.1); line-height:1; opacity:.32; transition:opacity .15s;
    color:var(--e-mute); font-size:calc(var(--u) * 0.82);
  }
  .tr-pin:hover{ opacity:.8; }
  .tr-pin.on{ opacity:1; color:var(--e-acc); }
  .e-grid[hidden]{ display:none; }
  /* 새김이 벽에서 다시 드러나는 결 — 들어설 때와 같은 곡선을 쓴다 */
  .e-grid.panel-in{ animation:panelIn .42s cubic-bezier(.2,.7,.3,1); }
  @keyframes panelIn{
    from{ opacity:0; transform:translateY(calc(var(--u) * 0.55)); }
    to{ opacity:1; transform:none; }
  }
  @media (prefers-reduced-motion: reduce){ .e-grid.panel-in{ animation:none; } }

  /* 3열 격자 */
  .e-grid{
    display:grid; grid-template-columns:repeat(3,1fr);
    row-gap:calc(var(--u) * var(--row-gap)); column-gap:calc(var(--u) * 0.4);
  }
  .cm{
    background:none; border:0; font:inherit; color:inherit; cursor:pointer;
    padding:0; text-align:center; position:relative;
    display:flex; flex-direction:column; align-items:center;
  }
  .cm-ico{
    width:calc(var(--u) * var(--ico)); height:calc(var(--u) * var(--ico));
    border-radius:50%; border:1px solid var(--e-line); background:transparent;
    display:flex; align-items:center; justify-content:center;
    color:var(--e-ink); margin-bottom:calc(var(--u) * 0.72);
    box-shadow:0 1px 0 var(--e-line-soft), inset 0 1px 2px rgba(0,0,0,0.4);
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .cm-ico svg{
    width:calc(var(--u) * var(--ico) * 0.49); height:calc(var(--u) * var(--ico) * 0.49);
    filter:drop-shadow(0 1px 1px var(--e-cut));
  }
  .cm:hover .cm-ico, .cm:focus-visible .cm-ico{
    transform:translateY(calc(var(--u) * -0.12)); border-color:var(--e-acc);
    box-shadow:0 0 calc(var(--u) * 1.2) var(--e-halo), inset 0 1px 2px rgba(0,0,0,0.4);
  }
  .cm:focus-visible{ outline:none; }
  .cm:focus-visible .cm-t{ text-decoration:underline; text-underline-offset:0.3em; }
  .cm-t{ font-size:calc(var(--u) * 1.0); font-weight:700; color:var(--e-ink); line-height:1.2; }
  .cm-v{ font-size:calc(var(--u) * 0.8); color:var(--e-acc); margin-top:calc(var(--u) * 0.24);
    min-height:1em; letter-spacing:0.01em; }
  /* ⭐ 숫자 배지를 점 하나로 바꿨다 — 「2」는 숙제고 점은 안부다 (헌장 9.2)
     ⚠ right로 잡으면 칸 폭에 끌려가 아이콘에서 떨어져 뜬다. 한복판 기준으로 민다. */
  .cm-b{
    position:absolute; top:calc(var(--u) * -0.06);
    left:calc(50% + var(--u) * var(--ico) * 0.37);
    width:calc(var(--u) * 0.42); height:calc(var(--u) * 0.42); border-radius:50%;
    background:var(--e-acc); box-shadow:0 0 calc(var(--u) * 0.7) var(--e-acc);
  }
  .cm-b[hidden]{ display:none; }

  /* 나가는 문 */
  .e-foot{ text-align:center; }
  .e-out{
    display:inline-block; cursor:pointer; font-family:inherit;
    font-size:calc(var(--u) * 0.86); color:var(--e-sub);
    border:1px solid var(--e-line); border-radius:999px;
    padding:calc(var(--u) * 0.55) calc(var(--u) * 1.9);
    background:transparent; box-shadow:0 1px 0 var(--e-line-soft);
    transition:color .18s, border-color .18s;
  }
  .e-out:hover{ color:var(--e-ink); border-color:var(--e-acc); }

  /* 들어설 때 새김이 드러난다 (한 번만) */
  .slab > *{ opacity:0; transform:translateY(calc(var(--u) * 0.5));
    animation:eRise .9s cubic-bezier(.2,.7,.3,1) forwards; }
  .slab > *:nth-child(1){ animation-delay:.10s }
  .slab > *:nth-child(2){ animation-delay:.24s }
  .slab > *:nth-child(3){ animation-delay:.36s }
  .slab > *:nth-child(4){ animation-delay:.46s }
  .slab > *:nth-child(5){ animation-delay:.60s }
  @keyframes eRise{ to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){
    .slab > *{ animation:none; opacity:1; transform:none; }
  }


  /* ══ 시트 — 여섯 메뉴 공통 팝업 (0815 소로 규약) ═══════════════
   *  좌우 폭 통일 · 위아래 스크롤 · 막대 감춤 · 뒤 배경 흐리게 */
  .sheet-back{
    position:fixed; inset:0; z-index:60; display:none;
    background:rgba(10,14,22,0.46);
    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
  }
  .sheet-back.on{ display:block; }
  .sheet{
    position:fixed; z-index:61; left:50%; transform:translateX(-50%);
    top:5vh; max-height:90vh; width:440px; max-width:calc(100vw - 28px);
    display:flex; flex-direction:column;
    background:linear-gradient(160deg, var(--c-card1), var(--c-card2));
    border-radius:20px; box-shadow:0 18px 50px rgba(10,14,22,0.46);
    overflow:hidden;
  }
  .sheet[hidden]{ display:none; }

  /* ══ 교양의 흔적들만 포스터 크기 (0816 소로) ═════════════════════
   *  ⭐ 「수첩과 다를 바 없다. 유리 액자 안의 포스터였으면 좋겠다」
   *    콜레주 1층 포스터를 실측해 그 치수를 그대로 가져온다 — 폭 min(56vh,600) · 3:4.
   *  ⚠ 세로를 기준으로 폭을 정한다. 폭을 먼저 정하고 높이를 얻으면
   *    낮은 화면에서 포스터가 화면 밖으로 넘는다(콜레주 0730 수리에서 겪은 그것).
   *  ⚠ .sheet의 max-width가 이기지 못하도록 여기서 다시 푼다.
   *  ⚠ 나머지 시트 다섯은 440 그대로다 — 폭 맞추기는 나중에(0816 소로). */
  #sheet-cred{
    width:min(66vh, 600px, calc(100vw - 28px));
    max-width:none;
    aspect-ratio:3 / 4;
    max-height:92vh;
    top:50%; transform:translate(-50%, -50%);
  }
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:17px 20px 13px; border-bottom:1px solid var(--c-cbor);
    font-family:'Gowun Batang',serif; font-size:15px; color:var(--c-ink);
  }
  .sheet-x{ cursor:pointer; font-size:21px; line-height:1; color:var(--c-muted); padding:0 4px; }
  .sheet-body{
    flex:1; overflow-y:auto; padding:16px 20px 26px; color:var(--c-ink);
    /* ⚠ 셋 다 써야 한다 — 하나만 쓰면 어떤 브라우저에만 막대가 남는다 */
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .sheet-body::-webkit-scrollbar{ display:none; }

  /* ══ 시트 안쪽 색 잇기 (0815) ══════════════════════════════════
   *  ⚠ 옛 몸통들은 어둑한 갈색 판(--ink/--card/--gold)에서 자랐다.
   *    밝은 시안 종이 위에 그대로 얹으니 검은 알약이 앉았다.
   *  ⭐ 몸통 CSS를 고치지 않고 **시트 안에서만 변수를 갈아 끼운다.**
   *    수첩(credencial)·지구 등 다른 화면이 쓰는 규칙은 한 글자도 안 건드린다. */
  .sheet-body{
    --ink:var(--c-ink); --ink-dim:var(--c-sub); --ink-mute:var(--c-muted);
    --gold:var(--c-accent); --gold-deep:var(--c-accent);
    --card:color-mix(in srgb, var(--c-cbg) 78%, transparent);
    --card-edge:var(--c-cbor);
  }
  /* ⚠ 0816 — 글모음은 벽의 액자로 옮겨 갔다. .witem 은 이제 시트 안에 안 선다.
       남겨 두면 언젠가 이 규칙을 보고 「글모음은 시트다」로 읽는 사람이 생긴다. */
  .sheet-body .menu-item{
    background:var(--c-cbg); border:1px solid var(--c-cbor);
  }
  .sheet-body .menu-label{ color:var(--c-ink); }
  .sheet-body .menu-desc,
  .sheet-body .hint{ color:var(--c-sub); }
  .sheet-body .menu-item.logout .menu-label{ color:var(--c-accent); }
  /* 포스터 — 종이 위에 앉으므로 옛 고정색을 시안 잉크로 */
  .sheet-body .poster{ background:transparent; border-color:var(--c-cbor); }
  .sheet-body .poster .pgh,
  .sheet-body .poster .pcap,
  .sheet-body .poster .pgh .n,
  .sheet-body .poster .poster-load{ color:var(--c-sub); }
  .sheet-body .poster .pgh{ color:var(--c-accent); }
  .sheet-body .pf{ border-color:var(--c-cbor); color:var(--c-sub); background:var(--c-cbg); }
  .sheet-body .pf.on{ background:var(--c-cbg); color:var(--c-accent); border-color:var(--c-accent); }


  /* ══ 안착 곳 — 금테 패널 안쪽 (0815 격자 실측) ═══════════════════
   *  좌 22.0%  우 78.0%  상 38.3%  하 78.7%  → 종횡비 1 : 1.28
   *  ⚠ 어림잡지 말 것. 첫 값(폭64·상36.5)은 좌우로 8%p 넘쳐 촛대를 덮었다.
   *  ⚠ 폭만 정하고 높이를 안 정하면 내용이 위로 몰리고 아래가 텅 빈다. */
  #tg-board{
    top:calc(var(--slab-top) * 1%); height:40.4%; width:56%; z-index:2;
    container-type:inline-size;   /* ⭐ 글자가 패널 폭을 따라 자란다 */
    display:flex; align-items:center; justify-content:center;
  }
  /* ⚠⚠ 폰 — 벽의 좌표는 벽이 넓을 때만 뜻이 있다.
       position:static으로 풀면 흐름에 들어와 캔버스를 아래로 밀어낸다(0815 실측).
       절대 위치는 지키고 좌표만 넓힌다.
       ⚠ 18vh로 두면 새김이 창문·천장 위에 앉아 달빛에 글씨가 묻힌다.
         폰에서도 벽면은 그림의 같은 곳에 있다 — vh가 아니라 그림 비율로 잡는다.
       ⭐ 폰 전면 손질은 따로 잡는다(0815 소로). 지금은 읽히는 곳까지다. */
  @media (max-width: 760px){
    #canvas0{ aspect-ratio:auto; min-height:165vh; background-position:center top; }
    #tg-board{ top:40%; height:auto; width:auto; left:16px; right:16px; transform:none; }
    .slab{ --u:15px; width:100%; height:auto; gap:calc(var(--u) * 2.2); }
    .e-head{ padding-left:0; }
  }

  /* ── 상단 타이틀 ── */
  .topbar{ display:flex; align-items:center; gap:10px; padding:20px 2px 4px; }
  .back{ font-size:20px; color:var(--gold); opacity:0.8; cursor:pointer; }
  .topbar-t{ font-family:'Cormorant Garamond',serif; font-size:13px; letter-spacing:4px; color:var(--gold); text-transform:uppercase; }

  /* ── ① 헤더: 프로필 ── */
  .header{
    text-align:center; padding:24px 0 26px;
  }
  .avatar-wrap{ position:relative; display:inline-block; }
  .avatar{
    width:88px; height:88px; border-radius:50%;
    background:linear-gradient(160deg,#3a2c18,#1c140c);
    border:2px solid var(--gold-deep);
    display:flex; align-items:center; justify-content:center;
    font-size:34px;
    box-shadow:0 0 28px rgba(216,184,96,0.18), inset 0 0 12px rgba(0,0,0,0.5);
    overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .avatar.avatar-loading{ opacity:.45; }
  .avatar-edit{
    position:absolute; right:0; bottom:2px;
    width:26px; height:26px; border-radius:50%;
    background:#241910; border:1px solid var(--gold-deep);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; color:var(--gold); cursor:pointer;
  }
  .nickname{ font-family:'Cormorant Garamond',serif; font-size:25px; color:var(--ink); margin-top:14px; letter-spacing:0.5px; }
  .badges{ display:flex; gap:7px; justify-content:center; margin-top:9px; }
  .badge{
    font-size:11px; padding:3px 11px; border-radius:11px;
    border:1px solid var(--line); color:var(--gold);
    background:rgba(216,184,96,0.06); letter-spacing:0.5px;
  }
  .badge.league{ color:var(--ink-soft); border-color:rgba(154,141,114,0.3); }

  .sub-bar{
    margin-top:16px; display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1px solid var(--card-edge);
    border-radius:10px; padding:11px 15px; backdrop-filter:blur(3px);
  }
  .sub-plan{ font-size:13px; color:var(--ink); }
  .sub-date{ font-size:11px; color:var(--ink-dim); margin-top:2px; }
  .sub-dday{ font-family:'Cormorant Garamond',serif; font-size:22px; color:var(--gold); font-weight:600; }

  /* ── 섹션 공통 ── */
  .sec-title{
    font-family:'Cormorant Garamond',serif; font-size:13px; letter-spacing:3px;
    color:var(--gold); text-transform:uppercase; margin:32px 4px 13px;
    display:flex; align-items:center; gap:10px;
  }
  .sec-title::after{ content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }

  /* ── ② 교양 자화상: 6스탯 ── */
  .stats{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
  }
  .stat{
    background:var(--card); border:1px solid var(--card-edge);
    border-radius:11px; padding:15px 8px; text-align:center;
    backdrop-filter:blur(3px);
    transition:border-color .3s, transform .3s;
  }
  .stat:hover{ border-color:rgba(216,184,96,0.45); transform:translateY(-2px); }
  .stat-v{ font-family:'Cormorant Garamond',serif; font-size:27px; color:var(--ink); font-weight:500; line-height:1; }
  .stat-v .u{ font-size:15px; color:var(--gold); }
  .stat-l{ font-size:11px; color:var(--ink-dim); margin-top:7px; letter-spacing:0.5px; line-height:1.4; }

  /* 리그 진척 */
  .league-card{
    margin-top:12px; background:var(--card); border:1px solid var(--card-edge);
    border-radius:11px; padding:14px 16px; backdrop-filter:blur(3px);
  }
  .league-top{ display:flex; align-items:center; justify-content:space-between; }
  .league-name{ font-size:14px; color:var(--ink); }
  .league-frac{ font-size:12px; color:var(--ink-dim); }
  .league-bar{ height:6px; border-radius:3px; background:rgba(154,141,114,0.18); margin-top:10px; overflow:hidden; }
  .league-fill{ height:100%; width:47%; background:linear-gradient(90deg,var(--gold-deep),var(--gold)); border-radius:3px; }
  .league-next{ font-size:11px; color:var(--ink-dim); margin-top:8px; font-style:italic; }

  /* ── ③ 황금사과 월렛 ──
     ⚠ 0817 — 옛 월렛(카드 머리 · 미니 3건 · 필터 알약 · 슬라이드 패널)은 통째로 걷었다.
       벽의 액자(data-panel="apple")가 그 일을 한다. 종이 위 문법은 .wsum/.wrow 참조.
       ⭐ 잔액 id(wallet-bal)만 살아 있다 — loadPersona()가 그 이름으로 채운다. */
  /* ── ④ 조용한 초대장 ── */
  .invite{
    background:var(--card); border:1px solid var(--card-edge);
    border-radius:11px; padding:17px; backdrop-filter:blur(3px);
  }
  .invite-text{ font-size:12.5px; color:var(--ink-soft); line-height:1.7; }
  .invite-link{
    margin-top:11px; display:flex; align-items:center; justify-content:space-between;
    background:rgba(0,0,0,0.3); border:1px solid var(--line);
    border-radius:8px; padding:9px 13px;
  }
  .invite-url{ font-size:12px; color:var(--gold); font-family:'Cormorant Garamond',serif; letter-spacing:0.3px; }
  .invite-save{
    font-size:11px; padding:5px 12px; border-radius:8px; cursor:pointer;
    background:rgba(216,184,96,0.14); border:1px solid var(--gold-deep); color:var(--gold);
  }

  /* ── ⑤ 설정 메뉴 ── */
  .menu{ display:flex; flex-direction:column; gap:8px; }
  .menu-item{
    background:var(--card); border:1px solid var(--card-edge);
    border-radius:10px; padding:14px 15px; backdrop-filter:blur(3px);
    display:flex; align-items:center; gap:13px; cursor:pointer;
    transition:border-color .3s;
  }
  .menu-item:hover{ border-color:rgba(216,184,96,0.4); }
  .menu-ico{ font-size:17px; width:22px; text-align:center; opacity:0.9; }
  .menu-txt{ flex:1; }
  .menu-label{ font-size:14px; color:var(--ink); }
  .menu-sub{ font-size:11px; color:var(--ink-dim); margin-top:2px; }
  .menu-badge{
    font-size:11px; min-width:20px; height:20px; padding:0 6px;
    border-radius:10px; background:#7a2d24; color:#f0d9c0;
    display:flex; align-items:center; justify-content:center;
  }
  .menu-arrow{ font-size:16px; color:var(--ink-dim); }
  .menu-item.logout .menu-label{ color:var(--minus); }

  .footer{ text-align:center; margin-top:46px; font-family:'Cormorant Garamond',serif; font-size:11px; letter-spacing:3px; color:var(--ink-dim); opacity:0.6; }

  .note{
    margin-top:28px; text-align:center; font-size:10.5px; color:var(--ink-dim);
    opacity:0.5; font-style:italic; line-height:1.6;
  }

  /* ── 이번 주의 꽃 ── */
  /* ══ 나의 글모음 — 비너스 시안 3b (0816 소로 확정) ═══════════════
     ⭐ 카드를 걷고 괘선만 남긴다. 글모음은 상자에 담을 것이 아니라 장부처럼 흐른다.
     ⭐ 왼쪽 한 칸에 딱지와 날짜가 세로로 선다 — 목록이 왼쪽 축을 갖는다.
     ⚠ 액자 종이(.poster)는 넉 벌 시간대 색을 안 따르고 늘 미색이다.
       그래서 시안 값을 그대로 쓸 수 있다 — 밤판에서 죽는 색이 없다. */
  .wload{ font:400 12.5px 'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif; color:#948b7a; line-height:1.7; padding:14px 2px; }
  .wlist{ display:block; }

  .witem{
    /* ⚠ 64px 은 시안 원값이다. 52px 로 줄였더니 「분더카머」(53px)가 한 픽셀 넘쳤다.
         딱지 이름을 늘릴 때는 반드시 폭부터 잰다 — nowrap 이라 조용히 옆 칸을 밟는다. */
    display:grid; grid-template-columns:64px 1fr; gap:0 16px;
    padding:15px 0; border-bottom:1px solid #e6dfd0;
    background:none; border:0; border-bottom:1px solid #e6dfd0; border-radius:0;
  }
  .witem:first-child{ padding-top:0; }
  .witem:last-child{ border-bottom:0; }
  /* ⭐ 제목이 있는 것(글)은 한 뼘 넉넉하게 — 인사와 숨결이 다르다 */
  .w-work{ padding:19px 0; }

  /* ── 왼쪽 칸 ── */
  .wtop{ display:flex; flex-direction:column; gap:3px; margin:0; align-items:flex-start; }
  .wtag{
    font:600 11.5px 'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif; letter-spacing:.1em;
    color:var(--w-hue); border:0; border-radius:0; padding:0; white-space:nowrap;
  }
  .wdate{ font:400 11px 'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif; color:#b3aa99; }
  .wpend{ font:400 10.5px 'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif; color:#a3766c; margin:1px 0 0; }

  /* ── 오른쪽 칸 ── */
  .wmain{ min-width:0; }
  .whead{ font:700 17px/1.35 'Noto Serif KR',serif; color:#332e26; }
  /* ⚠ 한스푼 머리글에는 줄바꿈이 들어 있다(「어른들은 늘\n설명을 해줘야…」).
       그대로 두면 「어디」 한 줄이 세 줄로 부풀어 목록이 들쭉날쭉해진다. 한 줄로 눕힌다. */
  .wwhere{ font:400 12.5px 'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif; color:#948b7a; margin:0;
    white-space:normal; }
  .w-greet .whead{ white-space:nowrap; }
  .w-work .wline{ display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }

  /* 인사 — 집 이름과 한마디가 한 줄에 나란히 선다 */
  .w-greet .wline{ display:flex; align-items:baseline; gap:10px; min-width:0; }
  .w-greet .whead{ font:600 13.5px 'Noto Serif KR',serif; color:#464036; flex:0 0 auto; }
  .w-greet .wbody{
    font:400 13px/1.7 'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif; color:#7c7465; margin:0; flex:1 1 auto; min-width:0;
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;
  }
  .w-greet.w-open .wbody{ display:block; }

  /* 글 — 본문 두 줄까지 */
  .w-work .wbody{
    font:400 14px/1.8 'Noto Serif KR',serif; color:#464036; margin:8px 0 0;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .w-work.w-open .wbody{ display:block; }
  .wbody p{ margin:0 0 .7em; white-space:pre-wrap; word-break:break-word; }
  .wbody p:last-child{ margin-bottom:0; }

  /* ⚠ 접는 손잡이는 넘치는 글에만 붙는다(JS가 재서 붙인다).
       짧은 글에 붙이면 눌러도 아무 일이 없어 고장으로 읽힌다. */
  .wmore-in{
    display:flex; justify-content:flex-end; margin-top:4px;
    font:500 12.5px 'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif; color:#8a6d3b;
  }
  .w-fold{ cursor:pointer; }

  .wmore{
    width:100%; margin-top:16px; background:none; border:1px solid #e6dfd0;
    color:#8a6d3b; border-radius:8px; padding:10px 0; cursor:pointer;
    font:500 12.5px 'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  }
  .wmore:hover{ border-color:#d5cbb6; }

  /* 액자 안에서는 목록이 스스로 구른다 */
  #wpaper{ overflow-y:auto; scrollbar-width:none; -ms-overflow-style:none; }
  #wpaper::-webkit-scrollbar{ display:none; }

  /* ── ③.5 EG 타벨라이(우편함) ──
     ⚠ 0817 — 요약 카드·여는 문·가운데 팝업(mail-*)은 통째로 걷었다.
       벽의 액자(data-panel="mail")가 messages.html을 안는다. 옷은 .mail-leaf 하나. */


  
/* ══ 크레덴시알 포스터 (0814 결정문 6~9호) ══════════════════
     ⭐ 수첩과 다른 점 — 수첩은 모양마다 폭이 달라 자리를 다투지만(span),
        포스터는 칸이 모두 같다. 그래야 한 면이 「인장첩」으로 읽힌다.
     ⚠ 9호 — 분모·퍼센트·진척 막대·「N개 남음」을 여기 절대 쓰지 않는다. */
  .pfilters{ display:flex; gap:7px; margin:2px 0 14px; flex-wrap:wrap; }
  .pf{
    font-family:'Noto Serif KR',serif; font-size:12px; letter-spacing:.4px;
    color:var(--ink-dim); background:rgba(24,17,10,.5);
    border:1px solid var(--line); border-radius:999px;
    padding:7px 14px; cursor:pointer; transition:.18s;
  }
  .pf:hover{ color:var(--ink-soft); }
  .pf.on{ color:#1a1208; background:var(--gold); border-color:var(--gold); }

  /* ⭐ 0814 눈검사 — 포스터만은 크림 종이다.
     도장 잉크는 판이 정하고(15호) 대개 먹빛이라, 어두운 카드 위에 얹으면
     배경에 묻혀 구멍처럼 보인다. 잉크를 뒤집는 대신 종이를 깐다.
     ⚠ 이 안에서는 글자색도 함께 뒤집어야 한다 — 아래 .poster 하위 규칙들. */
  .poster{
    background:linear-gradient(178deg,#f3ece0,#e9e0d0);
    border:1px solid rgba(120,96,52,.34); border-radius:10px;
    padding:20px 14px 22px; min-height:180px;
    box-shadow:0 8px 26px rgba(0,0,0,.42);
  }
  .poster .poster-load{ color:#8a7d64; }
  .poster .pgh{ color:#8a6d1f; }
  .poster .pgh::after{ background:linear-gradient(90deg,rgba(120,96,52,.3),transparent); }
  .poster .pgh .n{ color:#9a8d72; }
  .poster .pblank{
    border-color:rgba(120,96,52,.26); color:rgba(107,94,70,.72);
  }
  .poster-load{ text-align:center; color:var(--ink-dim); font-size:12.5px; padding:44px 0; }
  .poster-foot{
    text-align:center; color:var(--ink-dim); font-size:11px;
    letter-spacing:.6px; margin:9px 0 4px; font-family:'Cormorant Garamond',serif;
  }

  /* ══ EG 타벨라이 — 액자 안의 편지 (0817 소로) ═══════════════════
   *  ⚠ iframe은 .poster의 padding·overflow-y가 독이다 — 안쪽 문서가 제 스크롤을
   *    갖고 있어 겹으로 굴러간다. 종이 옷은 입되 여백·스크롤은 걷는다. */
  .mail-leaf{ padding:0 !important; overflow:hidden; border:0; display:block; width:100%; }

  /* ══ 황금사과 출납부 — 액자 안의 종이 (0817 소로) ═══════════════
   *  ⭐ 「오른쪽에서 스르르 밀려나오던 것을 액자 안으로.」
   *    월별 묶음(.pgroup/.pgh)은 흔적 액자와 같은 문법을 그대로 쓴다 — 같은 종이니까.
   *  ⚠ --u는 .slab 안에서만 산다. 이 종이는 그 안이라 그대로 쓸 수 있다. */

  /* 잔액 머리 — 종이를 굴려도 늘 위에 남는다.
     ⚠ 종이 안여백을 음수로 상쇄해 가장자리까지 덮는다. 안 그러면 굴릴 때
       글자가 머리 옆으로 새어 나온다. */
  .wsum{
    position:sticky; top:calc(var(--u) * var(--pad-y) * -1); z-index:2;
    display:flex; align-items:baseline; justify-content:space-between;
    margin:calc(var(--u) * var(--pad-y) * -1) calc(var(--u) * var(--pad-x) * -1)
           calc(var(--u) * 0.85);
    padding:calc(var(--u) * var(--pad-y)) calc(var(--u) * var(--pad-x))
            calc(var(--u) * 0.52);
    background:linear-gradient(178deg,#f3ece0,#f0e8db);
    border-bottom:1px solid rgba(120,96,52,0.30);
  }
  .wsum .lb{
    font-family:'Gowun Batang',serif; font-size:calc(var(--u) * 0.82);
    color:#8a7d64; letter-spacing:0.10em;
  }
  .wsum .bal{
    font-family:'Cormorant Garamond',serif; font-size:calc(var(--u) * 2.05);
    color:#8a6d1f; font-weight:600; line-height:1; font-variant-numeric:tabular-nums;
  }
  .wsum .bal .u{ font-size:calc(var(--u) * 0.82); color:#9a8d72; margin-left:calc(var(--u) * 0.22); }

  /* 한 줄 — 일시 · 내역 · 증감 · 잔액 */
  .wrow{
    display:grid; grid-template-columns:auto minmax(0,1fr) auto auto;
    gap:0 calc(var(--u) * 0.72); align-items:baseline;
    padding:calc(var(--u) * 0.44) calc(var(--u) * 0.15);
    border-bottom:1px solid rgba(120,96,52,0.13);
    font-size:calc(var(--u) * 0.84);
  }
  .wrow:last-child{ border-bottom:0; }
  .wrow .d{
    font-family:'Cormorant Garamond',serif; color:#9a8d72;
    font-variant-numeric:tabular-nums; letter-spacing:0.4px;
  }
  .wrow .t{ color:#4a4033; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wrow .a{ font-variant-numeric:tabular-nums; font-weight:600; text-align:right; }
  .wrow .a.plus{ color:#4b7343; }
  .wrow .a.minus{ color:#9a4a38; }
  .wrow .b{
    font-variant-numeric:tabular-nums; color:#9a8d72; text-align:right;
    font-size:calc(var(--u) * 0.78); min-width:calc(var(--u) * 3.2);
  }
  /* ⚠ 폰에서는 넉 줄이 한 줄에 안 선다. 두 줄 격자로 접는다 —
       위에 일시·증감, 아래에 내역·잔액. 눈이 왼쪽 위에서 오른쪽 아래로 흐른다. */
  @media (max-width:560px){
    .wrow{ grid-template-columns:minmax(0,1fr) auto; row-gap:calc(var(--u) * 0.16); }
    .wrow .d{ grid-column:1; }
    .wrow .a{ grid-column:2; }
    .wrow .t{ grid-column:1; }
    .wrow .b{ grid-column:2; }
  }

  .pgroup{ margin-bottom:20px; }
  .pgroup:last-child{ margin-bottom:0; }
  .pgh{
    display:flex; align-items:baseline; gap:8px;
    font-family:'Cormorant Garamond',serif; font-size:14px; letter-spacing:1px;
    color:var(--gold); margin:0 2px 10px;
  }
  .pgh::after{ content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }
  .pgh .n{ font-size:11px; color:var(--ink-dim); letter-spacing:.5px; }

  .pgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:12px 8px; }
  /* ⭐ 액자는 수첩보다 훨씬 넓다. 같은 크기로 두면 도장이 좁쌀이 된다 */
  /* ⚠ 각인이 도장 아래로 최대 두 줄 뻗는다(이름+날짜). 행 사이를 그만큼 벌린다.
       안 벌리면 아랫줄 도장 몸통에 글자가 앉는다 — 수첩이 지키는 단 하나의 선이다. */
  body[data-framed] .pgrid{
    grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:62px 10px;
  }

  /* ══ 도장 — 수첩(credencial)과 같은 문법 (0816 소로) ═══════════
   *  ⚠ 여기 값은 credencial.html에서 그대로 옮긴 것이다. 한쪽만 고치지 말 것.
   *    mix-blend-mode:multiply · 고딕 각인 · Courier 날짜 · 각인 색 = 잉크 색 ·
   *    pre-line 줄바꿈 · 안쪽 각인은 좌우 22% 조임 — 여섯이 수첩 문법의 전부다. */
  .pcell{ display:flex; justify-content:center; }
  .stamp{ position:relative; overflow:visible; }
  .ink{
    position:absolute; inset:0;
    -webkit-mask-size:contain;     mask-size:contain;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center;  mask-position:center;
    mix-blend-mode:multiply;
  }

<script>

/* ⚠ 판 이름을 실제 날짜로 되돌렸다(0818f → 0816g). 앞선 세 회차의 이름표가 이틀 앞서 있었다. */
/* ══ 교양자화상 · 황금사과 월렛 — apple_log 실연동 (SSoT = SUM(amount)) ══ */
const SUPABASE_URL = 'https://cyhlotwdisjvoxvfkpnd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';

let _refreshing = null;
function getSession(){ try{ return JSON.parse(localStorage.getItem('eungyo-auth')); }catch{ return null; } }
function tokenExp(tok){ try{ return JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp || 0; }catch{ return 0; } }
async function getValidToken(){
  const s = getSession();
  if(!s?.access_token) return null;
  const now = Math.floor(Date.now()/1000);
  if(tokenExp(s.access_token) - now > 60) return s.access_token;
  if(!s.refresh_token) return null;
  _refreshing = _refreshing || (async () => {
    try{
      const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
        method:'POST', headers:{ 'apikey':SUPABASE_KEY, 'Content-Type':'application/json' },
        body: JSON.stringify({ refresh_token: s.refresh_token }) });
      if(!r.ok) return null;
      const data = await r.json();
      if(!data.expires_at) data.expires_at = Math.floor(Date.now()/1000) + (data.expires_in || 3600);
      localStorage.setItem('eungyo-auth', JSON.stringify(data));
      return data.access_token || null;
    }catch(e){ return null; }
  })();
  const tok = await _refreshing; _refreshing = null; return tok;
}
async function sbFetch(path, options = {}){
  const token = await getValidToken();
  const res = await fetch(SUPABASE_URL + path, { ...options, headers:{
    'apikey':SUPABASE_KEY, 'Authorization':'Bearer ' + (token || SUPABASE_KEY),
    'Content-Type':'application/json', ...options.headers } });
  if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e.message || res.statusText); }
  /* ⚠ 0813 — 본문 없는 성공을 실패로 읽던 병(messages.html에서 잡은 것과 같은 줄).
     Prefer: return=minimal 로 POST하면 서버는 **201에 빈 본문**을 준다.
     204만 걸러내면 201에서 res.json()이 터지고, 그 예외가 catch로 굴러가
     일이 다 끝난 뒤에 「못 했습니다」가 뜬다.
     ⭐ 성공·실패는 상태 번호가 가른다. 본문을 읽다 난 예외로 가르지 않는다. */
  if(res.status === 204 || res.status === 205) return null;
  const txt = await res.text();
  if(!txt) return null;
  try{ return JSON.parse(txt); }catch(e){ return null; }
}
function getUser(){ try{ const s = JSON.parse(localStorage.getItem('eungyo-auth')); return s?.user || null; }catch{ return null; } }

// ── 월렛 (get_wallet RPC: label 가공 + bal_after) ──
function fmtDate(iso){
  const d = new Date(iso); const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} · ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDateShort(iso){
  const d = new Date(iso); const p = n => String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ══ 황금사과 출납부 — 액자 안의 종이 (0817 소로) ═══════════════════
   ⭐ 오른쪽 슬라이드 패널을 걷고 벽의 액자로 옮겼다.
   ⚠⚠ 30년 가는 출납부다. 「최근 7일」을 고르셨는데 만 줄을 다 긷지 않는다.
     get_wallet은 **최신순**이라, 마지막 줄이 경계보다 오래되면
     그 시간 축은 이미 다 담긴 것이다 — 거기서 멈춘다.
   ⚠ 「전부」일 때만 무한 스크롤로 이어 긷는다(경계가 없으니 멈출 곳이 없다).
   ⚠ bal_after는 서버가 **전체 누적합**으로 낸다. 잘라 받아도 잔액은 정확하다. */
let WROWS = [], WOFF = 0, WDONE = false, WBUSY = false;
/* ⭐ 첫 장은 작게, 그 다음은 크게 — 첫 화면이 빨리 서고 왕복은 적어진다.
     한 장을 40으로만 두면 「최근 1년」에 서른 번 가까이 왕복한다(0817 실측). */
const WFIRST = 40, WNEXT = 200;

/* 시간 축 경계 — 그 시각보다 뒤엣것만 종이에 오른다. null이면 거르지 않는다 */
function spanFrom(k){
  const t = TSPAN.find(x => x.k === k) || TSPAN[2];
  if(t.days == null) return null;
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate() - (t.days - 1)).getTime();
}

async function wPage(){
  if(WBUSY || WDONE) return 0;
  WBUSY = true;
  try{
    const lim = WROWS.length ? WNEXT : WFIRST;
    const rows = await sbFetch('/rest/v1/rpc/get_wallet', { method:'POST',
      body: JSON.stringify({ p_limit:lim, p_offset:WOFF }) }) || [];
    if(rows.length < lim) WDONE = true;
    WROWS = WROWS.concat(rows); WOFF += rows.length;
    return rows.length;
  }catch(e){ WDONE = true; return -1; }
  finally{ WBUSY = false; }
}

/* 고른 시간 축을 채울 만큼만 긷는다 */
async function wFill(){
  const from = spanFrom(PICK.apple.span);
  if(from == null){ if(!WROWS.length) await wPage(); return; }
  /* ⚠ 50장(2000줄)에서 멈춘다 — 어떤 사고로도 무한 고리에 빠지지 않게 */
  for(let i = 0; i < 50 && !WDONE; i++){
    const last = WROWS.length ? new Date(WROWS[WROWS.length-1].created_at).getTime() : Infinity;
    if(last < from) break;
    if(await wPage() <= 0) break;
  }
}

function wPick(){
  const from = spanFrom(PICK.apple.span);
  let rows = (from == null) ? WROWS.slice()
                            : WROWS.filter(r => new Date(r.created_at).getTime() >= from);
  const fl = PICK.apple.flow;
  if(fl === 'in')  rows = rows.filter(r => Number(r.amount) > 0);
  else if(fl === 'out') rows = rows.filter(r => Number(r.amount) < 0);
  return rows;
}

function wRow(r){
  const amt = Number(r.amount);
  const cls = amt >= 0 ? 'plus' : 'minus';
  const sign = amt >= 0 ? '+' : '−';
  return '<div class="wrow">'
    + '<span class="d">' + fmtDateShort(r.created_at) + '</span>'
    + '<span class="t">' + esc(r.label) + '</span>'
    + '<span class="a ' + cls + '">' + sign + Math.abs(amt).toFixed(2) + '</span>'
    + '<span class="b">' + Number(r.bal_after).toFixed(2) + '</span>'
    + '</div>';
}

/* 그리기 — 월별 묶음은 흔적 액자와 같은 문법(.pgroup/.pgh)을 그대로 쓴다 */
function paintWallet(){
  const box  = document.getElementById('wledger');
  const foot = document.getElementById('wposterFoot');
  if(!box) return;

  const rows = wPick();
  const t  = TSPAN.find(x => x.k === PICK.apple.span) || TSPAN[2];
  const fl = AFLOW.find(x => x.k === PICK.apple.flow) || AFLOW[0];

  if(!rows.length){
    /* ⚠ 「N개 남음」류 재촉 금지(헌장 9호). 없으면 없다고만 적는다 */
    box.innerHTML = '<div class="poster-load">'
      + (WROWS.length ? esc(t.label) + (fl.k === 'all' ? '' : ' · ' + esc(fl.label))
                        + ' 안에는 오간 것이 없습니다.'
                      : '아직 오간 것이 없습니다.') + '</div>';
    if(foot) foot.textContent = '';
    return;
  }

  const grp = (m, cells, n) => '<div class="pgroup"><div class="pgh">' + m
            + '<span class="n">' + n + '</span></div>' + cells + '</div>';
  let html = '', cur = null, cells = '', cnt = 0;
  for(const r of rows){                       /* 최신 → 오래된 */
    const m = pMonth(r.created_at);
    if(m !== cur){
      if(cur) html += grp(cur, cells, cnt);
      cur = m; cells = ''; cnt = 0;
    }
    cells += wRow(r); cnt++;
  }
  if(cur) html += grp(cur, cells, cnt);

  box.innerHTML = html;
  if(foot){
    const d = iso => { const x = new Date(iso);
      return x.getFullYear() + '.' + pad2(x.getMonth()+1) + '.' + pad2(x.getDate()); };
    foot.textContent = d(rows[rows.length-1].created_at) + ' — ' + d(rows[0].created_at);
  }
  /* ⚠⚠ 「전부」인데 첫 장이 짧아 종이가 안 넘치면 굴릴 것이 없다 → 더 긷지 못하고 멈춘다.
       그리고 나서 한 번 재어, 안 넘쳤으면 스스로 한 장 더 긷는다. */
  if(!WDONE && spanFrom(PICK.apple.span) == null){
    const p = document.getElementById('wposter');
    if(p && p.scrollHeight <= p.clientHeight + 4){
      wPage().then(n => { if(n > 0) paintWallet(); });
    }
  }
}

/* 액자를 열 때·목록을 고를 때 부르는 한 문 */
async function drawWallet(){
  const box = document.getElementById('wledger');
  if(box && !WROWS.length) box.innerHTML = '<div class="poster-load">출납부를 펴는 중…</div>';
  /* ⚠ showPanel은 await 없이 부른다 — 여기서 새는 예외는 아무도 안 받는다. 안에서 막는다 */
  try{ await wFill(); paintWallet(); }
  catch(e){
    console.warn('[EG] 출납부', e);
    if(box && !WROWS.length) box.innerHTML = '<div class="poster-load">출납부를 펴지 못했습니다.</div>';
  }
}

/* ⚠ 「전부」일 때만 이어 긷는다. 시간 축이 있으면 이미 다 담겼으므로 부를 것이 없다 */
function initWalletScroll(){
  const p = document.getElementById('wposter');
  if(!p) return;
  p.addEventListener('scroll', async () => {
    if(PANEL !== 'apple' || WDONE || WBUSY) return;
    if(spanFrom(PICK.apple.span) != null) return;
    if(p.scrollTop + p.clientHeight >= p.scrollHeight - 90){
      if(await wPage() > 0) paintWallet();
    }
  });
}

/* 지금 고른 것을 서버 인자로 옮긴다 */
function wArgs(off){
  const sp = TSPAN.find(t => t.k === (PICK.writing && PICK.writing.span)) || { days:null };
  const kd = (PICK.writing && PICK.writing.wkind) || 'all';
  return { p_kind: (kd === 'all' ? null : kd), p_days: sp.days,
           p_offset: off || 0, p_limit: WSTEP };

/* ⚠⚠ 우물 여덟을 화면에서 각각 길으면 안 된다.
     spoon_reactions · wunderkammer_books · wunderkammer_guestbook · popup_notes
     · palais_notes 는 SELECT 정책이 true 이고, college_traces 는 동료 흔적을
     보라고 열어 둔 문이 따로 있다(0816 실측). user_id 를 한 번만 빠뜨리면
     남의 글이 내 글모음에 선다. 서버 함수가 auth.uid() 로만 뽑는다. */
async function loadWritings(more){
  const box = document.getElementById('wlist');
  if(!box) return;
  if(!getUser()){ box.innerHTML = '<div class="wload">로그인이 필요합니다.</div>'; return; }
  const key = JSON.stringify([PICK.writing.span, PICK.writing.wkind]);
  if(!more || key !== WPAGE.key){ WPAGE = { off:0, done:false, busy:false, key }; WRITINGS = null; }
  if(WPAGE.busy || (more && WPAGE.done)) return;
  WPAGE.busy = true;
  if(!more) box.innerHTML = '<div class="wload">긷는 중…</div>';
  try{
    const r = await sbFetch('/rest/v1/rpc/get_my_writings', { method:'POST',
      body: JSON.stringify(wArgs(WPAGE.off)) }) || [];
    WRITINGS = more ? (WRITINGS || []).concat(r) : r;
    WPAGE.off  = (WRITINGS || []).length;
    WPAGE.done = r.length < WSTEP;
  }catch(e){
    if(!more){ box.innerHTML = '<div class="wload">글을 불러오지 못했습니다.</div>'; }
    WPAGE.done = true; WPAGE.busy = false; return;
  }
  WPAGE.busy = false;
  drawWritings();
  paintWritingSide();
}

    /* ⚠ 「N개 남음」류 재촉 금지(결정문 9호). 빈 것은 빈 대로 적는다 */
    box.innerHTML = '<div class="wload">'
      + ((PICK.writing.span !== 'all' || PICK.writing.wkind !== 'all')
          ? '고르신 갈래에는 글이 없습니다.' : '아직 남기신 글이 없습니다.') + '</div>';
    return;
  }
  /* ⚠ 30년 가는 곳이라 「08.16」만으로는 몇 해 것인지 모른다.
       해가 다르면 연도를 붙인다 — 올해 것은 짧게 남는다. */
  const now = new Date().getFullYear();
  const d = iso => { const x = new Date(iso);
    const mm = String(x.getMonth()+1).padStart(2,'0'), dd = String(x.getDate()).padStart(2,'0');
    return (x.getFullYear() === now ? '' : x.getFullYear() + '.') + mm + '.' + dd; };

  box.innerHTML = WRITINGS.map((w, n) => {
    const meta = WSRC[w.src] || { label:'', room:'', hue:'#8a6d3b' };
    /* ⭐ 제목이 있으면 「글」, 없으면 「인사」다 — 갈래를 손으로 안 매긴다(0816 소로) */
    const isWork = !!w.title;
    /* ⚠ 한스푼 머리글에는 줄바꿈이 들어 있다. 목록에서는 한 줄로 눕힌다 */
    const flat = t => String(t == null ? '' : t).replace(/\s*\n\s*/g, ' ').trim();
    const head = w.title || (flat(w.wher) || meta.room);
    const sub  = w.title ? (flat(w.wher) || meta.room) : '';
    /* ⚠ 콜레주만 본문이 둘이다. 요약과 소견은 성격이 다른 두 글이라 이어 붙이지 않는다 */
    const body = [w.body, w.body2].filter(Boolean)
      .map(t => '<p>' + esc(String(t)) + '</p>').join('');
    return '<div class="witem ' + (isWork ? 'w-work' : 'w-greet') + '"'
      +      ' style="--w-hue:' + meta.hue + '" data-n="' + n + '">'
      +   '<div class="wtop">'
      +     '<span class="wtag">' + esc(meta.label) + '</span>'
      +     '<span class="wdate">' + d(w.at) + '</span>'
      +     (w.pending ? '<span class="wpend">심사 중</span>' : '')
      +   '</div>'
      +   '<div class="wmain">'
      +     '<div class="wline">'
      +       '<span class="whead">' + esc(head) + '</span>'
      +       (isWork
             ? (sub ? '<span class="wwhere">' + esc(sub) + '</span>' : '')
             : '<div class="wbody">' + body + '</div>')
      +     '</div>'
      +     (isWork ? '<div class="wbody">' + body + '</div>' : '')
      +   '</div>'
      + '</div>';
  }).join('')
  + (WPAGE.done ? '' : '<button class="wmore" type="button" id="wmore">더 보기</button>');

  /* ⭐ 넘치는 글에만 「이어서 읽기 →」를 단다(0816 딱지 ㉡).
     ⚠ 짧은 글에 손잡이를 붙이면 눌러도 아무 일이 없어 고장으로 읽힌다. 실제로 재서 붙인다.
     ⚠ 재는 일은 그린 뒤에 해야 한다 — 붙기 전에는 scrollHeight 가 0이다. */
  box.querySelectorAll('.witem').forEach(el => {
    const b = el.querySelector('.wbody');
    if(!b || b.scrollHeight - b.clientHeight <= 3) return;
    el.classList.add('w-fold');
    const a = document.createElement('div');
    a.className = 'wmore-in'; a.textContent = '이어서 읽기 →';
    (el.querySelector('.wmain') || el).appendChild(a);
    el.onclick = () => {
      const on = el.classList.toggle('w-open');
      a.textContent = on ? '접기 ↑' : '이어서 읽기 →';
    };
  });
  const more = box.querySelector('#wmore');
  if(more) more.onclick = async () => { more.textContent = '긷는 중…'; await loadWritings(true); };
}

/* ══ 프로필 사진 — 자동 센터 정사각 크롭 + webp → avatars 버킷({uid}/avatar.webp) ══ */
// 단일 진실원: 한 번 올리면 자화상·(추후)maison 대문·에세이 닉네임 옆 등에서 avatar_url 참조
function squareCropWebp(file, size){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const side = Math.min(img.width, img.height);    // 짧은 변 기준 정사각
      const sx = (img.width  - side) / 2;
      const sy = (img.height - side) / 2;              // 중앙
      const cv = document.createElement('canvas');
      cv.width = size; cv.height = size;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      cv.toBlob(b => b ? resolve(b) : reject(new Error('이미지 변환에 실패했어요')), 'image/webp', 0.9);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 읽지 못했어요')); };
    img.src = url;
  });
}

let _avatarBusy = false;
async function onAvatarPick(files){
  if(!files || !files[0] || _avatarBusy) return;
  const user = getUser();
  if(!user){ alert('로그인이 필요합니다'); return; }
  _avatarBusy = true;
  const av = document.getElementById('p-avatar');
  if(av) av.classList.add('avatar-loading');
  try{
    const blob = await squareCropWebp(files[0], 400);
    const path = user.id + '/avatar.webp';
    const token = await getValidToken();
    const up = await fetch(SUPABASE_URL + '/storage/v1/object/avatars/' + path, {
      method:'POST',
      headers:{
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + (token || SUPABASE_KEY),
        'Content-Type': 'image/webp',
        'x-upsert': 'true'
      },
      body: blob
    });
    if(!up.ok){ const e = await up.json().catch(()=>({})); throw new Error(e.message || '업로드에 실패했어요'); }
    const url = SUPABASE_URL + '/storage/v1/object/public/avatars/' + path + '?t=' + Date.now(); // 캐시버스팅
    await sbFetch('/rest/v1/rpc/set_avatar', { method:'POST', body: JSON.stringify({ p_url: url }) });
    if(av) av.innerHTML = `<img src="${url}" alt="프로필">`;
  }catch(e){
    alert(e.message || '사진을 올리지 못했어요');
  }finally{
    _avatarBusy = false;
    if(av) av.classList.remove('avatar-loading');
    const inp = document.getElementById('avatar-file'); if(inp) inp.value = '';
  }
}

/* ══ 우편함 액자 — messages.html을 종이 자리에 앉힌다 ══════════
   ⚠ src는 열 때마다 새로 준다 — 방금 온 편지가 바로 보여야 한다.
   ⚠ 닫을 때 about:blank로 비운다 — 액자 뒤에서 계속 사는 것을 막는다. */
function mailFrame(on){
  const f = document.getElementById('mFrame');
  if(!f) return;
  if(on){
    /* ⚠ 기간(핀)은 iframe이 다 선 **뒤에** 건넨다 — 긷는 중에 건네면 허공에 진다.
       「전부」면 굳이 안 건넨다 — 저쪽 기본값이 이미 전부다 */
    f.onload = () => {
      if(f.src.includes('messages.html') && PICK.mail.span !== 'all') mailGo();
    };
    PICK.mail.span = tPin('mail') || 'all';   /* 핀은 열 때마다 다시 읽는다 */
    f.src = 'messages.html?persona=1';
  }else{
    f.onload = null;
    f.src = 'about:blank';
    loadMailSummary();                        /* 닫고 나면 봉랍을 다시 잰다 */
  }
}
/* ⋯ 조종간의 심부름 — iframe 안 우편함에 **기간**을 건넨다.
   ⚠ 받는 쪽은 messages.html의 mail-go 수신 다리(0817)다. 한쪽만 고치지 말 것.
   ⚠ iframe이 아직 긷는 중이면 말이 허공에 진다 — load에서 한 번 더 건넨다. */
function mailGo(){
  const f = document.getElementById('mFrame');
  if(!f || !f.contentWindow) return;
  const t = TSPAN.find(x => x.k === PICK.mail.span) || TSPAN[5];

/* 액자 안에서 한 통을 열면 알려 준다 — 봉랍을 다시 잰다.
   ⚠ 자화상도 평소 지구의 액자 안에 들어 있다(terra의 enterRoomUrl).
      우편함은 그 안의 또 한 겹이라, messages.html의 소식은 여기까지만 온다.

async function loadPoster(){
  const box = document.getElementById('poster');
  if(!box) return;
  try{
    const rows = await sbFetch('/rest/v1/stamps?select=' + encodeURIComponent(
      /* ⭐ 0816 소로 — 「도장의 비뚤어진 각도, 각인 디테일 다 살려야 해」
         rot·dx·dy는 수첩이 쓰던 값이다. 포스터도 같은 값을 쓴다 — 같은 도장이니까. */
      'inscription,stamped_at,art_url,ink_alpha,rot,dx,dy,' +
      /* ⭐ 0816 소로 — 「도장 몸통과 각인을 수첩과 완전히 동일하게」
         shape·with_time·inscribe_out 셋이 수첩 문법의 나머지다. */
      'stamp_kinds(code,title,area,ink,art_url,ref_type,shape,with_time,inscribe_out)') +
      '&order=stamped_at.asc');
    PSTAMPS = (rows || [])
      .filter(r => r.stamp_kinds && (r.art_url || r.stamp_kinds.art_url))
      .map(r => ({
        ins  : r.inscription || r.stamp_kinds.title || '',
        at   : r.stamped_at,
        art  : r.art_url || r.stamp_kinds.art_url,
        ink  : r.stamp_kinds.ink || '#16130F',
        a    : r.ink_alpha || 0.86,
        rot  : Number(r.rot) || 0,
        dx   : Number(r.dx)  || 0,
        dy   : Number(r.dy)  || 0,
        code : r.stamp_kinds.code,
        isStar: r.stamp_kinds.ref_type === 'star' || r.stamp_kinds.ref_type === 'star_any',
        shape : r.stamp_kinds.shape || 'circle',
        wtime : !!r.stamp_kinds.with_time,
        insOut: !!r.stamp_kinds.inscribe_out,
        univ : univOf(r.stamp_kinds.code)
      }))
      /* ⚠ 0814 시험에서 잡음 — 서버가 준 차례를 믿지 않는다.
         한 줄이라도 어긋나면 달 묶음이 두 번 서고 맨 끝 날짜가 틀린다.
         질의에 order가 붙어 있어도 여기서 한 번 더 세운다.
         ⭐ 0816 소로 — 최신이 맨 위 왼쪽. 내림차례다. */
      .sort((x, y) => new Date(y.at) - new Date(x.at));
  }catch(e){
    box.innerHTML = '<div class="poster-load">여정을 펴지 못했습니다</div>';
    return;
  }
  drawPoster();
  paintCredSide();
}

function pDay(iso){ const d = new Date(iso);
  return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }

/* ⭐ 0816 — 수첩(credencial)의 판형 표를 그대로 들여온다.
   ⚠ 값을 고치지 말 것. 두 화면이 어긋나는 순간 「같은 도장」이 아니게 된다.
     수첩이 바뀌면 여기도 함께 올린다. */
const SHAPE = {
  circle:[99,99],   oval_v:[84,111],  oval_h:[132,84],
  rect_v:[78,109],  rect_h:[132,102], square_r:[99,106],
  hex:[110,102],    oct:[106,104],    shield:[90,109],
  arch:[78,111],    penta:[85,109],   diamond:[105,106]
};
const pad2 = v => v < 10 ? '0' + v : '' + v;

/* 한 칸 안에서 판형 비율대로 도장을 앉힌다 — 가로로 긴 도장이 안 찌그러지게 */
function pCell(st, box){
  const sh = SHAPE[st.shape] || SHAPE.circle;
  const sc = Math.min(box / sh[0], box / sh[1]);
  const w  = sh[0] * sc, h = sh[1] * sc;
  const at = new Date(st.at);
  let ds = at.getFullYear() + '.' + pad2(at.getMonth()+1) + '.' + pad2(at.getDate());
  if(st.wtime) ds += ' ' + pad2(at.getHours()) + ':' + pad2(at.getMinutes());

  /* ⚠ 각인 자리는 수첩과 같은 공식이다 — 밖 1.04h · 안 0.70h.
     수첩은 그림을 재서 잉크 바닥에 더 붙이지만, 여기서는 폴백이 먼저다(함정 AE). */
  const iy  = Math.round(h * (st.insOut ? 1.04 : 0.70));
  const dy2 = Math.round(h * 1.04);
  const ins = st.insOut
    ? `<div class="ins" style="color:${esc(st.ink)};top:${iy}px">`
      + (st.ins ? `<div class="t">${esc(st.ins)}</div>` : '')
      + `<div class="d">${ds}</div></div>`
    : (st.ins ? `<div class="ins inside" style="color:${esc(st.ink)};top:${iy}px">`
                + `<div class="t">${esc(st.ins)}</div></div>` : '')
      + `<div class="ins dateout" style="color:${esc(st.ink)};top:${dy2}px">`
      + `<div class="d">${ds}</div></div>`;

  return `<div class="pcell"><div class="stamp" style="width:${w.toFixed(1)}px;`
    + `height:${h.toFixed(1)}px;transform:rotate(${st.rot.toFixed(1)}deg) `
    + `translate(${st.dx.toFixed(1)}px,${st.dy.toFixed(1)}px);`
    + `opacity:${Number(st.a).toFixed(2)}">`
    + `<div class="ink" style="-webkit-mask-image:url('${esc(st.art)}');`
    + `mask-image:url('${esc(st.art)}');background:${esc(st.ink)}"></div>`
    + ins + `</div></div>`;
}
function pGroup(head, cells){
  return `<div class="pgroup"><div class="pgh">${esc(head)}</div>`
    + `<div class="pgrid">${cells}</div></div>`;
}
function pMonth(iso){ const d = new Date(iso); return `${d.getFullYear()}. ${pad2(d.getMonth()+1)}`; }

/* 고른 시간 안의 것만 남긴다 — 경계는 지갑과 같은 자(spanFrom)로 잰다 */
function tRows(){
  const from = spanFrom(PICK.traces.span);
  if(from == null) return PSTAMPS.slice();
  return PSTAMPS.filter(st => new Date(st.at).getTime() >= from);
}

function drawPoster(){
  const box  = document.getElementById('poster');
  const foot = document.getElementById('posterFoot');
  if(!box) return;

  const rows = tRows();
  const t = TSPAN.find(x => x.k === PICK.traces.span) || TSPAN[2];

  if(!rows.length){
    /* ⚠ 「N개 남음」류 재촉 금지(9호). 없으면 없다고만 적는다 */
    box.innerHTML = '<div class="poster-load">'
      + (PSTAMPS.length ? esc(t.label) + ' 안에는 찍힌 도장이 없습니다.'
                        : '아직 첫 도장을 받지 않으셨습니다.') + '</div>';
    if(foot) foot.textContent = '';
    return;
  }

  /* 한 칸 크기 — 격자 폭에서 나온다. 판형은 이 안에 비율대로 앉는다 */
  const CELL = 112;
  let html = '', cur = null, cells = '';
  for(const st of rows){                    /* 최신 → 오래된 */
    const m = pMonth(st.at);
    if(m !== cur){ if(cur) html += pGroup(cur, cells); cur = m; cells = ''; }
    cells += pCell(st, CELL);
  }
  if(cur) html += pGroup(cur, cells);

  box.innerHTML = html;
  box.scrollTop = 0;
  if(foot){
    const d = iso => { const x = new Date(iso);
      return `${x.getFullYear()}.${pad2(x.getMonth()+1)}.${pad2(x.getDate())}`; };
    /* 최신이 앞이므로 끝이 첫 도장이다 */
    foot.textContent = d(rows[rows.length-1].at) + ' — ' + d(rows[0].at);
  }
}

/* ══ 액자 밖 목록 — 동그라미 ⋯ 를 누르면 글자로 펼쳐진다 ══════════ */
function drawTDrop(){
  const dp = document.getElementById('tr-drop');
  const f  = FRAMED[PANEL];
  if(!dp || !f) return;
  const pin = tPin(PANEL);
  let html = '';
  f.menu.forEach((mk, i) => {
    const m = MENUS[mk]; if(!m) return;
    if(i) html += '<div class="tr-sep"></div>';
    if(m.title) html += `<div class="tr-gh">${esc(m.title)}</div>`;
    const cur = PICK[PANEL][mk];
    html += m.items.map(t =>
      `<div class="tr-item${t.k === cur ? ' on' : ''}" data-mk="${mk}" data-k="${t.k}" `
      + `role="button" tabindex="0">`
      + `<span class="lb">${esc(t.label)}</span>`
      + `<span class="ck">✓</span>`
      + (m.pin ? `<button class="tr-pin${pin === t.k ? ' on' : ''}" data-pin="${t.k}" `
               + `type="button" title="여기서 열리게 고정">📌</button>` : '')
      + `</div>`).join('');
  });
  dp.innerHTML = html;
}
function openTDrop(on){
  const dp = document.getElementById('tr-drop'), bt = document.getElementById('tr-dots');

  /* ⚠⚠ 0816 소로 신고 — 자화상은 **지구(terra)의 액자 안에서도** 열린다.
       제 창으로 index를 열면 로그인 화면이 액자 안에 갇히고, 액자의 문고리(‹)만
       위에 남는다. 그 안에서 로그인하면 terra가 통째로 액자에 들어가 타륜이 두 겹이 된다.
     ⭐ 나가는 문은 **최상위**로 낸다. 액자 밖에서 열렸으면 top === self 라 그대로 같은 일을 한다.
     ⚠ terra 쪽에도 받는 곳 방어를 두었다(0816b). 여기가 먼저 막고, 거기가 그물이다.
     ⚠ 딱지 — 타륜의 egLogout은 supa.auth.signOut()까지 부른다. 자화상은 REST를 직접 쓰는

  try{ (window.top || window).location.replace('index.html'); }
  catch(e){ location.replace('index.html'); }
}
