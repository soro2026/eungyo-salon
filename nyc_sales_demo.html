<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>EG · 뉴욕 영업 캡처판 v3 — Midtown Spires</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.123.0/Cesium.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.123.0/Widgets/widgets.css" rel="stylesheet" />

<style>
  html,body{ margin:0; padding:0; height:100%; background:#05070f; overflow:hidden;
             font-family:'Helvetica Neue',Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  #cesiumContainer{ position:absolute; inset:0; }
  #cesiumContainer.edit{ cursor:crosshair; }
  .cesium-viewer-bottom, .cesium-widget-credits{ display:none !important; }

  .box{
    position:absolute; z-index:20; width:232px;
    background:rgba(10,14,26,.9); border:1px solid #c9a227; border-radius:12px;
    padding:13px 13px 11px; color:#e8e6df; backdrop-filter:blur(6px);
    box-shadow:0 8px 26px rgba(0,0,0,.55);
  }
  #panel{ left:16px; top:16px; }
  #editor{ right:16px; top:16px; width:252px; }

  .box h1{ margin:0 0 2px; font-size:13px; font-weight:700; color:#f2e9cf; letter-spacing:.02em; }
  .box .sub{ font-size:11px; color:#8d94a8; margin-bottom:11px; line-height:1.45; }
  .grp{ margin-bottom:10px; }
  .grp > .lab{ font-size:10px; color:#8d94a8; letter-spacing:.09em; margin-bottom:5px; text-transform:uppercase; }
  .row{ display:flex; gap:5px; flex-wrap:wrap; }
  .row button{
    flex:1 1 46%; padding:6px 0; font-size:11px; font-weight:600; cursor:pointer;
    background:rgba(255,255,255,.05); color:#c2c7d4;
    border:1px solid rgba(201,162,39,.3); border-radius:7px; transition:.14s; font-family:inherit;
  }
  .row button:hover{ background:rgba(201,162,39,.16); color:#f2e9cf; }
  .row button.on{ background:#c9a227; color:#161006; border-color:#c9a227; }
  .row button:focus-visible{ outline:2px solid #fff; outline-offset:1px; }

  .fld{ display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .fld label{ font-size:10.5px; color:#8d94a8; width:56px; flex:none; }
  .fld input[type=range]{ flex:1; accent-color:#c9a227; height:3px; }
  .fld .val{ font-size:10.5px; color:#e8e6df; width:50px; text-align:right; font-variant-numeric:tabular-nums; }
  .fld input[type=number]{
    flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(201,162,39,.28);
    border-radius:6px; color:#e8e6df; font-size:11px; padding:4px 6px; font-family:inherit;
    font-variant-numeric:tabular-nums;
  }
  #hint{
    margin:9px 0 4px; padding:8px 9px; border-radius:8px; font-size:10.5px; line-height:1.55;
    background:rgba(201,162,39,.12); border:1px solid rgba(201,162,39,.3); color:#e8e6df;
  }
  #hint b{ color:#f2e9cf; }
  #hint.sel{ background:rgba(47,111,181,.2); border-color:#5b8fd6; }
  .btns{ display:flex; gap:5px; margin-top:8px; }
  .btns button{ flex:1; padding:7px 0; font-size:11px; font-weight:600; cursor:pointer;
    border-radius:7px; font-family:inherit; border:1px solid rgba(201,162,39,.3);
    background:rgba(255,255,255,.05); color:#c2c7d4; }
  .btns button:hover{ background:rgba(201,162,39,.16); color:#f2e9cf; }
  #copy{ background:#c9a227; color:#161006; border-color:#c9a227; }
  #copy.done{ background:#2f7a55; color:#eafff2; border-color:#2f7a55; }

  #legend{ margin-top:10px; padding-top:9px; border-top:1px solid rgba(201,162,39,.24); }
  .lg{ display:flex; align-items:center; gap:7px; font-size:11px; margin-bottom:4px; color:#c2c7d4; }
  .lg i{ width:9px; height:9px; border-radius:50%; flex:none; box-shadow:0 0 0 1.5px #05070f; }
  .lg em{ font-style:normal; color:#8d94a8; margin-left:auto; font-size:10px; }
  #readout{ margin-top:9px; padding-top:8px; border-top:1px solid rgba(201,162,39,.24);
            font-size:10.5px; color:#8d94a8; line-height:1.6; white-space:pre-line; }
  #readout b{ color:#e8e6df; font-weight:600; }

  #loader{ position:absolute; inset:0; z-index:40; display:grid; place-items:center;
           background:#05070f; color:#c9a227; font-size:13px; letter-spacing:.06em; transition:opacity .6s; }
  #loader.gone{ opacity:0; pointer-events:none; }
  @media (prefers-reduced-motion: reduce){ #loader{ transition:none; } }
  @media (max-width:900px){ #editor{ display:none; } }
</style>
</head>
<body>

<div id="cesiumContainer"></div>

<div class="box" id="panel">
  <h1>Midtown Spires</h1>
  <div class="sub">한 채 = 3 Cell · 27슬롯<br>Territory 8채 = 655,200원</div>

  <div class="grp">
    <div class="lab">빌딩</div>
    <div class="row" id="rowBld"></div>
  </div>

  <div class="grp">
    <div class="lab">보이는 면 · 한 번에 6~7명</div>
    <div class="row" id="rowFace">
      <button data-f="East" class="on">East</button>
      <button data-f="South">South</button>

  <div class="grp">
    <div class="lab">명패 방향</div>
    <div class="row" id="rowSide">
      <button data-s="auto" class="on">면 따라</button>
      <button data-s="right">오른쪽</button>
      <button data-s="left">왼쪽</button>
      <button data-s="center">가운데</button>

  </div>

  <div class="grp">
    <div class="lab">명패</div>
    <div class="row" id="rowLab">
      <button data-l="nick" class="on">닉네임</button>
      <button data-l="full">＋층</button>
      <button data-l="dot">점만</button>
    </div>
  </div>

  <div id="legend"></div>

</div>

<div class="box" id="editor">
  <h1>좌표 편집</h1>
  <div class="sub" id="edName">—</div>

  <div class="grp">
    <div class="lab">손짓</div>
    <div class="row" id="rowMode">
      <button data-m="view" class="on">보기</button>
      <button data-m="face">면 맞추기</button>
      <button data-m="pin">핀 하나</button>
    </div>
  </div>

  <div id="hint">화면을 자유롭게 돌려 보십시오.</div>

  <div class="fld"><label>위도</label><input type="number" id="inLat" step="0.000001"></div>
  <div class="fld"><label>경도</label><input type="number" id="inLng" step="0.000001"></div>
  <div class="fld"><label>벽 거리</label>
    <input type="range" id="inPush" min="0" max="60" step="1" value="14">
    <span class="val" id="vPush">14m</span></div>
  <div class="fld"><label>바닥 보정</label>
    <input type="range" id="inBase" min="-60" max="60" step="1" value="0">
    <span class="val" id="vBase">0m</span></div>
  <div class="fld"><label>시작 층</label>
    <input type="range" id="inFrom" min="1" max="100" step="1" value="61">
    <span class="val" id="vFrom">61F</span></div>

  <div class="btns">
    <button id="undo">되돌리기</button>
    <button id="copy">값 복사</button>
  </div>
</div>

<div id="loader">미드타운으로 갑니다…</div>

<script>
/* ══════════════════════════════════════════════════════════════
   EG · 뉴욕 영업 캡처판 v3 — 0828 밤
   v2에서 고친 것 둘
     ① ⚠⚠ 색을 파트너마다 갈랐던 것을 무른다.
        0718 「지도 핀 종족 범례」 — 색은 범주, 이름은 개체.
        콩파뇽 옐로 · 출판사 버건디 하나 · 채널 청록 · EG 성소 하늘색.
     ② ⭐ 짚어 옮기기 — terra 벽감 편집기와 같은 손짓
        (핀 선택 → 새 지점 클릭). 여기에 「면 맞추기」를 얹었다.
   ══════════════════════════════════════════════════════════════ */

const GOOGLE_API_KEY = "AIzaSyAAKQijLeTABmyi25BX4_qGsgghOhQCa6A";

/* ⭐ 0718 종족 범례 — 색은 종족이다 */
const C = {
  compagnon: "#f1c40f",   // 2 · 메종 옐로 (기존 고정 · 건드리지 않음)
  press:     "#8e2d2d",   // 4 · 출판사 버건디 — 민음사·문학동네·창비 한 색
  channel:   "#16a085",   // 7 · 2차 협업 채널 청록 — 일당백
  sanctum:   "#3498db",   // 8 · 콤포스텔라·273 하늘색
  gold:      "#c9a227"    // 빌딩 머리 명패
};

/* ⭐ 좌표 6자리 (0625 수칙) */
const BUILDINGS = [
  { key:"esb", name:"Empire State Building", lat:40.748817, lng:-73.985428,
    floors:102, roof:380.2, from:61, push:20, base:0,
    cam:{ lng:-73.98150, lat:40.74450, alt:430, heading:325, pitch:-19 } },
  { key:"chr", name:"Chrysler Building", lat:40.751652, lng:-73.975311,
    floors:77, roof:282.0, from:61, push:13, base:0,
    cam:{ lng:-73.97200, lat:40.74850, alt:350, heading:328, pitch:-16 } },
  { key:"van", name:"One Vanderbilt", lat:40.752971, lng:-73.978322,
    floors:93, roof:427.0, from:61, push:16, base:0,
    cam:{ lng:-73.97480, lat:40.74960, alt:470, heading:330, pitch:-17 } },
  { key:"col", name:"Collège de Compostella · EG", lat:40.741061, lng:-73.989699,
    floors:22, roof:86.9, from:4, push:11, base:0, direct:true,
    cam:{ lng:-73.98760, lat:40.73860, alt:210, heading:330, pitch:-15 } }
];

/* 면 = 방위. 한 면에 6~7명 · 네 면 합 27 */
const FACES = [
  { ko:"East",  b: 90, n:7 },
  { ko:"South", b:180, n:7 },
  { ko:"West",  b:270, n:7 },
  { ko:"North", b:  0, n:6 }
];

/* 입주자 — 사람이 대다수이고 기관이 드문드문 섞인다 */
const PEOPLE = [
 "lonelywalden","Puffin","marie","pascal","Hyun","bartleby","gregor",
 "zorba","meursault","godot","Sylvia","Adrienne","noctua","inkwell",
 "quietriver","olive","Juno","salinger","mistral","tumbleweed","perec",
 "ariadne","kestrel","lantern","Sonya","almond","seolhwa","driftwood",
 "vireo","copperplate","monsieur","nightjar","clover","ptarmigan",
 "Beatrice","fennel","halcyon","Rilke","pomelo","zelkova","wren",
 "aubade","citron","molloy","tanager","kolibri","samovar","linden"
];
const PRESS   = ["민음사","문학동네","창비"];
const CHANNEL = ["일당백"];
const ROOMS   = ["Bibliothèque","Salle 273","Réfectoire","Atelier","Le Toit","Le Jardin","La Cave"];

let viewer, tileset, groundH = 0, handler;
let cur = "chr", face = "East", labMode = "nick", mode = "view", labSide = "auto";
let sel = null;                 // 선택된 핀
const FIX = {};                 // 개별 좌표 덮어쓰기  key → {lng,lat,h}
const HIST = [];                // 되돌리기

function offsetLL(lat, lng, bearingDeg, dist){
  const R = 6378137, br = bearingDeg*Math.PI/180;
  return {
    lat: lat + (dist*Math.cos(br))/R*180/Math.PI,
    lng: lng + (dist*Math.sin(br))/(R*Math.cos(lat*Math.PI/180))*180/Math.PI
  };
}
const B  = k => BUILDINGS.find(b=>b.key===k);
const $  = id => document.getElementById(id);
const FC = () => FACES.find(x=>x.ko===face);

/* 한 채 27슬롯 — 사람 · 출판사 · 채널이 섞여 산다 */
function occupant(b, gi){
  if (b.direct) return { name: ROOMS[gi % ROOMS.length], color: C.sanctum, fg:"#f7efe0" };
  if (gi % 9 === 4)  return { name: PRESS[Math.floor(gi/9) % PRESS.length], color: C.press,   fg:"#ffffff" };
  if (gi % 13 === 7) return { name: CHANNEL[0],                             color: C.channel, fg:"#ffffff" };
  return { name: PEOPLE[gi % PEOPLE.length], color: C.compagnon, fg:"#161006" };
}

async function init(){
  viewer = new Cesium.Viewer("cesiumContainer", {
    baseLayer:false, baseLayerPicker:false, geocoder:false, homeButton:false,
    sceneModePicker:false, navigationHelpButton:false, animation:false,
    timeline:false, fullscreenButton:false, infoBox:false, selectionIndicator:false,
    requestRenderMode:false
  });
  const s = viewer.scene;
  s.globe.show = true;
  s.globe.baseColor = Cesium.Color.fromCssColorString("#0a1326");
  s.skyAtmosphere.show = true;
  viewer.clock.clockStep = Cesium.ClockStep.SYSTEM_CLOCK;
  viewer.clock.shouldAnimate = true;

  try { tileset = await Cesium.createGooglePhotorealistic3DTileset(GOOGLE_API_KEY); }
  catch(e){ tileset = await Cesium.createGooglePhotorealistic3DTileset({ key: GOOGLE_API_KEY }); }
  s.primitives.add(tileset);
  try{
    tileset.skipLevelOfDetail = false;
    tileset.dynamicScreenSpaceError = true;
    tileset.dynamicScreenSpaceErrorDensity = 0.00278;
    tileset.cacheBytes = 1024*1024*1024;
    tileset.preloadWhenHidden = true;
  }catch(e){ console.warn("타일셋 옵션 일부 미적용:", e); }

  buildTabs(); drawLegend(); wireAll();
  flyTo(cur, true);
  await measureGround();
  syncEditor(); draw();
  $("loader").classList.add("gone");
}

/* 바닥은 짐작하지 않고 잰다 — 둘레 90m 고리의 최저값이 길이다 */
async function measureGround(){
  const b = B(cur), pts = [];
  for (let d=0; d<360; d+=30){
    const o = offsetLL(b.lat, b.lng, d, 90);
    pts.push(Cesium.Cartesian3.fromDegrees(o.lng, o.lat));
  }
  try{
    const hit = await viewer.scene.clampToHeightMostDetailed(pts);
    const hs = hit.filter(Boolean).map(c=>Cesium.Cartographic.fromCartesian(c).height)
                  .filter(h=>Number.isFinite(h));
    if (hs.length) groundH = Math.min(...hs);
  }catch(e){ console.warn("바닥 측정 실패 — 0m:", e); }
}

/* ⚠⚠ 0828 소로 — 「가운데 맞춤이라 반이 건물에 묻혀버림」.
   파리는 핀이 옆으로 퍼져 CENTER 가 맞았는데, 뉴욕은 세로 한 줄이라
   명패 왼쪽 절반이 벽 속으로 들어간다. ⭐ 핀은 못, 글자는 밖으로 나부끼는 깃발.
   side: "right" | "left" | "center" */
function plate(text, bg, fg, big, alwaysTop, side){
  const s = side || "center";
  const ho = s==="right" ? Cesium.HorizontalOrigin.LEFT
           : s==="left"  ? Cesium.HorizontalOrigin.RIGHT
           : Cesium.HorizontalOrigin.CENTER;
  const dx = s==="right" ? 12 : s==="left" ? -12 : 0;
  const dy = s==="center" ? -10 : 0;      /* 옆으로 나가면 위로 안 올려도 된다 */
  return {
    text, font:(big?"bold 13px ":"bold 12px ")+"'Helvetica Neue',Arial,sans-serif",
    fillColor: Cesium.Color.fromCssColorString(fg),
    outlineColor: Cesium.Color.fromCssColorString("#0a0e1a"),
    outlineWidth:3, style: Cesium.LabelStyle.FILL_AND_OUTLINE,
    showBackground:true,
    backgroundColor: Cesium.Color.fromCssColorString(bg).withAlpha(.95),
    backgroundPadding: new Cesium.Cartesian2(big?10:8, big?6:4),
    pixelOffset: new Cesium.Cartesian2(dx, dy),
    horizontalOrigin: ho,
    verticalOrigin: s==="center" ? Cesium.VerticalOrigin.BOTTOM : Cesium.VerticalOrigin.CENTER,
    /* 가림 — 뒷면 핀은 건물이 가린다 */
    disableDepthTestDistance: alwaysTop ? Number.POSITIVE_INFINITY : 0
  };
}

/* ⭐ 면마다 나가는 쪽이 달라야 건물 바깥으로 간다 */
const SIDE_BY_FACE = { East:"right", South:"right", West:"left", North:"left" };
function sideNow(){ return labSide==="auto" ? (SIDE_BY_FACE[face]||"right") : labSide; }

function draw(){
  viewer.entities.removeAll(); sel = null;
  const b  = B(cur), f = FC();
  const fh = b.roof / b.floors;
  const g  = groundH + b.base;
  const span = Math.max(1, b.floors - b.from + 1);
  const base = BUILDINGS.indexOf(b)*27 + FACES.indexOf(f)*7;

  viewer.entities.add({
    id:"cap",
    position: Cesium.Cartesian3.fromDegrees(b.lng, b.lat, g + b.roof + 28),
    point:{ pixelSize:9, color:Cesium.Color.fromCssColorString(b.direct?C.sanctum:C.gold),
            outlineColor:Cesium.Color.fromCssColorString("#05070f"), outlineWidth:2,
            disableDepthTestDistance:Number.POSITIVE_INFINITY },
    label: plate(b.direct ? b.name : b.name+"  ·  3 Cell · 27",
                 b.direct?C.sanctum:C.gold, b.direct?"#f7efe0":"#161006", true, true, "center")
  });

  for (let i=0; i<f.n; i++){
    const key = `${b.key}:${f.ko}:${i}`;
    const fl  = Math.min(b.floors, Math.round(b.from + span*((i+0.5)/f.n)));
    const o   = occupant(b, base+i);
    const fx  = FIX[key];
    const p   = fx ? { lng:fx.lng, lat:fx.lat } : offsetLL(b.lat, b.lng, f.b, b.push);
    const h   = fx ? fx.h : g + fl*fh;

    const ent = viewer.entities.add({
      id:"slot-"+i,
      position: Cesium.Cartesian3.fromDegrees(p.lng, p.lat, h),
      point:{ pixelSize:7, color:Cesium.Color.fromCssColorString(o.color),
              outlineColor:Cesium.Color.fromCssColorString("#05070f"), outlineWidth:2,
              disableDepthTestDistance:0 },
      label: labMode==="dot" ? undefined
           : plate(labMode==="full" ? `${o.name}  ${fl}F` : o.name, o.color, o.fg, false, false, sideNow())
    });
    ent._slot = { key, color:o.color, name:o.name };
  }

  $("readout").innerHTML =
    `잰 바닥 <b>${groundH.toFixed(1)}m</b>  보정 <b>${b.base>0?"+":""}${b.base}m</b>\n` +
    `${b.from}층 위 · <b>${f.ko}</b> 면 <b>${f.n}명</b> · 네 면 합 <b>27</b>\n` +
    (b.direct ? `⭐ <b>직영</b> — 팔지 않음` : `한 채 = <b>3 Cell · 81,900원</b>`);
}

function drawLegend(){
  $("legend").innerHTML =
    `<div class="lg"><i style="background:${C.compagnon}"></i>콩파뇽<em>EG 개인</em></div>` +
    `<div class="lg"><i style="background:${C.press}"></i>출판사<em>파트너</em></div>` +
    `<div class="lg"><i style="background:${C.channel}"></i>지식 채널<em>파트너</em></div>` +
    `<div class="lg"><i style="background:${C.sanctum}"></i>콜레주<em>EG 직영</em></div>`;
}

function buildTabs(){
  $("rowBld").innerHTML = BUILDINGS.map(b=>{
    const short = b.direct ? "콜레주"
      : b.key==="esb" ? "엠파이어" : b.key==="chr" ? "크라이슬러" : "밴더빌트";
    return `<button data-b="${b.key}"${b.key===cur?' class="on"':''}>${short}</button>`;
  }).join("");
}

function flyTo(key, instant){
  const c = B(key).cam;
  const opt = {
    destination: Cesium.Cartesian3.fromDegrees(c.lng, c.lat, c.alt),
    orientation:{ heading:Cesium.Math.toRadians(c.heading),
                  pitch:Cesium.Math.toRadians(c.pitch), roll:0 }
  };
  if (instant) viewer.camera.setView(opt); else viewer.camera.flyTo({ ...opt, duration:1.6 });
}

/* ══ 짚어 옮기기 ══════════════════════════════════════════════
   ⭐ terra 벽감 편집기와 같은 손짓 — 핀 선택 → 새 지점 클릭.
   pickPosition 은 3D 타일 표면의 진짜 한 점을 준다: 위경도 + 고도.
   그래서 벽을 짚으면 「어느 면 · 몇 층」이 한 번에 정해진다. */
function setHint(html, on){
  $("hint").innerHTML = html;
  $("hint").classList.toggle("sel", !!on);
}

function hintFor(){
  if (mode === "view") return setHint("화면을 자유롭게 돌려 보십시오.");
  if (mode === "face") return setHint("⭐ <b>벽 한 곳을 짚으면</b> 이 면 핀이 통째로 그 벽에 붙습니다.");
  return setHint(sel ? `⭐ <b>${sel._slot.name}</b> 선택됨 — 새 지점을 짚으면 옮겨집니다.`
                     : "핀 하나를 짚어 고르십시오.", !!sel);
}

function pickWorld(pos){
  if (!viewer.scene.pickPositionSupported) return null;
  const cart = viewer.scene.pickPosition(pos);
  if (!Cesium.defined(cart)) return null;
  const c = Cesium.Cartographic.fromCartesian(cart);
  return { lng: Cesium.Math.toDegrees(c.longitude), lat: Cesium.Math.toDegrees(c.latitude), h: c.height };
}

function wireAll(){
  handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
  handler.setInputAction(mv=>{
    if (mode === "view") return;
    const b = B(cur);

    /* ① 면 맞추기 — 벽을 짚으면 면 법선 방향 거리를 계산해 push 로 삼는다 */
    if (mode === "face"){
      const w = pickWorld(mv.position); if (!w) return;
      const R = 6378137, rad = Math.PI/180;
      const dN = (w.lat - b.lat) * rad * R;
      const dE = (w.lng - b.lng) * rad * R * Math.cos(b.lat*rad);
      const br = FC().b * rad;
      const along = dN*Math.cos(br) + dE*Math.sin(br);   // 면 법선으로 투영
      HIST.push({ t:"push", key:b.key, v:b.push });
      b.push = Math.max(0, Math.round(along));
      $("inPush").value = b.push; $("vPush").textContent = b.push+"m";
      const fl = Math.round((w.h - groundH - b.base) / (b.roof/b.floors));
      setHint(`⭐ 벽 거리 <b>${b.push}m</b> · 짚은 높이 <b>${w.h.toFixed(0)}m</b> ≈ <b>${fl}층</b>`);
      draw();
      return;
    }

    /* ② 핀 하나 — 선택 후 새 지점 */
    const picked = viewer.scene.pick(mv.position);
    if (picked && picked.id && picked.id._slot){
      sel = picked.id;
      sel.point.color = Cesium.Color.fromCssColorString("#ffffff");
      sel.point.pixelSize = 11;
      hintFor();
      return;
    }
    if (sel){
      const w = pickWorld(mv.position); if (!w) return;
      HIST.push({ t:"fix", key:sel._slot.key, v: FIX[sel._slot.key] || null });
      FIX[sel._slot.key] = { lng:w.lng, lat:w.lat, h:w.h };
      const fl = Math.round((w.h - groundH - b.base) / (b.roof/b.floors));
      draw();
      setHint(`⭐ 옮겼습니다 — 높이 <b>${w.h.toFixed(0)}m</b> ≈ <b>${fl}층</b>`);
    }
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
}

function syncEditor(){
  const b = B(cur);
  $("edName").textContent = b.name;
  $("inLat").value = b.lat.toFixed(6);
  $("inLng").value = b.lng.toFixed(6);
  $("inPush").value = b.push; $("vPush").textContent = b.push+"m";
  $("inBase").value = b.base; $("vBase").textContent = (b.base>0?"+":"")+b.base+"m";
  $("inFrom").max = b.floors;
  $("inFrom").value = b.from; $("vFrom").textContent = b.from+"F";
  $("copy").classList.remove("done"); $("copy").textContent = "값 복사";
  hintFor();
}

function applyLL(){
  const b = B(cur);
  const la = parseFloat($("inLat").value), ln = parseFloat($("inLng").value);
  if (Number.isFinite(la)) b.lat = la;
  if (Number.isFinite(ln)) b.lng = ln;
  draw();
}
$("inLat").addEventListener("change", applyLL);
$("inLng").addEventListener("change", applyLL);
$("inPush").addEventListener("input", e=>{
  B(cur).push = Number(e.target.value); $("vPush").textContent = e.target.value+"m"; draw(); });
$("inBase").addEventListener("input", e=>{
  B(cur).base = Number(e.target.value);
  $("vBase").textContent = (e.target.value>0?"+":"")+e.target.value+"m"; draw(); });
$("inFrom").addEventListener("input", e=>{
  B(cur).from = Number(e.target.value); $("vFrom").textContent = e.target.value+"F"; draw(); });

$("undo").addEventListener("click", ()=>{
  const h = HIST.pop();
  if (!h){ setHint("되돌릴 것이 없습니다."); return; }
  if (h.t === "push"){ B(h.key).push = h.v; $("inPush").value = h.v; $("vPush").textContent = h.v+"m"; }
  if (h.t === "fix"){ if (h.v) FIX[h.key] = h.v; else delete FIX[h.key]; }
  draw(); setHint("한 걸음 되돌렸습니다.");
});

$("copy").addEventListener("click", ()=>{
  const b = B(cur);
  let txt = `{ key:"${b.key}", name:"${b.name}", lat:${b.lat.toFixed(6)}, lng:${b.lng.toFixed(6)}, `
          + `floors:${b.floors}, roof:${b.roof}, from:${b.from}, push:${b.push}, base:${b.base} }`;
  const mine = Object.entries(FIX).filter(([k])=>k.startsWith(b.key+":"));
  if (mine.length){
    txt += "\n// 개별 좌표\n" + mine.map(([k,v])=>
      `"${k}": { lng:${v.lng.toFixed(6)}, lat:${v.lat.toFixed(6)}, h:${v.h.toFixed(1)} },`).join("\n");
  }
  navigator.clipboard.writeText(txt).then(()=>{
    $("copy").textContent = "복사했습니다"; $("copy").classList.add("done");
  }).catch(()=>{ $("copy").textContent = "콘솔 확인"; console.log(txt); });
});

function wire(id, fn){
  $(id).addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    [...e.currentTarget.children].forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); fn(b.dataset);
  });
}
wire("rowBld", async d=>{
  cur = d.b; flyTo(cur, false); await measureGround(); syncEditor(); draw(); });
wire("rowFace", d=>{ face = d.f; draw(); hintFor(); });
wire("rowLab",  d=>{ labMode = d.l; draw(); });
wire("rowSide", d=>{ labSide = d.s; draw(); });
wire("rowMode", d=>{
  mode = d.m; sel = null;
  $("cesiumContainer").classList.toggle("edit", mode !== "view");
  draw(); hintFor();
});

init().catch(e=>{
  console.error("[EG] 캡처판이 끝까지 가지 못했습니다:", e);
  $("loader").textContent = "지구를 못 띄웠습니다. 콘솔을 보세요.";
});
</script>
