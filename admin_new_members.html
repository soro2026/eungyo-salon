<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신규 회원 · 은교살롱 admin</title>
<style>
  :root{
    --green-deep:#1B4332; --green-mid:#2D6A4F; --green-light:#52B788;
    --gold:#C9A84C; --gold-l:#E9C97E;
    --chalk:#F8F4EE; --chalk-dim:rgba(248,244,238,0.6);
    --chalk-faint:rgba(248,244,238,0.12);
    --red:#D85A30;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--green-deep); color:var(--chalk);
    font-family:'-apple-system','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    -webkit-font-smoothing:antialiased; padding:0 0 60px;
  }
  .wrap{max-width:760px; margin:0 auto; padding:20px 16px;}

  #gate{display:none; flex-direction:column; align-items:center; justify-content:center;
    min-height:80vh; text-align:center; gap:14px; padding:24px;}
  #gate .lock{font-size:42px;}
  #gate .msg{color:var(--chalk-dim); font-size:14px; line-height:1.7;}
  #gate a{color:var(--gold-l); text-decoration:underline;}

  .head{display:flex; align-items:flex-end; justify-content:space-between;
    border-bottom:1px solid var(--chalk-faint); padding-bottom:14px; margin-bottom:18px; gap:12px; flex-wrap:wrap;}
  .head h1{font-size:19px; margin:0; font-weight:700; letter-spacing:0.5px;}
  .head h1 .sub{display:block; font-size:11px; color:var(--chalk-dim); font-weight:400; margin-top:4px; letter-spacing:1px;}
  .refresh{background:none; border:1px solid var(--chalk-faint); color:var(--chalk-dim);
    border-radius:8px; padding:6px 10px; cursor:pointer; font-size:12px; font-family:inherit;}
  .refresh:hover{color:var(--chalk); border-color:var(--gold);}

  .summary{font-size:13px; color:var(--chalk-dim); margin-bottom:16px;}
  .summary b{color:var(--gold-l); font-size:15px;}

  .mlist{display:flex; flex-direction:column; gap:8px;}
  .mrow{display:flex; align-items:center; gap:12px; background:rgba(248,244,238,0.04);
    border:1px solid var(--chalk-faint); border-radius:12px; padding:13px 15px;}
  .mrow.new{border-color:rgba(216,90,48,0.45); background:rgba(216,90,48,0.06);}
  .m-nick{font-weight:700; font-size:15px; min-width:120px;}
  .m-email{color:var(--chalk-dim); font-size:12.5px; flex:1;}
  .m-date{color:var(--chalk-dim); font-size:11.5px; white-space:nowrap;}
  .new-badge{background:var(--red); color:#fff; font-size:10px; font-weight:800;
    padding:2px 7px; border-radius:8px; letter-spacing:0.5px;}

  .loading{text-align:center; padding:60px 0; color:var(--chalk-dim);}
  .err{text-align:center; padding:30px; color:var(--red); font-size:13px; line-height:1.7;}
  .foot{text-align:center; font-size:11px; color:var(--chalk-dim); margin-top:30px; opacity:0.6; line-height:1.7;}
</style>
</head>
<body>

<div id="gate">
  <div class="lock">🔒</div>
  <div class="msg">
    신규 회원은 살롱지기 전용입니다.<br>
    소로 계정으로 로그인한 뒤 다시 열어 주세요.<br><br>
    <a href="index.html">← 은교살롱 입구로</a>
  </div>
</div>

<div id="dash" class="wrap" style="display:none;">
  <div class="head">
    <h1>신규 회원<span class="sub">EG SALON · NEW MEMBERS</span></h1>
    <button class="refresh" onclick="load()">↻ 새로고침</button>
  </div>
  <div id="body"><div class="loading">불러오는 중…</div></div>
  <div class="foot">
    가입 최신순 · 빨간 표식 = 지난 확인 이후 새로 온 회원<br>
    이 페이지를 열면 모든 기기에서 '확인함'으로 기록됩니다.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://cyhlotwdisjvoxvfkpnd.supabase.co';
const SUPA_KEY = 'sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY, {
  auth:{ storageKey:'eungyo-auth', persistSession:true, autoRefreshToken:true }
});
const SORO_EMAIL = 'lonelywalden@gmail.com';
const SORO_UID   = '81ac3dfa-0d44-4ab9-84bf-d630321b0bad';

(async function init(){
  const { data:{ session } } = await supa.auth.getSession();
  const u = session && session.user;
  const isSoro = u && (u.email === SORO_EMAIL || u.id === SORO_UID);
  if(!isSoro){ document.getElementById('gate').style.display = 'flex'; return; }
  document.getElementById('dash').style.display = 'block';
  load();
})();

async function load(){
  const body = document.getElementById('body');
  body.innerHTML = '<div class="loading">불러오는 중…</div>';
  const { data, error } = await supa.rpc('get_new_members', { p_only_unseen: false });
  if(error){
    body.innerHTML = '<div class="err">불러오지 못했습니다.<br>'+error.message+'</div>';
    return;
  }
  render(data || []);
  // 목록을 보여준 뒤 '확인함'으로 기록 → 다음부터 배지 0
  await supa.rpc('mark_members_seen');
}

function render(rows){
  const newCount = rows.filter(r=>r.is_new).length;
  let html = `<div class="summary">전체 <b>${rows.length}</b>명 · 새로 온 회원 <b>${newCount}</b>명</div>`;
  html += '<div class="mlist">';
  rows.forEach(r=>{
    const d = new Date(r.created_at);
    const ds = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    html += `<div class="mrow ${r.is_new?'new':''}">
      <span class="m-nick">${esc(r.nickname||'—')}</span>
      <span class="m-email">${esc(r.email||'')}</span>
      ${r.is_new?'<span class="new-badge">NEW</span>':''}
      <span class="m-date">${ds}</span>
    </div>`;
  });
  if(!rows.length) html += '<div style="text-align:center;color:var(--chalk-dim);padding:24px">아직 회원이 없습니다.</div>';
  html += '</div>';
  document.getElementById('body').innerHTML = html;
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>
</body>
</html>
