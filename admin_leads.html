<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>EG Leads — 명단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
:root{
  --bg:#12100c; --panel:#1b1710; --panel2:#221c14;
  --ink:#ece3d0; --dim:#9a8d72; --soft:#c8baa0;
  --gold:#d8b860; --gold2:#c9a84c; --line:rgba(216,184,96,.22);
  --ok:#7fb38a; --bad:#c46a5e; --warn:#d59b57;
}
body{ background:var(--bg); color:var(--ink); font-family:'Noto Serif KR',serif; min-height:100vh; }
a{ color:var(--gold2); }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }

header{ display:flex; align-items:baseline; gap:14px; padding:18px 22px 14px;
  border-bottom:1px solid var(--line); flex-wrap:wrap; }
h1{ font-family:'Cormorant Garamond',serif; font-size:25px; font-weight:600; letter-spacing:.5px; }
h1 .g{ color:var(--gold); }
.sub{ font-size:11.5px; color:var(--dim); letter-spacing:.14em; }
.count{ margin-left:auto; font-size:12px; color:var(--soft); }
.count b{ color:var(--gold); font-weight:500; }

#gate{ max-width:340px; margin:14vh auto; padding:26px; background:var(--panel);
  border:1px solid var(--line); border-radius:12px; }
#gate h2{ font-family:'Cormorant Garamond',serif; font-size:20px; margin-bottom:14px; color:var(--gold); }
#gate p{ font-size:13px; color:var(--dim); line-height:1.8; }

main{ display:grid; grid-template-columns:318px 1fr; gap:18px; padding:18px 22px 70px; align-items:start; }
@media(max-width:900px){ main{ grid-template-columns:1fr; } }

.panel{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:15px; margin-bottom:14px; }
.panel h3{ font-family:'Cormorant Garamond',serif; font-size:14px; letter-spacing:1.6px;
  color:var(--gold); margin-bottom:10px; }
.panel .hint{ font-size:11.5px; color:var(--dim); line-height:1.75; margin-bottom:10px; }

/* 눈금 */
.tally{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
.tally div{ background:var(--panel2); border:1px solid var(--line); border-radius:9px;
  padding:9px 6px; text-align:center; }
.tally b{ display:block; font-size:19px; color:var(--gold); font-weight:500; line-height:1.25; }
.tally span{ font-size:10.5px; color:var(--dim); }
.gauge{ height:7px; background:var(--panel2); border:1px solid var(--line); border-radius:5px; overflow:hidden; }
.gauge i{ display:block; height:100%; background:linear-gradient(90deg,var(--gold2),var(--gold)); }
.gauge-lbl{ font-size:11px; color:var(--dim); margin-top:6px; }

/* 입력 */
label{ display:block; font-size:11.5px; color:var(--dim); margin:8px 0 4px; }
input, select, textarea{ width:100%; background:var(--panel2); color:var(--ink);
  border:1px solid var(--line); border-radius:8px; padding:8px 10px;
  font-family:inherit; font-size:13px; }
textarea{ resize:vertical; line-height:1.6; }
.b{ background:var(--panel2); color:var(--soft); border:1px solid var(--line);
  border-radius:8px; padding:9px 14px; font-family:inherit; font-size:13px; cursor:pointer; }
.b:hover{ color:var(--ink); border-color:var(--gold2); }
.b.gold{ background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#1a120c; border-color:var(--gold2); font-weight:500; }
.b:disabled{ opacity:.4; cursor:not-allowed; }
.b.wide{ width:100%; margin-top:10px; }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }

.said{ font-size:12px; line-height:1.7; margin-top:9px; color:var(--soft); }
.said.ok{ color:var(--ok); } .said.bad{ color:var(--bad); }

/* 점검 결과 */
.check{ margin-top:10px; display:flex; flex-direction:column; gap:6px; max-height:280px; overflow-y:auto; }
.hit{ font-size:12px; line-height:1.6; border-left:2px solid var(--warn); padding:4px 0 4px 9px; }
.hit.stop{ border-color:var(--bad); }
.hit em{ font-style:normal; color:var(--gold); }
.hit s{ text-decoration:none; color:var(--dim); }

/* 목록 */
.bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
.bar input[type=search]{ flex:1; min-width:170px; }
.bar select{ width:auto; min-width:104px; }
.chk{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); white-space:nowrap; }
.chk input{ width:auto; }

.rows{ display:flex; flex-direction:column; gap:9px; }
.lead{ display:grid; grid-template-columns:22px 1fr 176px; gap:12px;
  background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:12px 14px; }
.lead.sel{ border-color:var(--gold2); background:var(--panel2); }
.lead .pick input{ width:auto; margin-top:4px; }
.l1{ display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; margin-bottom:4px; }
.l1 b{ font-size:15px; font-weight:500; }
.tag{ font-size:10.5px; color:var(--gold2); border:1px solid var(--line); border-radius:6px; padding:1px 7px; }
.meta{ font-size:11.5px; color:var(--dim); }
.url{ font-size:12px; word-break:break-all; }
.mailrow{ font-size:12px; color:var(--soft); margin-top:3px; }
.mailrow.none{ color:var(--dim); }
.about{ margin-top:8px; font-size:13px; background:transparent; border:0; border-bottom:1px dashed var(--line);
  border-radius:0; padding:5px 2px; }
.about:focus{ border-bottom-color:var(--gold2); background:var(--panel2); }
.about::placeholder{ color:rgba(154,141,114,.6); }
.memo{ margin-top:6px; font-size:12px; padding:6px 8px; }
.side{ display:flex; flex-direction:column; gap:6px; }
.side select{ font-size:12px; padding:6px 8px; }
.dates{ font-size:11px; color:var(--dim); line-height:1.6; }
.del{ align-self:flex-end; background:none; border:0; color:var(--dim); font-size:12px; cursor:pointer; padding:2px 4px; }
.del:hover{ color:var(--bad); }

.foot{ position:sticky; bottom:0; margin-top:14px; padding:11px 14px;
  background:rgba(27,23,16,.96); border:1px solid var(--line); border-radius:11px;
  display:flex; gap:9px; align-items:center; flex-wrap:wrap; backdrop-filter:blur(4px); }
.foot .n{ font-size:12.5px; color:var(--soft); margin-right:auto; }

.empty{ text-align:center; padding:52px 20px; color:var(--dim); font-size:13px; line-height:2; }
.toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  background:var(--gold); color:#1a120c; font-size:13px; padding:10px 20px; border-radius:9px;
  opacity:0; pointer-events:none; transition:opacity .18s; z-index:99; }
.toast.show{ opacity:1; }
.toast.bad{ background:var(--bad); color:#fff; }
</style>
</head>
<body>

<div id="gate" hidden>
  <h2>명단</h2>
  <p>살롱지기로 들어와 주세요.</p>
  <label>메일</label><input id="em" type="email" autocomplete="username">
  <label>열쇠</label><input id="pw" type="password" autocomplete="current-password">
  <button class="b gold wide" id="loginBtn">들어가기</button>
</div>

<div id="app" hidden>
<header>
  <h1>EG <span class="g">Leads</span></h1>
  <span class="sub">파트너 후보 명단 · 0902</span>
  <span class="count" id="hcount"></span>
</header>

<main>
  <!-- ── 왼쪽 기둥 ── -->
  <section>
    <div class="panel">
      <h3>눈금</h3>
      <div class="tally" id="tally"></div>
      <div class="gauge"><i id="gauge" style="width:0%"></i></div>
      <div class="gauge-lbl" id="gaugeLbl">300 눈금</div>
    </div>

    <div class="panel">
      <h3>담기</h3>
      <p class="hint">
        크롤러가 낸 표를 그대로 붙여 넣습니다. 탭 또는 쉼표로 갈립니다.<br>
        첫 줄이 머리글이면 알아서 읽고, 아니면 <b>이름 · 주소 · 메일 · 종류 · 규모 · 다루는 것</b> 순서로 봅니다.<br>
        주소가 같은 줄은 담기지 않습니다.
      </p>
      <textarea id="paste" rows="6" placeholder="여기에 붙여 넣습니다"></textarea>
      <div class="two">
        <div><label>발굴자</label><input id="finder" value="크롤러"></div>
        <div><label>종류 기본값</label><select id="pkind"></select></div>
      </div>
      <button class="b gold wide" id="pasteBtn">담기</button>
      <div class="said" id="pasteSaid"></div>
    </div>

    <div class="panel">
      <h3>한 줄 추가</h3>
      <label>이름 · 채널명</label><input id="n-name">
      <label>주소</label><input id="n-url" placeholder="youtube.com/@…">
      <div class="two">
        <div><label>메일</label><input id="n-email"></div>
        <div><label>종류</label><select id="n-kind"></select></div>
      </div>
      <div class="two">
        <div><label>규모</label><input id="n-scale" placeholder="구독 1.2만"></div>
        <div><label>최근 활동</label><input id="n-last" placeholder="2026-08-30"></div>
      </div>
      <label>다루는 것 — 한 줄</label><input id="n-about">
      <button class="b gold wide" id="addBtn">한 줄 넣기</button>
      <div class="said" id="addSaid"></div>
    </div>

    <div class="panel">
      <h3>편지 점검</h3>
      <p class="hint">보낼 문안을 붙여 넣으면 첫 편지에 넣지 않기로 한 것들을 짚어 줍니다.</p>
      <textarea id="letter" rows="7" placeholder="편지 문안"></textarea>
      <button class="b wide" id="checkBtn">점검</button>
      <div class="said" id="checkSaid"></div>
      <div class="check" id="checkOut"></div>
    </div>
  </section>

  <!-- ── 오른쪽 명단 ── -->
  <section>
    <div class="bar">
      <input type="search" id="q" placeholder="이름 · 주소 · 메일 · 다루는 것 · 메모">
      <select id="f-status"></select>
      <select id="f-kind"></select>
      <select id="f-way"></select>
      <select id="f-sort">
        <option value="new">발굴 최근순</option>
        <option value="old">발굴 오래된순</option>
        <option value="name">이름순</option>
        <option value="status">상태순</option>
      </select>
      <label class="chk"><input type="checkbox" id="f-noabout"> 다루는 것 빈 줄만</label>
    </div>

    <div class="rows" id="rows"><div class="empty">불러오는 중…</div></div>

    <div class="foot">
      <span class="n" id="selN">고른 것 없음</span>
      <button class="b" id="allBtn">보이는 것 모두 고르기</button>
      <button class="b" id="markBtn" disabled>보냄으로 표시</button>
      <button class="b gold" id="sendBtn" disabled title="지메일 승인이 나면 열립니다">지메일로 보내기</button>
    </div>
  </section>
</main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPA_URL = 'https://cyhlotwdisjvoxvfkpnd.supabase.co';
const SUPA_KEY = 'sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
const sb = createClient(SUPA_URL, SUPA_KEY, {
  auth:{ storageKey:'eungyo-auth', persistSession:true, autoRefreshToken:true }
});
const $ = s => document.querySelector(s);

/* 표의 CHECK 제약과 같은 줄이어야 한다. 여기만 늘리면 저장에서 튕긴다. */
const STATUS = ['미접촉','보냄','회신','대화중','계약','무응답','사양'];
const WAYS   = ['메일','DM만','없음'];
const KINDS  = ['메일리','스티비','브런치','유튜브','인스타','스레드','블로그','팟캐스트','기타'];
const GOAL   = 300;                       /* I-12 눈금 */

let ROWS = [];                            /* 표 전량 */
let SEL  = new Set();                     /* 고른 id */

/* ⚠⚠ url_key는 표가 만드는 칸이다(생성 칸). 아래 씻는 순서는 그 식과 한 글자도
   달라선 안 된다 — 어긋나면 같은 줄이 두 번 담긴다.
   lower → https?:// → www. → ?#뒤 → 끝 슬래시 */
function urlKey(u){
  let s = String(u||'').trim().toLowerCase();
  s = s.replace(/^https?:\/\//,'').replace(/^www\./,'')
       .replace(/[?#].*$/,'').replace(/\/+$/,'');
  return s || null;
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m, bad){
  const t = $('#toast'); t.textContent = m;
  t.classList.toggle('bad', !!bad); t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}
const d2 = n => String(n).padStart(2,'0');
function shortDate(v){
  if(!v) return '';
  const d = new Date(v);
  if(isNaN(d)) return '';
  return `${d2(d.getMonth()+1)}.${d2(d.getDate())}`;
}
function asDate(v){                        /* 2026-08-30 · 2026.8.30 · 2026/08/30 */
  const s = String(v||'').trim();
  const m = s.match(/^(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})$/);
  return m ? `${m[1]}-${d2(m[2])}-${d2(m[3])}` : null;
}

/* ── 문지기 ── */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $('#gate').hidden = false; return; }
  const { data:isAdmin } = await sb.rpc('eg_is_admin');
  if(!isAdmin){
    $('#gate').hidden = false;
    $('#gate').innerHTML = '<h2>명단</h2><p>이 문은 살롱지기에게만 열립니다.</p>';
    return;
  }
  $('#gate').hidden = true; $('#app').hidden = false;
  fillSelects();
  await load();
}
$('#loginBtn').addEventListener('click', async ()=>{
  const { error } = await sb.auth.signInWithPassword({
    email: $('#em').value.trim(), password: $('#pw').value });
  if(error){ toast('들어가지 못했습니다 — ' + error.message, true); return; }
  boot();
});

function fillSelects(){
  const kOpts = KINDS.map(k=>`<option value="${k}">${k}</option>`).join('');
  $('#pkind').innerHTML = kOpts; $('#n-kind').innerHTML = kOpts;
  $('#pkind').value = '유튜브'; $('#n-kind').value = '유튜브';
  $('#f-status').innerHTML = '<option value="">상태 전부</option>' + STATUS.map(s=>`<option>${s}</option>`).join('');
  $('#f-kind').innerHTML   = '<option value="">종류 전부</option>' + KINDS.map(k=>`<option>${k}</option>`).join('');
  $('#f-way').innerHTML    = '<option value="">우편함 전부</option>' + WAYS.map(w=>`<option>${w}</option>`).join('');
}

/* ── 명단 ── */
async function load(){
  const { data, error } = await sb.from('eg_leads')
    .select('*').order('found_at',{ascending:false}).order('id',{ascending:false}).limit(3000);
  if(error){ $('#rows').innerHTML = `<div class="empty">명단을 불러오지 못했습니다.<br>${esc(error.message)}</div>`; return; }
  ROWS = data || [];
  SEL.clear();
  paint();
}

function paint(){
  /* 눈금은 거른 것이 아니라 표 전량을 센다 */
  const n = ROWS.length;
  const c = k => ROWS.filter(k).length;
  const untouched = c(r=>r.status==='미접촉');
  const sent      = c(r=>r.status==='보냄');
  const talking   = c(r=>r.status==='회신'||r.status==='대화중');
  const deal      = c(r=>r.status==='계약');
  const mailed    = c(r=>!!r.email);
  const noAbout   = c(r=>!r.about);

  $('#tally').innerHTML = [
    [n,'전체'],[mailed,'메일 있음'],[untouched,'미접촉'],
    [sent,'보냄'],[talking,'회신·대화중'],[deal,'계약']
  ].map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join('');

  $('#gauge').style.width = Math.min(100, n/GOAL*100).toFixed(1) + '%';
  $('#gaugeLbl').textContent = n >= GOAL
    ? `300 눈금을 넘었습니다 — ${n}`
    : `300 눈금까지 ${GOAL-n}`;
  $('#hcount').innerHTML = `명단 <b>${n}</b> · 다루는 것 빈 줄 <b>${noAbout}</b>`;

  renderRows();
}

function visible(){
  const q = $('#q').value.trim().toLowerCase();
  const st = $('#f-status').value, kd = $('#f-kind').value, wy = $('#f-way').value;
  const noAb = $('#f-noabout').checked;
  let list = ROWS.filter(r=>{
    if(st && r.status !== st) return false;
    if(kd && r.kind !== kd) return false;
    if(wy && r.contact_way !== wy) return false;
    if(noAb && r.about) return false;
    if(q){
      const hay = [r.name,r.url,r.email,r.about,r.memo].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const s = $('#f-sort').value;
  if(s==='name')   list = [...list].sort((a,b)=>String(a.name).localeCompare(String(b.name),'ko'));
  if(s==='status') list = [...list].sort((a,b)=>STATUS.indexOf(a.status)-STATUS.indexOf(b.status));
  if(s==='old')    list = [...list].reverse();
  return list;
}

function renderRows(){
  const list = visible();
  const box = $('#rows');
  if(!list.length){
    box.innerHTML = ROWS.length
      ? '<div class="empty">거른 결과가 없습니다.</div>'
      : '<div class="empty">명단이 비어 있습니다.<br>왼쪽 <b>담기</b>에 크롤러 표를 붙여 넣거나 한 줄씩 넣어 주세요.</div>';
    updateFoot(); return;
  }
  box.innerHTML = list.map(r=>{
    const st = STATUS.map(s=>`<option${s===r.status?' selected':''}>${s}</option>`).join('');
    const wy = WAYS.map(w=>`<option${w===r.contact_way?' selected':''}>${w}</option>`).join('');
    const dates = [
      r.sent_at ? '보냄 '+shortDate(r.sent_at) : '',
      r.replied_at ? '회신 '+shortDate(r.replied_at) : ''
    ].filter(Boolean).join(' · ');
    return `<div class="lead${SEL.has(r.id)?' sel':''}" data-id="${r.id}">
      <div class="pick"><input type="checkbox" data-act="pick"${SEL.has(r.id)?' checked':''} aria-label="고르기"></div>
      <div>
        <div class="l1">
          <b>${esc(r.name)}</b>
          ${r.kind?`<span class="tag">${esc(r.kind)}</span>`:''}
          ${r.scale?`<span class="meta">${esc(r.scale)}</span>`:''}
          ${r.last_active?`<span class="meta">최근 ${esc(r.last_active)}</span>`:''}
          <span class="meta">발굴 ${esc(r.found_at)}${r.found_by?' · '+esc(r.found_by):''}</span>
        </div>
        ${r.url?`<a class="url" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>`:''}
        <div class="mailrow${r.email?'':' none'}">${r.email?esc(r.email):'메일 없음'}</div>
        <input class="about" data-act="about" value="${esc(r.about)}" placeholder="다루는 것 — 한 줄">
        <input class="memo" data-act="memo" value="${esc(r.memo)}" placeholder="메모">
      </div>
      <div class="side">
        <select data-act="status">${st}</select>
        <select data-act="way">${wy}</select>
        <div class="dates">${dates||'&nbsp;'}</div>
        <button class="del" data-act="del">지움</button>
      </div>
    </div>`;
  }).join('');
  updateFoot();
}

function updateFoot(){
  const n = SEL.size;
  $('#selN').textContent = n ? `고른 것 ${n}` : '고른 것 없음';
  $('#markBtn').disabled = !n;
}

/* ── 행 손질 ── */
$('#rows').addEventListener('change', async e=>{
  const el = e.target, act = el.dataset.act;
  const wrap = el.closest('.lead'); if(!wrap || !act) return;
  const id = Number(wrap.dataset.id);
  const row = ROWS.find(r=>r.id===id); if(!row) return;

  if(act==='pick'){
    el.checked ? SEL.add(id) : SEL.delete(id);
    wrap.classList.toggle('sel', el.checked);
    updateFoot(); return;
  }
  if(act==='status'){
    const v = el.value;
    const patch = { status:v };
    /* 날짜는 비어 있을 때만 찍는다 — 상태를 다시 만져도 첫 날짜가 안 지워진다 */
    if(v==='보냄' && !row.sent_at)    patch.sent_at = new Date().toISOString();
    if((v==='회신'||v==='대화중') && !row.replied_at) patch.replied_at = new Date().toISOString();
    await save(id, patch, '상태');
    return;
  }
  if(act==='way'){ await save(id, { contact_way: el.value }, '우편함'); return; }
});
$('#rows').addEventListener('blur', async e=>{
  const el = e.target, act = el.dataset && el.dataset.act;
  if(act!=='about' && act!=='memo') return;
  const id = Number(el.closest('.lead').dataset.id);
  const row = ROWS.find(r=>r.id===id); if(!row) return;
  const v = el.value.trim() || null;
  if((row[act]||null) === v) return;
  await save(id, { [act]: v }, act==='about' ? '다루는 것' : '메모');
}, true);
$('#rows').addEventListener('click', async e=>{
  if(e.target.dataset.act !== 'del') return;
  const wrap = e.target.closest('.lead');
  const id = Number(wrap.dataset.id);
  const row = ROWS.find(r=>r.id===id);
  if(!confirm(`「${row.name}」를 명단에서 지웁니다. 되돌릴 수 없습니다.`)) return;
  const { error } = await sb.from('eg_leads').delete().eq('id', id);
  if(error){ toast('지우지 못했습니다 — '+error.message, true); return; }
  ROWS = ROWS.filter(r=>r.id!==id); SEL.delete(id);
  paint(); toast('지웠습니다');
});

async function save(id, patch, what){
  const { error } = await sb.from('eg_leads').update(patch).eq('id', id);
  if(error){ toast(`${what}을 저장하지 못했습니다 — ${error.message}`, true); return false; }
  Object.assign(ROWS.find(r=>r.id===id), patch);
  paint(); toast(`${what} 저장`);
  return true;
}

/* ── 담기 ── */
function parsePaste(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return { rows:[], skipped:0 };
  const sep = lines[0].includes('\t') ? '\t' : ',';
  let cells = lines.map(l => l.split(sep).map(c=>c.trim().replace(/^"|"$/g,'')));

  let map = { name:0, url:1, email:2, kind:3, scale:4, about:5, last:-1 };
  const head = cells[0].map(c=>c.toLowerCase());
  const looksHead = head.some(c=>/이름|채널|name|url|주소|링크|메일|mail|종류|매체|규모|구독|다루|소개/.test(c));
  if(looksHead){
    map = { name:-1, url:-1, email:-1, kind:-1, scale:-1, about:-1, last:-1 };
    head.forEach((c,i)=>{
      if(map.name<0  && /이름|채널|name|title/.test(c)) map.name = i;
      else if(map.url<0   && /url|주소|링크|link/.test(c)) map.url = i;
      else if(map.email<0 && /메일|mail/.test(c)) map.email = i;
      else if(map.kind<0  && /종류|매체|kind|채널유형/.test(c)) map.kind = i;
      else if(map.scale<0 && /규모|구독|팔로|scale/.test(c)) map.scale = i;
      else if(map.about<0 && /다루|소개|설명|about|주제/.test(c)) map.about = i;
      else if(map.last<0  && /최근|활동|last/.test(c)) map.last = i;
    });
    cells = cells.slice(1);
  }
  const at = (r,i) => (i>=0 && r[i]) ? r[i] : null;
  const kindDefault = $('#pkind').value;
  const finder = $('#finder').value.trim() || null;

  const rows = []; let skipped = 0;
  for(const r of cells){
    const url = at(r, map.url);
    let name = at(r, map.name);
    if(!name && url) name = urlKey(url);
    if(!name){ skipped++; continue; }
    const email = at(r, map.email);
    rows.push({
      name, url, email,
      kind: at(r, map.kind) || kindDefault,
      scale: at(r, map.scale),
      about: at(r, map.about),
      last_active: asDate(at(r, map.last)),
      contact_way: email ? '메일' : '없음',
      found_by: finder,
      raw: { line: r.join(sep) }
    });
  }
  return { rows, skipped };
}

$('#pasteBtn').addEventListener('click', async ()=>{
  const said = $('#pasteSaid'); said.className='said';
  const { rows, skipped } = parsePaste($('#paste').value);
  if(!rows.length){ said.className='said bad'; said.textContent='읽을 줄이 없습니다.'; return; }

  /* 빗장이 부분 색인이라 upsert가 안 먹는다. 있는 주소를 먼저 받아 와 여기서 거른다. */
  const { data:have, error:e0 } = await sb.from('eg_leads').select('url_key').limit(10000);
  if(e0){ said.className='said bad'; said.textContent='이미 있는 주소를 확인하지 못했습니다 — '+e0.message; return; }
  const known = new Set((have||[]).map(h=>h.url_key).filter(Boolean));

  const fresh = []; let dup = 0;
  for(const r of rows){
    const k = urlKey(r.url);
    if(k){
      if(known.has(k)){ dup++; continue; }
      known.add(k);                        /* 붙여 넣은 안에서 겹친 것도 한 번만 */
    }
    fresh.push(r);
  }
  if(!fresh.length){
    said.className='said'; said.textContent=`새로 담을 줄이 없습니다 — 이미 있던 것 ${dup}`;
    return;
  }
  $('#pasteBtn').disabled = true; said.textContent='담는 중…';
  let done = 0;
  for(let i=0;i<fresh.length;i+=200){
    const { error } = await sb.from('eg_leads').insert(fresh.slice(i,i+200));
    if(error){
      $('#pasteBtn').disabled=false;
      said.className='said bad';
      said.textContent=`${done}줄까지 담고 멈췄습니다 — ${error.message}`;
      await load(); return;
    }
    done += Math.min(200, fresh.length-i);
  }
  $('#pasteBtn').disabled = false; $('#paste').value = '';
  said.className='said ok';
  said.textContent = `담김 ${done} · 이미 있던 것 ${dup}${skipped?` · 이름도 주소도 없어 건넌 줄 ${skipped}`:''}`;
  await load();
});

/* ── 편지 점검 (II-3) ──
   첫 편지에 넣지 않기로 한 것들. 조항 근거는 0901오전 17호 · 0828 18호 · 0901오전 7호. */
const TABOO = [
  { lv:'stop', re:/플랫\s?폼|SaaS|솔루션|서비스형/gi, why:'교양 우주 · EG 유니버스로 바꿉니다' },
  { lv:'stop', re:/189[,\s]?189|2[,\s]?713/g,        why:'첫 편지에서 큰 수를 뺍니다' },
  { lv:'stop', re:/계약금|가입비|보증금|입주금|분양가/g, why:'첫 편지에 실무를 넣지 않습니다' },
  { lv:'stop', re:/배분|수수료|커미션|요율|정산/g,     why:'값·배분은 첫 편지에 없습니다' },
  /* ⚠ 앞에 숫자나 점이 오면 안 잡는다 — 「1.5%」가 값으로 잡히면 편지에서
     가장 좋은 줄이 매번 걸린다. 잡는 것은 55% · 70% 같은 배분 쪽이다. */
  { lv:'stop', re:/(?:^|[^\d.])(\d{1,3}\s?%)/g, g:1,  why:'배분으로 읽힐 비율' },
  { lv:'stop', re:/\d{1,3}(?:,\d{3})+\s*원|\d+\s*만\s*원|\d{1,3}(?:,\d{3})+/g, why:'값' },
  { lv:'stop', re:/할인|세일|특가|반값|무료로\s?드립|런칭\s?기념/g, why:'세일 어법' },
  { lv:'warn', re:/예정|준비\s?중|오픈합니다|출시|론칭|출범|곧\s|머지않아/g, why:'미래형 — 이미 서 있는 것만 적습니다' },
  { lv:'warn', re:/것입니다|하려\s?합니다|드릴\s?예정/g, why:'미래형이면 걷어냅니다' },
  { lv:'warn', re:/슬롯|분양|영토|테리토리|Territory/gi, why:'안에서 쓰는 말입니다' },
  { lv:'warn', re:/정회원|준회원|회원권|구독료|멤버십/g, why:'안에서 쓰는 말입니다' }
];
$('#checkBtn').addEventListener('click', ()=>{
  const t = $('#letter').value;
  const said = $('#checkSaid'), out = $('#checkOut');
  out.innerHTML = '';
  if(!t.trim()){ said.className='said'; said.textContent='문안을 붙여 넣어 주세요.'; return; }

  const hits = []; const seen = new Set();
  for(const rule of TABOO){
    rule.re.lastIndex = 0;
    let m;
    while((m = rule.re.exec(t)) !== null){
      if(m[0]===''){ rule.re.lastIndex++; continue; }
      /* g가 있으면 잡은 것은 그 묶음이다 — 앞뒤로 한 글자 더 문 것을 도로 뱉는다 */
      const word = rule.g ? m[rule.g] : m[0];
      if(!word) continue;
      const at = m.index + m[0].indexOf(word);
      if(seen.has(at)) continue;            /* 두 규칙이 같은 자리를 잡으면 한 번만 */
      seen.add(at);
      const a = Math.max(0, at-16), b = Math.min(t.length, at+word.length+16);
      hits.push({ lv:rule.lv, word, why:rule.why,
        left:t.slice(a,at).replace(/\n/g,' '), right:t.slice(at+word.length,b).replace(/\n/g,' ') });
    }
  }
  hits.sort((x,y)=> (x.lv===y.lv) ? 0 : (x.lv==='stop' ? -1 : 1));
  const stops = hits.filter(h=>h.lv==='stop').length;
  const chars = t.replace(/\s/g,'').length;
  if(!hits.length){
    said.className='said ok';
    said.textContent = `걸린 것 없습니다 · 글자 ${chars}`;
    return;
  }
  said.className = stops ? 'said bad' : 'said';
  said.textContent = `막는 것 ${stops} · 살펴볼 것 ${hits.length-stops} · 글자 ${chars}`;
  out.innerHTML = hits.map(h=>
    `<div class="hit${h.lv==='stop'?' stop':''}">
       <s>…${esc(h.left)}</s><em>${esc(h.word)}</em><s>${esc(h.right)}…</s><br>
       <span class="meta">${esc(h.why)}</span>
     </div>`).join('');
});

boot();
