           ① 메종 이름 짓기  ② 베타 시작일 정하기  ③ 베타 초대권 뽑아 건네기

        글자 규칙 · 금칙어 · 남의 이름 · 로마 숫자 · 격은 전부 DB 가 한다. 이 파일은 받아 적은 글자를 건넬 뿐이다
        개관 전까지 고칠 수 있다 — 고칠 수 있는가(can_rename)도 DB 가 말해 준다

     ⑥ ⭐ 베타 시작일 — rpc eg_founder_beta_set(날짜) · ⭐ 승인 절차 없음 (0919 소로) — 정하면 바로 확정, 소로께는 알림만

        ⭐ 잠그는 때는 「승인」이 아니라 「첫 초대권을 뽑은 때」(0919 소로) — tickets > 0 이면 버튼이 사라진다
        정하면 application-mail notify 로 소로께 알림 한 통 (실패해도 정한 날은 산다)

     ⑦ ⭐ 베타 초대권 — rpc eg_founder_ticket_issue(건물, 이름) · eg_founder_ticket_rename(표, 이름) · eg_founder_tickets()

        첫 장을 뽑기 전에 한 번 알린다 — 뽑은 뒤에는 베타 시작일을 못 바꾼다
        ⭐ 표 그림 — drawPass() 가 캔버스에 그린다 (1600×800 · 보딩패스풍 임시 표 · 0919)
           글자는 코드가 박고, 비너스의 옷이 오면 바탕만 갈아 끼운다. 글꼴 조각은 그릴 글자로 먼저 불러 둔다
        ⏳ 묶음(리더) · 엑셀 일괄 · 손님의 번호 입력 자리는 다음 조각

<script>
(function () {

  const SUPA_URL = 'https://cyhlotwdisjvoxvfkpnd.supabase.co';

  const num = (n) => Number(n || 0).toLocaleString('ko-KR');

  const CITY = { paris: '파리', london: '런던', newyork: '뉴욕' };
  const cityKo = (k) => CITY[k] || k;
  /* 격 — 0917저녁 14호. 이름의 뒷단어는 공식이 붙인다 */
  function grade(city, slots) {
    if (city === 'paris')  return 'MAISON';
    if (city === 'london') return 'HOUSE';

  }
  /* 날짜 — DB 가 준 'YYYY-MM-DD' (이미 서울 달력) 를 그대로 읽는다. 시각을 자르지 않는다 */
  function md(d) {
    if (!d) return '';
    const p = String(d).split('-'); if (p.length < 3) return String(d);
    return Number(p[1]) + '월 ' + Number(p[2]) + '일';
  }
  const toT = (d) => { const p = String(d).split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); };
  const toS = (t) => { const x = new Date(t); return x.getUTCFullYear() + '-' + String(x.getUTCMonth() + 1).padStart(2, '0') + '-' + String(x.getUTCDate()).padStart(2, '0'); };
  const addDays = (d, n) => toS(toT(d) + n * 86400000);

  /* ── 달력 — 여는 날과 권유 구간은 DB 가 준 값 그대로 ── */
  function calHtml(beta) {

    const ey = +to.split('-')[0], em = +to.split('-')[1];
    for (let guard = 0; guard < 4 && (y < ey || (y === ey && m <= em)); guard++) {
      const first = Date.UTC(y, m - 1, 1), days = new Date(Date.UTC(y, m, 0)).getUTCDate();
      h += '<div class="fd-month"><h4>' + y + '년 ' + m + '월</h4><div class="fd-grid">' +
        ['일','월','화','수','목','금','토'].map((w) => '<i>' + w + '</i>').join('');
      for (let k = 0; k < new Date(first).getUTCDay(); k++) h += '<span></span>';
      for (let d = 1; d <= days; d++) {
        const ds = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        const ok = ds >= from && ds <= to;
        const rec = ok && ds >= beta.recommend_from && ds <= beta.recommend_to;
        h += '<button type="button" class="fd-day' + (rec ? ' rec' : '') + (PICK === ds ? ' on' : '') + '"' +
          (ok ? ' data-day="' + ds + '"' : ' disabled') + '>' + d + '</button>';
      }
      h += '</div></div>';
      m++; if (m > 12) { m = 1; y++; }
    }
    h += '</div><p class="fd-legend"><span></span>계약 뒤 2~4주 — 이 무렵을 권해 드립니다</p>';
    if (PICK) h += '<p class="fd-pick">베타 ' + md(PICK) + ' ~ ' + md(addDays(PICK, 20)) + ' · 개관 ' + md(addDays(PICK, 21)) + '</p>';
    h += '<p class="fd-why">정하신 날짜는 베타 초대권에 「○월 ○일부터 입장」으로 적혀 손님들께 전해집니다. ' +
      '이미 건네진 초대권의 날짜를 되돌릴 수는 없기에, 첫 초대권을 뽑으신 뒤에는 시작일을 바꾸실 수 없습니다. ' +
      '그 전까지는 다시 정하실 수 있으니, 달력을 보시며 편안히 정해 주십시오.</p>';
    if (CALERR) h += '<p class="fd-nmerr" style="margin:0 0 12px">' + esc(CALERR) + '</p>';
    h += '<div class="fd-calact"><button class="fd-nmbtn" type="button" id="fdPropose"' + (!PICK || CALBUSY ? ' disabled' : '') + '>' +
      (CALBUSY ? '저장하는 중입니다' : (PICK ? md(PICK) + '로 정하기' : '날짜를 골라 주십시오')) + '</button>' +
      '<button class="fd-nmbtn plain" type="button" id="fdCalClose"' + (CALBUSY ? ' disabled' : '') + '>닫기</button></div></div>';
    return h;
  }

  /* ── 초대권 판 ── */
  function tkHtml(D, beta, ended) {
    /* ⭐ 0923 — 베타와 함께 문을 여는 건물만 (첫 계약이든, 문 열기 전에 들어온 뒷 계약이든) */
    const named = (D.buildings || []).filter((b) => (b.name || '').trim() && (!beta.open_on || b.open_at === beta.open_on));
    const L = (TK && TK.list) || [];
    let h = '<div class="fd-tk">';
    if (ended) h += '<p class="fd-tkempty" style="margin:0">베타 기간이 끝나 초대권을 더 뽑으실 수 없습니다.</p>';
    else if (!named.length) h += '<p class="fd-tkempty" style="margin:0">초대권에는 건물 이름이 적힙니다. 먼저 아래 「내 건물」에서 이름을 지어 주십시오.</p>';
    else {
      if (TKB == null || !named.some((b) => b.id === TKB)) TKB = named[0].id;
      h += '<div class="fd-tkform"><select id="fdTkB">' +
        named.map((b) => '<option value="' + b.id + '"' + (b.id === TKB ? ' selected' : '') + '>' + esc(b.name) + '</option>').join('') +
        '</select><input id="fdTkName" type="text" maxlength="20" autocomplete="off" placeholder="받는 분 이름">' +
        '<button class="fd-nmbtn" type="button" id="fdTkGo"' + (TKBUSY ? ' disabled' : '') + '>' + (TKBUSY ? '뽑는 중입니다' : '초대권 뽑기') + '</button>' +
        '<button class="fd-nmbtn plain" type="button" id="fdTkClose"' + (TKBUSY ? ' disabled' : '') + '>닫기</button></div>';
      if (!L.length && !(beta.tickets > 0))
        h += '<p class="fd-tkwarn">초대권에 「' + md(beta.start_on) + '부터 입장」이 적힙니다. 첫 초대권을 뽑으신 뒤에는 베타 시작일을 바꾸실 수 없습니다.</p>';
    }
    if (TKERR) h += '<p class="fd-nmerr">' + esc(TKERR) + '</p>';
    if (PASS && PASS.kind !== 'associate') h += '<div class="fd-pass"><img alt="베타 초대권" src="' + PASS.url + '">' +
      '<div class="fd-passact"><a class="fd-nmbtn" href="' + PASS.url + '" download="' + esc(PASS.file) + '">내려받기</a>' +
      '<button class="fd-nmbtn plain" type="button" id="fdPassClose">접기</button>' +
      '<span>내려받은 그림을 카카오톡이나 메일로 직접 건네 주십시오.</span></div></div>';
    if (L.length) {
      h += '<table class="fd-tklist"><thead><tr><th>번호</th><th>받는 분</th><th>건물</th><th>뽑은 날</th><th>상태</th><th></th></tr></thead><tbody>';
      for (const t of L) {
        const mine = TKEDIT === t.id;
        h += '<tr' + (TKLAST === t.id ? ' style="background:#FBF8F0"' : '') + '><td class="code">' + esc(t.code) + '</td><td>' +
          (mine ? '<input id="fdTkRe" type="text" maxlength="20" value="' + esc(t.guest_name) + '" data-t="' + t.id + '">' : esc(t.guest_name) + ' 님') + '</td>' +
          '<td>' + esc(t.building || '') + '</td><td class="st">' + esc(md(t.issued_on)) + '</td>' +
          '<td class="st' + (t.status === 'entered' ? ' in' : '') + '">' + (t.status === 'entered' ? md(t.entered_on) + ' 입장' : '입장 전') + '</td><td>' +
          (t.status === 'entered' ? '' : (mine
            ? '<button class="fd-nmbtn" type="button" data-tksave="' + t.id + '">저장</button> <button class="fd-nmbtn plain" type="button" data-tkcancel="1">취소</button>'
            : '<button class="fd-nmbtn" type="button" data-tkpass="' + t.id + '">표 받기</button> <button class="fd-nmbtn plain" type="button" data-tkedit="' + t.id + '">이름 고치기</button>')) + '</td></tr>';
      }
      h += '</tbody></table>';
      if (TK.total > L.length) h += '<p class="fd-tkempty">최근 ' + L.length + '장만 보여 드립니다. 전체 ' + num(TK.total) + '장.</p>';
    } else if (TK) h += '<p class="fd-tkempty">아직 뽑으신 초대권이 없습니다.</p>';
    return h + '</div>';
  }

  /* ── 준회원 바우처 판 (0920) — 띠 바깥에 늘 서 있다 ──
     ⭐ 뽑는 일은 발행일자를 묻지 않는다. 손님이 「사용」하는 때만 발행일자부터다.
     ⭐ 보낼 곳은 이름이 지어진 내 건물이면 어디든 — 전략 집중(소로 0920) */
  function vchHtml(D) {
    const V = D.voucher || {};
    const named = (D.buildings || []).filter((b) => (b.name || '').trim());
    let h = '<div class="fd-h">준회원 바우처 <i>액면 ' + num(V.value) + '원 · 2주</i></div><div class="fd-vch">';

    /* 머리 — 숫자 한 줄 */
    h += '<div class="fd-vchtop">' +
      '<span class="fd-vchbig">' + num(V.left) + '<b>장 남음</b></span>' +
      '<span class="fd-vchmeta">' +
        '<span>받으신 <em>' + num(V.qty) + '장</em></span>' +
        '<span>건네신 <em>' + num(V.drawn) + '장</em></span>' +
        '<span>사용 <em>' + num(V.entered) + '명</em></span>' +
        (V.use_to ? '<span>입력 유효기간 <em>' + md(V.use_to) + '까지</em></span>' : '') +
      '</span>';
    if (V.use_from && !V.usable)
      h += '<p class="fd-vchsay">손님은 ' + md(V.use_from) + ' 이후, 이 바우처를 사용할 수 있습니다. ' +
           '미리 뽑아 이름을 적어 두시고 건네시는 일은 오늘부터 하실 수 있습니다.</p>';
    h += '</div><div class="fd-vchbody">';

    /* 뽑는 자리 */
    if (!V.qty) {
      h += '<p class="fd-tkempty" style="margin:0">아직 지급된 바우처가 없습니다.</p>';
    } else if (!named.length) {
      h += '<p class="fd-tkempty" style="margin:0">바우처에는 건물 이름이 적힙니다. 먼저 아래 「내 건물」에서 이름을 지어 주십시오.</p>';
    } else if (V.left <= 0) {
      h += '<p class="fd-tkempty" style="margin:0">남은 바우처를 모두 건네셨습니다.</p>';
    } else {
      if (VCB == null || !named.some((b) => b.id === VCB)) VCB = named[0].id;
      h += '<div class="fd-vchform"><select id="fdVcB">' +
        named.map((b) => '<option value="' + b.id + '"' + (b.id === VCB ? ' selected' : '') + '>' + esc(b.name) + '</option>').join('') +
        '</select><input id="fdVcName" type="text" maxlength="20" autocomplete="off" placeholder="받는 분 이름">' +
        '<button class="fd-nmbtn" type="button" id="fdVcGo"' + (VCBUSY ? ' disabled' : '') + '>' +
        (VCBUSY ? '뽑는 중입니다' : '바우처 뽑기') + '</button></div>' +
        '<p class="fd-tkempty">어느 건물로 보내셔도 됩니다. 한 건물을 먼저 채우고 싶으시면 그 건물을 고르십시오. ' +
        '바우처는 입력 유효기간이 이른 것부터 저절로 빠집니다.</p>';
    }
    if (VCERR) h += '<p class="fd-nmerr">' + esc(VCERR) + '</p>';

    /* 표 그림 */
    if (PASS && PASS.kind === 'associate')
      h += '<div class="fd-pass"><img alt="준회원 바우처" src="' + PASS.url + '">' +
        '<div class="fd-passact"><a class="fd-nmbtn" href="' + PASS.url + '" download="' + esc(PASS.file) + '">내려받기</a>' +
        '<button class="fd-nmbtn plain" type="button" id="fdPassClose">접기</button>' +
        '<span>내려받은 그림을 카카오톡이나 메일로 직접 건네 주십시오.</span></div></div>';

    /* 두 장부 */
    h += '<div class="fd-vchtabs">' +
      '<button type="button" data-vctab="out" class="' + (VCTAB === 'out' ? 'on' : '') + '">건네신 바우처</button>' +
      '<button type="button" data-vctab="got" class="' + (VCTAB === 'got' ? 'on' : '') + '">지금까지 지급된 바우처</button></div>';
    h += (VCTAB === 'got') ? vchGotHtml(D) : vchOutHtml(D);

    return h + '</div></div>';
  }

  /* 건네신 바우처 — 한 장씩 */
  function vchOutHtml(D) {
    const L = (VC && VC.list) || [];
    if (!VC) return '<p class="fd-tkempty">불러오는 중입니다…</p>';
    if (!L.length) return '<p class="fd-tkempty">아직 건네신 바우처가 없습니다.</p>';
    const named = (D.buildings || []).filter((b) => (b.name || '').trim());
    let h = '<table class="fd-tklist"><thead><tr><th>번호</th><th>받는 분</th><th>보낸 곳</th><th>뽑은 날</th><th>상태</th><th></th></tr></thead><tbody>';
    for (const t of L) {
      const mv = VCMOVE === t.id;
      h += '<tr' + (VCLAST === t.id ? ' style="background:#FBF8F0"' : '') + '>' +
        '<td class="code">' + esc(t.code) + '</td>' +
        '<td>' + esc(t.guest_name) + ' 님</td>' +
        '<td>' + (mv
          ? '<select id="fdVcMv" data-v="' + t.id + '">' + named.map((b) =>
              '<option value="' + b.id + '"' + (b.id === t.building_id ? ' selected' : '') + '>' + esc(b.name) + '</option>').join('') + '</select>'
          : esc(t.building || '')) + '</td>' +
        '<td class="st">' + esc(md(t.issued_on)) + '</td>' +
        '<td class="st' + (t.status === 'entered' ? ' in' : '') + '">' +
          (t.status === 'entered' ? md(t.entered_on) + ' 사용' : '사용 전') + '</td><td>' +
        (t.status === 'entered' ? '' : (mv
          ? '<button class="fd-nmbtn" type="button" data-vcmvsave="' + t.id + '">저장</button> ' +
            '<button class="fd-nmbtn plain" type="button" data-vcmvcancel="1">취소</button>'
          : '<button class="fd-nmbtn" type="button" data-vcpass="' + t.id + '">표 받기</button> ' +
            '<button class="fd-nmbtn plain" type="button" data-vcmv="' + t.id + '">보낼 곳 고치기</button>')) + '</td></tr>';
    }
    h += '</tbody></table>';
    if (VC.total > L.length) h += '<p class="fd-tkempty">최근 ' + L.length + '장만 보여 드립니다. 전체 ' + num(VC.total) + '장.</p>';
    return h;
  }

  /* 지금까지 지급된 바우처 — 덩어리별 */
  function vchGotHtml(D) {
    const G = (VC && VC.grants) || [];
    if (!VC) return '<p class="fd-tkempty">불러오는 중입니다…</p>';
    if (!G.length) return '<p class="fd-tkempty">아직 지급된 바우처가 없습니다.</p>';
    let h = '<table class="fd-tklist"><thead><tr><th>받은 까닭</th><th>건물</th><th class="r">장수</th><th class="r">건넨</th><th class="r">남은</th><th>입력 유효기간</th></tr></thead><tbody>';
    for (const g of G) {
      h += '<tr><td>' + esc(g.memo || (g.kind === 'first' ? '첫 발행분' : '매달 추가분')) + '</td>' +
        '<td>' + esc(g.building || '') + '<span class="sub">' + esc(cityKo(g.city)) + ' ' + esc(g.bno) + '번지 · ' + num(g.slots) + '슬롯</span></td>' +
        '<td class="r mono">' + num(g.qty) + '</td>' +
        '<td class="r mono">' + num(g.drawn) + '</td>' +
        '<td class="r mono">' + num(g['left']) + '</td>' +
        '<td class="st">' + esc(md(g.issued_on)) + ' ~ ' + esc(md(g.expires_on)) +
          (g.lit ? '' : '<span class="sub">' + md(g.issued_on) + ' 이후 사용</span>') + '</td></tr>';
    }
    return h + '</tbody></table>';
  }

/* ── 임시 보딩패스 — 글자만으로 된 표 (0919 · 비너스의 옷이 오면 바탕만 갈아 끼운다) ──
   P = { kind, guest, building, where, founder, from, to, code, url, value? }
   F = { serif, mono }  글꼴 이름 */
function drawPass(ctx, W, H, P, F) {
  const WINE = '#5C1A2B';
  const NAVY = '#16243D', GOLD = '#8A6712', GOLD2 = '#C2921F', INK = '#1F232B', SOFT = '#6B7079', PAPER = '#F8F3E6', LINE = '#C9B98A';
  const S = F.serif, M = F.mono;
  const CUT = 1150;                       /* 절취선 x */
  const R = 34;

  /* 종이 */
  ctx.clearRect(0, 0, W, H);
  const BETA = P.kind === 'beta';
  ctx.fillStyle = BETA ? PAPER : '#FFFFFF';          /* 종이 — 베타는 크림, 준회원 바우처는 흰색 (0919 소로) */
  rr(ctx, 0, 0, W, H, R); ctx.fill();
  if (!BETA) { ctx.strokeStyle = LINE; ctx.lineWidth = 3; rr(ctx, 1.5, 1.5, W - 3, H - 3, R); ctx.stroke(); }   /* 흰 종이는 흰 배경에서 윤곽이 사라진다 */

  /* 바탕 — 크레덴시알 수첩의 쌍핵 지문 기요셰 (18호 정본값 · 진하기 .3 · 간격 3 · 3색) 를 표 크기로 옮긴다 (0919 소로) */
  guilloche();

  /* 머리 띠 */
  ctx.save(); rr(ctx, 0, 0, W, H, R); ctx.clip();
  ctx.fillStyle = P.kind === 'beta' ? NAVY : WINE; ctx.fillRect(0, 0, W, 132);   /* 머리 색 — 베타는 남색, 준회원 바우처는 포도주 (0919 소로) */
  ctx.fillStyle = GOLD2; ctx.fillRect(0, 132, W, 5);
  ctx.restore();

  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#FFFFFF'; ctx.font = '700 40px ' + S;
  spaced('EG UNIVERSE', 64, 84, 17);         /* 자간은 한 자씩 직접 띄운다 — 브라우저를 가리지 않는다 (0919 소로) */
  ctx.fillStyle = '#E9D9A8'; ctx.font = '400 25px ' + S;
  ctx.textAlign = 'right';
  ctx.fillText(P.kind === 'beta' ? 'BETA BOARDING PASS  |  베타 초대권 · 3주' : 'BOARDING PASS  |  준회원 바우처 · 2주', CUT - 40, 82);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#E9D9A8'; ctx.font = '400 22px ' + S;
  ctx.fillText(P.kind === 'beta' ? 'BETA · 3 WEEKS' : 'ASSOCIATE · 2 WEEKS', CUT + 44, 82);

  /* 절취선 + 위아래 홈 */
  ctx.save();
  ctx.strokeStyle = LINE; ctx.lineWidth = 3; ctx.setLineDash([3, 13]); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(CUT, 160); ctx.lineTo(CUT, H - 28); ctx.stroke();
  ctx.restore();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath(); ctx.arc(CUT, 0, 26, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(CUT, H, 26, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  if (!BETA) { ctx.strokeStyle = LINE; ctx.lineWidth = 3;          /* 흰 종이 — 아래 홈에도 테두리를 잇는다 */
    ctx.beginPath(); ctx.arc(CUT, H, 26, Math.PI, Math.PI * 2); ctx.stroke(); }

  /* ── 본권 ── */
  const X = 64;
  label(X, 196, 'PASSENGER', '받는 분');
  guestLine(X, 282, 78, 620);
  rule(X, 310, 660);

  label(760, 196, 'INVITED BY', '초대한 분');
  founderLine(760, 268, 40, 340);
  rule(760, 310, 340);

  label(X, 362, 'TO', '도착');
  bldLine(X, 428, 52, 660);
  ctx.fillStyle = SOFT; ctx.font = '400 26px ' + S;
  ctx.fillText(P.where, X, 470);
  rule(X, 496, 660);

  label(760, 362, 'VALID', '본 PASS의 입력 유효기간');
  ctx.fillStyle = INK; ctx.font = '500 ' + fit(ctx, P.from + ' — ' + P.to, 500, 38, 340, S) + 'px ' + S;
  ctx.fillText(P.from + ' — ' + P.to, 760, 428);
  const stay = P.kind === 'beta' ? '도착한 날로부터 3주 체류 가능합니다.' : '도착한 날로부터 2주 체류 가능합니다.';
  ctx.fillStyle = SOFT; ctx.font = '400 ' + fit(ctx, stay, 400, 24, 340, S) + 'px ' + S;
  ctx.fillText(stay, 760, 470);
  rule(760, 496, 340);

  label(X, 548, 'PASS No.', '번호');
  /* 번호 — 흰 띠를 깔아 강조한다 (0919 소로) */
  ctx.font = '700 56px ' + M;
  const GAP = 11;                                  /* 자간 — 한 자씩 직접 띄운다 (0919 소로 · 2배 → 액면 칸과 부딪혀 조금 좁힘) */
  band(X, 568, Math.min(ctx.measureText(P.code).width + GAP * (P.code.length - 1) + 56, 640), 88);
  ctx.fillStyle = NAVY; ctx.font = '700 56px ' + M;
  spaced(P.code, X + 28, 631, GAP);

  /* 액면 — 준회원 바우처에만 (0919 소로). ⚠ 금액은 부르는 쪽이 DB 값을 넘긴다 — 여기에 숫자를 적지 않는다 */
  if (P.value) {
    label(760, 548, 'VALUE', '액면');

  function label(x, y, en, ko) {

  /* 초대한 분 — 이름은 그대로, FOUNDER 는 영문 작은 글씨로 (0919 소로) */
  function founderLine(x, y, size, max) {
    let s = size; const tag = 'FOUNDER';
    const w = (z) => { ctx.font = '500 ' + z + 'px ' + S; const a = ctx.measureText(P.founder).width;
                       ctx.font = '500 ' + Math.round(z * 0.5) + 'px ' + S; return a + z * 0.32 + ctx.measureText(tag).width + tag.length * 2; };
    while (s > 18 && w(s) > max) s -= 2;
    ctx.fillStyle = INK; ctx.font = '500 ' + s + 'px ' + S; ctx.fillText(P.founder, x, y);
    let fx = x + ctx.measureText(P.founder).width + s * 0.32;
    ctx.fillStyle = SOFT; ctx.font = '500 ' + Math.round(s * 0.5) + 'px ' + S;
    for (const ch of tag) { ctx.fillText(ch, fx, y); fx += ctx.measureText(ch).width + 2; }
  }
  /* 고유 명칭은 크게, 격(MAISON · HOUSE · LOFT · TOWER)은 2/3 크기로 (0919 소로) */
  function bldLine(x, y, size, max) {
    const parts = String(P.building || '').trim().split(/\s+/);
    const grade = parts.length > 1 ? parts.pop() : '';
    const head = parts.join(' ');
    let s = size;
    const w = (z) => { ctx.font = '700 ' + z + 'px ' + S; const a = ctx.measureText(head).width;
                       if (!grade) return a;
                       ctx.font = '500 ' + Math.round(z * 2 / 3) + 'px ' + S; return a + z * 0.30 + ctx.measureText(grade).width; };
    while (s > 18 && w(s) > max) s -= 2;
    ctx.fillStyle = NAVY; ctx.font = '700 ' + s + 'px ' + S; ctx.fillText(head, x, y);
    if (grade) { const gx = x + ctx.measureText(head).width + s * 0.30;
      ctx.font = '500 ' + Math.round(s * 2 / 3) + 'px ' + S; ctx.fillText(grade, gx, y); }
  }
  /* 이름은 크게, 「님」은 절반 크기로 (0919 소로) */
  function guestLine(x, y, size, max) {
    let s = size;
    const w = (z) => { ctx.font = '700 ' + z + 'px ' + S; const a = ctx.measureText(P.guest).width;
                       ctx.font = '500 ' + Math.round(z / 2) + 'px ' + S; return a + z * 0.22 + ctx.measureText('님').width; };
    while (s > 18 && w(s) > max) s -= 2;
    ctx.fillStyle = NAVY; ctx.font = '700 ' + s + 'px ' + S; ctx.fillText(P.guest, x, y);
    const nx = x + ctx.measureText(P.guest).width + s * 0.22;
    ctx.font = '500 ' + Math.round(s / 2) + 'px ' + S; ctx.fillText('님', nx, y);
  }
  function spaced(text, x, y, gap) {
    for (const ch of text) { ctx.fillText(ch, x, y); x += ctx.measureText(ch).width + gap; }
  }
  function guilloche() {
    const GC = [['#D98A9A', .5], ['#8FB6D6', .55], ['#D9C271', .45]];
    const K = 2.5, gop = .3, gap = 3 * K, cs = [[470, 470], [1230, 560]];
    ctx.save(); rr(ctx, 0, 0, W, H, R); ctx.clip();
    ctx.lineWidth = .45 * K;
    for (let g = 0; g < 3; g++) {
      const off = g * 2.7, tint = g * 1.9 * K, N = Math.round(300 / 3);
      ctx.strokeStyle = GC[g][0]; ctx.globalAlpha = GC[g][1] * gop;
      for (let j = 0; j < cs.length; j++) {
        for (let i = 1; i < N; i++) {
          const r0 = i * gap * 0.92;
          ctx.beginPath();
          for (let a = 0; a <= 64; a++) {
            const th = a / 64 * 6.2832;
            const rad = r0 + 2.8 * K * Math.sin(th * 2 + off) + 1.8 * K * Math.sin(th * 6 + j);
            const px = cs[j][0] + tint + rad * Math.cos(th), py = cs[j][1] + rad * Math.sin(th) * 0.93;
            if (a) ctx.lineTo(px, py); else ctx.moveTo(px, py);
          }
          ctx.closePath(); ctx.stroke();
        }
      }
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  function way(y, who, url, text) {
    ctx.fillStyle = GOLD; ctx.font = '500 20px ' + S; ctx.fillText(who, X, y);
    let x = X + 212;
    ctx.fillStyle = LINE; ctx.fillRect(x - 18, y - 17, 2, 20);
    if (url) { ctx.fillStyle = NAVY; ctx.font = '700 23px ' + M; ctx.fillText(url, x, y); x += ctx.measureText(url).width; }
    ctx.fillStyle = INK; ctx.font = '400 22px ' + S; ctx.fillText(text, x, y);
  }
  function band(x, y, w, h) {
    ctx.save(); ctx.shadowColor = 'rgba(60,45,10,.10)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 2;
    ctx.fillStyle = BETA ? '#FFFFFF' : '#F6EBC9'; rr(ctx, x, y, w, h, 8); ctx.fill(); ctx.restore();   /* 번호 띠 — 베타는 흰색, 바우처는 옅은 금 */
    ctx.strokeStyle = BETA ? LINE : GOLD2; ctx.lineWidth = 1.5; rr(ctx, x, y, w, h, 8); ctx.stroke();
  }
  function rule(x, y, w) { ctx.fillStyle = LINE; ctx.fillRect(x, y, w, 2); }
  function fit(c, text, wt, size, max, fam) {
    let s = size; c.font = wt + ' ' + s + 'px ' + fam;
    while (s > 18 && c.measureText(text).width > max) { s -= 2; c.font = wt + ' ' + s + 'px ' + fam; }
    return s;
  }
  function ls(c, px) { try { c.letterSpacing = px + 'px'; } catch (_) {} }
  function rr(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
}

  async function showPass(id, kind) {
    kind = kind || 'beta';
    const src = kind === 'associate' ? ((VC && VC.list) || []) : ((TK && TK.list) || []);
    const t = src.find((x) => x.id === id); if (!t || !DATA) return;
    const b = (DATA.buildings || []).find((x) => x.id === t.building_id) || {};
    const V = DATA.voucher || {};
    /* ⭐ 베타는 입장이 열리는 기간, 준회원은 바우처를 쓸 수 있는 기간 — 둘 다 표의 「입력 유효기간」 */
    const P = { kind: kind, guest: t.guest_name, building: t.building || b.name || '',
      where: cityKo(b.city) + ' ' + b.bno + '번지 · ' + (b.addr || ''), founder: DATA.name || '',
      from: md(kind === 'associate' ? (t.use_from || V.use_from) : DATA.beta.start_on),
      to:   md(kind === 'associate' ? (t.use_to   || V.use_to)   : DATA.beta.end_on),
      code: t.code, url: 'app.egsalon.com/pass' };
    if (kind === 'associate') P.value = num(V.value);   /* ⚠ 쉼표는 부르는 쪽이 찍는다 — drawPass 는 받은 대로 그린다 */
    const F = { serif: '"Noto Serif KR", serif', mono: '"IBM Plex Mono", monospace' };
    /* 글꼴 조각을 그릴 글자로 먼저 부른다 — 한글 웹폰트는 쓰는 글자만 내려온다 */
    const all = Object.values(P).join(' ') + ' 님 받는 분 초대한 도착 본 PASS의 입력 유효기간 번호 액면 처음 오시는 분 기존 이용자의 경우 에서 교양 자화상의 「준회원 바우처 입력」 준회원 바우처 2주 베타 초대권 3주 에 들어와 위 번호를 입력해 주십시오 도착한 날로부터 2주 3주 체류 가능합니다. ※ EG유니버스는 노트북이나 데스크톱에서 웹으로 접속합니다. 모바일에서는 접속할 수 없으니 착오 없으시길 바랍니다.';
    try { await Promise.all([document.fonts.load('400 30px "Noto Serif KR"', all), document.fonts.load('500 30px "Noto Serif KR"', all),
      document.fonts.load('700 30px "Noto Serif KR"', all), document.fonts.load('500 30px "IBM Plex Mono"', all), document.fonts.load('700 30px "IBM Plex Mono"', all)]); } catch (_) {}
    const cv = document.createElement('canvas'); cv.width = 1600; cv.height = 800;
    drawPass(cv.getContext('2d'), 1600, 800, P, F);
    const blob = await new Promise((ok) => cv.toBlob(ok, 'image/png'));
    if (PASS && PASS.url) { try { URL.revokeObjectURL(PASS.url); } catch (_) {} }
    const stem = kind === 'associate' ? 'EG준회원바우처_' : 'EG베타초대권_';
    PASS = { id: id, kind: kind, url: URL.createObjectURL(blob),
             file: stem + t.guest_name.replace(/[\\\/:*?"<>|\s]+/g, '') + '_' + t.code + '.png' };
    if (kind === 'associate') VCLAST = id; else TKLAST = id;
    draw(DATA);
    const el = document.querySelector('.fd-pass'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function daysBetween(a, b) {               /* b - a (일) */
    const t = (s) => { const p = String(s).split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); };
    return Math.round((t(b) - t(a)) / 86400000);
  }

  function say(type, extra) {

  /* ── 「개관까지 하실 일」 띠 ── */
  function todoHtml(D) {
    const beta = D.beta || null;
    const named = D.named || 0, total = D.total || 0;
    const allNamed = total > 0 && named >= total;

    let h = '<div class="fd-h">개관까지 하실 일</div><div class="fd-todo">';

    /* ① 이름 */
    h += '<div class="fd-step' + (allNamed ? ' done' : '') + '"><div class="no">' + (allNamed ? '✓' : '1') + '</div>' +
      '<div class="what"><b>메종 이름 짓기</b><span>건물마다 파운더님의 이름을 붙여 주십시오. 초대권과 바우처에 이 이름이 적힙니다.</span></div>' +
      '<div class="state">' + total + '채 중 ' + named + '채</div></div>';

    /* ② 베타 시작일 */
    if (beta) {
      let st = '', sub = '', cls = '';
      const locked = (beta.tickets || 0) > 0;
      if (beta.start_on) {
        cls = ' done';
        st = md(beta.start_on) + ' ~ ' + md(beta.end_on);
        sub = '베타 기간이 정해졌습니다. 개관일은 ' + md(beta.open_on) + '입니다. ';
        if (locked) sub += '초대권에 적혀 손님들께 전해진 날짜라 대시보드에서는 바꾸실 수 없습니다. 부득이한 사정이 생기면 타벨라이로 알려 주십시오.';
        else sub += '첫 초대권을 뽑으시기 전까지는 다시 정하실 수 있습니다.';
      } else if (beta.closed) {
        cls = ' wait';
        st = '기간이 지났습니다';
        sub = '베타를 시작할 수 있는 기간이 지나, 베타 없이 개관합니다.';
      } else {
        const left = daysBetween(D.today, beta.last_start_on);
        st = md(beta.last_start_on) + '까지' + (left >= 0 ? ' · ' + left + '일 남음' : '');
        sub = '베타는 3주입니다. 계약 뒤 2~4주 안에 시작하시기를 권해 드리고, 늦어도 ' + md(beta.last_start_on) + '까지는 시작하셔야 합니다.';
      }
      const canPick = !beta.closed && !locked && beta.first_pick_on <= beta.last_start_on &&
                      !(beta.start_on && beta.start_on <= D.today);
      h += '<div class="fd-step' + cls + '"><div class="no">' + (beta.start_on ? '✓' : '2') + '</div>' +
        '<div class="what"><b>베타 시작일 정하기</b><span>' + esc(sub) + '</span></div>' +
        '<div class="state">' + esc(st) + '</div>' +
        (canPick && !CAL ? '<div class="act"><button class="fd-nmbtn' + (beta.start_on ? ' plain' : '') +
          '" type="button" id="fdCalOpen">' + (beta.start_on ? '시작일 다시 정하기' : '베타 시작일 정하기') + '</button></div>' : '') +
        '</div>';
      if (canPick && CAL) h += calHtml(beta);

      /* ③ 초대권 */
      const open3 = !!beta.start_on;
      const tkN = (TK && TK.total) || beta.tickets || 0, tkE = (TK && TK.entered) || 0;
      const ended = open3 && D.today > beta.end_on;
      h += '<div class="fd-step' + (open3 ? (tkN ? ' done' : '') : ' wait') + '"><div class="no">' + (open3 && tkN ? '✓' : '3') + '</div>' +
        '<div class="what"><b>베타 초대권 뽑아 건네기</b><span>' +
        (open3
          ? '초대권은 지금부터 미리 건네실 수 있고, 입장은 ' + md(beta.start_on) + '부터 ' + md(beta.end_on) + '까지 열립니다. 들어오신 분은 그날부터 3주를 온전히 머뭅니다. 초대 인원에는 제한이 없습니다.'
          : '베타 시작일이 정해지면 열립니다. 초대 인원에는 제한이 없습니다.') +
        '</span></div><div class="state">' + (open3 ? (tkN ? num(tkN) + '장 · 입장 ' + num(tkE) + '명' : '아직 0장') : '시작일을 먼저') + '</div>' +
        (open3 && !TKOPEN ? '<div class="act"><button class="fd-nmbtn' + (tkN ? ' plain' : '') + '" type="button" id="fdTkOpen">' +
          (tkN ? '초대권 보기 · 더 뽑기' : '초대권 뽑기') + '</button></div>' : '') + '</div>';
      if (open3 && TKOPEN) h += tkHtml(D, beta, ended);
    }

    const V0 = D.voucher || {};
    h += '<div class="fd-note">준회원 바우처 ' + num(V0.qty || D.voucher_first_total) + '장은 아래에 이미 서 있습니다. ' +
      (V0.use_from && !V0.usable ? '손님은 ' + md(V0.use_from) + ' 이후 사용할 수 있고, 미리 뽑아 건네시는 일은 오늘부터 하실 수 있습니다. ' : '') +
      '그 뒤로는 매달, 새 정회원 1명당 ' + num(D.voucher_per_member) + '장씩 드립니다.</div>';
    return h + '</div>';
  }

  function draw(D) {
    DATA = D;
    const body = $('fdBody');
    if (!D || !D.founder) {
      body.innerHTML = '<div class="fd-empty">대시보드는 계약이 확정된 뒤에 열립니다.</div>';
      return;
    }
    $('fdWho').textContent = (D.name || '') + ' 파운더님';
    const anyClosed = (D.buildings || []).some((b) => !b.is_open);
    let h = '';
    if (anyClosed) {
      h += '<p class="fd-hello"><b>' + esc(D.name || '') + ' 파운더님, 환영합니다.</b><br>' +
        '개관까지 하실 일을 차례대로 모아 두었습니다. 개관한 뒤에는 이 자리에 이번 달 인원과 정산이 나타납니다.</p>';
      h += todoHtml(D);
    }
    h += vchHtml(D);     /* ⭐ 0920 — 띠 바깥에 늘 선다. 개관 뒤에도 남는다 */
    h += bldHtml(D);
    body.innerHTML = h;
  }

  /* ── 손 ── */
  async function reload() {
    const { data, error } = await SB.rpc('eg_founder_dash');
    if (error) throw error;
    /* ⭐ 바우처 장부 두 가지 — 판이 늘 서 있으므로 늘 함께 받아 온다 */
    try {
      const [a, b] = await Promise.all([
        SB.rpc('eg_founder_tickets', { p_kind: 'associate' }),
        SB.rpc('eg_founder_grants')]);
      VC = { total: (a.data && a.data.total) || 0, list: (a.data && a.data.list) || [],
             grants: (b.data && b.data.grants) || (b.data && b.data.list) || [] };
    } catch (_) { VC = VC || { total: 0, list: [], grants: [] }; }
    if (data && data.beta && data.beta.start_on) {
      try { const r = await SB.rpc('eg_founder_tickets', { p_kind: 'beta' }); if (!r.error) TK = r.data; } catch (_) {}
    }
    draw(data);
  }
  /* ── 준회원 바우처 손 (0920) ── */
  async function vcIssue() {
    const i = $('fdVcName'); if (!i || VCBUSY) return;
    const nm = (i.value || '').trim();
    if (!nm) { VCERR = '받는 분의 이름을 적어 주십시오.'; draw(DATA); const j = $('fdVcName'); if (j) j.focus(); return; }
    VCBUSY = true; VCERR = ''; draw(DATA);
    try {
      const { data, error } = await SB.rpc('eg_founder_voucher_issue', { p_building: VCB, p_name: nm });
      if (error) throw error;
      VCBUSY = false; await reload();
      if (data && data.id) await showPass(data.id, 'associate');
      const j = $('fdVcName'); if (j) { j.value = ''; j.focus(); }
    } catch (e) {
      VCBUSY = false; VCERR = (e && e.message) || '뽑지 못했습니다. 잠시 뒤 다시 눌러 주십시오.';
      draw(DATA); const j = $('fdVcName'); if (j) { j.value = nm; j.focus(); }
    }
  }

  async function vcMove(id) {
    const sel = $('fdVcMv'); if (!sel || VCBUSY) return;
    const to = Number(sel.value);
    VCBUSY = true; VCERR = ''; draw(DATA);
    try {
      const { error } = await SB.rpc('eg_founder_voucher_rebuild', { p_id: id, p_building: to });
      if (error) throw error;
      VCBUSY = false; VCMOVE = null; VCLAST = id;
      if (PASS && PASS.id === id) PASS = null;   /* 보낸 곳이 바뀌었으니 옛 그림은 버린다 */
      await reload();
    } catch (e) {
      VCBUSY = false; VCERR = (e && e.message) || '고치지 못했습니다. 잠시 뒤 다시 눌러 주십시오.';
      draw(DATA);
    }
  }

  async function tkIssue() {
    if (TKBUSY) return;
    const nm = (($('fdTkName') || {}).value || '').trim();
    const bid = Number((($('fdTkB') || {}).value) || TKB);
    TKB = bid;
    if (!nm) { TKERR = '받는 분의 이름을 적어 주십시오.'; draw(DATA); const i = $('fdTkName'); if (i) i.focus(); return; }
    TKBUSY = true; TKERR = ''; draw(DATA); if ($('fdTkName')) $('fdTkName').value = nm;
    try {
      const { data, error } = await SB.rpc('eg_founder_ticket_issue', { p_building: bid, p_name: nm });
      if (error) throw error;
      TKBUSY = false; TKLAST = data && data.id; await reload();
      const i = $('fdTkName'); if (i) i.focus();
    } catch (e) {
      TKBUSY = false; TKERR = (e && e.message) || '뽑지 못했습니다. 잠시 뒤 다시 눌러 주십시오.'; draw(DATA);
      if ($('fdTkName')) $('fdTkName').value = nm;
    }
  }
  async function tkRename(id) {
    const i = $('fdTkRe'); if (!i) return;
    const nm = (i.value || '').trim();
    if (!nm) { TKERR = '받는 분의 이름을 적어 주십시오.'; draw(DATA); return; }
    try {
      const { error } = await SB.rpc('eg_founder_ticket_rename', { p_id: id, p_name: nm });
      if (error) throw error;
      TKEDIT = null; TKERR = ''; TKLAST = id; if (PASS && PASS.id === id) PASS = null; await reload();
    } catch (e) { TKERR = (e && e.message) || '고치지 못했습니다.'; draw(DATA); }
  }
  async function propose() {
    if (!PICK || CALBUSY) return;
    CALBUSY = true; CALERR = ''; draw(DATA);
    try {
      const { data, error } = await SB.rpc('eg_founder_beta_set', { p_date: PICK });
      if (error) throw error;
      /* 소로께 알림 한 통 — 실패해도 정한 날은 산다 */
      try {
        await SB.functions.invoke('application-mail', { body: { type: 'notify',
          subject: '[EG] 베타 시작일 — ' + ((data && data.name) || '') + ' 파운더님 ' + md(PICK),
          text: ((data && data.name) || '') + ' 파운더님(' + ((data && data.no) || '') + ')이 베타 시작일을 ' + md(PICK) + '로 ' +
                (data && data.again ? '다시 ' : '') + '정하셨습니다.\n\n' +
                '베타 ' + md(PICK) + ' ~ ' + md(addDays(PICK, 20)) + ' · 개관 ' + md(addDays(PICK, 21)) + '\n\n' +
                '건물 ' + ((data && data.buildings) || 0) + '채의 개관일이 함께 바뀌었습니다. 첫 초대권을 뽑으시기 전까지는 파운더님이 다시 정하실 수 있습니다.' } });
      } catch (_) {}
      CALBUSY = false; CAL = false; PICK = null; await reload();
    } catch (e) {
      CALBUSY = false; CALERR = (e && e.message) || '저장하지 못했습니다. 잠시 뒤 다시 눌러 주십시오.'; draw(DATA);
    }
  }
  function focusWord() { const i = $('fdWord'); if (i) { i.focus(); i.select(); } }
  async function saveName(id) {
    const i = $('fdWord'); if (!i || BUSY) return;
    const w = (i.value || '').trim().toUpperCase();
    if (!/^[A-Z]{3,12}$/.test(w)) { ERR = '이름은 로마자 3~12자, 한 단어로 지어 주십시오.'; draw(DATA); focusWord(); $('fdWord').value = w; return; }
    BUSY = true; ERR = ''; draw(DATA); if ($('fdWord')) $('fdWord').value = w;
    try {
      const { error } = await SB.rpc('eg_founder_name_building', { p_building: id, p_word: w });
      if (error) throw error;
      BUSY = false; EDIT = null; await reload();
    } catch (e) {
      BUSY = false; ERR = (e && e.message) || '저장하지 못했습니다. 잠시 뒤 다시 눌러 주십시오.';
      draw(DATA); if ($('fdWord')) { $('fdWord').value = w; focusWord(); }
    }
  }

  document.addEventListener('click', (e) => {
    if (e.target.closest('#fdClose')) { say('cd-close'); if (!EMBED) history.back(); return; }
    if (e.target.closest('#fdCalOpen'))  { CAL = true; PICK = null; CALERR = ''; draw(DATA); return; }
    if (e.target.closest('#fdCalClose')) { if (CALBUSY) return; CAL = false; PICK = null; CALERR = ''; draw(DATA); return; }
    const dy = e.target.closest('[data-day]');
    if (dy) { if (CALBUSY) return; PICK = dy.getAttribute('data-day'); CALERR = ''; draw(DATA); return; }
    if (e.target.closest('#fdPropose'))  { propose(); return; }
    if (e.target.closest('#fdTkOpen'))  { TKOPEN = true; TKERR = ''; draw(DATA); const i = $('fdTkName'); if (i) i.focus(); return; }
    if (e.target.closest('#fdTkClose')) { if (TKBUSY) return; TKOPEN = false; TKERR = ''; TKEDIT = null; draw(DATA); return; }
    if (e.target.closest('#fdTkGo'))    { tkIssue(); return; }
    const tp = e.target.closest('[data-tkpass]');
    if (tp) { showPass(tp.getAttribute('data-tkpass')); return; }
    if (e.target.closest('#fdPassClose')) { PASS = null; draw(DATA); return; }
    const te = e.target.closest('[data-tkedit]');
    if (te) { TKEDIT = te.getAttribute('data-tkedit'); TKERR = ''; draw(DATA); const i = $('fdTkRe'); if (i) { i.focus(); i.select(); } return; }
    if (e.target.closest('[data-tkcancel]')) { TKEDIT = null; TKERR = ''; draw(DATA); return; }
    const ts = e.target.closest('[data-tksave]');
    if (ts) { tkRename(ts.getAttribute('data-tksave')); return; }
    /* ── 준회원 바우처 (0920) ── */
    const vt = e.target.closest('[data-vctab]');
    if (vt) { VCTAB = vt.getAttribute('data-vctab'); VCERR = ''; VCMOVE = null; draw(DATA); return; }
    if (e.target.closest('#fdVcGo')) { vcIssue(); return; }
    const vp = e.target.closest('[data-vcpass]');
    if (vp) { showPass(vp.getAttribute('data-vcpass'), 'associate'); return; }
    const vm = e.target.closest('[data-vcmv]');
    if (vm) { VCMOVE = vm.getAttribute('data-vcmv'); VCERR = ''; draw(DATA); const j = $('fdVcMv'); if (j) j.focus(); return; }
    if (e.target.closest('[data-vcmvcancel]')) { if (VCBUSY) return; VCMOVE = null; VCERR = ''; draw(DATA); return; }
    const vs = e.target.closest('[data-vcmvsave]');
    if (vs) { vcMove(vs.getAttribute('data-vcmvsave')); return; }
    const n = e.target.closest('[data-name]');
    if (n) { EDIT = Number(n.getAttribute('data-name')); ERR = ''; draw(DATA); focusWord(); return; }
    if (e.target.closest('[data-cancel]')) { if (BUSY) return; EDIT = null; ERR = ''; draw(DATA); return; }
    const s = e.target.closest('[data-save]');
    if (s) { saveName(Number(s.getAttribute('data-save'))); return; }
  });
  document.addEventListener('change', (e) => {
    if (e.target && e.target.id === 'fdTkB') TKB = Number(e.target.value);
    if (e.target && e.target.id === 'fdVcB') VCB = Number(e.target.value);
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target && e.target.id === 'fdTkName') { e.preventDefault(); tkIssue(); return; }
    if (e.key === 'Enter' && e.target && e.target.id === 'fdVcName') { e.preventDefault(); vcIssue(); return; }
    if (e.key === 'Enter' && e.target && e.target.id === 'fdTkRe')   { e.preventDefault(); tkRename(e.target.getAttribute('data-t')); return; }
    if (e.key === 'Enter' && e.target && e.target.id === 'fdWord') { e.preventDefault(); saveName(Number(e.target.getAttribute('data-b'))); return; }
    if (e.key === 'Escape') { if (CAL && !CALBUSY) { CAL = false; PICK = null; CALERR = ''; draw(DATA); } else if (EDIT != null && !BUSY) { EDIT = null; ERR = ''; draw(DATA); } else say('cd-close'); }
  });

  /* ── 클라이언트 — 창 안이면 집주인 것 (0818 한 문서 · 한 클라이언트) ── */
  function loadScript(src) {
    return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  }
  async function client() {
    try { if (window.parent !== window && window.parent.egSupa) return window.parent.egSupa; } catch (_) {}
    if (!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
    return window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { storageKey: 'eungyo-auth', persistSession: true, autoRefreshToken: true } });
  }

  (async function boot() {
    try {
      SB = await client();
      await reload();
    } catch (e) {
      $('fdBody').innerHTML = '<div class="fd-empty">대시보드를 불러오지 못했습니다.<br>' + esc((e && e.message) || '') + '</div>';
    }
    try { $('fdPanel').focus(); } catch (_) {}
  })();
})();
</script>
</body>
</html>
