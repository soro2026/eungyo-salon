<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>분더카머 투어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --night:#0a1020; --night2:#0d1428;
    --gold:#c9a227; --gold-l:#e0c558; --gold-soft:#9a8138;
    --cream:#f3e9d2; --dim:#9aa3b8;
    --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --serif:'Cormorant Garamond',serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:
    radial-gradient(1200px 600px at 50% -10%, #14203f 0%, var(--night) 55%, #070b16 100%);
    color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{padding:0 0 60px}
  a{color:inherit;text-decoration:none}

  /* 헤더 */
  .top{position:sticky;top:0;z-index:10;
    display:flex;align-items:center;gap:12px;
    padding:16px 18px 14px;
    background:linear-gradient(180deg, rgba(8,12,24,.96) 0%, rgba(8,12,24,.82) 70%, rgba(8,12,24,0) 100%);
    backdrop-filter:blur(8px)}
  .back{font-size:22px;line-height:1;color:var(--dim);
    background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:8px}
  .back:hover{color:var(--cream)}
  .ttl{font-family:var(--serif);font-size:23px;letter-spacing:.04em;color:var(--gold-l);font-weight:600}
  .ttl small{display:block;font-family:var(--sans);font-size:10.5px;font-weight:300;
    letter-spacing:.32em;color:var(--dim);margin-top:1px}

  .wrap{max-width:560px;margin:0 auto;padding:0 18px}

  /* 검색 */
  .search-box{position:relative;margin:6px 0 26px}
  .search-box input{width:100%;padding:14px 44px 14px 16px;
    font-family:var(--sans);font-size:15px;color:var(--cream);
    background:rgba(255,255,255,.05);
    border:1px solid rgba(201,162,39,.28);border-radius:14px;outline:none;
    transition:border-color .2s}
  .search-box input::placeholder{color:#67708a}
  .search-box input:focus{border-color:rgba(201,162,39,.6)}
  .search-box .ic{position:absolute;right:15px;top:50%;transform:translateY(-50%);
    font-size:16px;color:var(--gold-soft);pointer-events:none}

  /* 섹션 라벨 */
  .sec-label{display:flex;align-items:center;gap:8px;
    font-size:11.5px;font-weight:500;letter-spacing:.22em;color:var(--gold-soft);
    text-transform:uppercase;margin:0 2px 12px}
  .sec-label .line{flex:1;height:1px;background:linear-gradient(90deg, rgba(201,162,39,.3), transparent)}

  /* 카드 그리드 */
  .grid{display:flex;flex-direction:column;gap:9px;margin-bottom:32px}
  .card{display:flex;align-items:center;gap:13px;
    padding:12px 13px;border-radius:14px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    transition:background .18s, border-color .18s, transform .12s}
  .card:hover{background:rgba(201,162,39,.07);border-color:rgba(201,162,39,.3)}
  .card:active{transform:scale(.99)}
  .card .body{flex:1;display:flex;align-items:center;gap:13px;cursor:pointer;min-width:0}
  .ava{flex-shrink:0;width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:21px;font-weight:600;color:#1c1605;
    background:linear-gradient(145deg, var(--gold-l) 0%, var(--gold) 70%, var(--gold-soft) 100%);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.4), 0 2px 6px rgba(0,0,0,.3)}
  .info{min-width:0}
  .nick{font-size:15px;font-weight:500;color:var(--cream);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .addr{font-size:11.5px;color:var(--dim);letter-spacing:.03em;margin-top:1px}
  .star-btn{flex-shrink:0;font-size:20px;line-height:1;
    background:none;border:none;cursor:pointer;padding:6px 7px;border-radius:9px;
    color:#4a5570;transition:color .15s, transform .12s}
  .star-btn:hover{transform:scale(1.15)}
  .star-btn.on{color:var(--gold-l)}

  /* 빈/안내 상태 */
  .empty{text-align:center;color:var(--dim);font-size:13px;
    padding:26px 16px;line-height:1.7}
  .empty .big{font-size:30px;margin-bottom:8px;opacity:.6}
  .hint-login{font-size:12px;color:var(--gold-soft);margin-top:6px}
  .spin{text-align:center;color:var(--dim);font-size:12.5px;padding:20px;letter-spacing:.1em}
  .foot{text-align:center;color:#4a5066;font-size:10.5px;letter-spacing:.2em;
    margin-top:40px;font-family:var(--serif);font-style:italic}
</style>
</head>
<body>

<div class="top">
  <button class="back" onclick="goBack()" aria-label="뒤로">‹</button>
  <div class="ttl">분더카머 투어<small>AUTRES COMPAGNONS</small></div>
</div>

<div class="wrap">
  <div class="search-box">
    <input id="q" type="search" inputmode="search" autocomplete="off"
           placeholder="콩파뇽 닉네임으로 찾기 (2글자 이상)" />
    <span class="ic">🔍</span>
  </div>

  <!-- 검색 결과 -->
  <div id="searchSection" style="display:none">
    <div class="sec-label">찾은 콩파뇽<span class="line"></span></div>
    <div id="searchGrid" class="grid"></div>
  </div>

  <!-- 즐겨찾기 -->
  <div id="favSection">
    <div class="sec-label">내 즐겨찾기<span class="line"></span></div>
    <div id="favGrid" class="grid"></div>
  </div>

  <div class="foot">— 환대가 입구이고 안목이 결실인 곳 —<br><span style="font-size:9px;color:#3a4156;font-family:monospace;letter-spacing:1px">tour 0627b</span></div>
</div>

<script>
const SUPA_URL = "https://cyhlotwdisjvoxvfkpnd.supabase.co";
const SUPA_KEY = "sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR";
const supa = supabase.createClient(SUPA_URL, SUPA_KEY, {
  auth:{ storageKey:'eungyo-auth', persistSession:true, autoRefreshToken:true }
});

let MY_UID = null;
const favSet = new Set();   // 내가 즐겨찾기한 uid 집합 (★ 채움 판정용)

// ── 유틸 ──
function initial(nick){
  if(!nick) return '?';
  const c = nick.trim()[0] || '?';
  return /[a-z]/i.test(c) ? c.toUpperCase() : c;
}
function addrText(city, no){
  if(!city) return '아직 도시에 들지 않은 콩파뇽';
  const CITY = { paris:'파리', heunghae:'흥해' };
  return (CITY[city] || city) + (no ? ' · 메종 ' + no : '');
}
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

// 남의 현관 직행 (강하 생략 → 노커 대문). 패널 안 iframe이면 최상위 화면을 전환.
function visitHome(nick){
  (window.top || window).location.href = '/eungyo-salon/maison.html?user=' + encodeURIComponent(nick) + '&enter=1';
}
function goBack(){
  // 패널 모드(maison 안 iframe)면 패널만 닫기
  const panel = new URLSearchParams(location.search).get('panel') === '1';
  if (panel && window.parent && window.parent.closeTourPanel){ window.parent.closeTourPanel(); return; }
  if(history.length > 1) history.back(); else location.href = '/eungyo-salon/maison.html?enter=1';
}

// 카드 한 장 만들기
function makeCard(c){
  const card = document.createElement('div');
  card.className = 'card';
  const on = favSet.has(c.id);
  card.innerHTML =
    '<div class="body">' +
      '<div class="ava">' + esc(initial(c.nickname)) + '</div>' +
      '<div class="info">' +
        '<div class="nick">' + esc(c.nickname) + '</div>' +
        '<div class="addr">' + esc(addrText(c.city, c.maison_no)) + '</div>' +
      '</div>' +
    '</div>' +
    '<button class="star-btn ' + (on?'on':'') + '" title="즐겨찾기">' + (on?'★':'☆') + '</button>';
  card.querySelector('.body').addEventListener('click', ()=> visitHome(c.nickname));
  card.querySelector('.star-btn').addEventListener('click', (e)=>{ e.stopPropagation(); toggleFav(c, e.currentTarget); });
  return card;
}

// ── 즐겨찾기 ──
async function toggleFav(c, btn){
  if(!MY_UID){ alert('로그인하면 즐겨찾기를 모을 수 있어요.'); return; }
  const on = favSet.has(c.id);
  // 낙관적 토글
  if(on){ favSet.delete(c.id); btn.classList.remove('on'); btn.textContent='☆'; }
  else  { favSet.add(c.id);    btn.classList.add('on');    btn.textContent='★'; }
  try{
    if(on){
      await supa.from('favorites').delete().eq('uid', MY_UID).eq('fav_uid', c.id);
    }else{
      await supa.from('favorites').upsert({ uid: MY_UID, fav_uid: c.id }, { onConflict:'uid,fav_uid' });
    }
    loadFavorites();   // 즐겨찾기 섹션 갱신
  }catch(err){
    console.warn('즐겨찾기 처리 실패:', err);
    // 롤백
    if(on){ favSet.add(c.id); btn.classList.add('on'); btn.textContent='★'; }
    else  { favSet.delete(c.id); btn.classList.remove('on'); btn.textContent='☆'; }
  }
}

async function loadFavorites(){
  const grid = document.getElementById('favGrid');
  if(!MY_UID){
    grid.innerHTML = '<div class="empty"><div class="big">✦</div>'
      + '로그인하면 마음에 드는 콩파뇽을<br>즐겨찾기로 모아둘 수 있어요.'
      + '<div class="hint-login">위 검색으로 다른 콩파뇽을 찾아볼 수 있어요.</div></div>';
    return;
  }
  try{
    const { data, error } = await supa.rpc('list_favorites');
    if(error) throw error;
    favSet.clear();
    (data||[]).forEach(r=> favSet.add(r.id));
    if(!data || !data.length){
      grid.innerHTML = '<div class="empty"><div class="big">✦</div>'
        + '아직 즐겨찾기한 콩파뇽이 없어요.<br>검색해서 ☆를 눌러 모아보세요.</div>';
      return;
    }
    grid.innerHTML = '';
    data.forEach(c=> grid.appendChild(makeCard(c)));
  }catch(err){
    console.warn('즐겨찾기 로드 실패:', err);
    grid.innerHTML = '<div class="empty">즐겨찾기를 불러오지 못했어요.</div>';
  }
}

// ── 검색 ──
let searchTimer = null, lastQ = '';
function onSearchInput(){
  const q = document.getElementById('q').value.trim();
  clearTimeout(searchTimer);
  const favSec = document.getElementById('favSection');
  const searchSec = document.getElementById('searchSection');
  if(q.length < 2){
    searchSec.style.display = 'none';
    favSec.style.display = '';
    lastQ = '';
    return;
  }
  favSec.style.display = 'none';
  searchSec.style.display = '';
  const grid = document.getElementById('searchGrid');
  grid.innerHTML = '<div class="spin">찾는 중…</div>';
  searchTimer = setTimeout(()=> runSearch(q), 280);   // 디바운스
}

async function runSearch(q){
  lastQ = q;
  try{
    const { data, error } = await supa.rpc('search_companions', { p_q: q, p_limit: 20 });
    if(error) throw error;
    if(q !== lastQ) return;   // 더 최신 입력이 왔으면 폐기
    const grid = document.getElementById('searchGrid');
    if(!data || !data.length){
      grid.innerHTML = '<div class="empty">‘' + esc(q) + '’에 맞는 콩파뇽을 찾지 못했어요.</div>';
      return;
    }
    grid.innerHTML = '';
    data.forEach(c=> grid.appendChild(makeCard(c)));
  }catch(err){
    console.warn('검색 실패:', err);
    document.getElementById('searchGrid').innerHTML = '<div class="empty">검색 중 문제가 생겼어요.</div>';
  }
}

// ── 초기화 ──
(async function init(){
  try{
    const { data:{ session } } = await supa.auth.getSession();
    MY_UID = session?.user?.id || null;
  }catch(e){ console.warn('세션 읽기 실패:', e); }
  document.getElementById('q').addEventListener('input', onSearchInput);
  await loadFavorites();
})();
</script>
</body>
</html>
