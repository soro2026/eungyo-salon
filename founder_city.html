<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EG 도시별 현황 · EG유니버스</title>
<!-- ─────────────────────────────────────────────────────────────────────
     founder_city.html — 타륜 › EG파운더 전용메뉴 › EG 도시별 현황
     2026.09.18 · 파이스

     ① 매물은 DB eg_founder_market 한 장에서 읽는다 — ⚠ 이 파일에 건물을 적지 않는다
        badge — open 매물 · held 예약 중 · soldout 팔린 지 2주 이내
        ⭐ 「2주」라는 숫자는 뷰가 갖는다. 이 파일에 적지 않는다
        참가비는 eg_founder_fee_table() — ⚠ 값도 적지 않는다 (사는 곳은 DB 한 군데)
     ② 옷은 신청안내(founder_guide.html)와 같다 — 흰 서류 · 876 판
     ③ 창은 하나, 종이만 바뀐다. 신청안내 ⑧ 끝 버튼 → 이 종이 · 「← 신청안내」로 되돌아간다
     ④ ⭐ 지구 임장 — [보기]를 누르면 서류가 오른쪽으로 접히고 지구가 그 건물로 난다
        접기·되살리기·비행은 전부 부모(founder_menu.js)가 한다. 이 종이는 말만 건넨다.

     부모와 주고받는 말
       보냄  fc-back                신청안내로 돌아간다
             fc-close               창을 닫는다
             fc-fly  {building}     접고 날아간다
             fc-contract {res}      신청이 섰다 · 계약서 종이로 넘긴다
             fc-unfold              펴고 목록으로 돌아온다
       받음  fc-folded {on}         접혔다 / 펴졌다 — 이 종이가 옷을 갈아입는다
             fc-reload              계약서에서 돌아왔다 — 목록을 다시 세운다

     ⑤ ⭐ 담은 목록 — 아래 띠를 누르면 담은 건물이 펼쳐진다 (0918 소로 — 「장바구니처럼 전체 목록」)
        한 채씩 ✕ 로 뺀다. [비우기]밖에 없으면 한 채 바꾸려고 처음부터 다시 담아야 한다.
        ⭐ 이 목록의 모양이 곧 계약서 「계약 대상」 칸이다 — 한 번 지어 두 번 쓴다.

     ⚠ [예약]은 아직 잠겨 있다 — 예약 표가 서면 푼다 (0918)
     ───────────────────────────────────────────────────────────────────── -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script>if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');</script>
<style>
  :root{
    --ink:#1F232B; --navy:#16243D; --gold:#C2921F; --gold-ink:#8A6712; --yellow:#F2C518;
    --muted:#5E6269; --soft:#6B7079; --faint:#8A9099; --rule:#EDEEF1; --line:#DCDFE4; --line2:#E4E6EA;
    --serif:'Noto Serif KR', 'Noto Serif CJK KR', serif;
    --batang:'Gowun Batang', 'Noto Serif KR', serif;
    --mono:'IBM Plex Mono', 'Noto Serif KR', monospace;
  }
  html, body{ margin:0; height:100%; }
  body{ background:#C9CDD4; color:var(--ink); font-family:var(--serif);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  html.embed, html.embed body{ background:transparent; }
  ::selection{ background:rgba(194,146,31,.18); }
  button{ font-family:inherit; }

  /* ── 판 — 신청안내와 같은 876 흰 서류 ── */
  #fcStage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #fcPanel{ position:relative; display:flex; flex-direction:column;
    width:876px; height:calc(100vh - 80px); max-height:calc(100vh - 80px);
    background:#FFFFFF; border-radius:6px; box-shadow:0 26px 70px rgba(12,18,30,.34);
    overflow:hidden; }
  #fcPanel:focus{ outline:none; }

  /* ── 접힘 — 오른쪽 패널. 뒤 지구가 살아난다 ── */
  html.fold #fcStage{ justify-content:flex-end; align-items:stretch; }
  html.fold #fcPanel{ width:100%; height:100%; max-height:none; border-radius:0;
    box-shadow:-18px 0 50px rgba(12,18,30,.22); }
  html.fold .fc-only-list{ display:none !important; }
  html:not(.fold) .fc-only-detail{ display:none !important; }

  /* ── 머리 ── */
  .fc-top{ flex:0 0 auto; display:flex; align-items:center; gap:12px;
    padding:16px 22px 14px; border-bottom:1px solid var(--rule); }
  .fc-back{ display:inline-flex; align-items:center; gap:7px; padding:7px 12px;
    border:1px solid var(--line); border-radius:3px; background:#FFFFFF; color:var(--muted);
    font:400 13px/1 var(--serif); cursor:pointer; transition:background .14s, color .14s, border-color .14s; }
  .fc-back:hover, .fc-back:focus-visible{ background:var(--navy); border-color:var(--navy); color:#FFFFFF; outline:none; }
  .fc-title{ flex:1 1 auto; font:700 17px/1.4 var(--batang); color:var(--navy); letter-spacing:.01em; }
  .fc-x{ width:34px; height:34px; display:flex; align-items:center; justify-content:center; padding:0;
    border:1px solid var(--line); border-radius:3px; background:#FFFFFF; color:var(--muted);
    font:400 15px/1 var(--mono); cursor:pointer; transition:background .14s, color .14s, border-color .14s; }
  .fc-x:hover, .fc-x:focus-visible{ background:var(--navy); border-color:var(--navy); color:#FFFFFF; outline:none; }

  /* ── 도시 탭 ── */
  .fc-tabs{ flex:0 0 auto; display:flex; gap:26px; padding:0 22px; border-bottom:1px solid var(--rule); }
  .fc-tab{ position:relative; padding:15px 2px 13px; border:0; background:none; cursor:pointer;
    font:400 15px/1 var(--serif); color:var(--faint); transition:color .14s; }
  .fc-tab b{ font-weight:400; }
  .fc-tab i{ margin-left:6px; font:400 11.5px/1 var(--mono); font-style:normal; color:var(--faint); }
  .fc-tab:hover{ color:var(--muted); }
  .fc-tab.on{ color:var(--navy); }
  .fc-tab.on::after{ content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--gold); }
  .fc-tab.on i{ color:var(--gold-ink); }

  /* ── 목록 ── */
  .fc-scroll{ flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain;
    scrollbar-width:none; -ms-overflow-style:none; }
  .fc-scroll::-webkit-scrollbar{ display:none; width:0; height:0; }
  .fc-list{ padding:8px 22px 22px; }

  .fc-card{ display:grid; grid-template-columns:1fr auto; gap:4px 20px; align-items:start;
    padding:20px 4px 19px; border-bottom:1px solid var(--rule); }
  .fc-card:last-child{ border-bottom:0; }
  .fc-name{ grid-column:1; font:500 17px/1.5 var(--serif); color:var(--ink); word-break:keep-all; }
  .fc-name em{ margin-left:9px; font:400 11.5px/1 var(--mono); font-style:normal;
    letter-spacing:.1em; color:var(--faint); text-transform:uppercase; }
  .fc-price{ grid-column:2; grid-row:1 / span 2; align-self:center; text-align:right; white-space:nowrap; }
  .fc-price b{ display:block; font:500 18px/1.4 var(--serif); color:var(--navy); }
  .fc-price span{ display:block; margin-top:3px; font:400 11.5px/1.5 var(--serif); color:var(--faint); }
  .fc-pitch{ grid-column:1; font:400 14px/1.75 var(--serif); color:var(--soft); word-break:keep-all; }
  .fc-acts{ grid-column:1 / -1; margin-top:13px; display:flex; gap:8px; }

  .fc-btn{ padding:8px 15px; border:1px solid var(--line); border-radius:3px; background:#FFFFFF;
    color:var(--muted); font:400 13.5px/1 var(--serif); cursor:pointer;
    transition:background .14s, color .14s, border-color .14s; }
  .fc-btn:hover, .fc-btn:focus-visible{ background:var(--navy); border-color:var(--navy); color:#FFFFFF; outline:none; }
  .fc-btn.gold{ border-color:#E3D4AE; color:var(--gold-ink); background:rgba(194,146,31,.07); }
  .fc-btn.gold:hover, .fc-btn.gold:focus-visible{ background:var(--gold); border-color:var(--gold); color:#FFFFFF; }
  .fc-btn.in{ background:var(--navy); border-color:var(--navy); color:#FFFFFF; }
  .fc-btn[disabled]{ opacity:.42; cursor:default; }
  .fc-btn[disabled]:hover{ background:#FFFFFF; border-color:var(--line); color:var(--muted); }

  .fc-slots{ font:400 13px/1 var(--mono); color:var(--faint); }

  /* ── 매물이 아닌 카드 — 신청 중 · SOLD OUT (0918 소로 「기록에 남아 있는 게 좋겠다」) ── */
  .fc-card.off{ opacity:.55; }
  .fc-card.off .fc-price b{ color:var(--muted); font-weight:400; }
  .fc-price i{ display:block; font:400 13px/1.4 var(--mono); font-style:normal;
    letter-spacing:.11em; color:var(--faint); }
  .fc-mark{ padding:8px 15px; border:1px dashed var(--line); border-radius:3px;
    background:transparent; color:var(--faint); font:400 13.5px/1 var(--serif); }

  /* ── 신청 확인 판 ── */
  #fcPanel{ position:relative; }
  .fc-ask{ position:absolute; inset:0; z-index:9; display:flex; align-items:center;
    justify-content:center; padding:22px; background:rgba(28,32,44,.28); }
  .fc-ask[hidden]{ display:none; }
  .fc-ask-box{ width:100%; max-width:432px; background:#FFFFFF; border:1px solid var(--line);
    border-radius:4px; padding:26px 26px 20px; box-shadow:0 18px 44px rgba(28,32,44,.18); }
  .fc-ask-box .sum{ margin:0; font:400 14px/1.9 var(--serif); color:var(--ink); word-break:keep-all; }
  .fc-ask-box .sum b{ font-weight:500; color:var(--navy); }
  .fc-ask-box .say{ margin:15px 0 0; padding-top:15px; border-top:1px solid var(--rule);
    font:400 13.5px/1.9 var(--serif); color:var(--soft); word-break:keep-all; }
  .fc-ask-box .err{ margin:12px 0 0; font:400 13px/1.75 var(--serif); color:var(--gold-ink);
    word-break:keep-all; }
  .fc-ask-box .err:empty{ display:none; }
  .fc-ask-box .acts{ margin-top:20px; display:flex; gap:8px; justify-content:flex-end; }

  /* ── 담은 것 — 판 아래 띠 ── */
  .fc-cart{ flex:0 0 auto; display:flex; align-items:center; gap:16px;
    padding:15px 22px; border-top:1px solid var(--line2); background:#FCFCFD; }
  .fc-cart.able{ cursor:pointer; }
  .fc-cart .sum{ flex:1 1 auto; font:400 13.5px/1.7 var(--serif); color:var(--muted); word-break:keep-all; }
  .fc-cart .sum b{ color:var(--navy); font-weight:500; }
  .fc-cart .sum u{ text-decoration:none; color:var(--faint); font:400 12px/1 var(--mono); margin-left:2px; }
  .fc-cart .caret{ flex:0 0 auto; width:15px; font:400 11px/1 var(--mono); color:var(--faint);
    transition:transform .18s ease; }
  .fc-cart.open .caret{ transform:rotate(180deg); }
  .fc-cart .warn{ color:var(--gold-ink); }
  .fc-note{ margin:0; padding:0 22px 14px; font:400 12px/1.7 var(--serif); color:var(--faint); background:#FCFCFD; }

  /* ── 담은 것 펼침 — 띠를 누르면 선다 (0918 소로 「장바구니처럼 전체 목록」) ── */
  .fc-bag{ flex:0 0 auto; display:none; max-height:236px; overflow-y:auto; overscroll-behavior:contain;
    padding:6px 22px 4px; border-top:1px solid var(--line2); background:#FCFCFD;
    scrollbar-width:none; -ms-overflow-style:none; }
  .fc-bag::-webkit-scrollbar{ display:none; width:0; height:0; }
  .fc-bag.on{ display:block; }
  .fc-bag-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--rule); }
  .fc-bag-row:last-child{ border-bottom:0; }
  .fc-bag-row .nm{ flex:1 1 auto; font:400 14px/1.5 var(--serif); color:var(--ink); word-break:keep-all; }
  .fc-bag-row .nm em{ margin-left:8px; font:400 10.5px/1 var(--mono); font-style:normal;
    letter-spacing:.09em; color:var(--faint); text-transform:uppercase; }
  .fc-bag-row .sl{ flex:0 0 auto; font:400 12px/1 var(--mono); color:var(--faint); }
  .fc-bag-row .pr{ flex:0 0 auto; min-width:86px; text-align:right;
    font:400 14px/1.5 var(--serif); color:var(--navy); }
  .fc-bag-row .rm{ flex:0 0 auto; width:24px; height:24px; padding:0; border:1px solid var(--line);
    border-radius:3px; background:#FFFFFF; color:var(--faint); font:400 12px/1 var(--mono); cursor:pointer;
    transition:background .14s, color .14s, border-color .14s; }
  .fc-bag-row .rm:hover, .fc-bag-row .rm:focus-visible{ background:var(--navy); border-color:var(--navy); color:#FFFFFF; outline:none; }

  /* ── 접힌 뒤의 상세 ── */
  .fc-detail{ padding:22px; }
  .fc-detail h3{ margin:0 0 4px; font:700 20px/1.5 var(--batang); color:var(--navy); word-break:keep-all; }
  .fc-detail .where{ margin:0 0 20px; font:400 11.5px/1 var(--mono); letter-spacing:.1em;
    color:var(--faint); text-transform:uppercase; }
  .fc-detail .pitch{ margin:0 0 22px; font:400 15px/1.85 var(--serif); color:var(--muted); word-break:keep-all; }
  .fc-spec{ width:100%; border-collapse:collapse; margin-bottom:22px; }
  .fc-spec th, .fc-spec td{ padding:11px 2px; border-bottom:1px solid var(--rule);
    font:400 14px/1.6 var(--serif); text-align:left; }
  .fc-spec th{ width:88px; font-weight:400; color:var(--faint); }
  .fc-spec td{ color:var(--ink); }
  .fc-spec td b{ font-weight:500; color:var(--navy); }

  .fc-wait{ padding:60px 22px; font:400 15px/1.8 var(--serif); color:var(--faint); }
</style>
</head>
<body>
<div id="fcStage">
  <div id="fcPanel" tabindex="-1">
    <div class="fc-top">
      <button class="fc-back" id="fcBack" type="button"><span aria-hidden="true">←</span><span id="fcBackText">신청안내</span></button>
      <div class="fc-title" id="fcTitle">EG 도시별 현황</div>
      <button class="fc-x" id="fcClose" type="button" aria-label="닫기">✕</button>
    </div>
    <div class="fc-tabs fc-only-list" id="fcTabs"></div>
    <div class="fc-scroll" id="fcScroll">
      <div class="fc-list fc-only-list" id="fcList"><p class="fc-wait">매물을 불러오는 중입니다.</p></div>
      <div class="fc-detail fc-only-detail" id="fcDetail"></div>
    </div>
    <div class="fc-bag" id="fcBag"></div>
    <div class="fc-cart" id="fcCart"></div>
    <p class="fc-note" id="fcNote"></p>

    <!-- 신청 확인 — ⭐ 여기서 취소하셔도 아무것도 잠기지 않는다 (0918 소로) -->
    <div class="fc-ask" id="fcAsk" hidden>
      <div class="fc-ask-box" role="dialog" aria-modal="true" aria-labelledby="fcAskSum">
        <p class="sum" id="fcAskSum"></p>
        <p class="say">아래 계약서 작성 버튼을 누르시면, 해당 건에 대해 상세 계약 조건과 내용을
          확인하실 수 있습니다. 서명 후 계약서에 표기된 계좌로 이체하시면
          파운더 신청의 모든 절차를 마무리짓습니다.</p>
        <p class="err" id="fcAskErr"></p>
        <div class="acts">
          <button class="fc-btn" type="button" id="fcAskNo">취소하기</button>
          <button class="fc-btn gold" type="button" id="fcAskGo">계약서 작성하기</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const V = '0918';
  const SUPA_URL = 'https://cyhlotwdisjvoxvfkpnd.supabase.co';
  const SUPA_KEY = 'sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
  const EMBED = document.documentElement.classList.contains('embed');
  const CAP = 216;                                  /* 한 번에 담는 슬롯 합계 상한 (0917저녁 9호) */

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const won = (n) => Number(n).toLocaleString('ko-KR');

  /* 도시 이름 · 차례 — DB 의 city 값 그대로가 열쇠 */
  const CITY = [
    { key: 'paris',   ko: '파리'   },
    { key: 'london',  ko: '런던'   },
    { key: 'newyork', ko: '뉴욕'   },
  ];
  /* 격 — 0917저녁 14호. 이름의 뒷단어는 공식이 붙인다 */
  function grade(city, slots) {
    if (city === 'paris')  return 'MAISON';
    if (city === 'london') return 'HOUSE';
    return slots <= 81 ? 'LOFT' : 'TOWER';
  }
  const cityKo = (k) => (CITY.find((c) => c.key === k) || {}).ko || k;
  const keyOf  = (b) => b.city + ':' + b.bno;

  let BLD = [], FEE = {}, TAB = null, SB = null;
  const SEL = 'id,city,bno,slots,lat,lng,wall,status,badge';
  const CART = new Map();                           /* key → 건물 */
  let FOLDED = false, SHOWN = null;                 /* 접혔는가 · 지금 보고 있는 건물 */

  /* ── 부모에게 말 걸기 ── */
  function say(type, extra) {
    if (!EMBED) return;
    try { window.parent.postMessage(Object.assign({ type: type }, extra || {}), location.origin); } catch (_) {}
  }

  /* ── 값 ── */
  const feeOf = (slots) => (FEE[slots] != null ? FEE[slots] : null);
  const priceText = (slots) => { const f = feeOf(slots); return f == null ? '—' : won(f) + '원'; };

  /* ── 카드 ── */
  /* 매물인가 — badge 가 없는 줄은 매물로 본다 */
  const isOpen = (b) => (b.badge || 'open') === 'open';
  const markOf = (b) => (b.badge === 'held' ? '신청 중' : 'SOLD OUT');

  function card(b) {
    const w = b.wall || {};
    const open = isOpen(b);
    const inCart = CART.has(keyOf(b));
    return '<div class="fc-card' + (open ? '' : ' off') + '" data-key="' + esc(keyOf(b)) + '">' +
      '<div class="fc-name">' + esc(w.landmark || ('건물 ' + b.bno)) +
        '<em>' + esc(cityKo(b.city)) + ' · ' + grade(b.city, b.slots) + '</em></div>' +
      '<div class="fc-price">' + (b.badge === 'soldout'
        ? '<i>SOLD OUT</i>'
        : '<b>' + priceText(b.slots) + '</b><span>부가세 별도</span>') + '</div>' +
      '<div class="fc-pitch">' + esc(w.pitch || '') + '</div>' +
      '<div class="fc-acts">' +
        '<span class="fc-slots">' + b.slots + '슬롯</span>' +
        '<span style="flex:1 1 auto"></span>' +
        '<button class="fc-btn" type="button" data-act="see">보기</button>' +
        (open
          ? '<button class="fc-btn gold' + (inCart ? ' in' : '') + '" type="button" data-act="cart">' +
              (inCart ? '담김 ✓' : '담기') + '</button>'
          : (b.badge === 'held' ? '<span class="fc-mark">' + markOf(b) + '</span>' : '')) +
      '</div></div>';
  }

  function drawTabs() {
    $('fcTabs').innerHTML = CITY.filter((c) => BLD.some((b) => b.city === c.key)).map((c) => {
      const n = BLD.filter((b) => b.city === c.key && isOpen(b)).length;   /* ⭐ 살 수 있는 것만 센다 */
      return '<button class="fc-tab' + (c.key === TAB ? ' on' : '') + '" type="button" data-city="' + c.key + '">' +
        '<b>' + c.ko + '</b><i>' + n + '</i></button>';
    }).join('');
  }

  /* 매물이 위, 기록(예약 중 · SOLD OUT)이 아래 — sort 는 안정 정렬이라 그 안의 차례는 그대로 */
  const RANK = { open: 0, held: 1, soldout: 2 };
  function drawList() {
    const rows = BLD.filter((b) => b.city === TAB)
      .slice().sort((x, y) => (RANK[x.badge] || 0) - (RANK[y.badge] || 0));
    $('fcList').innerHTML = rows.length
      ? rows.map(card).join('')
      : '<p class="fc-wait">이 도시에는 지금 나와 있는 건물이 없습니다.</p>';
  }

  /* ── 담은 것 ── */
  let BAG_OPEN = false;                               /* 띠를 눌러 펼쳐 둔 상태인가 */
  function cartSlots() { let s = 0; CART.forEach((b) => { s += Number(b.slots); }); return s; }
  function cartSum()   { let s = 0; CART.forEach((b) => { const f = feeOf(b.slots); if (f != null) s += f; }); return s; }

  /* 담은 목록 — 한 채씩 뺄 수 있다. 나중에 계약서 「계약 대상」 칸이 이 모양 그대로다 */
  function drawBag() {
    const bag = $('fcBag');
    if (!CART.size) { BAG_OPEN = false; bag.classList.remove('on'); bag.innerHTML = ''; return; }
    bag.classList.toggle('on', BAG_OPEN);
    if (!BAG_OPEN) return;
    let h = '';
    CART.forEach((b, k) => {
      const w = b.wall || {};
      h += '<div class="fc-bag-row" data-key="' + esc(k) + '">' +
        '<div class="nm">' + esc(w.landmark || ('건물 ' + b.bno)) +
          '<em>' + esc(cityKo(b.city)) + ' · ' + grade(b.city, b.slots) + '</em></div>' +
        '<div class="sl">' + b.slots + '슬롯</div>' +
        '<div class="pr">' + priceText(b.slots) + '</div>' +
        '<button class="rm" type="button" data-act="drop" aria-label="빼기">✕</button>' +
        '</div>';
    });
    bag.innerHTML = h;
  }

  function drawCart() {
    const n = CART.size, slots = cartSlots(), sum = cartSum();
    const vat = Math.round(sum * 0.1);
    const body = n === 0
      ? '<div class="sum">담은 건물이 없습니다. <u>한 번에 슬롯 합계 ' + CAP + '까지 담으실 수 있습니다</u></div>'
      : '<div class="sum">담은 건물 <b>' + n + '채</b> · 슬롯 <b>' + slots + '</b><u>/ ' + CAP + '</u> · ' +
        '참가비 <b>' + won(sum) + '원</b> + 부가세 ' + won(vat) + '원 = <b>' + won(sum + vat) + '원</b></div>' +
        '<div class="caret" aria-hidden="true">▲</div>';
    $('fcCart').className = 'fc-cart' + (n ? ' able' : '') + (BAG_OPEN ? ' open' : '');
    $('fcCart').innerHTML = body +
      /* ⭐ 0918 오후 임시 문 — 슬라이드 메뉴가 서기 전까지 계약서로 가는 길 */
      '<button class="fc-btn" type="button" id="fcMyContract">내 계약서</button>' +
      (n ? '<button class="fc-btn" type="button" id="fcClear">비우기</button>' : '') +
      '<button class="fc-btn gold" type="button" id="fcBook"' + (n ? '' : ' disabled') +
        '>파운더 신청하기</button>';
    $('fcNote').textContent = '';
    drawBag();
  }

  /* 띠를 누르면 펼쳐진다 — 단추 위를 누른 것은 빼고 */
  $('fcCart').addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    if (!CART.size) return;
    BAG_OPEN = !BAG_OPEN;
    drawCart();
  });

  /* 담은 목록에서 한 채 빼기 · 비우기 */
  $('fcBag').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act="drop"]');
    if (!btn) return;
    const row = btn.closest('[data-key]');
    if (!row) return;
    CART.delete(row.dataset.key);
    $('fcNote').textContent = '';
    drawList(); drawCart(); if (FOLDED) drawDetail();
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest || !e.target.closest('#fcClear')) return;
    CART.clear(); BAG_OPEN = false;
    drawList(); drawCart(); if (FOLDED) drawDetail();
  });

  function toggleCart(b) {
    if (!isOpen(b)) return;                         /* 매물이 아니면 담기지 않는다 */
    const k = keyOf(b);
    if (CART.has(k)) { CART.delete(k); }
    else {
      if (cartSlots() + Number(b.slots) > CAP) {
        $('fcNote').innerHTML = '<span class="warn">한 번에 담으실 수 있는 슬롯 합계는 ' + CAP +
          '입니다. 지금 ' + cartSlots() + '슬롯을 담고 계십니다.</span>';
        return;
      }
      CART.set(k, b);
    }
    drawList(); drawCart(); if (FOLDED) drawDetail();
  }

  /* ── 접힌 뒤의 상세 ── */
  function drawDetail() {
    const b = SHOWN;
    if (!b) { $('fcDetail').innerHTML = '<p class="fc-wait">건물을 고르시면 여기에 뜹니다.</p>'; return; }
    const w = b.wall || {};
    const f = feeOf(b.slots);
    const inCart = CART.has(keyOf(b));
    $('fcDetail').innerHTML =
      '<h3>' + esc(w.landmark || ('건물 ' + b.bno)) + '</h3>' +
      '<p class="where">' + esc(cityKo(b.city)) + ' · ' + grade(b.city, b.slots) + '</p>' +
      (w.pitch ? '<p class="pitch">' + esc(w.pitch) + '</p>' : '') +
      '<table class="fc-spec"><tbody>' +
        (isOpen(b) ? '' : '<tr><th>상태</th><td><b>' + markOf(b) + '</b></td></tr>') +
        '<tr><th>크기</th><td><b>' + b.slots + '슬롯</b> — 정회원 ' + b.slots + '명의 자리</td></tr>' +
        '<tr><th>참가비</th><td><b>' + priceText(b.slots) + '</b> · 부가세 별도</td></tr>' +
        (f != null ? '<tr><th>합계</th><td>' + won(f + Math.round(f * 0.1)) + '원</td></tr>' : '') +
        '<tr><th>임시 주소</th><td>' + esc(w.landmark || '—') + '</td></tr>' +
      '</tbody></table>' +
      '<div class="fc-acts" style="margin:0">' +
        (isOpen(b)
          ? '<button class="fc-btn gold' + (inCart ? ' in' : '') + '" type="button" data-act="cart" data-key="' +
              esc(keyOf(b)) + '">' + (inCart ? '담김 ✓' : '담기') + '</button>'
          : '<span class="fc-mark">' + markOf(b) + '</span>') +
      '</div>';
  }

  /* ── 손 ── */
  $('fcScroll').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const holder = btn.closest('[data-key]');
    const k = (holder && holder.dataset.key) || (btn.dataset.key || '');
    const b = BLD.find((x) => keyOf(x) === k);
    if (!b) return;
    if (btn.dataset.act === 'cart') toggleCart(b);
    else if (btn.dataset.act === 'see') {
      SHOWN = b;
      const w = b.wall || {};
      say('fc-fly', { building: {
        city: b.city, bno: b.bno, lat: b.lat, lng: b.lng,
        label: w.landmark || ('건물 ' + b.bno),               /* 핀 위 윗장 — 표찰 */
        sub: grade(b.city, b.slots) + ' · ' + b.slots + '슬롯', /* 아랫장 */
      } });
    }
  });

  /* ── 파운더 신청 ── */
  function askOpen() {
    if (!CART.size) return;
    const sum = cartSum(), vat = Math.round(sum * 0.1);
    $('fcAskSum').innerHTML = '담으신 건물 <b>' + CART.size + '채</b> · 슬롯 합계 <b>' + cartSlots() + '</b><br>' +
      '참가비 <b>' + won(sum) + '원</b> + 부가세 ' + won(vat) + '원 = <b>' + won(sum + vat) + '원</b>';
    $('fcAskErr').textContent = '';
    $('fcAskGo').disabled = false; $('fcAskGo').textContent = '계약서 작성하기';
    $('fcAsk').hidden = false; $('fcAskGo').focus();
  }
  function askClose() { $('fcAsk').hidden = true; }

  async function askGo() {
    const go = $('fcAskGo');
    go.disabled = true; go.textContent = '여는 중입니다';
    $('fcAskErr').textContent = '';
    try {
      const ids = [...CART.values()].map((b) => b.id);
      const { data, error } = await SB.rpc('eg_founder_reserve', { p_buildings: ids });
      if (error) throw error;
      CART.clear(); BAG_OPEN = false;
      askClose(); say('fc-contract', { res: data });
      reload();
    } catch (e) {
      $('fcAskErr').textContent = (e && (e.message || e.hint)) || '신청을 세우지 못했습니다. 잠시 뒤 다시 눌러 주십시오.';
      go.disabled = false; go.textContent = '계약서 작성하기';
      reload();
    }
  }

  async function reload() {
    if (!SB) return;
    try {
      const q = await SB.from('eg_founder_market').select(SEL).order('city').order('slots').order('bno');
      if (q.error) return;
      BLD = (q.data || []).filter((b) => b.lat != null && b.lng != null);
      if (!BLD.some((b) => b.city === TAB)) TAB = (BLD[0] || {}).city || TAB;
      drawTabs(); drawList(); drawCart();
    } catch (_) {}
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest) return;
    if (e.target.closest('#fcBook'))  { askOpen(); return; }
    if (e.target.closest('#fcMyContract')) { say('fc-contract', {}); return; }
    if (e.target.closest('#fcAskNo')) { askClose(); return; }
    if (e.target.closest('#fcAskGo')) { askGo(); return; }
  });

  $('fcTabs').addEventListener('click', (e) => {
    const t = e.target.closest('.fc-tab');
    if (!t) return;
    TAB = t.dataset.city; drawTabs(); drawList(); $('fcScroll').scrollTop = 0;
  });

  $('fcBack').addEventListener('click', () => {
    if (FOLDED) say('fc-unfold');                   /* 접혀 있으면 먼저 편다 */
    else say('fc-back');                            /* 펴져 있으면 신청안내로 */
  });
  $('fcClose').addEventListener('click', () => say('fc-close'));

  window.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!$('fcAsk').hidden) { askClose(); return; }
    if (FOLDED) say('fc-unfold'); else say('fc-close');
  });

  /* 부모가 접었다 / 폈다고 알려 온다 */
  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.type === 'fc-reload') { reload(); return; }   /* 계약서에서 돌아왔다 */
    if (e.data.type !== 'fc-folded') return;
    FOLDED = !!e.data.on;
    document.documentElement.classList.toggle('fold', FOLDED);
    $('fcBackText').textContent = FOLDED ? '목록' : '신청안내';
    $('fcTitle').textContent = FOLDED ? '지구 임장' : 'EG 도시별 현황';
    $('fcScroll').scrollTop = 0;
    if (FOLDED) drawDetail();
  });

  /* ── 클라이언트 — 창 안이면 집주인 것 (0818 한 문서 · 한 클라이언트) ── */
  function loadScript(src) {
    return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  }
  async function client() {
    try { if (window.parent !== window && window.parent.egSupa) return window.parent.egSupa; } catch (_) {}
    if (!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
    return window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { storageKey: 'eungyo-auth', persistSession: true, autoRefreshToken: true } });
  }

  (async function boot() {
    try {
      const sb = await client(); SB = sb;
      try { await sb.rpc('eg_founder_sweep'); } catch (_) {}   /* ⭐ 화면이 열릴 때 시계가 돈다 */
      const [bld, fee] = await Promise.all([
        sb.from('eg_founder_market').select(SEL)
          .order('city').order('slots').order('bno'),
        sb.rpc('eg_founder_fee_table'),
      ]);
      if (bld.error) throw bld.error;
      BLD = (bld.data || []).filter((b) => b.lat != null && b.lng != null);
      if (!fee.error) (fee.data || []).forEach((r) => { if (r.is_current) FEE[r.slots] = Number(r.amount); });

      if (!BLD.length) { $('fcList').innerHTML = '<p class="fc-wait">지금 나와 있는 건물이 없습니다.</p>'; drawCart(); return; }
      TAB = (CITY.find((c) => BLD.some((b) => b.city === c.key)) || {}).key;
      drawTabs(); drawList(); drawCart();
      $('fcPanel').focus({ preventScroll: true });
    } catch (e) {
      console.warn('[founder_city]', e);
      $('fcList').innerHTML = '<p class="fc-wait">매물을 불러올 수 없습니다.</p>';
    }
  })();
})();
</script>
</body>
</html>
