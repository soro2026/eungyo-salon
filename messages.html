<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우편함 — 은교살롱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+KR:wght@300;400;500;600&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  /* ══ EG 우편함 (0813)
     한 파일이 두 곳에서 산다 — 교양 자화상 안 액자 · 지구(타륜 봉투) 팝업 카드.
     ⚠ 배경을 투명하게 둔다. 액자로 끼울 때 바깥 옷이 비쳐야 한 몸으로 보인다. ══ */
  *{ box-sizing:border-box; margin:0; padding:0; }
  :root{
    --ink:#ece3d0; --ink-soft:#c8baa0; --ink-dim:#9a8d72;
    --gold:#d8b860; --gold-deep:#c9a84c;
    --line:rgba(216,184,96,0.22);
    /* ⚠ 0814 — --card · --card-edge · --seal을 걷었다.
       봉투 상자와 붉은 봉랍 줄이 사라지면서 아무 데도 안 쓰인다.
       죽은 값을 남겨 두면 다음에 여는 사람이 「봉랍이 있구나」로 읽는다. */

    /* ══ 0814 종이 팔레트 — 소로 시안에서 화소로 잰 값 ══
       ⚠ 눈짐작으로 옮기지 않았다. 시안 PNG를 열어 한 점씩 찍어 왔다.
       ⭐ 함이 종이빛인데 봉투만 밤중이라 색이 뒤집혀 있었다. 함도 봉투도 종이다. */
    --pp:#faf6ea;                         /* 종이 바탕 */
    --pp-title:#3c3423;                   /* 제목 — 가장 진한 잉크 */
    --pp-name:#8a6d1f;                    /* 보낸이 이름 — 금갈색 */
    --pp-peek:#95896a;                    /* 미리보기 */
    --pp-when:#b3a67f;                    /* 시각 — 가장 옅다 */
    --pp-icon:#a49771;                    /* 안 고른 갈피 · 닫기 */
    --pp-rule:#eae1c6;                    /* 편지 사이 한 줄 */
    --pp-badge:#f2e5bd;                   /* NEW 알약 바탕 */
    --pp-fill:#fbf5e2;                    /* 금테 알약 안쪽 */
    --pp-on-gold:#fdfaf0;                 /* 금색 알약 위 글자 */
  }
  html,body{ height:100%; }
  /* ⚠⚠ 0814 소로 — 「저 스크롤 바 없애 줘」
     body에만 걸어 두었더니 안 걷혔다. **화면 막대를 그리는 것은 html이다.**
     Firefox의 scrollbar-width는 뿌리에서만 화면으로 전해지고,
     WebKit의 ::-webkit-scrollbar도 body에 걸면 화면 막대에 안 닿는다.
     ⭐ 감추는 것이지 접는 것이 아니다 — 굴리기는 그대로 산다(함정 BU의 반대쪽). */
  html{ scrollbar-width:none; -ms-overflow-style:none; }
  html::-webkit-scrollbar{ width:0; height:0; display:none; }
  body{
    font-family:'Noto Serif KR', serif; color:var(--pp-title);
    /* ⭐ 0814 — 종이를 **여기서** 깐다. 액자가 아니라.
       이 한 파일이 지구(terra)와 자화상(persona) 두 액자에 산다.
       액자 쪽에 색을 맡기면 한쪽만 고치는 날이 온다. */
    background:var(--pp); overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  body::-webkit-scrollbar{ display:none; }
  /* ⚠ 편지를 펼치는 동안에는 종이를 걷는다 — 편지 한 장이 지구 위에 놓여야 하므로.
     ⭐ 다발(bundling)에도 함께 건다. 안 그러면 장을 넘기는 240ms마다 종이가 번쩍인다. */
  body.reading, body.bundling{ background:transparent; }
  /* ⚠ 0814 — 시안과 화면을 나란히 놓고 구분선의 좌우 끝을 재어 보니
     시안 여백 23px · 내 것 36px이었다. max-width 480이 액자 520 안에서
     20px을 먼저 먹고 padding 16이 또 먹어 둘이 겹쳐 있었다.
     ⭐ **한 값이 두 역할을 하면 맞출 수가 없다** — 폭 제한을 액자와 같게 두고
        여백은 padding 한 곳에서만 정한다. 좁은 화면에서도 같은 23px이 남는다. */
  .wrap{ max-width:520px; margin:0 auto; padding:14px 23px 28px; }

  /* ══ 갈피 줄 (0814 소로 시안) ══
     ⭐ 알약 셋을 나란히 두면 안 고른 둘이 유령으로 보인다.
        **고른 것만 알약이 되고 나머지는 아이콘만 선다.** 서류함 갈피의 문법이다.
     ⚠ 오른쪽 끝은 비워 둔다 — 거기 앉는 「×」는 부모(terra·persona)가 그린다. */
  .tabs{
    display:flex; align-items:center; gap:0;
    padding:1px 46px 0 0; margin-bottom:11px; min-height:36px;
  }
  .tab{
    display:flex; align-items:center; justify-content:center; gap:6px;
    cursor:pointer; user-select:none; color:var(--pp-icon);
    width:32px; height:32px; border-radius:16px; margin-right:13px;
    transition:color .18s ease, background .2s ease, width .2s ease;
  }
  .tab .t-ko{ display:none; font-size:12.5px; letter-spacing:.01em; white-space:nowrap; }
  .tab svg{ width:15px; height:15px; flex:0 0 auto; }
  .tab:hover{ color:var(--pp-name); }
  /* 고른 갈피 — 금색 알약. 이름이 여기서만 펴진다 */
  .tab.on{
    width:auto; padding:0 13px; margin-right:17px; color:var(--pp-on-gold);
    background:linear-gradient(135deg,#cfad4b,#c9a437);
  }
  .tab.on .t-ko{ display:inline; }
  .tab.on:hover{ color:var(--pp-on-gold); }

  /* ── 쓰기 — 갈피와 같은 줄, 오른쪽 끝 ── */
  .compose-btn{
    margin-left:auto; flex:0 0 auto; white-space:nowrap;
    display:flex; align-items:center; gap:6px;
    height:32px; padding:0 14px; cursor:pointer; border-radius:16px;
    font-family:inherit; font-size:12.5px; color:var(--pp-name);
    background:var(--pp-fill); border:1.5px solid #c9a437;
    transition:background .18s ease;
  }
  .compose-btn:hover{ background:#f4e9c8; }
  .compose-btn svg{ width:14px; height:14px; flex:0 0 auto; }
  /* ⚠ 0814 눈검사 — 폰 폭(360)에서 「쓰기」가 두 줄로 접혔다.
     갈피 셋 + 쓰기가 한 줄에 못 서면 flex가 글자부터 눌러 버린다.
     ⭐ 좁아지면 사이 간격을 먼저 내준다. 글자는 마지막까지 지킨다. */
  @media (max-width:430px){
    .tabs{ padding-right:42px; }
    .tab{ margin-right:8px; }
    .tab.on{ padding:0 11px; margin-right:10px; }
    .compose-btn{ padding:0 11px; }
  }

  /* ══ 편지 한 통 (0814 소로 시안) ══
     ⭐ 상자를 걷었다. 종이 위에 글이 그냥 앉고 사이에 옅은 선 한 줄만 남는다.
        socrates가 물은 그대로 — 쌓이면 서가처럼 보인다.
     ⚠ 겹쳐 쌓지 않는다. 서가도 책을 겹쳐 꽂지 않는다. */
  .env{
    position:relative; padding:13px 2px 14px; cursor:pointer;
    border-bottom:1px solid var(--pp-rule);
    transition:background .18s ease;
  }
  .env:hover{ background:rgba(202,168,76,.07); }
  .env:last-child{ border-bottom:0; }
  .env-top{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .env-who{
    font-family:'Cormorant Garamond',serif; font-size:20px; line-height:1.15;
    color:var(--pp-name); letter-spacing:0;
  }
  /* 안 읽은 것의 표. ⚠ 개수는 어디에도 없다(결정문 5호) — 있다·없다뿐이다 */
  .env-new{
    flex:0 0 auto; font-family:'Cormorant Garamond',serif; font-size:11px;
    letter-spacing:.07em; line-height:1; color:var(--pp-name);
    background:var(--pp-badge); border-radius:8px; padding:4px 6px 5px;
  }
  /* ⚠ 0814 소로 — 「제목 없애고 두 줄로 깔끔하게」
     편지에는 제목이 없다. 그래서 목록도 **이름 줄과 첫 문장 줄** 둘뿐이다.
     ⭐ 「읽음」·「수정한 편지」 같은 표는 셋째 줄로 내리지 않고 시각 앞에 붙인다.
        셋째 줄이 생기면 어떤 편지는 두 줄, 어떤 편지는 세 줄로 들쭉날쭉해진다. */
  .env-when{ margin-left:auto; font-size:12px; color:var(--pp-when);
             white-space:nowrap; display:flex; align-items:baseline; gap:7px; }
  .env-mark{ letter-spacing:.02em; }
  .env-mark::after{ content:'·'; margin-left:7px; opacity:.55; }
  .env-peek{ font-size:14px; color:var(--pp-peek); line-height:1.5;
             display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }

  .empty{ text-align:center; padding:44px 20px; color:var(--pp-peek);
          font-size:13.5px; line-height:1.9; }
  .empty .em{ display:block; font-size:26px; margin-bottom:12px; opacity:.45; }

  /* ══════ 편지 (0813) ══════
     소로 확정: 세월 든 미색 · 가장자리 아주 살짝 · 무늬 없음 · 제목은 본문 첫 줄로.
     ⭐ 종이와 글자를 갈라 놓는다 — 울퉁불퉁(deckle)은 .paper 층에만 걸린다.
        한 겹으로 하면 본문 글자까지 물결친다. */
  .letter-bg{
    position:fixed; inset:0; z-index:84; display:none;
    /* ⚠⚠⚠ 0813 저녁 — 세 번 고쳤다.
       ① 새까만 막 → 칙칙하다
       ② 막을 걷음 → 우편함 목록이 훤히 비친다
       ③ 종이빛 막 → 액자 상자만큼만 깔려 **둥근 사각 종이판**이 편지 뒤에 남았다
       ⭐ 답: 막을 여기 두지 않는다. `.letter-bg`는 액자(iframe) 안이라
         상자 밖으로 못 나간다 — 아무리 손봐도 상자 모양이 남는다.
         막은 지구가 친다(terra #mailCard.reading). 여기는 편지만 띄운다. */
    background:transparent;
    /* ⚠ 액자 상자를 화면 전체로 늘린 뒤로 여백이 없어 종이가 화면을 꽉 채웠다.
       ⭐ 편지 한 장이 지구 위에 놓인 그림이려면 사방에 지구가 보여야 한다. */
    align-items:center; justify-content:center; padding:40px 16px;
  }
  .letter-bg.show{ display:flex; }
  body.reading{ overflow:hidden; }
  /* ⚠⚠ 0814 — 어제 「막」을 세 번 고친 대목의 **진짜 뿌리가 여기였다.**
     막을 어떻게 치든 목록은 편지 위아래 여백에서 그대로 비친다. 액자를 접어도
     액자 **안**의 목록은 접히지 않는다 — 접은 것은 상자였지 목록이 아니었다.
     ⭐ 편지를 펼치면 목록을 화면에서 걷는다. 그러면 막이 정말로 필요 없어진다.
     ⚠ display:none이 아니라 visibility — 굴린 위치를 잃지 않는다. */
  body.reading .wrap, body.bundling .wrap{ visibility:hidden; }
  .letter-wrap{
    position:relative; width:100%; max-width:520px; max-height:84vh;
    overflow-y:auto; overflow-x:hidden;
    scrollbar-width:none; -ms-overflow-style:none;      /* 슬라이드 바 없음(0813 소로) */
    animation:lIn .26s ease;
  }
  .letter-wrap::-webkit-scrollbar{ display:none; }
  @keyframes lIn{ from{ opacity:0; transform:translateY(12px) } to{ opacity:1; transform:none } }

  /* ⭐ 0813 소로 — 편지지는 내용에 맞춰 줄어들지 않는다.
     짧게 쓰면 아래가 비는 것이 정상이다. 진짜 편지지가 그렇다.
     ⚠ 아래 구석 활자는 종이 맨 아래에 붙고, 서명은 본문을 따라온다 —
       한 덩어리로 두면 서명이 함께 끌려 내려간다. 그래서 사이에 빈 칸(l-fill)을 둔다. */
  .letter{
    position:relative; padding:46px 40px 30px;
    min-height:560px; display:flex; flex-direction:column;
  }
  .letter > *{ position:relative; z-index:1; }
  .l-fill{ flex:1; min-height:34px; }
  .paper{
    position:absolute; inset:0; z-index:0;   /* flex 흐름 밖 — 높이에 안 끼어든다 */
    background:#efe6cd;                                  /* 세월 든 미색 */
    box-shadow:0 18px 50px rgba(0,0,0,.42), 0 3px 10px rgba(0,0,0,.20);
    filter:url(#egDeckle);                               /* 가장자리 아주 살짝 */
  }
  .paper::after{
    content:''; position:absolute; inset:0;
    box-shadow:inset 0 0 40px rgba(140,110,66,.18), inset 0 0 6px rgba(140,110,66,.22);
  }

  /* ── 우표 + 소인 (0813) ──
     ⭐ 소인은 우표 **오른쪽**에 꽝 찍힌다(0813 소로). 우표를 좀 가려도 좋다 —
        가려야 진짜 부쳐진 편지로 보인다.
     ⚠ 우표 높이만 고정하고 폭은 비율이 정한다(0.58 ~ 1.47). */
  /* ⚠ 소인이 우표 오른쪽 바깥으로 나가므로 우표를 안쪽으로 당겨 둔다 */
  .frank{ position:absolute; top:26px; right:78px; z-index:2; }
  .stamp{ position:relative; transform:rotate(-2.4deg);
          filter:drop-shadow(0 1px 0 rgba(120,96,58,.22)); }
  .stamp img{ display:block; object-fit:contain; }

  /* ⚠ 소인은 우표 위에 올라탄다(z-index 3). 아래 깔리면 겹치는 뜻이 사라진다. */
  .postmark{ position:absolute; right:-38px; top:6px; z-index:3; pointer-events:none; }
  .postmark img{ width:100%; height:100%; display:block; opacity:.86; }
  .pm-t{
    position:absolute; left:50%; transform:translate(-50%,-50%);
    font-family:'Cormorant Garamond',serif; letter-spacing:1.2px; font-weight:600;
    white-space:nowrap; color:inherit;
  }

  /* ── 윗머리 · 부름 · 본문 · 서명 ── */
  /* ⚠ 소인이 우표 오른쪽으로 나가면서 윗머리를 더 비워야 한다(카프카에서 본문 침범) */
  /* ⭐ 0813 소로 — 우표·소인이 앉는 오른쪽 위를 통째로 비운다.
     본문은 그 아래에서 시작한다. 주소만 위에 남는다. */
  .l-head{ margin-bottom:22px; padding-right:150px; min-height:170px; }
  .l-place{
    font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    font-size:11.5px; color:#7a6849; letter-spacing:.02em;
  }
  .l-salute{ font-size:15px; color:#3a2f21; margin-bottom:20px; }
  .l-body{
    font-size:14.5px; line-height:2.02; color:#3a2f21;
    white-space:pre-wrap; word-break:break-word;
  }
  .l-body .lead{ color:#2e2417; }
  /* ⚠ 맺음말은 셸이 안 붙인다(0813 소로) — 「이만 줄입니다」는 손님의 목소리다.
     서명 한 줄만 놓는다. 누가 보냈는지는 편지가 스스로 말해야 하므로. */
  .l-close{ margin-top:28px; text-align:right; flex:0 0 auto; }
  /* ⚠ 목업의 손글씨체로 되돌린다. 크기도 한 눈금 줄인다(0813 소로) */
  .l-sign{ font-family:'Nanum Pen Script',cursive; font-size:27px; line-height:1.2;
           color:#2b3a52; letter-spacing:.02em; }
  /* ⭐ 0813 소로 — 소인의 날짜는 「부쳐졌다」는 표시이지 읽으라고 있는 것이 아니다.
     정확한 날짜·시각은 서명 아래에 타자기 활자로 한 줄. 편지의 일부로 읽힌다.
     ⚠ 연도까지 적는다 — 삼 년 뒤 보관함을 열 때를 위해서다. 대신 작게. */
  .l-stamped{
    margin-top:9px; font-family:'Courier New', Courier, monospace;
    font-size:11px; letter-spacing:.08em; color:#8a7659;
  }
  .l-foot{
    margin-top:0; padding-top:13px; border-top:1px solid rgba(120,96,58,.18);
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .l-note{ font-size:10.5px; color:#8a7659; letter-spacing:.04em; }
  /* ⭐ 0813 소로 — 다발을 넘기는 중에는 몇 장 남았는지 보여 준다.
     ⚠ 우편함 **밖**에서는 여전히 안 센다(5호) — 봉랍은 있다·없다뿐이다.
       이미 손에 쥔 다발을 세는 것과, 열기 전에 개수를 알리는 것은 다르다. */
  .l-bundle{ font-family:'Courier New',Courier,monospace; letter-spacing:.06em; color:#7a6849; }
  .l-bundle::after{ content:'·'; margin:0 6px; opacity:.5; }
  .l-bundle:last-child::after{ content:''; margin:0; }
  .l-acts{ display:flex; gap:13px; flex-wrap:wrap; }
  .l-act{
    font-size:11px; color:#7a6849; cursor:pointer; letter-spacing:.06em;
    border-bottom:1px solid transparent; padding-bottom:1px;
    transition:color .2s, border-color .2s; background:none; border-top:0; border-left:0; border-right:0;
    font-family:inherit;
  }
  .l-act:hover{ color:#3a2f21; border-bottom-color:rgba(120,96,58,.45); }
  .l-act.warn{ color:#9a5548; }
  .l-act.next{ color:#3a2f21; border-bottom-color:rgba(120,96,58,.45); }
  /* ⭐ 0813 소로 — 막대를 걷었으니 「아래가 더 있다」를 알릴 표가 필요하다.
     ⚠ 실제로 남았을 때만 뜬다. 짧은 편지에도 뜨면 거짓말이 되고,
       다 내려가면 사라져야 한다. */
  .l-more{
    position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
    width:34px; height:34px; z-index:4; cursor:pointer;

const SUPABASE_URL = 'https://cyhlotwdisjvoxvfkpnd.supabase.co';

let _refreshing = null;
function getSession(){ try{ return JSON.parse(localStorage.getItem('eungyo-auth')); }catch{ return null; } }
function tokenExp(tok){ try{ return JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp || 0; }catch{ return 0; } }
async function getValidToken(){
  const s = getSession();
  if(!s?.access_token) return null;
  const now = Math.floor(Date.now()/1000);
  if(tokenExp(s.access_token) - now > 60) return s.access_token;

function whenText(iso){
  const d = new Date(iso), n = new Date(), p = v => String(v).padStart(2,'0');
  if(d.toDateString() === n.toDateString()) return `${p(d.getHours())}:${p(d.getMinutes())}`;
  if(d.getFullYear() === n.getFullYear())   return `${d.getMonth()+1}월 ${d.getDate()}일`;
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`;
}

// ── 상태 ─────────────────────────────────────────────
let tab = 'in';            // 'in' | 'arc' | 'out'
let rows = [];             // 지금 탭의 목록
let open = null;           // 펼쳐진 한 통
let busy = false;

/* ⭐ 우표·소인은 한 판에 한 번만 묻는다. 편지마다 부르면 목록이 느려진다. */
let POSTAGE = null, POSTMARK = null;

/* ⭐ 0813 소로 — 봉투에서 들어오면 안 읽은 편지를 **먼저 온 것부터** 한 장씩 넘긴다.
   다 넘기면 우편함 목록이 뜬다. 언제든 「우편함으로」로 빠져나갈 수 있다 —
   ⚠ 빠져나갈 문이 없으면 열 통 쌓인 날 열 번 닫아야 목록에 닿는다. */
let BUNDLE = [];            /* 아직 안 넘긴 편지들 (먼저 온 것이 앞) */
let inBundle = false;
/* ⚠ let은 끌어올려지지 않는다 — 쓰는 곳(load)보다 반드시 앞에 세운다.
   뒤에 두면 첫 load에서 그 자리가 통째로 터진다. */
let BUNDLE_PENDING = false;
let BUNDLE_TOTAL = 0;   /* 다발이 처음 몇 장이었나 — 「2 / 3」의 오른쪽 */
async function loadStock(){
  if(POSTAGE && POSTMARK) return;
  try{
    const [po, pm] = await Promise.all([
      sbFetch('/rest/v1/rpc/eg_postage_on_sale', { method:'POST', body:'{}' }),
      sbFetch('/rest/v1/rpc/eg_postmarks',       { method:'POST', body:'{}' })
    ]);
    POSTAGE = po || []; POSTMARK = pm || [];
  }catch(e){ POSTAGE = POSTAGE || []; POSTMARK = POSTMARK || []; console.warn('[우표]', e); }
}
const findPo = c => (POSTAGE || []).find(p => p.code === c) || null;
const findPm = c => (POSTMARK || []).find(p => p.code === c) || null;

/* 도시 이름 — DB는 로마자로 산다. 소인에는 로마자가 맞고, 윗머리에는 한글이 맞다. */
const CITY_KO = { paris:'파리', london:'런던', boston:'보스턴', vienna:'빈', kyoto:'교토',
                  lisbon:'리스본', newyork:'뉴욕', berlin:'베를린', rome:'로마' };
const cityKo   = c => CITY_KO[c] || (c ? c[0].toUpperCase()+c.slice(1) : '');
const cityRoman= c => (c || 'EG').toUpperCase();

const MON = ['IAN','FEB','MAR','APR','MAI','IVN','IVL','AVG','SEP','OCT','NOV','DEC'];
function pmDate(iso){
  const d = new Date(iso);
  return `${d.getDate()} ${MON[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`;
}
/* 발송 시각 — 서명 아래 한 줄. 타자기 활자로 찍는다. */
function stampedAt(iso){
  const d = new Date(iso), p = v => String(v).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}  ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function load(){
  const box = document.getElementById('list');
  if(!getUser()){ box.innerHTML = `<div class="empty"><span class="em">✉︎</span>로그인하시면 우편함이 열립니다.</div>`; return; }
  box.innerHTML = `<div class="empty">불러오는 중…</div>`;
  const fn = tab === 'in' ? 'eg_inbox' : tab === 'arc' ? 'eg_archivebox' : 'eg_sentbox';
  try{
    const [r] = await Promise.all([
      sbFetch(`/rest/v1/rpc/${fn}`, { method:'POST', body: JSON.stringify({}) }),
      loadStock()
    ]);
    rows = r || [];
  }catch(e){ box.innerHTML = `<div class="empty">편지를 가져오지 못했습니다.<br><span style="font-size:11px">${esc(e.message)}</span></div>`; return; }
  paint();

  /* 봉투에서 들어온 첫 판에만 다발을 세운다. 탭을 갈아도 다시 안 선다. */
  if(BUNDLE_PENDING){
    BUNDLE_PENDING = false;
    BUNDLE = rows.filter(r => !r.read_at).map(r => r.id).reverse();   /* 먼저 온 것이 앞 */
    BUNDLE_TOTAL = BUNDLE.length;
    nextInBundle();
  }
}

function paint(){
  const box = document.getElementById('list');
  if(!rows.length){
    box.innerHTML = tab === 'in'
      ? `<div class="empty"><span class="em">✉︎</span>우편함이 비어 있습니다.<br>누군가 다녀가면 여기에 놓여 있을 겁니다.</div>`
      : tab === 'arc'
      ? `<div class="empty"><span class="em">✉︎</span>보관해 둔 편지가 없습니다.</div>`
      : `<div class="empty"><span class="em">✉︎</span>아직 부친 편지가 없습니다.</div>`;
    return;
  }
  /* ⚠ 0814 — 여기서 우표를 걷었다. 목록은 「누가·언제·무슨 말」만 말한다.
     ⭐ findPo는 편지지(frankHtml)가 여전히 쓴다 — 지우지 않는다. */
  box.innerHTML = rows.map((m,i) => {
    const unread = (tab === 'in' && !m.read_at);
    /* 보낸 함에서는 상대가 열었는지가 알고 싶은 것이다. 짧게 두 마디로 가른다. */
    const mark = tab === 'out' ? (m.read_at ? '읽음' : '안 읽음')
                               : (m.edited_at ? '수정한 편지' : '');
    /* ⭐ 옛 편지에는 제목이 남아 있다(0814 이전). 걷지 않고 첫 문장 앞에 붙여
       한 줄로 흘려보낸다 — 그 편지의 첫 줄이 사라지면 안 되므로. */
    const peek = (m.subject ? m.subject + '  ' : '') + m.body;
    return `<div class="env" onclick="openRead(${i})">
      <div class="env-top">
        <span class="env-who">${esc(m.who)}</span>
        ${unread ? '<span class="env-new">NEW</span>' : ''}
        <span class="env-when">${mark ? `<span class="env-mark">${mark}</span>` : ''}${whenText(m.sent_at)}</span>
      </div>
      <div class="env-peek">${esc(peek)}</div>
    </div>`;
  }).join('');
}

function switchTab(t){
  if(tab === t) return;
  tab = t;
  ['in','arc','out'].forEach(k =>
    document.getElementById('tab-' + k).classList.toggle('on', k === t));
  load();
}

// ── 우표 · 소인 그리기 ───────────────────────────────
/* ⚠ 높이만 고정하고 폭은 비율이 정한다. 폭을 고정하면 세로로 긴 우표가
     윗머리를 밀고 내려온다(0813 실측: 소로 0.58 ~ 모차르트 1.47). */
const PO_H = 104;
function frankHtml(m){
  /* ⚠ 0814 — 여기서 `.frank`를 또 만들지 않는다. 그릇은 `#r-frank` 자신이다.
     안에 한 겹 더 두면 그것이 기준점이 되어 자리 셈이 어긋난다(오늘 잡은 병). */
  const f = document.getElementById('r-frank');
  const po = findPo(m.postage_code), pm = findPm(m.postmark_code);
  if(!po && !pm){ f.innerHTML = ''; return; }
  const w = po ? Math.round(PO_H * Number(po.ratio || .78)) : 118;
  f.style.width = w + 'px';
  f.style.right = frankRight(w, pm);        /* ⭐ 쓰기와 **한 셈**을 쓴다 */
  f.innerHTML =
    (po ? `<div class="stamp"><img src="${esc(po.art_url)}" style="width:${w}px;height:${PO_H}px" alt=""></div>` : '') +
    (pm ? pmHtml(pm, cityRoman(m.city), pmDate(m.sent_at)) : '');
}
/* ⭐⭐ 0814 — 우표와 소인이 **함께 앉는 곳**.
   ⚠⚠ 병 둘을 한꺼번에 잡는다.
     ① `#r-frank`가 `.letter > *{position:relative}`에 걸려 **스스로 기준점**이 되어 있었다.
        그래서 읽기의 우표는 종이 오른쪽에서 118px(=40 padding + 78), 쓰기는 78px —
        **부치자마자 우표가 40px 움직였다.** 이제 둘 다 `.frank`가 그릇이다.
     ② 어제 넣은 소인 잘림 처방이 읽기에서 한 번도 안 먹었다. static인 그릇에
        right를 걸었기 때문이다. 검사기도 화면도 조용했다.
   ⭐ 자리는 우표 폭과 소인이 나간 몫을 **둘 다** 알아야 정해진다. 소인만 아는
      pmHtml에서는 애초에 정할 수 없는 값이었다 — 그래서 여기로 옮겼다. */
function pmGeom(pm){
  const wave = (pm.anchor === 'full');
  const H = wave ? 74 : 108;
  const W = Math.round(H * Number(pm.ratio || 1));
  const off = Math.round(W * (wave ? 0.42 : 0.70));
  /* ⚠ -14도로 눕히면 차지하는 폭이 W·cosθ + H·sinθ로 늘고, 중심 회전이라 그 절반이
     오른쪽으로 더 나간다. 이 몫을 빼먹으면 처방을 넣고도 4.5px가 남는다. */
  const rad  = Math.abs(Number(pm.rotate ?? -14)) * Math.PI / 180;
  const grow = (W * Math.cos(rad) + H * Math.sin(rad) - W) / 2;
  return { wave, H, W, off, ext: off + grow };   /* ext = 우표 오른쪽 끝에서 더 나가는 몫 */
}
/* 덩어리(우표+소인)의 **중심이 종이 폭의 75%**에 오게 한다 (0814 소로).
   ⚠ 그래도 소인이 종이를 넘으면 overflow-x:hidden이 조용히 잘라낸다.
     그때만 왼쪽으로 당긴다 — max()가 그 상한이다. */
function frankRight(poW, pm){
  const ext = pm ? pmGeom(pm).ext : 0;
  const n = Math.round((poW - ext) / 2);
  return `max(${Math.round(8 + ext)}px, calc(25% ${n >= 0 ? '- ' + n : '+ ' + (-n)}px))`;
}

/* 소인 — 바탕은 그림, 글자는 여기서 얹는다. 자리는 표에 실측해 심어 두었다(0813).
   ⭐ 0813 저녁 소로 — 우표 오른쪽에 **꽝** 찍는다. 우표를 좀 가려도 좋다.
   ⚠ 물결형(anchor=full)은 테두리가 없어 잉크가 옅다. 크게 눕히고 왼쪽으로 물려
     우표를 가로지르게 해야 소인 노릇을 한다. */
function pmHtml(pm, city, date){
  /* ⚠⚠ 소인마다 그림 비율이 다르다(0.95 ~ 2.10). 정사각에 밀어 넣으면 찌그러진다.
     ⭐ 치수는 pmGeom 한 곳에서만 센다 — 두 곳에서 세면 언젠가 갈린다. */
  const { wave, H, W, off } = pmGeom(pm);
  const cy = Number(pm.city_y ?? .35), dy = Number(pm.date_y ?? .64);
  const k  = H / 420;
  const cs = Math.max(9.5, Number(pm.city_sz ?? 26) * k * 1.95);
  const ds = Math.max(9,   Number(pm.date_sz ?? 22) * k * 1.95);
  const one = (cy === dy);
  /* ⭐⭐ 0813 저녁 소로 — 「소인이 무례하다. 살짝 걸치면 좋겠다」
     처음엔 우표를 통째로 덮었다. 우표 **오른쪽 바깥**으로 밀어
     왼쪽 귀퉁이만 물게 한다. 날짜는 종이 위에 나와 읽힌다.
     ⚠ 우표 폭이 제각각이라(0.58~1.47) 고정 픽셀로 밀면 우표마다 겹침이 달라진다 —
       그래서 소인 폭을 기준으로 민다. */
  /* ⚠ 자리는 여기서 안 정한다 — 우표 폭을 모르기 때문이다. 그릇(frankRight)이 정한다. */
  const pos  = wave ? `right:${-off}px; top:16px;` : `right:${-off}px; top:-6px;`;
  return `<div class="postmark" style="${pos} width:${W}px; height:${H}px;
            transform:rotate(${pm.rotate ?? -14}deg); color:${pm.ink}">
    <img src="${esc(pm.art_url)}" alt="">
    <span class="pm-t" style="top:${cy*100}%; font-size:${(one?ds:cs).toFixed(1)}px">${
      one ? `${esc(city)} · ${esc(date)}` : esc(city)}</span>
    ${one ? '' : `<span class="pm-t" style="top:${dy*100}%; font-size:${ds.toFixed(1)}px">${esc(date)}</span>`}
  </div>`;
}

// ── 편지 펼치기 ──────────────────────────────────────
async function openRead(i){
  open = rows[i]; if(!open) return;
  const mine = (tab === 'out');

  frankHtml(open);                     /* 우표·소인을 #r-frank에 직접 그린다 */
  /* ⚠ 「집」이 아니라 「번가」다(0813 소로). 라탱지구는 메종 표에 없으므로 안 적는다 —
     없는 것을 지어내지 않는다. */
  document.getElementById('r-place').textContent =
    open.city ? `${cityKo(open.city)} ${open.maison_no}번가에서` : '';
  /* ⭐ 받는 이 이름은 창이 실어 온다(to_name). 세션에는 닉네임이 없어
     예전에는 「당신 님께」로 떨어졌다 — 셸이 짐작하면 안 되는 자리다. */
  document.getElementById('r-salute').textContent =
    `${mine ? open.who : (open.to_name || '—')} 님께,`;

  /* ⭐ 제목은 라벨이 아니라 본문 첫 줄로 들어앉는다(0813 소로) */
  const lead = open.subject ? `<span class="lead">${esc(open.subject)}</span>\n\n` : '';
  document.getElementById('r-body').innerHTML = lead + esc(open.body);
  document.getElementById('r-sign').textContent = mine ? (open.to_name || '—') : open.who;
  /* ⚠ 날짜는 서명 아래로 옮겼다. 여기서 또 적으면 한 편지에 두 번 나온다. */
  document.getElementById('r-note').textContent =
    [ open.edited_at ? '수정한 편지' : '',
      mine ? (open.read_at ? '읽음' : '아직 안 읽었습니다') : '' ].filter(Boolean).join(' · ');
  document.getElementById('r-stamped').textContent = stampedAt(open.sent_at);

  document.getElementById('r-bundle').textContent = '';
  document.getElementById('r-bundle').className = '';
  if(inBundle){
    const left = BUNDLE.length;              /* 아직 안 넘긴 장수 */
    const nth  = BUNDLE_TOTAL - left;        /* 지금 몇 장째인가 */
    document.getElementById('r-bundle').className = 'l-bundle';
    document.getElementById('r-bundle').textContent = `${nth} / ${BUNDLE_TOTAL}`;
  }
  document.getElementById('r-acts').innerHTML = actsHtml();
  document.getElementById('readModal').classList.add('show');
  document.body.classList.add('reading');
  document.querySelector('#readModal .letter-wrap').scrollTop = 0;
  /* ⚠ 우표 그림이 늦게 뜨면 높이가 달라진다 — 곧바로 한 번, 잠시 뒤 한 번 더 잰다 */
  tickMore(); setTimeout(tickMore, 120); setTimeout(tickMore, 600);
  /* ⭐⭐ 0813 소로 — 「편지만 단독으로 지구 위에」
     편지는 우편함 액자 **안**에서 뜬다. 그래서 아무리 막을 손봐도 뒤에 목록이 어른거리고
     액자의 막대도 안 걷힌다. 답은 막이 아니라 **액자를 접는 것**이다.
     ⚠ 지구가 못 들어도 편지는 그대로 뜬다 — 알림은 덤이지 조건이 아니다. */
  try{ window.parent?.postMessage({ eg:'letter-open' }, '*'); }catch(e){}

  /* 읽음은 펼치자마자 적는다. 실패해도 읽는 데는 지장이 없다. */
  if(tab === 'in' && !open.read_at){
    try{
      await sbFetch(`/rest/v1/messages?id=eq.${open.id}`,
        { method:'PATCH', headers:{ Prefer:'return=minimal' },
          body: JSON.stringify({ read_at: new Date().toISOString() }) });
      open.read_at = new Date().toISOString();
      paint();
      window.parent?.postMessage({ eg:'mail-read' }, '*');   /* 봉랍 내려가라 */
    }catch(e){ console.warn('[편지] 읽음 표시 실패:', e); }
  }
}

/* ⭐ 아래 구석의 작은 활자. 삭제는 읽는 화면에 두지 않는다 —
   읽자마자 버리는 일이 없도록, 버리기는 보관함과 보낸 함에만 있다(0813 소로). */
function actsHtml(){
  /* ⚠ 다발을 넘기는 문이 없으면 「×」로 닫아야만 다음 장이 온다 — 아무도 모른다.
     ⭐ 마지막 장에서는 「우편함으로」가 되어, 넘길 것이 없음을 말이 대신한다. */
  const out  = inBundle ? `<button class="l-act" onclick="leaveBundle()">우편함으로</button>` : '';
  const next = inBundle && BUNDLE.length
             ? `<button class="l-act next" onclick="closeRead()">다음 편지 ›</button>` : '';
  if(tab === 'in')  return `${out}<button class="l-act" onclick="replyMsg()">답장</button>
                            <button class="l-act" onclick="archiveMsg(true)">보관하기</button>${next}`;
  if(tab === 'arc') return `<button class="l-act" onclick="replyMsg()">답장</button>
                            <button class="l-act" onclick="archiveMsg(false)">우편함으로</button>
                            <button class="l-act warn" onclick="removeMsg()">버리기</button>`;
  return `${open && !open.read_at ? '<button class="l-act" onclick="editMsg()">수정</button>' : ''}
          <button class="l-act warn" onclick="removeMsg()">버리기</button>`;
}
function closeRead(){
  document.getElementById('readModal').classList.remove('show');
  document.body.classList.remove('reading');
  try{ window.parent?.postMessage({ eg:'letter-close' }, '*'); }catch(e){}
  /* 다발을 넘기는 중이면 다음 장. 다 넘겼으면 우편함이 남는다. */
  if(inBundle) setTimeout(()=>{ if(!nextInBundle()) toast('우편함입니다'); }, 240);
}
/* ── 더 읽기 화살표 ──
   ⚠ 막대를 걷었으니 「아래가 더 있다」를 알릴 표가 필요하다(0813 소로).
     실제로 남았을 때만 뜬다 — 짧은 편지에도 뜨면 거짓말이 된다. */
function tickMore(){
  const w = document.querySelector('#readModal .letter-wrap');
  const m = document.getElementById('r-more');
  if(!w || !m) return;
  const left = w.scrollHeight - w.scrollTop - w.clientHeight;
  m.classList.toggle('on', left > 24);
}
function scrollLetter(){
  const w = document.querySelector('#readModal .letter-wrap');
  if(w) w.scrollBy({ top: Math.round(w.clientHeight * 0.82), behavior:'smooth' });
}
/* 편지를 펼칠 때·굴릴 때·창이 바뀔 때 다시 잰다 */
(function(){
  const w = document.querySelector('#readModal .letter-wrap');
  if(w) w.addEventListener('scroll', tickMore, { passive:true });
  window.addEventListener('resize', tickMore);
})();

/* 다발을 내려놓고 목록으로 — 갇히지 않게 두는 문 */
function leaveBundle(){ BUNDLE = []; inBundle = false;
  document.body.classList.remove('bundling'); closeRead(); }

/* 보관하기 — 서랍에 넣는 것이지 태우는 것이 아니다. 보관함에서 언제든 되돌린다. */
async function archiveMsg(on){
  if(!open || busy) return;
  busy = true;
  try{
    await sbFetch(`/rest/v1/messages?id=eq.${open.id}`,
      { method:'PATCH', headers:{ Prefer:'return=minimal' },
        body: JSON.stringify({ archived_at: on ? new Date().toISOString() : null }) });
    closeRead(); toast(on ? '보관함에 넣어 두었습니다' : '우편함으로 되돌렸습니다');
    await load();
    window.parent?.postMessage({ eg:'mail-read' }, '*');
  }catch(e){ toast(on ? '보관하지 못했습니다' : '되돌리지 못했습니다'); console.warn(e); }
  busy = false;
}

async function removeMsg(){
  if(!open || busy) return;
  if(!confirm('이 편지를 버립니다.\n\n내 함에서만 사라지고, 상대의 편지는 그대로 남습니다.')) return;
  busy = true;
  const col = (tab === 'out') ? 'del_sender' : 'del_recip';
  try{
    await sbFetch(`/rest/v1/messages?id=eq.${open.id}`,
      { method:'PATCH', headers:{ Prefer:'return=minimal' },
        body: JSON.stringify({ [col]: new Date().toISOString() }) });
    closeRead(); toast('편지를 버렸습니다'); await load();
  }catch(e){ toast('버리지 못했습니다'); console.warn(e); }
  busy = false;
}

function replyMsg(){
  /* ⚠ 0814 — 제목이 사라지면서 「Re:」도 함께 걷혔다.
     답장인지는 본문이 말한다 — 받는 이가 이미 정해져 있는 것으로 족하다. */
  const to = open.who_id, who = open.who;
  closeRead();
  openCompose(to, who);
}

/* ══════ 쓰기 — 편지지 위에서 (0814) ══════
   ⭐ 「우표 붙이는 자리에서 고르게」(소로). 폼 아래 목록이 아니라 붙일 곳에서.
   ⚠ 자리(.frank)는 읽기와 한 픽셀도 다르지 않다. 어긋나면 부치자마자 우표가 움직인다. */
let poPick  = null;                /* null = 부칠 때 저절로 붙는다 */
let toPick  = null;                /* 받는 이 */
let editing = null;
let people  = null;
let HEAD    = null;                /* 내 닉네임·도시·번지 — eg_my_letterhead()가 싣는다 */

/* ── 우표 자리 ──
   ⭐ 빈 자리·붙은 우표·못 떼는 우표를 한 곳에서 그린다.
      세 곳에 흩어 두면 자리가 조금씩 어긋난다. */
function paintFrank(){
  const f = document.getElementById('w-frank');
  const po = findPo(poPick);
  const lock = !!editing;
  f.className = 'frank' + (po ? ' picked' : '') + (lock ? ' locked' : '');
  /* 수정 화면에서는 소인이 이미 찍혀 있다 — 부친 편지이므로 */
  const pm = lock ? findPm(editing.postmark_code) : null;

  if(!po){
    f.style.width = '78px';
    f.style.right = frankRight(78, null);
    f.innerHTML = `<div class="po-slot" onclick="openPoBook()">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round"><path d="M10 5v10M5 10h10"/></svg>
      <span>우표</span></div>`;
    return;
  }
  const w = Math.round(PO_H * Number(po.ratio || .78));
  f.style.width = w + 'px';
  f.style.right = frankRight(w, pm);       /* ⭐ 읽기와 **한 셈**을 쓴다 */
  /* ⚠ 소인의 도시는 **그 편지가 떠난 곳**이다. 지금 내 도시가 아니다 —
     이사한 사람이면 어긋난다. 윗머리와 같은 곳(editing)에서 읽는다. */
  const mark = pm ? pmHtml(pm, cityRoman(editing.city), pmDate(editing.sent_at)) : '';
  f.innerHTML = `<div class="stamp" ${lock ? '' : 'onclick="openPoBook()"'}>
      <img src="${esc(po.art_url)}" style="width:${w}px;height:${PO_H}px" alt=""></div>${mark}`;
}

/* ── 우표첩 ── */
function openPoBook(){
  if(editing){ toast('부친 편지의 우표는 뗄 수 없습니다'); return; }
  const b = document.getElementById('w-pobook');
  b.classList.toggle('on');
  if(b.classList.contains('on')){ closeToBook(); paintPoBook(); }
}
function paintPoBook(){
  const box = document.getElementById('w-po');
  document.getElementById('w-poyear').textContent =
    `${new Date().getFullYear()} · 발행 중`;
  if(!POSTAGE || !POSTAGE.length){
    document.getElementById('w-pohead').textContent = '지금 발행 중인 우표가 없습니다';
    box.innerHTML = ''; document.getElementById('w-poname').textContent = '';
    return;
  }
  box.innerHTML =
    `<div class="po-any${poPick===null?' on':''}" onclick="setPo(null)">아무거나<br>붙여 주세요</div>` +
    POSTAGE.map(p => `<div class="po-one${poPick===p.code?' on':''}" onclick="setPo('${p.code}')">
        <img src="${esc(p.art_url)}" alt=""></div>`).join('');
  const po = findPo(poPick);
  document.getElementById('w-poname').innerHTML = po
    ? `${esc(po.name)} <em>${esc(po.motto || '')}</em>`
    : `<span style="color:#a4906a">부치실 때 그날 발행 중인 우표 하나가 저절로 붙습니다</span>`;
}
function setPo(c){
  poPick = c; paintPoBook(); paintFrank();
  if(c) setTimeout(()=>document.getElementById('w-pobook').classList.remove('on'), 260);
}

/* ── 받는 이 ── */
function openTo(){
  if(editing || (toPick && toPick.locked)){ toast('받는 이는 바꿀 수 없습니다'); return; }
  const b = document.getElementById('w-tobook');
  if(b.classList.contains('on')){ closeToBook(); return; }
  document.getElementById('w-pobook').classList.remove('on');
  b.classList.add('on');
  document.getElementById('w-salute').classList.add('picking');
  paintToBook();
}
function closeToBook(){
  document.getElementById('w-tobook').classList.remove('on');
  document.getElementById('w-salute').classList.remove('picking');
}
function paintToBook(){
  const b = document.getElementById('w-tobook');
  if(!people){ b.innerHTML = `<div class="to-none">불러오는 중…</div>`; return; }
  if(!people.length){
    b.innerHTML = `<div class="to-none">아직 편지를 보낼 수 있는 분이 없습니다.<br>
      같은 책을 걸었거나, 서로의 방에 다녀갔거나, 같은 별의 콩파뇽이면 쓸 수 있습니다.</div>`;
    return;
  }
  b.innerHTML = people.map(p =>
    `<div class="to-one" onclick="setTo('${p.id}')">
       <b>${esc(p.nickname)}</b><span>${esc(p.why)}</span></div>`).join('');
}
function setTo(id){
  toPick = (people || []).find(p => p.id === id) || null;
  const s = document.getElementById('w-to');
  if(toPick){ s.textContent = toPick.nickname; s.classList.add('filled'); }
  closeToBook();
}

/* 바깥을 누르면 펼친 것을 접는다 */
document.addEventListener('click', e => {
  if(!e.target.closest('#w-pobook') && !e.target.closest('#w-frank'))
    document.getElementById('w-pobook').classList.remove('on');
  if(!e.target.closest('#w-tobook') && !e.target.closest('#w-to')) closeToBook();
});

/* 소인은 손님이 안 고른다 — 우체국이 찍는 것이다 */
const randOf = a => (a && a.length) ? a[Math.floor(Math.random()*a.length)] : null;

/* 부치는 소리 — 편지가 실제로 들어간 뒤에만 운다.
   ⚠ 수정에는 안 울린다. 그건 부치는 것이 아니라 고치는 것이다. */
function playSent(){
  try{
    const s = document.getElementById('sentSound');
    if(s){ s.volume = 0.45; s.currentTime = 0; s.play().catch(()=>{}); }
  }catch(e){}
}

/* ── 편지지 머리 — 내 이름과 내 도시 ──
   ⭐ 화면에 뜰 이름은 창이 싣는다. 셸이 세션을 뒤져 짐작하지 않는다(0813 「당신 님께」).
   ⚠ 메종이 아직 없으면 도시가 비어 온다 — 그때는 윗머리를 아예 안 적는다. */
async function loadHead(){
  if(HEAD) return HEAD;
  try{
    const r = await sbFetch('/rest/v1/rpc/eg_my_letterhead', { method:'POST', body:'{}' });
    HEAD = (r && r[0]) || {};
  }catch(e){ HEAD = {}; console.warn('[편지] 편지지 머리', e); }
  return HEAD;
}
function paintHead(){
  document.getElementById('w-place').textContent =
    (HEAD && HEAD.city && HEAD.maison_no) ? `${cityKo(HEAD.city)} ${HEAD.maison_no}번가에서` : '';
  document.getElementById('w-sign').textContent = (HEAD && HEAD.nickname) || '';
}

/* ── 수정 — 같은 편지지를 「수정 중」으로 세운다 (0814 소로: 용어는 「수정」) ── */
function editMsg(){
  const m = open;
  closeRead();
  editing = m;
  poPick  = m.postage_code;
  toPick  = { id:m.who_id, nickname:m.who, locked:true };
  document.getElementById('w-to').textContent = m.who;
  document.getElementById('w-to').className = 'to-slot filled locked';
  document.getElementById('w-body').value = m.body;
  document.getElementById('w-send').textContent = '수정';
  /* ⚠ 수정 화면의 윗머리·서명은 **그 편지의 것**이다. 지금 내 도시가 아니라
     부칠 때 찍힌 도시가 서야 한다 — 편지는 이미 그 자리에서 떠났다. */
  document.getElementById('w-place').textContent =
    (m.city && m.maison_no) ? `${cityKo(m.city)} ${m.maison_no}번가에서` : '';
  document.getElementById('w-sign').textContent = (HEAD && HEAD.nickname) || '';
  paintFrank();
  document.getElementById('writeModal').classList.add('show');
  document.body.classList.add('reading');
  countBody();                       /* ⚠ 뜬 뒤에 잰다 */
  try{ window.parent?.postMessage({ eg:'letter-open' }, '*'); }catch(e){}
}

/* ── 새 편지 · 답장 ──
   ⚠ 제목은 없다(0814 소로) — 편지에 제목을 쓰는 경우가 없다. 「Re:」도 함께 사라졌다.
     답장인지는 본문이 말한다(맺음말을 셸이 안 붙이는 것과 같은 문법). */
async function openCompose(toId, toName){
  editing = null; poPick = null; toPick = null;
  const s = document.getElementById('w-to');
  s.className = 'to-slot'; s.textContent = '받는 이';
  document.getElementById('w-body').value = '';
  document.getElementById('w-send').textContent = '부치기';
  document.getElementById('w-sign').textContent = '';
  document.getElementById('w-place').textContent = '';
  paintFrank();
  document.getElementById('writeModal').classList.add('show');
  document.body.classList.add('reading');
  /* ⚠ 높이 재기는 **뜬 뒤에** — 감춰진 칸의 scrollHeight는 0이다.
     min-height가 받쳐 주어 눈에는 안 띄지만, style.height:0px이 남는다. */
  countBody();
  try{ window.parent?.postMessage({ eg:'letter-open' }, '*'); }catch(e){}

  await Promise.all([loadStock(), loadHead()]);
  paintHead(); paintFrank();

  if(!people){
    try{ people = await sbFetch('/rest/v1/rpc/eg_writable_people', { method:'POST', body:'{}' }) || []; }
    catch(e){ people = []; console.warn(e); }
  }
  /* 답장 — 받는 이가 이미 정해져 있고 바꿀 수 없다 */
  if(toId){
    const p = people.find(x => x.id === toId);
    toPick = { id:toId, nickname:(p ? p.nickname : toName) || '—', locked:true };
    s.textContent = toPick.nickname; s.className = 'to-slot filled locked';
  }else if(!people.length){
    s.textContent = '아직 없습니다';
  }
  if(document.getElementById('w-tobook').classList.contains('on')) paintToBook();
}
function closeCompose(){
  document.getElementById('writeModal').classList.remove('show');
  document.body.classList.remove('reading');
  document.getElementById('w-pobook').classList.remove('on');
  closeToBook();
  editing = null;
  try{ window.parent?.postMessage({ eg:'letter-close' }, '*'); }catch(e){}
}
/* ── 글자 수 — 다 차 갈 때만 뜬다 ──
   ⭐ 늘 보이면 편지가 아니라 입력칸이 된다. 아예 없으면 4,000자에서 갑자기 막힌다.
      3,500자를 넘어야 나타난다(헌장 9장 「수치화하지 않는다」의 실무판). */
function countBody(){
  const t = document.getElementById('w-body');
  document.getElementById('w-count').textContent =
    t.value.length > 3500 ? `${t.value.length} / 4000` : '';
  t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px';
}
document.getElementById('w-body').addEventListener('input', countBody);

async function sendMsg(){
  if(busy) return;
  const body = document.getElementById('w-body').value.trim();
  if(!body){ toast('편지를 적어 주세요'); document.getElementById('w-body').focus(); return; }
  const btn = document.getElementById('w-send');
  const wasEditing = editing;                     /* closeCompose가 걷기 전에 쥔다 */
  busy = true; btn.disabled = true;

  try{
    if(wasEditing){
      /* ⚠ 제목 칸은 없어졌지만 표의 subject는 남겨 둔다 — 옛 편지의 첫 줄이
         사라지면 안 되므로. 수정할 때 건드리지 않는다. */
      await sbFetch(`/rest/v1/messages?id=eq.${wasEditing.id}`,
        { method:'PATCH', headers:{ Prefer:'return=minimal' },
          body: JSON.stringify({ body }) });
      toast('편지를 수정했습니다');
    }else{
      if(!toPick){ toast('받는 이를 고르세요'); busy = false; btn.disabled = false; return; }
      /* ⭐ 안 고르셨으면 그날 발행 중인 것 하나가 저절로 붙는다.
         소인은 언제나 우체국이 고른다 — 손님이 못 고른다. */
      const po = poPick || (randOf(POSTAGE) || {}).code || null;
      const pm = (randOf(POSTMARK) || {}).code || null;
      await sbFetch('/rest/v1/messages',
        { method:'POST', headers:{ Prefer:'return=minimal' },
          body: JSON.stringify({ sender_id: getUser().id, recipient_id: toPick.id,
                                 subject: null, body,
                                 postage_code: po, postmark_code: pm }) });
      playSent();
      toast('우편함에 넣어 두었습니다');
    }
    closeCompose();
    if(tab === 'out' || wasEditing) await load();
  }catch(e){
    /* 자격이 없으면 RLS가 막는다 — 날 오류 대신 사람 말로 답한다 */
    const m = String(e.message || '');
    toast(/row-level|policy|violates/i.test(m)
      ? '이분께는 아직 편지를 보낼 수 없습니다'
      : (/읽은 쪽지/.test(m) ? '이미 읽은 편지는 수정할 수 없습니다' : '보내지 못했습니다'));
    console.warn('[편지]', e);
  }
  busy = false; btn.disabled = false;
}

/* 모달 바깥을 눌러도 닫힌다 — 뒷문을 열어 두지 않는다(0808) */
document.getElementById('readModal').addEventListener('click', e => {
  if(e.target.id === 'readModal') closeRead();
});
document.getElementById('writeModal').addEventListener('click', e => {
  if(e.target.id === 'writeModal') closeCompose();
});

/* 바깥(자화상·지구)에서 「편지 쓰기」를 곧장 열 수 있게 열어 둔다 */
window.egMail = { reload: load, compose: openCompose };

/* 봉투에서 들어왔는가 — 주소가 한 번만 말해 준다 */
function cameFromEnvelope(){
  try{ return new URLSearchParams(location.search).get('unread') === '1'; }
  catch(e){ return false; }
}
/* 다발에서 다음 한 장. 없으면 거짓을 돌려주고 목록이 남는다. */
function nextInBundle(){
  while(BUNDLE.length){
    const id = BUNDLE.shift();
    const i = rows.findIndex(r => r.id === id);
    if(i >= 0){ inBundle = true; document.body.classList.add('bundling'); openRead(i); return true; }
  }
  inBundle = false; document.body.classList.remove('bundling'); return false;
}

BUNDLE_PENDING = cameFromEnvelope();
console.log('%c[EG] messages 0814c — 우표·소인 덩어리를 75%로 · 읽기/쓰기 자리 셈 통합', 'color:#8a6d1f');
load();
</script>
</body>
