<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우편함 — 은교살롱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+KR:wght@300;400;500;600&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  /* ══ EG 우편함 (0813)
     한 파일이 두 곳에서 산다 — 교양 자화상 안 액자 · 지구(타륜 봉투) 팝업 카드.
     ⚠ 배경을 투명하게 둔다. 액자로 끼울 때 바깥 옷이 비쳐야 한 몸으로 보인다. ══ */
  *{ box-sizing:border-box; margin:0; padding:0; }
  :root{
    --ink:#ece3d0; --ink-soft:#c8baa0; --ink-dim:#9a8d72;
    --gold:#d8b860; --gold-deep:#c9a84c;
    --line:rgba(216,184,96,0.22);
    --card:rgba(24,17,10,0.74); --card-edge:rgba(216,184,96,0.22);
    --seal:#9c3b34;                       /* 봉랍 붉은빛 — 안 읽은 것의 표 */
  }
  html,body{ height:100%; }
  body{
    font-family:'Noto Serif KR', serif; color:var(--ink);
    background:transparent; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    /* ⚠ 0813 소로 — 막대가 세 겹이었다. 편지지·액자·몸통. 여기가 그 셋째다. */
    scrollbar-width:none; -ms-overflow-style:none;
  }
  body::-webkit-scrollbar{ display:none; }
  .wrap{ max-width:480px; margin:0 auto; padding:14px 16px 28px; }

  /* ── 탭 두 개 ── */
  .tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .tab{
    flex:1; text-align:center; padding:9px 0; cursor:pointer;
    font-size:13px; letter-spacing:.02em; color:var(--ink-dim);
    border:1px solid var(--line); border-radius:10px;
    background:rgba(24,17,10,0.45); transition:all .18s ease; user-select:none;
  }
  .tab:hover{ color:var(--ink-soft); }
  .tab.on{ color:#1a120c; background:linear-gradient(135deg,var(--gold),var(--gold-deep));
           border-color:var(--gold-deep); font-weight:500; }

  /* ── 쓰기 단추 ── */
  .compose-btn{
    width:100%; padding:11px 0; margin-bottom:14px; cursor:pointer;
    font-family:inherit; font-size:13px; color:var(--gold);
    background:rgba(216,184,96,.08); border:1px solid var(--line); border-radius:10px;
    transition:background .18s ease;
  }
  .compose-btn:hover{ background:rgba(216,184,96,.16); }

  /* ── 봉투 한 통 ── */
  .env{
    position:relative; padding:13px 14px 12px 17px; margin-bottom:9px; cursor:pointer;
    background:var(--card); border:1px solid var(--card-edge); border-radius:11px;
    transition:border-color .18s ease, transform .12s ease;
  }
  .env:hover{ border-color:rgba(216,184,96,.42); }
  .env:active{ transform:scale(.995); }
  /* 안 읽은 것 — 왼쪽에 봉랍 한 줄. 숫자는 어디에도 없다(결정문 5호) */
  .env.unread::before{
    content:''; position:absolute; left:0; top:11px; bottom:11px; width:3px;
    background:var(--seal); border-radius:2px;
  }
  .env-top{ display:flex; align-items:baseline; gap:8px; margin-bottom:5px; }
  .env-who{ font-size:13px; color:var(--gold); font-weight:500; }
  .env-when{ margin-left:auto; font-size:11px; color:var(--ink-dim); white-space:nowrap; }
  .env-subj{ font-size:13.5px; color:var(--ink); margin-bottom:3px; line-height:1.45; }
  .env-peek{ font-size:12px; color:var(--ink-dim); line-height:1.5;
             display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .env-mark{ font-size:10.5px; color:var(--ink-dim); margin-top:5px; letter-spacing:.03em; }

  .empty{ text-align:center; padding:44px 20px; color:var(--ink-dim);
          font-size:13px; line-height:1.9; }
  .empty .em{ display:block; font-size:26px; margin-bottom:12px; opacity:.5; }

  /* ══════ 편지 (0813) ══════
     소로 확정: 세월 든 미색 · 가장자리 아주 살짝 · 무늬 없음 · 제목은 본문 첫 줄로.
     ⭐ 종이와 글자를 갈라 놓는다 — 울퉁불퉁(deckle)은 .paper 층에만 걸린다.
        한 겹으로 하면 본문 글자까지 물결친다. */
  .letter-bg{
    position:fixed; inset:0; z-index:84; display:none;
    /* ⚠⚠ 0813 저녁 — 두 번 고쳤다. 처음엔 새까맸고, 걷었더니 우편함이 훤히 비쳐
       편지 뒤로 목록이 어른거렸다. ⭐ 답은 「걷기」가 아니라 「종이빛 막」이었다 —
       뒤가 가려지되 어둡지 않다. */
    background:rgba(232,223,198,.86);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    align-items:center; justify-content:center; padding:14px 12px;
  }
  .letter-bg.show{ display:flex; }
  body.reading{ overflow:hidden; }
  /* ⚠ 다발을 넘기는 동안에는 목록이 뒤에서 어른거리면 안 된다.
     읽음을 적을 때 paint()가 목록을 다시 그리므로 화면에서 아예 걷는다. */
  body.bundling .wrap{ visibility:hidden; }
  .letter-wrap{
    position:relative; width:100%; max-width:560px; max-height:92vh;
    overflow-y:auto; overflow-x:hidden;
    scrollbar-width:none; -ms-overflow-style:none;      /* 슬라이드 바 없음(0813 소로) */
    animation:lIn .26s ease;
  }
  .letter-wrap::-webkit-scrollbar{ display:none; }
  @keyframes lIn{ from{ opacity:0; transform:translateY(12px) } to{ opacity:1; transform:none } }

  /* ⭐ 0813 소로 — 편지지는 내용에 맞춰 줄어들지 않는다.
     짧게 쓰면 아래가 비는 것이 정상이다. 진짜 편지지가 그렇다.
     ⚠ 아래 구석 활자는 종이 맨 아래에 붙고, 서명은 본문을 따라온다 —
       한 덩어리로 두면 서명이 함께 끌려 내려간다. 그래서 사이에 빈 칸(l-fill)을 둔다. */
  .letter{
    position:relative; padding:46px 40px 30px;
    min-height:620px; display:flex; flex-direction:column;
  }
  .letter > *{ position:relative; z-index:1; }
  .l-fill{ flex:1; min-height:34px; }
  .paper{
    position:absolute; inset:0; z-index:0;   /* flex 흐름 밖 — 높이에 안 끼어든다 */
    background:#efe6cd;                                  /* 세월 든 미색 */
    box-shadow:0 24px 60px rgba(0,0,0,.55);
    filter:url(#egDeckle);                               /* 가장자리 아주 살짝 */
  }
  .paper::after{
    content:''; position:absolute; inset:0;
    box-shadow:inset 0 0 40px rgba(140,110,66,.18), inset 0 0 6px rgba(140,110,66,.22);
  }

  /* ── 우표 + 소인 (0813) ──
     ⭐ 소인은 우표 **오른쪽**에 꽝 찍힌다(0813 소로). 우표를 좀 가려도 좋다 —
        가려야 진짜 부쳐진 편지로 보인다.
     ⚠ 우표 높이만 고정하고 폭은 비율이 정한다(0.58 ~ 1.47). */
  /* ⚠ 소인이 우표 오른쪽 바깥으로 나가므로 우표를 안쪽으로 당겨 둔다 */
  .frank{ position:absolute; top:26px; right:78px; z-index:2; }
  .stamp{ position:relative; transform:rotate(-2.4deg);
          filter:drop-shadow(0 1px 0 rgba(120,96,58,.22)); }
  .stamp img{ display:block; object-fit:contain; }

  /* ⚠ 소인은 우표 위에 올라탄다(z-index 3). 아래 깔리면 겹치는 뜻이 사라진다. */
  .postmark{ position:absolute; right:-38px; top:6px; z-index:3; pointer-events:none; }
  .postmark img{ width:100%; height:100%; display:block; opacity:.86; }
  .pm-t{
    position:absolute; left:50%; transform:translate(-50%,-50%);
    font-family:'Cormorant Garamond',serif; letter-spacing:1.2px; font-weight:600;
    white-space:nowrap; color:inherit;
  }

  /* ── 윗머리 · 부름 · 본문 · 서명 ── */
  /* ⚠ 소인이 우표 오른쪽으로 나가면서 윗머리를 더 비워야 한다(카프카에서 본문 침범) */
  /* ⭐ 0813 소로 — 우표·소인이 앉는 오른쪽 위를 통째로 비운다.
     본문은 그 아래에서 시작한다. 주소만 위에 남는다. */
  .l-head{ margin-bottom:22px; padding-right:150px; min-height:170px; }
  .l-place{
    font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    font-size:11.5px; color:#7a6849; letter-spacing:.02em;
  }
  .l-salute{ font-size:15px; color:#3a2f21; margin-bottom:20px; }
  .l-body{
    font-size:14.5px; line-height:2.02; color:#3a2f21;
    white-space:pre-wrap; word-break:break-word;
  }
  .l-body .lead{ color:#2e2417; }
  /* ⚠ 맺음말은 셸이 안 붙인다(0813 소로) — 「이만 줄입니다」는 손님의 목소리다.
     서명 한 줄만 놓는다. 누가 보냈는지는 편지가 스스로 말해야 하므로. */
  .l-close{ margin-top:28px; text-align:right; flex:0 0 auto; }
  /* ⚠ 목업의 손글씨체로 되돌린다. 크기도 한 눈금 줄인다(0813 소로) */
  .l-sign{ font-family:'Nanum Pen Script',cursive; font-size:27px; line-height:1.2;
           color:#2b3a52; letter-spacing:.02em; }
  /* ⭐ 0813 소로 — 소인의 날짜는 「부쳐졌다」는 표시이지 읽으라고 있는 것이 아니다.
     정확한 날짜·시각은 서명 아래에 타자기 활자로 한 줄. 편지의 일부로 읽힌다.
     ⚠ 연도까지 적는다 — 삼 년 뒤 보관함을 열 때를 위해서다. 대신 작게. */
  .l-stamped{
    margin-top:9px; font-family:'Courier New', Courier, monospace;
    font-size:11px; letter-spacing:.08em; color:#8a7659;
  }
  .l-foot{
    margin-top:0; padding-top:13px; border-top:1px solid rgba(120,96,58,.18);
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .l-note{ font-size:10.5px; color:#8a7659; letter-spacing:.04em; }
  .l-acts{ display:flex; gap:13px; flex-wrap:wrap; }
  .l-act{
    font-size:11px; color:#7a6849; cursor:pointer; letter-spacing:.06em;
    border-bottom:1px solid transparent; padding-bottom:1px;
    transition:color .2s, border-color .2s; background:none; border-top:0; border-left:0; border-right:0;
    font-family:inherit;
  }
  .l-act:hover{ color:#3a2f21; border-bottom-color:rgba(120,96,58,.45); }
  .l-act.warn{ color:#9a5548; }
  .l-x{
    position:absolute; top:-2px; right:-2px; z-index:3; width:32px; height:32px;
    background:none; border:0; cursor:pointer; font-family:inherit;
    color:rgba(236,227,208,.62); font-size:22px; line-height:1;
  }
  .l-x:hover{ color:#ece3d0; }

  /* ── 모달 (읽기 · 쓰기) ── */
  .modal-bg{
    position:fixed; inset:0; z-index:80; display:none;
    background:rgba(8,5,3,.72); backdrop-filter:blur(3px);
    align-items:center; justify-content:center; padding:18px;
  }
  .modal-bg.show{ display:flex; }
  .modal{
    width:100%; max-width:440px; max-height:86vh; overflow-y:auto;
    background:linear-gradient(168deg, rgba(31,22,13,.98), rgba(22,15,9,.98));
    border:1px solid rgba(216,184,96,.34); border-radius:14px;
    padding:20px 20px 18px; position:relative;
    box-shadow:0 22px 60px rgba(0,0,0,.55);
    animation:mIn .22s ease;
  }
  @keyframes mIn{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }
  .modal-x{
    position:absolute; top:10px; right:12px; width:28px; height:28px; cursor:pointer;
    background:none; border:none; color:var(--ink-dim); font-size:20px; line-height:1;
    font-family:inherit;
  }
  .modal-x:hover{ color:var(--ink); }
  .m-eyebrow{ font-family:'Cormorant Garamond',serif; font-size:11px; letter-spacing:.18em;
              color:var(--gold-deep); text-transform:uppercase; margin-bottom:10px; }
  .m-who{ font-size:13px; color:var(--gold); margin-bottom:2px; }
  .m-when{ font-size:11px; color:var(--ink-dim); margin-bottom:14px; }
  .m-subj{ font-size:16px; font-weight:500; line-height:1.5; margin-bottom:12px;
           padding-bottom:12px; border-bottom:1px solid var(--line); }
  .m-body{ font-size:14px; line-height:1.85; white-space:pre-wrap; word-break:break-word;
           color:var(--ink-soft); min-height:60px; }
  .m-foot{ display:flex; gap:9px; margin-top:20px; }
  .btn{ flex:1; padding:10px 0; cursor:pointer; font-family:inherit; font-size:13px;
        border-radius:9px; border:1px solid var(--line); transition:background .18s ease; }
  .btn-ghost{ background:rgba(255,255,255,.03); color:var(--ink-dim); }
  .btn-ghost:hover{ background:rgba(255,255,255,.07); color:var(--ink-soft); }
  .btn-gold{ background:linear-gradient(135deg,var(--gold),var(--gold-deep));
             border-color:var(--gold-deep); color:#1a120c; font-weight:500; }
  .btn-gold:hover{ filter:brightness(1.06); }
  .btn:disabled{ opacity:.45; cursor:default; }

  /* ── 쓰기 ── */
  .f-row{ margin-bottom:13px; }
  .f-label{ font-size:11.5px; color:var(--gold-deep); letter-spacing:.04em; margin-bottom:6px; }
  select, input[type=text], textarea{
    width:100%; padding:9px 11px; font-family:inherit; font-size:13.5px;
    color:var(--ink); background:rgba(12,8,4,.66);
    border:1px solid var(--line); border-radius:9px; outline:none;
  }
  select:focus, input:focus, textarea:focus{ border-color:rgba(216,184,96,.55); }
  textarea{ min-height:150px; resize:vertical; line-height:1.75; }
  select option{ background:#1a120c; color:var(--ink); }
  .f-count{ font-size:10.5px; color:var(--ink-dim); text-align:right; margin-top:4px; }
  .f-note{ font-size:11.5px; color:var(--ink-dim); line-height:1.7; margin-top:2px; }

  /* ── 우표 고르기 (0813) ──
     ⚠ 높이만 고정한다. 폭은 우표마다 다르다(0.58 ~ 1.47). */
  .po-pick{ display:flex; gap:9px; flex-wrap:wrap; align-items:flex-end; }
  .po-one{
    height:62px; padding:3px; cursor:pointer; border-radius:4px;
    border:1px solid transparent; background:rgba(239,230,205,.10);
    transition:border-color .18s, background .18s, transform .12s;
  }
  .po-one:hover{ background:rgba(239,230,205,.20); transform:translateY(-2px); }
  .po-one.on{ border-color:var(--gold); background:rgba(216,184,96,.18); }
  .po-one img{ height:100%; width:auto; display:block; }
  .po-rand{
    height:62px; min-width:56px; display:flex; align-items:center; justify-content:center;
    padding:0 11px; cursor:pointer; border-radius:4px; font-size:11px; line-height:1.5;
    text-align:center; color:var(--ink-dim); border:1px dashed var(--line);
    background:rgba(255,255,255,.02);
  }
  .po-rand.on{ color:var(--gold); border-color:var(--gold); border-style:solid;
               background:rgba(216,184,96,.14); }

  /* 목록 봉투 위의 작은 우표 */
  .env{ overflow:hidden; }
  .env-po{ position:absolute; right:11px; bottom:10px; height:34px; width:auto;
           opacity:.9; pointer-events:none; }

  /* ── 토스트 ── */
  #toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(12px);
    z-index:95; padding:10px 18px; border-radius:22px; opacity:0; pointer-events:none;
    background:rgba(28,20,12,.96); border:1px solid rgba(216,184,96,.4);
    color:var(--ink); font-size:12.5px; transition:opacity .22s ease, transform .22s ease;
    max-width:88vw; text-align:center;
  }
  #toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- 손으로 뜬 종이 가장자리. 종이 층에만 걸린다 — 글자는 안 흔들린다 -->
  <filter id="egDeckle" x="-4%" y="-3%" width="108%" height="106%">
    <feTurbulence type="fractalNoise" baseFrequency="0.016 0.05" numOctaves="4" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="wrap">
  <div class="tabs">
    <div class="tab on" id="tab-in"  onclick="switchTab('in')">받은 편지</div>
    <div class="tab"    id="tab-arc" onclick="switchTab('arc')">보관함</div>
    <div class="tab"    id="tab-out" onclick="switchTab('out')">보낸 편지</div>
  </div>
  <button class="compose-btn" onclick="openCompose()">✉︎ 편지 쓰기</button>
  <div id="list"><div class="empty">불러오는 중…</div></div>
</div>

<!-- 읽기 — 한 장의 편지 -->
<div class="letter-bg" id="readModal">
  <div class="letter-wrap">
    <button class="l-x" onclick="closeRead()" aria-label="닫기">×</button>
    <div class="letter">
      <div class="paper"></div>
      <div id="r-frank"></div>
      <div class="l-head"><div class="l-place" id="r-place"></div></div>
      <div class="l-salute" id="r-salute">—</div>
      <div class="l-body" id="r-body">—</div>
      <div class="l-close">
        <div class="l-sign" id="r-sign">—</div>
        <div class="l-stamped" id="r-stamped"></div>
      </div>
      <div class="l-fill"></div>
      <div class="l-foot">
        <span class="l-note" id="r-note"></span>
        <div class="l-acts" id="r-acts"></div>
      </div>
    </div>
  </div>
</div>

<!-- 쓰기 -->
<div class="modal-bg" id="writeModal">
  <div class="modal">
    <button class="modal-x" onclick="closeCompose()" aria-label="닫기">×</button>
    <div class="m-eyebrow" id="w-eyebrow">편지 쓰기</div>
    <div class="f-row">
      <div class="f-label">받는 이</div>
      <select id="w-to"><option value="">불러오는 중…</option></select>
      <div class="f-note" id="w-tonote">한 번 스쳐 간 이들에게 쓸 수 있습니다.</div>
    </div>
    <div class="f-row">
      <div class="f-label">제목 <span style="opacity:.6">(비워 두어도 됩니다)</span></div>
      <input type="text" id="w-subj" maxlength="80" placeholder="">
    </div>
    <div class="f-row">
      <div class="f-label">편지</div>
      <textarea id="w-body" maxlength="4000" placeholder=""></textarea>
      <div class="f-count"><span id="w-count">0</span> / 4000</div>
      <div class="f-note">이름은 편지 끝에 저절로 놓입니다.</div>
    </div>
    <div class="f-row" id="w-porow">
      <div class="f-label">우표 <span style="opacity:.6">(안 고르시면 하나가 저절로 붙습니다)</span></div>
      <div class="po-pick" id="w-po"></div>
    </div>
    <div class="m-foot">
      <button class="btn btn-ghost" onclick="closeCompose()">그만두기</button>

<!-- 부치는 소리. ⚠ 파일이 없어도 조용히 넘어간다 — 소리는 덤이지 조건이 아니다.
     ⭐ 도착음과 달리 되받는 배관이 필요 없다. 손님이 「보내기」를 직접 누른 뒤라
        브라우저가 이미 소리를 허락한 상태다(자동재생 정책은 사용자 동작을 본다). -->
<audio id="sentSound" src="mail_sent.mp3" preload="none"></audio>

<div id="toast"></div>

<script>
/* ══ 창구 — 자화상(persona.html)과 한 글자도 다르지 않게 승계한다.
   ⚠ 인증 문법을 새로 짜지 않는다. 두 곳에 살면 한쪽만 고치는 날이 온다. ══ */
const SUPABASE_URL = 'https://cyhlotwdisjvoxvfkpnd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';

let _refreshing = null;
function getSession(){ try{ return JSON.parse(localStorage.getItem('eungyo-auth')); }catch{ return null; } }
function tokenExp(tok){ try{ return JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp || 0; }catch{ return 0; } }
async function getValidToken(){
  const s = getSession();
  if(!s?.access_token) return null;
  const now = Math.floor(Date.now()/1000);
  if(tokenExp(s.access_token) - now > 60) return s.access_token;
  if(!s.refresh_token) return null;
  _refreshing = _refreshing || (async () => {
    try{
      const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
        method:'POST', headers:{ 'apikey':SUPABASE_KEY, 'Content-Type':'application/json' },
        body: JSON.stringify({ refresh_token: s.refresh_token }) });
      if(!r.ok) return null;
      const data = await r.json();
      if(!data.expires_at) data.expires_at = Math.floor(Date.now()/1000) + (data.expires_in || 3600);
      localStorage.setItem('eungyo-auth', JSON.stringify(data));
      return data.access_token || null;
    }catch(e){ return null; }
  })();
  const tok = await _refreshing; _refreshing = null; return tok;
}
async function sbFetch(path, options = {}){
  const token = await getValidToken();
  const res = await fetch(SUPABASE_URL + path, { ...options, headers:{
    'apikey':SUPABASE_KEY, 'Authorization':'Bearer ' + (token || SUPABASE_KEY),
    'Content-Type':'application/json', ...options.headers } });
  if(!res.ok){
    const e = await res.json().catch(()=>({}));
    throw new Error(e.message || e.error || e.msg || res.statusText);
  }
  /* ⚠ 0813 — 본문 없는 성공을 실패로 읽던 병.
     Prefer: return=minimal 로 POST하면 서버는 **201에 빈 본문**을 준다.
     204만 걸러내면 201에서 res.json()이 터지고, 그 예외가 catch로 굴러가
     「보내지 못했습니다」가 뜬다 — 쪽지는 이미 들어간 뒤인데도.
     ⭐ 성공·실패는 상태 번호가 가른다. 본문을 읽다 난 예외로 가르지 않는다. */
  if(res.status === 204 || res.status === 205) return null;
  const txt = await res.text();
  if(!txt) return null;
  try{ return JSON.parse(txt); }catch(e){ return null; }
}
function getUser(){ try{ return (JSON.parse(localStorage.getItem('eungyo-auth'))||{}).user || null; }catch{ return null; } }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=> t.classList.remove('on'), 2600);
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 언제 왔는지 — 오늘이면 시각, 올해면 월일, 넘으면 연월일 */
function whenText(iso){
  const d = new Date(iso), n = new Date(), p = v => String(v).padStart(2,'0');
  if(d.toDateString() === n.toDateString()) return `${p(d.getHours())}:${p(d.getMinutes())}`;
  if(d.getFullYear() === n.getFullYear())   return `${d.getMonth()+1}월 ${d.getDate()}일`;
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`;
}

// ── 상태 ─────────────────────────────────────────────
let tab = 'in';            // 'in' | 'arc' | 'out'
let rows = [];             // 지금 탭의 목록
let open = null;           // 펼쳐진 한 통
let busy = false;

/* ⭐ 우표·소인은 한 판에 한 번만 묻는다. 편지마다 부르면 목록이 느려진다. */
let POSTAGE = null, POSTMARK = null;

/* ⭐ 0813 소로 — 봉투에서 들어오면 안 읽은 편지를 **먼저 온 것부터** 한 장씩 넘긴다.
   다 넘기면 우편함 목록이 뜬다. 언제든 「우편함으로」로 빠져나갈 수 있다 —
   ⚠ 빠져나갈 문이 없으면 열 통 쌓인 날 열 번 닫아야 목록에 닿는다. */
let BUNDLE = [];            /* 아직 안 넘긴 편지들 (먼저 온 것이 앞) */
let inBundle = false;
/* ⚠ let은 끌어올려지지 않는다 — 쓰는 곳(load)보다 반드시 앞에 세운다.
   뒤에 두면 첫 load에서 그 자리가 통째로 터진다. */
let BUNDLE_PENDING = false;
async function loadStock(){
  if(POSTAGE && POSTMARK) return;
  try{
    const [po, pm] = await Promise.all([
      sbFetch('/rest/v1/rpc/eg_postage_on_sale', { method:'POST', body:'{}' }),
      sbFetch('/rest/v1/rpc/eg_postmarks',       { method:'POST', body:'{}' })
    ]);
    POSTAGE = po || []; POSTMARK = pm || [];
  }catch(e){ POSTAGE = POSTAGE || []; POSTMARK = POSTMARK || []; console.warn('[우표]', e); }
}
const findPo = c => (POSTAGE || []).find(p => p.code === c) || null;
const findPm = c => (POSTMARK || []).find(p => p.code === c) || null;

/* 도시 이름 — DB는 로마자로 산다. 소인에는 로마자가 맞고, 윗머리에는 한글이 맞다. */
const CITY_KO = { paris:'파리', london:'런던', boston:'보스턴', vienna:'빈', kyoto:'교토',
                  lisbon:'리스본', newyork:'뉴욕', berlin:'베를린', rome:'로마' };
const cityKo   = c => CITY_KO[c] || (c ? c[0].toUpperCase()+c.slice(1) : '');
const cityRoman= c => (c || 'EG').toUpperCase();

const MON = ['IAN','FEB','MAR','APR','MAI','IVN','IVL','AVG','SEP','OCT','NOV','DEC'];
function pmDate(iso){
  const d = new Date(iso);
  return `${d.getDate()} ${MON[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`;
}
/* 발송 시각 — 서명 아래 한 줄. 타자기 활자로 찍는다. */
function stampedAt(iso){
  const d = new Date(iso), p = v => String(v).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}  ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function load(){
  const box = document.getElementById('list');
  if(!getUser()){ box.innerHTML = `<div class="empty"><span class="em">✉︎</span>로그인하시면 우편함이 열립니다.</div>`; return; }
  box.innerHTML = `<div class="empty">불러오는 중…</div>`;
  const fn = tab === 'in' ? 'eg_inbox' : tab === 'arc' ? 'eg_archivebox' : 'eg_sentbox';
  try{
    const [r] = await Promise.all([
      sbFetch(`/rest/v1/rpc/${fn}`, { method:'POST', body: JSON.stringify({}) }),
      loadStock()
    ]);
    rows = r || [];
  }catch(e){ box.innerHTML = `<div class="empty">편지를 가져오지 못했습니다.<br><span style="font-size:11px">${esc(e.message)}</span></div>`; return; }
  paint();

  /* 봉투에서 들어온 첫 판에만 다발을 세운다. 탭을 갈아도 다시 안 선다. */
  if(BUNDLE_PENDING){
    BUNDLE_PENDING = false;
    BUNDLE = rows.filter(r => !r.read_at).map(r => r.id).reverse();   /* 먼저 온 것이 앞 */
    nextInBundle();
  }
}

function paint(){
  const box = document.getElementById('list');
  if(!rows.length){
    box.innerHTML = tab === 'in'
      ? `<div class="empty"><span class="em">✉︎</span>우편함이 비어 있습니다.<br>누군가 다녀가면 여기에 놓여 있을 겁니다.</div>`
      : tab === 'arc'
      ? `<div class="empty"><span class="em">✉︎</span>보관해 둔 편지가 없습니다.</div>`
      : `<div class="empty"><span class="em">✉︎</span>아직 부친 편지가 없습니다.</div>`;
    return;
  }
  box.innerHTML = rows.map((m,i) => {
    const unread = (tab === 'in' && !m.read_at);
    const mark = tab === 'out'
      ? (m.read_at ? `읽음 · ${whenText(m.read_at)}` : '아직 안 읽었습니다')
      : (m.edited_at ? '고쳐 쓴 편지' : '');
    const po = findPo(m.postage_code);
    return `<div class="env${unread ? ' unread' : ''}" onclick="openRead(${i})">
      <div class="env-top">
        <span class="env-who">${esc(m.who)}</span>
        <span class="env-when">${whenText(m.sent_at)}</span>
      </div>
      ${m.subject ? `<div class="env-subj">${esc(m.subject)}</div>` : ''}
      <div class="env-peek">${esc(m.body)}</div>
      ${mark ? `<div class="env-mark">${mark}</div>` : ''}
      ${po ? `<img class="env-po" src="${esc(po.art_url)}" alt="">` : ''}
    </div>`;
  }).join('');
}

function switchTab(t){
  if(tab === t) return;
  tab = t;
  ['in','arc','out'].forEach(k =>
    document.getElementById('tab-' + k).classList.toggle('on', k === t));
  load();
}

// ── 우표 · 소인 그리기 ───────────────────────────────
/* ⚠ 높이만 고정하고 폭은 비율이 정한다. 폭을 고정하면 세로로 긴 우표가
     윗머리를 밀고 내려온다(0813 실측: 소로 0.58 ~ 모차르트 1.47). */
const PO_H = 104;
function frankHtml(m){
  const po = findPo(m.postage_code), pm = findPm(m.postmark_code);
  if(!po && !pm) return '';
  const w = po ? Math.round(PO_H * Number(po.ratio || .78)) : 0;
  const city = cityRoman(m.city), date = pmDate(m.sent_at);
  return `<div class="frank" style="width:${w||118}px">
    ${po ? `<div class="stamp"><img src="${esc(po.art_url)}" style="width:${w}px;height:${PO_H}px" alt=""></div>` : ''}
    ${pm ? pmHtml(pm, city, date) : ''}
  </div>`;
}
/* 소인 — 바탕은 그림, 글자는 여기서 얹는다. 자리는 표에 실측해 심어 두었다(0813).
   ⭐ 0813 저녁 소로 — 우표 오른쪽에 **꽝** 찍는다. 우표를 좀 가려도 좋다.
   ⚠ 물결형(anchor=full)은 테두리가 없어 잉크가 옅다. 크게 눕히고 왼쪽으로 물려
     우표를 가로지르게 해야 소인 노릇을 한다. */
function pmHtml(pm, city, date){
  const wave = (pm.anchor === 'full');
  /* ⚠⚠ 소인마다 그림 비율이 다르다(0.95 ~ 2.10). 정사각에 밀어 넣으면 찌그러진다. */
  const H = wave ? 74 : 108;
  const W = Math.round(H * Number(pm.ratio || 1));
  const cy = Number(pm.city_y ?? .35), dy = Number(pm.date_y ?? .64);
  const k  = H / 420;
  const cs = Math.max(9.5, Number(pm.city_sz ?? 26) * k * 1.95);
  const ds = Math.max(9,   Number(pm.date_sz ?? 22) * k * 1.95);
  const one = (cy === dy);
  /* ⭐⭐ 0813 저녁 소로 — 「소인이 무례하다. 살짝 걸치면 좋겠다」
     처음엔 우표를 통째로 덮었다. 우표 **오른쪽 바깥**으로 밀어
     왼쪽 귀퉁이만 물게 한다. 날짜는 종이 위에 나와 읽힌다.
     ⚠ 우표 폭이 제각각이라(0.58~1.47) 고정 픽셀로 밀면 우표마다 겹침이 달라진다 —
       그래서 소인 폭을 기준으로 민다. */
  const off  = Math.round(W * (wave ? 0.42 : 0.70));
  const pos  = wave ? `right:${-off}px; top:16px;` : `right:${-off}px; top:-6px;`;
  return `<div class="postmark" style="${pos} width:${W}px; height:${H}px;
            transform:rotate(${pm.rotate ?? -14}deg); color:${pm.ink}">
    <img src="${esc(pm.art_url)}" alt="">
    <span class="pm-t" style="top:${cy*100}%; font-size:${(one?ds:cs).toFixed(1)}px">${
      one ? `${esc(city)} · ${esc(date)}` : esc(city)}</span>
    ${one ? '' : `<span class="pm-t" style="top:${dy*100}%; font-size:${ds.toFixed(1)}px">${esc(date)}</span>`}
  </div>`;
}

// ── 편지 펼치기 ──────────────────────────────────────
async function openRead(i){
  open = rows[i]; if(!open) return;
  const mine = (tab === 'out');

  document.getElementById('r-frank').innerHTML = frankHtml(open);
  /* ⚠ 「집」이 아니라 「번가」다(0813 소로). 라탱지구는 메종 표에 없으므로 안 적는다 —
     없는 것을 지어내지 않는다. */
  document.getElementById('r-place').textContent =
    open.city ? `${cityKo(open.city)} ${open.maison_no}번가에서` : '';
  /* ⭐ 받는 이 이름은 창이 실어 온다(to_name). 세션에는 닉네임이 없어
     예전에는 「당신 님께」로 떨어졌다 — 셸이 짐작하면 안 되는 자리다. */
  document.getElementById('r-salute').textContent =
    `${mine ? open.who : (open.to_name || '—')} 님께,`;

  /* ⭐ 제목은 라벨이 아니라 본문 첫 줄로 들어앉는다(0813 소로) */
  const lead = open.subject ? `<span class="lead">${esc(open.subject)}</span>\n\n` : '';
  document.getElementById('r-body').innerHTML = lead + esc(open.body);
  document.getElementById('r-sign').textContent = mine ? (open.to_name || '—') : open.who;
  /* ⚠ 날짜는 서명 아래로 옮겼다. 여기서 또 적으면 한 편지에 두 번 나온다. */
  document.getElementById('r-note').textContent =
    [ open.edited_at ? '고쳐 쓴 편지' : '',
      mine ? (open.read_at ? '읽음' : '아직 안 읽었습니다') : '' ].filter(Boolean).join(' · ');
  document.getElementById('r-stamped').textContent = stampedAt(open.sent_at);

  document.getElementById('r-acts').innerHTML = actsHtml();
  document.getElementById('readModal').classList.add('show');
  document.body.classList.add('reading');
  document.querySelector('#readModal .letter-wrap').scrollTop = 0;
  /* ⭐⭐ 0813 소로 — 「편지만 단독으로 지구 위에」
     편지는 우편함 액자 **안**에서 뜬다. 그래서 아무리 막을 손봐도 뒤에 목록이 어른거리고
     액자의 막대도 안 걷힌다. 답은 막이 아니라 **액자를 접는 것**이다.
     ⚠ 지구가 못 들어도 편지는 그대로 뜬다 — 알림은 덤이지 조건이 아니다. */
  try{ window.parent?.postMessage({ eg:'letter-open' }, '*'); }catch(e){}

  /* 읽음은 펼치자마자 적는다. 실패해도 읽는 데는 지장이 없다. */
  if(tab === 'in' && !open.read_at){
    try{
      await sbFetch(`/rest/v1/messages?id=eq.${open.id}`,
        { method:'PATCH', headers:{ Prefer:'return=minimal' },
          body: JSON.stringify({ read_at: new Date().toISOString() }) });
      open.read_at = new Date().toISOString();
      paint();
      window.parent?.postMessage({ eg:'mail-read' }, '*');   /* 봉랍 내려가라 */
    }catch(e){ console.warn('[편지] 읽음 표시 실패:', e); }
  }
}

/* ⭐ 아래 구석의 작은 활자. 삭제는 읽는 화면에 두지 않는다 —
   읽자마자 버리는 일이 없도록, 버리기는 보관함과 보낸 함에만 있다(0813 소로). */
function actsHtml(){
  const out = inBundle ? `<button class="l-act" onclick="leaveBundle()">우편함으로</button>` : '';
  if(tab === 'in')  return `${out}<button class="l-act" onclick="replyMsg()">답장</button>
                            <button class="l-act" onclick="archiveMsg(true)">보관하기</button>`;
  if(tab === 'arc') return `<button class="l-act" onclick="replyMsg()">답장</button>
                            <button class="l-act" onclick="archiveMsg(false)">우편함으로</button>
                            <button class="l-act warn" onclick="removeMsg()">버리기</button>`;
  return `${open && !open.read_at ? '<button class="l-act" onclick="editMsg()">고쳐 쓰기</button>' : ''}
          <button class="l-act warn" onclick="removeMsg()">버리기</button>`;
}
function closeRead(){
  document.getElementById('readModal').classList.remove('show');
  document.body.classList.remove('reading');
  try{ window.parent?.postMessage({ eg:'letter-close' }, '*'); }catch(e){}
  /* 다발을 넘기는 중이면 다음 장. 다 넘겼으면 우편함이 남는다. */
  if(inBundle) setTimeout(()=>{ if(!nextInBundle()) toast('우편함입니다'); }, 240);
}
/* 다발을 내려놓고 목록으로 — 갇히지 않게 두는 문 */
function leaveBundle(){ BUNDLE = []; inBundle = false;
  document.body.classList.remove('bundling'); closeRead(); }

/* 보관하기 — 서랍에 넣는 것이지 태우는 것이 아니다. 보관함에서 언제든 되돌린다. */
async function archiveMsg(on){
  if(!open || busy) return;
  busy = true;
  try{
    await sbFetch(`/rest/v1/messages?id=eq.${open.id}`,
      { method:'PATCH', headers:{ Prefer:'return=minimal' },
        body: JSON.stringify({ archived_at: on ? new Date().toISOString() : null }) });
    closeRead(); toast(on ? '보관함에 넣어 두었습니다' : '우편함으로 되돌렸습니다');
    await load();
    window.parent?.postMessage({ eg:'mail-read' }, '*');
  }catch(e){ toast(on ? '보관하지 못했습니다' : '되돌리지 못했습니다'); console.warn(e); }
  busy = false;
}

async function removeMsg(){
  if(!open || busy) return;
  if(!confirm('이 편지를 버립니다.\n\n내 함에서만 사라지고, 상대의 편지는 그대로 남습니다.')) return;
  busy = true;
  const col = (tab === 'out') ? 'del_sender' : 'del_recip';
  try{
    await sbFetch(`/rest/v1/messages?id=eq.${open.id}`,
      { method:'PATCH', headers:{ Prefer:'return=minimal' },
        body: JSON.stringify({ [col]: new Date().toISOString() }) });
    closeRead(); toast('편지를 버렸습니다'); await load();
  }catch(e){ toast('버리지 못했습니다'); console.warn(e); }
  busy = false;
}

function replyMsg(){
  const to = open.who_id, who = open.who, subj = open.subject || '';
  closeRead();
  openCompose(to, who, subj ? (subj.startsWith('Re:') ? subj : 'Re: ' + subj) : '');
}

/* ── 우표 고르기 ──
   ⭐ 고르는 것은 보내는 사람이지만, 안 골라도 된다.
      우표 고르기가 의무가 되면 편지 쓰기가 무거워진다(0813 소로). */
let poPick = null;                 /* null = 저절로 붙는다 */
function paintPoPick(){
  const box = document.getElementById('w-po');
  if(!box) return;
  if(!POSTAGE || !POSTAGE.length){
    box.innerHTML = '<span style="font-size:11.5px;color:var(--ink-dim)">지금 발행 중인 우표가 없습니다.</span>';
    return;
  }
  box.innerHTML =
    `<div class="po-rand${poPick===null?' on':''}" onclick="setPo(null)">아무거나<br>붙여 주세요</div>` +
    POSTAGE.map(p => `<div class="po-one${poPick===p.code?' on':''}" onclick="setPo('${p.code}')"
        title="${esc(p.name)}${p.motto ? ' · ' + esc(p.motto) : ''}">
        <img src="${esc(p.art_url)}" alt=""></div>`).join('');
}
function setPo(c){ poPick = c; paintPoPick(); }

/* 소인은 손님이 안 고른다 — 우체국이 찍는 것이다 */
const randOf = a => (a && a.length) ? a[Math.floor(Math.random()*a.length)] : null;

/* 부치는 소리 — 편지가 실제로 들어간 뒤에만 운다.
   ⚠ 고쳐 쓰기에는 안 울린다. 그건 부치는 것이 아니라 고치는 것이다. */
function playSent(){
  try{
    const s = document.getElementById('sentSound');
    if(s){ s.volume = 0.45; s.currentTime = 0; s.play().catch(()=>{}); }
  }catch(e){}
}

/* 고쳐 쓰기 — 쓰기 모달을 그대로 쓰되 「고치는 중」으로 세운다 */
let editing = null;
function editMsg(){
  editing = open; closeRead();
  document.getElementById('w-eyebrow').textContent = '편지 고쳐 쓰기';
  document.getElementById('w-to').innerHTML = `<option>${esc(open.who)}</option>`;
  document.getElementById('w-to').disabled = true;
  document.getElementById('w-tonote').textContent = '상대가 아직 열어 보지 않았습니다.';
  document.getElementById('w-subj').value = open.subject || '';
  document.getElementById('w-body').value = open.body;
  countBody();
  /* ⚠ 우표는 부치는 순간 편지에 박힌다 — 고쳐 쓸 때도 못 바꾼다(지킴이가 막는다) */
  document.getElementById('w-porow').hidden = true;
  document.getElementById('writeModal').classList.add('show');
}

// ── 쓰기 ─────────────────────────────────────────────
let people = null;
async function openCompose(toId, toName, subj){
  editing = null; poPick = null;
  document.getElementById('w-porow').hidden = false;
  document.getElementById('w-eyebrow').textContent = '편지 쓰기';
  document.getElementById('w-to').disabled = false;
  document.getElementById('w-tonote').textContent = '한 번 스쳐 간 이들에게 쓸 수 있습니다.';
  document.getElementById('w-subj').value = subj || '';
  document.getElementById('w-body').value = '';
  countBody();
  document.getElementById('writeModal').classList.add('show');
  await loadStock(); paintPoPick();

  const sel = document.getElementById('w-to');
  if(!people){
    sel.innerHTML = `<option value="">불러오는 중…</option>`;
    try{ people = await sbFetch('/rest/v1/rpc/eg_writable_people', { method:'POST', body:'{}' }) || []; }
    catch(e){ people = []; console.warn(e); }
  }
  if(!people.length){
    sel.innerHTML = `<option value="">아직 편지를 보낼 수 있는 분이 없습니다</option>`;
    document.getElementById('w-tonote').textContent =
      '같은 책을 걸었거나, 서로의 방에 다녀갔거나, 같은 별의 콩파뇽이면 편지를 쓸 수 있습니다.';
    return;
  }
  sel.innerHTML = `<option value="">받는 이를 고르세요</option>` +
    people.map(p => `<option value="${p.id}"${toId === p.id ? ' selected' : ''}>${esc(p.nickname)} — ${esc(p.why)}</option>`).join('');
}
function closeCompose(){ document.getElementById('writeModal').classList.remove('show'); editing = null; }
function countBody(){
  document.getElementById('w-count').textContent = document.getElementById('w-body').value.length;
}
document.getElementById('w-body').addEventListener('input', countBody);

async function sendMsg(){
  if(busy) return;
  const body = document.getElementById('w-body').value.trim();
  const subj = document.getElementById('w-subj').value.trim();
  if(!body){ toast('편지를 적어 주세요'); return; }
  const btn = document.getElementById('w-send');
  busy = true; btn.disabled = true;

  try{
    if(editing){
      await sbFetch(`/rest/v1/messages?id=eq.${editing.id}`,
        { method:'PATCH', headers:{ Prefer:'return=minimal' },
          body: JSON.stringify({ body, subject: subj || null }) });
      toast('편지를 고쳐 두었습니다');
    }else{
      const to = document.getElementById('w-to').value;
      if(!to){ toast('받는 이를 고르세요'); busy = false; btn.disabled = false; return; }
      /* ⭐ 안 고르셨으면 그날 발행 중인 것 하나가 저절로 붙는다.
         소인은 언제나 우체국이 고른다 — 손님이 못 고른다. */
      const po = poPick || (randOf(POSTAGE) || {}).code || null;
      const pm = (randOf(POSTMARK) || {}).code || null;
      await sbFetch('/rest/v1/messages',
        { method:'POST', headers:{ Prefer:'return=minimal' },
          body: JSON.stringify({ sender_id: getUser().id, recipient_id: to,
                                 subject: subj || null, body,
                                 postage_code: po, postmark_code: pm }) });
      playSent();
      toast('우편함에 넣어 두었습니다');
    }
    closeCompose();
    if(tab === 'out' || editing) await load();
  }catch(e){
    /* 자격이 없으면 RLS가 막는다 — 날 오류 대신 사람 말로 답한다 */
    const m = String(e.message || '');
    toast(/row-level|policy|violates/i.test(m)
      ? '이분께는 아직 편지를 보낼 수 없습니다'
      : (/읽은 쪽지/.test(m) ? '이미 읽은 편지는 고칠 수 없습니다' : '보내지 못했습니다'));
    console.warn('[편지]', e);
  }
  busy = false; btn.disabled = false;
}

/* 모달 바깥을 눌러도 닫힌다 — 뒷문을 열어 두지 않는다(0808) */
document.getElementById('readModal').addEventListener('click', e => {
  if(e.target.id === 'readModal') closeRead();
});
document.getElementById('writeModal').addEventListener('click', e => {
  if(e.target.id === 'writeModal') closeCompose();
});

/* 바깥(자화상·지구)에서 「편지 쓰기」를 곧장 열 수 있게 열어 둔다 */
window.egMail = { reload: load, compose: openCompose };

/* 봉투에서 들어왔는가 — 주소가 한 번만 말해 준다 */
function cameFromEnvelope(){
  try{ return new URLSearchParams(location.search).get('unread') === '1'; }
  catch(e){ return false; }
}
/* 다발에서 다음 한 장. 없으면 거짓을 돌려주고 목록이 남는다. */
function nextInBundle(){
  while(BUNDLE.length){
    const id = BUNDLE.shift();
    const i = rows.findIndex(r => r.id === id);
    if(i >= 0){ inBundle = true; document.body.classList.add('bundling'); openRead(i); return true; }
  }
  inBundle = false; document.body.classList.remove('bundling'); return false;
}

BUNDLE_PENDING = cameFromEnvelope();
console.log('%c[EG] messages 0813i — 편지 펼치면 우편함이 접힌다 · 막대 셋 다 걷음', 'color:#c9a84c');
load();
</script>
</body>
