<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GALERIE · 비례 프로토타입 v1</title>
<style>
:root{
  /* ── 방 치수 (슬라이더로 조절) ── */
  --room-w: 1500px;    /* 가로 너비 */
  --room-h: 1300px;    /* 천장 높이 ← 핵심 (셸 원본 700) */
  --room-d: 1700px;    /* 깊이 */
  --half-w: 750px;
  --half-h: 650px;
  --half-d: 850px;
  --yaw: 0deg;
  --cam-z: -560px;     /* 카메라가 정면 벽에서 떨어진 거리 */
  --art-w: 300px;      /* 작품(액자 포함) 가로 — 슬라이더 */
  --moulding:#d4b878;
  --amber:#f0d8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1a0e12;overflow:hidden;
  font-family:'Cormorant Garamond','Noto Serif KR',serif;color:var(--amber);}
.stage{position:fixed;inset:0;overflow:hidden;}

/* ── 3D 무대 (셸 g1 기법) ── */
.scene{position:absolute;inset:0;perspective:1600px;perspective-origin:50% 48%;}
.world{position:absolute;top:50%;left:50%;width:0;height:0;
  transform-style:preserve-3d;
  transform:rotateY(calc(-1 * var(--yaw))) translate3d(0,0,calc(-1 * var(--cam-z)));
  transition:transform 1s cubic-bezier(.5,0,.2,1);}
.face{position:absolute;transform-style:preserve-3d;backface-visibility:hidden;overflow:hidden;}

.wall-front{width:var(--room-w);height:var(--room-h);
  margin-left:calc(var(--half-w)*-1);margin-top:calc(var(--half-h)*-1);
  transform:translateZ(calc(var(--half-d)*-1));
  background:
    radial-gradient(ellipse at center 32%, rgba(255,230,180,.20), transparent 62%),
    linear-gradient(180deg,#6a2230 0%,#7a2638 45%,#4a1822 100%);
  box-shadow:inset 0 0 120px rgba(0,0,0,.62);}
.wall-right{width:var(--room-d);height:var(--room-h);
  margin-left:calc(var(--half-d)*-1);margin-top:calc(var(--half-h)*-1);
  transform:rotateY(-90deg) translateZ(calc(var(--half-w)*-1));
  background:linear-gradient(270deg,rgba(0,0,0,.22),transparent 60%),linear-gradient(180deg,#5a1c28,#3a1418);
  box-shadow:inset 0 0 90px rgba(0,0,0,.5);}
.wall-left{width:var(--room-d);height:var(--room-h);
  margin-left:calc(var(--half-d)*-1);margin-top:calc(var(--half-h)*-1);
  transform:rotateY(90deg) translateZ(calc(var(--half-w)*-1));
  background:linear-gradient(90deg,rgba(255,220,170,.15),transparent 60%),linear-gradient(180deg,#6a2630,#4a1822);
  box-shadow:inset 0 0 90px rgba(0,0,0,.5);}
.ground{width:var(--room-w);height:var(--room-d);
  margin-left:calc(var(--half-w)*-1);margin-top:calc(var(--half-d)*-1);
  transform:rotateX(90deg) translateZ(calc(var(--half-h)*-1));
  background:repeating-linear-gradient(45deg,#5a3a24 0,#5a3a24 34px,#6a4a2c 34px,#6a4a2c 68px);}
.ceiling{width:var(--room-w);height:var(--room-d);
  margin-left:calc(var(--half-w)*-1);margin-top:calc(var(--half-d)*-1);
  transform:rotateX(-90deg) translateZ(calc(var(--half-h)*-1));
  background:radial-gradient(ellipse at center,rgba(212,184,120,.24),transparent 58%),#3a2618;}

/* 황금 몰딩 (벽 위·아래 띠) */
.wall-front::before,.wall-right::before,.wall-left::before,
.wall-front::after,.wall-right::after,.wall-left::after{
  content:'';position:absolute;left:0;right:0;height:7px;z-index:5;
  background:linear-gradient(90deg,#5a3a18,var(--moulding),#5a3a18);}
.wall-front::before,.wall-right::before,.wall-left::before{top:0;}
.wall-front::after,.wall-right::after,.wall-left::after{bottom:0;}

/* ── 작품 — 한 벽 2점 (셸 g1-hframed: 액자 합성 이미지 그대로) ── */
.art{position:absolute;top:50%;transform:translateY(-52%);
  width:var(--art-w);z-index:2;text-align:center;backface-visibility:hidden;}
.art img{display:block;width:100%;height:auto;margin:0 auto;
  filter:drop-shadow(6px 16px 26px rgba(0,0,0,.78));}
.plaque{display:inline-block;margin-top:14px;padding:6px 16px;
  background:linear-gradient(180deg,#efe6d0,#d8c9a8);
  border:1px solid rgba(90,58,24,.6);box-shadow:0 3px 10px rgba(0,0,0,.6);
  color:#3a2a18;line-height:1.35;}
.plaque .pt{font-size:14px;font-weight:600;letter-spacing:.5px;display:block;}
.plaque .pa{font-size:11px;font-style:italic;opacity:.75;letter-spacing:1px;}

/* 정면 벽 2점 배치: 좌·우 1/4 지점 */
.art-1{left:25%;margin-left:calc(var(--art-w)/-2);}
.art-2{left:75%;margin-left:calc(var(--art-w)/-2);}

/* ── 회전 버튼 ── */
.nav{position:fixed;top:50%;transform:translateY(-50%);
  width:56px;height:56px;border-radius:50%;border:1px solid rgba(212,184,120,.7);
  background:rgba(80,40,28,.78);color:var(--amber);font-size:28px;line-height:1;
  cursor:pointer;z-index:30;backdrop-filter:blur(8px);}
.nav-l{left:18px;} .nav-r{right:18px;}

/* 헤더 */
.hd{position:fixed;top:max(16px,env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:25;
  text-shadow:0 2px 14px rgba(0,0,0,.95);pointer-events:none;}
.hd .t{font-size:26px;letter-spacing:.32em;color:#e9cf9c;}
.hd .s{font-size:12px;letter-spacing:.3em;color:rgba(240,216,168,.6);margin-top:4px;}

/* 나침반(방 이름) */
.compass{position:fixed;bottom:max(118px,calc(env(safe-area-inset-bottom) + 118px));left:50%;transform:translateX(-50%);
  z-index:25;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.95);font-size:13px;letter-spacing:.25em;}
.compass .kr{display:block;margin-top:5px;font-size:11px;letter-spacing:.35em;color:rgba(240,216,168,.55);}

/* ── 튜닝 패널 ── */
.panel{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(20,10,14,.92);border-top:1px solid rgba(212,184,120,.35);
  padding:12px 16px max(12px,env(safe-area-inset-bottom));backdrop-filter:blur(10px);
  font-family:system-ui,'Noto Sans KR',sans-serif;}
.row{display:flex;align-items:center;gap:10px;margin:6px 0;}
.row label{flex:0 0 88px;font-size:12px;color:#d9c79e;letter-spacing:.04em;}
.row input[type=range]{flex:1;accent-color:#c9a84c;}
.row .val{flex:0 0 56px;text-align:right;font-size:12px;color:#f0d8a8;font-variant-numeric:tabular-nums;}
.hint{font-size:11px;color:rgba(240,216,168,.5);text-align:center;margin-top:4px;letter-spacing:.03em;}
</style>
</head>
<body>
<div class="stage">
  <div class="scene">
    <div class="world" id="world">
      <div class="face ceiling"></div>
      <div class="face ground"></div>
      <div class="face wall-right"></div>
      <div class="face wall-left"></div>
      <div class="face wall-front">
        <div class="art art-1">
          <img src="https://raw.githubusercontent.com/soro2026/eungyo-salon/main/htg_p003.webp" alt="수련">
          <div class="plaque"><span class="pt">수련</span><span class="pa">클로드 모네</span></div>
        </div>
        <div class="art art-2">
          <img src="https://raw.githubusercontent.com/soro2026/eungyo-salon/main/htg_p008.webp" alt="파라솔을 든 여인">
          <div class="plaque"><span class="pt">파라솔을 든 여인</span><span class="pa">클로드 모네</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="hd"><div class="t">GALERIE</div><div class="s">ÉTAGE I · 인상 · 후기인상</div></div>
  <div class="compass">N<span class="kr">정면 벽 · 2점</span></div>

  <button class="nav nav-l" onclick="turn(-90)">‹</button>
  <button class="nav nav-r" onclick="turn(90)">›</button>
</div>

<div class="panel">
  <div class="row"><label>천장 높이</label><input type="range" id="rh" min="700" max="1800" step="50" value="1300"><span class="val" id="rhv">1300</span></div>
  <div class="row"><label>작품 크기</label><input type="range" id="aw" min="200" max="460" step="10" value="300"><span class="val" id="awv">300</span></div>
  <div class="row"><label>물러서기</label><input type="range" id="cz" min="-900" max="-300" step="20" value="-560"><span class="val" id="czv">-560</span></div>
  <div class="hint">슬라이더로 비례를 맞춰보고, 마음에 드는 숫자 3개를 파이스에게 알려주세요</div>
</div>

<script>
const root=document.documentElement;
let yaw=0;
function turn(d){yaw+=d;document.getElementById('world').style.setProperty('--yaw',yaw+'deg');root.style.setProperty('--yaw',yaw+'deg');}
function bind(id,varName,valId,unit){
  const el=document.getElementById(id),out=document.getElementById(valId);
  el.addEventListener('input',()=>{
    root.style.setProperty(varName,el.value+'px');
    if(varName==='--room-h')root.style.setProperty('--half-h',(el.value/2)+'px');
    out.textContent=el.value;
  });
}
bind('rh','--room-h','rhv');
bind('aw','--art-w','awv');
bind('cz','--cam-z','czv');
</script>
</body>
</html>
