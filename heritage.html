<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EG헤리티지 — 경매장과 대여 서가</title>
<style>
/* ══════════════════════════════════════════════════
   EG HERITAGE v4.0 · Phase 1+ — 살롱 다섯 방 + 음반 가게 아홉 방
   "희소성은 소장에, 풍요는 길 위에 — 보물은 흐른다"
   설계도: EG헤리티지_종합설계도_v3_0_0606
   가독성 원칙: 글자 바닥선 12px · 투명도 0.3대 유령 글씨 폐기 · 웹폰트 실로드
   ══════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --wine:       #3a2222;   /* 배경 깊은 와인 레드 */
  --wine-deep:  #2b1818;
  --oak:        #2c2118;
  --gold:       #d4b35e;   /* 가독 골드 (구 #c9a84c보다 한 단계 밝게) */
  --gold-l:     #ecd08a;
  --gold-dim:   rgba(212,179,94,0.7);   /* 구 0.45 → 0.7 */
  --gold-faint: rgba(212,179,94,0.14);
  --cream:      #f4efe4;
  --txt-strong: rgba(244,239,228,0.97); /* 제목 */
  --txt:        rgba(244,239,228,0.88); /* 본문 */
  --txt-soft:   rgba(244,239,228,0.66); /* 보조 — 이 밑으로 내려가지 않음 */
  --warmgrey:   #c2b49e;
  --ink:        #221510;   /* 크림 아침 방의 글자색 */
  /* 베이지 크롬 (무대 바깥 페이지) */
  --page-top:   #efe6d2;
  --page-bot:   #e3d6ba;
  --ink-strong: #2a1d12;
  --ink-txt:    rgba(42,29,18,0.85);
  --ink-soft:   rgba(42,29,18,0.62);
  --gold-deep:  #8e6c1d;   /* 밝은 배경 위의 골드 */
}

html { height: 100%; }
body {
  font-family: 'Noto Serif KR', 'Apple SD Gothic Neo', Georgia, serif;
  font-size: 16px;
  background:
    radial-gradient(ellipse 130% 60% at 50% -10%, rgba(255,250,238,0.7), transparent 60%),
    linear-gradient(180deg, var(--page-top) 0%, var(--page-bot) 100%);
  background-attachment: fixed;
  color: var(--ink-txt);
  min-height: 100vh;
  position: relative;
  -webkit-font-smoothing: antialiased;
  letter-spacing: 0.01em;
}

/* ── 헤더 ───────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 100;
  padding: 8px 16px 0;
  background: rgba(239,230,210,0.93);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(142,108,29,0.25);
  box-shadow: 0 6px 24px rgba(60,42,18,0.12);
}
.hd-row { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.hd-back {
  background: none; border: 1px solid rgba(42,29,18,0.22);
  border-radius: 8px; color: var(--ink-soft);
  width: 32px; height: 32px; font-size: 15px; cursor: pointer;
  flex-shrink: 0; font-family: inherit; line-height: 1;
}
.hd-title { flex: 0 0 auto; display: flex; align-items: baseline; gap: 10px; }
.hd-eyebrow {
  font-size: 12px; letter-spacing: 0.22em; color: var(--gold-deep);
  text-transform: uppercase;
}
.hd-name { font-size: 16.5px; color: var(--ink-strong); letter-spacing: 0.05em; font-weight: 600; white-space: nowrap; }
.hd-name .amp { color: var(--gold-deep); font-style: italic; font-size: 13px; }
.hd-badge {
  font-size: 12px; color: rgba(42,29,18,0.5);
  letter-spacing: 0.08em; text-align: right; line-height: 1.5; flex-shrink: 0;
}

/* ── 주간 리듬 한 줄 ─────────────────────── */
.rhythm {
  margin: 6px -16px 0;
  padding: 5px 16px 7px;
  border-top: 1px solid rgba(42,29,18,0.1);
  font-size: 12px; color: var(--ink-soft);
  letter-spacing: 0.03em; text-align: center; line-height: 1.6;
}
.rhythm b { color: var(--gold-deep); font-weight: 600; }

/* ── 메인 3탭 ────────────────────────────── */
.main-tabs {
  display: flex; flex: 1 1 auto; min-width: 300px;
  justify-content: center; gap: 6px;
  margin: 0;
}
.main-tab {
  flex: 0 1 auto; padding: 7px 13px 8px;
  background: none; border: none;
  border-bottom: 2px solid transparent;
  color: rgba(42,29,18,0.58);
  font-size: 13.5px; letter-spacing: 0.03em;
  cursor: pointer; font-family: inherit;
  transition: color 0.25s, border-color 0.25s;
}
.main-tab.active { color: var(--gold-deep); border-bottom-color: var(--gold-deep); font-weight: 600; }

/* ── Salle 네비 ──────────────────────────── */
.salle-nav {
  display: flex; gap: 8px;
  justify-content: center; align-items: center;
  padding: 16px 16px 0;
  flex-wrap: wrap;
}
.salle-tab {
  padding: 9px 15px;
  background: rgba(22,12,9,0.52);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(212,179,94,0.22);
  border-radius: 22px;
  color: rgba(244,239,228,0.75);
  font-family: inherit; cursor: pointer;
  transition: all 0.25s;
  text-align: center;
  line-height: 1;
}
.salle-tab .num { font-size: 15px; letter-spacing: 0.08em; }
.salle-tab .nm  { display: none; font-size: 13px; letter-spacing: 0.03em; }
.salle-tab.active {
  background: rgba(234,217,174,0.95);
  border-color: rgba(140,105,40,0.6);
  color: #5e430c;
  font-weight: 600;
  padding: 9px 18px;
}
.salle-tab.active .nm { display: inline; margin-left: 7px; }

/* ── 무대 (Salle 방별 테마) ───────────────── */
.stage-wrap { padding: 12px 16px 40px; }
.stage {
  position: relative;
  min-height: 60vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 18px 18px 26px;
  animation: stageIn 0.45s ease;
}
@keyframes stageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ── 풀스크린 무대: 화면 전체가 방 (Ⅳ↔bg05, Ⅴ↔bg04 교차) ──
   두 레이어 크로스페이드 · 살롱 탭에서만 표시 */
#salon-backdrop { position: absolute; top: 0; left: 0; right: 0; height: 100%; z-index: -1; transition: opacity 0.4s ease; }
#salon-backdrop .bd {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  background-repeat: no-repeat;
  opacity: 0; transition: opacity 0.7s ease;
}
/* 가로 화면: 무대 전체를 페이지에 펼친다 — 첫 화면은 방 중앙부, 스크롤 끝은 마루 끝 (이미지 비율 1:1.25) */
@media (min-aspect-ratio: 4/5) {
  body.mode-salon { min-height: calc((125vw + 100vh) / 2); }
  #salon-backdrop .bd {
    background-size: 100% auto;
    background-position: center min(0px, calc((100vh - 125vw) / 2));
  }
}

/* ── 음반 가게: 고정 홀 (16:9 cover · 본문만 그 위로 흐름) ── */
#record-backdrop {
  position: fixed; inset: 0; z-index: -1;
  opacity: 0; transition: opacity 0.4s ease;
  pointer-events: none;
}
#record-backdrop.on { opacity: 1; }
#record-backdrop .bd {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  background-repeat: no-repeat;
  opacity: 0; transition: opacity 0.7s ease;
}

/* LP 재킷 — 1254px 정사각 원본, 슬리브 그림자 */
.jacket {
  width: min(76vw, 340px); aspect-ratio: 1 / 1;
  display: block; cursor: pointer;
  border-radius: 3px;
  box-shadow: 0 22px 44px rgba(0,0,0,0.62), 0 5px 12px rgba(0,0,0,0.4);
  animation: artIn 0.6s ease;
}
.rent-line { margin-top: 14px; font-size: 13.5px; letter-spacing: 0.05em; color: var(--gold-l); }

.artwork {
  max-width: 90%; max-height: 50vh;
  width: auto; height: auto;
  display: block;
  filter: drop-shadow(0 18px 30px rgba(0,0,0,0.6)) drop-shadow(0 4px 8px rgba(0,0,0,0.38));
  animation: artIn 0.6s ease;
}
@keyframes artIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: none; } }

/* 명판(플라크) — 반투명 다크 받침, 모든 방 공통 */
.plaque {
  margin-top: 20px;
  text-align: center;
  max-width: 380px;
  background: rgba(22,12,9,0.62);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(212,179,94,0.22);
  border-radius: 14px;
  padding: 16px 24px 18px;
}
.stage .void-line { color: var(--txt); }
.stage .void-sub  { color: var(--txt-soft); }
.stage .void-mark { color: var(--gold-dim); }
.stage .void { background: rgba(22,12,9,0.55); backdrop-filter: blur(8px); border-radius: 16px; min-height: 38vh; padding: 36px 30px; }
.plaque-name { font-size: 21px; font-weight: 600; color: var(--txt-strong); letter-spacing: 0.03em; line-height: 1.4; }
.plaque-artist { font-size: 14px; color: var(--gold-l); font-style: italic; margin-top: 7px; }
.plaque-meta { font-size: 13px; color: var(--txt-soft); letter-spacing: 0.03em; margin-top: 5px; }

.love-line {
  margin-top: 16px;
  font-size: 13.5px; letter-spacing: 0.04em;
  color: var(--txt-soft);
}
.love-line b { color: var(--gold-l); font-weight: 600; }

/* 카드 버튼 줄 */
.card-actions {
  margin-top: 18px;
  display: flex; gap: 10px;
  width: 100%; max-width: 340px;
}
.btn-layers {
  flex: 1;
  padding: 12px 8px;
  background: rgba(22,12,9,0.6);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(244,239,228,0.3);
  border-radius: 12px;
  color: var(--txt);
  font-size: 14px; letter-spacing: 0.04em;
  cursor: pointer; font-family: inherit;
}
.btn-apply {
  flex: 1.4;
  padding: 12px 8px;
  background: linear-gradient(135deg, rgba(201,168,76,0.42), rgba(201,168,76,0.16)), rgba(22,12,9,0.6);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(212,179,94,0.6);
  border-radius: 12px;
  color: var(--gold-l);
  font-size: 15px; font-weight: 600; letter-spacing: 0.05em;
  cursor: pointer; font-family: inherit;
}

/* ── 우아한 비움 ─────────────────────────── */
.void {
  min-height: 50vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 40px 28px;
  animation: stageIn 0.45s ease;
}
.void-mark { font-size: 26px; color: var(--gold-deep); margin-bottom: 18px; }
.void-line { font-size: 16.5px; color: var(--ink-txt); line-height: 1.9; letter-spacing: 0.03em; }
.void-sub  { font-size: 13px; color: var(--ink-soft); margin-top: 14px; letter-spacing: 0.04em; line-height: 1.9; }

/* ── 응모 패널 / 모달 공통 ────────────────── */
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes flowerIn { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }

.sheet-overlay {
  position: fixed; inset: 0; z-index: 600;
  background-color: #1a0e0a;              /* 이미지 미도착·무대 아래 폴백 */
  background-size: 100% auto;
  background-position: center top;
  background-repeat: no-repeat;
  background-attachment: local;            /* 배경이 내용과 함께 스크롤 */
  overflow-y: auto;
  scrollbar-width: none;
  animation: overlayIn 0.25s ease;
}
.sheet-overlay::-webkit-scrollbar { display: none; }
.sheet {
  width: 100%; max-width: 480px;
  margin: 14vh auto 0;
  min-height: 86vh;
  background: #241614;
  border-radius: 20px 20px 0 0;
  border-top: 1px solid rgba(212,179,94,0.35);
  box-shadow: 0 -16px 70px rgba(0,0,0,0.6);
  padding: 26px 26px 46px;
  animation: sheetUp 0.32s cubic-bezier(0.34,1.56,0.64,1);
}
.sheet-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: rgba(201,168,76,0.25);
  margin: 0 auto 22px;
}
.sheet-eyebrow { font-size: 12px; letter-spacing: 0.2em; color: var(--gold-dim); margin-bottom: 7px; text-transform: uppercase; }
.sheet-title { font-size: 20px; font-weight: 600; color: var(--txt-strong); margin-bottom: 6px; line-height: 1.35; }
.sheet-sub { font-size: 13.5px; color: var(--txt-soft); margin-bottom: 22px; }

/* 4겹 모달 본문 */
.layer-block { margin-bottom: 20px; }
.layer-tag {
  font-size: 12.5px; letter-spacing: 0.18em; color: var(--gold-dim);
  text-transform: uppercase; margin-bottom: 7px;
}
.layer-text { font-size: 15.5px; color: var(--txt); line-height: 1.95; letter-spacing: 0.01em; }
.layer-divider { height: 1px; margin: 22px 0; background: linear-gradient(90deg, transparent, rgba(201,168,76,0.18), transparent); }

/* 공통 버튼 */
.sheet-btn {
  width: 100%; padding: 14px;
  border-radius: 12px;
  font-size: 14.5px; letter-spacing: 0.05em;
  cursor: pointer; font-family: inherit;
  margin-top: 10px;
}
.sheet-btn.gold {
  background: linear-gradient(135deg, rgba(212,179,94,0.35), rgba(212,179,94,0.14));
  border: 1px solid rgba(212,179,94,0.55);
  color: var(--gold-l);
  font-weight: 600;
}
.sheet-btn.ghost {
  background: rgba(244,239,228,0.06);
  border: 1px solid rgba(244,239,228,0.18);
  color: rgba(244,239,228,0.72);
}
.sheet-btn.quiet {
  background: none;
  border: 1px solid rgba(244,239,228,0.14);
  color: rgba(244,239,228,0.55);
  font-size: 13px; padding: 12px;
}
.sheet-btn:disabled { opacity: 0.5; cursor: default; }

/* 응모 현황 박스 */
.stat-row { display: flex; gap: 10px; margin-bottom: 20px; }
.stat-box {
  flex: 1;
  background: rgba(201,168,76,0.07);
  border: 1px solid rgba(201,168,76,0.15);
  border-radius: 10px;
  padding: 13px 8px;
  text-align: center;
}
.stat-num { font-size: 26px; color: var(--gold-l); }
.stat-num small { font-size: 15px; color: var(--gold-dim); }
.stat-lbl { font-size: 12px; color: var(--txt-soft); letter-spacing: 0.04em; margin-top: 4px; }

.confession {
  background: rgba(201,168,76,0.05);
  border: 1px solid rgba(201,168,76,0.12);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 18px;
  font-size: 13.5px; color: var(--txt-soft);
  line-height: 1.9; letter-spacing: 0.02em;
  text-align: center;
}
.confession b { color: var(--gold-l); font-weight: 600; }

.ticket-list-tag { font-size: 12px; letter-spacing: 0.16em; color: var(--gold-dim); margin-bottom: 10px; }
.ticket-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px;
  background: rgba(20,10,8,0.4);
  border: 1px solid rgba(201,168,76,0.1);
  border-radius: 6px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: border-color 0.25s ease, background 0.25s ease;
}
.ticket-row:hover { border-color: rgba(201,168,76,0.45); background: rgba(30,16,12,0.55); }
.ticket-go { color: var(--gold-dim); font-size: 14px; margin-left: 6px; }
.ticket-code { font-family: 'Courier New', monospace; font-size: 13.5px; color: var(--gold-l); letter-spacing: 0.05em; }
.ticket-date { font-size: 12px; color: var(--txt-soft); }

.notice {
  font-size: 13.5px; color: rgba(244,239,228,0.72);
  line-height: 2.0; margin: 18px 0;
  letter-spacing: 0.02em;
}

/* 티켓 카드 */
.ticket-card {
  background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(140,100,20,0.1));
  border: 1px solid rgba(201,168,76,0.4);
  border-radius: 12px;
  padding: 26px 22px;
  margin-bottom: 22px;
  position: relative; overflow: hidden;
  text-align: center;
}
.ticket-hole { position: absolute; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; background: #241614; border-radius: 50%; border: 1px solid rgba(201,168,76,0.2); }
.ticket-hole.l { left: -10px; } .ticket-hole.r { right: -10px; }
.ticket-dash { border-top: 1px dashed rgba(201,168,76,0.2); margin: 16px 0; }
.ticket-big-code { font-family: 'Courier New', monospace; font-size: 17px; color: var(--gold); letter-spacing: 0.08em; font-weight: bold; word-break: break-all; line-height: 1.6; }
.ticket-img { width: 100%; display: block; border-radius: 12px; box-shadow: 0 14px 34px rgba(0,0,0,0.45); opacity: 0; transition: opacity 0.6s ease; }

/* 토스트 */
.toast {
  position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%);
  background: rgba(36,22,20,0.96);
  border: 1px solid rgba(201,168,76,0.3);
  color: var(--cream);
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 14.5px; letter-spacing: 0.04em;
  z-index: 800;
  animation: overlayIn 0.25s ease;
  white-space: nowrap;
}

/* ── 탭 ③ 카탈로그 레조네 — 종이와 잉크 ──── */
.cat-wrap { max-width: 720px; margin: 0 auto; padding: 18px 18px 90px; }
.cat-nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 22px; }
.cat-chip {
  border: 1px solid rgba(42,29,18,0.3); background: transparent;
  color: var(--ink-txt); font-family: inherit; font-size: 13.5px;
  padding: 7px 14px; border-radius: 18px; cursor: pointer; letter-spacing: 0.03em;
}
.cat-chip.active { background: var(--ink-strong); color: #f2ead8; border-color: var(--ink-strong); }
.cat-sel {
  border: 1px solid rgba(42,29,18,0.3); background: transparent; color: var(--ink-txt);
  font-family: inherit; font-size: 13px; padding: 7px 10px; border-radius: 18px;
}
.cat-chapter { margin-bottom: 42px; }
.cat-chapter-head {
  font-size: 12px; letter-spacing: 0.26em; text-transform: uppercase;
  color: var(--gold-deep); border-bottom: 1px solid rgba(42,29,18,0.25);
  padding-bottom: 8px;
}
.cat-week-line { font-size: 13px; color: var(--ink-soft); margin: 8px 0 14px; font-style: italic; }
.cat-card {
  display: flex; gap: 16px; padding: 16px 2px;
  border-bottom: 1px dotted rgba(42,29,18,0.22); cursor: pointer;
}
.cat-card:hover { background: rgba(42,29,18,0.04); }
.cat-thumb {
  width: 86px; min-width: 86px; max-height: 112px; object-fit: contain; align-self: flex-start;
  filter: drop-shadow(0 4px 10px rgba(42,29,18,0.28));
}
.cat-fig { font-size: 11px; letter-spacing: 0.2em; color: var(--gold-deep); margin-bottom: 3px; }
.cat-title { font-size: 16.5px; font-weight: 600; color: var(--ink-strong); line-height: 1.4; }
.cat-artist { font-size: 13px; color: var(--ink-soft); margin: 2px 0 8px; }
.cat-plaque { font-size: 13.5px; color: var(--ink-txt); font-style: italic; }
.cat-status { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; letter-spacing: 0.02em; }
.cat-rec-row { display: flex; gap: 14px; align-items: center; padding: 12px 2px;
  border-bottom: 1px dotted rgba(42,29,18,0.22); cursor: pointer; }
.cat-rec-row:hover { background: rgba(42,29,18,0.04); }
.cat-rec-thumb { width: 58px; min-width: 58px; height: 58px; object-fit: cover;
  border-radius: 4px; box-shadow: 0 3px 8px rgba(42,29,18,0.3); }
/* 작품 무대 막 내부 */
.catw-img { width: 100%; max-height: 46vh; object-fit: contain; display: block; margin: 4px auto 16px;
  filter: drop-shadow(0 16px 30px rgba(0,0,0,0.5)); }
.catw-plaque { text-align: center; font-size: 14px; color: var(--gold); font-style: italic; margin-bottom: 16px; }
.catw-sec { font-size: 11.5px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--gold-dim); margin: 18px 0 8px; }
.catw-line { font-size: 13.5px; color: var(--txt); padding: 5px 0;
  border-bottom: 1px dashed rgba(201,168,76,0.16); line-height: 1.55; }

// ── Supabase 설정 ─────────────────────────
const SUPABASE_URL = 'https://cyhlotwdisjvoxvfkpnd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';

// ── 토큰 수명 관리 (0607 낮 수술) ──────────
// 증상: 로그인 1시간 뒤 access_token 만료 → 만료 토큰으로 요청 → 전부 401 → 살롱·가게가 텅 빔.
// 처방: 만료 임박이면 refresh_token으로 조용히 갱신, 갱신 불가면 익명 키 폴백(공개 읽기는 계속 산다).
let _refreshing = null; // 동시 요청 단일화 — 갱신은 한 번만

function getSession() {
  try { return JSON.parse(localStorage.getItem('eungyo-auth')); }
  catch { return null; }
}

function tokenExp(tok) { // JWT 만료 시각(초) — 저장 형태와 무관하게 토큰 자체에서 읽음
  try { return JSON.parse(atob(tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp || 0; }
  catch { return 0; }
}

async function getValidToken() {
  const s = getSession();
  if (!s?.access_token) return null;
  const now = Math.floor(Date.now() / 1000);
  if (tokenExp(s.access_token) - now > 60) return s.access_token; // 아직 신선
  if (!s.refresh_token) return null;
  _refreshing = _refreshing || (async () => {
    try {
      const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: s.refresh_token })
      });
      if (!r.ok) return null;
      const data = await r.json();
      if (!data.expires_at) data.expires_at = Math.floor(Date.now() / 1000) + (data.expires_in || 3600);
      localStorage.setItem('eungyo-auth', JSON.stringify(data)); // supabase-js 세션 형태 그대로
      return data.access_token || null;
    } catch (e) { return null; }
  })();
  const tok = await _refreshing;
  _refreshing = null;
  return tok;
}

async function sbFetch(path, options = {}) {
  const token = await getValidToken();
  const res = await fetch(SUPABASE_URL + path, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + (token || SUPABASE_KEY),
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...options.headers
    }
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.message || res.statusText); }
  return res.status === 204 ? null : res.json();
}
function getUser() {
  try { const s = JSON.parse(localStorage.getItem('eungyo-auth')); return s?.user || null; }
  catch { return null; }
}

// ISO 주차 (DB 함수 TO_CHAR IYYY-"W"IW 와 정합)
function getWkId(d = new Date()) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  const wk = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  return `${date.getUTCFullYear()}-W${String(wk).padStart(2, '0')}`;
}

  const src = item.liner_note || item.library;

        <div class="layer-text">${escapeHtml(typeof t === 'string' ? t : JSON.stringify(t))}</div>

// ISO 주차 → 그 주 월요일 (UTC)
function wkMonday(wk) {
  const [y, w] = wk.split('-W').map(Number);
  const jan4 = new Date(Date.UTC(y, 0, 4));
  const day = jan4.getUTCDay() || 7;
  const mon1 = new Date(jan4); mon1.setUTCDate(jan4.getUTCDate() - day + 1);
  const d = new Date(mon1); d.setUTCDate(mon1.getUTCDate() + (w - 1) * 7);
  return d;
}
const NTH_KO = ['첫째', '둘째', '셋째', '넷째', '다섯째'];
function wkLabel(wk) {
  try {
    const m = wkMonday(wk);
    const nth = NTH_KO[Math.min(4, Math.floor((m.getUTCDate() - 1) / 7))];
    return `${m.getUTCFullYear()}년 ${m.getUTCMonth() + 1}월 ${nth} 주`;
  } catch { return wk; }
}
function fmtMD(s) { const d = new Date(s); return `${d.getMonth() + 1}월 ${d.getDate()}일`; }
function catFee(n) { return n <= 4 ? 5 : n <= 12 ? 3 : n <= 24 ? 2 : 1; }

async function ensureCatalog() {
  if (CAT_LOADED) return;
  CAT_LOADED = true;
  try {
    const [allItems, born] = await Promise.all([
      sbFetch(`/rest/v1/heritage_items?select=id,wk_id,category`),
      sbFetch(`/rest/v1/heritage_editions?select=born_week`)
    ]);
    const bornWeeks = new Set((born || []).map(e => e.born_week));
    const weeks = new Set();
    for (const it of (allItems || [])) {
      if (it.category === 'visual' && bornWeeks.has(it.wk_id)) weeks.add(it.wk_id);   // 추첨을 통과한 주만
      if (it.category === 'record' && it.id.startsWith('htg_m')) weeks.add(it.wk_id); // 정식 신보만
    }
    CAT_WEEKS = [...weeks].sort().reverse();
    CAT_WK = CAT_WEEKS[0] || getWkId();
    await loadCatWeek(CAT_WK);
  } catch (e) { console.warn('카탈로그 로드 실패:', e); }
  renderCatNav();
  renderCatalog();
}

async function loadCatWeek(wk) {
  const items = await sbFetch(`/rest/v1/heritage_items?wk_id=eq.${wk}&select=*&order=salle_no.asc`) || [];
  CAT_VISUALS = items.filter(i => i.category === 'visual');
  CAT_RECORDS = items.filter(i => i.category === 'record' && i.id.startsWith('htg_m'));
  CAT_EDITIONS = []; CAT_RENTALS = []; CAT_WAIT = [];
  if (CAT_VISUALS.length) {
    const ids = CAT_VISUALS.map(i => i.id).join(',');
    [CAT_EDITIONS, CAT_RENTALS, CAT_WAIT] = await Promise.all([
      sbFetch(`/rest/v1/heritage_editions?item_id=in.(${ids})&select=*&order=edition_no.asc`),
      sbFetch(`/rest/v1/heritage_rentals?item_id=in.(${ids})&select=*&order=starts_at.asc`),
      sbFetch(`/rest/v1/heritage_waitlist?item_id=in.(${ids})&select=item_id,user_id,queued_at,notified_at&order=queued_at.asc`)
    ]).then(r => r.map(x => x || []));
  }
}

async function selectCatWeek(wk) {
  CAT_WK = wk;
  document.getElementById('cat-host').innerHTML =
    `<div class="void"><div class="void-mark">📚</div><div class="void-line">페이지를 넘기는 중입니다…</div></div>`;
  try { await loadCatWeek(wk); } catch (e) { console.warn(e); }
  renderCatNav();
  renderCatalog();
}

// 3계층 네비 — 칩 2개(이번 주·지난 주) + 먼 과거 서랍
function renderCatNav() {
  const nav = document.getElementById('cat-nav');
  if (!nav) return;
  const thisWk = getWkId();
  const chips = CAT_WEEKS.slice(0, 2).map((wk, idx) => {
    const name = wk === thisWk ? '이번 주' : (idx === 0 ? wkLabel(wk) : '지난 주');
    return `<button class="cat-chip ${wk === CAT_WK ? 'active' : ''}" onclick="selectCatWeek('${wk}')">${name}</button>`;
  });
  const older = CAT_WEEKS.slice(2);
  const sel = older.length
    ? `<select class="cat-sel" onchange="if(this.value)selectCatWeek(this.value)">
         <option value="">지난 달 · 지난 해 ▾</option>
         ${older.map(wk => `<option value="${wk}" ${wk === CAT_WK ? 'selected' : ''}>${wkLabel(wk)}</option>`).join('')}
       </select>` : '';
  nav.innerHTML = chips.join('') + sel;
}

function edsOf(id)   { return CAT_EDITIONS.filter(e => e.item_id === id); }
function rentsOf(id) { return CAT_RENTALS.filter(r => r.item_id === id); }
function queueOf(id) { return CAT_WAIT.filter(w => w.item_id === id); }

function catPlaque(it, eds) {
  if (!eds.length) return '이 주에는 부(部)가 태어나지 않았습니다';
  if (eds.length === 1 && eds[0].status === 'permanent') return '영원한 1부 — 유일본';
  return `한정 ${eds.length}부 — 그 주, ${eds.length}명이 이 그림을 사랑했습니다`;
}

function catStatusLine(it, eds) {
  if (!eds.length) return '';
  const parts = [];
  const perm  = eds.filter(e => e.status === 'permanent').length;
  const out   = eds.filter(e => e.status === 'out').length;
  const shelf = eds.filter(e => e.status === 'shelf').length;
  const q     = queueOf(it.id).length;
  if (perm)  parts.push(`✦ 영구 소장 ${perm}`);
  if (out)   parts.push(`나들이 중 ${out}`);
  if (shelf) parts.push(`서가 ${shelf}`);
  if (q)     parts.push(`줄 ${q}`);
  return parts.join(' · ');
}

function renderCatalog() {
  const host = document.getElementById('cat-host');
  if (!host) return;
  if (!CAT_VISUALS.length && !CAT_RECORDS.length) {
    host.innerHTML = `<div class="void"><div class="void-mark">📚</div>
      <div class="void-line">아직 흐른 보물이 없습니다.</div>
      <div class="void-sub">첫 추첨이 끝나면, 첫 페이지가 제본됩니다.</div></div>`;
    return;
  }
  let html = '';
  if (CAT_VISUALS.length) {
    html += `<div class="cat-chapter">
      <div class="cat-chapter-head">Chapitre Ⅰ · Peintures — 그림</div>
      <div class="cat-week-line">${wkLabel(CAT_WK)}의 살롱에서</div>`;
    for (const it of CAT_VISUALS) html += catVisualCard(it);
    html += `</div>`;
  }
  if (CAT_RECORDS.length) {
    html += `<div class="cat-chapter">
      <div class="cat-chapter-head">Chapitre Ⅱ · Disques — 음반</div>
      <div class="cat-week-line">${wkLabel(CAT_WK)}의 신보 — 카탈로그는 닫히지 않습니다</div>`;
    for (const it of CAT_RECORDS) html += catRecordRow(it);
    html += `</div>`;
  }
  host.innerHTML = html;
}

function catVisualCard(it) {
  const eds = edsOf(it.id);
  const ROMAN = ['', 'Ⅰ', 'Ⅱ', 'Ⅲ', 'Ⅳ', 'Ⅴ'];
  return `
    <div class="cat-card" onclick="openCatWork('${it.id}')">
      <img class="cat-thumb" src="${it.img}" alt="" onerror="this.style.display='none'">
      <div>
        <div class="cat-fig">FIG.${it.salle_no || '·'} — SALLE ${ROMAN[it.salle_no] || ''}</div>
        <div class="cat-title">${escapeHtml(it.name)}</div>
        <div class="cat-artist">${escapeHtml(it.artist)}${it.period ? ' · ' + escapeHtml(it.period) : ''}</div>
        <div class="cat-plaque">${catPlaque(it, eds)}</div>
        <div class="cat-status">${catStatusLine(it, eds)}</div>
      </div>
    </div>`;
}

function catRecordRow(it) {
  return `
    <div class="cat-rec-row" onclick="openLiner('${it.id}')">
      <img class="cat-rec-thumb" src="${it.img}" alt="" onerror="this.style.display='none'">
      <div>
        <div class="cat-title" style="font-size:15px">${escapeHtml(it.name)}</div>
        <div class="cat-artist">${escapeHtml(it.artist)}${it.origin ? ' · ' + escapeHtml(it.origin) : ''}</div>
      </div>
    </div>`;
}

// ── 작품 무대 막: 종이가 무대로 열림 ──────
function openCatWork(itemId) {
  const it = CAT_VISUALS.find(i => i.id === itemId);
  if (!it) return;
  const eds  = edsOf(itemId);
  const open = rentsOf(itemId).filter(r => !r.returned_at);
  const q    = queueOf(itemId);
  const user = getUser();
  const fee  = catFee(eds.length);

  const lines = eds.map(e => {
    if (e.status === 'permanent')
      return `<div class="catw-line">✦ 제1부 — <b>영구 소장</b> · ${escapeHtml(it.winner_nick || '콩파뇽')}의 분더카머</div>`;
    if (e.status === 'out') {
      const r = open.find(o => o.edition_id === e.id);
      return `<div class="catw-line">제${e.edition_no}부 — ${r
        ? escapeHtml(r.nickname || '콩파뇽') + '의 집에서 · <b>' + fmtMD(r.due_at) + ' 귀가</b>'
        : '나들이 중'}</div>`;
    }
    return `<div class="catw-line">제${e.edition_no}부 — 서가에서 기다립니다</div>`;
  }).join('') || `<div class="catw-line dim">이 주에는 부가 태어나지 않았습니다</div>`;

  const SRC_KO = { prize: '추첨의 부상', shelf: '서가에서', renewal: '한 계절 더', welcome: '환대' };
  const logs = rentsOf(itemId).map(r =>
    `<div class="catw-line"><b>${escapeHtml(r.nickname || '콩파뇽')}</b>
       <span class="dim">· ${fmtMD(r.starts_at)} ~ ${r.returned_at ? fmtMD(r.returned_at) : '지금'} · ${SRC_KO[r.source] || r.source}</span></div>`
  ).join('') || `<div class="catw-line dim">아직 여행이 시작되지 않았습니다</div>`;

  const shelf = eds.filter(e => e.status === 'shelf').length;
  let btn = '';
  if (eds.length) {
    if (user && (eds.some(e => e.permanent_owner === user.id) || open.some(o => o.user_id === user.id)))
      btn = `<button class="sheet-btn quiet" disabled>지금 당신의 분더카머에 있습니다 ✦</button>`;
    else if (user && q.some(w => w.user_id === user.id && w.notified_at))
      btn = `<button class="sheet-btn gold" onclick="rpcRentShelf('${itemId}')">초대장이 도착했습니다 — 🍎 ${fee}알 · 6주</button>`;
    else if (user && q.some(w => w.user_id === user.id))
      btn = `<button class="sheet-btn quiet" disabled>줄을 서는 중입니다 — ${q.findIndex(w => w.user_id === user.id) + 1}번째</button>`;
    else if (shelf > 0 && q.length === 0)
      btn = user
        ? `<button class="sheet-btn gold" onclick="rpcRentShelf('${itemId}')">🍎 ${fee}알 · 6주 빌리기</button>`
        : `<button class="sheet-btn quiet" disabled>입장 후 빌릴 수 있습니다</button>`;
    else
      btn = user
        ? `<button class="sheet-btn ghost" onclick="rpcJoinWaitlist('${itemId}')">대기열 줄서기 (앞에 ${q.length}명)</button>`
        : `<button class="sheet-btn quiet" disabled>입장 후 줄을 설 수 있습니다</button>`;
  }

  const panel = document.createElement('div');
  panel.id = 'cat-panel';
  panel.innerHTML = `
    <div class="sheet-overlay" style="background:rgba(22,13,9,0.9);" onclick="if(event.target===this)closeCatWork()">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-eyebrow">Catalogue Raisonné · ${wkLabel(CAT_WK)}</div>
        <div class="sheet-title">${escapeHtml(it.name)}</div>
        <div class="sheet-sub">${escapeHtml(it.artist)}${it.period ? ' · ' + escapeHtml(it.period) : ''}</div>
        <img class="catw-img" src="${it.img}" alt="" onerror="this.style.display='none'">
        <div class="catw-plaque">${catPlaque(it, eds)}</div>
        <div class="catw-sec">Provenance · 부별 현황</div>
        ${lines}
        <div class="catw-sec">Journal de Voyage · 여행 일지</div>
        ${logs}
        <div style="height:14px"></div>
        ${btn}
        <button class="sheet-btn quiet" onclick="closeCatWork()">닫기</button>
      </div>
    </div>`;
  document.body.appendChild(panel);
  document.body.style.overflow = 'hidden';
}
function closeCatWork() {
  const p = document.getElementById('cat-panel'); if (p) p.remove();
  document.body.style.overflow = '';
}

// ── 서가 손잡이 RPC ────────────────────────
async function rpcRentShelf(itemId) {
  const user = getUser();
  if (!user) { showToast('입장 후 빌릴 수 있습니다'); return; }
  const nickname = localStorage.getItem('eg_nickname') || user.email?.split('@')[0] || '익명';
  try {
    const r = await sbFetch('/rest/v1/rpc/rent_from_shelf', {
      method: 'POST',
      body: JSON.stringify({ p_item_id: itemId, p_user_id: user.id, p_nickname: nickname })
    });
    showToast(`보물이 집으로 떠납니다 — 🍎 ${r.fee}알 · ${fmtMD(r.due_at)} 귀가`);
    await refreshCatWork(itemId);
  } catch (e) { showToast(e.message || '대여하지 못했습니다'); }
}
async function rpcJoinWaitlist(itemId) {
  const user = getUser();
  if (!user) { showToast('입장 후 줄을 설 수 있습니다'); return; }
  const nickname = localStorage.getItem('eg_nickname') || user.email?.split('@')[0] || '익명';
  try {
    const r = await sbFetch('/rest/v1/rpc/join_waitlist', {
      method: 'POST',
      body: JSON.stringify({ p_item_id: itemId, p_user_id: user.id, p_nickname: nickname })
    });
    showToast(`줄을 섰습니다 — ${r.position}번째`);
    await refreshCatWork(itemId);
  } catch (e) { showToast(e.message || '줄을 서지 못했습니다'); }
}
async function refreshCatWork(itemId) {
  try { await loadCatWeek(CAT_WK); } catch (e) { console.warn(e); }
  renderCatalog();
  closeCatWork();
  openCatWork(itemId);
}

// ── 메인 탭 ───────────────────────────────
function switchMainTab(tab) {
  document.querySelectorAll('.main-tab').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tab-salon').hidden   = tab !== 'salon';
  document.getElementById('tab-record').hidden  = tab !== 'record';
  document.getElementById('tab-catalog').hidden = tab !== 'catalog';
  document.body.classList.toggle('mode-salon', tab === 'salon');
  const bd = document.getElementById('salon-backdrop');
  if (bd) bd.style.opacity = tab === 'salon' ? '1' : '0';
  const rbd = document.getElementById('record-backdrop');
  if (rbd) rbd.classList.toggle('on', tab === 'record');
  if (tab === 'record') setRecordBackdrop(currentRoom);
  if (tab === 'catalog') ensureCatalog();
  renderRhythm(tab);
  window.scrollTo(0, 0);
}

// ── 주간 리듬 한 줄 ───────────────────────
function renderRhythm(tab = 'salon') {
  if (tab === 'record') {
    document.getElementById('rhythm-line').innerHTML =
      '신보는 <b>화요일</b>에 아홉 장 · 카탈로그는 닫히지 않습니다 · 대여는 <b>🍎 1알 · 3주</b>';
    return;
  }
  if (tab === 'catalog') {
    document.getElementById('rhythm-line').innerHTML =
      '카탈로그 레조네 — 보물은 흐릅니다 · 서가 대여는 <b>부수 연동 🍎 · 6주</b>';
    return;
  }
  const day = new Date().getDay(); // 0 일 ~ 6 토
  let line;
  if (day === 1) {
    line = '오늘 <b>정오</b>, 다섯 방 동시 추첨 — 보물이 집으로 떠납니다';
  } else if (day === 0) {
    line = '응모는 <b>오늘 자정</b> 마감 · 추첨은 <b>월요일 정오</b>';
  } else if (day === 2) {
    line = '새 살롱이 열렸습니다 · 응모는 <b>일요일 자정</b>까지 · 추첨은 <b>월요일 정오</b>';
  } else {
    line = '응모는 <b>일요일 자정</b>까지 · 추첨은 <b>월요일 정오</b>, 다섯 방 동시에';
  }
  document.getElementById('rhythm-line').innerHTML = line;
}

// ── Salle 네비 ────────────────────────────
function renderSalleNav() {
  const host = document.getElementById('salle-nav');
  host.innerHTML = [1,2,3,4,5].map(n => `
    <button class="salle-tab ${n === currentSalle ? 'active' : ''}" data-salle="${n}" onclick="switchSalle(${n})">
      <span class="num">${ROMAN[n]}</span>
      <span class="nm">${SALLE_NAMES[n]}</span>
    </button>`).join('');
}

function switchSalle(n) {
  if (n < 1 || n > 5) return;
  currentSalle = n;
  setBackdrop(n);
  renderSalleNav();
  renderStage();
}

// ── 무대 렌더 ─────────────────────────────
function renderStage() {
  const host = document.getElementById('stage-host');
  const item = SALON_ITEMS.find(i => i.salle_no === currentSalle);

  if (!SALON_ITEMS.length) {
    host.innerHTML = `
      <div class="void">
        <div class="void-mark">✦</div>
        <div class="void-line">이번 주 살롱이 아직 비어 있습니다.</div>
        <div class="void-sub">화요일 0시, 새 보물 다섯 점이 도착합니다.</div>
      </div>`;
    return;
  }

  if (!item) {
    host.innerHTML = `
      <div class="stage" data-salle="${currentSalle}">
        <div class="void" style="min-height:40vh;">
          <div class="void-mark">✦</div>
          <div class="void-line">이 방은 비어 있습니다.</div>
          <div class="void-sub">다음 보물을 기다리는 벽입니다.</div>
        </div>
      </div>`;
    return;
  }

  const loved = LOVE_COUNTS[item.id] || 0;
  const loveLine = loved > 0
    ? `이번 주 <b>${loved}명</b>이 이 작품을 사랑합니다`
    : `첫 번째 사랑의 고백을 기다립니다`;
  const hasLayers = !!(item.layers || item.library);

  host.innerHTML = `
    <div class="stage" data-salle="${currentSalle}">
      <img class="artwork" src="${item.img}" alt="${escapeHtml(item.name)}"
           onerror="this.style.display='none'">
      <div class="plaque">
        <div class="plaque-name">${escapeHtml(item.name)}</div>
        <div class="plaque-artist">${escapeHtml(item.artist)}${item.period ? ' · ' + escapeHtml(item.period) : ''}</div>
        ${item.origin ? `<div class="plaque-meta">${escapeHtml(item.origin)}</div>` : ''}
        <div class="love-line">${loveLine}</div>
      </div>
      <div class="card-actions">
        ${hasLayers ? `<button class="btn-layers" onclick="openLayers('${item.id}')">✦ 카리의 4겹</button>` : ''}
        <button class="btn-apply" onclick="openBid('${item.id}')">🍎 1알 응모하기</button>
      </div>
    </div>`;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// ── 카리의 4겹 모달 ───────────────────────
function openLayers(itemId) {
  const item = SALON_ITEMS.find(i => i.id === itemId);
  if (!item) return;
  const src = item.layers || item.library;
  if (!src) return;

  let blocks = '';
  if (Array.isArray(src)) {
    blocks = src.map((t, i) => `
      <div class="layer-block">
        <div class="layer-tag">${i + 1}번째 겹</div>
        <div class="layer-text">${escapeHtml(typeof t === 'string' ? t : JSON.stringify(t))}</div>
      </div>`).join('<div class="layer-divider"></div>');
  } else if (typeof src === 'object') {
    const order = ['scene', 'knowledge', 'thought', 'connection', 'curation'];
    const keys = [...order.filter(k => src[k]), ...Object.keys(src).filter(k => !order.includes(k))];
    blocks = keys.map(k => `
      <div class="layer-block">
        <div class="layer-tag">${LAYER_LABELS[k] || escapeHtml(k)}</div>
        <div class="layer-text">${escapeHtml(src[k])}</div>
      </div>`).join('<div class="layer-divider"></div>');
  } else {
    blocks = `<div class="layer-text">${escapeHtml(src)}</div>`;
  }

  const panel = document.createElement('div');
  panel.id = 'layers-panel';
  panel.innerHTML = `
    <div class="sheet-overlay" style="${salleBackdrop()}" onclick="if(event.target===this)closeLayers()">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-eyebrow">Quatre Couches · 카리의 4겹</div>
        <div class="sheet-title">${escapeHtml(item.name)}</div>
        <div class="sheet-sub">${escapeHtml(item.artist)}</div>
        ${blocks}
        <button class="sheet-btn quiet" onclick="closeLayers()">닫기</button>
      </div>
    </div>`;
  document.body.appendChild(panel);
  document.body.style.overflow = 'hidden';
}
function closeLayers() {
  const p = document.getElementById('layers-panel'); if (p) p.remove();
  document.body.style.overflow = '';
}

// ── 응모 패널 (행운의 미소) ────────────────
async function openBid(itemId) {
  const user = getUser();
  if (!user) { showToast('로그인이 필요합니다'); return; }

  const wkId = getWkId();
  let myTickets = [];

  try {
    myTickets = await sbFetch(
      `/rest/v1/heritage_applications?item_id=eq.${itemId}&user_id=eq.${user.id}&wk_id=eq.${wkId}&select=ticket_code,applied_date,created_at&order=created_at.asc`
    ) || [];
  } catch (e) { console.warn(e); }

  const todayApplied = myTickets.some(t => t.applied_date === new Date().toISOString().slice(0, 10));
  const weekCount = myTickets.length;
  const canApply = !todayApplied && weekCount < 6;
  const item = SALON_ITEMS.find(i => i.id === itemId);
  const loved = LOVE_COUNTS[itemId] || 0;

  const panel = document.createElement('div');
  panel.id = 'bid-panel';
  panel.innerHTML = `
    <div class="sheet-overlay" style="${salleBackdrop()}" onclick="if(event.target===this)closeBidPanel()">
      <div class="sheet" id="bid-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-eyebrow">행운의 미소 · Heritage Lottery</div>
        <div class="sheet-title">${item ? escapeHtml(item.name) : itemId}</div>
        <div class="sheet-sub">${item ? escapeHtml(item.artist) : ''}</div>

        <div class="stat-row">
          <div class="stat-box">
            <div class="stat-num">${loved}</div>
            <div class="stat-lbl">이 작품을 사랑하는 사람</div>
          </div>
          <div class="stat-box">
            <div class="stat-num">${weekCount}<small>/6</small></div>
            <div class="stat-lbl">내 티켓 (이번 주)</div>
          </div>
        </div>

          🥇 1등은 영구 소장 — 2~5등은 보물이 대여로 집에 머뭅니다<br>
          ✦ 응모한 황금사과는 환불되지 않습니다
        </div>

        ${canApply ? `

        ` : todayApplied ? `

  document.body.appendChild(panel);
  document.body.style.overflow = 'hidden';
}

function closeBidPanel() {
  const p = document.getElementById('bid-panel'); if (p) p.remove();
  document.body.style.overflow = '';
}

// ── 응모 실행 ─────────────────────────────
async function submitApplication(itemId) {
  const user = getUser();
  if (!user) { showToast('로그인이 필요합니다'); return; }
  const nickname = localStorage.getItem('eg_nickname') || user.email?.split('@')[0] || '익명';

  const btn = document.querySelector('#bid-panel button[onclick*="submitApplication"]');
  if (btn) { btn.disabled = true; btn.textContent = '응모 중...'; }

  try {
    const result = await sbFetch('/rest/v1/rpc/apply_heritage', {
      method: 'POST',
      body: JSON.stringify({ p_item_id: itemId, p_user_id: user.id, p_nickname: nickname })
    });

    if (result.ok) {
      LOVE_COUNTS[itemId] = Math.max(LOVE_COUNTS[itemId] || 0, 0) || 0;
      showTicketInPanel(result.ticket, itemId);
      refreshLoveAndStage(itemId);
    } else {
      showToast(result.msg);
      if (btn) { btn.disabled = false; btn.textContent = '🍎 오늘 응모하기 (황금사과 1알)'; }
    }
  } catch (e) {
    showToast('응모 실패: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '🍎 오늘 응모하기 (황금사과 1알)'; }
  }
}

// 응모 후 사람 수 재조회 + 무대 갱신
async function refreshLoveAndStage(itemId) {
  try {
    const apps = await sbFetch(
      `/rest/v1/heritage_applications?item_id=eq.${itemId}&wk_id=eq.${getWkId()}&select=user_id`
    ) || [];
    LOVE_COUNTS[itemId] = new Set(apps.map(a => a.user_id)).size;
  } catch (e) { console.warn(e); }
  renderStage();
}

    <div id="ticket-preview">
      <div class="ticket-card">

        <div class="ticket-hole r"></div>
        <div class="sheet-eyebrow" style="margin-bottom:12px;">EG Heritage · Lottery Ticket</div>
        <div style="font-size:15px;color:rgba(244,239,228,0.9);margin-bottom:5px;">${item ? escapeHtml(item.name) : itemId}</div>
        <div style="font-size:13.5px;color:rgba(244,239,228,0.62);">${item ? escapeHtml(item.artist) : ''}</div>

// ── 티켓 이미지 다운로드 ──────────────────
// 방(Salle)마다 전용 티켓 한 장 — 무대 색과 짝지은 배정 (0607 소로 결정)
// 잉크색 = 각 티켓에 인쇄된 글자색 실측값. 짙은 바탕(Ⅲ·Ⅴ)은 크림 화이트.
const TICKET_DESIGNS = {
  1: { file: 'ticket_05.webp', ink: '#7A5B58', sub: 'rgba(122,91,88,0.85)'   }, // Ⅰ 와인 다마스크 → 로즈
  2: { file: 'ticket_04.webp', ink: '#464628', sub: 'rgba(70,70,40,0.85)'    }, // Ⅱ 진녹 서재 → 셀라돈
  3: { file: 'ticket_03.webp', ink: '#FAFAF0', sub: 'rgba(250,250,240,0.85)' }, // Ⅲ 프러시안 궁전 → 네이비
  4: { file: 'ticket_01.webp', ink: '#56492E', sub: 'rgba(86,73,46,0.85)'    }, // Ⅳ 크림 아침 → 아이보리
  5: { file: 'ticket_02.webp', ink: '#FFFDF3', sub: 'rgba(255,253,243,0.88)' }  // Ⅴ 렘브란트 명암 → 토프
};

// 티켓 번호(HTG_00N-YYYYMMDD-XXXX)에 새겨진 발급일 — 옛 티켓도 제 날짜를 입는다
function ticketIssueDate(ticketCode) {
  const m = /-(\d{8})-/.exec(ticketCode);
  if (!m) return new Date().toLocaleDateString('ko-KR');
  const s = m[1];
  return parseInt(s.slice(0, 4), 10) + '. ' + parseInt(s.slice(4, 6), 10) + '. ' + parseInt(s.slice(6, 8), 10) + '.';
}

let _ticketCache = { code: null, url: null }; // 같은 티켓은 한 번만 굽는다

async function buildTicketImage(ticketCode, itemId) {
  if (_ticketCache.code === ticketCode && _ticketCache.url) return _ticketCache.url;

  const item = SALON_ITEMS.find(i => String(i.id) === String(itemId));
  const design = item ? TICKET_DESIGNS[item.salle_no] : null;
  if (!design) return null;
  const itemName = item.name;

  try { await document.fonts.ready; } catch (e) {}

  const img = await new Promise(resolve => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => resolve(null); // 자재 못 받으면 null → 호출 쪽 폴백
    im.src = design.file;
  });
  if (!img) return null;

  const W = 2172, H = 724, CX = 810; // 원본 규격 + 본문(반권 제외) 중앙
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // 작품명 — 부제와 장식선 사이, 길면 자동 축소
  let size = 66;
  ctx.font = '600 ' + size + 'px "Noto Serif KR", serif';
  while (ctx.measureText(itemName).width > 1380 && size > 34) {
    size -= 4;
    ctx.font = '600 ' + size + 'px "Noto Serif KR", serif';
  }
  ctx.fillStyle = design.ink;
  ctx.fillText(itemName, CX, 352);

  // 일련번호 — 장식선 아래
  try { ctx.letterSpacing = '2px'; } catch (e) {}
  ctx.font = 'bold 46px "Courier New", monospace';
  ctx.fillText(ticketCode, CX, 510);
  try { ctx.letterSpacing = '0px'; } catch (e) {}

  // 발급일
  ctx.font = '500 27px "Noto Serif KR", serif';
  ctx.fillStyle = design.sub;
  ctx.fillText(ticketIssueDate(ticketCode) + ' 발급 · 은교살롱', CX, 598);

  const url = canvas.toDataURL('image/png');
  _ticketCache = { code: ticketCode, url: url };
  return url;
}

async function downloadTicket(ticketCode, itemId) {
  const item = SALON_ITEMS.find(i => String(i.id) === String(itemId));
  const itemName = item ? item.name : String(itemId);
  const url = await buildTicketImage(ticketCode, itemId);
  if (!url) { downloadTicketFallback(ticketCode, itemName); return; } // 자재 못 받으면 옛 티켓으로 정직 폴백

  const a = document.createElement('a');
  a.download = 'EG_TICKET_' + ticketCode + '.png';
  a.href = url;
  a.click();
  showToast('🎟 티켓이 저장되었습니다!');
}

// ── 내 티켓 상시 열람 — 응모 패널 위층의 막 ──

  });
}
function closeTicketView() {
  const p = document.getElementById('ticket-view-panel'); if (p) p.remove();

// 폴백 — v3.9 캔버스 티켓 (자재 로드 실패 시에만)
function downloadTicketFallback(ticketCode, itemName) {
  const canvas = document.createElement('canvas');
  canvas.width = 600; canvas.height = 320;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#241614';
  ctx.fillRect(0, 0, 600, 320);

  ctx.strokeStyle = 'rgba(201,168,76,0.6)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(16, 16, 568, 288);

  ctx.setLineDash([6, 4]);
  ctx.strokeStyle = 'rgba(201,168,76,0.25)';
  ctx.beginPath(); ctx.moveTo(40, 160); ctx.lineTo(560, 160); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#140a08';
  ctx.beginPath(); ctx.arc(16, 160, 12, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(584, 160, 12, 0, Math.PI * 2); ctx.fill();

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(201,168,76,0.6)';
  ctx.font = '11px "Courier New"';
  ctx.fillText('EG HERITAGE · LOTTERY TICKET', 300, 60);

  ctx.fillStyle = 'rgba(244,239,228,0.85)';
  ctx.font = '18px Georgia';
  ctx.fillText(itemName, 300, 100);

  ctx.fillStyle = '#C9A84C';
  ctx.font = 'bold 22px "Courier New"';
  ctx.fillText(ticketCode, 300, 210);

  ctx.fillStyle = 'rgba(244,239,228,0.55)';
  ctx.font = '11px Georgia';
  ctx.fillText(new Date().toLocaleDateString('ko-KR') + ' 발급 · 은교살롱', 300, 270);

  const a = document.createElement('a');
  a.download = `EG_TICKET_${ticketCode}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
  showToast('🎟 티켓이 저장되었습니다!');
}

// ── 토스트 ────────────────────────────────
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ── 키보드 + 스와이프 ─────────────────────
document.addEventListener('keydown', (e) => {
  if (document.getElementById('ticket-view-panel')) {
    if (e.key === 'Escape') closeTicketView();
    return;
  }
  if (document.getElementById('bid-panel') || document.getElementById('layers-panel') ||
      document.getElementById('liner-panel') || document.getElementById('rent-panel') ||
      document.getElementById('cat-panel')) {
    if (e.key === 'Escape') { closeBidPanel(); closeLayers(); closeLiner(); closeRent(); closeCatWork(); }
    return;
  }
  if (!document.getElementById('tab-salon').hidden) {
    if (e.key === 'ArrowLeft')  switchSalle(currentSalle - 1);
    if (e.key === 'ArrowRight') switchSalle(currentSalle + 1);
    if (['1','2','3','4','5'].includes(e.key)) switchSalle(parseInt(e.key));
  } else if (!document.getElementById('tab-record').hidden) {
    if (e.key === 'ArrowLeft')  switchRoom(currentRoom - 1);
    if (e.key === 'ArrowRight') switchRoom(currentRoom + 1);
    if (['1','2','3','4','5','6','7','8','9'].includes(e.key)) switchRoom(parseInt(e.key));
  }
});

let touchX = null;
document.addEventListener('touchstart', (e) => {
  if (document.getElementById('bid-panel') || document.getElementById('layers-panel') ||
      document.getElementById('liner-panel') || document.getElementById('rent-panel') ||
      document.getElementById('cat-panel')) return;
  if (document.getElementById('tab-salon').hidden && document.getElementById('tab-record').hidden) return;
  touchX = e.touches[0].clientX;
}, { passive: true });
document.addEventListener('touchend', (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) < 60) return;
  if (!document.getElementById('tab-salon').hidden) {
    if (dx < 0) switchSalle(currentSalle + 1);
    else        switchSalle(currentSalle - 1);
  } else if (!document.getElementById('tab-record').hidden) {
    if (dx < 0) switchRoom(currentRoom + 1);
    else        switchRoom(currentRoom - 1);
  }
}, { passive: true });

</script>
