<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
<title>EG헤리티지 — 미술관</title>
<style>
:root{ --amber:#f0d8a8; --gallery-dark:#140a0e; --guide:rgba(240,216,168,.45);
  --gold:#d4b35e; --gold-l:#ecd08a; --gold-dim:rgba(212,179,94,.7); --gold-faint:rgba(212,179,94,.14);
  --cream:#f4efe4; --txt-strong:rgba(244,239,228,.97); --txt:rgba(244,239,228,.88); --txt-soft:rgba(244,239,228,.66); }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--gallery-dark);
  font-family:'Cormorant Garamond','Noto Serif KR',serif;color:var(--amber);
  -webkit-tap-highlight-color:transparent;}
.scroller{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-y pinch-zoom;background:var(--gallery-dark);}
.scroller::-webkit-scrollbar{display:none}

.room{position:relative;left:50%;transform:translateX(-50%);
  height:115vh;width:calc(115vh * 9 / 16);
  background:#3a1820 center center / cover no-repeat;transition:opacity .5s ease;}
@media (min-aspect-ratio:1/1){ .room{width:100vw;height:calc(100vw * 16 / 9);} }

.art{position:absolute;z-index:3;transform:translate(-50%,-50%);transition:opacity .45s ease;}
body:not(.edit) .art{cursor:zoom-in;}
.zoom-hint{position:absolute;right:12px;bottom:12px;width:36px;height:36px;border-radius:50%;
  background:rgba(20,10,14,.6);border:1px solid rgba(240,216,168,.4);color:#f0d8a8;
  display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;
  opacity:.62;transition:opacity .2s ease,transform .2s ease;pointer-events:none;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.art:hover .zoom-hint{opacity:1;transform:scale(1.12);}
body.edit .zoom-hint{display:none;}
.art img{display:block;height:48vh;width:auto;max-width:82vw;filter:drop-shadow(8px 20px 34px rgba(0,0,0,.82));pointer-events:none;-webkit-user-drag:none;}
.art.fade{opacity:0}
.plaque{position:absolute;z-index:4;transform:translate(-50%,-50%);transform-origin:center;
  padding:6px 12px 6px 18px;background:linear-gradient(180deg,#efe6d0,#d8c9a8);
  border:1px solid rgba(90,58,24,.55);box-shadow:0 3px 10px rgba(0,0,0,.55);
  color:#3a2a18;line-height:1.32;text-align:center;white-space:nowrap;transition:opacity .45s ease;
  display:flex;align-items:center;gap:10px;}
.plaque .ptext{display:flex;flex-direction:column;text-align:center;}
.rent-mini{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid rgba(90,58,24,.4);
  background:rgba(255,252,244,.55);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding:0;line-height:1;transition:transform .15s ease,background .2s ease;}
.rent-mini:hover{background:rgba(255,252,244,.9);transform:scale(1.1);}
.rent-mini:active{transform:scale(.9);}
.rent-mini.have{background:rgba(212,184,120,.55);cursor:default;}
.plaque.fade{opacity:0}
.plaque .pt{font-size:16px;font-weight:600;letter-spacing:.5px;display:block;}
.plaque .pa{font-size:12px;font-style:italic;opacity:.72;letter-spacing:1px;}

/* ── 편집 모드 전용 ── */
body.edit .art{cursor:grab;touch-action:none;transition:none;}
body.edit .plaque{cursor:grab;touch-action:none;transition:none;}
body.edit .art.fade,body.edit .plaque.fade{opacity:1;}
.art .handle,.plaque .handle{position:absolute;right:-9px;bottom:-9px;width:20px;height:20px;border-radius:50%;
  background:#e9cf9c;border:2px solid #5a3a18;cursor:nwse-resize;display:none;z-index:6;}
body.edit .art.sel,body.edit .plaque.sel{outline:2px dashed rgba(240,216,168,.85);outline-offset:6px;}
body.edit .art.sel .handle,body.edit .plaque.sel .handle{display:block;}

.guides{position:fixed;inset:0;z-index:25;pointer-events:none;display:none;}
body.edit .guides{display:block;}
.guides .vline{position:absolute;top:0;bottom:0;left:50%;width:1px;
  background:repeating-linear-gradient(180deg,var(--guide) 0 8px,transparent 8px 16px);transition:background .15s;}
.guides .hline{position:absolute;left:0;right:0;top:50%;height:1px;
  background:repeating-linear-gradient(90deg,var(--guide) 0 8px,transparent 8px 16px);transition:background .15s;}
.guides.snap .vline,.guides.snap .hline{background:rgba(255,235,180,.95);box-shadow:0 0 10px rgba(255,235,180,.6);}
.guides .safe{position:absolute;left:6%;right:6%;top:50%;transform:translateY(-50%);
  border:1px dashed rgba(240,216,168,.5);border-radius:2px;}
.guides .safe::after{content:'진입 화면 · 이 안에 액자';position:absolute;top:4px;left:8px;
  font-size:10px;letter-spacing:.1em;color:rgba(240,216,168,.6);font-family:system-ui,sans-serif;}
.guides .center-dot{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;
  border-radius:50%;border:1px solid rgba(255,235,180,.8);}

.hd{position:fixed;top:max(58px,calc(env(safe-area-inset-top) + 48px));left:0;right:0;z-index:30;text-align:center;
  pointer-events:none;text-shadow:0 2px 16px rgba(0,0,0,.96);}
.hd .t{font-size:clamp(20px,5vw,26px);letter-spacing:.3em;color:#ecd29c;}
.hd .s{font-size:clamp(10px,2.6vw,12px);letter-spacing:.28em;color:rgba(240,216,168,.62);margin-top:3px;}

.foot{position:fixed;bottom:max(16px,calc(env(safe-area-inset-bottom) + 14px));left:0;right:0;z-index:30;text-align:center;}
.foot .rm{font-size:13px;letter-spacing:.24em;color:#e9cf9c;pointer-events:none;}
.foot .dots{margin-top:8px;display:flex;gap:7px;justify-content:center;pointer-events:none;}
.foot .dot{width:7px;height:7px;border-radius:50%;background:rgba(240,216,168,.3);transition:all .3s;}
.foot .dot.on{background:#e9cf9c;transform:scale(1.3);}
.rent-sheet{text-align:center;}
.rent-apple{font-size:42px;text-align:center;margin:2px 0 10px;}
.rent-work{font-size:14px;color:#c9a86a;letter-spacing:.04em;margin-bottom:14px;}
.rent-desc{font-size:14px;color:#d8cdb8;line-height:1.7;margin-bottom:22px;}
.rent-desc b{color:#f0d8a8;}
body.edit .foot{display:none;}

.nav{position:fixed;top:50%;transform:translateY(-50%);z-index:30;width:52px;height:52px;border-radius:50%;
  border:1px solid rgba(212,184,120,.62);background:rgba(40,22,18,.5);color:var(--amber);font-size:26px;cursor:pointer;
  backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;transition:transform .2s;}
.nav:active{transform:translateY(-50%) scale(.92)}
.nav-l{left:12px} .nav-r{right:12px}
.roomtag{position:fixed;left:50%;top:max(132px,calc(env(safe-area-inset-top) + 122px));transform:translate(-50%,0);z-index:45;
  font-size:clamp(22px,6vw,40px);letter-spacing:.3em;color:#f0d8a8;opacity:0;pointer-events:none;
  text-shadow:0 2px 30px rgba(0,0,0,.9);transition:opacity .4s;text-align:center;}
.roomtag.on{opacity:1}
.roomtag small{display:block;font-size:.4em;letter-spacing:.28em;opacity:.7;margin-top:10px}
.art-zoom{position:fixed;inset:0;z-index:100;background:rgba(8,4,6,.94);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;
  animation:overlayIn .25s ease;}
.art-zoom[hidden]{display:none;}
.art-zoom-img{max-width:96vw;max-height:84vh;object-fit:contain;filter:drop-shadow(0 16px 44px rgba(0,0,0,.75));}
.art-zoom-x{position:absolute;top:max(16px,calc(env(safe-area-inset-top) + 10px));right:18px;
  width:42px;height:42px;border-radius:50%;border:1px solid rgba(212,184,120,.5);
  background:rgba(40,22,18,.82);color:#e9cf9c;font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .2s;}
.art-zoom-x:hover{background:rgba(60,36,30,.95);}
.art-zoom-cap{text-align:center;color:#e9cf9c;font-family:'Cormorant Garamond','Noto Serif KR',serif;}
.art-zoom-cap b{display:block;font-size:18px;font-weight:600;letter-spacing:.04em;}
.art-zoom-cap span{display:block;font-size:13px;font-style:italic;opacity:.72;margin-top:3px;}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%);z-index:60;
  background:rgba(20,10,14,.92);border:1px solid rgba(212,184,120,.5);color:#f0d8a8;padding:11px 20px;border-radius:14px;
  font-size:13.5px;letter-spacing:.02em;opacity:0;pointer-events:none;transition:opacity .3s;max-width:86vw;text-align:center;}
.toast.on{opacity:1}
.curtain{position:fixed;inset:0;z-index:80;background:var(--gallery-dark);display:flex;align-items:center;justify-content:center;
  color:#caa258;letter-spacing:.3em;font-size:15px;transition:opacity .5s;}
.curtain.gone{opacity:0;pointer-events:none;}

/* 상단 세그먼트 메뉴 (미술관 ⇄ 음반) */
.topbar{position:fixed;top:0;left:0;right:0;z-index:35;display:flex;align-items:center;justify-content:space-between;
  padding:max(10px,env(safe-area-inset-top)) 16px 10px;pointer-events:none;}
.topbar .home{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:1px solid rgba(212,184,120,.5);
  background:rgba(20,10,14,.45);color:var(--amber);font-size:18px;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);cursor:pointer;text-decoration:none;}
.topbar .spacer{width:38px;}
.seg{pointer-events:auto;display:flex;border:1px solid rgba(212,184,120,.45);border-radius:22px;overflow:hidden;
  background:rgba(20,10,14,.45);backdrop-filter:blur(10px);box-shadow:0 2px 14px rgba(0,0,0,.4);}
.seg button{font-family:inherit;font-size:13px;letter-spacing:.05em;color:rgba(240,216,168,.62);
  background:transparent;border:none;padding:8px 18px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.seg button.on{background:linear-gradient(180deg,#e2c382,#caa258);color:#1a0f08;font-weight:600;}
body.edit .topbar{display:none;}

/* 살롱지기 편집 토글 + 편집 패널 */
.edit-toggle{position:fixed;right:14px;bottom:max(16px,calc(env(safe-area-inset-bottom) + 14px));z-index:55;
  display:none;font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.04em;color:#e9cf9c;cursor:pointer;
  background:rgba(40,22,18,.7);border:1px solid rgba(212,184,120,.5);border-radius:18px;padding:8px 14px;backdrop-filter:blur(8px);}
.edit-panel{position:fixed;left:0;right:0;bottom:0;z-index:56;display:none;
  background:rgba(20,10,14,.95);border-top:1px solid rgba(212,184,120,.35);
  padding:9px 14px max(9px,env(safe-area-inset-bottom));backdrop-filter:blur(10px);
  font-family:system-ui,'Noto Sans KR',sans-serif;}
body.edit .edit-panel{display:block;}
body.edit .edit-toggle{background:rgba(120,40,40,.7);}
.ep-row{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;}
.ep-row .nm{font-size:12px;color:#e9cf9c;letter-spacing:.04em;min-width:150px;text-align:center;}
.ep-btn{font-family:inherit;font-size:13px;letter-spacing:.03em;color:#3a2a18;cursor:pointer;
  background:linear-gradient(180deg,#efe6d0,#d8c9a8);border:1px solid rgba(90,58,24,.5);border-radius:4px;padding:7px 14px;}
.ep-btn.ghost{background:rgba(60,40,28,.5);color:#e9cf9c;border:1px solid rgba(212,184,120,.5);}
.ep-btn.gold{background:linear-gradient(180deg,#caa258,#9c7a3a);color:#1a0f08;font-weight:600;}
.ep-btn:active{transform:scale(.96)}
.ep-coord{font-size:11px;color:rgba(240,216,168,.72);text-align:center;margin-top:6px;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;min-height:14px;}
.ep-tip{font-size:11px;color:rgba(240,216,168,.45);text-align:center;margin-top:4px;letter-spacing:.02em;}

/* ── 카리의 4겹 모달 (heritage 이식) ── */
@keyframes overlayIn{ from{opacity:0} to{opacity:1} }
@keyframes sheetUp{ from{transform:translateY(44px);opacity:0} to{transform:translateY(0);opacity:1} }
.sheet-overlay {
  position: fixed; inset: 0; z-index: 600;
  background: rgba(10,6,5,0.42);           /* 검정 → 반투명: 뒤 미술관이 비친다 */
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  overflow-y: auto;
  scrollbar-width: none;
  animation: overlayIn 0.25s ease;
}
.sheet-overlay::-webkit-scrollbar { display: none; }
.sheet {
  width: 100%; max-width: 480px;
  margin: 14vh auto 0;
  min-height: 86vh;
  background: rgba(36,22,20,0.97);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-radius: 20px 20px 0 0;
  border-top: 1px solid rgba(212,179,94,0.35);
  box-shadow: 0 -16px 70px rgba(0,0,0,0.6);
  padding: 26px 26px 46px;
  animation: sheetUp 0.32s cubic-bezier(0.34,1.56,0.64,1);
}
/* 데스크탑: 미술관은 뒤에 두고, 4겹은 우측 한켠 사이드패널로 */
@media (min-width: 781px){
  .sheet {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 432px; max-width: 90vw;
    margin: 0; min-height: 100vh;
    border-radius: 22px 0 0 22px;
    border-top: none; border-left: 1px solid rgba(212,179,94,0.35);
    box-shadow: -18px 0 80px rgba(0,0,0,0.55);
    overflow-y: auto; scrollbar-width: none;
    animation: sheetSlideIn 0.36s cubic-bezier(0.34,1.4,0.64,1);
  }
  .sheet::-webkit-scrollbar { display: none; }
}
@keyframes sheetSlideIn { from{transform:translateX(64px);opacity:0} to{transform:translateX(0);opacity:1} }
.sheet-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: rgba(201,168,76,0.25);
  margin: 0 auto 22px;
}
.sheet-eyebrow { font-size: 12px; letter-spacing: 0.2em; color: var(--gold-dim); margin-bottom: 7px; text-transform: uppercase; }
.sheet-title { font-size: 20px; font-weight: 600; color: var(--txt-strong); margin-bottom: 6px; line-height: 1.35; }
.sheet-sub { font-size: 13.5px; color: var(--txt-soft); margin-bottom: 22px; }

/* 4겹 모달 본문 */
.layer-block { margin-bottom: 20px; }
.layer-tag {
  font-size: 12.5px; letter-spacing: 0.18em; color: var(--gold-dim);
  text-transform: uppercase; margin-bottom: 7px;
}
.layer-text { font-size: 15.5px; color: var(--txt); line-height: 1.95; letter-spacing: 0.01em; }
.layer-divider { height: 1px; margin: 22px 0; background: linear-gradient(90deg, transparent, rgba(201,168,76,0.18), transparent); }

/* 공통 버튼 */
.sheet-btn {
  width: 100%; padding: 14px;
  border-radius: 12px;
  font-size: 14.5px; letter-spacing: 0.05em;
  cursor: pointer; font-family: inherit;
  margin-top: 10px;
}
.sheet-btn.gold {
  background: linear-gradient(135deg, rgba(212,179,94,0.35), rgba(212,179,94,0.14));
  border: 1px solid rgba(212,179,94,0.55);
  color: var(--gold-l);
  font-weight: 600;
}
.sheet-btn.ghost {
  background: rgba(244,239,228,0.06);
  border: 1px solid rgba(244,239,228,0.18);
  color: rgba(244,239,228,0.72);
}
.sheet-btn.quiet {
  background: none;
  border: 1px solid rgba(244,239,228,0.14);
  color: rgba(244,239,228,0.55);
  font-size: 13px; padding: 12px;
}
.sheet-btn:disabled { opacity: 0.5; cursor: default; }

/* 감상모드: 명패는 누를 수 있다 (4겹) */
body:not(.edit) .plaque{cursor:pointer;transition:filter .2s;}
body:not(.edit) .plaque:hover{filter:drop-shadow(0 0 10px rgba(240,216,168,.45));}

</style>
</head>
<body>
<div class="topbar">
  <a class="home" href="./" aria-label="홈으로">←</a>
  <div class="seg">
    <button class="on">🖼 미술관</button>
    <button onclick="location.href='heritage_record.html'">📀 음반</button>

</div>

<div class="scroller" id="scroller">
  <div class="room" id="room">

  </div>
</div>
<div class="guides" id="guides">
  <div class="safe" id="safe"></div>
  <div class="vline"></div><div class="hline"></div><div class="center-dot"></div>
</div>

<div class="hd"><div class="t">GALERIE</div><div class="s" id="sub"></div></div>
<div class="foot">
  <div class="rm" id="rm"></div>
  <div class="dots" id="dots"></div>
</div>
<button class="nav nav-l" id="prev">‹</button>
<button class="nav nav-r" id="next">›</button>
<div class="roomtag" id="roomtag"></div>
<div class="toast" id="toast"></div>
<div class="art-zoom" id="artZoom" hidden onclick="if(event.target===this)closeZoom()">

</div>

<div class="edit-panel" id="editPanel">

    <button class="ep-btn ghost" onclick="go(-1)">‹ 이전</button>
    <span class="nm" id="epNm"></span>
    <button class="ep-btn ghost" onclick="go(1)">다음 ›</button>
    <button class="ep-btn gold" onclick="saveLayout()">이 자리에 걸기</button>

  <div class="ep-coord" id="epCoord"></div>

</div>

async function sbFetch(path, options={}){
  const token = getToken();
  const res = await fetch(SUPA_URL + path, {
    ...options,
    headers:{ 'apikey':SUPA_KEY, 'Authorization':'Bearer '+(token||SUPA_KEY),
      'Content-Type':'application/json', 'Prefer':'return=representation', ...options.headers }
  });
  if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.message||res.statusText); }
  return res.status===204 ? null : res.json();
}

let ROOMS=[], ri=0, wi=0;
let MY_RENTS = new Set();
let editMode=false, sel='art';

async function loadGalerie(){
  // 지연 개봉: 개봉 시각이 지난 다음 보물이 있으면 이 진입이 방아쇠가 되어 펼쳐진다 (멱등)
  try { await sbFetch('/rest/v1/rpc/open_due_treasures', { method:'POST', body:'{}' }); }
  catch(e){ /* 개봉 실패는 조용히 — 기존 active 보물 표시는 계속 */ }
  const items = await sbFetch('/rest/v1/heritage_items?category=eq.visual'
    + '&status=eq.active'   // 0629: 살롱지기 standby 미리보기 제거 — 모두 active만 봄
    + '&select=id,name,artist,img,ratio,wk_id,salle_no,status,art_layout,layers,curation_links'
    + '&order=wk_id.desc,salle_no.asc') || [];
  const byWk={}, order=[];
  for(const it of items){ if(!byWk[it.wk_id]){ byWk[it.wk_id]=[]; order.push(it.wk_id); } byWk[it.wk_id].push(it); }
  // 0629: 통통 튐 제거 — art_layout 무시. 모든 작품 단일 디폴트(place 고정 좌표 + CSS 높이 고정).
  const mapWork = it => ({ id:it.id, img:it.img, t:it.name, a:it.artist,
    layers:it.layers||null, curation_links:it.curation_links||null });
  // 0629: standby 미리보기 제거 + 5방 고정 진열.
  // order = wk_id.desc(최신 먼저) → idx 0 = 1번방(최신 주차) … 작품은 주차 따라 뒤로 밀리고,
  // 방(배경·이름)은 번호에 고정. 다음 주차가 들어오면 자동으로 1번방, 나머지는 한 칸씩 뒤로.
  ROOMS = order.map((wk, idx)=>({
    wk, standby:false, bg: BGS[idx % BGS.length],
    tag:  ROOM_META[idx % ROOM_META.length].tag,
    tagk: ROOM_META[idx % ROOM_META.length].tagk,
    sub:  `ÉTAGE ${idx+1} · ${ROOM_META[idx % ROOM_META.length].tag} · ${ROOM_META[idx % ROOM_META.length].tagk}`,
    works: byWk[wk].map(mapWork)
  }));
}
async function loadMyRents(){
  const user=getUser(); if(!user){ MY_RENTS=new Set(); return; }
  try{
    const rows = await sbFetch(`/rest/v1/heritage_rentals?user_id=eq.${user.id}&returned_at=is.null&select=item_id`) || [];
    MY_RENTS = new Set(rows.map(r=>r.item_id));
  }catch(e){ MY_RENTS=new Set(); }
}

// ── 렌더 ──────────────────────────────────
function setBg(){ room.style.backgroundImage=`url(${RAW}${ROOMS[ri].bg})`; sub.textContent=ROOMS[ri].sub; }
function buildDots(){ dots.innerHTML=''; ROOMS[ri].works.forEach((_,i)=>{
  const d=document.createElement('span'); d.className='dot'+(i===wi?' on':''); dots.appendChild(d); }); }
// 0629: 모든 작품 같은 자리·같은 키. 명패는 작품(48vh) 바로 아래로 동적 배치.
const ART_TOP = 44;   // room 기준 %
function place(){ const rh=room.offsetHeight||1, artHpct=(innerHeight*0.48)/rh*100;
  art.style.width=''; art.style.left='50%'; art.style.top=ART_TOP+'%';
  plaque.style.left='50%'; plaque.style.top=(ART_TOP + artHpct/2 + 2.4)+'%';
  plaque.style.transform='translate(-50%,-50%)'; }
// 진입 시 작품을 화면 중앙보다 ENTER_OFFSET 만큼 아래로 (상단 세그먼트·타이틀 회피)
const ENTER_OFFSET = 62;
function enterCenter(){ const rh=room.offsetHeight,target=rh*(ART_TOP/100)-scroller.clientHeight/2 - ENTER_OFFSET;
  scroller.scrollTo({top:Math.max(0,target),behavior:'smooth'}); }
function renderRentBtn(){
  const w=curW(), mini=document.getElementById('rentMini');
  if(!mini) return;
  if(MY_RENTS.has(w.id)){ mini.textContent='✦'; mini.classList.add('have'); mini.title='내 분더카머에 있습니다'; }
  else { mini.textContent='🍎'; mini.classList.remove('have'); mini.title='분더카머로 가져가기'; }
}
function render(animate, roomChanged){
  const w=curW();
  const paint=()=>{
    if(roomChanged){ setBg(); room.style.opacity=1; showRoomTag(); }
    artImg.onerror=()=>{ artImg.src=NOIMG; };
    artImg.src=w.img||NOIMG; artImg.alt=w.t; ptT.textContent=w.t; ptA.textContent=w.a;
    place(); sub.textContent=`${ROOMS[ri].sub}  ·  ${wi+1} / ${ROOMS[ri].works.length}`;
    buildDots(); renderRentBtn();
    art.classList.remove('fade'); plaque.classList.remove('fade');
    setTimeout(()=>enterCenter(),20);
  };
  if(!animate){ paint(); return; }
  // 페이드아웃 + 새 그림(방 전환 시 새 배경까지) 프리로드를 동시에 → 셋 다 끝난 뒤 교체+페이드인.
  // 안 받아진 채 페이드인하면 직전 그림 번쩍 / 배경 깨졌다 뜨는 현상 방지.
  art.classList.add('fade'); plaque.classList.add('fade');
  if(roomChanged) room.style.opacity=0;
  let faded=false, imgReady=false, bgReady=!roomChanged;
  const tryPaint=()=>{ if(faded && imgReady && bgReady) paint(); };
  setTimeout(()=>{ faded=true; tryPaint(); }, roomChanged?360:240);
  const pre=new Image();
  pre.onload=pre.onerror=()=>{ imgReady=true; tryPaint(); };
  pre.src = w.img || NOIMG;
  if(roomChanged){
    const preBg=new Image();
    preBg.onload=preBg.onerror=()=>{ bgReady=true; tryPaint(); };
    preBg.src = RAW + ROOMS[ri].bg;
  }
}
function showRoomTag(){ roomtag.innerHTML=`${ROOMS[ri].tag}<small>${ROOMS[ri].tagk}</small>`;
  roomtag.classList.add('on'); setTimeout(()=>roomtag.classList.remove('on'),2500); }
function go(d){
  const n=ROOMS[ri].works.length; wi+=d;
  if(wi>=n||wi<0){
    if(wi>=n){ri=(ri+1)%ROOMS.length;wi=0;}else{ri=(ri-1+ROOMS.length)%ROOMS.length;wi=ROOMS[ri].works.length-1;}
    render(true, true);   // 방 전환: 그림+배경 둘 다 프리로드 후 크로스페이드
    return;
  }
  render(true);
}

function snapCheck(){ if(!editMode)return; const rh=room.offsetHeight, w=curW();

// 드래그 이동
function dragMove(el,key){
  let drag=false,sx,sy,bx,by;
  const start=(cx,cy)=>{ if(!editMode)return; drag=true;sx=cx;sy=cy; const w=curW();
    bx=key==='art'?w.x:w.px; by=key==='art'?w.y:w.py; el.style.cursor='grabbing'; };
  const move=(cx,cy)=>{ if(!drag)return; const rw=room.offsetWidth,rh=room.offsetHeight, w=curW();
    const nx=bx+((cx-sx)/rw)*100, ny=by+((cy-sy)/rh)*100;
    if(key==='art'){ w.x=+nx.toFixed(1); w.y=+ny.toFixed(1); } else { w.px=+nx.toFixed(1); w.py=+ny.toFixed(1); }
    placeCur(); };
  const end=()=>{ drag=false; el.style.cursor='grab'; };
  el.addEventListener('mousedown',e=>{ if(!editMode||e.target.dataset.h)return; e.preventDefault(); start(e.clientX,e.clientY);
    const mm=ev=>move(ev.clientX,ev.clientY),mu=()=>{end();removeEventListener('mousemove',mm);removeEventListener('mouseup',mu);};
    addEventListener('mousemove',mm);addEventListener('mouseup',mu); });
  el.addEventListener('touchstart',e=>{ if(!editMode||e.target.dataset.h)return; const t=e.touches[0]; start(t.clientX,t.clientY); },{passive:true});
  el.addEventListener('touchmove',e=>{ if(!drag)return; e.preventDefault(); const t=e.touches[0]; move(t.clientX,t.clientY); },{passive:false});
  el.addEventListener('touchend',end);
}
dragMove(art,'art'); dragMove(plaque,'plaque');

// 휠 크기
function wheelSize(el,fn){ el.addEventListener('wheel',e=>{ if(!editMode)return; e.preventDefault(); fn(e.deltaY<0?1:-1); placeCur(); },{passive:false}); }
wheelSize(art,d=>{ const w=curW(); w.size=Math.max(8,Math.min(90,+(w.size+d*1.2).toFixed(1))); });
wheelSize(plaque,d=>{ const w=curW(); w.psize=Math.max(50,Math.min(200,w.psize+d*4)); });

// 핸들 크기
function handleResize(el,key){
  const h=el.querySelector('.handle');
  const start=(cx)=>{ const w=curW(), base=key==='art'?w.size:w.psize, sx0=cx;
    return (nx)=>{ const d=(nx-sx0)/4;
      if(key==='art') w.size=Math.max(8,Math.min(90,+(base+d).toFixed(1)));
      else w.psize=Math.max(50,Math.min(200,base+d*1.5)); placeCur(); }; };
  h.addEventListener('mousedown',e=>{ if(!editMode)return; e.preventDefault();e.stopPropagation(); const mv=start(e.clientX);
    const mm=ev=>mv(ev.clientX),mu=()=>{removeEventListener('mousemove',mm);removeEventListener('mouseup',mu);};
    addEventListener('mousemove',mm);addEventListener('mouseup',mu); });
  h.addEventListener('touchstart',e=>{ if(!editMode)return; e.stopPropagation(); const mv=start(e.touches[0].clientX);
    const tm=ev=>{ev.preventDefault();mv(ev.touches[0].clientX);},tu=()=>{removeEventListener('touchmove',tm);removeEventListener('touchend',tu);};
    addEventListener('touchmove',tm,{passive:false});addEventListener('touchend',tu); },{passive:true});
}
handleResize(art,'art'); handleResize(plaque,'plaque');

document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight')go(1); if(e.key==='ArrowLeft')go(-1); });
let sx=0,sy=0,touching=false;
scroller.addEventListener('touchstart',e=>{
  if(e.touches.length===1){touching=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;}else touching=false; },{passive:true});
scroller.addEventListener('touchend',e=>{ if(!touching)return;touching=false;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5) go(dx<0?1:-1); },{passive:true});

function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const LAYER_LABELS = {
  knowledge:  '첫 번째 겹 · 앎',
  thought:    '두 번째 겹 · 사유',
  connection: '세 번째 겹 · 연결',
  curation:   '네 번째 겹 · 큐레이션',
  scene:      '장면'
};

function renderMarkdownStar(text) {
  if (!text) return '';
  const e = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return e
    .replace(/\*\*([^*\n]+?)\*\*/g, '<strong style="font-family:\'Noto Sans KR\',\'Apple SD Gothic Neo\',sans-serif;font-weight:700;color:var(--gold-l)">$1</strong>')
    .replace(/\*([^*\n]+?)\*/g, '<strong style="font-family:\'Noto Sans KR\',\'Apple SD Gothic Neo\',sans-serif;font-weight:600;color:var(--cream)">$1</strong>');
}

function renderCurationLinksStar(links) {
  if (!links) return '';
  const sections = [];
  const linkStyle = "color:var(--gold);text-decoration:none;border-bottom:1px solid var(--gold-dim);padding-bottom:1px";
  const stopProp = `onclick="event.stopPropagation()" ontouchstart="event.stopPropagation()"`;
  if (links.books && links.books.length > 0) {
    const bookCards = links.books.map(b => {
      const title = b.title || '';
      const meta = [b.translator && `${b.translator} 옮김`, b.publisher].filter(Boolean).join(' · ');
      const qFull  = encodeURIComponent((b.isbn ? [b.isbn] : [title, b.author, (b.translator || b.publisher)].filter(Boolean)).join(' '));
      const stores = [
        `<a href="https://www.google.com/search?q=${qFull}" target="_blank" rel="noopener" ${stopProp} style="${linkStyle}">책 찾기</a>`,
      ];
      return `
        <div style="padding:10px 0;border-bottom:1px solid var(--gold-faint);font-family:'Noto Serif KR',serif">
          <div style="font-size:13px;color:var(--cream);font-weight:500">${title}</div>
          ${meta ? `<div style="font-size:11px;color:var(--txt-soft);margin-top:3px">${meta}</div>` : ''}
          <div style="margin-top:6px;font-size:11px;letter-spacing:0.05em">${stores.join(' · ')}</div>
        </div>`;
    }).join('');
    sections.push(`<div style="margin-top:14px"><div style="font-size:10px;letter-spacing:0.18em;color:var(--gold-dim);margin-bottom:6px">📖 책</div>${bookCards}</div>`);
  }
  if (links.library_call_number) {
    sections.push(`
      <div style="margin-top:12px;padding:8px 0;border-bottom:1px solid var(--gold-faint);font-family:'Noto Serif KR',serif">
        <div style="font-size:10px;letter-spacing:0.18em;color:var(--gold-dim);margin-bottom:4px">🏛 도서관 청구기호</div>
        <div style="font-size:13px;color:var(--cream)">${links.library_call_number}</div>
      </div>`);
  }
  if (links.youtube_keywords && links.youtube_keywords.length > 0) {
    const ytLinks = links.youtube_keywords.map(kw =>
      `<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(kw)}" target="_blank" rel="noopener" ${stopProp} style="${linkStyle};display:inline-block;margin-right:10px;margin-top:4px">${kw}</a>`
    ).join('');
    sections.push(`
      <div style="margin-top:12px;padding:8px 0;font-family:'Noto Serif KR',serif">
        <div style="font-size:10px;letter-spacing:0.18em;color:var(--gold-dim);margin-bottom:4px">🎬 유튜브에서 더 보기</div>
        <div style="font-size:12px;line-height:2">${ytLinks}</div>
      </div>`);
  }
  return sections.length ? `<div style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--gold-faint)">${sections.join('')}</div>` : '';
}

function openArtLayers(item){
  if(!item) return;
  const src = item.layers || item.library;
  if(!src){ toast('이 작품의 4겹은 준비 중이에요'); return; }
  let blocks='';
  if(Array.isArray(src)){
    blocks = src.map((t,i)=>`<div class="layer-block"><div class="layer-tag">${i+1}번째 겹</div><div class="layer-text">${renderMarkdownStar(typeof t==='string'?t:JSON.stringify(t))}</div></div>`).join('<div class="layer-divider"></div>');
  } else if(typeof src==='object'){
    const order=['scene','knowledge','thought','connection','curation'];
    const keys=[...order.filter(k=>src[k]),...Object.keys(src).filter(k=>!order.includes(k))];
    blocks=keys.map(k=>`<div class="layer-block"><div class="layer-tag">${LAYER_LABELS[k]||escapeHtml(k)}</div><div class="layer-text">${renderMarkdownStar(src[k])}</div></div>`).join('<div class="layer-divider"></div>');
  } else {
    blocks=`<div class="layer-text">${renderMarkdownStar(src)}</div>`;
  }
  const curationHtml = item.curation_links ? renderCurationLinksStar(item.curation_links) : '';
  const panel=document.createElement('div'); panel.id='layers-panel';
  panel.innerHTML=`<div class="sheet-overlay" onclick="if(event.target===this)closeArtLayers()">
    <div class="sheet"><div class="sheet-handle"></div>
      <div class="sheet-eyebrow">Quatre Couches · 카리의 4겹</div>
      <div class="sheet-title">${escapeHtml(item.t)}</div>
      <div class="sheet-sub">${escapeHtml(item.a)}</div>
      ${blocks}${curationHtml}
      <button class="sheet-btn quiet" onclick="closeArtLayers()">닫기</button>
    </div></div>`;
  document.body.appendChild(panel); document.body.style.overflow='hidden';
}
function closeArtLayers(){ const p=document.getElementById('layers-panel'); if(p)p.remove(); document.body.style.overflow=''; }

function openRentPopup(){
  const user=getUser();
  if(!user){ toast('입장 후 빌릴 수 있습니다'); return; }
  const w=curW();
  if(MY_RENTS.has(w.id)){ toast('이미 분더카머에 있습니다 ✦'); return; }
  closeRentPopup();
  const panel=document.createElement('div'); panel.id='rent-popup';
  panel.innerHTML=`<div class="sheet-overlay" onclick="if(event.target===this)closeRentPopup()">
    <div class="sheet rent-sheet"><div class="sheet-handle"></div>
      <div class="rent-apple">🍎</div>
      <div class="sheet-title">이 그림을 내 분더카머로</div>
      <div class="rent-work">${escapeHtml(w.t)} · ${escapeHtml(w.a)}</div>
      <div class="rent-desc">작품이 당신의 분더카머로 떠납니다.<br>대여료는 <b>황금사과 1알</b>입니다.</div>
      <button class="sheet-btn" onclick="confirmRent()">신청하기 · 🍎 1알</button>
      <button class="sheet-btn quiet" onclick="closeRentPopup()">닫기</button>
    </div></div>`;
  document.body.appendChild(panel); document.body.style.overflow='hidden';
}
function closeRentPopup(){ const p=document.getElementById('rent-popup'); if(p)p.remove(); document.body.style.overflow=''; }
async function confirmRent(){ closeRentPopup(); await rentCurrent(); }

function openZoom(w){ if(!w) return;
  const z=document.getElementById('artZoom');
  document.getElementById('artZoomImg').src = w.img||NOIMG;
  document.getElementById('artZoomCap').innerHTML = `<b>${escapeHtml(w.t)}</b><span>${escapeHtml(w.a)}</span>`;
  z.hidden=false; document.body.style.overflow='hidden';
}
function closeZoom(){ const z=document.getElementById('artZoom'); if(z)z.hidden=true; document.body.style.overflow=''; }

</script>
