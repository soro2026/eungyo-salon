<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EG 분더카머 · 밀로의 비너스</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#000;font-family:"Noto Serif KR",Georgia,serif;}
  .room{
    position:relative; width:100%; height:100dvh; overflow:hidden;
    background:#1a0c10 center/cover no-repeat;
    background-image:url('https://raw.githubusercontent.com/soro2026/eungyo-salon/main/gallery_bg_02.webp');
  }
  model-viewer{
    position:absolute; left:50%; bottom:3%; transform:translateX(-50%);
    width:min(64vw,440px); height:82%;
    background:transparent; --poster-color:transparent; outline:none;
  }
  .tag{
    position:absolute; left:0; right:0; bottom:18px; text-align:center;
    color:#ece4d4; z-index:5; pointer-events:none; text-shadow:0 2px 14px #000;
  }
  .tag .ey{ letter-spacing:.3em; font-size:10px; color:#d8b878; text-transform:uppercase; }
  .tag h1{ margin:4px 0 2px; font-size:21px; font-weight:600; }
  .tag p{ margin:0; font-size:12px; color:#c9beac; }
  .hint{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    background:rgba(10,8,12,.74); border:1px solid #3a3038; color:#d8cdbb;
    font-size:12px; padding:7px 14px; border-radius:20px; z-index:6;
    max-width:90%; text-align:center;
  }
  .hint b{ color:#e0b878; }
</style>
</head>
<body>
  <div class="room">
    <div class="hint">손으로 <b>돌리고</b> · 휠/핀치로 <b>확대</b></div>
    <model-viewer
      src="https://cyhlotwdisjvoxvfkpnd.supabase.co/storage/v1/object/public/models/venus.glb"
      alt="밀로의 비너스"
      camera-controls auto-rotate auto-rotate-delay="0"
      rotation-per-second="14deg"
      shadow-intensity="1.0" shadow-softness="1" exposure="1.05"
      camera-orbit="0deg 88deg auto" min-camera-orbit="auto auto auto"
      max-camera-orbit="auto auto 600m" interaction-prompt="none">
    </model-viewer>
    <div class="tag">
      <div class="ey">EG 분더카머 · 1번 전시실</div>
      <h1>밀로의 비너스</h1>
      <p>Aphrodite of Milos · 기원전 100년경 · 루브르</p>
    </div>
  </div>
</body>
</html>
