<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EG 분더카머 · 1번 전시실</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#000;font-family:"Noto Serif KR",Georgia,serif;
    display:flex;align-items:center;justify-content:center;}
  .room{position:relative; height:100dvh; aspect-ratio:9/16; max-width:100vw;
    overflow:hidden; background:#1a0c10 center/cover no-repeat;}
  model-viewer{position:absolute; inset:0; width:100%; height:100%;
    background:transparent; --poster-color:transparent; outline:none;}
  .tag{position:absolute; left:0; right:0; bottom:16px; text-align:center;
    color:#ece4d4; z-index:5; pointer-events:none; text-shadow:0 2px 14px #000;}
  .tag .ey{letter-spacing:.3em; font-size:10px; color:#d8b878; text-transform:uppercase;}
  .tag h1{margin:4px 0 2px; font-size:21px; font-weight:600;}
  .tag p{margin:0; font-size:12px; color:#c9beac;}
  .hint{position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:rgba(10,8,12,.74); border:1px solid #3a3038; color:#d8cdbb;
    font-size:12px; padding:7px 14px; border-radius:20px; z-index:6;}
  .hint b{color:#e0b878;}
</style>
</head>
<body>
  <div class="room" id="room">
    <div class="hint">좌우로 <b>돌려보세요</b></div>
    <model-viewer id="mv" camera-controls disable-zoom disable-pan
      auto-rotate auto-rotate-delay="0" interaction-prompt="none"
      shadow-intensity="0.9" shadow-softness="1" exposure="1.05"></model-viewer>
    <div class="tag">
      <div class="ey" id="ey">EG 분더카머 · 1번 전시실</div>
      <h1 id="t"></h1><p id="s"></p>
    </div>
  </div>
<script type="module">
  const SUPA_URL='https://cyhlotwdisjvoxvfkpnd.supabase.co';
  const SUPA_KEY='sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
  const supa=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{storageKey:'eungyo-auth',persistSession:true}});
  const slug=new URLSearchParams(location.search).get('slug')||'venus';
  const mv=document.getElementById('mv');
  (async()=>{
    const { data, error }=await supa.from('wunderkammer_3d')
      .select('title_ko,title_en,era,location,glb_url,bg_url,pose').eq('slug',slug).single();
    if(error||!data){ document.getElementById('t').textContent='보물을 찾지 못했습니다'; return; }
    const p=data.pose||{};
    const theta=p.theta??0, phi=p.phi??86, radius=p.radius??340, fov=p.fov??32;
    const t=p.target||[0,0,0], spd=p.rotSpeed??14;
    if(data.bg_url) document.getElementById('room').style.backgroundImage=`url('${data.bg_url}')`;
    mv.src=data.glb_url;
    mv.cameraTarget=`${t[0]}m ${t[1]}m ${t[2]}m`;
    mv.cameraOrbit=`${theta}deg ${phi}deg ${radius}m`;
    mv.fieldOfView=`${fov}deg`;
    // 좌우 회전만 — 눈높이(phi)·거리(radius) 고정, 위아래 뒤집기 잠금
    mv.minCameraOrbit=`auto ${phi}deg ${radius}m`;
    mv.maxCameraOrbit=`auto ${phi}deg ${radius}m`;
    mv.setAttribute('rotation-per-second',`${spd}deg`);
    document.getElementById('t').textContent=data.title_ko||'';
    const sub=[data.title_en,data.era,data.location].filter(Boolean).join(' · ');
    document.getElementById('s').textContent=sub;
  })();
</script>
</body>
</html>
