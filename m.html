*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:'Noto Serif KR',serif;
  background:#0d1f1d;
  color:#2c2317;
  overflow-x:hidden;
}

/* ── 방 : 배경 넉 장이 화면에 고정된다 ── */
#room{
  position:fixed;inset:0;z-index:0;
  background-position:center top;
  background-size:cover;
  background-repeat:no-repeat;
  background-color:#0d1f1d;
  transition:opacity .6s ease;
}

/* ── 차림표 종이 : 식탁 위에 놓인 카드 ──
   폭 84% — 왼쪽 장미와 오른쪽 촛대가 양옆으로 삐져나온다.
   위 여백 48.2% — 실측한 창턱 아랫끝. 창을 덮지 않고 그 아래에서 시작. */
#paper{
  position:relative;z-index:1;
  width:84%;max-width:420px;
  /* 종이 윗머리 = 그림 높이의 30% (0729 소로 실기기 판단).
     처음엔 창턱 아랫끝 48.2%에 앉혔으나, 첫 화면에서 창이 화면 3분의 2를
     차지해 당혹스러웠다. 이제 아래 유리칸 한가운데(창살 12.4% ↔ 창턱 48.2%의
     중간)에 앉는다 — 나무와 하늘은 남고, 창턱과 아래 유리 절반을 종이가 덮는다.
     손에 든 차림표가 창 아랫부분을 가리는 것이 앉은 사람의 실제 시야이기도 하다.

     cover가 고른 배율이 무엇이든 맞도록 두 값 중 큰 쪽을 쓴다.
       · 폭이 기준일 때  → 0.23 × (100vw × 2.1667) = 50vw
       · 높이가 기준일 때 → 0.23 × 100vh          = 23vh */
  margin:max(23vh, 50vw) auto 0;
  padding:26px 20px 30px;
  background:rgba(244,238,226,.965);
  box-shadow:0 3px 30px rgba(0,0,0,.42),0 0 0 1px rgba(120,96,44,.18);
  text-align:center;
}
#paper::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 42% at 50% 0%,rgba(255,253,246,.5),transparent 58%);
}
/* 밤·저녁엔 종이도 촛불 아래 놓인다 */
body.dim #paper{
  background:rgba(233,220,192,.955);
  box-shadow:0 3px 34px rgba(0,0,0,.6),0 0 0 1px rgba(110,84,34,.24);
}
body.dim #paper::after{
  background:radial-gradient(150% 60% at 50% 20%,rgba(255,238,200,.4),transparent 60%),
             radial-gradient(140% 100% at 50% 52%,transparent 44%,rgba(38,24,8,.26));
}

}

.amuse::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

   보고 콜레주에서 낮 하늘을 만나면 한 손님 안에서 세계가 갈린다. */
function dstamp(){ var n=egSky.parts();
  return n.y+"."+pad(n.mo)+"."+pad(n.d)+" ("+DOW[n.dow]+")"; }
function today(){ return egSky.today(); }
function secToSeoulMidnight(){ return egSky.secToMidnight(); }
function go(url){ if(url) location.href = url; }

/* ══ 차림표 그리기 ══ */
function render(){
  var h = "";
  h += '<div class="mest">EG UNIVERSE</div><div class="mdate">'+dstamp()+'</div>';

  /* 아뮈즈부슈 — 대진과 시계만. 소리치지 않는다. */
  h += '<div class="amuse" id="amuse"><div class="a-fr">Amuse-bouche</div><div class="a-ko">아뮈즈부슈</div>'
     +   '<div class="a-vs" id="aVs"><span class="a-mid">오늘의 대진을 부르는 중</span></div>'
     +   '<div class="a-clock" id="aClock"></div></div>';

  SECTIONS.forEach(function(s){
    if (s.title){
      h += '<div class="menuhead">'+FLO+'<div class="menuko">'+s.ko+'</div><div class="menufr">'+s.fr+'</div></div><div class="sec">';
    } else {
      h += '<div class="sec'+(s.special?" special":"")+'"><div class="shead"><span class="sorn"></span><span class="sko">'+s.ko+'</span><span class="sfr">'+s.fr+'</span><span class="sorn"></span></div>';
    }
    s.keys.forEach(function(k){
      var u = U[k], fold = !!(u.org || u.list);
      h += '<div class="course'+(u.heart?" heart":"")+(u.soon?" soon":"")+(fold?" js-fold":"")+'" data-k="'+k+'">'
         +   '<div class="cname'+(u.br?" br":"")+'">'+esc(u.name)+'<span class="clatin">'+esc(u.latin)+'</span>'+(fold?CARET:"")+'</div>'
         +   '<div class="cnote">'+nl(u.note)+'</div>'
         +   (u.stat ? '<div class="cstat">'+esc(u.stat)+'</div>' : "");
      if (u.org) h += '<div class="listwrap" data-org="'+u.org+'"><div class="li empty">불러오는 중…</div></div>';
      if (u.children){
        h += '<div class="subs">';
        u.children.forEach(function(c,ci){
          h += '<div class="sub'+(c.list?" js-fold":"")+'" data-k="'+k+'" data-ci="'+ci+'">'
             +   '<div class="subname">'+esc(c.label)+(c.list?CARET:"")+'</div>'
             +   '<div class="subnote">'+esc(c.desc)+'</div>'
             +   (c.list ? listHtml(c.list) : "")
             + '</div>';
        });
        h += '</div>';
      }
      h += '</div>';
      if (u.after === "hr") h += '<div class="hr"></div>';
    });
    h += '</div>';
  });

  h += '<div class="mfoot">'+FLO
     +   '<div class="fquote">혼자 있어도 외롭지 않고,<br>함께여도 부대끼지 않는 식탁.</div></div>';
  h += '<div class="mlogout"><button type="button" id="btnOut">⎋ 로그아웃</button></div>';

  document.getElementById("paper").innerHTML = h;
  wire();
}

function listHtml(rows){
  var h = '<div class="listwrap">';
  rows.forEach(function(r){
    if (!r.c && !r.s){ h += '<div class="li empty">'+esc(r.n)+'</div>'; return; }
    h += '<div class="li'+(r.go?" js-go":"")+'"'+(r.go?' data-go="'+esc(r.go)+'"':"")+'>'
       +   '<span class="li-n">'+esc(r.n)+'</span>'
       +   (r.c ? '<span class="li-c">'+esc(r.c)+'</span>' : "")
       +   (r.s ? '<span class="li-s">'+esc(r.s)+'</span>' : "")
       + '</div>';
  });
  return h + '</div>';
}

/* ══ 손가락 배선 — 인라인 onclick 없음 (0728 함정 B) ══ */
function wire(){
  var paper = document.getElementById("paper");

  paper.addEventListener("click", function(e){
    /* ① 목록 한 줄 → 그 곳으로 */
    var li = e.target.closest(".li.js-go");
    if (li){ e.stopPropagation(); go(li.getAttribute("data-go")); return; }

    /* ② 하위 카드 (미술관·콘서트) */
    var sub = e.target.closest(".sub");
    if (sub){
      e.stopPropagation();
      if (sub.classList.contains("js-fold")) sub.classList.toggle("open");
      return;
    }

    /* ③ 코스 한 줄 */
    var c = e.target.closest(".course");
    if (!c) return;
    var u = U[c.getAttribute("data-k")];
    if (!u) return;
    if (c.classList.contains("js-fold")){
      c.classList.toggle("open");
      if (u.org && c.classList.contains("open")) loadOrgs(u.org, c.querySelector(".listwrap"));
      return;
    }
    if (u.soon) return;                 /* 거절이 아니라 예고. 아무 일도 안 일어난다 */
    go(u.go);
  });

  document.getElementById("amuse").addEventListener("click", function(){
    location.href = "stadium_v2.html";
  });

  document.getElementById("btnOut").addEventListener("click", async function(){
    try{ await supa.auth.signOut({ scope:"local" }); }catch(e){}
    location.replace("index.html");
  });
}

/* ══ 들르기 목록 — code 기준 한 곳당 한 줄 (0728 규칙 7) ══ */
async function loadOrgs(kind, box){
  if (!box) return;
  if (orgCache[kind]){ paintOrgs(kind, box); return; }
  try{
    var res = await fetch(SUPA_URL+"/rest/v1/"+ORG[kind].tbl+"?select=code,name,city&order=name",
      { headers:{ apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY } });
    var j = await res.json();
    var seen = {}, out = [];
    if (Array.isArray(j)) j.forEach(function(o){
      if (!o || !o.code || seen[o.code]) return;
      seen[o.code] = 1; out.push(o);
    });
    orgCache[kind] = out;
  }catch(e){
    console.warn(ORG[kind].tbl+" 로드 실패:", e);
    orgCache[kind] = [];
  }
  paintOrgs(kind, box);
}

function paintOrgs(kind, box){
  var rows = orgCache[kind] || [];
  if (!rows.length){ box.innerHTML = '<div class="li empty">아직 준비 중입니다</div>'; return; }
  box.innerHTML = rows.map(function(o){
    var url = ORG[kind].shell + "?org=" + encodeURIComponent(o.code) + "&v=" + Date.now();
    return '<div class="li js-go" data-go="'+esc(url)+'">'
         +   '<span class="li-n">'+esc(o.name || o.code)+'</span>'
         +   (o.city ? '<span class="li-c">'+esc(o.city)+'</span>' : "")
         + '</div>';
  }).join("");
}

/* ══ 아뮈즈부슈 — 오늘의 대진 ══ */
var TEAM_KO = { soro:"SORO", socrates:"SOCRATES", pascal:"PASCAL", proust:"PROUST" };
var TEAMS   = { soro:1, socrates:1, pascal:1, proust:1 };
function teamName(t){ return TEAM_KO[t] || String(t||"").toUpperCase(); }

/* 엠블럼은 720×720 원본(최대 287KB)이 아니라 144×144 webp를 쓴다.
   폰 첫 화면에 두 장이 뜨는데 원본이면 배경 넉 장보다 무겁다 — 0729 실측 804KB→39KB.
   그림을 못 받으면 팀 이름으로 조용히 물러난다 (onerror). */
function emblem(t, isMine){
  var cls = "a-em" + (isMine ? " me" : "");
  if (!TEAMS[t]) return '<span class="a-team'+(isMine?" me":"")+'">'+esc(teamName(t))+'</span>';
  return '<img class="'+cls+'" src="emblem_'+t+'_s.webp?v='+DAYV+'"'
       + ' alt="'+esc(teamName(t))+'" data-fb="'+esc(teamName(t))+'">';
}

/* 그림을 못 받으면 팀 이름으로 물러난다. 인라인 onerror를 쓰지 않는다 — 이 파일 규칙 3. */
function wireEmblemFallback(box){
  box.querySelectorAll("img.a-em").forEach(function(img){
    img.addEventListener("error", function(){
      var me = img.classList.contains("me") ? " me" : "";
      var s = document.createElement("span");
      s.className = "a-team" + me;
      s.textContent = img.getAttribute("data-fb") || "";
      img.replaceWith(s);
    });
  });
}

/* ⚠ matches는 익명 키로 못 읽는다 — 0729 RLS 실측.
     정책: SELECT USING (auth.uid() = user_id)
   그러니 raw fetch에 SUPA_KEY를 얹으면 auth.uid()가 NULL이 되어 0건이 온다.
   supa.from(...)을 쓰면 로그인한 손님의 토큰이 자동으로 실린다.
   (popup_orgs·palais_orgs는 read all이라 raw fetch로도 읽힌다 — 그쪽은 그대로 둔다.) */
async function loadMatch(){
  var vs = document.getElementById("aVs");

  var m = null;
  try{
    var r = await supa
      .from("matches")
      .select("home_team,away_team,is_my_game,status,home_score,away_score")
      .eq("match_date", today())
      .eq("is_my_game", true)
      .limit(1);
    if (r.error) throw r.error;
    if (r.data && r.data.length) m = r.data[0];
  }catch(e){ console.warn("matches 로드 실패:", e); }

  if (!m){
    vs.innerHTML = '<span class="a-mid">오늘 경기는 곧 열립니다</span>';
    return;
  }

  /* 내 경기에서 콩파뇽의 팀은 언제나 soro다 (0729 실측 — is_my_game 14건 전부).
     terra 안내판 관례를 따라 내 팀을 앞에 놓고, 내 엠블럼에만 금빛 후광을 둔다. */
  var left, right, mine = m.is_my_game ? "soro" : null;
  if (mine && m.home_team === mine){ left = m.home_team; right = m.away_team; }
  else                             { left = m.away_team; right = m.home_team; }

  vs.innerHTML = emblem(left, left===mine)
               + '<span class="a-mid">vs</span>'
               + emblem(right, right===mine);
  wireEmblemFallback(vs);

  if (m.status === "completed" || m.home_score !== null){
    document.getElementById("aClock").outerHTML =
      '<div class="a-done">오늘 경기는 끝났습니다 · 내일 또</div>';
  } else {
    startClock();
  }
}

/* 서울 자정까지 — 하루 한 경기가 닫히는 시각.
   ⚠ 스타디움의 「정식 경기까지」(18:30)와는 재는 것이 다르다.
     18:30은 야구장의 정식 시각일 뿐이고, 타석이 실제로 닫히는 것은 자정이다.
     두 숫자가 다른 것이 옳으므로, 무엇까지인지 라벨로 밝힌다. */
function startClock(){
  var el = document.getElementById("aClock");
  if (!el) return;
  if (!document.getElementById("aClockLab")){
    var lab = document.createElement("div");
    lab.id = "aClockLab"; lab.className = "a-lab";
    lab.textContent = "타석 마감까지";
    el.parentNode.insertBefore(lab, el);
  }
  function tick(){
    var s = secToSeoulMidnight();
    el.textContent = pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60);
  }
  tick(); setInterval(tick, 1000);
}

/* ══ 문 열기 ══ */
async function boot(){
  paintRoom();
  setInterval(paintRoom, 60000);      /* 보초 60초 — 시간대가 넘어가면 방이 스스로 바뀐다 */
  render();

  /* 로그인 안 한 손님은 현관으로. 묻지 않고 조용히. */
  try{
    var s = await supa.auth.getSession();
    if (!s || !s.data || !s.data.session){ location.replace("index.html"); return; }
  }catch(e){}

  loadMatch();
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
</script>
