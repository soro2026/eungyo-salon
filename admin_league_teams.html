<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EG 리그 팀 자산 콘솔</title>
<!--
 *  admin_league_teams v1.0 — 0803 · 살롱지기 전용
 *  싱글A~트리플A 팀 자산(엠블럼·초상·구장 명칭·좌표) 입고 콘솔
 *  몸: league_teams 테이블 · 옷장: Storage league-assets 버킷
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#14100c; --card:#1e1813; --line:#3a2f24; --line-soft:#2a221a;
  --ink:#e8ddcf; --ink2:#a89880; --ink3:#6f6252; --gold:#c9a24a; --green:#7ba05b; --red:#c06a5a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',-apple-system,sans-serif;
  padding:28px 18px 80px;max-width:900px;margin:0 auto}
h1{font-family:'Noto Serif KR',serif;font-size:21px;color:var(--gold);letter-spacing:.5px}
.sub{font-size:12px;color:var(--ink3);margin:6px 0 20px;line-height:1.7}
.rule{font-size:11.5px;color:var(--ink2);background:var(--card);border:1px solid var(--line-soft);
  border-radius:10px;padding:12px 14px;line-height:1.8;margin-bottom:22px}
.rule b{color:var(--gold)}
#gateMsg{display:none;text-align:center;padding:60px 20px;color:var(--ink2);line-height:2;
  font-family:'Noto Serif KR',serif;font-size:15px}
#panel{display:none}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:8px 16px;border:1px solid var(--line);border-radius:20px;font-size:13px;
  color:var(--ink2);cursor:pointer;background:none;transition:.15s}
.tab.on{border-color:var(--gold);color:var(--gold);background:rgba(201,162,74,.08)}
.team{background:var(--card);border:1px solid var(--line-soft);border-radius:16px;
  padding:18px;margin-bottom:16px}
.team-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.team-code{font-size:16px;font-weight:800;letter-spacing:1px;color:var(--ink)}
.team-league{font-size:10.5px;color:var(--ink3);border:1px solid var(--line);
  border-radius:10px;padding:2px 8px}
.team-active{margin-left:auto;font-size:11px;color:var(--ink3);cursor:pointer;
  border:1px solid var(--line);border-radius:12px;padding:3px 10px}
.team-active.on{color:var(--green);border-color:var(--green)}
.grid{display:grid;grid-template-columns:110px 110px 1fr;gap:14px}
@media(max-width:620px){.grid{grid-template-columns:1fr 1fr}}
.drop{width:110px;height:110px;border:1.5px dashed var(--line);border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  cursor:pointer;font-size:10.5px;color:var(--ink3);text-align:center;position:relative;
  overflow:hidden;background:#181310;transition:.15s}
.drop:hover{border-color:var(--gold);color:var(--gold)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0e0b08}
.drop .tag{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);
  font-size:9.5px;padding:3px;color:var(--ink2);z-index:2}
.fields{display:flex;flex-direction:column;gap:8px}
@media(max-width:620px){.fields{grid-column:1/-1}}
.fields label{font-size:10px;color:var(--ink3);letter-spacing:.5px}
.fields input{background:#181310;border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;color:var(--ink);font-size:13px;width:100%}
.fields input:focus{outline:none;border-color:var(--gold)}
.coords{display:flex;gap:8px}
.row-btns{display:flex;gap:10px;margin-top:14px;align-items:center}
.save{background:var(--gold);color:#1a1508;border:none;border-radius:10px;
  padding:9px 22px;font-size:13px;font-weight:700;cursor:pointer}
.save:disabled{opacity:.4;cursor:default}
.hint{font-size:10.5px;color:var(--ink3)}
.hint.warn{color:var(--red)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:#2a2118;border:1px solid var(--gold);color:var(--ink);font-size:13px;
  padding:10px 22px;border-radius:24px;opacity:0;pointer-events:none;transition:.3s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<h1>⚾ 리그 팀 자산 콘솔</h1>
<div class="sub">싱글A · 더블A · 트리플A 팀의 옷을 입히는 곳 — 엠블럼 · 선수 초상 · 홈구장 명칭 · 좌표</div>

<div class="rule">
  <b>엠블럼 3규칙</b> — ①형태 하나로 승부(잔가지 장식 금지) ②글자 없이 또는 큼직한 이니셜 한 자만 ③굵은 윤곽선 + 배경 투명.
  한 장(정사각 512×512 webp)이면 타륜의 24px까지 다 삽니다.<br>
  <b>선수 초상</b> — 정사각 800×800. &nbsp;·&nbsp; <b>좌표</b> — 소수점 <b>5자리</b> · 신뢰 소스 실측만(기억 금지). 저장 후 파이스가 MCP로 검산합니다.
</div>

<div id="gateMsg"></div>

<div id="panel">
  <div class="tabs" id="tabs"></div>
  <div id="teams"></div>
</div>

<input type="file" id="filePick" accept="image/*" style="display:none">
<div id="toast"></div>

<script>
const SUPA_URL='https://cyhlotwdisjvoxvfkpnd.supabase.co';
const SUPA_KEY='sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
const supa=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{storageKey:'eungyo-auth'}});
const BUCKET='league-assets';
const PUB=p=>`${SUPA_URL}/storage/v1/object/public/${BUCKET}/${p}`;
console.log("%c[EG] admin_league_teams v1.0 · 0803 팀 자산 콘솔 개관","color:#c9a24a");

const LEAGUES=[['SINGLE_A','싱글A'],['DOUBLE_A','더블A'],['TRIPLE_A','트리플A'],['ROOKIE','루키(참고)']];
const LG_LABEL=Object.fromEntries(LEAGUES);
let TEAMS=[], curLeague='SINGLE_A', pickTarget=null;

const emblemPath=c=>`emblem/${c}.webp`;
const portraitPath=c=>`portrait/${c}.webp`;

function toast(m){const t=document.getElementById('toast');t.textContent=m;
  t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2800);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function init(){
  const { data:{ user } } = await supa.auth.getUser();
  const gate=document.getElementById('gateMsg');
  if(!user){ gate.style.display='block';
    gate.innerHTML='살롱지기 전용 콘솔입니다.<br>은교살롱에 로그인한 뒤 다시 들러 주세요.'; return; }
  const { data:u } = await supa.from('users').select('is_admin').eq('id',user.id).single();
  if(!u || !u.is_admin){ gate.style.display='block';
    gate.innerHTML='이 문은 살롱지기의 열쇠로만 열립니다. 🗝️'; return; }
  document.getElementById('panel').style.display='block';
  renderTabs();
  await loadTeams();
}

function renderTabs(){
  document.getElementById('tabs').innerHTML=LEAGUES.map(([k,l])=>
    `<button class="tab${k===curLeague?' on':''}" onclick="switchLeague('${k}')">${l}</button>`).join('');
}
function switchLeague(k){ curLeague=k; renderTabs(); renderTeams(); }

async function loadTeams(){
  const { data, error } = await supa.from('league_teams').select('*').order('sort');
  if(error){ toast('팀 목록을 못 읽었습니다: '+error.message); return; }
  TEAMS=data||[];
  renderTeams();
}

function imgTag(url, tag){
  if(!url) return `<span>업로드<br>(끌어놓기 · 클릭)</span><div class="tag">${tag}</div>`;
  const src = url.startsWith('http') ? url : (url.includes('/') ? PUB(url) : url);
  return `<img src="${esc(src)}?v=${Date.now()%1e7}" alt=""><div class="tag">${tag}</div>`;
}

function renderTeams(){
  const list=TEAMS.filter(t=>t.league===curLeague);
  const ro = curLeague==='ROOKIE';
  document.getElementById('teams').innerHTML=list.map(t=>`
  <div class="team" data-code="${t.code}">
    <div class="team-head">
      <span class="team-code">${esc(t.name_en)}</span>
      <span class="team-league">${LG_LABEL[t.league]||t.league}</span>
      <span class="team-active${t.active?' on':''}" onclick="toggleActive('${t.code}')">${t.active?'● 활성':'○ 대기'}</span>
    </div>
    <div class="grid">
      <div class="drop" onclick="pick('${t.code}','emblem')"
           ondragover="event.preventDefault()" ondrop="dropFile(event,'${t.code}','emblem')">
        ${imgTag(t.emblem_url,'엠블럼 512²')}
      </div>
      <div class="drop" onclick="pick('${t.code}','portrait')"
           ondragover="event.preventDefault()" ondrop="dropFile(event,'${t.code}','portrait')">
        ${imgTag(t.portrait_url,'초상 800²')}
      </div>
      <div class="fields">
        <div><label>한글 표기</label>
          <input data-f="name_kr" value="${esc(t.name_kr)}" placeholder="예: 카프카" ${ro?'disabled':''}></div>
        <div><label>홈구장 명칭</label>
          <input data-f="stadium_name" value="${esc(t.stadium_name)}" placeholder="예: 프라하 캐슬 파크" ${ro?'disabled':''}></div>
        <div class="coords">
          <div style="flex:1"><label>위도 (소수점 5자리)</label>
            <input data-f="lat" value="${t.lat==null?'':t.lat}" placeholder="50.09033" ${ro?'disabled':''}></div>
          <div style="flex:1"><label>경도</label>
            <input data-f="lng" value="${t.lng==null?'':t.lng}" placeholder="14.40046" ${ro?'disabled':''}></div>
        </div>
      </div>
    </div>
    <div class="row-btns">
      <button class="save" onclick="saveTeam('${t.code}')" ${ro?'disabled':''}>저장</button>
      <span class="hint" id="hint-${t.code}">${ro?'루키 4팀은 레포 엠블럼으로 이미 가동 중 — 열람만':''}</span>
    </div>
  </div>`).join('');
}

/* ── 업로드 ── */
function pick(code,kind){ if(curLeague==='ROOKIE'){toast('루키 팀은 열람 전용입니다');return;}
  pickTarget={code,kind}; document.getElementById('filePick').click(); }
document.getElementById('filePick').addEventListener('change',e=>{
  if(e.target.files[0] && pickTarget) upload(pickTarget.code,pickTarget.kind,e.target.files[0]);
  e.target.value=''; });
function dropFile(e,code,kind){ e.preventDefault();
  if(curLeague==='ROOKIE'){toast('루키 팀은 열람 전용입니다');return;}
  if(e.dataTransfer.files[0]) upload(code,kind,e.dataTransfer.files[0]); }

async function upload(code,kind,file){
  const path = kind==='emblem' ? emblemPath(code) : portraitPath(code);
  toast('올리는 중…');
  const { error } = await supa.storage.from(BUCKET)
    .upload(path,file,{ upsert:true, contentType:file.type||'image/webp', cacheControl:'300' });
  if(error){ toast('업로드 실패: '+error.message); return; }
  const col = kind==='emblem' ? 'emblem_url' : 'portrait_url';
  const { error:e2 } = await supa.from('league_teams')
    .update({ [col]: path, updated_at:new Date().toISOString() }).eq('code',code);
  if(e2){ toast('경로 기록 실패: '+e2.message); return; }
  toast(`${code} ${kind==='emblem'?'엠블럼':'초상'} 입고 완료 ✓`);
  await loadTeams();
}

/* ── 텍스트·좌표 저장 ── */
async function saveTeam(code){
  const card=document.querySelector(`.team[data-code="${code}"]`);
  const get=f=>card.querySelector(`input[data-f="${f}"]`).value.trim();
  const latS=get('lat'), lngS=get('lng');
  const hint=document.getElementById('hint-'+code);
  const patch={ name_kr:get('name_kr')||null, stadium_name:get('stadium_name')||null,
                updated_at:new Date().toISOString() };
  // 좌표 검증: 둘 다 비우거나 둘 다 채우거나 · 숫자 · 소수점 5자리 이상 권고
  if((latS==='')!==(lngS==='')){ hint.className='hint warn';
    hint.textContent='위도·경도는 함께 넣거나 함께 비웁니다'; return; }
  if(latS!==''){
    const lat=Number(latS), lng=Number(lngS);
    if(!isFinite(lat)||!isFinite(lng)||lat<-90||lat>90||lng<-180||lng>180){
      hint.className='hint warn'; hint.textContent='좌표 숫자가 이상합니다'; return; }
    const dec=s=>(s.split('.')[1]||'').length;
    if(dec(latS)<5||dec(lngS)<5){ hint.className='hint warn';
      hint.textContent='소수점 5자리 규칙 — 신뢰 소스에서 다시 실측해 주세요'; return; }
    patch.lat=lat; patch.lng=lng;
  } else { patch.lat=null; patch.lng=null; }
  const { error } = await supa.from('league_teams').update(patch).eq('code',code);
  if(error){ hint.className='hint warn'; hint.textContent='저장 실패: '+error.message; return; }
  hint.className='hint'; hint.textContent='저장 완료 ✓';
  toast(code+' 저장 완료');
  const t=TEAMS.find(x=>x.code===code); Object.assign(t,patch);
}

async function toggleActive(code){
  if(curLeague==='ROOKIE'){toast('루키 팀은 열람 전용입니다');return;}
  const t=TEAMS.find(x=>x.code===code); if(!t) return;
  const { error } = await supa.from('league_teams')
    .update({ active:!t.active, updated_at:new Date().toISOString() }).eq('code',code);
  if(error){ toast('전환 실패: '+error.message); return; }
  t.active=!t.active; renderTeams();
  toast(`${code} ${t.active?'활성 ●':'대기 ○'}`);
}

init();
</script>
</body>
</html>
