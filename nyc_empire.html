<script>
/* ══════════════════ 상수 — terra.html과 같은 값 ══════════════════ */
const GOOGLE_API_KEY = "AIzaSyAAKQijLeTABmyi25BX4_qGsgghOhQCa6A";
const SUPA_URL = "https://cyhlotwdisjvoxvfkpnd.supabase.co";
const SUPA_KEY = "sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR";

const supa = supabase.createClient(SUPA_URL, SUPA_KEY, {
  auth:{ storageKey:'eungyo-auth', persistSession:true, autoRefreshToken:true }
});

/* ── 엠파이어 스테이트 빌딩 ──
   ⭐ 0829 소로가 좌표편집기로 지붕을 클릭해 잡은 실측값. 위키 인포박스(초 단위
     반올림 ≈±15m)를 대신한다. 지붕 H는 그 자리에서 412.9m 로 나왔다.
   ⚠ 다시 잡으실 수 있게 편집 모드는 그대로 둔다. */
/* ⭐ 0829 소로 지급 — 40°44'54.36"N 73°59'08.35"W (안테나 하단 기준으로 뽑으심) */
let BLD = { key:"empire", name:"엠파이어 스테이트 EG",
            lat:40.748433, lng:-73.985653, roof:null, ceil:270, floor:155 };
/* ⭐ 바닥 155m — 엠파이어는 30층(약 111m) 아래로 벽이 넓어진다. 그 위에 세워
   호메로스가 튀어나온 벽에 묻히지 않게 했다. 소로가 슬라이더로 다시 잡으실 수 있다. */
/* ⚠ 지붕 H·천장은 이제 건물마다 제 칸(b.roof · b.ceil)에 산다 —
     건물이 둘 이상이 된 순간 전역 하나로는 못 담는다. 아래 둘은 열린 건물의 창구다. */

/* ⭐ 0829 소로 — 「간판은 내가 입주한 건물만. 다른 건물은 노란 핀만, 클릭하면 현관」.
   시험판의 「다른 건물」로 크라이슬러를 세운다 — 핀 하나와 현관 팝업뿐, 간판·격자 없음.
   ⚠ 좌표는 위키 인포박스 초 단위 반올림(±15m) — 편집 모드에서 지붕을 클릭해 재잡는다.
   실판에서는 이 배열이 buildings 표 한 판이 된다 (결정문 13호). */
const OTHERS = [
  /* ⚠ 0829 소로 실화면 정정 — 위키 초 단위 좌표(40.751667, −73.975278)가 첨탑 중앙에서
     북동으로 ~20m 빗나가 옆 지붕에 앉았다. 위에서 본 판을 보고 남서로 되돌린다.
     ⭐ 그래도 근사값이다 — 편집 모드에서 첨탑 꼭대기를 클릭해 확정한다. */
  /* ⭐ 0829 소로 지급 — 40°45'05.86"N 73°58'31.31"W */
  { key:"chrysler", name:"크라이슬러 EG", lat:40.751628, lng:-73.975364, roof:null, ceil:null }
];
/* ⭐ 0829 소로 — 「크라이슬러 핀을 누르면 간판이 보이게」.
   격자·간판이 이제 **열린 건물**을 따라간다. 핀을 누르면 그 건물이 열리고,
   전에 열려 있던 건물은 핀만 남는다 — 언제나 한 채만 간판을 갖는다.
   ⭐⭐ 이것이 실판의 그림이기도 하다: 콩파뇽에게 열려 있는 건물은 자기가 사는 곳 하나,
      나머지 뉴욕 열아홉 채는 핀과 현관뿐 (결정문 8·9호). */
let OPEN = null;                       // 지금 간판이 걸린 건물 (init에서 BLD로)
function allBlds(){ return [BLD].concat(OTHERS); }

/* ── 54칸 배분 — 값 셋뿐이다. 화면 손잡이를 만들지 않는다 ──
   ⭐ 높이를 층으로, 둘레를 면으로. 기계가 나눈다 (결정문 8호).
   ⚠ 정확도는 필요 없다 — 어느 칸이 누구 것인지 아무도 대조하지 않는다. */
const FACES = 4, FCOLS = 2, TIERS = 27;        // ⭐ 4면 × 2열 × 27단 = 216
const SLOT_N = FACES * FCOLS * TIERS;
const TOP_DROP = 62;             // 천장 기본값 — 지붕에서 이만큼 내려온 곳
const BOT_DROP = 254;            // 바닥 기본값 — 지붕에서 이만큼 내려온 곳
/* ⚠⚠ 0829 소로 — 「호메로스가 맨 아래 깔렸다. 저 부분 벽이 튀어나와서」.
     천장만 두고 간격을 상수(7.4m)로 고정했더니 격자 바닥이 어디에 닿는지
     아무도 안 보고 있었다. 엠파이어는 30층 아래로 벽이 넓어지는데 거기까지 내려갔다.
   ⭐ 간격을 상수에서 뺀다 — **천장과 바닥을 소로가 잡고, 간격은 그 사이에서 나온다.**
     건물마다 「간판을 걸 수 있는 벽 구간」이 다르므로 이 둘이 그 건물의 값이다.
     실판 buildings 표의 칸 둘(ceil · floor)이 그대로 여기서 나온다. */
const tierGap = b => ((b.ceil!=null?b.ceil:0) - (b.floor!=null?b.floor:0)) / (TIERS-1);
/* ⚠ 엠파이어 스테이트는 계단식이다. 30층(약 111m) 아래는 타워가 넓어져
     반경 34m 고리가 벽 안에 묻힌다. 맨 아랫단을 지붕에서 238m(약 43층)에
     두어 본 타워 안에 머물게 했다.
   ⭐ 화면을 보시고 「더 밖으로」·「더 위로」 하시면 이 두 값만 고친다.
      화면에 손잡이를 만들지 않는다 — 어제 실패가 손잡이 여섯이었다. */

/* ── 거리 조건 (결정문 10호) ──
   ⚠⚠ 0829 소로 정정 — 첫 판이 틀렸다. 내 창을 2.2km 로 두었더니 지붕 명패만
      보이는 거리에서 정작 내 집이 사라졌다. 「멀리서 건물 명패 하나 + 내 창 하나」가
      결정문 8호의 그림인데, 그 둘의 거리를 다르게 매긴 것이 어긋남이었다.
   ⭐ 내 창은 지붕 명패와 **같은 거리**를 쓴다. 둘이 함께 뜨고 함께 진다. */
const D_ROOF = 30000;           // 건물 명패 30km
const D_MINE = 30000;           // ⭐ 내 집 — 지붕 명패와 같다
const D_WIN  = 1300;            // 이웃 53칸 — 가까이 가야 보인다

/* ── 실물 간판 (0829 네 번째 정정) ──
   ⚠⚠ 빌보드는 언제나 카메라를 마주보는 물건이라 어디에 두어도 벽 간판이 못 된다.
      밖에 두면 허공에 뜨고(시차), 중심에 넣으면 건물만 돌고 명패는 제자리다 —
      소로 진단 「안에서 빙글빙글」. 값이 아니라 물건이 틀렸던 것이다.
   ⭐ 그래서 가까이서는 **실제 수직면(wall)에 명패를 바른다.** 벽과 함께 돌고,
      뒤에서는 건물에 가려지고, 가까울수록 커진다 — 실물 간판의 세 성질 그대로.
   ⭐ 멀리서는 기존 중심축 명패로 갈아탄다. 소로 — 「조금 멀리서 보면 근사한데」.
      멀면 시차가 안 읽히므로 빌보드가 다시 옳은 물건이 된다. */
const GRID_AZ  = 29;            // 맨해튼 격자 기울기 (진북에서 동으로 29°)
const AZ_FACE  = f => (180 + GRID_AZ - 90*f + 360) % 360;   // 남209 · 동119 · 북29 · 서299
const OUT_FACE = [23, 32, 23, 32];     // 벽 밖 — 남북 반폭 21.5 · 동서 반폭 30.5 (+1.5)
const COL_OFF  = [15, 10.5, 15, 10.5]; // 한 면 두 열의 벌림
/* ⭐ 간판 키는 상수가 아니라 **단 간격의 70%**다. 구간을 좁히면 간판도 함께 작아져
     27단이 어떤 구간에서도 겹치지 않는다 — 손잡이를 늘리지 않고 겹침을 없앤다. */
const signH = b => Math.min(5, Math.max(2.2, tierGap(b || OPEN || BLD) * 0.7));
const SIGN_ASPECT = 2.8;        // 간판 폭 상한 = 키 × 2.8 (긴 닉네임은 글자가 맞춰 줄어든다)
const D_SIGN   = 1500;          // 여기까지 간판 · ⭐ 그 너머는 내 것만 (소로 손짓)
const SHOW_PER_FACE = 5;        // ⭐ 접속마다 각 면에서 다섯 장만 추첨해 건다 (내 것은 언제나)

/* ⭐ 0829 소로 — 지붕 명패는 점만 두고 호버에서 이름이 뜬다.
   ⚠ 그런데 터치에는 호버가 없다. 폰에서 명패를 숨기면 그 건물이 무엇인지
     영영 읽을 길이 없어진다(탭은 이미 강하에 쓰이고 있다 — 한 손짓에 두 일을
     맡기지 않는다). 그래서 **마우스가 있는 기기에서만** 숨긴다.
   ⚠ eg_device.js 를 끌어오지 않는다. 그 부품은 「폰인가」를 재는 것이고
     여기서 물어야 할 것은 「마우스가 있는가」다 — 아이패드는 폰이 아니지만
     호버가 없다. 판정 하나에 두 가지 일을 맡기면 곧 어긋난다. */
const CAN_HOVER = (window.matchMedia && window.matchMedia('(hover: hover)').matches);

let viewer, tileset, roofEnt=null, winEnts=[], rows=[], hoveredEnt=null, signEnts=[];
Object.defineProperty(window, 'ROOF_H', { get:()=> (OPEN||BLD).roof, set:v=>{ (OPEN||BLD).roof = v; } });
Object.defineProperty(window, 'CEIL',   { get:()=> (OPEN||BLD).ceil, set:v=>{ (OPEN||BLD).ceil = v; } });
let myUid=null, asNick=null;          // asNick: 시점 전환으로 고른 닉네임
let showRoof=true, showMine=true, showNbr=false;   /* ⭐ 슬롯 점은 처음엔 꺼 둔다 */
let EDIT_MODE=false, MOVING=false;

const $ = id => document.getElementById(id);
const hint = html => { const h=$("hint"); h.innerHTML=html; h.classList.add("in"); };
const hintOff = () => $("hint").classList.remove("in");

/* ══════════════════ 시작 ══════════════════ */
(async function init(){
  viewer = new Cesium.Viewer("cesiumContainer",{
    baseLayer:false, baseLayerPicker:false, geocoder:false, homeButton:false,
    sceneModePicker:false, navigationHelpButton:false, animation:false,
    timeline:false, fullscreenButton:false, infoBox:false, selectionIndicator:false,
    requestRenderMode:false
  });
  window.viewer = viewer;
  viewer.clock.clockStep = Cesium.ClockStep.SYSTEM_CLOCK;
  viewer.clock.shouldAnimate = true;
  viewer.scene.screenSpaceCameraController.minimumZoomDistance = 40;
  viewer.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);
  viewer.trackedEntity = undefined;

  /* 구글 실사 3D 타일 — terra.html 0819 안정화 값 넷을 그대로 옮긴다.
     ⚠ 값을 안 정하면 멀리 있는 마천루가 번쩍인다. */
  try{
    try { tileset = await Cesium.createGooglePhotorealistic3DTileset(GOOGLE_API_KEY); }
    catch(e){ tileset = await Cesium.createGooglePhotorealistic3DTileset({ key: GOOGLE_API_KEY }); }
    viewer.scene.primitives.add(tileset);
    try{
      tileset.skipLevelOfDetail = false;
      tileset.dynamicScreenSpaceError = true;
      tileset.dynamicScreenSpaceErrorDensity = 0.00278;
      tileset.dynamicScreenSpaceErrorFactor = 4.0;
      tileset.preloadWhenHidden = true;
      tileset.preferLeaves = false;
      if ('cacheBytes' in tileset){
        tileset.cacheBytes = 1073741824;
        tileset.maximumCacheOverflowBytes = 536870912;
      }
    }catch(e){ console.warn("[EG] 타일 안정화 값이 안 박혔습니다:", e); }
    console.log("[EG] 실사 3D 타일 켜짐");
  }catch(err){
    console.warn("[EG] 타일 로드 실패 — 기본 지구로 표시합니다:", err);
  }

  OPEN = BLD;                       /* 처음 열려 있는 건물 = 내가 사는 곳 */
  await flyToBuilding(1.2);
  bindUI();

  /* DB와 세션을 나란히 — 하나가 넘어져도 나머지가 선다 */
  await Promise.allSettled([ loadRows(), readSession() ]);
  fillWhoSelect();

  await measureRoof();
  drawRoof();
  drawWindows();
  drawOthers();
  updateMineLine();
})();

/* ══ 지붕 높이 재기 — 첨탑은 피하되 너무 내려가지도 않는다 ══
   ⚠⚠ 0829 두 번째 실패 — 중앙값을 쓰자 엠파이어·크라이슬러 둘 다 핀이
      **첨탑 아래 넓은 지붕**으로 내려가 구조물에 파묻혔다. 중앙값은 고리 여덟 점이
      전부 낮으면 그 낮은 값을 그대로 고른다 — 첨탑을 피한 게 아니라 첨탑을 버렸다.
   ⭐ 고리를 8m로 좁혀 첨탑 어깨를 물게 하고, 중앙값 대신 **상위 25% 분위**를 쓴다.
     가장 높은 한 점(첨탑 꼭짓점)은 여전히 밀려나지만 그 바로 아래 어깨는 살아남는다.
   ⭐ 그리고 어떤 값이 나오든 핀은 6호에서 다시 한 번 띄운다 — 이중 안전장치. */
async function roofRing(b){
  const R = 8, pts = [Cesium.Cartesian3.fromDegrees(b.lng, b.lat)];
  for (let i=0;i<8;i++){
    const o = offsetDeg(b.lat, b.lng, i*45, R);
    pts.push(Cesium.Cartesian3.fromDegrees(o.lng, o.lat));
  }
  const arr = await viewer.scene.clampToHeightMostDetailed(pts);
  return (arr||[]).filter(Cesium.defined)
                  .map(c=> Cesium.Cartographic.fromCartesian(c).height)
                  .sort((x,y)=> x-y);
}
function pickRoof(hs){
  return hs[Math.min(hs.length-1, Math.floor(hs.length*0.75))];   /* 상위 25% 분위 */
}

/* ── 다른 건물들 — 지붕 핀 하나뿐이다 ──
   ⭐ 호버(점→이름)와 명패 모양은 내 건물 지붕 핀과 완전히 같은 손이다.
     _roof 를 함께 달아 호버 배선을 한 글자도 안 고친다. _bld 가 현관을 가른다. */
let otherEnts = [];
async function drawOthers(){
  otherEnts.forEach(e=> viewer.entities.remove(e)); otherEnts = [];
  for (const b of allBlds()){
    if (b === (OPEN || BLD)) continue;          /* 열린 건물은 지붕 명패가 맡는다 */
    let h = 350;
    try{
      if (b.roof == null){                       /* 소로가 찍어 둔 값이 있으면 재지 않는다 */
        const hs = await roofRing(b);
        if (hs.length) b.roof = pickRoof(hs);
      }
    }catch(e){ console.warn("[EG] " + b.name + " 지붕 측정 실패:", e); }
    if (b.roof != null) h = b.roof;
    const ent = viewer.entities.add({
      id:"nyc-bld-" + b.key,
      position: Cesium.Cartesian3.fromDegrees(b.lng, b.lat, h + 26),
      point:{ pixelSize:11,
              color:Cesium.Color.fromCssColorString("#ffd23f"),
              outlineColor:Cesium.Color.fromCssColorString("#1a1407"), outlineWidth:2,
              disableDepthTestDistance:0,
              distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0, D_ROOF) },
      label:{ text:b.name,
              font:"15px Georgia,'Nanum Myeongjo','Apple SD Gothic Neo',serif",
              fillColor:Cesium.Color.fromCssColorString("#1a1407"),
              showBackground:true,
              backgroundColor:Cesium.Color.fromCssColorString("#ffd23f").withAlpha(.96),
              backgroundPadding:new Cesium.Cartesian2(11,6),
              pixelOffset:new Cesium.Cartesian2(0,-15),
              verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
              horizontalOrigin:Cesium.HorizontalOrigin.CENTER,
              disableDepthTestDistance:Number.POSITIVE_INFINITY,
              distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0, D_ROOF) }
    });
    ent._roof = true;                    /* 호버 배선 공유 — 점만, 닿으면 이름 */
    ent._bld  = b;                       /* 클릭 분기 — 현관으로 */
    ent._basePx = 11;
    ent.label.show = !CAN_HOVER;
    otherEnts.push(ent);
  }
}

/* 현관 팝업 — 결정문 9호 「슬라이드 · 입주민 명단」의 씨앗 */
function openBldCard(b){
  $("cDoor").textContent = "뉴욕 · 1 Territory = 24 Cell · 216 슬롯";
  $("cNick").textContent = b.name;

/* ⭐⭐ 건물 열기 — 언제나 한 채만 간판을 갖는다.
   ⚠ 열린 건물은 지붕 명패를 제 것으로 쓰고(roofEnt), 나머지는 OTHERS 핀으로 선다.
     그래서 여는 순간 양쪽을 다시 그린다 — 옛 건물이 핀으로 돌아가야 하므로. */
async function openBuilding(b){
  if (OPEN === b) return;
  OPEN = b;
  closeCard();
  sampleSet = null;                       /* 건물이 바뀌면 이번 노출도 다시 뽑는다 */
  if (b.roof == null) await measureRoof();
  printRoofLine();
  drawRoof();
  drawWindows();
  await drawOthers();
  await flyToBuilding(2.0, b);
}

/* ══════════════════ 지붕 높이 측정 ══════════════════
   ⭐ 건물 중심에 광선을 쏘면 지붕을 맞는다 — 뉴욕에서는 그게 정답이다.
     (파리 라탱에서는 그게 문제여서 둘레 고리에서 최저값을 길로 봤다. 두 도시가 정반대다.)
   ⭐⭐ 그리고 이 한 번의 측정이 절대고도 문제를 통째로 없앤다.
      해발·지오이드를 몰라도 된다 — 지붕에서 아래로 세기만 하면 되므로. */
async function measureRoof(){
  if (!viewer.scene.clampToHeightMostDetailed){ $("roofLine").textContent="측정 미지원 판입니다"; return; }
  try{
    /* ⚠⚠ 0829 소로 — 「안테나 꼭대기에 핀이 꽂히면 너무 높아 잘 안 보인다」.
         중심 한 점에 광선을 쏘면 언제나 안테나·첨탑 끝을 맞는다. 뉴욕 마천루는
         거의 다 중심축에 가느다란 것이 솟아 있어 20채 전부에서 같은 일이 난다.
       ⭐ 그래서 **중심 + 반경 14m 고리 여덟 점**을 함께 재고 **중앙값**을 쓴다.
         가느다란 첨탑은 한두 점만 맞으므로 중앙값에서 저절로 밀려나고, 남는 것은
         그 둘레를 받치는 넓은 지붕 — 곧 소로가 찍으신 「안테나 하단」이다.
       ⭐ 파리 라탱에서 「둘레 90m 고리의 최저값」으로 길바닥을 찾던 손의 사촌이다.
         거기서는 최저를, 여기서는 중앙값을 본다. */
    const b = OPEN || BLD;
    const hs = await roofRing(b);
    if (hs.length){
      b.roof = pickRoof(hs);
      printRoofLine();
      console.log("[EG] " + b.name + " 지붕 H =", b.roof.toFixed(1),
                  "m  (아홉 점 " + hs[0].toFixed(0) + "~" + hs[hs.length-1].toFixed(0) + ")");
      return;
    }
  }catch(e){ console.warn("지붕 높이 측정 실패:", e); }
  $("roofLine").textContent = "지붕을 못 맞혔습니다 — 조금 더 가까이서 다시";
}
function syncCeilUI(){
  const rg = $("ceilRange"), rf = $("floorRange"); if (!rg || !rf) return;
  const b = OPEN || BLD;
  const roof = Math.round(b.roof != null ? b.roof : 420);
  if (b.ceil  == null) b.ceil  = roof - TOP_DROP;
  if (b.floor == null) b.floor = roof - BOT_DROP;
  rg.max = roof;              rg.min = 40;
  rf.max = Math.round(b.ceil) - 20;   rf.min = 20;    /* 바닥은 천장을 못 넘는다 */
  rg.value = Math.round(b.ceil);   $("ceilVal").textContent  = Math.round(b.ceil);
  rf.value = Math.round(b.floor);  $("floorVal").textContent = Math.round(b.floor);
}
function printRoofLine(){
  const b = OPEN || BLD;
  $("plate").querySelector("h1").textContent = b.name;
  $("roofLine").textContent =
    b.lat.toFixed(6) + ", " + b.lng.toFixed(6) +
    (b.roof!=null ? "  ·  지붕 H " + b.roof.toFixed(1) + "m" : "");
  syncCeilUI();
}

/* ══════════════════ DB — 파리 샘플을 그대로 읽는다 ══════════════════
   ⚠ get_maisons 는 city 로 거른다. 뉴욕 행은 만들지 않았으므로 'paris'를 읽는다.
     화면에서만 엠파이어 스테이트 벽에 얹는다 — DB 무변경. */
async function loadRows(){
  try{
    const res = await fetch(SUPA_URL + "/rest/v1/rpc/get_maisons", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY },
      body: JSON.stringify({ p_city:"paris" })
    });
    if (!res.ok) throw new Error("HTTP "+res.status);
    rows = await res.json();
    console.log("[EG] 메종", rows.length, "행 · 입주", rows.filter(r=>r.status==='occupied').length);
  }catch(e){ console.warn("eg_maison 로드 실패:", e); rows = []; }
}
async function readSession(){
  try{
    const { data:{ session } } = await supa.auth.getSession();
    myUid = session?.user?.id || null;
  }catch(e){ console.warn("세션 읽기 실패:", e); myUid = null; }
}
/* 지금 「내 것」으로 볼 메종 — 시점 전환이 우선, 없으면 실제 로그인 */
function mineRow(){
  if (asNick) return rows.find(r => r.nickname === asNick) || null;
  if (myUid)  return rows.find(r => r.occupant_id === myUid) || null;
  return null;
}
function isMineNo(no){ const m = mineRow(); return !!(m && m.maison_no === no); }

/* ══════════════════ 지붕 명패 ══════════════════
   ⭐ 파리 메종과 같은 손이다 — 지붕에 얹는 일. 옆으로 밀 까닭이 없으므로 CENTER.
   ⚠ disableDepthTestDistance 는 0 — 그 너머 건물을 뚫고 비치지 않게 (v200 3-㉠). */
function drawRoof(){
  if (roofEnt){ viewer.entities.remove(roofEnt); roofEnt=null; }
  const b = OPEN || BLD;
  /* ⚠⚠ 0829 — 핀이 첨탑 구조물에 파묻혀 실종됐다(소로). 두 손을 함께 쓴다.
     ⭐ ① 지붕에서 넉넉히 띄운다 — 8m 는 첨탑 어깨를 못 넘었다. 26m.
     ⭐ ② 깊이 검사를 끈다 — 지붕 핀은 그 건물의 이름표다. 자기 건물에 가려질 까닭이
        없다(내 집 명패에 이미 같은 판정을 내렸다). v200 이 경고한 관통은
        「남의 명패가 내 건물을 뚫는 것」이지 이 경우가 아니다. */
  const h = (b.roof!=null) ? b.roof + 26 : 420;
  roofEnt = viewer.entities.add({
    id:"nyc-roof",
    position: Cesium.Cartesian3.fromDegrees(b.lng, b.lat, h),
    point:{ pixelSize:11,
            color:Cesium.Color.fromCssColorString("#ffd23f"),
            outlineColor:Cesium.Color.fromCssColorString("#1a1407"), outlineWidth:2,
            disableDepthTestDistance:0,
            distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0, D_ROOF) },
    label:{ text: b.name,
            font:"15px Georgia,'Nanum Myeongjo','Apple SD Gothic Neo',serif",
            fillColor:Cesium.Color.fromCssColorString("#1a1407"),
            showBackground:true,
            backgroundColor:Cesium.Color.fromCssColorString("#ffd23f").withAlpha(.96),
            backgroundPadding:new Cesium.Cartesian2(11,6),
            pixelOffset:new Cesium.Cartesian2(0,-15),
            verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
            horizontalOrigin:Cesium.HorizontalOrigin.CENTER,
            disableDepthTestDistance:0,
            distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0, D_ROOF) }
  });
  roofEnt._roof = true;
  roofEnt._basePx = 11;
  roofEnt.label.show = !CAN_HOVER;   /* ⭐ 마우스가 있으면 점만 · 없으면 명패 그대로 */
  roofEnt.show = showRoof;
  hoveredEnt = null;                 /* 다시 그렸으니 호버 기억을 버린다 */
}

/* ══════════════════ 메종 54칸 ══════════════════
   ⭐ 명패 글꼴·색·여백은 terra.html loadMaisons 에서 한 글자도 안 바꾸고 옮겼다.
      입주 = 옐로 바탕 · 검은 명조 13px  /  빈집 = 검은 바탕 · 옐로 명조 12px */
/* ⚠⚠ 0829 세 번째 정정 — 소로 진단 셋(투과 · 붕 뜸 · 반대편 어지러움)의 원인이 하나다.
     **명패를 벽에 매달려고 한 것.** 빌보드는 언제나 카메라를 마주보므로 애초에
     벽에 눕지 못한다. 벽에 붙이면 묻히고, 밀어내면 옆에서 허공에 뜬다 —
     결정문 1호가 어제 적어 둔 딜레마가 하나짜리로 축소되어 돌아온 것이다.

   ⭐⭐ 오늘 아침 소로가 216을 푸신 방식을 한 번 더 쓴다 — 문제를 풀지 않고 없앤다.
     **내 집은 건물 중심축에 세운다.** 지붕 명패와 한 수직선 위에 서고,
     높이만 자기 층이다. 어느 각도에서 보아도 건물 한가운데이므로 뜰 곳이 없고,
     반대편으로 돌아도 같은 자리다. ⭐ 파리 메종이 쓰는 문법 그대로다.

   ⚠ 잃는 것은 「내 창」이라는 그림인데, 결정문 8호가 이미
     「어느 창이 내 창인지 아무도 안 보므로 정확도가 필요 없다」고 적었다.
     정확도가 필요 없으면 둘레도 필요 없다 — ⭐ 높이만 남긴다. 높이가 곧 주소다. */
/* slot_no 하나에서 면·열·단이 전부 나온다 — DB 에 face 칸이 필요 없는 근거 (결정문 13호) */
function slotFace(no){ return Math.floor(((no-1) % (FACES*FCOLS)) / FCOLS); }
function slotCol(no){ return (no-1) % FCOLS; }
function slotTier(no){ return Math.floor((no-1) / (FACES*FCOLS)); }
/* ⭐ 소로 0829 — 「너무 높이 뜬 것만 끌어내리면 완벽. 내가 조절할 방법은?」
   위쪽 단들이 첨탑·전망대 구간(벽이 갑자기 가늘어지는 곳)에 걸려 허공에 떴다.
   맨 윗단(천장)을 소로가 직접 끈다 — 좌표편집기와 같은 흐름: 끌어서 맞추고,
   값이 화면에 찍히고, 건네주시면 상수로 박는다. 격자 전체가 통째로 따라 내려온다. */
function slotH(no, b){
  b = b || OPEN || BLD;
  const roof = (b.roof != null) ? b.roof : 420;
  const top  = (b.ceil  != null) ? b.ceil  : roof - TOP_DROP;
  const bot  = (b.floor != null) ? b.floor : roof - BOT_DROP;
  return bot + slotTier(no) * ((top - bot) / (TIERS-1));
}
function slotAnchor(no, b){                         // 그 칸의 벽 밖 한 점 (간판·점이 함께 쓴다)
  b = b || OPEN || BLD;
  const f  = slotFace(no), az = AZ_FACE(f);
  const c0 = offsetDeg(b.lat, b.lng, az, OUT_FACE[f]);
  const c1 = offsetDeg(c0.lat, c0.lng, az + (slotCol(no)===0 ? 90 : -90), COL_OFF[f]);
  return { lat:c1.lat, lng:c1.lng, h:slotH(no, b), az };
}
/* ⭐⭐ 0829 소로 정정 — 「같은 닉네임은 같은 위치 고정 · 보여줄지만 랜덤」.
   첫 판은 배정 자체를 무작위로 두었는데 그건 주소가 아니었다. 주소는 주소다
   (0729 16호 — 초대가 기록이 아니라 주소가 된다). 그래서 배정은 **결정식**이다:
   면은 메종 번호가 고루 정하고(1남·2동·3북·4서·5남…), 단·열은 번호의 해시가
   정한다 — 언제 누가 들어와도 lonelywalden 은 늘 그 칸이다.
   실판에서는 DB 의 slot_no 가 이 식을 통째로 대체한다. */
let slotMap = null;
function assignSlots(){
  if (slotMap) return slotMap;
  slotMap = new Map(); const used = new Set();
  rows.filter(r=> r.status==='occupied')
      .sort((a,b)=> a.maison_no - b.maison_no)
      .forEach(r=>{
        const f = (r.maison_no - 1) % FACES;                 // 면 — 번호가 고루 정한다
        const h = (r.maison_no * 2654435761) >>> 0;          // 단·열 — 번호의 해시 (고정)
        let t = h % TIERS, col = (h >>> 8) % FCOLS, slot;
        for(;;){
          slot = t*FACES*FCOLS + f*FCOLS + col + 1;
          if (!used.has(slot)) break;
          col = (col + 1) % FCOLS;                           // 그 면 안에서 다음 칸
          if (col === 0) t = (t + 1) % TIERS;
        }
        used.add(slot); slotMap.set(r.maison_no, slot);
      });
  return slotMap;
}
function slotOf(m){ return (slotMap && slotMap.get(m.maison_no)) || m.maison_no; }
function offsetDeg(lat, lng, azDeg, dist){         // 방위각·거리 → 위경도
  const az = Cesium.Math.toRadians(azDeg);
  return { lat: lat + (dist*Math.cos(az))/111320,
           lng: lng + (dist*Math.sin(az))/(111320*Math.cos(Cesium.Math.toRadians(lat))) };
}
function slotPos(no, mine){
  const b = OPEN || BLD;
  if (mine) return Cesium.Cartesian3.fromDegrees(b.lng, b.lat, slotH(no, b));  /* ⭐ 멀리서 명패는 중심축 */
  const a = slotAnchor(no, b);
  return Cesium.Cartesian3.fromDegrees(a.lng, a.lat, a.h);
}

function drawWindows(){
  winEnts.forEach(e=> viewer.entities.remove(e));
  winEnts = [];
  assignSlots();
  const bySlot = new Map();
  rows.filter(r=>r.status==='occupied').forEach(r=> bySlot.set(slotOf(r), r));

  hoveredEnt = null;
  for (let no=1; no<=SLOT_N; no++){
    const m = bySlot.get(no)
           || { maison_no:null, slot_no:no, status:'vacant', nickname:null, intro:null };
    const occupied = (m.status === 'occupied');
    /* ⚠⚠ 0829 버그 정정 (소로 발견) — 「내 집」을 슬롯 번호로 재고 있었다.
       빈 슬롯 1번이 메종 1(lonelywalden)로 오판되어 멀리서 [메종 1]이 떴다.
       내 집은 **메종 번호**로만 잰다. 빈 슬롯은 번호가 없다(null). */
    const mine = occupied && isMineNo(m.maison_no);
    if (occupied && !mine){
      /* ⭐ 입주 이웃은 점을 안 찍는다 — 간판이 곧 표지인데 점을 겹치면
         간판 한가운데를 덮는다(소로 발견). 카드는 간판 클릭이 연다. */
      continue;
    }
    const dd  = new Cesium.DistanceDisplayCondition(mine ? D_SIGN : 0, mine ? D_MINE : D_WIN);
    const dep = mine ? Number.POSITIVE_INFINITY : 0;   /* 내 명패만 관통 · 빈 점은 깊이 켬 */

    const ent = viewer.entities.add({
      id:"nyc-maison-"+no,
      position: slotPos(no, mine),
      point:{ pixelSize: mine ? 12 : 9,
              color:Cesium.Color.fromCssColorString(mine ? "#ffd23f" : "#0a0e1a"),
              outlineColor:Cesium.Color.fromCssColorString(mine ? "#1a1407" : "#ffd23f"),
              outlineWidth: mine ? 2 : 2.5,
              disableDepthTestDistance:dep,
              distanceDisplayCondition:dd },
      /* ⭐ 명패는 내 것 하나뿐 — 파리 입주 명패 그대로. 빈 점은 이름이 없다. */
      label: !mine ? undefined : {
              text: m.nickname || ("메종 "+m.maison_no),
              font:"13px Georgia,'Nanum Myeongjo','Apple SD Gothic Neo',serif",
              fillColor:Cesium.Color.fromCssColorString("#1a1407"),
              showBackground:true,
              backgroundColor:Cesium.Color.fromCssColorString("#ffd23f").withAlpha(.96),
              backgroundPadding:new Cesium.Cartesian2(9,5),
              pixelOffset:new Cesium.Cartesian2(0,-13),
              verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
              disableDepthTestDistance:dep,
              distanceDisplayCondition:dd
            }
    });
    ent._maison = m;
    ent._basePx = mine ? 12 : 9;
    ent.show = mine ? showMine : showNbr;
    winEnts.push(ent);
  }
  drawSigns();                      /* ⭐ 입주자 전원의 간판 — 면마다 다섯 안팎 */
}

/* ══ 실물 간판 — 각 면에 다섯 장 안팎 ══
   ⭐ 소로 0829 — 「각 면에 랜덤 5명씩 간판 보이게, 멀리서는 내 것만」.
   입주자 전원(지금 17)의 간판을 배정 면·배정 높이에 바른다.
   ⚠ 렌더 부담은 벽 열일곱 + 작은 캔버스 열일곱 — 가볍다. 216이 다 차는 날의
     갈래(내 면만 전부 / 남은 점)는 그때 소로와 정한다.
   ⚠ 「면 판매 구조」의 부활이 아니다 — 면은 화면 배치일 뿐 DB 에 없다. */
const plateCache = new Map();      /* 천장을 끌어도 캔버스는 다시 굽지 않는다 */
function plateCanvas(text){
  if (plateCache.has(text)) return plateCache.get(text);
  const H = 340, pad = 76;
  const MAXW = Math.round(H * SIGN_ASPECT);                   // 폭 상한의 픽셀 옷 (952)
  const FONT = fs => '700 ' + fs + 'px Georgia,"Nanum Myeongjo","Apple SD Gothic Neo",serif';
  const probe = document.createElement('canvas').getContext('2d');
  let fs = 200;
  probe.font = FONT(fs);
  let tw = probe.measureText(text).width;
  if (tw > MAXW - pad*2){                                     // 긴 닉네임 — 글자가 맞춰 준다
    fs = Math.max(80, Math.floor(fs * (MAXW - pad*2) / tw));
    probe.font = FONT(fs); tw = probe.measureText(text).width;
  }
  const W = Math.max(430, Math.min(MAXW, Math.ceil(tw) + pad*2));
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d'); const r = 44;
  g.beginPath();
  g.moveTo(r,0); g.arcTo(W,0,W,H,r); g.arcTo(W,H,0,H,r); g.arcTo(0,H,0,0,r); g.arcTo(0,0,W,0,r);
  g.closePath();
  g.fillStyle = "#ffd23f"; g.fill();                          // 파리의 옐로
  g.lineWidth = 10; g.strokeStyle = "#1a1407"; g.stroke();
  g.fillStyle = "#1a1407"; g.font = FONT(fs);                 // 파리의 검은 명조
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(text, W/2, H/2 + 8);
  plateCache.set(text, cv);
  return cv;
}

/* ⭐ 노출 추첨 — 접속마다 각 면에서 다섯을 뽑는다. 자리는 고정, 걸릴지만 운.
   한 접속 안에서는 붙박이(시점을 바꿔도 표본은 그대로 · 내 것만 얹힌다). */
let sampleSet = null;
function sampleSigns(){
  if (sampleSet) return sampleSet;
  sampleSet = new Set();
  for (let f=0; f<FACES; f++){
    const pool = rows.filter(r=> r.status==='occupied' && slotFace(slotOf(r)) === f);
    for (let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    pool.slice(0, SHOW_PER_FACE).forEach(r=> sampleSet.add(r.maison_no));
  }
  return sampleSet;
}

async function drawSigns(){
  signEnts.forEach(e=> viewer.entities.remove(e)); signEnts = [];
  const occ = rows.filter(r=> r.status === 'occupied');
  if (!occ.length) return;
  sampleSigns();
  const meNo = (mineRow() || {}).maison_no;
  try{ await document.fonts.load('700 200px "Nanum Myeongjo"',
        occ.map(r=> r.nickname || '').join('')); }catch(e){}
  occ.forEach(r=>{
    if (!sampleSet.has(r.maison_no) && r.maison_no !== meNo) return;   /* 이번 접속의 표본 + 나 */
    const no = slotOf(r);
    const a  = slotAnchor(no);
    const cv = plateCanvas(r.nickname || ("메종 " + r.maison_no));
    const HM = signH(OPEN || BLD);
    const widthM = HM * (cv.width / cv.height);
    /* 벽과 평행 · A(+90)→B(−90) 순서라야 밖에서 글이 바로 읽힌다
       (⚠ 좌우로 뒤집혀 보이면 A·B를 맞바꾼다 · 상하면 캔버스를 뒤집는다) */
    const A = offsetDeg(a.lat, a.lng, a.az + 90, widthM/2);
    const B = offsetDeg(a.lat, a.lng, a.az - 90, widthM/2);
    const e = viewer.entities.add({
      id: "nyc-sign-" + no,
      wall:{
        positions: Cesium.Cartesian3.fromDegreesArray([A.lng, A.lat, B.lng, B.lat]),
        minimumHeights:[a.h - HM/2, a.h - HM/2],
        maximumHeights:[a.h + HM/2, a.h + HM/2],
        material: new Cesium.ImageMaterialProperty({ image: cv, transparent: true }),
        outline: false,
        distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, D_SIGN)
      }
    });
    e._maison = r;
    signEnts.push(e);
  });
}

/* ⚠ 시점이 바뀌면 **자리와 이름표가 함께** 바뀐다(내 것만 중심축·이름표를 가짐).
     속성만 손보면 옛 자리에 남으므로 다시 그린다. 쉰넷은 가볍다. */
function refreshMine(){ drawWindows(); }

/* 단추는 표시만 건드린다 — 다시 그릴 까닭이 없다 */
function applyShow(){
  winEnts.forEach(e=>{ e.show = isMineNo(e._maison.maison_no) ? showMine : showNbr; });
  /* 간판 열일곱은 상시 — 「각 면에 다섯」이 이 시험판의 볼거리다 */
}
function updateMineLine(){
  const m = mineRow();
  $("mineLine").innerHTML = m
    ? "메종 " + m.maison_no + " · <b>" + (m.nickname||"—") + "</b>"
    : (rows.length ? "이 사람에게는 아직 집이 없습니다" : "—");
  $("goMine").disabled = !m;
}

/* ══════════════════ 카메라 ══════════════════ */
function flyToBuilding(dur, b){
  b = b || OPEN || BLD;
  return new Promise(res=>{
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(b.lng, b.lat-0.0042, (b.roof||400)+40),
      orientation:{ heading:Cesium.Math.toRadians(2), pitch:Cesium.Math.toRadians(6), roll:0 },
      duration: dur, complete:res, cancel:res
    });
  });
}
function flyFar(){
  const b = OPEN || BLD;
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(b.lng, b.lat-0.019, 1500),
    orientation:{ heading:Cesium.Math.toRadians(2), pitch:Cesium.Math.toRadians(-14), roll:0 },
    duration: 2.0
  });
}
function flyToMine(){
  const m = mineRow(); if (!m) return;
  const no = slotOf(m), a = slotAnchor(no);
  const back = offsetDeg(a.lat, a.lng, a.az, 140);   /* 그 면 법선 밖 140m */
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(back.lng, back.lat, a.h + 6),
    orientation:{ heading:Cesium.Math.toRadians((a.az + 180) % 360),
                  pitch:Cesium.Math.toRadians(-2), roll:0 },
    duration: 2.0
  });
  openCard(m);
}

/* ══════════════════ 카드 ══════════════════ */
let cardBld = null;
function openCard(m){
  cardBld = null;
  $("cDoor").textContent = "뉴욕 · 엠파이어 스테이트 · "
    + (m.maison_no ? ("메종 " + m.maison_no) : ("빈 슬롯 " + m.slot_no));
  $("cNick").textContent = m.nickname || (m.maison_no ? ("메종 " + m.maison_no) : "빈 슬롯");
  $("cIntro").textContent = m.intro
    || (m.status==='occupied' ? "아직 소개글을 쓰지 않은 집입니다." : "빈집입니다. 아직 아무도 살지 않습니다.");
  $("cMeta").textContent = m.occupant_id ? ("uid " + m.occupant_id) : "occupant 없음";
  $("card").classList.add("in");
}
function closeCard(){ $("card").classList.remove("in"); }

/* ══════════════════ 좌표 편집 — 파리에서 쓰던 손 그대로 ══════════════════
   파리:  메종 핀을 고르고 → 지붕을 클릭 → admin_set_maison_coords 로 저장
   뉴욕:  건물 하나뿐이므로 고를 것이 없다 → ⭐ 지붕을 클릭하면 그 자리가 건물 중심
   ⚠ 저장할 표(buildings)가 아직 없다. 그래서 화면에 값을 찍는다 —
     소로가 건네주시면 상수로 박히고, 실판에서는 결정문 13호의 표로 간다.
     ⭐ 시험판이 DB 표를 먼저 파지 않는다. */
function setEdit(on){
  EDIT_MODE = on;
  $("btnEdit").classList.toggle("on", on);
  if (on){
    hint("📍 <b>편집 모드</b> — 엠파이어 스테이트 <b>지붕</b>을 클릭하면 그 자리가 건물 중심이 됩니다");
  } else hintOff();
}
async function moveBuilding(lng, lat, clickH){
  if (MOVING) return; MOVING = true;
  try{
    const b = OPEN || BLD;
    b.lat = lat; b.lng = lng; b.roof = null; b.ceil = null; b.floor = null;
    /* ⭐ 클릭한 그 점의 높이를 그대로 쓴다 — 안테나 하단을 찍으면 거기가 지붕이다.
       측정을 다시 돌리면 광선이 첨탑을 맞아 클릭이 무의미해진다. */
    if (clickH != null) b.roof = clickH;
    else await measureRoof();
    printRoofLine();
    drawRoof();
    drawWindows();
    hint("✅ <b>건물 중심 이동</b> — <code>" + lat.toFixed(6) + ", " + lng.toFixed(6) + "</code>"
       + (ROOF_H!=null ? " · 지붕 H <code>" + ROOF_H.toFixed(1) + "m</code>" : "")
       + "<br>이 값을 파이스에게 건네주시면 상수로 박습니다");
    console.log("[edit] 건물 중심 →", lat.toFixed(6), lng.toFixed(6), "H=", ROOF_H);
  }catch(e){
    console.warn("이동 실패:", e);
    hint("⚠️ 이동 실패 — 콘솔을 확인하세요");
  }finally{ MOVING = false; }
}
async function moveOther(b, lng, lat, clickH){
  if (MOVING) return; MOVING = true;
  try{
    b.lat = lat; b.lng = lng; b.ceil = null; b.floor = null;
    b.roof = (clickH != null ? clickH : null);
    await drawOthers();
    hint("✅ <b>" + b.name + " 이동</b> — <code>" + lat.toFixed(6) + ", " + lng.toFixed(6) + "</code>"
       + (b.roof!=null ? " · 지붕 H <code>" + b.roof.toFixed(1) + "m</code>" : "")
       + "<br>이 값을 파이스에게 건네주시면 상수로 박습니다");
  }catch(e){ console.warn("이동 실패:", e); }
  finally{ MOVING = false; }
}

/* ══════════════════ 배선 ══════════════════ */
function bindUI(){
  const h = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
  h.setInputAction(click=>{
    if (EDIT_MODE){
      if (!viewer.scene.pickPositionSupported){ console.warn("pickPosition 미지원"); return; }
      const cart = viewer.scene.pickPosition(click.position);
      if (!Cesium.defined(cart)) return;
      const carto = Cesium.Cartographic.fromCartesian(cart);
      const lat = Cesium.Math.toDegrees(carto.latitude), lng = Cesium.Math.toDegrees(carto.longitude);
      const hClick = carto.height;
      /* ⭐ 건물이 여럿이 됐다 — 클릭점에서 가장 가까운 건물이 편집 대상이다 */
      const d2 = (a)=> (a.lat-lat)*(a.lat-lat) + (a.lng-lng)*(a.lng-lng);
      let target = null, best = Infinity;
      allBlds().forEach(b=>{ const d = d2(b); if (d < best){ best = d; target = b; } });
      if (target === (OPEN||BLD)) moveBuilding(lng, lat, hClick);
      else moveOther(target, lng, lat, hClick);
      return;
    }
    const picked = viewer.scene.pick(click.position);
    if (Cesium.defined(picked) && picked.id && picked.id._maison){ openCard(picked.id._maison); return; }
    if (Cesium.defined(picked) && picked.id && picked.id._bld){
      const b = picked.id._bld;
      /* ⭐ 한 번째 = 현관, 두 번째 = 열기. 실수로 이사하지 않게 두 걸음을 둔다 */
      if ($("card").classList.contains("in") && cardBld === b) openBuilding(b);
      else { cardBld = b; openBldCard(b); }
      return;
    }
    if (Cesium.defined(picked) && picked.id && picked.id._roof){ flyToBuilding(1.6); return; }
    closeCard();
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

  /* ⭐ .on = 켜져 있음 (파리 layer-btn 문법 그대로). 뒤집지 않는다. */
  $("btnRoof").classList.add("on");
  $("btnMine").classList.add("on");
  /* ── 호버 (terra 2398행 문법 그대로) ──
     ⭐ 핀이 불쑥 커지고 커서가 손가락이 된다. 지붕은 여기서 이름까지 편다. */
  h.setInputAction(mv=>{
    const picked = viewer.scene.pick(mv.endPosition);
    const ent = (Cesium.defined(picked) && picked.id
                 && (picked.id._maison || picked.id._roof)) ? picked.id : null;
    if (ent === hoveredEnt) return;
    if (hoveredEnt){
      if (hoveredEnt.point) hoveredEnt.point.pixelSize = (hoveredEnt._basePx != null ? hoveredEnt._basePx : 9);
      if (hoveredEnt._roof && hoveredEnt.label && CAN_HOVER) hoveredEnt.label.show = false;
    }
    if (ent){
      if (ent.point) ent.point.pixelSize = (ent._basePx != null ? ent._basePx : 9) + 9;
      if (ent._roof && ent.label) ent.label.show = true;
    }
    hoveredEnt = ent;
    viewer.canvas.style.cursor = ent ? 'pointer' : 'default';
  }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

  $("btnRoof").addEventListener("click", ()=>{
    showRoof = !showRoof;
    if (roofEnt) roofEnt.show = showRoof;
    $("btnRoof").classList.toggle("on", showRoof);
  });
  $("btnMine").addEventListener("click", ()=>{
    showMine = !showMine;
    applyShow();
    $("btnMine").classList.toggle("on", showMine);
  });
  $("btnNbr").addEventListener("click", ()=>{
    showNbr = !showNbr;
    applyShow();
    $("btnNbr").classList.toggle("on", showNbr);
  });
  $("btnFar").addEventListener("click", flyFar);
  $("ceilRange").addEventListener("input", e=>{
    const b = OPEN||BLD;
    b.ceil = +e.target.value;
    if (b.floor >= b.ceil - 20) b.floor = b.ceil - 20;
    syncCeilUI(); drawWindows();                    /* 캔버스는 캐시 — 끄는 대로 따라온다 */
  });
  $("floorRange").addEventListener("input", e=>{
    const b = OPEN||BLD;
    b.floor = +e.target.value;
    $("floorVal").textContent = e.target.value;
    drawWindows();
  });
  $("floorRange").addEventListener("change", ()=>{
    const b = OPEN||BLD;
    hint("⭐ " + b.name + " 간판 구간 <code>" + Math.round(b.floor) + " ~ "
       + Math.round(b.ceil) + "m</code> · 단 간격 <code>" + tierGap(b).toFixed(1)
       + "m</code> — 이 두 값을 파이스에게 건네주시면 상수로 박습니다");
    setTimeout(hintOff, 5000);
  });
  $("ceilRange").addEventListener("change", ()=>{
    const b = OPEN||BLD;
    hint("⭐ " + b.name + " 간판 구간 <code>" + Math.round(b.floor) + " ~ "
       + Math.round(b.ceil) + "m</code> · 단 간격 <code>" + tierGap(b).toFixed(1)
       + "m</code> — 이 두 값을 파이스에게 건네주시면 상수로 박습니다");
    setTimeout(hintOff, 5000);
  });
  $("btnEdit").addEventListener("click", ()=> setEdit(!EDIT_MODE));
  $("cardX").addEventListener("click", closeCard);
  $("goMine").addEventListener("click", flyToMine);
  $("asWho").addEventListener("change", e=>{
    asNick = e.target.value || null;
    refreshMine(); updateMineLine(); closeCard();
  });
}

/* 시점 전환 목록 — 입주자 전원 + 실제 로그인 + 손님 */
function fillWhoSelect(){
  const sel = $("asWho");
  sel.innerHTML = "";
  const me = myUid ? rows.find(r=> r.occupant_id === myUid) : null;
  const o0 = document.createElement("option");
  o0.value = "";
  o0.textContent = me ? ("로그인 그대로 · " + (me.nickname||"?")) : "손님 (로그인 없음)";
  sel.appendChild(o0);
  rows.filter(r=> r.status==='occupied' && r.nickname)
      .sort((a,b)=> a.maison_no - b.maison_no)
      .forEach(r=>{
        const o = document.createElement("option");
        o.value = r.nickname;
        o.textContent = r.nickname + " · 메종 " + r.maison_no;
        sel.appendChild(o);
      });
}
</script>
