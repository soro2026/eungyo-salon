<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EG Postage — 우표 공방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
:root{
  --bg:#12100c; --panel:#1b1710; --panel2:#221c14;
  --ink:#ece3d0; --dim:#9a8d72; --soft:#c8baa0;
  --gold:#d8b860; --gold2:#c9a84c; --line:rgba(216,184,96,.22);
  --paper:#efe6cd;                       /* 편지지 미색 — 미리보기 바탕 */
  --ok:#7fb38a; --bad:#c46a5e;
}
body{ background:var(--bg); color:var(--ink); font-family:'Noto Serif KR',serif; min-height:100vh; }

header{ display:flex; align-items:baseline; gap:14px; padding:18px 22px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
h1{ font-family:'Cormorant Garamond',serif; font-size:25px; font-weight:600; letter-spacing:.5px; }
h1 .g{ color:var(--gold); }
.sub{ font-size:11.5px; color:var(--dim); letter-spacing:.14em; }
.count{ margin-left:auto; font-size:12px; color:var(--soft); }
.modes{ display:flex; gap:7px; margin-left:16px; }
.mode{ font-size:12px; padding:5px 15px; border-radius:15px; cursor:pointer;
  color:var(--dim); border:1px solid var(--line); background:transparent; font-family:inherit; }
.mode.on{ color:#1a120c; background:linear-gradient(135deg,var(--gold),var(--gold2)); border-color:var(--gold2); }
.count b{ color:var(--gold); font-weight:500; }

#gate{ max-width:340px; margin:14vh auto; padding:26px; background:var(--panel); border:1px solid var(--line); border-radius:12px; }
#gate h2{ font-family:'Cormorant Garamond',serif; font-size:20px; margin-bottom:14px; color:var(--gold); }
#gate p{ font-size:13px; color:var(--dim); line-height:1.8; }

main{ display:grid; grid-template-columns:296px 1fr; gap:18px; padding:18px 22px 60px; align-items:start; }
@media(max-width:820px){ main{ grid-template-columns:1fr; } }

.panel{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:15px; }
.panel h3{ font-family:'Cormorant Garamond',serif; font-size:13px; letter-spacing:2.4px;
  color:var(--gold); text-transform:uppercase; margin-bottom:12px; }

/* ── 목록 ── */
.item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px;
  cursor:pointer; border:1px solid transparent; transition:all .16s; }
.item:hover{ background:var(--panel2); }
.item.on{ border-color:var(--gold2); background:rgba(216,184,96,.08); }
.thumb{ width:38px; height:46px; flex:0 0 auto; border-radius:3px; background:var(--paper);
  display:flex; align-items:center; justify-content:center; overflow:hidden; }
.thumb img{ max-width:100%; max-height:100%; display:block; }
.thumb .none{ font-size:9px; color:#a0916f; }
.item-t{ flex:1; min-width:0; }
.item-n{ font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item-c{ font-size:10px; color:var(--dim); font-family:'Cormorant Garamond',serif; letter-spacing:.6px; }
.dot{ width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
.dot.on{ background:var(--ok); } .dot.off{ background:#5a5245; }

.addBtn{ width:100%; margin-top:11px; padding:9px; font-family:inherit; font-size:12px;
  color:var(--gold); background:rgba(216,184,96,.07); border:1px solid var(--line);
  border-radius:9px; cursor:pointer; }
.addBtn:hover{ background:rgba(216,184,96,.14); }

/* ── 편집 ── */
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:11px; }
.grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:11px; }
.f{ margin-bottom:12px; }
.f label{ display:block; font-size:11px; color:var(--gold2); letter-spacing:.05em; margin-bottom:5px; }
.f .hint{ font-size:10.5px; color:var(--dim); margin-top:4px; line-height:1.6; }
input,select{ width:100%; padding:8px 10px; font-family:inherit; font-size:13px; color:var(--ink);
  background:#0e0b07; border:1px solid var(--line); border-radius:8px; outline:none; }
input:focus,select:focus{ border-color:var(--gold2); }
select option{ background:#1a150e; }
input[type=color]{ padding:2px; height:35px; cursor:pointer; }
.chk{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--soft); cursor:pointer; }
.chk input{ width:auto; }

.drop{ border:1px dashed var(--line); border-radius:10px; padding:20px 14px; text-align:center;
  cursor:pointer; color:var(--dim); font-size:12px; transition:all .18s; }
.drop:hover,.drop.over{ border-color:var(--gold2); color:var(--soft); background:rgba(216,184,96,.05); }

.acts{ display:flex; gap:9px; margin-top:16px; }
button.b{ flex:1; padding:10px; font-family:inherit; font-size:13px; border-radius:9px; cursor:pointer;
  border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--soft); }
button.b:hover{ background:rgba(255,255,255,.07); color:var(--ink); }
button.b.gold{ background:linear-gradient(135deg,var(--gold),var(--gold2)); border-color:var(--gold2);
  color:#1a120c; font-weight:500; }
button.b.danger{ color:var(--bad); }
button.b:disabled{ opacity:.42; cursor:default; }

/* ── 미리보기 — 진짜 편지지 위에 얹는다 ── */
.stage{ border-radius:4px; padding:26px; display:flex;
  align-items:center; justify-content:center; min-height:190px; position:relative; }
/* 편지지 위 — 실제로 보일 그대로 */
.stage.paper{ background:var(--paper); box-shadow:inset 0 0 34px rgba(140,110,66,.18); }
/* 투명 격자 — 도려낸 곳이 눈에 보인다. 흰 여백이 남았으면 여기서 대번에 드러난다 */
.stage.alpha{
  background:
    linear-gradient(45deg, #3a352c 25%, transparent 25%, transparent 75%, #3a352c 75%),
    linear-gradient(45deg, #3a352c 25%, transparent 25%, transparent 75%, #3a352c 75%),
    #262219;
  background-size:16px 16px; background-position:0 0, 8px 8px;
}
.stage-sw{ position:absolute; top:8px; right:10px; display:flex; gap:6px; }
.stage-sw span{ font-size:10.5px; padding:3px 9px; border-radius:11px; cursor:pointer;
  background:rgba(20,15,9,.75); border:1px solid var(--line); color:var(--dim); }
.stage-sw span.on{ color:var(--gold); border-color:var(--gold2); }
.pv{ position:relative; }
.pv .sheet{ position:relative; display:block; background:none; }
.pv img{ display:block; width:100%; height:100%; object-fit:contain; }
.pv .empty{ display:flex; align-items:center; justify-content:center; width:100%; height:100%;
  color:#a0916f; font-size:11px; border:1px dashed rgba(120,96,58,.4); border-radius:3px; }

.meta{ margin-top:12px; font-size:11px; color:var(--dim); line-height:1.9; }
.meta b{ color:var(--soft); font-weight:400; }
.meta .warn{ color:var(--bad); }
.meta .good{ color:var(--ok); }

#toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(12px);
  padding:10px 18px; border-radius:22px; background:rgba(28,20,12,.97); border:1px solid var(--line);
  font-size:12.5px; opacity:0; pointer-events:none; transition:all .22s; z-index:50; max-width:88vw; text-align:center; }
#toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
#toast.bad{ border-color:var(--bad); color:#f0c8c0; }
#toast.good{ border-color:var(--ok); }
</style>
</head>
<body>

<div id="gate" hidden>
  <h2>우표 공방</h2>
  <p>살롱지기로 들어와 주세요.</p>
  <div class="f" style="margin-top:14px"><label>메일</label><input id="em" type="email"></div>
  <div class="f"><label>열쇠</label><input id="pw" type="password"></div>
  <button class="b gold" id="loginBtn" style="width:100%">들어가기</button>
</div>

<div id="app" hidden>
<header>
  <h1>EG <span class="g">Postage</span></h1>
  <span class="sub">우표 공방 · 0813</span>
  <span class="modes">
    <button class="mode on" id="mode-po" onclick="setMode('po')">우표</button>
    <button class="mode"    id="mode-pm" onclick="setMode('pm')">소인</button>
  </span>
  <span class="count">발행 중 <b id="cnt-on">–</b> / 전체 <b id="cnt-all">–</b></span>
</header>

<main>
  <section class="panel">
    <h3>우표</h3>
    <div id="list"></div>
    <button class="addBtn" id="addBtn">＋ 새 우표 (기념 발행)</button>
  </section>

  <section class="panel" id="edit" hidden>
    <h3 id="edit-h">우표 한 장</h3>

    <div class="grid2">
      <div class="f"><label>코드</label><input id="f-code" placeholder="po_xxx">
        <div class="hint">한 번 정하면 안 바꿉니다 — 부친 편지가 이 코드를 물고 있습니다.</div></div>
      <div class="f"><label>이름</label><input id="f-name" placeholder="헨리 데이비드 소로"></div>
    </div>

    <div class="grid3">
      <div class="f"><label>라틴어 한 마디</label><input id="f-motto" placeholder="SILVA">
        <div class="hint">액면 자리. 값이 아닙니다.</div></div>
      <div class="f"><label>모양</label><select id="f-shape"></select></div>
      <div class="f"><label>가로÷세로</label><input id="f-ratio" type="number" step="0.01" min="0.3" max="2.9">
        <div class="hint">그림을 올리면 실측값이 들어갑니다.</div></div>
    </div>

    <div class="grid3">
      <div class="f"><label>대표색</label><input id="f-hue" type="color"></div>
      <div class="f"><label>발행 시작</label><input id="f-open" type="datetime-local"></div>
      <div class="f"><label>발행 끝</label><input id="f-close" type="datetime-local"></div>
    </div>

    <div class="grid3" style="align-items:center; margin-bottom:12px">
      <label class="chk"><input id="f-always" type="checkbox"> 늘 발행 중</label>
      <label class="chk"><input id="f-active" type="checkbox"> 살아 있음</label>
      <div class="f" style="margin:0"><label>정렬</label><input id="f-sort" type="number"></div>
    </div>

    <div class="f"><label>발행 사유</label><input id="f-note" placeholder="콜레주 1기 완주 기념"></div>

    <div class="grid3" id="pm-fields" hidden>
      <div class="f"><label>생김새</label><select id="f-kind"></select></div>
      <div class="f"><label>도시 이름 자리</label><select id="f-city"></select></div>
      <div class="f"><label>날짜 자리</label><select id="f-date"></select></div>
    </div>

    <div class="f">
      <label>그림</label>
      <div class="drop" id="drop">여기에 던지거나 눌러서 고르세요<br>
        <span style="font-size:10.5px">흰 여백을 잘라내고 WebP로 굽습니다 · 색은 그대로 둡니다</span></div>
      <input type="file" id="file" accept="image/*" hidden>
    </div>

    <div class="stage paper" id="stage">
      <div class="stage-sw"><span class="on" id="sw-p" onclick="setStage('paper')">편지지</span><span id="sw-a" onclick="setStage('alpha')">투명</span></div>
      <div class="pv" id="pv"><div class="empty" style="width:96px;height:120px">그림 없음</div></div></div>
    <div class="meta" id="meta"></div>

    <div class="acts">
      <button class="b danger" id="delBtn">지우기</button>
      <button class="b" id="cancelBtn">되돌리기</button>
      <button class="b gold" id="saveBtn">저장</button>
    </div>
  </section>
</main>
</div>

<div id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPA_URL = 'https://cyhlotwdisjvoxvfkpnd.supabase.co';
const SUPA_KEY = 'sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
const BUCKET   = 'credencial-assets';
const DIR      = 'postage';
const sb = createClient(SUPA_URL, SUPA_KEY, {
  auth:{ storageKey:'eungyo-auth', persistSession:true, autoRefreshToken:true }
});

console.log('%c[EG] admin_postage v1.4 · 0813 소인 갈피 · 투명 격자 · 바깥 흰 곳 도려내기', 'color:#c9a84c');

const SHAPES = [['tall','세로로 긴'],['portrait','세로'],['square','정사각'],
                ['landscape','가로로 긴'],['triangle','삼각']];
const KINDS  = [['round','동그라미'],['square','네모'],['triangle','삼각'],
                ['oval','타원'],['bars','물결만']];
const SPOTS  = [['top','위'],['center','가운데'],['bottom','아래'],['none','없음']];

/* ⭐ 우표와 소인은 다른 물건이지만 공방은 하나다.
   ⚠ 표 이름을 코드 곳곳에 박지 않는다 — 여기 한 곳만 본다. */
const MODES = {
  po:{ tbl:'postage',   ko:'우표', dir:'postage',
       row:r => ({ shape:$('#f-shape').value, ratio:+$('#f-ratio').value,
                   opens_at:fromLocal($('#f-open').value),
                   closes_at:fromLocal($('#f-close').value),
                   always_on:$('#f-always').checked }) },
  pm:{ tbl:'postmarks', ko:'소인', dir:'postmark',
       row:r => ({ kind:$('#f-kind').value, city_at:$('#f-city').value,
                   date_at:$('#f-date').value, rotate:-14 }) }
};
const $ = s => document.querySelector(s);
let MODE = 'po';
let rows = [], cur = null, isNew = false, pending = null;
const M = () => MODES[MODE];

let toastT;
function toast(msg, kind){
  const t = $('#toast'); t.textContent = msg; t.className = 'on ' + (kind||'');
  clearTimeout(toastT); toastT = setTimeout(()=> t.className='', 3600);
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toLocal = t => t ? new Date(new Date(t).getTime() - new Date().getTimezoneOffset()*60000)
                          .toISOString().slice(0,16) : '';
const fromLocal = v => v ? new Date(v).toISOString() : null;

/* 지금 발행 중인가 — eg_postage_on_sale()과 같은 규칙을 화면에서도 센다 */
function onSale(r){
  if(!r.active || !r.art_url) return false;
  if(MODE === 'pm') return true;          /* 소인은 우체국 도구다 — 발행 기간이 없다 */
  if(r.always_on) return true;
  const now = Date.now();
  if(r.opens_at  && now <  new Date(r.opens_at).getTime())  return false;
  if(r.closes_at && now >= new Date(r.closes_at).getTime()) return false;
  return true;
}

/* ── 문지기 ── */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $('#gate').hidden = false; return; }
  const { data:isAdmin } = await sb.rpc('eg_is_admin');
  if(!isAdmin){
    $('#gate').hidden = false;
    $('#gate').innerHTML = '<h2>우표 공방</h2><p>이 문은 살롱지기에게만 열립니다.</p>';
    return;
  }
  $('#gate').hidden = true;
  $('#app').hidden = false;
  $('#f-shape').innerHTML = SHAPES.map(([v,k])=>`<option value="${v}">${k}</option>`).join('');
  $('#f-kind').innerHTML  = KINDS.map(([v,k])=>`<option value="${v}">${k}</option>`).join('');
  const spots = SPOTS.map(([v,k])=>`<option value="${v}">${k}</option>`).join('');
  $('#f-city').innerHTML = spots; $('#f-date').innerHTML = spots;
  await load();
}
$('#loginBtn').addEventListener('click', async () => {
  const { error } = await sb.auth.signInWithPassword({
    email:$('#em').value.trim(), password:$('#pw').value });
  if(error){ toast('들어가지 못했습니다 — ' + error.message, 'bad'); return; }
  boot();
});

/* ── 목록 ── */
async function load(){
  const { data, error } = await sb.from(M().tbl).select('*').order('sort').order('code');
  if(error){ toast('불러오지 못했습니다 — ' + error.message, 'bad'); return; }
  rows = data || [];
  $('#cnt-all').textContent = rows.length;
  $('#cnt-on').textContent  = rows.filter(onSale).length;
  $('#list').innerHTML = rows.map((r,i) => `
    <div class="item${cur && cur.code===r.code ? ' on':''}" data-i="${i}">
      <span class="dot ${onSale(r)?'on':'off'}" title="${onSale(r)?'발행 중':'발행 안 함'}"></span>
      <span class="thumb">${ r.art_url ? `<img src="${esc(r.art_url)}" alt="">`
                                        : '<span class="none">없음</span>' }</span>
      <span class="item-t">
        <span class="item-n">${esc(r.name)}</span>
        <span class="item-c">${esc(r.code)}${r.motto ? ' · ' + esc(r.motto) : ''}</span>
      </span>
    </div>`).join('');
  $('#list').querySelectorAll('.item').forEach(el =>
    el.addEventListener('click', () => pick(rows[+el.dataset.i])));
}

function pick(r){
  cur = r; isNew = false; pending = null;
  $('#edit').hidden = false;
  $('#edit-h').textContent = r.name || '우표 한 장';
  $('#f-code').value = r.code; $('#f-code').disabled = true;
  $('#f-name').value  = r.name  || '';
  $('#f-motto').value = r.motto || '';
  $('#f-shape').value = r.shape || 'portrait';
  $('#f-ratio').value = r.ratio ?? 0.78;
  $('#f-hue').value   = r.hue || '#8a7659';
  $('#f-kind').value  = r.kind    || 'round';
  $('#f-city').value  = r.city_at || 'top';
  $('#f-date').value  = r.date_at || 'center';
  $('#f-open').value  = toLocal(r.opens_at);
  $('#f-close').value = toLocal(r.closes_at);
  $('#f-always').checked = !!r.always_on;
  $('#f-active').checked = !!r.active;
  $('#f-sort').value  = r.sort ?? 100;
  $('#f-note').value  = r.note || '';
  paintPreview(r.art_url, +$('#f-ratio').value);
  $('#meta').innerHTML = r.art_url
    ? `<b>${onSale(r) ? '<span class="good">지금 발행 중입니다</span>'
                      : '<span class="warn">발행 중이 아닙니다</span>'}</b>`
    : '<span class="warn">그림이 없어 발행되지 않습니다.</span>';
  load();
}

$('#addBtn').addEventListener('click', () => {
  cur = { code:'', name:'', motto:'', shape:'portrait', ratio:0.78, hue:'#8a7659',
          kind:'round', city_at:'top', date_at:'center',
          always_on:false, active:true, sort:100, note:'', art_url:null };
  isNew = true; pending = null;
  $('#edit').hidden = false; $('#edit-h').textContent = '새 우표';
  $('#f-code').disabled = false;
  ['code','name','motto','note'].forEach(k => $('#f-'+k).value = '');
  $('#f-shape').value='portrait'; $('#f-ratio').value=0.78; $('#f-hue').value='#8a7659';
  $('#f-open').value=''; $('#f-close').value='';
  $('#f-always').checked=false; $('#f-active').checked=true; $('#f-sort').value=100;
  paintPreview(null, 0.78);
  $('#meta').innerHTML = '<span class="warn">그림을 올려야 발행됩니다.</span>';
});

/* ── 미리보기 — 편지지 위에 그대로 얹는다 ──
   ⚠⚠ 0813 — 톱니를 CSS로 그리지 않는다. **그림이 이미 톱니를 지고 있다.**
      한 물건을 두 곳에서 만들면 두 겹으로 찍힌다(소로가 잡으심).
   ⚠ 긴 변을 기준으로 잰다. 높이를 고정하면 세로로 긴 우표가 홀쭉이로 보이고
      가로로 긴 우표가 거인이 된다 — 다섯 장을 나란히 못 견준다. */
/* 우표 칸 · 소인 칸 — 갈피에 따라 갈린다 */
const PO_ONLY = ['f-motto','f-shape','f-ratio','f-hue','f-open','f-close'];
window.setMode = function(m){
  if(MODE === m) return;
  MODE = m; cur = null; isNew = false; pending = null;
  $('#mode-po').classList.toggle('on', m==='po');
  $('#mode-pm').classList.toggle('on', m==='pm');
  $('#edit').hidden = true;
  PO_ONLY.forEach(id => { const el = $('#'+id); if(el) el.closest('.f').hidden = (m!=='po'); });
  const alw = $('#f-always').closest('label'); if(alw) alw.style.visibility = (m==='po') ? '' : 'hidden';
  $('#pm-fields').hidden = (m!=='pm');
  $('#addBtn').textContent = (m==='po') ? '＋ 새 우표 (기념 발행)' : '＋ 새 소인';
  $('#drop').innerHTML = (m==='po')
    ? '여기에 던지거나 눌러서 고르세요<br><span style="font-size:10.5px">흰 여백을 잘라내고 WebP로 굽습니다 · 색은 그대로 둡니다</span>'
    : '여기에 던지거나 눌러서 고르세요<br><span style="font-size:10.5px">⚠ 글자가 든 소인은 물립니다 — 도시와 날짜는 셸이 얹습니다</span>';
  load();
};

window.setStage = function(k){
  $('#stage').className = 'stage ' + k;
  $('#sw-p').classList.toggle('on', k==='paper');
  $('#sw-a').classList.toggle('on', k==='alpha');
};
const PV_LONG = 150;
function paintPreview(url, ratio){
  const r = ratio || 0.78;
  const W = r >= 1 ? PV_LONG : Math.round(PV_LONG * r);
  const H = r >= 1 ? Math.round(PV_LONG / r) : PV_LONG;
  $('#pv').innerHTML = `<div class="sheet" style="width:${W}px;height:${H}px">${
    url ? `<img src="${esc(url)}" alt="">`
        : `<div class="empty">그림 없음</div>` }</div>`;
}

$('#f-ratio').addEventListener('input', () =>
  paintPreview(pending ? pending.url : (cur && cur.art_url), +$('#f-ratio').value));

/* ── 그림 굽기 ──
   ⚠⚠ 별 도장의 bake()를 가져다 쓰면 안 된다. 그것은 밝기를 알파로 바꾸는 마스크 굽기다.
      우표는 **색이 살아야 하는 그림**이라 색을 그대로 두고 흰 여백만 잘라낸다. */
async function bakeColor(file){
  const bmp = await createImageBitmap(file);
  const c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  const ctx = c.getContext('2d', { willReadFrequently:true });
  ctx.drawImage(bmp, 0, 0);
  const d = ctx.getImageData(0,0,c.width,c.height).data;

  /* 흰 여백 재기 — 밝기 246 아래를 「그림」으로 본다 */
  let x0=c.width, y0=c.height, x1=-1, y1=-1;
  for(let y=0; y<c.height; y++){
    for(let x=0; x<c.width; x++){
      const i=(y*c.width+x)*4;
      if(d[i+3] < 12) continue;
      const v = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      if(v < 246){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    }
  }
  if(x1 < 0) throw new Error('그림이 한 점도 없습니다. 흰 배경에 그린 우표가 맞는지 봐 주세요.');

  /* ⭐⭐ 0813 — 바깥 흰 곳만 투명으로 (소로가 잡으심)
     삼각 우표는 파일이 네모라 아래 두 귀퉁이가 흰 여백이다. 그대로 두면
     미색 편지지 위에 **흰 네모**가 뜬다.
     ⚠ 그렇다고 흰 곳을 모조리 지우면 안 된다 — 러프·하늘·여백처럼
       우표 **안쪽의 흰 곳**까지 뚫려 우표에 구멍이 난다.
     ⭐ 그래서 네 귀퉁이에서 물을 부어 흰 길로만 흘려보낸다(flood fill).
       잉크 테두리에 막혀 안쪽 흰 섬에는 물이 안 닿는다. */
  const WHITE = 243;                       /* 이 밝기 위를 「바깥일 수 있는 흰 곳」으로 본다 */
  const N = c.width * c.height;
  const seen = new Uint8Array(N);
  const stack = [0, c.width-1, (c.height-1)*c.width, N-1];
  const lum = i => 0.299*d[i*4] + 0.587*d[i*4+1] + 0.114*d[i*4+2];
  let painted = 0;
  const push = p => {
    if(p < 0 || p >= N || seen[p]) return;
    if(d[p*4+3] > 8 && lum(p) < WHITE) return;       /* 잉크를 만나면 멈춘다 */
    seen[p] = 1; painted++; stack.push(p);           /* ⚠ 담을 때 표시한다 — 통이 네 배로 부푸는 것을 막는다 */
  };
  for(const p of stack.splice(0)) push(p);
  while(stack.length){
    const p = stack.pop(), x = p % c.width;
    if(x > 0)         push(p-1);
    if(x < c.width-1) push(p+1);
    if(p >= c.width)  push(p-c.width);
    if(p < N-c.width) push(p+c.width);
  }
  for(let p=0; p<N; p++) if(seen[p]) d[p*4+3] = 0;
  ctx.putImageData(new ImageData(d, c.width, c.height), 0, 0);
  const cutPct = Math.round(painted / N * 100);

  /* 귀퉁이 검사 — 회색기가 있으면 편지지 위에 네모 얼룩이 뜬다 */
  const m = Math.max(8, Math.round(Math.min(c.width,c.height)*0.014));
  let sum=0, n=0;
  const corner = (sx,sy) => { for(let y=sy;y<sy+m;y++) for(let x=sx;x<sx+m;x++){
    const i=(y*c.width+x)*4; sum += 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; n++; } };
  corner(0,0); corner(c.width-m,0); corner(0,c.height-m); corner(c.width-m,c.height-m);
  const cornerLum = sum/n;

  const w=x1-x0+1, h=y1-y0+1, s=Math.min(1, 620/Math.max(w,h));
  const out = document.createElement('canvas');
  out.width = Math.round(w*s); out.height = Math.round(h*s);
  const o = out.getContext('2d'); o.imageSmoothingQuality = 'high';
  o.drawImage(c, x0, y0, w, h, 0, 0, out.width, out.height);

  let blob = await new Promise(r => out.toBlob(r, 'image/webp', 0.94));
  if(!blob) blob = await new Promise(r => out.toBlob(r, 'image/png'));
  const ext = blob.type === 'image/webp' ? 'webp' : 'png';
  return { blob, ext, url:URL.createObjectURL(blob), w:out.width, h:out.height,
           ratio:+(out.width/out.height).toFixed(2), cornerLum:Math.round(cornerLum), cutPct };
}

const drop = $('#drop'), file = $('#file');
drop.addEventListener('click', () => file.click());
['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => {
  e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => {
  e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { if(e.dataTransfer.files[0]) take(e.dataTransfer.files[0]); });
file.addEventListener('change', () => { if(file.files[0]) take(file.files[0]); });

async function take(f){
  try{
    const r = await bakeColor(f);
    pending = r;
    $('#f-ratio').value = r.ratio;
    paintPreview(r.url, r.ratio);
    if(MODE === 'pm') setStage('alpha');
    const bad = r.cornerLum < 249;
    $('#meta').innerHTML =
      `<b>${r.w}×${r.h}</b> · 가로÷세로 <b>${r.ratio}</b> · ${r.ext.toUpperCase()}<br>
       귀퉁이 밝기 <b class="${bad?'warn':'good'}">${r.cornerLum}</b>
       ${bad ? '— ⚠ 흰 바탕이 아닙니다. 다시 구우십시오.' : '— 순백입니다 ✔'}<br>
       바깥 흰 곳 <b class="good">${r.cutPct}%</b>를 투명으로 도려냈습니다 —
       편지지 위에 우표 모양 그대로 앉습니다<br>
       <span style="color:var(--dim)">저장을 눌러야 올라갑니다.</span>`;
    if(bad) toast('귀퉁이가 순백이 아닙니다 — 다시 구우시길 권합니다', 'bad');
  }catch(e){ toast(e.message, 'bad'); }
}

/* ── 저장 ── */
$('#saveBtn').addEventListener('click', async () => {
  const code = $('#f-code').value.trim();
  if(!code){ toast('코드를 적어 주세요', 'bad'); return; }
  if(!/^[a-z0-9_]+$/.test(code)){ toast('코드는 영문 소문자·숫자·밑줄만', 'bad'); return; }
  if(!$('#f-name').value.trim()){ toast('이름을 적어 주세요', 'bad'); return; }

  const btn = $('#saveBtn'); btn.disabled = true;
  try{
    let art = cur.art_url || null;
    if(pending){
      const key = `${M().dir}/${code}.${pending.ext}`;
      const { error:upErr } = await sb.storage.from(BUCKET)
        .upload(key, pending.blob, { upsert:true, contentType:pending.blob.type });
      if(upErr) throw upErr;
      const { data:pub } = sb.storage.from(BUCKET).getPublicUrl(key);
      art = pub.publicUrl + '?v=' + Date.now();     /* 캐시깨기 — 옛 그림이 남지 않게 */
    }
    /* ⚠ 두 표의 칸이 다르다. 공통분만 여기서 짓고, 나머지는 MODES가 붙인다 —
       한 표에 없는 칸을 보내면 통째로 튕긴다. */
    const row = Object.assign({
      code, name:$('#f-name').value.trim(), art_url:art,
      active:$('#f-active').checked, sort:+$('#f-sort').value || 100,
      note:$('#f-note').value.trim() || null
    }, M().row());
    if(MODE === 'po'){ row.motto = $('#f-motto').value.trim() || null; row.hue = $('#f-hue').value; }
    else             { row.ink = 'rgba(66,52,36,.55)'; }
    const { error } = isNew
      ? await sb.from(M().tbl).insert(row)
      : await sb.from(M().tbl).update(row).eq('code', code);
    if(error) throw error;

    /* ⚠ 「잘 됐겠지」 금지 — 쓴 뒤 되읽어서 눈으로 본다 */
    const { data:back, error:e2 } = await sb.from(M().tbl).select('*').eq('code', code).single();
    if(e2) throw e2;
    pending = null; isNew = false;
    toast(onSale(back) ? '저장했습니다 — 지금부터 발행 중입니다' : '저장했습니다', 'good');
    await load(); pick(back);
  }catch(e){ toast('저장하지 못했습니다 — ' + (e.message||e), 'bad'); }
  btn.disabled = false;
});

$('#cancelBtn').addEventListener('click', () => {
  pending = null;
  if(isNew){ $('#edit').hidden = true; cur = null; }
  else pick(cur);
});

$('#delBtn').addEventListener('click', async () => {
  if(!cur || isNew) return;
  if(!confirm(`「${cur.name}」 우표를 지웁니다.\n\n이미 부친 편지의 우표는 그대로 남습니다.\n다만 그 편지를 펼칠 때 그림을 못 찾습니다.\n\n발행만 멈추시려면 「살아 있음」을 끄는 편이 낫습니다.`)) return;
  const { error } = await sb.from(M().tbl).delete().eq('code', cur.code);
  if(error){ toast('지우지 못했습니다 — ' + error.message, 'bad'); return; }
  cur = null; $('#edit').hidden = true; toast('지웠습니다'); load();
});

boot();
</script>
</body>
</html>
