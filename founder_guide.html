<style>
  :root{
    --ink:#1F232B; --navy:#16243D; --gold:#C2921F; --gold-ink:#8A6712; --yellow:#F2C518;
    --muted:#5E6269; --soft:#6B7079; --faint:#8A9099; --rule:#EDEEF1; --line:#DCDFE4; --line2:#E4E6EA;
    --serif:'Noto Serif KR', 'Noto Serif CJK KR', serif;

  }
  html, body{ margin:0; height:100%; }
  body{ background:#C9CDD4; color:var(--ink); font-family:var(--serif);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  html.embed, html.embed body{ background:transparent; }
  ::selection{ background:rgba(194,146,31,.18); }

  /* 판 — 876 · 좌우 88 · 흰 바탕 · 패널 안에서만 스크롤 */
  #fgStage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #fgPanel{ position:relative; width:876px; max-height:calc(100vh - 80px); overflow-y:auto; overflow-x:hidden;
    background:#FFFFFF; border-radius:6px; box-shadow:0 26px 70px rgba(12,18,30,.34);
    overscroll-behavior:contain; scrollbar-width:none; -ms-overflow-style:none; }
  #fgPanel::-webkit-scrollbar{ display:none; width:0; height:0; }      /* ⭐ 소로 0917 — 스크롤바 감춤 */
  #fgPanel:focus{ outline:none; }

  .fg-top{ position:sticky; top:0; z-index:3; display:flex; justify-content:flex-end; padding:14px 18px 0;

  .fg-x{ width:34px; height:34px; display:flex; align-items:center; justify-content:center; padding:0;

  .fg-x:hover, .fg-x:focus-visible{ background:var(--navy); border-color:var(--navy); color:#FFFFFF; outline:none; }

  /* 장 */

  .fg-body > :last-child{ margin-bottom:0; }

  .fg-quote{ margin:44px 0; padding:0 0 0 24px; border-left:1px solid var(--gold);

  .fg-graph{ margin:56px 0; width:700px; box-sizing:border-box; background:#FFFFF8; border:1px solid #E8E4D6; padding:28px; }

  .fg-graph .sep{ height:1px; background:#E8E4D6; margin:24px 0 16px; }
  .fg-graph .gcap{ font:400 12.5px/1.85 var(--serif); color:var(--muted); word-break:keep-all; }
  .fg-graph .src{ margin-top:6px; font:400 11.5px/1.7 var(--mono); color:var(--faint); }

  .fg-bld{ margin:40px 0 56px; width:700px; }
  .fg-bld .row{ display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; }
  .fg-bld img{ display:block; width:100%; aspect-ratio:5 / 4; object-fit:cover; background:#F2F3F5; border-radius:2px; }
  .fg-bld .nm{ margin-top:9px; font:400 11px/1.5 var(--mono); letter-spacing:.06em; color:var(--navy); }
  .fg-bld .sl{ font:400 12px/1.6 var(--serif); color:var(--soft); }
  .fg-bld .attr{ margin-top:14px; font:400 11.5px/1 var(--mono); color:var(--faint); }

  /* 표 — 줄 밝힘 · 값표만 십자 */
  .fg-table{ margin:38px 0; width:700px; }
  .fg-table table{ width:100%; border-collapse:collapse; font:400 16px/1.6 var(--serif); color:var(--ink);
    font-variant-numeric:tabular-nums; }
  .fg-table.wide table{ font-size:15px; }
  .fg-table th{ padding:13px 18px; font-weight:500; font-size:14px; color:var(--navy); border-bottom:1px solid var(--navy);
    text-align:left; vertical-align:bottom; word-break:keep-all; transition:background .12s; }
  .fg-table td{ padding:15px 18px; border-bottom:1px solid var(--rule); text-align:left; transition:background .12s; }

  /* 약속 세 줄 */

  /* 끝 버튼 */
  .fg-end{ margin:72px 0 0; padding-top:44px; border-top:1px solid var(--line2); width:700px; }
  .fg-link{ display:inline-flex; align-items:center; gap:14px; padding:21px 34px; border:1px solid var(--navy); border-radius:3px;

    transition:background .16s, color .16s; }
  .fg-link .arr{ color:var(--yellow); font-size:19px; }
  .fg-link:hover, .fg-link:focus-visible{ background:var(--navy); color:#FFFFFF; outline:none; }

  /* 도해 — ③ 띠의 시각 언어 */
  .dg{ margin:56px 0; width:700px; }
  .dg-head{ display:flex; align-items:center; gap:14px; margin-bottom:12px; }
  .dg-title{ font:500 13px/1 var(--serif); color:var(--navy); letter-spacing:.02em; white-space:nowrap; }
  .dg-line{ flex:1; height:1px; background:var(--line); }
  .dg-meta{ font:400 11px/1 var(--mono); color:#9AA0A8; white-space:nowrap; }
  .dg-grid{ display:grid; border:1px solid var(--line); background:#FFFFFF; }
  .dg-cell{ height:72px; box-sizing:border-box; padding:8px 0 0 7px; border-right:1px solid #ECEEF1; background:#FBFBFC;
    font:400 11px/1 var(--mono); color:#9AA0A8; }
  .dg-cell:last-child{ border-right:0; }
  .dg-cell.on{ border-right:1px solid var(--gold); background:rgba(194,146,31,.16); font-weight:500; color:var(--gold-ink); }
  .dg-cell.rest{ background:rgba(194,146,31,.05); color:#A79A80; }
  .dg-cell.open{ background:var(--navy); color:#FFFFFF; padding-left:5px; font:500 11px/1.25 var(--serif); }
  .dg-notes{ display:grid; }
  .dg-note-on{ padding:12px 12px 0 0; text-align:right; border-right:1px solid var(--gold); font:500 13px/1.7 var(--serif); color:var(--gold-ink); }
  .dg-note-mark{ padding:12px 0 0 12px; border-left:1px solid var(--gold); font:500 13px/1.7 var(--serif); color:var(--gold-ink); }
  .dg-note{ padding:12px 0 0 12px; border-top:1px solid var(--line); font:400 13px/1.7 var(--serif); color:var(--muted); }
  .dg-note.plain{ border-top:0; padding-left:0; }
  .dg-foot{ margin-top:30px; padding-top:18px; border-top:1px solid var(--rule); font:400 17px/1.9 var(--serif); color:var(--navy); word-break:keep-all; }
  .dg-sub{ margin-top:34px; }

  /* ⑤ 손님 막대 */
  .dg-lane{ display:grid; grid-template-columns:repeat(22, 1fr); align-items:center; height:30px; margin-top:8px; }
  .dg-bar{ height:18px; box-sizing:border-box; background:rgba(194,146,31,.16); border:1px solid rgba(194,146,31,.55); }
  .dg-bar.tail{ position:relative; background:linear-gradient(90deg, rgba(194,146,31,.16) 0 85.714%, rgba(194,146,31,.38) 85.714% 100%); }
  .dg-bar.tail b{ position:absolute; left:10px; top:0; font:400 11.5px/16px var(--serif); font-weight:400; color:var(--gold-ink); white-space:nowrap; }
  .dg-bar.go{ border-right:0; background:linear-gradient(90deg, rgba(194,146,31,.28), rgba(194,146,31,0)); }
  .dg-lab{ font:400 12.5px/1.4 var(--serif); color:var(--muted); white-space:nowrap; }
  .dg-lab.r{ text-align:right; padding-right:10px; }
  .dg-lab.in{ padding-left:10px; }

  /* ⑥ 12개월 막대 */
  .dg-gantt{ position:relative; border:1px solid var(--line); background:#FFFFFF; padding:34px 18px 12px 52px; }
  .dg-gantt .rowg{ position:relative; height:18px; margin-bottom:10px; }
  .dg-gantt .who{ position:absolute; left:-38px; top:0; width:28px; text-align:right; font:400 12px/18px var(--serif); color:var(--soft); }
  .dg-gantt .b{ position:absolute; top:0; height:18px; box-sizing:border-box; }
  .dg-gantt .b.in{ background:rgba(194,146,31,.30); border:1px solid rgba(194,146,31,.75); }
  .dg-gantt .b.out{ background:#F1F2F4; border:1px solid #DCDFE4; }
  .dg-gantt .b.cut{ border-right:0; }
  .dg-gantt .b span{ position:absolute; left:var(--lx, 8px); top:0; font:400 11.5px/16px var(--serif); color:var(--gold-ink); white-space:nowrap; }
  .dg-gantt .b.out span{ color:#9AA0A8; }
  .dg-gantt .now{ position:absolute; top:-20px; bottom:24px; width:0; border-left:1px solid var(--navy); }
  .dg-gantt .now i{ position:absolute; top:-14px; left:-30px; width:60px; text-align:center; font:500 11px/1 var(--serif);
    font-style:normal; color:var(--navy); background:#FFFFFF; }
  .dg-gantt .axis{ position:relative; height:20px; margin-top:4px; border-top:1px solid #ECEEF1; }
  .dg-gantt .axis b{ position:absolute; top:6px; transform:translateX(-50%); font:400 10.5px/1 var(--mono); font-weight:400; color:#9AA0A8; }

  /* ⑦ 흐름 9칸 */
  .dg-flow{ display:grid; grid-template-columns:repeat(9, 1fr); gap:8px; }
  .dg-step{ position:relative; min-height:96px; box-sizing:border-box; padding:10px 8px 8px; border:1px solid var(--line); background:#FBFBFC; }
  .dg-step i{ display:block; font:500 11px/1 var(--mono); font-style:normal; color:var(--gold); letter-spacing:.06em; }
  .dg-step b{ display:block; margin-top:10px; font:500 13px/1.45 var(--serif); color:var(--navy); word-break:keep-all; }
  .dg-step.key{ border-color:var(--gold); background:rgba(194,146,31,.12); }
  .dg-step + .dg-step::before{ content:""; position:absolute; left:-8px; top:47px; width:8px; height:1px; background:var(--line); }

  /* ② 역할 두 칸 */
  .dg-roles{ display:grid; grid-template-columns:340px 340px; gap:20px; }
  .dg-role{ box-sizing:border-box; border:1px solid var(--line); background:#FFFFFF; padding:24px 26px 22px; display:flex; flex-direction:column; }
  .dg-role .who{ font:400 12px/1 var(--mono); letter-spacing:.24em; color:var(--gold); }
  .dg-role h4{ margin:14px 0 16px; font:700 22px/1.45 var(--batang); color:var(--navy); word-break:keep-all; }
  .dg-role ul{ margin:0; padding:0; list-style:none; flex:1; }
  .dg-role li{ padding:9px 0; border-top:1px solid var(--rule); font:400 15px/1.6 var(--serif); color:var(--ink); word-break:keep-all; }
  .dg-role .last{ margin-top:14px; padding-top:12px; border-top:1px solid var(--navy); font:400 13px/1.7 var(--serif); color:var(--muted); word-break:keep-all; }
  .dg-both{ display:flex; align-items:center; gap:14px; margin-top:18px; font:500 13px/1 var(--serif); color:var(--navy); white-space:nowrap; }
  .dg-both::before, .dg-both::after{ content:""; flex:1; height:1px; background:var(--line); }
</style>

<script>
(function () {
  const V = '0917';
  const SUPA_URL = 'https://cyhlotwdisjvoxvfkpnd.supabase.co';
  const SUPA_KEY = 'sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
  const EMBED = document.documentElement.classList.contains('embed');
  const $main = document.getElementById('fgMain');
  const $panel = document.getElementById('fgPanel');

  /* ── 닫기: 창 안에서는 집주인(terra)에게 알린다 ── */
  function close() {
    if (EMBED) { try { window.parent.postMessage({ type: 'fg-close' }, location.origin); } catch (_) {} }
    else location.href = 'terra.html';
  }
  document.getElementById('fgClose').addEventListener('click', close);
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.preventDefault(); close(); } });
  document.getElementById('fgStage').addEventListener('mousedown', (e) => { if (EMBED && e.target.id === 'fgStage') close(); });

  /* ── 글자 ── */
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const inline = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

  /* ── 표 — 첫 칸은 왼쪽, 「원 · 장」으로 끝나는 칸만 오른쪽 ── */
  function table(block) {
    const rows = block.split('\n').map((l) => l.trim()).filter((l) => l.startsWith('|'))
      .map((l) => l.replace(/^\||\|$/g, '').split('|').map((c) => c.trim()));
    const head = rows[0];
    const body = rows.slice(2);
    const right = head.map((_, i) => i > 0 && body.length > 0 && body.every((r) => /[원장]$/.test(r[i] || '')));
    const wide = head.length >= 6;
    let h = '<div class="fg-table' + (wide ? ' wide' : '') + '"><table' + (wide ? ' data-cross="1"' : '') + '><thead><tr>';
    head.forEach((c, i) => { h += '<th' + (right[i] ? ' class="r"' : '') + '>' + inline(c) + '</th>'; });
    h += '</tr></thead><tbody>';
    body.forEach((r) => { h += '<tr>' + r.map((c, i) => '<td' + (right[i] ? ' class="r"' : '') + '>' + inline(c) + '</td>').join('') + '</tr>'; });
    return h + '</tbody></table></div>';
  }

  /* ── 도판 ── */
  const img = (src, alt, eager) => '<img src="' + src + '?v=' + V + '" alt="' + esc(alt) + '"' + (eager ? '' : ' loading="lazy"') + ' decoding="async">';

  const FIG = {
    'photo-arrow': () => '<figure class="fg-fig">' + img('fg01_arrow.webp', '피레네 산골 갈림길에서 돌담에 노란 화살표를 칠하는 신부의 뒷모습', true) +
      '<figcaption class="fg-cap">AI로 재현한 장면입니다</figcaption></figure>',

    'photo-table': () => '<figure class="fg-fig">' + img('fg02_table.webp', '해 질 녘 돌담 아래 긴 식탁에 둘러앉은 카미노의 벗들') +
      '<figcaption class="fg-cap">AI로 재현한 장면입니다</figcaption></figure>',

    roles: () => '<figure class="dg"><div class="dg-roles">' +
      '<div class="dg-role"><div class="who">EG유니버스</div><h4>식탁을 차립니다</h4><ul>' +
        '<li>매일 그림 한 점과 곡 하나</li><li>한 주에 세 번 카페의 문장</li><li>한 주에 두 번 야구장 경기</li><li>매달 학술원의 새 책</li>' +
      '</ul><div class="last">이 일을 30년 동안 멈추지 않습니다</div></div>' +
      '<div class="dg-role"><div class="who">파운더님</div><h4>사람들을 초대하십니다</h4><ul>' +
        '<li>「여기 좋은 식탁이 있어요」라는 한마디</li><li>파운더님이 이름을 지은 건물</li><li>하시던 일은 그대로</li>' +
      '</ul><div class="last">오신 분들을 가르치거나 붙들어 두실 필요는 없습니다</div></div>' +
      '</div><div class="dg-both">두 일은 서로를 대신할 수 없습니다</div></figure>',

    strip14: () => {
      let cells = '';
      for (let d = 1; d <= 14; d++) cells += '<div class="dg-cell' + (d === 3 ? ' on' : d > 3 ? ' rest' : '') + '">' + d + '</div>';
      return '<figure class="dg">' +
        '<div class="dg-head"><div class="dg-title">준회원 2주</div><div class="dg-line"></div><div class="dg-meta">14일</div></div>' +
        '<div class="dg-grid" style="grid-template-columns:repeat(14,1fr)">' + cells + '</div>' +
        '<div class="dg-notes" style="grid-template-columns:repeat(14,1fr)">' +
          '<div class="dg-note-on" style="grid-column:1 / 4">사흘째 정회원 신청</div>' +
          '<div class="dg-note" style="grid-column:4 / 15">남은 11일 × 1,001원 = 11,011원 공제</div>' +
        '</div>' +
        '<figcaption class="dg-foot">→ 첫 달 19,019원 → 둘째 달부터 30,030원</figcaption></figure>';
    },

    buildings: () => {
      const B = [
        ['fg04_maison.webp', 'MAISON', '파리 · 27슬롯'],
        ['fg04_house.webp', 'HOUSE', '런던 · 27슬롯'],
        ['fg04_loft.webp', 'LOFT', '뉴욕 · 81슬롯'],
        ['fg04_tower.webp', 'TOWER', '뉴욕 · 108 · 216슬롯'],
      ];
      return '<figure class="fg-bld"><div class="row">' +
        B.map((b) => '<div>' + img(b[0], b[1] + ' ' + b[2]) + '<div class="nm">' + b[1] + '</div><div class="sl">' + b[2] + '</div></div>').join('') +
        '</div><figcaption class="attr">지도 이미지 © Google</figcaption></figure>';
    },

    strip21: () => {
      let cells = '';
      for (let d = 1; d <= 21; d++) cells += '<div class="dg-cell' + (d === 15 ? ' on' : '') + '">' + d + '</div>';
      cells += '<div class="dg-cell open">개관</div>';
      const G = 'grid-template-columns:repeat(22,1fr)';
      return '<figure class="dg">' +
        '<div class="dg-head"><div class="dg-title">건물의 시계 — 베타 3주</div><div class="dg-line"></div><div class="dg-meta">21일 · 다음 날 개관</div></div>' +
        '<div class="dg-grid" style="' + G + '">' + cells + '</div>' +
        '<div class="dg-notes" style="' + G + '">' +
          '<div class="dg-note plain" style="grid-column:1 / 15">베타 시작일은 파운더님과 함께 정합니다</div>' +
          '<div class="dg-note-mark" style="grid-column:15 / 23">개관 1주일 전 · 바우처 첫 지급분</div>' +
        '</div>' +
        '<div class="dg-head dg-sub"><div class="dg-title">손님의 시계 — 들어온 날부터 각자 3주</div><div class="dg-line"></div><div class="dg-meta">사람마다 다름</div></div>' +
        '<div class="dg-lane"><div class="dg-bar tail" style="grid-column:1 / 22"><b>첫날 들어온 손님 · 3주</b></div></div>' +
        '<div class="dg-notes" style="' + G + '">' +
          '<div class="dg-note-on" style="grid-column:1 / 19">끝나기 3일 전부터 바우처를 건넬 수 있습니다 · 한 장이면 2주 더</div>' +
        '</div>' +
        '<div class="dg-lane" style="margin-top:14px"><div class="dg-lab r" style="grid-column:1 / 21">마지막 날 들어온 손님도 개관 뒤 3주를 온전히</div><div class="dg-bar go" style="grid-column:21 / 23"></div></div>' +
        '<figcaption class="dg-foot">베타 첫날 정회원 신청 → 20일 × 1,001원 = 20,020원 공제 → 첫 달 10,010원</figcaption></figure>';
    },

    bars12: () => {
      const M = 18;                                   /* 보이는 창 18개월 · 이번 달 13 */
      const NOW = 13;
      const P = [['가', 1], ['나', 3], ['다', 6], ['라', 9], ['마', 13]];
      const x = (m) => ((m - 1) / M * 100).toFixed(3) + '%';
      let rows = '';
      P.forEach(([who, s]) => {
        const e = s + 12;                             /* 첫 회비 달부터 12개월 → e 는 끝난 다음 달 */
        const inNow = NOW >= s && NOW < e;
        const cut = e - 1 > M;
        const w = ((Math.min(e, M + 1) - s) / M * 100).toFixed(3) + '%';
        const note = !inNow ? '12개월이 지나 인원에서 빠짐' : (s === NOW ? '이번 달 첫 회비' : '');
        rows += '<div class="rowg"><div class="who">' + who + '</div><div class="b ' + (inNow ? 'in' : 'out') + (cut ? ' cut' : '') +
          '" style="left:' + x(s) + ';width:' + w + '">' + (note ? '<span' + (s === NOW ? ' style="--lx:22px"' : '') + '>' + note + '</span>' : '') + '</div></div>';
      });
      let axis = '';
      for (let m = 1; m <= M; m++) axis += '<b style="left:' + ((m - 0.5) / M * 100).toFixed(3) + '%">' + m + '</b>';
      return '<figure class="dg">' +
        '<div class="dg-head"><div class="dg-title">한 분마다 따로 세는 12개월</div><div class="dg-line"></div><div class="dg-meta">개월</div></div>' +
        '<div class="dg-gantt"><div style="position:relative">' + rows +
          '<div class="now" style="left:' + ((NOW - 0.5) / M * 100).toFixed(3) + '%"><i>이번 달</i></div>' +
          '<div class="axis">' + axis + '</div></div></div>' +
        '<figcaption class="dg-foot">이번 달에 걸린 막대 4명 → 1 ~ 9명 → 요율 50%</figcaption></figure>';
    },

    flow9: (next) => {
      const steps = String(next || '').split('→').map((s) => s.trim()).filter(Boolean);
      return '<figure class="dg"><div class="dg-flow">' +
        steps.map((s, i) => '<div class="dg-step' + (/대시보드/.test(s) ? ' key' : '') + '"><i>' + String(i + 1).padStart(2, '0') + '</i><b>' + esc(s) + '</b></div>').join('') +
        '</div></figure>';
    },
  };

  /* ── 문안 한 장 → HTML ── */
  function chapter(row, i) {
    const blocks = String(row.body || '').replace(/\r/g, '').split(/\n{2,}/).map((b) => b.trim()).filter(Boolean);
    let h = '';
    for (let k = 0; k < blocks.length; k++) {
      const b = blocks[k];
      const lines = b.split('\n').map((l) => l.trim());
      if (b.startsWith('@graph')) {
        const cap = lines.find((l) => l.startsWith('그림 설명:')) || '';
        const src = lines.find((l) => l.startsWith('출처:')) || '';
        h += '<figure class="fg-graph">' + img('fg01_graph.webp', 'Share of US Labor Output — AI 2040: Plan A', true) +
          '<div class="sep"></div><figcaption><div class="gcap">' + esc(cap) + '</div><div class="src">' + esc(src) + '</div></figcaption></figure>';
      } else if (b.startsWith('@link')) {
        const t = b.replace(/^@link\s*/, '').replace(/\s*→\s*$/, '');
        h += '<div class="fg-end"><a class="fg-link" id="fgToCities" href="#" role="button"><span>' + esc(t) + '</span><span class="arr" aria-hidden="true">→</span></a></div>';
      } else if (b.startsWith('@fig')) {
        const name = lines[0].replace(/^@fig\s*/, '').trim();
        if (name === 'flow9') { h += FIG.flow9(blocks[k + 1]); k++; }
        else if (FIG[name]) h += FIG[name]();
      } else if (lines.every((l) => l.startsWith('|'))) {
        h += table(b);
      } else if (/^\*\*[^*]+\*\*$/.test(b)) {
        h += '<h3>' + esc(b.slice(2, -2)) + '</h3>';
      } else if (/^「[^」]+」$/.test(b)) {
        h += '<blockquote class="fg-quote">' + esc(b) + '</blockquote>';
      } else if (lines.length >= 2 && lines.every((l) => /겠습니다\.$/.test(l))) {
        h += '<div class="fg-vows">' + lines.map((l) => '<div>' + esc(l) + '</div>').join('') + '</div>';
      } else if (/^부가세는 별도입니다\.$/.test(b)) {
        h += '<p class="fg-small">' + esc(b) + '</p>';
      } else {
        h += '<p>' + lines.map(inline).join('<br>') + '</p>';
      }
    }
    const n = Math.round((row.ord || (i + 1) * 10) / 10);
    return '<section class="fg-ch" id="ch' + n + '"><div class="fg-chead"><div class="fg-no">제 ' + n + ' 장</div>' +
      '<h2>' + esc(row.title || '') + '</h2></div><div class="fg-body">' + h + '</div></section>';
  }

  /* ── 표 거동 — 줄 밝힘, 값표는 줄 + 칸, 만나는 칸은 금색 ── */
  function wireTables() {
    $main.querySelectorAll('.fg-table table').forEach((t) => {
      const clear = () => t.querySelectorAll('td,th').forEach((c) => { c.style.background = ''; });
      t.addEventListener('mouseover', (e) => {
        const cell = e.target.closest('td,th');
        clear();
        if (!cell || !t.contains(cell)) return;
        const row = cell.parentElement;
        row.querySelectorAll('td,th').forEach((c) => { c.style.background = 'rgba(22,36,61,.035)'; });
        if (t.dataset.cross === '1') {
          const i = Array.prototype.indexOf.call(row.children, cell);
          t.querySelectorAll('tr').forEach((r) => { const c = r.children[i]; if (c) c.style.background = 'rgba(22,36,61,.035)'; });
          if (cell.tagName === 'TD' && i > 0) cell.style.background = 'rgba(194,146,31,.13)';
        }
      });
      t.addEventListener('mouseleave', clear);
    });
  }

  /* ── 끝 버튼 — ⏳ EG도시별현황 · 전자계약서가 서면 여기서 연다 ── */
  function wireLink() {
    const a = document.getElementById('fgToCities');
    if (!a) return;
    a.addEventListener('click', (e) => {
      e.preventDefault();
      if (EMBED) { try { window.parent.postMessage({ type: 'fg-link' }, location.origin); } catch (_) {} }
    });
  }

  /* ── 클라이언트 — 창 안이면 집주인 것 ── */
  function loadScript(src) {
    return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  }
  async function client() {
    try { if (window.parent !== window && window.parent.egSupa) return window.parent.egSupa; } catch (_) {}
    if (!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
    return window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { storageKey: 'eungyo-auth', persistSession: true, autoRefreshToken: true } });
  }

  async function rows() {
    const q = new URLSearchParams(location.search);
    if (q.get('fixture') && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {   /* 파이스 시험용 — 로컬에서만 */
      return (await fetch(q.get('fixture'))).json();
    }
    const sb = await client();
    const { data, error } = await sb.from('eg_founder_guide').select('slug,ord,num,title,body').order('ord');
    if (error) throw error;
    return data || [];
  }

  (async function boot() {
    try {
      const data = await rows();
      if (!data.length) { $main.innerHTML = '<p class="fg-wait">안내를 열 수 없습니다.</p>'; return; }
      $main.innerHTML = data.map(chapter).join('');
      wireTables();
      wireLink();
      $panel.focus({ preventScroll: true });
    } catch (e) {
      console.warn('[founder_guide]', e);
      $main.innerHTML = '<p class="fg-wait">안내를 열 수 없습니다.</p>';
    }
  })();
})();
</script>
</body>
</html>
