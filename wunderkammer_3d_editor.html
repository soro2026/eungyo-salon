<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전시 자세 편집 · EG 분더카머</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0d0b10; --panel:#15121a; --line:#2a2530;
    --ink:#ece4d4; --dim:#8a8276; --gold:#c9a86a; --wine:#6e1f2e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans KR",system-ui,sans-serif;}
  /* 미리보기 전시실 (세로) */
  .stage{
    position:relative; width:100%; height:56vh; min-height:340px;
    background:#1a0c10 center/cover no-repeat; overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  model-viewer{position:absolute; inset:0; width:100%; height:100%;
    background:transparent; --poster-color:transparent;}
  .stage .badge{position:absolute; top:12px; left:12px; z-index:3;
    font-size:11px; letter-spacing:.2em; color:var(--gold);
    background:rgba(10,8,12,.7); padding:5px 10px; border-radius:14px;
    border:1px solid var(--line);}
  /* 컨트롤 */
  .wrap{max-width:560px; margin:0 auto; padding:18px 16px 60px;}
  h1{font-size:17px; margin:6px 0 2px; font-weight:600;}
  .sub{color:var(--dim); font-size:12.5px; margin:0 0 18px;}
  .grp{margin:0 0 16px;}
  .grp.lead .ctrl{background:rgba(201,168,106,.07); border-color:#4a3f2a;}
  .ctrl{display:grid; grid-template-columns:64px 1fr 52px; align-items:center;
    gap:10px; padding:9px 12px; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; margin-bottom:8px;}
  .ctrl label{font-size:12.5px; color:var(--ink);}
  .ctrl label .hint{display:block; font-size:10px; color:var(--dim); margin-top:1px;}
  .ctrl input[type=range]{width:100%; accent-color:var(--gold); height:22px;}
  .ctrl output{font-size:12px; color:var(--gold); text-align:right;
    font-variant-numeric:tabular-nums;}
  .btns{display:flex; gap:8px; margin:18px 0 12px;}
  button{font:inherit; cursor:pointer; border-radius:10px; padding:12px 14px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    font-size:13px; flex:1; transition:.12s;}
  button:hover{border-color:var(--gold);}
  button.save{background:var(--wine); border-color:#9a3a4e; font-weight:600;}
  button.save:hover{background:#86283a;}
  .json{font-family:ui-monospace,monospace; font-size:11px; color:var(--dim);
    background:#0a0810; border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; white-space:pre-wrap; word-break:break-all; margin-top:6px;}
  .note{font-size:11.5px; color:var(--dim); line-height:1.6; margin-top:10px;}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:#1a1620; border:1px solid var(--gold); color:var(--ink);
    padding:11px 18px; border-radius:22px; font-size:13px; z-index:40;
    opacity:0; pointer-events:none; transition:.25s;}
  .toast.on{opacity:1;}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="badge" id="badge">전시 자세 편집</div>
    <model-viewer id="mv" camera-controls interaction-prompt="none"
      shadow-intensity="0.9" exposure="1.05"></model-viewer>
  </div>

  <div class="wrap">
    <h1 id="title">밀로의 비너스</h1>
    <p class="sub">슬라이더로 좌대에 맞춘 뒤 <b>이 자세로 저장</b>하세요. 관람 화면은 저장된 자세로 좌우 회전만 합니다.</p>

    <!-- 좌대 맞추기 = 상하 위치가 핵심 → 맨 위 강조 -->
    <div class="grp lead">
      <div class="ctrl">
        <label>↕ 높이<span class="hint">좌대에 발 맞추기</span></label>
        <input type="range" id="ty" min="-80" max="80" step="1">
        <output id="ty_o"></output>
      </div>
      <div class="ctrl">
        <label>↔ 좌우<span class="hint">가운데 정렬</span></label>
        <input type="range" id="tx" min="-60" max="60" step="1">
        <output id="tx_o"></output>
      </div>
    </div>

    <div class="grp">
      <div class="ctrl">
        <label>🔍 확대<span class="hint">가까이 / 멀리</span></label>
        <input type="range" id="radius" min="100" max="700" step="5">
        <output id="radius_o"></output>
      </div>
      <div class="ctrl">
        <label>↻ 좌우각<span class="hint">시작 방향</span></label>
        <input type="range" id="theta" min="-180" max="180" step="1">
        <output id="theta_o"></output>
      </div>
      <div class="ctrl">
        <label>⤢ 눈높이<span class="hint">올려다보기 90°</span></label>
        <input type="range" id="phi" min="20" max="160" step="1">
        <output id="phi_o"></output>
      </div>
      <div class="ctrl">
        <label>👁 시야<span class="hint">작을수록 망원</span></label>
        <input type="range" id="fov" min="10" max="60" step="1">
        <output id="fov_o"></output>
      </div>
      <div class="ctrl">
        <label>🌀 회전속도<span class="hint">관람 시 도는 속도</span></label>
        <input type="range" id="spd" min="0" max="40" step="1">
        <output id="spd_o"></output>
      </div>
      <div class="ctrl">
        <label>↕ 앞뒤<span class="hint">미세 깊이</span></label>
        <input type="range" id="tz" min="-60" max="60" step="1">
        <output id="tz_o"></output>
      </div>
    </div>

    <div class="btns">
      <button id="readBtn" type="button">손으로 돌린 화면 읽기</button>
      <button id="spinBtn" type="button">미리보기 회전 ▶</button>
    </div>
    <div class="btns">
      <button class="save" id="saveBtn" type="button">💾 이 자세로 저장</button>
    </div>

    <div class="json" id="json"></div>
    <p class="note">저장은 로그인(살롱지기) 상태에서 됩니다. 안 되면 자세값이 클립보드에 복사되니 파이스에게 전달하세요.</p>
  </div>

  <div class="toast" id="toast"></div>

<script type="module">
  const SUPA_URL='https://cyhlotwdisjvoxvfkpnd.supabase.co';
  const SUPA_KEY='sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
  const supa=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{storageKey:'eungyo-auth',persistSession:true,autoRefreshToken:true}});

  const slug=new URLSearchParams(location.search).get('slug')||'venus';
  const mv=document.getElementById('mv');
  const $=id=>document.getElementById(id);
  const ids=['ty','tx','tz','radius','theta','phi','fov','spd'];
  let spinning=false;

  function pose(){
    return {
      theta:+$('theta').value, phi:+$('phi').value, radius:+$('radius').value,
      fov:+$('fov').value, target:[+$('tx').value,+$('ty').value,+$('tz').value],
      rotSpeed:+$('spd').value, yawRange:null
    };
  }
  function apply(){
    const p=pose();
    mv.cameraTarget=`${p.target[0]}m ${p.target[1]}m ${p.target[2]}m`;
    mv.cameraOrbit=`${p.theta}deg ${p.phi}deg ${p.radius}m`;
    mv.fieldOfView=`${p.fov}deg`;
    mv.minCameraOrbit='auto auto auto';
    mv.maxCameraOrbit='auto auto 800m';
    ids.forEach(i=>$(i+'_o').value=$(i).value);
    $('json').textContent=JSON.stringify(p);
  }
  ids.forEach(i=>$(i).addEventListener('input',apply));

  function setSliders(p){
    $('theta').value=p.theta??0; $('phi').value=p.phi??86; $('radius').value=p.radius??340;
    $('fov').value=p.fov??32; $('spd').value=p.rotSpeed??14;
    const t=p.target||[0,0,0]; $('tx').value=t[0]; $('ty').value=t[1]; $('tz').value=t[2];
  }

  // 손으로 돌린 현재 카메라 → 슬라이더 동기화
  $('readBtn').onclick=()=>{
    const o=mv.getCameraOrbit(), t=mv.getCameraTarget(), f=mv.getFieldOfView();
    $('theta').value=Math.round(o.theta*180/Math.PI);
    $('phi').value=Math.round(o.phi*180/Math.PI);
    $('radius').value=Math.round(o.radius);
    $('fov').value=Math.round(f);
    $('tx').value=Math.round(t.x); $('ty').value=Math.round(t.y); $('tz').value=Math.round(t.z);
    apply(); toast('현재 화면을 슬라이더에 반영했습니다');
  };
  $('spinBtn').onclick=()=>{
    spinning=!spinning;
    mv.autoRotate=spinning;
    mv.setAttribute('rotation-per-second',$('spd').value+'deg');
    $('spinBtn').textContent=spinning?'미리보기 정지 ⏸':'미리보기 회전 ▶';
  };

  $('saveBtn').onclick=async()=>{
    const p=pose();
    const { error }=await supa.from('wunderkammer_3d')
      .update({pose:p, updated_at:new Date().toISOString()}).eq('slug',slug);
    if(error){
      try{ await navigator.clipboard.writeText(JSON.stringify(p)); }catch(e){}
      toast('⚠ 저장 실패(로그인 필요) — 자세값을 클립보드에 복사했습니다');
    } else {
      toast('✓ 저장됐습니다 — 관람 화면에 반영됩니다');
    }
  };

  function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');
    clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600);}

  // 로드: DB에서 보물 + pose
  (async()=>{
    const { data, error }=await supa.from('wunderkammer_3d')
      .select('title_ko,glb_url,bg_url,pose').eq('slug',slug).single();
    if(error||!data){ toast('보물을 찾지 못했습니다: '+slug); return; }
    document.getElementById('title').textContent=data.title_ko;
    document.getElementById('badge').textContent=data.title_ko+' · 자세 편집';
    if(data.bg_url) document.getElementById('stage').style.backgroundImage=`url('${data.bg_url}')`;
    mv.src=data.glb_url;
    setSliders(data.pose||{});
    apply();
  })();
</script>
</body>
</html>
