<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문항 열람실 · EG스타디움</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;800&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!--
  ⭐ 0929 소로 — 「검수기 같은 형식 말고, 분야 · 힌트 · 문제 · 정답 · 돌아보기를 한 세트로 한눈에」
  문항 열람실. 살롱지기(eg_is_admin)만 들어온다.
  · 한 문항 = 한 장의 카드 · 손님이 보는 순서대로 위에서 아래로
  · 탭 — 시범경기(preseason) · 정규시즌(rookie)
  · 카드마다 ✓ 봤음 · ✎ 메모 → quiz_review_marks(살롱지기만 읽고 씀)
  · 메모 = 파이스의 작업 목록(소로가 정리 → 파이스가 DB 에서 고친다 · fixed=true)
-->
<style>
  :root{ --paper:#F8F4EB; --paper2:#FFFDF7; --ink:#1A1916; --ink2:#3A342B; --dim:#8B8478; --gold:#8A6414; --line:rgba(26,25,22,.10); --blue:#1D4F9E; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:#EDE6D6; color:var(--ink); font-family:'Gowun Batang',serif; }
  a{ color:var(--gold); }

  #bar{ position:sticky; top:0; z-index:5; background:var(--paper); border-bottom:1px solid rgba(138,100,20,.25);
    box-shadow:0 2px 12px rgba(0,0,0,.06); }
  #barIn{ max-width:820px; margin:0 auto; padding:14px 20px 12px; }
  #ttl{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  #ttl h1{ margin:0; font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:19px; letter-spacing:.02em; }
  #ttl h1 small{ font-family:'EB Garamond',serif; font-weight:400; font-size:12px; color:var(--gold); letter-spacing:.2em; margin-left:8px; }
  #prog{ font-size:12.5px; color:var(--ink2); white-space:nowrap; }
  #prog b{ color:var(--gold); }
  #tabs{ display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; align-items:center; }
  .tab{ border:1px solid rgba(26,25,22,.18); background:transparent; color:var(--ink2); padding:6px 13px; border-radius:18px;
    font-family:inherit; font-size:13px; cursor:pointer; }
  .tab.on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .tab .c{ font-family:'EB Garamond',serif; font-size:12px; opacity:.7; margin-left:4px; }
  select,.flt{ font-family:inherit; font-size:12.5px; color:var(--ink2); background:var(--paper2); border:1px solid rgba(26,25,22,.18);
    border-radius:6px; padding:5px 8px; }
  .sp{ flex:1 1 auto; }
  .flt{ cursor:pointer; }
  .flt.on{ border-color:var(--gold); color:var(--gold); background:rgba(138,100,20,.08); }

  #list{ max-width:820px; margin:0 auto; padding:22px 20px 120px; }
  .card{ background:var(--paper); border:1px solid rgba(26,25,22,.08); border-radius:10px; padding:22px 26px 18px;
    margin-bottom:18px; box-shadow:0 1px 3px rgba(0,0,0,.05); transition:opacity .2s; }
  .card.seen{ opacity:.62; }
  .card.seen:hover{ opacity:1; }
  .top{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--dim); }
  .no{ font-family:'EB Garamond',serif; font-size:14px; color:var(--gold); letter-spacing:.06em; }
  .cat{ color:var(--ink2); }
  .pill{ border:1px solid rgba(26,25,22,.16); border-radius:10px; padding:1px 8px; font-size:11px; }
  .kw{ margin-left:auto; font-size:11.5px; }
  .q{ margin:14px 0 16px; font-size:16.5px; line-height:1.85; white-space:pre-wrap; }
  .lbl{ font-size:11px; letter-spacing:.14em; color:var(--gold); margin:0 0 7px; }
  .hint{ display:flex; gap:5px; flex-wrap:wrap; margin-bottom:16px; }
  .hint span{ width:32px; height:36px; border:1px solid rgba(26,25,22,.25); border-radius:5px; background:var(--paper2);
    display:flex; align-items:center; justify-content:center; font-size:17px; }
  .hint span.gap{ width:10px; border:none; background:none; }
  .choices{ margin:0 0 16px; padding:0; list-style:none; }
  .choices li{ padding:6px 10px; border:1px solid rgba(26,25,22,.12); border-radius:6px; margin-bottom:5px; font-size:14.5px; background:var(--paper2); }
  .choices li.ok{ border-color:var(--blue); box-shadow:inset 3px 0 0 var(--blue); }
  .choices li.ok::after{ content:'  ✓ 정답'; color:var(--blue); font-size:12px; }
  .ox{ display:flex; gap:10px; margin-bottom:12px; }
  .ox span{ width:56px; height:40px; display:flex; align-items:center; justify-content:center; border:1px solid rgba(26,25,22,.2);
    border-radius:6px; font-family:'EB Garamond',serif; font-size:20px; background:var(--paper2); }
  .ox span.ok{ border-color:var(--blue); color:var(--blue); box-shadow:inset 0 -3px 0 var(--blue); }
  .ans{ font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:18px; margin-bottom:4px; }
  .alias{ font-size:12px; color:var(--dim); margin-bottom:16px; }
  .rev{ border-top:1px dashed rgba(138,100,20,.3); padding-top:14px; margin-top:6px; }
  .rv{ margin-bottom:12px; }
  .rv p{ margin:0; font-size:14.5px; line-height:1.85; color:var(--ink2); white-space:pre-wrap; }
  .fig{ font-size:12px; color:var(--dim); margin-top:4px; }
  .miss{ color:#B0473A; font-size:12.5px; }
  .act{ display:flex; gap:8px; align-items:flex-start; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
  .btn{ font-family:inherit; font-size:12.5px; padding:6px 12px; border-radius:6px; border:1px solid rgba(26,25,22,.2);
    background:transparent; color:var(--ink2); cursor:pointer; white-space:nowrap; }
  .btn.seenon{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .btn.memo.has{ border-color:var(--gold); color:var(--gold); }
  textarea{ flex:1 1 auto; min-height:38px; font-family:inherit; font-size:13.5px; line-height:1.6; padding:7px 10px; border-radius:6px;
    border:1px solid rgba(138,100,20,.45); background:var(--paper2); color:var(--ink); resize:vertical; display:none; }
  textarea.on{ display:block; }
  .saved{ font-size:11px; color:var(--dim); align-self:center; min-width:48px; }
  .fixed{ font-size:11px; color:var(--blue); align-self:center; }
  #gate{ max-width:520px; margin:18vh auto; text-align:center; font-size:15px; line-height:1.9; color:var(--ink2); }
  #empty{ text-align:center; color:var(--dim); padding:60px 0; font-size:14px; }
</style>
</head>
<body>
<div id="bar" hidden>
  <div id="barIn">
    <div id="ttl">
      <h1>문항 열람실<small>EG STADIUM</small></h1>
      <div id="prog"></div>
    </div>
    <div id="tabs">
      <button class="tab on" data-t="preseason">시범경기<span class="c" id="cPre"></span></button>
      <button class="tab" data-t="rookie">정규시즌<span class="c" id="cRoo"></span></button>
      <span class="sp"></span>
      <select id="cat"><option value="">모든 분야</option></select>
      <button class="flt" data-f="unseen">안 본 것만</button>
      <button class="flt" data-f="memo">메모 있는 것만</button>
    </div>
  </div>
</div>
<div id="list"></div>
<div id="gate">문항 열람실을 여는 중입니다…</div>

<script>
const SUPA_URL = 'https://cyhlotwdisjvoxvfkpnd.supabase.co';
const SUPA_KEY = 'sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { storageKey: 'eungyo-auth', persistSession: true } });

let Q = [], MARK = {}, tier = 'preseason', cat = '', only = '';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
/* 카리 원고의 *강조* · **굵게** 만 살린다 */
const rich = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<em>$1</em>');
const TYPE = { subjective:'주관식', multiple_choice:'객관식', ox:'O · X' };
const LAYER = [['knowledge','지식'], ['thought','생각'], ['connection','연결'], ['curation','큐레이션']];

async function boot(){
  const gate = document.getElementById('gate');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { gate.innerHTML = '살롱지기만 들어오는 방입니다.<br><a href="terra.html">EG유니버스에서 로그인</a>한 뒤 다시 열어 주십시오.'; return; }
  const { data: isAdmin } = await sb.rpc('eg_is_admin');
  if (!isAdmin) { gate.innerHTML = '살롱지기만 들어오는 방입니다.'; return; }

  const cols = 'id,tier,category,difficulty,question_type,keyword,zone_keyword,question_text,answer,initials,aliases,choices,correct_index,ox_explanation,figures,library,created_at';
  const [qr, mr] = await Promise.all([
    sb.from('questions').select(cols).order('created_at').order('id').limit(2000),
    sb.from('quiz_review_marks').select('question_id,seen,note,fixed').limit(5000),
  ]);
  if (qr.error) { gate.textContent = '문항을 못 받았습니다 — ' + qr.error.message; return; }
  Q = qr.data || [];
  (mr.data || []).forEach((m) => { MARK[m.question_id] = m; });
  /* 탭 안 번호 — 늘 같은 순서(만든 차례) */
  ['preseason','rookie'].forEach((t) => Q.filter((q) => q.tier === t).forEach((q, i) => { q._no = i + 1; }));
  document.getElementById('cPre').textContent = Q.filter((q) => q.tier === 'preseason').length;
  document.getElementById('cRoo').textContent = Q.filter((q) => q.tier === 'rookie').length;

  gate.remove();
  document.getElementById('bar').hidden = false;
  wire(); fillCats(); render();
}

function wire(){
  document.querySelectorAll('.tab').forEach((b) => b.onclick = () => {
    tier = b.dataset.t; cat = '';
    document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b));
    fillCats(); render(); scrollTo(0, 0);
  });
  document.getElementById('cat').onchange = (e) => { cat = e.target.value; render(); scrollTo(0, 0); };
  document.querySelectorAll('.flt').forEach((b) => b.onclick = () => {
    only = only === b.dataset.f ? '' : b.dataset.f;
    document.querySelectorAll('.flt').forEach((x) => x.classList.toggle('on', x.dataset.f === only));
    render(); scrollTo(0, 0);
  });
}
function fillCats(){
  const sel = document.getElementById('cat');
  const cats = [...new Set(Q.filter((q) => q.tier === tier).map((q) => q.category || '(분야 없음)'))].sort();
  sel.innerHTML = '<option value="">모든 분야</option>' + cats.map((c) => {
    const n = Q.filter((q) => q.tier === tier && (q.category || '(분야 없음)') === c).length;
    return `<option value="${esc(c)}">${esc(c)} · ${n}</option>`;
  }).join('');
  sel.value = cat;
}
function progress(){
  const all = Q.filter((q) => q.tier === tier);
  const seen = all.filter((q) => MARK[q.id] && MARK[q.id].seen).length;
  const memo = all.filter((q) => MARK[q.id] && MARK[q.id].note && !MARK[q.id].fixed).length;
  document.getElementById('prog').innerHTML = `봤음 <b>${seen}</b> / ${all.length}` + (memo ? ` · 메모 <b>${memo}</b>` : '');
}

function hintHTML(q){
  const ini = Array.isArray(q.initials) ? q.initials : [];
  if (!ini.length) return '<div class="miss">힌트 칸이 비어 있습니다</div>';
  /* 정답의 띄어쓰기 자리에 틈을 둔다(손님 화면처럼 칸 수만 세지 않고 읽기 쉽게) */
  const words = String(q.answer || '').trim().split(/\s+/);
  let k = 0, out = [];
  words.forEach((w, wi) => {
    for (let i = 0; i < [...w].length && k < ini.length; i++, k++) out.push(`<span>${esc(ini[k])}</span>`);
    if (wi < words.length - 1) out.push('<span class="gap"></span>');
  });
  while (k < ini.length) out.push(`<span>${esc(ini[k++])}</span>`);
  return `<div class="hint">${out.join('')}</div>`;
}
function bodyHTML(q){
  if (q.question_type === 'multiple_choice') {
    const ch = Array.isArray(q.choices) ? q.choices : [];
    return '<div class="lbl">보기</div><ol class="choices">'
      + ch.map((c, i) => `<li class="${i === q.correct_index ? 'ok' : ''}">${esc(c)}</li>`).join('') + '</ol>';
  }
  if (q.question_type === 'ox') {
    const a = String(q.answer || '').trim().toUpperCase();
    return `<div class="lbl">답</div><div class="ox"><span class="${a === 'O' ? 'ok' : ''}">O</span><span class="${a === 'X' ? 'ok' : ''}">X</span></div>`
      + (q.ox_explanation ? `<div class="rv"><div class="lbl">풀이</div><p>${rich(q.ox_explanation)}</p></div>` : '');
  }
  return '<div class="lbl">힌트</div>' + hintHTML(q);
}
function card(q){
  const m = MARK[q.id] || {};
  const lib = (q.library && typeof q.library === 'object') ? q.library : {};
  const al = (Array.isArray(q.aliases) ? q.aliases : []).filter((x) => x && x !== q.answer);
  const figs = Array.isArray(q.figures) ? q.figures.filter(Boolean) : [];
  const layers = LAYER.map(([k, name]) => lib[k]
    ? `<div class="rv"><div class="lbl">${name}</div><p>${rich(lib[k])}</p></div>`
    : `<div class="rv"><div class="lbl">${name}</div><p class="miss">비어 있습니다</p></div>`).join('');
  return `<article class="card${m.seen ? ' seen' : ''}" data-id="${q.id}">
    <div class="top">
      <span class="no">No. ${String(q._no).padStart(3, '0')}</span>
      <span class="cat">${esc(q.category || '(분야 없음)')}</span>
      <span class="pill">D${esc(q.difficulty)}</span>
      <span class="pill">${esc(TYPE[q.question_type] || q.question_type)}</span>
      <span class="kw">${esc(q.keyword || '')}${q.zone_keyword ? ' · ' + esc(q.zone_keyword) : ''}</span>
    </div>
    <div class="q">${rich(q.question_text)}</div>
    ${bodyHTML(q)}
    ${q.question_type === 'ox' ? '' : `<div class="lbl">정답</div><div class="ans">${esc(q.answer)}</div>
      <div class="alias">${al.length ? '허용 답 — ' + al.map(esc).join(' · ') : ''}</div>`}
    <div class="rev"><div class="lbl" style="color:var(--ink2);letter-spacing:.2em;">이 문제 돌아보기</div>${layers}
      ${figs.length ? `<div class="fig">인물 — ${figs.map(esc).join(' · ')}</div>` : ''}</div>
    <div class="act">
      <button class="btn seen-b${m.seen ? ' seenon' : ''}">${m.seen ? '✓ 봤음' : '봤음'}</button>
      <button class="btn memo${m.note ? ' has' : ''}">✎ 메모</button>
      <textarea placeholder="고칠 곳을 적어 두시면 파이스가 모아 고칩니다">${esc(m.note || '')}</textarea>
      <span class="saved"></span>
      ${m.fixed ? '<span class="fixed">고침 ✓</span>' : ''}
    </div>
  </article>`;
}
function render(){
  const list = document.getElementById('list');
  let qs = Q.filter((q) => q.tier === tier);
  if (cat) qs = qs.filter((q) => (q.category || '(분야 없음)') === cat);
  if (only === 'unseen') qs = qs.filter((q) => !(MARK[q.id] && MARK[q.id].seen));
  if (only === 'memo')   qs = qs.filter((q) => MARK[q.id] && MARK[q.id].note);
  list.innerHTML = qs.length ? qs.map(card).join('') : '<div id="empty">보여 드릴 문항이 없습니다</div>';
  list.querySelectorAll('.card').forEach(bindCard);
  /* 메모가 있는 카드는 메모 칸을 펴 둔다 */
  list.querySelectorAll('.card').forEach((c) => { if ((MARK[c.dataset.id] || {}).note) c.querySelector('textarea').classList.add('on'); });
  progress();
}
async function save(id, patch, cardEl){
  const cur = MARK[id] || { question_id: id, seen: false, note: null, fixed: false };
  const row = Object.assign({}, cur, patch, { question_id: id, updated_at: new Date().toISOString() });
  const s = cardEl.querySelector('.saved'); s.textContent = '저장 중…';
  const { error } = await sb.from('quiz_review_marks').upsert(row, { onConflict: 'question_id' });
  if (error) { s.textContent = '저장 실패'; console.warn(error); return false; }
  MARK[id] = row; s.textContent = '저장됨'; setTimeout(() => { if (s.textContent === '저장됨') s.textContent = ''; }, 1500);
  progress(); return true;
}
function bindCard(c){
  const id = c.dataset.id;
  const sBtn = c.querySelector('.seen-b'), mBtn = c.querySelector('.memo'), ta = c.querySelector('textarea');
  sBtn.onclick = async () => {
    const on = !(MARK[id] && MARK[id].seen);
    if (await save(id, { seen: on }, c)) {
      sBtn.classList.toggle('seenon', on); sBtn.textContent = on ? '✓ 봤음' : '봤음';
      c.classList.toggle('seen', on);
      /* 봤음을 누르면 다음 카드로 부드럽게 */
      if (on && c.nextElementSibling) c.nextElementSibling.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  };
  mBtn.onclick = () => { ta.classList.toggle('on'); if (ta.classList.contains('on')) ta.focus(); };
  let t = null;
  const push = () => {
    const v = ta.value.trim() || null;
    if ((MARK[id] || {}).note === v) return;
    /* 메모를 고치면 「고침」 표시는 내린다 — 새 메모는 새 일감 */
    save(id, { note: v, fixed: false }, c).then((ok) => { if (ok) { mBtn.classList.toggle('has', !!v); const f = c.querySelector('.fixed'); if (f) f.remove(); } });
  };
  ta.oninput = () => { clearTimeout(t); t = setTimeout(push, 900); };
  ta.onblur = () => { clearTimeout(t); push(); };
}
/* 카드 위쪽이 막대에 가리지 않게 */
document.documentElement.style.scrollPaddingTop = '130px';
boot();
</script>
</body>
</html>
