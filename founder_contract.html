<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EG유니버스 파운더 계약서</title>
<!-- ─────────────────────────────────────────────────────────────────────
     founder_contract.html — 타륜 › EG파운더 전용메뉴 › 파운더 계약서
     2026.09.18 · 파이스

     ① 살아 있는 신청을 스스로 찾는다 — ⚠ 부모가 번호를 건네지 않아도 된다
        held 가 있으면 그것, 없으면 아직 확정 안 된 claimed
     ② 본문은 DB eg_contract_terms 열네 줄 — ⚠ 이 파일에 조문을 적지 않는다
        표식  @dues  정회원 회비 (eg_founder_fee_rule.dues)
              @rates 요율표     (eg_founder_rate)
              @payout 정산 계좌 — ⭐ 적으시는 대로 제9조 ⑥ 이 따라 바뀐다
     ③ 당사자·계좌·EG 서명은 eg_founder_bank 한 줄 — ⚠ 값도 서명도 적지 않는다
     ④ ⭐ 주소는 계약서 본문에 들어가지 않는다 (0918 소로) — 보내 드리기 위한 것
     ⑤ ⭐ 이체는 서명 전에. 「이체를 완료하였습니다」는 계약서 안의 진술이다
        ⚠ 체크를 안 하셔도 제출을 막지 않는다 — 하지도 않은 이체를 체크하게 만들지 않는다
     ⑥ 계좌는 등폭으로 크게 — 노트북을 보며 폰으로 옮겨 치신다 (0918 소로)

     부모와 주고받는 말
       보냄  ct-back     도시별현황으로   ⚠ fc-back 은 도시별현황이 쓴다 — 이름을 겹치지 않는다
             ct-close    창을 닫는다
     ───────────────────────────────────────────────────────────────────── -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script>if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');</script>
<style>
  :root{
    --ink:#1F232B; --navy:#16243D; --gold:#C2921F; --gold-ink:#8A6712;
    --muted:#5E6269; --soft:#6B7079; --faint:#8A9099; --rule:#EDEEF1; --line:#DCDFE4; --line2:#E4E6EA;
    --serif:'Noto Serif KR', 'Noto Serif CJK KR', serif;
    --batang:'Gowun Batang', 'Noto Serif KR', serif;
    --mono:'IBM Plex Mono', 'Noto Serif KR', monospace;
  }
  html, body{ margin:0; height:100%; }
  body{ background:#C9CDD4; color:var(--ink); font-family:var(--serif);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  html.embed, html.embed body{ background:transparent; }
  ::selection{ background:rgba(194,146,31,.18); }
  button, input{ font-family:inherit; }

  /* ── 판 — 신청안내·도시별현황과 같은 876 흰 서류 ── */
  #fcStage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #fcPanel{ position:relative; display:flex; flex-direction:column;
    width:876px; height:calc(100vh - 80px); max-height:calc(100vh - 80px);
    background:#FFFFFF; border-radius:6px; box-shadow:0 26px 70px rgba(12,18,30,.34); overflow:hidden; }
  #fcPanel:focus{ outline:none; }

  .fc-top{ flex:0 0 auto; display:flex; align-items:center; gap:12px;
    padding:16px 22px 14px; border-bottom:1px solid var(--rule); }
  .fc-back{ display:inline-flex; align-items:center; gap:7px; padding:7px 12px;
    border:1px solid var(--line); border-radius:3px; background:#FFFFFF; color:var(--muted);
    font:400 13px/1 var(--serif); cursor:pointer; transition:background .14s, color .14s, border-color .14s; }
  .fc-back:hover, .fc-back:focus-visible{ background:var(--navy); border-color:var(--navy); color:#FFFFFF; outline:none; }
  .fc-title{ flex:1 1 auto; font:700 17px/1.4 var(--batang); color:var(--navy); letter-spacing:.01em; }
  .fc-x{ width:34px; height:34px; display:flex; align-items:center; justify-content:center; padding:0;
    border:1px solid var(--line); border-radius:3px; background:#FFFFFF; color:var(--muted);
    font:400 15px/1 var(--mono); cursor:pointer; transition:background .14s, color .14s, border-color .14s; }
  .fc-x:hover, .fc-x:focus-visible{ background:var(--navy); border-color:var(--navy); color:#FFFFFF; outline:none; }

  .fc-scroll{ flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain;
    scrollbar-width:none; -ms-overflow-style:none; }
  .fc-scroll::-webkit-scrollbar{ display:none; width:0; height:0; }
  .fc-doc{ padding:30px 78px 60px; }
  .fc-wait{ padding:60px 0; text-align:center; font:400 14px/1.8 var(--serif); color:var(--faint); }

  /* ── 표제 ── */
  .ct-head{ text-align:center; padding-bottom:26px; border-bottom:2px solid var(--navy); }
  .ct-head h1{ margin:0; font:700 25px/1.5 var(--batang); color:var(--navy); letter-spacing:.02em; }
  .ct-head p{ margin:9px 0 0; font:400 12.5px/1.6 var(--mono); color:var(--faint); }

  /* ── 마디 ── */
  .ct-sec{ margin-top:34px; }
  .ct-sec > h2{ margin:0 0 13px; font:500 14px/1.5 var(--serif); color:var(--gold-ink);
    letter-spacing:.06em; }
  .ct-sec > h2 em{ font-style:normal; color:var(--faint); font-size:12.5px; margin-left:8px; letter-spacing:0; }

  /* ── 표 ── */
  .ct-tab{ width:100%; border-collapse:collapse; }
  .ct-tab th, .ct-tab td{ padding:11px 12px; border-bottom:1px solid var(--rule);
    font:400 14px/1.7 var(--serif); text-align:left; vertical-align:middle; word-break:keep-all; }
  .ct-tab th{ width:132px; color:var(--soft); font-weight:400; background:#FCFCFD; }
  .ct-tab td b{ font-weight:500; color:var(--navy); }
  .ct-tab td .sub{ display:block; margin-top:3px; font:400 12px/1.6 var(--serif); color:var(--faint); }
  .ct-tab tr:first-child th, .ct-tab tr:first-child td{ border-top:1px solid var(--line2); }

  /* ── 빈칸 ── */
  .ct-in{ width:100%; max-width:330px; padding:8px 11px; border:1px solid var(--line);
    border-radius:3px; background:#FFFFFF; color:var(--ink); font:400 14px/1.5 var(--serif); }
  .ct-in:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(194,146,31,.12); }
  .ct-in.mono{ font-family:var(--mono); letter-spacing:.02em; }
  .ct-in.s{ max-width:132px; }
  .ct-in.m{ max-width:210px; }
  .ct-row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .ct-need{ color:var(--gold-ink); font:400 12px/1 var(--serif); margin-left:2px; }
  .ct-btn{ padding:8px 14px; border:1px solid var(--line); border-radius:3px; background:#FFFFFF;
    color:var(--muted); font:400 13.5px/1 var(--serif); cursor:pointer;
    transition:background .14s, color .14s, border-color .14s; }
  .ct-btn:hover, .ct-btn:focus-visible{ background:var(--navy); border-color:var(--navy); color:#FFFFFF; outline:none; }
  .ct-btn.gold{ border-color:#E3D4AE; color:var(--gold-ink); background:rgba(194,146,31,.07); }
  .ct-btn.gold:hover, .ct-btn.gold:focus-visible{ background:var(--gold); border-color:var(--gold); color:#FFFFFF; }
  .ct-btn.big{ padding:13px 30px; font-size:15px; }
  .ct-btn.tiny{ padding:5px 10px; font-size:12px; }
  .ct-btn[disabled]{ opacity:.4; cursor:default; }
  .ct-btn[disabled]:hover{ background:#FFFFFF; border-color:var(--line); color:var(--muted); }
  .ct-btn.gold[disabled]:hover{ background:rgba(194,146,31,.07); border-color:#E3D4AE; color:var(--gold-ink); }

  /* ── 계약 대상 ── */
  .ct-items{ width:100%; border-collapse:collapse; }
  .ct-items th, .ct-items td{ padding:10px 10px; border-bottom:1px solid var(--rule);
    font:400 14px/1.6 var(--serif); }
  .ct-items thead th{ border-bottom:1px solid var(--line); color:var(--faint);
    font:400 12px/1 var(--serif); letter-spacing:.04em; text-align:left; }
  .ct-items td.n, .ct-items th.n{ text-align:right; white-space:nowrap; font-family:var(--mono); }
  .ct-items tfoot td{ border-bottom:0; border-top:1px solid var(--line); font-weight:500; color:var(--navy); }
  .ct-items em{ font-style:normal; color:var(--faint); font:400 11.5px/1 var(--mono);
    margin-left:8px; letter-spacing:.08em; }

  /* ── 본문 ── */
  .ct-art{ margin-top:26px; }
  .ct-art h3{ margin:0 0 9px; font:500 15px/1.6 var(--serif); color:var(--navy); }
  .ct-art h3 i{ font-style:normal; color:var(--gold-ink); margin-right:8px; }
  .ct-art p{ margin:0 0 8px; font:400 14px/1.95 var(--serif); color:var(--ink);
    word-break:keep-all; text-align:justify; }
  .ct-art p:last-child{ margin-bottom:0; }
  .ct-rates{ margin:12px 0 12px; border-collapse:collapse; }
  .ct-rates td{ padding:7px 20px 7px 0; border-bottom:1px solid var(--rule);
    font:400 13.5px/1.6 var(--mono); color:var(--muted); }
  .ct-rates td:last-child{ padding-right:0; color:var(--navy); font-weight:500; }
  #ctPayout{ font-family:var(--mono); font-size:13.5px; color:var(--navy); }
  #ctPayout.none{ font-family:var(--serif); color:var(--faint); }

  /* ── 계좌와 금액 ── */
  .ct-pay{ margin-top:34px; padding:24px 26px 22px; border:1px solid var(--line);
    border-radius:4px; background:#FCFCFD; }
  .ct-pay .lab{ margin:0 0 8px; font:400 12.5px/1 var(--serif); color:var(--faint); letter-spacing:.05em; }
  .ct-pay .bank{ margin:0; font:400 14px/1.6 var(--serif); color:var(--muted); }
  .ct-pay .acct{ margin:2px 0 0; font:500 27px/1.45 var(--mono); color:var(--navy); letter-spacing:.02em; }
  .ct-pay .holder{ margin:4px 0 0; font:400 13.5px/1.6 var(--serif); color:var(--muted); }
  .ct-pay hr{ margin:18px 0; border:0; border-top:1px solid var(--rule); }
  .ct-pay .amt{ margin:0; font:500 27px/1.45 var(--mono); color:var(--gold-ink); }
  .ct-pay .brk{ margin:4px 0 0; font:400 12.5px/1.7 var(--serif); color:var(--faint); }
  .ct-pay .copy{ float:right; margin-top:-2px; }

  /* ── 체크 ── */
  .ct-check{ margin-top:20px; display:flex; align-items:flex-start; gap:11px;
    padding:15px 18px; border:1px solid var(--line2); border-radius:4px; cursor:pointer; }
  .ct-check:hover{ border-color:var(--line); background:#FCFCFD; }
  .ct-check input{ margin:2px 0 0; width:17px; height:17px; accent-color:var(--gold); cursor:pointer; }
  .ct-check span{ font:400 14px/1.7 var(--serif); color:var(--ink); word-break:keep-all; }
  .ct-check span u{ display:block; margin-top:3px; text-decoration:none;
    font:400 12px/1.7 var(--serif); color:var(--faint); }

  /* ── 서명 ── */
  .ct-signs{ margin-top:34px; display:grid; grid-template-columns:1fr 1fr; gap:26px; }
  .ct-sign{ }
  .ct-sign .who{ margin:0 0 9px; font:400 12.5px/1 var(--serif); color:var(--faint); letter-spacing:.05em; }
  .ct-sign .box{ position:relative; height:132px; border:1px solid var(--line); border-radius:4px;
    background:#FFFFFF; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .ct-sign .box.pad{ cursor:crosshair; }
  .ct-sign .box::after{ content:''; position:absolute; left:26px; right:26px; bottom:34px;
    border-bottom:1px dashed var(--line2); pointer-events:none; }
  .ct-sign .box.drawn::after{ display:none; }
  .ct-sign img{ max-width:74%; max-height:82px; }
  .ct-sign canvas{ position:relative; z-index:1; width:100%; height:100%; display:block; touch-action:none; }
  .ct-sign .hint{ position:absolute; z-index:0; font:400 13px/1 var(--serif); color:var(--faint); pointer-events:none; }
  .ct-sign .box.drawn .hint{ display:none; }
  .ct-sign .foot{ margin-top:8px; display:flex; align-items:center; gap:10px;
    font:400 12.5px/1.6 var(--serif); color:var(--faint); }
  .ct-sign .foot b{ font-weight:400; color:var(--muted); font-family:var(--mono); font-size:12px; }

  /* ── 제출 ── */
  .ct-go{ margin-top:30px; padding-top:22px; border-top:1px solid var(--rule);
    display:flex; align-items:center; gap:14px; }
  .ct-go .say{ flex:1 1 auto; font:400 13px/1.8 var(--serif); color:var(--faint); word-break:keep-all; }
  .ct-err{ margin:14px 0 0; font:400 13.5px/1.8 var(--serif); color:var(--gold-ink); word-break:keep-all; }
  .ct-err:empty{ display:none; }

  /* ── 다 마친 뒤 ── */
  .ct-done{ padding:56px 0 30px; text-align:center; }
  .ct-done h2{ margin:0; font:700 22px/1.6 var(--batang); color:var(--navy); }
  .ct-done .no{ margin:14px 0 0; font:500 15px/1.6 var(--mono); color:var(--gold-ink); }
  .ct-done .hash{ margin:5px 0 0; font:400 11.5px/1.6 var(--mono); color:var(--faint); }
  .ct-done .say{ margin:22px auto 0; max-width:460px; font:400 14px/1.95 var(--serif);
    color:var(--soft); word-break:keep-all; }
  .ct-done .acts{ margin-top:26px; display:flex; gap:10px; justify-content:center; }
</style>
</head>
<body>
<div id="fcStage">
  <div id="fcPanel" tabindex="-1">
    <div class="fc-top">
      <button class="fc-back" id="fcBack" type="button"><span aria-hidden="true">←</span><span>도시별현황</span></button>
      <div class="fc-title">파운더 계약서</div>
      <button class="fc-x" id="fcClose" type="button" aria-label="닫기">✕</button>
    </div>
    <div class="fc-scroll" id="fcScroll">
      <div class="fc-doc" id="fcDoc"><p class="fc-wait">계약서를 불러오는 중입니다.</p></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const SUPA_URL = 'https://cyhlotwdisjvoxvfkpnd.supabase.co';
  const SUPA_KEY = 'sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
  const EMBED = document.documentElement.classList.contains('embed');

  const $   = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const won = (n) => Number(n).toLocaleString('ko-KR');
  const cityKo = (k) => ({ paris:'파리', london:'런던', newyork:'뉴욕' }[k] || k);
  const grade  = (city, slots) => city === 'paris' ? 'MAISON'
                                : city === 'london' ? 'HOUSE'
                                : (slots <= 81 ? 'LOFT' : 'TOWER');
  /* 계좌번호를 마디마디 벌린다 — 폰으로 옮겨 치실 때 눈이 미끄러지지 않게 */
  const spread = (s) => String(s || '').replace(/-/g, ' - ');

  let SB = null, ME = null;
  let RES = null, ITEMS = [], BANK = null, TERMS = [], RATES = [], DUES = 0, PROF = null, DONE = null;
  let strokes = [], cur = null, CV = null, CTX = null;

  function say(type, extra) {
    if (!EMBED) return;
    try { window.parent.postMessage(Object.assign({ type: type }, extra || {}), location.origin); } catch (_) {}
  }
  function loadScript(src) {
    return new Promise((ok, no) => { const s = document.createElement('script');
      s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  }
  async function client() {
    try { if (window.parent !== window && window.parent.egSupa) return window.parent.egSupa; } catch (_) {}
    if (!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
    return window.supabase.createClient(SUPA_URL, SUPA_KEY,
      { auth: { storageKey: 'eungyo-auth', persistSession: true, autoRefreshToken: true } });
  }

  /* ── 본문 한 조 ── */
  function ratesTable() {
    return '<table class="ct-rates"><tbody>' + RATES.map((r) =>
      '<tr><td>' + (r.members_to == null ? r.members_from + '명 ~'
                                         : r.members_from + ' ~ ' + r.members_to + '명') + '</td>' +
      '<td>' + Math.round(Number(r.rate) * 100) + '%</td></tr>').join('') + '</tbody></table>';
  }
  function article(t) {
    const lines = String(t.body).split('\n');
    let h = '<div class="ct-art"><h3><i>' + esc(t.article) + '</i>' + esc(t.title) + '</h3>';
    for (const raw of lines) {
      const s = raw.trim();
      if (!s) continue;
      if (s === '@rates') { h += ratesTable(); continue; }
      let p = esc(s).replace('@dues', won(DUES) + '원');
      p = p.replace('@payout', '<span id="ctPayout" class="none">미기재</span>');
      h += '<p>' + p + '</p>';
    }
    return h + '</div>';
  }

  /* ── 계약 대상 ── */
  function itemsTable() {
    const fee = ITEMS.reduce((a, b) => a + Number(b.fee), 0);
    const slots = ITEMS.reduce((a, b) => a + Number(b.slots), 0);
    const vat = Math.round(fee * 0.1);
    return '<table class="ct-items"><thead><tr>' +
      '<th>건물</th><th class="n">슬롯</th><th class="n">참가비</th></tr></thead><tbody>' +
      ITEMS.map((b) => '<tr><td>' + esc(b.label) +
        '<em>' + esc(cityKo(b.city)) + ' · ' + grade(b.city, b.slots) + '</em></td>' +
        '<td class="n">' + b.slots + '</td>' +
        '<td class="n">' + won(b.fee) + '</td></tr>').join('') +
      '</tbody><tfoot>' +
      '<tr><td>참가비 합계</td><td class="n">' + slots + '</td><td class="n">' + won(fee) + '</td></tr>' +
      '<tr><td>부가세</td><td class="n"></td><td class="n">' + won(vat) + '</td></tr>' +
      '<tr><td>이체하실 금액</td><td class="n"></td><td class="n">' + won(fee + vat) + '</td></tr>' +
      '</tfoot></table>';
  }

  /* ── 계약서 한 장 ── */
  function drawDoc() {
    const b = BANK, p = PROF || {};
    const total = Number(RES.amount_total);
    const ym = String(RES.fee_ym || '').slice(0, 7).replace('-', '년 ') + '월';

    $('fcDoc').innerHTML =
      '<div class="ct-head"><h1>EG유니버스 파운더 계약서</h1>' +
      '<p>참가비 기준 ' + esc(ym) + ' 참가비표</p></div>' +

      '<div class="ct-sec"><h2>당사자</h2><table class="ct-tab"><tbody>' +
        '<tr><th>EG</th><td><b>' + esc(b.brand) + '</b>' +
          '<span class="sub">' + esc(b.biz_name) + ' · 대표 ' + esc(b.ceo) +
          (b.biz_no ? ' · 사업자등록번호 ' + esc(b.biz_no) : '') + '</span></td></tr>' +
        '<tr><th>파운더 실명<span class="ct-need">*</span></th><td>' +
          '<input class="ct-in m" id="ctName" type="text" autocomplete="name" placeholder="계약서에 서명하실 이름" value="' + esc(p.real_name || '') + '"></td></tr>' +
        '<tr><th>EG 계정</th><td><b id="ctEmail">' + esc((ME && ME.email) || '') + '</b></td></tr>' +
        '<tr><th>휴대전화<span class="ct-need">*</span></th><td>' +
          '<input class="ct-in m mono" id="ctPhone" type="tel" autocomplete="tel" placeholder="010-0000-0000" value="' + esc(p.phone || '') + '"></td></tr>' +
        '<tr><th>사업자등록번호</th><td>' +
          '<input class="ct-in m mono" id="ctBiz" type="text" placeholder="사업자로 계약하실 때만" value="' + esc(p.biz_no || '') + '">' +
          '<span class="sub">적어 주시면 참가비 세금계산서를 발급합니다 (제13조 ②).</span></td></tr>' +
      '</tbody></table></div>' +

      '<div class="ct-sec"><h2>계약 대상</h2>' + itemsTable() + '</div>' +

      '<div class="ct-sec"><h2>본문</h2>' + TERMS.map(article).join('') + '</div>' +

      '<div class="ct-sec"><h2>정산 계좌 <em>제9조 ⑥ · 적으시는 대로 본문에 들어갑니다</em></h2>' +
        '<div class="ct-row">' +
          '<input class="ct-in s" id="ctPbBank" type="text" placeholder="은행" value="' + esc(p.payout_bank || '') + '">' +
          '<input class="ct-in m mono" id="ctPbAcct" type="text" placeholder="계좌번호" value="' + esc(p.payout_account || '') + '">' +
          '<input class="ct-in s" id="ctPbHold" type="text" placeholder="예금주" value="' + esc(p.payout_holder || '') + '">' +
        '</div></div>' +

      '<div class="ct-sec"><h2>보내 드릴 곳 <em>계약서에는 적히지 않습니다</em></h2>' +
        '<div class="ct-row" style="margin-bottom:8px">' +
          '<input class="ct-in s mono" id="ctZip" type="text" placeholder="우편번호" value="' + esc(p.zipcode || '') + '">' +
          '<button class="ct-btn tiny" id="ctFind" type="button">우편번호 찾기</button></div>' +
        '<div class="ct-row" style="margin-bottom:8px">' +
          '<input class="ct-in" id="ctAddr1" type="text" placeholder="도로명 주소" value="' + esc(p.addr1 || '') + '"></div>' +
        '<div class="ct-row">' +
          '<input class="ct-in" id="ctAddr2" type="text" placeholder="상세 주소" value="' + esc(p.addr2 || '') + '"></div>' +
      '</div>' +

      '<div class="ct-pay">' +
        '<button class="ct-btn tiny copy" id="ctCopy" type="button">복사</button>' +
        '<p class="lab">입금 계좌</p>' +
        '<p class="bank">' + esc(b.bank) + '</p>' +
        '<p class="acct">' + esc(spread(b.account)) + '</p>' +
        '<p class="holder">예금주 ' + esc(b.holder) + '</p>' +
        '<hr>' +
        '<p class="lab">이체하실 금액</p>' +
        '<p class="amt">' + won(total) + '원</p>' +
        '<p class="brk">참가비 ' + won(RES.fee_total) + '원 + 부가세 ' + won(RES.vat_total) + '원</p>' +
      '</div>' +

      '<label class="ct-check" for="ctPaid"><input type="checkbox" id="ctPaid">' +
        '<span>위 계좌로 이체를 완료하였습니다.' +
        '<u>아직이시면 비워 두고 서명하셔도 됩니다. 이체를 마치신 뒤 이 계약서에서 체크해 주십시오.</u>' +
        '</span></label>' +

      '<div class="ct-signs">' +
        '<div class="ct-sign"><p class="who">EG유니버스</p>' +
          '<div class="box">' + (b.sign ? '<img src="' + esc(b.sign) + '" alt="EG 서명">' : '') + '</div>' +
          '<div class="foot">' + esc(b.biz_name) + ' 대표 ' + esc(b.ceo) + '</div></div>' +
        '<div class="ct-sign"><p class="who">파운더</p>' +
          '<div class="box pad" id="ctBox"><span class="hint">이 칸에 서명해 주십시오</span>' +
          '<canvas id="ctCanvas"></canvas></div>' +
          '<div class="foot"><button class="ct-btn tiny" id="ctClear" type="button">다시 쓰기</button>' +
          '<b id="ctNow"></b></div></div>' +
      '</div>' +

      '<div class="ct-go">' +
        '<p class="say">제출하시면 서명 일시 · 계정 · 문서 해시값과 함께 보관됩니다 (제14조 ①).</p>' +
        '<button class="ct-btn gold big" id="ctGo" type="button" disabled>서명하고 제출</button>' +
      '</div>' +
      '<p class="ct-err" id="ctErr"></p>';

    fitCanvas();
    tickNow();
    syncPayout();
  }

  /* ── 다 마친 뒤 ── */
  function drawDone() {
    $('fcDoc').innerHTML =
      '<div class="ct-done"><h2>서명이 끝났습니다</h2>' +
      '<p class="no">' + esc(DONE.no) + '</p>' +
      '<p class="hash">문서 해시값 ' + esc(String(DONE.hash).slice(0, 32)) + '</p>' +
      '<p class="say">' + (DONE.paid
        ? '입금을 확인하는 대로 계약이 확정되고, 건물에 불이 켜집니다. 확인은 평일 08시부터 22시 사이에 순차로 이루어집니다.'
        : '아직 이체 전이십니다. 이체를 마치시면 아래를 눌러 주십시오. 그때부터 입금 확인을 기다리게 됩니다.') + '</p>' +
      '<div class="acts">' +
        (DONE.paid ? '' : '<button class="ct-btn gold" id="ctPaidLate" type="button">이체를 완료하였습니다</button>') +
        '<button class="ct-btn" id="ctBackList" type="button">도시별현황으로</button>' +
      '</div></div>';
  }

  /* ── 서명 캔버스 ── */
  function fitCanvas() {
    CV = $('ctCanvas'); if (!CV) return;
    CTX = CV.getContext('2d');
    const r = CV.getBoundingClientRect();
    const d = Math.min(2, window.devicePixelRatio || 1);
    CV.width  = Math.max(1, Math.round((r.width  || 380) * d));
    CV.height = Math.max(1, Math.round((r.height || 132) * d));
    CTX.setTransform(d, 0, 0, d, 0, 0);
    CTX.lineWidth = 2.2; CTX.lineCap = 'round'; CTX.lineJoin = 'round';
    CTX.strokeStyle = '#1F232B'; CTX.fillStyle = '#1F232B';
    redraw();
  }
  function stroke(pts) {
    if (!pts.length) return;
    if (pts.length < 3) { CTX.beginPath(); CTX.arc(pts[0].x, pts[0].y, 1.2, 0, 6.3); CTX.fill(); return; }
    CTX.beginPath(); CTX.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {            /* 중간점으로 이어 부드럽게 */
      const m = { x: (pts[i].x + pts[i + 1].x) / 2, y: (pts[i].y + pts[i + 1].y) / 2 };
      CTX.quadraticCurveTo(pts[i].x, pts[i].y, m.x, m.y);
    }
    CTX.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
    CTX.stroke();
  }
  function redraw() {
    if (!CTX) return;
    CTX.save(); CTX.setTransform(1, 0, 0, 1, 0, 0);
    CTX.clearRect(0, 0, CV.width, CV.height); CTX.restore();
    strokes.forEach(stroke);
    const box = $('ctBox');
    if (box) box.classList.toggle('drawn', strokes.length > 0);
    const go = $('ctGo');
    if (go) go.disabled = strokes.length === 0;
  }
  function at(e) {
    const r = CV.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function bindPad() {
    if (!CV) return;
    CV.addEventListener('pointerdown', (e) => {
      CV.setPointerCapture(e.pointerId); cur = [at(e)]; strokes.push(cur); redraw();
    });
    CV.addEventListener('pointermove', (e) => {
      if (!cur) return;
      const p = at(e), q = cur[cur.length - 1];
      if (Math.abs(p.x - q.x) + Math.abs(p.y - q.y) < 1.1) return;   /* 손 떨림은 버린다 */
      cur.push(p); redraw();
    });
    const up = () => { cur = null; };
    CV.addEventListener('pointerup', up);
    CV.addEventListener('pointercancel', up);
    CV.addEventListener('pointerleave', up);
  }
  function tickNow() {
    const el = $('ctNow'); if (!el) return;
    const d = new Date();
    const z = (n) => String(n).padStart(2, '0');
    el.textContent = d.getFullYear() + '.' + z(d.getMonth() + 1) + '.' + z(d.getDate()) +
      ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
  }

  /* ── 정산 계좌가 제9조 ⑥ 으로 ── */
  function payoutText() {
    const bk = ($('ctPbBank') || {}).value, ac = ($('ctPbAcct') || {}).value, hd = ($('ctPbHold') || {}).value;
    const s = [String(bk || '').trim(), String(ac || '').trim()].filter(Boolean).join(' ');
    const h = String(hd || '').trim();
    return (s ? s : '') + (h ? (s ? ' · ' : '') + '예금주 ' + h : '');
  }
  function syncPayout() {
    const el = $('ctPayout'); if (!el) return;
    const t = payoutText();
    el.textContent = t || '미기재';
    el.classList.toggle('none', !t);
  }

  /* ── 우편번호 ── */
  async function findZip() {
    try {
      if (!window.daum || !window.daum.Postcode) {
        await loadScript('https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js');
      }
      new window.daum.Postcode({ oncomplete: (d) => {
        $('ctZip').value = d.zonecode || '';
        $('ctAddr1').value = d.roadAddress || d.address || '';
        $('ctAddr2').focus();
      } }).open();
    } catch (_) {
      note('우편번호 찾기를 불러오지 못했습니다. 직접 적어 주셔도 됩니다.');
    }
  }
  function note(s) { const e = $('ctErr'); if (e) e.textContent = s || ''; }

  /* ── 제출 ── */
  async function submit() {
    const go = $('ctGo');
    const name = ($('ctName').value || '').trim();
    const phone = ($('ctPhone').value || '').trim();
    if (!name)  { note('실명을 적어 주십시오.'); $('ctName').focus(); return; }
    if (!phone) { note('휴대전화를 적어 주십시오.'); $('ctPhone').focus(); return; }
    if (!strokes.length) { note('서명을 해 주십시오.'); return; }
    note(''); go.disabled = true; go.textContent = '보내는 중입니다';
    try {
      const { data, error } = await SB.rpc('eg_founder_sign', {
        p_res: RES.id, p_name: name, p_phone: phone, p_biz: ($('ctBiz').value || '').trim(),
        p_zip: ($('ctZip').value || '').trim(),
        p_addr1: ($('ctAddr1').value || '').trim(), p_addr2: ($('ctAddr2').value || '').trim(),
        p_pb_bank: ($('ctPbBank').value || '').trim(),
        p_pb_account: ($('ctPbAcct').value || '').trim(),
        p_pb_holder: ($('ctPbHold').value || '').trim(),
        p_sign: CV.toDataURL('image/png'), p_paid: !!$('ctPaid').checked,
      });
      if (error) throw error;
      DONE = data; drawDone(); $('fcScroll').scrollTop = 0;
    } catch (e) {
      note((e && (e.message || e.hint)) || '제출하지 못했습니다. 잠시 뒤 다시 눌러 주십시오.');
      go.disabled = false; go.textContent = '서명하고 제출';
    }
  }
  async function payLate() {
    try {
      const { error } = await SB.rpc('eg_founder_paid', { p_res: RES.id });
      if (error) throw error;
      DONE.paid = true; drawDone();
    } catch (e) { note((e && e.message) || '바꾸지 못했습니다.'); }
  }
  function copyPay() {
    const t = BANK.bank + ' ' + BANK.account + ' ' + won(RES.amount_total) + '원';
    try { navigator.clipboard.writeText(t); } catch (_) {}
    const b = $('ctCopy'); if (!b) return;
    b.textContent = '복사됨'; setTimeout(() => { b.textContent = '복사'; }, 1400);
  }

  /* ── 손 ── */
  document.addEventListener('click', (e) => {
    if (!e.target.closest) return;
    if (e.target.closest('#ctClear'))    { strokes = []; cur = null; redraw(); return; }
    if (e.target.closest('#ctGo'))       { submit(); return; }
    if (e.target.closest('#ctFind'))     { findZip(); return; }
    if (e.target.closest('#ctCopy'))     { copyPay(); return; }
    if (e.target.closest('#ctPaidLate')) { payLate(); return; }
    if (e.target.closest('#ctBackList')) { say('ct-back'); return; }
  });
  document.addEventListener('input', (e) => {
    if (!e.target.id) return;
    if (['ctPbBank','ctPbAcct','ctPbHold'].indexOf(e.target.id) >= 0) syncPayout();
  });
  $('fcBack').addEventListener('click', () => say('ct-back'));
  $('fcClose').addEventListener('click', () => say('ct-close'));
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') say('ct-close'); });
  window.addEventListener('resize', () => { if (CV) fitCanvas(); });

  /* ── 문 열기 ── */
  (async function boot() {
    try {
      const sb = await client(); SB = sb;
      try { await sb.rpc('eg_founder_sweep'); } catch (_) {}

      const { data: { user } = { user: null } } = await sb.auth.getUser();
      ME = user;
      if (!ME) { $('fcDoc').innerHTML = '<p class="fc-wait">로그인이 필요합니다.</p>'; return; }

      const [res, bank, terms, rates, rule, prof] = await Promise.all([
        sb.from('eg_founder_reservations').select('*')
          .in('status', ['held', 'claimed']).order('held_at', { ascending: false }).limit(1),
        sb.from('eg_founder_bank').select('*').eq('id', 1).limit(1),
        sb.from('eg_contract_terms').select('ord,article,title,body').order('ord'),
        sb.from('eg_founder_rate').select('*').order('members_from'),
        sb.from('eg_founder_fee_rule').select('dues').limit(1),
        sb.from('eg_founder_profile').select('*').eq('user_id', ME.id).limit(1),
      ]);
      if (bank.error || terms.error) throw (bank.error || terms.error);

      RES   = (res.data   || [])[0] || null;
      BANK  = (bank.data  || [])[0] || null;
      TERMS = terms.data  || [];
      RATES = rates.data  || [];
      DUES  = ((rule.data || [])[0] || {}).dues || 0;
      PROF  = (prof.data  || [])[0] || null;

      if (!RES || !BANK) {
        $('fcDoc').innerHTML = '<div class="ct-done"><h2>진행 중인 신청이 없습니다</h2>' +
          '<p class="say">도시별현황에서 건물을 담으신 뒤 [파운더 신청하기]를 눌러 주십시오.</p>' +
          '<div class="acts"><button class="ct-btn" id="ctBackList" type="button">도시별현황으로</button></div></div>';
        return;
      }

      /* 담으신 건물 줄 — ⚠ 예약을 찾은 뒤라야 부를 수 있다 */
      const it = await sb.from('eg_founder_reservation_items')
        .select('slots,fee,eg_buildings(city,bno,wall)').eq('reservation_id', RES.id);
      ITEMS = (it.data || []).map((r) => {
        const g = r.eg_buildings || {};
        const w = g.wall || {};
        return { city: g.city, bno: g.bno, slots: r.slots, fee: r.fee,
                 label: w.landmark || ('건물 ' + g.bno) };
      }).sort((x, y) => String(x.city).localeCompare(String(y.city)) || x.bno - y.bno);

      const { data: had } = await sb.from('eg_contracts')
        .select('no,hash,paid').eq('reservation_id', RES.id).limit(1);
      if (had && had.length) { DONE = had[0]; drawDone(); return; }   /* 이미 서명하셨다 */

      drawDoc(); bindPad();
      $('fcPanel').focus({ preventScroll: true });
    } catch (e) {
      console.warn('[founder_contract]', e);
      $('fcDoc').innerHTML = '<p class="fc-wait">계약서를 불러올 수 없습니다.</p>';
    }
  })();
})();
</script>
</body>
</html>
