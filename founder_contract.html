<!-- ─────────────────────────────────────────────────────────────────────
     founder_contract.html — 타륜 › EG파운더 전용메뉴 › 파운더 계약서
     2026.09.18 · 파이스

     ① 살아 있는 신청을 스스로 찾는다 — ⚠ 부모가 번호를 건네지 않아도 된다
        held 가 있으면 그것, 없으면 아직 확정 안 된 claimed
     ② 본문은 DB eg_contract_terms 열네 줄 — ⚠ 이 파일에 조문을 적지 않는다
        표식  @dues  정회원 회비 (eg_founder_fee_rule.dues)
              @rates 요율표     (eg_founder_rate)
              @payout 정산 계좌 — ⭐ 적으시는 대로 제9조 ⑥ 이 따라 바뀐다
     ③ 당사자·계좌·EG 서명은 eg_founder_bank 한 줄 — ⚠ 값도 서명도 적지 않는다
     ④ ⭐ 주소는 계약서 본문에 들어가지 않는다 (0918 소로) — 보내 드리기 위한 것
     ⑤ ⭐ 이체는 서명 전에. 「이체를 완료하였습니다」는 계약서 안의 진술이다
        ⚠ 체크를 안 하셔도 제출을 막지 않는다 — 하지도 않은 이체를 체크하게 만들지 않는다
     ⑥ 계좌는 등폭으로 크게 — 노트북을 보며 폰으로 옮겨 치신다 (0918 소로)

     부모와 주고받는 말
       보냄  ct-back     도시별현황으로   ⚠ fc-back 은 도시별현황이 쓴다 — 이름을 겹치지 않는다
             ct-close    창을 닫는다
     ───────────────────────────────────────────────────────────────────── -->

  .ct-btn.gold{ border-color:#E3D4AE; color:var(--gold-ink); background:rgba(194,146,31,.07); }

  .ct-btn.gold[disabled]:hover{ background:rgba(194,146,31,.07); border-color:#E3D4AE; color:var(--gold-ink); }

  /* ── 계약 대상 ── */

  .ct-items td.n, .ct-items th.n{ text-align:right; white-space:nowrap; font-family:var(--mono); }

  .ct-art{ margin-top:26px; }
  .ct-art h3{ margin:0 0 9px; font:500 15px/1.6 var(--serif); color:var(--navy); }
  .ct-art h3 i{ font-style:normal; color:var(--gold-ink); margin-right:8px; }
  .ct-art p{ margin:0 0 8px; font:400 14px/1.95 var(--serif); color:var(--ink);

  .ct-rates{ margin:12px 0 12px; border-collapse:collapse; }

  .ct-rates td:last-child{ padding-right:0; color:var(--navy); font-weight:500; }
  #ctPayout{ font-family:var(--mono); font-size:13.5px; color:var(--navy); }

  .ct-pay .lab{ margin:0 0 8px; font:400 12.5px/1 var(--serif); color:var(--faint); letter-spacing:.05em; }
  .ct-pay .bank{ margin:0; font:400 14px/1.6 var(--serif); color:var(--muted); }
  .ct-pay .acct{ margin:2px 0 0; font:500 27px/1.45 var(--mono); color:var(--navy); letter-spacing:.02em; }
  .ct-pay .holder{ margin:4px 0 0; font:400 13.5px/1.6 var(--serif); color:var(--muted); }
  .ct-pay hr{ margin:18px 0; border:0; border-top:1px solid var(--rule); }
  .ct-pay .amt{ margin:0; font:500 27px/1.45 var(--mono); color:var(--gold-ink); }
  .ct-pay .brk{ margin:4px 0 0; font:400 12.5px/1.7 var(--serif); color:var(--faint); }

  /* ── 체크 ── */
  .ct-check{ margin-top:20px; display:flex; align-items:flex-start; gap:11px;
    padding:15px 18px; border:1px solid var(--line2); border-radius:4px; cursor:pointer; }
  .ct-check:hover{ border-color:var(--line); background:#FCFCFD; }
  .ct-check input{ margin:2px 0 0; width:17px; height:17px; accent-color:var(--gold); cursor:pointer; }
  .ct-check span{ font:400 14px/1.7 var(--serif); color:var(--ink); word-break:keep-all; }
  .ct-check span u{ display:block; margin-top:3px; text-decoration:none;
    font:400 12px/1.7 var(--serif); color:var(--faint); }

  /* ── 서명 ── */
  .ct-signs{ margin-top:34px; display:grid; grid-template-columns:1fr 1fr; gap:26px; }
  /* ⭐ 0918 오후 소로 — 서명란에 이름과 호칭이 서명 **옆에** 선다.
       그림만 덩그러니 있으면 누가 서명했는지 한 줄로 안 읽힌다. */
  .ct-sign{ display:flex; align-items:center; gap:26px; padding:20px 0;
    border-top:1px solid var(--rule); }
  .ct-sign:last-child{ border-bottom:1px solid var(--rule); }
  .ct-sign .nm{ flex:1 1 auto; min-width:0; }
  .ct-sign .who{ margin:0 0 7px; font:400 12.5px/1 var(--serif); color:var(--faint); letter-spacing:.05em; }
  .ct-sign .org{ margin:0 0 3px; font:400 13px/1.6 var(--serif); color:var(--soft); word-break:keep-all; }
  .ct-sign .nm b{ display:block; font:700 17px/1.5 var(--batang); color:var(--navy); letter-spacing:.02em; }
  .ct-sign .nm b.none{ font-weight:400; font-size:14px; color:var(--faint); letter-spacing:0; }
  .ct-sign .when{ margin:5px 0 0; font:400 12px/1.6 var(--mono); color:var(--faint); }

  .ct-sign .box{ position:relative; flex:0 0 auto; width:304px; height:126px;
    border:1px solid var(--line); border-radius:4px;
    background:#FFFFFF; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .ct-sign .box.pad{ cursor:crosshair; }
  .ct-sign .box.lock{ cursor:not-allowed; background:#FAFAF8; border-style:dashed; }
  .ct-sign .box::after{ content:''; position:absolute; left:24px; right:24px; bottom:30px;
    border-bottom:1px dashed var(--line2); pointer-events:none; }
  .ct-sign .box.drawn::after{ display:none; }
  .ct-sign img{ max-width:90%; max-height:112px; }
  .ct-sign canvas{ position:relative; z-index:1; width:100%; height:100%; display:block; touch-action:none; }
  .ct-sign .hint{ position:absolute; z-index:0; padding:0 18px; text-align:center;
    font:400 13px/1.7 var(--serif); color:var(--faint); pointer-events:none; word-break:keep-all; }
  .ct-sign .box.drawn .hint{ display:none; }
  .ct-sign .redo{ position:absolute; z-index:2; right:8px; bottom:6px; }
  .ct-sign .box:not(.drawn) .redo{ display:none; }

  /* ── 제출 ── */
  .ct-go{ margin-top:30px; padding-top:22px; border-top:1px solid var(--rule);
    display:flex; align-items:center; gap:14px; }
  .ct-go .say{ flex:1 1 auto; font:400 13px/1.8 var(--serif); color:var(--faint); word-break:keep-all; }

  .ct-row2 .l{ flex:1 1 auto; min-width:0; }
  .ct-row2 .no{ margin:0; font:500 13.5px/1.6 var(--mono); color:var(--gold-ink); }
  .ct-row2 .ttl{ margin:3px 0 0; font:400 14.5px/1.7 var(--serif); color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ct-row2 .r{ flex:0 0 auto; text-align:right; }
  .ct-row2 .amt{ margin:0; font:500 15px/1.5 var(--mono); color:var(--ink); }
  .ct-row2 .st{ display:inline-block; margin-top:5px; padding:2px 9px; border-radius:2px;
    font:400 11.5px/1.7 var(--serif); letter-spacing:.03em; }
  .ct-row2 .st.wait{ background:#F4F1E8; color:var(--gold-ink); }
  .ct-row2 .st.done{ background:var(--navy); color:#FFFFFF; }
  .ct-row2 .st.draft{ background:#FBF3DC; color:var(--gold-ink); }

  /* ── 완성 계약서 다시 보기 ── */
  .ct-view .ct-head{ margin-bottom:6px; }
  .ct-sign-note{ margin:16px 0 0; font:400 12.5px/1.9 var(--serif); color:var(--faint); word-break:keep-all; }
  .ct-sign-note b{ font-weight:400; color:var(--muted); font-family:var(--mono); font-size:11.5px;
    word-break:break-all; }
  .ct-stamp{ display:inline-block; margin:0 0 4px; padding:3px 11px; border-radius:2px;
    font:400 12px/1.8 var(--serif); letter-spacing:.03em; }
  .ct-stamp.wait{ background:#F4F1E8; color:var(--gold-ink); }
  .ct-stamp.done{ background:var(--navy); color:#FFFFFF; }
  .ct-mark{ margin:0 0 6px; font:400 11px/1 var(--serif); color:var(--faint); letter-spacing:.42em; }
  .ct-paid{ margin:22px 0 0; padding:14px 18px; border:1px solid var(--line2); border-radius:4px;
    font:400 13.5px/1.9 var(--serif); color:var(--muted); word-break:keep-all; }

  /* ── 인쇄 · PDF 저장 (0918 오후 소로) ───────────────────────────────
       ⭐ iframe 이 제 자신의 print() 를 부른다 — 부모의 지구·타륜·흐린 배경은
         인쇄 대상 밖이라 아예 안 찍힌다. 여기서는 이 문서 안쪽만 정리한다.
       ⚠ 브라우저의 「배경 그래픽」을 켜셔도 흉하지 않게 바탕을 흰색으로 못 박는다. */
  @media print {
    html, body, html.embed, html.embed body{ background:#FFFFFF !important; height:auto; }
    #fcStage{ position:static; display:block; }
    #fcPanel{ width:auto; height:auto; max-height:none; border-radius:0;
      box-shadow:none !important; overflow:visible; }
    .fc-top, .ct-go, .ct-err, .ct-btn, .ct-pay .copy{ display:none !important; }
    #fcScroll{ overflow:visible !important; padding:0 !important; }
    #fcDoc{ max-width:none !important; padding:0 !important; }
    .ct-art, .ct-sign, .ct-sec, .ct-items tr, .ct-pay{ break-inside:avoid; page-break-inside:avoid; }
    .ct-art h3{ break-after:avoid; page-break-after:avoid; }
    .ct-sign .box{ border-color:#BBB; }
    .ct-sign .box::after{ display:none; }
    .ct-view .ct-foot-no{ display:block; }
    a[href]::after{ content:none !important; }
  }
  .ct-view .ct-foot-no{ display:none; margin:26px 0 0; text-align:center;
    font:400 11px/1.8 var(--mono); color:var(--faint); }
  @page{ size:A4; margin:18mm 16mm; }
</style>
</head>

  /* 스냅샷 본문은 글자 한 덩어리 — 조로 갈라 같은 모양으로 편다 */
  function viewTerms(text) {
    const src = String(text || '');
    if (!src) return '';
    const blocks = src.split(/\n(?=제\d+조\s)/);
    let h = '';
    for (const blk of blocks) {
      const lines = blk.split('\n');
      const head = (lines.shift() || '').trim();
      const m = head.match(/^(제\d+조)\s*(.*)$/);
      h += '<div class="ct-art"><h3><i>' + esc(m ? m[1] : '') + '</i>' + esc(m ? m[2] : head) + '</h3>';
      for (const raw of lines) {
        const s = raw.trim();
        if (!s) continue;
        /* 요율표처럼 칸이 벌어진 줄은 등폭으로 — 표가 글자로 굳어 들어와 있다 */
        if (/\s{2,}/.test(s) && s.length < 40) {
          h += '<p style="font-family:var(--mono);font-size:13px;color:var(--muted)">' +
            esc(s.replace(/\s{2,}/g, '   ')) + '</p>';
        } else h += '<p>' + esc(s) + '</p>';
      }
      h += '</div>';
    }
    return h;
  }

  /* ── 서명 캔버스 ── */
  function fitCanvas() {
    CV = $('ctCanvas'); if (!CV) return;
    CTX = CV.getContext('2d');
    const r = CV.getBoundingClientRect();
    const d = Math.min(2, window.devicePixelRatio || 1);
    CV.width  = Math.max(1, Math.round((r.width  || 380) * d));
    CV.height = Math.max(1, Math.round((r.height || 132) * d));
    CTX.setTransform(d, 0, 0, d, 0, 0);
    CTX.lineWidth = 2.2; CTX.lineCap = 'round'; CTX.lineJoin = 'round';
    CTX.strokeStyle = '#1F232B'; CTX.fillStyle = '#1F232B';
    redraw();
  }
  function stroke(pts) {
    if (!pts.length) return;
    if (pts.length < 3) { CTX.beginPath(); CTX.arc(pts[0].x, pts[0].y, 1.2, 0, 6.3); CTX.fill(); return; }
    CTX.beginPath(); CTX.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {            /* 중간점으로 이어 부드럽게 */
      const m = { x: (pts[i].x + pts[i + 1].x) / 2, y: (pts[i].y + pts[i + 1].y) / 2 };
      CTX.quadraticCurveTo(pts[i].x, pts[i].y, m.x, m.y);
    }
    CTX.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
    CTX.stroke();
  }
  function redraw() {
    if (!CTX) return;
    CTX.save(); CTX.setTransform(1, 0, 0, 1, 0, 0);
    CTX.clearRect(0, 0, CV.width, CV.height); CTX.restore();
    strokes.forEach(stroke);
    const box = $('ctBox');
    if (box) box.classList.toggle('drawn', strokes.length > 0);
    const go = $('ctGo');
    if (go) go.disabled = strokes.length === 0 || !paidChecked();
  }

  /* ⭐ 0918 오후 소로 — 이체 체크 전에는 서명 칸이 잠긴다.
       정상적인 절차를 밟는 분을 기준으로 삼는다. */
  const paidChecked = () => { const c = $('ctPaid'); return !!(c && c.checked); };
  function syncLock() {
    const box = $('ctBox'), hint = $('ctHint'), on = paidChecked();
    if (box) box.classList.toggle('lock', !on);
    if (CV) CV.style.pointerEvents = on ? 'auto' : 'none';
    if (hint) hint.textContent = on
      ? '이 칸에 서명해 주십시오'
      : '이체를 완료하신 뒤 위 칸에 체크해 주시면 서명하실 수 있습니다';
    if (!on && strokes.length) { strokes = []; cur = null; }
    redraw();
  }
  /* 실명을 적으시는 대로 서명란 이름이 따라 선다 */
  function syncSignName() {
    const el = $('ctSignName'), v = ($('ctName') && $('ctName').value || '').trim();
    if (!el) return;
    el.textContent = v || '위에 실명을 적어 주십시오';
    el.classList.toggle('none', !v);
  }
  function at(e) {
    const r = CV.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function bindPad() {
    if (!CV) return;
    CV.addEventListener('pointerdown', (e) => {
      CV.setPointerCapture(e.pointerId); cur = [at(e)]; strokes.push(cur); redraw();
    });
    CV.addEventListener('pointermove', (e) => {
      if (!cur) return;
      const p = at(e), q = cur[cur.length - 1];
      if (Math.abs(p.x - q.x) + Math.abs(p.y - q.y) < 1.1) return;   /* 손 떨림은 버린다 */
      cur.push(p); redraw();
    });
    const up = () => { cur = null; };
    CV.addEventListener('pointerup', up);
    CV.addEventListener('pointercancel', up);
    CV.addEventListener('pointerleave', up);
  }
  function tickNow() {
    const el = $('ctNow'); if (!el) return;
    const d = new Date();
    const z = (n) => String(n).padStart(2, '0');
    el.textContent = d.getFullYear() + '.' + z(d.getMonth() + 1) + '.' + z(d.getDate()) +
      ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
  }

  /* ── 정산 계좌가 제9조 ⑥ 으로 ── */
  function payoutText() {
    const bk = ($('ctPbBank') || {}).value, ac = ($('ctPbAcct') || {}).value, hd = ($('ctPbHold') || {}).value;
    const s = [String(bk || '').trim(), String(ac || '').trim()].filter(Boolean).join(' ');
    const h = String(hd || '').trim();
    return (s ? s : '') + (h ? (s ? ' · ' : '') + '예금주 ' + h : '');
  }
  function syncPayout() {
    const el = $('ctPayout'); if (!el) return;
    const t = payoutText();
    el.textContent = t || '미기재';
    el.classList.toggle('none', !t);
  }

  /* ── 우편번호 ── */
  async function findZip() {
    try {
      if (!window.daum || !window.daum.Postcode) {
        await loadScript('https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js');
      }
      new window.daum.Postcode({ oncomplete: (d) => {
        $('ctZip').value = d.zonecode || '';
        $('ctAddr1').value = d.roadAddress || d.address || '';
        $('ctAddr2').focus();
      } }).open();
    } catch (_) {
      note('우편번호 찾기를 불러오지 못했습니다. 직접 적어 주셔도 됩니다.');
    }
  }
  function note(s) { const e = $('ctErr'); if (e) e.textContent = s || ''; }

  /* ── 제출 ── */
  async function submit() {
    const go = $('ctGo');
    const name = ($('ctName').value || '').trim();
    const phone = ($('ctPhone').value || '').trim();
    if (!name)  { note('실명을 적어 주십시오.'); $('ctName').focus(); return; }
    if (!phone) { note('휴대전화를 적어 주십시오.'); $('ctPhone').focus(); return; }
    if (!strokes.length) { note('서명을 해 주십시오.'); return; }
    note(''); go.disabled = true; go.textContent = '보내는 중입니다';
    try {
      const { data, error } = await SB.rpc('eg_founder_sign', {
        p_res: RES.id, p_name: name, p_phone: phone, p_biz: ($('ctBiz').value || '').trim(),
        p_zip: ($('ctZip').value || '').trim(),
        p_addr1: ($('ctAddr1').value || '').trim(), p_addr2: ($('ctAddr2').value || '').trim(),
        p_pb_bank: ($('ctPbBank').value || '').trim(),
        p_pb_account: ($('ctPbAcct').value || '').trim(),
        p_pb_holder: ($('ctPbHold').value || '').trim(),
        p_sign: CV.toDataURL('image/png'), p_paid: !!$('ctPaid').checked,
      });
      if (error) throw error;
      DONE = data;
      /* ⭐ 서명 직후에도 영수증이 아니라 계약서 본체를 펴 드린다 (0918 오후 소로) */
      const { data: full } = await SB.from('eg_contracts').select('*').eq('id', data.id).limit(1);
      if (full && full.length) { HAVE.unshift(full[0]); drawView(full[0], true); }
      else drawList();
    } catch (e) {
      note((e && (e.message || e.hint)) || '제출하지 못했습니다. 잠시 뒤 다시 눌러 주십시오.');
      go.disabled = false; go.textContent = '서명하고 제출';
    }
  }
  async function payLate() {
    try {
      const { error } = await SB.rpc('eg_founder_paid', { p_res: RES.id });
      if (error) throw error;
      DONE.paid = true;
      const { data: full } = await SB.from('eg_contracts').select('*').eq('id', DONE.id).limit(1);
      if (full && full.length) drawView(full[0], true);
    } catch (e) { note((e && e.message) || '바꾸지 못했습니다.'); }
  }
  function copyPay() {
    const t = BANK.bank + ' ' + BANK.account + ' ' + won(RES.amount_total) + '원';
    try { navigator.clipboard.writeText(t); } catch (_) {}
    const b = $('ctCopy'); if (!b) return;
    b.textContent = '복사됨'; setTimeout(() => { b.textContent = '복사'; }, 1400);
  }

  /* ── 손 ── */
  document.addEventListener('click', (e) => {
    if (!e.target.closest) return;
    if (e.target.closest('#ctClear'))    { strokes = []; cur = null; redraw(); return; }
    if (e.target.closest('#ctGo'))       { submit(); return; }
    if (e.target.closest('#ctFind'))     { findZip(); return; }
    if (e.target.closest('#ctCopy'))     { copyPay(); return; }
    if (e.target.closest('#ctPaidLate')) { payLate(); return; }
    if (e.target.closest('#ctBackList')) { say('ct-back'); return; }
    if (e.target.closest('#ctPrint'))    { doPrint(); return; }
    const row = e.target.closest('.ct-row2');
    if (row) {
      if (row.dataset.new) { drawDoc(); bindPad(); topbar('doc', '파운더 계약서'); }
      else openOne(row.dataset.id);
      return;
    }
  });

  /* ⭐ 0918 오후 소로 — iframe 이 제 자신을 인쇄한다.
       부모의 지구·타륜·흐린 배경은 인쇄 대상 밖이라 딸려 나오지 않는다. */
  function doPrint() { try { window.focus(); window.print(); } catch (_) {} }

  /* 목록에서 한 장을 편다 — 무거운 칸(본문·서명 둘)은 이때 부른다 */
  async function openOne(id) {
    if (!id) return;
    $('fcDoc').innerHTML = '<p class="fc-wait">계약서를 펴는 중입니다…</p>';
    try {
      const { data, error } = await SB.from('eg_contracts').select('*').eq('id', id).limit(1);
      if (error || !data || !data.length) throw (error || new Error('없음'));
      drawView(data[0], false);
    } catch (e) {
      console.warn('[founder_contract] openOne', e);
      $('fcDoc').innerHTML = '<p class="fc-wait">계약서를 불러올 수 없습니다.</p>';
    }
  }
  document.addEventListener('input', (e) => {
    if (!e.target.id) return;
    if (['ctPbBank','ctPbAcct','ctPbHold'].indexOf(e.target.id) >= 0) syncPayout();
    if (e.target.id === 'ctName') syncSignName();
  });
  document.addEventListener('change', (e) => {
    if (e.target && e.target.id === 'ctPaid') syncLock();
  });
  $('fcBack').addEventListener('click', () => {
    if (BACKTO === 'list') { drawList(); return; }        /* 계약서가 여럿이면 목록으로 */
    say('ct-back');
  });
  $('fcClose').addEventListener('click', () => say('ct-close'));
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') say('ct-close'); });
  window.addEventListener('resize', () => { if (CV) fitCanvas(); });

  /* ── 문 열기 ── */
  (async function boot() {
    try {
      const sb = await client(); SB = sb;
      try { await sb.rpc('eg_founder_sweep'); } catch (_) {}

      const { data: { user } = { user: null } } = await sb.auth.getUser();
      ME = user;
      if (!ME) { $('fcDoc').innerHTML = '<p class="fc-wait">로그인이 필요합니다.</p>'; return; }

      const [res, bank, terms, rates, rule, prof] = await Promise.all([
        sb.from('eg_founder_reservations').select('*')
          .in('status', ['held', 'claimed']).order('held_at', { ascending: false }).limit(1),
        sb.from('eg_founder_bank').select('*').eq('id', 1).limit(1),
        sb.from('eg_contract_terms').select('ord,article,title,body').order('ord'),
        sb.from('eg_founder_rate').select('*').order('members_from'),
        sb.from('eg_founder_fee_rule').select('dues').limit(1),
        sb.from('eg_founder_profile').select('*').eq('user_id', ME.id).limit(1),
      ]);
      if (bank.error || terms.error) throw (bank.error || terms.error);

      RES   = (res.data   || [])[0] || null;
      BANK  = (bank.data  || [])[0] || null;
      TERMS = terms.data  || [];
      RATES = rates.data  || [];
      DUES  = ((rule.data || [])[0] || {}).dues || 0;
      PROF  = (prof.data  || [])[0] || null;

      /* ⭐ 0918 오후 — 서명하신 계약서들을 먼저 안다. 목록이 이 화면의 집이다.
           본문·서명 둘은 무거우니 한 장을 펼 때 따로 부른다 */
      const mine = await sb.from('eg_contracts')
        .select('id,no,paid,signed_at,confirmed_at,amounts,items')
        .order('signed_at', { ascending: false });
      HAVE = mine.data || [];

      if (!RES || !BANK) {
        if (HAVE.length) { drawList(); return; }
        $('fcDoc').innerHTML = '<div class="ct-done"><h2>진행 중인 신청이 없습니다</h2>' +
          '<p class="say">도시별현황에서 건물을 담으신 뒤 [파운더 신청하기]를 눌러 주십시오.</p>' +
          '<div class="acts"><button class="ct-btn" id="ctBackList" type="button">도시별현황으로</button></div></div>';
        return;
      }

      /* 담으신 건물 줄 — ⚠ 예약을 찾은 뒤라야 부를 수 있다 */
      const it = await sb.from('eg_founder_reservation_items')
        .select('slots,fee,eg_buildings(city,bno,wall)').eq('reservation_id', RES.id);
      ITEMS = (it.data || []).map((r) => {
        const g = r.eg_buildings || {};
        const w = g.wall || {};
        return { city: g.city, bno: g.bno, slots: r.slots, fee: r.fee,
                 label: w.landmark || ('건물 ' + g.bno) };
      }).sort((x, y) => String(x.city).localeCompare(String(y.city)) || x.bno - y.bno);

      const { data: had } = await sb.from('eg_contracts')
        .select('*').eq('reservation_id', RES.id).limit(1);
      if (had && had.length) {                       /* 이미 서명하신 신청이다 */
        DONE = had[0];
        if (HAVE.length > 1) drawList(); else drawView(had[0], false);
        return;
      }

      /* 서명 전 — 계약서가 이미 있으신 분께는 목록부터, 처음이신 분께는 곧바로 한 장 */
      if (HAVE.length) { drawList(); return; }
      drawDoc(); bindPad(); topbar('doc', '파운더 계약서');
      $('fcPanel').focus({ preventScroll: true });
    } catch (e) {
      console.warn('[founder_contract]', e);
      $('fcDoc').innerHTML = '<p class="fc-wait">계약서를 불러올 수 없습니다.</p>';
    }
  })();
})();
</script>
</body>
</html>
