<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EG헤리티지 — 경매장과 대여 서가</title>
<style>
/* ══════════════════════════════════════════════════
   EG HERITAGE v3.1 · Phase 1 + 가독성 패스
   "희소성은 소장에, 풍요는 길 위에 — 보물은 흐른다"
   설계도: EG헤리티지_종합설계도_v3_0_0606
   가독성 원칙: 글자 바닥선 12px · 투명도 0.3대 유령 글씨 폐기 · 웹폰트 실로드
   ══════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --wine:       #3a2222;   /* 배경 깊은 와인 레드 */
  --wine-deep:  #2b1818;
  --oak:        #2c2118;
  --gold:       #d4b35e;   /* 가독 골드 (구 #c9a84c보다 한 단계 밝게) */
  --gold-l:     #ecd08a;
  --gold-dim:   rgba(212,179,94,0.7);   /* 구 0.45 → 0.7 */
  --gold-faint: rgba(212,179,94,0.14);
  --cream:      #f4efe4;
  --txt-strong: rgba(244,239,228,0.97); /* 제목 */
  --txt:        rgba(244,239,228,0.88); /* 본문 */
  --txt-soft:   rgba(244,239,228,0.66); /* 보조 — 이 밑으로 내려가지 않음 */
  --warmgrey:   #c2b49e;
  --ink:        #221510;   /* 크림 아침 방의 글자색 */
  /* 베이지 크롬 (무대 바깥 페이지) */
  --page-top:   #efe6d2;
  --page-bot:   #e3d6ba;
  --ink-strong: #2a1d12;
  --ink-txt:    rgba(42,29,18,0.85);
  --ink-soft:   rgba(42,29,18,0.62);
  --gold-deep:  #8e6c1d;   /* 밝은 배경 위의 골드 */
}

html, body { height: 100%; }
body {
  font-family: 'Noto Serif KR', 'Apple SD Gothic Neo', Georgia, serif;
  font-size: 16px;
  background:
    radial-gradient(ellipse 130% 60% at 50% -10%, rgba(255,250,238,0.7), transparent 60%),
    linear-gradient(180deg, var(--page-top) 0%, var(--page-bot) 100%);
  background-attachment: fixed;
  color: var(--ink-txt);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  letter-spacing: 0.01em;
}

/* ── 헤더 ───────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 100;
  padding: 14px 16px 10px;
  background: linear-gradient(180deg, rgba(239,230,210,0.97) 72%, rgba(239,230,210,0));
  backdrop-filter: blur(8px);
}
.hd-row { display: flex; align-items: center; gap: 12px; }
.hd-back {
  background: none; border: 1px solid rgba(42,29,18,0.22);
  border-radius: 8px; color: var(--ink-soft);
  width: 32px; height: 32px; font-size: 15px; cursor: pointer;
  flex-shrink: 0; font-family: inherit; line-height: 1;
}
.hd-title { flex: 1; }
.hd-eyebrow {
  font-size: 12px; letter-spacing: 0.26em; color: var(--gold-deep);
  text-transform: uppercase; margin-bottom: 2px;
}
.hd-name { font-size: 18px; color: var(--ink-strong); letter-spacing: 0.06em; font-weight: 600; }
.hd-name .amp { color: var(--gold-deep); font-style: italic; font-size: 13px; }
.hd-badge {
  font-size: 12px; color: rgba(42,29,18,0.5);
  letter-spacing: 0.08em; text-align: right; line-height: 1.5; flex-shrink: 0;
}

/* ── 주간 리듬 한 줄 ─────────────────────── */
.rhythm {
  margin: 4px 16px 0;
  padding: 7px 12px;
  border: 1px solid rgba(142,108,29,0.28);
  border-radius: 8px;
  background: rgba(142,108,29,0.07);
  font-size: 13px; color: var(--ink-soft);
  letter-spacing: 0.03em; text-align: center; line-height: 1.7;
}
.rhythm b { color: var(--gold-deep); font-weight: 600; }

/* ── 메인 3탭 ────────────────────────────── */
.main-tabs {
  display: flex; margin: 14px 16px 0;
  border-bottom: 1px solid rgba(42,29,18,0.14);
}
.main-tab {
  flex: 1; padding: 11px 4px 12px;
  background: none; border: none;
  border-bottom: 2px solid transparent;
  color: rgba(42,29,18,0.58);
  font-size: 14.5px; letter-spacing: 0.04em;
  cursor: pointer; font-family: inherit;
  transition: color 0.25s, border-color 0.25s;
}
.main-tab.active { color: var(--gold-deep); border-bottom-color: var(--gold-deep); font-weight: 600; }

/* ── Salle 네비 ──────────────────────────── */
.salle-nav {
  display: flex; gap: 6px;
  padding: 14px 16px 4px;
  overflow-x: auto; scrollbar-width: none;
}
.salle-nav::-webkit-scrollbar { display: none; }
.salle-tab {
  flex: 1; min-width: 56px;
  padding: 8px 4px;
  background: rgba(255,252,244,0.4);
  border: 1px solid rgba(42,29,18,0.18);
  border-radius: 10px;
  color: rgba(42,29,18,0.62);
  font-family: inherit; cursor: pointer;
  transition: all 0.25s;
  text-align: center;
}
.salle-tab .num { display: block; font-size: 17px; letter-spacing: 0.1em; line-height: 1.2; }
.salle-tab .nm  { display: block; font-size: 12px; letter-spacing: 0.03em; margin-top: 4px; opacity: 0.9; }
.salle-tab.active {
  border-color: #b08c2e;
  color: #7a5a10;
  background: rgba(212,179,94,0.22);
  font-weight: 600;
}

/* ── 무대 (Salle 방별 테마) ───────────────── */
.stage-wrap { padding: 12px 16px 32px; }
.stage {
  position: relative;
  border-radius: 16px;
  border: 1px solid rgba(120,90,35,0.35);
  box-shadow: 0 20px 44px rgba(85,62,28,0.22), 0 4px 12px rgba(85,62,28,0.14);
  overflow: hidden;
  min-height: 58vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 36px 22px 26px;
  transition: background 0.5s ease;
  animation: stageIn 0.45s ease;
}
@keyframes stageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ── 무대 이미지: 소로 제작 webp 5장 (매핑: Ⅳ↔bg05, Ⅴ↔bg04 교차) ──
   1층 오버레이 = 명판 가독용 하단 그늘 / 2층 = 무대 사진 / 3층 = 로드 실패 폴백 */

/* Salle Ⅰ — 와인 다마스크 (bg01) */
.stage[data-salle="1"] {
  background-image:
    linear-gradient(180deg, rgba(25,10,10,0.12) 0%, rgba(25,10,10,0) 35%, rgba(20,8,8,0.62) 100%),
    url('concerthall_bg01.webp'),
    linear-gradient(165deg, #4a2828 0%, #351c1c 100%);
  background-size: cover; background-position: center bottom;
}
/* Salle Ⅱ — 진녹 서재 (bg02) */
.stage[data-salle="2"] {
  background-image:
    linear-gradient(180deg, rgba(10,16,10,0.12) 0%, rgba(10,16,10,0) 35%, rgba(8,12,8,0.62) 100%),
    url('concerthall_bg02.webp'),
    linear-gradient(170deg, #243126 0%, #16201a 100%);
  background-size: cover; background-position: center bottom;
}
/* Salle Ⅲ — 프러시안 블루 궁전 (bg03) */
.stage[data-salle="3"] {
  background-image:
    linear-gradient(180deg, rgba(10,14,26,0.15) 0%, rgba(10,14,26,0) 35%, rgba(8,11,20,0.66) 100%),
    url('concerthall_bg03.webp'),
    linear-gradient(170deg, #1f2c44 0%, #131c2c 100%);
  background-size: cover; background-position: center bottom;
}
/* Salle Ⅳ — 크림 아침 (bg05 · 밝은 방) */
.stage[data-salle="4"] {
  background-image:
    linear-gradient(180deg, rgba(252,248,238,0.1) 0%, rgba(252,248,238,0) 35%, rgba(244,236,218,0.66) 100%),
    url('concerthall_bg05.webp'),
    linear-gradient(175deg, #ece2cd 0%, #d8cbb2 100%);
  background-size: cover; background-position: center bottom;
}
/* Salle Ⅴ — 렘브란트 명암 (bg04) */
.stage[data-salle="5"] {
  background-image:
    linear-gradient(180deg, rgba(8,5,3,0.1) 0%, rgba(8,5,3,0) 35%, rgba(6,4,2,0.68) 100%),
    url('concerthall_bg04.webp'),
    linear-gradient(180deg, #171109 0%, #0c0805 100%);
  background-size: cover; background-position: center bottom;
}

.stage-label {
  position: absolute; top: 14px; left: 0; right: 0;
  text-align: center;
  font-size: 12px; letter-spacing: 0.26em;
  color: var(--gold-dim); text-transform: uppercase;
  text-shadow: 0 1px 6px rgba(0,0,0,0.55);
}
.stage[data-salle="4"] .stage-label { color: rgba(90,65,25,0.95); text-shadow: 0 1px 6px rgba(252,248,238,0.7); }

.artwork {
  max-width: 88%; max-height: 44vh;
  width: auto; height: auto;
  display: block;
  filter: drop-shadow(0 18px 30px rgba(0,0,0,0.65)) drop-shadow(0 4px 8px rgba(0,0,0,0.4));
  animation: artIn 0.6s ease;
}
@keyframes artIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: none; } }
.stage[data-salle="4"] .artwork { filter: drop-shadow(0 16px 26px rgba(70,50,25,0.5)) drop-shadow(0 4px 8px rgba(70,50,25,0.3)); }

/* 명판(플라크) */
.plaque {
  margin-top: 22px;
  text-align: center;
  max-width: 320px;
  text-shadow: 0 1px 8px rgba(10,5,5,0.6);
}
.stage[data-salle="4"] .plaque { text-shadow: 0 1px 8px rgba(252,248,238,0.7); }
.stage .void-line { color: var(--txt); }
.stage .void-sub  { color: var(--txt-soft); }
.stage .void-mark { color: var(--gold-dim); }
.plaque-name { font-size: 21px; font-weight: 600; color: var(--txt-strong); letter-spacing: 0.03em; line-height: 1.4; }
.plaque-artist { font-size: 14px; color: var(--gold); font-style: italic; margin-top: 7px; }
.plaque-meta { font-size: 13px; color: var(--txt-soft); letter-spacing: 0.03em; margin-top: 5px; }
.stage[data-salle="4"] .plaque-name  { color: var(--ink); }
.stage[data-salle="4"] .plaque-artist{ color: #6e4e14; }
.stage[data-salle="4"] .plaque-meta  { color: rgba(50,38,24,0.78); }

.love-line {
  margin-top: 16px;
  font-size: 13.5px; letter-spacing: 0.04em;
  color: var(--txt-soft);
}
.love-line b { color: var(--gold-l); font-weight: 600; }
.stage[data-salle="4"] .love-line { color: rgba(60,45,28,0.82); }
.stage[data-salle="4"] .love-line b { color: #7a5410; font-weight: 600; }

/* 카드 버튼 줄 */
.card-actions {
  margin-top: 18px;
  display: flex; gap: 10px;
  width: 100%; max-width: 340px;
}
.btn-layers {
  flex: 1;
  padding: 12px 8px;
  background: rgba(240,235,224,0.05);
  border: 1px solid rgba(244,239,228,0.22);
  border-radius: 12px;
  color: var(--txt);
  font-size: 14px; letter-spacing: 0.04em;
  cursor: pointer; font-family: inherit;
}
.btn-apply {
  flex: 1.4;
  padding: 12px 8px;
  background: linear-gradient(135deg, rgba(201,168,76,0.32), rgba(201,168,76,0.12));
  border: 1px solid rgba(201,168,76,0.5);
  border-radius: 12px;
  color: var(--gold-l);
  font-size: 15px; font-weight: 600; letter-spacing: 0.05em;
  cursor: pointer; font-family: inherit;
}
.stage[data-salle="4"] .btn-layers { background: rgba(60,45,30,0.06); border-color: rgba(60,45,30,0.22); color: rgba(50,38,24,0.92); }
.stage[data-salle="4"] .btn-apply  { background: linear-gradient(135deg, rgba(140,100,30,0.22), rgba(140,100,30,0.08)); border-color: rgba(140,100,30,0.5); color: #6a4c0e; font-weight: 600; }

/* ── 우아한 비움 ─────────────────────────── */
.void {
  min-height: 50vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 40px 28px;
  animation: stageIn 0.45s ease;
}
.void-mark { font-size: 26px; color: var(--gold-deep); margin-bottom: 18px; }
.void-line { font-size: 16.5px; color: var(--ink-txt); line-height: 1.9; letter-spacing: 0.03em; }
.void-sub  { font-size: 13px; color: var(--ink-soft); margin-top: 14px; letter-spacing: 0.04em; line-height: 1.9; }

/* ── 응모 패널 / 모달 공통 ────────────────── */
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes flowerIn { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }

.sheet-overlay {
  position: fixed; inset: 0; z-index: 600;
  background-color: rgba(20,10,8,0.94);   /* 이미지 미도착 폴백 */
  background-size: cover;
  background-position: center;
  display: flex; align-items: flex-end; justify-content: center;
  animation: overlayIn 0.25s ease;
}
.sheet {
  width: 100%; max-width: 480px;
  background: #241614;
  border-radius: 20px 20px 0 0;
  border-top: 1px solid rgba(212,179,94,0.35);
  box-shadow: 0 -16px 70px rgba(0,0,0,0.6);
  padding: 26px 26px 46px;
  animation: sheetUp 0.32s cubic-bezier(0.34,1.56,0.64,1);
  max-height: 86vh; overflow-y: auto;
  scrollbar-width: none;
}
.sheet::-webkit-scrollbar { display: none; }
.sheet-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: rgba(201,168,76,0.25);
  margin: 0 auto 22px;
}
.sheet-eyebrow { font-size: 12px; letter-spacing: 0.2em; color: var(--gold-dim); margin-bottom: 7px; text-transform: uppercase; }
.sheet-title { font-size: 20px; font-weight: 600; color: var(--txt-strong); margin-bottom: 6px; line-height: 1.35; }
.sheet-sub { font-size: 13.5px; color: var(--txt-soft); margin-bottom: 22px; }

/* 4겹 모달 본문 */
.layer-block { margin-bottom: 20px; }
.layer-tag {
  font-size: 12.5px; letter-spacing: 0.18em; color: var(--gold-dim);
  text-transform: uppercase; margin-bottom: 7px;
}
.layer-text { font-size: 15.5px; color: var(--txt); line-height: 1.95; letter-spacing: 0.01em; }
.layer-divider { height: 1px; margin: 22px 0; background: linear-gradient(90deg, transparent, rgba(201,168,76,0.18), transparent); }

/* 공통 버튼 */
.sheet-btn {
  width: 100%; padding: 14px;
  border-radius: 12px;
  font-size: 14.5px; letter-spacing: 0.05em;
  cursor: pointer; font-family: inherit;
  margin-top: 10px;
}
.sheet-btn.gold {
  background: linear-gradient(135deg, rgba(212,179,94,0.35), rgba(212,179,94,0.14));
  border: 1px solid rgba(212,179,94,0.55);
  color: var(--gold-l);
  font-weight: 600;
}
.sheet-btn.ghost {
  background: rgba(244,239,228,0.06);
  border: 1px solid rgba(244,239,228,0.18);
  color: rgba(244,239,228,0.72);
}
.sheet-btn.quiet {
  background: none;
  border: 1px solid rgba(244,239,228,0.14);
  color: rgba(244,239,228,0.55);
  font-size: 13px; padding: 12px;
}
.sheet-btn:disabled { opacity: 0.5; cursor: default; }

/* 응모 현황 박스 */
.stat-row { display: flex; gap: 10px; margin-bottom: 20px; }
.stat-box {
  flex: 1;
  background: rgba(201,168,76,0.07);
  border: 1px solid rgba(201,168,76,0.15);
  border-radius: 10px;
  padding: 13px 8px;
  text-align: center;
}
.stat-num { font-size: 26px; color: var(--gold-l); }
.stat-num small { font-size: 15px; color: var(--gold-dim); }
.stat-lbl { font-size: 12px; color: var(--txt-soft); letter-spacing: 0.04em; margin-top: 4px; }

.confession {
  background: rgba(201,168,76,0.05);
  border: 1px solid rgba(201,168,76,0.12);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 18px;
  font-size: 13.5px; color: var(--txt-soft);
  line-height: 1.9; letter-spacing: 0.02em;
  text-align: center;
}
.confession b { color: var(--gold-l); font-weight: 600; }

.ticket-list-tag { font-size: 12px; letter-spacing: 0.16em; color: var(--gold-dim); margin-bottom: 10px; }
.ticket-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px;
  background: rgba(20,10,8,0.4);
  border: 1px solid rgba(201,168,76,0.1);
  border-radius: 6px;
  margin-bottom: 6px;
}
.ticket-code { font-family: 'Courier New', monospace; font-size: 13.5px; color: var(--gold-l); letter-spacing: 0.05em; }
.ticket-date { font-size: 12px; color: var(--txt-soft); }

.notice {
  font-size: 13.5px; color: rgba(244,239,228,0.72);
  line-height: 2.0; margin: 18px 0;
  letter-spacing: 0.02em;
}

/* 티켓 카드 */
.ticket-card {
  background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(140,100,20,0.1));
  border: 1px solid rgba(201,168,76,0.4);
  border-radius: 12px;
  padding: 26px 22px;
  margin-bottom: 22px;
  position: relative; overflow: hidden;
  text-align: center;
}
.ticket-hole { position: absolute; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; background: #241614; border-radius: 50%; border: 1px solid rgba(201,168,76,0.2); }
.ticket-hole.l { left: -10px; } .ticket-hole.r { right: -10px; }
.ticket-dash { border-top: 1px dashed rgba(201,168,76,0.2); margin: 16px 0; }
.ticket-big-code { font-family: 'Courier New', monospace; font-size: 17px; color: var(--gold); letter-spacing: 0.08em; font-weight: bold; word-break: break-all; line-height: 1.6; }

/* 토스트 */
.toast {
  position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%);
  background: rgba(36,22,20,0.96);
  border: 1px solid rgba(201,168,76,0.3);
  color: var(--cream);
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 14.5px; letter-spacing: 0.04em;
  z-index: 800;
  animation: overlayIn 0.25s ease;
  white-space: nowrap;
}

@media (min-width: 640px) {
  .stage-wrap, .main-tabs, .salle-nav, .rhythm { max-width: 560px; margin-left: auto; margin-right: auto; }
}
</style>
</head>
<body>

<header>
  <div class="hd-row">
    <button class="hd-back" onclick="goHome()" aria-label="홈으로">←</button>
    <div class="hd-title">
      <div class="hd-eyebrow">EG Heritage</div>
      <div class="hd-name">경매장 <span class="amp">&amp;</span> 대여 서가</div>
    </div>
    <div class="hd-badge">heritage v3.5 · Phase 1<br>막 원본 노출 · 베이지 크롬</div>
  </div>
</header>

<div class="rhythm" id="rhythm-line"></div>

<nav class="main-tabs" id="main-tabs">
  <button class="main-tab active" data-tab="salon"   onclick="switchMainTab('salon')">🖼 이번 주 살롱</button>
  <button class="main-tab"        data-tab="record"  onclick="switchMainTab('record')">📀 음반 가게</button>
  <button class="main-tab"        data-tab="catalog" onclick="switchMainTab('catalog')">📚 카탈로그</button>
</nav>

<!-- ── 탭 ① 살롱 ─────────────────────────── -->
<section id="tab-salon">
  <nav class="salle-nav" id="salle-nav"></nav>
  <div class="stage-wrap"><div id="stage-host"></div></div>
</section>

<!-- ── 탭 ② 음반 가게 (Phase 3) ─────────────── -->
<section id="tab-record" hidden>
  <div class="void">
    <div class="void-mark">📀</div>
    <div class="void-line">가게가 단장 중입니다.</div>
    <div class="void-sub">매주 화요일, 아홉 장의 신보가 진열됩니다.<br>청음은 없습니다 — 재킷과 라이너 노트만 읽고,<br>판은 집으로 데려가 듣는 곳입니다.</div>
  </div>
</section>

<!-- ── 탭 ③ 카탈로그 레조네 (Phase 4) ────────── -->
<section id="tab-catalog" hidden>
  <div class="void">
    <div class="void-mark">📚</div>

/* ══════════════════════════════════════════════════

// ── Supabase 설정 ─────────────────────────
const SUPABASE_URL = 'https://cyhlotwdisjvoxvfkpnd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';

async function sbFetch(path, options = {}) {
  const res = await fetch(SUPABASE_URL + path, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + (getToken() || SUPABASE_KEY),
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...options.headers
    }
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.message || res.statusText); }
  return res.status === 204 ? null : res.json();
}

function getToken() {
  try { const s = JSON.parse(localStorage.getItem('eungyo-auth')); return s?.access_token || null; }
  catch { return null; }
}
function getUser() {
  try { const s = JSON.parse(localStorage.getItem('eungyo-auth')); return s?.user || null; }
  catch { return null; }
}

// ISO 주차 (DB 함수 TO_CHAR IYYY-"W"IW 와 정합)
function getWkId(d = new Date()) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  const wk = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  return `${date.getUTCFullYear()}-W${String(wk).padStart(2, '0')}`;
}

let SALON_ITEMS = [];        // 이번 주 그림 5점 (salle_no 순)

// ── 데이터 로드 ───────────────────────────
async function loadSalon() {
  try {
    SALON_ITEMS = await sbFetch(
      `/rest/v1/heritage_items?status=eq.active&category=eq.visual&select=*&order=salle_no.asc`
    ) || [];
  } catch (e) { console.warn('살롱 로드 실패:', e); SALON_ITEMS = []; }

  // 응모 현황: 사람 풀 — 작품별 DISTINCT 응모자 수
  LOVE_COUNTS = {};
  if (SALON_ITEMS.length) {
    try {
      const ids = SALON_ITEMS.map(i => i.id).join(',');
      const apps = await sbFetch(
        `/rest/v1/heritage_applications?item_id=in.(${ids})&wk_id=eq.${getWkId()}&select=item_id,user_id`
      ) || [];
      const sets = {};
      for (const a of apps) {
        (sets[a.item_id] = sets[a.item_id] || new Set()).add(a.user_id);
      }
      for (const k of Object.keys(sets)) LOVE_COUNTS[k] = sets[k].size;

}

// ── 메인 탭 ───────────────────────────────
function switchMainTab(tab) {

// ── Salle 네비 ────────────────────────────
function renderSalleNav() {

// ── 무대 렌더 ─────────────────────────────
function renderStage() {

  if (!SALON_ITEMS.length) {
    host.innerHTML = `

    host.innerHTML = `
      <div class="stage" data-salle="${currentSalle}">

    <div class="stage" data-salle="${currentSalle}">
      <div class="stage-label">Salle ${ROMAN[currentSalle]} · ${SALLE_NAMES[currentSalle]}</div>
      <img class="artwork" src="${item.img}" alt="${escapeHtml(item.name)}"
           onerror="this.style.display='none'">
      <div class="plaque">
        <div class="plaque-name">${escapeHtml(item.name)}</div>
        <div class="plaque-artist">${escapeHtml(item.artist)}${item.period ? ' · ' + escapeHtml(item.period) : ''}</div>

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// ── 카리의 4겹 모달 ───────────────────────
function openLayers(itemId) {
  const item = SALON_ITEMS.find(i => i.id === itemId);
  if (!item) return;
  const src = item.layers || item.library;
  if (!src) return;

  let blocks = '';
  if (Array.isArray(src)) {
    blocks = src.map((t, i) => `
      <div class="layer-block">
        <div class="layer-tag">${i + 1}번째 겹</div>
        <div class="layer-text">${escapeHtml(typeof t === 'string' ? t : JSON.stringify(t))}</div>
      </div>`).join('<div class="layer-divider"></div>');
  } else if (typeof src === 'object') {
    const order = ['scene', 'knowledge', 'thought', 'connection', 'curation'];
    const keys = [...order.filter(k => src[k]), ...Object.keys(src).filter(k => !order.includes(k))];
    blocks = keys.map(k => `
      <div class="layer-block">
        <div class="layer-tag">${LAYER_LABELS[k] || escapeHtml(k)}</div>
        <div class="layer-text">${escapeHtml(src[k])}</div>
      </div>`).join('<div class="layer-divider"></div>');
  } else {
    blocks = `<div class="layer-text">${escapeHtml(src)}</div>`;
  }

  const panel = document.createElement('div');
  panel.id = 'layers-panel';
  panel.innerHTML = `
    <div class="sheet-overlay" style="${salleBackdrop()}" onclick="if(event.target===this)closeLayers()">

        <div class="sheet-handle"></div>

        <div class="sheet-title">${escapeHtml(item.name)}</div>
        <div class="sheet-sub">${escapeHtml(item.artist)}</div>
        ${blocks}
        <button class="sheet-btn quiet" onclick="closeLayers()">닫기</button>
      </div>
    </div>`;
  document.body.appendChild(panel);
  document.body.style.overflow = 'hidden';
}
function closeLayers() {

            <div class="stat-num">${weekCount}<small>/6</small></div>
            <div class="stat-lbl">내 티켓 (이번 주)</div>

          <button class="sheet-btn gold" onclick="submitApplication('${itemId}')">🍎 오늘 응모하기 (황금사과 1알)</button>

        ` : `
          <div class="sheet-btn ghost" style="text-align:center;cursor:default;">이번 주 응모 6장을 모두 사용하셨습니다</div>
        `}

        <button class="sheet-btn quiet" onclick="closeBidPanel()">닫기</button>
      </div>
    </div>`;
  document.body.appendChild(panel);

function closeBidPanel() {
  const p = document.getElementById('bid-panel'); if (p) p.remove();

}

// ── 응모 실행 ─────────────────────────────
async function submitApplication(itemId) {
  const user = getUser();
  if (!user) { showToast('로그인이 필요합니다'); return; }
  const nickname = localStorage.getItem('eg_nickname') || user.email?.split('@')[0] || '익명';

  const btn = document.querySelector('#bid-panel button[onclick*="submitApplication"]');
  if (btn) { btn.disabled = true; btn.textContent = '응모 중...'; }

  try {
    const result = await sbFetch('/rest/v1/rpc/apply_heritage', {
      method: 'POST',
      body: JSON.stringify({ p_item_id: itemId, p_user_id: user.id, p_nickname: nickname })
    });

    if (result.ok) {
      LOVE_COUNTS[itemId] = Math.max(LOVE_COUNTS[itemId] || 0, 0) || 0;
      showTicketInPanel(result.ticket, itemId);
      refreshLoveAndStage(itemId);
    } else {
      showToast(result.msg);
      if (btn) { btn.disabled = false; btn.textContent = '🍎 오늘 응모하기 (황금사과 1알)'; }
    }
  } catch (e) {
    showToast('응모 실패: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '🍎 오늘 응모하기 (황금사과 1알)'; }
  }
}

// 응모 후 사람 수 재조회 + 무대 갱신
async function refreshLoveAndStage(itemId) {
  try {
    const apps = await sbFetch(
      `/rest/v1/heritage_applications?item_id=eq.${itemId}&wk_id=eq.${getWkId()}&select=user_id`
    ) || [];
    LOVE_COUNTS[itemId] = new Set(apps.map(a => a.user_id)).size;
  } catch (e) { console.warn(e); }
  renderStage();
}

  sheet.innerHTML = `

      <div style="font-size:12px;color:rgba(244,239,228,0.55);margin-top:8px;letter-spacing:0.06em;">${new Date().toLocaleDateString('ko-KR')} 발급</div>
      <div class="ticket-dash"></div>
      <div style="font-size:12.5px;color:rgba(244,239,228,0.62);letter-spacing:0.04em;line-height:1.9;">

      </div>
    </div>

    <button class="sheet-btn ghost" onclick="saveTicketToWunderkammer('${ticketCode}','${item ? escapeHtml(item.name) : itemId}')">🏠 분더카머에 보관</button>
    <button class="sheet-btn quiet" onclick="closeBidPanel()">닫기</button>
  `;

// ── 티켓 이미지 다운로드 ──────────────────
function downloadTicket(ticketCode, itemName) {
  const canvas = document.createElement('canvas');
  canvas.width = 600; canvas.height = 320;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#241614';
  ctx.fillRect(0, 0, 600, 320);

  ctx.strokeStyle = 'rgba(201,168,76,0.6)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(16, 16, 568, 288);

  ctx.setLineDash([6, 4]);
  ctx.strokeStyle = 'rgba(201,168,76,0.25)';
  ctx.beginPath(); ctx.moveTo(40, 160); ctx.lineTo(560, 160); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#140a08';
  ctx.beginPath(); ctx.arc(16, 160, 12, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(584, 160, 12, 0, Math.PI * 2); ctx.fill();

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(201,168,76,0.6)';
  ctx.font = '11px "Courier New"';
  ctx.fillText('EG HERITAGE · LOTTERY TICKET', 300, 60);

  ctx.fillStyle = 'rgba(244,239,228,0.85)';
  ctx.font = '18px Georgia';
  ctx.fillText(itemName, 300, 100);

  ctx.fillStyle = '#C9A84C';
  ctx.font = 'bold 22px "Courier New"';
  ctx.fillText(ticketCode, 300, 210);

  ctx.fillStyle = 'rgba(244,239,228,0.55)';
  ctx.font = '11px Georgia';
  ctx.fillText(new Date().toLocaleDateString('ko-KR') + ' 발급 · 은교살롱', 300, 270);

  const a = document.createElement('a');
  a.download = `EG_TICKET_${ticketCode}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
  showToast('🎟 티켓이 저장되었습니다!');
}

// ── 분더카머 티켓 보관 (임시 localStorage — 본 공사 교체 지점) ──
function saveTicketToWunderkammer(ticketCode, itemName) {
  try {
    const tickets = JSON.parse(localStorage.getItem('eg_my_tickets') || '[]');
    if (!tickets.find(t => t.code === ticketCode)) {
      tickets.push({ code: ticketCode, item: itemName, date: new Date().toISOString() });
      localStorage.setItem('eg_my_tickets', JSON.stringify(tickets));
    }
    showToast('🏠 분더카머에 보관했습니다!');
  } catch (e) {
    showToast('보관 실패: ' + e.message);
  }
}

// ── 토스트 ────────────────────────────────
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ── 키보드 + 스와이프 ─────────────────────
document.addEventListener('keydown', (e) => {
  if (document.getElementById('bid-panel') || document.getElementById('layers-panel')) {
    if (e.key === 'Escape') { closeBidPanel(); closeLayers(); }
    return;
  }
  if (document.getElementById('tab-salon').hidden) return;
  if (e.key === 'ArrowLeft')  switchSalle(currentSalle - 1);
  if (e.key === 'ArrowRight') switchSalle(currentSalle + 1);
  if (['1','2','3','4','5'].includes(e.key)) switchSalle(parseInt(e.key));
});

let touchX = null;
document.addEventListener('touchstart', (e) => {
  if (document.getElementById('bid-panel') || document.getElementById('layers-panel')) return;
  if (document.getElementById('tab-salon').hidden) return;
  touchX = e.touches[0].clientX;
}, { passive: true });
document.addEventListener('touchend', (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) < 60) return;
  if (dx < 0) switchSalle(currentSalle + 1);
  else        switchSalle(currentSalle - 1);
}, { passive: true });

// ── 초기화 ────────────────────────────────
function goHome() { window.location.href = '/eungyo-salon/'; }

(async function init() {
  renderRhythm();
  renderSalleNav();
  document.getElementById('stage-host').innerHTML = `
    <div class="void">
      <div class="void-mark">✦</div>
      <div class="void-line">살롱의 불을 켜는 중입니다…</div>
    </div>`;
  await loadSalon();
  renderSalleNav();
  renderStage();
})();
</script>
