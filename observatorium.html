<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EG 천문대</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
 *  observatorium.html v1.0 — 0804 · 천문대 대문
 *  결정문 v143 §5 — 대문 클릭 → 접안렌즈 확대 → 하늘. 관측실 한 겹 없음.
 *
 *  ⚠ 미술관·음악관 카메라(eg_camera.js)를 쓰지 않는다. 다른 종류다.
 *     저쪽은 **스크롤**을 움직여 한 화면 안에 머문다 → 배율 1 고정 조항이 걸린다
 *     여기는 **배율**을 올려 다른 화면으로 떠난다 → 잘려나가는 좌우는 버리는 것이다
 *     (0804 「배율 1 고정」은 머무를 화면의 조항이므로 여기엔 안 걸린다 — 소로 확인)
 *
 *  ⚠ 좌표계 — 렌즈 자리는 **그림의 %**이지 화면의 %가 아니다.
 *     그래서 #fit(그림과 똑같은 크기의 상자)을 만들고 그 안에서만 % 를 쓴다.
 *     화면에 바로 % 를 쓰면 폰에서 좌우가 잘리는 만큼 렌즈가 어긋난다.
 *
 *  안내 (0804 소로): 처음 3초는 그림만. 3초에 렌즈가 한 번 숨 쉬고,
 *     5초에 한 줄이 뜨고, 8초부터는 화면 아무 데나 눌러도 열린다(뒷문).
 * ============================================================ */
:root{--gold:#c9a24a;--gold-l:#e9cf9c;--star:#9fb6e8;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#05060a;}
body{font-family:'Gowun Batang',serif;color:#e8ddc4;}

#stage{position:fixed;inset:0;overflow:hidden;background:#05060a;}
#fit{position:absolute;left:50%;top:50%;transform-origin:50% 50%;
  will-change:transform;}
#fit img{width:100%;height:100%;display:block;object-fit:cover;}

/* 접안렌즈 — 보이지 않는 문. 3초에 한 번 숨 쉰다 */
#lens{position:absolute;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle,rgba(159,182,232,0) 55%,rgba(159,182,232,0) 100%);
  transition:background .9s ease;}
#lens.breathe{animation:breathe 2.6s ease-in-out 2;}
@keyframes breathe{
  0%,100%{box-shadow:0 0 0 0 rgba(233,207,156,0);}
  50%    {box-shadow:0 0 34px 10px rgba(233,207,156,.22), 0 0 0 2px rgba(233,207,156,.16);}
}
#lens:hover{box-shadow:0 0 30px 8px rgba(233,207,156,.24), 0 0 0 2px rgba(233,207,156,.22);}

/* 흡입 — 검정이 렌즈 쪽에서 조여든다 */
#iris{position:absolute;inset:0;pointer-events:none;opacity:0;}
#veil{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;}
#sky{position:fixed;inset:0;opacity:0;pointer-events:none;}
#sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#dfe8ff;}

/* 명패 · 안내 */
/* ⚠ 0804 소로 — 처음에 아래 가운데 두었더니 명패가 접안렌즈를 깔고 앉았다.
     렌즈는 화면 아래 가운데(49%·84%)에 산다. 글자는 그 근처에 두지 않는다.
     좌상단이 다섯 유형 모두 어두운 벽이라 글자가 가장 조용히 얹힌다. */
#plate{position:fixed;top:calc(22px + env(safe-area-inset-top));
  left:calc(20px + env(safe-area-inset-left));
  text-align:left;pointer-events:none;transition:opacity .6s;max-width:60vw;}
#plate .nm{font-size:15px;letter-spacing:.08em;color:rgba(240,232,212,.92);
  text-shadow:0 2px 18px rgba(0,0,0,.95);}
#plate .lo{font-family:'Cormorant Garamond',serif;font-size:11.5px;letter-spacing:.24em;
  color:rgba(159,182,232,.8);margin-top:5px;text-shadow:0 2px 14px rgba(0,0,0,.95);}
#hint{font-size:12.5px;letter-spacing:.06em;color:rgba(233,207,156,.82);
  margin-top:14px;opacity:0;transition:opacity 1.4s;
  text-shadow:0 2px 16px rgba(0,0,0,.98);}
#hint.on{opacity:1;}

/* ── 렌즈 좌표 편집기 (?edit · 살롱지기 전용) ──
   ⚠ 게스트에게는 존재 자체가 없다. 편집 중에는 렌즈를 눌러도 하늘로 안 간다. */
#lens.edit{cursor:grab;border:1px dashed rgba(233,207,156,.9);
  background:rgba(233,207,156,.10);animation:none!important;}
#lens.edit.grab{cursor:grabbing;}
#lens.edit::after{content:'';position:absolute;left:50%;top:50%;width:9px;height:9px;
  margin:-4.5px 0 0 -4.5px;border-radius:50%;background:rgba(233,207,156,.95);}
#ed{position:fixed;right:calc(16px + env(safe-area-inset-right));
  bottom:calc(16px + env(safe-area-inset-bottom));z-index:8;display:none;
  background:rgba(10,12,20,.9);border:1px solid rgba(201,162,74,.35);
  border-radius:14px;padding:16px 18px;backdrop-filter:blur(6px);min-width:250px;}
#ed.on{display:block;}
#ed h3{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.24em;
  color:rgba(201,162,74,.85);margin-bottom:10px;}
#ed .rd{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.08em;
  color:var(--gold-l);line-height:1.9;}
#ed .rd b{color:rgba(232,221,196,.5);font-weight:400;font-size:10.5px;letter-spacing:.16em;}
#ed .tip{font-size:10.5px;color:rgba(232,221,196,.45);line-height:1.8;margin:10px 0 12px;}
#ed .row{display:flex;gap:7px;flex-wrap:wrap;}
#ed button{font:inherit;font-size:11px;letter-spacing:.05em;cursor:pointer;
  border-radius:14px;padding:7px 12px;background:none;
  border:1px solid rgba(201,162,74,.4);color:rgba(233,207,156,.9);}
#ed button:hover{border-color:var(--gold-l);color:#f0e8d4;}
#ed button.go{background:#2E4A7A;border-color:#2E4A7A;color:#f2f0ea;}
#ed select{font:inherit;font-size:11.5px;color:#f0e8d4;background:#141824;
  border:1px solid rgba(201,162,74,.35);border-radius:12px;padding:6px 10px;
  width:100%;margin-bottom:11px;cursor:pointer;}

/* ⚠ 0804 소로 — 나가기 버튼은 **지구가 그린다**(terra의 doorExit).
     핀으로 들어오면 오른쪽 위에 「× 지구로 돌아가기」가 이미 얹혀 있다.
     셸이 제 것을 또 달면 버튼이 둘이 된다. 그래서 iframe 안이면 손을 뗀다.
     주소창으로 직접 열었을 때만 같은 모양·같은 문구로 하나 내놓는다. */
#back{position:fixed;top:20px;right:24px;z-index:5;display:none;
  font-family:'Gowun Batang',serif;font-size:13px;letter-spacing:.04em;color:#f3e6c4;
  background:rgba(8,11,20,.72);border:1px solid rgba(243,230,196,.35);
  border-radius:999px;padding:8px 15px;cursor:pointer;backdrop-filter:blur(6px);
  text-shadow:0 1px 3px rgba(0,0,0,.75);
  transition:color .2s,border-color .2s,background .2s;}
#back.on{display:block;}
#back:hover{color:#fff;border-color:rgba(243,230,196,.7);}

#msg{position:fixed;inset:0;display:none;place-items:center;text-align:center;
  padding:8vw;font-size:13px;line-height:2;color:rgba(232,221,196,.6);}
#msg.on{display:grid;}
#msg a{color:var(--gold-l);}
@media (prefers-reduced-motion: reduce){ #lens.breathe{animation:none;} }
</style>
</head>
<body>

<div id="stage">
  <div id="fit">
    <img id="shot" alt="">
    <div id="lens" title="접안렌즈"></div>
  </div>
  <div id="iris"></div>
</div>
<div id="veil"></div>
<div id="sky"></div>

<button id="back" onclick="goBack()">× 지구로 돌아가기</button>

<div id="plate">
  <div class="nm" id="pName">—</div>
  <div class="lo" id="pLocal"></div>
  <div id="hint">접안렌즈를 들여다보세요</div>
</div>

<div id="ed">
  <h3>LENS · 접안렌즈 자리</h3>
  <select id="edPick"></select>
  <div class="rd">
    <b>가로</b> <span id="edX">—</span>%　<b>세로</b> <span id="edY">—</span>%<br>
    <b>반지름</b> <span id="edR">—</span>%
  </div>
  <div class="tip">원을 끌어 옮기고, 굴려서 크기를 바꿉니다.<br>
    화살표 키 0.2% · Shift+↑↓ 크기.</div>
  <div class="row">
    <button class="go" onclick="edSave()">이 곳에 저장</button>
    <button onclick="edReset()">기본값</button>
    <button onclick="edTry()">들어가 보기</button>
  </div>
</div>

<div id="msg"></div>

<script>
const SUPA_URL='https://cyhlotwdisjvoxvfkpnd.supabase.co';
const SUPA_KEY='sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
const supa=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{storageKey:'eungyo-auth'}});
const PUB=p=>`${SUPA_URL}/storage/v1/object/public/tour-assets/${p}`;
const RATIO=1672/941;                     /* 대문 규격 — 콘솔과 같은 눈금 */
const SKY='constella.html';
console.log("%c[EG] observatorium v1.1 · 0804 명패 좌상단 · 렌즈 좌표 편집기","color:#9fb6e8");

/* ⚠ 렌즈 자리는 **그림의 %**. 다섯 채를 실측해 넷이 한 곳에 모였다(가로 47~52·세로 82~86).
     그래서 기본값 한 벌을 두고, 어긋나는 곳만 meta.lens_rect로 덮는다.
     (이아는 망원경이 비스듬해 오른쪽으로 밀렸다 — 미술관 frame_rect와 같은 문법) */
const LENS_DEFAULT={ cx:49, cy:84, r:6.4 };   /* cx·cy 중심 % · r 반지름(그림 폭 대비 %) */

let SITE=null, ANIM=null, timers=[], ALL=[];
/* ?edit — 살롱지기만. 게스트는 이 갈래를 통째로 안 탄다 */
const EDIT=new URLSearchParams(location.search).has('edit');
let LENS=null;              /* 지금 화면에 선 렌즈 값(편집 중 임시) */

const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const reduced=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── 시각 — terra.html과 같은 분업. 자격은 태양시, 표시는 시민시 ── */
function localHour(p){
  const n=new Date();
  const utc=n.getUTCHours()+n.getUTCMinutes()/60+n.getUTCSeconds()/3600;
  return (utc+Number(p.lng)/15+24)%24;
}
function civilLabel(p){
  const tz=p&&p.meta&&p.meta.tz;
  if(tz){ try{
    const f=new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",hour12:false})
      .formatToParts(new Date());
    const g=t=>(f.find(x=>x.type===t)||{}).value||"00";
    const h=g("hour")==="24"?"00":g("hour");
    return h+":"+g("minute");
  }catch(e){} }
  const t=localHour(p), h=Math.floor(t), m=Math.floor((t-h)*60);
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}
function pickObservatory(rows){
  if(!rows||!rows.length) return null;
  const cand=rows.slice().sort((a,b)=>Number(b.lng)-Number(a.lng));
  const elig=cand.filter(p=>{const t=localHour(p);return t>=22||t<4;});
  if(!elig.length){
    return cand.slice().sort((a,b)=>{
      const d=p=>{const t=localHour(p);return Math.min(Math.abs(t-1),Math.abs(t-25));};
      return d(a)-d(b);
    })[0];
  }
  const day=Math.floor((Date.now()+9*3600000)/86400000);
  return elig[day%elig.length];
}

/* ── 판 짜기 — 그림과 똑같은 크기의 상자를 화면 가운데 놓는다(cover) ── */
function layout(){
  const vw=innerWidth, vh=innerHeight;
  let W,H;
  if(vw/vh > RATIO){ W=vw; H=vw/RATIO; }   /* 가로가 넉넉 — 폭을 채우고 위아래를 버린다 */
  else             { H=vh; W=vh*RATIO; }   /* 세로 화면 — 높이를 채우고 좌우를 버린다 */
  const fit=$('fit');
  fit.style.width=W+'px'; fit.style.height=H+'px';
  fit.style.marginLeft=(-W/2)+'px'; fit.style.marginTop=(-H/2)+'px';

  const L=lensRect();
  const el=$('lens');
  const d=(L.r*2)+'%';
  el.style.width=d;                          /* 그림 폭 대비 */
  el.style.height=(L.r*2*RATIO)+'%';         /* 원으로 보이게 높이는 비율만큼 */
  el.style.left=(L.cx-L.r)+'%';
  el.style.top=(L.cy-L.r*RATIO)+'%';
}
function lensRect(){
  if(LENS) return LENS;
  const m=SITE&&SITE.meta&&SITE.meta.lens_rect;
  return (m&&m.cx!=null) ? {cx:m.cx,cy:m.cy,r:m.r||LENS_DEFAULT.r} : LENS_DEFAULT;
}
/* 렌즈 중심이 화면의 어디인가 — 흡입의 중심점 */
function lensScreen(){
  const el=$('lens').getBoundingClientRect();
  return { x:el.left+el.width/2, y:el.top+el.height/2 };
}
/* ══════════════════════════════════════════════════════════
   흡입 — 렌즈 쪽으로 빨려 들어간다
   0.00~0.90s  배율 1 → 2.4 · 검정이 둘레에서 조여든다
   0.90~1.70s  배율 2.4 → 7 · 구멍이 닫히며 화면을 삼킨다
   1.70~2.30s  검은 원 안에 별 몇 점이 먼저 뜬다 → 하늘
   아무 데나 누르면 즉시 도착
   ══════════════════════════════════════════════════════════ */
function enterSky(){
  if(ANIM) return finishNow();
  timers.forEach(clearTimeout); timers=[];
  $('plate').style.opacity='0';
  $('back').style.opacity='0';
  $('lens').style.cursor='default';
  if(reduced()) return finishNow();

  const c=lensScreen();
  /* ⚠ 가운데는 이미 음수 여백이 잡고 있다. 여기서 translate(-50%,-50%)를 또 걸면
       그림이 화면 밖으로 반 칸 달아난다(0804에 한 번 밟을 뻔한 함정). scale만 건다. */
  const box=$('fit').getBoundingClientRect();
  const ox=(c.x-box.left)/box.width*100, oy=(c.y-box.top)/box.height*100;
  $('fit').style.transformOrigin=ox+'% '+oy+'%';

  const cx=(c.x/innerWidth*100), cy=(c.y/innerHeight*100);
  const iris=$('iris'); iris.style.opacity='1';

  const T=1700, t0=performance.now();
  const ease=t=>t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
  ANIM=requestAnimationFrame(function step(now){
    let t=Math.min(1,(now-t0)/T);
    const e=ease(t);
    /* 앞은 천천히, 뒤에서 급격히 — 눈이 렌즈를 붙잡을 시간을 준다 */
    $('fit').style.transform=`scale(${1 + Math.pow(e,2.1)*6})`;
    const r=Math.max(0, 145 - e*145);                   /* 구멍이 조여든다 */
    iris.style.background=
      `radial-gradient(circle at ${cx}% ${cy}%, rgba(0,0,0,0) ${r*0.62}%, rgba(0,0,0,.96) ${r}% )`;
    if(t<1){ ANIM=requestAnimationFrame(step); }
    else { ANIM=null; toStars(); }
  });
  /* 도는 중에 누르면 즉시 */
  document.addEventListener('pointerdown', finishNow, {once:true});
}
function toStars(){
  $('veil').style.transition='opacity .35s'; $('veil').style.opacity='1';
  const sky=$('sky'); sky.innerHTML='';
  for(let i=0;i<26;i++){
    const s=document.createElement('i');
    s.style.left=(Math.random()*100)+'%';
    s.style.top=(Math.random()*100)+'%';
    s.style.opacity=(0.35+Math.random()*0.65).toFixed(2);
    const g=(1+Math.random()*1.6).toFixed(1);
    s.style.width=g+'px'; s.style.height=g+'px';
    sky.appendChild(s);
  }
  sky.style.transition='opacity .5s'; sky.style.opacity='1';
  timers.push(setTimeout(finishNow, 620));
}
let gone=false;
function finishNow(){
  if(gone) return; gone=true;
  if(ANIM){ cancelAnimationFrame(ANIM); ANIM=null; }
  timers.forEach(clearTimeout);
  $('veil').style.transition='opacity .18s'; $('veil').style.opacity='1';
  const u=new URL(SKY, location.href);
  if(SITE) u.searchParams.set('from', SITE.code);
  location.href=u.toString();
}
function goBack(){ location.href='terra.html'; }
/* 지구 팝업(iframe) 안인가 — 아니면 내 버튼을 내놓는다 */
function standalone(){ try{ return window.top === window.self; }catch(e){ return false; } }

/* ── 문 열기 ── */
async function init(){
  if(standalone()) $('back').classList.add('on');
  const q=new URLSearchParams(location.search);
  const want=q.get('code');
  const { data, error }=await supa.from('terra_pins')
    .select('code,name,city,lat,lng,active,meta,target_url')
    .eq('kind','constellatio');
  if(error||!data||!data.length){
    return fail('천문대 목록을 불러오지 못했습니다.<br>잠시 뒤 다시 들러 주세요.');
  }
  ALL = data.slice().sort((a,b)=>Number(b.lng)-Number(a.lng));
  SITE = want ? data.find(p=>p.code===want) : pickObservatory(data.filter(p=>p.active));
  if(!SITE) return fail('그 천문대를 찾지 못했습니다.<br><a href="terra.html">← 지구로 돌아가기</a>');

  $('pName').textContent=SITE.name;
  $('pLocal').textContent='HEURE LOCALE  '+civilLabel(SITE);

  /* 그림 — 없으면 문을 닫지 않고 알린다 */
  const img=$('shot');
  img.onload=()=>{ layout(); openDoor(); };
  img.onerror=()=>fail(
    `<b>${esc(SITE.name)}</b>의 대문이 아직 걸리지 않았습니다.<br>`
    +`<span style="font-size:11.5px;opacity:.7">observatory/${esc(SITE.code)}_n.webp</span><br><br>`
    +`<a href="terra.html">← 지구로 돌아가기</a>`);
  img.src=PUB(`observatory/${SITE.code}_n.webp`)+'?v='+Math.floor(Date.now()/60000);
}
function openDoor(){
  if(EDIT){ setupEdit(); return; }       /* ⚠ 편집 중에는 문이 안 열린다 */
  $('lens').addEventListener('click',e=>{ e.stopPropagation(); enterSky(); });
  /* 3초 — 렌즈가 한 번 숨 쉰다 */
  timers.push(setTimeout(()=>$('lens').classList.add('breathe'), 3000));
  /* 5초 — 한 줄이 온다. 처음부터 떠 있으면 그림을 볼 시간을 뺏는다 */
  timers.push(setTimeout(()=>$('hint').classList.add('on'), 5000));
  /* 8초 — 뒷문. 렌즈를 못 찾은 손님이 갇히지 않게 */
  timers.push(setTimeout(()=>{
    $('stage').style.cursor='pointer';
    $('stage').addEventListener('click', enterSky);
  }, 8000));
  /* 현지 시각은 1분에 한 번 */
  setInterval(()=>{ if(SITE) $('pLocal').textContent='HEURE LOCALE  '+civilLabel(SITE); }, 60000);
}
/* ══════════════════════════════════════════════════════════
   렌즈 좌표 편집기 (?edit · 살롱지기 전용)
   ⚠ 여기서 정하는 값은 **그림의 %**다. 화면 %가 아니다 —
     그래야 노트북에서 잡은 자리가 폰에서도 같은 곳에 선다.
   ⚠ terra_pins 쓰기는 소로 계정에만 열려 있다(RLS). 남이 열어도 저장이 안 된다.
   ══════════════════════════════════════════════════════════ */
async function setupEdit(){
  const { data:{ user } }=await supa.auth.getUser();
  if(!user){ $('hint').classList.add('on');
    $('hint').textContent='편집은 살롱지기 로그인 뒤에 열립니다'; return; }

  LENS={...lensRect()};
  $('lens').classList.add('edit');
  $('ed').classList.add('on');
  $('plate').style.opacity='.55';

  /* 다른 곳으로 건너뛰기 — 서른다섯 채를 한 화면에서 돈다 */
  $('edPick').innerHTML=ALL.map(p=>
    `<option value="${esc(p.code)}"${p.code===SITE.code?' selected':''}>`
    +`${esc(p.name)}${p.active?'':' (봉인)'}</option>`).join('');
  $('edPick').onchange=e=>{
    const u=new URL(location.href);
    u.searchParams.set('code', e.target.value); u.searchParams.set('edit','1');
    location.href=u.toString();
  };

  const el=$('lens');
  let drag=null;
  el.addEventListener('pointerdown',e=>{
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    el.classList.add('grab');
    const box=$('fit').getBoundingClientRect();
    drag={ box, dx:(e.clientX-box.left)/box.width*100 - LENS.cx,
                dy:(e.clientY-box.top)/box.height*100 - LENS.cy };
  });
  el.addEventListener('pointermove',e=>{
    if(!drag) return;
    LENS.cx=clamp((e.clientX-drag.box.left)/drag.box.width*100 - drag.dx, 0, 100);
    LENS.cy=clamp((e.clientY-drag.box.top)/drag.box.height*100 - drag.dy, 0, 100);
    layout(); edRead();
  });
  const drop=()=>{ drag=null; el.classList.remove('grab'); };
  el.addEventListener('pointerup',drop);
  el.addEventListener('pointercancel',drop);

  /* 굴리면 커지고 작아진다 */
  addEventListener('wheel',e=>{
    if(!EDIT) return;
    e.preventDefault();
    LENS.r=clamp(+(LENS.r + (e.deltaY<0?0.25:-0.25)).toFixed(2), 1.5, 25);
    layout(); edRead();
  },{passive:false});

  /* 화살표 미세조정 — 손으로 못 잡는 0.2% */
  addEventListener('keydown',e=>{
    if(!EDIT) return;
    const k=e.key, step=0.2;
    if(k==='ArrowUp'&&e.shiftKey)      LENS.r=clamp(LENS.r+step,1.5,25);
    else if(k==='ArrowDown'&&e.shiftKey) LENS.r=clamp(LENS.r-step,1.5,25);
    else if(k==='ArrowLeft')  LENS.cx=clamp(LENS.cx-step,0,100);
    else if(k==='ArrowRight') LENS.cx=clamp(LENS.cx+step,0,100);
    else if(k==='ArrowUp')    LENS.cy=clamp(LENS.cy-step,0,100);
    else if(k==='ArrowDown')  LENS.cy=clamp(LENS.cy+step,0,100);
    else return;
    e.preventDefault();
    LENS.cx=+LENS.cx.toFixed(2); LENS.cy=+LENS.cy.toFixed(2); LENS.r=+LENS.r.toFixed(2);
    layout(); edRead();
  });
  edRead();
}
function clamp(v,a,b){ return Math.min(b,Math.max(a,v)); }
function edRead(){
  $('edX').textContent=LENS.cx.toFixed(1);
  $('edY').textContent=LENS.cy.toFixed(1);
  $('edR').textContent=LENS.r.toFixed(1);
}
async function edSave(){
  const rect={cx:+LENS.cx.toFixed(2), cy:+LENS.cy.toFixed(2), r:+LENS.r.toFixed(2)};
  const meta={...(SITE.meta||{}), lens_rect:rect};
  const { error }=await supa.from('terra_pins').update({meta})
    .eq('kind','constellatio').eq('code',SITE.code);
  if(error){ edSay('저장 실패 — '+esc(error.message), true); return; }
  /* ⚠ 「잘 됐겠지」 금지 — 쓰고 나서 되읽어 눈으로 본다 */
  const { data:back }=await supa.from('terra_pins')
    .select('meta').eq('kind','constellatio').eq('code',SITE.code).single();
  const got=back&&back.meta&&back.meta.lens_rect;
  if(!got || got.cx!==rect.cx || got.cy!==rect.cy){ edSay('되읽으니 값이 다릅니다', true); return; }
  SITE.meta=meta;
  edSay(`${esc(SITE.name)} · ${rect.cx} / ${rect.cy} / ${rect.r} 저장 ✔`);
}
function edSay(m, bad){
  let t=$('edSay');
  if(!t){ t=document.createElement('div'); t.id='edSay';
    t.style.cssText='margin-top:11px;font-size:11px;line-height:1.7;';
    $('ed').appendChild(t); }
  t.style.color = bad ? 'rgba(233,180,140,.9)' : 'rgba(180,214,170,.9)';
  t.innerHTML=m;
}
function edReset(){ LENS={...LENS_DEFAULT}; layout(); edRead(); }
function edTry(){ $('lens').classList.remove('edit'); $('ed').classList.remove('on');
  $('plate').style.opacity='1'; enterSky(); }

function fail(html){
  $('stage').style.display='none'; $('plate').style.display='none';
  $('msg').classList.add('on'); $('msg').innerHTML=html;
}
addEventListener('resize', ()=>{ if(!ANIM && !gone) layout(); });
addEventListener('orientationchange', ()=>setTimeout(()=>{ if(!ANIM && !gone) layout(); },160));
init();
</script>
