<style>
  :root{
    --night:#0a0e1a;
    --night-2:#10172b;
    --gold:#c9a227;
    --gold-soft:#9a8138;
    --cream:#ece5d3;
    --cream-dim:#9a9482;
    --line:rgba(201,162,39,.28);
    --serif:Georgia,"Nanum Myeongjo","Apple SD Gothic Neo",serif;
    --sans:"Helvetica Neue","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--night);overflow:hidden;font-family:var(--sans);color:var(--cream)}
  #cesiumContainer{position:fixed;inset:0}
  .cesium-widget-credits{font-size:9px!important;opacity:.35}
  .cesium-viewer-bottom{right:6px;bottom:4px}

  /* ── 좌상단 인물 표제 ── */
  #title{
    position:fixed;top:62px;left:30px;z-index:10;pointer-events:none;
    opacity:0;transform:translateY(-8px);transition:opacity 1.4s ease,transform 1.4s ease;
  }
  /* ── 별로 돌아가기 ── */
  #backBtn{
    position:fixed;top:22px;left:30px;z-index:12;
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--sans);font-size:12.5px;letter-spacing:.04em;
    color:var(--cream-dim);text-decoration:none;
    border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;background:rgba(8,11,22,.55);backdrop-filter:blur(4px);
    transition:color .25s ease,border-color .25s ease;
  }
  #backBtn:hover{color:var(--gold);border-color:var(--gold-soft)}

  /* ══════ 0717 나침반 통합 메뉴 (기획결정문 v1.0) ══════ */
  /* 기존 6버튼 중 5개는 나침반 패널로 이주 — HTML·핸들러는 재활용, 화면에서만 숨김 */
  #cityBtn,#starBtn,#layerSpots,#layerMaisons,#editToggle{ display:none !important; }

  #compassBtn{
    position:fixed; top:14px; left:150px; z-index:14; width:58px; height:58px;
    padding:0; border:none; background:none; cursor:pointer;
    filter:drop-shadow(0 3px 10px rgba(0,0,0,.55));
    transition:transform .45s cubic-bezier(.4,0,.2,1);
  }
  #compassBtn:hover{ transform:scale(1.07); }
  #compassBtn.open{ transform:rotate(20deg); }
  #compassImg{ width:100%; height:100%; display:block; }
  #compassFallback{ display:none; width:100%; height:100%; align-items:center; justify-content:center; font-size:30px; }
  #compassBtn.noimg #compassImg{ display:none; }
  #compassBtn.noimg #compassFallback{ display:flex; }
  /* 흰 바늘 (CSS) — 북침 크림흰색 · 남침 놋쇠 · 열리면 회전 */
  #compassNeedle{
    position:absolute; top:19%; left:calc(50% - 1.5px); width:3px; height:62%;
    transform-origin:50% 50%; transform:rotate(0deg); pointer-events:none; border-radius:2px;
    background:linear-gradient(to bottom,#fff8ec 0%,#fff8ec 44%,rgba(92,62,20,.75) 56%,rgba(92,62,20,.75) 100%);
    box-shadow:0 0 3px rgba(255,245,220,.7);
    transition:transform .65s cubic-bezier(.4,0,.2,1);
  }
  #compassNeedle::after{ content:""; position:absolute; top:50%; left:50%; width:6px; height:6px;
    transform:translate(-50%,-50%); border-radius:50%; background:#d4af27; box-shadow:0 0 2px rgba(0,0,0,.6); }
  #compassBtn.open #compassNeedle{ transform:rotate(155deg); }

  #navPanel{
    position:fixed; top:84px; left:20px; z-index:14; width:214px;
    background:rgba(10,14,26,.96); border:1px solid var(--line); border-radius:14px;
    backdrop-filter:blur(8px); padding:10px;
    opacity:0; transform:translateY(-10px); pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
  }
  #navPanel.in{ opacity:1; transform:none; pointer-events:auto; }
  .nav-group{ padding:2px 0; }
  .nav-group + .nav-group{ border-top:1px solid var(--line); margin-top:4px; padding-top:8px; }
  .nav-label{ font-family:var(--sans); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--cream-dim); padding:2px 10px 6px; }
  .nav-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    padding:9px 12px; border:none; border-radius:8px; cursor:pointer; background:none;
    color:var(--cream); font-family:var(--serif); font-size:14.5px; text-align:left;
    transition:background .2s ease, color .2s ease;
  }
  .nav-item:hover{ background:rgba(201,162,39,.12); color:var(--gold); }
  .nav-item .chev{ color:var(--cream-dim); font-size:15px; }
  .nav-item.toggle .dot{ width:8px; height:8px; border-radius:50%; border:1px solid var(--cream-dim); flex-shrink:0; }
  .nav-item.toggle.on{ color:var(--gold); }
  .nav-item.toggle.on .dot{ background:var(--gold); border-color:var(--gold); }
  /* 목록(도시·인물)을 패널 오른쪽으로 재배치 (2단 전개) */
  #cityList{ left:244px !important; top:84px !important; }
  #starList{ left:244px !important; top:84px !important; }
  @media (max-width:640px){
    #compassBtn{ left:auto; right:16px; top:12px; }
    #navPanel{ left:auto; right:16px; top:80px; }
    #cityList{ left:auto !important; right:16px !important; top:80px !important; }
    #starList{ left:auto !important; right:16px !important; top:80px !important; }
  }

  /* ── 도시 점프 버튼 + 목록 ── */
  #cityBtn{
    position:fixed;top:22px;left:178px;z-index:12;
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    font-family:var(--sans);font-size:12.5px;letter-spacing:.04em;
    color:var(--cream-dim);border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;background:rgba(8,11,22,.55);backdrop-filter:blur(4px);
    transition:color .25s ease,border-color .25s ease;
  }
  #cityBtn:hover{color:var(--gold);border-color:var(--gold-soft)}
  #cityList{
    position:fixed;top:60px;left:178px;z-index:13;
    min-width:210px;max-height:62vh;overflow-y:auto;
    background:rgba(10,14,26,.96);border:1px solid var(--line);border-radius:12px;
    backdrop-filter:blur(8px);padding:8px;
    opacity:0;transform:translateY(-8px);pointer-events:none;
    transition:opacity .3s ease,transform .3s ease;
  }
  #cityList.in{opacity:1;transform:none;pointer-events:auto}
  .city-item{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:10px 14px;border-radius:8px;cursor:pointer;
    color:var(--cream);font-family:var(--serif);font-size:15.5px;
    transition:background .2s ease;
  }
  .city-item:hover{background:rgba(201,162,39,.12)}
  .city-item.active{color:var(--gold)}
  .city-item .cnt{font-family:var(--sans);font-size:11px;color:var(--cream-dim);letter-spacing:.05em}
  @media (max-width:640px){ #cityBtn{left:auto;right:18px;top:14px} #cityList{left:auto;right:18px;top:52px} }

  /* ── 다른 인물 버튼 + 목록 (별 여행과 동일 UX, 클릭 시 그 인물 대표지로 직행) ── */
  #starBtn{
    position:fixed;top:22px;left:300px;z-index:12;
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    font-family:var(--sans);font-size:12.5px;letter-spacing:.04em;
    color:var(--cream-dim);border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;background:rgba(8,11,22,.55);backdrop-filter:blur(4px);
    transition:color .25s ease,border-color .25s ease;
  }
  #starBtn:hover{color:var(--gold);border-color:var(--gold-soft)}
  #starList{
    position:fixed;top:60px;left:300px;z-index:13;
    min-width:248px;max-height:64vh;overflow-y:auto;
    background:rgba(10,14,26,.96);border:1px solid var(--line);border-radius:12px;
    backdrop-filter:blur(8px);padding:8px;
    opacity:0;transform:translateY(-8px);pointer-events:none;
    transition:opacity .3s ease,transform .3s ease;
  }
  #starList.in{opacity:1;transform:none;pointer-events:auto}
  .star-item{
    display:flex;align-items:center;gap:11px;
    padding:8px 11px;border-radius:8px;cursor:pointer;
    color:var(--cream);font-family:var(--serif);font-size:15px;
    transition:background .2s ease;
  }
  .star-item:hover{background:rgba(201,162,39,.12)}
  .star-item img{ width:34px;height:42px;object-fit:cover;border-radius:3px;flex-shrink:0;
    border:1px solid var(--gold-soft);background:rgba(255,255,255,.04); }
  .star-item .who{ display:flex;flex-direction:column;gap:1px;line-height:1.25 }
  .star-item .who .ct{ font-family:var(--sans);font-size:10.5px;color:var(--cream-dim);letter-spacing:.05em }
  @media (max-width:640px){ #starBtn{left:auto;right:18px;top:52px} #starList{left:auto;right:18px;top:90px} }

  /* ── 레이어 토글: 인물 장소 / 콩파뇽 집 ── */
  .layer-btn{
    position:fixed;top:22px;z-index:12;
    display:inline-flex;align-items:center;gap:5px;cursor:pointer;
    font-family:var(--sans);font-size:12.5px;letter-spacing:.03em;
    color:var(--cream-dim);border:1px solid var(--line);border-radius:999px;
    padding:7px 13px;background:rgba(8,11,22,.55);backdrop-filter:blur(4px);
    transition:color .2s,border-color .2s,background .2s,opacity .2s;
  }
  .layer-btn:not(.on){ opacity:.62 }
  .layer-btn:hover{ color:var(--gold);border-color:var(--gold-soft);opacity:1 }
  .layer-btn.on{ color:#1a1407;background:var(--gold);border-color:var(--gold);opacity:1 }
  .layer-btn.on:hover{ color:#1a1407;background:#dab63f }
  #layerSpots{ left:412px }
  #layerMaisons{ left:524px }
  @media (max-width:980px){
    #layerSpots{left:auto;right:18px;top:92px}
    #layerMaisons{left:auto;right:18px;top:130px}
  }

  #title.in{opacity:1;transform:none}
  #title .eyebrow{font-size:11px;letter-spacing:.42em;color:var(--gold);text-transform:uppercase}
  #title h1{
    font-family:var(--serif);font-weight:400;margin:.28em 0 .1em;
    font-size:clamp(28px,4vw,46px);line-height:1;letter-spacing:.01em;
  }
  #title .span{font-size:13px;color:var(--cream-dim);letter-spacing:.18em}

  /* ── 우상단 안내 ── */
  #hint{
    position:fixed;top:28px;right:30px;z-index:10;max-width:230px;
    font-size:11.5px;line-height:1.6;color:var(--cream-dim);text-align:right;
    border-right:1px solid var(--line);padding:2px 12px 2px 0;
  }
  #hint b{color:var(--gold-soft);font-weight:600}

  /* ── 현재 장소 카드 ── */
  #card{
    position:fixed;left:30px;bottom:128px;z-index:10;max-width:340px;
    opacity:0;transform:translateY(10px);transition:opacity .7s ease,transform .7s ease;
  }
  #card.in{opacity:1;transform:none}
  #card .yr{font-size:12px;letter-spacing:.3em;color:var(--gold)}
  #card .pl{font-family:var(--serif);font-size:24px;margin:.18em 0 .35em}
  #card .desc{font-size:13.5px;line-height:1.65;color:var(--cream-dim)}

  /* ── 하단 여정 띠 ── */
  #journey{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    display:flex;align-items:flex-end;gap:0;
    padding:16px 24px 18px;
    background:linear-gradient(to top,rgba(8,11,22,.92),rgba(8,11,22,0));
  }
  .stop{
    flex:1;min-width:0;cursor:pointer;border:0;background:none;color:inherit;
    text-align:left;padding:8px 14px 8px 0;position:relative;
    border-top:1px solid rgba(154,148,130,.18);
    transition:border-color .4s ease;
  }
  .stop:hover{border-top-color:var(--gold-soft)}
  .stop.active{border-top-color:var(--gold)}
  .stop .dot{
    position:absolute;top:-5px;left:0;width:9px;height:9px;border-radius:50%;
    background:var(--night);border:1.5px solid var(--cream-dim);transition:all .4s ease;
  }
  .stop:hover .dot{border-color:var(--gold-soft)}
  .stop.active .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 12px 2px rgba(201,162,39,.6)}
  .stop .yr{font-size:10.5px;letter-spacing:.2em;color:var(--cream-dim);margin-top:6px}
  .stop.active .yr{color:var(--gold)}
  .stop .nm{font-family:var(--serif);font-size:15px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #loader{
    position:fixed;inset:0;z-index:50;background:var(--night);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    font-family:var(--serif);font-size:15px;letter-spacing:.32em;color:var(--gold);
    transition:opacity 1s ease;
  }
  #loader.gone{opacity:0;pointer-events:none}
  #loaderMsg{text-align:center;}
  /* 분더카머로 떠나는 비행 — EG 전용기가 중앙에 떠 있음 */
  #jetTrack{position:relative;width:100%;height:130px;overflow:hidden;pointer-events:none;}
  #jetTrack img{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:clamp(160px,42vw,300px);height:auto;opacity:.94;
    filter:drop-shadow(0 14px 24px rgba(0,0,0,.55));
    animation:jetBob 2.8s ease-in-out infinite;
    will-change:margin-top;
  }
  @keyframes jetBob{
    0%,100%{margin-top:0;}
    50%{margin-top:-13px;}
  }
  @media(prefers-reduced-motion:reduce){
    #jetTrack img{animation:none;}
  }

  /* ── 나라 이름 자막 (고공 조망 때 잠깐) ── */
  #countryLabel{
    position:fixed;top:50%;left:50%;z-index:20;
    transform:translate(-50%,-50%) scale(.96);
    font-family:var(--serif);font-size:clamp(30px,5vw,60px);font-weight:400;
    letter-spacing:.08em;color:var(--cream);
    text-shadow:0 2px 30px rgba(0,0,0,.9);
    opacity:0;pointer-events:none;
    transition:opacity 1s ease,transform 1.4s ease;
  }
  #countryLabel.in{opacity:.95;transform:translate(-50%,-50%) scale(1)}

  /* ── 우측 스토리 패널 (마커 클릭 시) ── */
  #story{
    position:fixed;top:0;right:0;bottom:0;z-index:30;
    width:min(390px,88vw);
    background:linear-gradient(to left,rgba(10,14,26,.97),rgba(10,14,26,.86));
    border-left:1px solid var(--line);
    backdrop-filter:blur(8px);
    transform:translateX(100%);
    transition:transform .55s cubic-bezier(.22,.61,.36,1);
    padding:60px 32px 44px;overflow-y:auto;
  }
  #story.in{transform:none}

  /* ── EG메종 소개 팝업 (옐로 톤 = 사람 사는 집) ── */
  #maison{
    position:fixed;top:0;right:0;bottom:0;z-index:31;
    width:min(390px,88vw);
    background:linear-gradient(to left,rgba(10,14,26,.97),rgba(10,14,26,.86));
    border-left:1px solid rgba(255,210,63,.32);
    backdrop-filter:blur(8px);
    transform:translateX(100%);
    transition:transform .55s cubic-bezier(.22,.61,.36,1);
    padding:60px 32px 36px;overflow-y:auto;
    display:flex;flex-direction:column;
  }
  #maison.in{transform:none}
  #maison .close{
    position:absolute;top:18px;right:20px;cursor:pointer;
    width:30px;height:30px;border:0;border-radius:50%;
    background:rgba(255,210,63,.12);color:var(--cream-dim);
    font-size:17px;line-height:1;transition:color .2s,background .2s;
  }
  #maison .close:hover{color:#ffd23f;background:rgba(255,210,63,.24)}
  #maison .m-door{
    font-family:var(--sans);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:#ffd23f;margin-bottom:14px;
  }
  #maison .m-avatar{
    width:72px;height:72px;border-radius:50%;object-fit:cover;
    border:2px solid rgba(255,210,63,.55);
    box-shadow:0 4px 18px rgba(0,0,0,.4);
    margin-bottom:16px;display:block;
  }
  #maison .m-nick{font-family:var(--serif);font-size:32px;line-height:1.1;margin:0 0 .35em;color:var(--cream)}
  #maison .m-intro{font-family:var(--serif);font-size:15px;line-height:1.82;color:var(--cream-dim);margin-bottom:28px;flex:1}
  #maison .m-enter{
    font-family:var(--sans);font-size:14px;font-weight:bold;letter-spacing:.03em;
    color:#1a1407;background:#ffd23f;border:none;border-radius:11px;
    padding:15px;cursor:pointer;transition:background .2s;
  }
  #maison .m-enter:hover{background:#ffdf6b}

  /* ── 대문 오버레이: 좌우로 갈라지는 두 문짝 + 그 뒤 분더카머 ── */
  #doorway{
    position:fixed;inset:0;z-index:50;background:#000;
    display:none;overflow:hidden;
  }
  #doorway.in{display:block}
  #doorway.popup .door-half{display:none}
  #doorway.popup #doorHint{display:none}
  #doorFrame{
    position:absolute;inset:0;width:100%;height:100%;border:0;z-index:1;
    background:#0a0e1a;
  }
  .door-half{
    position:absolute;inset:0;z-index:2;
    background:url('maison_door01.webp') center/cover no-repeat;
    transition:transform 2.2s cubic-bezier(.66,0,.34,1);
    will-change:transform;
  }
  .door-left{ clip-path:inset(0 50% 0 0); }     /* 왼쪽 절반 */
  .door-right{ clip-path:inset(0 0 0 50%); }    /* 오른쪽 절반 */
  #doorway.open .door-left{ transform:translateX(-100%); }
  #doorway.open .door-right{ transform:translateX(100%); }
  #doorTitle{
    position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);
    z-index:4;text-align:center;color:#f3e6c4;
    font-family:'Archivo Black','Black Han Sans','Arial Black',sans-serif;
    font-size:clamp(38px,7vw,94px);letter-spacing:.01em;line-height:1.05;
    text-shadow:0 3px 26px rgba(0,0,0,.85),0 0 60px rgba(0,0,0,.6);
    transition:opacity 1.1s ease, transform 1.1s ease;pointer-events:none;
    padding:0 20px;
  }
  #doorway.open #doorTitle{ opacity:0;transform:translate(-50%,-70%); }
  #doorHint{
    position:absolute;left:50%;bottom:13%;transform:translateX(-50%);
    z-index:4;color:rgba(243,230,196,.82);
    font-family:var(--sans);font-size:13.5px;letter-spacing:.12em;
    text-shadow:0 2px 14px rgba(0,0,0,.9);
    transition:opacity .6s ease;animation:doorPulse 2.4s ease-in-out infinite;
  }

(function(){

// ─── voyage_markers 도시 핀을 DB(RPC)에서 읽어 지구에 띄움 ───
//  좌표는 lat·lng만(height 없음) → 띄운 직후 clampSpotsToSurface로 타일 표면에 앉힘.
//  반드시 마커를 모두 추가한 뒤에 clamp를 호출해야 시차 흔들림이 없다.
async function loadCityMarkers(city){
  let rows = [];
  try{
    const res = await fetch(SUPA_URL + "/rest/v1/rpc/get_voyage_markers", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY },
      body: JSON.stringify({ p_city: city })
    });
    if (!res.ok) throw new Error("HTTP "+res.status);
    rows = await res.json();
  }catch(e){ console.warn("voyage_markers 로드 실패:", e); return; }

  const near = range(PIN_RANGE.spot);          // 인물 장소 — 1.5km부터
  rows.forEach((m)=>{
    const isCompagnon = (m.source === 'compagnon');            // 큐레이션=금빛 / 콩파뇽 발견=청록
    const spotColor = Cesium.Color.fromCssColorString(isCompagnon ? "#7fb3d5" : "#c9a227");
    const ent = viewer.entities.add({
      id:"marker-"+m.id,
      position: Cesium.Cartesian3.fromDegrees(m.lng, m.lat),  // height 생략 → 클램프 대상
      point:{ pixelSize:8, color:spotColor,
              outlineColor:Cesium.Color.fromCssColorString("#05070f"), outlineWidth:2,
              disableDepthTestDistance:Number.POSITIVE_INFINITY,
              distanceDisplayCondition:near },
      label:{ text:(m.icon ? m.icon+"  " : "") + m.title,
              font:"14px Georgia,'Nanum Myeongjo',serif",
              fillColor:Cesium.Color.fromCssColorString("#ece5d3"),
              showBackground:true,
              backgroundColor:Cesium.Color.fromCssColorString("#0a0e1a").withAlpha(.72),
              backgroundPadding:new Cesium.Cartesian2(10,7),
              pixelOffset:new Cesium.Cartesian2(0,-14),
              verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
              disableDepthTestDistance:Number.POSITIVE_INFINITY,
              distanceDisplayCondition:near }
    });
    ent._spot = m;  // 클릭 시 openStory가 꺼내 씀 (title·subtitle·body·source·figures)
  });

  // ★ 마커를 모두 띄운 직후 표면 클램프 — 비동기 로드 타이밍의 핵심.
  await clampSpotsToSurface();
}

// ─── EG메종 집 핀 (옐로 바탕·검은 글씨 = 사람이 사는 곳) ───
async function loadMaisons(city){
  let rows = [];
  try{
    const res = await fetch(SUPA_URL + "/rest/v1/rpc/get_maisons", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY },
      body: JSON.stringify({ p_city: city })
    });
    if (!res.ok) throw new Error("HTTP "+res.status);
    rows = await res.json();
  }catch(e){ console.warn("eg_maison 로드 실패:", e); return; }

  const near     = range(PIN_RANGE.maison);      // 이웃 콩파뇽 — 500m
  const nearMine = range(PIN_RANGE.maisonMine);  // 강하 대상 분더카머 — 600m
  const myUid = await getMyUid().catch(()=>null);
  const wantU = new URLSearchParams(location.search).get('user');
  rows.forEach((m)=>{
    const occupied = (m.status === 'occupied');
    // 강하 대상(내 집 또는 ?user=닉 상대)만 600m, 나머지 이웃은 500m
    const isMine = (myUid && m.occupant_id === myUid) || (wantU && m.nickname === wantU);
    const dd = isMine ? nearMine : near;
    const ent = viewer.entities.add({
      id:"maison-"+city+"-"+m.maison_no,
      position: Cesium.Cartesian3.fromDegrees(m.lng, m.lat),
      point:{ pixelSize: occupied ? 9 : 9,
              color: Cesium.Color.fromCssColorString(occupied ? "#ffd23f" : "#0a0e1a"),  // 빈집은 속이 빈(어두운) 동그라미
              outlineColor: Cesium.Color.fromCssColorString(occupied ? "#1a1407" : "#ffd23f"), // 빈집 테두리만 옐로
              outlineWidth: occupied ? 2 : 2.5,
              disableDepthTestDistance:Number.POSITIVE_INFINITY,
              distanceDisplayCondition:dd },
      label: occupied ? {
              text: m.nickname || ("메종 "+m.maison_no),
              font:"bold 13px 'Helvetica Neue',Arial,sans-serif",
              fillColor:Cesium.Color.fromCssColorString("#1a1407"),                 // 검은 글씨
              showBackground:true,
              backgroundColor:Cesium.Color.fromCssColorString("#ffd23f").withAlpha(.96), // 옐로 바탕
              backgroundPadding:new Cesium.Cartesian2(9,5),
              pixelOffset:new Cesium.Cartesian2(0,-13),
              verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
              disableDepthTestDistance:Number.POSITIVE_INFINITY,
              distanceDisplayCondition:dd
            } : {
              text:"메종 "+m.maison_no,
              font:"bold 11.5px 'Helvetica Neue',Arial,sans-serif",
              fillColor:Cesium.Color.fromCssColorString("#ffd23f"),                  // 옐로 글씨
              outlineColor:Cesium.Color.fromCssColorString("#0a0e1a"), outlineWidth:3,
              style:Cesium.LabelStyle.FILL_AND_OUTLINE,                              // 글씨에 검은 테두리 → 어디서나 또렷
              showBackground:true,
              backgroundColor:Cesium.Color.fromCssColorString("#0a0e1a").withAlpha(.82),
              backgroundPadding:new Cesium.Cartesian2(8,4),
              pixelOffset:new Cesium.Cartesian2(0,-12),
              verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
              disableDepthTestDistance:Number.POSITIVE_INFINITY,
              distanceDisplayCondition:dd
            }
    });
    ent._maison = m;  // 클릭 시 openMaison이 꺼내 씀 (nickname·door_no·intro·status)
  });
  await clampSpotsToSurface();
  applyLayerVisibility();   // 새로 띄운 마커에 현재 토글 상태 반영
}

function loadPopupImg(url){
  return new Promise((res)=>{
    const im = new Image();
    im.crossOrigin = "anonymous";                       // 캔버스 합성 위해 CORS 요청
    im.onload  = ()=> res(im);
    im.onerror = ()=> res(null);                        // 실패 시 null → 텍스트 폴백
    im.src = url;
  });
}
// 명패 캔버스 한 장을 그려 반환 (billboard image로 사용)
function makePopupPlate(bgColor, logoImg){
  const DPR = 2, W = 220, H = 92, TIP = 15, r = 14, pad = 22;
  const cv = document.createElement("canvas");
  cv.width = W*DPR; cv.height = (H+TIP)*DPR;
  const g = cv.getContext("2d");
  g.scale(DPR, DPR);
  // 본체(라운드 사각) + 아래 중앙 삼각 꼭지
  g.beginPath();
  g.moveTo(r,0); g.lineTo(W-r,0); g.arcTo(W,0,W,r,r);
  g.lineTo(W,H-r); g.arcTo(W,H,W-r,H,r);
  g.lineTo(W/2+TIP,H); g.lineTo(W/2,H+TIP); g.lineTo(W/2-TIP,H);
  g.lineTo(r,H); g.arcTo(0,H,0,H-r,r);
  g.lineTo(0,r); g.arcTo(0,0,r,0,r);
  g.closePath();
  // 은은한 그림자 → 위성 이미지 위에서 떠 보이게
  g.save(); g.shadowColor = "rgba(0,0,0,.55)"; g.shadowBlur = 8; g.shadowOffsetY = 3;
  g.fillStyle = bgColor; g.fill(); g.restore();
  // 금박 테두리
  g.lineWidth = 2; g.strokeStyle = "#c9a227"; g.stroke();
  // 흰 로고를 여백 두고 중앙 정렬(본래 비율 유지)
  if (logoImg && logoImg.width){
    const availW = W - pad*2, availH = H - pad*1.1;
    const ar = logoImg.width / logoImg.height;
    let lw = availW, lh = lw/ar;
    if (lh > availH){ lh = availH; lw = lh*ar; }
    g.drawImage(logoImg, (W-lw)/2, (H-lh)/2 - TIP*0.25, lw, lh);
  }
  return cv;
}
// ─── EG 팝업 핀을 DB(get_popups)에서 읽어 지구에 세움 ───
async function loadPopups(city){
  let rows = [];
  try{
    const res = await fetch(SUPA_URL + "/rest/v1/rpc/get_popups", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY },
      body: JSON.stringify({ p_city: city })
    });
    if (!res.ok) throw new Error("HTTP "+res.status);
    rows = await res.json();
  }catch(e){ console.warn("팝업 로드 실패:", e); return; }

  const near = range(PIN_RANGE.popup);          // 출판사 팝업 — 400m
  for (const p of rows){
    const bg = popupColor(p);   // 출판사 고유색 (pin_color 지정값 → 없으면 코드 해시)
    const ent = viewer.entities.add({
      id: "popup-"+city+"-"+p.code,
      position: Cesium.Cartesian3.fromDegrees(p.lng, p.lat),   // height 생략 → 표면 클램프 대상
      point:{ pixelSize:9, color:Cesium.Color.fromCssColorString(bg),
              outlineColor:Cesium.Color.fromCssColorString("#05070f"), outlineWidth:2,
              disableDepthTestDistance:Number.POSITIVE_INFINITY,
              distanceDisplayCondition:near },   // 다른 핀과 같은 원 + 고유색 · 호버 부풀기는 hover 핸들러가 자동 처리
      label: {
        text: p.name || p.code,
        font: "bold 14px 'Helvetica Neue',Arial,sans-serif",   // 메종(13px)보다 한 급 큼
        fillColor: Cesium.Color.WHITE,
        outlineColor: Cesium.Color.fromCssColorString("#0a0e1a"),
        outlineWidth: 3,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,             // 흰 글씨 + 검은 테두리 = 어디서나 또렷
        showBackground: true,
        backgroundColor: Cesium.Color.fromCssColorString(bg).withAlpha(.95),   // 출판사 고유 컬러풀 바탕
        backgroundPadding: new Cesium.Cartesian2(11,6),
        pixelOffset: new Cesium.Cartesian2(0,-12),
        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
        distanceDisplayCondition: near
      }
    });
    ent._popup = p;   // 클릭 시 openPopup이 꺼내 씀
  }
  await clampSpotsToSurface();
  applyLayerVisibility();
}

// ══════════════════════════════════════════════════════════════════
//  핀 등장 거리 (0718 저녁 · 소로 지정)
//  카메라가 내려올수록 종족이 차례로 나타난다. 한꺼번에 우르르 뜨지 않게.
//   1500m 인물 장소 → 600m 분더카머(강하 대상) → 500m 이웃 콩파뇽·살롱·
//   콤포스텔라·굿즈샵 → 400m 출판사 팝업·지식채널 전당
// ══════════════════════════════════════════════════════════════════
const PIN_RANGE = {
  spot      : 1500,   // 인물 장소
  maisonMine:  600,   // 강하 대상 분더카머 (가장 먼저 맞이한다)
  maison    :  500,   // 이웃 콩파뇽
  salon     :  500,   // 파트너 살롱 (핀 생기면 이 값)
  sanctuary :  500,   // 콤포스텔라·273학술원
  goods     :  500,   // EG 굿즈샵
  popup     :  400,   // 출판사 팝업
  palais    :  400    // 지식채널 전당
};
const range = (m)=> new Cesium.DistanceDisplayCondition(0, m);

// ══════════════════════════════════════════════════════════════════
//  EG 전당(Palais) 핀 — 2차 협업 파트너(지식채널) 센터
//  · 색: 청록 #16a085 고정 (지도핀 종족 범례 결정문 0718)
//  · 진입: 핀 클릭 → doorway에 palais.html 직행 (셸 gate가 곧 대문)
// ══════════════════════════════════════════════════════════════════
const PALAIS_COLOR = "#16a085";
async function loadPalais(city){
  let rows = [];
  try{
    const res = await fetch(SUPA_URL + "/rest/v1/palais_orgs?select=code,name,lat,lng,city&city=eq."
                 + encodeURIComponent(city), {
      headers:{ "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY }
    });
    if (!res.ok) throw new Error("HTTP "+res.status);
    rows = await res.json();
  }catch(e){ console.warn("전당 로드 실패:", e); return; }

  const near = range(PIN_RANGE.palais);         // 지식채널 전당 — 400m
  for (const p of rows){
    if (p.lat == null || p.lng == null) continue;
    const ent = viewer.entities.add({
      id: "palais-"+city+"-"+p.code,
      position: Cesium.Cartesian3.fromDegrees(p.lng, p.lat),
      point:{ pixelSize:9, color:Cesium.Color.fromCssColorString(PALAIS_COLOR),
              outlineColor:Cesium.Color.fromCssColorString("#05070f"), outlineWidth:2,
              disableDepthTestDistance:Number.POSITIVE_INFINITY,
              distanceDisplayCondition:near },
      label: {
        text: p.name || p.code,
        font: "bold 14px 'Helvetica Neue',Arial,sans-serif",
        fillColor: Cesium.Color.WHITE,
        outlineColor: Cesium.Color.fromCssColorString("#0a0e1a"),
        outlineWidth: 3,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        showBackground: true,
        backgroundColor: Cesium.Color.fromCssColorString(PALAIS_COLOR).withAlpha(.95),
        backgroundPadding: new Cesium.Cartesian2(11,6),
        pixelOffset: new Cesium.Cartesian2(0,-12),
        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
        distanceDisplayCondition: near
      }
    });
    ent._palais = p;
  }
  await clampSpotsToSurface();
  applyLayerVisibility();
}
// 전당 핀 클릭 → doorway에 palais.html iframe 직행

// 레이어 토글 — 인물 장소(_spot)와 콩파뇽 집(_maison)을 켜고 끔
function applyLayerVisibility(){
  viewer.entities.values.forEach(e=>{
    if (e._spot) e.show = showSpots;
    else if (e._maison) e.show = showMaisons;
  });
  const ls = document.getElementById("layerSpots");
  const lm = document.getElementById("layerMaisons");
  if (ls) ls.classList.toggle("on", showSpots);
  if (lm) lm.classList.toggle("on", showMaisons);
  const ns = document.getElementById("navSpots");
  const nm = document.getElementById("navMaisons");
  if (ns) ns.classList.toggle("on", showSpots);
  if (nm) nm.classList.toggle("on", showMaisons);
}

// 페이지를 떠나지 않고 도시 전환 — 세션 하나로 여러 도시(과금 1건).
async function jumpToCity(c){
  currentCity = c.city;
  renderCityList();
  stopOrbit();
  closeStory();
  closeMaison();
  // 이전 도시 마커 제거 (큐레이션 핀 + 메종 핀 둘 다, slice로 복제 후 제거)
  viewer.entities.values.filter(e=>e._spot || e._maison || e._popup || e._palais).slice().forEach(e=> viewer.entities.remove(e));
  // 새 도시 마커를 먼저 로드 — 1호 핀 좌표를 잡고 표면 클램프(함수 내부)까지 끝낸 뒤 비행
  await loadCityMarkers(c.city);
  await loadMaisons(c.city);
  await loadPopups(c.city);
  await loadPalais(c.city);

  // 1호 핀(가장 먼저 입주한 곳 = id 최소)을 중심점으로. 핀이 없으면 도시 중심.
  let lng = c.center_lng, lat = c.center_lat;
  const spots = viewer.entities.values.filter(e=>e._spot);
  if (spots.length){
    let first = spots[0];
    spots.forEach(e=>{ if (e._spot.id < first._spot.id) first = e; });
    const carto = Cesium.Cartographic.fromCartesian(
      first.position.getValue(Cesium.JulianDate.now()));
    lng = Cesium.Math.toDegrees(carto.longitude);
    lat = Cesium.Math.toDegrees(carto.latitude);
  }
  const r = c.range || 1000;

  // 파리 초기 진입처럼 — 1호 핀으로 비스듬히 줌인한 뒤, 그 곳을 중심으로 천천히 회전
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(lng, lat, r * 1.6),
    orientation:{ heading:Cesium.Math.toRadians(20), pitch:Cesium.Math.toRadians(-35), roll:0 },
    duration: 3.4,
    complete: async ()=>{ const H=await clampPoint(lng,lat); startOrbit(Cesium.Cartesian3.fromDegrees(lng, lat, (H!=null?H:0)), r); }
  });
}

let STARS_LIST = [];

// 페이지를 떠나지 않고 그 인물의 대표지로 직행 — 세션 하나 유지(과금 0).
// 액자(이곳에 닿은 별)에서 호출. 도시가 다르면 도시 마커만 갈아끼우고 그 장소로 비행.
async function jumpToStarPlace(starId){
  let rep;
  try{
    const res = await fetch(SUPA_URL + "/rest/v1/rpc/get_star_voyage", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY },
      body: JSON.stringify({ p_star_id: Number(starId) })
    });
    if (!res.ok) throw new Error("HTTP "+res.status);
    const rows = await res.json();
    rep = Array.isArray(rows) ? rows[0] : rows;
  }catch(e){ console.warn("대표지 로드 실패:", e); return; }
  if (!rep || rep.lat == null || rep.lng == null) return;

  stopOrbit(); closeStory(); closeMaison();

  // 대표지가 다른 도시면 그 도시 마커로 갈아끼움(세션은 그대로 유지)
  if (rep.city && rep.city !== currentCity){
    currentCity = rep.city;
    if (typeof renderCityList === 'function') renderCityList();
    if (typeof renderStarList === 'function') renderStarList();
    viewer.entities.values.filter(e=>e._spot || e._maison || e._popup || e._palais).slice().forEach(e=> viewer.entities.remove(e));
    await loadCityMarkers(rep.city);
    await loadMaisons(rep.city);
    await loadPopups(rep.city);
    await loadPalais(rep.city);
  }

  const lng = rep.lng, lat = rep.lat, r = rep.cam_range || 1000;
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(lng, lat, r * 1.6),
    orientation:{ heading:Cesium.Math.toRadians(20), pitch:Cesium.Math.toRadians(-35), roll:0 },
    duration: 3.4,
    complete: async ()=>{
      const H = await clampPoint(lng, lat);
      startOrbit(Cesium.Cartesian3.fromDegrees(lng, lat, (H!=null?H:0)), r);
      // 도착한 대표지 핀의 이야기 팝업을 열어줌(닿은 별 액자도 그 장소 기준으로 갱신)
      const target = viewer.entities.values.find(e=> e._spot && e._spot.place_id === rep.place_id);
      if (target && target._spot) openStory(target._spot);
    }
  });
}

function openStory(spot){
  const isCompagnon = (spot.source === 'compagnon');
  const badge = document.getElementById("storyBadge");
  badge.textContent = isCompagnon ? "콩파뇽의 발견" : "큐레이션";
  badge.classList.toggle("compagnon", isCompagnon);
  document.getElementById("storyTitle").textContent = spot.title || "";
  document.getElementById("storyTitleKo").textContent = spot.title_ko || "";
  document.getElementById("storySub").textContent  = spot.subtitle || "";
  // 장소 사진 갤러리 (places.photos 3장)
  const photoEl = document.getElementById("storyPhotos");
  photoEl.innerHTML = "";
  (Array.isArray(spot.photos) ? spot.photos : []).forEach(ph=>{
    if (!ph || !ph.url) return;
    const fig = document.createElement("figure");
    const img = document.createElement("img");
    img.src = ph.url; img.alt = ph.cap || ""; img.loading = "lazy";
    fig.appendChild(img);
    if (ph.cap || ph.credit){
      const fc = document.createElement("figcaption");
      fc.textContent = ph.cap || "";
      if (ph.credit){
        const cr = document.createElement("span");
        cr.className = "credit"; cr.textContent = "　" + ph.credit;
        fc.appendChild(cr);
      }
      fig.appendChild(fc);
    }
    photoEl.appendChild(fig);
  });
  const bodyEl = document.getElementById("storyBody");
  bodyEl.innerHTML = "";
  (Array.isArray(spot.body) ? spot.body : [spot.body||""]).forEach(par=>{
    const pp = document.createElement("p");
    pp.textContent = par;
    bodyEl.appendChild(pp);
  });
  // 이곳에 닿은 별 — 액자 벽 (메종엔 인물전환 엔진이 없어, 클릭 시 별 여행 페이지로 떠남)
  const starsEl = document.getElementById("storyStars");
  starsEl.innerHTML = "";
  const figs = Array.isArray(spot.figures) ? spot.figures : [];
  if (figs.length){
    const lbl = document.createElement("div");
    lbl.className = "lbl";
    lbl.textContent = "이곳에 닿은 별";
    starsEl.appendChild(lbl);
    const grid = document.createElement("div");
    grid.className = "grid";
    figs.forEach(f=>{
      // 하위호환: 문자열(옛 RPC)이면 이름만, 객체(새 RPC)면 액자
      const isObj = f && typeof f === "object";
      const name  = isObj ? (f.name || "") : String(f);
      const sid   = isObj ? f.star_id : null;
      const url   = isObj ? f.framed_url : null;
      const can   = isObj ? !!f.can_travel : false;
      const card = document.createElement("div");
      card.className = "svstar " + (can ? "go" : "wait");
      const img = document.createElement("img");
      if (url) img.src = url;
      img.alt = name; img.loading = "lazy";
      card.appendChild(img);
      const nm = document.createElement("div");
      nm.className = "nm"; nm.textContent = name;
      card.appendChild(nm);
      if (!can){
        const tag = document.createElement("div");
        tag.className = "tag"; tag.textContent = "항로 준비 중";
        card.appendChild(tag);
      }
      if (can && sid != null){
        card.title = name + " — 이 별의 본거지로";
        card.addEventListener("click", ()=> jumpToStarPlace(sid));
      }
      grid.appendChild(card);
    });
    starsEl.appendChild(grid);
  }
  document.getElementById("story").classList.add("in");
}

function closeStory(){
  document.getElementById("story").classList.remove("in");
}

// EG메종 소개 팝업 — 콩파뇽이 쓴 소개글(없으면 디폴트), 입장하기 버튼
function openMaison(m){
  closeStory();
  currentMaison = m;
  document.getElementById("mDoor").textContent = "파리 · 메종 " + m.maison_no;
  document.getElementById("mNick").textContent = m.nickname || ("메종 " + m.maison_no);
  const _mAv = document.getElementById("mAvatar");
  if (m.avatar_url) { _mAv.src = m.avatar_url; _mAv.style.display = ""; }
  else { _mAv.removeAttribute("src"); _mAv.style.display = "none"; }
  const DEFAULT_INTRO = "아직 주인이 소개글을 남기지 않았습니다. 문 너머에는 이 콩파뇽이 모아온 것들이 조용히 빛나고 있습니다.";
  document.getElementById("mIntro").textContent = m.intro || DEFAULT_INTRO;
  // 빈집이면 입장 버튼을 감춤(들어갈 사람이 아직 없음)
  document.getElementById("mEnter").style.display = m.occupant_id ? "" : "none";
  if (!m.occupant_id) document.getElementById("mIntro").textContent = "아직 아무도 살지 않는 빈집입니다.";
  document.getElementById("maison").classList.add("in");
}
function closeMaison(){
  document.getElementById("maison").classList.remove("in");
}

// 입장하기 → voyage 렌더 정지(타일 세션 유지 = 과금 0) + 대문 오버레이를 닫힌 채로 띄움
// 그 집에 배정된 대문(wunderkammer.door_no, 1~30) 이미지로 노커 교체. 미배정·범위밖 → 1번.
function applyDoorImage(m){
  let n = parseInt(m && m.door_no, 10);
  if (!(n >= 1 && n <= 30)) n = 1;
  const url = `maison_door${String(n).padStart(2,'0')}.webp`;
  document.querySelectorAll('.door-half').forEach(el => { el.style.backgroundImage = `url('${url}')`; });
}

function enterMaison(m){
  if (!m || !m.occupant_id) return;
  currentMaison = m;            // openDoor가 currentMaison을 읽으므로(팝업 건너뛴 enter=1 직행 대비)
  closeMaison();
  viewer.useDefaultRenderLoop = false;          // 지구 렌더 정지(세션은 살아 있음)
  const dw = document.getElementById("doorway");
  document.getElementById("doorTitle").textContent = m.nickname || ("메종 " + m.maison_no);
  { const _ex = document.getElementById("doorExit"); if (_ex) _ex.textContent = "× 분더카머 떠나기"; }   // 메종 문패로 원복
  applyDoorImage(m);
  refreshDoorPickBtn(m);
  document.getElementById("doorFrame").src = "about:blank";
  dw.classList.remove("open");
  dw.classList.add("in");
  doorState = 'closed';
}

// 대문 클릭 → 두 문짝이 좌우로 갈라지고 그 뒤 분더카머가 드러남
function openDoor(){
  if (doorState !== 'closed') return;
  doorState = 'opening';
  const m = currentMaison;
  // 효과음(소로가 maison_door_open.mp3로 올려둘 곳)
  const snd = document.getElementById("doorSound");
  if (snd){ try{ snd.currentTime = 0; snd.play().catch(()=>{}); }catch(e){} }
  // 문 뒤에서 분더카머를 미리 로드해 두고, 문이 갈라지며 드러나게
  if (m && m.nickname){
    document.getElementById("doorFrame").src = "wunderkammer_shell_v4_4.html?user=" + encodeURIComponent(m.nickname) + "&v=" + Date.now();
  }
  document.getElementById("doorway").classList.add("open");   // CSS transition 2.2s
  setTimeout(()=>{ doorState = 'open'; }, 2300);
}

// 나가기 → 오버레이 닫고 voyage 렌더 재개
function exitDoorway(){
  // 빠른 길(enter=1)로 들어왔으면 지도를 안 거치고 곧장 메인 메뉴로
  if (new URLSearchParams(location.search).get('enter') === '1'){
    location.href = 'index.html'; return;
  }
  const dw = document.getElementById("doorway");
  dw.classList.remove("in", "open", "popup");
  document.getElementById("doorFrame").src = "about:blank";
  doorState = 'closed';
  viewer.useDefaultRenderLoop = true;           // 지구 렌더 재개(재진입 과금 0)
}

// 마커를 실사 3D 타일(또는 지형) 표면 높이에 정확히 앉힘 — 비스듬한 각도에서도 안 어긋나게
async function clampSpotsToSurface(){
  if (!viewer.scene.clampToHeightMostDetailed) return;       // 구버전 안전장치
  const ents = viewer.entities.values.filter(e => e._spot || e._maison || e._popup || e._palais);
  if (!ents.length) return;
  const now = Cesium.JulianDate.now();
  const carts = ents.map(e => e.position.getValue(now));
  try{
    const clamped = await viewer.scene.clampToHeightMostDetailed(carts);
    clamped.forEach((c, i)=>{ if (Cesium.defined(c)) ents[i].position = c; });
  }catch(e){ console.warn("마커 표면 고정 실패(해수면 위치 유지):", e); }
}

// 분더카머에서 ?user=닉네임 으로 들어올 때 — 내 메종 핀 중심으로 강하 + 소개 팝업
// 세션에서 로그인한 콩파뇽의 uid 읽기
async function getMyUid(){
  try{
    const { data:{ session } } = await supa.auth.getSession();
    return session?.user?.id || null;
  }catch(e){ console.warn("세션 읽기 실패:", e); return null; }
}

// 집이 없는 콩파뇽에게 가장 낮은 빈집을 자동 배정
async function assignMaison(uid){
  try{
    const res = await fetch(SUPA_URL + "/rest/v1/rpc/assign_maison", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY },
      body: JSON.stringify({ p_uid: uid, p_city: 'paris' })
    });
    if (!res.ok) throw new Error("HTTP "+res.status);
    return await res.json();   // 배정된 maison_no (만석이면 null)
  }catch(e){ console.warn("집 배정 실패:", e); return null; }
}

// 파리 전경으로 (로그인 전 / 만석 등 예외 시)
function flyToParisOverview(){
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(2.3440, 48.8530, 4200),
    orientation:{ heading:0, pitch:Cesium.Math.toRadians(-50), roll:0 }, duration: 3.0
  });
}

// 특정 메종 핀으로 강하 + 소개 팝업 + 부드러운 회전
// ========== admin 좌표 편집 (지붕 클릭으로 메종 이동) ==========
async function setupAdminEdit(){
  try{
    const { data:{ session } } = await supa.auth.getSession();
    if (!session) return;
    const { data } = await supa.from('users').select('is_admin').eq('id', session.user.id).single();
    IS_ADMIN = !!(data && data.is_admin);
  }catch(e){ console.warn("admin 확인 실패:", e); }
  if (!IS_ADMIN) return;
  document.getElementById("navAdminGroup").style.display = "";   /* 0717: 관리 그룹 노출(admin만) */
  const btn = document.getElementById("navEdit");
  btn.addEventListener("click", ()=>{
    EDIT_MODE = !EDIT_MODE;
    btn.classList.toggle("on", EDIT_MODE);
    document.getElementById("editHint").classList.toggle("in", EDIT_MODE);
    if (EDIT_MODE){ stopOrbit(); }   // 편집 중엔 회전 멈춤(클릭 정확)
    else { clearSel();
      document.getElementById("editHint").innerHTML =
        "📍 <b>편집 모드</b> — 옮길 메종 핀을 누른 뒤, 그 집 <b>지붕</b>을 클릭하세요"; }
  });
}

function clearSel(){
  if (selEnt && selEnt.point && selEnt._origColor){ selEnt.point.color = selEnt._origColor; }
  selEnt = null;
}

function selectMaisonForEdit(ent){
  clearSel();
  selEnt = ent;
  if (ent.point){
    if (!ent._origColor) ent._origColor = ent.point.color;
    ent.point.color = Cesium.Color.fromCssColorString("#7fb3d5");   // 선택 = 시안
  }
  const no = ent._maison ? ent._maison.maison_no : "?";
  document.getElementById("editHint").innerHTML =
    "📍 <b>메종 " + no + " 선택됨</b> — 이제 그 집 <b>지붕</b>을 클릭하면 옮겨집니다";
}

async function moveMaison(ent, lng, lat){
  if (MOVING) return; MOVING = true;
  try{
    const no = ent._maison.maison_no;
    const { error } = await supa.rpc('admin_set_maison_coords',
      { p_maison_no: no, p_lat: lat, p_lng: lng, p_city: ent._maison.city || 'paris' });
    if (error) throw error;
    ent._maison.lat = lat; ent._maison.lng = lng;
    ent.position = Cesium.Cartesian3.fromDegrees(lng, lat);
    const H = await clampPoint(lng, lat);   // 새 자리 지붕에 즉시 고정
    if (H != null) ent.position = Cesium.Cartesian3.fromDegrees(lng, lat, H);
    document.getElementById("editHint").innerHTML =
      "✅ <b>메종 " + no + "</b> 이동·저장 완료 (지붕 H " + (H!=null?H.toFixed(1):"?") + "m) — 다른 집을 고르세요";
    console.log("[edit] 메종", no, "→", lng.toFixed(5), lat.toFixed(5), "H=", H);
  }catch(e){
    console.warn("좌표 저장 실패:", e);
    document.getElementById("editHint").innerHTML = "⚠️ 저장 실패 — 콘솔을 확인하세요";
  }finally{ MOVING = false; clearSel(); }
}

function handleEditClick(click){
  const picked = viewer.scene.pick(click.position);
  if (Cesium.defined(picked) && picked.id && picked.id._maison){
    selectMaisonForEdit(picked.id);   // 핀 클릭 → 그 메종 선택
    return;
  }
  if (!selEnt){
    document.getElementById("editHint").innerHTML = "먼저 옮길 <b>메종 핀</b>을 눌러 선택하세요";
    return;
  }
  if (!viewer.scene.pickPositionSupported){ console.warn("pickPosition 미지원"); return; }
  const cart = viewer.scene.pickPosition(click.position);
  if (!Cesium.defined(cart)) return;
  const carto = Cesium.Cartographic.fromCartesian(cart);
  moveMaison(selEnt, Cesium.Math.toDegrees(carto.longitude), Cesium.Math.toDegrees(carto.latitude));
}

// ── 한 좌표의 타일 표면 높이(H) 측정 — 궤도 중심을 핀과 같은 높이로 두기 위함(갭0) ──
async function clampPoint(lng, lat){
  if (!viewer.scene.clampToHeightMostDetailed) return null;
  try{
    const arr = await viewer.scene.clampToHeightMostDetailed([Cesium.Cartesian3.fromDegrees(lng, lat)]);
    const c = arr && arr[0];
    if (Cesium.defined(c)) return Cesium.Cartographic.fromCartesian(c).height;
  }catch(e){ console.warn("표면 높이 측정 실패:", e); }
  return null;
}

function flyToEntity(ent){
  stopOrbit();
  const carto = Cesium.Cartographic.fromCartesian(ent.position.getValue(Cesium.JulianDate.now()));
  const lng = Cesium.Math.toDegrees(carto.longitude);
  const lat = Cesium.Math.toDegrees(carto.latitude);
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(lng, lat, 700),
    orientation:{ heading:Cesium.Math.toRadians(15), pitch:Cesium.Math.toRadians(-40), roll:0 },
    duration: 3.0,
    complete: async ()=>{
      openMaison(ent._maison);
      const H = await clampPoint(lng, lat);   // 도착 후 재clamp → 정확한 지붕 높이
      console.log("[clamp] 메종 지붕 H =", H, "m ← 궤도 중심");
      startOrbit(Cesium.Cartesian3.fromDegrees(lng, lat, (H!=null?H:(carto.height||0))), 700); // 갭0
    }
  });
}

// 메인 분더카머 버튼 → 내 집으로 직행 (없으면 자동 배정)
async function goToMyHome(){
  const uid = await getMyUid();
  if (!uid){ flyToParisOverview(); return; }            // 로그인 전
  let ent = viewer.entities.values.find(e => e._maison && e._maison.occupant_id === uid);
  if (!ent){
    const no = await assignMaison(uid);                  // 집 없으면 배정
    if (no){
      viewer.entities.values.filter(e=>e._maison).slice().forEach(e=> viewer.entities.remove(e));
      await loadMaisons('paris');                        // 새 배정 반영해 다시 로드
      ent = viewer.entities.values.find(e => e._maison && e._maison.occupant_id === uid);
    }
  }
  if (ent){ showMaisons = true; applyLayerVisibility(); flyToEntity(ent); }
  else { flyToParisOverview(); }                         // 만석 등
}

// ?user / ?enter 진입 분기 — 분더카머 투어·별 명패 직통 (6/27)
async function enterByParams(wantUser, wantEnter){
  // 1) 대상 메종 entity 찾기
  let ent = null;
  if (wantUser){
    // 남의 집 — 닉네임으로 찾기 (loadMaisons가 띄운 entity에서)
    ent = viewer.entities.values.find(e => e._maison && e._maison.nickname === wantUser);
    if (!ent) console.warn("메종을 찾지 못함(닉):", wantUser);   // (향후: 다른 도시 거주 시 도시 조회·로드)
  } else {
    // 내 집 — getMyUid → 없으면 자동 배정 (goToMyHome과 같은 로직)
    const uid = await getMyUid();
    if (uid){
      ent = viewer.entities.values.find(e => e._maison && e._maison.occupant_id === uid);
      if (!ent){
        const no = await assignMaison(uid);
        if (no){
          viewer.entities.values.filter(e=>e._maison).slice().forEach(e=> viewer.entities.remove(e));
          await loadMaisons('paris');
          ent = viewer.entities.values.find(e => e._maison && e._maison.occupant_id === uid);
        }
      }
    }
  }

  // 2) 못 찾으면 기존 동선으로 폴백
  if (!ent){
    if (wantUser) flyToParisOverview();   // 남의 집을 못 찾음
    else goToMyHome();                    // 내 집을 못 찾음 → 기존 강하
    return;
  }

  showMaisons = true; applyLayerVisibility();

  // 3) enter=1 → 도시 강하 생략하고 곧장 노커 대문
  if (wantEnter){
    if (ent._maison && ent._maison.occupant_id){ enterMaison(ent._maison); }
    else { flyToEntity(ent); }            // 빈집/예외 → 강하해서 보여주기
    return;
  }

  // 4) enter 없음 → 기존처럼 도시 강하 + 팝업
  flyToEntity(ent);
}

// 노커 대문 공통 이벤트 (도시 길·빠른 길 공유)
function bindDoorEvents(){
  document.querySelectorAll(".door-half, #doorHint").forEach(el=> el.addEventListener("click", openDoor));
  const ex = document.getElementById("doorExit"); if (ex) ex.addEventListener("click", exitDoorway);
  const pk = document.getElementById("doorPick"); if (pk) pk.addEventListener("click", openDoorPicker);
  const ek = document.getElementById("elevPick"); if (ek) ek.addEventListener("click", openElevPicker);
  const dc = document.getElementById("dpClose"); if (dc) dc.addEventListener("click", closeDoorPicker);
  const db = document.getElementById("dpBackdrop"); if (db) db.addEventListener("click", closeDoorPicker);
}

// ── 내 대문 고르기 (본인 집에서만) ──────────────────────────────
// 본인 집이면 "✎ 대문 고르기" 노출, 남의 집·빈집이면 숨김.
function refreshDoorPickBtn(m){
  const dBtn = document.getElementById('doorPick');
  const eBtn = document.getElementById('elevPick');
  if (dBtn) dBtn.style.display = 'none';
  if (eBtn) eBtn.style.display = 'none';
  if (!m || !m.occupant_id) return;
  getMyUid().then(uid => {
    const mine = !!(uid && m.occupant_id === uid);   // 본인 집에서만 두 버튼 노출
    if (dBtn) dBtn.style.display = mine ? '' : 'none';
    if (eBtn) eBtn.style.display = mine ? '' : 'none';
  });
}
function openDoorPicker(){
  const grid = document.getElementById('dpGrid'); if (!grid) return;
  const t = document.getElementById('dpTitle'); if (t) t.textContent = '내 대문 고르기';
  const cur = parseInt(currentMaison && currentMaison.door_no, 10);
  const curN = (cur >= 1 && cur <= 30) ? cur : 1;
  let html = '';
  for (let i = 1; i <= 30; i++){
    const nn = String(i).padStart(2,'0');
    html += `<div class="dp-cell${i===curN?' sel':''}" data-n="${i}">`
          + `<img src="maison_door${nn}.webp" alt="대문 ${i}" loading="lazy">`
          + `<span class="dp-no">${nn}</span></div>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.dp-cell').forEach(c =>
    c.addEventListener('click', ()=> pickDoor(parseInt(c.dataset.n,10))));
  document.getElementById('doorPicker').classList.add('in');
}
function closeDoorPicker(){ const p=document.getElementById('doorPicker'); if(p) p.classList.remove('in'); }
async function pickDoor(n){
  if (!(n >= 1 && n <= 30)) return;
  if (currentMaison) currentMaison.door_no = n;          // 즉시 반영(낙관적)
  applyDoorImage(currentMaison || { door_no:n });
  closeDoorPicker();
  try {
    const uid = await getMyUid(); if (!uid) return;
    const { error } = await supa.from('wunderkammer').update({ door_no:n }).eq('user_id', uid);  // RLS: 본인만
    if (error) console.warn('대문 저장 실패', error);
  } catch(e){ console.warn('대문 저장 예외', e); }
}

// ── 내 엘리베이터 고르기 (본인 집에서만 · 대문과 같은 모달 공유) ──────────
// 현관엔 엘리베이터 실물이 없으므로 즉시 시각 반영은 그리드 금테로만,
// 저장 후 분더카머에 들어가면 셸이 elevator_no 로 문을 표시한다.
function openElevPicker(){
  const grid = document.getElementById('dpGrid'); if (!grid) return;
  const t = document.getElementById('dpTitle'); if (t) t.textContent = '내 엘리베이터 고르기';
  const cur = parseInt(currentMaison && currentMaison.elevator_no, 10);
  const curN = (cur >= 1 && cur <= 30) ? cur : 1;
  let html = '';
  for (let i = 1; i <= 30; i++){
    const nn = String(i).padStart(2,'0');
    html += `<div class="dp-cell${i===curN?' sel':''}" data-n="${i}">`
          + `<img src="elevator_${nn}.webp" alt="엘리베이터 ${i}" loading="lazy">`

async function pickElevator(n){
  if (!(n >= 1 && n <= 30)) return;
  if (currentMaison) currentMaison.elevator_no = n;     // 즉시 반영(낙관적)
  closeDoorPicker();
  try {
    const uid = await getMyUid(); if (!uid) return;
    const { error } = await supa.from('wunderkammer').update({ elevator_no:n }).eq('user_id', uid);  // RLS: 본인만
    if (error) console.warn('엘리베이터 저장 실패', error);
  } catch(e){ console.warn('엘리베이터 저장 예외', e); }
}

// 투어 패널 (우측 슬라이드 + 배경 흐림)

// 빠른 길(enter=1) — Cesium 지구 없이 메종 정보만 집어 노커를 즉시 (까만 3초 제거)
async function fastEnter(wantUser){
  bindDoorEvents();
  async function fetchMaisons(){
    try{
      const res = await fetch(SUPA_URL + "/rest/v1/rpc/get_maisons", {
        method:"POST",
        headers:{ "Content-Type":"application/json", "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY },
        body: JSON.stringify({ p_city:'paris' })
      });
      return res.ok ? await res.json() : [];
    }catch(e){ console.warn("fastEnter 메종 조회 실패:", e); return []; }
  }
  let m = null, rows = await fetchMaisons();
  if (wantUser){
    m = rows.find(r => r.nickname === wantUser) || null;          // 남의 집
  } else {
    const uid = await getMyUid();                                  // 내 집
    if (uid){
      m = rows.find(r => r.occupant_id === uid) || null;
      if (!m){ await assignMaison(uid); rows = await fetchMaisons(); m = rows.find(r => r.occupant_id === uid) || null; }
    }
  }
  document.getElementById('loader').classList.add('gone');
  if (!m || !m.occupant_id){ location.href = 'index.html'; return; }  // 못 찾으면 메뉴로
  enterMaisonLite(m);
}

// viewer 없이 노커 대문만 띄움 (빠른 길 전용)
function enterMaisonLite(m){
  currentMaison = m;
  const dw = document.getElementById("doorway");
  document.getElementById("doorTitle").textContent = m.nickname || ("메종 " + m.maison_no);
  { const _ex = document.getElementById("doorExit"); if (_ex) _ex.textContent = "× 분더카머 떠나기"; }   // 메종 문패로 원복
  applyDoorImage(m);
  refreshDoorPickBtn(m);
  document.getElementById("doorFrame").src = "about:blank";
  dw.classList.remove("open"); dw.classList.add("in");
  doorState = 'closed';
}

function flyTo(i){
  stopOrbit();
  const p = HEMINGWAY.places[i];
  setActive(i);

  // 나라 이름 자막 띄우기
  const cl = document.getElementById("countryLabel");
  cl.textContent = p.country || "";
  cl.classList.add("in");

  // 1단계 — 고공에서 그 나라를 내려다봄 (어느 나라인지 인지할 시간)
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(p.lng, p.lat, 1200000), // 약 1,200km 상공
    orientation:{ heading:0, pitch:Cesium.Math.toRadians(-90), roll:0 }, // 지도처럼 수직
    duration: 2.6,
    complete: ()=>{
      // 잠깐 머물러 나라를 눈에 담게 한 뒤
      setTimeout(()=>{
        cl.classList.remove("in"); // 자막 사라짐
        // 2단계 — 천천히 도시로 줌인
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(p.lng, p.lat, p.range),
          orientation:{ heading:Cesium.Math.toRadians(20), pitch:Cesium.Math.toRadians(-35), roll:0 },
          duration: 4.2,
          complete: ()=> startOrbit(Cesium.Cartesian3.fromDegrees(p.lng, p.lat, 0), p.range)
        });
      }, 900);
    }
  });
}

function setActive(i){
  activeIdx = i;
  document.querySelectorAll(".stop").forEach(el=>{
    el.classList.toggle("active", +el.dataset.idx === i);
  });
  const p = HEMINGWAY.places[i];
  document.getElementById("cardYr").textContent = p.yr;
  document.getElementById("cardPl").textContent = p.name;
  document.getElementById("cardDesc").textContent = p.desc;
  document.getElementById("card").classList.add("in");
}

function startOrbit(center, range){
  orbitCenter = center; orbitRange = range; orbiting = true;
  if (orbitTick) return;
  orbitTick = viewer.clock.onTick.addEventListener(()=>{
    if (!orbiting || !orbitCenter) return;
    orbitHeading += 0.0016;
    viewer.camera.lookAt(orbitCenter,
      new Cesium.HeadingPitchRange(orbitHeading, Cesium.Math.toRadians(-28), orbitRange));
  });
}

function stopOrbit(){
  orbiting = false;
  if (orbitTick){ orbitTick(); orbitTick = null; }
  viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY); // 자유 조작 복원
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   EG테라 스타디움 겹 v0.2 (0719)
   · 단일 셸 원칙: 이 블록이 maison 몸체 위에 얹히는 유일한 추가분
   · 핀 = terra_pins (DB) · 통합위젯 도크 = 뮤세움/헤리티지/콘스텔라티오 확장 예정
   ═══════════════════════════════════════════════════════════════════ */
(function(){
const TEAM_KO   = { soro:"SORO", socrates:"소크라테스", pascal:"파스칼", proust:"프루스트" };
const TEAM_PARK = { soro:"fenway", socrates:"yankee", pascal:"wrigley", proust:"oracle" };
let terraPins = {}, currentPark = null, todayMatch = null, cdTimer = null;

/* viewer가 태어날 때까지 대기 (enter=1 빠른 길이면 조용히 은퇴) */
let tries = 0;
const boot = setInterval(()=>{
  tries++;
  if (typeof viewer !== "undefined" && viewer && viewer.scene){ clearInterval(boot); terraInit(); }
  else if (tries > 100) clearInterval(boot);
}, 200);

async function terraInit(){
  await loadTerraPins();
  wireTerraClicks();
  wireMatchPanel();
  loadDock();
}

/* ── 핀: terra_pins에서 (kind=stadium) ── */
async function loadTerraPins(){
  try{
    const r = await fetch(SUPA_URL + "/rest/v1/terra_pins?active=eq.true&kind=eq.stadium&order=sort",
      { headers:{ apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY } });
    const rows = await r.json();
    for (const p of rows){
      terraPins[p.code] = p;
      const ent = viewer.entities.add({
        id:"terra-"+p.code,
        position: Cesium.Cartesian3.fromDegrees(p.lng, p.lat),
        point:{ pixelSize:9, color:Cesium.Color.fromCssColorString(p.color||"#c62828"),
          outlineColor:Cesium.Color.fromCssColorString("#05070f"), outlineWidth:2,
          disableDepthTestDistance:Number.POSITIVE_INFINITY },
        label:{ text:"⚾ " + p.name,
          font:"bold 14px 'Helvetica Neue',Arial,sans-serif",
          fillColor:Cesium.Color.WHITE,
          outlineColor:Cesium.Color.fromCssColorString("#0a0e1a"), outlineWidth:3,
          style:Cesium.LabelStyle.FILL_AND_OUTLINE,
          showBackground:true,
          backgroundColor:Cesium.Color.fromCssColorString(p.color||"#c62828").withAlpha(.95),
          backgroundPadding:new Cesium.Cartesian2(11,6),
          pixelOffset:new Cesium.Cartesian2(0,-12),
          verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
          disableDepthTestDistance:Number.POSITIVE_INFINITY }
      });
      ent._terra = p;
    }
  }catch(e){ console.warn("terra 핀 로딩 실패:", e); }
}

/* ── 구장 비행·착륙 ── */
function flyToPark(p){
  if (!p) return;
  currentPark = p;
  hideParkCard();
  try{ closeStory(); }catch(e){}
  try{ closeMaison(); }catch(e){}
  closeMatchPanel();
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(p.lng, p.lat - 0.0048, 620),
    orientation:{ heading:0, pitch:Cesium.Math.toRadians(-32), roll:0 },
    duration: 5.2,
    complete: ()=> showParkCard(p)
  });
}
function showParkCard(p){
  document.getElementById("pcName").textContent = p.name;
  document.getElementById("pcCity").textContent = (p.city||"").toUpperCase();
  document.getElementById("parkCard").classList.add("in");
}
function hideParkCard(){ document.getElementById("parkCard").classList.remove("in"); }

/* ── 경기 입장: doorway 재사용 (문 열면 지구 잠들기 — 기존 exitDoorway로 귀환) ── */
function enterGame(){
  if (!todayMatch){ openDoorwayTo("stadium_v2.html", "EG 스타디움"); return; }
  const myIsHome = todayMatch.home_team === "soro";
  const opp = myIsHome ? todayMatch.away_team : todayMatch.home_team;
  const url = "game_rookie.html?game=true&opp=" + encodeURIComponent(opp)
            + "&isHome=" + (myIsHome ? "1" : "0")
            + "&matchId=" + encodeURIComponent(todayMatch.id);
  openDoorwayTo(url, (currentPark ? currentPark.name : "EG 스타디움"));
}
function openDoorwayTo(url, title){
  try{ closeStory(); }catch(e){}
  try{ closeMaison(); }catch(e){}
  closeMatchPanel(); hideParkCard();
  viewer.useDefaultRenderLoop = false;
  document.getElementById("doorTitle").textContent = title || "";
  const dp = document.getElementById("doorPick"); if (dp) dp.style.display = "none";
  const ep = document.getElementById("elevPick"); if (ep) ep.style.display = "none";
  const ex = document.getElementById("doorExit"); if (ex) ex.textContent = "× 지구로 돌아가기";
  document.getElementById("doorFrame").src = url;
  document.getElementById("doorway").classList.add("popup","in","open");
  doorState = "open";
}

/* ── 클릭 배선 (별도 핸들러 — maison 핸들러와 공존) ── */
function wireTerraClicks(){
  const h = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
  h.setInputAction((mv)=>{
    const picked = viewer.scene.pick(mv.position);
    if (picked && picked.id && picked.id._terra){
      const p = picked.id._terra;
      if (currentPark && currentPark.code === p.code &&
          document.getElementById("parkCard").classList.contains("in")){ enterGame(); }
      else flyToPark(p);
    }
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
  document.getElementById("pcBtn").addEventListener("click", enterGame);
}

/* ── 통합위젯 도크 ──
   items 배열이 카드가 된다. 오늘은 스타디움 한 칸.
   뮤세움(오늘의 책)·헤리티지(이번 주 살롱)·콘스텔라티오(오늘의 별)·분더카머가 여기에 매달릴 예정. */
function renderDock(items){
  const dock = document.getElementById("egDock");
  dock.innerHTML = "";
  for (const it of items){
    const el = document.createElement("div");
    el.className = "dock-card";
    el.innerHTML = it.html;
    el.addEventListener("click", it.onClick);
    dock.appendChild(el);
  }
}
async function loadDock(){
  try{
    const { data:{ session } } = await supa.auth.getSession();
    const uid = session && session.user ? session.user.id : null;
    if (!uid) return;
    const today = new Date().toLocaleDateString("sv-SE", { timeZone:"Asia/Seoul" });
    const { data:m } = await supa.from("matches").select("*")
      .eq("user_id", uid).eq("match_date", today).eq("is_my_game", true).maybeSingle();
    if (!m) return;
    todayMatch = m;
    const done = m.status === "completed";
    renderDock([{
      id: "stadium",
      html: '<div class="dock-cap">⚾ TODAY MATCHUP</div>'
          + '<div class="dock-main"><span>' + (TEAM_KO[m.away_team]||m.away_team)
          + '</span><span class="vs">vs</span><span>' + (TEAM_KO[m.home_team]||m.home_team) + '</span></div>'
          + '<div class="dock-sub">' + (m.home_team==="soro" ? "HOME" : "AWAY")
          + (done ? " · 경기 종료" : "") + '</div>'
          + '<div class="dock-count" id="dockCount">' + (done ? "FINAL" : "--:--:--") + '</div>',
      onClick: openMatchPanel
    }]);
    if (!done) startCountdown(["dockCount","mpCount"]);
  }catch(e){ console.warn("도크 로딩 실패:", e); }
}

/* ── 매치 패널 (인물장소 패널의 야구판) ── */
function openMatchPanel(){
  if (!todayMatch) return;
  const m = todayMatch;
  const done = m.status === "completed";
  const myIsHome = m.home_team === "soro";
  const park = terraPins[ TEAM_PARK[m.home_team] ];
  document.getElementById("mpAway").textContent = TEAM_KO[m.away_team]||m.away_team;
  document.getElementById("mpHome").textContent = TEAM_KO[m.home_team]||m.home_team;
  document.getElementById("mpMeta").textContent =
    (myIsHome ? "HOME · " : "AWAY · ") + (park ? park.name + " · " + (park.city||"") : "")
    + " · " + m.match_date;
  const btn = document.getElementById("mpStart");
  if (done){
    document.getElementById("mpCount").textContent =
      (m.away_score!=null ? m.away_score : "-") + " − " + (m.home_score!=null ? m.home_score : "-");
    document.getElementById("mpCountCap").textContent = "FINAL";
    btn.textContent = "오늘 경기 종료"; btn.disabled = true;
  } else {
    document.getElementById("mpCountCap").textContent = "경기 시작까지 · 18:30 KST";
    btn.textContent = "⚾ 경기 시작하기"; btn.disabled = false;
  }
  document.getElementById("matchPanel").classList.add("in");
}
function closeMatchPanel(){ document.getElementById("matchPanel").classList.remove("in"); }
function wireMatchPanel(){
  document.getElementById("mpClose").addEventListener("click", closeMatchPanel);
  document.getElementById("mpStart").addEventListener("click", ()=>{
    if (!todayMatch) return;
    const park = terraPins[ TEAM_PARK[todayMatch.home_team] ];   /* 경기는 항상 홈팀 구장에서 */
    if (park) flyToPark(park);
  });
}

/* ── 카운트다운 (여러 표시 칸 동시 갱신) ── */
function startCountdown(ids){
  if (cdTimer) clearTimeout(cdTimer);
  const tick = ()=>{
    const kst = new Date(new Date().toLocaleString("en-US", { timeZone:"Asia/Seoul" }));
    const start = new Date(kst); start.setHours(18,30,0,0);
    let txt;
    const diff = start - kst;
    if (diff <= 0) txt = "PLAY BALL";
    else {
      const hh=String(Math.floor(diff/3600000)).padStart(2,"0");
      const mm=String(Math.floor(diff%3600000/60000)).padStart(2,"0");
      const ss=String(Math.floor(diff%60000/1000)).padStart(2,"0");
      txt = hh+":"+mm+":"+ss;
    }
    for (const id of ids){ const el=document.getElementById(id); if (el) el.textContent = txt; }
    if (diff > 0) cdTimer = setTimeout(tick, 1000);
  };
  tick();
}
})();
</script>
