<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EG테라 — 지구가 로비다</title>
<!--
  terra.html v0.1 (0719) — EG 단일 3D 지구 셸
  · 원칙: 3D 코드는 이 파일 한 채에만 산다 (단일 셸 원칙, 0719 결정문 §5.3)
  · 핀 = terra_pins 테이블 (코드 수정 없이 DB로 증설)
  · 지구는 복도, 콘텐츠는 방 — 문(doorway) 열면 렌더 루프 정지 (maison 검증 패턴)
  · 1호 이식: 스타디움 4구장 (펜웨이·양키스·리글리·오라클)
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.123.0/Cesium.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.123.0/Widgets/widgets.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#e8e4d8; --dim:#8a8676; --bg:#05070f; --panel:rgba(10,14,26,.92);
    --line:rgba(232,228,216,.14); --accent:#c8a96a;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:var(--bg);
    font-family:'Helvetica Neue',Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; color:var(--ink); }
  #cesiumContainer{ position:absolute; inset:0; }
  .cesium-viewer-bottom{ display:none !important; }
  .cesium-credit-logoContainer{ display:none !important; }

  /* ── 좌상단: 살롱으로(독립) + 나침반 (0717 체계) ── */
  #backBtn{ position:fixed; top:18px; left:18px; z-index:40; text-decoration:none;
    color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:9px 13px; font-size:13px; letter-spacing:.02em; }
  #backBtn:hover{ border-color:var(--accent); }
  #compassBtn{ position:fixed; top:18px; left:118px; z-index:40; width:40px; height:40px;
    border-radius:50%; background:var(--panel); border:1px solid var(--line); color:var(--ink);
    font-size:19px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:transform .3s; }
  #compassBtn:hover{ border-color:var(--accent); }
  #compassBtn.open{ transform:rotate(45deg); border-color:var(--accent); }

  /* 나침반 패널 */
  #navPanel{ position:fixed; top:68px; left:18px; z-index:39; width:230px;
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 0;
    backdrop-filter:blur(8px); opacity:0; pointer-events:none; transform:translateX(-8px);
    transition:opacity .22s, transform .22s; }
  #navPanel.in{ opacity:1; pointer-events:auto; transform:none; }
  .nav-group{ padding:4px 0; }
  .nav-group + .nav-group{ border-top:1px solid var(--line); margin-top:4px; }
  .nav-cap{ font-size:10px; letter-spacing:.22em; color:var(--dim); padding:6px 18px 4px; }
  .nav-item{ display:flex; align-items:center; gap:10px; padding:9px 18px; font-size:13.5px;
    cursor:pointer; }
  .nav-item:hover{ background:rgba(200,169,106,.08); }
  .nav-item .ic{ width:18px; text-align:center; }

  /* ── 우측: 오늘의 대진표 위젯 ── */
  #matchWidget{ position:fixed; top:18px; right:18px; z-index:38; width:250px;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px 14px; backdrop-filter:blur(8px); cursor:pointer;
    transition:border-color .2s; display:none; }
  #matchWidget:hover{ border-color:var(--accent); }
  #mwCap{ font-size:10px; letter-spacing:.24em; color:var(--dim); margin-bottom:9px; }
  #mwTeams{ display:flex; align-items:baseline; justify-content:space-between; gap:8px;
    font-size:16px; font-weight:700; letter-spacing:.01em; }
  #mwTeams .vs{ font-size:11px; color:var(--dim); font-weight:400; }
  #mwSub{ font-size:11.5px; color:var(--dim); margin-top:5px; }
  #mwCount{ margin-top:10px; font-variant-numeric:tabular-nums; font-size:21px;
    letter-spacing:.06em; color:var(--accent); }
  #mwHint{ font-size:10.5px; color:var(--dim); margin-top:7px; }

  /* ── 구장 도착 후 입장 카드 ── */
  #enterCard{ position:fixed; left:50%; bottom:44px; transform:translateX(-50%) translateY(12px);
    z-index:38; background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:16px 22px; text-align:center; backdrop-filter:blur(8px);
    opacity:0; pointer-events:none; transition:opacity .3s, transform .3s; }
  #enterCard.in{ opacity:1; pointer-events:auto; transform:translateX(-50%); }
  #ecName{ font-size:15px; font-weight:700; }
  #ecCity{ font-size:11px; color:var(--dim); margin-top:3px; letter-spacing:.08em; }
  #ecBtn{ margin-top:11px; background:var(--accent); color:#141005; border:none; border-radius:10px;
    padding:9px 20px; font-size:13.5px; font-weight:700; cursor:pointer; }
  #ecBtn:hover{ filter:brightness(1.08); }

  /* ── 문(doorway): 콘텐츠 iframe. 열리면 지구는 잠든다 ── */
  #doorway{ position:fixed; inset:0; z-index:60; background:var(--bg); display:none; }
  #doorway.open{ display:block; }
  #doorway iframe{ width:100%; height:100%; border:0; }
  #dwBack{ position:fixed; top:14px; right:14px; z-index:61; background:var(--panel);
    color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:8px 14px;
    font-size:12.5px; cursor:pointer; display:none; }
  #doorway.open ~ #dwBack, #dwBack.show{ display:block; }
  #dwBack:hover{ border-color:var(--accent); }

  /* 우하단 힌트 */
  #hint{ position:fixed; right:16px; bottom:14px; z-index:30; font-size:11px; color:var(--dim);
    background:rgba(5,7,15,.6); padding:7px 11px; border-radius:9px; max-width:250px; line-height:1.5; }

  @media (max-width:640px){
    #matchWidget{ width:calc(100% - 36px); top:auto; bottom:18px; }
    #enterCard{ bottom:120px; }
  }
</style>
</head>
<body>
<div id="cesiumContainer"></div>

<a id="backBtn" href="index.html">← 살롱으로</a>
<button id="compassBtn" title="나침반">🧭</button>
<div id="navPanel">
  <div class="nav-group">
    <div class="nav-cap">떠나기</div>
    <div class="nav-item" data-fly="fenway"><span class="ic">⚾</span>펜웨이파크 (홈)</div>
    <div class="nav-item" data-fly="yankee"><span class="ic">⚾</span>양키스타디움</div>
    <div class="nav-item" data-fly="wrigley"><span class="ic">⚾</span>리글리필드</div>
    <div class="nav-item" data-fly="oracle"><span class="ic">⚾</span>오라클파크</div>
  </div>
  <div class="nav-group">
    <div class="nav-cap">직행</div>
    <div class="nav-item" data-go="stadium_v2.html"><span class="ic">🏟</span>스타디움 라운지</div>
  </div>
</div>

<div id="matchWidget">
  <div id="mwCap">TODAY MATCHUP</div>
  <div id="mwTeams"><span id="mwAway">—</span><span class="vs">vs</span><span id="mwHome">—</span></div>
  <div id="mwSub">—</div>
  <div id="mwCount">--:--:--</div>
  <div id="mwHint">클릭하면 스타디움 라운지가 열립니다</div>
</div>

<div id="enterCard">
  <div id="ecName">펜웨이파크</div>
  <div id="ecCity">BOSTON</div>
  <button id="ecBtn">⚾ 경기 입장하기</button>
</div>

<div id="doorway"><iframe id="dwFrame" title="EG"></iframe></div>
<button id="dwBack">🌍 지구로 돌아가기</button>

<div id="hint">EG테라 v0.1 — 지구를 드래그해 보세요</div>

<script>
/* ═══════ 상수 ═══════ */
const GOOGLE_API_KEY = "AIzaSyAAKQijLeTABmyi25BX4_qGsgghOhQCa6A";
const SUPA_URL = "https://cyhlotwdisjvoxvfkpnd.supabase.co";
const SUPA_KEY = "sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR";
const supa = supabase.createClient(SUPA_URL, SUPA_KEY,
  { auth:{ storageKey:'eungyo-auth', persistSession:true, autoRefreshToken:true } });

const TEAM_KO = { soro:"SORO", socrates:"소크라테스", pascal:"파스칼", proust:"프루스트" };
const TEAM_PARK = { soro:"fenway", socrates:"yankee", pascal:"wrigley", proust:"oracle" };

let viewer, pins = {}, currentPin = null, todayMatch = null;

/* ═══════ 초기화 ═══════ */
(async function init(){
  viewer = new Cesium.Viewer("cesiumContainer", {
    baseLayer:false, baseLayerPicker:false, geocoder:false, homeButton:false,
    sceneModePicker:false, navigationHelpButton:false, animation:false,
    timeline:false, fullscreenButton:false, infoBox:false, selectionIndicator:false
  });
  const s = viewer.scene;
  s.skyAtmosphere.show = true;
  s.globe.show = true;
  s.globe.baseColor = Cesium.Color.fromCssColorString("#0a1326");
  s.globe.showGroundAtmosphere = true;
  s.backgroundColor = Cesium.Color.fromCssColorString("#05070f");
  if (s.fog) s.fog.enabled = true;

  /* 고공 세계지도 (어두운 톤) */
  try{
    const osm = viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
      url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      credit:"© OpenStreetMap contributors", maximumLevel:19 }));
    osm.brightness=.55; osm.saturation=.65; osm.gamma=.8;
  }catch(e){ console.warn("기본 지도 실패:", e); }

  /* 구글 실사 3D 타일 */
  try{
    let tileset;
    try { tileset = await Cesium.createGooglePhotorealistic3DTileset({ key: GOOGLE_API_KEY }); }
    catch(e){ tileset = await Cesium.createGooglePhotorealistic3DTileset(GOOGLE_API_KEY); }
    s.primitives.add(tileset);
  }catch(err){
    document.getElementById("hint").innerHTML = "<b>타일 오류</b><br>기본 지구로 표시합니다.";
    console.warn("3D Tiles 실패:", err);
  }

  viewer.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);
  viewer.trackedEntity = undefined;
  viewer.scene.screenSpaceCameraController.minimumZoomDistance = 60;

  await loadPins();
  wireCompass();
  wireClicks();
  loadTodayMatch();

  /* ?fly=코드 — 콘텐츠에서 귀환 시 그 구장으로 */
  const want = new URLSearchParams(location.search).get("fly");
  if (want && pins[want]) flyToPin(pins[want], true);
  else flyAmerica();
})();

/* ═══════ 핀 — terra_pins에서 로딩 (단일 셸 원칙: 핀=데이터) ═══════ */
async function loadPins(){
  try{
    const r = await fetch(SUPA_URL + "/rest/v1/terra_pins?active=eq.true&order=sort",
      { headers:{ apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY } });
    const rows = await r.json();
    for (const p of rows){
      pins[p.code] = p;
      const ent = viewer.entities.add({
        id:"terra-"+p.code,
        position: Cesium.Cartesian3.fromDegrees(p.lng, p.lat),
        point:{ pixelSize:9, color:Cesium.Color.fromCssColorString(p.color||"#8e2d2d"),
          outlineColor:Cesium.Color.fromCssColorString("#05070f"), outlineWidth:2,
          disableDepthTestDistance:Number.POSITIVE_INFINITY },
        label:{ text:p.name,
          font:"bold 14px 'Helvetica Neue',Arial,sans-serif",
          fillColor:Cesium.Color.WHITE,
          outlineColor:Cesium.Color.fromCssColorString("#0a0e1a"), outlineWidth:3,
          style:Cesium.LabelStyle.FILL_AND_OUTLINE,
          showBackground:true,
          backgroundColor:Cesium.Color.fromCssColorString(p.color||"#8e2d2d").withAlpha(.95),
          backgroundPadding:new Cesium.Cartesian2(11,6),
          pixelOffset:new Cesium.Cartesian2(0,-12),
          verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
          disableDepthTestDistance:Number.POSITIVE_INFINITY }
      });
      ent._pin = p;
    }
  }catch(e){ console.warn("핀 로딩 실패:", e); }
}

/* ═══════ 카메라 ═══════ */
function flyAmerica(){
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(-95.0, 39.0, 5200000),
    duration: 0 });
}
function flyToPin(p, instant){
  currentPin = p;
  hideEnterCard();
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(p.lng, p.lat - 0.0048, 620),
    orientation:{ heading:0, pitch:Cesium.Math.toRadians(-32), roll:0 },
    duration: instant ? 0 : 5.2,
    complete: ()=> showEnterCard(p)
  });
}
function showEnterCard(p){
  document.getElementById("ecName").textContent = p.name;
  document.getElementById("ecCity").textContent = (p.city||"").toUpperCase();
  document.getElementById("enterCard").classList.add("in");
}
function hideEnterCard(){ document.getElementById("enterCard").classList.remove("in"); }

/* ═══════ 문(doorway) — 지구는 복도, 콘텐츠는 방 ═══════ */
function openDoor(url){
  viewer.useDefaultRenderLoop = false;                 // 지구 잠들기 (과금·부하 0)
  document.getElementById("dwFrame").src = url;
  document.getElementById("doorway").classList.add("open");
  document.getElementById("dwBack").classList.add("show");
  hideEnterCard();
}
function closeDoor(){
  document.getElementById("doorway").classList.remove("open");
  document.getElementById("dwBack").classList.remove("show");
  document.getElementById("dwFrame").src = "about:blank";
  viewer.useDefaultRenderLoop = true;                  // 지구 깨우기
  if (currentPin) showEnterCard(currentPin);
}
document.getElementById("dwBack").addEventListener("click", closeDoor);

/* ═══════ 클릭 배선 ═══════ */
function wireClicks(){
  const h = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
  h.setInputAction((mv)=>{
    const picked = viewer.scene.pick(mv.position);
    if (picked && picked.id && picked.id._pin) flyToPin(picked.id._pin);
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

  document.getElementById("ecBtn").addEventListener("click", ()=>{
    const p = currentPin; if (!p) return;
    openDoor(p.target_url || "stadium_v2.html");
  });
  document.getElementById("matchWidget").addEventListener("click", ()=> openDoor("stadium_v2.html"));
}

/* ═══════ 나침반 (0717 체계 축약판) ═══════ */
function wireCompass(){
  const cBtn = document.getElementById("compassBtn");
  const panel = document.getElementById("navPanel");
  const open = (on)=>{
    const show = (on===undefined) ? !panel.classList.contains("in") : on;
    panel.classList.toggle("in", show); cBtn.classList.toggle("open", show);
  };
  cBtn.addEventListener("click",(e)=>{ e.stopPropagation(); open(); });
  document.addEventListener("keydown",(e)=>{ if(e.key==="Escape"){ open(false); } });
  document.getElementById("cesiumContainer").addEventListener("click", ()=> open(false));
  panel.querySelectorAll("[data-fly]").forEach(el=> el.addEventListener("click", ()=>{
    open(false); const p = pins[el.dataset.fly]; if (p) flyToPin(p);
  }));
  panel.querySelectorAll("[data-go]").forEach(el=> el.addEventListener("click", ()=>{
    open(false); openDoor(el.dataset.go);
  }));
}

/* ═══════ 오늘의 대진표 위젯 (개인 데이터 결선) ═══════ */
async function loadTodayMatch(){
  try{
    const { data:{ session } } = await supa.auth.getSession();
    const uid = session?.user?.id;
    if (!uid) return;                                  // 미로그인 = 위젯 숨김 유지
    const today = new Date().toLocaleDateString("sv-SE", { timeZone:"Asia/Seoul" });
    const { data:m } = await supa.from("matches").select("*")
      .eq("user_id", uid).eq("match_date", today).eq("is_my_game", true).maybeSingle();
    if (!m) return;
    todayMatch = m;
    document.getElementById("mwAway").textContent = TEAM_KO[m.away_team] || m.away_team;
    document.getElementById("mwHome").textContent = TEAM_KO[m.home_team] || m.home_team;
    const myIsHome = m.home_team === "soro";
    const park = pins[ TEAM_PARK[m.home_team] ];   // 경기는 항상 홈팀 구장에서
    document.getElementById("mwSub").textContent =
      (myIsHome ? "HOME · " : "AWAY · ") + (park ? park.city : "") +
      (m.status==="completed" ? " · 경기 종료" : "");
    document.getElementById("matchWidget").style.display = "block";
    if (m.status !== "completed") startCountdown();
    else document.getElementById("mwCount").textContent = "FINAL";
  }catch(e){ console.warn("대진표 로딩 실패:", e); }
}
function startCountdown(){
  const el = document.getElementById("mwCount");
  const tick = ()=>{
    const now = new Date();
    const kst = new Date(now.toLocaleString("en-US", { timeZone:"Asia/Seoul" }));
    const start = new Date(kst); start.setHours(18,30,0,0);
    let diff = start - kst;
    if (diff <= 0){ el.textContent = "PLAY BALL"; return; }
    const hh = String(Math.floor(diff/3600000)).padStart(2,"0");
    const mm = String(Math.floor(diff%3600000/60000)).padStart(2,"0");
    const ss = String(Math.floor(diff%60000/1000)).padStart(2,"0");
    el.textContent = `${hh}:${mm}:${ss}`;
    setTimeout(tick, 1000);
  };
  tick();
}
</script>
</body>
</html>
