<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 한 줄 — EG 관리</title>
<!--
 *  admin_daily_lines.html v1.0 — 0805
 *  EG 로딩 화면(terra.html)의 「오늘의 한 줄」 관리 콘솔.
 *
 *  ⭐ 하루 하나 고정이다. 무작위 뽑기가 아니다.
 *     오늘 뜰 문장 = 활성 목록[ KST날수 mod 활성 문장 수 ]
 *     ⚠ 문장을 넣거나 빼면 나눗셈의 분모가 바뀌어 내일 순서가 통째로 밀린다.
 *       그것이 병이 아니다 — 어차피 하루 하나이고 순서에 뜻이 없다.
 *
 *  ⚠ 로테이션 공식이 사는 곳 둘 — 여기와 terra.html 머리. 한쪽만 고치면
 *    콘솔이 「오늘 이것」이라 적고 손님은 딴것을 본다. (도장에서 겪은 그 병)
 *
 *  ⚠ 저작권 — 번역문에는 역자의 권리가 붙는다. 살아 있는 번역을 그대로
 *    옮기지 말 것. 원문이 공유 저작물이어도 번역은 아닐 수 있다.
-->
<style>
  :root{
    --night:#0a0e1a; --panel:#121a2e; --line:#243250;
    --cream:#e8e3d8; --dim:#8a93a8; --gold:#c9a227; --gold-soft:#b99a4e;
    --danger:#b4553f; --ok:#4a8c6a;
    --serif:"Nanum Myeongjo",Georgia,serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:28px 20px 80px;background:var(--night);color:var(--cream);
    font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:14px;
  }
  .wrap{max-width:860px;margin:0 auto}
  h1{font-family:var(--serif);font-size:22px;font-weight:400;letter-spacing:.06em;margin:0 0 6px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:26px;line-height:1.7}

  /* 오늘 뜰 문장 미리보기 */
  .today{
    border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:26px;
    background:linear-gradient(to bottom,#070c1a,#16233f);
  }
  .today .cap{font-size:11px;letter-spacing:.2em;color:var(--gold-soft);margin-bottom:14px}
  .today .body{font-family:var(--serif);font-size:16px;line-height:1.9;color:var(--gold)}
  .today .src{font-size:11.5px;letter-spacing:.18em;color:var(--gold-soft);opacity:.75;margin-top:10px}

  /* 새 문장 */
  .form{border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:26px;background:var(--panel)}
  .form label{display:block;font-size:11.5px;letter-spacing:.12em;color:var(--dim);margin:0 0 6px}
  .form input,.form textarea{
    width:100%;background:#0c1424;border:1px solid var(--line);border-radius:6px;
    color:var(--cream);padding:10px 12px;font-size:14px;font-family:inherit;margin-bottom:14px;
  }
  .form textarea{min-height:70px;resize:vertical;line-height:1.7}
  .form input:focus,.form textarea:focus{outline:none;border-color:var(--gold-soft)}
  .count{font-size:11px;color:var(--dim);margin:-10px 0 14px}
  .count.over{color:var(--danger)}

  button{
    background:transparent;border:1px solid var(--gold-soft);color:var(--gold);
    border-radius:6px;padding:9px 18px;font-size:13px;font-family:inherit;cursor:pointer;
    letter-spacing:.06em;transition:background .15s;
  }
  button:hover{background:rgba(201,162,39,.1)}
  button.mini{padding:4px 10px;font-size:11.5px;border-color:var(--line);color:var(--dim)}
  button.mini:hover{border-color:var(--gold-soft);color:var(--gold);background:transparent}
  button.danger{border-color:rgba(180,85,63,.5);color:var(--danger)}
  button.danger:hover{background:rgba(180,85,63,.1)}

  /* 목록 */
  .list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .row{
    display:flex;gap:14px;align-items:flex-start;
    padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);
  }
  .row:last-child{border-bottom:none}
  .row.off{opacity:.4}
  .row.duty{background:linear-gradient(to right,rgba(201,162,39,.09),var(--panel))}
  .row .no{font-size:11px;color:var(--dim);min-width:26px;padding-top:3px;font-variant-numeric:tabular-nums}
  .row .txt{flex:1;line-height:1.65}
  .row .txt .s{display:block;font-size:11.5px;color:var(--dim);margin-top:5px;letter-spacing:.1em}
  .row .acts{display:flex;gap:6px;flex-shrink:0}
  .badge{
    display:inline-block;font-size:10px;letter-spacing:.14em;color:var(--gold);
    border:1px solid var(--gold-soft);border-radius:3px;padding:1px 6px;margin-left:8px;vertical-align:2px;
  }
  .msg{margin:16px 0;font-size:12.5px;min-height:18px}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--danger)}
  .empty{padding:34px;text-align:center;color:var(--dim);background:var(--panel)}
</style>
</head>
<body>
<div class="wrap">
  <h1>오늘의 한 줄</h1>
  <div class="sub">
    EG에 들어설 때 하늘과 함께 뜨는 문장입니다. 하루에 하나만 뜨고, 그날은 몇 번을 들어와도 같은 문장입니다.<br>
    ⚠ 번역문에는 역자의 권리가 붙습니다. 원문이 공유 저작물이어도 번역은 아닐 수 있으니, 옮긴 문장을 그대로 넣지 마십시오.
  </div>

  <div class="today">
    <div class="cap">오늘 뜨는 문장</div>
    <div class="body" id="tBody">불러오는 중…</div>
    <div class="src" id="tSrc"></div>
  </div>

  <div class="form">
    <label>문장</label>
    <textarea id="fBody" placeholder="고전에서 길어 올린 한 줄"></textarea>
    <div class="count" id="fCount">0자</div>
    <label>출처 — 저자 · 작품</label>
    <input id="fSrc" placeholder="헨리 데이비드 소로 · 월든">
    <button id="btnAdd">더하기</button>
  </div>

  <div class="msg" id="msg"></div>
  <div class="list" id="list"><div class="empty">불러오는 중…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = "https://cyhlotwdisjvoxvfkpnd.supabase.co";
const SUPA_KEY = "sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR";
const supa = supabase.createClient(SUPA_URL, SUPA_KEY, {
  auth:{ storageKey:'eungyo-auth', persistSession:true, autoRefreshToken:true }
});

const $ = s => document.querySelector(s);
let ROWS = [];

/* ⚠ terra.html 머리의 todaysLine()과 **같은 눈금**이어야 한다.
   한쪽만 고치면 콘솔이 「오늘 이것」이라 적고 손님은 딴것을 본다.
   도장에서 겪은 그 병이 여기서도 그대로 난다. */
function kstDay(){ return Math.floor((Date.now() + 9*3600*1000) / 86400000); }

function dutyIndex(n){ return n ? ((kstDay() % n) + n) % n : -1; }

function say(t, ok){
  const m = $('#msg');
  m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err');
  if(ok) setTimeout(()=>{ m.textContent=''; m.className='msg'; }, 3000);
}

$('#fBody').addEventListener('input', e=>{
  const n = e.target.value.length;
  const c = $('#fCount');
  c.textContent = n + '자';
  /* 60자를 넘기면 로딩 화면에서 세 줄이 된다 — 비행기와 겹칠 여지가 있다 */
  c.className = 'count' + (n > 60 ? ' over' : '');
  if(n > 60) c.textContent = n + '자 — 60자가 넘으면 화면에서 세 줄이 됩니다';
});

async function load(){
  const { data, error } = await supa.from('daily_lines')
    .select('id,body,source,active,sort').order('sort');
  if(error){ say('불러오지 못했습니다 — ' + error.message); return; }
  ROWS = data || [];
  draw();
}

function draw(){
  const on = ROWS.filter(r=>r.active);
  const di = dutyIndex(on.length);
  const duty = di >= 0 ? on[di] : null;

  $('#tBody').textContent = duty ? duty.body : '문장이 없습니다';
  $('#tSrc').textContent  = duty && duty.source ? duty.source : '';

  const list = $('#list');
  if(!ROWS.length){ list.innerHTML = '<div class="empty">아직 문장이 없습니다</div>'; return; }

  list.innerHTML = '';
  ROWS.forEach((r, i)=>{
    const el = document.createElement('div');
    el.className = 'row' + (r.active ? '' : ' off') + (duty && r.id === duty.id ? ' duty' : '');

    const no = document.createElement('div');
    no.className = 'no'; no.textContent = (i+1);

    const txt = document.createElement('div');
    txt.className = 'txt';
    /* textContent — 남의 글이 코드가 되지 않게 */
    txt.textContent = r.body;
    if(duty && r.id === duty.id){
      const b = document.createElement('span');
      b.className = 'badge'; b.textContent = '오늘';
      txt.appendChild(b);
    }
    if(r.source){
      const s = document.createElement('span');
      s.className = 's'; s.textContent = r.source;
      txt.appendChild(s);
    }

    const acts = document.createElement('div');
    acts.className = 'acts';

    const tg = document.createElement('button');
    tg.className = 'mini'; tg.textContent = r.active ? '재우기' : '깨우기';
    tg.onclick = ()=>toggle(r);

    const del = document.createElement('button');
    del.className = 'mini danger'; del.textContent = '지우기';
    del.onclick = ()=>remove(r);

    acts.append(tg, del);
    el.append(no, txt, acts);
    list.appendChild(el);
  });
}

async function add(){
  const body = $('#fBody').value.trim();
  const src  = $('#fSrc').value.trim();
  if(!body){ say('문장을 적어 주십시오'); return; }
  const nextSort = ROWS.length ? Math.max(...ROWS.map(r=>r.sort||0)) + 1 : 1;
  const { error } = await supa.from('daily_lines')
    .insert({ body, source: src || null, sort: nextSort });
  if(error){ say('넣지 못했습니다 — ' + error.message); return; }
  $('#fBody').value = ''; $('#fSrc').value = '';
  $('#fCount').textContent = '0자'; $('#fCount').className = 'count';
  say('넣었습니다', true);
  load();
}

async function toggle(r){
  const { error } = await supa.from('daily_lines')
    .update({ active: !r.active }).eq('id', r.id);
  if(error){ say('바꾸지 못했습니다 — ' + error.message); return; }
  load();
}

async function remove(r){
  if(!confirm('지웁니다. 되돌릴 수 없습니다.\n\n' + r.body)) return;
  const { error } = await supa.from('daily_lines').delete().eq('id', r.id);
  if(error){ say('지우지 못했습니다 — ' + error.message); return; }
  say('지웠습니다', true);
  load();
}

$('#btnAdd').onclick = add;
load();
</script>
</body>
</html>
