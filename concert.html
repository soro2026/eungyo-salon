<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EG음악관</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+KR:wght@200;300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- EG 하늘 한 벌 (0729) — 시각 구간은 여기 하나에서만 정한다 -->
<script src="eg_sky.js?v=20260729b"></script>
<style>
/* ============================================================
 *  concert.html v1.0 — 0731 · 르 그랑 투르 · EG음악관
 *
 *  2뷰:  정문(gate 16:9 · 밤낮 4벌) → [암전] → 공연장(hall 9:16 · 한 벌)
 *  그림: tour-assets/concert/{code}_gate_{m|d|e|n}.webp · {code}_hall.webp
 *  홀:   terra_pins (kind='concert') — 좌표·카메라·hall_no·팝업 원고 한 행에
 *  곡:   heritage_items (category='record', status='active') — id 오름차순 고정
 *
 *  로테이션 (콘서트홀 결정문 v1.0 3호):
 *      오늘 h홀의 곡 = 곡배열[ (D + floor(h × N ÷ H)) mod N ]
 *      · 모든 홀이 하루 한 칸씩 같은 속도로 미끄러진다 → 간격 불변 → 영원히 안 겹침
 *      · 곡을 더하면 그날 전 홀이 한 번 튄다. 버그가 아니라 설계다.
 *
 *  혈통: palais.html (3뷰·페이드·SCREEN_RECT·veil 첫 화면)
 *  다른 점: 문짝이 갈라지지 않는다. 극장은 어두워지면서 시작하므로 페이드다.
 * ============================================================ */
:root{
  --gold:#c9a24a; --gold-l:#e9cf9c; --ink:#2b2318;
  --paper:#f3ece0; --bronze:#786034; --bronze-lit:#d9b168;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#000;overflow:hidden;
  font-family:'Noto Serif KR',serif;color:var(--paper);}

.view{position:fixed;inset:0;opacity:0;pointer-events:none;
  transition:opacity 1.1s ease;z-index:1;}
.view.on{opacity:1;pointer-events:auto;z-index:2;}

/* ═════════ 1. 정문 ═════════ */
#gate{background:#000 center/cover no-repeat;cursor:pointer;}
#gateVeil{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.30) 0%,rgba(0,0,0,0) 34%,rgba(0,0,0,0) 62%,rgba(0,0,0,.55) 100%);}
#gateHead{position:absolute;left:0;right:0;top:clamp(26px,7vh,74px);text-align:center;padding:0 6vw;}
.g-eyebrow{font-family:'Cormorant Garamond',serif;
  font-size:clamp(9px,1.7vmin,13px);letter-spacing:.5em;text-indent:.5em;
  color:rgba(255,255,255,.72);text-shadow:0 1px 14px rgba(0,0,0,.7);}
.g-title{font-weight:300;font-size:clamp(21px,4.4vmin,40px);line-height:1.35;margin-top:.5em;
  color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.75);}
.g-sub{font-size:clamp(11px,1.9vmin,15px);font-weight:200;margin-top:.7em;
  color:rgba(255,255,255,.8);text-shadow:0 1px 14px rgba(0,0,0,.7);}
#gateFoot{position:absolute;left:0;right:0;bottom:clamp(24px,6vh,60px);text-align:center;}
.g-knock{display:inline-flex;align-items:center;gap:.7em;
  font-size:clamp(11px,1.9vmin,14px);letter-spacing:.12em;
  color:rgba(255,255,255,.88);text-shadow:0 1px 12px rgba(0,0,0,.8);
  animation:breathe 3.4s ease-in-out infinite;}
.g-knock i{width:clamp(24px,4vmin,32px);height:1px;background:rgba(255,255,255,.5);font-style:normal;}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}

/* ═════════ 2. 공연장 ═════════ */
/* 세로 화면은 꽉 채우고, 가로 화면은 폭을 맞춰 위아래로 흐르게 둔다.
   홀은 높은 방이다. 한 화면에 다 담기면 깊이가 죽는다. (palais layoutStage 계보) */
#hall{background:#000;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;}
#hall::-webkit-scrollbar{display:none;}
#hallFit{position:relative;margin:0 auto;}
#hallImg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;}

/* 스크린 — 실측값(0731): 그림 안 백색 무지 판 */
#screen{position:absolute;left:18.70%;top:41.51%;width:63.02%;height:20.16%;
  cursor:pointer;overflow:hidden;background:#0b0b0b;}
#screen .veil{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.75em;text-align:center;
  background:linear-gradient(180deg,rgba(250,247,240,.97),rgba(238,231,218,.97));
  transition:background .5s ease;}
#screen:hover .veil{background:linear-gradient(180deg,rgba(255,253,248,1),rgba(244,238,227,1));}
.s-eyebrow{font-family:'Cormorant Garamond',serif;
  font-size:clamp(7px,1.6vmin,12px);letter-spacing:.5em;text-indent:.5em;color:rgba(120,96,52,.85);}
.s-title{font-weight:300;font-size:clamp(10px,2.3vmin,18px);line-height:1.5;
  color:#42392c;max-width:88%;}
.s-artist{font-weight:200;font-size:clamp(8px,1.7vmin,13px);color:rgba(66,57,44,.7);}
.s-ring{width:clamp(28px,6vmin,46px);aspect-ratio:1;border-radius:50%;
  border:1px solid rgba(120,96,52,.6);display:grid;place-items:center;
  transition:transform .4s ease,border-color .4s ease;margin-top:.15em;}
.s-ring::after{content:'';width:0;height:0;margin-left:3px;
  border-left:clamp(8px,1.6vmin,12px) solid rgba(120,96,52,.85);
  border-top:clamp(5px,1vmin,7px) solid transparent;
  border-bottom:clamp(5px,1vmin,7px) solid transparent;}
#screen:hover .s-ring{transform:scale(1.08);border-color:rgba(120,96,52,.95);}
#playerBox{position:absolute;inset:0;display:none;background:#000;}
#playerBox.on{display:block;}

/* 홀 이름표 — 위쪽 어둠에 조용히 */
#hallHead{position:absolute;left:0;right:0;top:clamp(14px,3.2vh,34px);text-align:center;
  pointer-events:none;padding:0 6vw;}
.h-name{font-family:'Cormorant Garamond',serif;font-size:clamp(9px,1.7vmin,13px);
  letter-spacing:.42em;text-indent:.42em;color:rgba(233,207,156,.62);}

/* ═════════ 곡 소개 — 라이너 4겹 ═════════ */
/* 오늘의 곡 바 — 홀에 들어서면 무엇이 흐르는지 먼저 읽힌다.
   누르면 라이너가 열린다. 버튼이되 문패이기도 하다. */
#linerBtn{position:fixed;left:clamp(14px,3vw,30px);
  bottom:clamp(16px,3.6vh,34px);z-index:12;
  display:flex;align-items:center;gap:clamp(10px,1.6vw,18px);
  max-width:min(76vw,620px);text-align:left;
  font-family:inherit;color:rgba(233,207,156,.86);
  background:rgba(20,16,11,.62);
  border:1px solid rgba(201,162,74,.35);border-radius:30px;
  padding:.62em 1.35em .62em 1.2em;cursor:pointer;backdrop-filter:blur(8px);
  transition:border-color .3s,background .3s;}
#linerBtn:hover{border-color:var(--gold-l);background:rgba(28,22,14,.78);}
#linerBtn .bar-note{font-size:clamp(13px,2vmin,16px);color:rgba(201,162,74,.75);flex:none;}
#linerBtn .bar-txt{min-width:0;}
#linerBtn .bar-title{display:block;font-size:clamp(11px,1.75vmin,13.5px);
  line-height:1.45;color:#f0e6d2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#linerBtn .bar-sub{display:block;font-size:clamp(9.5px,1.5vmin,11.5px);
  line-height:1.5;color:rgba(232,221,196,.55);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#linerBtn .bar-go{flex:none;font-family:'Cormorant Garamond',serif;
  font-size:clamp(8.5px,1.4vmin,10.5px);letter-spacing:.22em;
  color:rgba(201,162,74,.7);padding-left:clamp(8px,1.4vw,14px);
  border-left:1px solid rgba(201,162,74,.22);}
@media (max-width:620px){
  #linerBtn{max-width:calc(100vw - 28px);}
  #linerBtn .bar-go{display:none;}
}
/* 우측 서랍 — 연주는 멈추지 않는다. 들으면서 읽는 곳이다.
   뒤 홀은 흐려지되 스크린만은 또렷이 남긴다(무대가 죽으면 읽을 이유도 없다). */
#liner{position:fixed;top:0;right:0;bottom:0;width:min(92vw,430px);z-index:20;
  display:none;background:rgba(9,7,5,.94);backdrop-filter:blur(14px);
  border-left:1px solid rgba(201,162,74,.22);
  box-shadow:-18px 0 60px rgba(0,0,0,.6);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:clamp(24px,5vh,52px) clamp(20px,4vw,32px) clamp(40px,8vh,80px);
  transform:translateX(102%);transition:transform .55s cubic-bezier(.22,.9,.3,1);}
#liner.on{display:block;}
#liner.slide{transform:translateX(0);}
#linerClose2{position:absolute;top:14px;right:16px;width:32px;height:32px;
  font:inherit;font-size:17px;line-height:1;color:rgba(243,236,224,.55);
  background:none;border:none;cursor:pointer;}
#linerClose2:hover{color:#f4ead6;}
.liner-in{width:100%;margin:0;}
/* 홀 배경만 아웃포커싱 — 스크린(#screen)은 blur에서 뺀다 */
#hall.reading #hallImg{filter:blur(7px) brightness(.5);transition:filter .55s ease;}
#hall.reading #hallHead{opacity:.25;transition:opacity .55s ease;}
#hallImg{transition:filter .55s ease;}
.l-eyebrow{font-family:'Cormorant Garamond',serif;font-size:11px;
  letter-spacing:.34em;color:rgba(201,162,74,.8);text-align:center;}
.l-title{font-weight:300;font-size:clamp(17px,3.2vmin,25px);line-height:1.45;
  text-align:center;margin-top:.7em;color:#f4ead6;}
.l-artist{text-align:center;font-weight:200;font-size:13px;
  color:rgba(243,236,224,.6);margin-top:.5em;}
.l-cover{display:block;width:min(60%,240px);margin:clamp(20px,4vh,34px) auto;
  border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6);}
.l-sec{margin-top:clamp(18px,3.4vh,30px);}
.l-sec h4{font-family:'Cormorant Garamond',serif;font-size:10.5px;
  letter-spacing:.34em;color:rgba(201,162,74,.72);margin-bottom:.75em;}
.l-sec p{font-weight:200;font-size:clamp(13px,2.1vmin,15px);line-height:2.05;
  color:rgba(243,236,224,.87);}
.l-sec em{font-style:italic;color:rgba(233,207,156,.9);}
.l-sec strong{font-weight:400;color:#f4ead6;}
#linerClose{display:block;margin:clamp(26px,5vh,44px) auto 0;
  font:inherit;font-size:12px;letter-spacing:.16em;color:rgba(243,236,224,.6);
  background:none;border:1px solid rgba(201,162,74,.32);border-radius:20px;
  padding:.6em 1.7em;cursor:pointer;}
#linerClose:hover{color:#f4ead6;border-color:var(--gold-l);}

/* ═════════ 스크린 좌표 편집기 — 살롱지기만 ═════════
   그림마다 흰 판의 자리가 미세하게 다르다. 눈으로 밀어 맞추고 저장한다. */
#screen.editing{outline:2px dashed rgba(233,207,156,.9);outline-offset:-1px;}
#edit{position:fixed;left:clamp(12px,3vw,26px);top:clamp(12px,3vh,26px);z-index:25;
  display:none;background:rgba(16,12,8,.92);backdrop-filter:blur(8px);
  border:1px solid rgba(201,162,74,.35);border-radius:12px;
  padding:14px 16px;font-size:11.5px;color:rgba(232,221,196,.85);
  min-width:210px;}
#edit.on{display:block;}
#edit h5{font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.28em;
  color:rgba(201,162,74,.85);margin-bottom:10px;}
.ed-row{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
.ed-row label{width:14px;color:rgba(201,162,74,.75);font-family:'Cormorant Garamond',serif;}
.ed-row input{flex:1;font:inherit;font-size:11.5px;width:60px;
  color:#f0e8d4;background:rgba(0,0,0,.32);
  border:1px solid rgba(201,162,74,.25);border-radius:6px;padding:5px 8px;}
.ed-row .nudge{display:flex;gap:3px;}
.ed-row .nudge button{font:inherit;font-size:11px;width:22px;height:24px;
  color:rgba(233,207,156,.85);background:none;
  border:1px solid rgba(201,162,74,.22);border-radius:5px;cursor:pointer;}
.ed-row .nudge button:hover{border-color:rgba(233,207,156,.7);}
#edit .acts{display:flex;gap:7px;margin-top:11px;}
#edit .acts button{flex:1;font:inherit;font-size:11px;letter-spacing:.05em;
  padding:7px 0;border-radius:14px;cursor:pointer;
  color:#241a10;background:var(--gold);border:none;}
#edit .acts button.ghost{background:none;color:rgba(233,207,156,.85);
  border:1px solid rgba(201,162,74,.35);}
#edit .tip{margin-top:9px;font-size:10px;line-height:1.7;color:rgba(232,221,196,.4);}
#editOpen{position:fixed;right:clamp(12px,3vw,26px);bottom:clamp(16px,3.6vh,34px);
  z-index:12;display:none;font:inherit;font-size:11px;letter-spacing:.1em;
  color:rgba(233,207,156,.7);background:rgba(20,16,11,.5);
  border:1px solid rgba(201,162,74,.3);border-radius:20px;
  padding:.55em 1.1em;cursor:pointer;backdrop-filter:blur(6px);}
#editOpen.on{display:block;}
#editOpen:hover{color:#f4ead6;border-color:var(--gold-l);}

/* ═════════ 암전막 · 로더 ═════════ */
#fade{position:fixed;inset:0;background:#000;z-index:15;
  opacity:0;pointer-events:none;transition:opacity 1s ease;}
#fade.on{opacity:1;pointer-events:auto;}
#boot{position:fixed;inset:0;z-index:30;background:#000;display:grid;place-items:center;
  transition:opacity .7s ease;}
#boot.gone{opacity:0;pointer-events:none;}
.boot-w{font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.44em;
  color:rgba(201,162,74,.55);animation:breathe 2.6s ease-in-out infinite;}
#err{position:fixed;inset:0;z-index:31;display:none;place-items:center;
  background:#000;text-align:center;padding:8vw;}
#err.on{display:grid;}
#err p{font-weight:200;font-size:14px;line-height:2.1;color:rgba(243,236,224,.72);}
</style>
</head>
<body>

<!-- 1. 정문 -->
<div id="gate" class="view" role="button" tabindex="0" aria-label="콘서트홀에 들어가기">
  <div id="gateVeil"></div>
  <div id="gateHead">
    <div class="g-eyebrow">LE GRAND TOUR</div>
    <div class="g-title" id="gTitle"></div>
    <div class="g-sub" id="gSub"></div>
  </div>
  <div id="gateFoot">
    <span class="g-knock"><i></i> 화면을 누르면 안으로 <i></i></span>
  </div>
</div>

<!-- 2. 공연장 -->
<div id="hall" class="view">
  <div id="hallFit">
    <img id="hallImg" alt="">
    <div id="screen" role="button" tabindex="0" aria-label="오늘의 연주 재생">
      <div class="veil" id="screenVeil">
        <div class="s-eyebrow">HODIE · 오늘의 연주</div>
        <div class="s-title" id="sTitle"></div>
        <div class="s-artist" id="sArtist"></div>
        <div class="s-ring"></div>
      </div>
      <div id="playerBox"></div>
    </div>
  </div>
  <div id="hallHead"><span class="h-name" id="hName"></span></div>
  <button id="linerBtn">
    <span class="bar-note">♪</span>
    <span class="bar-txt">
      <span class="bar-title" id="barTitle"></span>
      <span class="bar-sub" id="barSub"></span>
    </span>
    <span class="bar-go">곡 소개</span>
  </button>
</div>

<!-- 곡 소개 -->
<div id="liner">
  <button id="linerClose2" aria-label="닫기">×</button>
  <div class="liner-in">
    <div class="l-eyebrow">LINER NOTE</div>
    <div class="l-title" id="lTitle"></div>
    <div class="l-artist" id="lArtist"></div>
    <img class="l-cover" id="lCover" alt="" style="display:none">
    <div id="lBody"></div>
    <button id="linerClose">닫기</button>
  </div>
</div>

<!-- 스크린 좌표 편집기 (살롱지기 전용) -->
<button id="editOpen">⚙ 스크린 맞추기</button>
<div id="edit">
  <h5>SCREEN RECT</h5>
  <div class="ed-row"><label>L</label><input id="edL" type="number" step="0.05">
    <span class="nudge"><button onclick="nudge('L',-0.2)">−</button><button onclick="nudge('L',0.2)">+</button></span></div>
  <div class="ed-row"><label>T</label><input id="edT" type="number" step="0.05">
    <span class="nudge"><button onclick="nudge('T',-0.2)">−</button><button onclick="nudge('T',0.2)">+</button></span></div>
  <div class="ed-row"><label>W</label><input id="edW" type="number" step="0.05">
    <span class="nudge"><button onclick="nudge('W',-0.2)">−</button><button onclick="nudge('W',0.2)">+</button></span></div>
  <div class="ed-row"><label>H</label><input id="edH" type="number" step="0.05">
    <span class="nudge"><button onclick="nudge('H',-0.2)">−</button><button onclick="nudge('H',0.2)">+</button></span></div>
  <div class="acts">
    <button onclick="saveRect()">저장</button>
    <button class="ghost" onclick="closeEdit()">닫기</button>
  </div>
  <div class="tip">방향키로도 밀 수 있습니다 (Shift = 크기).<br>흰 테두리가 안 보일 때까지 조이세요.</div>
</div>

<div id="fade"></div>
<div id="boot"><div class="boot-w">MUSICA</div></div>
<div id="err"><p id="errMsg"></p></div>

<script src="stamp_press.js"></script>
<script>
const SUPA_URL='https://cyhlotwdisjvoxvfkpnd.supabase.co';
const SUPA_KEY='sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
const supa=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{storageKey:'eungyo-auth'}});
const BUCKET='tour-assets';
const asset=(code,slot)=>`${SUPA_URL}/storage/v1/object/public/${BUCKET}/concert/${code}_${slot}.webp`;
const HALL_RATIO=1080/1920;                 /* 홀 그림 가로/세로 (9:16) */
const $=s=>document.querySelector(s);

console.log("%c[EG] concert v1.2 · 0731 (스크롤+서랍+편집기+곡바)", "color:#c9a24a");
const qs=new URLSearchParams(location.search);
const CODE=qs.get('code')||'wien';
let HALL=null, SONG=null;
/* 스크린 자리 — 빈 실측 기본값(0731). meta.screen_rect가 있으면 그쪽이 이긴다 */
let RECT={L:18.70,T:41.51,W:63.02,H:20.16};
function applyRect(){
  const e=$('#screen');
  e.style.left=RECT.L+'%'; e.style.top=RECT.T+'%';
  e.style.width=RECT.W+'%'; e.style.height=RECT.H+'%';
}

/* 시각 구간 — eg_sky 한 벌에서만 읽는다 (v128 함정 F) */
function phase(){
  try{ return (window.egSky && egSky.phase) ? egSky.phase() : 'd'; }
  catch(e){ return 'd'; }
}

/* KST 날수 — 자정에 한 칸 */
function kstDay(){ return Math.floor((Date.now() + 9*3600*1000) / 86400000); }

/* 그림 물리기 — 후보를 순서대로 시도 (시간대판 없으면 낮판) */
function bgChain(el, cands, asImg){
  const step=i=>{
    if(i>=cands.length) return;
    const im=new Image();
    im.onload=()=>{ if(asImg) el.src=cands[i]; else el.style.backgroundImage=`url("${cands[i]}")`; };
    im.onerror=()=>step(i+1);
    im.src=cands[i];
  };
  step(0);
}

/* 세로 화면은 채우고, 가로 화면은 폭을 맞춰 위아래로 흐르게 (palais layoutStage) */
function fitHall(){
  const vw=innerWidth, vh=innerHeight, fit=$('#hallFit');
  if(vw/vh < HALL_RATIO){                       /* 세로 화면 → cover */
    let h=vh, w=h*HALL_RATIO;
    if(w<vw){ w=vw; h=w/HALL_RATIO; }
    fit.style.width=w+'px'; fit.style.height=h+'px';
    fit.style.marginLeft=((vw-w)/2)+'px'; fit.style.marginTop=((vh-h)/2)+'px';
  }else{                                        /* 가로 화면 → 폭 맞춤 + 세로 스크롤 */
    const w=vw, h=w/HALL_RATIO;
    fit.style.width=w+'px'; fit.style.height=h+'px';
    fit.style.marginLeft='0'; fit.style.marginTop='0';
  }
}
/* 스크린 중심을 화면 한가운데로 — 들어서면 무대가 정면에 온다 */
function centerScreen(){
  const h=$('#hallFit').getBoundingClientRect().height;
  const mid=(RECT.T + RECT.H/2)/100*h;
  $('#hall').scrollTop=Math.max(0, mid - innerHeight*0.5);
}
addEventListener('resize', ()=>{ fitHall(); centerScreen(); });

function fail(msg){
  $('#boot').classList.add('gone');
  $('#errMsg').innerHTML=msg;
  $('#err').classList.add('on');
}

/* ── 오늘의 곡 — 결정문 3호 공식 ── */
function todaysSong(songs, hallNo, hallCount){
  const N=songs.length, H=Math.max(hallCount,1);
  if(!N) return null;
  const offset=Math.floor(hallNo * N / H);
  return songs[ ((kstDay() + offset) % N + N) % N ];
}

async function boot(){
  /* 홀 + 홀 총수 */
  const { data:halls, error:he } = await supa.from('terra_pins')
    .select('code,name,city,meta').eq('kind','concert').order('sort');
  if(he || !halls || !halls.length) return fail('홀 목록을 불러오지 못했습니다.<br>잠시 뒤 다시 들러 주세요.');
  HALL = halls.find(h=>h.code===CODE) || halls[0];
  const H = halls.length;
  const hallNo = (HALL.meta && HALL.meta.hall_no != null) ? HALL.meta.hall_no : 0;

  /* 곡 배열 — id 오름차순 고정 (순서가 흔들리면 전 홀이 어긋난다) */
  const { data:songs, error:se } = await supa.from('heritage_items')
    .select('id,name,artist,period,video_id,start_seconds,img,liner_note')
    .eq('category','record').eq('status','active').order('id');
  if(se || !songs || !songs.length) return fail('오늘 걸린 곡을 찾지 못했습니다.<br>잠시 뒤 다시 들러 주세요.');
  SONG = todaysSong(songs, hallNo, H);

  /* 정문 */
  const t=phase();
  bgChain($('#gate'), [asset(HALL.code,'gate_'+t), asset(HALL.code,'gate_d')], false);
  $('#gTitle').textContent = HALL.name;
  $('#gSub').textContent = (HALL.meta && HALL.meta.subtitle) ? HALL.meta.subtitle : 'EG음악관';

  /* 공연장 */
  bgChain($('#hallImg'), [asset(HALL.code,'hall')], true);
  $('#hName').textContent = (HALL.meta && HALL.meta.title) ? HALL.meta.title : HALL.name;
  $('#sTitle').textContent  = SONG.name || '';
  $('#sArtist').textContent = [SONG.artist, SONG.period].filter(Boolean).join(' · ');
  $('#barTitle').textContent = SONG.name || '';
  $('#barSub').textContent   = [SONG.artist, SONG.period].filter(Boolean).join(' · ');
  /* 스크린 좌표 — 홀마다 그림이 다르므로 meta가 있으면 그것이 먼저다 */
  const r = HALL.meta && HALL.meta.screen_rect;
  if(r) RECT = Object.assign({}, RECT, r);
  applyRect();

  fitHall(); centerScreen();
  $('#boot').classList.add('gone');
  $('#gate').classList.add('on');
  setupEditor();
}

/* ── 정문 → 암전 → 공연장 ──
   문짝이 갈라지지 않는다. 극장은 어두워지면서 시작한다. */
let moved=false;
function enterHall(){
  if(moved) return; moved=true;
  $('#fade').classList.add('on');              /* 1s 동안 검게 */
  setTimeout(()=>{
    $('#gate').classList.remove('on');
    $('#hall').classList.add('on');
    fitHall(); centerScreen();
    setTimeout(()=>$('#fade').classList.remove('on'), 60);   /* 다시 밝아지며 홀 도착 */
    /* 0803 크레덴시알 — 홀에 들어선 뒤에 도장을 놓는다.
       대문 앞에서 받고 돌아서면 그건 입국이 아니다(9-1 「들어가면 머무는 곳」).
       살롱지기에게는 「스크린 맞추기」가 이미 구석에 앉아 있어 그만큼 띄운다. */
    if (window.EGStamp) EGStamp.offer({ supa: supa, area: 'musica', bottom: 96 });
  }, 1050);
}
$('#gate').addEventListener('click', enterHall);
$('#gate').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') enterHall(); });

/* ── 재생 ── */
function play(){
  if(!SONG || !SONG.video_id) return;
  const box=$('#playerBox');
  const st=SONG.start_seconds || 0;
  box.innerHTML=`<iframe src="https://www.youtube.com/embed/${SONG.video_id}?autoplay=1&start=${st}&rel=0&modestbranding=1"
    allow="autoplay; encrypted-media; fullscreen" allowfullscreen frameborder="0"
    style="width:100%;height:100%;border:0;display:block"></iframe>`;
  box.classList.add('on');
  $('#screenVeil').style.display='none';
}
$('#screen').addEventListener('click', ()=>{ if(!$('#playerBox').classList.contains('on')) play(); });
$('#screen').addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && !$('#playerBox').classList.contains('on')) play(); });

/* ── 곡 소개 — 라이너 4겹 ── */
const LINER_ORDER=[
  ['knowledge','SCIENTIA · 사실'],
  ['thought',  'COGITATIO · 사유'],
  ['connection','NEXUS · 연결'],
  ['curation', 'CURATIO · 큐레이션']
];
function mdLite(s){
  return String(s||'')
    .replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>');
}
function openLiner(){
  if(!SONG) return;
  $('#lTitle').textContent  = SONG.name || '';
  $('#lArtist').textContent = [SONG.artist, SONG.period].filter(Boolean).join(' · ');
  const cv=$('#lCover');
  if(SONG.img){ cv.src=SONG.img; cv.style.display='block'; } else cv.style.display='none';
  const ln=SONG.liner_note||{};
  const box=$('#lBody'); box.innerHTML='';
  LINER_ORDER.forEach(([k,label])=>{
    if(!ln[k]) return;
    const sec=document.createElement('div'); sec.className='l-sec';
    sec.innerHTML=`<h4>${label}</h4><p>${mdLite(ln[k])}</p>`;
    box.appendChild(sec);
  });
  if(!box.children.length) box.innerHTML='<div class="l-sec"><p>이 곡의 소개는 곧 도착합니다.</p></div>';
  const d=$('#liner');
  d.classList.add('on');
  requestAnimationFrame(()=>d.classList.add('slide'));   /* 오른쪽에서 밀려 들어옴 */
  $('#hall').classList.add('reading');                   /* 홀만 흐려진다 — 연주는 그대로 */
  d.scrollTop=0;
}
function closeLiner(){
  const d=$('#liner');
  d.classList.remove('slide');
  $('#hall').classList.remove('reading');
  setTimeout(()=>d.classList.remove('on'), 560);
}
$('#linerBtn').addEventListener('click', ()=>{
  $('#liner').classList.contains('slide') ? closeLiner() : openLiner(); });
$('#linerClose').addEventListener('click', closeLiner);
$('#linerClose2').addEventListener('click', closeLiner);
addEventListener('keydown', e=>{ if(e.key==='Escape') closeLiner(); });

/* ══════════ 스크린 좌표 편집기 — 살롱지기 전용 (0731) ══════════
   그림마다 흰 판의 자리가 미세하게 다르다. 눈으로 맞춘 값을 meta.screen_rect에 적어두면
   다음부터 셸이 그것을 먼저 읽는다. 코드를 고치러 오지 않아도 된다. */
let EDITABLE=false;
async function setupEditor(){
  try{
    const { data:{ user } } = await supa.auth.getUser();
    if(!user) return;
    const { data:u } = await supa.from('users').select('is_admin').eq('id',user.id).single();
    if(!u || !u.is_admin) return;
    EDITABLE=true;
    $('#editOpen').classList.add('on');
  }catch(e){}
}
function openEdit(){
  if(!EDITABLE) return;
  ['L','T','W','H'].forEach(k=> $('#ed'+k).value = RECT[k]);
  $('#edit').classList.add('on');
  $('#screen').classList.add('editing');
  $('#editOpen').classList.remove('on');
}
function closeEdit(){
  $('#edit').classList.remove('on');
  $('#screen').classList.remove('editing');
  if(EDITABLE) $('#editOpen').classList.add('on');
}
function nudge(k, d){
  RECT[k] = Math.round((RECT[k] + d) * 100) / 100;
  $('#ed'+k).value = RECT[k];
  applyRect();
}
['L','T','W','H'].forEach(k=>{
  const el=document.getElementById('ed'+k);
  if(el) el.addEventListener('input', ()=>{
    const v=parseFloat(el.value);
    if(!isNaN(v)){ RECT[k]=v; applyRect(); }
  });
});
/* 방향키 — Shift면 크기, 아니면 위치 */
addEventListener('keydown', e=>{
  if(!$('#edit').classList.contains('on')) return;
  const step = e.altKey ? 0.05 : 0.2;
  const map = e.shiftKey
    ? { ArrowLeft:['W',-step], ArrowRight:['W',step], ArrowUp:['H',-step], ArrowDown:['H',step] }
    : { ArrowLeft:['L',-step], ArrowRight:['L',step], ArrowUp:['T',-step], ArrowDown:['T',step] };
  const m = map[e.key];
  if(!m) return;
  e.preventDefault();
  nudge(m[0], m[1]);
});
async function saveRect(){
  if(!EDITABLE || !HALL) return;
  const meta = Object.assign({}, HALL.meta || {}, { screen_rect:{
    L:+RECT.L, T:+RECT.T, W:+RECT.W, H:+RECT.H } });
  const { error } = await supa.from('terra_pins').update({ meta }).eq('code', HALL.code).eq('kind','concert');
  if(error){ alert('저장 실패: ' + error.message); return; }
  /* 잘 됐겠지 금지 — 실제로 다시 읽어 확인 */
  const { data:chk } = await supa.from('terra_pins')
    .select('meta').eq('code', HALL.code).eq('kind','concert').single();
  const r = chk && chk.meta && chk.meta.screen_rect;
  if(r && Math.abs(r.L-RECT.L)<0.001 && Math.abs(r.T-RECT.T)<0.001){
    HALL.meta = meta;
    alert('저장했습니다 ✔\nL ' + RECT.L + ' · T ' + RECT.T + ' · W ' + RECT.W + ' · H ' + RECT.H);
    closeEdit();
  } else alert('저장했으나 확인이 안 됩니다. 새로고침해 보세요.');
}
$('#editOpen').addEventListener('click', openEdit);

boot().catch(e=>{ console.warn('concert boot 실패:', e);
  fail('음악관 문이 잠시 열리지 않습니다.<br>잠시 뒤 다시 들러 주세요.'); });


</script>
