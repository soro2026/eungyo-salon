<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>EG Wunderkammer · Building Shell v3 (3F books)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+KR:wght@300;400;500&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+KR:wght@100;600;700&display=swap');

/* ============================================================
 *  분더카머 빌딩 셸 v2 — 층 전환 골조 (콘텐츠 없음)
 *
 *  v1 → v2 변경:
 *   ① 층 안내 bar(다이얼)를 문에서 분리 → 문 위 늘 떠 있는 상단 패널.
 *      탑승 순간 뜸 → 문이 다 열린 뒤에야 사라짐. (실제 엘리베이터 경험)
 *   ② 좌우 문은 그 bar '아래'에서만 여닫이.
 *   ③ 4초 효과음(ding_sound.mp3) 싱크:
 *      0s 닫힘 시작 / 1.1s 철커덩(닫힘완료) / 1.4s 띵동=불 딸깍 점등
 *      / 2.5s 스르륵(열림 시작) / ~3.5s 문 활짝 + bar 사라짐
 * ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #050304;
  font-family: 'Noto Serif KR', 'Cormorant Garamond', serif;
  color: #e8d9b0;
  user-select: none;
}

:root {
  --floor-bg-1: #3a1820;  --floor-bg-2: #6a2230;
  --floor-accent: #c9a84c;
  --floor-text: #f0ebe0;
  --floor-text-dim: #a89a85;

  /* 효과음 싱크 타임라인 (초) — 소리가 주인, 애니메이션이 따라감 */
  --t-close: 1.1s;   /* 문 닫힘 완료(철커덩) */
  --t-open-dur: 1.0s;/* 문 열림 길이 (2.5s → 3.5s) */
}

/* ============================================================
 *  레이어 1 — 층 콘텐츠
 * ============================================================ */
.floor-layer {
  position: fixed; inset: 0; z-index: 1;
  display: flex; align-items: center; justify-content: center;
}
.floor {
  position: relative; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background:
    radial-gradient(ellipse 80% 60% at 50% 38%, rgba(255,240,210,0.10), transparent 70%),
    linear-gradient(165deg, var(--floor-bg-1) 0%, var(--floor-bg-2) 100%);
  box-shadow: inset 0 0 180px rgba(0,0,0,0.55);
}
.floor::before, .floor::after {
  content: ''; position: absolute; left: 0; right: 0; height: 5px;
  background: linear-gradient(90deg, transparent, var(--floor-accent), transparent);
  opacity: 0.5;
}
.floor::before { top: 0; }
.floor::after  { bottom: 0; }

.floor-roman {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(48px, 14vw, 120px); font-weight: 300; line-height: 1;
  color: var(--floor-accent); opacity: 0.85; letter-spacing: 4px;
  text-shadow: 0 4px 30px rgba(0,0,0,0.6);
}
.floor-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(22px, 6vw, 38px); font-weight: 400; font-style: italic;
  color: var(--floor-text); letter-spacing: 3px; margin-top: 14px;
}
.floor-kr {
  font-size: clamp(13px, 3.6vw, 16px); color: var(--floor-text-dim);
  letter-spacing: 6px; margin-top: 10px;
}
.floor-placeholder {
  margin-top: 34px; padding: 10px 22px;
  border: 1px dashed color-mix(in srgb, var(--floor-accent) 45%, transparent);
  border-radius: 2px; font-size: 11px; letter-spacing: 3px;
  color: var(--floor-text-dim); font-family: 'Cormorant Garamond', serif;
}

/* ===== 층 안 엘리베이터 사물 (느린 길) ===== */
.room-elevator {
  position: absolute; right: clamp(16px, 4vw, 48px); top: 50%; transform: translateY(-50%);
  width: clamp(64px, 16vw, 92px);
  z-index: 30; /* 책방 cover-stack(5)·화살표(8)보다 위 — 항상 클릭 가능 */
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 14px 8px;
  background: linear-gradient(180deg, rgba(40,28,16,0.85), rgba(20,14,8,0.92));
  border: 1px solid color-mix(in srgb, var(--floor-accent) 60%, transparent);
  border-radius: 6px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5), inset 0 0 24px rgba(0,0,0,0.4);
}
.room-elevator .grille {
  width: 100%; height: 46px;
  background: repeating-linear-gradient(90deg,
    color-mix(in srgb, var(--floor-accent) 55%, #2a1c0e) 0 2px, rgba(0,0,0,0.35) 2px 7px);
  border-radius: 2px; opacity: 0.7;
}
.room-elevator .elev-label {
  font-size: 8px; letter-spacing: 2px; color: var(--floor-text-dim);
  font-family: 'Cormorant Garamond', serif;
}
.elev-arrow {
  width: 100%;
  background: linear-gradient(180deg, rgba(60,42,24,0.9), rgba(34,22,12,0.95));
  border: 1px solid color-mix(in srgb, var(--floor-accent) 50%, transparent);
  color: var(--floor-accent); font-size: 15px; line-height: 1;
  padding: 6px 0; border-radius: 3px; cursor: pointer;
  transition: background 0.2s, transform 0.15s;
}
.elev-arrow:hover { background: linear-gradient(180deg, rgba(90,62,34,0.95), rgba(50,34,18,1)); }
.elev-arrow:active { transform: scale(0.94); }
.elev-arrow:disabled { opacity: 0.25; cursor: default; }

/* ============================================================
 *  층 콘텐츠 공통 래퍼
 * ============================================================ */
.floor-content { position: absolute; inset: 0; }

/* ============================================================
 *  ⅠF 미술관 (Galerie) — 3D 4벽 방 · 전부 [data-floor="1"] 스코프
 *  v10(4벽+yaw) 기술 입주 · 작품은 임시(위키미디어 PD) → 본 공사 때 헤리티지 PNG
 * ============================================================ */
.floor-content[data-floor="1"] {
  /* 방 치수 + 카메라 (FPS: world = 카메라의 반대) */
  --g1-room-w: 2000px; --g1-room-h: 700px; --g1-room-d: 2000px;
  --g1-half-w: 1000px; --g1-half-h: 350px; --g1-half-d: 1000px;
  --g1-cam-x: 0px; --g1-cam-z: -400px; --g1-yaw: 0deg; --g1-scale: 1;
  /* ── 갤러리 셀프 디자인 변수 (디폴트 = 진홍 살롱. null이면 셸이 이 값으로 둠) ── */
  --g1-h: 347;            /* 벽 색상 Hue 0~360 */
  --g1-s: 52%;            /* 벽 채도 */
  --g1-l: 27%;            /* 벽 기준 밝기 */
  --g1-glow: 0.18;        /* 조명 온기(따뜻한 라디얼 글로우) */
  --g1-moulding: #d4b878; /* 황금 몰딩 */
  --g1-amber: #f0d8a8;    /* 글자색 */
  /* 바닥 색조 (패턴은 .g1-ground[data-pat]로 분기) */
  --g1-fl-h: 28; --g1-fl-s: 42%; --g1-fl-l: 25%;
  overflow: hidden;
}
.floor-content[data-floor="1"] .g1-scene {
  position: absolute; inset: 0;
  perspective: 1800px; perspective-origin: 50% 50%;
}
.floor-content[data-floor="1"] .g1-world {
  position: absolute; top: 50%; left: 50%; width: 0; height: 0;
  transform-style: preserve-3d;
  transform:
    scale(var(--g1-scale))
    rotateY(calc(-1 * var(--g1-yaw)))
    translate3d(calc(-1 * var(--g1-cam-x)), 0, calc(-1 * var(--g1-cam-z)));
  transition: transform 1.0s cubic-bezier(0.5, 0, 0.2, 1);
}
.floor-content[data-floor="1"] .g1-face {
  position: absolute; transform-style: preserve-3d;
  backface-visibility: hidden; overflow: hidden;
}
.floor-content[data-floor="1"] .g1-wall-front {
  width: var(--g1-room-w); height: var(--g1-room-h);
  margin-left: calc(var(--g1-half-w) * -1); margin-top: calc(var(--g1-half-h) * -1);
  transform: translateZ(calc(var(--g1-half-d) * -1));
  background:
    radial-gradient(ellipse at center 35%, rgba(255,230,180,var(--g1-glow)), transparent 65%),
    linear-gradient(180deg,
      hsl(var(--g1-h) var(--g1-s) var(--g1-l)) 0%,
      hsl(var(--g1-h) var(--g1-s) calc(var(--g1-l) + 4%)) 45%,
      hsl(var(--g1-h) var(--g1-s) calc(var(--g1-l) - 8%)) 100%);
  box-shadow: inset 0 0 100px rgba(0,0,0,0.6);
}
.floor-content[data-floor="1"] .g1-wall-right {
  width: var(--g1-room-d); height: var(--g1-room-h);
  margin-left: calc(var(--g1-half-d) * -1); margin-top: calc(var(--g1-half-h) * -1);
  transform: rotateY(-90deg) translateZ(calc(var(--g1-half-w) * -1));
  background:
    linear-gradient(270deg, rgba(0,0,0,0.20), transparent 60%),
    linear-gradient(180deg,
      hsl(var(--g1-h) var(--g1-s) calc(var(--g1-l) - 4%)),
      hsl(var(--g1-h) var(--g1-s) calc(var(--g1-l) - 12%)));
  box-shadow: inset 0 0 80px rgba(0,0,0,0.5);
}
.floor-content[data-floor="1"] .g1-wall-back {
  width: var(--g1-room-w); height: var(--g1-room-h);
  margin-left: calc(var(--g1-half-w) * -1); margin-top: calc(var(--g1-half-h) * -1);
  transform: rotateY(180deg) translateZ(calc(var(--g1-half-d) * -1));
  background: linear-gradient(180deg,
    hsl(var(--g1-h) var(--g1-s) calc(var(--g1-l) - 8%)),
    hsl(var(--g1-h) var(--g1-s) calc(var(--g1-l) - 12%)));
  box-shadow: inset 0 0 80px rgba(0,0,0,0.5);
}
.floor-content[data-floor="1"] .g1-wall-left {
  width: var(--g1-room-d); height: var(--g1-room-h);
  margin-left: calc(var(--g1-half-d) * -1); margin-top: calc(var(--g1-half-h) * -1);
  transform: rotateY(90deg) translateZ(calc(var(--g1-half-w) * -1));
  background:
    linear-gradient(90deg, rgba(255,220,170,calc(var(--g1-glow) * 0.85)), transparent 60%),
    linear-gradient(180deg,
      hsl(var(--g1-h) var(--g1-s) calc(var(--g1-l) + 1%)),
      hsl(var(--g1-h) var(--g1-s) calc(var(--g1-l) - 8%)));
  box-shadow: inset 0 0 80px rgba(0,0,0,0.5);
}
/* ── 좌측 벽 = 메시지 보드 (위 글귀판 + 아래 흐르는 흔적 티커) ── */
.floor-content[data-floor="1"] .g1-mw {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  padding: 64px 90px 0; box-sizing: border-box;
}
.floor-content[data-floor="1"] .g1-mw-top {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
}
.floor-content[data-floor="1"] .g1-mw-nick {
  font-size: 56px; font-weight: 700; letter-spacing: 6px;
  color: var(--g1-amber); text-shadow: 0 2px 12px rgba(0,0,0,.5);
}
.floor-content[data-floor="1"] .g1-mw-title {
  font-size: 22px; letter-spacing: 4px; color: #caa86a; margin: 18px 0 40px;
}
.floor-content[data-floor="1"] .g1-mw-body {
  font-family: Georgia, 'Nanum Myeongjo', serif; font-size: 40px; line-height: 1.75;
  color: #f5ead0; max-width: 1300px; text-shadow: 0 2px 10px rgba(0,0,0,.4);
  white-space: pre-wrap;
}
.floor-content[data-floor="1"] .g1-mw-sig {
  font-size: 24px; color: #c0a070; margin-top: 34px; font-style: italic;
}
.floor-content[data-floor="1"] .g1-mw-empty {
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  font-size: 48px; font-weight: 700; letter-spacing: 5px; color: var(--g1-amber); opacity: .8;
}
.floor-content[data-floor="1"] .g1-mw-empty span {
  font-size: 20px; font-weight: 400; letter-spacing: 2px; color: #c0a070; opacity: .7;
}
.floor-content[data-floor="1"] .g1-mw-ticker {
  height: 150px; flex: 0 0 auto; overflow: hidden; position: relative;
  border-top: 1px solid rgba(212,184,120,.25); padding-top: 6px;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
          mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
}
.floor-content[data-floor="1"] .g1-mw-track {
  display: inline-flex; align-items: center; white-space: nowrap;
  height: 100%; will-change: transform; animation: g1-mw-flow 60s linear infinite;
}
.floor-content[data-floor="1"] .g1-mw-track:hover { animation-play-state: paused; }
.floor-content[data-floor="1"] .g1-mw-chip {
  display: inline-flex; align-items: center; gap: 12px; padding: 0 34px 0 0; font-size: 26px;
}
.floor-content[data-floor="1"] .g1-mw-chip img { width: 44px; height: 44px; object-fit: contain; flex: 0 0 auto; }
.floor-content[data-floor="1"] .g1-mw-chip b { font-weight: 600; color: var(--g1-amber); }
.floor-content[data-floor="1"] .g1-mw-chip span { color: #e8d8b8; opacity: .85; }
@keyframes g1-mw-flow { from { transform: translateX(0); } to { transform: translateX(-50%); } }
/* 좌측 벽 액션 버튼 (핫스팟 평면 위) */
.floor-content[data-floor="1"] .g1-mw-action {
  position: absolute; transform: translateX(-50%); pointer-events: auto;
  padding: 12px 28px; font-size: 17px; letter-spacing: 1px; white-space: nowrap;
  color: #f0d8a8; background: rgba(60,30,40,0.9); cursor: pointer;
  border: 1px solid var(--g1-moulding); border-radius: 24px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.floor-content[data-floor="1"] .g1-mw-action:hover { background: rgba(90,45,60,0.96); }
/* ── 갤러리 꾸미기 (본인 방만) ── */
.floor-content[data-floor="1"] .g1-design-btn {
  position: absolute; left: 22px; bottom: 22px; z-index: 60;
  padding: 11px 20px; font-size: 15px; letter-spacing: 0.5px; white-space: nowrap;
  color: var(--g1-amber); background: rgba(40,24,20,0.86); cursor: pointer;
  border: 1px solid var(--g1-moulding); border-radius: 22px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.45);
}
.floor-content[data-floor="1"] .g1-design-btn:hover { background: rgba(70,40,30,0.94); }
.floor-content[data-floor="1"]:has(.g1-zoom:not([hidden])) .g1-design-btn,
.floor-content[data-floor="1"]:has(.g1-design-panel:not([hidden])) .g1-design-btn { display:none; }
.floor-content[data-floor="1"] .g1-design-panel {
  position: absolute; left:0; right:0; bottom:0; z-index: 130;
  background: rgba(18,10,13,0.94); border-top: 1px solid var(--g1-moulding);
  padding: 14px 18px 20px; max-height: 48vh; overflow-y: auto;
  box-shadow: 0 -8px 30px rgba(0,0,0,0.5);
}
.floor-content[data-floor="1"] .g1-design-panel[hidden] { display:none; }
.floor-content[data-floor="1"] .g1-dp-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.floor-content[data-floor="1"] .g1-dp-title { font-size:17px; color:var(--g1-amber); letter-spacing:1px; }
.floor-content[data-floor="1"] .g1-dp-x { background:transparent; border:none; color:#c0a070; font-size:22px; cursor:pointer; line-height:1; }
.floor-content[data-floor="1"] .g1-dp-sect { font-size:12px; color:#c0a070; letter-spacing:1px; margin:6px 0 10px; }
.floor-content[data-floor="1"] .g1-dp-presets { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
.floor-content[data-floor="1"] .g1-dp-floors { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
.floor-content[data-floor="1"] .g1-dp-chip {
  aspect-ratio: 3/2; border-radius:8px; cursor:pointer; position:relative; overflow:hidden;
  border:2px solid transparent; padding:0;
}
.floor-content[data-floor="1"] .g1-dp-chip.sel { border-color: var(--g1-moulding); box-shadow:0 0 0 1px rgba(212,184,120,0.4); }
.floor-content[data-floor="1"] .g1-dp-chip span {
  position:absolute; left:0; right:0; bottom:0; padding:3px 4px; font-size:11px; text-align:center;
  color:#f3e8d2; background:linear-gradient(transparent, rgba(0,0,0,0.62)); text-shadow:0 1px 2px #000;
}
.floor-content[data-floor="1"] .g1-dp-foot { font-size:12px; color:#a88860; margin-top:12px; line-height:1.5; }
.floor-content[data-floor="1"] .g1-dp-sliders { display:grid; gap:11px; }
.floor-content[data-floor="1"] .g1-dp-sliders label { display:grid; grid-template-columns:42px 1fr; align-items:center; gap:10px; font-size:13px; color:#d8c4a0; }
.floor-content[data-floor="1"] .g1-dp-sliders input[type=range]{ width:100%; accent-color: var(--g1-moulding); }
.floor-content[data-floor="1"] .g1-dp-save {
  margin-top:14px; width:100%; padding:11px; font-size:15px; border-radius:22px; cursor:pointer;
  background:rgba(90,45,60,0.9); color:#f0d8a8; border:1px solid var(--g1-moulding);
}
.floor-content[data-floor="1"] .g1-dp-save:hover { background:rgba(110,55,72,0.95); }
@media (max-width:560px){
  .floor-content[data-floor="1"] .g1-dp-presets { grid-template-columns:repeat(2,1fr); }
  .floor-content[data-floor="1"] .g1-dp-floors { grid-template-columns:repeat(3,1fr); }
}
/* 메시지 보드 모달 (글귀 쓰기 / 헌화) */
.mw-modal {
  position: fixed; inset: 0; z-index: 9999; background: rgba(20,8,12,0.72);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  overflow-y: auto;
}
.mw-box {
  background: linear-gradient(180deg, #3a1822, #2a1018); border: 1px solid #d4b878;
  border-radius: 16px; padding: 28px 30px; width: min(520px, 92vw); box-sizing: border-box;
  max-height: 90vh; overflow-y: auto;
  color: #f0e0c8; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.mw-box h3 { margin: 0 0 16px; font-size: 22px; color: #f0d8a8; letter-spacing: 1px; }
.mw-box label { display: block; font-size: 13px; color: #c0a070; margin: 14px 0 6px; letter-spacing: 1px; }
.mw-box input, .mw-box textarea {
  width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.3);
  border: 1px solid rgba(212,184,120,0.35); border-radius: 8px; padding: 11px 13px;
  color: #f5ead0; font-size: 16px; font-family: inherit; resize: vertical; user-select: text;
}
.mw-box input:focus, .mw-box textarea:focus { outline: none; border-color: #d4b878; }
.mw-hint { font-size: 14px; color: #c8a878; line-height: 1.6; margin: 0 0 6px; }
.mw-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
.mw-btns button { padding: 10px 22px; font-size: 15px; border-radius: 22px; cursor: pointer; border: 1px solid #d4b878; }
.mw-cancel { background: transparent; color: #c0a070; }
.mw-save { background: #d4b878; color: #3a1822; font-weight: 600; }
.floor-content[data-floor="1"] .g1-ground {
  width: var(--g1-room-w); height: var(--g1-room-d);
  margin-left: calc(var(--g1-half-w) * -1); margin-top: calc(var(--g1-half-d) * -1);
  transform: rotateX(90deg) translateZ(calc(var(--g1-half-h) * -1));
  --g1-fl-d: hsl(var(--g1-fl-h) var(--g1-fl-s) var(--g1-fl-l));
  --g1-fl-li: hsl(var(--g1-fl-h) var(--g1-fl-s) calc(var(--g1-fl-l) + 4%));
  background: repeating-linear-gradient(45deg,
    var(--g1-fl-d) 0 30px, var(--g1-fl-li) 30px 60px);
}
.floor-content[data-floor="1"] .g1-ground[data-pat="checker"] {
  background:
    conic-gradient(var(--g1-fl-li) 90deg, var(--g1-fl-d) 90deg 180deg, var(--g1-fl-li) 180deg 270deg, var(--g1-fl-d) 270deg);
  background-size: 130px 130px;
}
.floor-content[data-floor="1"] .g1-ground[data-pat="wood"] {
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.42) 0 3px, transparent 3px 240px),
    repeating-linear-gradient(0deg, var(--g1-fl-li) 0 86px, var(--g1-fl-d) 86px 90px);
}
.floor-content[data-floor="1"] .g1-ground[data-pat="stripe"] {
  background: repeating-linear-gradient(0deg, var(--g1-fl-li) 0 64px, var(--g1-fl-d) 64px 68px);
}
.floor-content[data-floor="1"] .g1-ground[data-pat="terrazzo"] {
  background-color: var(--g1-fl-d);
  background-image:
    radial-gradient(circle at 22% 28%, var(--g1-fl-li) 0 5px, transparent 6px),
    radial-gradient(circle at 68% 58%, hsl(var(--g1-fl-h) var(--g1-fl-s) calc(var(--g1-fl-l) - 8%)) 0 4px, transparent 5px),
    radial-gradient(circle at 45% 82%, hsl(var(--g1-fl-h) var(--g1-fl-s) calc(var(--g1-fl-l) + 12%)) 0 4px, transparent 5px),
    radial-gradient(circle at 84% 24%, hsl(var(--g1-fl-h) var(--g1-fl-s) calc(var(--g1-fl-l) - 8%)) 0 3px, transparent 4px),
    radial-gradient(circle at 14% 66%, hsl(var(--g1-fl-h) var(--g1-fl-s) calc(var(--g1-fl-l) - 8%)) 0 3px, transparent 4px);
  background-size: 90px 90px;
}
.floor-content[data-floor="1"] .g1-ground[data-pat="plain"] {
  background: radial-gradient(ellipse at 50% 40%,
    hsl(var(--g1-fl-h) var(--g1-fl-s) calc(var(--g1-fl-l) + 3%)),
    hsl(var(--g1-fl-h) var(--g1-fl-s) calc(var(--g1-fl-l) - 4%)));
}
.floor-content[data-floor="1"] .g1-ceiling {
  width: var(--g1-room-w); height: var(--g1-room-d);
  margin-left: calc(var(--g1-half-w) * -1); margin-top: calc(var(--g1-half-d) * -1);
  transform: rotateX(-90deg) translateZ(calc(var(--g1-half-h) * -1));
  background:
    radial-gradient(ellipse at center, rgba(212,184,120,calc(var(--g1-glow) + 0.04)), transparent 60%),
    hsl(var(--g1-h) calc(var(--g1-s) - 20%) calc(var(--g1-l) - 12%));
}
/* 황금 몰딩 (4벽 위·아래 띠) */
.floor-content[data-floor="1"] .g1-wall-front::before, .floor-content[data-floor="1"] .g1-wall-right::before,
.floor-content[data-floor="1"] .g1-wall-back::before,  .floor-content[data-floor="1"] .g1-wall-left::before {
  content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px;
  background: linear-gradient(90deg, #5a3a18, var(--g1-moulding), #5a3a18); z-index: 5;
}
.floor-content[data-floor="1"] .g1-wall-front::after, .floor-content[data-floor="1"] .g1-wall-right::after,
.floor-content[data-floor="1"] .g1-wall-back::after,  .floor-content[data-floor="1"] .g1-wall-left::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
  background: linear-gradient(90deg, #5a3a18, var(--g1-moulding), #5a3a18); z-index: 5;
}
/* 작품 — 액자 + 명판 (벽의 자식) */
.floor-content[data-floor="1"] .g1-painting {
  position: absolute; top: 50%; transform: translateY(-54%);
  width: 320px; z-index: 2; backface-visibility: hidden; text-align: center;
}
.floor-content[data-floor="1"] .g1-frame {
  width: 320px; height: 340px; margin: 0 auto;
  padding: 14px; background: linear-gradient(135deg, #8a6a32, #c9a84c 30%, #7a5a28 60%, #b89a44);
  box-shadow: 3px 10px 28px rgba(0,0,0,0.85), inset 0 0 8px rgba(0,0,0,0.5);
}
.floor-content[data-floor="1"] .g1-frame .g1-mat {
  width: 100%; height: 100%; background: #1a1210; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.floor-content[data-floor="1"] .g1-frame img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  backface-visibility: hidden;
}
.floor-content[data-floor="1"] .g1-frame .g1-lost {
  width: 100%; height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  background: radial-gradient(ellipse at center, #3a2430, #1c1016);
  color: rgba(240,216,168,0.7); font-family: 'Cormorant Garamond','Noto Serif KR',serif;
  font-size: 15px; letter-spacing: 1px; padding: 12px; text-align: center;
}
.floor-content[data-floor="1"] .g1-plaque {
  display: inline-block; margin-top: 10px; padding: 5px 14px;
  background: linear-gradient(180deg, #efe6d0, #d8c9a8);
  border: 1px solid rgba(90,58,24,0.6); border-radius: 1px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.6);
  font-family: 'Cormorant Garamond','Noto Serif KR',serif;
  color: #3a2a18; line-height: 1.35;
}
.floor-content[data-floor="1"] .g1-plaque .g1-pt { font-size: 13px; font-weight: 600; letter-spacing: 0.5px; }
.floor-content[data-floor="1"] .g1-plaque .g1-pa { font-size: 10.5px; font-style: italic; opacity: 0.75; letter-spacing: 1px; }
/* 헤리티지 액자 합성본 — 이미지가 액자를 품고 있어 CSS 액자 없이 원본 비율로 건다 */
.floor-content[data-floor="1"] .g1-hframed .g1-fimg {
  display: block; width: 100%; height: auto; margin: 0 auto;
  filter: drop-shadow(5px 14px 24px rgba(0,0,0,0.78));
  backface-visibility: hidden;
}
/* 회전 버튼 — 층 안 absolute (fixed 금지: 셸 z 체계 보존) */
.floor-content[data-floor="1"] .g1-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 58px; height: 58px; border-radius: 50%;
  background: rgba(80,40,28,0.78); border: 1px solid rgba(212,184,120,0.7);
  color: var(--g1-amber); font-size: 28px; line-height: 1; cursor: pointer;
  z-index: 20; backdrop-filter: blur(8px);
  transition: background 0.2s, transform 0.2s;
}
.floor-content[data-floor="1"] .g1-nav:hover { background: rgba(110,60,40,0.95); transform: translateY(-50%) scale(1.08); }
.floor-content[data-floor="1"] .g1-nav-left  { left: 22px; }
.floor-content[data-floor="1"] .g1-nav-right { right: clamp(96px, 22vw, 156px); } /* 엘리베이터 기둥 비킴 */
/* 나침반 + 벽 이름 */
.floor-content[data-floor="1"] .g1-compass {
  position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
  color: var(--g1-amber); font-size: 13px; letter-spacing: 0.25em; z-index: 20;
  font-family: 'Cormorant Garamond','Noto Serif KR',serif;
  text-shadow: 0 2px 12px rgba(0,0,0,0.95); text-align: center;
}
.floor-content[data-floor="1"] .g1-compass .g1-c-kr {
  display: block; margin-top: 5px; font-size: 11px; letter-spacing: 0.35em;
  color: rgba(240,216,168,0.55);
}
/* 조각 — 빌보드 (항상 카메라를 향해 회전: world의 -yaw를 +yaw로 상쇄) */
.floor-content[data-floor="1"] .g1-sculpt {
  position: absolute; top: 0; left: 0;
  width: 260px; height: 430px; margin-left: -130px;
  transform: translate3d(var(--sx), var(--sy), var(--sz)) rotateY(var(--g1-yaw));
  transition: transform 1.0s cubic-bezier(0.5, 0, 0.2, 1);  /* world 회전과 싱크 */
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  text-align: center; z-index: 3;
}
.floor-content[data-floor="1"] .g1-sculpt .g1-statue {
  position: relative;
  width: 170px; height: 250px; display: flex; align-items: flex-end; justify-content: center;
  filter: drop-shadow(6px 14px 18px rgba(0,0,0,0.55));
}
.floor-content[data-floor="1"] .g1-sculpt.g1-turnable { cursor: pointer; }
.floor-content[data-floor="1"] .g1-sculpt.g1-turnable:hover .g1-statue { filter: drop-shadow(6px 14px 22px rgba(0,0,0,0.65)) brightness(1.07); }
.floor-content[data-floor="1"] .g1-statue .g1-sface {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; object-position: center bottom;
  opacity: 0; transition: opacity 0.45s ease;
}
.floor-content[data-floor="1"] .g1-statue .g1-sface.on { opacity: 1; }
.floor-content[data-floor="1"] .g1-sculpt .g1-statue svg,
.floor-content[data-floor="1"] .g1-sculpt .g1-statue img {
  width: 100%; height: 100%; object-fit: contain; display: block;
}
.floor-content[data-floor="1"] .g1-pedestal {
  width: 150px; margin-top: -2px;
}
.floor-content[data-floor="1"] .g1-ped-img {
  display: block; width: auto;
  filter: drop-shadow(5px 12px 20px rgba(0,0,0,0.55));
}
.floor-content[data-floor="1"] .g1-pedestal .g1-ped-top {
  height: 14px; background: linear-gradient(180deg, #e2d6bc, #b8a888);
  border: 1px solid rgba(60,42,24,0.5); border-bottom: none;
}
.floor-content[data-floor="1"] .g1-pedestal .g1-ped-body {
  height: 78px; margin: 0 10px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,0.10) 0 3px, transparent 3px 16px),
    linear-gradient(180deg, #cfc1a2, #a8987a);
  border-left: 1px solid rgba(60,42,24,0.4); border-right: 1px solid rgba(60,42,24,0.4);
}
.floor-content[data-floor="1"] .g1-pedestal .g1-ped-base {
  height: 16px; background: linear-gradient(180deg, #d8cab0, #998a6c);
  border: 1px solid rgba(60,42,24,0.5);
  box-shadow: 0 6px 14px rgba(0,0,0,0.5);
}
.floor-content[data-floor="1"] .g1-sculpt .g1-plaque { margin-top: 8px; }
/* 조각 바닥 그림자 — 바닥 평면에 눕힘 */
.floor-content[data-floor="1"] .g1-sculpt-shadow {
  position: absolute; top: 0; left: 0;
  width: 300px; height: 150px; margin-left: -150px; margin-top: -75px;
  transform: translate3d(var(--sx), 349px, var(--sz)) rotateX(90deg);
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.42), transparent 68%);
  pointer-events: none;
}

/* ============================================================
 *  ⅢF 책의 방 (Bibliothèque) — 전부 [data-floor="3"] 스코프
 *  원본 hello_books_v1.6 → 셸 통합. 전역 html,body 제거,
 *  fixed → absolute (층 콘텐츠 박스 기준), z-index 셸 체계로.
 * ============================================================ */
.floor-content[data-floor="3"] {
  --c-amber: #f0d8a8; --c-amber-dim: #b89968; --c-amber-dark: #6b5838;
  font-family: 'Cormorant Garamond', 'Noto Serif KR', Georgia, serif;
  color: var(--c-amber);
}
.floor-content[data-floor="3"] .stage {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
}
.floor-content[data-floor="3"] .room {
  position: relative; width: 100%; max-width: 1672px;
  aspect-ratio: 1672 / 941;
  background: url('bookshelf_01.webp') center/cover no-repeat;
  background-color: #2a1410; overflow: hidden;
}
.floor-content[data-floor="3"] .bk-bg-layer {
  position: absolute; inset: 0; background-size: cover; background-position: center;
  transition: opacity 0.9s ease; z-index: 0; pointer-events: none;
}
.floor-content[data-floor="3"] .pendant-sway {
  position: absolute; left: 50%; top: 0; width: 30%; height: 30%;
  transform: translateX(-50%); pointer-events: none;
  animation: bk-pendant-sway 45s ease-in-out infinite;
  transform-origin: 50% 0%; z-index: 2;
}
@keyframes bk-pendant-sway {
  0%, 100% { transform: translateX(-50%) rotate(0deg); }
  25%      { transform: translateX(-50%) rotate(0.15deg); }
  75%      { transform: translateX(-50%) rotate(-0.15deg); }
}
.floor-content[data-floor="3"] .pendant-glow {
  position: absolute; left: 50%; top: 25%; width: 14%; aspect-ratio: 1;
  transform: translate(-50%, -50%); border-radius: 50%;
  pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(circle, rgba(255,220,150,0.45) 0%, rgba(255,200,120,0.25) 30%, rgba(255,180,100,0.10) 60%, transparent 100%);
  filter: blur(8px); animation: bk-pendant-breath 4s ease-in-out infinite;
}
@keyframes bk-pendant-breath {
  0%, 100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
  50%      { opacity: 1.0;  transform: translate(-50%, -50%) scale(1.08); }
}
.floor-content[data-floor="3"] .dust {
  position: absolute; width: 3px; height: 3px;
  background: radial-gradient(circle, rgba(255,220,150,0.7), transparent);
  border-radius: 50%; pointer-events: none; z-index: 4;
}
.floor-content[data-floor="3"] .dust-1 { left: 47%; top: 30%; animation: bk-dust-1 18s ease-in-out infinite; }
.floor-content[data-floor="3"] .dust-2 { left: 52%; top: 35%; animation: bk-dust-2 22s ease-in-out infinite; }
.floor-content[data-floor="3"] .dust-3 { left: 49%; top: 28%; animation: bk-dust-3 25s ease-in-out infinite; }
.floor-content[data-floor="3"] .dust-4 { left: 53%; top: 32%; animation: bk-dust-4 20s ease-in-out infinite; }
.floor-content[data-floor="3"] .dust-5 { left: 48%; top: 34%; animation: bk-dust-5 28s ease-in-out infinite; }
@keyframes bk-dust-1 { 0%,100% {transform:translate(0,0);opacity:.3} 25% {transform:translate(8px,-12px);opacity:.7} 50% {transform:translate(-4px,-20px);opacity:.5} 75% {transform:translate(-10px,-8px);opacity:.6} }
@keyframes bk-dust-2 { 0%,100% {transform:translate(0,0);opacity:.4} 33% {transform:translate(-12px,10px);opacity:.8} 66% {transform:translate(6px,-15px);opacity:.5} }
@keyframes bk-dust-3 { 0%,100% {transform:translate(0,0);opacity:.2} 50% {transform:translate(15px,18px);opacity:.6} }
@keyframes bk-dust-4 { 0%,100% {transform:translate(0,0);opacity:.5} 25% {transform:translate(-8px,-10px);opacity:.7} 75% {transform:translate(12px,6px);opacity:.4} }
@keyframes bk-dust-5 { 0%,100% {transform:translate(0,0);opacity:.3} 40% {transform:translate(-15px,8px);opacity:.6} 80% {transform:translate(10px,-12px);opacity:.5} }

.floor-content[data-floor="3"] .cover-stack { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
.floor-content[data-floor="3"] .cover-page {
  position: absolute; inset: 0; opacity: 0; pointer-events: none;
  transition: opacity 0.6s ease-in-out;
}
.floor-content[data-floor="3"] .cover-page.active { opacity: 1; }
.floor-content[data-floor="3"] .cover-page.active .cover-book { pointer-events: auto; }
.floor-content[data-floor="3"] .cover-book {
  position: absolute; cursor: pointer;
  transition: transform 0.3s ease, filter 0.3s ease;
  filter: drop-shadow(2px 5px 10px rgba(0,0,0,0.75));
  transform: translate(-50%, -100%);
}
.floor-content[data-floor="3"] .cover-book img { height: 100%; width: auto; display: block; }
.floor-content[data-floor="3"] .cover-book:hover {
  transform: translate(-50%, -100%) translateY(-8px) scale(1.05);
  filter: drop-shadow(5px 10px 18px rgba(0,0,0,0.9)); z-index: 10;
}
/* ── 편집 모드 (heritage 보물 편집 이식: 선택·드래그·핸들 크기) ── */
.floor-content[data-floor="3"].editing .cover-book { cursor: grab; }
.floor-content[data-floor="3"].editing .cover-book:hover { transform: translate(-50%,-100%); filter: drop-shadow(2px 5px 10px rgba(0,0,0,0.75)); }
.floor-content[data-floor="3"].editing .cover-book.grabbing { cursor: grabbing; }
.floor-content[data-floor="3"] .cover-book.sel img { outline: 2px solid #e9cf9c; outline-offset: 4px; }
.floor-content[data-floor="3"] .cover-book .bk-handle {
  position: absolute; right: -11px; bottom: -11px; width: 24px; height: 24px;
  border-radius: 50%; background: #e9cf9c; border: 2px solid #5a3a18;
  cursor: nwse-resize; display: none; z-index: 7; touch-action: none;
}
.floor-content[data-floor="3"].editing .cover-book.sel .bk-handle { display: block; }
.floor-content[data-floor="3"] .bk-edit-toggle {
  position: absolute; left: 50%; bottom: 54px; transform: translateX(-50%);
  padding: 9px 18px; border-radius: 20px; font-size: 13px; cursor: pointer;
  background: rgba(40,25,20,0.82); color: #e8d4a0; border: 1px solid rgba(184,136,76,0.5);
  z-index: 12; transition: background 0.2s, color 0.2s;
}
.floor-content[data-floor="3"] .bk-edit-toggle.on { background: #b8884c; color: #2a1810; font-weight: 600; }

/* ── ＋ 책추가하기 버튼 (✎ 배치 바꾸기 바로 위) ── */
.floor-content[data-floor="3"] .bk-add-toggle {
  position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
  padding: 9px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer;
  background: rgba(184,136,76,0.92); color: #2a1810; border: 1px solid rgba(212,184,120,0.85);
  z-index: 12; transition: transform .15s, background .2s; white-space: nowrap;
}
.floor-content[data-floor="3"] .bk-add-toggle:hover { background: #c9a84c; }
.floor-content[data-floor="3"] .bk-add-toggle:active { transform: translateX(-50%) translateY(1px); }

/* ── 책 검색·들이기 모달 (화면 전역 오버레이) ── */
#bk-add-modal { position: fixed; inset: 0; z-index: 200; display: none;
  background: rgba(15,8,6,0.82); backdrop-filter: blur(6px);
  align-items: flex-start; justify-content: center; padding: 4vh 16px; overflow-y: auto; }
#bk-add-modal.on { display: flex; }
.bam-panel { width: 100%; max-width: 680px; margin: auto;
  background: radial-gradient(120% 90% at 50% 0%, #3a2222 0%, #2a1818 60%, #1d1010 100%);
  border: 1px solid rgba(201,168,76,0.3); border-radius: 18px; padding: 22px 20px 26px;
  color: #f0ebe0; font-family: -apple-system,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
  box-shadow: 0 24px 60px rgba(0,0,0,0.6); }
.bam-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  border-bottom:1px solid rgba(201,168,76,0.28); padding-bottom:14px; margin-bottom:16px; }
.bam-head .t { font-family: Georgia,"Nanum Myeongjo",serif; font-size:19px; color:#f0ebe0; margin:0; }
.bam-head .t .eyebrow { display:block; font-size:11px; letter-spacing:.28em; color:#c9a84c; text-transform:uppercase; margin-bottom:6px; }
.bam-x { flex:0 0 auto; background:none; border:none; color:#a89a85; font-size:24px; line-height:1; cursor:pointer; padding:2px 6px; }
.bam-x:hover { color:#f0ebe0; }
.bam-search { display:flex; gap:9px; margin-bottom:8px; }
.bam-search input { flex:1; min-width:0; padding:14px 15px; font-size:16px; background:rgba(240,235,224,.06);
  border:1px solid rgba(201,168,76,.28); border-radius:12px; color:#f0ebe0; outline:none; }
.bam-search input:focus { border-color:#c9a84c; }
.bam-search button { flex:0 0 auto; padding:0 20px; font-size:15px; font-weight:600; background:#c9a84c; color:#2a1810; border:none; border-radius:12px; cursor:pointer; }
.bam-search button:disabled { opacity:.5; }
.bam-hint { font-size:12px; color:#a89a85; margin:0 2px 16px; }
.bam-hint b { color:#c9a84c; }
.bam-status { text-align:center; padding:24px 10px; color:#a89a85; font-size:14px; }
.bam-status.err { color:#e8b4a0; line-height:1.7; }
.bam-status.err b { color:#c9a84c; }
.bam-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px 12px; align-items:end; }
@media(max-width:520px){ .bam-grid{ grid-template-columns:repeat(2,1fr); } }
.bam-card { cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none; padding:0; color:inherit; text-align:center; }
.bam-cover { width:100%; display:flex; justify-content:center; align-items:flex-end; min-height:54px; filter:drop-shadow(0 8px 14px rgba(0,0,0,.5)); transition:transform .15s; }
.bam-card:active .bam-cover { transform:translateY(2px); }
.bam-cover img { width:100%; height:auto; display:block; border-radius:2px; }
.bam-noimg { width:100%; aspect-ratio:2/3; display:flex; align-items:center; justify-content:center;
  background:repeating-linear-gradient(135deg,#3a2c20,#3a2c20 8px,#332619 8px,#332619 16px);
  border:1px solid rgba(201,168,76,.28); border-radius:2px; font-size:11px; color:#a89a85; padding:8px; }
.bam-ct { font-size:12px; line-height:1.35; color:#f0ebe0; max-width:100%; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.bam-ca { font-size:10.5px; color:#a89a85; }
.bam-picked { margin-top:22px; border-top:1px solid rgba(201,168,76,.28); padding-top:18px; display:none; }
.bam-picked.on { display:block; animation:bamRise .3s ease; }
@keyframes bamRise { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:none;} }
.bam-picked h3 { font-family:Georgia,serif; font-size:15px; color:#c9a84c; margin:0 0 14px; }
.bam-preview { display:flex; gap:16px; align-items:flex-start; background:rgba(240,235,224,.04); border:1px solid rgba(201,168,76,.28); border-radius:13px; padding:16px; }
.bam-preview .pc { flex:0 0 96px; filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)); }

.bam-meta { flex:1; min-width:0; }

.bam-add:active { transform:translateY(1px); }

.bam-result.ng { display:block; color:#e8b4a0; }
.bam-result b { color:#c9a84c; }
.bam-result .sm { font-size:11px; opacity:.7; color:#a89a85; }

/* 진열대 UI — fixed → absolute (층 박스 기준) */
.floor-content[data-floor="3"] .bk-nav-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 56px; height: 56px;
  background: rgba(80,40,28,0.78); border: 1px solid rgba(212,184,120,0.7);
  color: var(--c-amber); font-size: 28px; line-height: 1; border-radius: 50%;
  cursor: pointer; z-index: 8; backdrop-filter: blur(8px);
  transition: background 0.2s, transform 0.2s;
}
.floor-content[data-floor="3"] .bk-nav-arrow:hover { background: rgba(110,60,40,0.95); transform: translateY(-50%) scale(1.08); }
.floor-content[data-floor="3"] .bk-nav-left  { left: max(20px, calc(50% - 580px)); }
.floor-content[data-floor="3"] .bk-nav-right { right: max(130px, calc(50% - 580px)); }
/* 좁은 화면: 엘리베이터(우측)와 안 겹치게 화살표를 더 안쪽으로 */
@media (max-width: 900px) {
  .floor-content[data-floor="3"] .bk-nav-left  { left: 8px; width: 44px; height: 44px; font-size: 22px; }
  .floor-content[data-floor="3"] .bk-nav-right { right: 92px; width: 44px; height: 44px; font-size: 22px; }
}
.floor-content[data-floor="3"] .bk-dots {
  position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; z-index: 8;
}
.floor-content[data-floor="3"] .bk-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: rgba(240,216,168,0.3); cursor: pointer; transition: all 0.3s;
}
.floor-content[data-floor="3"] .bk-dot.active { background: var(--c-amber); width: 24px; border-radius: 4px; }
.floor-content[data-floor="3"] .bk-hint {
  position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%);
  color: rgba(240,216,168,0.55); font-size: 12px; letter-spacing: 0.25em; z-index: 8;
}

/* === FlipBook 모달 — 레이어 2(z 50대)로 진입, 셸 엘리베이터(z200) 아래 === */
.book-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0); z-index: 60;
  pointer-events: none; opacity: 0; visibility: hidden;
  transition: opacity 0.5s ease, background 0.5s ease, visibility 0s linear 0.5s;
  display: flex; min-height: 100dvh; perspective: 1500px; overflow: hidden;
}
.book-modal.open {
  pointer-events: auto; opacity: 1; visibility: visible;
  transition: opacity 0.5s ease, background 0.5s ease, visibility 0s linear 0s;
  background: radial-gradient(circle farthest-corner at 50% 50%, hsl(187 20% 88%) 30%, hsl(149 20% 94%) 100%);
}
.book-modal .book {
  position: relative; display: flex; margin: auto;
  width: 32cqmin; pointer-events: none; transform-style: preserve-3d;
  transition: translate 1s; translate: calc(min(var(--c), 1) * 50%) 0%;
  rotate: 1 0 0 18deg;
}
.book-modal .page {
  --thickness: 4; flex: none; display: flex; width: 100%;
  font-size: 1.8cqmin; pointer-events: all; user-select: none;
  transform-style: preserve-3d; transform-origin: left center;
  transition: transform 1s, rotate 1s ease-in calc((min(var(--i), var(--c)) - max(var(--i), var(--c))) * 50ms);
  translate: calc(var(--i) * -100%) 0px 0px;
  transform: translateZ(calc((var(--c) - var(--i) - 0.5) * calc(var(--thickness) * .23cqmin)));
  rotate: 0 1 0 calc(clamp(0, var(--c) - var(--i), 1) * -180deg);
  cursor: pointer; box-shadow: 0 .5em 1em -.2em #00000020;
}
.book-modal .front, .book-modal .back {
  position: relative; flex: none; width: 100%; aspect-ratio: 1 / 1.47; backface-visibility: hidden;
  overflow: hidden; background-color: #fff; translate: 0px;
  display: flex; flex-flow: column nowrap; justify-content: flex-start;
  padding: 2.6em 2.4em 3.4em; border: 1px solid #0002;
}
.book-modal .front:has(.cover-bg), .book-modal .back:has(.cover-bg) { padding: 0; }
.book-modal .back { translate: -100% 0; rotate: 0 1 0 180deg; }
.book-modal .book { counter-reset: page -1; }
.book-modal .front::after, .book-modal .back::after {
  position: absolute; bottom: 1em; counter-increment: page; content: counter(page) ".";
  font-size: 0.75em; color: #b8a880; font-style: italic;
}
.book-modal .front::after { right: 1.5em; }
.book-modal .back::after  { left: 1.5em; }
.book-modal .cover::after { content: ""; }
.book-modal .front { background: linear-gradient(to left, #faf7f0 80%, #f0ebe0 100%); border-radius: .1em .5em .5em .1em; }
.book-modal .back  { background-image: linear-gradient(to right, #faf7f0 80%, #f0ebe0 100%); border-radius: .5em .1em .1em .5em; }
.book-modal .cover { color: hsl(200 30% 98%); padding: 0; }
.book-modal .cover-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.book-modal .page-content { width: 100%; height: 100%; display: flex; flex-direction: column; color: #1a1410; font-family: 'Cormorant Garamond', 'Noto Serif KR', Georgia, serif; }
.book-modal .page-content h2 { font-size: 1.25em; font-weight: 600; color: #2a1810; margin-bottom: 0.9em; line-height: 1.4; }
.book-modal .page-content p { font-size: 0.95em; line-height: 1.8; margin-bottom: 0.6em; text-align: justify; text-justify: inter-character; word-break: break-all; line-break: strict; overflow-wrap: anywhere; }
.book-modal .page-content .author-line { margin-top: auto; padding-top: 1em; font-style: italic; color: #8a7654; text-align: right; font-size: 0.85em; }
.book-modal .page-content .chapter-mark { font-style: italic; color: #b8a880; font-size: 0.8em; margin-bottom: 0.5em; letter-spacing: 0.1em; }
.book-modal .page-end { width: 100%; height: 100%; box-sizing: border-box; padding: 0 3.6em; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #2a1810; }
.book-modal .page-end h2 { font-style: italic; margin-bottom: 1em; font-size: 1.3em; }
.book-modal .page-end .author { font-style: italic; color: #8a7654; margin-top: 1em; }
.book-modal .page-end .book-title { color: #b8a880; font-size: 0.8em; margin-top: 1.5em; line-height: 1.75; }
.book-modal .modal-close {
  /* top:24px → 110px: 부모(maison/voyage)가 우상단에 얹는 '× 분더카머 떠나기'(도어 오버레이)와
     같은 자리에 겹쳐 클릭이 어려웠음(0704). 그 아래로 내려 두 버튼이 세로로 나란히 서게 함. */
  position: fixed; top: 110px; right: 24px; width: 42px; height: 42px;
  background: rgba(80,40,28,0.92); border: 1px solid rgba(212,184,120,0.7);
  color: var(--floor-accent, #f0d8a8); font-size: 22px; border-radius: 50%;
  cursor: pointer; z-index: 70; backdrop-filter: blur(8px);
}
.book-modal .modal-close:hover { background: rgba(110,60,40,0.95); }
.book-modal .modal-hint {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  color: rgba(40,30,20,0.5); font-size: 12px; letter-spacing: 0.15em; z-index: 70; font-style: italic;
}

/* ── 3F 책의 방 · 글쓰기 ✎ 버튼 + 입력 레이어 ── */
.book-modal .essay-write-btn {
  position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%);
  height: 48px; padding: 0 30px;
  background: rgba(80,40,28,0.94); border: 1px solid rgba(212,184,120,0.8);
  color: var(--floor-accent, #f0d8a8); font-size: 15.5px; border-radius: 24px;
  cursor: pointer; z-index: 75; backdrop-filter: blur(8px); display: none;

  box-shadow: 0 6px 20px rgba(0,0,0,0.35);

.book-modal .essay-write-btn:hover { background: rgba(110,60,40,0.95); }
.essay-editor {
  position: fixed; inset: 0; z-index: 90; display: none;
  background: rgba(20,14,8,0.72); backdrop-filter: blur(6px);
  align-items: center; justify-content: center; padding: 4vh 4vw;
}
.essay-editor.open { display: flex; }
.essay-editor .ee-paper {
  width: min(760px, 94vw); max-height: 92vh; display: flex; flex-direction: column;
  background: linear-gradient(#fbf8f0, #f4eee0); border-radius: 6px;

.essay-editor .ee-eyebrow {

}
.essay-editor .ee-book-title {
  font-family: 'Noto Serif KR', serif; font-size: 14px; color: #8a7654;
  text-align: center; margin-bottom: 18px;
}
.essay-editor .ee-title {
  width: 100%; font-family: 'Noto Serif KR', serif; font-size: 18px; font-weight: 600;
  color: #2a1810; background: transparent; border: none; border-bottom: 1px solid #d8ccb0;
  padding: 8px 2px; margin-bottom: 14px; outline: none; box-sizing: border-box;
}
.essay-editor .ee-title::placeholder { color: #c0b498; font-weight: 400; }
.essay-editor .ee-body {
  width: 100%; flex: 1; min-height: 200px; resize: none; box-sizing: border-box;

.essay-editor .ee-bar {

.essay-editor .ee-actions { display: flex; gap: 10px; }
.essay-editor .ee-btn {
  padding: 9px 22px; border-radius: 22px; font-size: 14px; cursor: pointer;

}
.essay-editor .ee-cancel { background: transparent; color: #8a7654; border-color: #d8ccb0; }
.essay-editor .ee-cancel:hover { background: #efe8d8; }
.essay-editor .ee-save { background: #6e4a32; color: #f4e8d4; }
.essay-editor .ee-save:hover { background: #855a3e; }
.essay-editor .ee-save:disabled { opacity: 0.5; cursor: default; }

/* ============================================================
 *  ⅡF 음악의 방 (Chambre de Musique) — 전부 [data-floor="2"] 스코프
 *  원본 music_room.html(감상실) → 셸 통합.
 *  세로 스크롤 페이지 → 스크롤 없는 한 화면 무대(도킹 좌표 안정화).
 *  유튜브 iframe은 여기 없음 — 레이어3 단일 미니 플레이어가 .ms-wall에 도킹.
 * ============================================================ */
.floor-content[data-floor="2"] {
  --ms-wood-1:#2a1f15; --ms-wood-2:#1a1208; --ms-line:#4a3a22;
  --ms-dim:#8a7654; --ms-dim2:#6b5838; --ms-text:#d4c5a0; --ms-bright:#e8d9b0;
  font-family:'Georgia','Noto Serif KR',serif; color:var(--ms-text);
  overflow:hidden; background:#0a0604;
  display:flex; flex-direction:column;
}
/* ── 상단: 비움 (모든 컨트롤은 하단 서랍으로) ── */

/* ── 음반 선반 (자켓 5칸 · LRU · 왼쪽=최근) ── */
.floor-content[data-floor="2"] .ms-shelf { display:flex; gap:10px; justify-content:center; align-items:flex-start; margin-top:11px; }
.floor-content[data-floor="2"] .ms-slot {
  position:relative; width:clamp(48px,6.2vw,64px); aspect-ratio:1; flex:none;
  border-radius:3px; cursor:pointer; transition:transform .25s ease, box-shadow .25s ease;
  background-size:cover; background-position:center;
  box-shadow:0 4px 12px rgba(0,0,0,.5), inset 0 0 0 1px rgba(212,165,72,.25);
}
.floor-content[data-floor="2"] .ms-slot:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.6), inset 0 0 0 1px rgba(212,165,72,.55); }
.floor-content[data-floor="2"] .ms-slot.empty {
  background:linear-gradient(180deg,#1a1208,#120c06); cursor:default;
  box-shadow:inset 0 0 0 1px rgba(74,58,34,.5); border:1px dashed rgba(74,58,34,.6);
}
.floor-content[data-floor="2"] .ms-slot.empty:hover { transform:none; box-shadow:inset 0 0 0 1px rgba(74,58,34,.5); }
/* 곡명 툴팁 — 평소 숨김, 호버/탭 시 */
.floor-content[data-floor="2"] .ms-slot .ms-slot-name {
  position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%) translateY(4px);
  background:rgba(20,14,8,.95); border:1px solid var(--ms-line); color:var(--ms-bright);
  font-size:10px; letter-spacing:.5px; font-style:italic; padding:4px 9px; border-radius:3px; white-space:nowrap;
  opacity:0; pointer-events:none; transition:all .2s; z-index:8;
}
.floor-content[data-floor="2"] .ms-slot:not(.empty):hover .ms-slot-name,
.floor-content[data-floor="2"] .ms-slot.show-name .ms-slot-name { opacity:1; transform:translateX(-50%) translateY(0); }


/* ── 무대 ── */
.floor-content[data-floor="2"] .ms-stage { position:absolute; inset:0; z-index:1; container-type:size; display:grid; place-items:center; overflow:hidden; }
.floor-content[data-floor="2"] .ms-room {
  position:relative; aspect-ratio:1672/941;
  width:max(100cqw, calc(100cqh * 1672 / 941));
  background-size:cover; background-position:center; transition:background-image .6s ease;
}

.floor-content[data-floor="2"] .ms-room { grid-area:1/1; }
.floor-content[data-floor="2"] .ms-room-name { font-size:11px; letter-spacing:2px; color:#8a7654; font-style:italic; margin-top:4px; }
/* 벽 스크린 = 도킹 타겟 (iframe 없음 · 검은 무대 + 호박빛 글로우) */
.floor-content[data-floor="2"] .ms-wall {
  position:absolute; background:#000; overflow:hidden;
  box-shadow:inset 0 0 60px rgba(0,0,0,.9), 0 0 40px rgba(255,200,100,.15);
}
.floor-content[data-floor="2"] .ms-wall::before { content:''; position:absolute; inset:-2px; box-shadow:inset 0 0 20px rgba(255,180,100,.1); pointer-events:none; z-index:2; }
.floor-content[data-floor="2"] .ms-wall-hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#5a4a30; font-size:11px; letter-spacing:3px; font-style:italic; text-align:center; padding:12px; }
/* 진공관 7 */
.floor-content[data-floor="2"] .ms-tube { position:absolute; aspect-ratio:1; border-radius:50%; pointer-events:none; mix-blend-mode:screen; }
.floor-content[data-floor="2"] .ms-tube::before {
  content:''; position:absolute; inset:0; border-radius:50%; filter:blur(2px);
  background:radial-gradient(circle at center, var(--tc1) 0%, var(--tc2) 20%, var(--tc3) 45%, var(--tc4) 75%, transparent 100%);
}
@keyframes ms-flicker { 0%,100%{opacity:.85;transform:scale(1)} 25%{opacity:1;transform:scale(1.03)} 50%{opacity:.78;transform:scale(.98)} 75%{opacity:.92;transform:scale(1.01)} }
/* VU 2 */
.floor-content[data-floor="2"] .ms-vu { position:absolute; width:3.2%; aspect-ratio:2.2/1; pointer-events:none; }
.floor-content[data-floor="2"] .ms-vu svg { width:100%; height:100%; overflow:visible; }
.floor-content[data-floor="2"] .ms-needle { transform-origin:50% 95%; stroke-width:1.8; stroke-linecap:round; fill:none; }
@keyframes ms-vu-swing {
  0%{transform:rotate(calc(-1 * var(--ms-vu-range,12deg)))} 15%{transform:rotate(calc(-.25 * var(--ms-vu-range,12deg)))}
  25%{transform:rotate(calc(-.65 * var(--ms-vu-range,12deg)))} 40%{transform:rotate(calc(.35 * var(--ms-vu-range,12deg)))}
  50%{transform:rotate(calc(-.4 * var(--ms-vu-range,12deg)))} 65%{transform:rotate(calc(.6 * var(--ms-vu-range,12deg)))}
  75%{transform:rotate(calc(-.15 * var(--ms-vu-range,12deg)))} 85%{transform:rotate(calc(-.75 * var(--ms-vu-range,12deg)))} 100%{transform:rotate(calc(-1 * var(--ms-vu-range,12deg)))}
}
/* 헤더 도구: 🎲 다른 음악실 / ♪ 음반 고르기 */
.floor-content[data-floor="2"] .ms-tools { display:flex; gap:8px; justify-content:center; margin-top:9px; flex-wrap:wrap; }
.floor-content[data-floor="2"] .ms-shuffle, .floor-content[data-floor="2"] .ms-crate {
  background:rgba(20,14,8,.6); border:1px solid var(--ms-line); color:var(--ms-dim);
  padding:5px 13px; font-family:inherit; font-size:10px; letter-spacing:1px;
  cursor:pointer; border-radius:2px; transition:all .2s;
}
.floor-content[data-floor="2"] .ms-shuffle:hover, .floor-content[data-floor="2"] .ms-crate:hover { color:var(--ms-text); border-color:var(--ms-dim2); }

/* ── 하단 정보: 명패(항상) + 마리 노트(접힘, 버튼으로 펼침) ── */
.floor-content[data-floor="2"] .ms-info {
  position:absolute; bottom:0; left:0; right:0; z-index:95; display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap;
  padding:24px 20px clamp(20px,4vh,32px); pointer-events:none;
  background:linear-gradient(0deg, rgba(8,5,3,.9) 0%, rgba(8,5,3,.5) 55%, rgba(8,5,3,0) 100%);
}
.floor-content[data-floor="2"] .ms-info > * { pointer-events:auto; }

/* ── 하단 2중 버튼: ☰ 토글 + 슬라이드 서랍 ── */
.floor-content[data-floor="2"] .ms-menu { position:relative; flex:none; display:flex; align-items:center; }
.floor-content[data-floor="2"] .ms-menu-toggle {
  flex:none; width:46px; height:38px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,#c9a84c,#8a6a2a 60%,#5a3f14); border:1px solid #d8c078;
  color:#2a1c08; font-size:16px; border-radius:3px; cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.4); transition:transform .18s, background .25s;
}
.floor-content[data-floor="2"] .ms-menu-toggle:hover { transform:scale(1.06); }
.floor-content[data-floor="2"] .ms-menu-toggle.open { background:linear-gradient(160deg,#7a5c28,#4a3410); color:#e8d9b0; }
.floor-content[data-floor="2"] .ms-drawer {
  position:absolute; right:0; bottom:calc(100% + 12px); z-index:96;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  padding:14px 18px 16px; border-radius:10px; max-width:min(92vw,380px);
  background:linear-gradient(180deg, rgba(26,18,10,.96), rgba(14,9,4,.98));
  border:1px solid var(--ms-line); box-shadow:0 16px 48px rgba(0,0,0,.66);
  opacity:0; transform:translateY(14px) scale(.97); transform-origin:bottom right; pointer-events:none;
  transition:opacity .3s ease, transform .32s cubic-bezier(.4,.7,.3,1);
}
.floor-content[data-floor="2"] .ms-drawer.open { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.floor-content[data-floor="2"] .ms-drawer .ms-room-name { margin-top:0; }
.floor-content[data-floor="2"] .ms-drawer .ms-tools { margin-top:2px; }
.floor-content[data-floor="2"] .ms-drawer .ms-shelf { margin-top:4px; }

/* ── 배치 편집기 (살롱지기 전용) ── */
.ms-edit-toggle { position:fixed; left:70px; top:20px; z-index:120; display:none;
  padding:8px 15px; background:rgba(20,14,8,.88); border:1px solid #d4a548; color:#e8d9b0;
  font-family:'Cormorant Garamond',serif; font-size:12px; letter-spacing:1px; border-radius:20px;

.ms-edit-panel { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:121; display:none;

.ms-edit-panel .ep-title { letter-spacing:1px; color:#d4a548; white-space:nowrap; }

.ms-edit-panel .ep-save { background:linear-gradient(160deg,#c9a84c,#8a6a2a); border-color:#d8c078; color:#2a1c08; }
.ms-edit-panel .ep-exit { background:rgba(60,40,30,.5); border-color:#7a5a3a; color:#e8d9b0; }
.floor-content[data-floor="2"] .ms-wall-resize { display:none; position:absolute; right:-9px; bottom:-9px; width:18px; height:18px;
  border-radius:50%; background:#d4a548; border:2px solid #2a1c08; cursor:nwse-resize; z-index:6; }
.floor-content[data-floor="2"] .ms-room.ms-editing .ms-wall { outline:2px dashed #d4a548; outline-offset:-1px; cursor:move;
  pointer-events:auto; background:rgba(212,165,72,.12); }
.floor-content[data-floor="2"] .ms-room.ms-editing .ms-wall-resize { display:block; }
.floor-content[data-floor="2"] .ms-room.ms-editing .ms-tube { outline:2px solid #ffd86a; outline-offset:3px; cursor:move; pointer-events:auto; z-index:22; }
.floor-content[data-floor="2"] .ms-room.ms-editing .ms-vu { outline:2px solid #6ad0ff; outline-offset:2px; cursor:move; pointer-events:auto; z-index:22; }
.floor-content[data-floor="2"] .ms-plate { display:flex; align-items:baseline; gap:14px; padding:9px 18px; background:linear-gradient(180deg,#2a1f15,#1a1208); border:1px solid var(--ms-line); border-radius:2px; box-shadow:0 4px 18px rgba(0,0,0,.5); flex-wrap:wrap; justify-content:center; }
.floor-content[data-floor="2"] .ms-plate .pt { font-size:15px; color:var(--ms-bright); font-style:italic; }
.floor-content[data-floor="2"] .ms-plate .pc { font-size:9px; letter-spacing:2px; color:var(--ms-dim); }
.floor-content[data-floor="2"] .ms-plate .pm { font-size:9px; color:var(--ms-dim2); font-style:italic; }
.floor-content[data-floor="2"] .ms-note-btn {

.floor-content[data-floor="2"] .ms-note-sheet {
  position:fixed; left:50%; bottom:0; transform:translateX(-50%) translateY(112%);
  width:min(560px,92vw); background:linear-gradient(135deg,#f4e8c8,#e8d4a0); color:#3a2a18;
  padding:20px 24px 26px; border-radius:10px 10px 0 0; box-shadow:0 -8px 44px rgba(0,0,0,.6);
  z-index:140; transition:transform .42s cubic-bezier(.4,.7,.3,1);
}
.floor-content[data-floor="2"] .ms-note-sheet.open { transform:translateX(-50%) translateY(0); }
.floor-content[data-floor="2"] .ms-note-sheet .sheet-close { position:absolute; top:8px; right:14px; background:none; border:none; color:#6b4818; font-size:20px; cursor:pointer; line-height:1; }
.floor-content[data-floor="2"] .ms-note-sheet .nl { font-size:9px; letter-spacing:3px; color:#8a6a3a; margin-bottom:9px; }
.floor-content[data-floor="2"] .ms-note-sheet .nb { font-size:13px; line-height:1.75; color:#3a2a18; max-height:56vh; overflow-y:auto; scrollbar-width:none; -ms-overflow-style:none; }

/* 토스트 (음반 서고 안내 등) */
.ms-toast {
  position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(10px);
  background:rgba(20,14,8,.95); border:1px solid #d4a548; color:#e8d9b0;
  padding:10px 20px; font-size:12px; letter-spacing:1px; border-radius:4px; z-index:150;
  opacity:0; pointer-events:none; transition:all .35s; font-family:'Noto Serif KR',serif; white-space:nowrap;
}
.ms-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ============================================================
 *  음악 미니 플레이어 — 레이어3 위, 단일 iframe.
 *  영상 알맹이(mp-frame)는 위치·크기만 이동(DOM 안 옮김 → 재생 안 끊김).
 *  옷(skin)만 상태 따라 크로스페이드: dock(벽) ↔ mini(좌하단) ↔ folded(알약).
 * ============================================================ */
.music-player {
  position:fixed; z-index:90; pointer-events:none;
  left:0; top:0; width:0; height:0;
  transition:left .6s cubic-bezier(.4,.7,.3,1), top .6s cubic-bezier(.4,.7,.3,1),
             width .6s cubic-bezier(.4,.7,.3,1), height .6s cubic-bezier(.4,.7,.3,1);
}
.music-player.hidden { display:none; }
.music-player .mp-frame { position:absolute; inset:0; overflow:hidden; background:#000; pointer-events:auto; transition:opacity .4s ease, box-shadow .45s ease, border-radius .45s ease; }
.music-player .mp-frame iframe { width:100%; height:100%; border:0; display:block; }
.music-player .mp-prime { position:absolute; inset:0; z-index:3; display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; cursor:pointer; background:rgba(8,5,3,.35); transition:background .2s; }
.music-player.priming .mp-prime { display:flex; }
.music-player .mp-prime .pr-play { font-size:clamp(26px,5vw,38px); color:rgba(232,217,176,.92); text-shadow:0 0 20px rgba(255,200,120,.5); }
.music-player .mp-prime .pr-txt { font-family:'Cormorant Garamond',serif; font-size:12px; letter-spacing:2px; color:rgba(212,197,160,.8); }
.music-player .mp-prime:hover { background:rgba(8,5,3,.18); }

/* 옷1 — 벽 도킹 */
.music-player .skin-wall { position:absolute; inset:-2px; pointer-events:none; opacity:0; transition:opacity .45s ease; box-shadow:inset 0 0 20px rgba(255,180,100,.1); }
.music-player.dock .skin-wall { opacity:1; }
.music-player.dock .mp-frame { box-shadow:inset 0 0 60px rgba(0,0,0,.9), 0 0 40px rgba(255,200,100,.15); border-radius:0; }

/* 옷2 — 좌하단 미니 */
.music-player .skin-mini { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .45s ease; border-radius:8px; border:1px solid #d4a548; box-shadow:0 10px 34px rgba(0,0,0,.65); }
.music-player.mini .skin-mini { opacity:1; }
.music-player.mini .mp-frame { border-radius:8px; box-shadow:none; }
.music-player .mp-bar { position:absolute; top:-32px; left:0; right:0; height:28px; display:flex; align-items:center; justify-content:space-between; gap:6px; pointer-events:none; opacity:0; transition:opacity .45s ease; }
.music-player.mini .mp-bar { opacity:1; pointer-events:auto; }
.music-player .mp-return {
  display:inline-flex; align-items:center; gap:5px;
  background:linear-gradient(160deg,#c9a84c,#8a6a2a 60%,#5a3f14); border:1px solid #d8c078;
  color:#2a1c08; font-family:'Cormorant Garamond',serif; font-size:10.5px; letter-spacing:1px;
  padding:4px 11px; border-radius:3px; cursor:pointer; white-space:nowrap;
  box-shadow:0 3px 10px rgba(0,0,0,.4); transition:transform .15s;
}
.music-player .mp-return:hover { transform:translateY(-1px); }
.music-player .mp-fold { width:26px; height:24px; background:rgba(20,14,8,.92); border:1px solid #d4a548; color:#d4a548; border-radius:3px; cursor:pointer; font-size:13px; line-height:1; flex:none; transition:background .2s; }
.music-player .mp-fold:hover { background:rgba(40,28,16,1); }

/* 옷3 — 접힘(알약). 끄기 아님 · 음악 계속 */
.music-player.folded { width:auto !important; height:auto !important; }
.music-player.folded .mp-frame { opacity:0; pointer-events:none; }
.music-player.folded .skin-wall, .music-player.folded .skin-mini, .music-player.folded .mp-bar { opacity:0; pointer-events:none; }
.music-player .mp-pill {
  display:none; align-items:center; gap:9px; pointer-events:auto;
  background:linear-gradient(180deg,#2a1f15,#1a1208); border:1px solid #d4a548; color:#e8d9b0;
  padding:9px 15px; border-radius:22px; cursor:pointer; font-family:'Cormorant Garamond',serif;
  font-size:11px; letter-spacing:1px; box-shadow:0 8px 24px rgba(0,0,0,.6); white-space:nowrap;
}
.music-player.folded .mp-pill { display:inline-flex; }
.music-player .mp-eq { display:inline-flex; align-items:flex-end; gap:2px; height:13px; }
.music-player .mp-eq i { width:2.5px; background:#d4a548; border-radius:1px; animation:mp-eq 1s ease-in-out infinite; }
.music-player .mp-eq i:nth-child(1){ height:40%; animation-delay:0s }
.music-player .mp-eq i:nth-child(2){ height:90%; animation-delay:.2s }
.music-player .mp-eq i:nth-child(3){ height:60%; animation-delay:.4s }
.music-player .mp-eq i:nth-child(4){ height:100%; animation-delay:.1s }
@keyframes mp-eq { 0%,100%{transform:scaleY(.4)} 50%{transform:scaleY(1)} }

/* ============================================================
 *  음반 서고 모달 (Library) — 레이어2 · 살굿빛 크림 살롱
 *  원본 lp_room.html → 전부 .library-modal 스코프로 가둠.
 *  페이지 점프 대신 셸 내부에서 MusicPlayer.play() 호출.
 * ============================================================ */
.library-modal {
  position:fixed; inset:0; z-index:60; opacity:0; pointer-events:none;
  /* ★ visibility:hidden — 닫힌 서고가 클릭을 먹지 못하게 하는 핵심.
     커버플로우 layout()이 카드에 인라인 pointerEvents:auto를 심어
     부모 pointer-events:none을 뚫고 전 층의 클릭을 가로채던 유령 사고(0703~0704)의 뿌리.
     visibility만이 자식 인라인 스타일까지 히트테스트에서 제외한다. (book-modal과 동일 패턴) */
  visibility:hidden;
  background:radial-gradient(ellipse 90% 70% at 50% 35%, #fdf2e6 0%, #f5e3d0 45%, #ecd0b8 100%);
  font-family:'Georgia','Noto Serif KR',serif; color:#6b4a3a; user-select:none;
  transition:opacity .5s ease, visibility 0s linear .5s; overflow:hidden;
}
.library-modal.open { opacity:1; pointer-events:auto; visibility:visible;
  transition:opacity .5s ease, visibility 0s linear 0s; }
.library-modal .lib-room { position:absolute; inset:0; z-index:0; overflow:hidden; }
.library-modal .lib-wall { position:absolute; inset:0 0 32% 0; background:linear-gradient(180deg,rgba(253,240,226,.7) 0%,rgba(248,220,200,.5) 50%,rgba(240,205,185,.4) 100%); }
.library-modal .lib-wall::before { content:''; position:absolute; inset:0; opacity:.7;
  background:repeating-linear-gradient(90deg,transparent 0,transparent 220px,rgba(180,130,100,.08) 220px,rgba(180,130,100,.08) 221px,transparent 221px,transparent 260px,rgba(255,240,220,.3) 260px,rgba(255,240,220,.3) 261px,transparent 261px,transparent 480px); }
.library-modal .lib-floor { position:absolute; bottom:0; left:0; right:0; height:32%; transform:perspective(900px) rotateX(38deg); transform-origin:top;
  background:linear-gradient(180deg,rgba(232,200,178,.7) 0%,rgba(210,175,150,.85) 100%); }
.library-modal .lib-floor::before { content:''; position:absolute; inset:0;
  background:repeating-linear-gradient(90deg,transparent 0,transparent 90px,rgba(160,110,80,.18) 90px,rgba(160,110,80,.18) 91px,transparent 91px,transparent 180px); }

.library-modal .lib-close {
  position:absolute; top:20px; right:24px; z-index:30; width:42px; height:42px; border-radius:50%;
  background:rgba(255,245,235,.7); border:1px solid rgba(180,130,100,.4); color:#8a5a42;
  font-size:22px; cursor:pointer; backdrop-filter:blur(8px); transition:all .25s; line-height:1;
}
.library-modal .lib-close:hover { background:rgba(255,250,245,.95); color:#6b3a28; transform:scale(1.08); }
.library-modal .lib-return {
  margin-top:12px; padding:9px 22px; border-radius:22px;
  background:rgba(120,70,50,.14); border:1px solid rgba(140,90,70,.55);
  color:#9a6248; font-size:13px; letter-spacing:1.5px; cursor:pointer;
  font-family:inherit; transition:all .2s;
}
.library-modal .lib-return:hover { background:rgba(140,90,70,.92); color:#fff5ed; border-color:rgba(140,90,70,.92); }
.library-modal .lib-return:disabled { opacity:.5; cursor:default; }

.library-modal .lib-header { position:absolute; top:0; left:0; right:0; z-index:6; text-align:center; padding:26px 24px 12px; }
.library-modal .lib-eyebrow { font-size:11px; letter-spacing:4px; color:#b58a6e; text-transform:uppercase; }
.library-modal .lib-divider { height:1px; max-width:380px; margin:10px auto; background:linear-gradient(90deg,transparent,#b58a6e,transparent); }
.library-modal .lib-title { font-size:22px; color:#6b4a3a; font-style:italic; letter-spacing:2px; }
.library-modal .lib-sub { font-size:12px; color:#a07c66; margin-top:6px; letter-spacing:1.5px; }

.library-modal .lib-digging { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:100%; height:480px; perspective:1800px; perspective-origin:center center; z-index:5; }
.library-modal .lib-stage { position:relative; width:100%; height:100%; transform-style:preserve-3d; }

.library-modal .lp-card {
  position:absolute; top:50%; left:50%; width:340px; height:340px; margin:-170px 0 0 -170px;
  transform-style:preserve-3d; cursor:pointer; will-change:transform,opacity;
  transition:transform .6s cubic-bezier(.22,1,.36,1), opacity .6s ease, filter .6s ease;
}
.library-modal .lp-card .cover { position:relative; width:100%; height:100%; background-size:cover; background-position:center; background-repeat:no-repeat; border-radius:2px;
  box-shadow:0 30px 60px rgba(120,70,50,.35), 0 10px 20px rgba(120,70,50,.25), inset 0 0 0 1px rgba(255,240,220,.15); }
.library-modal .lp-card .disc { position:absolute; top:50%; right:-38px; width:280px; height:280px; margin-top:-140px; border-radius:50%; z-index:-1; opacity:.75; box-shadow:0 0 12px rgba(0,0,0,.6);
  background:radial-gradient(circle at center,#1a1208 0%,#2a1f12 8%,#0a0604 12%,#1a1208 14%,#0a0604 16%,#1a1208 100%); }
.library-modal .lp-card .disc::before { content:''; position:absolute; top:50%; left:50%; width:90px; height:90px; margin:-45px 0 0 -45px; border-radius:50%;
  background:radial-gradient(circle,#8a5a2a 0%,#5a3a1a 100%); box-shadow:inset 0 0 0 2px rgba(255,220,160,.2); }
.library-modal .lp-card .disc::after { content:''; position:absolute; inset:0; border-radius:50%; pointer-events:none;
  background:repeating-radial-gradient(circle,transparent 0,transparent 3px,rgba(255,220,160,.04) 3px,rgba(255,220,160,.04) 4px); }
.library-modal .lp-card.shaking { animation:lib-shake .6s ease; }
@keyframes lib-shake { 0%,100%{transform:var(--base-transform)} 20%{transform:var(--base-transform) translateX(-10px)} 40%{transform:var(--base-transform) translateX(10px)} 60%{transform:var(--base-transform) translateX(-7px)} 80%{transform:var(--base-transform) translateX(7px)} }

.library-modal .lib-nav { position:absolute; top:50%; transform:translateY(-50%); width:56px; height:56px; border-radius:50%; z-index:20;
  background:rgba(255,245,235,.7); border:1px solid rgba(180,130,100,.4); color:#8a5a42; font-family:'Georgia',serif; font-size:28px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .3s; backdrop-filter:blur(8px); box-shadow:0 4px 12px rgba(180,130,100,.2); }
.library-modal .lib-nav:hover { background:rgba(255,250,245,.95); border-color:rgba(140,90,70,.6); color:#6b3a28; transform:translateY(-50%) scale(1.08); }
.library-modal .lib-nav:active { transform:translateY(-50%) scale(.96); }
.library-modal .lib-prev { left:40px; } .library-modal .lib-next { right:40px; }

.library-modal .lib-indicator { position:absolute; bottom:48px; left:50%; transform:translateX(-50%); z-index:10; text-align:center; }
.library-modal .lib-ind-text { font-size:15px; color:#8a5a42; letter-spacing:2px; }
.library-modal .lib-ind-text #lib-cur { font-size:20px; color:#6b3a28; font-style:italic; }
.library-modal .lib-ind-sub { font-size:10px; letter-spacing:2px; color:#a07c66; margin-top:4px; text-transform:uppercase; }

.library-modal .lib-toast { position:absolute; bottom:120px; left:50%; transform:translateX(-50%) translateY(10px); z-index:25;
  background:rgba(107,58,40,.95); color:#fdf2e6; padding:10px 22px; font-size:13px; letter-spacing:1px; border-radius:4px; opacity:0; pointer-events:none; transition:all .35s; }
.library-modal .lib-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width:760px){
  .library-modal .lp-card { width:240px; height:240px; margin:-120px 0 0 -120px; }
  .library-modal .lib-nav { width:46px; height:46px; font-size:24px; }
  .library-modal .lib-prev { left:14px; } .library-modal .lib-next { right:14px; }
  .library-modal .lib-title { font-size:18px; }
}

/* ============================================================
 *  레이어 2 — 모달 (비어둠)
 * ============================================================ */
/* ============================================================
 *  폰 전용 — 1층 3D 방 경량화 (iOS Safari GPU 메모리 크래시 방지)
 *  데스크탑 분위기는 그대로 두고, 폰에서만 무거운 그림자를 덜어낸다.
 *  최대 범인: 2000px 거대 면의 inset 100px 블러 그림자 + 액자 drop-shadow.
 * ============================================================ */
@media (max-width:760px){
  .floor-content[data-floor="1"] .g1-wall-front,
  .floor-content[data-floor="1"] .g1-wall-right,
  .floor-content[data-floor="1"] .g1-wall-back,
  .floor-content[data-floor="1"] .g1-wall-left,
  .floor-content[data-floor="1"] .g1-ceiling { box-shadow:none !important; }
  .floor-content[data-floor="1"] .g1-frame { box-shadow:2px 5px 10px rgba(0,0,0,.6) !important; }
  .floor-content[data-floor="1"] .g1-hframed .g1-fimg { filter:drop-shadow(2px 4px 6px rgba(0,0,0,.55)) !important; }
  .floor-content[data-floor="1"] .g1-nav { backdrop-filter:none !important; -webkit-backdrop-filter:none !important; background:rgba(80,40,28,.92) !important; }
}

.modal-layer { position: fixed; inset: 0; z-index: 50; pointer-events: none; }

/* ============================================================
 *  레이어 3 — 화면 고정
 * ============================================================ */
.fixed-layer { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
.fixed-layer > * { pointer-events: auto; }

.floor-label {
  position: fixed; top: 22px; left: 50%; transform: translateX(-50%); text-align: center;
  font-family: 'Cormorant Garamond', serif; color: var(--floor-accent);
  text-shadow: 0 2px 14px rgba(0,0,0,0.9);
}
.floor-label .fl-name { font-size: 14px; letter-spacing: 4px; }
.floor-label .fl-floor { font-size: 10px; letter-spacing: 3px; color: var(--floor-text-dim); margin-top: 3px; }

.mini-player-slot { position: fixed; bottom: 26px; left: 22px; }

/* ===== 닻 — 층 안내판 (빠른 길) ===== */
.anchor { position: fixed; bottom: 26px; right: 22px; }
.wk-exit-star {
  position: fixed; top: 14px; left: 14px; z-index: 950;
  padding: 8px 15px; border-radius: 20px;
  background: linear-gradient(145deg, #3a2c10, #241809);
  border: 1px solid rgba(201,168,76,0.5);
  color: #e9c97e; font-family: 'Cormorant Garamond', serif;
  font-size: 13px; letter-spacing: 1px; cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,0.5);
  transition: transform 0.15s, box-shadow 0.15s;
}

/* ===== 음소거 토글 ===== */

}

/* ============================================================
 *  전환 — 엘리베이터 (z 200)
 *  구조: [상단 안내 bar] + [그 아래 좌우 문]
 * ============================================================ */
.elevator { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
.elevator.active { pointer-events: auto; }

/* --- 상단 안내 bar (문에서 분리·탑승 중 늘 떠 있음) --- */
.elevator-bar {
  position: absolute; top: 0; left: 50%; transform: translate(-50%, -100%);
  display: flex; align-items: center; gap: 12px;
  padding: 14px 26px 16px;
  background: linear-gradient(180deg, #2a1d0c 0%, #1a1206 70%, #120c04 100%);
  border: 1px solid rgba(201,168,76,0.45);
  border-top: none;
  border-radius: 0 0 14px 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 -2px 10px rgba(0,0,0,0.5);
  z-index: 3; /* 문보다 위 */
  transition: transform 0.5s cubic-bezier(0.3,0.8,0.3,1);
}
.elevator.riding .elevator-bar { transform: translate(-50%, 0); } /* 탑승 중 내려와 자리잡음 */

.dial-lamp {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif; font-size: 17px;
  color: rgba(201,168,76,0.30);
  border: 1px solid rgba(201,168,76,0.22);
  background: radial-gradient(circle at 40% 35%, rgba(40,30,16,0.8), rgba(15,10,4,0.9));
  transition: all 0.18s ease;
}
.dial-lamp.lit {
  color: #1a1208;
  background: radial-gradient(circle at 40% 35%, #ffe7a0, #d8a838);
  border-color: #ffe7a0;
  box-shadow: 0 0 20px rgba(255,210,120,0.85);
  transform: scale(1.06);
}

/* --- 좌우 문 (bar 아래에서만 여닫이) --- */
.doors {
  position: absolute; left: 0; right: 0; bottom: 0;
  top: 0; /* 0628: 문을 화면 맨 위까지 — 등불 bar(z3)를 그 위에 포갬 */
  z-index: 1;
}
.door {
  position: absolute; top: 0; bottom: 0; width: 50.5%;
  background-image: url('elevator_01.webp');
  background-size: 200% 100%;   /* 두 짝 합쳐 한 장 — 세로 결이라 가로 늘어남 안 보임 */
  background-repeat: no-repeat;
  background-color: #241808;     /* 이미지 로딩 전 fallback */
  box-shadow: inset 0 0 120px rgba(0,0,0,0.45);
  transition: transform var(--t-open-dur) cubic-bezier(0.55, 0, 0.30, 1);
}
.door::before {
  content: ''; position: absolute; inset: 0;
  box-shadow: inset 0 0 70px rgba(0,0,0,0.35);
  pointer-events: none;
}
.door-left  { left: 0;  transform: translateX(-101%); background-position: left center; }
.door-right { right: 0; transform: translateX(101%); background-position: right center; }
.elevator.closing .door-left,
.elevator.closing .door-right { transform: translateX(0); }

.door-seam {
  position: absolute; top: 0; bottom: 0; left: 50%; width: 2px;
  transform: translateX(-50%); z-index: 2;
  background: linear-gradient(180deg, transparent, rgba(240,210,120,0.5), transparent);
  opacity: 0; transition: opacity 0.3s;
}
.elevator.closing .door-seam { opacity: 1; }

/* ===== 첫 진입 힌트 / 버전 ===== */
.boot-hint {
  position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
  font-family: 'Cormorant Garamond', serif; font-size: 11px; letter-spacing: 2px;
  color: rgba(240,216,168,0.45); z-index: 100; text-align: center; pointer-events: none;

}
.version-badge {

}

  /* ── 책 모달 오버레이 ── */
  .f4book-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(42,32,20,0.0);
    z-index: 9500;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: background 1.2s ease;
  }
  .f4book-modal-overlay.open { display: flex; }
  .f4book-modal-overlay.bg-light { background: rgba(200,190,170,0.85); }

  /* ── 3D 표지 씬 ── */
  .f4cover-scene {
    perspective: 900px;
    perspective-origin: 50% 45%;
    position: relative;
  }
  .f4cover-book-3d {
    width: 200px; height: 280px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateY(-26deg) rotateX(4deg);
    transition: transform 0.5s cubic-bezier(0.23,1,0.32,1);
    will-change: transform;
    cursor: pointer;
  }
  .f4cover-face-front {
    position: absolute;
    width: 200px; height: 280px;
    border-radius: 0 5px 5px 0;
    overflow: hidden;
    backface-visibility: hidden;

  /* ── 내부 페이지 래퍼 (3D 표지에서 전환) ── */

  /* 필레몬 페이지 */
  .f4page-philemon {

  .f4letter-lines-bg {
    position: absolute; inset: 0;

    pointer-events: none;
  }
  .f4letter-text {
    position: relative;
    font-family: 'Noto Serif KR', Georgia, serif;

    color: #2A1F0A;

  }
  .f4letter-sig {
    font-size: 10px;
    color: rgba(100,80,40,0.4);

    font-family: 'Courier New', monospace;
    letter-spacing: 0.1em;

  #f4bookPages {
    flex: 1;
    overflow: hidden;
    min-height: 0;
    position: relative;
    height: 460px;
  }

  /* ── 새 네비: 좌우 클릭 영역 + 도트 ── */
  .f4book-nav {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  /* 좌/우 탭 영역 */
  .f4book-nav-zone {
    position: absolute;
    top: 0; bottom: 0;
    width: 44%;
    pointer-events: all;
    cursor: pointer;
    display: flex; align-items: center;
    opacity: 0;
    transition: opacity 0.2s;

  .f4book-nav-zone.left  { left: 0; justify-content: flex-start; padding-left: 10px; }

  .f4book-page-dots {
    position: absolute;

  .f4book-page-dots {
    display: flex; gap: 5px;
  }
  .f4book-page-dot {

  .f4book-close-btn {

    color: rgba(201,168,76,0.7);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;

/* ═══════════ ⅤF 페르소나 월 (Le Mur des Visages) — 세로 스크롤 벽 · 4층 본보기 ═══════════ */
.floor-content[data-floor="5"]{ overflow:hidden; background:#140a0e; }
.floor-content[data-floor="5"] .f5-scroll{
  position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;

}
.floor-content[data-floor="5"] .f5-scroll::-webkit-scrollbar{ display:none; width:0; height:0; }
.floor-content[data-floor="5"] .f5-stage{
  position:relative; width:100%; aspect-ratio:941/1672; min-height:100%;
}
.floor-content[data-floor="5"] .f5-bgwrap{
  position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(64,48,34,.42), transparent 72%),
    linear-gradient(168deg,#241c14 0%,#1a140e 50%,#0e0a07 100%);
}
.floor-content[data-floor="5"] .f5-bg-layer{

}
.floor-content[data-floor="5"] .f5-wall{ position:absolute; inset:0; z-index:2; }
.floor-content[data-floor="5"] .f5-frame{
  position:absolute; transform:translate(-50%,-50%) rotate(var(--rot,0deg));
  cursor:pointer; transition:transform .2s ease, filter .2s ease;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.55));
}
.floor-content[data-floor="5"] .f5-frame:hover{
  transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1.05);
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.7)); z-index:5;
}
.floor-content[data-floor="5"] .f5-frame-img{ display:block; width:100%; height:auto; border-radius:1px; }
/* 액자 아래 작은 이름 명패 (셰익스피어 앤 컴퍼니 흰 라벨) */
.floor-content[data-floor="5"] .f5-plate{
  position:absolute; left:50%; top:100%; transform:translateX(-50%);
  margin-top:4px; max-width:150%; padding:1px 6px;
  background:#f2ebdd; color:#26211a;
  font-family:'Noto Serif KR',serif; font-weight:500;
  font-size:clamp(6.5px,0.95vw,10.5px); letter-spacing:.01em; line-height:1.35;
  white-space:nowrap; border-radius:1px;
  box-shadow:0 1px 3px rgba(0,0,0,.4); pointer-events:none;
}
/* ── 편집 모드 ── */
.floor-content[data-floor="5"] .f5-stage.editing .f5-bgwrap{ filter:brightness(.78) saturate(.9); transition:filter .4s ease; }
.floor-content[data-floor="5"] .f5-stage.editing .f5-frame{ cursor:grab; }
.floor-content[data-floor="5"] .f5-stage.editing .f5-frame:hover{ transform:translate(-50%,-50%) rotate(var(--rot,0deg)); filter:drop-shadow(0 8px 18px rgba(0,0,0,.6)); }
.floor-content[data-floor="5"] .f5-frame.selected{ outline:2px solid #e8c987; outline-offset:3px; z-index:6; }
.floor-content[data-floor="5"] .f5-frame.grabbing{ cursor:grabbing; transition:none; z-index:7; filter:drop-shadow(0 14px 26px rgba(0,0,0,.7)); }
/* ✎ 편집 토글 버튼 (주인만) */
.floor-content[data-floor="5"] .f5-edit{
  position:absolute; top:16px; right:16px; z-index:46;
  font-family:'Cormorant Garamond','Noto Serif KR',serif; font-style:italic;
  font-size:14px; letter-spacing:.04em; color:#e9dcc2;
  background:rgba(30,22,18,.66); border:1px solid rgba(212,165,72,.42);
  padding:7px 15px; border-radius:3px; cursor:pointer;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); transition:all .22s;
}
.floor-content[data-floor="5"] .f5-edit:hover{ background:rgba(48,36,28,.82); border-color:rgba(212,165,72,.7); }
.floor-content[data-floor="5"] .f5-edit.on{ color:#1a120c; background:#d4a548; border-color:#d4a548; }
/* 선택 액자 미니 조절 툴 (편집 중 액자 탭) */
.floor-content[data-floor="5"] .f5-tool{
  position:fixed; z-index:60; display:none; align-items:center; gap:6px;

.floor-content[data-floor="5"] .f5-nav{
