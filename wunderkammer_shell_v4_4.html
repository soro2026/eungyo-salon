  // ── 모달 이벤트 바인딩 (1회) ──────────────────
  function f4InitModal(){
    if(f4ModalInited) return;
    f4ModalInited = true;
    const overlay = document.getElementById('f4bookModalOverlay');
    document.getElementById('f4coverBook3D').addEventListener('click', f4EnterBook);
    overlay.addEventListener('click', f4OverlayClick);
    const closeBtn = document.querySelector('.f4book-close-btn');
    if(closeBtn) closeBtn.addEventListener('click', f4CloseBook);
    const l = document.getElementById('f4navLeft');
    const r = document.getElementById('f4navRight');
    if(l) l.addEventListener('click', ()=>f4TurnPage(-1));
    if(r) r.addEventListener('click', ()=>f4TurnPage(1));

    // 터치 스와이프 (실시간 드래그)
    let sx = 0, sy = 0, dragging = false, dragPage = null, onLink = false;
    overlay.addEventListener('touchstart', e => {
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; dragging = false;
      onLink = !!(e.target.closest && e.target.closest('a, button, [data-no-flip]'));
      const all = document.getElementById('f4bookPages').querySelectorAll('.f4book-page-view');
      dragPage = all[f4CurrentPage] || null;
    }, { passive:true });
    overlay.addEventListener('touchmove', e => {
      if(!dragPage || f4IsAnimating || onLink) return;
      const dx = e.touches[0].clientX - sx;
      const dy = e.touches[0].clientY - sy;
      if(!dragging && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) dragging = true;
      if(!dragging) return;
      if(dx < 0 && f4CurrentPage < f4TotalPages - 1){ dragPage.style.transition = 'none'; dragPage.style.transform = `translateX(${dx}px)`; }
      else if(dx > 0 && f4CurrentPage > 0){ dragPage.style.transition = 'none'; dragPage.style.transform = `translateX(${dx}px)`; }
    }, { passive:true });
    overlay.addEventListener('touchend', e => {
      if(onLink){ onLink = false; return; }
      if(!dragging || !dragPage) return;
      const dx = e.changedTouches[0].clientX - sx;
      const th = 60;
      if(dx < -th && f4CurrentPage < f4TotalPages - 1) f4TurnPage(1);
      else if(dx > th && f4CurrentPage > 0) f4TurnPage(-1);
      else { dragPage.style.transition = 'transform 0.32s cubic-bezier(0.23,1,0.32,1)'; dragPage.style.transform = 'translateX(0)'; }
      dragging = false; dragPage = null;
    }, { passive:true });
  }

  return { markup, mount, slide };
})();

/* ============================================================
 *  ⅤF 페르소나 월 모듈 (Floor5) — 「내가 사랑한 얼굴들 · Le Mur des Visages」
 *    내가 품은 별의 액자(framed_url)를 세로 스크롤 벽에 흩뿌림.
 *    배경 = uid 씨앗 시작번호 + 방마다 순환(3층 본보기) · 16점 동적 방.
 *    탭 → 확대 모달(핀치 줌 대체). 편집·별 이동은 2차.
 *    f5 접두사로 전역 격리. 4층(Floor4)이 본보기.
 * ============================================================ */
const Floor5 = (() => {
  const BG_POOL  = 1;    // 5f_bg01 한 장 (소로가 5f_bg02~ 올리면 그 수만큼 늘림)
  const ROOM_CAP = 15;   // 한 방 정원 (3열×5행)
  let stars = [];        // 그 콩파뇽이 품은 별(액자 보유) 평면 목록
  let rooms = [];        // 방별 묶음 [[star,...], ...]
  let curRoom = 0, bgStart = 1, isTransitioning = false, tagTimer = null;
  // ── 편집 모드 상태 (목업 v3 이식) ──
  let editMode = false, drag = null, selectedId = null;
  let isOwner = false, ownerUid = null;   // 본인 벽일 때만 편집 허용 (순례자 X)
  const ASPECT = 941/1672;                 // 벽 종횡비 — y%↔x% 환산

  // ── seeded random ──
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  const lerp  = (a,b,t)=> a+(b-a)*t;
  const clamp = (v,lo,hi)=> Math.max(lo, Math.min(hi, v));
  // 액자 반지름(%) — 드래그 경계 clamp용 (높이는 비율 평균 근사)
  function half(s){ return (s.size_pct||16)/2; }
  function halfY(s){ return ((s.size_pct||16)/0.82)*ASPECT/2; }

  // ── uid 씨앗 시작 배경 (3층 shelfBgIndex 문법) ──
  function bgStartOf(uid){
    if(!uid) return 1;
    let sum=0; for(let i=0;i<uid.length;i++) sum=(sum+uid.charCodeAt(i))%100000;
    return (sum % BG_POOL) + 1;
  }
  function bgForRoom(roomIdx){ return ((bgStart-1+roomIdx) % BG_POOL) + 1; }

  function markup(){
    return `
      <div class="floor-content" data-floor="5">
        <div class="f5-scroll" id="f5-scroll">
          <div class="f5-stage" id="f5-stage">
            <div class="f5-bgwrap" id="f5-bgwrap"></div>
            <div class="f5-wall" id="f5-wall"></div>
          </div>
        </div>
        <button class="f5-nav f5-nav-l" id="f5-prev" aria-label="이전 방">‹</button>
        <button class="f5-nav f5-nav-r" id="f5-next" aria-label="다음 방">›</button>
        <div class="f5-empty" id="f5-empty"></div>
        <div class="f5-roomtag" id="f5-roomtag"></div>
        <button class="f5-edit" id="f5-edit" style="display:none">✎ 배치 바꾸기</button>
        <div class="f5-tool" id="f5-tool">
          <button id="f5-size-down" title="작게">−</button><span class="f5-tool-lbl">크기</span><button id="f5-size-up" title="크게">＋</button>
          <span class="f5-tool-sep"></span>
          <button id="f5-rot-l" title="왼쪽으로">↺</button><span class="f5-tool-lbl">각도</span><button id="f5-rot-r" title="오른쪽으로">↻</button>
        </div>
        <div class="f5-zoom" id="f5-zoom">
          <button class="f5-zoom-close" id="f5-zoom-close" aria-label="닫기">×</button>
          <div class="f5-zoom-inner">
            <img class="f5-zoom-img" id="f5-zoom-img" alt="">
            <div class="f5-zoom-meta">
              <div class="f5-zoom-name" id="f5-zoom-name"></div>
              <div class="f5-zoom-cat" id="f5-zoom-cat"></div>
            </div>
          </div>
        </div>
      </div>`;
  }

  // ── 배경 크로스페이드 (3층/4층 본뜸) ──
  function setRoomBg(roomIdx, animate){
    const wrap = document.getElementById('f5-bgwrap'); if(!wrap) return;
    const n = bgForRoom(roomIdx);
    const layer = document.createElement('div');
    layer.className = 'f5-bg-layer';
    layer.style.backgroundImage = `url('5f_bg${String(n).padStart(2,'0')}.webp')`;  // 5f_bg01~ (BG_POOL 순환)
    layer.style.opacity = animate ? '0' : '1';
    wrap.insertBefore(layer, wrap.firstChild);
    if(animate) requestAnimationFrame(()=>requestAnimationFrame(()=>{ layer.style.opacity = '1'; }));
    wrap.querySelectorAll('.f5-bg-layer').forEach(el=>{
      if(el !== layer){ el.style.opacity='0'; setTimeout(()=>el.remove(), 950); }
    });
  }

  // ── 방 번호 떴다 사라짐 (방 2개 이상일 때만) ──
  function showRoomTag(roomIdx){
    const tag = document.getElementById('f5-roomtag'); if(!tag) return;
    const total = rooms.length;
    if(total <= 1){ tag.classList.remove('on'); return; }
    tag.innerHTML = `${roomIdx+1} <small>/ ${total}</small>`;
    tag.classList.add('on');
    clearTimeout(tagTimer);
    tagTimer = setTimeout(()=>tag.classList.remove('on'), 2600);
  }

  // ── 16칸 표준 배치 슬롯 (3층 SHELF_SLOTS 정신 확장) ──
  //    5f_bg01 중심 빈 벽에 3열×5행. 소로가 손으로 잡은 배치(persona_wall)를 본보기로 표준화.
  //    품은 순서 1→15번이 좌·중·우 3열로 위→아래 차곡차곡. 콩파뇽 손 안 대도 셰익스피어 앤 컴퍼니 벽.
  //    x,y=중심%(translate -50%), w=폭%(높이는 framed 비율 자유), rot=기울기°.
  const SLOTS = [
    { x:36.5, y:20,   w:14,   rot:-1.5 },  //  1  좌·0행
    { x:52.5, y:20,   w:13.5, rot: 1.5 },  //  2  중·0행
    { x:68,   y:20,   w:14,   rot: 0   },  //  3  우·0행
    { x:36.5, y:32,   w:13.5, rot: 1.5 },  //  4  좌·1행
    { x:52.5, y:32,   w:14,   rot:-1.5 },  //  5  중·1행
    { x:68,   y:32,   w:13.5, rot: 1   },  //  6  우·1행
    { x:36.5, y:44,   w:14,   rot:-1   },  //  7  좌·2행
    { x:52.5, y:44,   w:13.5, rot: 1.5 },  //  8  중·2행
    { x:68,   y:44,   w:14,   rot:-1.5 },  //  9  우·2행
    { x:36.5, y:56,   w:13.5, rot: 1.5 },  // 10  좌·3행
    { x:52.5, y:56,   w:14,   rot:-1   },  // 11  중·3행
    { x:68,   y:56,   w:13.5, rot: 1.5 },  // 12  우·3행
    { x:36.5, y:67.5, w:14,   rot:-1.5 },  // 13  좌·4행
    { x:52.5, y:67.5, w:13.5, rot: 1   },  // 14  중·4행
    { x:68,   y:67.5, w:14,   rot:-1.5 },  // 15  우·4행
  ];

  // ── 자동 배치(행 없는 별): 품은 순서대로 표준 슬롯에 착지 ──
  function autoPlace(star, idxInRoom, nInRoom){
    const sl = SLOTS[idxInRoom % SLOTS.length];
    return { x:sl.x, y:sl.y, size_pct:sl.w, rot:sl.rot };
  }

  // ── 데이터: 품은 별(액자) + 저장된 배치 ──
  async function loadStars(uid){
    stars = []; rooms = [];
    if(!uid) return;
    let comps = [], layout = [];
    try{
      comps = await sbFetch(`/rest/v1/companions?user_id=eq.${encodeURIComponent(uid)}&status=eq.live&select=star_id,joined_at&order=joined_at.desc`) || [];
    }catch(e){ console.warn('[F5] companions 로드 실패', e); return; }
    // 별 상세는 따로 in 조회 (임베드 회피 — 검증된 단순 패턴)
    const ids = comps.map(c=>c.star_id).filter(v=>v!=null);
    const starMap = {};
    if(ids.length){
      try{
        const ss = await sbFetch(`/rest/v1/stars?id=in.(${ids.join(',')})&select=id,name,categories,framed_url`) || [];
        ss.forEach(s=> starMap[s.id] = s);
      }catch(e){ console.warn('[F5] stars 로드 실패', e); }
    }
    try{
      layout = await sbFetch(`/rest/v1/persona_wall?user_id=eq.${encodeURIComponent(uid)}&select=star_id,x,y,size_pct,rot,room`) || [];
    }catch(e){ console.warn('[F5] persona_wall 로드 실패', e); layout = []; }
    const lay = {}; layout.forEach(l=> lay[l.star_id] = l);

    // 품은 순서 유지 · 액자(framed_url) 있는 별만 벽에 걸림
    const list = comps.map(c=> starMap[c.star_id]).filter(s=> s && s.framed_url);
    list.forEach((s,i)=>{
      const L = lay[s.id];
      const room = (L && L.room != null) ? L.room : Math.floor(i / ROOM_CAP);
      stars.push({
        id:s.id, name:s.name||'', cat:(Array.isArray(s.categories)?(s.categories[0]||''):String(s.categories||'')).split(/[·,]/)[0].trim(),
        framed:s.framed_url, room, _pinned:!!L, _L:L
      });
    });
    // 방별 묶기
    const maxRoom = stars.reduce((m,s)=>Math.max(m,s.room), 0);
    for(let r=0;r<=maxRoom;r++) rooms[r] = [];
    stars.forEach(s=> rooms[s.room].push(s));
    if(rooms.length===0) rooms = [[]];
    // 방 안 위치 확정
    rooms.forEach(roomStars=>{
      roomStars.forEach((s,idx)=>{
        if(s._pinned){ s.x=+s._L.x; s.y=+s._L.y; s.size_pct=+s._L.size_pct; s.rot=+s._L.rot; }
        else { const p=autoPlace(s, idx, roomStars.length); s.x=p.x; s.y=p.y; s.size_pct=p.size_pct; s.rot=p.rot; }
      });
    });
    try{ window.__F5DBG = { uid: uid?uid.slice(0,8):'NULL', comps: comps.length, stars: stars.length, rooms: rooms.length }; console.log('[F5DBG]', window.__F5DBG); }catch(_){}
  }

  function renderRoom(roomIdx){
    const wall  = document.getElementById('f5-wall');
    const empty = document.getElementById('f5-empty');
    if(!wall) return;
    wall.innerHTML = '';
    const roomStars = rooms[roomIdx] || [];
    if(roomStars.length === 0){
      if(empty){ empty.style.display=''; empty.textContent='아직 품은 얼굴이 없습니다'; }
      return;
    }
    if(empty) empty.style.display='none';
    for(const s of roomStars){
      const f = document.createElement('div');
      f.className = 'f5-frame';
      f.dataset.id = s.id;
      f.style.left = s.x+'%'; f.style.top = s.y+'%';
      f.style.width = s.size_pct+'%';
      f.style.setProperty('--rot', s.rot+'deg');
      const im = document.createElement('img');
      im.className = 'f5-frame-img'; im.src = s.framed; im.alt = s.name; im.loading='lazy'; im.draggable = false;
      f.appendChild(im);
      if(s.name){
        const pl = document.createElement('div');
        pl.className = 'f5-plate';
        pl.textContent = s.name;       // 작가 한글 표기 (stars.name)
        f.appendChild(pl);
      }
      bindEvents(f, s);
      wall.appendChild(f);
    }
    if(selectedId !== null){ const f = frameEl(selectedId); if(f){ f.classList.add('selected'); showTool(); } }
  }

  // ── 액자 이벤트: 감상=별 탐구 직행 / 편집=드래그·선택 (목업 v3 이식) ──
  function frameEl(id){ const w=document.getElementById('f5-wall'); return w ? w.querySelector('.f5-frame[data-id="'+id+'"]') : null; }
  function curStar(){ return stars.find(x=> x.id === selectedId); }
  function bindEvents(f, s){
    f.addEventListener('click', ()=>{
      if(editMode) return;                       // 편집 중엔 클릭=직행 차단
      const qUser = new URLSearchParams(location.search).get('user');
      let url = 'star.html?id=' + s.id + '&from=wk5';   // 출처=분더카머 5층 (복귀 문 표시)
      if(qUser) url += '&fromuser=' + encodeURIComponent(qUser);   // 순례 중이면 그 집 닉 유지
      location.href = url;                        // 감상 클릭 = 별 탐구 페이지로 직행
    });
    f.addEventListener('pointerdown', (e)=>{
      if(!editMode || !isOwner) return;
      e.preventDefault();
      const rect = document.getElementById('f5-stage').getBoundingClientRect();
      drag = { f, s, mx:e.clientX, my:e.clientY, x0:s.x, y0:s.y, w:rect.width, h:rect.height, moved:false };
      f.classList.add('grabbing');
      try{ f.setPointerCapture(e.pointerId); }catch(_){}
    });
    f.addEventListener('pointermove', (e)=>{
      if(!drag || drag.f !== f) return;
      const dxp = e.clientX - drag.mx, dyp = e.clientY - drag.my;
      if(Math.abs(dxp) > 4 || Math.abs(dyp) > 4) drag.moved = true;
      s.x = +clamp(drag.x0 + dxp/drag.w*100, half(s)+1, 99-half(s)).toFixed(2);
      s.y = +clamp(drag.y0 + dyp/drag.h*100, halfY(s)+2, 90-halfY(s)).toFixed(2);
      f.style.left = s.x + '%'; f.style.top = s.y + '%';
      if(drag.moved) showTool();
    });
    const end = ()=>{
      if(!drag || drag.f !== f) return;
      f.classList.remove('grabbing');
      if(drag.moved){ s._pinned = true; persist(s); }
      else { selectFrame(s.id); }                // 이동 없이 떼면 = 선택
      drag = null;
    };
    f.addEventListener('pointerup', end);
    f.addEventListener('pointercancel', end);
  }

  // ── 편집 토글 / 선택 / 미니툴 ──
  function setEdit(on){
    editMode = on;
    document.getElementById('f5-stage')?.classList.toggle('editing', on);
    const btn = document.getElementById('f5-edit');
    if(btn){ btn.classList.toggle('on', on); btn.textContent = on ? '✓ 완료' : '✎ 배치 바꾸기'; }
    if(!on) clearSelection();
  }
  function clearSelection(){
    selectedId = null;
    document.querySelectorAll('.floor-content[data-floor="5"] .f5-frame.selected').forEach(el=> el.classList.remove('selected'));
    const t = document.getElementById('f5-tool'); if(t) t.style.display = 'none';
  }
  function selectFrame(id){
    if(selectedId === id){ clearSelection(); return; }   // 같은 걸 또 누르면 해제
    selectedId = id;
    document.querySelectorAll('.floor-content[data-floor="5"] .f5-frame').forEach(el=>
      el.classList.toggle('selected', +el.dataset.id === id));
    showTool();
  }
  function showTool(){
    const tool = document.getElementById('f5-tool'); if(!tool) return;
    if(selectedId === null || !editMode){ tool.style.display='none'; return; }
    const f = frameEl(selectedId);
    if(!f){ tool.style.display='none'; return; }
    const r = f.getBoundingClientRect();
    tool.style.display = 'flex';
    tool.style.left = (r.left + r.width/2) + 'px';
    tool.style.top  = Math.max(8, r.top - 42) + 'px';
  }
  function adjSize(d){
    const s = curStar(); if(!s) return;
    s.size_pct = +clamp(s.size_pct + d, 7, 30).toFixed(2);
    s._pinned = true;
    const f = frameEl(s.id); if(f) f.style.width = s.size_pct + '%';
    persist(s); showTool();
  }
  function adjRot(d){
    const s = curStar(); if(!s) return;
    s.rot = +(s.rot + d).toFixed(2);
    s._pinned = true;
    const f = frameEl(s.id); if(f) f.style.setProperty('--rot', s.rot + 'deg');
    persist(s);
  }

  // ── 저장: persona_wall upsert (본인만 · 3층 saveBook 본보기) ──
  async function persist(s){
    if(!isOwner || !ownerUid) return;
    try{
      await sbFetch('/rest/v1/persona_wall', {
        method:'POST',
        headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify({
          user_id: ownerUid, star_id: s.id,
          x:+(+s.x).toFixed(2), y:+(+s.y).toFixed(2),
          size_pct:+(+s.size_pct).toFixed(2), rot:+(+s.rot).toFixed(2),
          room: curRoom
        })
      });
    }catch(e){ console.warn('[F5] persona_wall 저장 실패', e); }
  }

  // ── 확대 모달 (핀치 줌 대체) ──
  function openZoom(s){
    const z = document.getElementById('f5-zoom'); if(!z) return;
    document.getElementById('f5-zoom-img').src = s.framed;
    document.getElementById('f5-zoom-img').alt = s.name;
    document.getElementById('f5-zoom-name').textContent = s.name;
    document.getElementById('f5-zoom-cat').textContent  = s.cat || '';
    z.classList.add('on');
  }
  function closeZoom(){ document.getElementById('f5-zoom')?.classList.remove('on'); }

  // ── 진입 시 벽 중앙 착지 (4층 centerScroll 그대로) ──
  function centerScroll(){
    const sc = document.getElementById('f5-scroll'); if(!sc) return;
    sc.scrollTop = Math.max(0, (sc.scrollHeight - sc.clientHeight) / 2);
  }

  function transitionTo(idx){
    if(isTransitioning || idx===curRoom || idx<0 || idx>=rooms.length) return;
    isTransitioning = true; curRoom = idx; clearSelection();
    setRoomBg(idx, true); showRoomTag(idx); renderRoom(idx);
    requestAnimationFrame(centerScroll);
    setTimeout(()=>{ isTransitioning=false; }, 650);
  }
  function slide(dir){
    if(currentFloor !== 5) return;
    const n = rooms.length; if(n<=1) return;
    transitionTo((curRoom + dir + n) % n);
  }

  // ── 순례 ?user= 우선, 없으면 본인 (3·4층과 동일 정신) ──
  async function resolveOwnerId(){
    const qUser = new URLSearchParams(location.search).get('user');
    if(qUser){
      try{
        const u = await sbFetch(`/rest/v1/users?nickname=eq.${encodeURIComponent(qUser)}&select=id`);
        if(u && u[0] && u[0].id) return u[0].id;
      }catch(e){ console.warn('[F5] owner 조회 실패', e); }
      return null;
    }
    return getUser()?.id || null;
  }

  async function mount(){
    isTransitioning = false; curRoom = 0;
    editMode = false; selectedId = null; drag = null;
    const uid = await resolveOwnerId();
    ownerUid = uid;
    const me = getUser()?.id || null;
    isOwner = !!me && me === uid;   // 본인 벽일 때만 편집 (남의 벽 순례 시 X)
    bgStart = bgStartOf(uid);
    await loadStars(uid);
    setRoomBg(0, false); showRoomTag(0); renderRoom(0);
    if(stars.length === 0){ const e=document.getElementById('f5-empty'); if(e){ const d=window.__F5DBG||{}; e.style.display=''; e.style.whiteSpace='normal'; e.textContent=`[진단] uid:${d.uid} · companions:${d.comps} · stars:${d.stars}`; } }
    const prev = document.getElementById('f5-prev');
    const next = document.getElementById('f5-next');
    if(prev) prev.addEventListener('click', ()=>slide(-1));
    if(next) next.addEventListener('click', ()=>slide(+1));
    const one = rooms.length <= 1;
    if(prev) prev.style.display = one ? 'none' : '';
    if(next) next.style.display = one ? 'none' : '';
    // ── 편집 버튼(주인만) + 미니툴 바인딩 ──
    const eb = document.getElementById('f5-edit');
    if(eb){ eb.style.display = isOwner ? '' : 'none'; eb.onclick = ()=> setEdit(!editMode); }
    const bind = (id,fn)=>{ const el=document.getElementById(id); if(el) el.onclick=fn; };
    bind('f5-size-down', ()=> adjSize(-1.2));
    bind('f5-size-up',   ()=> adjSize(1.2));
    bind('f5-rot-l',     ()=> adjRot(-2));
    bind('f5-rot-r',     ()=> adjRot(2));
    // 빈 벽 탭 = 선택 해제 (편집 중)
    const stage = document.getElementById('f5-stage');
    if(stage) stage.addEventListener('click', (e)=>{
      if(editMode && (e.target===stage || e.target.id==='f5-wall' || e.target.classList.contains('f5-bgwrap') || e.target.classList.contains('f5-bg-layer'))) clearSelection();
    });
    // 스크롤 시 선택 툴 따라가기
    const sc = document.getElementById('f5-scroll');
    if(sc) sc.addEventListener('scroll', ()=>{ if(selectedId!==null) showTool(); });
    requestAnimationFrame(centerScroll);
  }

  return { markup, mount, slide };
})();


/* ===== 첫 진입 ===== */
// 명패 직행(최상위 페이지 + from_star)일 때만 별 복귀 문 노출.
// maison iframe 경유(①②⑤)는 self!==top이라 숨김 → 기존 maison "떠나기"와 중복 없음.
try {
  const _fromStar = new URLSearchParams(location.search).get('from_star');
  if (window.self === window.top && _fromStar) {
    const _eb = document.getElementById('wkExitStar');
    if (_eb) {
      _eb.style.display = 'block';
      _eb.addEventListener('click', () => { location.href = 'star.html?id=' + encodeURIComponent(_fromStar); });
    }
  }
} catch (e) {}
buildBar();
applyElevatorByOwner();   // 그 집 주인 elevator_no 로 문 표시 (없으면 CSS 기본 elevator_01)
// 콘스텔라티오 순례: ?floor=N 으로 들어오면 그 층부터 시작 (없으면 1층). ?user= 는 loadLibrary가 읽음.
const _qFloor = parseInt(new URLSearchParams(location.search).get('floor'), 10);
currentFloor = (_qFloor >= 1 && _qFloor <= 5) ? _qFloor : 1;
if (window.EGCrashGuard && EGCrashGuard.check()) {
  // 0706 크래시 가드: 지난 크래시 감지 → 팝업만 띄우고 층 렌더 생략 (CSS 3D+webp 폭발 방지)
} else {
  if (window.EGCrashGuard) EGCrashGuard.mark('shell');
  renderFloor(currentFloor);

  /* ══ EG Credencial 입국 도장 두 장 (0804 소로 결정)
       CAMERA (방패·유리 종 아래 앵무조개)  내 분더카머를 둘러본 날
       DOMVS  (오각·굴뚝 있는 라탱 지구 집)  남의 집을 처음 둘러본 날
     둘은 다른 일이다(5호 — 무엇을 했는가에 찍는다). 같은 파일이 열렸다는
     이유로 한 장으로 묶으면 서로 다른 두 행위가 한 도장에 뭉개진다.
     앵무조개는 안에서만 보는 물건이고, 굴뚝 있는 집은 밖에서 보는 그림이다.
     ⚠ ?user=가 내 닉네임일 수도 있다 — 그때는 내 집이므로 CAMERA를 놓는다.
        임자를 실제로 대조하지 않으면 내 방에서 남의 집 도장이 뜬다.
     ⚠ supa를 안 넘긴다 — 이 파일엔 supabase-js가 없다. 부품이 REST로 간다. ══ */
  if (window.EGStamp) (async function(){
    try{
      const q  = new URLSearchParams(location.search).get('user');
      const me = getUser()?.id || null;
      let mine = true;
      if (q){
        const u = await sbFetch(`/rest/v1/users?nickname=eq.${encodeURIComponent(q)}&select=id`);
        mine = !!me && u?.[0]?.id === me;
      }
      EGStamp.offer({ area: mine ? 'camera' : 'domus' });
    }catch(e){ console.warn('[EGStamp] 임자 대조 실패, 물러납니다:', e); }
  })();
}
</script>
