            <div id="bam-picked" class="bam-picked">
              <h3>이 책을 골랐습니다</h3>
              <div class="bam-preview">
                <div class="pc"><img id="bam-pimg" alt=""></div>
                <div class="bam-meta">
                  <p class="mt" id="bam-ptitle"></p>
                  <div class="row">저자 · <span id="bam-pauth"></span></div>
                  <div class="row">출판 · <span id="bam-ppub"></span></div>
                  <div class="row">ISBN · <span id="bam-pisbn"></span></div>
                </div>
              </div>
              <button class="bam-add" id="bam-add">📚 내 책방에 들이기</button>
              <div class="bam-result" id="bam-result"></div>
            </div>
          </div>
        </div>
      </div>`;
  }

  /* ── 배경 — 1층과 같은 방 번호, 같은 시각 ──
     ⚠ ?v= 가 필수다. Storage 기본 캐시가 max-age=3600이라
       안 붙이면 새 그림을 올려도 한 시간 동안 옛 그림이 나온다 */
  function bgUrl(no, t){
    const v = ROOM && ROOM.updated_at ? '?v=' + Date.parse(ROOM.updated_at) : '';
    return SUPABASE_URL + '/storage/v1/object/public/wk-assets/study/study_'
         + String(no).padStart(2,'0') + '_' + t + '.webp' + v;
  }
  function slot(){ try { return egSky.phase(); } catch(e){ return 'd'; } }

  /* 배경 — 뮤세움 문법. img 한 장이라 안 뜨면 눈에 보이고 콘솔에도 남는다.
     ⚠ CSS 배경 레이어로 깔면 못 뜬 것과 안 부른 것이 화면에서 똑같다(함정 BC) */
  function setRoomBg(list){
    return new Promise(res=>{
      const im = document.getElementById('bk-img');
      if(!im){ res(false); return; }
      let i = 0;
      const step = () => {
        if (i >= list.length){ console.warn('[책의 방] 배경을 못 찾았습니다', list); res(false); return; }
        const url = list[i++];
        im.onload  = () => { im.classList.add('on'); res(true); };
        im.onerror = () => { console.warn('[책의 방] 배경 없음 →', url); step(); };
        im.src = url;
      };
      step();
    });
  }

  /* ⭐ 들어서는 3초 — 천장(천창)에서 내려와 **맨 윗단**에 안착한다.
     ⚠ 감 전체를 주면 중심이 2단이라 새 책이 화면 위로 잘린다(뮤세움 0807).
       한 단 반만 준다. 서가 배치는 안 건드린다 — 카메라가 보는 곳만 바꾼다 */
  function runCamera(){
    if (!window.EGCamera) return;
    const s = shelf();
    /* ⭐ 0818 소로 — 2층의 안착 지점은 **맨 윗칸**이다.
         감 전체를 주었더니 중심이 둘째 칸에 앉아 책이 화면에 꽉 찼다(소로 실물 확인).
       ⚠ 카메라는 rect 의 **세로 한가운데**를 화면 복판에 놓는다. 그러니 「위로 올리기」는
         각도를 트는 일이 아니라 **rect 를 첫 칸으로 좁히는 일**이다.
         top~b1 = 첫 칸. 아래로 20%만 여유를 둬 둘째 칸 표지 머리가 살짝 걸치게 한다 —
         한 칸만 뚝 떨어져 보이면 서가가 아니라 진열대가 된다(3층 1.5배와 같은 뜻). */
    const CAM = { L:s.l, T:s.top, W:s.r-s.l, H:(s.b1-s.top)*1.2 };
    const opts = { box:'#bk-scroll', fit:'#bk-fit', ratio:STAGE_AR, rect:CAM };
    /* 폰(세로)은 스크롤 길이가 0이라 카메라가 헛돈다 — 바로 앉힌다 */
    const scrollable = (innerWidth/innerHeight) >= STAGE_AR;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const skip = egSkipCamera; egSkipCamera = false;   /* 읽는 쪽이 끈다 (0818) */
      try { (scrollable && !skip) ? EGCamera.enter(opts) : EGCamera.settle(opts); }
      catch(e){ console.warn('[책의 방] 카메라', e); }
    }));
  }

  /* ════ ⚖ 선반 줄 맞추기 (살롱지기 전용) ════
     ⚠ 표지는 자석이라 끌리지 않는다 — 움직이는 것은 **줄** 쪽이다.
       판이 밝게 빛나는 띠의 한가운데와 판의 윗면은 다르다(0809 내가 낸 사고).
       눈으로 맞추는 것이 픽셀로 재는 것보다 정확하다. */
  let ruleOn = false;
  const RULE_KEYS = [
    ['top','천장',   'h'], ['b1','1단 바닥','h'], ['b2','2단 바닥','h'],
    ['bot','3단 바닥','h'], ['l','왼쪽',     'v'], ['r','오른쪽',   'v']
  ];
  function toggleRule(){
    ruleOn = !ruleOn;
    if (ruleOn && editMode) toggleEdit();          /* 두 편집을 겹쳐 켜지 않는다 */
    const btn = document.getElementById('bk-rule-toggle');
    if (btn) btn.classList.toggle('on', ruleOn);
    const box = document.getElementById('bk-rule');
    if (!box) return;
    box.hidden = !ruleOn;
    if (ruleOn) buildRule(); else box.innerHTML = '';
  }
  function buildRule(){
    const box = document.getElementById('bk-rule');
    const s = shelf();
    box.innerHTML = RULE_KEYS.map(([k,label,axis]) =>
      `<div class="bk-rline ${axis}" data-k="${k}"
            style="${axis==='h' ? 'top:'+s[k]+'%' : 'left:'+s[k]+'%'}"><b>${label}</b></div>`).join('')
      + `<div class="bk-rsave"><button id="bk-rule-save">이 방에 담기</button>
         <span id="bk-rule-msg">${REAL_NO}번 · ${escAttr((ROOM&&ROOM.name)||'')}</span></div>`;
    box.querySelectorAll('.bk-rline').forEach(bindRuleLine);
    document.getElementById('bk-rule-save').addEventListener('click', saveShelf);
  }
  function bindRuleLine(el){
    const k = el.dataset.k, horiz = el.classList.contains('h');
    let drag = false, s0, v0;
    const start = (p) => { drag = true; s0 = p; v0 = Number(shelf()[k]); el.classList.add('on'); };
    const move  = (p) => {
      if (!drag) return;
      const fit = document.getElementById('bk-fit'); if (!fit) return;
      const span = horiz ? fit.offsetHeight : fit.offsetWidth;
      const v = Math.max(0, Math.min(100, v0 + ((p - s0) / span) * 100));
      if (!ROOM) ROOM = { no: REAL_NO };
      ROOM['shelf_' + k] = +v.toFixed(2);
      el.style[horiz ? 'top' : 'left'] = v + '%';
      el.querySelector('b').textContent = el.querySelector('b').textContent.split(' ')[0] + ' ' + v.toFixed(2);
      buildPages(); buildShelfPages();              /* 표지가 새 줄을 따라 바로 붙는다 */
    };
    const end = () => { drag = false; el.classList.remove('on'); };
    el.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation(); start(horiz ? e.clientY : e.clientX);
      const mm = ev => move(horiz ? ev.clientY : ev.clientX);
      const mu = () => { end(); removeEventListener('mousemove', mm); removeEventListener('mouseup', mu); };
      addEventListener('mousemove', mm); addEventListener('mouseup', mu);
    });
    el.addEventListener('touchstart', e => {
      e.stopPropagation(); const t = e.touches[0]; start(horiz ? t.clientY : t.clientX);
      const tm = ev => { ev.preventDefault(); const q = ev.touches[0]; move(horiz ? q.clientY : q.clientX); };
      const tu = () => { end(); removeEventListener('touchmove', tm); removeEventListener('touchend', tu); };
      addEventListener('touchmove', tm, { passive:false }); addEventListener('touchend', tu);
    }, { passive:true });
  }
  /* ⚠ 쓰고 나서 반드시 되읽는다. PATCH는 맞는 행이 없어도 조용히 204를 준다 —
     「잘 됐겠지」가 오늘 다섯 방을 비워 둔 까닭이다(0809). */
  async function saveShelf(){
    const msg = document.getElementById('bk-rule-msg');
    const btn = document.getElementById('bk-rule-save');
    const s = shelf();
    if (btn){ btn.disabled = true; btn.textContent = '담는 중…'; }
    if (msg) msg.textContent = `${REAL_NO}번 방에 담는 중…`;
    try {
      const back = await sbFetch(`/rest/v1/living_rooms?no=eq.${REAL_NO}`, {
        method:'PATCH', headers:{ 'Prefer':'return=representation' },
        body: JSON.stringify({ shelf_l:s.l, shelf_r:s.r, shelf_top:s.top,
                               shelf_b1:s.b1, shelf_b2:s.b2, shelf_bot:s.bot,
                               updated_at: new Date().toISOString() })
      });
      const row = Array.isArray(back) ? back[0] : back;
      if (!row) throw new Error(`${REAL_NO}번 방을 못 찾았거나 쓰기가 막혔습니다`);
      const ok = Math.abs(Number(row.shelf_b1) - s.b1) < 0.01
              && Math.abs(Number(row.shelf_bot) - s.bot) < 0.01;
      if (!ok) throw new Error('되돌아온 값이 다릅니다');
      ROOM = row;
      if (msg) msg.textContent = `${REAL_NO}번 · ${(row.name || '')} 담았습니다 ✔  `
        + `${Number(row.shelf_b1).toFixed(2)} / ${Number(row.shelf_b2).toFixed(2)} / ${Number(row.shelf_bot).toFixed(2)}`;
    } catch (e) {
      if (msg) msg.textContent = '담지 못했습니다 — ' + (e.message || e);
      console.warn('[책의 방] 줄 담기 실패', e);
    } finally {
      if (btn){ btn.disabled = false; btn.textContent = '이 방에 담기'; }
    }
  }

  /* 순례 동선: ?user=닉네임이면 그 집 주인 uid, 없으면 로그인 본인 (1층과 같은 정신) */
  async function resolveOwnerId(){
    const qUser = new URLSearchParams(location.search).get('user');
    if (qUser){
      try{
        const u = await sbFetch(`/rest/v1/users?nickname=eq.${encodeURIComponent(qUser)}&select=id`);
        if (u && u[0] && u[0].id) return u[0].id;
      }catch(e){}
      return null;                       /* 해석 실패 → 빈 방 (내 책 폴백 금지) */
    }
    return getUser()?.id || null;
  }

  /* 그 집의 방 번호 → 감 좌표. 1층이 읽는 곳과 같은 자리다 */
  async function loadRoom(ownerId){
    let no = 1;
    if (ownerId){
      try{
        const w = await sbFetch(`/rest/v1/wunderkammer?user_id=eq.${ownerId}&select=living_no`);
        if (w?.[0]?.living_no) no = w[0].living_no;
      }catch(e){ console.warn('[책의 방] 방 번호 조회 실패 — 1번으로', e); }
    }
    try{
      const r = await sbFetch(`/rest/v1/living_rooms?no=eq.${no}&select=*`);
      ROOM = r?.[0] || null;
    }catch(e){ console.warn('[책의 방] 방 조회 실패', e); ROOM = null; }
    REAL_NO = no;
  }

  async function mount() {
    currentShelfPage = 0; isTransitioning = false; editMode = false; selEl = null;
    const ownerId = await resolveOwnerId();
    await loadRoom(ownerId);                    /* ⚠ 첫 그림 전에 읽는다 — 나중이면 한 번 튄다 */
    const t = slot();
    const ok = await setRoomBg([ bgUrl(REAL_NO, t), bgUrl(REAL_NO, 'd'), bgUrl(1, 'd') ]);
    await loadBooks(ownerId);
    buildShelfPages();
    buildDots();
    if (ok) runCamera();                        /* ⚠ 그림이 실린 뒤 — fit 높이가 0이면 헛돈다 */
    document.getElementById('bk-prev').addEventListener('click', () => slide(-1));
    document.getElementById('bk-next').addEventListener('click', () => slide(+1));

    /* ⚠ 문이 둘이다. 하나로 묶으면 순례 중에 ⚖까지 사라진다(0809 소로 발견).
         ＋·✎  = 내 책을 만진다        → 내 방에서만
         ⚖     = living_rooms를 만진다 → 살롱지기면 어느 방에서든
       그리고 is_admin은 **집주인이 아니라 나**를 봐야 한다.
       남의 집에서 집주인의 권한을 물으면 늘 아니라고 답한다. */
    const meId = getUser()?.id || null;
    const isOwner = !!meId && ownerId === meId;
    let keeper = false;
    if (meId){
      try {
        const u = await sbFetch(`/rest/v1/users?id=eq.${meId}&select=is_admin`);
        keeper = !!(u && u[0] && u[0].is_admin);
      } catch(e){ console.warn('[책의 방] 살롱지기 확인 실패', e); }
    }
    const dock = document.getElementById('bk-dock');
    if (dock) dock.hidden = !(isOwner || keeper);
    /* ⚠ hidden 이 풀린 뒤에 재야 한다 — 감춰진 것은 크기가 0 이다 */
    placeBookDockSoon();
    const h = document.getElementById('bk-dock-h');
    const m = document.getElementById('bk-dock-menu');
    if (h && m) h.addEventListener('click', ()=>{
      m.hidden = !m.hidden; h.classList.toggle('on', !m.hidden);
    });
    const ab = document.getElementById('bk-add-toggle');
    const eb = document.getElementById('bk-edit-toggle');
    if (ab) ab.hidden = !isOwner;
    if (eb) eb.hidden = !isOwner;
    if (isOwner){
      if (eb) eb.addEventListener('click', toggleEdit);
      bindAddModal(ownerId);
    }
    const rb = document.getElementById('bk-rule-toggle');
    if (rb){ rb.hidden = !keeper; if (keeper) rb.addEventListener('click', toggleRule); }
    placeBookDockSoon();        /* ⚖ 가 켜지면 한 칸 더 자란다 */
    const fc = document.querySelector('.floor-content[data-floor="3"]');
    if (fc) fc.classList.remove('editing');
  }

  /* ── DB에서 그 집 책 읽어오기 — seq 큰 것이 첫 자리(새 책이 맨 앞) ── */
  async function loadBooks(ownerId) {
    BOOKS = []; PAGES = [];
    if (!ownerId) { buildPages(); return; }
    try {
      /* ⭐ 0819 — 보관함에 넣은 책은 서가에 안 선다.
         ⚠ 지운 것이 아니라 내려둔 것이다. seq 는 그대로라 꺼내면 제 번호로 돌아온다.
         ⚠ 남에게 안 보이는 일은 여기가 아니라 RLS 가 한다 — 화면 거르기는 감춤이 아니다 */
      const rows = await sbFetch(`/rest/v1/wunderkammer_books?owner_id=eq.${ownerId}`
        + `&archived_at=is.null`
        + `&select=id,owner_id,title,author,cover_url,cover_w,cover_h,scale,essay_title,essay_body,seq`
        + `&order=seq.desc`);
      BOOKS = (rows || []).map(r => ({
        id: r.id, owner_id: r.owner_id, title: r.title, author: r.author, cover: r.cover_url,
        cover_w: r.cover_w, cover_h: r.cover_h, scale: r.scale,
        essay_title: r.essay_title, essay_body: r.essay_body, seq: r.seq
      }));
    } catch (e) { BOOKS = []; }
    buildPages();
  }

  let BAM_CURRENT = null, BAM_OWNER = null;
  const bamEsc = s => (s||'').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const bamEl = id => document.getElementById(id);

  function bindAddModal(ownerId){
    BAM_OWNER = ownerId;
    const at = bamEl('bk-add-toggle'); if (at) at.addEventListener('click', openAddModal);
    const cb = bamEl('bam-close');     if (cb) cb.addEventListener('click', closeAddModal);
    const gb = bamEl('bam-go');        if (gb) gb.addEventListener('click', bamSearch);
    const q  = bamEl('bam-q');         if (q)  q.addEventListener('keydown', e => { if (e.key === 'Enter') bamSearch(); });
    const ad = bamEl('bam-add');       if (ad) ad.addEventListener('click', bamAddBook);
    const md = bamEl('bk-add-modal');  if (md) md.addEventListener('click', e => { if (e.target === md) closeAddModal(); });
    bindKeepModal();
  }

  /* ══ ⭐ 0819 · 보관함 ══════════════════════════════════════════
     서가에 안 건 책이 사는 곳. 남에게는 RLS 가 아예 안 내보낸다.
     ⚠ 아주 지우는 손은 오직 여기에만 있다(0819 소로 결정) */
  function bindKeepModal(){
    const kb = bamEl('bk-keep-toggle'); if (kb) kb.addEventListener('click', openKeepModal);
    const kc = bamEl('bkp-close');      if (kc) kc.addEventListener('click', closeKeepModal);
    const km = bamEl('bk-keep-modal');
    if (km) km.addEventListener('click', e => { if (e.target === km) closeKeepModal(); });
  }
  function closeKeepModal(){
    const md = bamEl('bk-keep-modal'); if (md) md.classList.remove('on');
  }
  async function openKeepModal(){
    const md = bamEl('bk-keep-modal'); if (!md) return;
    const st = bamEl('bkp-status'), list = bamEl('bkp-list');
    st.className = 'bam-status'; st.textContent = '여는 중…';
    list.className = 'bam-mine'; list.innerHTML = '';
    md.classList.add('on');
    try {
      const rows = await EGBookAdd.listArchived(BAM_OWNER);
      if (!rows.length){
        st.textContent = '보관함이 비어 있습니다.';
        return;
      }
      st.textContent = '';
      renderKeepList(rows);
    } catch(e){
      st.className = 'bam-status err';
      st.innerHTML = '보관함을 열지 못했어요<br><span style="font-size:11px;opacity:.7">(' + bamEsc(e.message||e) + ')</span>';
    }
  }
  function renderKeepList(rows){
    const list = bamEl('bkp-list');
    list.innerHTML = ''; list.className = 'bam-mine on';
    const rowsBox = document.createElement('div'); rowsBox.className = 'rows';
    rows.forEach(r => {
      const wrap = document.createElement('div');
      wrap.className = 'bam-mrow kept';
      const hasText = !!(r.essay_body && r.essay_body.trim());
      wrap.innerHTML = (r.cover_url ? '<img src="' + bamEsc(r.cover_url) + '" alt="">' : '<img alt="">')
        + '<div class="tx"><p class="mt">' + bamEsc(r.title||'') + '</p>'
        + '<div class="ma">' + bamEsc(r.author||'—')
        + (hasText ? ' <span class="kmark">· 글 있음</span>' : '') + '</div></div>'
        + '<div class="keep"><button class="out">서가로</button><button class="rm">지우기</button></div>';
      const outB = wrap.querySelector('.out'), rmB = wrap.querySelector('.rm');
      outB.addEventListener('click', async () => {
        outB.disabled = rmB.disabled = true;
        try {
          await EGBookAdd.archive(r.id, false);
          await loadBooks(BAM_OWNER); buildShelfPages(); buildDots();
          wrap.remove(); keepEmptyCheck();
        } catch(e){ alert('꺼내지 못했습니다 — ' + (e.message||e)); outB.disabled = rmB.disabled = false; }
      });
      /* ⚠⚠ 여기가 이 집에서 책이 아주 사라지는 유일한 곳이다.
         두 겹으로 묻는다 — 글이 든 책이면 그 사실을 먼저 말한다 */
      rmB.addEventListener('click', async () => {
        const warn = `『${r.title}』을(를) 아주 지울까요?\n`
          + (hasText ? '⚠ 이 책에 쓰신 글도 함께 사라집니다.\n' : '')
          + '되돌릴 수 없습니다. 그냥 두셔도 남에게는 보이지 않습니다.';
        if (!confirm(warn)) return;
        if (!confirm('정말 지웁니다. 마지막 확인입니다.')) return;
        outB.disabled = rmB.disabled = true;
        try { await EGBookAdd.remove(r.id); wrap.remove(); keepEmptyCheck(); }
        catch(e){ alert('지우지 못했습니다 — ' + (e.message||e)); outB.disabled = rmB.disabled = false; }
      });
      rowsBox.appendChild(wrap);
    });
    list.appendChild(rowsBox);
  }
  function keepEmptyCheck(){
    const list = bamEl('bkp-list');
    if (list && !list.querySelectorAll('.bam-mrow').length){
      list.className = 'bam-mine';
      const st = bamEl('bkp-status'); st.className = 'bam-status'; st.textContent = '보관함이 비어 있습니다.';
    }
  }

  function openAddModal(){
    const md = bamEl('bk-add-modal'); if (!md) return;
    bamEl('bam-q').value = '';
    bamEl('bam-grid').innerHTML = '';
    bamEl('bam-picked').className = 'bam-picked';
    const st = bamEl('bam-status'); st.className = 'bam-status'; st.textContent = '책 제목을 적고 검색을 눌러보세요.';
    BAM_CURRENT = null;
    md.classList.add('on');
    setTimeout(() => { const q = bamEl('bam-q'); if (q) q.focus(); }, 100);
  }
  /* ══ 0812 · 분더카머 장서인 (cam_liber) ═══════════════════════════════
     새 책을 들인 그날, 모달이 걷힌 뒤에 한 장 놓는다.
     ⚠ 제출 순간이 아니라 **닫을 때** 놓는다 — 손님 눈이 모달 가운데에 있으면
       도크가 떠도 못 본다(v155 §3-1). 닫는 길 셋(× · 바깥 누르기 · 서가로
       돌아가기)이 전부 이 함수로 모이므로 뒷문이 없다.
     ⚠ 규칙은 daily_per_area 하나다. once_per_subject를 걸면 안 된다 —
       같은 책을 두 번 들일 일은 없고, 매일 새 책이 들어온다(v155 §3-3).
     ⚠ stamp_press.js는 한 글자도 안 건드린다. 부르는 곳이 열한 곳이다(0808).  */
  let BAM_STAMP_FOR = null;          /* 들이기가 성공하면 그 책 제목이 여기 앉는다 */

  /* 각인 다듬기 — 0819 부품으로 옮겼다(eg_book_add.js).
     ⚠ 좌석과 같은 규칙이어야 크레덴시알에 같은 꼴로 쌓인다 */
  function bamInscription(t){ return EGBookAdd.inscription(t); }

  function closeAddModal(){
    const md = bamEl('bk-add-modal'); if (md) md.classList.remove('on');
    const title = BAM_STAMP_FOR; BAM_STAMP_FOR = null;
    if (!title || !window.EGStamp) return;
    /* 모달이 실제로 사라진 뒤에 놓는다 */
    setTimeout(function(){
      try{
        EGStamp.offer({ kind:'cam_liber', inscription: bamInscription(title) });
      }catch(e){ console.warn('[EGStamp] 장서인 물러납니다:', e); }
    }, 320);
  }

  /* ══ ⭐ 0819 · 21호 「검색은 한 문」 ═══════════════════════════════
     배관은 eg_book_add.js 가 한다. 여기는 그린다.
     ⚠ 손님은 「내 책방에 이 책이 있었나」를 기억할 의무가 없다 —
       위 칸에서 나오면 고르고, 없으면 아래 칸에서 들인다  */
  async function bamSearch(){
    const q = bamEl('bam-q').value.trim();
    const grid = bamEl('bam-grid'), st = bamEl('bam-status'), gb = bamEl('bam-go');
    const mine = bamEl('bam-mine');
    if (!q){ bamEl('bam-q').focus(); return; }
    st.className = 'bam-status'; st.textContent = '찾는 중…';
    grid.innerHTML = ''; mine.className = 'bam-mine'; mine.innerHTML = '';
    bamEl('bam-picked').className = 'bam-picked'; gb.disabled = true;
    try {
      const r = await EGBookAdd.search(q, BAM_OWNER);
      bamRenderMine(r.mine, r.kept);
      bamRender(r.outer);
      if ((r.mine.length || r.kept.length) && !r.outer.length){
        st.textContent = r.outerError ? '바깥 서점은 지금 막혀 있어요.' : '';
      } else if (!r.mine.length && !r.kept.length && !r.outer.length){
        st.textContent = '검색 결과가 없습니다.';
      } else {
        st.textContent = '';
      }
    } catch(e){
      st.className = 'bam-status err';
      st.innerHTML = '검색이 막혔어요. <b>은교살롱 로그인</b> 후 새로고침이 필요할 수 있어요.<br><span style="font-size:11px;opacity:.7">(' + bamEsc(e.message||e) + ')</span>';
    } finally { gb.disabled = false; }
  }

  /* 내 책방 칸 — 누르면 모달을 닫고 그 책을 편다.
     ⚠ 부품이 준 것은 DB 줄이다. 서가가 들고 있는 책과 id 로 맞춰 연다 */
  function bamRenderMine(list, kept){
    const box = bamEl('bam-mine');
    box.innerHTML = ''; box.className = 'bam-mine';
    const n = (list||[]).length, m = (kept||[]).length;
    if (!n && !m) return;

    if (n){
      const cap = document.createElement('div');
      cap.className = 'cap'; cap.textContent = '서가에 있습니다 · ' + n + '권';
      box.appendChild(cap);
      const rows = document.createElement('div'); rows.className = 'rows';
      list.forEach(r => {
        const b = document.createElement('button');
        b.className = 'bam-mrow';
        b.innerHTML = (r.cover_url ? '<img src="' + bamEsc(r.cover_url) + '" alt="">' : '<img alt="">')
          + '<div class="tx"><p class="mt">' + bamEsc(r.title||'') + '</p>'
          + '<div class="ma">' + bamEsc(r.author||'—') + '</div></div>'
          + '<div class="go">펼치기 ›</div>';
        b.onclick = () => {
          const book = BOOKS.find(x => x.id === r.id);
          closeAddModal();
          if (book) setTimeout(() => openBook(book), 340);
        };
        rows.appendChild(b);
      });
      box.appendChild(rows);
    }

    /* ⭐ 0819 — 보관함에 있는 책도 여기서 나온다.
       보관함 판을 열지 않아도 이름만 치면 꺼낼 수 있다 */
    if (m){
      const cap2 = document.createElement('div');
      cap2.className = 'cap'; cap2.textContent = '보관함에 있습니다 · ' + m + '권';
      if (n) cap2.style.marginTop = '14px';
      box.appendChild(cap2);
      const rows2 = document.createElement('div'); rows2.className = 'rows';
      kept.forEach(r => {
        const w = document.createElement('div');
        w.className = 'bam-mrow kept';
        w.innerHTML = (r.cover_url ? '<img src="' + bamEsc(r.cover_url) + '" alt="">' : '<img alt="">')
          + '<div class="tx"><p class="mt">' + bamEsc(r.title||'') + '</p>'
          + '<div class="ma">' + bamEsc(r.author||'—') + '</div></div>'
          + '<div class="keep"><button class="out">서가로 꺼내기</button></div>';
        const ob = w.querySelector('.out');
        ob.addEventListener('click', async () => {
          ob.disabled = true; ob.textContent = '꺼내는 중…';
          try {
            await EGBookAdd.archive(r.id, false);
            await loadBooks(BAM_OWNER); buildShelfPages(); buildDots();
            ob.textContent = '꺼냈습니다';
          } catch(e){ alert('꺼내지 못했습니다 — ' + (e.message||e)); ob.disabled = false; ob.textContent = '서가로 꺼내기'; }
        });
        rows2.appendChild(w);
      });
      box.appendChild(rows2);
    }
    box.className = 'bam-mine on';
  }

  function bamRender(books){
    const grid = bamEl('bam-grid'); grid.innerHTML = '';
    (books||[]).forEach(b => {
      const cover = b.cover_url || '';
      const card = document.createElement('button');
      card.className = 'bam-card' + (b.owned ? ' owned' : '');
      card.innerHTML = (b.owned ? '<span class="bam-own">' + (b.owned_kept ? '보관함에' : '이미 있음') + '</span>' : '')
        + '<div class="bam-cover">'
        + (cover ? '<img loading="lazy" src="' + bamEsc(cover) + '" alt="">' : '<div class="bam-noimg">표지 없음</div>')
        + '</div><div class="bam-ct">' + bamEsc(b.title||'') + '</div><div class="bam-ca">' + bamEsc(b.author||'—') + '</div>';
      card.onclick = () => bamChoose(b);
      grid.appendChild(card);
    });
  }

  function bamChoose(b){
    BAM_CURRENT = b;
    const img = bamEl('bam-pimg');
    img.src = b.cover_url || ''; img.style.display = b.cover_url ? 'block' : 'none';
    bamEl('bam-ptitle').textContent = b.title || '';
    bamEl('bam-pauth').textContent = b.author || '—';
    bamEl('bam-ppub').textContent = b.publisher || '—';
    bamEl('bam-pisbn').textContent = b.isbn || '—';
    const res = bamEl('bam-result'); res.className = 'bam-result'; res.innerHTML = '';
    /* ⚠ 이미 꽂힌 책이면 미리 일러 준다. 막지는 않는다 — 개정판을 일부러 들이는 손님이 있다 */
    const add = bamEl('bam-add');
    if (add) add.textContent = b.owned ? '📚 그래도 한 권 더 들이기' : '📚 내 책방에 들이기';
    if (b.owned){
      res.className = 'bam-result ok';
      res.innerHTML = b.owned_kept
        ? '이 책은 <b>보관함에 있습니다.</b><br><span class="sm">위 칸에서 서가로 꺼내시는 편이 낫습니다.</span>'
        : '이 책은 <b>이미 책방에 있습니다.</b><br><span class="sm">다른 판본이라면 그대로 들이셔도 됩니다.</span>';
    }
    const picked = bamEl('bam-picked'); picked.className = 'bam-picked on';
    picked.scrollIntoView({ behavior:'smooth', block:'center' });
  }

  /* 들이기 — 배관은 부품이, 화면과 뒷일은 여기가.
     ⚠ 도장은 여기서 안 놓는다. 모달을 닫을 때 놓는다(0812) */
  async function bamAddBook(){
    if (!BAM_CURRENT) return;
    const res = bamEl('bam-result'), addBtn = bamEl('bam-add');
    if (!BAM_OWNER){ res.className = 'bam-result ng'; res.innerHTML = '⚠️ 로그인이 필요합니다.'; return; }
    addBtn.disabled = true; res.className = 'bam-result on';
    res.innerHTML = '표지를 우리 책방으로 옮기는 중…';
    try {
      const out = await EGBookAdd.add(BAM_CURRENT, BAM_OWNER, function(step){
        if (step === 'insert'){ res.className = 'bam-result on'; res.innerHTML = '서가에 꽂는 중…'; }
      });
      const row = out.row;
      BAM_STAMP_FOR = BAM_CURRENT.title;   /* 0812 — 도장은 모달을 닫을 때 놓는다 */
      res.className = 'bam-result ok';
      res.innerHTML = '✅ <b>' + bamEsc(BAM_CURRENT.title) + '</b> 들였습니다!<br>'
        + '<span class="sm">표지 ' + out.via + ' 복사 · 원본 ' + (out.w&&out.h ? out.w+'×'+out.h : '크기?')
        + (row && row.id ? ' · row ' + String(row.id).slice(0,8) + '…' : '') + '</span>'
        + '<button class="bam-back" id="bam-back">📚 서가로 돌아가기</button>';
      /* ⚠ 눈이 있는 곳에 문을 낸다 — 완료 글귀 밑이 곧 출구다.
         이 문이 없으면 손님은 오른쪽 위를 더듬다 지구로 떨어진다(0809 소로 발견) */
      const bb = document.getElementById('bam-back');
      if (bb) bb.addEventListener('click', closeAddModal);
      /* ⭐ 끝나고 무엇을 할지는 부르는 쪽이 정한다 — 여기는 책장을 다시 그린다 */
      await loadBooks(BAM_OWNER);
      buildShelfPages();
      buildDots();
    } catch(e){
      res.className = 'bam-result ng';
      res.innerHTML = '들이기가 막혔어요<br><span class="sm">' + bamEsc(e.message||e) + '</span>';
    } finally { addBtn.disabled = false; }
  }

  // ── 읽어온 책을 6권씩 페이지로 자른다 ──

  /* ── 읽어온 책을 아홉 권씩 면으로 자른다 ── */
  function buildPages() {
    PAGES = [];
    const S = slots();
    for (let i = 0; i < BOOKS.length; i += PER_PAGE) {
      PAGES.push(BOOKS.slice(i, i + PER_PAGE).map((b, j) => ({ book: b, slot: S[j] })));
    }
    if (!PAGES.length) PAGES = [[]];   /* 빈 책방도 한 면(화살표·닷 안전) */
  }

  /* ⭐ 자석 앉히기 — 밑변과 가운뎃줄은 못이고, 크기만 손님 것이다.
     너비는 무대 비율로 환산해서 미리 안다(DOM을 안 잰다).
       칸 폭%  = bay% × (무대세로/무대가로) ÷ 판형비 … STAGE_AR 한 상수로 접힌다 */
  function placeBook(el, book, slot) {
    const ratio = (book.cover_w && book.cover_h) ? (book.cover_h / book.cover_w) : 1.5;
    const sc = (book.scale != null && Number(book.scale) > 0) ? Number(book.scale) : 1;
    let h = slot.bay * 0.86 * sc;                 /* 기본 = 그 칸의 86% */
    h = Math.min(h, slot.bay - 0.55);             /* 천장을 안 뚫는다 */
    let w = h / STAGE_AR / ratio;                 /* 높이% → 너비% */
    if (w > slot.col * 0.92) {                    /* 옆 칸 중심선을 안 넘는다 */
      w = slot.col * 0.92;
      h = w * STAGE_AR * ratio;
    }
    el.style.left = slot.left + '%';
    el.style.top  = slot.top  + '%';              /* = 밑줄. translateY(-100%)가 세운다 */
    el.style.height = h + '%';
    el.style.width  = 'auto';
  }

  function buildShelfPages() {
    const stack = document.getElementById('bk-cover-stack');
    if (!stack) return;
    stack.innerHTML = '';
    PAGES.forEach((pageData, idx) => {
      const page = document.createElement('div');
      page.className = 'cover-page' + (idx === currentShelfPage ? ' active' : '');
      pageData.forEach(({ book, slot }) => {
        const el = document.createElement('div');
        el.className = 'cover-book';
        el._book = book; el._slot = slot;         /* ⚠ 번호가 아니라 책을 붙든다 — 순서가 바뀌어도 그 책이 열린다 */
        placeBook(el, book, slot);
        el.innerHTML = `<img src="${book.cover}" alt="${escAttr(book.title)}" title="${escAttr(book.title)} · ${escAttr(book.author||'')}">`
                     + `<div class="bk-handle" data-h="1"></div>`
                     + `<button class="bk-del" data-h="1" title="보관함에 넣기">🗄</button>`;
        el.addEventListener('click', (e) => {
          if (editMode) { if (!e.target.dataset.h) selectBook(el); return; }
          openBook(book);
        });
        bindEdit(el);
        page.appendChild(el);
      });
      stack.appendChild(page);
    });
  }
  function escAttr(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  /* ════ 편집 ════ */
  function toggleEdit() {
    editMode = !editMode;
    const fc = document.querySelector('.floor-content[data-floor="3"]');
    if (fc) fc.classList.toggle('editing', editMode);
    /* ⚠ 0819 — 이 모드 안에 보관이 숨어 있었다. 다음에 무엇을 할지까지 말한다 */
    const tip = document.getElementById('bk-edit-tip');
    if (tip) tip.hidden = !editMode;
    const btn = document.getElementById('bk-edit-toggle');
    if (btn) { btn.classList.toggle('on', editMode); btn.textContent = editMode ? '✓' : '✎'; }
    if (!editMode && selEl) { selEl.classList.remove('sel'); selEl = null; }
    editTip();
  }
  function selectBook(el) {
    if (selEl && selEl !== el) selEl.classList.remove('sel');
    selEl = el; el.classList.add('sel');
    editTip();
  }

  /* 고르기 전과 뒤에 다른 말을 한다 — 걸음이 끊기던 곳이 여기였다 */
  function editTip(){
    const tip = document.getElementById('bk-edit-tip');
    if (!tip || tip.hidden) return;
    tip.innerHTML = selEl
      ? '모서리 <b>🗄</b> 를 누르면 보관함에 들어갑니다 · <b>◢</b> 는 크기'
      : '옮기거나 보관하려면 <b>책을 한 번 누르세요</b>';
  }

  function bindEdit(el) {
    const book = el._book;
    let drag = false, sx, sy, bx, by;
    const dStart = (cx, cy) => {
      if (!editMode) return;
      selectBook(el); drag = true; sx = cx; sy = cy;
      bx = el._slot.left; by = el._slot.top;
      el.classList.add('grabbing');
    };
    const dMove = (cx, cy) => {
      if (!drag) return;
      const stack = el.closest('.cover-stack'); if (!stack) return;
      el.style.left = (bx + ((cx - sx) / stack.offsetWidth ) * 100) + '%';
      el.style.top  = (by + ((cy - sy) / stack.offsetHeight) * 100) + '%';
    };
    const dEnd = () => {
      if (!drag) return; drag = false; el.classList.remove('grabbing');
      snapSwap(el, book);
    };
    el.addEventListener('mousedown', (e) => {
      if (!editMode || e.target.dataset.h) return;
      e.preventDefault(); dStart(e.clientX, e.clientY);
      const mm = ev => dMove(ev.clientX, ev.clientY);
      const mu = () => { dEnd(); removeEventListener('mousemove', mm); removeEventListener('mouseup', mu); };
      addEventListener('mousemove', mm); addEventListener('mouseup', mu);
    });
    el.addEventListener('touchstart', (e) => {
      if (!editMode || e.target.dataset.h) return;
      const t = e.touches[0]; dStart(t.clientX, t.clientY);
    }, { passive: true });
    el.addEventListener('touchmove', (e) => {
      if (!drag) return; e.preventDefault(); const t = e.touches[0]; dMove(t.clientX, t.clientY);
    }, { passive: false });
    el.addEventListener('touchend', dEnd);
    el.addEventListener('touchcancel', dEnd);

    el.addEventListener('wheel', (e) => {
      if (!editMode) return; e.preventDefault(); selectBook(el);
      const cur = (book.scale != null) ? Number(book.scale) : 1;
      book.scale = +Math.max(0.5, Math.min(1.16, cur + (e.deltaY < 0 ? 0.03 : -0.03))).toFixed(3);
      placeBook(el, book, el._slot);
      clearTimeout(el._szT); el._szT = setTimeout(() => saveBook(book), 400);
    }, { passive: false });

    const handle = el.querySelector('.bk-handle');
    let hBase, hsx;
    const hStart = (cx) => { selectBook(el); hBase = (book.scale != null) ? Number(book.scale) : 1; hsx = cx; };
    const hMove = (cx) => {
      book.scale = +Math.max(0.5, Math.min(1.16, hBase + (cx - hsx) / 160)).toFixed(3);
      placeBook(el, book, el._slot);
    };
    handle.addEventListener('mousedown', (e) => {
      if (!editMode) return; e.preventDefault(); e.stopPropagation(); hStart(e.clientX);
      const mm = ev => hMove(ev.clientX);
      const mu = () => { saveBook(book); removeEventListener('mousemove', mm); removeEventListener('mouseup', mu); };
      addEventListener('mousemove', mm); addEventListener('mouseup', mu);
    });
    handle.addEventListener('touchstart', (e) => {
      if (!editMode) return; e.stopPropagation(); hStart(e.touches[0].clientX);
      const tm = ev => { ev.preventDefault(); hMove(ev.touches[0].clientX); };
      const tu = () => { saveBook(book); removeEventListener('touchmove', tm); removeEventListener('touchend', tu); };
      addEventListener('touchmove', tm, { passive: false }); addEventListener('touchend', tu);
    }, { passive: true });

    /* ── 🗄 보관함에 넣기 (0819 · 소로 결정 — 지우기를 보관으로) ──
       ⭐ 「되돌릴 수 없습니다」라는 문이 여기서 없어졌다. 글도 그대로 남는다.
       ⚠ 아주 지우는 손은 보관함 안에만 둔다 */
    const del = el.querySelector('.bk-del');
    if (del) del.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!editMode) return;
      if (!confirm(`『${book.title}』을(를) 보관함에 넣을까요?\n서가에서만 내려옵니다. 글도 그대로 남고 언제든 다시 꺼낼 수 있습니다.`)) return;
      del.disabled = true;
      try {
        await EGBookAdd.archive(book.id, true);
        /* ⚠ DB가 받아준 뒤에만 화면을 정리한다 — 실패했는데 화면에서만 사라지면
           새로고침 때 되살아나 유령이 된다 */
        BOOKS = BOOKS.filter(b => b.id !== book.id);
        if (selEl === el) selEl = null;
        const keep = Math.min(currentShelfPage, Math.max(0, Math.ceil((BOOKS.length||1)/PER_PAGE) - 1));
        currentShelfPage = keep;
        buildPages(); buildShelfPages(); buildDots();
      } catch (err) {
        alert('보관함에 넣지 못했습니다 — ' + (err.message || err));
        del.disabled = false;
      }
    });
  }

  /* 놓은 자리에서 가장 가까운 칸을 찾아 그 칸 책과 자리를 맞바꾼다.
     ⚠ seq 교환은 DB 함수 한 번(wk_book_swap_seq) — 화면이 두 번 치면
       하나만 성공했을 때 두 책이 같은 자리에 선다 */
  async function snapSwap(el, book) {
    const stack = el.closest('.cover-stack');
    const fromSlot = el._slot;
    if (!stack) { placeBook(el, book, fromSlot); return; }
    const sRect = stack.getBoundingClientRect();
    const eRect = el.getBoundingClientRect();
    const cx = ((eRect.left + eRect.width/2 - sRect.left) / sRect.width ) * 100;
    const cy = ((eRect.bottom            - sRect.top ) / sRect.height) * 100;
    let best = null, bd = Infinity;
    slots().forEach(s => {
      const d = (s.left - cx)*(s.left - cx) + (s.top - cy)*(s.top - cy)*0.6;
      if (d < bd) { bd = d; best = s; }
    });
    if (!best || best.i === fromSlot.i) { placeBook(el, book, fromSlot); return; }
    let targetEl = null;
    el.parentElement.querySelectorAll('.cover-book').forEach(o => {
      if (o !== el && o._slot && o._slot.i === best.i) targetEl = o;
    });
    if (!targetEl) { placeBook(el, book, fromSlot); return; }   /* 빈 칸 = 상대 없음 → 제자리 */
    const targetBook = targetEl._book;
    el._slot = best; targetEl._slot = fromSlot;
    placeBook(el, book, best);
    placeBook(targetEl, targetBook, fromSlot);
    const ok = await swapSeq(book.id, targetBook.id);
    if (ok) { const a = book.seq; book.seq = targetBook.seq; targetBook.seq = a; }
    else {
      el._slot = fromSlot; targetEl._slot = best;               /* DB가 안 받으면 화면도 되돌린다 */
      placeBook(el, book, fromSlot); placeBook(targetEl, targetBook, best);
    }
  }

  /* 자리 교환 — 둘 다 되거나 둘 다 안 되거나 (SECURITY DEFINER · 남의 서가는 거절) */
  async function swapSeq(idA, idB) {
    try {
      const r = await sbFetch('/rest/v1/rpc/wk_book_swap_seq', {
        method: 'POST', body: JSON.stringify({ p_a: idA, p_b: idB })
      });
      return r === true || r === 'true';
    } catch (e) { console.warn('[책의 방] 자리 교환 실패', e); return false; }
  }

  async function saveBook(book) {
    try {
      await sbFetch(`/rest/v1/wunderkammer_books?id=eq.${book.id}`, {
        method: 'PATCH', headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ scale: book.scale })   /* 자리는 seq가 정한다. 여기선 크기만 */
      });
    } catch (e) { /* 다음 조작에서 재시도 */ }
  }

  function buildDots() {
    const dots = document.getElementById('bk-dots');
    if (!dots) return;
    dots.innerHTML = '';
    if (PAGES.length < 2) return;                 /* 한 면뿐이면 닷을 안 세운다 */
    for (let i = 0; i < PAGES.length; i++) {
      const dot = document.createElement('div');
      dot.className = 'bk-dot' + (i === currentShelfPage ? ' active' : '');
      dot.addEventListener('click', () => transitionTo(i));
      dots.appendChild(dot);
    }
  }
  function transitionTo(idx) {
    if (isTransitioning || idx === currentShelfPage) return;
    isTransitioning = true;
    const pages = document.querySelectorAll('.floor-content[data-floor="3"] .cover-page');
    if (!pages.length) { isTransitioning = false; return; }
    pages[currentShelfPage].classList.remove('active');
    pages[idx].classList.add('active');
    currentShelfPage = idx;
    document.querySelectorAll('.floor-content[data-floor="3"] .bk-dot')
      .forEach((d, i) => d.classList.toggle('active', i === currentShelfPage));
    setTimeout(() => { isTransitioning = false; }, 600);
  }
  function slide(direction) {
    if (!PAGES.length) return;
    const next = (currentShelfPage + direction + PAGES.length) % PAGES.length;
    transitionTo(next);
  }

  const modal = document.getElementById('book-modal');
  let currentBook = null;
  const flipSound = document.getElementById('page-flip-sound');

  function playFlipSound() {
    /* ⚠ 0809: 모듈을 새로 그으면서 soundEnabled 선언을 지워 놓고 조건만 남겼다.
       매 장마다 ReferenceError가 나서 소리가 통째로 죽었다 —
       문법 검사도 미정의 **호출** 검사도 변수는 못 잡는다(함정 BB의 사각). */
    if (muted || !flipSound) return;
    flipSound.currentTime = 0; flipSound.volume = 0.5;
    flipSound.play().catch(() => {});
  }
  function openBook(book) {
    currentBook = book;
    buildFlipbook(book, paginateEssay(book));
    modal.classList.add('open');
    loadBookNotes(book);              /* ⭐ 0819 — 독서비행 기록을 데려온다 */
    // 내 책일 때만 글쓰기 버튼 (미래 순례 ?user= 대비)
    const myUid = getUser()?.id;
    const mine = !book.owner_id || book.owner_id === myUid;
    /* ⚠ 단추 하나가 아니라 도크째 세운다. 안 그러면 남의 책에서 빈 ⋮만 남는다 */
    const dock = document.getElementById('bm-dock');
    if (dock) dock.hidden = !mine;
    const dmenu = document.getElementById('bm-dock-menu');
    const dh    = document.getElementById('bm-dock-h');
    if (dmenu) dmenu.hidden = true;                 /* 책을 열 때마다 접힌 채로 시작 */
    if (dh) dh.classList.remove('on');
  }
  // essay_body(긴 글) → 면 단위로 분할해 모달에 흐름. 없으면 안내.
  function escHtml(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  // 빈 글: 안내 두 면
  function emptyFaces(book){
    return [
      { title: book.title, paras: [`아직 『${book.title}』에 대한 글이 없습니다.`, '이 책과 당신 삶이 어떻게 만났는지, 한 편의 글로 남겨 보세요.'] },
      { title: null, paras: ['어떤 시기에 어떻게 다가왔는지, 왜 이 책을 사랑하는지.', '글은 곧 이 면에 펼쳐집니다.'] }
    ];
  }

  /* ⭐⭐ 0819 — 독서비행 기록(eg_book_notes)을 책 모달로 데려온다.
     ⚠ 소로: 「페터 카멘친트 입력한 내용이 저장은 된 거 같은데 책 모달 안에는 연결이 안 되어 있음」
       맞다. 좌석에서 쓴 글은 eg_book_notes 에 사는데 이 모달은 essay_body 만 보고 있었다.
     ⭐ 23호 — 글은 한 종류다. 옛 essay 와 새 회차를 **한 책 안에서 이어 붙인다.**
       회차마다 새 면에서 시작한다 — 장이 바뀌면 새 쪽에서 시작하는 실제 책처럼. */
  function bookSections(book){
    const out = [];
    const own = (book.essay_body || '').trim();
    if (own) out.push({ title: book.essay_title || book.title || '', body: own });
    (book.__notes || []).forEach(n => {
      const b = String(n.body || '').trim();
      if (!b) return;
      out.push({ title: '제' + n.seq + '회' + (n.place ? ' · ' + n.place : ''), body: b });
    });
    return out;
  }
  // 실측: 본문을 면 크기에 맞춰 여러 면으로 분할 (넘치면 다음 면 / 단락이 면보다 길면 어절로 쪼갬)
  function paginateEssay(book){
    const sections = bookSections(book);
    if(!sections.length) return { faces: emptyFaces(book), empty:true };
    const paras = [];
    sections.forEach((sec, si) => {
      paras.push({ __head: sec.title, __first: si === 0 });
      sec.body.split(/\n{2,}/).map(s => s.trim()).filter(Boolean).forEach(t => paras.push(t));
    });

    // 측정용 면 — 실제 .front 와 동일 클래스·컨텍스트(modal 안), 화면 밖
    const host = document.createElement('div');
    host.className = 'book';
    host.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none;';
    host.innerHTML = '<div class="page"><div class="front"><div class="page-content"></div></div></div>';
    modal.appendChild(host);
    const pc = host.querySelector('.page-content');
    const render = (t, ps) => { pc.innerHTML = (t?`<h2>${escHtml(t)}</h2>`:'') + ps.map(p=>`<p>${escHtml(p)}</p>`).join(''); };
    const overflow = () => pc.scrollHeight > pc.clientHeight + 1;

    const faces = [];
    const queue = paras.slice();
    let guard = 0;
    let t = '';
    while(queue.length && guard++ < 400){
      /* ⭐ 회차 머리를 만나면 그 면은 거기서 새로 시작한다 */
      if(queue[0] && queue[0].__head !== undefined){ t = queue.shift().__head || ''; }
      else t = '';
      const accepted = [];
      while(queue.length){
        if(queue[0] && queue[0].__head !== undefined) break;   /* 다음 회차 — 이 면 마감 */
        render(t, [...accepted, queue[0]]);
        if(!overflow()){ accepted.push(queue.shift()); continue; }
        if(accepted.length === 0){
          // 단락 하나가 한 면보다 김 → 어절 단위로 쪼갬
          const words = queue.shift().split(/(\s+)/);
          let lo = '';
          for(let k=0; k<words.length; k++){
            const test = lo + words[k];
            render(t, [test]);
            if(overflow() && lo.trim()) break;
            lo = test;
          }
          lo = lo.trim() || (words[0]||'');
          accepted.push(lo);
          const remain = words.join('').slice(lo.length).replace(/^\s+/, '');
          if(remain) queue.unshift(remain);
        }
        break; // 이 면 마감
      }
      if(accepted.length || t) faces.push({ title: t || null, paras: accepted });
    }
    host.remove();
    return { faces, empty:false };
  }
  /* ⭐ 0819 — eg_book_notes 를 데려와 책을 다시 짠다.
     ⚠ 늦게 온 응답은 그 사이 다른 책을 열었으면 버린다 — 남의 책에 남의 글이 서면 안 된다. */
  function loadBookNotes(book){
    if (!book || !book.id) return;
    sbFetch('/rest/v1/rpc/get_my_book_notes', {
      method: 'POST', body: JSON.stringify({ p_book: book.id })
    }).then(rows => {
      if (currentBook !== book) return;
      const got = (rows || []).filter(n => String(n.body || '').trim());
      if (!got.length) return;
      book.__notes = got;
      buildFlipbook(book, paginateEssay(book));
    }).catch(e => console.warn('[책의 방] 독서비행 기록을 못 데려왔습니다:', e && e.message));
  }
  function closeBook() {
    modal.classList.remove('open');
    setTimeout(() => { const b = modal.querySelector('.book'); if (b) b.remove(); }, 500);
  }
  function buildFlipbook(book, result) {
    const old = modal.querySelector('.book'); if (old) old.remove();
    const bookEl = document.createElement('div'); bookEl.className = 'book';

    // 읽기 순서: page0 = 표지(front) + 첫 면(back) / 이후 page = 면(front)+면(back) / 끝 면
    const seq = result.faces.slice();
    seq.push({ end:true, book });   // 마지막 끝 면

    bookEl.appendChild(buildPageEl(makeCoverHtml(book), makeFaceHtml(seq[0], 'back')));
    let i = 1;
    while (i < seq.length) {
      const front = makeFaceHtml(seq[i], 'front');
      const back  = (i+1 < seq.length) ? makeFaceHtml(seq[i+1], 'back') : makeBlankHtml();
      bookEl.appendChild(buildPageEl(front, back));
      i += 2;
    }

    modal.insertBefore(bookEl, modal.firstChild);
    bookEl.style.setProperty('--c', 0);
    bookEl.querySelectorAll('.page').forEach((page, idx) => {
      page.style.setProperty('--i', idx);
      page.addEventListener('click', (evt) => {
        if (evt.target.closest('a')) return;
        const curr = evt.target.closest('.back') ? idx : idx + 1;
        const prev = parseInt(bookEl.style.getPropertyValue('--c')) || 0;
        bookEl.style.setProperty('--c', curr);
        if (curr !== prev) playFlipSound();
      });
    });
  }
  function buildPageEl(frontHtml, backHtml) {
    const page = document.createElement('div'); page.className = 'page';
    page.innerHTML = frontHtml + backHtml; return page;
  }
  function makeCoverHtml(book) { return `<div class="front cover"><div class="cover-bg" style="background-image:url('${book.cover}')"></div></div>`; }
  function makeFaceHtml(face, side) {
    const cls = (side === 'back') ? 'back' : 'front';
    if (face.end) {
      const b = face.book;
      return `<div class="${cls} cover" style="background:#faf7f0;color:#2a1810"><div class="page-end"><h2>— 끝 —</h2><p class="author">${escHtml(b.author || '')}</p><p class="book-title">『${escHtml(b.essay_title || b.title || '')}』</p></div></div>`;
    }
    const h  = face.title ? `<h2>${escHtml(face.title)}</h2>` : '';
    const ps = (face.paras || []).map(p => `<p>${escHtml(p)}</p>`).join('');
    return `<div class="${cls}"><div class="page-content">${h}${ps}</div></div>`;
  }
  function makeBlankHtml() {
    return `<div class="back"><div class="page-content"></div></div>`;
  }

  // 모달 닫기 (한 번만 바인딩)
  document.getElementById('modal-close').addEventListener('click', closeBook);

  // ════ 에세이 글쓰기 (책 모달 안 ✎ → 양피지 입력 레이어 → DB 저장 → 면에 흐름) ════
  function openEssayEditor() {
    if (!currentBook) return;
    document.getElementById('ee-book-title').textContent = '『' + (currentBook.title || '') + '』';
    document.getElementById('ee-title').value = currentBook.essay_title || '';
    document.getElementById('ee-body').value  = currentBook.essay_body || '';
    updateEssayCount();
    document.getElementById('essay-editor').classList.add('open');
    setTimeout(() => document.getElementById('ee-body').focus(), 120);
  }
  function closeEssayEditor() {
    document.getElementById('essay-editor').classList.remove('open');
  }
  function updateEssayCount() {
    const n = document.getElementById('ee-body').value.length;
    document.getElementById('ee-count').textContent = n.toLocaleString() + '자';
  }
  async function saveEssay() {
    if (!currentBook) return;
    const title = document.getElementById('ee-title').value.trim();
    const body  = document.getElementById('ee-body').value.trim();
    const saveBtn = document.getElementById('ee-save');
    saveBtn.disabled = true; saveBtn.textContent = '저장 중…';
    try {
      await sbFetch(`/rest/v1/wunderkammer_books?id=eq.${currentBook.id}`, {
        method: 'PATCH', headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ essay_title: title || null, essay_body: body || null })
      });
      currentBook.essay_title = title || null;
      currentBook.essay_body  = body || null;
      closeEssayEditor();
      buildFlipbook(currentBook, paginateEssay(currentBook));  // 새 글을 면에 다시 흘림
    } catch (e) {
      alert('저장에 실패했습니다. 잠시 후 다시 시도해 주세요.');
    } finally {
      saveBtn.disabled = false; saveBtn.textContent = '저장';
    }
  }
  document.getElementById('essay-write-btn').addEventListener('click', openEssayEditor);
  /* ⭐ 0819 — 보관함으로 가는 주 경로.
     ⚠ 편집 모드 안 🗄 은 아무도 못 찾았다(소로 0819). 손님의 뜻은
       「이 책을 내리고 싶다」이지 「배치를 고치고 싶다」가 아니다 —
       그 뜻은 책을 펼친 다음에 생긴다. 그러니 문도 거기 있어야 한다 */
  (function(){
    const kb = document.getElementById('bm-keep-btn');
    if (!kb) return;
    kb.addEventListener('click', async () => {
      if (!currentBook) return;
      if (!confirm(`『${currentBook.title}』을(를) 보관함에 넣을까요?\n서가에서만 내려옵니다. 글도 그대로 남고 언제든 다시 꺼낼 수 있습니다.`)) return;
      kb.disabled = true;
      try {
        await EGBookAdd.archive(currentBook.id, true);
        const gone = currentBook.id;
        closeBook();
        BOOKS = BOOKS.filter(b => b.id !== gone);
        currentShelfPage = Math.min(currentShelfPage, Math.max(0, Math.ceil((BOOKS.length||1)/PER_PAGE) - 1));
        buildPages(); buildShelfPages(); buildDots();
      } catch(e){ alert('보관함에 넣지 못했습니다 — ' + (e.message||e)); }
      finally { kb.disabled = false; }
    });
  })();
  (function(){
    const h = document.getElementById('bm-dock-h'), m = document.getElementById('bm-dock-menu');
    if (h && m) h.addEventListener('click', () => {
      m.hidden = !m.hidden; h.classList.toggle('on', !m.hidden);
    });
  })();
  document.getElementById('ee-cancel').addEventListener('click', closeEssayEditor);
  document.getElementById('ee-save').addEventListener('click', saveEssay);
  document.getElementById('ee-body').addEventListener('input', updateEssayCount);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeBook(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeBook();
  });

  return { markup, mount, slide };
})();

  async function f4OpenBook(b){

                   library:b.library||{}, curation_links:b.curation_links||null,
                   metAt: b.at ? String(b.at).slice(0,10).replace(/-/g,'. ') : '' };            /* 만난 날 — 마지막 쪽에 선다 */
    /* ⭐ 0816 — 한스푼 책은 4겹이 questions 가 아니라 spoons 에 산다.
         서가에서 담아 온 것을 그대로 쓰고 아래 조회는 건너뛴다. seed_id 가 없어 물어도 빈손이다. */
    if (b.kind !== 'spoon') try{
      /* ⚠ 분더카머는 sbFetch(생 REST)를 쓰지만 이 집은 supabase-js(supa)를 쓴다.
           빌려온 코드에서 밖을 부르는 곳은 여기 하나뿐이었다(담 넘기 검사 실측). */
      const rows = await sbFetch('/rest/v1/questions?seed_id=eq.'
        + encodeURIComponent(b.seed_id || b.seed || '')
        + '&select=answer,keyword,category,library,curation_links&limit=1');
      if(rows && rows[0]){
        const q = rows[0];
        book.keyword = q.keyword || '';
        book.library = q.library || {};
        book.curation_links = q.curation_links || null;
        if(q.category) book.category = q.category;
      }
    }catch(e){ console.warn('[F4] library 조회 실패', e); }
    /* ⭐ 0818 — 한스푼 책이면 그 회차의 흔적을 함께 길어 온다.

    book.kind = b.kind || ''; book.spoon_id = b.spoon_id || null;
