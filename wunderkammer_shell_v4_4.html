    /* (도장 없음 — 위 ⚠ 참조) */
  }

  function f4AttachTilt(){
    const scene  = document.getElementById('f4coverScene');
    const book3d = document.getElementById('f4coverBook3D');
    scene.onmousemove = e => {
      if(f4IsAnimating) return;
      const r = scene.getBoundingClientRect();
      const dx = (e.clientX - (r.left + r.width/2))  / (r.width/2);
      const dy = (e.clientY - (r.top  + r.height/2)) / (r.height/2);
      book3d.style.transform = `rotateY(${-26 + dx*14}deg) rotateX(${4 - dy*8}deg)`;
      book3d.style.transition = 'transform 0.06s linear';
    };
    scene.onmouseleave = () => {
      if(f4IsAnimating) return;
      book3d.style.transform = 'rotateY(-26deg) rotateX(4deg)';
      book3d.style.transition = 'transform 0.5s cubic-bezier(0.23,1,0.32,1)';
    };
  }

  // ── 표지 클릭 → 내부 진입 (줌인) ──────────────
  function f4EnterBook(){
    if(f4IsAnimating) return;
    f4IsAnimating = true;
    const book3d = document.getElementById('f4coverBook3D');
    const shadow = document.getElementById('f4coverShadow');
    book3d.style.transition = 'transform 0.48s cubic-bezier(0.23,1,0.32,1)';
    book3d.style.transform  = 'rotateY(0deg) rotateX(0deg)';
    shadow.style.opacity    = '0';
    setTimeout(()=>{
      book3d.style.transition = 'transform 1.0s cubic-bezier(0.25,0,0.2,1), opacity 0.55s ease 0.45s';
      book3d.style.transform  = 'rotateY(0deg) rotateX(0deg) scale(3.8)';
      book3d.style.opacity    = '0';
    }, 450);
    setTimeout(()=>{
      document.getElementById('f4coverScene').style.visibility = 'hidden';
      document.getElementById('f4coverScene').style.pointerEvents = 'none';
      // 표지 리셋(다음 열기 대비)
      book3d.style.transition = 'none';
      book3d.style.transform  = 'rotateY(-26deg) rotateX(4deg)';
      book3d.style.opacity    = '1';
      f4ShowInnerPages();
      f4IsAnimating = false;
    }, 1100);
  }

  function f4ShowInnerPages(){
    const book = f4CurrentBook;
    f4CurrentPage = 0;
    const lib = book.library || {};
    const pages = f4BuildPages(book, lib);
    if(pages.length === 0){
      pages.push(f4MakeInnerPage('EG', book.answer, '아직 해설이 준비되지 않았습니다.', 1));
      pages.push(f4MakeLastPage(book, 2));
    }
    f4TotalPages = pages.length;

    const pagesEl = document.getElementById('f4bookPages');
    const navEl = pagesEl.querySelector('.f4book-nav');
    pagesEl.innerHTML = '';
    if(navEl) pagesEl.appendChild(navEl);

    pages.forEach((p, i) => {
      p.style.display       = 'flex';
      p.style.flexDirection = 'column';
      p.style.width         = '100%';
      p.style.height        = '460px';
      p.style.position      = 'absolute';
      p.style.top           = '0';
      p.style.left          = '0';
      p.style.right         = '0';
      p.style.zIndex        = i === 0 ? '12' : '1';
      p.style.transform     = i === 0 ? 'translateX(0)' : 'translateX(100%)';
      p.style.transition    = 'none';
      if(p.classList.contains('f4page-inner')){
        p.style.overflowX = 'hidden';
        p.style.overflowY = 'auto';
        p.style.webkitOverflowScrolling = 'touch';
      } else {
        p.style.overflow = 'hidden';
      }
      p.addEventListener('click', (ev) => {
        if(ev.target.closest('a, button, [data-no-flip]')) return;
        const rect = p.getBoundingClientRect();
        const x = ev.clientX - rect.left;
        if(x < rect.width * 0.35) f4TurnPage(-1);
        else if(x > rect.width * 0.65) f4TurnPage(1);
      });
      pagesEl.appendChild(p);
    });

    f4RenderDots();
    f4UpdateNavZones();

    const modal = document.getElementById('f4bookModal');
    modal.classList.add('visible');
    modal.style.visibility = 'visible';
    modal.style.opacity = '0';
    const vw = window.innerWidth, vh = window.innerHeight;
    modal.style.top  = Math.round((vh - 520) / 2) + 'px';
    modal.style.left = Math.round((vw - 340) / 2) + 'px';
    modal.style.transform = 'scale(0.96)';
    modal.style.transition = 'none';
    modal.getBoundingClientRect();
    modal.style.transition = 'opacity 0.38s ease, transform 0.38s ease';
    setTimeout(()=>{
      modal.style.opacity = '1';
      modal.style.transform = 'scale(1)';
      modal.style.pointerEvents = 'all';
    }, 30);
  }

  // ── 페이지 넘기기 (애플북스 슬라이드) ──────────
  function f4TurnPage(dir){
    if(f4IsAnimating) return;
    const next = f4CurrentPage + dir;
    if(next < 0 || next >= f4TotalPages) return;
    f4IsAnimating = true;
    f4PlaySound();
    const pagesEl  = document.getElementById('f4bookPages');
    const allPages = pagesEl.querySelectorAll('.f4book-page-view');
    const outPage  = allPages[f4CurrentPage];
    const inPage   = allPages[next];
    if(dir > 0){
      inPage.style.zIndex = '11';  inPage.style.transform = 'translateX(0)';  inPage.style.transition = 'none';
      outPage.style.zIndex = '12'; outPage.style.transition = 'none';         outPage.style.transform = 'translateX(0)';
      requestAnimationFrame(()=>{
        outPage.style.transition = 'transform 0.48s cubic-bezier(0.32,0.72,0,1)';
        outPage.style.transform  = 'translateX(-100%)';
      });
    } else {
      outPage.style.zIndex = '11'; outPage.style.transform = 'translateX(0)';  outPage.style.transition = 'none';
      inPage.style.zIndex = '13';  inPage.style.transition = 'none';           inPage.style.transform = 'translateX(100%)';
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
        inPage.style.transition = 'transform 0.48s cubic-bezier(0.32,0.72,0,1)';
        inPage.style.transform  = 'translateX(0)';
      }); });
    }
    setTimeout(()=>{
      f4CurrentPage = next;
      inPage.scrollTop = 0;
      inPage.style.zIndex  = '12';
      outPage.style.zIndex = '1';
      f4RenderDots();
      f4UpdateNavZones();
      f4IsAnimating = false;
    }, 490);
  }

  function f4UpdateNavZones(){
    const l = document.getElementById('f4navLeft');
    const r = document.getElementById('f4navRight');
    if(l) l.style.display = f4CurrentPage === 0              ? 'none' : 'flex';
    if(r) r.style.display = f4CurrentPage === f4TotalPages-1 ? 'none' : 'flex';
  }

  function f4RenderDots(){
    const dots = document.getElementById('f4bookDots');
    dots.innerHTML = '';
    for(let i = 0; i < f4TotalPages; i++){
      const dot = document.createElement('div');
      dot.className = 'f4book-page-dot' + (i === f4CurrentPage ? ' active' : '');
      dots.appendChild(dot);
    }
  }

  function f4CloseBook(){
    const overlay = document.getElementById('f4bookModalOverlay');
    document.getElementById('f4coverScene').style.visibility = 'visible';
    document.getElementById('f4coverScene').style.pointerEvents = 'auto';
    overlay.classList.remove('open', 'bg-light');
    const book3d = document.getElementById('f4coverBook3D');
    book3d.style.transition = 'none';
    book3d.style.transform  = 'rotateY(-26deg) rotateX(4deg)';
    book3d.style.opacity    = '1';
    document.getElementById('f4coverShadow').style.opacity = '1';
    const modal = document.getElementById('f4bookModal');
    modal.style.transition = 'opacity 0.38s ease, transform 0.38s ease';
    modal.style.opacity = '0';
    modal.style.transform = 'scale(0.96)';
    modal.style.pointerEvents = 'none';
    setTimeout(()=>{
      modal.style.visibility = 'hidden';
      modal.style.opacity = '0';
      modal.classList.remove('visible');
    }, 400);
    f4IsAnimating = false;
  }

  function f4OverlayClick(e){
    if(e.target === document.getElementById('f4bookModalOverlay')) f4CloseBook();
  }

  // ── 페이지 구성 (지식·사유·연결·큐레이션·마지막) ──
  function f4BuildPages(book, lib){
    const pages = [];
    if(lib.knowledge)  pages.push(f4MakeInnerPage('LAYER 1 · 지식', '알고 이해하기', lib.knowledge, pages.length + 1));
    if(lib.thought)    pages.push(f4MakeInnerPage('LAYER 2 · 사유', '생각하고 느끼기', lib.thought, pages.length + 1));
    if(lib.connection) pages.push(f4MakeInnerPage('LAYER 3 · 연결', '삶과 이어보기', lib.connection, pages.length + 1));
    if(lib.curation)        pages.push(f4MakeCurationPage(lib.curation, pages.length + 1, book.curation_links));
    else if(book.curation_links) pages.push(f4MakeCurationPage('', pages.length + 1, book.curation_links));
    /* 0818 — 한스푼 책이면 흔적 쪽이 완독 앞에 선다 */
    if (book.kind === 'spoon' && book.spoon_id) pages.push(f4MakeTracePage(book, pages.length + 1));
    pages.push(f4MakeLastPage(book, pages.length + 1));
    return pages;
  }

  function f4MakeInnerPage(tag, heading, body, num){
    const div = document.createElement('div');
    div.className = 'f4book-page-view f4page-inner';
    div.innerHTML = `
      <div class="f4page-lines"></div>
      <div class="f4page-inner-content">
        <div class="f4page-layer-tag">${tag}</div>
        <div class="f4page-layer-heading">${heading}</div>
        <div class="f4page-layer-body">${f4RenderMarkdown(body)}</div>
      </div>
      <div class="f4page-num-inner">${num}</div>
      <div class="f4page-corner"></div>`;
    return div;
  }

  function f4MakeCurationPage(curation, num, links){
    const div = document.createElement('div');
    div.className = 'f4book-page-view f4page-inner';
    const items = (curation || '').split('/').map(s => s.trim()).filter(Boolean);
    const itemsHtml = items.map(item => `
      <div style="padding:10px 0;border-bottom:1px solid rgba(180,160,120,0.15);font-size:13px;color:#3D2F10;font-family:'Noto Serif KR',serif;line-height:1.6">
        ${f4RenderMarkdown(item)}
      </div>`).join('');
    let linksHtml = '';
    if(links && (links.books || links.library_call_number || links.youtube_keywords)){
      linksHtml = f4RenderCurationLinks(links);
    }
    div.innerHTML = `
      <div class="f4page-lines"></div>
      <div class="f4page-inner-content">
        <div class="f4page-layer-tag">LAYER 4 · 큐레이션</div>
        <div class="f4page-layer-heading">더 깊이 들어가기</div>
        ${itemsHtml}
        ${linksHtml}
      </div>
      <div class="f4page-num-inner">${num}</div>
      <div class="f4page-corner"></div>`;
    return div;
  }

  // curation_links → HTML (책 찾기 / 도서관 청구기호 / 유튜브)
  function f4RenderCurationLinks(links){
    const sections = [];
    const linkStyle = "color:#8B6F2A;text-decoration:none;border-bottom:1px solid rgba(139,111,42,0.3);padding-bottom:1px";
    const stopProp = `onclick="event.stopPropagation()" ontouchstart="event.stopPropagation()"`;
    if(links.books && links.books.length > 0){
      const bookCards = links.books.map(b => {
        const title = b.title || '';
        const meta = [b.translator && `${b.translator} 옮김`, b.publisher].filter(Boolean).join(' · ');
        const parts = b.isbn ? [b.isbn] : [title, b.author, (b.translator || b.publisher)].filter(Boolean);
        const q = encodeURIComponent(parts.join(' '));
        const stores = [
          `<a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener" ${stopProp} style="${linkStyle}">책 찾기</a>`,
        ];
        const storesHtml = `<div style="margin-top:6px;font-size:11px;letter-spacing:0.05em">${stores.join(' · ')}</div>`;
        return `
          <div style="padding:10px 0;border-bottom:1px solid rgba(180,160,120,0.12);font-family:'Noto Serif KR',serif;">
            <div style="font-size:13px;color:#3D2F10;font-weight:500">${title}</div>
            ${meta ? `<div style="font-size:11px;color:rgba(80,60,30,0.6);margin-top:3px">${meta}</div>` : ''}
            ${storesHtml}
          </div>`;
      }).join('');
      sections.push(`
        <div style="margin-top:18px">
          <div style="font-size:10px;letter-spacing:0.18em;color:rgba(120,90,40,0.55);font-family:'Courier New',monospace;margin-bottom:6px">📖 책</div>
          ${bookCards}
        </div>`);
    }
    if(links.library_call_number){
      sections.push(`
        <div style="margin-top:18px">
          <div style="font-size:10px;letter-spacing:0.18em;color:rgba(120,90,40,0.55);font-family:'Courier New',monospace;margin-bottom:6px">🏛 도서관 청구기호</div>
          <div style="font-size:13px;color:#3D2F10;font-family:'Noto Serif KR',serif">${links.library_call_number}</div>
        </div>`);
    }
    if(links.youtube_keywords){
      const kw = encodeURIComponent(links.youtube_keywords);
      sections.push(`
        <div style="margin-top:18px">
          <div style="font-size:10px;letter-spacing:0.18em;color:rgba(120,90,40,0.55);font-family:'Courier New',monospace;margin-bottom:6px">▶ 영상</div>
          <a href="https://www.youtube.com/results?search_query=${kw}" target="_blank" rel="noopener" ${stopProp} style="${linkStyle};font-size:13px;font-family:'Noto Serif KR',serif">${links.youtube_keywords}</a>
        </div>`);
    }
    return sections.join('');
  }

  // 마지막 페이지 — 지성소로 돌아가기

  /* ⭐⭐ 0818 — 콩파뇽 흔적. 0525 회의록의 책 모달은 일곱 쪽이었고 그중 한 쪽이 이것이다.
       0526 강물 원칙 5.3 — 「사유 남긴 사람은 닉네임과 사유가 책 본문에 선다」.
       0806 리듬재편 6호 — 「오피니언은 회차에 쌓인다. 바퀴가 돌면 이전 바퀴가 아래 깔린다」.
     ⚠ 한스푼 책에만 선다. 스타디움에서 만난 책에는 오피니언이라는 물건이 없다.
     ⚠ 시간순이다 — 새 글을 위로 올리지 않는다. 지층은 쌓인 차례대로라야 지층이다.
     ⚠ 글이 빈 사람은 애초에 창이 안 낸다. 퀴즈만 푼 사람을 「말 없는 사람」으로 진열하지 않는다. */
  function f4MakeTracePage(book, num){
    const div = document.createElement('div');
    div.className = 'f4book-page-view f4page-inner';
    const rows = (book.opinions || []).map(o => `
      <div style="margin:0 0 15px;padding-bottom:13px;border-bottom:1px solid rgba(180,150,80,.14)">
        <div style="font-size:10.5px;color:rgba(150,120,60,.9);letter-spacing:.08em;
                    font-family:'Cormorant Garamond',serif;margin-bottom:5px">
          ${f4EscTrace(o.nickname)}
          <span style="color:rgba(120,100,60,.4);margin-left:7px">${f4EscTrace(String(o.at||'').slice(0,10).replace(/-/g,'. '))}</span>
        </div>
        <div style="font-size:12.5px;line-height:1.85;color:#4a3820;font-family:'Noto Serif KR',serif;
                    word-break:keep-all">${f4EscTrace(o.body)}</div>
      </div>`).join('');
    div.innerHTML = `
      <div class="f4page-lines"></div>
      <div class="f4page-inner-content">
        <div class="f4page-layer-tag">TRACES &middot; 콩파뇽 흔적</div>
        <div class="f4page-layer-heading">함께 읽은 사람들</div>
        <div class="f4page-layer-body" style="padding-top:4px">
          ${rows || '<div style="font-size:12px;color:rgba(100,80,40,.45);line-height:1.9">아직 아무도 한 줄을 남기지 않았습니다.<br>이 회차가 다시 열리는 날, 여기에 이야기가 쌓입니다.</div>'}
        </div>
      </div>
      <div class="f4page-num-inner">${num}</div>
      <div class="f4page-corner"></div>`;
    return div;
  }
  function f4EscTrace(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function f4MakeLastPage(book, num){
    const div = document.createElement('div');
    div.className = 'f4book-page-view f4page-philemon';
    div.innerHTML = `
      <div class="f4page-lines"></div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;">
        <div style="font-size:22px;margin-bottom:20px;opacity:0.4">✦</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:16px;color:#4a3820;margin-bottom:10px;letter-spacing:0.05em">${book.answer}</div>
        <div style="width:32px;height:1px;background:rgba(180,150,80,0.3);margin:12px auto"></div>
        <div style="font-size:11px;color:rgba(100,80,40,0.45);letter-spacing:0.18em;font-family:'Courier New',monospace;margin-bottom:24px">마지막 페이지입니다</div>
        <div style="font-size:10px;color:rgba(100,80,40,0.3);font-family:'Noto Serif KR',serif;line-height:1.9;margin-bottom:28px">이 책을 끝까지 읽었습니다.<br>${book.metAt ? book.metAt+' 에 만난 책입니다.' : '서가의 한 칸이 그만큼 깊어졌습니다.'}</div>
        <button class="f4-last-back" style="padding:8px 24px;border:1px solid rgba(180,150,80,0.3);border-radius:20px;background:rgba(201,168,76,0.07);color:rgba(160,120,50,0.8);font-size:11px;font-family:'Noto Serif KR',serif;letter-spacing:0.12em;cursor:pointer;transition:all 0.15s">서가로 돌아가기</button>
      </div>
      <div style="position:absolute;bottom:14px;right:24px;font-size:10px;color:rgba(100,80,40,0.25);font-family:'Courier New',monospace">${num}</div>`;
    const btn = div.querySelector('.f4-last-back');
    if(btn) btn.addEventListener('click', f4CloseBook);
    return div;
  }

  // ── 모달 이벤트 바인딩 (1회) ──────────────────
  function f4InitModal(){
    if(f4ModalInited) return;
    f4ModalInited = true;
    const overlay = document.getElementById('f4bookModalOverlay');
    document.getElementById('f4coverBook3D').addEventListener('click', f4EnterBook);
    overlay.addEventListener('click', f4OverlayClick);
    /* ⚠ 0818 소로 — 맨 위 × 를 걷었다(옷이 없어 브라우저 기본 단추로 서 있었다).
         닫는 문은 둘 남는다 — 바깥 누르기(f4OverlayClick)와 ESC. 책은 덮으면 닫힌다. */
    const l = document.getElementById('f4navLeft');
    const r = document.getElementById('f4navRight');
    if(l) l.addEventListener('click', ()=>f4TurnPage(-1));
    if(r) r.addEventListener('click', ()=>f4TurnPage(1));

    // 터치 스와이프 (실시간 드래그)
    let sx = 0, sy = 0, dragging = false, dragPage = null, onLink = false;
    overlay.addEventListener('touchstart', e => {
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; dragging = false;
      onLink = !!(e.target.closest && e.target.closest('a, button, [data-no-flip]'));
      const all = document.getElementById('f4bookPages').querySelectorAll('.f4book-page-view');
      dragPage = all[f4CurrentPage] || null;
    }, { passive:true });
    overlay.addEventListener('touchmove', e => {
      if(!dragPage || f4IsAnimating || onLink) return;
      const dx = e.touches[0].clientX - sx;
      const dy = e.touches[0].clientY - sy;
      if(!dragging && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) dragging = true;
      if(!dragging) return;
      if(dx < 0 && f4CurrentPage < f4TotalPages - 1){ dragPage.style.transition = 'none'; dragPage.style.transform = `translateX(${dx}px)`; }
      else if(dx > 0 && f4CurrentPage > 0){ dragPage.style.transition = 'none'; dragPage.style.transform = `translateX(${dx}px)`; }
    }, { passive:true });
    overlay.addEventListener('touchend', e => {
      if(onLink){ onLink = false; return; }
      if(!dragging || !dragPage) return;
      const dx = e.changedTouches[0].clientX - sx;
      const th = 60;
      if(dx < -th && f4CurrentPage < f4TotalPages - 1) f4TurnPage(1);
      else if(dx > th && f4CurrentPage > 0) f4TurnPage(-1);
      else { dragPage.style.transition = 'transform 0.32s cubic-bezier(0.23,1,0.32,1)'; dragPage.style.transform = 'translateX(0)'; }
      dragging = false; dragPage = null;
    }, { passive:true });
  }

  /* ⚠ 서가(블록 바깥)가 부르는 이름만 창구로 내준다 — 나머지는 안에 둔다.
     terra에서 세 번 사고가 난 「담 넘기」를 여기서 되풀이하지 않는다. */
  window.f4OpenBook  = f4OpenBook;
  window.f4CloseBook = f4CloseBook;
  window.f4TurnPage  = f4TurnPage;
  window.f4InitModal = f4InitModal;
})();

const Floor4 = (() => {
  let BOOKS = [], PAGES = [], COORDS = null, REAL_NO = 1;
  let page = 0, sliding = false, ruleOn = false, keeper = false;

  const RACKS = 4, PER_RACK = 14, PER_PAGE = RACKS * PER_RACK;
  const STAGE_AR = 941 / 1672;

  /* ⚠⚠ 0812 저녁 개정 — 칸마다 위·아래를 **따로** 준다.
       첫판은 줄 일곱(top·b1·b2·b3·bot)으로 칸을 나눠, 줄 하나가 「윗칸의 바닥」이자
       「아랫칸의 천장」을 겸했다. 그래서 한 칸을 맞추면 옆 칸이 찌그러졌다(소로 실측).
       2층은 표지가 밑줄에만 앉아 겸해도 됐지만, 3층 책등은 위에서 잘리고 아래에 서므로
       두 일이 한 줄에 얹히면 맞출 수가 없다.
     ⭐ 이제 칸 사이가 벌어져도 된다 — 실물 선반 판에도 두께가 있다. */
  const C0 = { l:22.95, r:80.02,
               t1:20.81, o1:33.31,  t2:33.31, o2:44.86,
               t3:44.86, o3:57.06,  t4:57.06, o4:69.86 };
  const KEYS = ['l','r','t1','o1','t2','o2','t3','o3','t4','o4'];

  /* 옛 일곱 값(top·b1·b2·b3·bot)으로 담긴 방은 열 값으로 풀어 앉힌다 —
     이미 맞춰 두신 것을 버리지 않는다 */
  function spread(c){
    if (!c || c.t1 != null || c.top == null) return c;
    return { l:c.l, r:c.r,
             t1:c.top, o1:c.b1, t2:c.b1, o2:c.b2,
             t3:c.b2,  o3:c.b3, t4:c.b3, o4:c.bot };
  }

  function co(){
    const c = spread(COORDS) || {};
    const o = {}; KEYS.forEach(k => { o[k] = (c[k] == null ? C0[k] : Number(c[k])); });
    return o;
  }

  /* 네 단 — 칸마다 제 천장과 제 바닥을 갖는다 */
  function racks(){
    const s = co();
    return [1,2,3,4].map(n => {
      const top = s['t'+n], bot = s['o'+n];
      return { i:n-1, top, bottom:bot, h: bot - top, l: s.l, w: s.r - s.l };
    });
  }

  function f4Esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function f4El(id){ return document.getElementById(id); }
  function f4Slot(){ try { return egSky.phase(); } catch(e){ return 'd'; } }

  /* 책등 그림·키 — 뮤세움과 같은 해시(book01~10.webp 공유).
     ⚠ 같은 책은 어느 건물에서 보아도 같은 책등이라야 한다 */
  const IMGS = ['book01','book02','book03','book04','book05','book06','book07','book08','book09','book10'];
  /* ⚠ 그림은 **저장소 뿌리의 상대 경로**다(뮤세움과 같다). Storage가 아니다.
       0812 내가 여기를 짐작으로 wk-assets/spines/로 적어 쉰여섯 권이 깨진 그림으로 섰다. */
  function bkImg(t){
    let h=0; for(const c of String(t)) h=(h*31+c.charCodeAt(0))&0xfffff;
    return IMGS[h % IMGS.length] + '.webp';
  }
  function bkKey(t){                       /* 키 변주 — 획일하면 서가가 아니라 색종이 띠가 된다 */
    let h=0; for(const c of String(t)) h=(h*17+c.charCodeAt(0))&0xfffff;
    return [.88,.92,.96,1,.94,.90,.98,.86,1,.93][h % 10];
  }

  /* ⚠ 책등에 설 수 있는 길이 — 뮤세움 SPINE_MAX 그대로(0807 실측).
       title은 「퀴즈 정답」이지 「책 이름」이 아니라 이따금 문장이 통째로 온다.
       세로쓰기는 한 줄에 열서넛이 한계고, 넘으면 두 줄이 되어 책등 폭을 다 먹는다.
     ⚠ 자르되 감추지 않는다 — 감싸개 title에 전체가 있고, 눌러 열면 온전히 보인다. */
  const SPINE_MAX = 13;
  const shortTitle = t => {
    const x = String(t ?? '');
    return x.length > SPINE_MAX ? x.slice(0, SPINE_MAX - 1) + '…' : x;
  };

  function bgUrl(no, t){
    const v = COORDS && COORDS._v ? '?v=' + COORDS._v : '';
    return SUPABASE_URL + '/storage/v1/object/public/wk-assets/sanctum/sanctum_'
         + String(no).padStart(2,'0') + '_' + t + '.webp' + v;
  }

  function markup(){
    return `
      <div class="floor-content" data-floor="4">
        <div class="f4-scroll" id="f4-scroll">
          <div class="f4-fit" id="f4-fit">
            <img id="f4-img" alt="">
            <div class="f4-stack" id="f4-stack"></div>
            <div class="f4-rule" id="f4-rule" hidden></div>
          </div>
        </div>
        <div class="f4-empty" id="f4-empty">
          아직 만난 책이 없습니다.<br>경기를 한 판 치르면 여기 한 권이 섭니다.
        </div>
        <div class="f4-pager" id="f4-pager" hidden>
          <button id="f4-prev" aria-label="앞 쪽 — 더 최근" title="더 최근으로">◀</button>
          <div class="f4-span" id="f4-span"></div>
          <button id="f4-next" aria-label="다음 쪽 — 더 예전" title="더 예전으로">▶</button>
        </div>
        <div class="f4-dock" id="f4-dock" hidden>
          <button id="f4-home-toggle" title="집 갈아타기" hidden>🏠</button>
          <button id="f4-rule-toggle" title="줄 맞추기" hidden>⚖</button>
        </div>
        <div class="f4-homes" id="f4-homes" hidden></div>
      </div>`;
      /* ⚠ 0818 — 옛 세 줄 카드(f4-modal · c-cat · c-title · c-met)를 걷었다.
           책등은 이제 되찾아 온 f4book 표지로 곧장 간다. 껍데기를 남겨 두면
           오늘 잡은 그 병(HTML만 남고 손이 없는 것)을 내가 다시 만드는 셈이다. */
  }

  /* ── 배경 — img 한 장 + 폴백 사슬. 실패하면 콘솔에 주소가 남는다 ── */
  function setBg(list){
    return new Promise(res => {
      const im = f4El('f4-img'); if(!im) return res(false);
      let i = 0;
      const tryNext = () => {
        if (i >= list.length){ console.warn('[지성소] 배경을 못 받았습니다:', list); return res(false); }
        const url = list[i++];
        im.onload  = () => { im.classList.add('on'); res(true); };
        im.onerror = () => tryNext();
        im.src = url;
      };
      tryNext();
    });
  }

  async function resolveOwnerId(){
    const q = new URLSearchParams(location.search).get('user');
    const me = getUser()?.id || null;
    if (!q) return me;
    try{
      const u = await sbFetch(`/rest/v1/users?nickname=eq.${encodeURIComponent(q)}&select=id`);
      return u?.[0]?.id || me;
    }catch(e){ console.warn('[지성소] 임자 조회 실패', e); return me; }
  }

  async function loadRoom(ownerId){
    let no = 1;
    try{
      if (ownerId){
        const w = await sbFetch(`/rest/v1/wunderkammer?user_id=eq.${ownerId}&select=living_no`);
        if (w?.[0]?.living_no) no = Number(w[0].living_no);
      }
    }catch(e){ console.warn('[지성소] 방 번호 조회 실패', e); }
    REAL_NO = no;
    try{
      const r = await sbFetch(`/rest/v1/living_room_floors?room_no=eq.${no}&floor=eq.3&select=coords,updated_at`);
      if (r?.[0]){ COORDS = Object.assign({}, r[0].coords || {}); COORDS._v = Date.parse(r[0].updated_at) || ''; }
      else COORDS = null;
    }catch(e){ console.warn('[지성소] 층 좌표 조회 실패', e); COORDS = null; }
  }

  /* ── 걸어온 길 — 창 하나만 부른다 ── */
  async function loadBooks(ownerId){
    BOOKS = [];
    if (!ownerId) return;
    try{
      const rows = await sbFetch('/rest/v1/rpc/shelf_of', {
        method:'POST', body: JSON.stringify({ p_owner: ownerId })
      });
      BOOKS = Array.isArray(rows) ? rows : [];
    }catch(e){ console.warn('[지성소] 서가를 못 읽었습니다', e); BOOKS = []; }
  }

  /* 면 0 = 가장 최근 묶음. 뒤로 갈수록 과거.
     ⚠ 가장 오래된 면만 덜 찬다 — 최신 쪽을 덜 채우면 새 책이 들어올 때마다 전 면이 밀린다 */
  function pageCount(){ return Math.max(1, Math.ceil(BOOKS.length / PER_PAGE)); }
  function pageBooks(p){
    const end = BOOKS.length - p * PER_PAGE;
    const seg = BOOKS.slice(Math.max(0, end - PER_PAGE), Math.max(0, end));
    /* ⭐ 0818 소로 — 뮤세움(0816)과 같은 차례로 맞춘다. **가장 최신 책이 맨 윗단 왼쪽**에 서고
         오른쪽으로 · 아래로 · 다음 쪽으로 밀린다. 여태는 정반대라 새 책이 맨 아래 오른쪽 구석에
         처박히고, 맨 위 왼쪽에 가장 오래된 책이 서 있었다.
       ⚠ BOOKS 자체(shelf_of 가 만난 순서로 준다)는 안 건드린다 — 쪽 나누기가 그 순서에 기댄다.
         화면에 세울 때만 뒤집는다. slice 가 새 배열을 주므로 reverse 가 원본을 안 다친다. */
    return seg.reverse();
  }
  function buildPages(){
    PAGES = [];
    for (let p = 0; p < pageCount(); p++) PAGES.push(pageBooks(p));
  }

  function paint(){
    const stack = f4El('f4-stack'); if (!stack) return;
    const R = racks();
    f4El('f4-empty').classList.toggle('on', BOOKS.length === 0);
    f4El('f4-pager').hidden = pageCount() < 2;
    stack.innerHTML = '';
    PAGES.forEach((list, idx) => {
      const pg = document.createElement('div');
      pg.className = 'f4-page' + (idx === page ? ' active' : '');
      R.forEach(rk => {
        const seg = list.slice(rk.i * PER_RACK, (rk.i + 1) * PER_RACK);
        const el = document.createElement('div');
        el.className = 'f4-rack';
        el.style.left = rk.l + '%';  el.style.width  = rk.w + '%';
        el.style.top  = rk.top + '%'; el.style.height = rk.h + '%';
        el.innerHTML = seg.map(b => {
          const t = b.title || '';
          return `<div class="f4-bk" data-t="${f4Esc(t)}" title="${f4Esc(t)}" style="height:${(bkKey(t)*100).toFixed(1)}%">
                    <img src="${bkImg(t)}" alt="" loading="lazy">
                    <div class="f4-bkt">${f4Esc(shortTitle(t))}</div>
                  </div>`;
        }).join('');
        el.addEventListener('click', e => {
          const bk = e.target.closest('.f4-bk'); if (!bk) return;
          const b = seg.find(x => (x.title||'') === bk.dataset.t);
          if (b) openCard(b);
        });
        pg.appendChild(el);
      });
      stack.appendChild(pg);
    });
    paintSpan();
  }

  /* 널에 각인을 얹지 않는다 — 실사 나무 위에 CSS 띠를 그으면 붙인 티가 난다(0809).
     기간은 아래 넘김에 적는다. 페이지 번호가 아니라 시간이 말한다 */
  function paintSpan(){
    const list = PAGES[page] || [];
    const fmt = d => { const x = String(d||'').split('-'); return x.length===3 ? `${x[0]}. ${+x[1]}. ${+x[2]}` : ''; };
    /* ⚠ 0818 — 차례를 뒤집었으므로 list[0]이 최신이다. 표시는 늘 「예전 — 최근」이라야 하니
         날짜로 갈라 잡는다. 인덱스로 잡으면 뒤집힌 채 적힌다(뮤세움도 같은 자국이 있다). */
    const f = list[0], l = list[list.length-1];
    const older = (f && l) ? (String(f.met_on||'') <= String(l.met_on||'') ? f : l) : f;
    const newer = (f && l) ? (String(f.met_on||'') <= String(l.met_on||'') ? l : f) : l;
    const a = fmt(older?.met_on), b = fmt(newer?.met_on);
    const span = f4El('f4-span');
    if (span) span.innerHTML = (a ? `${a}${b && b!==a ? ' — ' + b : ''}` : '') + `<b>${list.length}권</b>`;
    /* ⭐ 0818 소로 — 화살표는 논리가 아니라 손의 감각을 따른다. **▶ 가 다음 쪽(= 더 과거)**이다.
         최신이 1쪽이므로 책장을 넘기듯 오른쪽으로 넘기면 과거로 간다. 뮤세움도 같은 손으로 맞췄다. */
    const p = f4El('f4-prev'), n = f4El('f4-next');
    if (p) p.disabled = (page <= 0);                 /* ◀ = 앞 쪽(더 최근) — 이미 최신이면 멈춘다 */
    if (n) n.disabled = (page >= pageCount() - 1);   /* ▶ = 다음 쪽(더 과거) */
  }

  function slide(dir){                                /* dir -1 = 과거로, +1 = 최근으로 */
    if (sliding) return;
    const to = page - dir;
    if (to < 0 || to >= pageCount()) return;
    sliding = true;
    const pages = f4El('f4-stack').children;
    const cur = pages[page], nxt = pages[to];
    if (!cur || !nxt){ sliding = false; return; }
    /* ⚠ 0818 — ▶(dir −1 · 과거로)가 「다음 쪽」이므로, 그때 지금 면이 왼쪽으로 나가고
         새 면이 오른쪽에서 들어와야 책장을 넘긴 것처럼 보인다. 판정을 뒤집었다. */
    cur.classList.add(dir < 0 ? 'exit-l' : 'enter-r');
    cur.classList.remove('active');
    nxt.classList.add(dir < 0 ? 'enter-r' : 'exit-l');
    requestAnimationFrame(() => {
      nxt.classList.add('active');
      nxt.classList.remove('enter-r','exit-l');
    });
    page = to;
    paintSpan();
    setTimeout(() => { cur.classList.remove('exit-l','enter-r'); sliding = false; }, 360);
  }

  /* ── 책 카드 ─────────────────────────────────────────────
     ⭐ 0818 소로 — 「책 모달이 뮤세움 방식으로 연결되어야 하는데 끊어져 있다」.
       0812에 옛 3층을 걷으면서 CSS·JS가 걷히고 HTML 껍데기만 남아, 눌러도 아무 일이
       안 일어났다. 뮤세움에 살아 있던 한 벌을 되가져와 이 위에 심었다(이 파일 위쪽).
     ⭐ 책등을 누르면 곧장 표지가 선다 — 중간 카드는 없다. 뮤세움과 한 문법이다.
     ⚠ 4겹은 seed_id 로 questions 에 붙는다. shelf_of 창이 0818에 그 한 칸을 내주기 시작했다
       (166권 전량 붙음 · 4겹도 전량 차 있음 — 실측). 맞고 틀림은 여전히 안 온다.
     ⚠ 남의 방에서도 열린다 — 4겹은 그 문제를 만난 사람이면 누구나 보는 공개 해설이고,
       여기서 새로 여는 것은 없다. 성적은 창에 애초에 담기지 않는다(0812 원칙). */
  function openCard(b){
    if (!b || ruleOn) return;                      /* 줄 맞추는 중에는 안 열린다 */
    if (window.f4InitModal) f4InitModal();         /* 손잡이 묶기 — 안에서 한 번만 돈다 */
    if (!window.f4OpenBook){
      console.warn('[지성소] 책 모달 부품이 없습니다'); return;
    }
    /* 이 집의 칸 이름을 뮤세움의 칸 이름으로 옮겨 준다.
       ⚠ 0818 — 한스푼 책은 4겹이 questions 가 아니라 spoons 에 산다. 창이 그것을 통째로
         담아 주므로(shelf_of), 여기서는 그대로 얹어 보내기만 한다. */
    f4OpenBook({ answer: b.title || '', category: b.category || '',
                 seed_id: b.seed_id || '', at: b.met_on || '',
                 kind: b.kind || 'quiz', spoon_id: b.spoon_id || null,
                 keyword: b.keyword || '', headline: b.headline || '',
                 library: b.library || null, curation_links: b.curation_links || null });
  }
  function closeCard(){ if (window.f4CloseBook) f4CloseBook(); }

  /* ⭐ 들어서는 3초 — 감의 윗단에 안착한다.
     ⚠ 감 전체를 주면 중심이 2단이라 새 책이 화면 위로 잘린다(뮤세움 0807) */
  function runCamera(){
    if (!window.EGCamera) return;
    const s = co();
    const CAM = { L:s.l, T:s.t1, W:s.r-s.l, H:(s.o1-s.t1)*1.5 };
    const opts = { box:'#f4-scroll', fit:'#f4-fit', ratio:STAGE_AR, rect:CAM };
    const scrollable = (innerWidth/innerHeight) >= STAGE_AR;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const skip = egSkipCamera; egSkipCamera = false;   /* 읽는 쪽이 끈다 (0818) */
      try { (scrollable && !skip) ? EGCamera.enter(opts) : EGCamera.settle(opts); }
      catch(e){ console.warn('[지성소] 카메라', e); }
    }));
  }

  /* ════ ⚖ 줄 맞추기 (살롱지기 전용) ════
     ⚠ 책은 자석이라 안 끌린다 — 움직이는 것은 줄이다.
       판이 밝게 빛나는 띠의 한가운데와 판의 윗면은 다르다(0809 내가 낸 사고). */
  /* 칸마다 두 줄 — 위와 아래를 따로 잡는다. 서로 안 밀린다 */
  const RULE = [
    ['t1','1단 위','h'], ['o1','1단 아래','h'],
    ['t2','2단 위','h'], ['o2','2단 아래','h'],
    ['t3','3단 위','h'], ['o3','3단 아래','h'],
    ['t4','4단 위','h'], ['o4','4단 아래','h'],
    ['l','왼쪽','v'], ['r','오른쪽','v']
  ];
  function drawRule(){
    const box = f4El('f4-rule'); if (!box) return;
    const s = co();
    box.innerHTML = RULE.map(([k,label,ax]) =>
      `<div class="rl ${ax}" data-k="${k}" style="${ax==='h'?'top':'left'}:${s[k]}%"><b>${label} ${s[k].toFixed(2)}</b></div>`).join('')
      + `<div class="f4-rsave"><span id="f4-rmsg">끌어서 맞추십시오</span>
           <button id="f4-rsave-b">이 방에 담기</button></div>`;
    box.querySelectorAll('.rl').forEach(el => bindRule(el));
    f4El('f4-rsave-b').addEventListener('click', saveRule);
  }
  function bindRule(el){
    const k = el.dataset.k, ax = el.classList.contains('h') ? 'h' : 'v';
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); el.setPointerCapture(e.pointerId);
      const fit = f4El('f4-fit'); if (!fit) return;
      const move = ev => {
        const r = fit.getBoundingClientRect();
        const v = ax==='h' ? (ev.clientY - r.top)/r.height*100 : (ev.clientX - r.left)/r.width*100;
        const val = Math.max(0, Math.min(100, v));
        COORDS = Object.assign({}, co(), COORDS||{}); COORDS[k] = +val.toFixed(2);
        el.style[ax==='h'?'top':'left'] = val + '%';
        el.querySelector('b').textContent = `${RULE.find(x=>x[0]===k)[1]} ${val.toFixed(2)}`;
        paint();
      };
      const up = () => { el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); };
      el.addEventListener('pointermove', move); el.addEventListener('pointerup', up);
    });
  }
  async function saveRule(){
    const btn = f4El('f4-rsave-b'), msg = f4El('f4-rmsg');
    btn.disabled = true; msg.textContent = '담는 중…';
    const body = {}; KEYS.forEach(k => body[k] = co()[k]);
    try{
      await sbFetch('/rest/v1/living_room_floors?on_conflict=room_no,floor', {
        method:'POST',
        headers:{ 'Prefer':'resolution=merge-duplicates,return=representation' },
        body: JSON.stringify({ room_no: REAL_NO, floor: 3, coords: body, updated_at: new Date().toISOString() })
      });
      /* ⚠ 쓴 뒤에는 반드시 되읽는다 — PATCH는 맞는 행이 없어도 조용히 204다(0809) */
      const back = await sbFetch(`/rest/v1/living_room_floors?room_no=eq.${REAL_NO}&floor=eq.3&select=coords`);
      const got = back?.[0]?.coords || null;
      const ok = got && KEYS.every(k => Math.abs(Number(got[k]) - body[k]) < 0.011);
      msg.textContent = ok ? `${REAL_NO}번 방에 담겼습니다` : '담기지 않았습니다 — 다시';
    }catch(e){ msg.textContent = '담기 실패 — ' + (e.message||e); }
    finally{ btn.disabled = false; }
  }
  /* ════ 🏠 집 갈아타기 (집주인 · 내 방에서만) ════
     방 번호 하나가 세 층을 함께 가리킨다 — 여기서 고르면 1·2·3층이 통째로 갈아탄다.
     ⚠ 쓴 뒤 되읽는다 — PATCH는 맞는 행이 없어도 조용히 204다(0809). */
  let homesOn = false;
  async function toggleHomes(){
    homesOn = !homesOn;
    const box = f4El('f4-homes');
    f4El('f4-home-toggle').classList.toggle('on', homesOn);
    if (!homesOn){ box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = '<button disabled>읽는 중…</button>';
    try{
      const rooms = await sbFetch('/rest/v1/living_rooms?active=eq.true&select=no,name&order=no');
      box.innerHTML = (rooms||[]).map(r =>
        `<button data-no="${r.no}" class="${r.no===REAL_NO?'me':''}">`
      + `${String(r.no).padStart(2,'0')} · ${f4Esc(r.name)}${r.no===REAL_NO?' — 지금 이 집':''}</button>`).join('');
      box.querySelectorAll('button[data-no]').forEach(bt => {
        bt.addEventListener('click', () => moveHome(Number(bt.dataset.no)));
      });
    }catch(e){ box.innerHTML = '<button disabled>방 목록을 못 읽었습니다</button>'; }
  }
  async function moveHome(no){
    if (no === REAL_NO) return;
    const meId = getUser()?.id || null; if (!meId) return;
    try{
      await sbFetch(`/rest/v1/wunderkammer?user_id=eq.${meId}`, {
        method:'PATCH', body: JSON.stringify({ living_no: no })
      });
      const back = await sbFetch(`/rest/v1/wunderkammer?user_id=eq.${meId}&select=living_no`);
      if (!back?.[0] || Number(back[0].living_no) !== no){
        console.warn('[지성소] 집이 안 옮겨졌습니다'); return;
      }
      /* 세 층이 같은 집이라야 한다 — 이 층만 다시 그리면 1·2층이 옛집에 남는다.
         엘리베이터를 다시 태우는 대신 통째로 새로고침한다(가장 정직한 길). */
      location.reload();
    }catch(e){ console.warn('[지성소] 집 갈아타기 실패', e); }
  }

  function toggleRule(){
    ruleOn = !ruleOn;
    f4El('f4-rule').hidden = !ruleOn;
    f4El('f4-rule-toggle').classList.toggle('on', ruleOn);
    if (ruleOn) drawRule();
  }

  async function mount(){
    page = 0; sliding = false; ruleOn = false;
    const ownerId = await resolveOwnerId();
    await loadRoom(ownerId);                     /* ⚠ 첫 그림 전에 읽는다 — 나중이면 한 번 튄다 */
    const t = f4Slot();
    const ok = await setBg([ bgUrl(REAL_NO, t), bgUrl(REAL_NO, 'd'), bgUrl(1, 'd') ]);
    await loadBooks(ownerId);
    buildPages();
    paint();
    if (ok) runCamera();                         /* ⚠ 그림이 실린 뒤 — fit 높이가 0이면 헛돈다 */

    /* ⚠ 0818 — 뜻이 바뀌었다. ◀ 는 앞 쪽(최근)으로, ▶ 는 다음 쪽(과거)으로 */
    f4El('f4-prev').addEventListener('click', () => slide(+1));
    f4El('f4-next').addEventListener('click', () => slide(-1));
    /* 0818 — 닫기·바깥 누르기는 f4book 부품이 제 안에서 묶는다(f4InitModal) */

    /* ⚠ 문이 둘이다(0809 조항 그대로) —
         🏠 집 갈아타기 = wunderkammer(내 집)를 만진다 → **집주인**에게만, 내 방에서만
         ⚖  줄 맞추기  = living_room_floors를 만진다   → **살롱지기**면 어느 방에서든
       하나로 묶으면 순례 중에 ⚖까지 사라지거나, 남의 방에서 남의 집을 옮기게 된다.
       is_admin은 집주인이 아니라 **나**에게 묻는다. */
    const meId = getUser()?.id || null;
    const isOwner = !!meId && ownerId === meId;
    keeper = false;
    if (meId){
      try{
        const u = await sbFetch(`/rest/v1/users?id=eq.${meId}&select=is_admin`);
        keeper = !!(u && u[0] && u[0].is_admin);
      }catch(e){ console.warn('[지성소] 살롱지기 확인 실패', e); }
    }
    if (keeper || isOwner){
      f4El('f4-dock').hidden = false;
      if (keeper){
        f4El('f4-rule-toggle').hidden = false;
        f4El('f4-rule-toggle').addEventListener('click', toggleRule);
      }
      if (isOwner){
        f4El('f4-home-toggle').hidden = false;
        f4El('f4-home-toggle').addEventListener('click', toggleHomes);
      }
    }
  }

  return { markup, mount, slide };
})();

/* ============================================================
 *  Ⅳ층 액자방 모듈 (셸 4층 · 모듈 이름은 옛 번호 Floor5)
 *  0812밤 전면 재건축 — 「내가 사랑한 얼굴들 · Le Mur des Visages」
 *
 *  · 배경 넉 벌 = wk-assets/visages/visages_NN_{m|d|e|n}.webp (941×1672)
 *  · 벽 사각형  = living_room_floors(room_no, floor=4).coords 네 값 {l,r,t,b}
 *    1·2·3층과 **같은 방 번호** = 같은 집. 방 번호가 네 층을 관통한다.
 *  · 얼굴 = companions(live) × stars.framed_url. 품은 순서를 지킨다.
 *
 *  ⭐ 여기엔 **자석이 없다**. 1층 꽃은 콘솔 상판에, 2층 표지는 선반 밑줄에,
 *     3층 책등은 칸 위·아래에 붙지만, 액자는 벽 위 자유 좌표에 앉는다.
 *     그래서 넉 벌이 함께 지킬 것은 사각형 하나뿐이고, 창밖·계절·불빛은 자유다.
 *
 *  ⚠ 도장을 놓지 않는다 — 여기는 콘스텔라티오 합류(SODALIS)의 **결과**가 모이는 곳이다.
 *    원인의 곳에서 찍고 결과의 곳에서는 안 찍는다(0809 도장 정책). 이중 도장 금지.
 *  ⚠ 크레덴시알(콤포스텔라)도 여기 안 건다 — 취향의 방이다(크레덴시알 24호).
 *    취향 옆에 이력이 서면 헌장 4.2의 등급·순위 없음이 흔들린다.
 *
 *  ── 0812밤에 고친 것 넷 ─────────────────────────────────────
 *  ① 배경이 저장소 뿌리의 5f_bg01.webp 한 장 · uid 해시였다.
 *     모두가 같은 벽을 보고 방 번호도 시각도 안 따랐다.
 *  ② slide()가 `currentFloor !== 5`를 보았다. 4층 축소(0728) 이후 이 값은 4다.
 *     ‹ ›가 통째로 죽어 둘째 면의 얼굴들이 갇혀 있었다.
 *  ③ star.html이 복귀 문을 `?floor=5`로 돌려세웠다. TOP_FLOOR가 4이므로
 *     floorData(5)가 undefined → applyPalette에서 던져 **셸이 통째로 죽었다**.
 *     얼굴을 누르고 돌아오는 길이 4층이 존재하는 이유인데 거기서 무너졌다.
 *  ④ openZoom·closeZoom이 정의만 있고 부르는 곳이 0이었다. f5-zoom-close도 안 묶였다.
 *     죽은 모달을 걷고, 액자 클릭은 별 카드 직행 하나로 남겼다.
 * ============================================================ */
const Floor5 = (() => {
  let FACES = [], PAGES = [], COORDS = null, REAL_NO = 1;
  let BAKING = 0;      /* 0816 — 원판을 기다리는 얼굴 수 */
  let page = 0, sliding = false, ruleOn = false, keeper = false;
  let editMode = false, drag = null, selectedId = null;
  let isOwner = false, ownerUid = null;

  const STAGE_AR = 941 / 1672;

  /* ⭐ 열다섯 칸을 손으로 안 적는다. 사각형 네 값에서 낳는다.
       「지금은 열다섯이면 충분」으로 박아 두면 열여섯이 되는 날 틀린다(v158 §5).
     ⚠⚠ 이 산식은 admin_living_assets의 BUDGETS[4]와 **같은 값을 내야 한다.**
        지금은 같은 값이 두 파일에 산다. 한쪽만 고치면 콘솔 눈금이 거짓말을 한다. */
  const COLS = 3, ROWS = 5, SLOT_W_MAX = 13, PLATE = 1.5;
  const GAP_X_MIN = 1.0, GAP_Y_MIN = 0.8;      /* 액자끼리 붙지 않게 하는 최소 틈 */
  const FRAME_AR = 0.82;                       /* 액자 그림의 폭÷높이 어림 */
  const hOf = w => w * STAGE_AR / FRAME_AR;    /* 폭%p → 높이%p */

  /* ⚠ 0812밤 모의 실행에서 잡은 것 — 폭을 13%p로 박아 두면 **좁은 방에서 넘친다.**
       ⚖로 벽을 43×52%p로 줄여 보니 다섯 행이 52.11%p를 먹어 걸레받이를 뚫었다.
       「지금은 13이면 충분」으로 지은 상수는 벽이 좁아지는 순간 틀린다(v158 §5).
     ⭐ 이제 **벽이 폭을 정한다.** 파리(54×58)에서는 여전히 정확히 13이 나오므로
        콘솔 BUDGETS[4] 눈금과 한 값도 안 어긋난다. */
  function slotW(s){
    const capX = (s.r - s.l - (COLS+1)*GAP_X_MIN) / COLS;
    const capY = ((s.b - s.t) - ROWS*PLATE - (ROWS+1)*GAP_Y_MIN) / (ROWS * STAGE_AR / FRAME_AR);
    return +Math.max(6, Math.min(SLOT_W_MAX, capX, capY)).toFixed(2);
  }

  /* 파리 실측(0812밤 · 넉 벌 교집합). 방마다 ⚖로 다시 잰다 */
  const C0 = { l:29, r:83, t:19, b:77 };
  const KEYS = ['l','r','t','b'];

  function co(){
    const c = COORDS || {};
    const o = {}; KEYS.forEach(k => { o[k] = (c[k] == null ? C0[k] : Number(c[k])); });
    return o;
  }
  const PER_PAGE = COLS * ROWS;

  /* 표준 자리 — 품은 순서 1→15가 좌·중·우 3열로 위에서 아래로 */
  function slots(){
    const s = co();
    const W  = slotW(s);
    const H  = hOf(W);
    const gx = (s.r - s.l - COLS*W) / (COLS + 1);
    const gy = (s.b - s.t - ROWS*(H + PLATE)) / (ROWS + 1);
    const out = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
      out.push({
        x: +(s.l + gx + c*(W+gx) + W/2).toFixed(2),
        y: +(s.t + gy + r*(H+PLATE+gy) + H/2).toFixed(2),
        size_pct: W,
        rot: [-1.5, 1.5, 0, 1.5, -1.5, 1, -1, 1.5, -1.5, 1.5, -1, 1.5, -1.5, 1, -1.5][r*COLS + c]
      });
    }
    return out;
  }

  function f5Esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function f5El(id){ return document.getElementById(id); }
  function f5Slot(){ try { return egSky.phase(); } catch(e){ return 'd'; } }
  const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));

  function bgUrl(no, t){
    const v = COORDS && COORDS._v ? '?v=' + COORDS._v : '';
    return SUPABASE_URL + '/storage/v1/object/public/wk-assets/visages/visages_'
         + String(no).padStart(2,'0') + '_' + t + '.webp' + v;
  }

  function markup(){
    return `
      <div class="floor-content" data-floor="5">
        <div class="f5-scroll" id="f5-scroll">
          <div class="f5-fit" id="f5-fit">
            <img id="f5-img" alt="">
            <div class="f5-panel" id="f5-panel"></div>
            <div class="f5-wall" id="f5-wall"></div>
            <div class="f5-ghosts" id="f5-ghosts" hidden></div>
            <div class="f5-rule" id="f5-rule" hidden></div>
          </div>
        </div>
        <div class="f5-empty" id="f5-empty">
          아직 품은 얼굴이 없습니다.<br>별 하나에 합류하면 여기 한 사람이 걸립니다.
        </div>
        <div class="f5-baking" id="f5-baking" hidden></div>
        <div class="f5-pager" id="f5-pager" hidden>
          <button id="f5-prev" aria-label="앞 쪽 — 더 최근" title="더 최근으로">◀</button>
          <div class="f5-span" id="f5-span"></div>
          <button id="f5-next" aria-label="다음 쪽 — 더 예전" title="더 예전으로">▶</button>
        </div>
        <div class="f5-dock" id="f5-dock" hidden>
          <button id="f5-edit-toggle" title="배치 바꾸기" hidden>✎</button>
          <button id="f5-home-toggle" title="집 갈아타기" hidden>🏠</button>
          <button id="f5-rule-toggle" title="줄 맞추기" hidden>⚖</button>
        </div>
        <div class="f5-homes" id="f5-homes" hidden></div>
        <div class="f5-tool" id="f5-tool">
          <button id="f5-size-down" title="작게">−</button><span class="f5-tool-lbl">크기</span><button id="f5-size-up" title="크게">＋</button>
          <span class="f5-tool-sep"></span>
          <button id="f5-rot-l" title="왼쪽으로">↺</button><span class="f5-tool-lbl">각도</span><button id="f5-rot-r" title="오른쪽으로">↻</button>
        </div>
      </div>`;
  }

  /* ── 배경 — img 한 장 + 폴백 사슬. 실패하면 콘솔에 주소가 남는다 ── */
  function setBg(list){
    return new Promise(res => {
      const im = f5El('f5-img'); if(!im) return res(false);
      let i = 0;
      const tryNext = () => {
        if (i >= list.length){ console.warn('[액자방] 배경을 못 받았습니다:', list); return res(false); }
        const url = list[i++];
        im.onload  = () => { im.classList.add('on'); res(true); };
        im.onerror = () => tryNext();
        im.src = url;
      };
      tryNext();
    });
  }

  async function resolveOwnerId(){
    const q = new URLSearchParams(location.search).get('user');
    const me = getUser()?.id || null;
    if (!q) return me;
    try{
      const u = await sbFetch(`/rest/v1/users?nickname=eq.${encodeURIComponent(q)}&select=id`);
      return u?.[0]?.id || me;
    }catch(e){ console.warn('[액자방] 임자 조회 실패', e); return me; }
  }

  async function loadRoom(ownerId){
    let no = 1;
    try{
      if (ownerId){
        const w = await sbFetch(`/rest/v1/wunderkammer?user_id=eq.${ownerId}&select=living_no`);
        if (w?.[0]?.living_no) no = Number(w[0].living_no);
      }
    }catch(e){ console.warn('[액자방] 방 번호 조회 실패', e); }
    REAL_NO = no;
    try{
      const r = await sbFetch(`/rest/v1/living_room_floors?room_no=eq.${no}&floor=eq.4&select=coords,updated_at`);
      if (r?.[0]){ COORDS = Object.assign({}, r[0].coords || {}); COORDS._v = Date.parse(r[0].updated_at) || ''; }
      else COORDS = null;
    }catch(e){ console.warn('[액자방] 층 좌표 조회 실패', e); COORDS = null; }
  }

  /* ── 얼굴 — 품은 별 중 액자가 구워진 것만 벽에 선다 ── */
  async function loadFaces(uid){
    FACES = []; BAKING = 0;
    if (!uid) return;
    let comps = [], layout = [];
    try{
      /* ⚠⚠ 0812밤 — 여기가 `joined_at.desc`였다. 그런데 아래 면 나누기는
           3층에서 가져온 것이라 **오름차순을 전제**한다(끝에서 잘라 면 0을 만든다).
           둘이 어긋나 면 0에 **가장 오래된 열다섯**이 서고, 최근 여덟이 ▶ 뒤에 숨었다.
           넘김 띠도 「6. 19 — 5. 31」로 거꾸로 읽혔다 — 화면이 먼저 말해 주고 있었다.
         ⭐ 조항 — 남의 셈을 가져올 때는 그 셈이 무엇을 전제하는지까지 가져온다.
           0812 낮에 뮤세움 해시만 베끼고 경로를 놓친 것과 같은 자리다. */
      comps = await sbFetch(`/rest/v1/companions?user_id=eq.${encodeURIComponent(uid)}&status=eq.live`
            + `&select=star_id,joined_at&order=joined_at.asc`) || [];
    }catch(e){ console.warn('[액자방] 합류 목록 실패', e); return; }
    const ids = comps.map(c => c.star_id).filter(v => v != null);
    const starMap = {};
    if (ids.length){
      try{
        const ss = await sbFetch(`/rest/v1/stars?id=in.(${ids.join(',')})&select=id,name,categories,framed_url`) || [];
        ss.forEach(s => starMap[s.id] = s);
      }catch(e){ console.warn('[액자방] 별 상세 실패', e); }
    }
    try{
      layout = await sbFetch(`/rest/v1/persona_wall?user_id=eq.${encodeURIComponent(uid)}`
             + `&select=star_id,x,y,size_pct,rot,room`) || [];
    }catch(e){ console.warn('[액자방] 배치 실패', e); layout = []; }
    const lay = {}; layout.forEach(l => lay[l.star_id] = l);

    comps.forEach(c => {
      const s = starMap[c.star_id];
      if (!s) return;
      /* ⚠ 0816 소로 — 원판이 안 구워진 별은 벽에 못 서는데 화면이 아무 말도 안 했다.
           손님 눈에는 「합류했는데 안 걸린다」는 사고로만 보인다. 버리지 말고 세어 둔다. */
      if (!s.framed_url){ BAKING++; return; }
      const L = lay[s.id];
      FACES.push({
        id: s.id, name: s.name || '', framed: s.framed_url, joined: c.joined_at,
        cat: (Array.isArray(s.categories) ? (s.categories[0]||'') : String(s.categories||'')).split(/[·,]/)[0].trim(),
        _pinned: !!L, _L: L
      });
    });
  }

  /* 면 0 = 가장 최근 묶음. 3층과 같은 문법 —
     ⚠ 가장 오래된 면만 덜 찬다. 최신 쪽을 덜 채우면 새 얼굴이 올 때마다 전 면이 밀린다 */
  function pageCount(){ return Math.max(1, Math.ceil(FACES.length / PER_PAGE)); }
  /* ⭐ 0816 소로 — 2층 책의 방에서 겪은 그 병이다. 「한 칸을 다른 놈이 밀고 들어오면
       툭 튕겨 다른 슬롯에 자석처럼 붙게」.
     ⚠ 다만 4층에는 붙을 줄이 없다(자유 좌표). 그래서 붙을 격자를 슬롯 열다섯으로 삼는다.
     ⭐ **찜하기만 하고 좌표는 안 건드린다(B안).** 손으로 놓은 39.94는 39.94로 남는다 —
       겹침을 막는 데는 「누가 어느 칸을 찜했나」만 알면 된다. 손맛을 격자가 먹지 않는다.
     ⚠ 여태 자유 액자가 SL[i]를 썼다. i 는 면 안 순번이라 앞에 손으로 놓인 것이 있으면
       그 몫의 칸을 건너뛰었다 — 윗줄이 비었는데 아랫줄에 앉던 까닭이다. */
  function nearestSlot(SL, f){
    let best = 0, bd = Infinity;
    for (let k = 0; k < SL.length; k++){
      const d = (SL[k].x - f.x)**2 + (SL[k].y - f.y)**2;
      if (d < bd){ bd = d; best = k; }
    }
    return best;
  }

  function buildPages(){
    const SL = slots(), s = co();
    PAGES = [];
    for (let p = 0; p < pageCount(); p++){
      const end  = FACES.length - p * PER_PAGE;
      /* ⭐ 0818 소로 — 세 곳(뮤세움·지성소·이 벽)이 같은 차례라야 한다.
           **가장 최근에 품은 얼굴이 맨 윗줄 왼쪽**에 걸리고 오른쪽으로 · 아래로 밀린다.
         ⚠ FACES 자체(합류 순서)는 안 건드린다 — 면 나누기가 그 순서에 기댄다.
           걸 때만 뒤집는다. slice 가 새 배열을 주므로 reverse 가 원본을 안 다친다. */
      const list = FACES.slice(Math.max(0, end - PER_PAGE), Math.max(0, end)).reverse();
      /* ⭐ 0816 — 손으로 놓인 액자가 먼저 제 칸을 찜한다. 좌표는 안 건드린다(B안).
           그 뒤 자유 액자가 **빈 칸만** 골라 앉는다 — 밀고 들어온 놈이 튕겨 나가는 것이 아니라
           애초에 남의 칸에 안 앉는다. 2층 책의 방이 밑줄로 하던 일을, 여기서는 격자가 한다. */
      /* ⚠⚠ 찜하기만 해서는 **손으로 놓인 것끼리**의 겹침을 못 막는다(실측 — 마네 ↔ 갈릴레이 2.6).
           면 경계가 밀리면서 다른 면에 있던 액자들이 같은 면으로 모이기 때문이다.
         ⭐ 그래서 튕긴다 — 한 칸을 둘이 노리면 **칸 한가운데에 더 가까운 쪽**이 갖고,
           밀려난 쪽은 빈 칸으로 간다. 먼저 온 순이 아니라 제자리에 놓인 순이다.
         ⚠ 튕기는 것은 **화면에서뿐**이다. DB 좌표는 한 글자도 안 건드린다 —
           벽이 넓어지거나 면이 다시 밀리면 손님이 놓은 그 자리로 스스로 돌아온다(_held 문법). */
      const taken = new Map();
      list.forEach(f => {
        f._bumped = false;
        if (!(f._pinned && f._L)) return;
        const px = +f._L.x, py = +f._L.y;
        const k  = nearestSlot(SL, { x:px, y:py });
        const d  = (SL[k].x - px)**2 + (SL[k].y - py)**2;
        const prev = taken.get(k);
        if (!prev || d < prev.d){ if (prev) prev.f._bumped = true; taken.set(k, { f, d }); }
        else f._bumped = true;
      });
      let freeK = 0;
      const nextFree = ()=>{ while (freeK < SL.length && taken.has(freeK)) freeK++;
                             const k = Math.min(freeK, SL.length-1); taken.set(k, null); freeK++; return k; };
      list.forEach((f, i) => {
        if (f._pinned && f._L && !f._bumped){
          /* ⭐ 0812밤 — 손으로 놓인 액자는 **옮기지 않되 떨어지지도 않게** 한다.
               벽은 살롱지기가 ⚖로 움직이는데, 그 액자는 DB에 박힌 절대 좌표다.
               벽이 좁아지면 서가나 담쟁이 위에 뜬다(실측: 모로칸·교토·빈에서 워즈워스).
             ⚠ 붙드는 것은 **화면에서뿐**이다. DB는 한 글자도 안 건드린다 —
               벽이 다시 커지면 손님이 놓은 그 자리로 스스로 돌아온다.
               남이 손으로 놓은 것을 우리가 고쳐 담으면 헌장 4.2에 걸린다. */
          f.size_pct = +clamp(+f._L.size_pct, 6, s.r - s.l).toFixed(2);
          f.rot = +f._L.rot;
          f.x = +clamp(+f._L.x, s.l + halfX(f), s.r - halfX(f)).toFixed(2);
          f.y = +clamp(+f._L.y, s.t + halfY(f), s.b - halfY(f) - PLATE).toFixed(2);
          f._held = (Math.abs(f.x - +f._L.x) > 0.011 || Math.abs(f.y - +f._L.y) > 0.011
                  || Math.abs(f.size_pct - +f._L.size_pct) > 0.011);   /* 붙들렸는가 */
        } else {
          const sl = SL[nextFree()];      /* 0816 — i 가 아니라 **빈 칸** 차례로 (윗줄부터 채운다) */
          f.x = sl.x; f.y = sl.y; f.size_pct = sl.size_pct; f.rot = sl.rot;
          f._held = false;
        }
      });
      PAGES.push(list);
    }
  }

  function paint(){
    const wall = f5El('f5-wall'); if (!wall) return;
    f5El('f5-empty').classList.toggle('on', FACES.length === 0);
    /* ⭐ 0816 소로 — 원판이 안 구워진 별은 벽에 못 서는데 화면이 아무 말도 안 했다.
         「합류했는데 안 걸린다」로 보이던 것을 한 줄로 말한다. 없으면 조용하다. */
    { const bk = f5El('f5-baking');
      if (bk){ bk.hidden = !(BAKING > 0);
               bk.textContent = '액자를 굽고 있는 얼굴 ' + BAKING; } }
    f5El('f5-pager').hidden = pageCount() < 2;
    wall.innerHTML = '';
    PAGES.forEach((list, idx) => {
      const pg = document.createElement('div');
      pg.className = 'f5-page' + (idx === page ? ' active' : '');
      list.forEach(f => {
        const el = document.createElement('div');
        el.className = 'f5-frame'
          + (f._pinned ? ' pinned' : '')     /* 손으로 놓인 것 — ⚖ 켤 때만 보인다 */
          + (f._held   ? ' held'   : '');    /* 벽 밖으로 나가려다 붙들린 것 */
        el.dataset.id = f.id;
        el.style.left  = f.x + '%';
        el.style.top   = f.y + '%';
        el.style.width = f.size_pct + '%';
        el.style.setProperty('--rot', f.rot + 'deg');
        const im = document.createElement('img');
        im.className = 'f5-frame-img'; im.src = f.framed; im.alt = f.name;
        im.loading = 'lazy'; im.draggable = false;
        el.appendChild(im);
        if (f.name){
          const pl = document.createElement('div');
          pl.className = 'f5-plate'; pl.textContent = f.name;
          el.appendChild(pl);
        }
        bindFrame(el, f);
        pg.appendChild(el);
      });
      wall.appendChild(pg);
    });
    paintPanel();
    paintSpan();
    if (selectedId !== null){ const el = frameEl(selectedId); if (el){ el.classList.add('selected'); showTool(); } }
  }

  /* 편집 중 보이는 벽 사각형 — 어디까지가 벽인지 모르면 못 맞춘다 */
  function paintPanel(){
    const p = f5El('f5-panel'); if (!p) return;
    const s = co();
    p.style.left = s.l + '%'; p.style.width  = (s.r - s.l) + '%';
    p.style.top  = s.t + '%'; p.style.height = (s.b - s.t) + '%';
  }

  /* 아래 넘김 — 면 번호가 아니라 「몇 명」과 「언제 품었나」가 말한다 */
  function paintSpan(){
    const list = PAGES[page] || [];
    const fmt = d => { const x = String(d||'').slice(0,10).split('-'); return x.length===3 ? `${x[0]}. ${+x[1]}. ${+x[2]}` : ''; };
    /* ⚠ 0818 — 차례를 뒤집었으므로 list[0]이 최신이다. 날짜로 갈라 잡는다 */
    const f0 = list[0], l0 = list[list.length-1];
    const older = (f0 && l0) ? (String(f0.joined||'') <= String(l0.joined||'') ? f0 : l0) : f0;
    const newer = (f0 && l0) ? (String(f0.joined||'') <= String(l0.joined||'') ? l0 : f0) : l0;
    const a = fmt(older?.joined), b = fmt(newer?.joined);
    const span = f5El('f5-span');
    if (span) span.innerHTML = (a ? `${a}${b && b!==a ? ' — ' + b : ''}` : '') + `<b>${list.length}명</b>`;
    /* ⭐ 0818 소로 — ▶ 가 다음 쪽(= 더 예전). 세 곳이 같은 손으로 넘어간다 */
    const p = f5El('f5-prev'), n = f5El('f5-next');
    if (p) p.disabled = (page <= 0);                 /* ◀ = 앞 쪽(더 최근) */
    if (n) n.disabled = (page >= pageCount() - 1);   /* ▶ = 다음 쪽(더 예전) */
  }

  /* ⚠ 0812밤 — 옛 판은 `currentFloor !== 5`를 보아 통째로 죽어 있었다.
       4층 축소(0728) 이후 이 층의 번호는 4다. */
  function slide(dir){                                /* dir -1 = 과거로, +1 = 최근으로 */
    if (sliding) return;
    const to = page - dir;
    if (to < 0 || to >= pageCount()) return;
    sliding = true;
    clearSelection();
    const pages = f5El('f5-wall').children;
    const cur = pages[page], nxt = pages[to];
    if (!cur || !nxt){ sliding = false; return; }
    /* ⚠ 0818 — ▶(dir −1 · 과거로)가 「다음 쪽」이므로 그때 지금 면이 왼쪽으로 나간다 */
    cur.classList.add(dir < 0 ? 'exit-l' : 'enter-r');
    cur.classList.remove('active');
    nxt.classList.add(dir < 0 ? 'enter-r' : 'exit-l');
    requestAnimationFrame(() => {
      nxt.classList.add('active');
      nxt.classList.remove('enter-r','exit-l');
    });
    page = to;
    paintSpan();
    setTimeout(() => { cur.classList.remove('exit-l','enter-r'); sliding = false; }, 360);
  }

  /* ── 액자 손놀림: 감상 = 별 카드 직행 / 편집 = 끌기·고르기 ── */
  function frameEl(id){ const w = f5El('f5-wall'); return w ? w.querySelector('.f5-frame[data-id="'+id+'"]') : null; }
  function curFace(){ return FACES.find(x => x.id === selectedId); }
  /* ⚠ 폭이 상수가 아니게 됐으므로 기본값도 벽에서 받는다.
       여기 SLOT_W가 남아 있으면 끌 때만 ReferenceError가 나서 검사기가 못 잡는다(v154 §1). */
  function halfX(f){ return (f.size_pct || slotW(co())) / 2; }
  function halfY(f){ return hOf(f.size_pct || slotW(co())) / 2; }

  function bindFrame(el, f){
    el.addEventListener('click', () => {
      if (editMode) return;
      const qUser = new URLSearchParams(location.search).get('user');
      /* ⚠ from=wk4 — 옛 판은 wk5를 보내 star.html이 ?floor=5로 돌려세웠고 셸이 죽었다 */
      let url = 'star.html?id=' + f.id + '&from=wk4';
      if (qUser) url += '&fromuser=' + encodeURIComponent(qUser);
      location.href = url;
    });
    el.addEventListener('pointerdown', e => {
      if (!editMode || !isOwner) return;
      e.preventDefault();
      const fit = f5El('f5-fit'); if (!fit) return;
      const r = fit.getBoundingClientRect();
      drag = { el, f, mx:e.clientX, my:e.clientY, x0:f.x, y0:f.y, w:r.width, h:r.height, moved:false };
      el.classList.add('grabbing');
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
    });
    el.addEventListener('pointermove', e => {
      if (!drag || drag.el !== el) return;
      const dx = e.clientX - drag.mx, dy = e.clientY - drag.my;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) drag.moved = true;
      const s = co();
      /* ⚠ 벽 사각형 밖으로 못 나간다 — 나가면 서가·담쟁이 위에 얹힌다 */
      f.x = +clamp(drag.x0 + dx/drag.w*100, s.l + halfX(f), s.r - halfX(f)).toFixed(2);
      f.y = +clamp(drag.y0 + dy/drag.h*100, s.t + halfY(f), s.b - halfY(f) - PLATE).toFixed(2);
      el.style.left = f.x + '%'; el.style.top = f.y + '%';
      if (drag.moved) showTool();
    });
    const end = () => {
      if (!drag || drag.el !== el) return;
      el.classList.remove('grabbing');
      /* ⚠ 0816 소로 — 「크기·각도 조절이 안 보인다」의 정체.
           4px만 흔들려도 끈 것으로 쳐서 고르기가 안 됐다. 액자를 눌렀는데 아무 일도
           안 일어난 것처럼 보였다. 실제로 옮긴 것만 옮김으로 치고, 제자리면 고른다. */
      const _moved = drag.moved &&
        (Math.abs(f.x - drag.x0) > 0.25 || Math.abs(f.y - drag.y0) > 0.25);
      if (_moved){ f._pinned = true; persist(f); selectFrame(f.id); }
      else {
        f.x = drag.x0; f.y = drag.y0;                       /* 흔들린 만큼 되돌린다 */
        el.style.left = f.x + '%'; el.style.top = f.y + '%';
        selectFrame(f.id);
      }
      drag = null;
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  function setEdit(on){
    editMode = on;
    f5El('f5-fit')?.classList.toggle('editing', on);
    f5El('f5-edit-toggle')?.classList.toggle('on', on);
    if (!on) clearSelection();
  }
  function clearSelection(){
    selectedId = null;
    document.querySelectorAll('.floor-content[data-floor="5"] .f5-frame.selected')
      .forEach(el => el.classList.remove('selected'));
    const t = f5El('f5-tool'); if (t) t.style.display = 'none';
  }
  function selectFrame(id){
    if (selectedId === id){ clearSelection(); return; }
    selectedId = id;
    document.querySelectorAll('.floor-content[data-floor="5"] .f5-frame')
      .forEach(el => el.classList.toggle('selected', +el.dataset.id === id));
    showTool();
  }
  function showTool(){
    const tool = f5El('f5-tool'); if (!tool) return;
    if (selectedId === null || !editMode){ tool.style.display = 'none'; return; }
    const el = frameEl(selectedId);
    if (!el){ tool.style.display = 'none'; return; }
    const r = el.getBoundingClientRect();
    tool.style.display = 'flex';
    tool.style.left = (r.left + r.width/2) + 'px';
    /* ⚠ 0816 — 맨 윗줄 액자를 고르면 툴이 화면 위로 나가려다 8px 에 붙어 액자와 겹쳤다.
         위가 좁으면 액자 **아래**에 붙인다. 아래도 좁으면 그때만 위쪽 8px. */
    const _above = r.top - 42, _below = r.bottom + 10;
    tool.style.top = (_above >= 8 ? _above
                     : (_below + 36 <= innerHeight ? _below : 8)) + 'px';
  }
  function adjSize(d){
    const f = curFace(); if (!f) return;
    const s = co();
    f.size_pct = +clamp(f.size_pct + d, 7, Math.min(30, s.r - s.l)).toFixed(2);
    f._pinned = true;
    /* 커지면서 사각형을 뚫지 않게 중심을 도로 당긴다 */
    f.x = +clamp(f.x, s.l + halfX(f), s.r - halfX(f)).toFixed(2);
    f.y = +clamp(f.y, s.t + halfY(f), s.b - halfY(f) - PLATE).toFixed(2);
    const el = frameEl(f.id);
    if (el){ el.style.width = f.size_pct + '%'; el.style.left = f.x + '%'; el.style.top = f.y + '%'; }
    persist(f); showTool();
  }
  function adjRot(d){
    const f = curFace(); if (!f) return;
    f.rot = +(f.rot + d).toFixed(2); f._pinned = true;
    const el = frameEl(f.id); if (el) el.style.setProperty('--rot', f.rot + 'deg');
    persist(f);
  }

  /* 저장 — persona_wall upsert (집주인만) */
  async function persist(f){
    if (!isOwner || !ownerUid) return;
    try{
      await sbFetch('/rest/v1/persona_wall?on_conflict=user_id,star_id', {
        method:'POST',
        headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify({
          user_id: ownerUid, star_id: f.id,
          x:+(+f.x).toFixed(2), y:+(+f.y).toFixed(2),
          size_pct:+(+f.size_pct).toFixed(2), rot:+(+f.rot).toFixed(2),
          room: page
        })
      });
    }catch(e){ console.warn('[액자방] 배치 저장 실패', e); }
  }

  /* ⭐ 들어서는 3초 — 벽의 윗단에 안착한다 */
  function runCamera(){
    if (!window.EGCamera) return;
    const s = co();
    /* ⭐ 0818 소로 — 4층의 안착 지점은 **첫 줄 액자**다. 어림으로 반을 자르지 않고
         자리표 첫 칸의 중심을 그대로 쓴다 — 벽이 좁아져도 첫 줄에 정확히 선다. */
    const SL0 = slots()[0];
    const CAM = { L:s.l, T:s.t, W:s.r-s.l, H:Math.max(4, (SL0.y - s.t) * 2) };
    const opts = { box:'#f5-scroll', fit:'#f5-fit', ratio:STAGE_AR, rect:CAM };
    const scrollable = (innerWidth/innerHeight) >= STAGE_AR;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const skip = egSkipCamera; egSkipCamera = false;   /* 읽는 쪽이 끈다 (0818) */
      try { (scrollable && !skip) ? EGCamera.enter(opts) : EGCamera.settle(opts); }
      catch(e){ console.warn('[액자방] 카메라', e); }
    }));
  }

  /* ════ ⚖ 줄 맞추기 (살롱지기 전용) ════
     ⭐ 0812밤 — 넉 벌 갈아 보기를 붙였다.
        좌표는 **한 벌**인데 배경은 넉 벌이다. 그래서 밤 벌에서도 사각형이 맞는지
        보려면 밤이 될 때까지 기다려야 했다. 이제 여기서 갈아 끼우고 확인한다.
     ⚠ 시각마다 좌표를 따로 두지 않는다. 액자가 밤에 움직이면 그건 벽이 아니다.
        갈리는 것은 **배경 미리보기뿐**이고, 담기는 값은 언제나 한 벌이다. */
  const RULE = [
    ['t','벽 위','h'], ['b','벽 아래','h'],
    ['l','벽 왼쪽','v'], ['r','벽 오른쪽','v']
  ];
  const TODS = [['m','아침'],['d','낮'],['e','저녁'],['n','밤']];
  const todKr = t => (TODS.find(x=>x[0]===t)||['','지금'])[1];
  let ruleTod = null;          /* null = 지금 시각 그대로 */
  let todMissing = {};         /* 눌러 보고 없던 벌 — 두 번 헛걸음 안 하게 적어 둔다 */

  /* 열다섯 자리 미리보기 — 얼굴이 없는 방에서도 어디에 걸릴지 보인다 */
  function drawGhosts(){
    const g = f5El('f5-ghosts'); if (!g) return;
    const s = co(), SL = slots();
    const W = SL[0].size_pct, H = hOf(W);
    g.innerHTML =
      `<div class="gh-panel" style="left:${s.l}%;top:${s.t}%;width:${s.r-s.l}%;height:${s.b-s.t}%"></div>`
      + SL.map(sl => `<div class="gh" style="left:${(sl.x-W/2).toFixed(2)}%;top:${(sl.y-H/2).toFixed(2)}%;`
                   + `width:${W}%;height:${H.toFixed(2)}%"></div>`).join('');
  }

  function paintTods(){
    const box = f5El('f5-tods'); if (!box) return;
    box.querySelectorAll('button').forEach(b => {
      b.classList.toggle('on',   b.dataset.t === ruleTod);
      b.classList.toggle('none', !!todMissing[b.dataset.t]);
    });
  }
  /* ⚠ 폴백을 쓰지 않는다 — 「밤을 본다」고 믿는데 낮이 서 있으면 자가 거짓말을 한다.
       없으면 없다고 적고 보던 그림으로 되돌린다(0808 조항). */
  async function showTod(t){
    const msg = f5El('f5-rmsg');
    if (msg) msg.textContent = `${todKr(t)} 벌을 부르는 중…`;
    const ok = await setBg([ bgUrl(REAL_NO, t) ]);
    if (ok){
      ruleTod = t; delete todMissing[t];
      if (msg) msg.textContent = `${todKr(t)} 벌을 보는 중 · ${REAL_NO}번 방` + heldNote();
    } else {
      todMissing[t] = true; ruleTod = null;
      await restoreBg();
      if (msg) msg.textContent = `${todKr(t)} 벌이 아직 없습니다`;
    }
    paintTods();
  }
  /* 지금 시각으로 되돌린다 — ⚖를 끄고 나서도 남의 시각이 서 있으면 안 된다 */
  function restoreBg(){
    return setBg([ bgUrl(REAL_NO, f5Slot()), bgUrl(REAL_NO,'d'), bgUrl(1,'d') ]);
  }

  function drawRule(){
    const box = f5El('f5-rule'); if (!box) return;
    const s = co();
    box.innerHTML = RULE.map(([k,label,ax]) =>
      `<div class="rl ${ax}" data-k="${k}" style="${ax==='h'?'top':'left'}:${s[k]}%"><b>${label} ${s[k].toFixed(2)}</b></div>`).join('')
      + `<div class="f5-rsave">
           <div class="f5-tods" id="f5-tods">${
             TODS.map(([k,l]) => `<button data-t="${k}">${l}</button>`).join('')
           }</div>
           <span id="f5-rmsg">끌어서 맞추십시오${heldNote()}</span>
           <button id="f5-rsave-b">이 방에 담기</button>
         </div>`;
    box.querySelectorAll('.rl').forEach(el => bindRule(el));
    f5El('f5-rsave-b').addEventListener('click', saveRule);
    f5El('f5-tods').addEventListener('click', e => {
      const b = e.target.closest('button[data-t]'); if (!b) return;
      /* 켜져 있는 것을 다시 누르면 지금 시각으로 돌아온다 */
      if (b.dataset.t === ruleTod){ ruleTod = null; restoreBg();
        f5El('f5-rmsg').textContent = '지금 시각으로 돌아왔습니다' + heldNote(); paintTods(); return; }
      showTod(b.dataset.t);
    });
    paintTods();
    drawGhosts();
  }
  function bindRule(el){
    const k = el.dataset.k, ax = el.classList.contains('h') ? 'h' : 'v';
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); el.setPointerCapture(e.pointerId);
      const fit = f5El('f5-fit'); if (!fit) return;
      const move = ev => {
        const r = fit.getBoundingClientRect();
        const v = ax==='h' ? (ev.clientY - r.top)/r.height*100 : (ev.clientX - r.left)/r.width*100;
        const val = Math.max(0, Math.min(100, v));
        COORDS = Object.assign({}, co(), COORDS||{}); COORDS[k] = +val.toFixed(2);
        el.style[ax==='h'?'top':'left'] = val + '%';
        el.querySelector('b').textContent = `${RULE.find(x=>x[0]===k)[1]} ${val.toFixed(2)}`;
        buildPages(); paint();          /* 줄을 옮기면 안 박힌 얼굴들이 따라 선다 */
        drawGhosts();                   /* 열다섯 자리도 함께 따라온다 */
        const m = f5El('f5-rmsg');      /* 붙들린 개수도 끄는 동안 살아 있어야 한다 */
        if (m) m.textContent = (ruleTod ? `${todKr(ruleTod)} 벌` : '끌어서 맞추십시오') + heldNote();
      };
      const up = () => { el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); };
      el.addEventListener('pointermove', move); el.addEventListener('pointerup', up);
    });
  }
  async function saveRule(){
    const btn = f5El('f5-rsave-b'), msg = f5El('f5-rmsg');
    btn.disabled = true; msg.textContent = '담는 중…';
    const body = {}; KEYS.forEach(k => body[k] = co()[k]);
    try{
      await sbFetch('/rest/v1/living_room_floors?on_conflict=room_no,floor', {
        method:'POST',
        headers:{ 'Prefer':'resolution=merge-duplicates,return=representation' },
        body: JSON.stringify({ room_no: REAL_NO, floor: 4, coords: body, updated_at: new Date().toISOString() })
      });
      /* ⚠ 쓴 뒤에는 반드시 되읽는다 — PATCH는 맞는 행이 없어도 조용히 204다(0809) */
      const back = await sbFetch(`/rest/v1/living_room_floors?room_no=eq.${REAL_NO}&floor=eq.4&select=coords`);
      const got = back?.[0]?.coords || null;
      const ok = got && KEYS.every(k => Math.abs(Number(got[k]) - body[k]) < 0.011);
      msg.textContent = ok ? `${REAL_NO}번 방에 담겼습니다` : '담기지 않았습니다 — 다시';
    }catch(e){ msg.textContent = '담기 실패 — ' + (e.message||e); }
    finally{ btn.disabled = false; }
  }
  function toggleRule(){
    ruleOn = !ruleOn;
    f5El('f5-rule').hidden = !ruleOn;
    f5El('f5-ghosts').hidden = !ruleOn;
    f5El('f5-fit')?.classList.toggle('ruling', ruleOn);
    f5El('f5-rule-toggle').classList.toggle('on', ruleOn);
    if (ruleOn) drawRule();
    else if (ruleTod){        /* ⚠ 끄고 나서 남의 시각이 서 있으면 안 된다 */
      ruleTod = null; restoreBg();
    }
  }
  /* 손으로 놓인 것과 붙들린 것을 센다 — 몇 개가 산식을 안 따르는지 숫자로 */
  function heldNote(){
    const list = PAGES[page] || [];
    const pin  = list.filter(f => f._pinned).length;
    const held = list.filter(f => f._held).length;
    if (!pin) return '';
    return ` · 손으로 놓인 ${pin}점` + (held ? ` (${held}점 붙듦)` : '');
  }

  /* ════ 🏠 집 갈아타기 (집주인 · 내 방에서만) ════
     방 번호 하나가 네 층을 함께 가리킨다 */
  let homesOn = false;
  async function toggleHomes(){
    homesOn = !homesOn;
    const box = f5El('f5-homes');
    f5El('f5-home-toggle').classList.toggle('on', homesOn);
    if (!homesOn){ box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = '<button disabled>읽는 중…</button>';
    try{
      const rooms = await sbFetch('/rest/v1/living_rooms?active=eq.true&select=no,name&order=no');
      box.innerHTML = (rooms||[]).map(r =>
        `<button data-no="${r.no}" class="${r.no===REAL_NO?'me':''}">`
      + `${String(r.no).padStart(2,'0')} · ${f5Esc(r.name)}${r.no===REAL_NO?' — 지금 이 집':''}</button>`).join('');
      box.querySelectorAll('button[data-no]').forEach(bt => {
        bt.addEventListener('click', () => moveHome(Number(bt.dataset.no)));
      });
    }catch(e){ box.innerHTML = '<button disabled>방 목록을 못 읽었습니다</button>'; }
  }
  async function moveHome(no){
    if (no === REAL_NO) return;
    const meId = getUser()?.id || null; if (!meId) return;
    try{
      await sbFetch(`/rest/v1/wunderkammer?user_id=eq.${meId}`, {
        method:'PATCH', body: JSON.stringify({ living_no: no })
      });
      const back = await sbFetch(`/rest/v1/wunderkammer?user_id=eq.${meId}&select=living_no`);
      if (!back?.[0] || Number(back[0].living_no) !== no){
        console.warn('[액자방] 집이 안 옮겨졌습니다'); return;
      }
      location.reload();      /* 네 층이 같은 집이라야 한다 */
    }catch(e){ console.warn('[액자방] 집 갈아타기 실패', e); }
  }

  async function mount(){
    page = 0; sliding = false; ruleOn = false;
    editMode = false; selectedId = null; drag = null;
    ruleTod = null; todMissing = {};   /* ⚠ 방을 갈아타면 「없음」 표식도 새로 잰다 */

    const ownerId = await resolveOwnerId();
    ownerUid = ownerId;
    await loadRoom(ownerId);                     /* ⚠ 첫 그림 전에 읽는다 — 나중이면 한 번 튄다 */
    const t = f5Slot();
    const ok = await setBg([ bgUrl(REAL_NO, t), bgUrl(REAL_NO, 'd'), bgUrl(1, 'd') ]);
    await loadFaces(ownerId);
    buildPages();
    paint();
    if (ok) runCamera();                         /* ⚠ 그림이 실린 뒤 — fit 높이가 0이면 헛돈다 */

    /* ⚠ 0818 — ◀ 는 앞 쪽(최근), ▶ 는 다음 쪽(과거) */
    f5El('f5-prev').addEventListener('click', () => slide(+1));
    f5El('f5-next').addEventListener('click', () => slide(-1));

    /* ⚠ 문이 셋이다(0809 조항 그대로) — 자격이 셋 다 다르다
         ✎ 배치 바꾸기 = persona_wall(내 벽)   → 집주인에게만, 내 방에서만
         🏠 집 갈아타기 = wunderkammer(내 집)  → 집주인에게만, 내 방에서만
         ⚖  줄 맞추기  = living_room_floors    → 살롱지기면 어느 방에서든
       is_admin은 집주인이 아니라 **나**에게 묻는다(0809 함정 ③). */
    const meId = getUser()?.id || null;
    isOwner = !!meId && ownerId === meId;
    keeper = false;
    if (meId){
      try{
        const u = await sbFetch(`/rest/v1/users?id=eq.${meId}&select=is_admin`);
        keeper = !!(u && u[0] && u[0].is_admin);
      }catch(e){ console.warn('[액자방] 살롱지기 확인 실패', e); }
    }
    if (keeper || isOwner){
      f5El('f5-dock').hidden = false;
      if (isOwner){
        f5El('f5-edit-toggle').hidden = false;
        f5El('f5-edit-toggle').addEventListener('click', () => setEdit(!editMode));
        f5El('f5-home-toggle').hidden = false;
        f5El('f5-home-toggle').addEventListener('click', toggleHomes);
      }
      if (keeper){
        f5El('f5-rule-toggle').hidden = false;
        f5El('f5-rule-toggle').addEventListener('click', toggleRule);
      }
    }
    const bind = (id,fn) => { const el = f5El(id); if (el) el.onclick = fn; };
    bind('f5-size-down', () => adjSize(-1.2));
    bind('f5-size-up',   () => adjSize(1.2));
    bind('f5-rot-l',     () => adjRot(-2));
    bind('f5-rot-r',     () => adjRot(2));

    /* 빈 벽을 누르면 고른 것을 놓는다 (편집 중) */
    const fit = f5El('f5-fit');
    if (fit) fit.addEventListener('click', e => {
      if (editMode && (e.target === fit || e.target.id === 'f5-img'
        || e.target.id === 'f5-wall' || e.target.classList.contains('f5-page'))) clearSelection();
    });
    const sc = f5El('f5-scroll');
    if (sc) sc.addEventListener('scroll', () => { if (selectedId !== null) showTool(); });
  }

  return { markup, mount, slide };
})();


/* ===== 첫 진입 ===== */
// 명패 직행(최상위 페이지 + from_star)일 때만 별 복귀 문 노출.
// maison iframe 경유(①②⑤)는 self!==top이라 숨김 → 기존 maison "떠나기"와 중복 없음.
try {
  const _fromStar = new URLSearchParams(location.search).get('from_star');
  if (window.self === window.top && _fromStar) {
    const _eb = document.getElementById('wkExitStar');
    if (_eb) {
      _eb.style.display = 'block';
      _eb.addEventListener('click', () => { location.href = 'star.html?id=' + encodeURIComponent(_fromStar); });
    }
  }
} catch (e) {}
buildBar();
applyElevatorByOwner();   // 그 집 주인 elevator_no 로 문 표시 (없으면 CSS 기본 elevator_01)
/* 콘스텔라티오 순례: ?floor=N 으로 들어오면 그 층부터 시작 (없으면 1층). ?user= 는 loadLibrary가 읽음.
   ⚠⚠ 0812밤 — 옛 판은 `_qFloor <= 5`라 5를 통과시켰다. TOP_FLOOR가 4이므로
      floorData(5)가 undefined가 되고 applyPalette가 f.bg1에서 던져 **셸이 통째로 죽었다.**
      그 주소를 만드는 곳이 하필 star.html의 「← 분더카머로」였다 —
      얼굴을 누르고 돌아오는 길, 곧 4층이 존재하는 이유가 거기서 무너지고 있었다.
   ⭐ 이제 두 겹으로 막는다: 옛 5는 4로 옮겨 주고(즐겨찾기·옛 링크 구제),
      그 밖의 값은 무조건 1~TOP_FLOOR 안으로 접는다. 층이 늘어도 이 줄은 안 고친다. */
let _qFloor = parseInt(new URLSearchParams(location.search).get('floor'), 10);
if (_qFloor === 5) _qFloor = 4;                                   /* 옛 번호 구제 */
currentFloor = (_qFloor >= 1 && _qFloor <= TOP_FLOOR) ? _qFloor : 1;
if (window.EGCrashGuard && EGCrashGuard.check()) {
  // 0706 크래시 가드: 지난 크래시 감지 → 팝업만 띄우고 층 렌더 생략 (CSS 3D+webp 폭발 방지)
} else {
  if (window.EGCrashGuard) EGCrashGuard.mark('shell');
  renderFloor(currentFloor);

  /* ══ EG Credencial 입국 도장 두 장 (0804 소로 결정)
       CAMERA (방패·유리 종 아래 앵무조개)  내 분더카머를 둘러본 날
       DOMVS  (오각·굴뚝 있는 라탱 지구 집)  남의 집을 처음 둘러본 날
     둘은 다른 일이다(5호 — 무엇을 했는가에 찍는다). 같은 파일이 열렸다는
     이유로 한 장으로 묶으면 서로 다른 두 행위가 한 도장에 뭉개진다.
     앵무조개는 안에서만 보는 물건이고, 굴뚝 있는 집은 밖에서 보는 그림이다.
     ⚠ ?user=가 내 닉네임일 수도 있다 — 그때는 내 집이므로 CAMERA를 놓는다.
        임자를 실제로 대조하지 않으면 내 방에서 남의 집 도장이 뜬다.
     ⚠ supa를 안 넘긴다 — 이 파일엔 supabase-js가 없다. 부품이 REST로 간다. ══ */
  if (window.EGStamp) (async function(){
    try{
      const q  = new URLSearchParams(location.search).get('user');
      const me = getUser()?.id || null;
      let mine = true;
      if (q){
        const u = await sbFetch(`/rest/v1/users?nickname=eq.${encodeURIComponent(q)}&select=id`);
        mine = !!me && u?.[0]?.id === me;
      }
      EGStamp.offer({ area: mine ? 'camera' : 'domus' });
    }catch(e){ console.warn('[EGStamp] 임자 대조 실패, 물러납니다:', e); }
  })();
}
