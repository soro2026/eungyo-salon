<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>EG Wunderkammer · Building Shell v3 (3F books)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+KR:wght@300;400;500&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+KR:wght@100;600;700&display=swap');

/* ============================================================
 *  분더카머 빌딩 셸 v2 — 층 전환 골조 (콘텐츠 없음)
 *
 *  v1 → v2 변경:
 *   ① 층 안내 bar(다이얼)를 문에서 분리 → 문 위 늘 떠 있는 상단 패널.
 *      탑승 순간 뜸 → 문이 다 열린 뒤에야 사라짐. (실제 엘리베이터 경험)
 *   ② 좌우 문은 그 bar '아래'에서만 여닫이.
 *   ③ 4초 효과음(ding_sound.mp3) 싱크:
 *      0s 닫힘 시작 / 1.1s 철커덩(닫힘완료) / 1.4s 띵동=불 딸깍 점등
 *      / 2.5s 스르륵(열림 시작) / ~3.5s 문 활짝 + bar 사라짐
 * ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #050304;
  font-family: 'Noto Serif KR', 'Cormorant Garamond', serif;
  color: #e8d9b0;
  user-select: none;
}

:root {
  --floor-bg-1: #3a1820;  --floor-bg-2: #6a2230;
  --floor-accent: #c9a84c;
  --floor-text: #f0ebe0;
  --floor-text-dim: #a89a85;

  /* 효과음 싱크 타임라인 (초) — 소리가 주인, 애니메이션이 따라감 */
  --t-close: 1.1s;   /* 문 닫힘 완료(철커덩) */
  --t-open-dur: 1.0s;/* 문 열림 길이 (2.5s → 3.5s) */
}

/* ============================================================
 *  레이어 1 — 층 콘텐츠
 * ============================================================ */
.floor-layer {
  position: fixed; inset: 0; z-index: 1;
  display: flex; align-items: center; justify-content: center;
}
.floor {
  position: relative; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background:
    radial-gradient(ellipse 80% 60% at 50% 38%, rgba(255,240,210,0.10), transparent 70%),
    linear-gradient(165deg, var(--floor-bg-1) 0%, var(--floor-bg-2) 100%);
  box-shadow: inset 0 0 180px rgba(0,0,0,0.55);
}
.floor::before, .floor::after {
  content: ''; position: absolute; left: 0; right: 0; height: 5px;
  background: linear-gradient(90deg, transparent, var(--floor-accent), transparent);
  opacity: 0.5;
}
.floor::before { top: 0; }
.floor::after  { bottom: 0; }

.floor-roman {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(48px, 14vw, 120px); font-weight: 300; line-height: 1;
  color: var(--floor-accent); opacity: 0.85; letter-spacing: 4px;
  text-shadow: 0 4px 30px rgba(0,0,0,0.6);
}
.floor-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(22px, 6vw, 38px); font-weight: 400; font-style: italic;
  color: var(--floor-text); letter-spacing: 3px; margin-top: 14px;
}
.floor-kr {
  font-size: clamp(13px, 3.6vw, 16px); color: var(--floor-text-dim);
  letter-spacing: 6px; margin-top: 10px;
}
.floor-placeholder {
  margin-top: 34px; padding: 10px 22px;
  border: 1px dashed color-mix(in srgb, var(--floor-accent) 45%, transparent);
  border-radius: 2px; font-size: 11px; letter-spacing: 3px;
  color: var(--floor-text-dim); font-family: 'Cormorant Garamond', serif;
}

/* ===== 층 안 엘리베이터 — 놋쇠 조작반 (0818 소로 시안) =====
   ⭐ 0816에 「엘리베이터 같지 않다」로 한 번 고쳤고, 0818에 소로가 시안을 그려 오셨다.
      벽에 붙은 **한 장의 놋쇠 판**. 층 번호가 누르는 원판이고, 서 있는 층에만 불이 켜진다.
   ⚠ 자리는 살롱지기가 거실 편집기에서 끌어 정한다 — 값은 eg_settings.living_layout에 앉는다.
     0818 소로: 「너무 위에 붙이지 말고 오른쪽 중하단, 눈높이 약간 아래로」 → 기본 62%.
   ⚠ 층 색(--floor-accent)을 안 쓴다. 조작반은 방의 물건이 아니라 **엘리베이터의 물건**이라
     층을 옮겨도 같은 놋쇠여야 한다. 층이 바뀌는 것은 불 켜진 원판 하나뿐이다. */
.room-elevator {
  position: absolute;
  right: var(--lift-r, 2.4%); top: var(--lift-t, 62%); transform: translateY(-50%);
  z-index: 30; /* 책방 cover-stack(5)·화살표(8)보다 위 — 항상 클릭 가능 */
  display: flex; flex-direction: column; align-items: center;
  padding: 14px 10px;
  background: linear-gradient(105deg,#6d5a38 0%,#a98d55 12%,#e7cf96 26%,#b9985c 42%,
              #8a7244 58%,#c9ad6f 74%,#9a7f4c 88%,#6d5a38 100%);
  border: 1px solid #5d4b2c; border-radius: 14px;
  box-shadow: 0 10px 32px rgba(30,22,10,.5),
              inset 0 1px 0 rgba(255,244,210,.55),
              inset 0 -1px 2px rgba(60,45,20,.5);
}
/* 각인 — 판에 새긴 글씨라 그림자가 아래가 아니라 위로 뜬다 */
.lift-brand {
  font: 600 8.5px 'Cormorant Garamond', serif; letter-spacing: .32em; color: #4a3a1e;
  padding: 0 0 10px; margin-bottom: 10px; text-align: center; line-height: 1.5;
  border-bottom: 1px solid rgba(74,58,30,.35);
  text-shadow: 0 1px 0 rgba(255,244,210,.5); pointer-events: none;
}
.lift-rows { display: flex; flex-direction: column; gap: 10px; }
.lift-row { position: relative; display: flex; align-items: center; gap: 7px; }
/* 층 원판 — 서 있는 층은 안에서 불이 켜져 있다 */
.lift {
  width: 40px; height: 40px; border-radius: 50%; padding: 0;
  display: grid; place-items: center; cursor: pointer;
  font: 600 15px 'Cormorant Garamond', serif; letter-spacing: .04em;
  color: #c9b586; background: radial-gradient(circle at 35% 30%,#3f3524,#241d12);
  border: 1px solid #43371f;
  box-shadow: inset 0 2px 5px rgba(0,0,0,.6), 0 1px 0 rgba(255,244,210,.35);
  transition: color .2s, border-color .2s, box-shadow .25s, background .25s;
}
.lift:hover { border-color: #d9bd7e; color: #f0dfb4; }
.lift-row.now .lift {
  color: #2b241a; background: radial-gradient(circle at 35% 30%,#fdf3d2,#d9b56c);
  border-color: #fdf3d2; cursor: default;
  box-shadow: 0 0 16px rgba(220,185,110,.75), inset 0 1px 2px rgba(255,255,255,.6);
}
/* 직행 — 서 있는 층에는 갈 곳이 없다. 자리는 지키고 모습만 감춘다 */
.lift-jump {
  width: 18px; height: 18px; padding: 0; border: 0; background: none; cursor: pointer;
  display: grid; place-items: center;
  font: 600 13px/1 'Cormorant Garamond', serif; color: #4a3a1e;
  text-shadow: 0 1px 0 rgba(255,244,210,.55); opacity: .75;
  transition: transform .25s, opacity .2s, color .2s;
}
.lift-jump:hover { opacity: 1; transform: rotate(90deg) scale(1.2); color: #2f240f; }
.lift-row.now .lift-jump { visibility: hidden; }
/* 손을 얹으면 그 층이 무엇인지 — 판 왼쪽에 한 줄 */
.lift-tip {
  position: absolute; right: calc(100% + 14px); top: 50%; transform: translateY(-50%);
  white-space: nowrap; background: #2b241a; border: 1px solid #59492f; border-radius: 8px;
  padding: 7px 13px; display: flex; align-items: baseline; gap: 8px;
  box-shadow: 0 6px 20px rgba(30,22,10,.4);
  opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
}
.lift-row:hover .lift-tip, .lift-row:focus-within .lift-tip {
  opacity: 1; transform: translateY(-50%) translateX(0);
}
.lift-row .lift-tip { transform: translateY(-50%) translateX(6px); }
.lift-tip .lt-no { font: 600 11px 'Cormorant Garamond', serif; color: #a68d58; letter-spacing: .08em; }
.lift-tip .lt-kr { font-size: 12.5px; font-weight: 500; color: #efe4cd; }
.lift-tip .lt-desc { font-size: 11px; color: #a2957c; }
/* 발 — 가름선과 운행등. 문이 움직이는 동안만 주황 */
.lift-sep { width: 22px; height: 1px; background: rgba(74,58,30,.35);
  margin: 12px 0 8px; box-shadow: 0 1px 0 rgba(255,244,210,.45); }
.lift-lamp { width: 7px; height: 7px; border-radius: 50%;
  background: #7f9a82; box-shadow: 0 0 6px rgba(127,154,130,.7);
  transition: background .25s, box-shadow .25s; }
.room-elevator.moving .lift-lamp { background: #e07f4f; box-shadow: 0 0 8px rgba(224,127,79,.85); }
@media (max-width: 560px){
  .room-elevator { padding: 10px 7px; border-radius: 11px; }
  .lift-brand { display: none; }          /* 0818 — 좁은 화면에서는 원판만 */
  .lift-rows { gap: 7px; }
  .lift { width: 33px; height: 33px; font-size: 13px; }
  .lift-jump { display: none; }
  .lift-tip { display: none; }
}

/* ============================================================
 *  층 콘텐츠 공통 래퍼
 * ============================================================ */
.floor-content { position: absolute; inset: 0; }


/* ══════════════════════════════════════════════════════════════════
 *  ⅠF Le Séjour · 거실 — 0728 신축 (세 건물 재편 7호)
 *  아홉 점 갤러리를 접고 한 점 거실을 연다.
 *  배경은 콩파뇽이 고른 방 한 장(941×1672) · 시간대 넷이 스스로 바뀐다.
 *  그림 자리만 셸이 얹고, 나머지는 전부 배경 그림이다.
 *  확대·설명 UI(g1-zoom · g1-note)는 옛 갤러리 것을 그대로 물려받았다.
 * ══════════════════════════════════════════════════════════════════ */
.floor-content[data-floor="1"] .sl-scroll{
  position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
  scrollbar-width:none; -ms-overflow-style:none;
}
.floor-content[data-floor="1"] .sl-scroll::-webkit-scrollbar{ display:none; width:0; height:0; }
/* 무대 — 그림의 비율을 따라간다. 가로 폭은 상한을 둔다.
   ⚠ 0728밤 정정: 처음엔 width:100% + aspect-ratio:941/1672로 못을 박았다.
     그러면 ① 넓은 화면에서 방이 2.5m로 펼쳐져 박물관이 되고
            ② 어떤 비율로 구워 와도 9:16으로 잘린다.
     이제 비율은 JS가 그림에서 재서 넣고(--sl-ar), 폭만 여기서 잡는다. */
.floor-content[data-floor="1"] .sl-stage{
  position:relative;
  width:min(100%, var(--sl-maxw, 1440px));   /* 0728밤: 1200 → 1440 (소로) */
  margin:0 auto;
  aspect-ratio:var(--sl-ar, 941/1672);   /* 0809 — 일곱 방 모두 9:16이다. 그림이 실리면 실측값으로 덮인다 */
  background:linear-gradient(168deg,#2a1d18 0%,#20160f 55%,#120c08 100%);
  background-size:cover; background-position:center top;
  transition:background-image .8s ease;
  z-index:1;
}
/* 좌우 여백 — 까맣게 두지 않는다. 같은 그림을 크게 흐려 뒤에 깔면
   방의 빛깔이 이어져 액자처럼 감싼다(극장 스크린 주변과 같은 이치). */
.floor-content[data-floor="1"] .sl-blur{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-size:cover; background-position:center;
  filter:blur(42px) brightness(.45) saturate(.85);
  transform:scale(1.12);
  transition:background-image .8s ease;
}
/* 그림 — 좌표는 living_rooms(art_x·art_y·art_h)가 정한다 */
.floor-content[data-floor="1"] .sl-art{
  position:absolute; z-index:12; cursor:zoom-in;
  transform:translateX(-50%);
  filter:drop-shadow(0 10px 26px rgba(0,0,0,.55));
  transition:filter .3s ease;
}
.floor-content[data-floor="1"] .sl-art:hover{ filter:drop-shadow(0 12px 32px rgba(0,0,0,.7)) brightness(1.05); }
.floor-content[data-floor="1"] .sl-art img{ display:block; height:100%; width:auto; }
/* 빈 벽 — 아무것도 안 걸렸을 때. 묻지 않고 그냥 거기 있다 */
.floor-content[data-floor="1"] .sl-empty{
  position:absolute; z-index:12; transform:translateX(-50%);
  min-width:150px;                      /* 좁은 화면에서 글자가 세로로 쪼개지지 않게 */
  display:flex; align-items:center; justify-content:center; text-align:center;
  border:1px dashed rgba(201,168,76,.30); border-radius:3px;
  font-family:'Cormorant Garamond','Noto Serif KR',serif;
  font-size:13px; line-height:1.9; color:rgba(240,235,224,.42);
  padding:14px; letter-spacing:.03em;
}
/* 명패 — 그림 아래. 누르면 설명이 펼쳐진다 */
/* ── 명패 — 미술관과 같은 얼굴 (galerie #plaque 이식 · 0809 소로) ──
   박스가 아니라 벽에 새긴다. 잉크는 명패가 앉은 곳의 벽을 재서 고른다.
   ⭐ 낭독 줄은 **음성이 있는 그림에만** 뜬다(0806밤 원칙: 그림 곁에는 팝업 말고 소리). */
.floor-content[data-floor="1"] .sl-plaque{
  position:absolute; z-index:15; transform:translateX(-50%);
  text-align:center; white-space:nowrap; cursor:pointer; pointer-events:auto;
  font-family:'Noto Serif KR',serif; font-weight:300;
  text-shadow:0 1px 3px rgba(0,0,0,.4);
}
.floor-content[data-floor="1"] .sl-plaque .p-name{
  font-size:.56em; letter-spacing:.04em; color:#f2ead6;
}
.floor-content[data-floor="1"] .sl-plaque .p-artist{
  font-family:'Cormorant Garamond',serif; font-size:.46em; letter-spacing:.16em;
  color:rgba(232,221,196,.72); margin-top:.3em;
}
.floor-content[data-floor="1"] .sl-plaque .p-voice{
  display:none; margin-top:.42em; font-size:.46em; letter-spacing:.06em;
  color:rgba(232,214,168,.92); cursor:pointer; user-select:none;
}
.floor-content[data-floor="1"] .sl-plaque .p-voice.on{ display:block; }
.floor-content[data-floor="1"] .sl-plaque .p-voice:hover{ color:#f6ecd2; }
.floor-content[data-floor="1"] .sl-plaque .p-voice .vd{ opacity:.55; margin-left:.4em; font-size:.92em; }
/* 흰 벽에 상아색을 얹으면 글자가 벽에 먹힌다 — 재서 뒤집는다 */
.floor-content[data-floor="1"] .sl-plaque.ink-dark{ text-shadow:0 1px 2px rgba(255,255,255,.32); }
.floor-content[data-floor="1"] .sl-plaque.ink-dark .p-name{ color:#2a2318; }
.floor-content[data-floor="1"] .sl-plaque.ink-dark .p-artist{ color:rgba(42,35,24,.62); }
.floor-content[data-floor="1"] .sl-plaque.ink-dark .p-voice{ color:rgba(90,70,26,.95); }
.floor-content[data-floor="1"] .sl-plaque.ink-dark .p-voice:hover{ color:#3a2c10; }


/* ══════════════════════════════════════════════════════════════════
 *  ⅠF 메시지 보드 · 꽃 티커 — 0809 (옛 갤러리 좌측 벽에서 되살림)
 *
 *  ⭐ 좌표를 손으로 안 적는다. living_rooms.wall_top·wall_bot 두 값에서
 *     글귀판·그림·명패·꽃 넉 곳을 셸이 계산한다(0809 결정).
 *     방이 서른이 되어도 손으로 맞출 값은 방마다 둘뿐이다.
 *
 *  ⚠ 글자는 언제나 먹(#16130F)이고, 밝기는 **띠가 책임진다.**
 *    벽 밝기가 방마다(95~237) 또 시각마다 갈리므로 글자색을 흔들면 답이 없다.
 *    띠 색은 그 그림의 글귀판 구역에서 직접 뽑아 그 방의 빛을 입는다.
 *
 *  ⚠ 색을 재기 전에는 글귀판을 **그리지 않는다.** 폴백은 대신 서는 것이지
 *    먼저 서는 것이 아니다(0808 조항).
 * ══════════════════════════════════════════════════════════════════ */

/* 글자 크기는 무대 폭을 따라간다 — JS가 .sl-stage의 font-size를 px로 넣고
   아래는 전부 em을 쓴다. 폰에서도 노트북에서도 벽에 대한 비율이 같다. */

/* ── 글귀 — 벽에 새긴다. 박스 없음 (0809 소로: 「미술관 명패처럼」) ──
   ⭐ 잉크는 미술관 명패와 같은 부품이다 — 그 구역 벽을 재서 상아색과 먹색 중
      대비가 큰 쪽을 고른다. 벽 밝기가 방마다(95~237) 또 시각마다 갈리므로
      관마다 고정값을 박는 방식은 무너진다(galerie 0805 계보). */
.floor-content[data-floor="1"] .sl-mw{
  position:absolute; z-index:14; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; box-sizing:border-box; pointer-events:none;
  font-family:'Noto Serif KR',serif; font-weight:300;
  color:#f2ead6; text-shadow:0 1px 3px rgba(0,0,0,.42);
}
.floor-content[data-floor="1"] .sl-mw.ink-dark{
  color:#2a2318; text-shadow:0 1px 2px rgba(255,255,255,.34);
}
.floor-content[data-floor="1"] .sl-mw-nick{
  font-family:'Cormorant Garamond',serif;
  font-size:.6em; letter-spacing:.34em; opacity:.5; margin-bottom:.55em;
  text-transform:uppercase; white-space:nowrap;
}
.floor-content[data-floor="1"] .sl-mw-title{
  font-size:.66em; letter-spacing:.12em; opacity:.66; margin-bottom:.95em;
}
.floor-content[data-floor="1"] .sl-mw-body{
  font-size:.94em; line-height:1.95; white-space:pre-wrap; max-width:30em;
}
.floor-content[data-floor="1"] .sl-mw-sig{
  font-size:.62em; opacity:.55; margin-top:1.05em; font-style:italic;
}
.floor-content[data-floor="1"] .sl-mw-empty{
  font-size:.72em; opacity:.4; line-height:2;
}

/* ── 통합 손잡이 — 엘리베이터 아래. 같은 재질이라 한 식구로 보인다 ── */
.floor-content[data-floor="1"] .sl-dock{
  position:absolute; right:var(--dock-r, 3%); top:var(--dock-t, 66%);
  transform:translateY(-50%);
  z-index:31; display:flex; flex-direction:column; align-items:center; gap:7px;
}
/* 맞추는 중 — 끌 수 있게 점선을 두른다 */
.floor-content[data-floor="1"] .sl-dock.editing,
.room-elevator.editing{
  outline:2px dashed rgba(150,200,160,.9); outline-offset:5px; border-radius:10px; cursor:move;
}
.floor-content[data-floor="1"] .sl-dock-h{
  width:34px; height:34px; border-radius:50%; cursor:pointer; padding:0;
  background:linear-gradient(180deg,rgba(60,42,24,.9),rgba(34,22,12,.95));
  border:1px solid color-mix(in srgb, var(--floor-accent) 50%, transparent);
  color:var(--floor-accent); font-size:15px; line-height:1;
  transition:background .2s, transform .15s;
}
.floor-content[data-floor="1"] .sl-dock-h:hover{
  background:linear-gradient(180deg,rgba(90,62,34,.95),rgba(50,34,18,1));
}
.floor-content[data-floor="1"] .sl-dock-h:active{ transform:scale(.94); }
.floor-content[data-floor="1"] .sl-dock-h.on{
  background:linear-gradient(180deg,rgba(201,168,76,.9),rgba(160,128,52,.95)); color:#241a12;
}
.floor-content[data-floor="1"] .sl-dock-menu{
  display:flex; flex-direction:column; gap:6px; align-items:center;
}
.floor-content[data-floor="1"] .sl-dock-menu[hidden]{ display:none !important; }
.floor-content[data-floor="1"] .sl-dock-b{
  width:34px; height:34px; border-radius:50%; cursor:pointer; padding:0;
  background:rgba(24,16,10,.86);
  border:1px solid color-mix(in srgb, var(--floor-accent) 38%, transparent);
  color:var(--floor-text-dim); font-size:14px; line-height:1;
  transition:background .2s, color .2s, border-color .2s;
}
.floor-content[data-floor="1"] .sl-dock-b:hover{
  border-color:#d9bd7e; color:#f0dfb4;
  border-color:color-mix(in srgb, var(--floor-accent) 70%, transparent);
}

/* 꽃 티커 — 콘솔 상판 위에 앉는다. 바닥선이 wall_bot */
.floor-content[data-floor="1"] .sl-tick{
  position:absolute; z-index:13; transform:translateX(-50%);
  overflow:hidden; display:flex; align-items:flex-end;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
}
.floor-content[data-floor="1"] .sl-tick-track{
  display:inline-flex; align-items:flex-end; white-space:nowrap; height:100%;
  will-change:transform;
  animation:sl-tick-flow var(--sl-tick-dur, 60s) linear infinite;
}
.floor-content[data-floor="1"] .sl-tick:hover .sl-tick-track{ animation-play-state:paused; }
.floor-content[data-floor="1"] .sl-tick-chip{
  display:inline-flex; align-items:flex-end; gap:.4em; padding:0 1.5em 0 0;
  font-family:'Noto Serif KR',serif; font-size:.62em; font-weight:300;
  color:var(--sl-tick-ink,#f0ebe0); text-shadow:var(--sl-tick-shadow, 0 1px 3px rgba(0,0,0,.5));
}
.floor-content[data-floor="1"] .sl-tick-chip img{
  height:2.6em; width:auto; object-fit:contain; flex:0 0 auto;
  filter:drop-shadow(0 .1em .25em rgba(0,0,0,.45));
}
.floor-content[data-floor="1"] .sl-tick-chip b{ font-weight:500; opacity:.95; }
.floor-content[data-floor="1"] .sl-tick-chip i{ font-style:normal; opacity:.72; }
@keyframes sl-tick-flow{ from{transform:translateX(0)} to{transform:translateX(-50%)} }

/* ── 다녀간 이들 (0816 소로) ──
   ⚠ can-open 은 내 집에서만 붙는다. EDITING 중에는 티커가 끌어서 옮기는
     손잡이라 그때도 안 붙인다 — 배치를 맞추다 팝업이 튀어나오면 안 된다. */
.floor-content[data-floor="1"] .sl-tick.can-open{ cursor:pointer; }
.floor-content[data-floor="1"] .sl-tick-chip u{
  font-style:normal; text-decoration:none; opacity:.5; font-size:.86em;
}
/* 전체 보기 — 거실 모달(.sl-box) 문법 그대로. 목록이라 폭만 넓힌다 */
.sl-box.sl-wide{ width:min(680px,94vw); }
.gb-list{ margin:10px 0 0; max-height:56vh; overflow-y:auto;
  scrollbar-width:none; -ms-overflow-style:none; }
.gb-list::-webkit-scrollbar{ display:none; }
.gb-row{ display:flex; align-items:flex-start; gap:10px;
  padding:11px 2px; border-bottom:1px solid rgba(201,168,76,.16); }
.gb-row:last-child{ border-bottom:0; }
.gb-row > img{ height:26px; width:auto; flex:0 0 auto; margin-top:1px; }
.gb-main{ flex:1 1 auto; min-width:0; }
.gb-who{ font-size:13px; color:#e9cf9c; font-weight:500; }
.gb-when{ font-size:11px; color:rgba(240,235,224,.45); margin-left:.5em; }
.gb-text{ font-size:13.5px; line-height:1.62; color:#f0ebe0; margin-top:2px;
  word-break:break-word; white-space:pre-wrap; }
.gb-act{ flex:0 0 auto; background:none; border:1px solid rgba(201,168,76,.34);
  color:rgba(240,235,224,.62); border-radius:7px; font-size:11px; padding:4px 9px;
  cursor:pointer; font-family:inherit; }
.gb-act:hover{ border-color:rgba(201,168,76,.62); color:#e9cf9c; }
.gb-row.off .gb-who, .gb-row.off .gb-text{ opacity:.34; }
.gb-row.off .gb-text{ text-decoration:line-through; }
.gb-more{ width:100%; margin-top:12px; background:none;
  border:1px solid rgba(201,168,76,.34); color:#e9cf9c; border-radius:9px;
  padding:9px 0; cursor:pointer; font-family:inherit; font-size:12.5px; }
.gb-empty{ padding:22px 2px; text-align:center; font-size:13px;
  color:rgba(240,235,224,.5); }
@media (prefers-reduced-motion: reduce){
  .floor-content[data-floor="1"] .sl-tick-track{ animation:none; }
}

/* 글귀 쓰기 · 꽃 두기 모달 (옛 갤러리 mw-modal을 EG 종이색으로) */
.sl-modal{
  position:fixed; inset:0; z-index:9999; background:rgba(14,10,7,.74);
  display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto;
}
.sl-box{
  background:linear-gradient(180deg,#241a12,#1a120c);
  border:1px solid rgba(201,168,76,.45); border-radius:14px;
  padding:26px 28px; width:min(520px,92vw); box-sizing:border-box;
  max-height:90vh; overflow-y:auto; color:#f0ebe0;
  font-family:'Noto Serif KR',serif; font-weight:300;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.sl-box h3{ margin:0 0 6px; font-size:18px; color:#e9cf9c; letter-spacing:.06em; font-weight:400; }
.sl-box .sl-hint{ font-size:12.5px; color:rgba(232,221,196,.5); line-height:1.8; margin:0 0 8px; }
.sl-box label{ display:block; font-size:11.5px; color:rgba(201,162,74,.85);
  margin:15px 0 6px; letter-spacing:.1em; }
.sl-box input, .sl-box textarea{
  width:100%; box-sizing:border-box; background:rgba(0,0,0,.32);
  border:1px solid rgba(201,168,76,.3); border-radius:8px; padding:11px 13px;
  color:#f5ead0; font-size:15px; font-family:inherit; resize:vertical; user-select:text;
}
.sl-box input:focus, .sl-box textarea:focus{ outline:none; border-color:#c9a84c; }
.sl-btns{ display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
.sl-fgrid{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-top:14px; }
.sl-fgrid.busy{ opacity:.5; pointer-events:none; }
.sl-fpick{ aspect-ratio:1; padding:5px; border-radius:9px; cursor:pointer;
  background:rgba(0,0,0,.28); border:1px solid rgba(201,168,76,.22);
  transition:border-color .2s, transform .15s; }
.sl-fpick:hover{ border-color:#c9a84c; transform:translateY(-2px); }
.sl-fpick img{ width:100%; height:100%; object-fit:contain; display:block; }
.sl-fnow{ display:flex; align-items:center; gap:14px; margin:14px 0 4px; }
.sl-fnow img{ width:52px; height:52px; object-fit:contain; flex:0 0 auto; }
.sl-fnow b{ font-size:22px; color:#e9cf9c; font-weight:400;
  font-family:'Cormorant Garamond',serif; }
.sl-fnow span{ font-size:11.5px; color:rgba(232,221,196,.5); line-height:1.7; }
@media (max-width:460px){ .sl-fgrid{ grid-template-columns:repeat(4,1fr); } }
.sl-btns button{ padding:9px 20px; font-size:13.5px; border-radius:20px; cursor:pointer;
  border:1px solid rgba(201,168,76,.55); font-family:inherit; }
.sl-cancel{ background:transparent; color:rgba(232,221,196,.65); }
.sl-ok{ background:#c9a84c; color:#241a12; font-weight:500; }
#sl-toast{
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(14px);
  background:rgba(24,17,11,.96); border:1px solid rgba(201,168,76,.45); border-radius:11px;
  padding:12px 20px; font-size:13px; color:#f0ebe0; font-family:'Noto Serif KR',serif;
  opacity:0; pointer-events:none; transition:opacity .3s, transform .3s; z-index:10000;
}
#sl-toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ── 배치 맞추기 — 미술관 문법. 끌어 옮기고 모서리로 키운다 (0809 소로) ──
   ⚠ 여기서 맞추는 값은 **벽 구역에 대한 비율**이라 일곱 방 전부에 통한다.
     방마다 저장하면 서른 채에 270값이 된다. 저장은 eg_settings 한 줄. */
.floor-content[data-floor="1"] .sl-mw.editing{
  pointer-events:auto; cursor:move;
  outline:2px dashed rgba(127,179,213,.95); outline-offset:6px; border-radius:4px;
}
.floor-content[data-floor="1"] .sl-art.editing,
.floor-content[data-floor="1"] .sl-empty.editing{
  outline:2px dashed rgba(233,207,156,.9); outline-offset:4px; cursor:move;
}
.floor-content[data-floor="1"] .sl-tick.editing{
  pointer-events:auto; cursor:ns-resize;
  outline:2px dashed rgba(180,140,200,.9); outline-offset:4px; border-radius:4px;
  /* ⚠ overflow:hidden 과 mask 가 모서리 손잡이를 잘라 먹었다 — 안 보이니 못 잡는다.
     맞추는 동안은 걷는다. 맞출 때는 진짜 폭이 보여야 한다. */
  overflow:visible; -webkit-mask-image:none; mask-image:none;
}
.floor-content[data-floor="1"] .sl-h{
  position:absolute; width:16px; height:16px; right:-10px; bottom:-10px; z-index:40;
  border:2px solid #e9cf9c; background:rgba(10,8,5,.82); border-radius:4px;
  cursor:nwse-resize; display:none; touch-action:none;
}
.floor-content[data-floor="1"] .editing > .sl-h{ display:block; }

#sl-bar{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom)); z-index:210;
  display:flex; gap:8px; align-items:center;
}
#sl-bar[hidden]{ display:none !important; }
#sl-bar button{
  font-family:'Noto Serif KR',serif; font-size:12px; letter-spacing:.05em;
  border-radius:18px; padding:9px 17px; cursor:pointer; border:1px solid rgba(233,207,156,.5);
  background:rgba(12,9,6,.78); color:rgba(233,207,156,.92);
}
#sl-bar button.go{ background:#c9a84c; color:#241a12; border-color:#c9a84c; font-weight:500; }
/* ── 글자·속도 손잡이 (0816 소로) ── */
.sl-knob{
  display:flex; align-items:center; gap:7px; padding:6px 12px; border-radius:18px;
  border:1px solid rgba(233,207,156,.34); background:rgba(12,9,6,.78);
  font-family:'Noto Serif KR',serif; font-size:11px; color:rgba(233,207,156,.78);
  white-space:nowrap;
}
.sl-knob input[type=range]{ width:96px; accent-color:#c9a84c; cursor:pointer; }
.sl-knob b{
  font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10.5px;
  font-weight:400; color:#e9cf9c; min-width:74px; text-align:right;
}
@media (max-width:760px){ .sl-knob input[type=range]{ width:64px; } .sl-knob b{ min-width:0; } }
/* 방 띠 — 맞추면서 일곱 방을 눈으로 넘긴다. DB는 안 건드리는 미리보기다 */
#sl-rooms{ display:flex; gap:5px; }
#sl-rooms button{
  font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; letter-spacing:0;
  padding:8px 0; width:32px; border-radius:8px;
  background:rgba(12,9,6,.7); color:rgba(233,207,156,.6); border-color:rgba(233,207,156,.28);
}
#sl-rooms button:hover{ color:#e9cf9c; border-color:rgba(233,207,156,.6); }
#sl-rooms button.on{ background:#c9a84c; color:#241a12; border-color:#c9a84c; }
/* 벽이 가장 좁은 방 — 여기서 맞추면 나머지는 저절로 여유가 생긴다 */
#sl-rooms button.thin{ box-shadow:0 0 0 1px rgba(224,143,106,.85) inset; }
#sl-rooms button.thin::after{ content:'·'; }
.sl-sep{ width:1px; height:22px; background:rgba(233,207,156,.28); margin:0 3px; }
#sl-info{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(62px + env(safe-area-inset-bottom)); z-index:210;
  background:rgba(12,9,6,.82); border:1px solid rgba(201,168,76,.3); border-radius:9px;
  padding:8px 13px; font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:11px; line-height:1.75; color:#e9cf9c; white-space:nowrap;
}
#sl-info[hidden]{ display:none !important; }
#sl-info em{ font-style:normal; opacity:.5; }

/* ============================================================
 *  ⅢF 책의 방 (Bibliothèque) — 전부 [data-floor="3"] 스코프
 *  원본 hello_books_v1.6 → 셸 통합. 전역 html,body 제거,
 *  fixed → absolute (층 콘텐츠 박스 기준), z-index 셸 체계로.
 * ============================================================ */
.floor-content[data-floor="3"] {
  --c-amber: #f0d8a8; --c-amber-dim: #b89968; --c-amber-dark: #6b5838;
  font-family: 'Cormorant Garamond', 'Noto Serif KR', Georgia, serif;
  color: var(--c-amber);
}
.floor-content[data-floor="3"] .stage {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
}
.floor-content[data-floor="3"] .room {
  position: relative; width: 100%; max-width: 1672px;
  aspect-ratio: 1672 / 941;
  /* 0809: 배경은 JS가 study_NN_{m·d·e·n}.webp로 넣는다. 옛 bookshelf_01 참조 철거 */
  background-color: #2a1410; overflow: hidden;
}
.floor-content[data-floor="3"] .bk-bg-layer {
  position: absolute; inset: 0; background-size: cover; background-position: center;
  transition: opacity 0.9s ease; z-index: 0; pointer-events: none;
}
.floor-content[data-floor="3"] .pendant-sway {
  position: absolute; left: 50%; top: 0; width: 30%; height: 30%;
  transform: translateX(-50%); pointer-events: none;
  animation: bk-pendant-sway 45s ease-in-out infinite;
  transform-origin: 50% 0%; z-index: 2;
}
@keyframes bk-pendant-sway {
  0%, 100% { transform: translateX(-50%) rotate(0deg); }
  25%      { transform: translateX(-50%) rotate(0.15deg); }
  75%      { transform: translateX(-50%) rotate(-0.15deg); }
}
.floor-content[data-floor="3"] .pendant-glow {
  position: absolute; left: 50%; top: 25%; width: 14%; aspect-ratio: 1;
  transform: translate(-50%, -50%); border-radius: 50%;
  pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(circle, rgba(255,220,150,0.45) 0%, rgba(255,200,120,0.25) 30%, rgba(255,180,100,0.10) 60%, transparent 100%);
  filter: blur(8px); animation: bk-pendant-breath 4s ease-in-out infinite;
}
@keyframes bk-pendant-breath {
  0%, 100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
  50%      { opacity: 1.0;  transform: translate(-50%, -50%) scale(1.08); }
}
.floor-content[data-floor="3"] .dust {
  position: absolute; width: 3px; height: 3px;
  background: radial-gradient(circle, rgba(255,220,150,0.7), transparent);
  border-radius: 50%; pointer-events: none; z-index: 4;
}
.floor-content[data-floor="3"] .dust-1 { left: 47%; top: 30%; animation: bk-dust-1 18s ease-in-out infinite; }
.floor-content[data-floor="3"] .dust-2 { left: 52%; top: 35%; animation: bk-dust-2 22s ease-in-out infinite; }
.floor-content[data-floor="3"] .dust-3 { left: 49%; top: 28%; animation: bk-dust-3 25s ease-in-out infinite; }
.floor-content[data-floor="3"] .dust-4 { left: 53%; top: 32%; animation: bk-dust-4 20s ease-in-out infinite; }
.floor-content[data-floor="3"] .dust-5 { left: 48%; top: 34%; animation: bk-dust-5 28s ease-in-out infinite; }
@keyframes bk-dust-1 { 0%,100% {transform:translate(0,0);opacity:.3} 25% {transform:translate(8px,-12px);opacity:.7} 50% {transform:translate(-4px,-20px);opacity:.5} 75% {transform:translate(-10px,-8px);opacity:.6} }
@keyframes bk-dust-2 { 0%,100% {transform:translate(0,0);opacity:.4} 33% {transform:translate(-12px,10px);opacity:.8} 66% {transform:translate(6px,-15px);opacity:.5} }
@keyframes bk-dust-3 { 0%,100% {transform:translate(0,0);opacity:.2} 50% {transform:translate(15px,18px);opacity:.6} }
@keyframes bk-dust-4 { 0%,100% {transform:translate(0,0);opacity:.5} 25% {transform:translate(-8px,-10px);opacity:.7} 75% {transform:translate(12px,6px);opacity:.4} }
@keyframes bk-dust-5 { 0%,100% {transform:translate(0,0);opacity:.3} 40% {transform:translate(-15px,8px);opacity:.6} 80% {transform:translate(10px,-12px);opacity:.5} }

.floor-content[data-floor="3"] .cover-stack { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
.floor-content[data-floor="3"] .cover-page {
  position: absolute; inset: 0; opacity: 0; pointer-events: none;
  transition: opacity 0.6s ease-in-out;
}
.floor-content[data-floor="3"] .cover-page.active { opacity: 1; }
.floor-content[data-floor="3"] .cover-page.active .cover-book { pointer-events: auto; }
.floor-content[data-floor="3"] .cover-book {
  position: absolute; cursor: pointer;
  transition: transform 0.3s ease, filter 0.3s ease;
  filter: drop-shadow(2px 5px 10px rgba(0,0,0,0.75));
  transform: translate(-50%, -100%);
}
.floor-content[data-floor="3"] .cover-book img { height: 100%; width: auto; display: block; }
.floor-content[data-floor="3"] .cover-book:hover {
  transform: translate(-50%, -100%) translateY(-8px) scale(1.05);
  filter: drop-shadow(5px 10px 18px rgba(0,0,0,0.9)); z-index: 10;
}
/* ── 편집 모드 (heritage 보물 편집 이식: 선택·드래그·핸들 크기) ── */
.floor-content[data-floor="3"].editing .cover-book { cursor: grab; }
.floor-content[data-floor="3"].editing .cover-book:hover { transform: translate(-50%,-100%); filter: drop-shadow(2px 5px 10px rgba(0,0,0,0.75)); }
.floor-content[data-floor="3"].editing .cover-book.grabbing { cursor: grabbing; }
.floor-content[data-floor="3"] .cover-book.sel img { outline: 2px solid #e9cf9c; outline-offset: 4px; }
.floor-content[data-floor="3"] .cover-book .bk-handle {
  position: absolute; right: -11px; bottom: -11px; width: 24px; height: 24px;
  border-radius: 50%; background: #e9cf9c; border: 2px solid #5a3a18;
  cursor: nwse-resize; display: none; z-index: 7; touch-action: none;
}
.floor-content[data-floor="3"].editing .cover-book.sel .bk-handle { display: block; }
.floor-content[data-floor="3"] .cover-book .bk-del {
  /* ⚠ 0819 — 24px 붉은 원이 표지 그림자에 묻혀 아무도 못 찾았다. 키우고 띄운다 */
  position: absolute; left: -13px; top: -13px; width: 30px; height: 30px;
  border-radius: 50%; background: rgba(58,42,30,.96); border: 2px solid #e9cf9c;
  color: #f5e6c8; font-size: 14px; line-height: 1; padding: 0;
  box-shadow: 0 3px 10px rgba(0,0,0,.6);
  cursor: pointer; display: none; z-index: 11;
}
.floor-content[data-floor="3"].editing .cover-book.sel .bk-del { display: block; }
.floor-content[data-floor="3"] .cover-book .bk-del:hover { background: rgba(100,74,50,1); }
.floor-content[data-floor="3"] .bk-edit-toggle {
  position: absolute; left: 50%; bottom: 54px; transform: translateX(-50%);
  padding: 9px 18px; border-radius: 20px; font-size: 13px; cursor: pointer;
  background: rgba(40,25,20,0.82); color: #e8d4a0; border: 1px solid rgba(184,136,76,0.5);
  z-index: 12; transition: background 0.2s, color 0.2s;
}
.floor-content[data-floor="3"] .bk-edit-toggle.on { background: #b8884c; color: #2a1810; font-weight: 600; }

/* ── ＋ 책추가하기 버튼 (✎ 배치 바꾸기 바로 위) ── */
.floor-content[data-floor="3"] .bk-add-toggle {
  position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
  padding: 9px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer;
  background: rgba(184,136,76,0.92); color: #2a1810; border: 1px solid rgba(212,184,120,0.85);
  z-index: 12; transition: transform .15s, background .2s; white-space: nowrap;
}
.floor-content[data-floor="3"] .bk-add-toggle:hover { background: #c9a84c; }
.floor-content[data-floor="3"] .bk-add-toggle:active { transform: translateX(-50%) translateY(1px); }

/* ── 책 검색·들이기 모달 (화면 전역 오버레이) ── */
#bk-add-modal { position: fixed; inset: 0; z-index: 200; display: none;

#bk-add-modal.on { display: flex; }
.bam-panel { width: 100%; max-width: 680px; margin: auto;

  border: 1px solid rgba(201,168,76,0.3); border-radius: 18px; padding: 22px 20px 26px;

.bam-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px;

.bam-head .t { font-family: Georgia,"Nanum Myeongjo",serif; font-size:19px; color:#f0ebe0; margin:0; }
.bam-head .t .eyebrow { display:block; font-size:11px; letter-spacing:.28em; color:#c9a84c; text-transform:uppercase; margin-bottom:6px; }
/* 0809: 판 머리 ×를 화면 고정 원형으로 — 스크롤이 어디 있든 보인다.
   ⚠ top 110px는 0704 규약이다. 부모(terra)가 화면 맨 위 오른쪽에 「× 분더카머 떠나기」를
     얹으므로, 그 아래 세워 두 문이 세로로 나란히 서게 한다. 24px로 올리면 또 겹친다. */
.bam-x {

  color: #f0d8a8; font-size: 22px; line-height: 1; border-radius: 50%;
  cursor: pointer; z-index: 210; backdrop-filter: blur(8px); padding: 0;
}
.bam-x:hover { background: rgba(110,60,40,0.95); }
.bam-back {
  display: block; width: 100%; margin-top: 14px; padding: 12px 0;
  background: rgba(60,40,24,0.9); border: 1px solid rgba(201,168,76,0.5);
  color: #e8d4a0; font-size: 14.5px; border-radius: 12px; cursor: pointer;
  font-family: inherit; letter-spacing: 0.04em;
}
.bam-back:hover { background: rgba(90,60,34,0.95); }
.bam-search { display:flex; gap:9px; margin-bottom:8px; }
.bam-search input { flex:1; min-width:0; padding:14px 15px; font-size:16px; background:rgba(240,235,224,.06);
  border:1px solid rgba(201,168,76,.28); border-radius:12px; color:#f0ebe0; outline:none; }
.bam-search input:focus { border-color:#c9a84c; }
.bam-search button { flex:0 0 auto; padding:0 20px; font-size:15px; font-weight:600; background:#c9a84c; color:#2a1810; border:none; border-radius:12px; cursor:pointer; }
.bam-search button:disabled { opacity:.5; }
.bam-hint { font-size:12px; color:#a89a85; margin:0 2px 16px; }
.bam-hint b { color:#c9a84c; }
.bam-status { text-align:center; padding:24px 10px; color:#a89a85; font-size:14px; }
.bam-status.err { color:#e8b4a0; line-height:1.7; }
.bam-status.err b { color:#c9a84c; }
/* ⭐ 0819 · 보관함 — 서가에 걸지 않은 책이 사는 곳 */
#bk-keep-modal { position: fixed; inset: 0; z-index: 201; display: none;

#bk-keep-modal.on { display: flex; }
.floor-content[data-floor="3"] .bk-edit-tip {
  position:absolute; left:50%; bottom:96px; transform:translateX(-50%);
  padding:7px 15px; border-radius:16px; font-size:12px; letter-spacing:.01em;
  background:rgba(40,25,20,.9); color:#e8d4a0; border:1px solid rgba(184,136,76,.45);
  z-index:12; white-space:nowrap; pointer-events:none; }
.floor-content[data-floor="3"] .bk-edit-tip b { color:#c9a84c; }
.bam-mrow .keep { flex:0 0 auto; display:flex; gap:6px; }
.bam-mrow .keep button { font-size:11px; padding:5px 9px; border-radius:8px; cursor:pointer;
  background:rgba(201,168,76,.18); color:#e8d4a0; border:1px solid rgba(201,168,76,.4); }
.bam-mrow .keep button:hover { background:rgba(201,168,76,.32); }
.bam-mrow .keep button.rm { background:rgba(120,36,28,.32); color:#e8b4a0; border-color:rgba(160,48,36,.55); }
.bam-mrow .keep button:disabled { opacity:.45; cursor:default; }
.bam-mrow.kept { background:rgba(140,120,90,.10); border-style:dashed; }
.bam-mrow .kmark { font-size:10.5px; color:#a89a85; }
/* ⭐ 0819 · 21호 「검색은 한 문」 — 내 책방이 위, 바깥 우물이 아래 */
.bam-mine { display:none; margin:0 0 18px; }
.bam-mine.on { display:block; animation:bamRise .3s ease; }
.bam-mine .cap { font-family:Georgia,serif; font-size:13px; color:#c9a84c; letter-spacing:.02em;
                 margin:0 2px 10px; display:flex; align-items:center; gap:8px; }
.bam-mine .cap::after { content:''; flex:1; height:1px; background:rgba(201,168,76,.28); }
.bam-mine .rows { display:flex; flex-direction:column; gap:8px; }
.bam-mrow { display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
            background:rgba(201,168,76,.07); border:1px solid rgba(201,168,76,.22);
            border-radius:12px; padding:9px 12px; color:inherit; }
.bam-mrow:hover { background:rgba(201,168,76,.14); }
.bam-mrow img { width:32px; height:46px; object-fit:cover; border-radius:3px; flex:0 0 auto;
                box-shadow:0 4px 8px rgba(0,0,0,.45); background:#2a1810; }
.bam-mrow .tx { min-width:0; flex:1; }
.bam-mrow .mt { font-size:13.5px; color:#efe6d4; margin:0 0 3px;
                overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bam-mrow .ma { font-size:11.5px; color:#a89a85;
                overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bam-mrow .go { flex:0 0 auto; font-size:11px; color:#c9a84c; opacity:.8; }
.bam-card { position:relative; }
.bam-own { position:absolute; top:0; left:50%; transform:translateX(-50%);
           background:#c9a84c; color:#2a1810; font-size:10px; font-weight:700;
           padding:2px 7px; border-radius:0 0 7px 7px; letter-spacing:.02em; z-index:2; }
.bam-card.owned .bam-cover { opacity:.5; }
.bam-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px 12px; align-items:end; }
@media(max-width:520px){ .bam-grid{ grid-template-columns:repeat(2,1fr); } }
.bam-card { cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none; padding:0; color:inherit; text-align:center; }
.bam-cover { width:100%; display:flex; justify-content:center; align-items:flex-end; min-height:54px; filter:drop-shadow(0 8px 14px rgba(0,0,0,.5)); transition:transform .15s; }
.bam-card:active .bam-cover { transform:translateY(2px); }
.bam-cover img { width:100%; height:auto; display:block; border-radius:2px; }
.bam-noimg { width:100%; aspect-ratio:2/3; display:flex; align-items:center; justify-content:center;
  background:repeating-linear-gradient(135deg,#3a2c20,#3a2c20 8px,#332619 8px,#332619 16px);
  border:1px solid rgba(201,168,76,.28); border-radius:2px; font-size:11px; color:#a89a85; padding:8px; }
.bam-ct { font-size:12px; line-height:1.35; color:#f0ebe0; max-width:100%; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.bam-ca { font-size:10.5px; color:#a89a85; }
.bam-picked { margin-top:22px; border-top:1px solid rgba(201,168,76,.28); padding-top:18px; display:none; }
.bam-picked.on { display:block; animation:bamRise .3s ease; }
@keyframes bamRise { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:none;} }
.bam-picked h3 { font-family:Georgia,serif; font-size:15px; color:#c9a84c; margin:0 0 14px; }
.bam-preview { display:flex; gap:16px; align-items:flex-start; background:rgba(240,235,224,.04); border:1px solid rgba(201,168,76,.28); border-radius:13px; padding:16px; }
.bam-preview .pc { flex:0 0 96px; filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)); }
.bam-preview .pc img { width:96px; height:auto; display:block; border-radius:2px; }
.bam-meta { flex:1; min-width:0; }
.bam-meta .mt { font-family:Georgia,serif; font-size:16px; color:#f0ebe0; margin:0 0 6px; line-height:1.35; }
.bam-meta .row { font-size:12.5px; color:#a89a85; margin:3px 0; }
.bam-meta .row span { color:#f0ebe0; }
.bam-add { display:block; width:100%; margin-top:14px; padding:14px; font-size:15px; font-weight:600; background:#5a8a5a; color:#fff; border:none; border-radius:12px; cursor:pointer; }
.bam-add:active { transform:translateY(1px); }
.bam-add:disabled { opacity:.55; }
.bam-result { margin-top:12px; font-size:12.5px; text-align:center; line-height:1.7; display:none; }
/* ⚠ 0819 — 진행 글귀가 여태 안 보였다. .bam-result 는 display:none 인데
   「표지를 옮기는 중…」을 그 이름으로만 붙여 왔다. 진행용 벌을 하나 세운다 */
.bam-result.on { display:block; color:#a89a85; }
.bam-result.ok { display:block; color:#a8d8a8; }
.bam-result.ng { display:block; color:#e8b4a0; }
.bam-result b { color:#c9a84c; }
.bam-result .sm { font-size:11px; opacity:.7; color:#a89a85; }

/* 진열대 UI — fixed → absolute (층 박스 기준) */
.floor-content[data-floor="3"] .bk-nav-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 56px; height: 56px;
  background: rgba(80,40,28,0.78); border: 1px solid rgba(212,184,120,0.7);
  color: var(--c-amber); font-size: 28px; line-height: 1; border-radius: 50%;
  cursor: pointer; z-index: 8; backdrop-filter: blur(8px);
  transition: background 0.2s, transform 0.2s;
}
.floor-content[data-floor="3"] .bk-nav-arrow:hover { background: rgba(110,60,40,0.95); transform: translateY(-50%) scale(1.08); }
.floor-content[data-floor="3"] .bk-nav-left  { left: max(20px, calc(50% - 580px)); }
.floor-content[data-floor="3"] .bk-nav-right { right: max(130px, calc(50% - 580px)); }
/* 좁은 화면: 엘리베이터(우측)와 안 겹치게 화살표를 더 안쪽으로 */
@media (max-width: 900px) {
  .floor-content[data-floor="3"] .bk-nav-left  { left: 8px; width: 44px; height: 44px; font-size: 22px; }
  .floor-content[data-floor="3"] .bk-nav-right { right: 92px; width: 44px; height: 44px; font-size: 22px; }
}
.floor-content[data-floor="3"] .bk-dots {
  position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);

}

}
.floor-content[data-floor="3"] .bk-dot.active { background: var(--c-amber); width: 24px; border-radius: 4px; }
.floor-content[data-floor="3"] .bk-hint {

}

/* === FlipBook 모달 — 레이어 2(z 50대)로 진입, 셸 엘리베이터(z200) 아래 === */
.book-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0); z-index: 60;
  pointer-events: none; opacity: 0; visibility: hidden;
  transition: opacity 0.5s ease, background 0.5s ease, visibility 0s linear 0.5s;
  display: flex; min-height: 100dvh; perspective: 1500px; overflow: hidden;
}
.book-modal.open {
  pointer-events: auto; opacity: 1; visibility: visible;
  transition: opacity 0.5s ease, background 0.5s ease, visibility 0s linear 0s;
  background: radial-gradient(circle farthest-corner at 50% 50%, hsl(187 20% 88%) 30%, hsl(149 20% 94%) 100%);
}
.book-modal .book {
  position: relative; display: flex; margin: auto;
  width: 38.4cqmin; pointer-events: none; transform-style: preserve-3d;   /* 0809: 32 → +20% */
  transition: translate 1s; translate: calc(min(var(--c), 1) * 50%) 0%;
  rotate: 1 0 0 18deg;
}
.book-modal .page {
  --thickness: 4; flex: none; display: flex; width: 100%;
  font-size: 2.16cqmin; pointer-events: all; user-select: none;          /* 0809: 1.8 → +20% (종이와 같은 비율) */
  transform-style: preserve-3d; transform-origin: left center;
  transition: transform 1s, rotate 1s ease-in calc((min(var(--i), var(--c)) - max(var(--i), var(--c))) * 50ms);
  translate: calc(var(--i) * -100%) 0px 0px;
  transform: translateZ(calc((var(--c) - var(--i) - 0.5) * calc(var(--thickness) * .23cqmin)));
  rotate: 0 1 0 calc(clamp(0, var(--c) - var(--i), 1) * -180deg);
  cursor: pointer; box-shadow: 0 .5em 1em -.2em #00000020;
}
.book-modal .front, .book-modal .back {
  position: relative; flex: none; width: 100%; aspect-ratio: 1 / 1.47; backface-visibility: hidden;
  overflow: hidden; background-color: #fff; translate: 0px;
  display: flex; flex-flow: column nowrap; justify-content: flex-start;
  padding: 2.6em 2.4em 3.4em; border: 1px solid #0002;
}
.book-modal .front:has(.cover-bg), .book-modal .back:has(.cover-bg) { padding: 0; }
.book-modal .back { translate: -100% 0; rotate: 0 1 0 180deg; }
.book-modal .book { counter-reset: page -1; }
.book-modal .front::after, .book-modal .back::after {
  position: absolute; bottom: 1em; counter-increment: page; content: counter(page) ".";
  font-size: 0.75em; color: #b8a880; font-style: italic;
}
.book-modal .front::after { right: 1.5em; }
.book-modal .back::after  { left: 1.5em; }
.book-modal .cover::after { content: ""; }
.book-modal .front { background: linear-gradient(to left, #faf7f0 80%, #f0ebe0 100%); border-radius: .1em .5em .5em .1em; }
.book-modal .back  { background-image: linear-gradient(to right, #faf7f0 80%, #f0ebe0 100%); border-radius: .5em .1em .1em .5em; }
.book-modal .cover { color: hsl(200 30% 98%); padding: 0; }
.book-modal .cover-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.book-modal .page-content { width: 100%; height: 100%; display: flex; flex-direction: column; color: #1a1410; font-family: 'Cormorant Garamond', 'Noto Serif KR', Georgia, serif; }
.book-modal .page-content h2 { font-size: 1.25em; font-weight: 600; color: #2a1810; margin-bottom: 0.9em; line-height: 1.4; }
.book-modal .page-content p { font-size: 0.95em; line-height: 1.8; margin-bottom: 0.6em; text-align: justify; text-justify: inter-character; word-break: break-all; line-break: strict; overflow-wrap: anywhere; }
.book-modal .page-content .author-line { margin-top: auto; padding-top: 1em; font-style: italic; color: #8a7654; text-align: right; font-size: 0.85em; }
.book-modal .page-content .chapter-mark { font-style: italic; color: #b8a880; font-size: 0.8em; margin-bottom: 0.5em; letter-spacing: 0.1em; }
.book-modal .page-end { width: 100%; height: 100%; box-sizing: border-box; padding: 0 3.6em; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #2a1810; }
.book-modal .page-end h2 { font-style: italic; margin-bottom: 1em; font-size: 1.3em; }
.book-modal .page-end .author { font-style: italic; color: #8a7654; margin-top: 1em; }
.book-modal .page-end .book-title { color: #b8a880; font-size: 0.8em; margin-top: 1.5em; line-height: 1.75; }
.book-modal .modal-close {
  /* top:24px → 110px: 부모(maison/voyage)가 우상단에 얹는 '× 분더카머 떠나기'(도어 오버레이)와
     같은 자리에 겹쳐 클릭이 어려웠음(0704). 그 아래로 내려 두 버튼이 세로로 나란히 서게 함. */
  position: fixed; top: 110px; right: 24px; width: 42px; height: 42px;
  background: rgba(80,40,28,0.92); border: 1px solid rgba(212,184,120,0.7);
  color: var(--floor-accent, #f0d8a8); font-size: 22px; border-radius: 50%;
  cursor: pointer; z-index: 70; backdrop-filter: blur(8px);
}
.book-modal .modal-close:hover { background: rgba(110,60,40,0.95); }
.book-modal .modal-hint {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  color: rgba(40,30,20,0.5); font-size: 12px; letter-spacing: 0.15em; z-index: 70; font-style: italic;
}

/* ── 3F 책의 방 · 글쓰기 ✎ 버튼 + 입력 레이어 ── */
/* 0809: 아래 알약 폐기 → 오른쪽 ⋮ 도크 (2층·거실과 같은 타륜 문법).
   × 단추(top 110px) 바로 아래에 세로로 선다 */
.bm-dock{
  position: fixed; top: 166px; right: 28px; z-index: 75;
  display: flex; flex-direction: column; align-items: center; gap: 7px;
}
.bm-dock[hidden], .bm-dock-menu[hidden]{ display: none !important; }
.bm-dock-h, .bm-dock-b{
  width: 34px; height: 34px; border-radius: 50%; padding: 0; cursor: pointer;
  font-size: 15px; line-height: 1; backdrop-filter: blur(8px);
  transition: background .2s, transform .15s, color .2s;
}
.bm-dock-h{
  background: rgba(80,40,28,0.92); border: 1px solid rgba(212,184,120,0.7);
  color: #f0d8a8;
}
.bm-dock-h:hover{ background: rgba(110,60,40,0.95); }
.bm-dock-h:active{ transform: scale(.94); }
.bm-dock-h.on{ background: rgba(212,184,120,0.92); color: #2a1810; }
.bm-dock-menu{ display: flex; flex-direction: column; gap: 6px; }
.bm-dock-b{
  background: rgba(60,32,22,0.86); border: 1px solid rgba(212,184,120,0.45);
  color: rgba(240,216,168,0.85); font-size: 14px;
}
.bm-dock-b:hover{ background: rgba(110,60,40,0.95); color: #f0d8a8; }

.essay-editor .ee-cancel:hover { background: #efe8d8; }
.essay-editor .ee-save { background: #6e4a32; color: #f4e8d4; }
.essay-editor .ee-save:hover { background: #855a3e; }
.essay-editor .ee-save:disabled { opacity: 0.5; cursor: default; }

/* ════════════════════════════════════════════════════════════
 *  ⅡF 책의 방 0809 재건축 — 세로 무대 · 자석 자리 · 조종간
 *  ⚠ 위쪽 옛 규칙을 덮는다. 순서를 바꾸면 옛 가로 무대가 되살아난다
 * ════════════════════════════════════════════════════════════ */
/* 무대 — 뮤세움 문법 세 겹. 가로 폭에 맞추고 위아래로 스크롤한다.
   ⚠ aspect-ratio로 상자를 만들면 화면 높이에 갇혀 폭이 좁아지고 스크롤이 0이 된다.
     그러면 카메라가 붙을 자리도 없다(0809 내가 낸 사고). */
.floor-content[data-floor="3"] .bk-scroll{
  position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
  overflow-anchor:none;                          /* 그림이 늦게 커도 스크롤이 안 밀린다 */
  scrollbar-width:none; -ms-overflow-style:none;
  background:linear-gradient(168deg,#2a1d18 0%,#20160f 55%,#120c08 100%);
}
.floor-content[data-floor="3"] .bk-scroll::-webkit-scrollbar{ display:none; width:0; height:0; }
.floor-content[data-floor="3"] .bk-fit{
  position:relative; margin:0 auto;
  width:min(100%, var(--bk-maxw, 1440px));
}
.floor-content[data-floor="3"] #bk-img{
  display:block; width:100%; height:auto;
  opacity:0; transition:opacity .7s ease;
}
.floor-content[data-floor="3"] #bk-img.on{ opacity:1; }
.floor-content[data-floor="3"] .cover-stack{
  position:absolute; inset:0; z-index:5; pointer-events:none;
}
/* ⭐ 자석 — top이 밑줄, left가 가운뎃줄. 키워도 이 둘이 안 움직인다 */
.floor-content[data-floor="3"] .cover-book{
  position:absolute; cursor:pointer; transform:translate(-50%,-100%);
  transition:transform .3s ease, filter .3s ease;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.62));
}
.floor-content[data-floor="3"] .cover-book img{ height:100%; width:auto; display:block; }
.floor-content[data-floor="3"] .cover-book:hover{
  transform:translate(-50%,-100%) translateY(-7px) scale(1.04);
  filter:drop-shadow(0 8px 15px rgba(0,0,0,.8)); z-index:10;
}
.floor-content[data-floor="3"].editing .cover-book:hover{
  transform:translate(-50%,-100%); filter:drop-shadow(0 3px 7px rgba(0,0,0,.62));
}
/* 조종간 — 엘리베이터 아래 ⋮ 하나, 눌러서 갈린다 (거실 도크 문법) */
/* ⭐ 0819 — 엘리베이터와 정면충돌하던 도크(소로 캡처).
   ⚠ 엘리베이터 곳은 소로가 거실 편집기로 끌어 정하는 값이라(EG_POS.liftT)
     여기에 상수를 박으면 옮기시는 날 또 겹친다. 그래서 곳은 placeBookDock() 이
     엘리베이터를 실측해 정하고, CSS 는 생김새만 맡는다.
   ⭐ 판을 엘리베이터와 같은 황동으로 굽고 바로 위에 얹는다 — 한 기둥으로 읽힌다.
   ⭐ column-reverse — 손잡이는 아래 붙박이고 메뉴가 위로 펼쳐진다.
     단추가 늘어도 엘리베이터 쪽으로 안 내려온다(오늘 🗄 를 더해 겪은 그것) */
.floor-content[data-floor="3"] .bk-dock{
  position:absolute; right:3.2%; top:auto; bottom:42%;   /* 폴백 — JS 가 실측해 덮는다 */
  z-index:31; display:flex; flex-direction:column-reverse; align-items:center; gap:7px;
  padding:9px 0; border-radius:14px;
  background:linear-gradient(105deg,#6d5a38 0%,#a98d55 12%,#e7cf96 26%,#b9985c 42%,
              #8a7244 58%,#c9ad6f 74%,#9a7f4c 88%,#6d5a38 100%);
  border:1px solid #5d4b2c;
  box-shadow:0 10px 32px rgba(30,22,10,.5),
             inset 0 1px 0 rgba(255,244,210,.55),
             inset 0 -1px 2px rgba(60,45,20,.5);
}
.floor-content[data-floor="3"] .bk-dock[hidden],
.floor-content[data-floor="3"] .bk-dock-b[hidden],
.floor-content[data-floor="3"] .bk-dock-h[hidden]{ display:none !important; }
.floor-content[data-floor="3"] .bk-dock-h,
.floor-content[data-floor="3"] .bk-dock-b{
  width:34px; height:34px; border-radius:50%; cursor:pointer; padding:0;
  font-size:15px; line-height:1; transition:background .2s, transform .15s, color .2s;
}
.floor-content[data-floor="3"] .bk-dock-h{
  /* ⭐ 층 단추(.lift)와 같은 꼴 — 황동 판에 박힌 어두운 원 */
  background:radial-gradient(circle at 35% 30%,#3f3524,#241d12);
  border:1px solid #43371f; color:#c9b586;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.6), 0 1px 0 rgba(255,244,210,.35);
}
.floor-content[data-floor="3"] .bk-dock-h:hover{
  background:linear-gradient(180deg,rgba(90,62,34,.95),rgba(50,34,18,1));
}
.floor-content[data-floor="3"] .bk-dock-h:active{ transform:scale(.94); }
.floor-content[data-floor="3"] .bk-dock-h.on{
  background:linear-gradient(180deg,rgba(201,168,76,.9),rgba(160,128,52,.95)); color:#241a12;
}
.floor-content[data-floor="3"] .bk-dock-menu{ display:flex; flex-direction:column-reverse; gap:6px; }
.floor-content[data-floor="3"] .bk-dock-menu[hidden]{ display:none !important; }
.floor-content[data-floor="3"] .bk-dock-b{
  background:radial-gradient(circle at 35% 30%,#3f3524,#241d12);
  border:1px solid #43371f; color:#c9b586; font-size:14px;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.6), 0 1px 0 rgba(255,244,210,.35);
}
.floor-content[data-floor="3"] .bk-dock-b:hover{
  background:rgba(60,40,20,.94); color:var(--floor-accent);
}
/* ⚖ 줄자 — 그림과 같은 좌표계(fit) 위에 얹힌다 */
.floor-content[data-floor="3"] .bk-rule{ position:absolute; inset:0; z-index:20; }
.floor-content[data-floor="3"] .bk-rule[hidden]{ display:none !important; }
.floor-content[data-floor="3"] .bk-rline{ position:absolute; }
.floor-content[data-floor="3"] .bk-rline.h{
  left:0; right:0; height:0; border-top:1px dashed rgba(150,220,170,.95);
  cursor:ns-resize; padding:6px 0; margin-top:-6px;
}
.floor-content[data-floor="3"] .bk-rline.v{
  top:0; bottom:0; width:0; border-left:1px dashed rgba(150,200,255,.95);
  cursor:ew-resize; padding:0 6px; margin-left:-6px;
}
.floor-content[data-floor="3"] .bk-rline.on{ border-color:#ffd76a; }
.floor-content[data-floor="3"] .bk-rline b{
  position:absolute; left:6px; top:-16px; font-weight:400;
  font-size:11px; letter-spacing:.04em; color:#eae0c6;
  background:rgba(20,14,8,.86); padding:1px 6px; border-radius:5px; white-space:nowrap;
}
.floor-content[data-floor="3"] .bk-rline.v b{ left:6px; top:8px; }
/* ⚠ 0809: 이 막대를 그림 안(absolute)에 두었더니 1672px 그림의 맨 아래로 내려가
   화면 밖에 섰다. 카메라는 맨 윗단에 앉으므로 끝내 눈에 안 띈다.
   줄만 끌고 나가면 그대로 사라졌다 — 화면에 못 박는다. */
.floor-content[data-floor="3"] .bk-rsave{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  display:flex; align-items:center; gap:12px; z-index:212;
  background:rgba(20,14,8,.92); border:1px solid rgba(201,168,76,.45);
  border-radius:14px; padding:10px 14px; backdrop-filter:blur(8px);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.floor-content[data-floor="3"] .bk-rsave button{
  padding:10px 20px; border-radius:10px; cursor:pointer; font:inherit; font-size:14px;
  background:rgba(201,168,76,.95); border:none; color:#241a12; font-weight:600;
}
.floor-content[data-floor="3"] .bk-rsave button:hover{ background:#d8bb63; }
.floor-content[data-floor="3"] .bk-rsave button:disabled{ opacity:.5; cursor:default; }
.floor-content[data-floor="3"] .bk-rsave span{ font-size:12.5px; color:#e6d9b8; white-space:nowrap; }
.floor-content[data-floor="3"] .bk-dock-b.on{
  background:linear-gradient(180deg,rgba(201,168,76,.9),rgba(160,128,52,.95)); color:#241a12;
}

/* ===== 닻 — 층 안내판 (빠른 길) ===== */
.anchor { position: fixed; bottom: 26px; right: 22px; }
.wk-exit-star {
  position: fixed; top: 14px; left: 14px; z-index: 950;
  padding: 8px 15px; border-radius: 20px;
  background: linear-gradient(145deg, #3a2c10, #241809);
  border: 1px solid rgba(201,168,76,0.5);
  color: #e9c97e; font-family: 'Cormorant Garamond', serif;
  font-size: 13px; letter-spacing: 1px; cursor: pointer;

}
.wk-exit-star:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,0.6); }
.anchor-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  width: 58px; padding: 9px 6px;
  background: linear-gradient(160deg, #c9a84c, #8a6a2a 55%, #5a3f14);
  border: 1px solid #d8c078; border-radius: 4px; cursor: pointer;
  box-shadow: 0 5px 18px rgba(0,0,0,0.55), inset 0 1px 2px rgba(255,240,200,0.4);

.anchor-btn .ab-icon { font-size: 16px; line-height: 1; color: #2a1c08; }
.anchor-btn .ab-text { font-size: 7px; letter-spacing: 1.5px; color: #2a1c08; font-family: 'Cormorant Garamond', serif; }

.anchor-panel {
  position: absolute; bottom: 70px; right: 0; width: 220px;
  background: linear-gradient(180deg, #1a120a, #0e0906);
  border: 1px solid #c9a84c; border-radius: 6px;
  box-shadow: 0 14px 44px rgba(0,0,0,0.7); padding: 8px;
  opacity: 0; transform: translateY(10px) scale(0.96); transform-origin: bottom right;
  pointer-events: none; transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.2,0.8,0.3,1);
}
.anchor.open .anchor-panel { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
.anchor-panel-title {
  font-family: 'Cormorant Garamond', serif; font-size: 10px; letter-spacing: 3px; color: #8a7654;
  text-align: center; padding: 6px 0 10px; border-bottom: 1px solid rgba(201,168,76,0.2); margin-bottom: 6px;
}
/* ⭐ 0816 소로 — 「엘리베이터 같지 않고 안 예쁘다」. 조작반으로 다시 지었다.
     층 번호는 **누르는 놋쇠 원판**, 서 있는 층에는 안에서 불이 켜져 있다.
     손을 얹으면 그 층이 무엇인지 한 줄이 뜬다. 문 둘 — 엘리베이터(⇡)와 직행(⇢). */
.floor-item { display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:8px;
  transition:background .18s; position:relative; }
.floor-item:hover { background: rgba(201,168,76,0.10); }
.floor-item.current { background: rgba(201,168,76,0.14); }
.floor-item .fi-num { flex:0 0 auto; width:30px; height:30px; border-radius:50%;
  display:grid; place-items:center; font-family:'Cormorant Garamond', serif; font-size:14px;
  color:#8a7654; background:radial-gradient(circle at 34% 30%, #2a2118, #171008);
  border:1px solid rgba(201,168,76,.34); box-shadow:inset 0 1px 2px rgba(0,0,0,.6);
  transition:color .2s, box-shadow .25s, border-color .2s; }
.floor-item.current .fi-num { color:#1a120a; border-color:#e2c063;
  background:radial-gradient(circle at 34% 30%, #f2dc9a, #c9a84c 60%, #8a6a2a);
  box-shadow:0 0 12px rgba(201,168,76,.55), inset 0 1px 2px rgba(255,240,200,.5); }
.floor-item:hover .fi-num { color:#e2c063; border-color:rgba(201,168,76,.7); }
.floor-item.current:hover .fi-num { color:#1a120a; }
.floor-item .fi-body { flex:1 1 auto; min-width:0; }
.floor-item .fi-name { font-size:12.5px; color:#e8d9b0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.floor-item .fi-kr { font-size:10px; color:#8a7654; letter-spacing:1px; margin-top:1px; }
.floor-item.current .fi-name { color:#f0e0a0; }
/* 손을 얹으면 뜨는 한 줄 — 자리를 밀지 않게 높이만 여닫는다 */
.floor-item .fi-desc { font-size:10px; line-height:1.5; color:#a08b52; letter-spacing:.02em;
  max-height:0; overflow:hidden; opacity:0;
  transition:max-height .24s ease, opacity .2s ease, margin .24s ease; }
.floor-item:hover .fi-desc { max-height:34px; opacity:1; margin-top:3px; }
/* 문 둘 — 엘리베이터로 가기 · 곧장 건너뛰기 */
.floor-item .fi-go { flex:0 0 auto; display:flex; gap:4px; opacity:.35; transition:opacity .2s; }
.floor-item:hover .fi-go { opacity:1; }
.floor-item.current .fi-go { display:none; }              /* 서 있는 층에는 문이 없다 */
.floor-item .fi-go button { width:24px; height:24px; border-radius:6px; line-height:1;
  border:1px solid rgba(201,168,76,.32); background:rgba(42,33,24,.85); color:#c9a84c;
  font-size:12px; cursor:pointer; font-family:inherit; transition:all .16s; }
.floor-item .fi-go button:hover { background:#c9a84c; color:#1a120a; border-color:#e2c063; }
/* 곧장 건너뛸 때 덮는 막 */
#wkJump { position:fixed; inset:0; z-index:120; background:#0a0705; opacity:0;
  pointer-events:none; transition:opacity .3s ease; }
#wkJump.on { opacity:1; }

/* ===== 음소거 토글 ===== */
/* 0809: .mute-toggle 철거 — 음표 단추를 걷었다 */

/* ============================================================
 *  전환 — 엘리베이터 (z 200)
 *  구조: [상단 안내 bar] + [그 아래 좌우 문]
 * ============================================================ */
.elevator { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
.elevator.active { pointer-events: auto; }

/* --- 상단 안내 bar (문에서 분리·탑승 중 늘 떠 있음) --- */
.elevator-bar {
  position: absolute; top: 0; left: 50%; transform: translate(-50%, -100%);
  display: flex; align-items: center; gap: 12px;
  padding: 14px 26px 16px;
  background: linear-gradient(180deg, #2a1d0c 0%, #1a1206 70%, #120c04 100%);
  border: 1px solid rgba(201,168,76,0.45);
  border-top: none;
  border-radius: 0 0 14px 14px;
  /* ⚠⚠ 0818 소로 — 「화면 맨 위 중앙에 뿌옇게 검은 것이 늘 따라다닌다」.
       판때기는 translateY(-100%)로 화면 밖에 있는데 **그림자는 아래로 10px 내려와 30px 번진다.**
       .elevator가 fixed inset:0 이라 층을 바꿔도 스크롤해도 그 얼룩만 남아 따라다녔다.
     ⭐ 감추는 것과 닫는 것은 다르다(0817 딱지). 옮겨 두는 것만으로는 안 사라지는 것이 있다.
       숨은 동안에는 그림자를 끄고, 내려와 설 때만 켠다. */
  box-shadow: none;
  z-index: 3; /* 문보다 위 */
  transition: transform 0.5s cubic-bezier(0.3,0.8,0.3,1), box-shadow 0.3s ease;
}
.elevator.riding .elevator-bar {
  transform: translate(-50%, 0);   /* 탑승 중 내려와 자리잡음 */
  box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 -2px 10px rgba(0,0,0,0.5);
}

.dial-lamp {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif; font-size: 17px;
  color: rgba(201,168,76,0.30);
  border: 1px solid rgba(201,168,76,0.22);
  background: radial-gradient(circle at 40% 35%, rgba(40,30,16,0.8), rgba(15,10,4,0.9));
  transition: all 0.18s ease;
}
.dial-lamp.lit {
  color: #1a1208;
  background: radial-gradient(circle at 40% 35%, #ffe7a0, #d8a838);
  border-color: #ffe7a0;
  box-shadow: 0 0 20px rgba(255,210,120,0.85);
  transform: scale(1.06);
}

/* --- 좌우 문 (bar 아래에서만 여닫이) --- */
.doors {
  position: absolute; left: 0; right: 0; bottom: 0;
  top: 0; /* 0628: 문을 화면 맨 위까지 — 등불 bar(z3)를 그 위에 포갬 */
  z-index: 1;
}
.door {
  position: absolute; top: 0; bottom: 0; width: 50.5%;
  background-image: url('elevator_01.webp');
  background-size: 200% 100%;   /* 두 짝 합쳐 한 장 — 세로 결이라 가로 늘어남 안 보임 */
  background-repeat: no-repeat;
  background-color: #241808;     /* 이미지 로딩 전 fallback */
  box-shadow: inset 0 0 120px rgba(0,0,0,0.45);
  transition: transform var(--t-open-dur) cubic-bezier(0.55, 0, 0.30, 1);
}
.door::before {
  content: ''; position: absolute; inset: 0;
  box-shadow: inset 0 0 70px rgba(0,0,0,0.35);
  pointer-events: none;
}
.door-left  { left: 0;  transform: translateX(-101%); background-position: left center; }
.door-right { right: 0; transform: translateX(101%); background-position: right center; }
.elevator.closing .door-left,
.elevator.closing .door-right { transform: translateX(0); }

.door-seam {
  position: absolute; top: 0; bottom: 0; left: 50%; width: 2px;
  transform: translateX(-50%); z-index: 2;
  background: linear-gradient(180deg, transparent, rgba(240,210,120,0.5), transparent);
  opacity: 0; transition: opacity 0.3s;
}
.elevator.closing .door-seam { opacity: 1; }

/* ===== 첫 진입 힌트 / 버전 ===== */
.boot-hint {
  position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
  font-family: 'Cormorant Garamond', serif; font-size: 11px; letter-spacing: 2px;
  color: rgba(240,216,168,0.45); z-index: 100; text-align: center; pointer-events: none;

.version-badge {

  font-family: 'Cormorant Garamond', serif; font-size: 10px; letter-spacing: 2px; color: rgba(240,216,168,0.4);
}

/* ⚠⚠ 0810 — 미술관과 같은 부품. 큰 그림을 화면에 바로 붙이면 느린 회선에서
     위에서부터 한 줄씩 그려진다(0810 소로 실측 「도트프린터」). 그래서 따로 받아

.floor-content[data-floor="1"] .g1-zoom-x{

/* ── ⅢF Sanctuaire · 지성소 (셸 3층 · 모듈 이름은 옛 번호 Floor4) ──────────
 *  0812 전면 재건축 — 옛 12방 카테고리 서가를 걷고 「걸어온 길」 하나로.
 *
 *  ⚠⚠ 무대는 뮤세움 세 겹이다 —  f4-scroll(스크롤) > f4-fit(폭) > #f4-img + .f4-stack
 *     aspect-ratio 상자로 만들면 화면 높이에 갇혀 폭이 좁고 스크롤이 0이 된다(0809).
 *  ⚠⚠ 배경은 img 한 장이다. CSS 레이어로 깔면 「못 뜬 것」과 「안 부른 것」이 같아진다.
 *  ⚠  단 높이가 넷 다 다르다(원근). 균등분할 금지 — 밑줄 넷을 실측값으로 담는다.
 *  ⭐ 책등은 밑줄에 앉는다: 단 상자를 밑줄까지 두고 align-items:flex-end.
 *     2층 표지의 translateY(-100%) 자석과 같은 뜻이다.
 * ───────────────────────────────────────────────────────────── */
.floor-content[data-floor="4"]{ overflow:hidden; background:#171009; }
.floor-content[data-floor="4"] .f4-scroll{
  position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
  overflow-anchor:none;                       /* 그림이 늦게 커도 스크롤이 안 밀린다 */
  scrollbar-width:none; -ms-overflow-style:none;
  background:linear-gradient(168deg,#2a2016 0%,#1d150d 55%,#120c07 100%);
}
.floor-content[data-floor="4"] .f4-scroll::-webkit-scrollbar{ display:none; width:0; height:0; }
.floor-content[data-floor="4"] .f4-fit{
  position:relative; margin:0 auto; width:min(100%, var(--f4-maxw, 1440px));
}
.floor-content[data-floor="4"] #f4-img{
  display:block; width:100%; height:auto; opacity:0; transition:opacity .7s ease;
}
.floor-content[data-floor="4"] #f4-img.on{ opacity:1; }
.floor-content[data-floor="4"] .f4-stack{ position:absolute; inset:0; z-index:5; }

/* 면 — 넘길 때 좌우로 미끄러진다 */
.floor-content[data-floor="4"] .f4-page{
  position:absolute; inset:0; opacity:0; pointer-events:none;
  transition:opacity .34s ease, transform .34s ease; transform:translateX(0);
}
.floor-content[data-floor="4"] .f4-page.active{ opacity:1; pointer-events:auto; }
.floor-content[data-floor="4"] .f4-page.exit-l{ opacity:0; transform:translateX(-4%); }
.floor-content[data-floor="4"] .f4-page.enter-r{ opacity:0; transform:translateX(4%); }

/* 단 — 밑줄까지가 상자다. 책등은 바닥에 선다 */
.floor-content[data-floor="4"] .f4-rack{
  position:absolute; display:flex; align-items:flex-end; justify-content:center;
  gap:2px; overflow:hidden;
}
.floor-content[data-floor="4"] .f4-bk{

}
.floor-content[data-floor="4"] .f4-bk:hover{ transform:translateY(-7px); z-index:9; }
.floor-content[data-floor="4"] .f4-bk img{

}
/* 책등 제목 — 뮤세움 .bkt 계보. 작은 화면에서 개미가 되지 않게 clamp */
.floor-content[data-floor="4"] .f4-bkt{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  writing-mode:vertical-rl; text-orientation:mixed;

  letter-spacing:.02em; line-height:1.18; padding:7% 2px; overflow:hidden;
  text-shadow:0 1px 3px rgba(0,0,0,.98), 0 0 6px rgba(0,0,0,.85), 0 0 14px rgba(0,0,0,.6);
  pointer-events:none;
}

/* 빈 서가 — 첫날 손님에게 보이는 유일한 말 */
.floor-content[data-floor="4"] .f4-empty{
  position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
  text-align:center; color:rgba(232,212,160,.62); font-size:14.5px; line-height:1.9;
  z-index:8; pointer-events:none; display:none;
}
.floor-content[data-floor="4"] .f4-empty.on{ display:block; }

/* 넘김 — 뮤세움 하단 문법 (기간이 페이지 번호를 대신한다) */
.floor-content[data-floor="4"] .f4-pager{

  display:flex; align-items:center; gap:14px; z-index:20;

  backdrop-filter:blur(3px);
}
.floor-content[data-floor="4"] .f4-pager button{

}
.floor-content[data-floor="4"] .f4-pager button:disabled{ opacity:.28; cursor:default; }
.floor-content[data-floor="4"] .f4-pager .f4-span{

  text-align:center; line-height:1.5;
}
.floor-content[data-floor="4"] .f4-pager .f4-span b{ display:block; font-weight:400; opacity:.62; font-size:11.5px; }

/* ⚠ 0818 — 옛 세 줄 카드(f4-modal · f4-card)의 옷을 걷었다.
   책등은 되찾아 온 f4book 표지로 곧장 간다. 안 쓰는 옷을 남기면 다음 사람이
   「이 화면이 어딘가에 살아 있나」를 다시 뒤진다. */

/* ⚖ 줄 맞추기 (살롱지기) — 2층 문법 그대로. 움직이는 것은 책이 아니라 줄이다 */
.floor-content[data-floor="4"] .f4-rule{ position:absolute; inset:0; z-index:40; }

}
.floor-content[data-floor="4"] .f4-rule .rl.h{ left:0; right:0; height:3px; margin-top:-1px; cursor:ns-resize; }
.floor-content[data-floor="4"] .f4-rule .rl.v{ top:0; bottom:0; width:3px; margin-left:-1px; cursor:ew-resize; }
.floor-content[data-floor="4"] .f4-rule .rl b{

.floor-content[data-floor="4"] .f4-rule .rl.h b{ left:6px; top:-8px; }
.floor-content[data-floor="4"] .f4-rule .rl.v b{ top:6px; left:6px; }
.floor-content[data-floor="4"] .f4-rsave{

.floor-content[data-floor="4"] .f4-rsave button:disabled{ opacity:.5; cursor:default; }
.floor-content[data-floor="4"] .f4-rsave span{ font-size:12.5px; color:#e6d9b8; white-space:nowrap; }

/* 조종간 — ⚖ 하나뿐이다(내 책을 만지는 문은 2층에 있다) */
.floor-content[data-floor="4"] .f4-dock{

}

/* 집 갈아타기 — 도크 옆 작은 목록. 이 방 = 세 층이 함께 갈아탄다 */
.floor-content[data-floor="4"] .f4-homes{

.floor-content[data-floor="4"] .f4-homes::-webkit-scrollbar{ display:none; }
.floor-content[data-floor="4"] .f4-homes button{

.floor-content[data-floor="4"] .f4-homes button.me{

/* ══ 책 모달 — 분더카머 3층(치타델레)에서 그대로 옮겨 왔다 · 0807 ═══════════
   ⭐ 이 문법의 뿌리는 구 museum.html이고, 3층이 그것을 복제하며 손본 것이 최신판이다
     (마우스 기울임·단건 조회는 3층에만 있다). 그래서 3층 쪽을 옮겼다.
   ⚠⚠ **f4 접두사를 안 바꿨다.** 뮤세움에 「4층」은 뜻이 없지만, 이름을 갈면
     두 방의 코드를 나란히 놓고 대조할 수 없게 된다. 지금 같은 물건이 세 곳에 산다
     (구 뮤세움 · 분더카머 3층 · 여기). 한 곳을 고치면 셋을 다 고쳐야 하고,
     이름이 같아야 그 일이 가능하다.
   ⏱ 정석은 eg_book.js 한 부품으로 빼는 것이다 — 대청소 딱지에 등재. ══ */
.f4book-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(42,32,20,0.0);
    z-index: 9500;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: background 1.2s ease;
  }
.f4book-modal-overlay.open { display: flex; }
.f4book-modal-overlay.bg-light { background: rgba(200,190,170,0.85); }
/* ── 3D 표지 씬 ── */
  .f4cover-scene {
    perspective: 900px;
    perspective-origin: 50% 45%;
    position: relative;
  }
.f4cover-book-3d {
    width: 200px; height: 280px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateY(-26deg) rotateX(4deg);
    transition: transform 0.5s cubic-bezier(0.23,1,0.32,1);
    will-change: transform;
    cursor: pointer;
  }
.f4cover-face-front {
    position: absolute;
    width: 200px; height: 280px;
    border-radius: 0 5px 5px 0;
    overflow: hidden;
    backface-visibility: hidden;
    box-shadow: inset -3px 0 8px rgba(0,0,0,0.1);
    pointer-events: none;
  }
.f4cover-book-3d {
    width: 200px; height: 280px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateY(-26deg) rotateX(4deg);
    transition: transform 0.5s cubic-bezier(0.23,1,0.32,1);
    will-change: transform;
    cursor: pointer;
    pointer-events: all;
  }
.f4cover-gloss {
    position: absolute; top:0; left:0;
    width:52%; height:100%;
    background: linear-gradient(to right,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.05) 55%,transparent 100%);
    pointer-events:none; z-index:20;
  }
.f4cover-holo {
    position:absolute; inset:0;
    background: linear-gradient(118deg,transparent 0%,rgba(255,80,140,0.07) 18%,rgba(80,200,255,0.09) 34%,rgba(100,255,140,0.07) 50%,rgba(255,210,50,0.08) 66%,rgba(180,80,255,0.07) 82%,transparent 100%);
    mix-blend-mode:screen; pointer-events:none; z-index:19; opacity:0.55;
  }
.f4cover-face-spine {
    position:absolute;
    width:72px; height:280px;
    left:-72px; top:0;
    transform-origin:right center;
    transform:rotateY(-90deg);
    border-radius:4px 0 0 4px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
.f4cover-face-spine::before {
    content:''; position:absolute; inset:0;

/* ⚠ 0818 소로 — 「흉칙하게 스크롤바가 나온다」. 쪽 안은 스크롤되어야 하지만
     막대는 종이 위에 있을 물건이 아니다. 세 브라우저 어법을 함께 적는다.

/* ── ⅣF Le Mur des Visages · 액자방 (셸 4층 · 모듈 이름은 옛 번호 Floor5) ──────
 *  0812밤 전면 재건축 — 「내가 사랑한 얼굴들」
 *
 *  ⚠⚠ 무대는 뮤세움 세 겹이다 — f5-scroll(스크롤) > f5-fit(폭) > #f5-img + .f5-wall
 *     옛 판은 .f5-stage에 aspect-ratio를 걸어 화면 높이에 갇혀 있었다(0809 함정).
 *  ⚠⚠ 배경은 img 한 장이다. CSS 레이어로 깔면 「못 뜬 것」과 「안 부른 것」이 같아진다.
 *
 *  ⭐ 1~3층과 지켜야 할 것이 다르다. 여기엔 **자석이 없다** —
 *     1층 꽃은 콘솔 상판에, 2층 표지는 선반 밑줄에, 3층 책등은 칸 위·아래에 붙지만
 *     4층 액자는 벽 위 자유 좌표(persona_wall x·y)에 앉는다.
 *     그래서 넉 벌이 함께 지킬 것은 「빈 회벽 사각형」 하나뿐이고,
 *     창밖·계절·이웃집 불빛·램프는 벌마다 달라져도 된다(0812밤 실측으로 확인).
 * ───────────────────────────────────────────────────────────── */
.floor-content[data-floor="5"]{ overflow:hidden; background:#14100b; }
.floor-content[data-floor="5"] .f5-scroll{
  position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
  overflow-anchor:none;                       /* 그림이 늦게 커도 스크롤이 안 밀린다 */
  scrollbar-width:none; -ms-overflow-style:none;
  background:linear-gradient(168deg,#2a2016 0%,#1d150d 55%,#120c07 100%);
}
.floor-content[data-floor="5"] .f5-scroll::-webkit-scrollbar{ display:none; width:0; height:0; }
.floor-content[data-floor="5"] .f5-fit{
  position:relative; margin:0 auto; width:min(100%, var(--f5-maxw, 1440px));
}
.floor-content[data-floor="5"] #f5-img{
  display:block; width:100%; height:auto; opacity:0; transition:opacity .7s ease;
}
.floor-content[data-floor="5"] #f5-img.on{ opacity:1; }
.floor-content[data-floor="5"] .f5-wall{ position:absolute; inset:0; z-index:5; }

/* 면 — 넘길 때 좌우로 미끄러진다 (3층 문법 그대로) */
.floor-content[data-floor="5"] .f5-page{
  position:absolute; inset:0; opacity:0; pointer-events:none;
  transition:opacity .34s ease, transform .34s ease; transform:translateX(0);
}
.floor-content[data-floor="5"] .f5-page.active{ opacity:1; pointer-events:auto; }
.floor-content[data-floor="5"] .f5-page.exit-l{ opacity:0; transform:translateX(-4%); }
.floor-content[data-floor="5"] .f5-page.enter-r{ opacity:0; transform:translateX(4%); }

/* 액자 — x·y는 중심이다(translate -50%). 크기는 폭만 주고 높이는 그림이 정한다 */
.floor-content[data-floor="5"] .f5-frame{
  position:absolute; transform:translate(-50%,-50%) rotate(var(--rot,0deg));
  cursor:pointer; transition:transform .22s ease, filter .22s ease;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.55));
}
.floor-content[data-floor="5"] .f5-frame:hover{
  transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1.05);
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.7)); z-index:9;
}
.floor-content[data-floor="5"] .f5-frame-img{ display:block; width:100%; height:auto; border-radius:1px; }
/* 액자 아래 작은 이름 명패 (셰익스피어 앤 컴퍼니 흰 라벨) */
.floor-content[data-floor="5"] .f5-plate{
  position:absolute; left:50%; top:100%; transform:translateX(-50%);
  margin-top:4px; max-width:160%; padding:1px 6px;
  background:#f2ebdd; color:#26211a;
  font-family:'Noto Serif KR',serif; font-weight:500;
  font-size:clamp(6.5px,.95vw,10.5px); letter-spacing:.01em; line-height:1.35;
  white-space:nowrap; border-radius:1px;
  box-shadow:0 1px 3px rgba(0,0,0,.4); pointer-events:none;
}

/* ── ✎ 배치 바꾸기 (집주인 · 내 벽에서만) ── */
.floor-content[data-floor="5"] .f5-fit.editing #f5-img{ filter:brightness(.78) saturate(.9); transition:filter .4s ease; }
.floor-content[data-floor="5"] .f5-fit.editing .f5-frame{ cursor:grab; }
.floor-content[data-floor="5"] .f5-fit.editing .f5-frame:hover{
  transform:translate(-50%,-50%) rotate(var(--rot,0deg));
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.6));
}
/* 편집 중에는 벽의 사각형을 보여 준다 — 어디까지가 벽인지 모르면 못 맞춘다 */
.floor-content[data-floor="5"] .f5-panel{
  position:absolute; z-index:4; display:none; pointer-events:none;
  outline:1px dashed rgba(201,162,74,.55); outline-offset:-1px;
  background:rgba(201,162,74,.05);
}
.floor-content[data-floor="5"] .f5-fit.editing .f5-panel{ display:block; }
.floor-content[data-floor="5"] .f5-frame.selected{ outline:2px solid #e8c987; outline-offset:3px; z-index:10; }
.floor-content[data-floor="5"] .f5-frame.grabbing{ cursor:grabbing; transition:none; z-index:11; filter:drop-shadow(0 14px 26px rgba(0,0,0,.7)); }
/* 선택한 액자의 미니 조절 툴 */
.floor-content[data-floor="5"] .f5-tool{
  position:fixed; z-index:60; display:none; align-items:center; gap:6px;
  transform:translateX(-50%); padding:5px 9px;
  background:rgba(24,17,10,.92); border:1px solid rgba(201,162,74,.4);
  border-radius:22px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  box-shadow:0 6px 20px rgba(0,0,0,.5);
}
.floor-content[data-floor="5"] .f5-tool button{
  width:26px; height:26px; border-radius:50%; line-height:1;
  border:1px solid rgba(201,162,74,.45); background:rgba(48,34,26,.85);
  color:#e9dcc2; font-size:15px; cursor:pointer; transition:all .18s; font-family:inherit;
}
.floor-content[data-floor="5"] .f5-tool button:hover{ background:#d4a548; color:#1a120c; }
.floor-content[data-floor="5"] .f5-tool .f5-tool-lbl{ font-size:10px; color:#b9a986; letter-spacing:.06em; }
.floor-content[data-floor="5"] .f5-tool .f5-tool-sep{ width:1px; height:16px; background:rgba(201,162,74,.3); margin:0 2px; }

/* 빈 벽 — 첫날 손님에게 보이는 유일한 말 */
.floor-content[data-floor="5"] .f5-empty{
  position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
  text-align:center; color:rgba(232,212,160,.62); font-size:14.5px; line-height:1.9;
  z-index:8; pointer-events:none; display:none;
}
.floor-content[data-floor="5"] .f5-empty.on{ display:block; }

/* 0816 — 원판을 기다리는 얼굴. 넘김 띠 위에 조용히 한 줄 (없으면 안 뜬다) */
.floor-content[data-floor="5"] .f5-baking{
  position:absolute; left:50%; bottom:58px; transform:translateX(-50%); z-index:19;
  font-size:11.5px; letter-spacing:.05em; color:rgba(233,207,156,.62);
  background:rgba(24,17,10,.6); border:1px solid rgba(201,162,74,.22);
  border-radius:999px; padding:4px 12px; white-space:nowrap; pointer-events:none;
}

/* 넘김 — 3층과 같은 하단 문법. 면 번호가 아니라 「몇 명」이 말한다 */
.floor-content[data-floor="5"] .f5-pager{
  position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
  display:flex; align-items:center; gap:14px; z-index:20;
  padding:7px 16px; border-radius:999px;
  background:rgba(24,17,10,.74); border:1px solid rgba(201,162,74,.3);
  backdrop-filter:blur(3px);
}
.floor-content[data-floor="5"] .f5-pager button{
  background:none; border:0; color:rgba(233,207,156,.9); font-size:19px;
  cursor:pointer; line-height:1; padding:0 4px; font-family:inherit;
}
.floor-content[data-floor="5"] .f5-pager button:disabled{ opacity:.28; cursor:default; }
.floor-content[data-floor="5"] .f5-pager .f5-span{
  font-size:12.5px; color:rgba(233,207,156,.86); letter-spacing:.04em; white-space:nowrap;
  text-align:center; line-height:1.5;
}
.floor-content[data-floor="5"] .f5-pager .f5-span b{ display:block; font-weight:400; opacity:.62; font-size:11.5px; }

/* ⭐ ⚖ 켜는 동안에만 — 손으로 놓인 액자와, 벽 밖으로 나가려다 붙들린 액자.
     살롱지기가 「이건 산식이 아니라 손님이 놓은 것」임을 알아야 벽을 함부로 안 옮긴다. */
.floor-content[data-floor="5"] .f5-fit.ruling .f5-frame.pinned{
  outline:2px solid rgba(201,162,74,.85); outline-offset:3px;
}
.floor-content[data-floor="5"] .f5-fit.ruling .f5-frame.held{
  outline:2px dashed #d97b4a; outline-offset:3px;
}
/* ⚖ 켜는 동안 보이는 열다섯 자리 — 얼굴이 없는 방에서도 어디에 걸릴지 보인다.
   콘솔 BUDGETS[4]가 그리는 것과 같은 그림이다(같은 산식에서 나온다). */
.floor-content[data-floor="5"] .f5-ghosts{ position:absolute; inset:0; z-index:38; pointer-events:none; }
.floor-content[data-floor="5"] .f5-ghosts .gh-panel{
  position:absolute; outline:1px solid rgba(201,162,74,.5); outline-offset:-1px;
  background:rgba(201,162,74,.04);
}
.floor-content[data-floor="5"] .f5-ghosts .gh{
  position:absolute; outline:1px dashed rgba(255,255,255,.42); outline-offset:-1px;
  background:rgba(120,150,190,.10);
}

let _refreshing = null;
function getSession() { try { return JSON.parse(localStorage.getItem('eungyo-auth')); } catch { return null; } }
function tokenExp(tok) { try { return JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp || 0; } catch { return 0; } }
async function getValidToken() {
  const s = getSession();
  if (!s?.access_token) return null;
  const now = Math.floor(Date.now()/1000);
  if (tokenExp(s.access_token) - now > 60) return s.access_token;
  if (!s.refresh_token) return null;
  _refreshing = _refreshing || (async () => {
    try {
      const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
        method:'POST', headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
        body: JSON.stringify({ refresh_token: s.refresh_token })
      });
      if (!r.ok) return null;
      const data = await r.json();
      if (!data.expires_at) data.expires_at = Math.floor(Date.now()/1000) + (data.expires_in || 3600);
      localStorage.setItem('eungyo-auth', JSON.stringify(data));
      return data.access_token || null;
    } catch (e) { return null; }
  })();
  const tok = await _refreshing; _refreshing = null; return tok;
}
async function sbFetch(path, options = {}) {
  const token = await getValidToken();
  const res = await fetch(SUPABASE_URL + path, {
    ...options,
    headers: { 'apikey':SUPABASE_KEY, 'Authorization':'Bearer ' + (token || SUPABASE_KEY),
      'Content-Type':'application/json', ...options.headers }
  });

     엣지 함수는 { error: … }, PostgREST는 { message, hint, details }를 쓴다.
     이름이 다르다고 못 읽으면 화면에는 늘 "(Error)"만 남고 진단이 처음부터 막힌다. */
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    const msg = e.message || e.error || e.msg || e.error_description
             || res.statusText || ('HTTP ' + res.status);
    const ex  = e.hint || e.details || e.detail || '';
    throw new Error(ex ? (msg + ' — ' + ex) : msg);
  }
  return res.status === 204 ? null : res.json();
}
