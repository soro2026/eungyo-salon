  // ── 책 열기 (단건 조회 → 표지) ────────────────
  async function f4OpenBook(b){
    f4IsAnimating = false;
    const overlay = document.getElementById('f4bookModalOverlay');
    overlay.classList.add('open');                 // 즉시 화면 반응(배경 페이드)

    // questions 단건 조회로 4레이어·부제·큐레이션링크 획득
    const book = { answer:b.answer, category:b.category, keyword:'', library:{}, curation_links:null };
    try{
      const rows = await sbFetch(`/rest/v1/questions?seed_id=eq.${encodeURIComponent(b.seed_id)}&select=answer,keyword,category,library,curation_links&limit=1`);
      if(rows && rows[0]){
        const q = rows[0];
        book.keyword = q.keyword || '';
        book.library = q.library || {};
        book.curation_links = q.curation_links || null;
        if(q.category) book.category = q.category;
      }
    }catch(e){ console.warn('[F4] library 조회 실패', e); }
    f4CurrentBook = book;

    f4BuildCover(book);
    document.getElementById('f4coverScene').style.visibility = 'visible';
    document.getElementById('f4coverScene').style.pointerEvents = 'auto';
    document.getElementById('f4bookModal').classList.remove('visible');
    document.getElementById('f4coverShadow').style.opacity = '1';
    setTimeout(()=> overlay.classList.add('bg-light'), 50);
    f4AttachTilt();
  }

  function f4AttachTilt(){
    const scene  = document.getElementById('f4coverScene');
    const book3d = document.getElementById('f4coverBook3D');
    scene.onmousemove = e => {
      if(f4IsAnimating) return;
      const r = scene.getBoundingClientRect();
      const dx = (e.clientX - (r.left + r.width/2))  / (r.width/2);
      const dy = (e.clientY - (r.top  + r.height/2)) / (r.height/2);
      book3d.style.transform = `rotateY(${-26 + dx*14}deg) rotateX(${4 - dy*8}deg)`;
      book3d.style.transition = 'transform 0.06s linear';
    };
    scene.onmouseleave = () => {
      if(f4IsAnimating) return;
      book3d.style.transform = 'rotateY(-26deg) rotateX(4deg)';
      book3d.style.transition = 'transform 0.5s cubic-bezier(0.23,1,0.32,1)';
    };
  }

  // ── 표지 클릭 → 내부 진입 (줌인) ──────────────
  function f4EnterBook(){
    if(f4IsAnimating) return;
    f4IsAnimating = true;
    const book3d = document.getElementById('f4coverBook3D');
    const shadow = document.getElementById('f4coverShadow');
    book3d.style.transition = 'transform 0.48s cubic-bezier(0.23,1,0.32,1)';
    book3d.style.transform  = 'rotateY(0deg) rotateX(0deg)';
    shadow.style.opacity    = '0';
    setTimeout(()=>{
      book3d.style.transition = 'transform 1.0s cubic-bezier(0.25,0,0.2,1), opacity 0.55s ease 0.45s';
      book3d.style.transform  = 'rotateY(0deg) rotateX(0deg) scale(3.8)';
      book3d.style.opacity    = '0';
    }, 450);
    setTimeout(()=>{
      document.getElementById('f4coverScene').style.visibility = 'hidden';
      document.getElementById('f4coverScene').style.pointerEvents = 'none';
      // 표지 리셋(다음 열기 대비)
      book3d.style.transition = 'none';
      book3d.style.transform  = 'rotateY(-26deg) rotateX(4deg)';
      book3d.style.opacity    = '1';
      f4ShowInnerPages();
      f4IsAnimating = false;
    }, 1100);
  }

  function f4ShowInnerPages(){
    const book = f4CurrentBook;
    f4CurrentPage = 0;
    const lib = book.library || {};
    const pages = f4BuildPages(book, lib);
    if(pages.length === 0){
      pages.push(f4MakeInnerPage('EG', book.answer, '아직 해설이 준비되지 않았습니다.', 1));
      pages.push(f4MakeLastPage(book, 2));
    }
    f4TotalPages = pages.length;

    const pagesEl = document.getElementById('f4bookPages');
    const navEl = pagesEl.querySelector('.f4book-nav');
    pagesEl.innerHTML = '';
    if(navEl) pagesEl.appendChild(navEl);

    pages.forEach((p, i) => {
      p.style.display       = 'flex';
      p.style.flexDirection = 'column';
      p.style.width         = '100%';
      p.style.height        = '460px';
      p.style.position      = 'absolute';
      p.style.top           = '0';
      p.style.left          = '0';
      p.style.right         = '0';
      p.style.zIndex        = i === 0 ? '12' : '1';
      p.style.transform     = i === 0 ? 'translateX(0)' : 'translateX(100%)';
      p.style.transition    = 'none';
      if(p.classList.contains('f4page-inner')){
        p.style.overflowX = 'hidden';
        p.style.overflowY = 'auto';
        p.style.webkitOverflowScrolling = 'touch';
      } else {
        p.style.overflow = 'hidden';
      }
      p.addEventListener('click', (ev) => {
        if(ev.target.closest('a, button, [data-no-flip]')) return;
        const rect = p.getBoundingClientRect();
        const x = ev.clientX - rect.left;
        if(x < rect.width * 0.35) f4TurnPage(-1);
        else if(x > rect.width * 0.65) f4TurnPage(1);
      });
      pagesEl.appendChild(p);
    });

    f4RenderDots();
    f4UpdateNavZones();

    const modal = document.getElementById('f4bookModal');
    modal.classList.add('visible');
    modal.style.visibility = 'visible';
    modal.style.opacity = '0';
    const vw = window.innerWidth, vh = window.innerHeight;
    modal.style.top  = Math.round((vh - 520) / 2) + 'px';
    modal.style.left = Math.round((vw - 340) / 2) + 'px';
    modal.style.transform = 'scale(0.96)';
    modal.style.transition = 'none';
    modal.getBoundingClientRect();
    modal.style.transition = 'opacity 0.38s ease, transform 0.38s ease';
    setTimeout(()=>{
      modal.style.opacity = '1';
      modal.style.transform = 'scale(1)';
      modal.style.pointerEvents = 'all';
    }, 30);
  }

  // ── 페이지 넘기기 (애플북스 슬라이드) ──────────
  function f4TurnPage(dir){
    if(f4IsAnimating) return;
    const next = f4CurrentPage + dir;
    if(next < 0 || next >= f4TotalPages) return;
    f4IsAnimating = true;
    f4PlaySound();
    const pagesEl  = document.getElementById('f4bookPages');
    const allPages = pagesEl.querySelectorAll('.f4book-page-view');
    const outPage  = allPages[f4CurrentPage];
    const inPage   = allPages[next];
    if(dir > 0){
      inPage.style.zIndex = '11';  inPage.style.transform = 'translateX(0)';  inPage.style.transition = 'none';
      outPage.style.zIndex = '12'; outPage.style.transition = 'none';         outPage.style.transform = 'translateX(0)';
      requestAnimationFrame(()=>{
        outPage.style.transition = 'transform 0.48s cubic-bezier(0.32,0.72,0,1)';
        outPage.style.transform  = 'translateX(-100%)';
      });
    } else {
      outPage.style.zIndex = '11'; outPage.style.transform = 'translateX(0)';  outPage.style.transition = 'none';
      inPage.style.zIndex = '13';  inPage.style.transition = 'none';           inPage.style.transform = 'translateX(100%)';
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
        inPage.style.transition = 'transform 0.48s cubic-bezier(0.32,0.72,0,1)';
        inPage.style.transform  = 'translateX(0)';
      }); });
    }
    setTimeout(()=>{
      f4CurrentPage = next;
      inPage.scrollTop = 0;
      inPage.style.zIndex  = '12';
      outPage.style.zIndex = '1';
      f4RenderDots();
      f4UpdateNavZones();
      f4IsAnimating = false;
    }, 490);
  }

  function f4UpdateNavZones(){
    const l = document.getElementById('f4navLeft');
    const r = document.getElementById('f4navRight');
    if(l) l.style.display = f4CurrentPage === 0              ? 'none' : 'flex';
    if(r) r.style.display = f4CurrentPage === f4TotalPages-1 ? 'none' : 'flex';
  }

  function f4RenderDots(){
    const dots = document.getElementById('f4bookDots');
    dots.innerHTML = '';
    for(let i = 0; i < f4TotalPages; i++){
      const dot = document.createElement('div');
      dot.className = 'f4book-page-dot' + (i === f4CurrentPage ? ' active' : '');
      dots.appendChild(dot);
    }
  }

  function f4CloseBook(){
    const overlay = document.getElementById('f4bookModalOverlay');
    document.getElementById('f4coverScene').style.visibility = 'visible';
    document.getElementById('f4coverScene').style.pointerEvents = 'auto';
    overlay.classList.remove('open', 'bg-light');
    const book3d = document.getElementById('f4coverBook3D');
    book3d.style.transition = 'none';
    book3d.style.transform  = 'rotateY(-26deg) rotateX(4deg)';
    book3d.style.opacity    = '1';
    document.getElementById('f4coverShadow').style.opacity = '1';
    const modal = document.getElementById('f4bookModal');
    modal.style.transition = 'opacity 0.38s ease, transform 0.38s ease';
    modal.style.opacity = '0';
    modal.style.transform = 'scale(0.96)';
    modal.style.pointerEvents = 'none';
    setTimeout(()=>{
      modal.style.visibility = 'hidden';
      modal.style.opacity = '0';
      modal.classList.remove('visible');
    }, 400);
    f4IsAnimating = false;
  }

  function f4OverlayClick(e){
    if(e.target === document.getElementById('f4bookModalOverlay')) f4CloseBook();
  }

  // ── 페이지 구성 (지식·사유·연결·큐레이션·마지막) ──
  function f4BuildPages(book, lib){
    const pages = [];
    if(lib.knowledge)  pages.push(f4MakeInnerPage('LAYER 1 · 지식', '알고 이해하기', lib.knowledge, pages.length + 1));
    if(lib.thought)    pages.push(f4MakeInnerPage('LAYER 2 · 사유', '생각하고 느끼기', lib.thought, pages.length + 1));
    if(lib.connection) pages.push(f4MakeInnerPage('LAYER 3 · 연결', '삶과 이어보기', lib.connection, pages.length + 1));
    if(lib.curation)        pages.push(f4MakeCurationPage(lib.curation, pages.length + 1, book.curation_links));
    else if(book.curation_links) pages.push(f4MakeCurationPage('', pages.length + 1, book.curation_links));
    pages.push(f4MakeLastPage(book, pages.length + 1));
    return pages;
  }

  function f4MakeInnerPage(tag, heading, body, num){
    const div = document.createElement('div');
    div.className = 'f4book-page-view f4page-inner';
    div.innerHTML = `
      <div class="f4page-lines"></div>
      <div class="f4page-inner-content">
        <div class="f4page-layer-tag">${tag}</div>
        <div class="f4page-layer-heading">${heading}</div>
        <div class="f4page-layer-body">${f4RenderMarkdown(body)}</div>
      </div>
      <div class="f4page-num-inner">${num}</div>
      <div class="f4page-corner"></div>`;
    return div;
  }

  function f4MakeCurationPage(curation, num, links){
    const div = document.createElement('div');
    div.className = 'f4book-page-view f4page-inner';
    const items = (curation || '').split('/').map(s => s.trim()).filter(Boolean);
    const itemsHtml = items.map(item => `
      <div style="padding:10px 0;border-bottom:1px solid rgba(180,160,120,0.15);font-size:13px;color:#3D2F10;font-family:'Noto Serif KR',serif;line-height:1.6">
        ${f4RenderMarkdown(item)}
      </div>`).join('');
    let linksHtml = '';
    if(links && (links.books || links.library_call_number || links.youtube_keywords)){
      linksHtml = f4RenderCurationLinks(links);
    }
    div.innerHTML = `
      <div class="f4page-lines"></div>
      <div class="f4page-inner-content">
        <div class="f4page-layer-tag">LAYER 4 · 큐레이션</div>
        <div class="f4page-layer-heading">더 깊이 들어가기</div>
        ${itemsHtml}
        ${linksHtml}
      </div>
      <div class="f4page-num-inner">${num}</div>
      <div class="f4page-corner"></div>`;
    return div;
  }

  // curation_links → HTML (책 찾기 / 도서관 청구기호 / 유튜브)
  function f4RenderCurationLinks(links){
    const sections = [];
    const linkStyle = "color:#8B6F2A;text-decoration:none;border-bottom:1px solid rgba(139,111,42,0.3);padding-bottom:1px";
    const stopProp = `onclick="event.stopPropagation()" ontouchstart="event.stopPropagation()"`;
    if(links.books && links.books.length > 0){
      const bookCards = links.books.map(b => {
        const title = b.title || '';
        const meta = [b.translator && `${b.translator} 옮김`, b.publisher].filter(Boolean).join(' · ');
        const parts = b.isbn ? [b.isbn] : [title, b.author, (b.translator || b.publisher)].filter(Boolean);
        const q = encodeURIComponent(parts.join(' '));
        const stores = [

  // ── 모달 이벤트 바인딩 (1회) ──────────────────
  function f4InitModal(){
    if(f4ModalInited) return;
    f4ModalInited = true;
    const overlay = document.getElementById('f4bookModalOverlay');
    document.getElementById('f4coverBook3D').addEventListener('click', f4EnterBook);
    overlay.addEventListener('click', f4OverlayClick);
    const closeBtn = document.querySelector('.f4book-close-btn');
    if(closeBtn) closeBtn.addEventListener('click', f4CloseBook);
    const l = document.getElementById('f4navLeft');
    const r = document.getElementById('f4navRight');
    if(l) l.addEventListener('click', ()=>f4TurnPage(-1));
    if(r) r.addEventListener('click', ()=>f4TurnPage(1));

    // 터치 스와이프 (실시간 드래그)
    let sx = 0, sy = 0, dragging = false, dragPage = null, onLink = false;
    overlay.addEventListener('touchstart', e => {
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; dragging = false;
      onLink = !!(e.target.closest && e.target.closest('a, button, [data-no-flip]'));
      const all = document.getElementById('f4bookPages').querySelectorAll('.f4book-page-view');
      dragPage = all[f4CurrentPage] || null;
    }, { passive:true });
    overlay.addEventListener('touchmove', e => {
      if(!dragPage || f4IsAnimating || onLink) return;
      const dx = e.touches[0].clientX - sx;
      const dy = e.touches[0].clientY - sy;
      if(!dragging && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) dragging = true;
      if(!dragging) return;
      if(dx < 0 && f4CurrentPage < f4TotalPages - 1){ dragPage.style.transition = 'none'; dragPage.style.transform = `translateX(${dx}px)`; }
      else if(dx > 0 && f4CurrentPage > 0){ dragPage.style.transition = 'none'; dragPage.style.transform = `translateX(${dx}px)`; }
    }, { passive:true });
    overlay.addEventListener('touchend', e => {
      if(onLink){ onLink = false; return; }
      if(!dragging || !dragPage) return;
      const dx = e.changedTouches[0].clientX - sx;
      const th = 60;
      if(dx < -th && f4CurrentPage < f4TotalPages - 1) f4TurnPage(1);
      else if(dx > th && f4CurrentPage > 0) f4TurnPage(-1);
      else { dragPage.style.transition = 'transform 0.32s cubic-bezier(0.23,1,0.32,1)'; dragPage.style.transform = 'translateX(0)'; }
      dragging = false; dragPage = null;
    }, { passive:true });
  }

  return { markup, mount, slide };
})();

/* ============================================================
 *  ⅤF 페르소나 월 모듈 (Floor5) — 「내가 사랑한 얼굴들 · Le Mur des Visages」
 *    내가 품은 별의 액자(framed_url)를 세로 스크롤 벽에 흩뿌림.
 *    배경 = uid 씨앗 시작번호 + 방마다 순환(3층 본보기) · 16점 동적 방.
 *    탭 → 확대 모달(핀치 줌 대체). 편집·별 이동은 2차.
 *    f5 접두사로 전역 격리. 4층(Floor4)이 본보기.
 * ============================================================ */
const Floor5 = (() => {
  const BG_POOL  = 1;    // 5f_bg01 한 장 (소로가 5f_bg02~ 올리면 그 수만큼 늘림)
  const ROOM_CAP = 15;   // 한 방 정원 (3열×5행)
  let stars = [];        // 그 콩파뇽이 품은 별(액자 보유) 평면 목록
  let rooms = [];        // 방별 묶음 [[star,...], ...]
  let curRoom = 0, bgStart = 1, isTransitioning = false, tagTimer = null;
  // ── 편집 모드 상태 (목업 v3 이식) ──
  let editMode = false, drag = null, selectedId = null;
  let isOwner = false, ownerUid = null;   // 본인 벽일 때만 편집 허용 (순례자 X)
  const ASPECT = 941/1672;                 // 벽 종횡비 — y%↔x% 환산

  // ── seeded random ──
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  const lerp  = (a,b,t)=> a+(b-a)*t;
  const clamp = (v,lo,hi)=> Math.max(lo, Math.min(hi, v));
  // 액자 반지름(%) — 드래그 경계 clamp용 (높이는 비율 평균 근사)
  function half(s){ return (s.size_pct||16)/2; }
  function halfY(s){ return ((s.size_pct||16)/0.82)*ASPECT/2; }

  // ── uid 씨앗 시작 배경 (3층 shelfBgIndex 문법) ──
  function bgStartOf(uid){
    if(!uid) return 1;
    let sum=0; for(let i=0;i<uid.length;i++) sum=(sum+uid.charCodeAt(i))%100000;
    return (sum % BG_POOL) + 1;
  }
  function bgForRoom(roomIdx){ return ((bgStart-1+roomIdx) % BG_POOL) + 1; }

  function markup(){
    return `
      <div class="floor-content" data-floor="5">
        <div class="f5-scroll" id="f5-scroll">
          <div class="f5-stage" id="f5-stage">
            <div class="f5-bgwrap" id="f5-bgwrap"></div>
            <div class="f5-wall" id="f5-wall"></div>
          </div>
        </div>
        <button class="f5-nav f5-nav-l" id="f5-prev" aria-label="이전 방">‹</button>
        <button class="f5-nav f5-nav-r" id="f5-next" aria-label="다음 방">›</button>
        <div class="f5-empty" id="f5-empty"></div>
        <div class="f5-roomtag" id="f5-roomtag"></div>
        <button class="f5-edit" id="f5-edit" style="display:none">✎ 배치 바꾸기</button>
        <div class="f5-tool" id="f5-tool">
          <button id="f5-size-down" title="작게">−</button><span class="f5-tool-lbl">크기</span><button id="f5-size-up" title="크게">＋</button>
          <span class="f5-tool-sep"></span>
          <button id="f5-rot-l" title="왼쪽으로">↺</button><span class="f5-tool-lbl">각도</span><button id="f5-rot-r" title="오른쪽으로">↻</button>
        </div>
        <div class="f5-zoom" id="f5-zoom">
          <button class="f5-zoom-close" id="f5-zoom-close" aria-label="닫기">×</button>
          <div class="f5-zoom-inner">
            <img class="f5-zoom-img" id="f5-zoom-img" alt="">
            <div class="f5-zoom-meta">
              <div class="f5-zoom-name" id="f5-zoom-name"></div>
              <div class="f5-zoom-cat" id="f5-zoom-cat"></div>
            </div>
          </div>
        </div>
      </div>`;
  }

  // ── 배경 크로스페이드 (3층/4층 본뜸) ──
  function setRoomBg(roomIdx, animate){
    const wrap = document.getElementById('f5-bgwrap'); if(!wrap) return;
    const n = bgForRoom(roomIdx);
    const layer = document.createElement('div');
    layer.className = 'f5-bg-layer';
    layer.style.backgroundImage = `url('5f_bg${String(n).padStart(2,'0')}.webp')`;  // 5f_bg01~ (BG_POOL 순환)
    layer.style.opacity = animate ? '0' : '1';
    wrap.insertBefore(layer, wrap.firstChild);
    if(animate) requestAnimationFrame(()=>requestAnimationFrame(()=>{ layer.style.opacity = '1'; }));
    wrap.querySelectorAll('.f5-bg-layer').forEach(el=>{
      if(el !== layer){ el.style.opacity='0'; setTimeout(()=>el.remove(), 950); }
    });
  }

  // ── 방 번호 떴다 사라짐 (방 2개 이상일 때만) ──
  function showRoomTag(roomIdx){
    const tag = document.getElementById('f5-roomtag'); if(!tag) return;
    const total = rooms.length;
    if(total <= 1){ tag.classList.remove('on'); return; }
    tag.innerHTML = `${roomIdx+1} <small>/ ${total}</small>`;
    tag.classList.add('on');
    clearTimeout(tagTimer);
    tagTimer = setTimeout(()=>tag.classList.remove('on'), 2600);
  }

  // ── 16칸 표준 배치 슬롯 (3층 SHELF_SLOTS 정신 확장) ──
  //    5f_bg01 중심 빈 벽에 3열×5행. 소로가 손으로 잡은 배치(persona_wall)를 본보기로 표준화.
  //    품은 순서 1→15번이 좌·중·우 3열로 위→아래 차곡차곡. 콩파뇽 손 안 대도 셰익스피어 앤 컴퍼니 벽.
  //    x,y=중심%(translate -50%), w=폭%(높이는 framed 비율 자유), rot=기울기°.
  const SLOTS = [
    { x:36.5, y:20,   w:14,   rot:-1.5 },  //  1  좌·0행
    { x:52.5, y:20,   w:13.5, rot: 1.5 },  //  2  중·0행
    { x:68,   y:20,   w:14,   rot: 0   },  //  3  우·0행
    { x:36.5, y:32,   w:13.5, rot: 1.5 },  //  4  좌·1행
    { x:52.5, y:32,   w:14,   rot:-1.5 },  //  5  중·1행
    { x:68,   y:32,   w:13.5, rot: 1   },  //  6  우·1행
    { x:36.5, y:44,   w:14,   rot:-1   },  //  7  좌·2행
    { x:52.5, y:44,   w:13.5, rot: 1.5 },  //  8  중·2행
    { x:68,   y:44,   w:14,   rot:-1.5 },  //  9  우·2행
    { x:36.5, y:56,   w:13.5, rot: 1.5 },  // 10  좌·3행
    { x:52.5, y:56,   w:14,   rot:-1   },  // 11  중·3행
    { x:68,   y:56,   w:13.5, rot: 1.5 },  // 12  우·3행
    { x:36.5, y:67.5, w:14,   rot:-1.5 },  // 13  좌·4행
    { x:52.5, y:67.5, w:13.5, rot: 1   },  // 14  중·4행
    { x:68,   y:67.5, w:14,   rot:-1.5 },  // 15  우·4행
  ];

  // ── 자동 배치(행 없는 별): 품은 순서대로 표준 슬롯에 착지 ──
  function autoPlace(star, idxInRoom, nInRoom){
    const sl = SLOTS[idxInRoom % SLOTS.length];
    return { x:sl.x, y:sl.y, size_pct:sl.w, rot:sl.rot };
  }

  // ── 데이터: 품은 별(액자) + 저장된 배치 ──
  async function loadStars(uid){
    stars = []; rooms = [];
    if(!uid) return;
    let comps = [], layout = [];
    try{
      comps = await sbFetch(`/rest/v1/companions?user_id=eq.${encodeURIComponent(uid)}&status=eq.live&select=star_id,joined_at&order=joined_at.desc`) || [];
    }catch(e){ console.warn('[F5] companions 로드 실패', e); return; }
    // 별 상세는 따로 in 조회 (임베드 회피 — 검증된 단순 패턴)
    const ids = comps.map(c=>c.star_id).filter(v=>v!=null);
    const starMap = {};
    if(ids.length){
      try{
        const ss = await sbFetch(`/rest/v1/stars?id=in.(${ids.join(',')})&select=id,name,categories,framed_url`) || [];
        ss.forEach(s=> starMap[s.id] = s);
      }catch(e){ console.warn('[F5] stars 로드 실패', e); }
    }
    try{
      layout = await sbFetch(`/rest/v1/persona_wall?user_id=eq.${encodeURIComponent(uid)}&select=star_id,x,y,size_pct,rot,room`) || [];
    }catch(e){ console.warn('[F5] persona_wall 로드 실패', e); layout = []; }
    const lay = {}; layout.forEach(l=> lay[l.star_id] = l);

    // 품은 순서 유지 · 액자(framed_url) 있는 별만 벽에 걸림
    const list = comps.map(c=> starMap[c.star_id]).filter(s=> s && s.framed_url);
    list.forEach((s,i)=>{
      const L = lay[s.id];
      const room = (L && L.room != null) ? L.room : Math.floor(i / ROOM_CAP);
      stars.push({
        id:s.id, name:s.name||'', cat:(Array.isArray(s.categories)?(s.categories[0]||''):String(s.categories||'')).split(/[·,]/)[0].trim(),
        framed:s.framed_url, room, _pinned:!!L, _L:L
      });
    });
    // 방별 묶기
    const maxRoom = stars.reduce((m,s)=>Math.max(m,s.room), 0);
    for(let r=0;r<=maxRoom;r++) rooms[r] = [];
    stars.forEach(s=> rooms[s.room].push(s));
    if(rooms.length===0) rooms = [[]];
    // 방 안 위치 확정
    rooms.forEach(roomStars=>{
      roomStars.forEach((s,idx)=>{
        if(s._pinned){ s.x=+s._L.x; s.y=+s._L.y; s.size_pct=+s._L.size_pct; s.rot=+s._L.rot; }
        else { const p=autoPlace(s, idx, roomStars.length); s.x=p.x; s.y=p.y; s.size_pct=p.size_pct; s.rot=p.rot; }
      });
    });
    try{ window.__F5DBG = { uid: uid?uid.slice(0,8):'NULL', comps: comps.length, stars: stars.length, rooms: rooms.length }; console.log('[F5DBG]', window.__F5DBG); }catch(_){}
  }

  function renderRoom(roomIdx){
    const wall  = document.getElementById('f5-wall');
    const empty = document.getElementById('f5-empty');
    if(!wall) return;
    wall.innerHTML = '';
    const roomStars = rooms[roomIdx] || [];
    if(roomStars.length === 0){
      if(empty){ empty.style.display=''; empty.textContent='아직 품은 얼굴이 없습니다'; }
      return;
    }
    if(empty) empty.style.display='none';
    for(const s of roomStars){
      const f = document.createElement('div');
      f.className = 'f5-frame';
      f.dataset.id = s.id;
      f.style.left = s.x+'%'; f.style.top = s.y+'%';
      f.style.width = s.size_pct+'%';
      f.style.setProperty('--rot', s.rot+'deg');
      const im = document.createElement('img');
      im.className = 'f5-frame-img'; im.src = s.framed; im.alt = s.name; im.loading='lazy'; im.draggable = false;
      f.appendChild(im);
      if(s.name){
        const pl = document.createElement('div');
        pl.className = 'f5-plate';
        pl.textContent = s.name;       // 작가 한글 표기 (stars.name)
        f.appendChild(pl);
      }
      bindEvents(f, s);
      wall.appendChild(f);
    }
    if(selectedId !== null){ const f = frameEl(selectedId); if(f){ f.classList.add('selected'); showTool(); } }
  }

  // ── 액자 이벤트: 감상=별 탐구 직행 / 편집=드래그·선택 (목업 v3 이식) ──
  function frameEl(id){ const w=document.getElementById('f5-wall'); return w ? w.querySelector('.f5-frame[data-id="'+id+'"]') : null; }
  function curStar(){ return stars.find(x=> x.id === selectedId); }
  function bindEvents(f, s){
    f.addEventListener('click', ()=>{
      if(editMode) return;                       // 편집 중엔 클릭=직행 차단
      const qUser = new URLSearchParams(location.search).get('user');
      let url = 'star.html?id=' + s.id + '&from=wk5';   // 출처=분더카머 5층 (복귀 문 표시)
      if(qUser) url += '&fromuser=' + encodeURIComponent(qUser);   // 순례 중이면 그 집 닉 유지
      location.href = url;                        // 감상 클릭 = 별 탐구 페이지로 직행
    });
    f.addEventListener('pointerdown', (e)=>{
      if(!editMode || !isOwner) return;
      e.preventDefault();
      const rect = document.getElementById('f5-stage').getBoundingClientRect();
      drag = { f, s, mx:e.clientX, my:e.clientY, x0:s.x, y0:s.y, w:rect.width, h:rect.height, moved:false };
      f.classList.add('grabbing');
      try{ f.setPointerCapture(e.pointerId); }catch(_){}
    });
    f.addEventListener('pointermove', (e)=>{
      if(!drag || drag.f !== f) return;
      const dxp = e.clientX - drag.mx, dyp = e.clientY - drag.my;
      if(Math.abs(dxp) > 4 || Math.abs(dyp) > 4) drag.moved = true;
      s.x = +clamp(drag.x0 + dxp/drag.w*100, half(s)+1, 99-half(s)).toFixed(2);
      s.y = +clamp(drag.y0 + dyp/drag.h*100, halfY(s)+2, 90-halfY(s)).toFixed(2);
      f.style.left = s.x + '%'; f.style.top = s.y + '%';
      if(drag.moved) showTool();
    });
    const end = ()=>{
      if(!drag || drag.f !== f) return;
      f.classList.remove('grabbing');
      if(drag.moved){ s._pinned = true; persist(s); }
      else { selectFrame(s.id); }                // 이동 없이 떼면 = 선택
      drag = null;
    };
    f.addEventListener('pointerup', end);
    f.addEventListener('pointercancel', end);
  }

  // ── 편집 토글 / 선택 / 미니툴 ──
  function setEdit(on){
    editMode = on;
    document.getElementById('f5-stage')?.classList.toggle('editing', on);
    const btn = document.getElementById('f5-edit');
    if(btn){ btn.classList.toggle('on', on); btn.textContent = on ? '✓ 완료' : '✎ 배치 바꾸기'; }
    if(!on) clearSelection();
  }
  function clearSelection(){
    selectedId = null;
    document.querySelectorAll('.floor-content[data-floor="5"] .f5-frame.selected').forEach(el=> el.classList.remove('selected'));
    const t = document.getElementById('f5-tool'); if(t) t.style.display = 'none';
  }
  function selectFrame(id){
    if(selectedId === id){ clearSelection(); return; }   // 같은 걸 또 누르면 해제
    selectedId = id;
    document.querySelectorAll('.floor-content[data-floor="5"] .f5-frame').forEach(el=>
      el.classList.toggle('selected', +el.dataset.id === id));
    showTool();
  }
  function showTool(){
    const tool = document.getElementById('f5-tool'); if(!tool) return;
    if(selectedId === null || !editMode){ tool.style.display='none'; return; }
    const f = frameEl(selectedId);
    if(!f){ tool.style.display='none'; return; }
    const r = f.getBoundingClientRect();
    tool.style.display = 'flex';
    tool.style.left = (r.left + r.width/2) + 'px';
    tool.style.top  = Math.max(8, r.top - 42) + 'px';
  }
  function adjSize(d){
    const s = curStar(); if(!s) return;
    s.size_pct = +clamp(s.size_pct + d, 7, 30).toFixed(2);
    s._pinned = true;
    const f = frameEl(s.id); if(f) f.style.width = s.size_pct + '%';
    persist(s); showTool();
  }
  function adjRot(d){
    const s = curStar(); if(!s) return;
    s.rot = +(s.rot + d).toFixed(2);
    s._pinned = true;
    const f = frameEl(s.id); if(f) f.style.setProperty('--rot', s.rot + 'deg');
    persist(s);
  }

  // ── 저장: persona_wall upsert (본인만 · 3층 saveBook 본보기) ──
  async function persist(s){
    if(!isOwner || !ownerUid) return;
    try{
      await sbFetch('/rest/v1/persona_wall', {
        method:'POST',
        headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify({
          user_id: ownerUid, star_id: s.id,
          x:+(+s.x).toFixed(2), y:+(+s.y).toFixed(2),
          size_pct:+(+s.size_pct).toFixed(2), rot:+(+s.rot).toFixed(2),
          room: curRoom
        })
      });
    }catch(e){ console.warn('[F5] persona_wall 저장 실패', e); }
  }

  // ── 확대 모달 (핀치 줌 대체) ──
  function openZoom(s){
    const z = document.getElementById('f5-zoom'); if(!z) return;
    document.getElementById('f5-zoom-img').src = s.framed;
    document.getElementById('f5-zoom-img').alt = s.name;
    document.getElementById('f5-zoom-name').textContent = s.name;
    document.getElementById('f5-zoom-cat').textContent  = s.cat || '';
    z.classList.add('on');
  }
  function closeZoom(){ document.getElementById('f5-zoom')?.classList.remove('on'); }

  // ── 진입 시 벽 중앙 착지 (4층 centerScroll 그대로) ──
  function centerScroll(){
    const sc = document.getElementById('f5-scroll'); if(!sc) return;
    sc.scrollTop = Math.max(0, (sc.scrollHeight - sc.clientHeight) / 2);
  }

  function transitionTo(idx){
    if(isTransitioning || idx===curRoom || idx<0 || idx>=rooms.length) return;
    isTransitioning = true; curRoom = idx; clearSelection();
    setRoomBg(idx, true); showRoomTag(idx); renderRoom(idx);
    requestAnimationFrame(centerScroll);
    setTimeout(()=>{ isTransitioning=false; }, 650);
  }
  function slide(dir){
    if(currentFloor !== 5) return;
    const n = rooms.length; if(n<=1) return;
    transitionTo((curRoom + dir + n) % n);
  }

  // ── 순례 ?user= 우선, 없으면 본인 (3·4층과 동일 정신) ──
  async function resolveOwnerId(){
    const qUser = new URLSearchParams(location.search).get('user');
    if(qUser){
      try{
        const u = await sbFetch(`/rest/v1/users?nickname=eq.${encodeURIComponent(qUser)}&select=id`);
        if(u && u[0] && u[0].id) return u[0].id;
      }catch(e){ console.warn('[F5] owner 조회 실패', e); }
      return null;
    }
    return getUser()?.id || null;
  }

  async function mount(){
    isTransitioning = false; curRoom = 0;
    editMode = false; selectedId = null; drag = null;
    const uid = await resolveOwnerId();
    ownerUid = uid;
    const me = getUser()?.id || null;
    isOwner = !!me && me === uid;   // 본인 벽일 때만 편집 (남의 벽 순례 시 X)
    bgStart = bgStartOf(uid);
    await loadStars(uid);
    setRoomBg(0, false); showRoomTag(0); renderRoom(0);
    if(stars.length === 0){ const e=document.getElementById('f5-empty'); if(e){ const d=window.__F5DBG||{}; e.style.display=''; e.style.whiteSpace='normal'; e.textContent=`[진단] uid:${d.uid} · companions:${d.comps} · stars:${d.stars}`; } }
    const prev = document.getElementById('f5-prev');
    const next = document.getElementById('f5-next');
    if(prev) prev.addEventListener('click', ()=>slide(-1));
    if(next) next.addEventListener('click', ()=>slide(+1));
    const one = rooms.length <= 1;
    if(prev) prev.style.display = one ? 'none' : '';
    if(next) next.style.display = one ? 'none' : '';
    // ── 편집 버튼(주인만) + 미니툴 바인딩 ──
    const eb = document.getElementById('f5-edit');
    if(eb){ eb.style.display = isOwner ? '' : 'none'; eb.onclick = ()=> setEdit(!editMode); }
    const bind = (id,fn)=>{ const el=document.getElementById(id); if(el) el.onclick=fn; };
    bind('f5-size-down', ()=> adjSize(-1.2));
    bind('f5-size-up',   ()=> adjSize(1.2));
    bind('f5-rot-l',     ()=> adjRot(-2));
    bind('f5-rot-r',     ()=> adjRot(2));
    // 빈 벽 탭 = 선택 해제 (편집 중)
    const stage = document.getElementById('f5-stage');
    if(stage) stage.addEventListener('click', (e)=>{
      if(editMode && (e.target===stage || e.target.id==='f5-wall' || e.target.classList.contains('f5-bgwrap') || e.target.classList.contains('f5-bg-layer'))) clearSelection();
    });
    // 스크롤 시 선택 툴 따라가기
    const sc = document.getElementById('f5-scroll');
    if(sc) sc.addEventListener('scroll', ()=>{ if(selectedId!==null) showTool(); });
    requestAnimationFrame(centerScroll);
  }

  return { markup, mount, slide };
})();

/* ============================================================
 *  Ⅱ층 음악의 방 모듈 (Floor2) — 원본 music_room.html(감상실) 통합

 *  유튜브는 MusicPlayer(단일 iframe)가 .ms-wall에 도킹.

const Floor2 = (() => {
  const TUBE_KEYS = ['L1','L2','C1','C2','C3','R1','R2'];

  const BACKGROUNDS = [

      vu:{ left:{left:42.9,top:75.3}, right:{left:53.2,top:75.3} },
      style:{ tubeColor:'#ff8c32', tubeSize:2.4, tubeSpeed:3.0, needleColor:'#1a1a0a', vuRange:12 } },
    { id:'japanese-minimal', name:'일본 다실 · 와비사비', image:'japanese_minimal.png',
      screen:{left:24.8,top:20.8,width:42.8,height:46.2},
      tubes:{ L1:{left:39.7,top:75.6}, L2:{left:42.7,top:75.7}, C1:{left:45.3,top:75.1}, C2:{left:48.2,top:75.3}, C3:{left:51.1,top:75.4}, R1:{left:53.9,top:75.2}, R2:{left:57.0,top:75.4} },
      vu:{ left:{left:45.6,top:82.5}, right:{left:51.3,top:82.5} },
      style:{ tubeColor:'#ff8c32', tubeSize:3.6, tubeSpeed:3.8, needleColor:'#0c063c', vuRange:30 } }
  ];
  let currentBgIndex = -1;

  function hexToRgba(hex,a){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }

  function markup(){

    return `
      <div class="floor-content" data-floor="2">

            <div class="ms-vu" id="ms-vu-right"><svg viewBox="0 0 100 50"><path class="ms-needle" d="M 50 48 L 50 8"/></svg></div>
          </div>
        </div>
        <div class="ms-info">

            <span class="pt" id="ms-plate-title">Wolfgang Amadeus Mozart</span>

            <div class="ms-drawer" id="ms-drawer">

                <button class="ms-shuffle" id="ms-shuffle">🎲 다른 음악실로</button>

        <div class="ms-note-sheet" id="ms-note-sheet">
          <button class="sheet-close" id="ms-sheet-close" aria-label="닫기">×</button>
          <div class="nl">CURATOR'S NOTE</div>
          <div class="nb" id="ms-note-body"></div>
          <div class="ns">— 큐레이터 마리 (Maria)</div>
        </div>
      </div>`;
  }

  function applyBackground(bg){
    const room = document.getElementById('ms-room');
    if(!room) return;
    room.style.backgroundImage = `url('${bg.image}')`;
    document.getElementById('ms-room-name').textContent = `— ${bg.name} —`;
    const wall = document.getElementById('ms-wall');
    wall.style.left=bg.screen.left+'%'; wall.style.top=bg.screen.top+'%';
    wall.style.width=bg.screen.width+'%'; wall.style.height=bg.screen.height+'%';
    const c1=hexToRgba(bg.style.tubeColor,.95), c2=hexToRgba(bg.style.tubeColor,.7), c3=hexToRgba(bg.style.tubeColor,.35), c4=hexToRgba(bg.style.tubeColor,.1);
    TUBE_KEYS.forEach((k,idx)=>{
      const el=document.getElementById('ms-tube-'+k); const pos=bg.tubes[k];
      el.style.left=pos.left+'%'; el.style.top=pos.top+'%'; el.style.width=bg.style.tubeSize+'%';
      el.style.animation=`ms-flicker ${bg.style.tubeSpeed+idx*0.15}s ease-in-out infinite ${idx*0.2}s`;
      el.style.setProperty('--tc1',c1); el.style.setProperty('--tc2',c2); el.style.setProperty('--tc3',c3); el.style.setProperty('--tc4',c4);
    });
    const vl=document.getElementById('ms-vu-left'), vr=document.getElementById('ms-vu-right');
    vl.style.left=bg.vu.left.left+'%'; vl.style.top=bg.vu.left.top+'%';
    vr.style.left=bg.vu.right.left+'%'; vr.style.top=bg.vu.right.top+'%';
    document.querySelectorAll('.floor-content[data-floor="2"] .ms-needle').forEach((n,idx)=>{
      n.style.stroke=bg.style.needleColor;
      n.style.animation=`ms-vu-swing ${1.7+idx*0.4}s ease-in-out infinite ${idx*0.3}s`;
    });
    document.documentElement.style.setProperty('--ms-vu-range', bg.style.vuRange+'deg');
    // 벽 위치 바뀌었으니 도킹 좌표 재측정
    if(window.MusicPlayer) MusicPlayer.reposition();
  }

  function randomBackground(){
    let idx;
    if(BACKGROUNDS.length>1){ do{ idx=Math.floor(Math.random()*BACKGROUNDS.length); }while(idx===currentBgIndex); } else idx=0;
    currentBgIndex=idx; applyBackground(BACKGROUNDS[idx]);
  }

  // 저장된 좌표(music_room_config)를 코드 기본값 위에 덮어씀 · 없거나 실패면 기본값 안전유지
  let _cfgLoaded=false;
  async function loadRoomConfig(){
    if(_cfgLoaded) return;
    try {
      const rows = await sbFetch('/rest/v1/music_room_config?select=bg_id,coords');
      if(Array.isArray(rows)) rows.forEach(row=>{
        const bg = BACKGROUNDS.find(b=>b.id===row.bg_id);
        if(bg && row.coords){
          if(row.coords.screen) bg.screen = row.coords.screen;
          if(row.coords.tubes)  bg.tubes  = row.coords.tubes;
          if(row.coords.vu)     bg.vu     = row.coords.vu;
        }
      });
      _cfgLoaded=true;
      if(currentFloor===2 && BACKGROUNDS[currentBgIndex]) applyBackground(BACKGROUNDS[currentBgIndex]);
    } catch(e){ /* 설정 없음/실패 → 코드 기본값 유지 (방 안 깨짐) */ }
  }

  function wallRect(){ const w=document.getElementById('ms-wall'); return w?w.getBoundingClientRect():null; }

  function mount(){
    randomBackground();
    Shelf.render();              // 음반 선반 그리기 (자켓 5칸)
    MusicPlayer.syncMeta();
    loadRoomConfig();            // 저장된 좌표가 있으면 읽어 덮어씀 (비동기)
    _bindDrags();                // 편집기 드래그 핸들러 (평소 no-op, 편집 모드에서만 동작)

    // 하단 메뉴 서랍 (2중 버튼: ☰ 누르면 컨트롤이 슬라이드로 열림)
    const drawer=document.getElementById('ms-drawer');
    const menuToggle=document.getElementById('ms-menu-toggle');
    function setDrawer(open){ drawer.classList.toggle('open',open); menuToggle.classList.toggle('open',open); menuToggle.textContent=open?'✕':'☰'; }
    menuToggle.addEventListener('click', ()=> setDrawer(!drawer.classList.contains('open')));

    document.getElementById('ms-shuffle').addEventListener('click', randomBackground);
    document.getElementById('ms-crate').addEventListener('click', ()=>{ Library.open(); setDrawer(false); });
    // 마리의 노트 시트
    const sheet=document.getElementById('ms-note-sheet');
    document.getElementById('ms-note-btn').addEventListener('click', ()=>{
      sheet.classList.add('open'); setDrawer(false);
      if(window.MusicPlayer) MusicPlayer.setState('folded');   // 노트 읽는 동안 라디오 모드(영상 접힘)
    });
    document.getElementById('ms-sheet-close').addEventListener('click', ()=>{
      sheet.classList.remove('open');
      if(window.MusicPlayer) MusicPlayer.onFloorChange(2);      // 닫으면 다시 벽에 도킹
    });
  }

  /* ── 배치 편집기 (살롱지기 전용) — 스크린·진공관·VU 드래그 배치, 저장하면 전원 반영 ── */
  const SORO_UID='81ac3dfa-0d44-4ab9-84bf-d630321b0bad';
  let _editing=false, _work=null;
  function isSoro(){ try{ return getUser()?.id===SORO_UID; }catch(e){ return false; } }
  function _readout(m){ const r=document.getElementById('ms-edit-readout'); if(r) r.textContent=m; }
  function _clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function _applyLive(){
    const w=document.getElementById('ms-wall'); if(!w||!_work) return;
    w.style.left=_work.screen.left+'%'; w.style.top=_work.screen.top+'%';
    w.style.width=_work.screen.width+'%'; w.style.height=_work.screen.height+'%';
    TUBE_KEYS.forEach(k=>{ const el=document.getElementById('ms-tube-'+k); if(el){ el.style.left=_work.tubes[k].left+'%'; el.style.top=_work.tubes[k].top+'%'; } });
    const vl=document.getElementById('ms-vu-left'), vr=document.getElementById('ms-vu-right');
    if(vl){ vl.style.left=_work.vu.left.left+'%'; vl.style.top=_work.vu.left.top+'%'; }
    if(vr){ vr.style.left=_work.vu.right.left+'%'; vr.style.top=_work.vu.right.top+'%'; }
  }
  function _drag(el, onDelta){
    if(!el) return;
    el.addEventListener('pointerdown', e=>{
      if(!_editing) return;
      e.preventDefault(); e.stopPropagation();
      const room=document.getElementById('ms-room').getBoundingClientRect();
      let lx=e.clientX, ly=e.clientY;
      try{ el.setPointerCapture(e.pointerId); }catch(_){ }
      const mv=ev=>{ const dx=(ev.clientX-lx)/room.width*100, dy=(ev.clientY-ly)/room.height*100; lx=ev.clientX; ly=ev.clientY; onDelta(dx,dy); };
      const up=()=>{ try{ el.releasePointerCapture(e.pointerId); }catch(_){ } el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up); };
      el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
    });
  }
  function _bindDrags(){
    _drag(document.getElementById('ms-wall'), (dx,dy)=>{
      _work.screen.left=_clamp(_work.screen.left+dx,-20,100); _work.screen.top=_clamp(_work.screen.top+dy,-20,100);
      _applyLive(); _readout('스크린  \u2194'+_work.screen.left.toFixed(1)+'  \u2195'+_work.screen.top.toFixed(1)+'  '+_work.screen.width.toFixed(1)+'\u00d7'+_work.screen.height.toFixed(1));
    });
    _drag(document.getElementById('ms-wall-resize'), (dx,dy)=>{
      _work.screen.width=_clamp(_work.screen.width+dx,8,130); _work.screen.height=_clamp(_work.screen.height+dy,8,130);
      _applyLive(); _readout('스크린 크기  '+_work.screen.width.toFixed(1)+'\u00d7'+_work.screen.height.toFixed(1));
    });
    TUBE_KEYS.forEach(k=> _drag(document.getElementById('ms-tube-'+k), (dx,dy)=>{
      _work.tubes[k].left=_clamp(_work.tubes[k].left+dx,0,100); _work.tubes[k].top=_clamp(_work.tubes[k].top+dy,0,100);
      _applyLive(); _readout('진공관 '+k+'  \u2194'+_work.tubes[k].left.toFixed(1)+'  \u2195'+_work.tubes[k].top.toFixed(1));
    }));
    [['ms-vu-left','left'],['ms-vu-right','right']].forEach(pair=>{ const id=pair[0], side=pair[1];
      _drag(document.getElementById(id), (dx,dy)=>{
        _work.vu[side].left=_clamp(_work.vu[side].left+dx,0,100); _work.vu[side].top=_clamp(_work.vu[side].top+dy,0,100);
        _applyLive(); _readout('VU '+side+'  \u2194'+_work.vu[side].left.toFixed(1)+'  \u2195'+_work.vu[side].top.toFixed(1));
      });
    });
  }
  function editEnter(){
    if(_editing || currentFloor!==2 || !isSoro()) return;
    const bg=BACKGROUNDS[currentBgIndex]; if(!bg) return;
    _editing=true;
    _work={ bg_id:bg.id, screen:{...bg.screen}, tubes:JSON.parse(JSON.stringify(bg.tubes)), vu:JSON.parse(JSON.stringify(bg.vu)) };
    if(window.MusicPlayer) MusicPlayer.setState('folded');
    document.getElementById('ms-room').classList.add('ms-editing');
    document.getElementById('ms-edit-panel').classList.add('show');
    document.getElementById('ms-edit-toggle').classList.remove('show');
    _readout('스크린\u00b7진공관\u00b7VU를 끌어 배치 \u2192 저장');
  }
  function editExit(){
    if(!_editing) return;
    _editing=false; _work=null;
    document.getElementById('ms-room').classList.remove('ms-editing');
    document.getElementById('ms-edit-panel').classList.remove('show');
    if(BACKGROUNDS[currentBgIndex]) applyBackground(BACKGROUNDS[currentBgIndex]);
    if(window.MusicPlayer) MusicPlayer.onFloorChange(2);
    editSyncToggle(currentFloor);
  }
  async function editSave(){
    if(!_editing || !_work) return;
    const bg=BACKGROUNDS.find(b=>b.id===_work.bg_id); if(!bg) return;
    bg.screen={..._work.screen}; bg.tubes=JSON.parse(JSON.stringify(_work.tubes)); bg.vu=JSON.parse(JSON.stringify(_work.vu));
    _readout('저장 중\u2026');
    try {
      await sbFetch('/rest/v1/music_room_config?on_conflict=bg_id', {
        method:'POST', headers:{ 'Prefer':'resolution=merge-duplicates' },
        body: JSON.stringify({ bg_id:bg.id, coords:{ screen:bg.screen, tubes:bg.tubes, vu:bg.vu }, updated_at:new Date().toISOString() })
      });
    } catch(e){ _readout('저장 실패: '+(e.message||e)); return; }
    _editing=false; _work=null;
    document.getElementById('ms-room').classList.remove('ms-editing');
    document.getElementById('ms-edit-panel').classList.remove('show');
    applyBackground(bg);
    if(window.MusicPlayer) MusicPlayer.onFloorChange(2);
    editSyncToggle(currentFloor);
  }
  function editSyncToggle(n){
    const t=document.getElementById('ms-edit-toggle'); if(!t) return;
    if(n!==2 && _editing) editExit();
    t.classList.toggle('show', n===2 && isSoro() && !_editing);
  }

  return { markup, mount, wallRect, editEnter, editSave, editExit, editSyncToggle };
})();

/* 배치 편집기 최상위 버튼 배선 (소로 전용) */
document.getElementById('ms-edit-toggle')?.addEventListener('click', ()=> Floor2.editEnter());
document.getElementById('ms-edit-save')?.addEventListener('click', ()=> Floor2.editSave());
document.getElementById('ms-edit-exit')?.addEventListener('click', ()=> Floor2.editExit());

/* ============================================================
 *  음악 미니 플레이어 (MusicPlayer) — 단일 iframe, 층 넘어도 안 끊김
 *    play(i)         : 곡 선택·재생 (사용자 클릭 후 autoplay)
 *    onFloorChange(n): 2층=도킹 / 그 외=좌하단 미니 (started 후)
 *    setState(s)     : dock | mini | folded
 *    reposition()    : 현재 상태에 맞는 위치·크기 재계산
 * ============================================================ */
const MusicPlayer = (() => {
  const COLLECTION = [
    { videoId:'FKGjVMIALJo', startSeconds:0, cover:'lp_01_mozart_requiem.png',
      plateCat:'REQUIEM IN D MINOR · K. 626', plateTitle:'Wolfgang Amadeus Mozart',
      plateMeta:'1791 · 미완성 유작 · Minoritenkirche',
      note:`모차르트가 죽음의 문턱에서 받아 든 의뢰.<br>검은 옷의 낯선 사내가 두고 간 악보 위로 그는 자신의 진혼곡을 써 내려갔다. <span style="font-style:italic">Lacrimosa</span>의 여덟 마디에서 펜이 멈췄을 때, 그는 서른다섯이었다.`,
      pill:'Mozart · Requiem' },
    { videoId:'2tAS9WxucBU', startSeconds:20, cover:'lp_02_mahler_titan.png',
      plateCat:'SYMPHONY NO. 1 · "TITAN"', plateTitle:'Gustav Mahler',
      plateMeta:'1888 · Karina Canellakis · PMF Orchestra',
      note:`스물일곱 청년 말러가 라이프치히의 한 방에서 사랑에 빠졌다.<br>이루어질 수 없는 사랑, 그 좌절과 환희, 자연의 황홀과 죽음의 그림자가 첫 교향곡이 되었다. 장 파울의 소설 <span style="font-style:italic">「거인」</span>에서 빌려온 이름 — 그러나 거인은 신화 속 영웅이 아니라 자기 운명과 싸우는 한 인간이었다.`,
      pill:'Mahler · Titan' }
  ];

  // 목업 베이스(모차르트·말러) 기준선 — DB 음반은 이 뒤에 쌓이고, 서고 재로드 때 여기까지 되돌린다.
  const COLLECTION_BASE_LEN = COLLECTION.length;
  function resetLibraryTracks(){ COLLECTION.length = COLLECTION_BASE_LEN; }   // 동적 트랙 비움 (중복 누적 방지)
  function addTrack(t){ return COLLECTION.push(t) - 1; }                       // DB 음반 등록 → trackIndex 반환

  const player   = document.getElementById('musicPlayer');
  const iframe   = document.getElementById('mpIframe');
  const pillText = document.getElementById('mpPillText');

  let trackIdx = 0, started = false, state = 'mini', loadedIdx = -1;

  function currentTrack(){ return trackIdx; }
  function buildSrc(idx, autoplay){
    const t=COLLECTION[idx];
    const start=t.startSeconds>0?`&start=${t.startSeconds}`:'';
    const ap=autoplay?'&autoplay=1':'';
    return `https://www.youtube-nocookie.com/embed/${t.videoId}?rel=0&modestbranding=1&playsinline=1${start}${ap}`;
  }

  function syncMeta(){
    const cat=document.getElementById('ms-plate-cat'); if(!cat) return; // 2층 아닐 때
    const t=COLLECTION[trackIdx];
    cat.textContent=t.plateCat;
    document.getElementById('ms-plate-title').textContent=t.plateTitle;
    document.getElementById('ms-plate-meta').textContent=t.plateMeta;
    document.getElementById('ms-note-body').innerHTML=t.note;
  }

  function play(idx){
    // EG: 음악은 감상실(2층)에서만 재생한다. 2층 밖에서 들어온 재생 요청
    // (서고 지연 콜백·층 이동 뒤 뒤늦게 도착한 play 등)은 거부하고 완전히 숨긴다.
    if(currentFloor!==2){ stopAndHide(); return; }
    // 이미 그 곡을 재생 중이면 src를 다시 안 꽂음 (끊김 방지) — 위치만 갱신
    if(started && loadedIdx===idx){
      player.classList.remove('hidden','priming');
      setState(currentFloor===2 ? 'dock' : 'mini');
      if(window.Shelf) Shelf.touch(idx);   // LRU: 맨 왼쪽으로
      return;
    }
    trackIdx=idx; started=true;
    player.classList.remove('hidden','priming');
    iframe.src=buildSrc(idx,true); loadedIdx=idx;
    pillText.textContent=COLLECTION[idx].pill;
    syncMeta();
    setState(currentFloor===2 ? 'dock' : 'mini');
    if(window.Shelf) Shelf.touch(idx);     // LRU: 맨 왼쪽으로
  }

  // 2층 첫 진입: 자동재생 없이 썸네일만 도킹 + "눌러 시작" (강요 없음)
  function primeIfNeeded(){
    if(started) return;
    player.classList.remove('hidden');
    if(loadedIdx!==trackIdx){ iframe.src=buildSrc(trackIdx,false); loadedIdx=trackIdx; }
    player.classList.add('priming');
    pillText.textContent=COLLECTION[trackIdx].pill;
  }

  function setState(next){
    // 2층 밖에선 미니플레이어 상태(dock/mini/folded)가 존재하지 않는다 — 유령 스크린 방지. 무조건 숨긴다.
    if(currentFloor!==2){ stopAndHide(); return; }
    state=next;
    player.classList.remove('dock','mini','folded');
    player.classList.add(next);
    reposition();
  }

  function reposition(){
    if(player.classList.contains('hidden')) return;
    player.style.pointerEvents='';   // stopAndHide로 껐던 클릭을 복원 (감상실 재진입 시 스크린 조작 가능)
    if(state==='folded'){
      player.style.left='22px'; player.style.top='auto'; player.style.bottom='26px';
      player.style.width='auto'; player.style.height='auto'; return;
    }
    player.style.bottom='auto';
    if(state==='dock'){
      const r=Floor2.wallRect();
      if(r){ player.style.left=r.left+'px'; player.style.top=r.top+'px'; player.style.width=r.width+'px'; player.style.height=r.height+'px'; }
    } else { // mini
      const w=Math.min(320, Math.max(220, window.innerWidth*0.42));
      const h=w*9/16;
      player.style.left='22px'; player.style.top=(window.innerHeight-h-26)+'px';
      player.style.width=w+'px'; player.style.height=h+'px';
    }
  }

  // 재생 중이고 접힘이 아니면 좌하단 미니로 (감상실 아닌 다른 방으로 갈 때)
  function toMiniIfPlaying(){
    // 서고는 감상실이 아니므로 감상실 벽 도킹을 치운다 — 재생 중이면 좌하단 미니로, 재생 전(priming)이면 영상을 거둔다.
    if(player.classList.contains('hidden') || state==='folded') return;
    if(started) setState('mini');
    else { player.classList.add('hidden'); player.classList.remove('priming'); }
  }

  // ── EG 정신: 음악은 감상실(2층)에 두고 온다. 나올 때 끄고 나온다. (2026.07 미니플레이어 층간 잔류 제거) ──
  function stopAndHide(){
    iframe.src = '';                  // 유튜브 재생 완전 정지
    started = false; loadedIdx = -1;  // 재생 상태 리셋 (2층 재진입 시 primeIfNeeded가 새로 로드)
    player.classList.add('hidden');
    player.classList.remove('priming','dock','mini','folded');
    // 중첩 iframe(3D 타일 doorFrame 안)에서 좌표가 어긋나도 유령 스크린이 클릭 못 먹게 물리적으로 완전 제거.
    // (2층 재진입 시 reposition이 위치·클릭을 복원한다)
    player.style.width='0'; player.style.height='0';
    player.style.left='-9999px'; player.style.pointerEvents='none';
  }

  function onFloorChange(n){
    if(n===2){
      primeIfNeeded();
      if(!player.classList.contains('hidden')){
        requestAnimationFrame(()=>requestAnimationFrame(()=>{ setState('dock'); syncMeta(); }));
      }
    } else if(currentFloor!==2){
      // 2층을 실제로 벗어남 → 음악 정지 + 플레이어 완전히 거둠 (더 이상 mini로 따라오지 않음)
      stopAndHide();
    } else {
      // 2층 내부 상태 변화(인물벽 전환 등, onFloorChange(0)) → 기존 동작 유지
      if(started){
        if(state!=='folded' && !player.classList.contains('hidden')) setState('mini');
      } else {
        player.classList.add('hidden');
        player.classList.remove('priming');
      }
    }
  }

  // 버튼
  document.getElementById('mpPrime').addEventListener('click', ()=> play(trackIdx));
  const libOpen = ()=> document.getElementById('library-modal').classList.contains('open');
  document.getElementById('mpReturn').addEventListener('click', ()=>{
    if(currentFloor!==2) goToFloor(2);
    else if(libOpen()) Library.close();             // 서고 닫기 = close()가 도킹 복원까지
    else setState('dock');
  });
  document.getElementById('mpFold').addEventListener('click', ()=> setState('folded'));
  document.getElementById('mpPill').addEventListener('click', ()=>
    setState(currentFloor===2 && !libOpen() ? 'dock' : 'mini'));

  return { play, primeIfNeeded, setState, reposition, onFloorChange, stopAndHide, syncMeta, currentTrack, toMiniIfPlaying, getTrack:(i)=>COLLECTION[i], trackCount:COLLECTION.length, resetLibraryTracks, addTrack };
})();
window.MusicPlayer = MusicPlayer;

/* 토스트 헬퍼 */
let _toastTimer=null;
function showToast(msg){
  const t=document.getElementById('msToast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_toastTimer); _toastTimer=setTimeout(()=>t.classList.remove('show'),5000);
}

/* ============================================================
 *  음반 서고 (Library) — 레이어2 모달 · 디깅 박스
 *    open()/close() : 모달 열고 닫기 (음악 안 끊김)
 *    자켓 클릭: 준비중(trackIndex=null) → 흔들림+토스트
 *              실제 트랙 → 모달 닫고 2층 도킹 + MusicPlayer.play()
 *  trackIndex = MusicPlayer.COLLECTION 배열의 index.
 * ============================================================ */
const Library = (() => {
  // 본 공사 A1-2(0613): 하드코딩 5장 → 내 음반 rentals(반납 안 된 것). loadLibrary()가 채운다.
  let albums = [];
  let LIB_isOwner = false;

  // ── 마리의 라이너 노트 4겹 렌더 (heritage openLiner 로직 이식 · 감상실 양피지 톤) ──
  //    별표 강조는 밝은 양피지 시트에 맞춰 어두운 볼드. scene(시적 표지) + 앎·사유·연결·큐레이션.
  const MS_LAYER_LABELS = { knowledge:'앎', thought:'사유', connection:'연결', curation:'큐레이션' };
  function msMd(text){
    if(!text) return '';
    const e = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return e
      .replace(/\*\*([^*\n]+?)\*\*/g,'<strong style="font-weight:700;color:#2a1c08">$1</strong>')
      .replace(/\*([^*\n]+?)\*/g,'<strong style="font-weight:600;color:#5a3f14">$1</strong>');
  }
  function renderLinerNote(ln){
    if(!ln || typeof ln !== 'object') return ln ? msMd(String(ln)) : '<span style="opacity:.6">라이너 노트가 인쇄소에 있습니다.</span>';
    const blocks = [];
    if(ln.scene) blocks.push(`<div style="font-size:14px;font-style:italic;color:#3a2a18;margin-bottom:14px;line-height:1.6">${msMd(ln.scene)}</div>`);
    ['knowledge','thought','connection','curation'].forEach(k=>{
      if(!ln[k]) return;
      blocks.push(`<div style="margin-bottom:12px">
        <div style="font-size:9px;letter-spacing:2px;color:#8a6a3a;margin-bottom:4px">${MS_LAYER_LABELS[k]}</div>
        <div>${msMd(ln[k])}</div>
      </div>`);
    });
    return blocks.join('');
  }

  // owner = ?user= 우선(순례 입구 #24), 없으면 로그인 본인 — 1층과 동일 정신.
  async function loadLibrary() {
    albums = [];
    if (window.MusicPlayer) MusicPlayer.resetLibraryTracks();   // 동적 트랙 비움 (매 open마다 중복 누적 방지)
    const qUser = new URLSearchParams(location.search).get('user');
    let ownerId = null;
    if (qUser) {
      try { const u = await sbFetch(`/rest/v1/users?nickname=eq.${encodeURIComponent(qUser)}&select=id`); ownerId = u?.[0]?.id || null; }
      catch (e) { console.warn('owner 조회 실패', e); }
    } else {
      ownerId = getUser()?.id || null;
    }
    { const me = getUser()?.id; LIB_isOwner = !!me && ownerId === me; }   // 내 방 판정 (?user=내닉이어도 내 방)
    if (!ownerId) return;  // 비로그인·미존재 → 빈 서고
    try {
      const rents = await sbFetch(`/rest/v1/heritage_rentals?user_id=eq.${ownerId}&returned_at=is.null&select=item_id,starts_at&order=starts_at.desc`);
      const ids = [...new Set((rents || []).map(r => r.item_id))];
      if (!ids.length) return;
      const items = await sbFetch(`/rest/v1/heritage_items?id=in.(${ids.join(',')})&category=eq.record&select=id,name,artist,period,origin,img,video_id,start_seconds,liner_note`);
      const map = {}; (items || []).forEach(it => map[it.id] = it);
      albums = (rents || []).filter(r => map[r.item_id]).map(r => {
        const it = map[r.item_id];
        let trackIndex = null;
        // video_id가 있으면 검증된 재생 동선에 태운다 → COLLECTION에 트랙 등록 후 index 부여 (잠금 해제).
        // video_id 없으면 trackIndex=null 유지 → 클릭 시 "곧 들려드릴게요" (준비 중).
        if (it.video_id && window.MusicPlayer) {
          trackIndex = MusicPlayer.addTrack({
            videoId: it.video_id,
            startSeconds: it.start_seconds || 0,
            cover: it.img,
            plateCat: it.name,
            plateTitle: it.artist,
            plateMeta: [it.period, it.origin].filter(Boolean).join(' · '),
            note: renderLinerNote(it.liner_note),
            pill: `${it.artist} · ${it.name}`
          });
        }
        return { id: it.id, file: it.img, title: it.name, artist: it.artist, trackIndex };
      }).slice(0, 27);  // 서고 27칸 상한
    } catch (e) { console.warn('서고 로드 실패', e); }
  }
  const VISIBLE_RANGE=3, SPACING_X=165, ROTATION=28, DEPTH_Z=140;

  const modal   = document.getElementById('library-modal');
  const stage   = document.getElementById('lib-stage');
  const curEl   = document.getElementById('lib-cur');
  const totalEl = document.getElementById('lib-total');
  const toast   = document.getElementById('lib-toast');

  let currentIndex=0, isTransitioning=false, built=false, _libToastTimer=null;
  const cards=[];

  function build(){
    stage.innerHTML=''; cards.length=0;   // 재호출 대비: 매 open마다 새 대여 반영
    albums.forEach((album,idx)=>{
      const card=document.createElement('div');
      card.className='lp-card'; card.dataset.index=idx;
      card.innerHTML=`<div class="disc"></div><div class="cover" style="background-image:url('${album.file}');"></div>`;
      card.addEventListener('click',()=>onCardClick(idx));
      stage.appendChild(card); cards.push(card);
    });
    totalEl.textContent=String(albums.length).padStart(2,'0');
    refreshReturnBtn();
    built=true;
  }

  function layout(){
    cards.forEach((card,idx)=>{
      const offset=idx-currentIndex;
      if(Math.abs(offset)>VISIBLE_RANGE){
        card.style.opacity='0'; card.style.pointerEvents='none';
        const bt=`translateX(${offset*SPACING_X}px) translateZ(-${DEPTH_Z*2}px)`;
        card.style.setProperty('--base-transform',bt); card.style.transform=bt; return;
      }
      const abs=Math.abs(offset), sign=Math.sign(offset);
      const tx=offset*SPACING_X;
      const ry=-sign*Math.min(abs,1)*ROTATION - sign*Math.max(0,abs-1)*(ROTATION*.5);
      const tz=-abs*DEPTH_Z*.7;
      card.style.opacity = abs===0?1:(1-abs*.22);
      card.style.pointerEvents='auto';
      card.style.zIndex=String(100-abs);
      card.style.filter=`brightness(${1-abs*.18})`;
      const bt=`translateX(${tx}px) translateZ(${tz}px) rotateY(${ry}deg)`;
      card.style.setProperty('--base-transform',bt); card.style.transform=bt;
    });
    curEl.textContent=String(currentIndex+1).padStart(2,'0');
  }

  function goPrev(){ if(!isTransitioning && currentIndex>0){ currentIndex--; layout(); } }
  function goNext(){ if(!isTransitioning && currentIndex<albums.length-1){ currentIndex++; layout(); } }

  // 음반 반납 — 그림 [내리기]와 동일한 return_item RPC 재사용 (category 자동 판별)
  function refreshReturnBtn(){
    const rb=document.getElementById('lib-return'); if(!rb) return;
    rb.hidden = !LIB_isOwner || albums.length===0;   // 내 방 아님·빈 서고 → 숨김
  }
  async function returnCurrent(){
    const rb=document.getElementById('lib-return');
    const album=albums[currentIndex]; if(!album || !album.id) return;
    const uid=getUser()?.id; if(!uid){ libToast('로그인이 필요합니다'); return; }
    if(rb){ rb.disabled=true; rb.textContent='반환 중…'; }
    try{
      await sbFetch('/rest/v1/rpc/return_item', { method:'POST', body: JSON.stringify({ p_item_id:album.id, p_user_id:uid }) });
      await loadLibrary();                                    // 서고 다시 읽기 (반환 반영)
      if(currentIndex>=albums.length) currentIndex=Math.max(0,albums.length-1);
      build(); layout();
      libToast('음반을 헤리티지에 반환했습니다');
    }catch(e){ libToast('헤리티지 반환 실패: '+(e.message||e)); }
    finally{ if(rb){ rb.disabled=false; rb.textContent='♪ 헤리티지에 반환'; } }
  }

  function libToast(msg){
    toast.textContent=msg; toast.classList.add('show');
    clearTimeout(_libToastTimer); _libToastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
  }

  function onCardClick(idx){
    if(isTransitioning) return;
    if(idx!==currentIndex){ currentIndex=idx; layout(); return; }  // 옆 자켓 → 이동
    const album=albums[idx];
    if(album.trackIndex===null){                                   // 준비 중
      const card=cards[idx];
      card.classList.add('shaking'); setTimeout(()=>card.classList.remove('shaking'),600);
      libToast('곧 들려드릴게요'); return;
    }
    // 실제 트랙 → 서고 닫고 감상실 벽 도킹 (페이지 점프 대신 셸 내부 호출)
    isTransitioning=true;
    close();
    setTimeout(()=>{
      if(currentFloor!==2) goToFloor(2);
      // 2층 mount 후 재생 (이동 애니메이션 시간 고려)
      const delay = currentFloor!==2 ? 1500 : 60;
      setTimeout(()=>{ MusicPlayer.play(album.trackIndex); isTransitioning=false; }, delay);
    }, 420);
  }

  async function open(){
    await loadLibrary();        // 내 음반 rentals 읽기 (매 open마다 새 대여 반영)
    build();                    // stage 비우고 다시 그림
    modal.classList.add('open');
    currentIndex=0; layout();
    // 서고는 감상실이 아니므로, 재생 중이면 좌하단 미니로 (벽 도킹 잔류 방지)
    if(window.MusicPlayer) MusicPlayer.toMiniIfPlaying();
  }
  function close(){
    modal.classList.remove('open');
    // ★ 유령 방지 이중 잠금: layout()이 카드에 심은 인라인 pointerEvents:auto를 닫는 즉시 회수.
    //   (CSS visibility:hidden 방패와 독립 — 둘 중 하나만 살아도 유령 없음. 열 때 layout()이 복원.)
    document.querySelectorAll('#library-modal .lp-card').forEach(c=>{ c.style.pointerEvents='none'; });
    // 감상실(2층)에 있고 재생 중이면 벽 도킹 복원
    if(currentFloor===2 && window.MusicPlayer) MusicPlayer.onFloorChange(2);
  }

  // 이벤트
  document.getElementById('lib-prev').addEventListener('click', goPrev);
  document.getElementById('lib-next').addEventListener('click', goNext);
  document.getElementById('lib-close').addEventListener('click', close);
  document.getElementById('lib-return').addEventListener('click', returnCurrent);
  document.addEventListener('keydown', e=>{
    if(!modal.classList.contains('open')) return;
    if(e.key==='ArrowLeft'){ goPrev(); e.preventDefault(); }
    if(e.key==='ArrowRight'){ goNext(); e.preventDefault(); }
  });
  // 드래그/스와이프
  let dragX=null, dragging=false; const TH=50;
  const box=document.getElementById('lib-digging');
  function ds(x){ dragX=x; dragging=true; }
  function dm(x){ if(!dragging||dragX===null) return; const dx=x-dragX; if(Math.abs(dx)>TH){ dx>0?goPrev():goNext(); dragging=false; dragX=null; } }
  function de(){ dragging=false; dragX=null; }
  box.addEventListener('mousedown',e=>ds(e.clientX));
  box.addEventListener('mousemove',e=>dm(e.clientX));
  box.addEventListener('mouseup',de); box.addEventListener('mouseleave',de);
  box.addEventListener('touchstart',e=>ds(e.touches[0].clientX),{passive:true});
  box.addEventListener('touchmove',e=>dm(e.touches[0].clientX),{passive:true});
  box.addEventListener('touchend',de);

  return { open, close };
})();
window.Library = Library;

/* ============================================================
 *  음반 선반 (Shelf) — 감상실 상단 자켓 5칸 · LRU(왼쪽=최근)
 *    touch(idx) : 곡 재생 시 호출 → 그 곡을 맨 왼쪽으로(있으면 이동, 없으면 추가·5칸 넘으면 끝 밀려남)
 *    render()   : 선반을 화면에 그림 (2층 mount 때)
 *    load/save  : localStorage. 본 공사 때 이 안쪽만 Supabase 콩파뇽 계정으로 교체.
 *  칸 = trackIndex (MusicPlayer.COLLECTION의 index).
 * ============================================================ */
const Shelf = (() => {
  const KEY = 'eg_music_shelf_v1';
  const MAX = 5;
  const DEFAULT = [0, 1];           // 초기 상태: 모차르트·말러
  let order = load();               // trackIndex 배열, 앞이 최근

  function load(){
    try {
      const raw = localStorage.getItem(KEY);
      if(!raw) return DEFAULT.slice();
      const arr = JSON.parse(raw);
      if(!Array.isArray(arr)) return DEFAULT.slice();
      // 유효한 trackIndex만 (COLLECTION 범위 안)
      const n = window.MusicPlayer ? MusicPlayer.trackCount : 2;
      const clean = arr.filter(i => Number.isInteger(i) && i>=0 && i<n);
      return clean.length ? clean.slice(0,MAX) : DEFAULT.slice();
    } catch { return DEFAULT.slice(); }
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(order)); } catch {}
  }

  // LRU: 곡을 맨 왼쪽으로
  function touch(idx){
    order = order.filter(i => i !== idx);   // 있으면 제거
    order.unshift(idx);                     // 맨 앞에
    if(order.length > MAX) order = order.slice(0, MAX);
    save();
    render();
  }

  function render(){
    const shelf = document.getElementById('ms-shelf');
    if(!shelf) return;  // 2층 아닐 때
    shelf.innerHTML = '';
    for(let pos=0; pos<MAX; pos++){
      const idx = order[pos];
      const slot = document.createElement('div');
      if(idx === undefined){
        slot.className = 'ms-slot empty';
      } else {
        const t = MusicPlayer.getTrack(idx);
        slot.className = 'ms-slot';
        slot.style.backgroundImage = `url('${t.cover}')`;
        slot.innerHTML = `<span class="ms-slot-name">${t.pill}</span>`;
        slot.addEventListener('click', ()=> MusicPlayer.play(idx));
        // 모바일: 첫 탭은 곡명, 두번째 탭은 재생 — 은 과해서, 그냥 탭=재생 + 호버로 이름.
      }
      shelf.appendChild(slot);
    }
  }

  return { touch, render, load:()=>order.slice() };
})();
window.Shelf = Shelf;

/* ===== 첫 진입 ===== */
// 명패 직행(최상위 페이지 + from_star)일 때만 별 복귀 문 노출.
// maison iframe 경유(①②⑤)는 self!==top이라 숨김 → 기존 maison "떠나기"와 중복 없음.
try {
  const _fromStar = new URLSearchParams(location.search).get('from_star');
  if (window.self === window.top && _fromStar) {
    const _eb = document.getElementById('wkExitStar');
    if (_eb) {
      _eb.style.display = 'block';
      _eb.addEventListener('click', () => { location.href = 'star.html?id=' + encodeURIComponent(_fromStar); });
    }
  }
} catch (e) {}
buildBar();
applyElevatorByOwner();   // 그 집 주인 elevator_no 로 문 표시 (없으면 CSS 기본 elevator_01)
// 콘스텔라티오 순례: ?floor=N 으로 들어오면 그 층부터 시작 (없으면 1층). ?user= 는 loadLibrary가 읽음.
const _qFloor = parseInt(new URLSearchParams(location.search).get('floor'), 10);
currentFloor = (_qFloor >= 1 && _qFloor <= 5) ? _qFloor : 1;
if (window.EGCrashGuard && EGCrashGuard.check()) {
  // 0706 크래시 가드: 지난 크래시 감지 → 팝업만 띄우고 층 렌더 생략 (CSS 3D+webp 폭발 방지)
} else {
  if (window.EGCrashGuard) EGCrashGuard.mark('shell');
  renderFloor(currentFloor);
  setTimeout(maybeAutoLibrary, 600);   // 순례 ?user=&floor=2 직진입 시 음반서고 자동
}
</script>
