<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>EG Wunderkammer · Building Shell v3 (3F books)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+KR:wght@300;400;500&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+KR:wght@100;600;700&display=swap');

/* ============================================================
 *  분더카머 빌딩 셸 v2 — 층 전환 골조 (콘텐츠 없음)
 *
 *  v1 → v2 변경:
 *   ① 층 안내 bar(다이얼)를 문에서 분리 → 문 위 늘 떠 있는 상단 패널.
 *      탑승 순간 뜸 → 문이 다 열린 뒤에야 사라짐. (실제 엘리베이터 경험)
 *   ② 좌우 문은 그 bar '아래'에서만 여닫이.
 *   ③ 4초 효과음(ding_sound.mp3) 싱크:
 *      0s 닫힘 시작 / 1.1s 철커덩(닫힘완료) / 1.4s 띵동=불 딸깍 점등
 *      / 2.5s 스르륵(열림 시작) / ~3.5s 문 활짝 + bar 사라짐
 * ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #050304;
  font-family: 'Noto Serif KR', 'Cormorant Garamond', serif;
  color: #e8d9b0;
  user-select: none;
}

:root {
  --floor-bg-1: #3a1820;  --floor-bg-2: #6a2230;
  --floor-accent: #c9a84c;
  --floor-text: #f0ebe0;
  --floor-text-dim: #a89a85;

  /* 효과음 싱크 타임라인 (초) — 소리가 주인, 애니메이션이 따라감 */
  --t-close: 1.1s;   /* 문 닫힘 완료(철커덩) */
  --t-open-dur: 1.0s;/* 문 열림 길이 (2.5s → 3.5s) */
}

/* ============================================================
 *  레이어 1 — 층 콘텐츠
 * ============================================================ */
.floor-layer {
  position: fixed; inset: 0; z-index: 1;
  display: flex; align-items: center; justify-content: center;
}
.floor {
  position: relative; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background:
    radial-gradient(ellipse 80% 60% at 50% 38%, rgba(255,240,210,0.10), transparent 70%),
    linear-gradient(165deg, var(--floor-bg-1) 0%, var(--floor-bg-2) 100%);
  box-shadow: inset 0 0 180px rgba(0,0,0,0.55);
}
.floor::before, .floor::after {
  content: ''; position: absolute; left: 0; right: 0; height: 5px;
  background: linear-gradient(90deg, transparent, var(--floor-accent), transparent);
  opacity: 0.5;
}
.floor::before { top: 0; }
.floor::after  { bottom: 0; }

.floor-roman {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(48px, 14vw, 120px); font-weight: 300; line-height: 1;
  color: var(--floor-accent); opacity: 0.85; letter-spacing: 4px;
  text-shadow: 0 4px 30px rgba(0,0,0,0.6);
}
.floor-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(22px, 6vw, 38px); font-weight: 400; font-style: italic;
  color: var(--floor-text); letter-spacing: 3px; margin-top: 14px;
}
.floor-kr {
  font-size: clamp(13px, 3.6vw, 16px); color: var(--floor-text-dim);
  letter-spacing: 6px; margin-top: 10px;
}
.floor-placeholder {
  margin-top: 34px; padding: 10px 22px;
  border: 1px dashed color-mix(in srgb, var(--floor-accent) 45%, transparent);
  border-radius: 2px; font-size: 11px; letter-spacing: 3px;
  color: var(--floor-text-dim); font-family: 'Cormorant Garamond', serif;
}

/* ===== 층 안 엘리베이터 — 콜레주 형식 (0809 소로): 네 층 바로가기 =====
   ▲▼ 한 칸씩은 4층에서 1층으로 갈 때 세 번을 눌러야 했다. 콜레주 lift 문법으로 바꾼다.
   ⚠ 자리는 살롱지기가 거실 편집기에서 끌어 정한다 — 값은 eg_settings에 앉는다. */
.room-elevator {
  position: absolute;
  right: var(--lift-r, 3%); top: var(--lift-t, 50%); transform: translateY(-50%);
  z-index: 30; /* 책방 cover-stack(5)·화살표(8)보다 위 — 항상 클릭 가능 */
  display: flex; flex-direction: column; gap: 6px;
  padding: 11px 10px;
  background: linear-gradient(180deg, rgba(40,28,16,0.82), rgba(20,14,8,0.9));
  border: 1px solid color-mix(in srgb, var(--floor-accent) 55%, transparent);
  border-radius: 10px;
  -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}
.lift {
  display: flex; align-items: center; gap: 9px; width: 100%;
  background: transparent; border: 1px solid transparent; border-radius: 7px;
  padding: 7px 11px 7px 8px; cursor: pointer; text-align: left; white-space: nowrap;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.lift:hover { background: rgba(90,62,34,0.5); border-color: color-mix(in srgb, var(--floor-accent) 45%, transparent); }
.lift .l-no {
  font-family: 'Cormorant Garamond', serif; font-size: 12px; letter-spacing: 1px;
  color: color-mix(in srgb, var(--floor-accent) 75%, transparent); width: 22px; text-align: center;
}
.lift .l-kr { font-size: 11.5px; color: var(--floor-text-dim); letter-spacing: 0.5px; }
.lift.now { background: color-mix(in srgb, var(--floor-accent) 85%, transparent); border-color: var(--floor-accent); }
.lift.now .l-no, .lift.now .l-kr { color: #241a12; }
.lift.now .l-kr { font-weight: 600; }
@media (max-width: 560px){
  .lift { padding: 7px 8px; }
  .lift .l-kr { display: none; }
}

/* ============================================================
 *  층 콘텐츠 공통 래퍼
 * ============================================================ */
.floor-content { position: absolute; inset: 0; }


/* ══════════════════════════════════════════════════════════════════
 *  ⅠF Le Séjour · 거실 — 0728 신축 (세 건물 재편 7호)
 *  아홉 점 갤러리를 접고 한 점 거실을 연다.
 *  배경은 콩파뇽이 고른 방 한 장(941×1672) · 시간대 넷이 스스로 바뀐다.
 *  그림 자리만 셸이 얹고, 나머지는 전부 배경 그림이다.
 *  확대·설명 UI(g1-zoom · g1-note)는 옛 갤러리 것을 그대로 물려받았다.
 * ══════════════════════════════════════════════════════════════════ */
.floor-content[data-floor="1"] .sl-scroll{
  position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
  scrollbar-width:none; -ms-overflow-style:none;
}
.floor-content[data-floor="1"] .sl-scroll::-webkit-scrollbar{ display:none; width:0; height:0; }
/* 무대 — 그림의 비율을 따라간다. 가로 폭은 상한을 둔다.
   ⚠ 0728밤 정정: 처음엔 width:100% + aspect-ratio:941/1672로 못을 박았다.
     그러면 ① 넓은 화면에서 방이 2.5m로 펼쳐져 박물관이 되고
            ② 어떤 비율로 구워 와도 9:16으로 잘린다.
     이제 비율은 JS가 그림에서 재서 넣고(--sl-ar), 폭만 여기서 잡는다. */
.floor-content[data-floor="1"] .sl-stage{
  position:relative;
  width:min(100%, var(--sl-maxw, 1440px));   /* 0728밤: 1200 → 1440 (소로) */
  margin:0 auto;
  aspect-ratio:var(--sl-ar, 941/1672);   /* 0809 — 일곱 방 모두 9:16이다. 그림이 실리면 실측값으로 덮인다 */
  background:linear-gradient(168deg,#2a1d18 0%,#20160f 55%,#120c08 100%);
  background-size:cover; background-position:center top;
  transition:background-image .8s ease;
  z-index:1;
}
/* 좌우 여백 — 까맣게 두지 않는다. 같은 그림을 크게 흐려 뒤에 깔면
   방의 빛깔이 이어져 액자처럼 감싼다(극장 스크린 주변과 같은 이치). */
.floor-content[data-floor="1"] .sl-blur{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-size:cover; background-position:center;
  filter:blur(42px) brightness(.45) saturate(.85);
  transform:scale(1.12);
  transition:background-image .8s ease;
}
/* 그림 — 좌표는 living_rooms(art_x·art_y·art_h)가 정한다 */
.floor-content[data-floor="1"] .sl-art{
  position:absolute; z-index:12; cursor:zoom-in;
  transform:translateX(-50%);
  filter:drop-shadow(0 10px 26px rgba(0,0,0,.55));
  transition:filter .3s ease;
}
.floor-content[data-floor="1"] .sl-art:hover{ filter:drop-shadow(0 12px 32px rgba(0,0,0,.7)) brightness(1.05); }
.floor-content[data-floor="1"] .sl-art img{ display:block; height:100%; width:auto; }
/* 빈 벽 — 아무것도 안 걸렸을 때. 묻지 않고 그냥 거기 있다 */
.floor-content[data-floor="1"] .sl-empty{
  position:absolute; z-index:12; transform:translateX(-50%);
  min-width:150px;                      /* 좁은 화면에서 글자가 세로로 쪼개지지 않게 */
  display:flex; align-items:center; justify-content:center; text-align:center;
  border:1px dashed rgba(201,168,76,.30); border-radius:3px;
  font-family:'Cormorant Garamond','Noto Serif KR',serif;
  font-size:13px; line-height:1.9; color:rgba(240,235,224,.42);
  padding:14px; letter-spacing:.03em;
}
/* 명패 — 그림 아래. 누르면 설명이 펼쳐진다 */
/* ── 명패 — 미술관과 같은 얼굴 (galerie #plaque 이식 · 0809 소로) ──
   박스가 아니라 벽에 새긴다. 잉크는 명패가 앉은 곳의 벽을 재서 고른다.
   ⭐ 낭독 줄은 **음성이 있는 그림에만** 뜬다(0806밤 원칙: 그림 곁에는 팝업 말고 소리). */
.floor-content[data-floor="1"] .sl-plaque{
  position:absolute; z-index:15; transform:translateX(-50%);
  text-align:center; white-space:nowrap; cursor:pointer; pointer-events:auto;
  font-family:'Noto Serif KR',serif; font-weight:300;
  text-shadow:0 1px 3px rgba(0,0,0,.4);
}
.floor-content[data-floor="1"] .sl-plaque .p-name{
  font-size:.56em; letter-spacing:.04em; color:#f2ead6;
}
.floor-content[data-floor="1"] .sl-plaque .p-artist{
  font-family:'Cormorant Garamond',serif; font-size:.46em; letter-spacing:.16em;
  color:rgba(232,221,196,.72); margin-top:.3em;
}
.floor-content[data-floor="1"] .sl-plaque .p-voice{
  display:none; margin-top:.42em; font-size:.46em; letter-spacing:.06em;
  color:rgba(232,214,168,.92); cursor:pointer; user-select:none;
}
.floor-content[data-floor="1"] .sl-plaque .p-voice.on{ display:block; }
.floor-content[data-floor="1"] .sl-plaque .p-voice:hover{ color:#f6ecd2; }
.floor-content[data-floor="1"] .sl-plaque .p-voice .vd{ opacity:.55; margin-left:.4em; font-size:.92em; }
/* 흰 벽에 상아색을 얹으면 글자가 벽에 먹힌다 — 재서 뒤집는다 */
.floor-content[data-floor="1"] .sl-plaque.ink-dark{ text-shadow:0 1px 2px rgba(255,255,255,.32); }
.floor-content[data-floor="1"] .sl-plaque.ink-dark .p-name{ color:#2a2318; }
.floor-content[data-floor="1"] .sl-plaque.ink-dark .p-artist{ color:rgba(42,35,24,.62); }
.floor-content[data-floor="1"] .sl-plaque.ink-dark .p-voice{ color:rgba(90,70,26,.95); }
.floor-content[data-floor="1"] .sl-plaque.ink-dark .p-voice:hover{ color:#3a2c10; }


/* ══════════════════════════════════════════════════════════════════
 *  ⅠF 메시지 보드 · 꽃 티커 — 0809 (옛 갤러리 좌측 벽에서 되살림)
 *
 *  ⭐ 좌표를 손으로 안 적는다. living_rooms.wall_top·wall_bot 두 값에서
 *     글귀판·그림·명패·꽃 넉 곳을 셸이 계산한다(0809 결정).
 *     방이 서른이 되어도 손으로 맞출 값은 방마다 둘뿐이다.
 *
 *  ⚠ 글자는 언제나 먹(#16130F)이고, 밝기는 **띠가 책임진다.**
 *    벽 밝기가 방마다(95~237) 또 시각마다 갈리므로 글자색을 흔들면 답이 없다.
 *    띠 색은 그 그림의 글귀판 구역에서 직접 뽑아 그 방의 빛을 입는다.
 *
 *  ⚠ 색을 재기 전에는 글귀판을 **그리지 않는다.** 폴백은 대신 서는 것이지
 *    먼저 서는 것이 아니다(0808 조항).
 * ══════════════════════════════════════════════════════════════════ */

/* 글자 크기는 무대 폭을 따라간다 — JS가 .sl-stage의 font-size를 px로 넣고
   아래는 전부 em을 쓴다. 폰에서도 노트북에서도 벽에 대한 비율이 같다. */

/* ── 글귀 — 벽에 새긴다. 박스 없음 (0809 소로: 「미술관 명패처럼」) ──
   ⭐ 잉크는 미술관 명패와 같은 부품이다 — 그 구역 벽을 재서 상아색과 먹색 중
      대비가 큰 쪽을 고른다. 벽 밝기가 방마다(95~237) 또 시각마다 갈리므로
      관마다 고정값을 박는 방식은 무너진다(galerie 0805 계보). */
.floor-content[data-floor="1"] .sl-mw{
  position:absolute; z-index:14; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; box-sizing:border-box; pointer-events:none;
  font-family:'Noto Serif KR',serif; font-weight:300;
  color:#f2ead6; text-shadow:0 1px 3px rgba(0,0,0,.42);
}
.floor-content[data-floor="1"] .sl-mw.ink-dark{
  color:#2a2318; text-shadow:0 1px 2px rgba(255,255,255,.34);
}
.floor-content[data-floor="1"] .sl-mw-nick{
  font-family:'Cormorant Garamond',serif;
  font-size:.6em; letter-spacing:.34em; opacity:.5; margin-bottom:.55em;
  text-transform:uppercase; white-space:nowrap;
}
.floor-content[data-floor="1"] .sl-mw-title{
  font-size:.66em; letter-spacing:.12em; opacity:.66; margin-bottom:.95em;
}
.floor-content[data-floor="1"] .sl-mw-body{
  font-size:.94em; line-height:1.95; white-space:pre-wrap; max-width:30em;
}
.floor-content[data-floor="1"] .sl-mw-sig{
  font-size:.62em; opacity:.55; margin-top:1.05em; font-style:italic;
}
.floor-content[data-floor="1"] .sl-mw-empty{
  font-size:.72em; opacity:.4; line-height:2;
}

/* ── 통합 손잡이 — 엘리베이터 아래. 같은 재질이라 한 식구로 보인다 ── */
.floor-content[data-floor="1"] .sl-dock{
  position:absolute; right:var(--dock-r, 3%); top:var(--dock-t, 66%);
  transform:translateY(-50%);
  z-index:31; display:flex; flex-direction:column; align-items:center; gap:7px;
}
/* 맞추는 중 — 끌 수 있게 점선을 두른다 */
.floor-content[data-floor="1"] .sl-dock.editing,
.room-elevator.editing{
  outline:2px dashed rgba(150,200,160,.9); outline-offset:5px; border-radius:10px; cursor:move;
}
.floor-content[data-floor="1"] .sl-dock-h{
  width:34px; height:34px; border-radius:50%; cursor:pointer; padding:0;
  background:linear-gradient(180deg,rgba(60,42,24,.9),rgba(34,22,12,.95));
  border:1px solid color-mix(in srgb, var(--floor-accent) 50%, transparent);
  color:var(--floor-accent); font-size:15px; line-height:1;
  transition:background .2s, transform .15s;
}
.floor-content[data-floor="1"] .sl-dock-h:hover{
  background:linear-gradient(180deg,rgba(90,62,34,.95),rgba(50,34,18,1));
}
.floor-content[data-floor="1"] .sl-dock-h:active{ transform:scale(.94); }
.floor-content[data-floor="1"] .sl-dock-h.on{
  background:linear-gradient(180deg,rgba(201,168,76,.9),rgba(160,128,52,.95)); color:#241a12;
}
.floor-content[data-floor="1"] .sl-dock-menu{
  display:flex; flex-direction:column; gap:6px; align-items:center;
}
.floor-content[data-floor="1"] .sl-dock-menu[hidden]{ display:none !important; }
.floor-content[data-floor="1"] .sl-dock-b{
  width:34px; height:34px; border-radius:50%; cursor:pointer; padding:0;
  background:rgba(24,16,10,.86);
  border:1px solid color-mix(in srgb, var(--floor-accent) 38%, transparent);
  color:var(--floor-text-dim); font-size:14px; line-height:1;
  transition:background .2s, color .2s, border-color .2s;
}
.floor-content[data-floor="1"] .sl-dock-b:hover{
  background:rgba(60,40,20,.94); color:var(--floor-accent);
  border-color:color-mix(in srgb, var(--floor-accent) 70%, transparent);
}

/* 꽃 티커 — 콘솔 상판 위에 앉는다. 바닥선이 wall_bot */
.floor-content[data-floor="1"] .sl-tick{
  position:absolute; z-index:13; transform:translateX(-50%);
  overflow:hidden; display:flex; align-items:flex-end;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
}
.floor-content[data-floor="1"] .sl-tick-track{
  display:inline-flex; align-items:flex-end; white-space:nowrap; height:100%;
  will-change:transform;
  animation:sl-tick-flow var(--sl-tick-dur, 60s) linear infinite;
}
.floor-content[data-floor="1"] .sl-tick:hover .sl-tick-track{ animation-play-state:paused; }
.floor-content[data-floor="1"] .sl-tick-chip{
  display:inline-flex; align-items:flex-end; gap:.4em; padding:0 1.5em 0 0;
  font-family:'Noto Serif KR',serif; font-size:.62em; font-weight:300;
  color:var(--sl-tick-ink,#f0ebe0); text-shadow:var(--sl-tick-shadow, 0 1px 3px rgba(0,0,0,.5));
}
.floor-content[data-floor="1"] .sl-tick-chip img{
  height:2.6em; width:auto; object-fit:contain; flex:0 0 auto;
  filter:drop-shadow(0 .1em .25em rgba(0,0,0,.45));
}
.floor-content[data-floor="1"] .sl-tick-chip b{ font-weight:500; opacity:.95; }
.floor-content[data-floor="1"] .sl-tick-chip i{ font-style:normal; opacity:.72; }
@keyframes sl-tick-flow{ from{transform:translateX(0)} to{transform:translateX(-50%)} }
@media (prefers-reduced-motion: reduce){
  .floor-content[data-floor="1"] .sl-tick-track{ animation:none; }
}

/* 글귀 쓰기 · 꽃 두기 모달 (옛 갤러리 mw-modal을 EG 종이색으로) */
.sl-modal{
  position:fixed; inset:0; z-index:9999; background:rgba(14,10,7,.74);
  display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto;
}
.sl-box{
  background:linear-gradient(180deg,#241a12,#1a120c);
  border:1px solid rgba(201,168,76,.45); border-radius:14px;
  padding:26px 28px; width:min(520px,92vw); box-sizing:border-box;
  max-height:90vh; overflow-y:auto; color:#f0ebe0;
  font-family:'Noto Serif KR',serif; font-weight:300;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.sl-box h3{ margin:0 0 6px; font-size:18px; color:#e9cf9c; letter-spacing:.06em; font-weight:400; }

/* ── 배치 맞추기 — 미술관 문법. 끌어 옮기고 모서리로 키운다 (0809 소로) ──

/* ============================================================
 *  ⅢF 책의 방 (Bibliothèque) — 전부 [data-floor="3"] 스코프
 *  원본 hello_books_v1.6 → 셸 통합. 전역 html,body 제거,
 *  fixed → absolute (층 콘텐츠 박스 기준), z-index 셸 체계로.
 * ============================================================ */
.floor-content[data-floor="3"] {
  --c-amber: #f0d8a8; --c-amber-dim: #b89968; --c-amber-dark: #6b5838;
  font-family: 'Cormorant Garamond', 'Noto Serif KR', Georgia, serif;
  color: var(--c-amber);
}
.floor-content[data-floor="3"] .stage {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
}
.floor-content[data-floor="3"] .room {
  position: relative; width: 100%; max-width: 1672px;
  aspect-ratio: 1672 / 941;
  /* 0809: 배경은 JS가 study_NN_{m·d·e·n}.webp로 넣는다. 옛 bookshelf_01 참조 철거 */
  background-color: #2a1410; overflow: hidden;
}
.floor-content[data-floor="3"] .bk-bg-layer {
  position: absolute; inset: 0; background-size: cover; background-position: center;
  transition: opacity 0.9s ease; z-index: 0; pointer-events: none;
}
.floor-content[data-floor="3"] .pendant-sway {
  position: absolute; left: 50%; top: 0; width: 30%; height: 30%;
  transform: translateX(-50%); pointer-events: none;
  animation: bk-pendant-sway 45s ease-in-out infinite;
  transform-origin: 50% 0%; z-index: 2;
}
@keyframes bk-pendant-sway {
  0%, 100% { transform: translateX(-50%) rotate(0deg); }
  25%      { transform: translateX(-50%) rotate(0.15deg); }
  75%      { transform: translateX(-50%) rotate(-0.15deg); }
}
.floor-content[data-floor="3"] .pendant-glow {
  position: absolute; left: 50%; top: 25%; width: 14%; aspect-ratio: 1;
  transform: translate(-50%, -50%); border-radius: 50%;
  pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(circle, rgba(255,220,150,0.45) 0%, rgba(255,200,120,0.25) 30%, rgba(255,180,100,0.10) 60%, transparent 100%);
  filter: blur(8px); animation: bk-pendant-breath 4s ease-in-out infinite;
}
@keyframes bk-pendant-breath {
  0%, 100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
  50%      { opacity: 1.0;  transform: translate(-50%, -50%) scale(1.08); }
}
.floor-content[data-floor="3"] .dust {
  position: absolute; width: 3px; height: 3px;
  background: radial-gradient(circle, rgba(255,220,150,0.7), transparent);
  border-radius: 50%; pointer-events: none; z-index: 4;
}
.floor-content[data-floor="3"] .dust-1 { left: 47%; top: 30%; animation: bk-dust-1 18s ease-in-out infinite; }
.floor-content[data-floor="3"] .dust-2 { left: 52%; top: 35%; animation: bk-dust-2 22s ease-in-out infinite; }
.floor-content[data-floor="3"] .dust-3 { left: 49%; top: 28%; animation: bk-dust-3 25s ease-in-out infinite; }
.floor-content[data-floor="3"] .dust-4 { left: 53%; top: 32%; animation: bk-dust-4 20s ease-in-out infinite; }
.floor-content[data-floor="3"] .dust-5 { left: 48%; top: 34%; animation: bk-dust-5 28s ease-in-out infinite; }
@keyframes bk-dust-1 { 0%,100% {transform:translate(0,0);opacity:.3} 25% {transform:translate(8px,-12px);opacity:.7} 50% {transform:translate(-4px,-20px);opacity:.5} 75% {transform:translate(-10px,-8px);opacity:.6} }
@keyframes bk-dust-2 { 0%,100% {transform:translate(0,0);opacity:.4} 33% {transform:translate(-12px,10px);opacity:.8} 66% {transform:translate(6px,-15px);opacity:.5} }
@keyframes bk-dust-3 { 0%,100% {transform:translate(0,0);opacity:.2} 50% {transform:translate(15px,18px);opacity:.6} }
@keyframes bk-dust-4 { 0%,100% {transform:translate(0,0);opacity:.5} 25% {transform:translate(-8px,-10px);opacity:.7} 75% {transform:translate(12px,6px);opacity:.4} }
@keyframes bk-dust-5 { 0%,100% {transform:translate(0,0);opacity:.3} 40% {transform:translate(-15px,8px);opacity:.6} 80% {transform:translate(10px,-12px);opacity:.5} }

.floor-content[data-floor="3"] .cover-stack { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
.floor-content[data-floor="3"] .cover-page {
  position: absolute; inset: 0; opacity: 0; pointer-events: none;

}

.floor-content[data-floor="3"] .cover-book {

/* ── ＋ 책추가하기 버튼 (✎ 배치 바꾸기 바로 위) ── */
.floor-content[data-floor="3"] .bk-add-toggle {

}

/* ── 책 검색·들이기 모달 (화면 전역 오버레이) ── */
#bk-add-modal { position: fixed; inset: 0; z-index: 200; display: none;

/* === FlipBook 모달 — 레이어 2(z 50대)로 진입, 셸 엘리베이터(z200) 아래 === */
.book-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0); z-index: 60;
  pointer-events: none; opacity: 0; visibility: hidden;

}
.book-modal .book {
  position: relative; display: flex; margin: auto;
  width: 32cqmin; pointer-events: none; transform-style: preserve-3d;
  transition: translate 1s; translate: calc(min(var(--c), 1) * 50%) 0%;
  rotate: 1 0 0 18deg;
}
.book-modal .page {
  --thickness: 4; flex: none; display: flex; width: 100%;
  font-size: 1.8cqmin; pointer-events: all; user-select: none;
  transform-style: preserve-3d; transform-origin: left center;
  transition: transform 1s, rotate 1s ease-in calc((min(var(--i), var(--c)) - max(var(--i), var(--c))) * 50ms);
  translate: calc(var(--i) * -100%) 0px 0px;
  transform: translateZ(calc((var(--c) - var(--i) - 0.5) * calc(var(--thickness) * .23cqmin)));
  rotate: 0 1 0 calc(clamp(0, var(--c) - var(--i), 1) * -180deg);
  cursor: pointer; box-shadow: 0 .5em 1em -.2em #00000020;
}
.book-modal .front, .book-modal .back {
  position: relative; flex: none; width: 100%; aspect-ratio: 1 / 1.47; backface-visibility: hidden;
  overflow: hidden; background-color: #fff; translate: 0px;
  display: flex; flex-flow: column nowrap; justify-content: flex-start;
  padding: 2.6em 2.4em 3.4em; border: 1px solid #0002;
}
.book-modal .front:has(.cover-bg), .book-modal .back:has(.cover-bg) { padding: 0; }
.book-modal .back { translate: -100% 0; rotate: 0 1 0 180deg; }
.book-modal .book { counter-reset: page -1; }
.book-modal .front::after, .book-modal .back::after {
  position: absolute; bottom: 1em; counter-increment: page; content: counter(page) ".";
  font-size: 0.75em; color: #b8a880; font-style: italic;
}
.book-modal .front::after { right: 1.5em; }
.book-modal .back::after  { left: 1.5em; }
.book-modal .cover::after { content: ""; }
.book-modal .front { background: linear-gradient(to left, #faf7f0 80%, #f0ebe0 100%); border-radius: .1em .5em .5em .1em; }
.book-modal .back  { background-image: linear-gradient(to right, #faf7f0 80%, #f0ebe0 100%); border-radius: .5em .1em .1em .5em; }
.book-modal .cover { color: hsl(200 30% 98%); padding: 0; }
.book-modal .cover-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.book-modal .page-content { width: 100%; height: 100%; display: flex; flex-direction: column; color: #1a1410; font-family: 'Cormorant Garamond', 'Noto Serif KR', Georgia, serif; }
.book-modal .page-content h2 { font-size: 1.25em; font-weight: 600; color: #2a1810; margin-bottom: 0.9em; line-height: 1.4; }
.book-modal .page-content p { font-size: 0.95em; line-height: 1.8; margin-bottom: 0.6em; text-align: justify; text-justify: inter-character; word-break: break-all; line-break: strict; overflow-wrap: anywhere; }
.book-modal .page-content .author-line { margin-top: auto; padding-top: 1em; font-style: italic; color: #8a7654; text-align: right; font-size: 0.85em; }
.book-modal .page-content .chapter-mark { font-style: italic; color: #b8a880; font-size: 0.8em; margin-bottom: 0.5em; letter-spacing: 0.1em; }
.book-modal .page-end { width: 100%; height: 100%; box-sizing: border-box; padding: 0 3.6em; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #2a1810; }
.book-modal .page-end h2 { font-style: italic; margin-bottom: 1em; font-size: 1.3em; }

.book-modal .modal-close {

/* ════════════════════════════════════════════════════════════
 *  ⅡF 책의 방 0809 재건축 — 세로 무대 · 자석 자리 · 조종간
 *  ⚠ 위쪽 옛 규칙을 덮는다. 순서를 바꾸면 옛 가로 무대가 되살아난다
 * ════════════════════════════════════════════════════════════ */
/* 무대 — 뮤세움 문법 세 겹. 가로 폭에 맞추고 위아래로 스크롤한다.
   ⚠ aspect-ratio로 상자를 만들면 화면 높이에 갇혀 폭이 좁아지고 스크롤이 0이 된다.
     그러면 카메라가 붙을 자리도 없다(0809 내가 낸 사고). */
.floor-content[data-floor="3"] .bk-scroll{
  position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
  overflow-anchor:none;                          /* 그림이 늦게 커도 스크롤이 안 밀린다 */
  scrollbar-width:none; -ms-overflow-style:none;
  background:linear-gradient(168deg,#2a1d18 0%,#20160f 55%,#120c08 100%);
}
.floor-content[data-floor="3"] .bk-scroll::-webkit-scrollbar{ display:none; width:0; height:0; }
.floor-content[data-floor="3"] .bk-fit{
  position:relative; margin:0 auto;
  width:min(100%, var(--bk-maxw, 1440px));
}
.floor-content[data-floor="3"] #bk-img{
  display:block; width:100%; height:auto;
  opacity:0; transition:opacity .7s ease;
}
.floor-content[data-floor="3"] #bk-img.on{ opacity:1; }
.floor-content[data-floor="3"] .cover-stack{
  position:absolute; inset:0; z-index:5; pointer-events:none;
}
/* ⭐ 자석 — top이 밑줄, left가 가운뎃줄. 키워도 이 둘이 안 움직인다 */
.floor-content[data-floor="3"] .cover-book{
  position:absolute; cursor:pointer; transform:translate(-50%,-100%);
  transition:transform .3s ease, filter .3s ease;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.62));
}
.floor-content[data-floor="3"] .cover-book img{ height:100%; width:auto; display:block; }
.floor-content[data-floor="3"] .cover-book:hover{
  transform:translate(-50%,-100%) translateY(-7px) scale(1.04);
  filter:drop-shadow(0 8px 15px rgba(0,0,0,.8)); z-index:10;
}
.floor-content[data-floor="3"].editing .cover-book:hover{
  transform:translate(-50%,-100%); filter:drop-shadow(0 3px 7px rgba(0,0,0,.62));
}
/* 조종간 — 엘리베이터 아래 ⋮ 하나, 눌러서 갈린다 (거실 도크 문법) */
.floor-content[data-floor="3"] .bk-dock{
  position:absolute; right:3.2%; top:31%;
  z-index:31; display:flex; flex-direction:column; align-items:center; gap:7px;
}
.floor-content[data-floor="3"] .bk-dock[hidden]{ display:none !important; }
.floor-content[data-floor="3"] .bk-dock-h,
.floor-content[data-floor="3"] .bk-dock-b{
  width:34px; height:34px; border-radius:50%; cursor:pointer; padding:0;
  font-size:15px; line-height:1; transition:background .2s, transform .15s, color .2s;
}
.floor-content[data-floor="3"] .bk-dock-h{
  background:linear-gradient(180deg,rgba(60,42,24,.9),rgba(34,22,12,.95));
  border:1px solid color-mix(in srgb, var(--floor-accent) 50%, transparent);
  color:var(--floor-accent);
}
.floor-content[data-floor="3"] .bk-dock-h:hover{
  background:linear-gradient(180deg,rgba(90,62,34,.95),rgba(50,34,18,1));
}
.floor-content[data-floor="3"] .bk-dock-h:active{ transform:scale(.94); }
.floor-content[data-floor="3"] .bk-dock-h.on{
  background:linear-gradient(180deg,rgba(201,168,76,.9),rgba(160,128,52,.95)); color:#241a12;
}
.floor-content[data-floor="3"] .bk-dock-menu{ display:flex; flex-direction:column; gap:6px; }
.floor-content[data-floor="3"] .bk-dock-menu[hidden]{ display:none !important; }
.floor-content[data-floor="3"] .bk-dock-b{

}
.floor-content[data-floor="3"] .bk-dock-b:hover{

/* ⚖ 줄자 — 그림과 같은 좌표계(fit) 위에 얹힌다 */
.floor-content[data-floor="3"] .bk-rule{ position:absolute; inset:0; z-index:20; }

.floor-content[data-floor="3"] .bk-rline{ position:absolute; }
.floor-content[data-floor="3"] .bk-rline.h{

.floor-content[data-floor="3"] .bk-rsave{

/* ============================================================
 *  전환 — 엘리베이터 (z 200)
 *  구조: [상단 안내 bar] + [그 아래 좌우 문]
 * ============================================================ */
.elevator { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
.elevator.active { pointer-events: auto; }

/* --- 상단 안내 bar (문에서 분리·탑승 중 늘 떠 있음) --- */
.elevator-bar {
  position: absolute; top: 0; left: 50%; transform: translate(-50%, -100%);
  display: flex; align-items: center; gap: 12px;
  padding: 14px 26px 16px;
  background: linear-gradient(180deg, #2a1d0c 0%, #1a1206 70%, #120c04 100%);
  border: 1px solid rgba(201,168,76,0.45);
  border-top: none;
  border-radius: 0 0 14px 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 -2px 10px rgba(0,0,0,0.5);
  z-index: 3; /* 문보다 위 */
  transition: transform 0.5s cubic-bezier(0.3,0.8,0.3,1);
}
.elevator.riding .elevator-bar { transform: translate(-50%, 0); } /* 탑승 중 내려와 자리잡음 */

.dial-lamp {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif; font-size: 17px;
  color: rgba(201,168,76,0.30);
  border: 1px solid rgba(201,168,76,0.22);
  background: radial-gradient(circle at 40% 35%, rgba(40,30,16,0.8), rgba(15,10,4,0.9));
  transition: all 0.18s ease;
}
.dial-lamp.lit {
  color: #1a1208;
  background: radial-gradient(circle at 40% 35%, #ffe7a0, #d8a838);
  border-color: #ffe7a0;
  box-shadow: 0 0 20px rgba(255,210,120,0.85);
  transform: scale(1.06);
}

/* --- 좌우 문 (bar 아래에서만 여닫이) --- */
.doors {
  position: absolute; left: 0; right: 0; bottom: 0;
  top: 0; /* 0628: 문을 화면 맨 위까지 — 등불 bar(z3)를 그 위에 포갬 */
  z-index: 1;
}
.door {
  position: absolute; top: 0; bottom: 0; width: 50.5%;
  background-image: url('elevator_01.webp');
  background-size: 200% 100%;   /* 두 짝 합쳐 한 장 — 세로 결이라 가로 늘어남 안 보임 */
  background-repeat: no-repeat;
  background-color: #241808;     /* 이미지 로딩 전 fallback */
  box-shadow: inset 0 0 120px rgba(0,0,0,0.45);
  transition: transform var(--t-open-dur) cubic-bezier(0.55, 0, 0.30, 1);
}
.door::before {
  content: ''; position: absolute; inset: 0;
  box-shadow: inset 0 0 70px rgba(0,0,0,0.35);
  pointer-events: none;
}
.door-left  { left: 0;  transform: translateX(-101%); background-position: left center; }
.door-right { right: 0; transform: translateX(101%); background-position: right center; }
.elevator.closing .door-left,
.elevator.closing .door-right { transform: translateX(0); }

.door-seam {
  position: absolute; top: 0; bottom: 0; left: 50%; width: 2px;
  transform: translateX(-50%); z-index: 2;
  background: linear-gradient(180deg, transparent, rgba(240,210,120,0.5), transparent);
  opacity: 0; transition: opacity 0.3s;
}
.elevator.closing .door-seam { opacity: 1; }

/* ===== 첫 진입 힌트 / 버전 ===== */
.boot-hint {
  position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
  font-family: 'Cormorant Garamond', serif; font-size: 11px; letter-spacing: 2px;
  color: rgba(240,216,168,0.45); z-index: 100; text-align: center; pointer-events: none;
  transition: opacity 0.6s; line-height: 1.7;
}
.version-badge {
  position: fixed; top: 22px; right: 22px; z-index: 100;

}
/* ── 헤리티지 도착 팝업 ── */
#arrival-overlay {
  position: fixed; inset: 0; z-index: 9000;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.8s;
  pointer-events: none;
}
#arrival-overlay.show { opacity: 1; pointer-events: auto; }
#arrival-confetti { position: fixed; inset: 0; z-index: 8999; pointer-events: none; }
#arrival-card {
  position: relative; z-index: 9001;
  max-width: 520px; width: 90%; margin: 0 auto;
  text-align: left; padding: 0 12px;
}
#arrival-card .ac-icon { display: none; }
#arrival-card .ac-title {
  font-size: 12px; letter-spacing: 0.22em; color: rgba(200,165,80,0.75);
  margin-bottom: 16px; text-transform: uppercase;
}
#arrival-card .ac-msg {
  font-size: 16px; line-height: 2.0; color: rgba(255,247,228,0.99);
  text-shadow:
    0 1px 2px rgba(0,0,0,1),
    0 2px 8px rgba(0,0,0,0.95),
    0 0 16px rgba(0,0,0,0.9),
    0 0 28px rgba(0,0,0,0.75);
  margin-bottom: 20px; white-space: pre-wrap; font-weight: 500;
}
#arrival-card .ac-cursor {
  display: inline-block; width: 2px; height: 1em;
  background: rgba(200,165,80,0.9); vertical-align: text-bottom;
  animation: blink 0.8s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }
#arrival-card .ac-timer {
  font-size: 11px; color: rgba(220,190,120,0.75);
  letter-spacing: 0.1em; margin-bottom: 14px;
  text-shadow: 0 1px 3px rgba(0,0,0,1), 0 0 10px rgba(0,0,0,0.85);
}
#arrival-card .ac-close {
  background: rgba(10,5,2,0.45); border: 1px solid rgba(180,140,60,0.35);
  color: rgba(200,165,80,0.8); border-radius: 8px;
  padding: 7px 24px; font-size: 12.5px; cursor: pointer;
  letter-spacing: 0.1em; transition: all 0.2s;
  backdrop-filter: blur(4px);
}
#arrival-card .ac-close:hover { background: rgba(30,15,5,0.65); }

/* ============================================================

}
.floor-content[data-floor="1"] .g1-zoom-img{

.floor-content[data-floor="1"] .g1-zoom-x{

.floor-content[data-floor="1"] .g1-zoom-cap{

.floor-content[data-floor="1"] .g1-zoom-cap span{ font-size:12px; opacity:.7; margin-left:9px; font-style:italic; }
.floor-content[data-floor="1"] .g1-zoom-down{

.floor-content[data-floor="1"] .g1-note{

}
.floor-content[data-floor="1"] .g1-note[hidden]{ display:none; }
.floor-content[data-floor="1"] .g1-note-sheet{

}
.floor-content[data-floor="1"] .g1-note-head{ margin-bottom:18px; border-bottom:1px solid rgba(90,58,24,.25); padding-bottom:13px; padding-right:30px; }
.floor-content[data-floor="1"] .g1-note-head .g1-note-t{ font-family:'Cormorant Garamond','Noto Serif KR',serif; font-size:22px; font-weight:600; line-height:1.25; }
.floor-content[data-floor="1"] .g1-note-head .g1-note-a{ font-size:13px; font-style:italic; opacity:.7; margin-top:5px; }

/* 2D 클릭 핫스팟 — 3D 액자 위에 화면 좌표로 깔린다 (rotateY 벽 클릭 우회) */
.floor-content[data-floor="1"] .g1-hotspots{ position:absolute; inset:0; z-index:15; pointer-events:none; }
.floor-content[data-floor="1"] .g1-hotspot{ position:absolute; pointer-events:auto; }
.floor-content[data-floor="1"] .g1-hotspot-art{ cursor:zoom-in; }
.floor-content[data-floor="1"] .g1-hotspot-plaque{ cursor:pointer; }
/* ── ⅣF Sanctuaire · 내 교양의 지성소 ───────────────────────
   배경=4:5 세로 무대(천장↔마루 스크롤) · 스크롤바 숨김 · 화살표/roomtag=헤리티지 */
.floor-content[data-floor="4"]{ overflow:hidden; background:#140a0e; }
.floor-content[data-floor="4"] .f4-scroll{
  position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
  scrollbar-width:none; -ms-overflow-style:none;
}

.floor-content[data-floor="4"] .f4-stage{
  position:relative; width:100%; aspect-ratio:4/5; min-height:100%;
}
.floor-content[data-floor="4"] .f4-bgwrap{ position:absolute; inset:0; z-index:0; }
.floor-content[data-floor="4"] .f4-bg-layer{
  position:absolute; inset:0;
  background-size:100% 100%; background-position:center; background-repeat:no-repeat;
  transition:opacity .7s ease; pointer-events:none;
}
.floor-content[data-floor="4"] .f4-shelf{
  position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
  z-index:2; display:flex; justify-content:center; pointer-events:none;
}
.floor-content[data-floor="4"] .f4-shelfwrap{ pointer-events:auto; max-width:min(680px,86vw); width:100%; }
.floor-content[data-floor="4"] .f4-books{
  display:flex; align-items:flex-end; justify-content:center; gap:3px;
  overflow-x:auto; scrollbar-width:none; padding:0 14px; min-height:210px;
}
.floor-content[data-floor="4"] .f4-books::-webkit-scrollbar{ display:none; }
.floor-content[data-floor="4"] .f4-wood{
  height:6px; background:linear-gradient(to bottom,#3D2A0E,#2A1A08);
  margin:4px 14px 0; border-radius:1px; box-shadow:0 3px 10px rgba(0,0,0,.55);
}
.floor-content[data-floor="4"] .f4-book{
  flex:0 0 auto; position:relative; cursor:pointer; transition:transform .2s ease;
  display:flex; flex-direction:column; align-items:center;
}
.floor-content[data-floor="4"] .f4-book:hover{ transform:translateY(-7px); }
.floor-content[data-floor="4"] .f4-book-img{
  display:block; width:auto; max-width:66px; min-width:30px;

}
.floor-content[data-floor="4"] .f4-book-text{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  writing-mode:vertical-rl; text-orientation:mixed;
  font-size:11px; font-weight:500; color:rgba(255,255,255,.92);
  letter-spacing:.05em; line-height:1.25; padding:9px 2px; overflow:hidden;
  text-shadow:0 1px 3px rgba(0,0,0,.95), 0 0 5px rgba(0,0,0,.65); pointer-events:none;
}
.floor-content[data-floor="4"] .f4-empty{
  position:absolute; left:50%; bottom:66px; transform:translateX(-50%); z-index:20;
  color:rgba(232,212,160,.55); font-size:clamp(12px,1.4vw,15px);
  letter-spacing:.16em; text-align:center; text-shadow:0 2px 22px rgba(0,0,0,.92);
  white-space:nowrap; pointer-events:none;
}
/* 방 넘김 화살표 — 헤리티지 .nav (원형 황동 유리블러) */
.floor-content[data-floor="4"] .f4-nav{
  position:absolute; top:50%; transform:translateY(-50%); z-index:30;
  width:52px; height:52px; border-radius:50%;
  border:1px solid rgba(212,184,120,.62); background:rgba(40,22,18,.5);
  color:#e8c987; font-size:26px; cursor:pointer;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  display:flex; align-items:center; justify-content:center;
  transition:transform .2s ease, background .2s ease;
}
.floor-content[data-floor="4"] .f4-nav:hover{ background:rgba(60,34,24,.66); }
.floor-content[data-floor="4"] .f4-nav:active{ transform:translateY(-50%) scale(.92); }
.floor-content[data-floor="4"] .f4-nav-l{ left:14px; }
.floor-content[data-floor="4"] .f4-nav-r{ right:14px; }
/* 방 이름 — 헤리티지 .roomtag (떴다 사라짐) */
.floor-content[data-floor="4"] .f4-roomtag{
  position:absolute; left:50%; top:22%; transform:translate(-50%,-50%);
  z-index:45; text-align:center; pointer-events:none;
  font-family:'Noto Sans KR',sans-serif; font-weight:100;
  font-size:clamp(24px,5vw,40px); letter-spacing:.42em; color:#f0d8a8;
  text-shadow:0 2px 30px rgba(0,0,0,.95); opacity:0; transition:opacity .45s ease;
}
.floor-content[data-floor="4"] .f4-roomtag.on{ opacity:1; }
.floor-content[data-floor="4"] .f4-roomtag small{
  display:block; font-family:'Noto Sans KR',sans-serif; font-weight:100;
  font-size:.42em; letter-spacing:.32em; opacity:.72; margin-top:14px;
}
/* 상단 상시 카테고리 (SANCTUAIRE 아래) */
.floor-label .fl-cat{
  font-size:11px; letter-spacing:3px; color:var(--floor-accent); margin-top:5px;
  font-family:'Cormorant Garamond', Georgia, serif;
}
.floor-label .fl-cat span{ opacity:.55; font-size:10px; letter-spacing:2px; }
/* 하단 방 탭 (절충 — 작은 글자 12개) */
.floor-content[data-floor="4"] .f4-tabs{
  position:absolute; left:50%; bottom:18px; transform:translateX(-50%); z-index:35;
  display:flex; gap:1px; flex-wrap:nowrap; padding:6px 10px; border-radius:30px;
  background:rgba(20,10,8,.42); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  max-width:92vw; overflow-x:auto; scrollbar-width:none;
}
.floor-content[data-floor="4"] .f4-tabs::-webkit-scrollbar{ display:none; }
.floor-content[data-floor="4"] .f4-tab{
  flex:0 0 auto; background:none; border:none; cursor:pointer;
  font-family:'Cormorant Garamond', Georgia, serif; font-size:13px;
  color:rgba(232,212,160,.42); letter-spacing:1px; padding:4px 9px; border-radius:14px;
  transition:color .25s ease, background .25s ease;
}
.floor-content[data-floor="4"] .f4-tab:hover{ color:rgba(232,212,160,.78); }
.floor-content[data-floor="4"] .f4-tab.active{
  color:#1a0e08; background:var(--floor-accent); font-weight:600;
}
/* ═══ [3단계] 4층 책 모달 — 뮤세움 4레이어 이식 (f4 격리) ═══ */
  /* ── 책 모달 오버레이 ── */
  .f4book-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(42,32,20,0.0);
    z-index: 9500;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: background 1.2s ease;
  }
  .f4book-modal-overlay.open { display: flex; }
  .f4book-modal-overlay.bg-light { background: rgba(200,190,170,0.85); }

  /* ── 3D 표지 씬 ── */
  .f4cover-scene {
    perspective: 900px;
    perspective-origin: 50% 45%;
    position: relative;
  }
  .f4cover-book-3d {
    width: 200px; height: 280px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateY(-26deg) rotateX(4deg);
    transition: transform 0.5s cubic-bezier(0.23,1,0.32,1);
    will-change: transform;
    cursor: pointer;
  }
  .f4cover-face-front {
    position: absolute;
    width: 200px; height: 280px;
    border-radius: 0 5px 5px 0;
    overflow: hidden;
    backface-visibility: hidden;
    box-shadow: inset -3px 0 8px rgba(0,0,0,0.1);
    pointer-events: none;
  }
  .f4cover-book-3d {
    width: 200px; height: 280px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateY(-26deg) rotateX(4deg);
    transition: transform 0.5s cubic-bezier(0.23,1,0.32,1);
    will-change: transform;
    cursor: pointer;
    pointer-events: all;
  }
  .f4cover-gloss {
    position: absolute; top:0; left:0;
    width:52%; height:100%;
    background: linear-gradient(to right,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.05) 55%,transparent 100%);
    pointer-events:none; z-index:20;
  }
  .f4cover-holo {
    position:absolute; inset:0;
    background: linear-gradient(118deg,transparent 0%,rgba(255,80,140,0.07) 18%,rgba(80,200,255,0.09) 34%,rgba(100,255,140,0.07) 50%,rgba(255,210,50,0.08) 66%,rgba(180,80,255,0.07) 82%,transparent 100%);
    mix-blend-mode:screen; pointer-events:none; z-index:19; opacity:0.55;
  }
  .f4cover-face-spine {
    position:absolute;
    width:72px; height:280px;
    left:-72px; top:0;
    transform-origin:right center;
    transform:rotateY(-90deg);
    border-radius:4px 0 0 4px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .f4cover-face-spine::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(to right,rgba(0,0,0,0.3),transparent 55%);
  }
  .f4cover-spine-text {
    writing-mode:vertical-rl; transform:rotate(180deg);
    font-size:0.54rem; letter-spacing:0.14em;
    position:relative; z-index:1;
    white-space:nowrap; overflow:hidden; max-height:88%;
    font-family:'Noto Serif KR',serif; font-weight:600;
  }
  .f4cover-shadow {
    position:absolute;
    bottom:-44px; left:-80px;
    width:280px; height:55px;
    background:radial-gradient(ellipse at 45% 5%,rgba(0,0,0,0.45) 0%,rgba(0,0,0,0.15) 40%,transparent 70%);
    transform:rotateX(90deg) scaleY(0.5);
    filter:blur(10px); pointer-events:none;
    transition:opacity 0.4s;
  }
  .f4cover-eg-sticker {
    position:absolute; width:32px; height:32px;
    border-radius:50%;
    background:conic-gradient(from 0deg,#ff6b9d,#c44dff,#4dc8ff,#4dff91,#fff34d,#ff914d,#ff6b9d);
    z-index:25; box-shadow:0 0 10px rgba(150,100,255,0.35);
    display:flex; align-items:center; justify-content:center;
    font-size:0.4rem; font-weight:700; color:rgba(255,255,255,0.9);
    font-family:'Cormorant Garamond',serif;
    bottom:28px; right:10px;
  }
  .f4cover-hint {
    position:absolute; bottom:-36px; left:50%;
    transform:translateX(-50%);
    font-size:0.58rem; letter-spacing:0.15em;
    color:rgba(201,168,76,0.5);
    white-space:nowrap;
    transition:opacity 0.3s;
  }

  /* ── 내부 페이지 래퍼 (3D 표지에서 전환) ── */

  .f4book-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 340px;
    min-height: 520px;
    height: auto;
    display: flex;
    flex-direction: column;
    overflow: visible;
    border-radius: 2px 12px 12px 2px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    z-index: 9600;
  }
  .f4book-modal.visible {
    visibility: visible;
    pointer-events: all;
  }
  /* active 스타일은 JS showInnerPages에서 직접 style로 제어 */
  /* ── 애플북스 방식: 현재 페이지가 위에서 슬라이드아웃, 다음 페이지는 바닥 고정 ── */
  .f4book-page-view {
    will-change: transform;
    box-sizing: border-box;
  }
  /* active 클래스는 JS에서 style로 직접 제어 */

  /* 표지 */
  .f4page-cover {
    background: #1E1108;
    border-left: 10px solid #120D04;
    height: 460px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 40px 28px 32px;
    position: relative;
    overflow: hidden;
  }
  .f4page-cover::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
    );
  }
  .f4cover-content { position: relative; }
  .f4cover-cat-label {
    font-size: 9px;
    letter-spacing: 0.3em;
    color: rgba(201,168,76,0.5);
    font-family: 'Courier New', monospace;
    margin-bottom: 20px;
  }
  .f4cover-main-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 28px;
    font-weight: 600;
    color: #F8F4EE;
    line-height: 1.3;
    margin-bottom: 16px;
  }
  .f4cover-divider {
    width: 40px; height: 1px;
    background: rgba(201,168,76,0.3);
    margin-bottom: 16px;
  }
  .f4cover-keyword-text {
    font-size: 12px;
    color: rgba(248,244,238,0.35);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    line-height: 1.7;
  }
  .f4cover-footer { position: relative; display: flex; align-items: center; justify-content: space-between; }
  .f4cover-eg {
    width: 40px; height: 40px;
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: rgba(201,168,76,0.4);
    font-family: 'Cormorant Garamond', serif;
  }
  .f4cover-num {
    font-size: 9px;
    color: rgba(201,168,76,0.25);
    font-family: 'Courier New', monospace;
    letter-spacing: 0.15em;
  }

  /* 내지 */
  .f4page-inner {
    background: #F7F2E8;
    border-left: 10px solid #E8E0CC;
    position: relative;
    overflow-y: auto;
    height: 100%;
  }
  .f4page-lines {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      0deg, transparent, transparent 27px,
      rgba(180,160,120,0.12) 27px, rgba(180,160,120,0.12) 28px
    );
    pointer-events: none;
  }
  .f4page-inner-content {
    position: relative;
    padding: 32px 24px 80px;
    z-index: 15;
  }
  /* 외부 링크가 nav-zone에 가로채이지 않도록 */
  .f4page-inner-content a {
    position: relative;
    z-index: 20;
    pointer-events: auto;

// 이 콩파뇽이 받은 작품 목록 조합 (영구소장 + 대여)
async function buildArrivalList(ownerId, permItems, rentItems) {
  const list = [];
  // 영구 소장
  for (const p of permItems) {
    list.push({ name: p.name, type: 'perm', weeks: null });
  }
  // 대여 — prize만, heritage_items에서 대여기간 계산
  const prizeRents = rentItems.filter(r => r.source === 'prize');
  if (prizeRents.length) {
    const ids = prizeRents.map(r => r.item_id);
    try {
      const metas = await sbFetch(`/rest/v1/heritage_items?id=in.(${ids.join(',')})&select=id,name`) || [];
      const metaMap = {}; metas.forEach(m => metaMap[m.id] = m.name);
      for (const r of prizeRents) {
        const weeks = r.due_at
          ? Math.round((new Date(r.due_at) - new Date(r.starts_at)) / (7 * 86400000))
          : null;
        list.push({ name: metaMap[r.item_id] || r.item_id, type: 'rent', weeks });
      }
    } catch (e) { /* 조용히 */ }
  }
  return list;
}

// 한글 받침 판별 → 조사 자동 선택
function hasJongseong(word) {
  if (!word) return false;
  const last = word.charCodeAt(word.length - 1);
  if (last < 0xAC00 || last > 0xD7A3) return false; // 한글 음절 아님
  return (last - 0xAC00) % 28 !== 0;
}
function josa(word, withJong, withoutJong) {
  return hasJongseong(word) ? withJong : withoutJong;
}

// 개별화 메시지 생성
function buildArrivalMsg(arrivals, nickname) {
  const lines = [];
  for (const a of arrivals) {
    const iga = josa(a.name, '이', '가');   // 수련이 / 무도회가
    if (a.type === 'perm') {
      lines.push(`〈${a.name}〉${iga} ${nickname || ''}님의 분더카머에 영원히 자리합니다.\n이 작품은 오직 한 분의 것 — 유일본으로, 이 갤러리에 영구 소장됩니다.`);
    } else {
      const wk = a.weeks ? `${a.weeks}주` : '한 철';
      lines.push(`〈${a.name}〉${iga} ${nickname || ''}님의 분더카머에 도착했습니다.\n이 작품은 ${wk} 대여로 운영되며, 기간이 마치면 헤리티지에 자동으로 반납됩니다.\n그 동안 즐거운 감상 되세요.`);
    }
  }
  return lines.join('\n\n');
}

// 축포 confetti
function launchConfetti() {
  const canvas = document.getElementById('arrival-confetti');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const COLORS = ['#c8a240','#f0e4b8','#e8c87a','#ffffff','#b8860b','#ffd700'];
  const particles = Array.from({ length: 120 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    r: Math.random() * 5 + 2,
    d: Math.random() * 3 + 1,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    tilt: Math.random() * 10 - 5,
    tiltAngle: 0, tiltSpeed: Math.random() * 0.1 + 0.05
  }));
  let frame;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      ctx.beginPath();
      ctx.lineWidth = p.r;
      ctx.strokeStyle = p.color;
      ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
      ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
      ctx.stroke();
      p.y += p.d; p.tiltAngle += p.tiltSpeed; p.tilt = Math.sin(p.tiltAngle) * 12;
      if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
    }
    frame = requestAnimationFrame(draw);
  }
  draw();
  // 4초 후 confetti 멈춤
  setTimeout(() => { cancelAnimationFrame(frame); ctx.clearRect(0, 0, canvas.width, canvas.height); }, 4000);
}

// 타이핑 효과
// 타이핑 효과음 — game_core.js SND.type()과 동일한 Web Audio API 방식
const _typingAudioCtx = { ctx: null };
function _typeSound() {
  try {
    if (!_typingAudioCtx.ctx)
      _typingAudioCtx.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const c = _typingAudioCtx.ctx;
    const t = c.currentTime;
    const bufLen = Math.floor(c.sampleRate * 0.04);
    const buf = c.createBuffer(1, bufLen, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++)
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufLen, 2.2);
    const src = c.createBufferSource();
    const gain = c.createGain();
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(420 + Math.random() * 120, t);
    filter.Q.value = 2.0;
    src.buffer = buf;
    gain.gain.setValueAtTime(0.06 + Math.random() * 0.02, t);
    src.connect(filter); filter.connect(gain); gain.connect(c.destination);
    src.start(t);
  } catch (e) { /* 소리 실패는 조용히 — 타이핑 표시는 계속 */ }
}

function typeWriter(el, text, speed, onDone) {
  let i = 0;
  let soundTick = 0;
  const cursor = el.querySelector('.ac-cursor');
  function tick() {
    if (i < text.length) {
      const ch = text[i++];
      el.insertBefore(document.createTextNode(ch), cursor);
      // 공백·줄바꿈 제외, 실제 글자 4개마다 한 번만 소리 (속도는 그대로, 소리만 1/4)
      if (ch !== ' ' && ch !== '\n') {
        if (soundTick % 4 === 0) _typeSound();
        soundTick++;
      }
      setTimeout(tick, ch === '\n' ? speed * 4 : speed);
    } else if (onDone) onDone();
  }
  tick();
}

// 팝업 표시
function showArrivalPopup(arrivals, firstTs, lsKey) {

  const msg = buildArrivalMsg(arrivals, nickname);

  // confetti 캔버스

  canvas.id = 'arrival-confetti';
  document.body.appendChild(canvas);

  // 오버레이
  const overlay = document.createElement('div');
  overlay.id = 'arrival-overlay';
  overlay.innerHTML = `
    <div id="arrival-card">
      <div class="ac-msg"><span class="ac-cursor"></span></div>
      <div class="ac-timer" id="ac-timer"></div>
      <button class="ac-close" onclick="closeArrivalPopup()">확인했습니다</button>
    </div>`;
  document.body.appendChild(overlay);

  requestAnimationFrame(() => overlay.classList.add('show'));
  launchConfetti();

  // 타이핑
  const msgEl = overlay.querySelector('.ac-msg');
  typeWriter(msgEl, msg, 28, null);

  // 남은 시간 카운트다운
  const timerEl = overlay.querySelector('#ac-timer');
  function updateTimer() {
    const remain = Math.max(0, firstTs + 60 * 60 * 1000 - Date.now());
    if (remain === 0) { closeArrivalPopup(); return; }
    const m = Math.floor(remain / 60000);
    const s = Math.floor((remain % 60000) / 1000);
    timerEl.textContent = `이 안내는 ${m}분 ${s}초 후 사라집니다`;
  }
  updateTimer();
  const timerInterval = setInterval(updateTimer, 1000);
  overlay._timerInterval = timerInterval;

  // 1시간 후 자동 닫힘
  const autoClose = setTimeout(() => closeArrivalPopup(), firstTs + 60 * 60 * 1000 - Date.now());
  overlay._autoClose = autoClose;
}

function closeArrivalPopup() {
  const ov = document.getElementById('arrival-overlay');
  if (ov) {
    clearInterval(ov._timerInterval);
    clearTimeout(ov._autoClose);
    ov.classList.remove('show');
    setTimeout(() => ov.remove(), 600);
  }
  document.getElementById('arrival-confetti')?.remove();
}

     모듈 이름(Floor3·Floor4·Floor5)은 옛 번호 그대로다. 이름을 바꾸면
     모듈 내부 수백 곳을 함께 고쳐야 하는데 얻는 것이 없다. */
  const body = (n === 4) ? Floor5.markup()      // 액자방  (옛 5층)

  floorLayer.innerHTML = `
    <div class="floor">
      ${body}
      <div class="room-elevator" id="roomLift">
        ${[...FLOORS].reverse().map(x=>
          `<button class="lift${x.n===n?' now':''}" data-f="${x.n}" aria-label="${x.roman}층 ${x.kr}">
             <span class="l-no">${x.roman}</span><span class="l-kr">${x.kr}</span></button>`).join('')}
      </div>
    </div>`;

  floorLabel.innerHTML = `
    <div class="fl-name">${f.fr.toUpperCase()}</div>
    <div class="fl-floor">ÉTAGE ${f.roman} · ${f.kr}</div>
    ${n === 3 ? '<div class="fl-cat" id="fl-cat"></div>' : ''}`;
  floorLabel.style.display = '';

  /* 네 층 바로가기 — 4층에서 1층으로 한 번에 간다 */
  const lift = document.getElementById('roomLift');
  if (lift) lift.addEventListener('click', e=>{
    const b = e.target.closest('.lift'); if (!b) return;
    const to = +b.dataset.f;
    if (to !== n) goToFloor(to);
  });
  applyLiftPos();

  if (n === 4) Floor5.mount();   // 액자방
  if (n === 3) Floor4.mount();   // 치타델레
  if (n === 2) Floor3.mount();   // 서고
  if (n === 1) Salon.mount();    // 거실

  renderAnchorList();
}

/* ============================================================
 *  층 이동 — 4초 효과음 싱크
 *   0    : bar 내려오며 자리잡음 + 문 닫히기 시작 + 소리 재생
 *   1.1s : (철커덩) 문 닫힘 완료
 *   1.4s : (띵동) 출발층 불 꺼지고 목표층 불 딸깍 점등 + 층 교체
 *   2.5s : (스르륵) 문 열리기 시작
 *   3.5s : 문 활짝 → bar 스르륵 올라가 사라짐
 * ============================================================ */
function goToFloor(target) {
  if (transitioning) return;
  if (target < 1 || target > TOP_FLOOR || target === currentFloor) return;
  transitioning = true;
  if (bootHint) bootHint.style.opacity = '0';

  const from = currentFloor;

  // bar 자리잡기 + 출발층 불 + 문 닫힘 시작 + 소리
  syncDoorTop();
  litLamp(from);
  elevator.classList.add('active', 'riding', 'closing');
  playSfx();

  // 1.4s 띵동 — 목표층 불 딸깍 + 층 콘텐츠 교체 (문 닫힌 뒤라 안 보임)
  setTimeout(() => {
    currentFloor = target;
    renderFloor(target);
    syncDoorTop();
    litLamp(target);
  }, SFX.ding);

  // 2.5s 스르륵 — 문 열림 시작
  setTimeout(() => {
    elevator.classList.remove('closing');
  }, SFX.open);

  // 3.5s 문 활짝 — bar 사라지고 정리
  setTimeout(() => {
    elevator.classList.remove('riding'); // bar 위로 사라짐
    setTimeout(() => {
      elevator.classList.remove('active');
      transitioning = false;
    }, 500);
  }, SFX.end);
}

/* ============================================================
 *  Ⅲ층 책의 방 모듈 (Floor3) — 원본 hello_books_v1.6 통합
 *    markup()  : 층 콘텐츠 HTML 문자열 반환 (renderFloor가 삽입)
 *    mount()   : 삽입 후 진열대·이벤트 활성화
 *    slide(d)  : 진열대 페이지 넘김 (키보드 ←→ 연동)
 * ============================================================ */

/* ══════════════════════════════════════════════════════════════════════════
 *  ⅠF Le Séjour 모듈 (Salon) — 거실 · 0728 신축 (세 건물 재편 7호)
 *    markup() : 스크롤 무대 + 확대판 + 설명 시트
 *    mount()  : 고른 방 · 시각에 맞는 배경 · 걸린 그림 한 점
 *
 *  · 배경 넉 장 = wk-assets/living/living_NN_{m|d|e|n}.webp (941×1672)
 *  · 그림 좌표 = living_rooms 행 (살롱지기가 admin에서 끌어 맞춘 값)
 *  · 확대·설명 CSS(g1-*)는 옛 갤러리 것을 물려받되, 함수는 여기서 자립한다
 *    (봉인본의 openArtZoom·openArtNote는 Floor1 내부 변수 root·MW_isOwner에
 *     묶여 있어 그대로 못 꺼냈다)
 * ══════════════════════════════════════════════════════════════════════════ */
const Salon = (() => {
  let ROOM = null, ART = null, MW = null, OWNER = null, MINE = false;
  let QUOTE_DARK = false, TICK_DARK = false, PLAQUE_DARK = false, MEASURED = false;   /* 잉크 — 재기 전엔 안 그린다 */
  const EDIT = new URLSearchParams(location.search).has('edit');

  /* ⭐ 배치 — 전부 **벽 구역에 대한 비율**이다. 방마다 값이 아니라 우주 하나의 값이라
     일곱 방에 그대로 통한다. 저장은 eg_settings.living_layout 한 줄(0809). */
  const K_DEFAULT = {
    quoteTop : 8,     /* 글귀 위    = wall_top + %p */
    quoteH   : 16,    /* 글귀 높이   %p */
    artK     : 0.36,  /* 그림 높이  = 벽 구역 × K */
    artDrop  : 3,     /* 그림 가운데 = 벽 가운데 + %p */
    artX     : 50,    /* 그림 가로 % — 벽이 좌우 대칭이라 50이 기본 */
    tickH    : 10,    /* 꽃 티커 높이 %p · 바닥선이 wall_bot */
    tickDrop : 0,     /* 꽃 티커 들어올림 %p — 0이면 콘솔 상판에 바로 앉는다 */
    liftR    : 3,     /* 엘리베이터 오른쪽에서 % · 위에서 % (네 층 공통) */
    liftT    : 50,
    dockR    : 3,     /* ⋮ 도크 자리 */
    dockT    : 66,
    tickW    : 44     /* 꽃 티커 폭 % — 상판 좌우 끝에 물건이 서 있다(0809 실측).
                         일곱 방에서 물건이 가장 안쪽까지 온 곳이 26%·74%이므로
                         28~72%가 공통으로 비어 있다. 폭 44%가 그 안에 딱 든다. */
  };
  const K = Object.assign({}, K_DEFAULT);
  let K_SAVED = Object.assign({}, K_DEFAULT);
  let ROOMS_ALL = [], REAL_NO = 1;      /* 미리보기로 옮겨 다녀도 돌아올 곳을 기억한다 */

  /* 자리 넷은 네 층 모두에 걸리므로 셸 전역(EG_POS)으로 밀어 넣는다 */
  function pushPos(){
    ['liftR','liftT','dockR','dockT'].forEach(k=> EG_POS[k] = K[k]);
    applyLiftPos();
  }

  async function loadLayout(){
    try{
      const r = await sbFetch('/rest/v1/eg_settings?key=eq.living_layout&select=val');
      const v = r?.[0]?.val;
      if (v && typeof v === 'object'){
        Object.keys(K_DEFAULT).forEach(k=>{ if (typeof v[k] === 'number') K[k] = v[k]; });
        K_SAVED = Object.assign({}, K);
      }
    }catch(e){ console.warn('[거실] 배치 값 조회 실패 — 기본값으로 갑니다', e); }
    pushPos();      /* 읽었든 못 읽었든 자리는 밀어 넣는다 — 기본값도 값이다 */
  }

  function slot(){ return egSky.phase(); }

  /* ⚠ 버전 표시(?v=)가 필수다. Storage 기본 캐시가 max-age=3600이라
     안 붙이면 새 그림을 올려도 한 시간 동안 옛 그림이 나온다.
     living_rooms.updated_at(배경이 실제로 바뀐 시각)을 쓴다. */
  function bgUrl(no, t){
    const v = ROOM && ROOM.updated_at ? '?v=' + Date.parse(ROOM.updated_at) : '';
    return SUPABASE_URL + '/storage/v1/object/public/wk-assets/living/living_'
         + String(no).padStart(2,'0') + '_' + t + '.webp' + v;
  }
  function flowerUrl(t){
    return SUPABASE_URL + '/storage/v1/object/public/flowers/' + encodeURIComponent(t) + '.webp';
  }
  function esc2(x){ return String(x==null?'':x)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function toast(m){
    let t = document.getElementById('sl-toast');
    if(!t){ t=document.createElement('div'); t.id='sl-toast'; document.body.appendChild(t); }
    t.textContent = m; t.classList.add('on');
    clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('on'), 3800);
  }

  /* 이 집 주인 — ?user=닉이면 그 사람, 없으면 나 */
  async function ownerId(){
    const q = new URLSearchParams(location.search).get('user');
    if (q){
      try{
        const u = await sbFetch(`/rest/v1/users?nickname=eq.${encodeURIComponent(q)}&select=id`);
        if (u && u[0]) return u[0].id;
      }catch(e){ return null; }
    }
    return getUser()?.id || null;
  }

  function markup(){
    return `
      <div class="floor-content" data-floor="1">
        <div class="sl-blur" id="sl-blur"></div>
        <div class="sl-scroll" id="sl-scroll"><div class="sl-stage" id="sl-stage"></div></div>
        <div class="g1-zoom" id="sl-zoom" hidden>
          <div class="g1-zoom-stage">
            <img class="g1-zoom-img" id="sl-zoom-img" alt="">
            <button class="g1-zoom-x" id="sl-zoom-x" aria-label="닫기">×</button>
            <div class="g1-zoom-bar"><div class="g1-zoom-cap" id="sl-zoom-cap"></div></div>
          </div>
        </div>
        <div class="g1-note" id="sl-note" hidden>
          <div class="g1-note-sheet">
            <button class="g1-note-x" id="sl-note-x" aria-label="닫기">×</button>
            <div class="g1-note-head" id="sl-note-head"></div>
            <div class="g1-note-body" id="sl-note-body"></div>
          </div>
        </div>
      </div>`;
  }

  async function mount(){
    const stage = document.getElementById('sl-stage');
    if (!stage) return;

    await loadLayout();          /* ⚠ 첫 그림 전에 읽는다 — 나중에 읽으면 한 번 튄다 */
    OWNER = await ownerId();
    MINE  = !!OWNER && OWNER === (getUser()?.id || null);

    let no = 1;
    if (OWNER){
      try{
        const w = await sbFetch(`/rest/v1/wunderkammer?user_id=eq.${OWNER}&select=living_no`);
        if (w?.[0]?.living_no) no = w[0].living_no;
      }catch(e){ console.warn('[거실] 방 번호 조회 실패 — 1번으로', e); }
    }

    try{
      const r = await sbFetch(`/rest/v1/living_rooms?no=eq.${no}&select=*`);
      ROOM = r?.[0] || null;
    }catch(e){ console.warn('[거실] 방 조회 실패', e); }
    /* ⚠ 아직 안 잰 방은 뼈대 표준값으로 선다(0809). 폴백이 먼저 서는 것이 아니라
       재는 순간 그 방만 제 값을 갖는 구조다. */
    if (!ROOM) ROOM = { no, wall_top:5, wall_bot:70 };
    if (ROOM.wall_top == null) ROOM.wall_top = 5;
    if (ROOM.wall_bot == null) ROOM.wall_bot = 70;
    REAL_NO = no;

    paintBg(stage, no, slot());
    fitType(stage);

    /* 메시지 보드 — 글귀 한 장 + 방문객 흔적 */
    try{
      MW = await sbFetch('/rest/v1/rpc/get_message_board',
        { method:'POST', body: JSON.stringify({ p_room_owner: OWNER }) });
    }catch(e){ console.warn('[거실] 메시지 보드 조회 실패', e); MW = null; }

    await loadArt(stage, OWNER);
    renderBoard(stage);

    document.getElementById('sl-zoom-x').onclick = ()=> hide('sl-zoom');
    document.getElementById('sl-note-x').onclick = ()=> hide('sl-note');
    ['sl-zoom','sl-note'].forEach(id=>{
      const el = document.getElementById(id);
      el.onclick = (e)=>{ if (e.target === el) hide(id); };
    });

    if (!Salon._wired){
      Salon._wired = true;
      window.addEventListener('resize', ()=>{
        const st = document.getElementById('sl-stage'); if (st) fitType(st);
      });
    }
    /* 0809 — 손잡이는 방 안 단추로 연다. 살롱지기에게만 보인다:
       그림 배율·글귀판 높이는 방마다가 아니라 우주 하나의 값이라 손님이 만지면 안 된다.
       ?edit로 들어오면 처음부터 펼쳐 둔다(옛 길도 살려 둠). */
    await buildDock(stage);

    /* 0804 — 들어서는 3초. 거실은 아래에서 위로 훑는다.
       미술관·음악관은 천장에서 내려오지만, 여기는 내 집 거실이라
       바닥(내가 선 곳)에서 눈을 들어 벽의 그림에 닿는 쪽이 맞다. */
    const sc = document.getElementById('sl-scroll');
    if (sc){
      sc.scrollTop = 0;
      if (window.EGCamera){
        requestAnimationFrame(()=> requestAnimationFrame(()=>
          EGCamera.sweep({ box:'#sl-scroll', target:'.sl-art', dir:'up', fallback:.35 })));
      }
    }
  }
  function hide(id){ const el=document.getElementById(id); if(el) el.hidden = true; }

  /* 글자 크기는 무대 폭을 따라간다 — 폰에서도 노트북에서도 벽에 대한 비율이 같다 */
  function fitType(stage){
    const w = stage.clientWidth || 900;
    stage.style.fontSize = Math.max(9, w * 0.0182) + 'px';
  }

  /* ─────────────────────────────────────────────────────────────
     배치 — wall_top·wall_bot 두 값에서 넉 곳을 계산한다 (0809)
     ───────────────────────────────────────────────────────────── */
  function band(){
    const t = Number(ROOM.wall_top), b = Number(ROOM.wall_bot);
    return { top:t, bot:b, h:b - t, mid:(t + b) / 2 };
  }
  function artBox(){
    const w = band();
    const h = w.h * K.artK;
    const c = w.mid + K.artDrop;
    return { top:c - h/2, h, x:K.artX };
  }
  function quoteBox(){
    const w = band();
    return { top:w.top + K.quoteTop, h:K.quoteH };
  }
  function tickBox(){
    const w = band();
    return { top:w.bot - K.tickH - K.tickDrop, h:K.tickH, w:K.tickW };
  }

  /* 그 시간대가 아직 안 구워졌으면 낮으로 물러선다. 낮마저 없으면 CSS 그라데이션.
     ⭐ 무대 비율은 여기서 그림을 재서 정한다 — 어떤 비율로 구워 와도 안 잘린다. */
  function paintBg(stage, no, t){
    const put = (url, im)=>{
      stage.style.backgroundImage = `url('${url}')`;
      const blur = document.getElementById('sl-blur');
      if (blur) blur.style.backgroundImage = `url('${url}')`;
      if (im && im.naturalWidth && im.naturalHeight){
        stage.style.setProperty('--sl-ar', im.naturalWidth + '/' + im.naturalHeight);
      }
      fitType(stage);
      sampleInk(url, stage);
    };
    const probe = new Image();
    probe.onload  = ()=> put(bgUrl(no,t), probe);
    probe.onerror = ()=>{
      if (t === 'd') return;
      const d = new Image();
      d.onload = ()=> put(bgUrl(no,'d'), d);
      d.src = bgUrl(no,'d');
    };
    probe.src = bgUrl(no, t);
  }

  /* ⭐⭐ 잉크 — 미술관 명패와 같은 부품이다(galerie 0805).
     그 구역 벽을 재서 상아색과 먹색 중 **대비가 큰 쪽**을 고른다.
     벽 밝기가 방마다(95~237) 또 시각마다 갈리므로 관마다 고정값을 박는
     방식은 무너진다 — 프라도 흰 벽도 밤에는 어두워진다.
     ⚠ 재기 전에는 글귀를 안 그린다. 폴백은 대신 서는 것이지 먼저 서는 것이 아니다(0808). */
  const INK_IVORY = 0.82, INK_DARK = 0.02;   /* #f2ead6 · #2a2318 의 상대 휘도 */
  function lum8(r,g,b){
    const f=v=>{ v/=255; return v<=.04045 ? v/12.92 : Math.pow((v+.055)/1.055,2.4); };
    return .2126*f(r) + .7152*f(g) + .0722*f(b);
  }
  function contrast(a,b){ const hi=Math.max(a,b), lo=Math.min(a,b); return (hi+.05)/(lo+.05); }
  function pickDark(L){ return L!=null && contrast(L,INK_DARK) > contrast(L,INK_IVORY); }

  function sampleInk(url, stage){
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = ()=>{
      QUOTE_DARK  = pickDark(readLum(im, quoteBox()));
      TICK_DARK   = pickDark(readLum(im, tickBox()));
      const a = artBox();
      PLAQUE_DARK = pickDark(readLum(im, { top:a.top + a.h + 1.4, h:5 }));   /* 명패가 앉는 곳만 */
      MEASURED = true;
      renderBoard(stage);
      const pl = stage.querySelector('.sl-plaque');
      if (pl) pl.classList.toggle('ink-dark', PLAQUE_DARK);
    };
    /* 교차출처로 막히거나 그림이 없으면 상아색으로 간다 — 어두운 벽이 더 흔하다 */
    im.onerror = ()=>{ QUOTE_DARK = false; TICK_DARK = false; PLAQUE_DARK = false; MEASURED = true; renderBoard(stage); };
    im.src = url;
  }
  function readLum(im, box){
    try{
      const CW = 90;
      const CH = Math.max(1, Math.round(90 * im.naturalHeight / im.naturalWidth));
      const cv = document.createElement('canvas'); cv.width = CW; cv.height = CH;
      const cx = cv.getContext('2d', { willReadFrequently:true });
      cx.drawImage(im, 0, 0, CW, CH);
      const y0 = Math.max(0, Math.round(CH * box.top / 100));
      const y1 = Math.min(CH, Math.round(CH * (box.top + box.h) / 100));
      const x0 = Math.round(CW * 0.22), x1 = Math.round(CW * 0.78);
      if (x1 <= x0 || y1 <= y0) return null;
      const d = cx.getImageData(x0, y0, x1-x0, y1-y0).data;
      let s = 0, n = 0;
      for (let k=0;k<d.length;k+=4){ s += lum8(d[k],d[k+1],d[k+2]); n++; }
      return n ? s/n : null;
    }catch(e){
      /* drawImage는 통과하고 getImageData가 막힌다 — 교차출처면 여기서 처음 걸린다 */
      console.warn('[거실] 벽 읽기 막힘 — 상아색으로 갑니다', e);
      return null;
    }
  }

  async function loadArt(stage, oid){
    stage.querySelectorAll('.sl-art, .sl-empty, .sl-plaque').forEach(el => el.remove());

    let item = null;
    if (oid){
      try{
        const rows = await sbFetch(
          `/rest/v1/heritage_rentals?user_id=eq.${oid}&returned_at=is.null`
          + `&select=item_id,created_at&order=created_at.desc&limit=1`);
        const id = rows?.[0]?.item_id;
        if (id){
          const it = await sbFetch(`/rest/v1/heritage_items?id=eq.${encodeURIComponent(id)}&select=*`);
          item = it?.[0] || null;
        }
      }catch(e){ console.warn('[거실] 그림 조회 실패', e); }
    }
    ART = item;
    const a = artBox(), x = a.x;

    if (!item || !item.img){
      const box = document.createElement('div');
      box.className = 'sl-empty';
      box.style.cssText = `left:${x}%; top:${a.top}%; height:${a.h}%; width:${a.h*0.74}%;`;
      box.innerHTML = '아직<br>아무것도<br>걸려 있지 않습니다<div class="sl-h"></div>';
      stage.appendChild(box);
      if (EDITING) armArt(stage, box);
      return;
    }

    const wrap = document.createElement('div');
    wrap.className = 'sl-art';
    wrap.style.cssText = `left:${x}%; top:${a.top}%; height:${a.h}%;`;
    wrap.innerHTML = `<img src="${item.img}" alt="${esc2(item.name)}"><div class="sl-h"></div>`;
    wrap.onclick = ()=> { if (!EDITING) openZoom(item); };
    stage.appendChild(wrap);
    if (EDITING) armArt(stage, wrap);

    const pl = document.createElement('div');
    pl.className = 'sl-plaque' + (PLAQUE_DARK ? ' ink-dark' : '');
    pl.style.cssText = `left:${x}%; top:${a.top + a.h + 1.4}%;`;
    pl.innerHTML = `<div class="p-name">${esc2(item.name || '무제')}</div>`
                 + `<div class="p-artist">${esc2(item.artist || '')}</div>`
                 + `<div class="p-voice" id="sl-voice"></div>`;
    pl.onclick = (e)=>{ e.stopPropagation(); if (!EDITING) openNote(item); };
    pl.querySelector('.p-voice').onclick = (e)=>{ e.stopPropagation(); toggleArtVoice(); };
    stage.appendChild(pl);
    paintArtVoice(item);
  }

  /* ══════════════════════════════════════════════════════════════
     낭독 — 미술관 명패 부품을 그대로 옮겼다(galerie 0806밤).
     ⭐ 「그림 곁에는 팝업 말고 소리」 — 4겹 시트는 화면을 덮어 그림을 가린다.
     ⚠ 분더카머는 terra 안 액자에서 열리므로 소리는 terra가 든다.
       나가도 안 끊기고, 조종간이 무엇이 흐르는지 말해 준다.
     ⚠ 음성이 있는 그림에만 줄이 뜬다. 없으면 아무 말도 안 한다.
     ══════════════════════════════════════════════════════════════ */
  let ART_VOICE = null, ART_AUDIO = null, VOICE_NOW = null;
  const HAS_PARENT = (()=>{ try{ return window.parent && window.parent !== window; }catch(e){ return false; } })();
  function tellParent(m){ try{ window.parent.postMessage(m,'*'); }catch(e){} }

  async function paintArtVoice(item){
    const el = document.getElementById('sl-voice');
    if (!HAS_PARENT && ART_AUDIO){ try{ ART_AUDIO.pause(); }catch(e){} ART_AUDIO = null; }
    ART_VOICE = null;
    if (!el) return;
    el.classList.remove('on'); el.textContent = '';
    if (!item || !item.id) return;
    try{
      const r = await sbFetch(`/rest/v1/voice_takes?scope=eq.art&ref=eq.${encodeURIComponent(item.id)}`
                            + `&active=is.true&select=url,dur_sec&limit=1`);
      const d = r && r[0];
      if (!d || !d.url) return;                     /* 없으면 줄도 없다 */
      ART_VOICE = d;
      el.classList.add('on');
      paintVoiceLine();
      /* ⚠ 나갔다 다시 들어온 때 — 이미 흐르는 중일 수 있다. 안 물으면 명패와 소리가 어긋난다 */
      if (HAS_PARENT) tellParent({ eg:'voice-ask' });
    }catch(e){ console.warn('[거실] 낭독을 못 받았습니다 — 명패는 그대로 둡니다', e); }
  }

  function paintVoiceLine(txt){
    const el = document.getElementById('sl-voice');
    if (!el || !ART_VOICE) return;
    const d = ART_VOICE.dur_sec;
    const dur = d ? `<span class="vd">${Math.floor(d/60)}:${String(Math.round(d%60)).padStart(2,'0')}</span>` : '';
    let t = txt;
    if (!t){
      if (HAS_PARENT){
        /* ⚠ 갈래(scope)까지 본다 — 장소 낭독이 흐르는데 「듣는 중」이라 적으면 거짓말이 된다 */
        const mine = VOICE_NOW && VOICE_NOW.scope === 'art'
                     && String(VOICE_NOW.ref) === String(ART && ART.id);
        t = !mine             ? '▶ 설명 듣기'
          : VOICE_NOW.playing ? '❚❚ 듣는 중'
          : VOICE_NOW.ended   ? '▶ 다시 듣기'
          :                     '▶ 이어 듣기';
      } else {
        t = (ART_AUDIO && !ART_AUDIO.paused) ? '❚❚ 듣는 중' : '▶ 설명 듣기';
      }
    }
    el.innerHTML = t + dur;
  }

  function toggleArtVoice(){
    if (!ART_VOICE || !ART) return;
    if (HAS_PARENT){
      const mine = VOICE_NOW && String(VOICE_NOW.ref) === String(ART.id);
      if (mine) tellParent({ eg:'voice-toggle' });
      else tellParent({ eg:'voice-play', scope:'art', ref:ART.id, url:ART_VOICE.url,
                        title:(ART.name || '작품 해설'), total:(ART_VOICE.dur_sec || 0) });
      return;
    }
    /* 폴백 — 단독으로 열렸을 때만 여기서 튼다 */
    if (ART_AUDIO && !ART_AUDIO.paused){ ART_AUDIO.pause(); return; }
    if (!ART_AUDIO){
      ART_AUDIO = new Audio(ART_VOICE.url);
      ART_AUDIO.preload = 'none';
      ART_AUDIO.onplay  = ()=> paintVoiceLine('❚❚ 듣는 중');
      ART_AUDIO.onpause = ()=> paintVoiceLine('▶ 이어 듣기');
      ART_AUDIO.onended = ()=> paintVoiceLine('▶ 다시 듣기');
      ART_AUDIO.onerror = ()=>{ paintVoiceLine('음성을 불러오지 못했습니다');
        console.warn('[거실] 낭독 파일을 못 받았습니다:', ART_VOICE.url); };
      try{
        if ('mediaSession' in navigator)
          navigator.mediaSession.metadata = new MediaMetadata({
            title:(ART && ART.name) || '작품 해설', artist:(ART && ART.artist) || 'EG Universe' });
      }catch(e){}
    }
    ART_AUDIO.play().catch(e=> console.warn('[거실] 낭독 재생', e));
  }

  /* terra가 되쏘는 상태 — 명패 줄이 조종간과 같은 말을 하게 한다 */
  window.addEventListener('message', e=>{
    const d = e && e.data;
    if (!d || d.eg !== 'voice-state') return;
    VOICE_NOW = d.ref ? d : null;
    paintVoiceLine();
  });

  /* ─────────────────────────────────────────────────────────────
     메시지 보드 — 글귀 한 장 + 콘솔 위 흐르는 흔적
     ───────────────────────────────────────────────────────────── */
  function renderBoard(stage){
    if (!stage) return;
    stage.querySelectorAll('.sl-mw, .sl-tick').forEach(el => el.remove());
    stage.style.setProperty('--sl-tick-ink', TICK_DARK ? '#2a2318' : '#f0ebe0');
    stage.style.setProperty('--sl-tick-shadow',
      TICK_DARK ? '0 1px 2px rgba(255,255,255,.34)' : '0 1px 3px rgba(0,0,0,.5)');

    const w = (MW && MW.wall) || {};
    const traces = (MW && MW.traces) || [];
    const q = quoteBox(), t = tickBox();
    const nick = esc2((w.nickname || '').toUpperCase());

    /* ⚠ 벽을 재기 전에는 안 그린다. 잘못된 잉크로 한 번 뜨면 매번 껌뻑인다(0808 조항) */
    if (MEASURED){
      const has = !!(w.body || w.title);
      const inner = has
        ? (nick ? `<div class="sl-mw-nick">${nick}</div>` : '')
          + (w.title ? `<div class="sl-mw-title">${esc2(w.title)}</div>` : '')
          + `<div class="sl-mw-body">${esc2(w.body || '')}</div>`
          + (w.signature ? `<div class="sl-mw-sig">— ${esc2(w.signature)}</div>` : '')
        : `<div class="sl-mw-empty">${nick ? nick + '<br>' : ''}아직 글귀가 걸리지 않은 벽</div>`;

      const mw = document.createElement('div');
      mw.className = 'sl-mw' + (QUOTE_DARK ? ' ink-dark' : '');
      mw.style.cssText = `left:50%; top:${q.top}%; height:${q.h}%; width:60%;`;
      mw.innerHTML = inner + '<div class="sl-h"></div>';
      stage.appendChild(mw);
      if (EDITING) armQuote(stage, mw);
    }

    if (traces.length){
      const chip = x => `<span class="sl-tick-chip">`
        + `<img src="${flowerUrl(x.flower_type)}" alt="" onerror="this.style.display='none'">`
        + `<b>${esc2(x.visitor_nick)}</b>${x.text ? `<i>${esc2(x.text)}</i>` : ''}</span>`;
      /* 끊김 없는 흐름 — 칩 묶음을 두 벌 이어 붙이고 -50%로 민다 */
      const chips = traces.map(chip).join('');
      const tk = document.createElement('div');
      tk.className = 'sl-tick';
      tk.style.cssText = `left:50%; top:${t.top}%; height:${t.h}%; width:${t.w}%;`;
      tk.innerHTML = `<div class="sl-tick-track">${chips}</div><div class="sl-h"></div>`;
      stage.appendChild(tk);
      /* ⚠ 꽃 크기가 티커 높이를 안 따라가면, 상자만 자라고 아무 일도 안 일어나 보인다
         (0809 소로 지적). 칩 글자 크기를 실제 높이에서 뽑아 넣는다. */
      sizeTick(tk);
      flowTicker(tk, chips);
      if (EDITING) armTick(stage, tk);
    }
  }

  /* 꽃과 글자는 티커 높이를 따라간다 — 상자만 자라면 맞춰도 아무 일이 안 일어난다 */
  function sizeTick(tk, again){
    const h = tk.clientHeight || 0;
    if (h > 0){ tk.style.fontSize = Math.max(9, h * 0.40) + 'px'; return; }
    if (!again) requestAnimationFrame(()=> sizeTick(tk, true));   /* 한 번만 미룬다 */
  }

  /* ⭐ 티커는 시간이 아니라 **속도**를 못 박는 물건이다(0809 소로 관찰).
     64초로 고정해 두었더니 흔적 하나일 때 3.9px/초로 흘러 멈춘 것처럼 보였다.
     ① 한 벌이 통보다 좁으면 통을 채울 만큼 되풀이한다 — 안 그러면 빈 구간이 지나간다
     ② 그렇게 만든 한 벌을 두 벌 이어 붙이고 -50%로 민다 — 이음매가 안 보인다
     ③ 시간 = 한 벌 폭 ÷ 속도. 흔적이 늘어도 읽히는 속도가 그대로다 */
  const TICK_SPEED = 34;      /* px/초 — 눈이 따라 읽는 속도 */
  function flowTicker(tk, chips){
    const track = tk.querySelector('.sl-tick-track');
    if (!track) return;
    requestAnimationFrame(()=>{
      const box = tk.clientWidth || 600;
      const one = track.scrollWidth || 1;
      let reps = 1;
      while (one * reps < box * 1.25 && reps < 60) reps++;
      track.innerHTML = new Array(reps * 2).fill(chips).join('');
      requestAnimationFrame(()=>{
        const half = (track.scrollWidth || one * reps * 2) / 2;
        const sec = Math.max(14, half / TICK_SPEED);
        track.style.setProperty('--sl-tick-dur', sec.toFixed(1) + 's');
      });
    });
  }

  /* ── 통합 손잡이 — 엘리베이터 아래 동그란 단추 하나 (0809 소로) ──
     큰 알약 단추 둘을 벽에 띄우면 방이 시끄러워진다. 하나로 접고 눌러야 펴진다. */
  async function buildDock(stage){
    const root = stage.closest('.floor-content');
    if (!root || root.querySelector('.sl-dock')) return;

    const items = [];
    if (MINE) items.push(['✎','내 글귀', openWrite]);
    else      items.push(['✿','꽃 두고 가기', openFlower]);
    if (await isKeeper()) items.push(['⚖','배치 맞추기', ()=>{ buildEditBar(); toggleEditor(stage); }]);
    if (!items.length) return;

    const dock = document.createElement('div');
    dock.className = 'sl-dock';
    dock.innerHTML =
      `<button class="sl-dock-h" type="button" aria-label="이 방에서 할 수 있는 일">⋮</button>
       <div class="sl-dock-menu" hidden></div>`;
    const menu = dock.querySelector('.sl-dock-menu');
    items.forEach(([icon,label,fn],n)=>{
      const b = document.createElement('button');
      b.className = 'sl-dock-b'; b.type = 'button';
      b.textContent = icon; b.title = label; b.setAttribute('aria-label', label);
      if (label === '배치 맞추기') b.dataset.act = 'keeper';
      b.onclick = (e)=>{ e.stopPropagation(); fn(); };
      menu.appendChild(b);
    });
    const h = dock.querySelector('.sl-dock-h');
    h.onclick = (e)=>{
      e.stopPropagation();
      const open = menu.hidden;
      menu.hidden = !open;
      h.classList.toggle('on', open);
      h.textContent = open ? '×' : '⋮';
    };
    root.appendChild(dock);
    if (EDIT){ h.click(); const kb = menu.querySelector('[data-act="keeper"]'); if (kb) kb.click(); }
  }

  async function refreshBoard(){
    try{
      MW = await sbFetch('/rest/v1/rpc/get_message_board',
        { method:'POST', body: JSON.stringify({ p_room_owner: OWNER }) });
    }catch(e){ console.warn('[거실] 보드 갱신 실패', e); }
    renderBoard(document.getElementById('sl-stage'));
  }

  function closeModal(){ const m=document.getElementById('sl-modal'); if(m) m.remove(); }

  /* 내 방 — 글귀 쓰기·고치기 */
  function openWrite(){
    closeModal();
    const w = (MW && MW.wall) || {};
    const m = document.createElement('div');
    m.id='sl-modal'; m.className='sl-modal';
    m.innerHTML = `
      <div class="sl-box">
        <h3>내 벽의 글귀</h3>
        <p class="sl-hint">이 벽은 찾아온 사람이 가장 먼저 보는 곳입니다. 한 문장이면 넉넉합니다.</p>
        <label>타이틀</label>
        <input id="sl-t" maxlength="40" placeholder="예: 나를 바꾼 문장">
        <label>글귀</label>
        <textarea id="sl-b" rows="4" placeholder="벽에 걸 한 문장을 적어 주세요"></textarea>
        <label>서명 · 출처 (선택)</label>
        <input id="sl-s" maxlength="60" placeholder="예: 헨리 데이비드 소로 · 월든">
        <div class="sl-btns">
          <button class="sl-cancel">닫기</button>
          <button class="sl-ok">벽에 걸기</button>
        </div>
      </div>`;
    document.body.appendChild(m);
    m.querySelector('#sl-t').value = w.title || '';
    m.querySelector('#sl-b').value = w.body  || '';
    m.querySelector('#sl-s').value = w.signature || '';
    m.addEventListener('click', e=>{ if(e.target===m) closeModal(); });
    m.querySelector('.sl-cancel').onclick = closeModal;
    m.querySelector('.sl-ok').onclick = async ()=>{
      const title = m.querySelector('#sl-t').value.trim();
      const body  = m.querySelector('#sl-b').value.trim();
      const sig   = m.querySelector('#sl-s').value.trim();
      if (!body){ toast('글귀를 한 줄 적어 주세요'); return; }
      try{
        await sbFetch('/rest/v1/rpc/upsert_message_board', { method:'POST',
          body: JSON.stringify({ p_title:title||null, p_body:body,
                                 p_signature:sig||null, p_text_color:null }) });
        closeModal(); await refreshBoard();
        toast('벽에 걸었습니다');
      }catch(e){ toast('저장 실패: ' + (e.message || '')); }
    };
  }

  /* ── 남의 방 — 꽃 두고 가기 ──
     ⭐ 0809 소로: 「이번 주 꽃을 먼저 고르세요(교양자화상)」만 뜨고 끝나 엄청 불편했다.
        고르는 일은 여기서 끝낸다. 자화상까지 다녀오지 않는다.
     ⚠ 주 시작은 서버와 같은 눈금이어야 한다 — Postgres date_trunc('week')는 **월요일**이고
       KST 기준이다. 한쪽만 어긋나면 꽃을 골라도 「먼저 고르세요」가 계속 뜬다. */
  function kstWeekId(){
    const kst = new Date(Date.now() + 9*3600*1000);
    const dow = (kst.getUTCDay() + 6) % 7;                 /* 월=0 */
    kst.setUTCDate(kst.getUTCDate() - dow);
    return kst.toISOString().slice(0,10);
  }
  async function myFlower(){
    try{
      const me = getUser()?.id; if (!me) return null;
      const r = await sbFetch(
        `/rest/v1/flower_balance?user_id=eq.${me}&select=weekly_flower,weekly_flower_wk,balance`);
      const d = r && r[0];
      if (!d) return { flower:null, left:0 };
      const ok = d.weekly_flower && d.weekly_flower_wk === kstWeekId();
      return { flower: ok ? d.weekly_flower : null, left: ok ? (d.balance||0) : 0 };
    }catch(e){ console.warn('[거실] 꽃 조회 실패', e); return null; }
  }

  async function openFlower(){
    closeModal();
    const m = document.createElement('div');
    m.id='sl-modal'; m.className='sl-modal';
    m.innerHTML = `<div class="sl-box"><h3>🌸 꽃 두고 가기</h3>
                   <p class="sl-hint">살펴보는 중…</p></div>`;
