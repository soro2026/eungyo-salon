    document.body.appendChild(m);
    m.addEventListener('click', e=>{ if(e.target===m) closeModal(); });

    const st = await myFlower();
    if (!st){ m.querySelector('.sl-box').innerHTML =
      `<h3>🌸 꽃 두고 가기</h3><p class="sl-hint">꽃을 확인하지 못했습니다. 잠시 후 다시 들러 주세요.</p>
       <div class="sl-btns"><button class="sl-cancel">닫기</button></div>`;
      m.querySelector('.sl-cancel').onclick = closeModal; return; }

    if (!st.flower) paintPick(m);
    else            paintLeave(m, st);
  }

  /* 열두 송이 중 한 송이 — persona.html의 claim_weekly_flower와 같은 문 */
  function paintPick(m){
    let cells = '';
    for (let i=1;i<=12;i++){
      const t = 'flower' + String(i).padStart(2,'0');
      cells += `<button type="button" class="sl-fpick" data-f="${t}">
                  <img src="${flowerUrl(t)}" alt="" loading="lazy"></button>`;
    }
    m.querySelector('.sl-box').innerHTML =
      `<h3>🌸 이번 주의 꽃</h3>
       <p class="sl-hint">아직 이번 주 꽃을 안 고르셨습니다. 한 송이 고르시면 <b>28송이</b>를 받습니다.
         분더카머를 순례하며 집집마다 한 송이씩 두고 올 수 있어요. (안 쓰면 다음 주에 사라집니다.)</p>
       <div class="sl-fgrid">${cells}</div>
       <div class="sl-btns"><button class="sl-cancel">닫기</button></div>`;
    m.querySelector('.sl-cancel').onclick = closeModal;
    m.querySelector('.sl-fgrid').addEventListener('click', async e=>{
      const b = e.target.closest('.sl-fpick'); if (!b) return;
      const grid = m.querySelector('.sl-fgrid');
      if (grid.classList.contains('busy')) return;
      grid.classList.add('busy');
      try{
        await sbFetch('/rest/v1/rpc/claim_weekly_flower',
          { method:'POST', body: JSON.stringify({ p_flower: b.dataset.f }) });
        const st = await myFlower();                       /* ⚠ 받았겠지 금지 — 되읽어 확인한다 */
        if (st && st.flower) paintLeave(m, st, true);
        else { grid.classList.remove('busy'); toast('꽃을 받지 못했어요'); }
      }catch(err){ grid.classList.remove('busy'); toast(err.message || '꽃을 받지 못했어요'); }
    });
  }

  function paintLeave(m, st, justPicked){
    m.querySelector('.sl-box').innerHTML =
      `<h3>🌸 꽃 두고 가기</h3>
       <div class="sl-fnow"><img src="${flowerUrl(st.flower)}" alt="">
         <div><b>${st.left}</b> 송이 남았습니다${justPicked ? ' · 방금 받으셨어요' : ''}<br>
         <span>한 줄은 남겨도 좋고, 비워도 좋습니다 — 아무 말 없이 두고 가는 것도 인사입니다.</span></div></div>
       <textarea id="sl-f" rows="2" maxlength="50" placeholder="한 줄 남기기 (50자, 선택)"></textarea>
       <div class="sl-btns"><button class="sl-cancel">닫기</button>
         <button class="sl-ok">두고 가기</button></div>`;
    m.querySelector('.sl-cancel').onclick = closeModal;
    m.querySelector('.sl-ok').onclick = async ()=>{
      const text = m.querySelector('#sl-f').value.trim();
      try{
        const res = await sbFetch('/rest/v1/rpc/leave_flower', { method:'POST',
          body: JSON.stringify({ p_room_owner: OWNER, p_text: text||null }) });
        closeModal(); await refreshBoard();
        const left = (res && typeof res.left === 'number') ? res.left : -1;
        toast(left === 0 ? '이번 주 마지막 꽃을 두고 갑니다'
            : left  >  0 ? `꽃을 두고 갑니다 · 이번 주 남은 꽃 ${left}송이`
            :              '꽃을 두고 갑니다');
      }catch(e){ closeModal(); toast(e.message || '잠시 후 다시 시도해 주세요'); }
    };
  }

  /* 살롱지기인가 — 단추 하나를 내기 위한 한 번의 조회.
     ⚠ 못 재면 잠근다. 통신이 끊겨도 열리지 않는다. */
  let KEEPER = null;
  async function isKeeper(){
    if (KEEPER !== null) return KEEPER;
    const me = getUser()?.id;
    if (!me){ KEEPER = false; return false; }
    try{
      const u = await sbFetch(`/rest/v1/users?id=eq.${me}&select=is_admin`);
      KEEPER = !!(u && u[0] && u[0].is_admin);
    }catch(e){ KEEPER = false; }
    return KEEPER;
  }

  /* ══════════════════════════════════════════════════════════════
     배치 맞추기 — 미술관 문법(galerie 0805). 끌어 옮기고 모서리로 키운다.
     ⚠ 여기서 맞추는 값은 벽 구역에 대한 **비율**이라 일곱 방 전부에 통한다.
       방마다 저장하면 서른 채에 270값이 된다. 저장은 eg_settings 한 줄.
     ⚠ 끌기는 포인터 하나로 받는다 — 폰과 마우스가 같은 길로 들어온다.
     ══════════════════════════════════════════════════════════════ */
  let EDITING = false;

  function stageRect(){
    const st = document.getElementById('sl-stage');
    return st ? st.getBoundingClientRect() : { width:1, height:1 };
  }
  const clamp = (v,lo,hi)=> Math.min(hi, Math.max(lo, v));

  function toggleEditor(stage){
    EDITING = !EDITING;
    document.getElementById('sl-bar').hidden  = !EDITING;
    document.getElementById('sl-info').hidden = !EDITING;
    loadArt(stage, OWNER); renderBoard(stage);
    armFurniture(stage);
    paintInfo();
  }

  /* 엘리베이터와 도크 — 무대가 아니라 층 위에 떠 있는 물건이라 따로 잡는다.
     ⚠ 자리는 네 층 모두에 걸린다. 거실에서 옮기면 책의 방에서도 옮겨진다. */
  function armFurniture(stage){
    const root = stage.closest('.floor-content');
    const floor = root && root.closest('.floor');
    const lift = floor && floor.querySelector('.room-elevator');
    const dock = root && root.querySelector('.sl-dock');
    [[lift,'lift'],[dock,'dock']].forEach(([el,kind])=>{
      if (!el) return;
      el.classList.toggle('editing', EDITING);
      if (!EDITING || el._armed) return;
      el._armed = true;
      let d = null;
      el.addEventListener('pointerdown', e=>{
        if (!EDITING) return;
        e.preventDefault(); e.stopPropagation();
        el.setPointerCapture(e.pointerId);
        d = { x:e.clientX, y:e.clientY,
              r:K[kind+'R'], t:K[kind+'T'] };
      });
      el.addEventListener('pointermove', e=>{
        if (!EDITING || !d) return;
        const b = (floor||document.body).getBoundingClientRect();
        K[kind+'R'] = clamp(d.r - (e.clientX-d.x)/b.width*100,  0, 80);
        K[kind+'T'] = clamp(d.t + (e.clientY-d.y)/b.height*100, 4, 96);
        pushPos(); paintInfo();
      });
      const end = ()=>{ d = null; };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      el.addEventListener('click', e=>{ if (EDITING) e.stopPropagation(); }, true);
    });
  }

  function paintInfo(){
    const el = document.getElementById('sl-info'); if (!el) return;
    const w = band();
    el.innerHTML =
      `그림 <em>배율</em> ${K.artK.toFixed(3)} · <em>내림</em> ${K.artDrop.toFixed(1)} · <em>가로</em> ${K.artX.toFixed(1)}`
      + `<br>글귀 <em>위</em> ${K.quoteTop.toFixed(1)} · <em>높이</em> ${K.quoteH.toFixed(1)}`
      + `<br>엘베 <em>R</em> ${K.liftR.toFixed(1)} <em>T</em> ${K.liftT.toFixed(1)} · 도크 <em>R</em> ${K.dockR.toFixed(1)} <em>T</em> ${K.dockT.toFixed(1)}`
      + `<br>꽃 <em>올림</em> ${K.tickDrop.toFixed(1)} · <em>높이</em> ${K.tickH.toFixed(1)} · <em>폭</em> ${K.tickW.toFixed(1)}`
      + (K.tickW > 44.1 ? ' <em style="color:#e08f6a">⚠ 상판 물건과 겹침</em>' : '')
      + `<br><em>${ROOM ? String(ROOM.no).padStart(2,'0') + ' ' + esc2(ROOM.name || '') : ''}`
      + ` 벽 ${w.top.toFixed(1)} ~ ${w.bot.toFixed(1)} (${w.h.toFixed(1)})`
      + `${ROOM && ROOM.no !== REAL_NO ? ' · 미리보기' : ''} · 값은 일곱 방 공통</em>`;
  }

  /* 한 물건에 끌기와 모서리를 붙인다. 값이 바뀌면 그 자리에서 다시 그린다. */
  function arm(el, stage, opt){
    const h = el.querySelector('.sl-h');
    el.classList.add('editing');
    let d = null, r = null;

    el.addEventListener('pointerdown', e=>{
      if (!EDITING || e.target === h) return;
      e.preventDefault(); e.stopPropagation();
      el.setPointerCapture(e.pointerId);
      d = { x:e.clientX, y:e.clientY, v:opt.grab() };
    });
    el.addEventListener('pointermove', e=>{
      if (!EDITING || !d) return;
      const b = stageRect();
      opt.move(d.v, (e.clientX-d.x)/b.width*100, (e.clientY-d.y)/b.height*100);
      redraw(stage);
    });
    const end = ()=>{ d = null; };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);

    if (h && opt.size){
      h.addEventListener('pointerdown', e=>{
        if (!EDITING) return;
        e.preventDefault(); e.stopPropagation();
        h.setPointerCapture(e.pointerId);
        r = { x:e.clientX, y:e.clientY, v:opt.grabSize() };
      });
      h.addEventListener('pointermove', e=>{
        if (!EDITING || !r) return;
        const b = stageRect();
        opt.size(r.v, (e.clientX-r.x)/b.width*100, (e.clientY-r.y)/b.height*100);
        redraw(stage);
      });
      const e2 = ()=>{ r = null; };
      h.addEventListener('pointerup', e2);
      h.addEventListener('pointercancel', e2);
    }
  }

  /* ⚠⚠ 끄는 중에는 **다시 만들지 않고 스타일만 고친다.**
     요소를 지웠다 새로 만들면 잡고 있던 물건이 사라져 포인터가 끊긴다
     — 미술관 applyRect()가 스타일만 고치는 까닭이 이것이다(galerie 계보).
     통째로 다시 그리는 것은 편집을 켜고 끌 때뿐이다. */
  function redraw(stage){
    const a = artBox(), q = quoteBox(), t = tickBox();

    const art = stage.querySelector('.sl-art, .sl-empty');
    if (art){
      art.style.left = a.x + '%'; art.style.top = a.top + '%'; art.style.height = a.h + '%';
      if (art.classList.contains('sl-empty')) art.style.width = (a.h * 0.74) + '%';
    }
    const pl = stage.querySelector('.sl-plaque');
    if (pl){ pl.style.left = a.x + '%'; pl.style.top = (a.top + a.h + 1.4) + '%'; }

    const mw = stage.querySelector('.sl-mw');
    if (mw){ mw.style.top = q.top + '%'; mw.style.height = q.h + '%'; }

    const tk = stage.querySelector('.sl-tick');
    if (tk){ tk.style.top = t.top + '%'; tk.style.height = t.h + '%'; tk.style.width = t.w + '%'; sizeTick(tk); }

    paintInfo();
  }

  function armArt(stage, el){
    const w = band();
    arm(el, stage, {
      grab : ()=> ({ drop:K.artDrop, x:K.artX }),
      move : (v, dx, dy)=>{
        K.artDrop = clamp(v.drop + dy, -w.h*0.35, w.h*0.35);
        K.artX    = clamp(v.x + dx, 30, 70);
      },
      grabSize : ()=> K.artK,
      size : (v, dx, dy)=>{ K.artK = clamp(v + (dy*2)/w.h, 0.12, 0.72); }
    });
  }
  function armQuote(stage, el){
    const w = band();
    arm(el, stage, {
      grab : ()=> K.quoteTop,
      move : (v, dx, dy)=>{ K.quoteTop = clamp(v + dy, 0, w.h - K.quoteH); },
      grabSize : ()=> K.quoteH,
      size : (v, dx, dy)=>{ K.quoteH = clamp(v + dy, 6, w.h - K.quoteTop); }
    });
  }
  /* 티커는 바닥선이 wall_bot에 못 박혀 있다 — 위로 끌면 높이가 자란다 */
  /* 티커는 바닥선이 wall_bot에 못 박혀 있다 — 위로 끌면 높이가 자란다.
     ⚠ 폭은 28~72% 안에 머물러야 한다. 상판 좌우 끝에 물건이 서 있고
       그 물건은 방마다 다른 곳까지 들어온다(0809 일곱 방 실측: 가장 안쪽 26%·74%). */
  function armTick(stage, el){
    const w = band();
    arm(el, stage, {
      /* ⚠ 끌면 **옮겨진다.** 앞 판은 끌어도 키만 자라서 「안 움직인다」로 보였다(0809 소로).
         바닥이 콘솔 상판에 매인 것은 그대로고, 거기서 얼마나 들어올릴지가 tickDrop이다. */
      grab : ()=> K.tickDrop,
      move : (v, dx, dy)=>{ K.tickDrop = clamp(v - dy, -6, w.h*0.55); },
      grabSize : ()=> ({ h:K.tickH, w:K.tickW }),
      size : (v, dx, dy)=>{
        K.tickH = clamp(v.h - dy, 4, w.h*0.5);
        K.tickW = clamp(v.w + dx*2, 16, 44);     /* 44%가 천장 — 넘으면 상판 물건을 밟는다 */
      }
    });
  }

  /* ── 방 미리보기 — 맞추면서 일곱 방을 눈으로 넘긴다 (0809 소로) ──
     ⚠ DB를 안 건드린다. 소로의 living_no는 그대로다 — 맞추다가 거실이
       모로칸으로 바뀌어 있으면 안 된다. 끝내면 제 방으로 돌아온다. */
  async function loadRoomList(){
    if (ROOMS_ALL.length) return ROOMS_ALL;
    try{
      const r = await sbFetch('/rest/v1/living_rooms?select=no,name,wall_top,wall_bot,updated_at&order=no');
      ROOMS_ALL = r || [];
    }catch(e){ console.warn('[거실] 방 목록 조회 실패', e); ROOMS_ALL = []; }
    return ROOMS_ALL;
  }
  async function previewRoom(no){
    const list = await loadRoomList();
    const r = list.find(x=>x.no === no);
    if (!r) return;
    ROOM = Object.assign({}, r);
    if (ROOM.wall_top == null) ROOM.wall_top = 5;
    if (ROOM.wall_bot == null) ROOM.wall_bot = 70;
    const stage = document.getElementById('sl-stage');
    MEASURED = false;                 /* 새 벽을 재기 전엔 글귀를 안 그린다 */
    paintBg(stage, no, slot());       /* 다 재고 나면 renderBoard가 저절로 돈다 */
    loadArt(stage, OWNER);
    paintRoomStrip();
    paintInfo();
  }
  function paintRoomStrip(){
    const box = document.getElementById('sl-rooms'); if (!box) return;
    box.innerHTML = ROOMS_ALL.map(r=>{
      const on   = ROOM && r.no === ROOM.no;
      const band = (r.wall_bot ?? 70) - (r.wall_top ?? 5);
      const thin = band === Math.min(...ROOMS_ALL.map(x=>(x.wall_bot ?? 70)-(x.wall_top ?? 5)));
      return `<button type="button" data-no="${r.no}" class="${on?'on':''}${thin?' thin':''}"
                title="${esc2(r.name)} · 벽 ${band.toFixed(1)}">${String(r.no).padStart(2,'0')}</button>`;
    }).join('');
  }

  function buildEditBar(){
    if (document.getElementById('sl-bar')) return;
    const info = document.createElement('div');
    info.id='sl-info'; info.hidden = true;
    document.body.appendChild(info);

    const bar = document.createElement('div');
    bar.id='sl-bar'; bar.hidden = true;
    bar.innerHTML = `<span id="sl-rooms"></span>
                     <span class="sl-sep"></span>
                     <button type="button" class="go" data-a="save">저장</button>
                     <button type="button" data-a="undo">되돌리기</button>
                     <button type="button" data-a="close">끝내기</button>`;
    document.body.appendChild(bar);
    loadRoomList().then(paintRoomStrip);
    document.getElementById('sl-rooms').addEventListener('click', e=>{
      const n = e.target.dataset && e.target.dataset.no;
      if (n) previewRoom(+n);
    });

    bar.addEventListener('click', async e=>{
      const a = e.target.dataset && e.target.dataset.a;
      const stage = document.getElementById('sl-stage');
      if (a === 'save'){
        const val = {};
        Object.keys(K_DEFAULT).forEach(k=> val[k] = +(+K[k]).toFixed(3));
        try{
          await sbFetch('/rest/v1/eg_settings?on_conflict=key', {
            method:'POST',
            headers:{ 'Prefer':'resolution=merge-duplicates' },
            body: JSON.stringify({ key:'living_layout', val, updated_at:new Date().toISOString() })
          });
          K_SAVED = Object.assign({}, K); pushPos();
          toast('배치를 저장했습니다 · 일곱 방에 함께 갑니다');
        }catch(err){ toast('저장 실패: ' + (err.message||'')); }
      }
      if (a === 'undo'){
        Object.assign(K, K_SAVED); pushPos();
        loadArt(stage, OWNER); renderBoard(stage); paintInfo();
        toast('마지막 저장으로 되돌렸습니다');
      }
      if (a === 'close'){
        toggleEditor(stage);
        if (ROOM && ROOM.no !== REAL_NO) previewRoom(REAL_NO);   /* 제 방으로 돌아온다 */
      }
    });
  }
  function openZoom(a){
    document.getElementById('sl-zoom-img').src = a.img || '';
    document.getElementById('sl-zoom-cap').innerHTML =
      `<b>${esc2(a.name)}</b><span>${esc2(a.artist)}</span>`;
    document.getElementById('sl-zoom').hidden = false;
  }

  /* 카리의 4겹 — 앎·사유·연결·큐레이션. scene은 시적 표지라 맨 위에 따로. */
  const LAYER_KO = { knowledge:'앎', thought:'사유', connection:'연결', curation:'큐레이션' };
  function openNote(a){
    document.getElementById('sl-note-head').innerHTML =
      `<div class="g1-note-t">${esc2(a.name)}</div><div class="g1-note-a">${esc2(a.artist)}</div>`;
    const L = a.layers || {};
    let html = '';
    if (L.scene) html += `<p style="font-style:italic;opacity:.82;margin-bottom:18px">${esc2(L.scene)}</p>`;
    ['knowledge','thought','connection','curation'].forEach(k=>{
      if (!L[k]) return;
      html += `<div style="margin-bottom:16px">
                 <div style="font-size:11px;letter-spacing:.16em;color:#a07c66;margin-bottom:5px">${LAYER_KO[k]}</div>
                 <div>${esc2(L[k]).replace(/\n/g,'<br>')}</div>
               </div>`;
    });
    document.getElementById('sl-note-body').innerHTML = html || '<p style="opacity:.6">아직 적힌 글이 없습니다.</p>';
    document.getElementById('sl-note').hidden = false;
  }

  return { markup, mount };
})();


const Floor3 = (() => {
  /* ⭐ 0809 재건축 — 분더카머 Ⅱ층 책의 방
   *  · 배경 넉 벌 = wk-assets/study/study_NN_{m|d|e|n}.webp (941×1672)
   *  · 감(龕) 좌표 = living_rooms 여섯 값. 1층과 같은 방 번호 = 같은 집
   *  · 아홉 자리 = 밑변 셋(b1·b2·bot) × 중심 셋. 손으로 적은 좌표가 한 줄도 없다
   *
   *  ⚠⚠ 표지는 밑변과 중심에 자석처럼 붙는다 —
   *     top(=밑줄) + translateY(-100%) · left(=가운뎃줄) + translateX(-50%).
   *     크기를 키워도 밑줄과 가운뎃줄이 안 움직인다.
   *     top을 윗변으로 쓰면 키우는 순간 선반을 뚫는다. 바꾸지 말 것.
   *
   *  ⚠ 세 칸의 높이가 조금씩 다르다(원근). 균등 분할하면 7~8px 뜬다 —
   *     그래서 선반 두 줄(b1·b2)을 실측값으로 담는다.
   */
  let BOOKS = [], PAGES = [], ROOM = null, REAL_NO = 1;
  const PER_PAGE = 9;                 /* 3단 × 3권 */
  let currentShelfPage = 0;
  let isTransitioning = false;
  let editMode = false;
  let selEl = null;

  /* 아직 안 잰 방이 서는 뼈대값 — 파리 아파르트망 실측(0809).
     폴백이 먼저 서는 것이 아니라, 재는 순간 그 방만 제 값을 갖는 구조다 */
  const SHELF0 = { l:21.73, r:78.75, top:22.17, b1:37.71, b2:52.70, bot:67.30 };
  const STAGE_AR = 941 / 1672;        /* 무대 가로/세로 — 폭%↔높이% 환산에 쓴다 */

  function shelf(){
    const r = ROOM || {};
    const g = (k, d) => (r['shelf_' + k] == null ? d : Number(r['shelf_' + k]));
    return { l:g('l',SHELF0.l), r:g('r',SHELF0.r), top:g('top',SHELF0.top),
             b1:g('b1',SHELF0.b1), b2:g('b2',SHELF0.b2), bot:g('bot',SHELF0.bot) };
  }

  /* 아홉 자리 — 위에서 아래로, 왼쪽에서 오른쪽으로.
     새 책(가장 큰 seq)이 첫 번째 자리 = 1면 윗줄 맨 왼쪽에 선다 */
  function slots(){
    const s = shelf();
    const ceil = [s.top, s.b1, s.b2];    /* 그 칸의 천장 */
    const base = [s.b1,  s.b2, s.bot];   /* 그 칸의 바닥 = 표지가 앉는 줄 */
    const col  = (s.r - s.l) / 3;
    const out = [];
    for (let t = 0; t < 3; t++)
      for (let c = 0; c < 3; c++)
        out.push({ i: t*3+c, left: s.l + col*(c+0.5), top: base[t],
                   bay: base[t]-ceil[t], col });
    return out;
  }

  function markup() {
    return `
      <div class="floor-content" data-floor="3">
        <div class="bk-scroll" id="bk-scroll">
          <div class="bk-fit" id="bk-fit">
            <img id="bk-img" alt="">
            <div class="cover-stack" id="bk-cover-stack"></div>
            <div class="bk-rule" id="bk-rule" hidden></div>
          </div>
        </div>
        <button class="bk-nav-arrow bk-nav-left"  id="bk-prev" aria-label="앞 면">‹</button>
        <button class="bk-nav-arrow bk-nav-right" id="bk-next" aria-label="다음 면">›</button>
        <div class="bk-dots" id="bk-dots"></div>
        <div class="bk-hint">책을 클릭해 펼쳐보세요</div>
        <div class="bk-dock" id="bk-dock" hidden>
          <button class="bk-dock-h" id="bk-dock-h" aria-label="조종간">⋮</button>
          <div class="bk-dock-menu" id="bk-dock-menu" hidden>
            <button class="bk-dock-b" id="bk-add-toggle"  title="책 들이기">＋</button>
            <button class="bk-dock-b" id="bk-edit-toggle" title="자리 바꾸기">✎</button>
            <button class="bk-dock-b" id="bk-rule-toggle" title="선반 줄 맞추기" hidden>⚖</button>
          </div>
        </div>
        <div id="bk-add-modal">
          <div class="bam-panel">
            <div class="bam-head">
              <p class="t"><span class="eyebrow">ÉTAGE II · 책의 방</span>내가 사랑하는 책 추가하기</p>
              <button class="bam-x" id="bam-close" aria-label="닫기">×</button>
            </div>
            <div class="bam-search">
              <input id="bam-q" type="search" placeholder="예: 월든 / 모비딕 / 데미안" autocomplete="off" enterkeyhint="search">
              <button id="bam-go">검색</button>
            </div>
            <div class="bam-hint"><b>네이버 책</b>으로 검색 → 고른 표지를 우리 책방에 복사해 들입니다.</div>
            <div id="bam-status" class="bam-status">책 제목을 적고 검색을 눌러보세요.</div>
            <div id="bam-grid" class="bam-grid"></div>
            <div id="bam-picked" class="bam-picked">
              <h3>이 책을 골랐습니다</h3>
              <div class="bam-preview">
                <div class="pc"><img id="bam-pimg" alt=""></div>
                <div class="bam-meta">
                  <p class="mt" id="bam-ptitle"></p>
                  <div class="row">저자 · <span id="bam-pauth"></span></div>
                  <div class="row">출판 · <span id="bam-ppub"></span></div>
                  <div class="row">ISBN · <span id="bam-pisbn"></span></div>
                </div>
              </div>
              <button class="bam-add" id="bam-add">📚 내 책방에 들이기</button>
              <div class="bam-result" id="bam-result"></div>
            </div>
          </div>
        </div>
      </div>`;
  }

  /* ── 배경 — 1층과 같은 방 번호, 같은 시각 ──
     ⚠ ?v= 가 필수다. Storage 기본 캐시가 max-age=3600이라
       안 붙이면 새 그림을 올려도 한 시간 동안 옛 그림이 나온다 */
  function bgUrl(no, t){
    const v = ROOM && ROOM.updated_at ? '?v=' + Date.parse(ROOM.updated_at) : '';
    return SUPABASE_URL + '/storage/v1/object/public/wk-assets/study/study_'
         + String(no).padStart(2,'0') + '_' + t + '.webp' + v;
  }
  function slot(){ try { return egSky.phase(); } catch(e){ return 'd'; } }

  /* 배경 — 뮤세움 문법. img 한 장이라 안 뜨면 눈에 보이고 콘솔에도 남는다.
     ⚠ CSS 배경 레이어로 깔면 못 뜬 것과 안 부른 것이 화면에서 똑같다(함정 BC) */
  function setRoomBg(list){
    return new Promise(res=>{
      const im = document.getElementById('bk-img');
      if(!im){ res(false); return; }
      let i = 0;
      const step = () => {
        if (i >= list.length){ console.warn('[책의 방] 배경을 못 찾았습니다', list); res(false); return; }
        const url = list[i++];
        im.onload  = () => { im.classList.add('on'); res(true); };
        im.onerror = () => { console.warn('[책의 방] 배경 없음 →', url); step(); };
        im.src = url;
      };
      step();
    });
  }

  /* ⭐ 들어서는 3초 — 천장(천창)에서 내려와 **맨 윗단**에 안착한다.
     ⚠ 감 전체를 주면 중심이 2단이라 새 책이 화면 위로 잘린다(뮤세움 0807).
       한 단 반만 준다. 서가 배치는 안 건드린다 — 카메라가 보는 곳만 바꾼다 */
  function runCamera(){
    if (!window.EGCamera) return;
    const s = shelf();
    const CAM = { L:s.l, T:s.top, W:s.r-s.l, H:(s.b1-s.top)*1.5 };
    const opts = { box:'#bk-scroll', fit:'#bk-fit', ratio:STAGE_AR, rect:CAM };
    /* 폰(세로)은 스크롤 길이가 0이라 카메라가 헛돈다 — 바로 앉힌다 */
    const scrollable = (innerWidth/innerHeight) >= STAGE_AR;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      try { scrollable ? EGCamera.enter(opts) : EGCamera.settle(opts); }
      catch(e){ console.warn('[책의 방] 카메라', e); }
    }));
  }

  /* ════ ⚖ 선반 줄 맞추기 (살롱지기 전용) ════
     ⚠ 표지는 자석이라 끌리지 않는다 — 움직이는 것은 **줄** 쪽이다.
       판이 밝게 빛나는 띠의 한가운데와 판의 윗면은 다르다(0809 내가 낸 사고).
       눈으로 맞추는 것이 픽셀로 재는 것보다 정확하다. */
  let ruleOn = false;
  const RULE_KEYS = [
    ['top','천장',   'h'], ['b1','1단 바닥','h'], ['b2','2단 바닥','h'],
    ['bot','3단 바닥','h'], ['l','왼쪽',     'v'], ['r','오른쪽',   'v']
  ];
  function toggleRule(){
    ruleOn = !ruleOn;
    if (ruleOn && editMode) toggleEdit();          /* 두 편집을 겹쳐 켜지 않는다 */
    const btn = document.getElementById('bk-rule-toggle');
    if (btn) btn.classList.toggle('on', ruleOn);
    const box = document.getElementById('bk-rule');
    if (!box) return;
    box.hidden = !ruleOn;
    if (ruleOn) buildRule(); else box.innerHTML = '';
  }
  function buildRule(){
    const box = document.getElementById('bk-rule');
    const s = shelf();
    box.innerHTML = RULE_KEYS.map(([k,label,axis]) =>
      `<div class="bk-rline ${axis}" data-k="${k}"
            style="${axis==='h' ? 'top:'+s[k]+'%' : 'left:'+s[k]+'%'}"><b>${label}</b></div>`).join('')
      + `<div class="bk-rsave"><button id="bk-rule-save">이 방에 담기</button>
         <span id="bk-rule-msg"></span></div>`;
    box.querySelectorAll('.bk-rline').forEach(bindRuleLine);
    document.getElementById('bk-rule-save').addEventListener('click', saveShelf);
  }
  function bindRuleLine(el){
    const k = el.dataset.k, horiz = el.classList.contains('h');
    let drag = false, s0, v0;
    const start = (p) => { drag = true; s0 = p; v0 = Number(shelf()[k]); el.classList.add('on'); };
    const move  = (p) => {
      if (!drag) return;
      const fit = document.getElementById('bk-fit'); if (!fit) return;
      const span = horiz ? fit.offsetHeight : fit.offsetWidth;
      const v = Math.max(0, Math.min(100, v0 + ((p - s0) / span) * 100));
      if (!ROOM) ROOM = { no: REAL_NO };
      ROOM['shelf_' + k] = +v.toFixed(2);
      el.style[horiz ? 'top' : 'left'] = v + '%';
      el.querySelector('b').textContent = el.querySelector('b').textContent.split(' ')[0] + ' ' + v.toFixed(2);
      buildPages(); buildShelfPages();              /* 표지가 새 줄을 따라 바로 붙는다 */
    };
    const end = () => { drag = false; el.classList.remove('on'); };
    el.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation(); start(horiz ? e.clientY : e.clientX);
      const mm = ev => move(horiz ? ev.clientY : ev.clientX);
      const mu = () => { end(); removeEventListener('mousemove', mm); removeEventListener('mouseup', mu); };
      addEventListener('mousemove', mm); addEventListener('mouseup', mu);
    });
    el.addEventListener('touchstart', e => {
      e.stopPropagation(); const t = e.touches[0]; start(horiz ? t.clientY : t.clientX);
      const tm = ev => { ev.preventDefault(); const q = ev.touches[0]; move(horiz ? q.clientY : q.clientX); };
      const tu = () => { end(); removeEventListener('touchmove', tm); removeEventListener('touchend', tu); };
      addEventListener('touchmove', tm, { passive:false }); addEventListener('touchend', tu);
    }, { passive:true });
  }
  async function saveShelf(){
    const msg = document.getElementById('bk-rule-msg');
    const s = shelf();
    try {
      await sbFetch(`/rest/v1/living_rooms?no=eq.${REAL_NO}`, {
        method:'PATCH', headers:{ 'Prefer':'return=minimal' },
        body: JSON.stringify({ shelf_l:s.l, shelf_r:s.r, shelf_top:s.top,
                               shelf_b1:s.b1, shelf_b2:s.b2, shelf_bot:s.bot })
      });
      if (msg) msg.textContent = `${REAL_NO}번 방에 담았습니다 ✔`;
    } catch (e) {
      if (msg) msg.textContent = '담지 못했습니다 — ' + (e.message || e);
    }
  }

  /* 순례 동선: ?user=닉네임이면 그 집 주인 uid, 없으면 로그인 본인 (1층과 같은 정신) */
  async function resolveOwnerId(){
    const qUser = new URLSearchParams(location.search).get('user');
    if (qUser){
      try{
        const u = await sbFetch(`/rest/v1/users?nickname=eq.${encodeURIComponent(qUser)}&select=id`);
        if (u && u[0] && u[0].id) return u[0].id;
      }catch(e){}
      return null;                       /* 해석 실패 → 빈 방 (내 책 폴백 금지) */
    }
    return getUser()?.id || null;
  }

  /* 그 집의 방 번호 → 감 좌표. 1층이 읽는 곳과 같은 자리다 */
  async function loadRoom(ownerId){
    let no = 1;
    if (ownerId){
      try{
        const w = await sbFetch(`/rest/v1/wunderkammer?user_id=eq.${ownerId}&select=living_no`);
        if (w?.[0]?.living_no) no = w[0].living_no;
      }catch(e){ console.warn('[책의 방] 방 번호 조회 실패 — 1번으로', e); }
    }
    try{
      const r = await sbFetch(`/rest/v1/living_rooms?no=eq.${no}&select=*`);
      ROOM = r?.[0] || null;
    }catch(e){ console.warn('[책의 방] 방 조회 실패', e); ROOM = null; }
    REAL_NO = no;
  }

  async function mount() {
    currentShelfPage = 0; isTransitioning = false; editMode = false; selEl = null;
    const ownerId = await resolveOwnerId();
    await loadRoom(ownerId);                    /* ⚠ 첫 그림 전에 읽는다 — 나중이면 한 번 튄다 */
    const t = slot();
    const ok = await setRoomBg([ bgUrl(REAL_NO, t), bgUrl(REAL_NO, 'd'), bgUrl(1, 'd') ]);
    await loadBooks(ownerId);
    buildShelfPages();
    buildDots();
    if (ok) runCamera();                        /* ⚠ 그림이 실린 뒤 — fit 높이가 0이면 헛돈다 */
    document.getElementById('bk-prev').addEventListener('click', () => slide(-1));
    document.getElementById('bk-next').addEventListener('click', () => slide(+1));

    const isOwner = !!getUser()?.id && ownerId === getUser()?.id;
    const dock = document.getElementById('bk-dock');
    if (dock) dock.hidden = !isOwner;           /* 순례(남의 집)면 조종간 자체가 없다 */
    if (isOwner){
      const h = document.getElementById('bk-dock-h');
      const m = document.getElementById('bk-dock-menu');
      if (h && m) h.addEventListener('click', ()=>{
        m.hidden = !m.hidden; h.classList.toggle('on', !m.hidden);
      });
      const eb = document.getElementById('bk-edit-toggle');
      if (eb) eb.addEventListener('click', toggleEdit);
      bindAddModal(ownerId);
      /* ⚖는 살롱지기만 — living_rooms는 서른 채가 함께 쓰는 표다 */
      try {
        const u = await sbFetch(`/rest/v1/users?id=eq.${ownerId}&select=is_admin`);
        if (u && u[0] && u[0].is_admin){
          const rb = document.getElementById('bk-rule-toggle');
          if (rb){ rb.hidden = false; rb.addEventListener('click', toggleRule); }
        }
      } catch(e){}
    }
    const fc = document.querySelector('.floor-content[data-floor="3"]');
    if (fc) fc.classList.remove('editing');
  }

  /* ── DB에서 그 집 책 읽어오기 — seq 큰 것이 첫 자리(새 책이 맨 앞) ── */
  async function loadBooks(ownerId) {
    BOOKS = []; PAGES = [];
    if (!ownerId) { buildPages(); return; }
    try {
      const rows = await sbFetch(`/rest/v1/wunderkammer_books?owner_id=eq.${ownerId}`
        + `&select=id,owner_id,title,author,cover_url,cover_w,cover_h,scale,essay_title,essay_body,seq`
        + `&order=seq.desc`);
      BOOKS = (rows || []).map(r => ({
        id: r.id, owner_id: r.owner_id, title: r.title, author: r.author, cover: r.cover_url,
        cover_w: r.cover_w, cover_h: r.cover_h, scale: r.scale,
        essay_title: r.essay_title, essay_body: r.essay_body, seq: r.seq
      }));
    } catch (e) { BOOKS = []; }
    buildPages();
  }

  let BAM_CURRENT = null, BAM_OWNER = null;
  const bamEsc = s => (s||'').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const bamEl = id => document.getElementById(id);

  function bindAddModal(ownerId){
    BAM_OWNER = ownerId;
    const at = bamEl('bk-add-toggle'); if (at) at.addEventListener('click', openAddModal);
    const cb = bamEl('bam-close');     if (cb) cb.addEventListener('click', closeAddModal);
    const gb = bamEl('bam-go');        if (gb) gb.addEventListener('click', bamSearch);
    const q  = bamEl('bam-q');         if (q)  q.addEventListener('keydown', e => { if (e.key === 'Enter') bamSearch(); });
    const ad = bamEl('bam-add');       if (ad) ad.addEventListener('click', bamAddBook);
    const md = bamEl('bk-add-modal');  if (md) md.addEventListener('click', e => { if (e.target === md) closeAddModal(); });
  }

  function openAddModal(){
    const md = bamEl('bk-add-modal'); if (!md) return;
    bamEl('bam-q').value = '';
    bamEl('bam-grid').innerHTML = '';
    bamEl('bam-picked').className = 'bam-picked';
    const st = bamEl('bam-status'); st.className = 'bam-status'; st.textContent = '책 제목을 적고 검색을 눌러보세요.';
    BAM_CURRENT = null;
    md.classList.add('on');
    setTimeout(() => { const q = bamEl('bam-q'); if (q) q.focus(); }, 100);
  }
  function closeAddModal(){ const md = bamEl('bk-add-modal'); if (md) md.classList.remove('on'); }

  async function bamSearch(){
    const q = bamEl('bam-q').value.trim();
    const grid = bamEl('bam-grid'), st = bamEl('bam-status'), gb = bamEl('bam-go');
    if (!q){ bamEl('bam-q').focus(); return; }
    st.className = 'bam-status'; st.textContent = '찾는 중…'; grid.innerHTML = '';
    bamEl('bam-picked').className = 'bam-picked'; gb.disabled = true;
    try {
      const data = await sbFetch('/functions/v1/naver-book-search', { method:'POST', body: JSON.stringify({ q, display:21 }) });
      if (data && data.error) throw new Error(data.error);
      const books = (data && data.books) || [];
      if (!books.length){ st.textContent = '검색 결과가 없습니다.'; return; }
      st.textContent = ''; bamRender(books);
    } catch(e){
      st.className = 'bam-status err';
      st.innerHTML = '검색이 막혔어요. <b>은교살롱 로그인</b> 후 새로고침이 필요할 수 있어요.<br><span style="font-size:11px;opacity:.7">(' + bamEsc(e.message||e) + ')</span>';
    } finally { gb.disabled = false; }
  }

  function bamRender(books){
    const grid = bamEl('bam-grid'); grid.innerHTML = '';
    books.forEach(b => {
      const cover = b.cover_url || '';
      const card = document.createElement('button');
      card.className = 'bam-card';
      card.innerHTML = '<div class="bam-cover">'
        + (cover ? '<img loading="lazy" src="' + bamEsc(cover) + '" alt="">' : '<div class="bam-noimg">표지 없음</div>')
        + '</div><div class="bam-ct">' + bamEsc(b.title||'') + '</div><div class="bam-ca">' + bamEsc(b.author||'—') + '</div>';
      card.onclick = () => bamChoose(b);
      grid.appendChild(card);
    });
  }

  function bamChoose(b){
    BAM_CURRENT = b;
    const img = bamEl('bam-pimg');
    img.src = b.cover_url || ''; img.style.display = b.cover_url ? 'block' : 'none';
    bamEl('bam-ptitle').textContent = b.title || '';
    bamEl('bam-pauth').textContent = b.author || '—';
    bamEl('bam-ppub').textContent = b.publisher || '—';
    bamEl('bam-pisbn').textContent = b.isbn || '—';
    const res = bamEl('bam-result'); res.className = 'bam-result'; res.innerHTML = '';
    const picked = bamEl('bam-picked'); picked.className = 'bam-picked on';
    picked.scrollIntoView({ behavior:'smooth', block:'center' });
  }

  // 표지 복사: 1차 직접 fetch → 막히면 Edge Function 프록시 (blob이라 sbFetch 못 씀 → raw fetch + 토큰)
  async function bamFetchCoverBlob(coverUrl){
    try {
      const r = await fetch(coverUrl, { mode:'cors' });
      if (r.ok){ const b = await r.blob(); if (b && b.size > 0) return { blob:b, via:'직접' }; }
    } catch(e){ /* CORS 막힘 → 프록시 */ }
    const token = await getValidToken();
    if (!token) throw new Error('로그인 세션 없음');
    const r2 = await fetch(SUPABASE_URL + '/functions/v1/naver-book-search', {
      method:'POST',
      headers:{ 'Authorization':'Bearer ' + token, 'apikey':SUPABASE_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ img: coverUrl })
    });
    if (!r2.ok) throw new Error('표지 프록시 실패 ' + r2.status);
    const b2 = await r2.blob();
    if (!b2 || b2.size === 0) throw new Error('표지 빈 응답');
    return { blob:b2, via:'프록시' };
  }

  function bamImgSize(blob){
    return new Promise(res => {
      const u = URL.createObjectURL(blob); const im = new Image();
      im.onload = () => { res({ w:im.naturalWidth, h:im.naturalHeight }); URL.revokeObjectURL(u); };
      im.onerror = () => { res({ w:null, h:null }); URL.revokeObjectURL(u); };
      im.src = u;
    });
  }

  async function bamAddBook(){
    if (!BAM_CURRENT) return;
    const res = bamEl('bam-result'), addBtn = bamEl('bam-add');
    if (!BAM_OWNER){ res.className = 'bam-result ng'; res.innerHTML = '⚠️ 로그인이 필요합니다.'; return; }
    addBtn.disabled = true; res.className = 'bam-result'; res.innerHTML = '표지를 우리 책방으로 옮기는 중…';
    try {
      let via = '—', w = null, h = null, cover_url = null;
      if (BAM_CURRENT.cover_url){
        const got = await bamFetchCoverBlob(BAM_CURRENT.cover_url); via = got.via;
        const sz = await bamImgSize(got.blob); w = sz.w; h = sz.h;
        const ext = ((got.blob.type.split('/')[1]) || 'jpg').replace('jpeg','jpg');
        const path = BAM_OWNER + '/' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
        const token = await getValidToken();
        const up = await fetch(SUPABASE_URL + '/storage/v1/object/book-covers/' + path, {
          method:'POST',
          headers:{ 'Authorization':'Bearer ' + token, 'apikey':SUPABASE_KEY, 'Content-Type':got.blob.type },
          body: got.blob
        });
        if (!up.ok) throw new Error('Storage 업로드 실패 ' + up.status);
        cover_url = SUPABASE_URL + '/storage/v1/object/public/book-covers/' + path;
      }
      /* 새 책은 맨 앞 = 1면 윗줄 맨 왼쪽. 나머지가 한 칸씩 밀리고 넘치면 다음 면으로.
         ⚠ 번호는 DB가 매긴다(wk_book_next_seq). 화면이 읽고·더하고·넣으면
           창을 둘 띄웠을 때 같은 자리 두 권이 생긴다 */
      let _nextSeq = 1;
      try {
        const _n = await sbFetch('/rest/v1/rpc/wk_book_next_seq', {
          method:'POST', body: JSON.stringify({ p_owner: BAM_OWNER }) });
        if (_n != null && !isNaN(Number(_n))) _nextSeq = Number(_n);
      } catch (e) { console.warn('[책의 방] 다음 자리 번호 조회 실패', e); }
      const ins = await sbFetch('/rest/v1/wunderkammer_books', {
        method:'POST', headers:{ 'Prefer':'return=representation' },
        body: JSON.stringify({
          owner_id: BAM_OWNER, source:'search',
          title: BAM_CURRENT.title, author: BAM_CURRENT.author,
          publisher: BAM_CURRENT.publisher, isbn: BAM_CURRENT.isbn,
          cover_url, cover_w:w, cover_h:h, seq: _nextSeq
        })
      });
      const row = Array.isArray(ins) ? ins[0] : ins;
      res.className = 'bam-result ok';
      res.innerHTML = '✅ <b>' + bamEsc(BAM_CURRENT.title) + '</b> 들였습니다!<br>'
        + '<span class="sm">표지 ' + via + ' 복사 · 원본 ' + (w&&h ? w+'×'+h : '크기?')
        + (row && row.id ? ' · row ' + String(row.id).slice(0,8) + '…' : '') + '</span>';
      // 책장 즉시 갱신 — 새 책이 바로 꽂힘
      await loadBooks(BAM_OWNER);
      buildShelfPages();
      buildDots();
    } catch(e){
      res.className = 'bam-result ng';
      res.innerHTML = '들이기가 막혔어요<br><span class="sm">' + bamEsc(e.message||e) + '</span>';
    } finally { addBtn.disabled = false; }
  }

  // ── 읽어온 책을 6권씩 페이지로 자른다 ──

  /* ── 읽어온 책을 아홉 권씩 면으로 자른다 ── */
  function buildPages() {
    PAGES = [];
    const S = slots();
    for (let i = 0; i < BOOKS.length; i += PER_PAGE) {
      PAGES.push(BOOKS.slice(i, i + PER_PAGE).map((b, j) => ({ book: b, slot: S[j] })));
    }
    if (!PAGES.length) PAGES = [[]];   /* 빈 책방도 한 면(화살표·닷 안전) */
  }

  /* ⭐ 자석 앉히기 — 밑변과 가운뎃줄은 못이고, 크기만 손님 것이다.
     너비는 무대 비율로 환산해서 미리 안다(DOM을 안 잰다).
       칸 폭%  = bay% × (무대세로/무대가로) ÷ 판형비 … STAGE_AR 한 상수로 접힌다 */
  function placeBook(el, book, slot) {
    const ratio = (book.cover_w && book.cover_h) ? (book.cover_h / book.cover_w) : 1.5;
    const sc = (book.scale != null && Number(book.scale) > 0) ? Number(book.scale) : 1;
    let h = slot.bay * 0.86 * sc;                 /* 기본 = 그 칸의 86% */
    h = Math.min(h, slot.bay - 0.55);             /* 천장을 안 뚫는다 */
    let w = h / STAGE_AR / ratio;                 /* 높이% → 너비% */
    if (w > slot.col * 0.92) {                    /* 옆 칸 중심선을 안 넘는다 */
      w = slot.col * 0.92;
      h = w * STAGE_AR * ratio;
    }
    el.style.left = slot.left + '%';
    el.style.top  = slot.top  + '%';              /* = 밑줄. translateY(-100%)가 세운다 */
    el.style.height = h + '%';
    el.style.width  = 'auto';
  }

  function buildShelfPages() {
    const stack = document.getElementById('bk-cover-stack');
    if (!stack) return;
    stack.innerHTML = '';
    PAGES.forEach((pageData, idx) => {
      const page = document.createElement('div');
      page.className = 'cover-page' + (idx === currentShelfPage ? ' active' : '');
      pageData.forEach(({ book, slot }) => {
        const el = document.createElement('div');
        el.className = 'cover-book';
        el._book = book; el._slot = slot;         /* ⚠ 번호가 아니라 책을 붙든다 — 순서가 바뀌어도 그 책이 열린다 */
        placeBook(el, book, slot);
        el.innerHTML = `<img src="${book.cover}" alt="${escAttr(book.title)}" title="${escAttr(book.title)} · ${escAttr(book.author||'')}">`
                     + `<div class="bk-handle" data-h="1"></div>`;
        el.addEventListener('click', (e) => {
          if (editMode) { if (!e.target.dataset.h) selectBook(el); return; }
          openBook(book);
        });
        bindEdit(el);
        page.appendChild(el);
      });
      stack.appendChild(page);
    });
  }
  function escAttr(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  /* ════ 편집 ════ */
  function toggleEdit() {
    editMode = !editMode;
    const fc = document.querySelector('.floor-content[data-floor="3"]');
    if (fc) fc.classList.toggle('editing', editMode);
    const btn = document.getElementById('bk-edit-toggle');
    if (btn) { btn.classList.toggle('on', editMode); btn.textContent = editMode ? '✓' : '✎'; }
    if (!editMode && selEl) { selEl.classList.remove('sel'); selEl = null; }
  }
  function selectBook(el) {
    if (selEl && selEl !== el) selEl.classList.remove('sel');
    selEl = el; el.classList.add('sel');
  }

  function bindEdit(el) {
    const book = el._book;
    let drag = false, sx, sy, bx, by;
    const dStart = (cx, cy) => {
      if (!editMode) return;
      selectBook(el); drag = true; sx = cx; sy = cy;
      bx = el._slot.left; by = el._slot.top;
      el.classList.add('grabbing');
    };
    const dMove = (cx, cy) => {
      if (!drag) return;
      const stack = el.closest('.cover-stack'); if (!stack) return;
      el.style.left = (bx + ((cx - sx) / stack.offsetWidth ) * 100) + '%';
      el.style.top  = (by + ((cy - sy) / stack.offsetHeight) * 100) + '%';
    };
    const dEnd = () => {
      if (!drag) return; drag = false; el.classList.remove('grabbing');
      snapSwap(el, book);
    };
    el.addEventListener('mousedown', (e) => {
      if (!editMode || e.target.dataset.h) return;
      e.preventDefault(); dStart(e.clientX, e.clientY);
      const mm = ev => dMove(ev.clientX, ev.clientY);
      const mu = () => { dEnd(); removeEventListener('mousemove', mm); removeEventListener('mouseup', mu); };
      addEventListener('mousemove', mm); addEventListener('mouseup', mu);
    });
    el.addEventListener('touchstart', (e) => {
      if (!editMode || e.target.dataset.h) return;
      const t = e.touches[0]; dStart(t.clientX, t.clientY);
    }, { passive: true });
    el.addEventListener('touchmove', (e) => {
      if (!drag) return; e.preventDefault(); const t = e.touches[0]; dMove(t.clientX, t.clientY);
    }, { passive: false });
    el.addEventListener('touchend', dEnd);
    el.addEventListener('touchcancel', dEnd);

    el.addEventListener('wheel', (e) => {
      if (!editMode) return; e.preventDefault(); selectBook(el);
      const cur = (book.scale != null) ? Number(book.scale) : 1;
      book.scale = +Math.max(0.5, Math.min(1.16, cur + (e.deltaY < 0 ? 0.03 : -0.03))).toFixed(3);
      placeBook(el, book, el._slot);
      clearTimeout(el._szT); el._szT = setTimeout(() => saveBook(book), 400);
    }, { passive: false });

    const handle = el.querySelector('.bk-handle');
    let hBase, hsx;
    const hStart = (cx) => { selectBook(el); hBase = (book.scale != null) ? Number(book.scale) : 1; hsx = cx; };
    const hMove = (cx) => {
      book.scale = +Math.max(0.5, Math.min(1.16, hBase + (cx - hsx) / 160)).toFixed(3);
      placeBook(el, book, el._slot);
    };
    handle.addEventListener('mousedown', (e) => {
      if (!editMode) return; e.preventDefault(); e.stopPropagation(); hStart(e.clientX);
      const mm = ev => hMove(ev.clientX);
      const mu = () => { saveBook(book); removeEventListener('mousemove', mm); removeEventListener('mouseup', mu); };
      addEventListener('mousemove', mm); addEventListener('mouseup', mu);
    });
    handle.addEventListener('touchstart', (e) => {
      if (!editMode) return; e.stopPropagation(); hStart(e.touches[0].clientX);
      const tm = ev => { ev.preventDefault(); hMove(ev.touches[0].clientX); };
      const tu = () => { saveBook(book); removeEventListener('touchmove', tm); removeEventListener('touchend', tu); };
      addEventListener('touchmove', tm, { passive: false }); addEventListener('touchend', tu);
    }, { passive: true });
  }

  /* 놓은 자리에서 가장 가까운 칸을 찾아 그 칸 책과 자리를 맞바꾼다.
     ⚠ seq 교환은 DB 함수 한 번(wk_book_swap_seq) — 화면이 두 번 치면
       하나만 성공했을 때 두 책이 같은 자리에 선다 */
  async function snapSwap(el, book) {
    const stack = el.closest('.cover-stack');
    const fromSlot = el._slot;
    if (!stack) { placeBook(el, book, fromSlot); return; }
    const sRect = stack.getBoundingClientRect();
    const eRect = el.getBoundingClientRect();
    const cx = ((eRect.left + eRect.width/2 - sRect.left) / sRect.width ) * 100;
    const cy = ((eRect.bottom            - sRect.top ) / sRect.height) * 100;
    let best = null, bd = Infinity;
    slots().forEach(s => {
      const d = (s.left - cx)*(s.left - cx) + (s.top - cy)*(s.top - cy)*0.6;
      if (d < bd) { bd = d; best = s; }
    });
    if (!best || best.i === fromSlot.i) { placeBook(el, book, fromSlot); return; }
    let targetEl = null;
    el.parentElement.querySelectorAll('.cover-book').forEach(o => {
      if (o !== el && o._slot && o._slot.i === best.i) targetEl = o;
    });
    if (!targetEl) { placeBook(el, book, fromSlot); return; }   /* 빈 칸 = 상대 없음 → 제자리 */
    const targetBook = targetEl._book;
    el._slot = best; targetEl._slot = fromSlot;
    placeBook(el, book, best);
    placeBook(targetEl, targetBook, fromSlot);
    const ok = await swapSeq(book.id, targetBook.id);
    if (ok) { const a = book.seq; book.seq = targetBook.seq; targetBook.seq = a; }
    else {
      el._slot = fromSlot; targetEl._slot = best;               /* DB가 안 받으면 화면도 되돌린다 */
      placeBook(el, book, fromSlot); placeBook(targetEl, targetBook, best);
    }
  }

  /* 자리 교환 — 둘 다 되거나 둘 다 안 되거나 (SECURITY DEFINER · 남의 서가는 거절) */
  async function swapSeq(idA, idB) {
    try {
      const r = await sbFetch('/rest/v1/rpc/wk_book_swap_seq', {
        method: 'POST', body: JSON.stringify({ p_a: idA, p_b: idB })
      });
      return r === true || r === 'true';
    } catch (e) { console.warn('[책의 방] 자리 교환 실패', e); return false; }
  }

  async function saveBook(book) {
    try {
      await sbFetch(`/rest/v1/wunderkammer_books?id=eq.${book.id}`, {
        method: 'PATCH', headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ scale: book.scale })   /* 자리는 seq가 정한다. 여기선 크기만 */
      });
    } catch (e) { /* 다음 조작에서 재시도 */ }
  }

  function buildDots() {
    const dots = document.getElementById('bk-dots');
    if (!dots) return;
    dots.innerHTML = '';
    if (PAGES.length < 2) return;                 /* 한 면뿐이면 닷을 안 세운다 */
    for (let i = 0; i < PAGES.length; i++) {
      const dot = document.createElement('div');
      dot.className = 'bk-dot' + (i === currentShelfPage ? ' active' : '');
      dot.addEventListener('click', () => transitionTo(i));
      dots.appendChild(dot);
    }
  }
  function transitionTo(idx) {
    if (isTransitioning || idx === currentShelfPage) return;
    isTransitioning = true;
    const pages = document.querySelectorAll('.floor-content[data-floor="3"] .cover-page');
    if (!pages.length) { isTransitioning = false; return; }
    pages[currentShelfPage].classList.remove('active');
    pages[idx].classList.add('active');
    currentShelfPage = idx;
    document.querySelectorAll('.floor-content[data-floor="3"] .bk-dot')
      .forEach((d, i) => d.classList.toggle('active', i === currentShelfPage));
    setTimeout(() => { isTransitioning = false; }, 600);
  }
  function slide(direction) {
    if (!PAGES.length) return;
    const next = (currentShelfPage + direction + PAGES.length) % PAGES.length;
    transitionTo(next);
  }

  const modal = document.getElementById('book-modal');
  let currentBook = null;
  const flipSound = document.getElementById('page-flip-sound');

  function playFlipSound() {
    if (!soundEnabled || muted) return;
    flipSound.currentTime = 0; flipSound.volume = 0.5;
    flipSound.play().catch(() => {});
  }
  function openBook(book) {
    currentBook = book;
    buildFlipbook(book, paginateEssay(book));
    modal.classList.add('open');
    // 내 책일 때만 글쓰기 버튼 (미래 순례 ?user= 대비)
    const myUid = getUser()?.id;
    const mine = !book.owner_id || book.owner_id === myUid;
    const wbtn = document.getElementById('essay-write-btn');
    if (wbtn) wbtn.style.display = mine ? 'block' : 'none';
  }
  // essay_body(긴 글) → 면 단위로 분할해 모달에 흐름. 없으면 안내.
  function escHtml(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  // 빈 글: 안내 두 면
  function emptyFaces(book){
    return [
      { title: book.title, paras: [`아직 『${book.title}』에 대한 글이 없습니다.`, '이 책과 당신 삶이 어떻게 만났는지, 한 편의 글로 남겨 보세요.'] },
      { title: null, paras: ['어떤 시기에 어떻게 다가왔는지, 왜 이 책을 사랑하는지.', '글은 곧 이 면에 펼쳐집니다.'] }
    ];
  }

  // 실측: 본문을 면 크기에 맞춰 여러 면으로 분할 (넘치면 다음 면 / 단락이 면보다 길면 어절로 쪼갬)
  function paginateEssay(book){
    const body = (book.essay_body || '').trim();
    if(!body) return { faces: emptyFaces(book), empty:true };
    const title = book.essay_title || book.title || '';
    const paras = body.split(/\n{2,}/).map(s => s.trim()).filter(Boolean);

    // 측정용 면 — 실제 .front 와 동일 클래스·컨텍스트(modal 안), 화면 밖
    const host = document.createElement('div');
    host.className = 'book';
    host.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none;';
    host.innerHTML = '<div class="page"><div class="front"><div class="page-content"></div></div></div>';
    modal.appendChild(host);
    const pc = host.querySelector('.page-content');
    const render = (t, ps) => { pc.innerHTML = (t?`<h2>${escHtml(t)}</h2>`:'') + ps.map(p=>`<p>${escHtml(p)}</p>`).join(''); };
    const overflow = () => pc.scrollHeight > pc.clientHeight + 1;

    const faces = [];
    let first = true;
    const queue = paras.slice();
    let guard = 0;
    while(queue.length && guard++ < 300){
      const t = first ? title : '';
      const accepted = [];
      while(queue.length){
        render(t, [...accepted, queue[0]]);
        if(!overflow()){ accepted.push(queue.shift()); continue; }
        if(accepted.length === 0){
          // 단락 하나가 한 면보다 김 → 어절 단위로 쪼갬
          const words = queue.shift().split(/(\s+)/);
          let lo = '';
          for(let k=0; k<words.length; k++){
            const test = lo + words[k];
            render(t, [test]);
            if(overflow() && lo.trim()) break;
            lo = test;
          }
          lo = lo.trim() || (words[0]||'');
          accepted.push(lo);
          const remain = words.join('').slice(lo.length).replace(/^\s+/, '');
          if(remain) queue.unshift(remain);
        }
        break; // 이 면 마감
      }
      faces.push({ title: t || null, paras: accepted });
      first = false;
    }
    host.remove();
    return { faces, empty:false };
  }
  function closeBook() {
    modal.classList.remove('open');
    setTimeout(() => { const b = modal.querySelector('.book'); if (b) b.remove(); }, 500);
  }
  function buildFlipbook(book, result) {
    const old = modal.querySelector('.book'); if (old) old.remove();
    const bookEl = document.createElement('div'); bookEl.className = 'book';

    // 읽기 순서: page0 = 표지(front) + 첫 면(back) / 이후 page = 면(front)+면(back) / 끝 면
    const seq = result.faces.slice();
    seq.push({ end:true, book });   // 마지막 끝 면

    bookEl.appendChild(buildPageEl(makeCoverHtml(book), makeFaceHtml(seq[0], 'back')));
    let i = 1;
    while (i < seq.length) {
      const front = makeFaceHtml(seq[i], 'front');
      const back  = (i+1 < seq.length) ? makeFaceHtml(seq[i+1], 'back') : makeBlankHtml();
      bookEl.appendChild(buildPageEl(front, back));
      i += 2;
    }

    modal.insertBefore(bookEl, modal.firstChild);
    bookEl.style.setProperty('--c', 0);
    bookEl.querySelectorAll('.page').forEach((page, idx) => {
      page.style.setProperty('--i', idx);
      page.addEventListener('click', (evt) => {
        if (evt.target.closest('a')) return;
        const curr = evt.target.closest('.back') ? idx : idx + 1;
        const prev = parseInt(bookEl.style.getPropertyValue('--c')) || 0;
        bookEl.style.setProperty('--c', curr);
        if (curr !== prev) playFlipSound();
      });
    });
  }
  function buildPageEl(frontHtml, backHtml) {
    const page = document.createElement('div'); page.className = 'page';
    page.innerHTML = frontHtml + backHtml; return page;
  }
  function makeCoverHtml(book) { return `<div class="front cover"><div class="cover-bg" style="background-image:url('${book.cover}')"></div></div>`; }
  function makeFaceHtml(face, side) {
    const cls = (side === 'back') ? 'back' : 'front';
    if (face.end) {
      const b = face.book;
      return `<div class="${cls} cover" style="background:#faf7f0;color:#2a1810"><div class="page-end"><h2>— 끝 —</h2><p class="author">${escHtml(b.author || '')}</p><p class="book-title">『${escHtml(b.essay_title || b.title || '')}』</p></div></div>`;
    }
    const h  = face.title ? `<h2>${escHtml(face.title)}</h2>` : '';
    const ps = (face.paras || []).map(p => `<p>${escHtml(p)}</p>`).join('');
    return `<div class="${cls}"><div class="page-content">${h}${ps}</div></div>`;
  }
  function makeBlankHtml() {
    return `<div class="back"><div class="page-content"></div></div>`;
  }

  // 모달 닫기 (한 번만 바인딩)
  document.getElementById('modal-close').addEventListener('click', closeBook);

  // ════ 에세이 글쓰기 (책 모달 안 ✎ → 양피지 입력 레이어 → DB 저장 → 면에 흐름) ════
  function openEssayEditor() {
    if (!currentBook) return;
    document.getElementById('ee-book-title').textContent = '『' + (currentBook.title || '') + '』';
    document.getElementById('ee-title').value = currentBook.essay_title || '';
    document.getElementById('ee-body').value  = currentBook.essay_body || '';
    updateEssayCount();
    document.getElementById('essay-editor').classList.add('open');
    setTimeout(() => document.getElementById('ee-body').focus(), 120);
  }
  function closeEssayEditor() {
    document.getElementById('essay-editor').classList.remove('open');
  }
  function updateEssayCount() {
    const n = document.getElementById('ee-body').value.length;
    document.getElementById('ee-count').textContent = n.toLocaleString() + '자';
  }
  async function saveEssay() {
    if (!currentBook) return;
    const title = document.getElementById('ee-title').value.trim();
    const body  = document.getElementById('ee-body').value.trim();
    const saveBtn = document.getElementById('ee-save');
    saveBtn.disabled = true; saveBtn.textContent = '저장 중…';
    try {
      await sbFetch(`/rest/v1/wunderkammer_books?id=eq.${currentBook.id}`, {
        method: 'PATCH', headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ essay_title: title || null, essay_body: body || null })
      });
      currentBook.essay_title = title || null;
      currentBook.essay_body  = body || null;
      closeEssayEditor();
      buildFlipbook(currentBook, paginateEssay(currentBook));  // 새 글을 면에 다시 흘림
    } catch (e) {
      alert('저장에 실패했습니다. 잠시 후 다시 시도해 주세요.');
    } finally {
      saveBtn.disabled = false; saveBtn.textContent = '저장';
    }
  }
  document.getElementById('essay-write-btn').addEventListener('click', openEssayEditor);
  document.getElementById('ee-cancel').addEventListener('click', closeEssayEditor);
  document.getElementById('ee-save').addEventListener('click', saveEssay);
  document.getElementById('ee-body').addEventListener('input', updateEssayCount);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeBook(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeBook();
  });

  return { markup, mount, slide };
})();

/* ============================================================
 *  Ⅳ층 지성소 모듈 (Floor4) — 내 교양의 지성소 · 1단계 골격
 *    12 카테고리 = 독립 방 12개 (4f_bg01~12.webp)
 *    uid 해시 offset → 콩파뇽마다 시작 방이 다름 · 좌우 화살표로 순환
 *    배경=헤리티지 풀스크린 무대(4:5 세로, 천장↔마루 스크롤) · 화살표/roomtag=헤리티지
 *    [1단계] 배경·순환·빈 서가까지. 책등(quiz_log)·4레이어 모달은 2·3단계.
 * ============================================================ */
const Floor4 = (() => {
  // 12방 고정 순서 (콘스텔라티오·뮤세움과 동일 · 파일번호 = 인덱스+1)
  const ROOMS = [
    { cat:'문학', sub:'종이 위의 인간' },   // 4f_bg01
    { cat:'철학', sub:'생각의 탄생' },       // 4f_bg02
    { cat:'역사', sub:'시간의 지층' },       // 4f_bg03
    { cat:'예술', sub:'아름다움의 형식' },   // 4f_bg04
    { cat:'신화', sub:'신들의 정원' },       // 4f_bg05
    { cat:'과학', sub:'우주의 문법' },       // 4f_bg06
    { cat:'심리', sub:'내면의 거울' },       // 4f_bg07
    { cat:'사회', sub:'세상의 구조' },       // 4f_bg08
    { cat:'영성', sub:'초월의 언어' },       // 4f_bg09
    { cat:'생태', sub:'땅의 노래' },         // 4f_bg10
    { cat:'지리', sub:'세계의 골목' },       // 4f_bg11
    { cat:'일상', sub:'삶의 향기' },         // 4f_bg12
  ];
  let currentRoom = 0;
  let isTransitioning = false;
  let tagTimer = null;
  let BOOKS_BY_CAT = {};   // 대분류 → [{answer, seed_id, category}] (quiz_log 우물)

  // 책등 이미지·높이 — 뮤세움과 같은 해시 (book01~10.webp 공유)
  const F4_BOOK_IMAGES = ['book01','book02','book03','book04','book05','book06','book07','book08','book09','book10'];
  function f4BookImg(answer){
    let h=0; for(let i=0;i<answer.length;i++) h=(h*31+answer.charCodeAt(i))&0xfffff;
    return F4_BOOK_IMAGES[h % F4_BOOK_IMAGES.length];
  }
  function f4BookHeight(answer){
    let h=0; for(let i=0;i<answer.length;i++) h=(h*17+answer.charCodeAt(i))&0xfffff;
    const hs=[150,162,172,180,188,196,176,168,158,184];   // 뮤세움 대비 ~1.35배
    return hs[h % hs.length];
  }

  // uid 해시 → 시작 방 (shelfBgIndex와 같은 문법, 0~11)
  function startOffsetOf(uid){
    if(!uid) return 0;
    let sum = 0; for(let i=0;i<uid.length;i++) sum = (sum + uid.charCodeAt(i)) % 100000;
    return sum % 12;
  }

  function markup() {
    return `
      <div class="floor-content" data-floor="4">
        <div class="f4-scroll" id="f4-scroll">
          <div class="f4-stage" id="f4-stage">
            <div class="f4-bgwrap" id="f4-bgwrap"></div>
            <div class="f4-shelf" id="f4-shelf">
              <div class="f4-shelfwrap" id="f4-shelfwrap">
                <div class="f4-books" id="f4-books"></div>
                <div class="f4-wood"></div>
              </div>
            </div>
          </div>
        </div>
        <button class="f4-nav f4-nav-l" id="f4-prev" aria-label="이전 방">‹</button>
        <button class="f4-nav f4-nav-r" id="f4-next" aria-label="다음 방">›</button>
        <div class="f4-empty" id="f4-empty"></div>
        <div class="f4-roomtag" id="f4-roomtag"></div>
        <div class="f4-tabs" id="f4-tabs"></div>
      </div>`;
  }

  // 방 배경 크로스페이드 (setRoomBg 본뜸)
  function setRoomBg(idx, animate){
    const wrap = document.getElementById('f4-bgwrap');
    if(!wrap) return;
    const layer = document.createElement('div');
    layer.className = 'f4-bg-layer';
    layer.style.backgroundImage = `url('4f_bg${String(idx+1).padStart(2,'0')}.webp')`;
    layer.style.opacity = animate ? '0' : '1';
    wrap.insertBefore(layer, wrap.firstChild);
    if(animate) requestAnimationFrame(()=>requestAnimationFrame(()=>{ layer.style.opacity = '1'; }));
    wrap.querySelectorAll('.f4-bg-layer').forEach(el=>{
      if(el !== layer){ el.style.opacity = '0'; setTimeout(()=>el.remove(), 950); }
    });
  }

  // 방 이름 떴다 사라짐 (roomtag 본뜸)
  function showRoomTag(idx){
    const tag = document.getElementById('f4-roomtag');
    if(!tag) return;
    const r = ROOMS[idx];
    tag.innerHTML = `${r.cat}<small>${r.sub}</small>`;
    tag.classList.add('on');
    clearTimeout(tagTimer);
    tagTimer = setTimeout(()=>tag.classList.remove('on'), 3700);
  }

  // 상단 상시 카테고리 타이틀 갱신
  function setTopCat(idx){
    const el = document.getElementById('fl-cat');
    if(el){ const r = ROOMS[idx]; el.innerHTML = `${r.cat} <span>· ${r.sub}</span>`; }
  }

  // 하단 방 탭 (절충 — 작은 글자 12개, 현재 방 또렷)
  function buildTabs(){
    const host = document.getElementById('f4-tabs');
    if(!host) return;
    host.innerHTML = ROOMS.map((r,i)=>`<button class="f4-tab" data-i="${i}">${r.cat}</button>`).join('');
    host.querySelectorAll('.f4-tab').forEach(b=>{
      b.addEventListener('click', ()=>transitionTo(+b.dataset.i));
    });
  }
  function updateTabs(idx){
    document.querySelectorAll('.floor-content[data-floor="4"] .f4-tab')
      .forEach((b,i)=>b.classList.toggle('active', i===idx));
  }

  // 방 내용 그리기 — [2단계] 그 방 카테고리 책등 진열 (없으면 기다리는 방)
  function renderRoom(idx){
    const cat = ROOMS[idx].cat;
    const books = BOOKS_BY_CAT[cat] || [];
    const shelf = document.getElementById('f4-books');
    const empty = document.getElementById('f4-empty');
    const wrap  = document.getElementById('f4-shelfwrap');
    if(!shelf) return;
    shelf.innerHTML = '';
    if(books.length === 0){
      if(wrap)  wrap.style.display = 'none';
      if(empty){ empty.style.display = ''; empty.textContent = '이 방은 당신을 기다리고 있습니다'; }
      return;
    }
    if(empty) empty.style.display = 'none';
    if(wrap)  wrap.style.display = '';
    for(const b of books){
      const item = document.createElement('div');
      item.className = 'f4-book';
      item.title = b.answer;
      const im = document.createElement('img');
      im.className = 'f4-book-img';
      im.src = f4BookImg(b.answer) + '.webp';
      im.style.height = f4BookHeight(b.answer) + 'px';
      im.alt = b.answer;
      const tx = document.createElement('div');
      tx.className = 'f4-book-text';
      tx.textContent = b.answer;
      item.appendChild(im);
      item.appendChild(tx);
      item.addEventListener('click', ()=>f4OpenBook(b));
      shelf.appendChild(item);
    }
  }

  // 첫 화면을 방 중앙부로 (천장은 위로, 마루는 아래로 스크롤)
  function centerScroll(smooth){
    const sc = document.getElementById('f4-scroll');
    if(!sc) return;
    const mid = Math.max(0, (sc.scrollHeight - sc.clientHeight) / 2);
    if(smooth) sc.scrollTo({ top: mid, behavior:'smooth' });
    else sc.scrollTop = mid;
  }

  function transitionTo(idx){
    if(isTransitioning || idx === currentRoom) return;
    isTransitioning = true;
    currentRoom = idx;
    setRoomBg(idx, true);
    showRoomTag(idx);
    setTopCat(idx);
    updateTabs(idx);
    renderRoom(idx);
    requestAnimationFrame(()=>centerScroll(false));
    setTimeout(()=>{ isTransitioning = false; }, 650);
  }

  function slide(direction){
    if(currentFloor !== 4) return;
    transitionTo((currentRoom + direction + 12) % 12);
  }

  // quiz_log 우물 → 대분류별 책 묶음 (OX 제외 · answer 중복 제거)
  async function loadBooks(uid){
    BOOKS_BY_CAT = {};
    if(!uid) return;
    let rows = [];
    try{
      rows = await sbFetch(`/rest/v1/rpc/get_sanctuaire_books?p_uid=${encodeURIComponent(uid)}`) || [];
    }catch(e){ console.warn('[F4] quiz_log 로드 실패', e); return; }
    const seen = {};
    for(const r of rows){
      if(!r.answer || r.answer==='O' || r.answer==='X') continue;       // OX 제외
      const cat = (r.category||'').split(' · ')[0];                       // 대분류
      if(!cat) continue;
      const key = cat + '|' + r.answer;
      if(seen[key]) continue;                                            // answer 중복 1권만
      seen[key] = 1;
      (BOOKS_BY_CAT[cat] = BOOKS_BY_CAT[cat] || []).push({ answer:r.answer, seed_id:r.seed_id, category:r.category });
    }
  }

  // 순례 ?user= 우선, 없으면 본인 (3층과 동일 정신)
  async function resolveOwnerId(){
    const qUser = new URLSearchParams(location.search).get('user');
    if(qUser){
      try{
        const u = await sbFetch(`/rest/v1/users?nickname=eq.${encodeURIComponent(qUser)}&select=id`);
        if(u && u[0] && u[0].id) return u[0].id;
      }catch(e){ console.warn('[F4] owner 조회 실패', e); }
      return null;
    }
    return getUser()?.id || null;
  }

  async function mount(){
    isTransitioning = false;
    const uid = await resolveOwnerId();
    await loadBooks(uid);                       // quiz_log 우물 → 대분류별 책
    currentRoom = startOffsetOf(uid);          // 콩파뇽마다 시작 방 다름
    setRoomBg(currentRoom, false);
    showRoomTag(currentRoom);
    setTopCat(currentRoom);
    buildTabs();
    updateTabs(currentRoom);
    renderRoom(currentRoom);
    const prev = document.getElementById('f4-prev');
    const next = document.getElementById('f4-next');
    if(prev) prev.addEventListener('click', ()=>slide(-1));
    if(next) next.addEventListener('click', ()=>slide(+1));
    f4InitModal();   // 책 모달 이벤트 1회 바인딩
    requestAnimationFrame(()=>centerScroll(false));
  }

  const F4_COVER_LAYOUTS = ['band_body', 'full_center', 'minimal'];
  function f4StrHash(s){ let h=0; for(let c of String(s)) h=(h*31+c.charCodeAt(0))&0xfffff; return h; }

  let f4CurrentPage = 0, f4TotalPages = 0, f4IsAnimating = false, f4CurrentBook = null, f4ModalInited = false;
  const f4PageAudio = new Audio('page_turn.mp3'); f4PageAudio.volume = 0.7;
  function f4PlaySound(){ try{ f4PageAudio.currentTime = 0; f4PageAudio.play().catch(()=>{}); }catch(e){} }

  // *별표* 강조 → 또렷한 볼드 산세리프 (뮤세움과 동일 규약)
  function f4RenderMarkdown(text){
    if(!text) return '';
    return String(text)
      .replace(/\*\*([^*\n]+?)\*\*/g, '<strong style="font-family:\'Noto Sans KR\',\'맑은 고딕\',sans-serif;font-weight:700;color:#2a1f08">$1</strong>')
      .replace(/\*([^*\n]+?)\*/g, '<strong style="font-family:\'Noto Sans KR\',\'맑은 고딕\',sans-serif;font-weight:600;color:#3a2a10">$1</strong>');
  }

  // ── 3D 표지 빌드 ──────────────────────────────

          <div style="width:44px;height:1px;background:linear-gradient(to right,transparent,${accent},transparent);margin:10px auto;opacity:0.45"></div>

          <div style="margin-top:auto;padding-top:10px;border-top:1px solid ${accent}22;width:100%">

  // ── 책 열기 (단건 조회 → 표지) ────────────────
  async function f4OpenBook(b){
    f4IsAnimating = false;
    const overlay = document.getElementById('f4bookModalOverlay');
    overlay.classList.add('open');                 // 즉시 화면 반응(배경 페이드)

    // questions 단건 조회로 4레이어·부제·큐레이션링크 획득
    const book = { answer:b.answer, category:b.category, keyword:'', library:{}, curation_links:null };
    try{
      const rows = await sbFetch(`/rest/v1/questions?seed_id=eq.${encodeURIComponent(b.seed_id)}&select=answer,keyword,category,library,curation_links&limit=1`);
      if(rows && rows[0]){
        const q = rows[0];
        book.keyword = q.keyword || '';
        book.library = q.library || {};
        book.curation_links = q.curation_links || null;
        if(q.category) book.category = q.category;
      }
    }catch(e){ console.warn('[F4] library 조회 실패', e); }
    f4CurrentBook = book;

    f4BuildCover(book);
    document.getElementById('f4coverScene').style.visibility = 'visible';
    document.getElementById('f4coverScene').style.pointerEvents = 'auto';
    document.getElementById('f4bookModal').classList.remove('visible');
    document.getElementById('f4coverShadow').style.opacity = '1';
    setTimeout(()=> overlay.classList.add('bg-light'), 50);
    f4AttachTilt();
  }

  function f4AttachTilt(){
    const scene  = document.getElementById('f4coverScene');
    const book3d = document.getElementById('f4coverBook3D');
    scene.onmousemove = e => {
      if(f4IsAnimating) return;
      const r = scene.getBoundingClientRect();
      const dx = (e.clientX - (r.left + r.width/2))  / (r.width/2);
      const dy = (e.clientY - (r.top  + r.height/2)) / (r.height/2);
      book3d.style.transform = `rotateY(${-26 + dx*14}deg) rotateX(${4 - dy*8}deg)`;
      book3d.style.transition = 'transform 0.06s linear';
    };
    scene.onmouseleave = () => {
      if(f4IsAnimating) return;
      book3d.style.transform = 'rotateY(-26deg) rotateX(4deg)';
      book3d.style.transition = 'transform 0.5s cubic-bezier(0.23,1,0.32,1)';
    };
  }

  // ── 표지 클릭 → 내부 진입 (줌인) ──────────────
  function f4EnterBook(){
    if(f4IsAnimating) return;
    f4IsAnimating = true;
    const book3d = document.getElementById('f4coverBook3D');
    const shadow = document.getElementById('f4coverShadow');
    book3d.style.transition = 'transform 0.48s cubic-bezier(0.23,1,0.32,1)';
    book3d.style.transform  = 'rotateY(0deg) rotateX(0deg)';
    shadow.style.opacity    = '0';
    setTimeout(()=>{
      book3d.style.transition = 'transform 1.0s cubic-bezier(0.25,0,0.2,1), opacity 0.55s ease 0.45s';
      book3d.style.transform  = 'rotateY(0deg) rotateX(0deg) scale(3.8)';
      book3d.style.opacity    = '0';
    }, 450);
    setTimeout(()=>{
      document.getElementById('f4coverScene').style.visibility = 'hidden';
      document.getElementById('f4coverScene').style.pointerEvents = 'none';
      // 표지 리셋(다음 열기 대비)
      book3d.style.transition = 'none';
      book3d.style.transform  = 'rotateY(-26deg) rotateX(4deg)';
      book3d.style.opacity    = '1';
      f4ShowInnerPages();
      f4IsAnimating = false;
    }, 1100);
  }

  function f4ShowInnerPages(){
    const book = f4CurrentBook;
    f4CurrentPage = 0;
    const lib = book.library || {};
    const pages = f4BuildPages(book, lib);
    if(pages.length === 0){
      pages.push(f4MakeInnerPage('EG', book.answer, '아직 해설이 준비되지 않았습니다.', 1));
      pages.push(f4MakeLastPage(book, 2));
    }
    f4TotalPages = pages.length;

    const pagesEl = document.getElementById('f4bookPages');
    const navEl = pagesEl.querySelector('.f4book-nav');
    pagesEl.innerHTML = '';
    if(navEl) pagesEl.appendChild(navEl);

    pages.forEach((p, i) => {
      p.style.display       = 'flex';
      p.style.flexDirection = 'column';
      p.style.width         = '100%';
      p.style.height        = '460px';
      p.style.position      = 'absolute';
      p.style.top           = '0';
      p.style.left          = '0';
      p.style.right         = '0';
      p.style.zIndex        = i === 0 ? '12' : '1';
      p.style.transform     = i === 0 ? 'translateX(0)' : 'translateX(100%)';
      p.style.transition    = 'none';
      if(p.classList.contains('f4page-inner')){
        p.style.overflowX = 'hidden';
        p.style.overflowY = 'auto';
        p.style.webkitOverflowScrolling = 'touch';
      } else {
        p.style.overflow = 'hidden';
      }
      p.addEventListener('click', (ev) => {
        if(ev.target.closest('a, button, [data-no-flip]')) return;
        const rect = p.getBoundingClientRect();
        const x = ev.clientX - rect.left;
        if(x < rect.width * 0.35) f4TurnPage(-1);
        else if(x > rect.width * 0.65) f4TurnPage(1);
      });
      pagesEl.appendChild(p);
    });

    f4RenderDots();
    f4UpdateNavZones();

    const modal = document.getElementById('f4bookModal');
    modal.classList.add('visible');
    modal.style.visibility = 'visible';
    modal.style.opacity = '0';
    const vw = window.innerWidth, vh = window.innerHeight;
    modal.style.top  = Math.round((vh - 520) / 2) + 'px';
    modal.style.left = Math.round((vw - 340) / 2) + 'px';
    modal.style.transform = 'scale(0.96)';
    modal.style.transition = 'none';
    modal.getBoundingClientRect();
    modal.style.transition = 'opacity 0.38s ease, transform 0.38s ease';
    setTimeout(()=>{
      modal.style.opacity = '1';
      modal.style.transform = 'scale(1)';
      modal.style.pointerEvents = 'all';
    }, 30);
  }

  // ── 페이지 넘기기 (애플북스 슬라이드) ──────────
  function f4TurnPage(dir){
    if(f4IsAnimating) return;
    const next = f4CurrentPage + dir;
    if(next < 0 || next >= f4TotalPages) return;
    f4IsAnimating = true;
    f4PlaySound();
    const pagesEl  = document.getElementById('f4bookPages');
    const allPages = pagesEl.querySelectorAll('.f4book-page-view');
    const outPage  = allPages[f4CurrentPage];
    const inPage   = allPages[next];
    if(dir > 0){
      inPage.style.zIndex = '11';  inPage.style.transform = 'translateX(0)';  inPage.style.transition = 'none';
      outPage.style.zIndex = '12'; outPage.style.transition = 'none';         outPage.style.transform = 'translateX(0)';
      requestAnimationFrame(()=>{
        outPage.style.transition = 'transform 0.48s cubic-bezier(0.32,0.72,0,1)';
        outPage.style.transform  = 'translateX(-100%)';
      });
    } else {
      outPage.style.zIndex = '11'; outPage.style.transform = 'translateX(0)';  outPage.style.transition = 'none';
      inPage.style.zIndex = '13';  inPage.style.transition = 'none';           inPage.style.transform = 'translateX(100%)';
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
        inPage.style.transition = 'transform 0.48s cubic-bezier(0.32,0.72,0,1)';
        inPage.style.transform  = 'translateX(0)';
      }); });
    }
    setTimeout(()=>{
      f4CurrentPage = next;
      inPage.scrollTop = 0;
      inPage.style.zIndex  = '12';
      outPage.style.zIndex = '1';
      f4RenderDots();
      f4UpdateNavZones();
      f4IsAnimating = false;
    }, 490);
  }

  function f4UpdateNavZones(){
    const l = document.getElementById('f4navLeft');
    const r = document.getElementById('f4navRight');
    if(l) l.style.display = f4CurrentPage === 0              ? 'none' : 'flex';
    if(r) r.style.display = f4CurrentPage === f4TotalPages-1 ? 'none' : 'flex';
  }

  function f4RenderDots(){
    const dots = document.getElementById('f4bookDots');
    dots.innerHTML = '';
    for(let i = 0; i < f4TotalPages; i++){
      const dot = document.createElement('div');
      dot.className = 'f4book-page-dot' + (i === f4CurrentPage ? ' active' : '');
      dots.appendChild(dot);
    }
  }

  function f4CloseBook(){
    const overlay = document.getElementById('f4bookModalOverlay');
    document.getElementById('f4coverScene').style.visibility = 'visible';
    document.getElementById('f4coverScene').style.pointerEvents = 'auto';
    overlay.classList.remove('open', 'bg-light');
    const book3d = document.getElementById('f4coverBook3D');
    book3d.style.transition = 'none';
    book3d.style.transform  = 'rotateY(-26deg) rotateX(4deg)';
    book3d.style.opacity    = '1';
    document.getElementById('f4coverShadow').style.opacity = '1';
    const modal = document.getElementById('f4bookModal');
    modal.style.transition = 'opacity 0.38s ease, transform 0.38s ease';
    modal.style.opacity = '0';
    modal.style.transform = 'scale(0.96)';
    modal.style.pointerEvents = 'none';
    setTimeout(()=>{
      modal.style.visibility = 'hidden';
      modal.style.opacity = '0';
      modal.classList.remove('visible');
    }, 400);
    f4IsAnimating = false;
  }

  function f4OverlayClick(e){
    if(e.target === document.getElementById('f4bookModalOverlay')) f4CloseBook();
  }

  // ── 페이지 구성 (지식·사유·연결·큐레이션·마지막) ──
  function f4BuildPages(book, lib){
    const pages = [];
    if(lib.knowledge)  pages.push(f4MakeInnerPage('LAYER 1 · 지식', '알고 이해하기', lib.knowledge, pages.length + 1));
    if(lib.thought)    pages.push(f4MakeInnerPage('LAYER 2 · 사유', '생각하고 느끼기', lib.thought, pages.length + 1));
    if(lib.connection) pages.push(f4MakeInnerPage('LAYER 3 · 연결', '삶과 이어보기', lib.connection, pages.length + 1));
    if(lib.curation)        pages.push(f4MakeCurationPage(lib.curation, pages.length + 1, book.curation_links));
    else if(book.curation_links) pages.push(f4MakeCurationPage('', pages.length + 1, book.curation_links));
    pages.push(f4MakeLastPage(book, pages.length + 1));
    return pages;
  }

  function f4MakeInnerPage(tag, heading, body, num){
    const div = document.createElement('div');
    div.className = 'f4book-page-view f4page-inner';
    div.innerHTML = `
      <div class="f4page-lines"></div>
      <div class="f4page-inner-content">
        <div class="f4page-layer-tag">${tag}</div>
        <div class="f4page-layer-heading">${heading}</div>
        <div class="f4page-layer-body">${f4RenderMarkdown(body)}</div>
      </div>
      <div class="f4page-num-inner">${num}</div>
      <div class="f4page-corner"></div>`;
    return div;
  }

  function f4MakeCurationPage(curation, num, links){
    const div = document.createElement('div');
    div.className = 'f4book-page-view f4page-inner';
    const items = (curation || '').split('/').map(s => s.trim()).filter(Boolean);
    const itemsHtml = items.map(item => `
      <div style="padding:10px 0;border-bottom:1px solid rgba(180,160,120,0.15);font-size:13px;color:#3D2F10;font-family:'Noto Serif KR',serif;line-height:1.6">
        ${f4RenderMarkdown(item)}
      </div>`).join('');
    let linksHtml = '';
    if(links && (links.books || links.library_call_number || links.youtube_keywords)){
      linksHtml = f4RenderCurationLinks(links);
    }
    div.innerHTML = `
      <div class="f4page-lines"></div>
      <div class="f4page-inner-content">
        <div class="f4page-layer-tag">LAYER 4 · 큐레이션</div>
        <div class="f4page-layer-heading">더 깊이 들어가기</div>
        ${itemsHtml}
        ${linksHtml}
      </div>

  }

  // curation_links → HTML (책 찾기 / 도서관 청구기호 / 유튜브)
  function f4RenderCurationLinks(links){
    const sections = [];
    const linkStyle = "color:#8B6F2A;text-decoration:none;border-bottom:1px solid rgba(139,111,42,0.3);padding-bottom:1px";
    const stopProp = `onclick="event.stopPropagation()" ontouchstart="event.stopPropagation()"`;
    if(links.books && links.books.length > 0){
      const bookCards = links.books.map(b => {
        const title = b.title || '';
        const meta = [b.translator && `${b.translator} 옮김`, b.publisher].filter(Boolean).join(' · ');
        const parts = b.isbn ? [b.isbn] : [title, b.author, (b.translator || b.publisher)].filter(Boolean);
        const q = encodeURIComponent(parts.join(' '));
        const stores = [
          `<a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener" ${stopProp} style="${linkStyle}">책 찾기</a>`,
        ];
        const storesHtml = `<div style="margin-top:6px;font-size:11px;letter-spacing:0.05em">${stores.join(' · ')}</div>`;
        return `
          <div style="padding:10px 0;border-bottom:1px solid rgba(180,160,120,0.12);font-family:'Noto Serif KR',serif;">
            <div style="font-size:13px;color:#3D2F10;font-weight:500">${title}</div>
            ${meta ? `<div style="font-size:11px;color:rgba(80,60,30,0.6);margin-top:3px">${meta}</div>` : ''}
            ${storesHtml}
          </div>`;
      }).join('');
      sections.push(`
        <div style="margin-top:18px">
          <div style="font-size:10px;letter-spacing:0.18em;color:rgba(120,90,40,0.55);font-family:'Courier New',monospace;margin-bottom:6px">📖 책</div>
          ${bookCards}
        </div>`);
    }
    if(links.library_call_number){
      sections.push(`
        <div style="margin-top:18px">
          <div style="font-size:10px;letter-spacing:0.18em;color:rgba(120,90,40,0.55);font-family:'Courier New',monospace;margin-bottom:6px">🏛 도서관 청구기호</div>
          <div style="font-size:13px;color:#3D2F10;font-family:'Noto Serif KR',serif">${links.library_call_number}</div>
        </div>`);
    }
    if(links.youtube_keywords){
      const kw = encodeURIComponent(links.youtube_keywords);
      sections.push(`
        <div style="margin-top:18px">
          <div style="font-size:10px;letter-spacing:0.18em;color:rgba(120,90,40,0.55);font-family:'Courier New',monospace;margin-bottom:6px">▶ 영상</div>
          <a href="https://www.youtube.com/results?search_query=${kw}" target="_blank" rel="noopener" ${stopProp} style="${linkStyle};font-size:13px;font-family:'Noto Serif KR',serif">${links.youtube_keywords}</a>
        </div>`);
    }
    return sections.join('');
  }

  // 마지막 페이지 — 지성소로 돌아가기
  function f4MakeLastPage(book, num){
    const div = document.createElement('div');
    div.className = 'f4book-page-view f4page-philemon';
    div.innerHTML = `
      <div class="f4page-lines"></div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;">
        <div style="font-size:22px;margin-bottom:20px;opacity:0.4">✦</div>

        <div style="width:32px;height:1px;background:rgba(180,150,80,0.3);margin:12px auto"></div>
        <div style="font-size:11px;color:rgba(100,80,40,0.45);letter-spacing:0.18em;font-family:'Courier New',monospace;margin-bottom:24px">마지막 페이지입니다</div>
        <div style="font-size:10px;color:rgba(100,80,40,0.3);font-family:'Noto Serif KR',serif;line-height:1.9;margin-bottom:28px">이 책을 끝까지 읽었습니다.<br>지성소의 한 칸이 그만큼 깊어졌습니다.</div>
        <button class="f4-last-back" style="padding:8px 24px;border:1px solid rgba(180,150,80,0.3);border-radius:20px;background:rgba(201,168,76,0.07);color:rgba(160,120,50,0.8);font-size:11px;font-family:'Noto Serif KR',serif;letter-spacing:0.12em;cursor:pointer;transition:all 0.15s">지성소로 돌아가기</button>
      </div>
