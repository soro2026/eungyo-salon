          left: ['두 번째 권 "의지"에서 아렌트는 더 깊은 곳으로 간다.','인간은 새로 시작할 수 있는 존재다. 과거에 매이지 않고, 어느 순간 결단을 내려 새로운 일을 시작할 수 있다. 이것이 자유의 본질이다.'],
          right: ['아우구스티누스를 인용하며 아렌트는 말한다. "시작이 있도록, 인간이 창조되었다." 인간 한 사람 한 사람이 태어나는 것 자체가 세계에 새로움이 들어오는 사건이다.','이 개념이 내게는 위로였다. 죽음을 향해 가는 존재가 아니라, 시작할 수 있는 존재로 인간을 본다는 것. 어머니가 떠난 자리에서, 무엇인가를 새로 시작할 수 있다는 가능성.'] },
        { chapter: 'Ⅴ', title: '쓰이지 못한 마지막 책',
          left: ['세 번째 책 "판단"은 영영 미완으로 남았다.','그러나 어떤 의미에서는 그것이 이 책의 가장 깊은 가르침일지도 모른다. 판단은 보편적 규칙으로부터 연역되지 않는다.'],
          right: ['매번의 상황에서, 매번의 한 사람이, 자기 자신의 양심으로 지금 여기를 판단해야 한다. 그래서 판단은 책으로 쓸 수 없다. 살아내야만 한다.','아렌트는 죽기 전 강의 노트에서 칸트로부터 출발하려 했다. 미적 취향처럼 윤리적 판단도 공감의 확장에서 온다고. 다른 사람의 자리에 자기를 놓아보는 능력 — 그것이 판단의 토대다.'] },
        { chapter: 'Ⅵ', title: '왜 나는 이 책을 사랑하는가',
          left: ['나는 이 책을 1년에 한 번씩 꺼내 읽는다. 매번 다른 장이 다르게 다가온다.','아렌트는 학자였지만, 동시에 살아남은 사람이었다. 1933년 독일을 떠나야 했고, 게슈타포에 체포되었다 풀려났고, 프랑스 수용소에 갇혔다가 탈출했고, 미국으로 도망쳤다.'],
          right: ['그녀가 사유에 대해 쓸 때, 그것은 책상 위의 추상이 아니었다. 20세기가 가장 광기 어린 시대로 흘러갈 때, 한 여자가 책상 앞에서 나와 나 자신의 대화를 지키려 했다.','그 대화의 흔적이 이 책이다. 이 책은 끝나지 않았다. "Judging"이라는 한 단어 앞에서 멈춰 있다. 우리가 끝낼 차례다.'],
          signature: true }
      ]
    }
  };
  function getDefaultOpinion(book) {
    return { title: book.title, author: book.author, spreads: [{
      chapter: '', title: book.title,
      left: [`여기에 ${book.author}의 『${book.title}』에 대한 오피니언이 들어갑니다.`, '이 자리는 콩파뇽이 책에 대한 자기 글을 쓰는 곳입니다.'],
      right: ['책과 자기 인생의 만남, 한 책을 사랑하는 이유, 어떤 시기에 어떻게 다가왔는지.', '베타에서는 한나 아렌트의 『정신의 삶』(좌측 맨 아래)만 진짜 오피니언이 들어가 있어요.']
    }] };
  }

  let currentShelfPage = 0;
  let isTransitioning = false;
  let soundEnabled = true;

  function markup() {
    return `
      <div class="floor-content" data-floor="3">
        <div class="stage">
          <div class="room" id="bk-room">
            <div class="pendant-sway"><div class="pendant-glow"></div></div>
            <div class="dust dust-1"></div><div class="dust dust-2"></div>
            <div class="dust dust-3"></div><div class="dust dust-4"></div><div class="dust dust-5"></div>
            <div class="cover-stack" id="bk-cover-stack"></div>
          </div>
        </div>
        <button class="bk-nav-arrow bk-nav-left" id="bk-prev">‹</button>
        <button class="bk-nav-arrow bk-nav-right" id="bk-next">›</button>
        <div class="bk-dots" id="bk-dots"></div>
        <div class="bk-hint">책을 클릭해 펼쳐보세요</div>
        <button class="pw-toggle" aria-label="인물벽으로 돌아서기">✦ 나의 별들</button>
        <div class="pw-face"><div class="pw-canvas"></div></div>
      </div>`;
  }

  function mount() {
    currentShelfPage = 0; isTransitioning = false;
    buildShelfPages();
    buildDots();
    document.getElementById('bk-prev').addEventListener('click', () => slide(-1));
    document.getElementById('bk-next').addEventListener('click', () => slide(+1));
    SideWall.bind(3);                                  // 인물벽(저술가) 90도
  }

  function buildShelfPages() {
    const stack = document.getElementById('bk-cover-stack');
    stack.innerHTML = '';
    PAGES.forEach((pageData, idx) => {
      const page = document.createElement('div');
      page.className = 'cover-page' + (idx === 0 ? ' active' : '');
      pageData.forEach(({ book, slot }) => {
        const el = document.createElement('div');
        el.className = 'cover-book';
        el.style.left = slot.left + '%'; el.style.top = slot.top + '%'; el.style.height = slot.height + '%';
        el.innerHTML = `<img src="${book.cover}" alt="${book.title}" title="${book.title} · ${book.author}">`;
        el.addEventListener('click', () => openBook(book));
        page.appendChild(el);
      });
      stack.appendChild(page);
    });
  }
  function buildDots() {
    const dots = document.getElementById('bk-dots');
    dots.innerHTML = '';
    for (let i = 0; i < PAGES.length; i++) {
      const dot = document.createElement('div');
      dot.className = 'bk-dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', () => transitionTo(i));
      dots.appendChild(dot);
    }
  }
  function transitionTo(idx) {
    if (isTransitioning || idx === currentShelfPage) return;
    isTransitioning = true;
    const pages = document.querySelectorAll('.floor-content[data-floor="3"] .cover-page');
    if (!pages.length) { isTransitioning = false; return; }
    pages[currentShelfPage].classList.remove('active');
    pages[idx].classList.add('active');
    currentShelfPage = idx;
    document.querySelectorAll('.floor-content[data-floor="3"] .bk-dot').forEach((d, i) => d.classList.toggle('active', i === currentShelfPage));
    setTimeout(() => { isTransitioning = false; }, 600);
  }
  function slide(direction) {
    if (currentFloor !== 3) return;
    transitionTo((currentShelfPage + direction + PAGES.length) % PAGES.length);
  }

  /* === FlipBook 모달 (body의 #book-modal 재사용) === */
  const modal = document.getElementById('book-modal');
  const flipSound = document.getElementById('page-flip-sound');

  function playFlipSound() {
    if (!soundEnabled || muted) return;
    flipSound.currentTime = 0; flipSound.volume = 0.5;
    flipSound.play().catch(() => {});
  }
  function openBook(book) {
    const opinion = OPINIONS[book.id] || getDefaultOpinion(book);
    buildFlipbook(book, opinion);
    modal.classList.add('open');
  }
  function closeBook() {
    modal.classList.remove('open');
    setTimeout(() => { const b = modal.querySelector('.book'); if (b) b.remove(); }, 500);
  }
  function buildFlipbook(book, opinion) {
    const old = modal.querySelector('.book'); if (old) old.remove();
    const bookEl = document.createElement('div'); bookEl.className = 'book';
    const spreads = opinion.spreads;
    bookEl.appendChild(buildPageEl(makeCoverHtml(book), makeLeftPageHtml(spreads[0])));
    spreads.forEach((spread, i) => {
      const isLast = i === spreads.length - 1;
      bookEl.appendChild(buildPageEl(makeRightPageHtml(spread), isLast ? makeEndHtml(opinion) : makeLeftPageHtml(spreads[i + 1])));
    });
    modal.insertBefore(bookEl, modal.firstChild);
    bookEl.style.setProperty('--c', 0);
    bookEl.querySelectorAll('.page').forEach((page, idx) => {
      page.style.setProperty('--i', idx);
      page.addEventListener('click', (evt) => {
        if (evt.target.closest('a')) return;
        const curr = evt.target.closest('.back') ? idx : idx + 1;
        const prev = parseInt(bookEl.style.getPropertyValue('--c')) || 0;
        bookEl.style.setProperty('--c', curr);
        if (curr !== prev) playFlipSound();
      });
    });
  }
  function buildPageEl(frontHtml, backHtml) {
    const page = document.createElement('div'); page.className = 'page';
    page.innerHTML = frontHtml + backHtml; return page;
  }
  function makeCoverHtml(book) { return `<div class="front cover"><div class="cover-bg" style="background-image:url('${book.cover}')"></div></div>`; }
  function makeLeftPageHtml(spread) {
    const ps = spread.left.map(p => `<p>${p}</p>`).join('');
    const ch = spread.chapter ? `<div class="chapter-mark">${spread.chapter}</div>` : '';
    return `<div class="back"><div class="page-content">${ch}<h2>${spread.title}</h2>${ps}</div></div>`;
  }
  function makeRightPageHtml(spread) {
    const ps = spread.right.map(p => `<p>${p}</p>`).join('');
    const sig = spread.signature ? `<div class="author-line">— 한 콩파뇽의 글</div>` : '';
    return `<div class="front"><div class="page-content">${ps}${sig}</div></div>`;
  }
  function makeEndHtml(opinion) {
    return `<div class="back cover" style="background:#faf7f0;color:#2a1810"><div class="page-end"><h2>— 끝 —</h2><p class="author">${opinion.author}</p><p class="book-title">『${opinion.title}』</p></div></div>`;
  }

  // 모달 닫기 (한 번만 바인딩)
  document.getElementById('modal-close').addEventListener('click', closeBook);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeBook(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeBook();
  });

  return { markup, mount, slide };
})();

/* ============================================================
 *  Ⅱ층 음악의 방 모듈 (Floor2) — 원본 music_room.html(감상실) 통합
 *    markup() : 무대 HTML (벽=도킹 타겟, iframe 없음) + 명패 + 마리 메모
 *    mount()  : 배경 적용 · 곡 토글 · 🎲 · 음반 고르기 바인딩
 *  유튜브는 MusicPlayer(단일 iframe)가 .ms-wall에 도킹.
 * ============================================================ */
const Floor2 = (() => {
  const TUBE_KEYS = ['L1','L2','C1','C2','C3','R1','R2'];
  // 배경 컬렉션 — 좌표는 소로가 F12로 잡은 원본 그대로
  const BACKGROUNDS = [
    { id:'vintage', name:'빈티지 유럽 음악감상실', image:'music_room_bg.png',
      screen:{left:25,top:5,width:50,height:57},
      tubes:{ L1:{left:40.2,top:68.5}, L2:{left:42.2,top:68.5}, C1:{left:44.8,top:67.5}, C2:{left:48.2,top:68.5}, C3:{left:51.6,top:67.5}, R1:{left:54.8,top:69.5}, R2:{left:56.7,top:69.5} },
      vu:{ left:{left:42.9,top:75.3}, right:{left:53.2,top:75.3} },
      style:{ tubeColor:'#ff8c32', tubeSize:2.4, tubeSpeed:3.0, needleColor:'#1a1a0a', vuRange:12 } },
    { id:'japanese-minimal', name:'일본 다실 · 와비사비', image:'japanese_minimal.png',
      screen:{left:24.8,top:20.8,width:42.8,height:46.2},
      tubes:{ L1:{left:39.7,top:75.6}, L2:{left:42.7,top:75.7}, C1:{left:45.3,top:75.1}, C2:{left:48.2,top:75.3}, C3:{left:51.1,top:75.4}, R1:{left:53.9,top:75.2}, R2:{left:57.0,top:75.4} },
      vu:{ left:{left:45.6,top:82.5}, right:{left:51.3,top:82.5} },
      style:{ tubeColor:'#ff8c32', tubeSize:3.6, tubeSpeed:3.8, needleColor:'#0c063c', vuRange:30 } }
  ];
  let currentBgIndex = -1;

  function hexToRgba(hex,a){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }

  function markup(){
    const tubes = TUBE_KEYS.map(k=>`<div class="ms-tube" id="ms-tube-${k}"></div>`).join('');
    return `
      <div class="floor-content" data-floor="2">
        <div class="ms-top">
          <div class="ms-eyebrow">CHAMBRE DE MUSIQUE · 음악실</div>
          <div class="ms-room-name" id="ms-room-name">— 음악실 입장 중 —</div>
          <div class="ms-tools">
            <button class="ms-shuffle" id="ms-shuffle">🎲 다른 음악실로</button>
            <button class="ms-crate" id="ms-crate">♪ 음반 고르기</button>
            <button class="ms-stars" id="ms-stars">✦ 나의 별들</button>
          </div>
          <div class="ms-shelf" id="ms-shelf"></div>
        </div>
        <div class="ms-stage" id="ms-stage">
          <div class="ms-room" id="ms-room">
            <div class="ms-wall" id="ms-wall"></div>
            ${tubes}
            <div class="ms-vu" id="ms-vu-left"><svg viewBox="0 0 100 50"><path class="ms-needle" d="M 50 48 L 50 8"/></svg></div>
            <div class="ms-vu" id="ms-vu-right"><svg viewBox="0 0 100 50"><path class="ms-needle" d="M 50 48 L 50 8"/></svg></div>
          </div>
          <div class="pw-room" id="pw-room"></div>
        </div>
        <div class="ms-info">
          <div class="ms-plate">
            <span class="pt" id="ms-plate-title">Wolfgang Amadeus Mozart</span>
            <span class="pc" id="ms-plate-cat">REQUIEM IN D MINOR · K. 626</span>
            <span class="pm" id="ms-plate-meta">1791 · 미완성 유작</span>
          </div>
          <button class="ms-note-btn" id="ms-note-btn">✎ 마리의 노트</button>
        </div>
        <div class="ms-note-sheet" id="ms-note-sheet">
          <button class="sheet-close" id="ms-sheet-close" aria-label="닫기">×</button>
          <div class="nl">CURATOR'S NOTE</div>
          <div class="nb" id="ms-note-body"></div>
          <div class="ns">— 큐레이터 마리 (Maria)</div>
        </div>
      </div>`;
  }

  function applyBackground(bg){
    const room = document.getElementById('ms-room');
    if(!room) return;
    room.style.backgroundImage = `url('${bg.image}')`;
    document.getElementById('ms-room-name').textContent = `— ${bg.name} —`;
    const wall = document.getElementById('ms-wall');
    wall.style.left=bg.screen.left+'%'; wall.style.top=bg.screen.top+'%';
    wall.style.width=bg.screen.width+'%'; wall.style.height=bg.screen.height+'%';
    const c1=hexToRgba(bg.style.tubeColor,.95), c2=hexToRgba(bg.style.tubeColor,.7), c3=hexToRgba(bg.style.tubeColor,.35), c4=hexToRgba(bg.style.tubeColor,.1);
    TUBE_KEYS.forEach((k,idx)=>{
      const el=document.getElementById('ms-tube-'+k); const pos=bg.tubes[k];
      el.style.left=pos.left+'%'; el.style.top=pos.top+'%'; el.style.width=bg.style.tubeSize+'%';
      el.style.animation=`ms-flicker ${bg.style.tubeSpeed+idx*0.15}s ease-in-out infinite ${idx*0.2}s`;
      el.style.setProperty('--tc1',c1); el.style.setProperty('--tc2',c2); el.style.setProperty('--tc3',c3); el.style.setProperty('--tc4',c4);
    });
    const vl=document.getElementById('ms-vu-left'), vr=document.getElementById('ms-vu-right');
    vl.style.left=bg.vu.left.left+'%'; vl.style.top=bg.vu.left.top+'%';
    vr.style.left=bg.vu.right.left+'%'; vr.style.top=bg.vu.right.top+'%';
    document.querySelectorAll('.floor-content[data-floor="2"] .ms-needle').forEach((n,idx)=>{
      n.style.stroke=bg.style.needleColor;
      n.style.animation=`ms-vu-swing ${1.7+idx*0.4}s ease-in-out infinite ${idx*0.3}s`;
    });
    document.documentElement.style.setProperty('--ms-vu-range', bg.style.vuRange+'deg');
    // 벽 위치 바뀌었으니 도킹 좌표 재측정
    if(window.MusicPlayer) MusicPlayer.reposition();
  }

  function randomBackground(){
    let idx;
    if(BACKGROUNDS.length>1){ do{ idx=Math.floor(Math.random()*BACKGROUNDS.length); }while(idx===currentBgIndex); } else idx=0;
    currentBgIndex=idx; applyBackground(BACKGROUNDS[idx]);
  }

  function wallRect(){ const w=document.getElementById('ms-wall'); return w?w.getBoundingClientRect():null; }

  /* ── 90도 회전: 음악실 정면 ↔ 인물벽 옆면 ──
   *  인물벽 면은 "감상실이 아닌 곳"으로 취급:
   *  돌아서는 순간 미니 플레이어는 좌하단으로(재생 중) / 거둠(프라임만),
   *  무대로 돌아오면 onFloorChange(2)가 도킹을 복원. 음악은 안 끊김. */
  let turned = false;
  function isTurned(){ return turned; }
  function turnWall(){
    const fc = document.querySelector('.floor-content[data-floor="2"]');
    const stage = document.getElementById('ms-stage');
    const btn = document.getElementById('ms-stars');
    if(!fc || !stage || !btn) return;
    turned = !turned;
    if(turned){
      if(window.MusicPlayer) MusicPlayer.onFloorChange(0);  // 감상실 아님과 동일 취급
      const pw = document.getElementById('pw-room');
      if(pw && !pw.dataset.built){
        PersonaWall.render(pw, { seed:183, count:12 });     // 더미 — 본 공사 때 companions
        pw.dataset.built = '1';
      }
      fc.classList.add('pw-turned');
      stage.classList.add('turned');
      document.querySelector('.floor-content[data-floor="2"] .ms-eyebrow').textContent = 'MES PERSONNES · 인물벽';
      document.getElementById('ms-room-name').textContent = '— 내가 사랑한 사람들 —';
      btn.textContent = '♪ 무대로';
    } else {
      fc.classList.remove('pw-turned');
      stage.classList.remove('turned');
      document.querySelector('.floor-content[data-floor="2"] .ms-eyebrow').textContent = 'CHAMBRE DE MUSIQUE · 음악실';
      document.getElementById('ms-room-name').textContent =
        currentBgIndex >= 0 ? `— ${BACKGROUNDS[currentBgIndex].name} —` : '— 음악실 입장 중 —';
      btn.textContent = '✦ 나의 별들';
      // ⚠️ 도킹은 회전이 다 끝난 뒤에 — 회전 중 벽 좌표를 재면 세로 띠처럼 좁게 잡힘
      const room = document.getElementById('ms-room');
      let docked = false;
      const dock = ()=>{
        if(docked || turned) return;          // 그새 다시 돌렸으면 도킹 안 함
        docked = true;
        if(window.MusicPlayer) MusicPlayer.onFloorChange(2);  // 도킹·프라임 복원
      };
      const onEnd = (ev)=>{
        if(ev.propertyName !== 'transform') return;
        room.removeEventListener('transitionend', onEnd);
        dock();
      };
      room.addEventListener('transitionend', onEnd);
      setTimeout(dock, 950);                   // transitionend 불발 대비 안전망
    }
  }
  function turnBack(){ if(turned) turnWall(); }

  function mount(){
    turned = false;                    // 층 재진입 시 늘 음악실 정면부터
    randomBackground();
    Shelf.render();              // 음반 선반 그리기 (자켓 5칸)
    MusicPlayer.syncMeta();
    document.getElementById('ms-shuffle').addEventListener('click', randomBackground);
    document.getElementById('ms-crate').addEventListener('click', ()=> Library.open());
    document.getElementById('ms-stars').addEventListener('click', turnWall);
    // 마리의 노트 시트
    const sheet=document.getElementById('ms-note-sheet');
    document.getElementById('ms-note-btn').addEventListener('click', ()=> sheet.classList.add('open'));
    document.getElementById('ms-sheet-close').addEventListener('click', ()=> sheet.classList.remove('open'));
  }

  return { markup, mount, wallRect, isTurned, turnBack };
})();

/* ============================================================
 *  음악 미니 플레이어 (MusicPlayer) — 단일 iframe, 층 넘어도 안 끊김
 *    play(i)         : 곡 선택·재생 (사용자 클릭 후 autoplay)
 *    onFloorChange(n): 2층=도킹 / 그 외=좌하단 미니 (started 후)
 *    setState(s)     : dock | mini | folded
 *    reposition()    : 현재 상태에 맞는 위치·크기 재계산
 * ============================================================ */
const MusicPlayer = (() => {
  const COLLECTION = [
    { videoId:'FKGjVMIALJo', startSeconds:0, cover:'lp_01_mozart_requiem.png',
      plateCat:'REQUIEM IN D MINOR · K. 626', plateTitle:'Wolfgang Amadeus Mozart',
      plateMeta:'1791 · 미완성 유작 · Minoritenkirche',
      note:`모차르트가 죽음의 문턱에서 받아 든 의뢰.<br>검은 옷의 낯선 사내가 두고 간 악보 위로 그는 자신의 진혼곡을 써 내려갔다. <span style="font-style:italic">Lacrimosa</span>의 여덟 마디에서 펜이 멈췄을 때, 그는 서른다섯이었다.`,
      pill:'Mozart · Requiem' },
    { videoId:'2tAS9WxucBU', startSeconds:20, cover:'lp_02_mahler_titan.png',
      plateCat:'SYMPHONY NO. 1 · "TITAN"', plateTitle:'Gustav Mahler',
      plateMeta:'1888 · Karina Canellakis · PMF Orchestra',
      note:`스물일곱 청년 말러가 라이프치히의 한 방에서 사랑에 빠졌다.<br>이루어질 수 없는 사랑, 그 좌절과 환희, 자연의 황홀과 죽음의 그림자가 첫 교향곡이 되었다. 장 파울의 소설 <span style="font-style:italic">「거인」</span>에서 빌려온 이름 — 그러나 거인은 신화 속 영웅이 아니라 자기 운명과 싸우는 한 인간이었다.`,
      pill:'Mahler · Titan' }
  ];

  const player   = document.getElementById('musicPlayer');
  const iframe   = document.getElementById('mpIframe');
  const pillText = document.getElementById('mpPillText');

  let trackIdx = 0, started = false, state = 'mini', loadedIdx = -1;

  function currentTrack(){ return trackIdx; }
  function buildSrc(idx, autoplay){
    const t=COLLECTION[idx];
    const start=t.startSeconds>0?`&start=${t.startSeconds}`:'';
    const ap=autoplay?'&autoplay=1':'';
    return `https://www.youtube-nocookie.com/embed/${t.videoId}?rel=0&modestbranding=1&playsinline=1${start}${ap}`;
  }

  function syncMeta(){
    const cat=document.getElementById('ms-plate-cat'); if(!cat) return; // 2층 아닐 때
    const t=COLLECTION[trackIdx];
    cat.textContent=t.plateCat;
    document.getElementById('ms-plate-title').textContent=t.plateTitle;
    document.getElementById('ms-plate-meta').textContent=t.plateMeta;
    document.getElementById('ms-note-body').innerHTML=t.note;
  }

  function play(idx){
    // 이미 그 곡을 재생 중이면 src를 다시 안 꽂음 (끊김 방지) — 위치만 갱신
    if(started && loadedIdx===idx){
      player.classList.remove('hidden','priming');
      setState(currentFloor===2 ? 'dock' : 'mini');
      if(window.Shelf) Shelf.touch(idx);   // LRU: 맨 왼쪽으로
      return;
    }
    trackIdx=idx; started=true;
    player.classList.remove('hidden','priming');
    iframe.src=buildSrc(idx,true); loadedIdx=idx;
    pillText.textContent=COLLECTION[idx].pill;
    syncMeta();
    setState(currentFloor===2 ? 'dock' : 'mini');
    if(window.Shelf) Shelf.touch(idx);     // LRU: 맨 왼쪽으로
  }

  // 2층 첫 진입: 자동재생 없이 썸네일만 도킹 + "눌러 시작" (강요 없음)
  function primeIfNeeded(){
    if(started) return;
    player.classList.remove('hidden');
    if(loadedIdx!==trackIdx){ iframe.src=buildSrc(trackIdx,false); loadedIdx=trackIdx; }
    player.classList.add('priming');
    pillText.textContent=COLLECTION[trackIdx].pill;
  }

  function setState(next){
    state=next;
    player.classList.remove('dock','mini','folded');
    player.classList.add(next);
    reposition();
  }

  function reposition(){
    if(player.classList.contains('hidden')) return;
    if(state==='folded'){
      player.style.left='22px'; player.style.top='auto'; player.style.bottom='26px';
      player.style.width='auto'; player.style.height='auto'; return;
    }
    player.style.bottom='auto';
    if(state==='dock'){
      const r=Floor2.wallRect();
      if(r){ player.style.left=r.left+'px'; player.style.top=r.top+'px'; player.style.width=r.width+'px'; player.style.height=r.height+'px'; }
    } else { // mini
      const w=Math.min(320, Math.max(220, window.innerWidth*0.42));
      const h=w*9/16;
      player.style.left='22px'; player.style.top=(window.innerHeight-h-26)+'px';
      player.style.width=w+'px'; player.style.height=h+'px';
    }
  }

  // 재생 중이고 접힘이 아니면 좌하단 미니로 (감상실 아닌 다른 방으로 갈 때)
  function toMiniIfPlaying(){
    if(started && state!=='folded' && !player.classList.contains('hidden')) setState('mini');
  }

  function onFloorChange(n){
    if(n===2){
      primeIfNeeded();
      if(!player.classList.contains('hidden')){
        requestAnimationFrame(()=>requestAnimationFrame(()=>{ setState('dock'); syncMeta(); }));
      }
    } else {
      // 2층을 떠날 때
      if(started){
        // 이미 재생 중 → 좌하단 미니로 따라오게 (접어둔 경우는 그대로)
        if(state!=='folded' && !player.classList.contains('hidden')) setState('mini');
      } else {
        // 아직 한 번도 재생 안 함(prime 썸네일만) → 영상을 거둠
        player.classList.add('hidden');
        player.classList.remove('priming');
      }
    }
  }

  // 버튼
  document.getElementById('mpPrime').addEventListener('click', ()=> play(trackIdx));
  const libOpen = ()=> document.getElementById('library-modal').classList.contains('open');
  document.getElementById('mpReturn').addEventListener('click', ()=>{
    if(currentFloor!==2) goToFloor(2);
    else if(libOpen()) Library.close();             // 서고 닫기 = close()가 도킹 복원까지
    else if(Floor2.isTurned()) Floor2.turnBack();   // 인물벽 면이면 먼저 무대로
    else setState('dock');
  });
  document.getElementById('mpFold').addEventListener('click', ()=> setState('folded'));
  document.getElementById('mpPill').addEventListener('click', ()=>
    setState(currentFloor===2 && !Floor2.isTurned() && !libOpen() ? 'dock' : 'mini'));

  return { play, primeIfNeeded, setState, reposition, onFloorChange, syncMeta, currentTrack, toMiniIfPlaying, getTrack:(i)=>COLLECTION[i], trackCount:COLLECTION.length };
})();
window.MusicPlayer = MusicPlayer;

/* 토스트 헬퍼 */
let _toastTimer=null;
function showToast(msg){
  const t=document.getElementById('msToast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_toastTimer); _toastTimer=setTimeout(()=>t.classList.remove('show'),2000);
}

/* ============================================================
 *  음반 서고 (Library) — 레이어2 모달 · 디깅 박스
 *    open()/close() : 모달 열고 닫기 (음악 안 끊김)
 *    자켓 클릭: 준비중(trackIndex=null) → 흔들림+토스트
 *              실제 트랙 → 모달 닫고 2층 도킹 + MusicPlayer.play()
 *  trackIndex = MusicPlayer.COLLECTION 배열의 index.
 * ============================================================ */
const Library = (() => {
  const albums = [
    { id:'lp_01', file:'lp_01_mozart_requiem.png',        title:'Mozart · Requiem',       trackIndex:0    },
    { id:'lp_02', file:'lp_02_mahler_titan.png',          title:'Mahler · Titan',         trackIndex:1    },
    { id:'lp_03', file:'lp_03_beethoven_choral.png',      title:'Beethoven · Choral',     trackIndex:null },
    { id:'lp_04', file:'lp_04_bach_cello_suites.png',     title:'Bach · Cello Suites',    trackIndex:null },
    { id:'lp_05', file:'lp_05_debussy_clair_de_lune.png', title:'Debussy · Clair de Lune',trackIndex:null }
  ];
  const VISIBLE_RANGE=3, SPACING_X=165, ROTATION=28, DEPTH_Z=140;

  const modal   = document.getElementById('library-modal');
  const stage   = document.getElementById('lib-stage');
  const curEl   = document.getElementById('lib-cur');
  const totalEl = document.getElementById('lib-total');
  const toast   = document.getElementById('lib-toast');

  let currentIndex=0, isTransitioning=false, built=false, _libToastTimer=null;
  const cards=[];

  function build(){
    albums.forEach((album,idx)=>{
      const card=document.createElement('div');
      card.className='lp-card'; card.dataset.index=idx;
      card.innerHTML=`<div class="disc"></div><div class="cover" style="background-image:url('${album.file}');"></div>`;
      card.addEventListener('click',()=>onCardClick(idx));
      stage.appendChild(card); cards.push(card);
    });
    totalEl.textContent=String(albums.length).padStart(2,'0');
    built=true;
  }

  function layout(){
    cards.forEach((card,idx)=>{
      const offset=idx-currentIndex;
      if(Math.abs(offset)>VISIBLE_RANGE){
        card.style.opacity='0'; card.style.pointerEvents='none';
        const bt=`translateX(${offset*SPACING_X}px) translateZ(-${DEPTH_Z*2}px)`;
        card.style.setProperty('--base-transform',bt); card.style.transform=bt; return;
      }
      const abs=Math.abs(offset), sign=Math.sign(offset);
      const tx=offset*SPACING_X;
      const ry=-sign*Math.min(abs,1)*ROTATION - sign*Math.max(0,abs-1)*(ROTATION*.5);
      const tz=-abs*DEPTH_Z*.7;
      card.style.opacity = abs===0?1:(1-abs*.22);
      card.style.pointerEvents='auto';
      card.style.zIndex=String(100-abs);
      card.style.filter=`brightness(${1-abs*.18})`;
      const bt=`translateX(${tx}px) translateZ(${tz}px) rotateY(${ry}deg)`;
      card.style.setProperty('--base-transform',bt); card.style.transform=bt;
    });
    curEl.textContent=String(currentIndex+1).padStart(2,'0');
  }

  function goPrev(){ if(!isTransitioning && currentIndex>0){ currentIndex--; layout(); } }
  function goNext(){ if(!isTransitioning && currentIndex<albums.length-1){ currentIndex++; layout(); } }

  function libToast(msg){
    toast.textContent=msg; toast.classList.add('show');
    clearTimeout(_libToastTimer); _libToastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
  }

  function onCardClick(idx){
    if(isTransitioning) return;
    if(idx!==currentIndex){ currentIndex=idx; layout(); return; }  // 옆 자켓 → 이동
    const album=albums[idx];
    if(album.trackIndex===null){                                   // 준비 중
      const card=cards[idx];
      card.classList.add('shaking'); setTimeout(()=>card.classList.remove('shaking'),600);
      libToast('곧 들려드릴게요'); return;
    }
    // 실제 트랙 → 서고 닫고 감상실 벽 도킹 (페이지 점프 대신 셸 내부 호출)
    isTransitioning=true;
    close();
    setTimeout(()=>{
      if(currentFloor!==2) goToFloor(2);
      // 2층 mount 후 재생 (이동 애니메이션 시간 고려)
      const delay = currentFloor!==2 ? 1500 : 60;
      setTimeout(()=>{ MusicPlayer.play(album.trackIndex); isTransitioning=false; }, delay);
    }, 420);
  }

  function open(){
    if(!built) build();
    modal.classList.add('open');
    currentIndex=0; layout();
    // 서고는 감상실이 아니므로, 재생 중이면 좌하단 미니로 (벽 도킹 잔류 방지)
    if(window.MusicPlayer) MusicPlayer.toMiniIfPlaying();
  }
  function close(){
    modal.classList.remove('open');
    // 감상실(2층)에 있고 재생 중이면 벽 도킹 복원
    if(currentFloor===2 && window.MusicPlayer) MusicPlayer.onFloorChange(2);
  }

  // 이벤트
  document.getElementById('lib-prev').addEventListener('click', goPrev);
  document.getElementById('lib-next').addEventListener('click', goNext);
  document.getElementById('lib-close').addEventListener('click', close);
  document.addEventListener('keydown', e=>{
    if(!modal.classList.contains('open')) return;
    if(e.key==='ArrowLeft'){ goPrev(); e.preventDefault(); }
    if(e.key==='ArrowRight'){ goNext(); e.preventDefault(); }
  });
  // 드래그/스와이프
  let dragX=null, dragging=false; const TH=50;
  const box=document.getElementById('lib-digging');
  function ds(x){ dragX=x; dragging=true; }
  function dm(x){ if(!dragging||dragX===null) return; const dx=x-dragX; if(Math.abs(dx)>TH){ dx>0?goPrev():goNext(); dragging=false; dragX=null; } }
  function de(){ dragging=false; dragX=null; }
  box.addEventListener('mousedown',e=>ds(e.clientX));
  box.addEventListener('mousemove',e=>dm(e.clientX));
  box.addEventListener('mouseup',de); box.addEventListener('mouseleave',de);
  box.addEventListener('touchstart',e=>ds(e.touches[0].clientX),{passive:true});
  box.addEventListener('touchmove',e=>dm(e.touches[0].clientX),{passive:true});
  box.addEventListener('touchend',de);

  return { open, close };
})();
window.Library = Library;

/* ============================================================
 *  음반 선반 (Shelf) — 감상실 상단 자켓 5칸 · LRU(왼쪽=최근)
 *    touch(idx) : 곡 재생 시 호출 → 그 곡을 맨 왼쪽으로(있으면 이동, 없으면 추가·5칸 넘으면 끝 밀려남)
 *    render()   : 선반을 화면에 그림 (2층 mount 때)
 *    load/save  : localStorage. 본 공사 때 이 안쪽만 Supabase 콩파뇽 계정으로 교체.
 *  칸 = trackIndex (MusicPlayer.COLLECTION의 index).
 * ============================================================ */
const Shelf = (() => {
  const KEY = 'eg_music_shelf_v1';
  const MAX = 5;
  const DEFAULT = [0, 1];           // 초기 상태: 모차르트·말러
  let order = load();               // trackIndex 배열, 앞이 최근

  function load(){
    try {
      const raw = localStorage.getItem(KEY);
      if(!raw) return DEFAULT.slice();
      const arr = JSON.parse(raw);
      if(!Array.isArray(arr)) return DEFAULT.slice();
      // 유효한 trackIndex만 (COLLECTION 범위 안)
      const n = window.MusicPlayer ? MusicPlayer.trackCount : 2;
      const clean = arr.filter(i => Number.isInteger(i) && i>=0 && i<n);
      return clean.length ? clean.slice(0,MAX) : DEFAULT.slice();
    } catch { return DEFAULT.slice(); }
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(order)); } catch {}
  }

  // LRU: 곡을 맨 왼쪽으로
  function touch(idx){
    order = order.filter(i => i !== idx);   // 있으면 제거
    order.unshift(idx);                     // 맨 앞에
    if(order.length > MAX) order = order.slice(0, MAX);
    save();
    render();
  }

  function render(){
    const shelf = document.getElementById('ms-shelf');
    if(!shelf) return;  // 2층 아닐 때
    shelf.innerHTML = '';
    for(let pos=0; pos<MAX; pos++){
      const idx = order[pos];
      const slot = document.createElement('div');
      if(idx === undefined){
        slot.className = 'ms-slot empty';
      } else {
        const t = MusicPlayer.getTrack(idx);
        slot.className = 'ms-slot';
        slot.style.backgroundImage = `url('${t.cover}')`;
        slot.innerHTML = `<span class="ms-slot-name">${t.pill}</span>`;
        slot.addEventListener('click', ()=> MusicPlayer.play(idx));
        // 모바일: 첫 탭은 곡명, 두번째 탭은 재생 — 은 과해서, 그냥 탭=재생 + 호버로 이름.
      }
      shelf.appendChild(slot);
    }
  }

  return { touch, render, load:()=>order.slice() };
})();
window.Shelf = Shelf;

/* ============================================================
 *  인물벽 (PersonaWall) — 독립 부품 · 층 비종속
 *    render(host, {seed, count}) : host 안에 액자들을 흩뿌림.
 *    mulberry32(starSeed) 고정 랜덤 — 같은 콩파뇽 벽은 늘 같은 배치.
 *    MES ÉTOILES 안내 액자는 늘 한 장 (빈 벽=중앙 초대 / 빼곡=우상단).
 *    render(opts)에 people(명단)·guide(안내 문구)를 층별로 넘김.
 *    지금은 더미 명단 + placeholder 초상 — 본 공사 때
 *    companions → stars.photo_url(field 필터)로 교체 (로직 불변).
 * ============================================================ */
const PersonaWall = (() => {
  const PEOPLE = [
    'Wolfgang Amadeus Mozart','Gustav Mahler','Ludwig van Beethoven','Johann Sebastian Bach',
    'Claude Debussy','Frédéric Chopin','Pyotr Tchaikovsky','Maria Callas',
    'Glenn Gould','Jacqueline du Pré','Arturo Toscanini','Clara Schumann',
    'Franz Schubert','Antonín Dvořák','Sergei Rachmaninoff','Hildegard von Bingen'
  ];
  function portrait(seed){ return `https://picsum.photos/seed/persona${seed}/300/360`; }

  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function render(host, opts){
    if(!host) return;
    const seed  = (opts && opts.seed)  || 183;
    const count = (opts && typeof opts.count === 'number') ? opts.count : 12;
    const people = (opts && opts.people) || PEOPLE;          // 층별 명단 (기본=음악)
    const guide  = (opts && opts.guide)  || '콘스텔라티오로 — 음악의 별들 ✦';
    host.innerHTML = '';
    const rnd = mulberry32(seed);
    // 배치 영역(%): 좌우 4~92, 상하 5~74 (맨 아래 책선반 26% 비움)
    const AX0=4, AX1=92, AY0=5, AY1=74;

    for(let i=0; i<count; i++){
      const person = people[i % people.length];
      const w = [8.5, 10.5, 12.5, 15][Math.floor(rnd()*4)];   // 크기 4단계
      const cols = 5, rows = Math.ceil(count/cols) || 1;
      const col = i % cols, row = Math.floor(i/cols);
      const cellW = (AX1-AX0)/cols, cellH = (AY1-AY0)/rows;
      const jx = (rnd()-.5) * cellW * .7;
      const jy = (rnd()-.5) * cellH * .7;
      const cx = AX0 + cellW*(col+.5) + jx;
      const cy = AY0 + cellH*(row+.5) + jy;
      const left = Math.max(AX0, Math.min(AX1-w, cx - w/2));
      const top  = Math.max(AY0, cy - w/2);
      const rot  = (rnd()-.5) * 8;                            // ±4°
      const dropX = -Math.sin(rot*Math.PI/180)*8;             // 기울기 반대편 그림자

      const f = document.createElement('div');
      f.className = 'pw-frame';
      f.style.left = left + '%';
      f.style.top  = top + '%';
      f.style.width = w + '%';
      f.style.setProperty('--rot', rot.toFixed(2)+'deg');
      f.style.setProperty('--drop', `${dropX}px 10px 22px rgba(0,0,0,.5)`);
      f.style.zIndex = String(100 + i);
      f.innerHTML = `
        <img class="pw-photo" src="${portrait(seed*100+i)}" alt="${person}" loading="lazy">
        <div class="pw-plate">${person}</div>`;
      host.appendChild(f);
    }

    addGuideFrame(host, count === 0, guide);
  }

  // 안내 포스터 액자 — 콘스텔라티오로 가는 문 (늘 존재 · 빈 벽은 결핍 아닌 초대)
  function addGuideFrame(host, isEmpty, hint){
    const g = document.createElement('div');
    g.className = 'pw-frame pw-guide';
    if(isEmpty){
      g.style.left = '40%'; g.style.top = '14%'; g.style.width = '20%';
      g.style.setProperty('--rot', '-1.2deg');
    } else {
      g.style.left = '79%'; g.style.top = '8%'; g.style.width = '15%';
      g.style.setProperty('--rot', '2deg');
    }
    g.style.setProperty('--drop', '-3px 12px 26px rgba(0,0,0,.55)');
    g.style.zIndex = '180';
    g.innerHTML = `
      <img class="pw-photo" src="poster_01.png" alt="MES ÉTOILES — 별을 품으러">
      <div class="pw-hint">${hint}</div>`;
    g.addEventListener('click', ()=>{
      // 지금은 까딱이기만 — 본 공사 때 콘스텔라티오(음악 별 큐레이션) 연결 (임시 발판 회피)
      g.animate(
        [{transform:'rotate(var(--rot)) scale(1.06)'},{transform:'rotate(var(--rot)) scale(1)'}],
        {duration:300}
      );
    });
    host.appendChild(g);
  }

  return { render };
})();
window.PersonaWall = PersonaWall;

/* ============================================================
 *  SideWall — 1·3층 인물벽 90도 토글 (2층은 자체 무대 회전 보유)
 *    층마다 본업 위로 .pw-face가 rotateY로 돌아 들어옴 (2층과 같은 동작 언어).
 *    명단은 더미 — 본 공사 때 companions → stars(field 필터) 한 줄 교체 (로직 불변).
 * ============================================================ */
const SideWall = (() => {
  const PEOPLE_ART = [
    '레오나르도 다빈치','산드로 보티첼리','요하네스 베르메르','렘브란트 판 레인',
    '클로드 모네','오귀스트 르누아르','빈센트 반 고흐','구스타프 클림트',
    '장프랑수아 밀레','귀스타브 카유보트','가쓰시카 호쿠사이','펠릭스 브라르'
  ];
  const PEOPLE_LETTERS = [
    '호메로스','소크라테스','소포클레스','윌리엄 셰익스피어',
    '요한 볼프강 폰 괴테','빅토르 위고','표도르 도스토옙스키','레프 톨스토이',
    '안톤 체호프','프란츠 카프카','헨리 데이비드 소로','윤동주',
    '백석','어니스트 헤밍웨이','에드거 앨런 포','카를 마르크스'
  ];
  const CFG = {
    1: { people: PEOPLE_ART,     guide: '콘스텔라티오로 — 미술의 별들 ✦',           back: '🖼 갤러리로', seed: 411, count: 12 },
    3: { people: PEOPLE_LETTERS, guide: '콘스텔라티오로 — 문학·철학·역사의 별들 ✦', back: '📖 책방으로', seed: 937, count: 14 },
  };
  const turned = {};
  function isTurned(n){ return !!turned[n]; }
  function set(n, on){
    const fc = document.querySelector(`.floor-content[data-floor="${n}"]`);
    if (!fc) return;
    const btn = fc.querySelector('.pw-toggle');
    const face = fc.querySelector('.pw-face');
    const host = fc.querySelector('.pw-canvas');
    turned[n] = on;
    if (on && !host.dataset.built){            // 처음 돌아설 때 한 번만 건다
      PersonaWall.render(host, CFG[n]);
      host.dataset.built = '1';
    }
    face.classList.toggle('on', on);
    fc.classList.toggle('pw-turned', on);
    btn.textContent = on ? CFG[n].back : '✦ 나의 별들';
  }
  function bind(n){
    turned[n] = false;                          // 매 방문 초기화 (innerHTML 재생성 원칙)
    const fc = document.querySelector(`.floor-content[data-floor="${n}"]`);
    const btn = fc && fc.querySelector('.pw-toggle');
    if (btn) btn.addEventListener('click', () => set(n, !turned[n]));
  }
  return { bind, isTurned, turnBack: n => set(n, false) };
})();
window.SideWall = SideWall;

/* ===== 첫 진입 ===== */
buildBar();
renderFloor(1);
</script>

</body>
</html>
