}
.floor-content[data-floor="5"] .f5-nav:hover{ background:rgba(60,34,24,.66); }

.floor-content[data-floor="5"] .f5-nav-l{ left:14px; }
.floor-content[data-floor="5"] .f5-nav-r{ right:14px; }

  font-size:clamp(28px,6vw,48px); letter-spacing:.2em; color:#f0d8a8;

}
.floor-content[data-floor="5"] .f5-roomtag.on{ opacity:1; }
.floor-content[data-floor="5"] .f5-roomtag small{ font-size:.5em; opacity:.6; letter-spacing:.1em; }
.floor-content[data-floor="5"] .f5-empty{

/* 액자 탭 → 확대 모달 (핀치 줌 대체) */
.floor-content[data-floor="5"] .f5-zoom{

.floor-content[data-floor="5"] .f5-zoom-name{

}
.floor-content[data-floor="5"] .f5-zoom-cat{

.floor-content[data-floor="5"] .f5-zoom-close{

  // 정면 벽 = 메시지 보드: 위 글귀판 + 아래 흐르는 흔적 티커
  function renderMessageWall(){
    const wall = root && root.querySelector('.g1-wall-front');
    if(!wall) return;
    const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const w = (MW && MW.wall) || {};
    const traces = (MW && MW.traces) || [];
    const nick = esc((w.nickname||'').toUpperCase());
    const hasGlyph = w.body || w.title;
    const top = hasGlyph
      ? `<div class="g1-mw-nick">${nick}</div>`
        + (w.title ? `<div class="g1-mw-title">${esc(w.title)}</div>` : '')
        + `<div class="g1-mw-body">${esc(w.body)}</div>`
        + (w.signature ? `<div class="g1-mw-sig">— ${esc(w.signature)}</div>` : '')
      : `<div class="g1-mw-empty">${nick}<span>아직 글귀가 걸리지 않은 벽</span></div>`;
    const chip = t => `<span class="g1-mw-chip"><img src="${flowerUrl(esc(t.flower_type))}" alt="" onerror="this.style.display='none'"><b>${esc(t.visitor_nick)}</b>${t.text?`<span>${esc(t.text)}</span>`:''}</span>`;
    const chips = traces.map(chip).join('');
    // 끊김 없는 루프 위해 칩 묶음을 2배 복제 (track 폭의 -50% 이동 = 정확히 한 세트)
    const ticker = traces.length ? `<div class="g1-mw-track">${chips}${chips}</div>` : '';
    const colorStyle = w.text_color ? ` style="color:${esc(w.text_color)}"` : '';   // 2차 배경풀 글자색 자리
    wall.innerHTML = `<div class="g1-mw"${colorStyle}><div class="g1-mw-top">${top}</div><div class="g1-mw-ticker">${ticker}</div></div>`;
  }

  // 서버에서 메시지 보드 다시 읽어 벽·핫스팟 갱신
  async function refreshMessageWall(){
    try { MW = await sbFetch('/rest/v1/rpc/get_message_board',
      { method:'POST', body: JSON.stringify({ p_room_owner: MW_ownerId }) }); } catch(e){}
    renderMessageWall(); buildHotspots();
  }

  function closeMwModal(){ const m = document.getElementById('mw-modal'); if(m) m.remove(); }

  // 내 방 — 글귀 쓰기·고치기
  function openWriteModal(){
    closeMwModal();
    const w = (MW && MW.wall) || {};
    const m = document.createElement('div');
    m.id = 'mw-modal'; m.className = 'mw-modal';
    m.innerHTML = `
      <div class="mw-box">
        <h3>내 벽의 글귀</h3>
        <label>타이틀</label>
        <input id="mw-title" maxlength="40" placeholder="예: 나를 바꾼 문장">
        <label>글귀</label>
        <textarea id="mw-body" rows="4" placeholder="벽에 걸 한 문장을 적어 주세요"></textarea>
        <label>서명 · 출처 (선택)</label>
        <input id="mw-sig" maxlength="60" placeholder="예: 헨리 데이비드 소로 · 월든">
        <div class="mw-btns">
          <button class="mw-cancel">닫기</button>
          <button class="mw-save">벽에 걸기</button>
        </div>
      </div>`;
    document.body.appendChild(m);
    m.querySelector('#mw-title').value = w.title || '';
    m.querySelector('#mw-body').value  = w.body  || '';
    m.querySelector('#mw-sig').value   = w.signature || '';
    m.addEventListener('click', e => { if(e.target === m) closeMwModal(); });
    m.querySelector('.mw-cancel').onclick = closeMwModal;
    m.querySelector('.mw-save').onclick = async () => {
      const title = m.querySelector('#mw-title').value.trim();
      const body  = m.querySelector('#mw-body').value.trim();
      const sig   = m.querySelector('#mw-sig').value.trim();
      if(!body){ alert('글귀를 한 줄 적어 주세요'); return; }
      try {
        await sbFetch('/rest/v1/rpc/upsert_message_board', { method:'POST',
          body: JSON.stringify({ p_title: title||null, p_body: body, p_signature: sig||null, p_text_color: null }) });
        closeMwModal(); await refreshMessageWall();
      } catch(e){ alert('저장 실패: ' + e.message); }
    };
  }

  // 남의 방 — 꽃 두고 가기 (이번 주 꽃 자동 + 한 줄 선택)
  function openFlowerModal(){
    closeMwModal();
    const m = document.createElement('div');
    m.id = 'mw-modal'; m.className = 'mw-modal';
    m.innerHTML = `
      <div class="mw-box">
        <h3>🌸 꽃 두고 가기</h3>
        <p class="mw-hint">이번 주의 내 꽃을 한 송이 두고 갑니다. 한 줄은 남겨도 좋고, 비워도 좋습니다 (침묵의 헌화).</p>
        <textarea id="mw-fbody" rows="2" maxlength="50" placeholder="한 줄 남기기 (50자, 선택)"></textarea>
        <div class="mw-btns">
          <button class="mw-cancel">닫기</button>
          <button class="mw-save">두고 가기</button>
        </div>
      </div>`;
    document.body.appendChild(m);
    m.addEventListener('click', e => { if(e.target === m) closeMwModal(); });
    m.querySelector('.mw-cancel').onclick = closeMwModal;
    m.querySelector('.mw-save').onclick = async () => {
      const text = m.querySelector('#mw-fbody').value.trim();
      try {
        const res = await sbFetch('/rest/v1/rpc/leave_flower', { method:'POST',
          body: JSON.stringify({ p_room_owner: MW_ownerId, p_text: text||null }) });
        closeMwModal(); await refreshMessageWall();
        const left = (res && typeof res.left === 'number') ? res.left : -1;   // RPC가 남은 꽃 수 반환
        showToast(left === 0 ? '🌸 이번 주 마지막 꽃을 두고 갑니다'
                : left > 0  ? `🌸 꽃을 두고 갑니다 · 이번 주 남은 꽃 ${left}송이`
                :             '🌸 꽃을 두고 갑니다');
      } catch(e){
        closeMwModal();
        showToast(e.message || '잠시 후 다시 시도해 주세요');   // '이미 뒀어요'·'꽃 먼저'·'꽃 떨어짐'·'자기 방' 등 RPC 안내
      }
    };
  }

  function build() {
    const walls = ['front', 'right', 'back', 'left']
      .map(k => root.querySelector('.g1-wall-' + k));
    // 재호출(반납 등) 대비 — 기존 액자·조각 비우기 (중복 방지)
    walls.forEach(wall => wall.querySelectorAll('.g1-painting').forEach(el => el.remove()));
    const _w = root.querySelector('#g1-world');
    if (_w) _w.querySelectorAll('.g1-sculpt').forEach(el => el.remove());
    walls.forEach((wall, s) => {
      ART[s].forEach((a, i) => {
        const w = a.w || 320;
        const d = document.createElement('div');
        d.className = 'g1-painting' + (a.img ? ' g1-hframed' : '');
        d.style.left = leftFor(s, i, w) + 'px';
        d.style.width = w + 'px';
        const plaque = `<div class="g1-plaque"><div class="g1-pt">${a.t}</div><div class="g1-pa">${a.a}</div></div>`;
        d.innerHTML = a.img
          ? `<img class="g1-fimg" alt="${a.t}">${plaque}`                                       // 헤리티지 — 원본 액자 그대로
          : `<div class="g1-frame" style="width:${w}px"><div class="g1-mat"><img alt="${a.t}"></div></div>${plaque}`; // 임시 — CSS 액자
        const img = d.querySelector('img');
        img.onload = () => buildHotspots();   // 액자 높이 확정 후 핫스팟 재배치
        img.onerror = () => {  // 이미지 미도착 시 — 명판이 그려진 캔버스로 우아하게
          const lost = `<div class="g1-lost">${a.t}<br><span style="font-size:11px;opacity:.6">${a.a}</span></div>`;
          if (a.img) img.outerHTML =
            `<div class="g1-frame" style="width:${w}px;height:${Math.round(w * 1.06)}px"><div class="g1-mat">${lost}</div></div>`;
          else img.closest('.g1-mat').innerHTML = lost;
          buildHotspots();
        };
        img.src = a.img || a.src;
        d._artData = a;   // 핫스팟(2D)이 참조 — 3D 액자 직접 클릭은 rotateY 벽에서 빗나가므로
        wall.appendChild(d);
      });
    });
    buildSculpt();
    buildHotspots();
    renderMessageWall();   // 정면 벽 글귀판 + 흔적 티커
  }

  // 3D 액자(rotateY 벽)는 클릭이 빗나가므로, 화면상 실제 위치에 2D 투명 핫스팟을 깐다.
  const SIDE_KEYS = ['front', 'right', 'back', 'left'];
  function buildHotspots() {
    const hs = root && root.querySelector('#g1-hotspots');
    if (!hs) return;
    hs.innerHTML = '';
    const base = hs.getBoundingClientRect();
    const wallEl = root.querySelector('.g1-wall-' + SIDE_KEYS[side]);
    if (!wallEl) return;
    const mk = (el, fn, role) => {
      if (!el) return;
      const r = el.getBoundingClientRect();
      if (r.width < 6 || r.height < 6) return;   // 안 보이는(접힌) 면은 건너뜀
      const s = document.createElement('div');
      s.className = 'g1-hotspot g1-hotspot-' + role;
      s.style.left = (r.left - base.left) + 'px';
      s.style.top = (r.top - base.top) + 'px';
      s.style.width = r.width + 'px';
      s.style.height = r.height + 'px';
      s.addEventListener('click', fn);
      hs.appendChild(s);
    };
    wallEl.querySelectorAll('.g1-painting').forEach(p => {
      const a = p._artData; if (!a) return;
      mk(p.querySelector('.g1-fimg') || p.querySelector('.g1-mat img'), () => openArtZoom(a), 'art');
      mk(p.querySelector('.g1-plaque'), () => openArtNote(a), 'plaque');
    });
    // 정면 벽 = 메시지 보드 → 액션 버튼(내 방=글귀 쓰기 / 남의 방=헌화) 핫스팟
    if (SIDE_KEYS[side] === 'front') {
      const wr = wallEl.getBoundingClientRect();
      if (wr.width > 6) {
        const btn = document.createElement('button');
        btn.className = 'g1-mw-action';
        btn.textContent = MW_isOwner ? '✎ 내 글귀 쓰기' : '🌸 꽃 두고 가기';
        btn.style.left = (wr.left - base.left + wr.width / 2) + 'px';
        btn.style.top  = (wr.top - base.top + wr.height + 22) + 'px';   // 마루 시작 살짝 아래 (글귀 안 가림)
        btn.addEventListener('click', MW_isOwner ? openWriteModal : openFlowerModal);
        hs.appendChild(btn);
      }
    }
  }

  function buildSculpt() {
    if (!SCULPT_ON) return;                 // 조각의 방 개관 전까지 회화만
    const world = root.querySelector('#g1-world');
    SCULPT.forEach(s => {
      // 바닥 그림자 (바닥 평면에 눕힘)
      const sh = document.createElement('div');
      sh.className = 'g1-sculpt-shadow';
      sh.style.setProperty('--sx', s.x + 'px');
      sh.style.setProperty('--sz', s.z + 'px');
      world.appendChild(sh);
      // 조각 본체 (받침대+조각+명판 한 기둥, 카메라 향해 빌보드 회전)
      const d = document.createElement('div');
      d.className = 'g1-sculpt' + (s.faces ? ' g1-turnable' : '');
      const statueH = s.sh || 250;
      const pedH = s.ped ? (s.pedh || 175) : 108;       // 이미지 받침대 vs CSS 받침대
      const colH = statueH + pedH + 72;                 // +명판 여유
      d.style.height = colH + 'px';
      d.style.setProperty('--sx', s.x + 'px');
      d.style.setProperty('--sy', (350 - colH) + 'px'); // 바닥(y=+350)에 발 딛기
      d.style.setProperty('--sz', s.z + 'px');
      let visual;
      if (s.faces) {                                    // 4면 조각 — 회전 좌대
        visual = s.faces.map((f, i) =>
          `<img class="g1-sface${i === 0 ? ' on' : ''}" src="${f}" alt="${s.t}">`).join('');
      } else {
        visual = s.src ? `<img class="g1-sface on" src="${s.src}" alt="${s.t}">` : s.svg;
      }
      // 받침대: 이미지가 오면 이미지, 안 오면(404) CSS 받침대가 자리 지킴
      const cssPed = `<div class="g1-pedestal">
          <div class="g1-ped-top"></div><div class="g1-ped-body"></div><div class="g1-ped-base"></div>
        </div>`;
      const pedHTML = s.ped
        ? `<img class="g1-ped-img" src="${s.ped}" alt=""
              style="height:${pedH}px; margin-top:${-(s.sink ?? Math.round(statueH * 0.04))}px"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
           <div class="g1-pedestal" style="display:none">
             <div class="g1-ped-top"></div><div class="g1-ped-body"></div><div class="g1-ped-base"></div>
           </div>`
        : cssPed;
      d.innerHTML = `
        <div class="g1-statue" style="${s.sw ? `width:${s.sw}px;` : ''}height:${statueH}px">${visual}</div>
        ${pedHTML}
        <div class="g1-plaque"><div class="g1-pt">${s.t}</div><div class="g1-pa">${s.a}</div></div>`;
      if (s.faces) {                                    // 클릭 → 다음 면으로 크로스페이드
        let cur = 0;
        d.addEventListener('click', () => {
          const imgs = d.querySelectorAll('.g1-sface');
          imgs[cur].classList.remove('on');
          cur = (cur + 1) % imgs.length;
          imgs[cur].classList.add('on');
        });
      }
      world.appendChild(d);
    });
  }

  function update() {
    const p = camPos(side);
    root.style.setProperty('--g1-cam-x', p.x + 'px');
    root.style.setProperty('--g1-cam-z', p.z + 'px');
    root.style.setProperty('--g1-yaw',   yaw + 'deg');
    root.querySelector('#g1-compass').innerHTML =
      `${SIDES[side].fr} · ${side + 1} / 4<span class="g1-c-kr">${SIDES[side].kr}</span>`;
    // 정면 벽만 클릭 가능 — 3D 겹침 히트테스트에서 옆·뒤 벽이 클릭 가로채는 것 차단
    ['front','right','back','left'].forEach((k, i) => {
      const w = root.querySelector('.g1-wall-' + k);
      if (w) w.style.pointerEvents = (i === side) ? 'auto' : 'none';
    });
  }
  function next() { if (document.getElementById('mw-modal')) return; side = (side + 1) % 4; yaw -= 90; update(); }
  function prev() { if (document.getElementById('mw-modal')) return; side = (side + 3) % 4; yaw += 90; update(); }

  function fit() {
    if (!root || !root.isConnected) return;
    const r = root.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const s = Math.min(r.width * 0.92 / 2000, r.height * 0.92 / 700);
    root.style.setProperty('--g1-scale', s.toFixed(4));
    buildHotspots();   // 화면 크기 바뀌면 핫스팟 재배치
  }

  // ── 미술 5겹(layers) — 음반 renderLinerNote 미술 이식 (스코프 분리로 복제) ──
  const G1_LABELS = { knowledge:'앎', thought:'사유', connection:'연결', curation:'큐레이션' };
  function g1Md(text){
    if(!text) return '';
    const e = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return e.replace(/\*\*([^*\n]+?)\*\*/g,'<strong style="font-weight:700;color:#2a1c08">$1</strong>')
            .replace(/\*([^*\n]+?)\*/g,'<strong style="font-weight:600;color:#5a3f14">$1</strong>');
  }
  function renderArtNote(ln){
    if(!ln || typeof ln!=='object') return '<span style="opacity:.6">아직 이야기가 인쇄소에 있습니다.</span>';
    const blocks=[];
    if(ln.scene) blocks.push(`<div style="font-size:15px;font-style:italic;color:#3a2a18;margin-bottom:16px;line-height:1.7">${g1Md(ln.scene)}</div>`);
    ['knowledge','thought','connection','curation'].forEach(k=>{
      if(!ln[k]) return;
      blocks.push(`<div style="margin-bottom:14px"><div style="font-size:9px;letter-spacing:2px;color:#8a6a3a;margin-bottom:5px">${G1_LABELS[k]}</div><div>${g1Md(ln[k])}</div></div>`);
    });
    return blocks.join('') || '<span style="opacity:.6">아직 이야기가 인쇄소에 있습니다.</span>';
  }
  function openArtZoom(a){
    const z = root.querySelector('#g1-zoom'); if(!z) return;
    root.querySelector('#g1-zoom-img').src = a.img || a.src || '';
    root.querySelector('#g1-zoom-cap').innerHTML = `<b>${a.t||''}</b><span>${a.a||''}</span>`;
    const down = root.querySelector('#g1-zoom-down');
    down.style.display = (!MW_isOwner || !a.id) ? 'none' : '';   // 내 방 아님·id없음 → 내리기 숨김 (MW_isOwner = 주인 id===내 id, ?user=내닉이어도 내 방)
    down.onclick = () => returnArt(a, down);
    root.querySelector('#g1-zoom-x').onclick = () => { z.hidden = true; };
    z.onclick = (e) => { if(e.target === z) z.hidden = true; };  // 배경 클릭 닫기
    z.hidden = false;
  }
  function openArtNote(a){
    const n = root.querySelector('#g1-note'); if(!n) return;
    root.querySelector('#g1-note-head').innerHTML = `<div class="g1-note-t">${a.t||''}</div><div class="g1-note-a">${a.a||''}</div>`;
    root.querySelector('#g1-note-body').innerHTML = renderArtNote(a.layers);
    root.querySelector('#g1-note-x').onclick = () => { n.hidden = true; };
    n.onclick = (e) => { if(e.target === n) n.hidden = true; };
    const sheet = n.querySelector('.g1-note-sheet'); if(sheet) sheet.scrollTop = 0;
    n.hidden = false;
  }
  async function returnArt(a, btn){
    if(!a.id) return;
    const uid = getUser()?.id; if(!uid){ alert('로그인이 필요합니다.'); return; }
    if(btn){ btn.disabled = true; btn.textContent = '반환 중…'; }
    try{
      await sbFetch('/rest/v1/rpc/return_item', { method:'POST', body: JSON.stringify({ p_item_id:a.id, p_user_id:uid }) });
      const z = root.querySelector('#g1-zoom'); z.hidden = true;
      const elev = root.querySelector('.room-elevator'); if(elev) elev.style.display = '';
      await loadFloor1(true); build();   // 방 갱신 — 빈 자리 다시 채움 (도착 팝업 스킵)
    }catch(e){ alert('헤리티지 반환에 실패했습니다: ' + (e.message||e)); }
    finally{ if(btn){ btn.disabled = false; btn.textContent = '헤리티지에 반환'; } }
  }

  // 본 공사 A1(0613): 내 1층 = 영구소장(wunderkammer_items) + 지금 머무는 대여작(heritage_rentals).
  // owner = ?user= 우선(순례 동선 입구, 백로그 #24), 없으면 로그인 본인.
  // ── 갤러리 셀프 디자인 ──────────────────────────────────────────
  // 프리셋 8 = 완성된 출발점. 슬라이더 미세조정(4b)이 이 위에 올라탄다.
  const G1_PRESETS = [

    { key:'midnight',   name:'한밤 먹빛',     h:222, s:12, l:16, glow:0.10, flh:30,  fls:8,  fll:20, floor:'checker' },
    { key:'whitecube',  name:'화이트큐브',    h:40,  s:12, l:80, glow:0.05, flh:40,  fls:8,  fll:70, floor:'stripe', amber:'#7a5e2c', mould:'#b89858' },
    { key:'terracotta', name:'황혼 테라코타', h:20,  s:54, l:38, glow:0.22, flh:24,  fls:48, fll:33, floor:'terrazzo' },
    { key:'walden',     name:'월든 우드',     h:32,  s:34, l:29, glow:0.16, flh:30,  fls:44, fll:27, floor:'wood' },

    { key:'forest',     name:'숲 에메랄드',   h:158, s:36, l:23, glow:0.12, flh:150, fls:24, fll:23, floor:'herringbone' },
    { key:'dusk',       name:'보랏빛 황혼',   h:282, s:34, l:29, glow:0.18, flh:286, fls:24, fll:26, floor:'stripe' },
  ];

  // st 객체 → 1층 CSS 변수 주입 (null = 디폴트 진홍 복귀)
  function applyStyleObj(st){
    if (!root) root = floorLayer.querySelector('.floor-content[data-floor="1"]');

// 이 콩파뇽이 받은 작품 목록 조합 (영구소장 + 대여)
async function buildArrivalList(ownerId, permItems, rentItems) {
  const list = [];
  // 영구 소장
  for (const p of permItems) {
    list.push({ name: p.name, type: 'perm', weeks: null });
  }
  // 대여 — prize만, heritage_items에서 대여기간 계산
  const prizeRents = rentItems.filter(r => r.source === 'prize');
  if (prizeRents.length) {
    const ids = prizeRents.map(r => r.item_id);
    try {
      const metas = await sbFetch(`/rest/v1/heritage_items?id=in.(${ids.join(',')})&select=id,name`) || [];
      const metaMap = {}; metas.forEach(m => metaMap[m.id] = m.name);
      for (const r of prizeRents) {
        const weeks = r.due_at
          ? Math.round((new Date(r.due_at) - new Date(r.starts_at)) / (7 * 86400000))
          : null;
        list.push({ name: metaMap[r.item_id] || r.item_id, type: 'rent', weeks });
      }
    } catch (e) { /* 조용히 */ }
  }
  return list;
}

// 한글 받침 판별 → 조사 자동 선택
function hasJongseong(word) {
  if (!word) return false;
  const last = word.charCodeAt(word.length - 1);
  if (last < 0xAC00 || last > 0xD7A3) return false; // 한글 음절 아님
  return (last - 0xAC00) % 28 !== 0;
}
function josa(word, withJong, withoutJong) {
  return hasJongseong(word) ? withJong : withoutJong;
}

// 개별화 메시지 생성
function buildArrivalMsg(arrivals, nickname) {
  const lines = [];
  for (const a of arrivals) {
    const iga = josa(a.name, '이', '가');   // 수련이 / 무도회가
    if (a.type === 'perm') {
      lines.push(`〈${a.name}〉${iga} ${nickname || ''}님의 분더카머에 영원히 자리합니다.\n이 작품은 오직 한 분의 것 — 유일본으로, 이 갤러리에 영구 소장됩니다.`);
    } else {
      const wk = a.weeks ? `${a.weeks}주` : '한 철';
      lines.push(`〈${a.name}〉${iga} ${nickname || ''}님의 분더카머에 도착했습니다.\n이 작품은 ${wk} 대여로 운영되며, 기간이 마치면 헤리티지에 자동으로 반납됩니다.\n그 동안 즐거운 감상 되세요.`);
    }
  }
  return lines.join('\n\n');
}

// 축포 confetti
function launchConfetti() {
  const canvas = document.getElementById('arrival-confetti');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const COLORS = ['#c8a240','#f0e4b8','#e8c87a','#ffffff','#b8860b','#ffd700'];
  const particles = Array.from({ length: 120 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    r: Math.random() * 5 + 2,
    d: Math.random() * 3 + 1,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    tilt: Math.random() * 10 - 5,
    tiltAngle: 0, tiltSpeed: Math.random() * 0.1 + 0.05
  }));
  let frame;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      ctx.beginPath();
      ctx.lineWidth = p.r;
      ctx.strokeStyle = p.color;
      ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
      ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
      ctx.stroke();
      p.y += p.d; p.tiltAngle += p.tiltSpeed; p.tilt = Math.sin(p.tiltAngle) * 12;
      if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
    }
    frame = requestAnimationFrame(draw);
  }
  draw();
  // 4초 후 confetti 멈춤
  setTimeout(() => { cancelAnimationFrame(frame); ctx.clearRect(0, 0, canvas.width, canvas.height); }, 4000);
}

// 타이핑 효과
// 타이핑 효과음 — game_core.js SND.type()과 동일한 Web Audio API 방식
const _typingAudioCtx = { ctx: null };
function _typeSound() {
  try {
    if (!_typingAudioCtx.ctx)
      _typingAudioCtx.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const c = _typingAudioCtx.ctx;
    const t = c.currentTime;
    const bufLen = Math.floor(c.sampleRate * 0.04);
    const buf = c.createBuffer(1, bufLen, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++)
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufLen, 2.2);
    const src = c.createBufferSource();
    const gain = c.createGain();
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(420 + Math.random() * 120, t);
    filter.Q.value = 2.0;
    src.buffer = buf;
    gain.gain.setValueAtTime(0.06 + Math.random() * 0.02, t);
    src.connect(filter); filter.connect(gain); gain.connect(c.destination);
    src.start(t);
  } catch (e) { /* 소리 실패는 조용히 — 타이핑 표시는 계속 */ }
}

function typeWriter(el, text, speed, onDone) {
  let i = 0;
  let soundTick = 0;
  const cursor = el.querySelector('.ac-cursor');
  function tick() {
    if (i < text.length) {
      const ch = text[i++];
      el.insertBefore(document.createTextNode(ch), cursor);
      // 공백·줄바꿈 제외, 실제 글자 4개마다 한 번만 소리 (속도는 그대로, 소리만 1/4)
      if (ch !== ' ' && ch !== '\n') {
        if (soundTick % 4 === 0) _typeSound();
        soundTick++;
      }
      setTimeout(tick, ch === '\n' ? speed * 4 : speed);
    } else if (onDone) onDone();
  }
  tick();
}

    <div id="arrival-card">
      <div class="ac-msg"><span class="ac-cursor"></span></div>
      <div class="ac-timer" id="ac-timer"></div>
      <button class="ac-close" onclick="closeArrivalPopup()">확인했습니다</button>
    </div>`;
  document.body.appendChild(overlay);

  requestAnimationFrame(() => overlay.classList.add('show'));
  launchConfetti();

  // 타이핑
  const msgEl = overlay.querySelector('.ac-msg');
  typeWriter(msgEl, msg, 28, null);

  // 남은 시간 카운트다운
  const timerEl = overlay.querySelector('#ac-timer');
  function updateTimer() {
    const remain = Math.max(0, firstTs + 60 * 60 * 1000 - Date.now());
    if (remain === 0) { closeArrivalPopup(); return; }
    const m = Math.floor(remain / 60000);
    const s = Math.floor((remain % 60000) / 1000);
    timerEl.textContent = `이 안내는 ${m}분 ${s}초 후 사라집니다`;
  }
  updateTimer();
  const timerInterval = setInterval(updateTimer, 1000);
  overlay._timerInterval = timerInterval;

  // 1시간 후 자동 닫힘
  const autoClose = setTimeout(() => closeArrivalPopup(), firstTs + 60 * 60 * 1000 - Date.now());
  overlay._autoClose = autoClose;
}

function closeArrivalPopup() {
  const ov = document.getElementById('arrival-overlay');
  if (ov) {
    clearInterval(ov._timerInterval);
    clearTimeout(ov._autoClose);
    ov.classList.remove('show');
    setTimeout(() => ov.remove(), 600);
  }
  document.getElementById('arrival-confetti')?.remove();
}

function renderFloor(n) {
  const f = floorData(n);
  applyPalette(f);

  const downDisabled = (n <= 1) ? 'disabled' : '';

  // 층 본업 콘텐츠 (1·2·3층은 실내, 나머지는 플레이스홀더)
  const body = (n === 5) ? Floor5.markup()
    : (n === 4) ? Floor4.markup()
    : (n === 3) ? Floor3.markup()
    : (n === 2) ? Floor2.markup()
    : (n === 1) ? Floor1.markup()
    : `<div class="floor-roman">${f.roman}</div>
       <div class="floor-name">${f.fr}</div>
       <div class="floor-kr">${f.kr}</div>
       <div class="floor-placeholder">콘텐츠가 들어올 곳</div>`;

  floorLayer.innerHTML = `
    <div class="floor">
      ${body}
      <div class="room-elevator">
        <button class="elev-arrow" id="elevUp" ${upDisabled} aria-label="위층">▲</button>
        <div class="grille"></div>
        <div class="elev-label">ÉTAGE ${f.roman}</div>
        <button class="elev-arrow" id="elevDown" ${downDisabled} aria-label="아래층">▼</button>
      </div>
    </div>`;

  floorLabel.innerHTML = `
    <div class="fl-name">${f.fr.toUpperCase()}</div>
    <div class="fl-floor">ÉTAGE ${f.roman} · ${f.kr}</div>
    ${n === 4 ? '<div class="fl-cat" id="fl-cat"></div>' : ''}`;
  floorLabel.style.display = (n === 2) ? 'none' : '';  // 2층은 자체 헤더가 있어 겹침 방지

  const up = document.getElementById('elevUp');
  const down = document.getElementById('elevDown');
  if (up)   up.addEventListener('click',   () => goToFloor(n + 1));
  if (down) down.addEventListener('click', () => goToFloor(n - 1));

  if (n === 5) Floor5.mount();  // 페르소나 월 활성화
  if (n === 4) Floor4.mount();  // 지성소 활성화
  if (n === 3) Floor3.mount();  // 책방 진열 활성화
  if (n === 2) Floor2.mount();  // 감상실 활성화
  if (n === 1) Floor1.mount();  // 갤러리 3D 방 활성화

  renderAnchorList();

  // 미니 플레이어: 층이 바뀔 때마다 도킹(2층)/미니(그 외) 갱신
  if (window.MusicPlayer) MusicPlayer.onFloorChange(n);
  if (typeof Floor2 !== 'undefined' && Floor2.editSyncToggle) Floor2.editSyncToggle(n);
}

/* ============================================================
 *  층 이동 — 4초 효과음 싱크
 *   0    : bar 내려오며 자리잡음 + 문 닫히기 시작 + 소리 재생
 *   1.1s : (철커덩) 문 닫힘 완료
 *   1.4s : (띵동) 출발층 불 꺼지고 목표층 불 딸깍 점등 + 층 교체
 *   2.5s : (스르륵) 문 열리기 시작
 *   3.5s : 문 활짝 → bar 스르륵 올라가 사라짐
 * ============================================================ */
function goToFloor(target) {
  if (transitioning) return;
  if (target < 1 || target > 5 || target === currentFloor) return;
  // 층 이동 시 음반서고 모달이 떠 있으면 닫는다 (다른 층까지 따라다니는 것 방지)
  { const lm = document.getElementById('library-modal');
    if (lm && lm.classList.contains('open') && window.Library) Library.close(); }
  // ★ 2층을 떠나는 이동이면 미니플레이어(단일 유튜브 iframe)를 즉시 완전 제거.
  //   서고 close가 dock으로 되살리는 창을 곧바로 닫아, 유령 스크린이 다른 층 진열장을 덮는 것을 막는다.
  //   (EG 정신: 음악은 감상실에 두고, 나올 때 끄고 나온다)
  if (target !== 2 && window.MusicPlayer && MusicPlayer.stopAndHide) MusicPlayer.stopAndHide();
  transitioning = true;
  if (bootHint) bootHint.style.opacity = '0';

  const from = currentFloor;

  // bar 자리잡기 + 출발층 불 + 문 닫힘 시작 + 소리
  syncDoorTop();
  litLamp(from);
  elevator.classList.add('active', 'riding', 'closing');
  playSfx();

  // 1.4s 띵동 — 목표층 불 딸깍 + 층 콘텐츠 교체 (문 닫힌 뒤라 안 보임)
  setTimeout(() => {
    currentFloor = target;
    renderFloor(target);
    syncDoorTop();
    litLamp(target);
  }, SFX.ding);

  // 2.5s 스르륵 — 문 열림 시작
  setTimeout(() => {
    elevator.classList.remove('closing');
  }, SFX.open);

  // 3.5s 문 활짝 — bar 사라지고 정리
  setTimeout(() => {
    elevator.classList.remove('riding'); // bar 위로 사라짐
    setTimeout(() => {
      elevator.classList.remove('active');
      transitioning = false;
      maybeAutoLibrary();   // 순례(?user=) 2층 첫 도착 → 그 집 음반서고부터
    }, 500);
  }, SFX.end);
}

/* ===== 순례 자동 서고 — 남의 집 2층 첫 진입 시 음반서고부터 ===== *
 *  본인(?user= 없음) = 감상실 직행(현행 유지).
 *  순례(?user=닉) = 2층 첫 도착에 Library.open() 1회 → 그 집 rentals 디깅
 *  → 자켓 한 장 고르면 기존 동선(close→play)으로 감상실 도킹.
 *  세션 1회 플래그(pilgrimLibAuto)로 재진입·자켓픽 후엔 다시 안 뜸.            */
let pilgrimLibAuto = false;
async function maybeAutoLibrary(){
  if (currentFloor !== 2) return;
  const qUser = new URLSearchParams(location.search).get('user');
  if (!qUser) return;            // ?user= 없음(순수 본인) = 감상실 직행
  if (pilgrimLibAuto) return;    // 순례 세션 1회만
  // ?user= 가 내 닉이면(자기 집을 ?user=내닉 으로 들어온 경우) 서고 자동 안 열기 → 감상실 직행
  const me = getUser()?.id || null;
  if (me) {
    try {
      const u = await sbFetch(`/rest/v1/users?nickname=eq.${encodeURIComponent(qUser)}&select=id`);
      if ((u?.[0]?.id || null) === me) return;   // 내 집
    } catch(e){ /* 조회 실패 시엔 아래로 진행(기존 동작) */ }
  }
  if (currentFloor !== 2) return;   // await 사이 층이 바뀌었으면 취소
  pilgrimLibAuto = true;
  if (window.Library) Library.open();
}

/* ===== 엘리베이터 문 — 그 집 주인 elevator_no 로 표시 (노커 door_no 와 같은 정신) ===== */

async function applyElevatorByOwner(){
  try {
    const qUser = new URLSearchParams(location.search).get('user');
    let ownerId = null;
    if (qUser) {
      const u = await sbFetch(`/rest/v1/users?nickname=eq.${encodeURIComponent(qUser)}&select=id`);
      ownerId = u?.[0]?.id || null;
    } else {
      ownerId = getUser()?.id || null;
    }

    const r = await sbFetch(`/rest/v1/wunderkammer?user_id=eq.${ownerId}&select=elevator_no`);

    if (no) applyElevatorImage(no);
  } catch(e) { /* 조용히 기본 유지 — 콩파뇽 화면에 오류 안 띄움 */ }
}

  { const mwM = document.getElementById('mw-modal'); if (mwM) { if (e.key === 'Escape') mwM.remove(); return; } }
  // 음반 서고 모달이 열려 있으면: ESC 닫기 · ←→ 디깅 · 나머지(엘리베이터) 차단
  if (document.getElementById('library-modal').classList.contains('open')) {

  if (e.key === 'ArrowUp')   { e.preventDefault(); goToFloor(currentFloor + 1); }
  if (e.key === 'ArrowDown') { e.preventDefault(); goToFloor(currentFloor - 1); }
  if (currentFloor === 3 && !transitioning) {
    if (e.key === 'ArrowLeft')  Floor3.slide(-1);
    if (e.key === 'ArrowRight') Floor3.slide(+1);
  }
  // 1층(갤러리)에서 ←→ 는 방 회전에 양보
  if (currentFloor === 1 && !transitioning) {
    if (e.key === 'ArrowLeft')  Floor1.rotate(-1);
    if (e.key === 'ArrowRight') Floor1.rotate(+1);
  }
});

    const qUser = new URLSearchParams(location.search).get('user');
    if (qUser) {
      // 순례: 닉→uid. 간헐 실패 대비 한 번 더 재시도. 끝내 실패면 null(빈 방, 내 책으로 폴백 안 함)
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const u = await sbFetch(`/rest/v1/users?nickname=eq.${encodeURIComponent(qUser)}&select=id`);
          if (u && u[0] && u[0].id) return u[0].id;
        } catch(e){ console.warn('owner 조회 실패', e); }
        await new Promise(r => setTimeout(r, 300));
      }
      return null;
    }
    return getUser()?.id || null;   // 내 방
  }
  async function mount() {
    currentShelfPage = 0; isTransitioning = false; editMode = false; selEl = null;
    const ownerId = await resolveOwnerId();           // 순례 ?user= 우선, 없으면 본인
    applyShelfBg(ownerId);                             // 그 집 주인 배경
    await loadBooks(ownerId);                          // 그 집 주인 책장 → BOOKS, PAGES
    buildShelfPages();
    buildDots();
    document.getElementById('bk-prev').addEventListener('click', () => slide(-1));
    document.getElementById('bk-next').addEventListener('click', () => slide(+1));
    const isOwner = !!getUser()?.id && ownerId === getUser()?.id;
    const eb = document.getElementById('bk-edit-toggle');
    if (eb) {
      eb.classList.remove('on'); eb.textContent = '✎ 배치 바꾸기';
      eb.style.display = isOwner ? '' : 'none';   // 순례(남의 집)면 편집 숨김
      eb.addEventListener('click', toggleEdit);
    }
    // ＋ 책추가하기 — 내 방에서만 노출·바인딩 (순례 중엔 숨김)
    const ab = document.getElementById('bk-add-toggle');
    if (ab) {
      ab.style.display = isOwner ? '' : 'none';
      if (isOwner) bindAddModal(ownerId);
    }
    const fc = document.querySelector('.floor-content[data-floor="3"]');
    if (fc) fc.classList.remove('editing');
  }

  // ── DB에서 그 집 책 읽어오기 (순례 ?user=면 주인 책, 아니면 내 책) ──
  async function loadBooks(ownerId) {
    BOOKS = []; PAGES = [];
    if (!ownerId) { buildPages(); return; }   // 순례 해석 실패·비로그인 → 빈 방 (내 책 폴백 금지)
    const uid = ownerId;
    try {
      const rows = await sbFetch(`/rest/v1/wunderkammer_books?owner_id=eq.${uid}`
        + `&select=id,owner_id,title,author,cover_url,cover_w,cover_h,pos_x,pos_y,scale,tilt,essay_title,essay_body,seq`
        + `&order=seq.desc`);
      BOOKS = (rows || []).map(r => ({
        id: r.id, owner_id: r.owner_id, title: r.title, author: r.author, cover: r.cover_url,
        cover_w: r.cover_w, cover_h: r.cover_h,
        pos_x: r.pos_x, pos_y: r.pos_y, scale: r.scale, tilt: r.tilt,
        essay_title: r.essay_title, essay_body: r.essay_body, seq: r.seq
      }));
    } catch (e) { BOOKS = []; }
    buildPages();
  }

  // ════════ ＋ 책추가하기 — 검색→표지복사→Storage→DB (데모 book_add_naver_test를 sbFetch 방언으로 이식) ════════
  let BAM_CURRENT = null, BAM_OWNER = null;
  const bamEsc = s => (s||'').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const bamEl = id => document.getElementById(id);

  function bindAddModal(ownerId){
    BAM_OWNER = ownerId;
    const at = bamEl('bk-add-toggle'); if (at) at.addEventListener('click', openAddModal);
    const cb = bamEl('bam-close');     if (cb) cb.addEventListener('click', closeAddModal);
    const gb = bamEl('bam-go');        if (gb) gb.addEventListener('click', bamSearch);
    const q  = bamEl('bam-q');         if (q)  q.addEventListener('keydown', e => { if (e.key === 'Enter') bamSearch(); });
    const ad = bamEl('bam-add');       if (ad) ad.addEventListener('click', bamAddBook);
    const md = bamEl('bk-add-modal');  if (md) md.addEventListener('click', e => { if (e.target === md) closeAddModal(); });
  }

  function openAddModal(){
    const md = bamEl('bk-add-modal'); if (!md) return;
    bamEl('bam-q').value = '';
    bamEl('bam-grid').innerHTML = '';
    bamEl('bam-picked').className = 'bam-picked';
    const st = bamEl('bam-status'); st.className = 'bam-status'; st.textContent = '책 제목을 적고 검색을 눌러보세요.';
    BAM_CURRENT = null;
    md.classList.add('on');
    setTimeout(() => { const q = bamEl('bam-q'); if (q) q.focus(); }, 100);
  }
  function closeAddModal(){ const md = bamEl('bk-add-modal'); if (md) md.classList.remove('on'); }

  async function bamSearch(){
    const q = bamEl('bam-q').value.trim();
    const grid = bamEl('bam-grid'), st = bamEl('bam-status'), gb = bamEl('bam-go');
    if (!q){ bamEl('bam-q').focus(); return; }
    st.className = 'bam-status'; st.textContent = '찾는 중…'; grid.innerHTML = '';
    bamEl('bam-picked').className = 'bam-picked'; gb.disabled = true;
    try {
      const data = await sbFetch('/functions/v1/naver-book-search', { method:'POST', body: JSON.stringify({ q, display:21 }) });
      if (data && data.error) throw new Error(data.error);
      const books = (data && data.books) || [];
      if (!books.length){ st.textContent = '검색 결과가 없습니다.'; return; }
      st.textContent = ''; bamRender(books);
    } catch(e){
      st.className = 'bam-status err';
      st.innerHTML = '검색이 막혔어요. <b>은교살롱 로그인</b> 후 새로고침이 필요할 수 있어요.<br><span style="font-size:11px;opacity:.7">(' + bamEsc(e.message||e) + ')</span>';
    } finally { gb.disabled = false; }
  }

  function bamRender(books){
    const grid = bamEl('bam-grid'); grid.innerHTML = '';
    books.forEach(b => {
      const cover = b.cover_url || '';
      const card = document.createElement('button');
      card.className = 'bam-card';
      card.innerHTML = '<div class="bam-cover">'
        + (cover ? '<img loading="lazy" src="' + bamEsc(cover) + '" alt="">' : '<div class="bam-noimg">표지 없음</div>')
        + '</div><div class="bam-ct">' + bamEsc(b.title||'') + '</div><div class="bam-ca">' + bamEsc(b.author||'—') + '</div>';
      card.onclick = () => bamChoose(b);
      grid.appendChild(card);
    });
  }

  function bamChoose(b){
    BAM_CURRENT = b;
    const img = bamEl('bam-pimg');
    img.src = b.cover_url || ''; img.style.display = b.cover_url ? 'block' : 'none';
    bamEl('bam-ptitle').textContent = b.title || '';
    bamEl('bam-pauth').textContent = b.author || '—';
    bamEl('bam-ppub').textContent = b.publisher || '—';
    bamEl('bam-pisbn').textContent = b.isbn || '—';
    const res = bamEl('bam-result'); res.className = 'bam-result'; res.innerHTML = '';
    const picked = bamEl('bam-picked'); picked.className = 'bam-picked on';
    picked.scrollIntoView({ behavior:'smooth', block:'center' });
  }

  // 표지 복사: 1차 직접 fetch → 막히면 Edge Function 프록시 (blob이라 sbFetch 못 씀 → raw fetch + 토큰)
  async function bamFetchCoverBlob(coverUrl){
    try {
      const r = await fetch(coverUrl, { mode:'cors' });
      if (r.ok){ const b = await r.blob(); if (b && b.size > 0) return { blob:b, via:'직접' }; }
    } catch(e){ /* CORS 막힘 → 프록시 */ }
    const token = await getValidToken();
    if (!token) throw new Error('로그인 세션 없음');
    const r2 = await fetch(SUPABASE_URL + '/functions/v1/naver-book-search', {
      method:'POST',
      headers:{ 'Authorization':'Bearer ' + token, 'apikey':SUPABASE_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ img: coverUrl })
    });
    if (!r2.ok) throw new Error('표지 프록시 실패 ' + r2.status);
    const b2 = await r2.blob();
    if (!b2 || b2.size === 0) throw new Error('표지 빈 응답');
    return { blob:b2, via:'프록시' };
  }

  function bamImgSize(blob){
    return new Promise(res => {
      const u = URL.createObjectURL(blob); const im = new Image();
      im.onload = () => { res({ w:im.naturalWidth, h:im.naturalHeight }); URL.revokeObjectURL(u); };
      im.onerror = () => { res({ w:null, h:null }); URL.revokeObjectURL(u); };
      im.src = u;
    });
  }

  async function bamAddBook(){
    if (!BAM_CURRENT) return;
    const res = bamEl('bam-result'), addBtn = bamEl('bam-add');
    if (!BAM_OWNER){ res.className = 'bam-result ng'; res.innerHTML = '⚠️ 로그인이 필요합니다.'; return; }
    addBtn.disabled = true; res.className = 'bam-result'; res.innerHTML = '표지를 우리 책방으로 옮기는 중…';
    try {
      let via = '—', w = null, h = null, cover_url = null;
      if (BAM_CURRENT.cover_url){
        const got = await bamFetchCoverBlob(BAM_CURRENT.cover_url); via = got.via;
        const sz = await bamImgSize(got.blob); w = sz.w; h = sz.h;
        const ext = ((got.blob.type.split('/')[1]) || 'jpg').replace('jpeg','jpg');
        const path = BAM_OWNER + '/' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
        const token = await getValidToken();
        const up = await fetch(SUPABASE_URL + '/storage/v1/object/book-covers/' + path, {
          method:'POST',
          headers:{ 'Authorization':'Bearer ' + token, 'apikey':SUPABASE_KEY, 'Content-Type':got.blob.type },
          body: got.blob
        });
        if (!up.ok) throw new Error('Storage 업로드 실패 ' + up.status);
        cover_url = SUPABASE_URL + '/storage/v1/object/public/book-covers/' + path;
      }
      // 새 책은 맨 앞(최신) 칸으로 — 현재 최대 seq + 1 부여 (기존 배치 안 흔듦)
      let _nextSeq = 0;
      try {
        const _mx = await sbFetch(`/rest/v1/wunderkammer_books?owner_id=eq.${BAM_OWNER}&select=seq&order=seq.desc&limit=1`);
        if (Array.isArray(_mx) && _mx.length && _mx[0].seq != null) _nextSeq = Number(_mx[0].seq) + 1;
      } catch (e) {}
      const ins = await sbFetch('/rest/v1/wunderkammer_books', {
        method:'POST', headers:{ 'Prefer':'return=representation' },
        body: JSON.stringify({
          owner_id: BAM_OWNER, source:'search',
          title: BAM_CURRENT.title, author: BAM_CURRENT.author,
          publisher: BAM_CURRENT.publisher, isbn: BAM_CURRENT.isbn,
          cover_url, cover_w:w, cover_h:h, seq: _nextSeq
        })
      });
      const row = Array.isArray(ins) ? ins[0] : ins;
      res.className = 'bam-result ok';
      res.innerHTML = '✅ <b>' + bamEsc(BAM_CURRENT.title) + '</b> 들였습니다!<br>'
        + '<span class="sm">표지 ' + via + ' 복사 · 원본 ' + (w&&h ? w+'×'+h : '크기?')
        + (row && row.id ? ' · row ' + String(row.id).slice(0,8) + '…' : '') + '</span>';
      // 책장 즉시 갱신 — 새 책이 바로 꽂힘
      await loadBooks(BAM_OWNER);
      buildShelfPages();
      buildDots();
    } catch(e){
      res.className = 'bam-result ng';
      res.innerHTML = '들이기가 막혔어요<br><span class="sm">' + bamEsc(e.message||e) + '</span>';
    } finally { addBtn.disabled = false; }
  }

  // ── 읽어온 책을 6권씩 페이지로 자른다 ──
  function buildPages() {
    PAGES = [];
    for (let i = 0; i < BOOKS.length; i += PER_PAGE) {
      PAGES.push(BOOKS.slice(i, i + PER_PAGE).map((b, j) => ({ book: b, slot: SHELF_SLOTS[j] })));
    }
    if (!PAGES.length) PAGES = [[]];   // 빈 책방도 한 페이지(화살표·닷 안전)
  }

  // 책 한 권을 칸(SHELF_SLOTS)에 딱 스냅해 앉힌다 — 자유 pos 폐기(0706 스냅 배치). 위치는 오직 칸, 크기만 개별.
  function placeBook(el, book, slot) {
    const sc = (book.scale != null) ? Number(book.scale) : 1;
    const h = slot.height * (sc > 0 ? sc : 1);   // scale 문자열·0 방어
    el.style.left = slot.left + '%'; el.style.top = slot.top + '%'; el.style.height = h + '%';
  }

  function buildShelfPages() {
    const stack = document.getElementById('bk-cover-stack');
    stack.innerHTML = '';
    PAGES.forEach((pageData, idx) => {
      const page = document.createElement('div');
      page.className = 'cover-page' + (idx === 0 ? ' active' : '');
      pageData.forEach(({ book, slot }) => {
        const el = document.createElement('div');
        el.className = 'cover-book';
        el._book = book; el._slot = slot;
        placeBook(el, book, slot);
        el.innerHTML = `<img src="${book.cover}" alt="${book.title}" title="${book.title} · ${book.author}"><div class="bk-handle" data-h="1"></div>`;
        el.addEventListener('click', (e) => {
          if (editMode) { if (!e.target.dataset.h) selectBook(el); return; }  // 편집 중엔 선택만(모달 차단)
          openBook(book);
        });
        bindEdit(el);
        page.appendChild(el);
      });
      stack.appendChild(page);
    });
  }

  // ════ 편집 모드 (heritage 보물 편집 이식: 선택·드래그·핸들 크기·DB 저장) ════
  function toggleEdit() {
    editMode = !editMode;
    const fc = document.querySelector('.floor-content[data-floor="3"]');
    if (fc) fc.classList.toggle('editing', editMode);
    const btn = document.getElementById('bk-edit-toggle');
    if (btn) { btn.classList.toggle('on', editMode); btn.textContent = editMode ? '✓ 완료' : '✎ 배치 바꾸기'; }
    if (!editMode && selEl) { selEl.classList.remove('sel'); selEl = null; }
  }
  function selectBook(el) {
    if (selEl && selEl !== el) selEl.classList.remove('sel');
    selEl = el; el.classList.add('sel');
  }

  // 드래그 이동 + 휠/핸들 크기 (마우스·터치 양쪽)
  function bindEdit(el) {
    const book = el._book;
    // ── 위치 드래그 → 놓으면 가장 가까운 칸에 스냅, 그 칸 책과 자리(seq) 교환 ──
    let drag = false, sx, sy, bx, by;
    const dStart = (cx, cy) => {
      if (!editMode) return;
      selectBook(el); drag = true; sx = cx; sy = cy;
      bx = el._slot.left; by = el._slot.top;   // 현재 칸 좌표에서 출발
      el.classList.add('grabbing');
    };
    const dMove = (cx, cy) => {
      if (!drag) return;
      const stack = el.closest('.cover-stack'); if (!stack) return;
      const rw = stack.offsetWidth, rh = stack.offsetHeight;
      // 시각 피드백만 — 손을 따라 움직임 (DB 저장 안 함, 놓을 때 스냅)
      el.style.left = (bx + ((cx - sx) / rw) * 100) + '%';
      el.style.top  = (by + ((cy - sy) / rh) * 100) + '%';
    };
    const dEnd = () => {
      if (!drag) return; drag = false; el.classList.remove('grabbing');
      snapSwap(el, book);
    };
    el.addEventListener('mousedown', (e) => {
      if (!editMode || e.target.dataset.h) return;
      e.preventDefault(); dStart(e.clientX, e.clientY);
      const mm = ev => dMove(ev.clientX, ev.clientY);
      const mu = () => { dEnd(); removeEventListener('mousemove', mm); removeEventListener('mouseup', mu); };
      addEventListener('mousemove', mm); addEventListener('mouseup', mu);
    });
    el.addEventListener('touchstart', (e) => {
      if (!editMode || e.target.dataset.h) return;
      const t = e.touches[0]; dStart(t.clientX, t.clientY);
    }, { passive: true });
    el.addEventListener('touchmove', (e) => {
      if (!drag) return; e.preventDefault(); const t = e.touches[0]; dMove(t.clientX, t.clientY);
    }, { passive: false });
    el.addEventListener('touchend', dEnd);
    el.addEventListener('touchcancel', dEnd);
    // ── 휠 크기 (PC) ──
    el.addEventListener('wheel', (e) => {
      if (!editMode) return; e.preventDefault(); selectBook(el);
      const cur = (book.scale != null) ? Number(book.scale) : 1;
      book.scale = +Math.max(0.4, Math.min(2.5, cur + (e.deltaY < 0 ? 0.04 : -0.04))).toFixed(3);
      placeBook(el, book, el._slot);
      clearTimeout(el._szT); el._szT = setTimeout(() => saveBook(book), 400);
    }, { passive: false });
    // ── 핸들 크기 (드래그) ──
    const handle = el.querySelector('.bk-handle');
    let hBase, hsx;
    const hStart = (cx) => { selectBook(el); hBase = (book.scale != null) ? Number(book.scale) : 1; hsx = cx; };
    const hMove = (cx) => {
      book.scale = +Math.max(0.4, Math.min(2.5, hBase + (cx - hsx) / 120)).toFixed(3);
      placeBook(el, book, el._slot);
    };
    handle.addEventListener('mousedown', (e) => {
      if (!editMode) return; e.preventDefault(); e.stopPropagation(); hStart(e.clientX);
      const mm = ev => hMove(ev.clientX);
      const mu = () => { saveBook(book); removeEventListener('mousemove', mm); removeEventListener('mouseup', mu); };
      addEventListener('mousemove', mm); addEventListener('mouseup', mu);
    });
    handle.addEventListener('touchstart', (e) => {
      if (!editMode) return; e.stopPropagation(); hStart(e.touches[0].clientX);
      const tm = ev => { ev.preventDefault(); hMove(ev.touches[0].clientX); };
      const tu = () => { saveBook(book); removeEventListener('touchmove', tm); removeEventListener('touchend', tu); };
      addEventListener('touchmove', tm, { passive: false }); addEventListener('touchend', tu);
    }, { passive: true });
  }

  // 놓은 위치에서 가장 가까운 칸을 찾아, 그 칸 책과 자리(seq)를 맞바꾼다 (같은 페이지 안, 전체 재렌더 없이 DOM만 교환)
  async function snapSwap(el, book) {
    const stack = el.closest('.cover-stack');
    const fromSlot = el._slot;
    if (!stack) { placeBook(el, book, fromSlot); return; }
    const sRect = stack.getBoundingClientRect();
    const eRect = el.getBoundingClientRect();
    const cx = ((eRect.left + eRect.width / 2 - sRect.left) / sRect.width) * 100;
    const cy = ((eRect.top + eRect.height / 2 - sRect.top) / sRect.height) * 100;
    let best = SHELF_SLOTS[0], bestD = Infinity;
    SHELF_SLOTS.forEach(s => {
      const d = (s.left - cx) ** 2 + (s.top - cy) ** 2;
      if (d < bestD) { bestD = d; best = s; }
    });
    if (best === fromSlot) { placeBook(el, book, fromSlot); return; }   // 제자리 → 그대로 스냅
    // 같은 페이지에서 best 칸을 쓰는 다른 책 el 찾기
    let targetEl = null;
    el.parentElement.querySelectorAll('.cover-book').forEach(o => {
      if (o !== el && o._slot === best) targetEl = o;
    });
    if (!targetEl) { placeBook(el, book, fromSlot); return; }   // 빈 칸 = 교환 상대 없음 → 제자리 복귀
    const targetBook = targetEl._book;
    // 슬롯·위치 교환
    el._slot = best; targetEl._slot = fromSlot;
    placeBook(el, book, best);
    placeBook(targetEl, targetBook, fromSlot);
    // seq 교환 (메모리 + DB) — 다음 로드 때 seq.desc 정렬에 그대로 반영
    const a = book.seq, b = targetBook.seq;
    book.seq = b; targetBook.seq = a;
    await swapSeq(book.id, b, targetBook.id, a);
  }

  // 두 책의 seq를 DB에 맞바꿔 기록 (RLS가 본인 책만 허용)
  async function swapSeq(idA, seqA, idB, seqB) {
    try {
      await sbFetch(`/rest/v1/wunderkammer_books?id=eq.${idA}`, {
        method: 'PATCH', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({ seq: seqA })
      });
      await sbFetch(`/rest/v1/wunderkammer_books?id=eq.${idB}`, {
        method: 'PATCH', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({ seq: seqB })
      });
    } catch (e) { /* 저장 실패는 조용히 — 다음 조작에서 재시도 */ }
  }

  // 저장 — wunderkammer_books PATCH (pos_x/pos_y/scale 즉시 기록, RLS가 본인 책만 허용)
  async function saveBook(book) {
    try {
      await sbFetch(`/rest/v1/wunderkammer_books?id=eq.${book.id}`, {
        method: 'PATCH', headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ scale: book.scale })   // 위치는 seq(자리 교환)로 처리, 여기선 크기만
      });
    } catch (e) { /* 저장 실패는 조용히 — 다음 조작에서 재시도 */ }
  }
  function buildDots() {
    const dots = document.getElementById('bk-dots');
    dots.innerHTML = '';
    for (let i = 0; i < PAGES.length; i++) {
      const dot = document.createElement('div');
      dot.className = 'bk-dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', () => transitionTo(i));
      dots.appendChild(dot);
    }
  }
  function transitionTo(idx) {
    if (isTransitioning || idx === currentShelfPage) return;
    isTransitioning = true;
    const pages = document.querySelectorAll('.floor-content[data-floor="3"] .cover-page');
    if (!pages.length) { isTransitioning = false; return; }
    pages[currentShelfPage].classList.remove('active');
    pages[idx].classList.add('active');
    currentShelfPage = idx;
    setRoomBg(roundedBg(idx), true);   // 페이지마다 배경 한 장씩 돌기 (크로스페이드)
    document.querySelectorAll('.floor-content[data-floor="3"] .bk-dot').forEach((d, i) => d.classList.toggle('active', i === currentShelfPage));
    setTimeout(() => { isTransitioning = false; }, 600);
  }
  function slide(direction) {
    if (currentFloor !== 3) return;
    transitionTo((currentShelfPage + direction + PAGES.length) % PAGES.length);
  }

  /* === FlipBook 모달 (body의 #book-modal 재사용) === */
  const modal = document.getElementById('book-modal');
  let currentBook = null;
  const flipSound = document.getElementById('page-flip-sound');

  function playFlipSound() {
    if (!soundEnabled || muted) return;
    flipSound.currentTime = 0; flipSound.volume = 0.5;
    flipSound.play().catch(() => {});
  }
  function openBook(book) {
    currentBook = book;
    buildFlipbook(book, paginateEssay(book));
    modal.classList.add('open');
    // 내 책일 때만 글쓰기 버튼 (미래 순례 ?user= 대비)
    const myUid = getUser()?.id;
    const mine = !book.owner_id || book.owner_id === myUid;
    const wbtn = document.getElementById('essay-write-btn');
    if (wbtn) wbtn.style.display = mine ? 'block' : 'none';
  }
  // essay_body(긴 글) → 면 단위로 분할해 모달에 흐름. 없으면 안내.
  function escHtml(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  // 빈 글: 안내 두 면
  function emptyFaces(book){
    return [
      { title: book.title, paras: [`아직 『${book.title}』에 대한 글이 없습니다.`, '이 책과 당신 삶이 어떻게 만났는지, 한 편의 글로 남겨 보세요.'] },
      { title: null, paras: ['어떤 시기에 어떻게 다가왔는지, 왜 이 책을 사랑하는지.', '글은 곧 이 면에 펼쳐집니다.'] }
    ];
  }

  // 실측: 본문을 면 크기에 맞춰 여러 면으로 분할 (넘치면 다음 면 / 단락이 면보다 길면 어절로 쪼갬)
  function paginateEssay(book){
    const body = (book.essay_body || '').trim();
    if(!body) return { faces: emptyFaces(book), empty:true };
    const title = book.essay_title || book.title || '';
    const paras = body.split(/\n{2,}/).map(s => s.trim()).filter(Boolean);

    // 측정용 면 — 실제 .front 와 동일 클래스·컨텍스트(modal 안), 화면 밖
    const host = document.createElement('div');
    host.className = 'book';
    host.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none;';
    host.innerHTML = '<div class="page"><div class="front"><div class="page-content"></div></div></div>';
    modal.appendChild(host);
    const pc = host.querySelector('.page-content');
    const render = (t, ps) => { pc.innerHTML = (t?`<h2>${escHtml(t)}</h2>`:'') + ps.map(p=>`<p>${escHtml(p)}</p>`).join(''); };
    const overflow = () => pc.scrollHeight > pc.clientHeight + 1;

    const faces = [];
    let first = true;
    const queue = paras.slice();
    let guard = 0;
    while(queue.length && guard++ < 300){
      const t = first ? title : '';
      const accepted = [];
      while(queue.length){
        render(t, [...accepted, queue[0]]);
        if(!overflow()){ accepted.push(queue.shift()); continue; }
        if(accepted.length === 0){
          // 단락 하나가 한 면보다 김 → 어절 단위로 쪼갬
          const words = queue.shift().split(/(\s+)/);
          let lo = '';
          for(let k=0; k<words.length; k++){
            const test = lo + words[k];
            render(t, [test]);
            if(overflow() && lo.trim()) break;
            lo = test;
          }
          lo = lo.trim() || (words[0]||'');
          accepted.push(lo);
          const remain = words.join('').slice(lo.length).replace(/^\s+/, '');
          if(remain) queue.unshift(remain);
        }
        break; // 이 면 마감
      }
      faces.push({ title: t || null, paras: accepted });
      first = false;
    }
    host.remove();
    return { faces, empty:false };
  }
  function closeBook() {
    modal.classList.remove('open');
    setTimeout(() => { const b = modal.querySelector('.book'); if (b) b.remove(); }, 500);
  }
  function buildFlipbook(book, result) {
    const old = modal.querySelector('.book'); if (old) old.remove();
    const bookEl = document.createElement('div'); bookEl.className = 'book';

    // 읽기 순서: page0 = 표지(front) + 첫 면(back) / 이후 page = 면(front)+면(back) / 끝 면
    const seq = result.faces.slice();
    seq.push({ end:true, book });   // 마지막 끝 면

    bookEl.appendChild(buildPageEl(makeCoverHtml(book), makeFaceHtml(seq[0], 'back')));
    let i = 1;
    while (i < seq.length) {
      const front = makeFaceHtml(seq[i], 'front');
      const back  = (i+1 < seq.length) ? makeFaceHtml(seq[i+1], 'back') : makeBlankHtml();
      bookEl.appendChild(buildPageEl(front, back));
      i += 2;
    }

    modal.insertBefore(bookEl, modal.firstChild);
    bookEl.style.setProperty('--c', 0);
    bookEl.querySelectorAll('.page').forEach((page, idx) => {
      page.style.setProperty('--i', idx);
      page.addEventListener('click', (evt) => {
        if (evt.target.closest('a')) return;
        const curr = evt.target.closest('.back') ? idx : idx + 1;
        const prev = parseInt(bookEl.style.getPropertyValue('--c')) || 0;
        bookEl.style.setProperty('--c', curr);
        if (curr !== prev) playFlipSound();
      });
    });
  }
  function buildPageEl(frontHtml, backHtml) {
    const page = document.createElement('div'); page.className = 'page';
    page.innerHTML = frontHtml + backHtml; return page;
  }
  function makeCoverHtml(book) { return `<div class="front cover"><div class="cover-bg" style="background-image:url('${book.cover}')"></div></div>`; }
  function makeFaceHtml(face, side) {
    const cls = (side === 'back') ? 'back' : 'front';
    if (face.end) {
      const b = face.book;
      return `<div class="${cls} cover" style="background:#faf7f0;color:#2a1810"><div class="page-end"><h2>— 끝 —</h2><p class="author">${escHtml(b.author || '')}</p><p class="book-title">『${escHtml(b.essay_title || b.title || '')}』</p></div></div>`;
    }
    const h  = face.title ? `<h2>${escHtml(face.title)}</h2>` : '';
    const ps = (face.paras || []).map(p => `<p>${escHtml(p)}</p>`).join('');
    return `<div class="${cls}"><div class="page-content">${h}${ps}</div></div>`;
  }
  function makeBlankHtml() {
    return `<div class="back"><div class="page-content"></div></div>`;
  }

  // 모달 닫기 (한 번만 바인딩)
  document.getElementById('modal-close').addEventListener('click', closeBook);

  // ════ 에세이 글쓰기 (책 모달 안 ✎ → 양피지 입력 레이어 → DB 저장 → 면에 흐름) ════
  function openEssayEditor() {
    if (!currentBook) return;
    document.getElementById('ee-book-title').textContent = '『' + (currentBook.title || '') + '』';
    document.getElementById('ee-title').value = currentBook.essay_title || '';
    document.getElementById('ee-body').value  = currentBook.essay_body || '';
    updateEssayCount();
    document.getElementById('essay-editor').classList.add('open');
    setTimeout(() => document.getElementById('ee-body').focus(), 120);
  }
  function closeEssayEditor() {
    document.getElementById('essay-editor').classList.remove('open');
  }
  function updateEssayCount() {
    const n = document.getElementById('ee-body').value.length;
    document.getElementById('ee-count').textContent = n.toLocaleString() + '자';
  }
  async function saveEssay() {
    if (!currentBook) return;
    const title = document.getElementById('ee-title').value.trim();
    const body  = document.getElementById('ee-body').value.trim();
    const saveBtn = document.getElementById('ee-save');
    saveBtn.disabled = true; saveBtn.textContent = '저장 중…';
    try {
      await sbFetch(`/rest/v1/wunderkammer_books?id=eq.${currentBook.id}`, {
        method: 'PATCH', headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ essay_title: title || null, essay_body: body || null })
      });
      currentBook.essay_title = title || null;
      currentBook.essay_body  = body || null;
      closeEssayEditor();
      buildFlipbook(currentBook, paginateEssay(currentBook));  // 새 글을 면에 다시 흘림
    } catch (e) {
      alert('저장에 실패했습니다. 잠시 후 다시 시도해 주세요.');
    } finally {
      saveBtn.disabled = false; saveBtn.textContent = '저장';
    }
  }
  document.getElementById('essay-write-btn').addEventListener('click', openEssayEditor);
  document.getElementById('ee-cancel').addEventListener('click', closeEssayEditor);
  document.getElementById('ee-save').addEventListener('click', saveEssay);
  document.getElementById('ee-body').addEventListener('input', updateEssayCount);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeBook(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeBook();
  });

  return { markup, mount, slide };
})();

/* ============================================================
 *  Ⅳ층 지성소 모듈 (Floor4) — 내 교양의 지성소 · 1단계 골격
 *    12 카테고리 = 독립 방 12개 (4f_bg01~12.webp)
 *    uid 해시 offset → 콩파뇽마다 시작 방이 다름 · 좌우 화살표로 순환
 *    배경=헤리티지 풀스크린 무대(4:5 세로, 천장↔마루 스크롤) · 화살표/roomtag=헤리티지
 *    [1단계] 배경·순환·빈 서가까지. 책등(quiz_log)·4레이어 모달은 2·3단계.
 * ============================================================ */
const Floor4 = (() => {
  // 12방 고정 순서 (콘스텔라티오·뮤세움과 동일 · 파일번호 = 인덱스+1)
  const ROOMS = [
    { cat:'문학', sub:'종이 위의 인간' },   // 4f_bg01
    { cat:'철학', sub:'생각의 탄생' },       // 4f_bg02
    { cat:'역사', sub:'시간의 지층' },       // 4f_bg03
    { cat:'예술', sub:'아름다움의 형식' },   // 4f_bg04
    { cat:'신화', sub:'신들의 정원' },       // 4f_bg05
    { cat:'과학', sub:'우주의 문법' },       // 4f_bg06
    { cat:'심리', sub:'내면의 거울' },       // 4f_bg07
    { cat:'사회', sub:'세상의 구조' },       // 4f_bg08
    { cat:'영성', sub:'초월의 언어' },       // 4f_bg09
    { cat:'생태', sub:'땅의 노래' },         // 4f_bg10
    { cat:'지리', sub:'세계의 골목' },       // 4f_bg11
    { cat:'일상', sub:'삶의 향기' },         // 4f_bg12
  ];
  let currentRoom = 0;
  let isTransitioning = false;
  let tagTimer = null;
  let BOOKS_BY_CAT = {};   // 대분류 → [{answer, seed_id, category}] (quiz_log 우물)

  // 책등 이미지·높이 — 뮤세움과 같은 해시 (book01~10.webp 공유)
  const F4_BOOK_IMAGES = ['book01','book02','book03','book04','book05','book06','book07','book08','book09','book10'];
  function f4BookImg(answer){
    let h=0; for(let i=0;i<answer.length;i++) h=(h*31+answer.charCodeAt(i))&0xfffff;
    return F4_BOOK_IMAGES[h % F4_BOOK_IMAGES.length];
  }
  function f4BookHeight(answer){
    let h=0; for(let i=0;i<answer.length;i++) h=(h*17+answer.charCodeAt(i))&0xfffff;
    const hs=[150,162,172,180,188,196,176,168,158,184];   // 뮤세움 대비 ~1.35배
    return hs[h % hs.length];
  }

  // uid 해시 → 시작 방 (shelfBgIndex와 같은 문법, 0~11)
  function startOffsetOf(uid){
    if(!uid) return 0;
    let sum = 0; for(let i=0;i<uid.length;i++) sum = (sum + uid.charCodeAt(i)) % 100000;
    return sum % 12;
  }

  function markup() {
    return `
      <div class="floor-content" data-floor="4">
        <div class="f4-scroll" id="f4-scroll">
          <div class="f4-stage" id="f4-stage">
            <div class="f4-bgwrap" id="f4-bgwrap"></div>
            <div class="f4-shelf" id="f4-shelf">
              <div class="f4-shelfwrap" id="f4-shelfwrap">
                <div class="f4-books" id="f4-books"></div>
                <div class="f4-wood"></div>
              </div>
            </div>
          </div>
        </div>
        <button class="f4-nav f4-nav-l" id="f4-prev" aria-label="이전 방">‹</button>
        <button class="f4-nav f4-nav-r" id="f4-next" aria-label="다음 방">›</button>
        <div class="f4-empty" id="f4-empty"></div>
        <div class="f4-roomtag" id="f4-roomtag"></div>
        <div class="f4-tabs" id="f4-tabs"></div>
      </div>`;
  }

  // 방 배경 크로스페이드 (setRoomBg 본뜸)
  function setRoomBg(idx, animate){
    const wrap = document.getElementById('f4-bgwrap');
    if(!wrap) return;
    const layer = document.createElement('div');
    layer.className = 'f4-bg-layer';
    layer.style.backgroundImage = `url('4f_bg${String(idx+1).padStart(2,'0')}.webp')`;
    layer.style.opacity = animate ? '0' : '1';
    wrap.insertBefore(layer, wrap.firstChild);
    if(animate) requestAnimationFrame(()=>requestAnimationFrame(()=>{ layer.style.opacity = '1'; }));
    wrap.querySelectorAll('.f4-bg-layer').forEach(el=>{
      if(el !== layer){ el.style.opacity = '0'; setTimeout(()=>el.remove(), 950); }
    });
  }

  // 방 이름 떴다 사라짐 (roomtag 본뜸)
  function showRoomTag(idx){
    const tag = document.getElementById('f4-roomtag');
    if(!tag) return;
    const r = ROOMS[idx];
    tag.innerHTML = `${r.cat}<small>${r.sub}</small>`;
    tag.classList.add('on');
    clearTimeout(tagTimer);
    tagTimer = setTimeout(()=>tag.classList.remove('on'), 3700);
  }

  // 상단 상시 카테고리 타이틀 갱신
  function setTopCat(idx){
    const el = document.getElementById('fl-cat');
    if(el){ const r = ROOMS[idx]; el.innerHTML = `${r.cat} <span>· ${r.sub}</span>`; }
  }

  // 하단 방 탭 (절충 — 작은 글자 12개, 현재 방 또렷)
  function buildTabs(){
    const host = document.getElementById('f4-tabs');
    if(!host) return;
    host.innerHTML = ROOMS.map((r,i)=>`<button class="f4-tab" data-i="${i}">${r.cat}</button>`).join('');
    host.querySelectorAll('.f4-tab').forEach(b=>{
      b.addEventListener('click', ()=>transitionTo(+b.dataset.i));
    });
  }
  function updateTabs(idx){
    document.querySelectorAll('.floor-content[data-floor="4"] .f4-tab')
      .forEach((b,i)=>b.classList.toggle('active', i===idx));
  }

  // 방 내용 그리기 — [2단계] 그 방 카테고리 책등 진열 (없으면 기다리는 방)
  function renderRoom(idx){
    const cat = ROOMS[idx].cat;
    const books = BOOKS_BY_CAT[cat] || [];
    const shelf = document.getElementById('f4-books');
    const empty = document.getElementById('f4-empty');
    const wrap  = document.getElementById('f4-shelfwrap');
    if(!shelf) return;
    shelf.innerHTML = '';
    if(books.length === 0){
      if(wrap)  wrap.style.display = 'none';
      if(empty){ empty.style.display = ''; empty.textContent = '이 방은 당신을 기다리고 있습니다'; }
      return;
    }
    if(empty) empty.style.display = 'none';
    if(wrap)  wrap.style.display = '';
    for(const b of books){
      const item = document.createElement('div');
      item.className = 'f4-book';
      item.title = b.answer;
      const im = document.createElement('img');
      im.className = 'f4-book-img';
      im.src = f4BookImg(b.answer) + '.webp';
      im.style.height = f4BookHeight(b.answer) + 'px';
      im.alt = b.answer;
      const tx = document.createElement('div');
      tx.className = 'f4-book-text';
      tx.textContent = b.answer;
      item.appendChild(im);
      item.appendChild(tx);
      item.addEventListener('click', ()=>f4OpenBook(b));
      shelf.appendChild(item);
    }
  }

  // 첫 화면을 방 중앙부로 (천장은 위로, 마루는 아래로 스크롤)
  function centerScroll(smooth){
    const sc = document.getElementById('f4-scroll');
    if(!sc) return;
    const mid = Math.max(0, (sc.scrollHeight - sc.clientHeight) / 2);
    if(smooth) sc.scrollTo({ top: mid, behavior:'smooth' });
    else sc.scrollTop = mid;
  }

  function transitionTo(idx){
    if(isTransitioning || idx === currentRoom) return;
    isTransitioning = true;
    currentRoom = idx;
    setRoomBg(idx, true);
    showRoomTag(idx);
    setTopCat(idx);
    updateTabs(idx);
    renderRoom(idx);
    requestAnimationFrame(()=>centerScroll(false));
    setTimeout(()=>{ isTransitioning = false; }, 650);
  }

  function slide(direction){
    if(currentFloor !== 4) return;
    transitionTo((currentRoom + direction + 12) % 12);
  }

  // quiz_log 우물 → 대분류별 책 묶음 (OX 제외 · answer 중복 제거)
  async function loadBooks(uid){
    BOOKS_BY_CAT = {};
    if(!uid) return;
    let rows = [];
    try{
      rows = await sbFetch(`/rest/v1/rpc/get_sanctuaire_books?p_uid=${encodeURIComponent(uid)}`) || [];
    }catch(e){ console.warn('[F4] quiz_log 로드 실패', e); return; }
    const seen = {};
    for(const r of rows){
      if(!r.answer || r.answer==='O' || r.answer==='X') continue;       // OX 제외
      const cat = (r.category||'').split(' · ')[0];                       // 대분류
      if(!cat) continue;
      const key = cat + '|' + r.answer;
      if(seen[key]) continue;                                            // answer 중복 1권만
      seen[key] = 1;
      (BOOKS_BY_CAT[cat] = BOOKS_BY_CAT[cat] || []).push({ answer:r.answer, seed_id:r.seed_id, category:r.category });
    }
  }

  // 순례 ?user= 우선, 없으면 본인 (3층과 동일 정신)
  async function resolveOwnerId(){
    const qUser = new URLSearchParams(location.search).get('user');
    if(qUser){
      try{
        const u = await sbFetch(`/rest/v1/users?nickname=eq.${encodeURIComponent(qUser)}&select=id`);
        if(u && u[0] && u[0].id) return u[0].id;
      }catch(e){ console.warn('[F4] owner 조회 실패', e); }
      return null;
    }
    return getUser()?.id || null;
  }

  async function mount(){
    isTransitioning = false;
    const uid = await resolveOwnerId();
    await loadBooks(uid);                       // quiz_log 우물 → 대분류별 책
    currentRoom = startOffsetOf(uid);          // 콩파뇽마다 시작 방 다름
    setRoomBg(currentRoom, false);
    showRoomTag(currentRoom);
    setTopCat(currentRoom);
    buildTabs();
    updateTabs(currentRoom);
    renderRoom(currentRoom);
    const prev = document.getElementById('f4-prev');
    const next = document.getElementById('f4-next');
    if(prev) prev.addEventListener('click', ()=>slide(-1));
    if(next) next.addEventListener('click', ()=>slide(+1));
    f4InitModal();   // 책 모달 이벤트 1회 바인딩
    requestAnimationFrame(()=>centerScroll(false));
  }

  // ═══════════════════════════════════════════════════════════
  //  [3단계] 책 펼침 모달 — 뮤세움 4레이어 이식 (f4 완전 격리)
  //  표지 3D → 클릭 줌인 → 지식·사유·연결·큐레이션 → 마지막장
  // ═══════════════════════════════════════════════════════════
  const F4_COVER_PALETTES = [
    { band:'linear-gradient(135deg,#1e3a6e,#2c5282)', bandTxt:'rgba(255,220,150,0.85)', bg:'linear-gradient(170deg,#f4f0e8,#ece6da)', accent:'#2c5282', title:'#1a1a2e', spine:'linear-gradient(to right,#1a2f50,#2c4a7a)', spineTxt:'rgba(255,220,150,0.85)' },
    { band:'linear-gradient(135deg,#c0452a,#a03820)', bandTxt:'rgba(255,230,180,0.85)', bg:'linear-gradient(170deg,#fdf6ee,#f5ebe0)', accent:'#a03820', title:'#2d1810', spine:'linear-gradient(to right,#7a3020,#c0502a)', spineTxt:'rgba(255,240,200,0.9)' },
    { band:'none', bandTxt:'', bg:'#f8f8f6', accent:'#222', title:'#111', spine:'#1a1a1a', spineTxt:'rgba(255,255,255,0.7)' },

    { band:'linear-gradient(135deg,#7a1a3a,#5a1228)', bandTxt:'rgba(255,200,220,0.85)', bg:'linear-gradient(170deg,#fdf0f4,#f5e4ec)', accent:'#8a2040', title:'#2d0818', spine:'linear-gradient(to right,#4a0820,#8a2040)', spineTxt:'rgba(255,200,220,0.85)' },

    { band:'linear-gradient(135deg,#1a1030,#2e1a50)', bandTxt:'rgba(200,170,255,0.85)', bg:'linear-gradient(170deg,#f4f0fc,#ece4f8)', accent:'#5a30a0', title:'#1a0830', spine:'linear-gradient(to right,#0e0820,#1a1030)', spineTxt:'rgba(200,170,255,0.85)' },

  ];
  const F4_COVER_TYPOS = [
    { font:"'Noto Serif KR',serif",     size:'1.6rem',  weight:'900', extra:'' },
    { font:"'Noto Sans KR',sans-serif", size:'1.55rem', weight:'900', extra:'' },
    { font:"'Noto Sans KR',sans-serif", size:'1.45rem', weight:'100', extra:'letter-spacing:0.08em' },
    { font:"'Cormorant Garamond',serif",size:'1.75rem', weight:'300', extra:'font-style:italic;letter-spacing:0.05em' },
    { font:"'Playfair Display',serif",  size:'1.5rem',  weight:'700', extra:'' },
  ];
  const F4_COVER_LAYOUTS = ['band_body', 'full_center', 'minimal'];
  function f4StrHash(s){ let h=0; for(let c of String(s)) h=(h*31+c.charCodeAt(0))&0xfffff; return h; }

  let f4CurrentPage = 0, f4TotalPages = 0, f4IsAnimating = false, f4CurrentBook = null, f4ModalInited = false;
  const f4PageAudio = new Audio('page_turn.mp3'); f4PageAudio.volume = 0.7;
  function f4PlaySound(){ try{ f4PageAudio.currentTime = 0; f4PageAudio.play().catch(()=>{}); }catch(e){} }

  // *별표* 강조 → 또렷한 볼드 산세리프 (뮤세움과 동일 규약)
  function f4RenderMarkdown(text){
    if(!text) return '';
    return String(text)
      .replace(/\*\*([^*\n]+?)\*\*/g, '<strong style="font-family:\'Noto Sans KR\',\'맑은 고딕\',sans-serif;font-weight:700;color:#2a1f08">$1</strong>')
      .replace(/\*([^*\n]+?)\*/g, '<strong style="font-family:\'Noto Sans KR\',\'맑은 고딕\',sans-serif;font-weight:600;color:#3a2a10">$1</strong>');
  }

  // ── 3D 표지 빌드 ──────────────────────────────
  function f4BuildCover(book){
    const h    = f4StrHash(book.answer);
    const pal  = F4_COVER_PALETTES[h % F4_COVER_PALETTES.length];
    const typo = F4_COVER_TYPOS[(h >> 4) % F4_COVER_TYPOS.length];
    const lay  = F4_COVER_LAYOUTS[(h >> 8) % F4_COVER_LAYOUTS.length];
    const { band, bandTxt, bg, accent, title: tc, spine, spineTxt } = pal;

    document.getElementById('f4coverSpine').style.background = spine;
    document.getElementById('f4coverSpineText').style.color = spineTxt;
    document.getElementById('f4coverSpineText').textContent = book.answer;

    const catLabel = book.category || '';
    const keyword  = book.keyword  || '';
    let html = '';

    if (lay === 'band_body' && band !== 'none') {
      const bandH = 64 + (h % 26);
      html = `
        <div style="display:flex;flex-direction:column;height:100%;background:${bg}">
          <div style="width:100%;height:${bandH}px;background:${band};position:relative;flex-shrink:0;overflow:hidden">
            <div style="position:absolute;bottom:8px;left:14px;right:14px;height:1px;background:linear-gradient(to right,transparent,${bandTxt.replace('0.85','0.45').replace('0.9','0.45')},transparent)"></div>
            <div style="position:absolute;bottom:16px;left:14px;font-family:'Cormorant Garamond',serif;font-size:0.56rem;letter-spacing:0.16em;color:${bandTxt};font-style:italic">${catLabel}</div>
          </div>

            <div>
              <div style="font-size:0.44rem;letter-spacing:0.25em;color:${accent};font-weight:700;text-transform:uppercase;margin-bottom:6px">EG</div>
              <div style="font-family:${font};font-size:${size};font-weight:${weight};color:${tc};line-height:1.15;${extra}">${book.answer}</div>
              <div style="width:24px;height:1.5px;background:${accent};margin:8px 0;opacity:0.4"></div>
              <div style="font-family:'Cormorant Garamond',serif;font-size:0.55rem;color:${tc};font-style:italic;line-height:1.55;opacity:0.6">${keyword ? '"'+keyword+'"' : ''}</div>
            </div>
            <div style="border-top:1px solid ${accent}22;padding-top:8px;display:flex;justify-content:space-between;align-items:flex-end">
              <div style="font-family:'Cormorant Garamond',serif;font-size:0.44rem;color:${accent};font-style:italic;opacity:0.6">지성소</div>
            </div>
          </div>
        </div>`;
    } else if (lay === 'full_center') {
      html = `
        <div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 14px;text-align:center;background:${bg};position:relative">
          <div style="font-size:0.42rem;letter-spacing:0.3em;color:${accent};font-weight:700;text-transform:uppercase;margin-bottom:6px">EG</div>
          <div style="font-size:1rem;color:${accent};letter-spacing:0.5em;margin:3px 0;opacity:0.2">— ✦ —</div>
          <div style="font-family:${font};font-size:${size};font-weight:${weight};color:${tc};line-height:1.15;${extra};margin:6px 0">${book.answer}</div>
          <div style="font-family:'Cormorant Garamond',serif;font-size:0.58rem;color:${accent};font-style:italic;margin-top:4px;letter-spacing:0.1em;opacity:0.7">${catLabel}</div>
          <div style="width:44px;height:1px;background:linear-gradient(to right,transparent,${accent},transparent);margin:10px auto;opacity:0.45"></div>
          <div style="font-family:'Cormorant Garamond',serif;font-size:0.52rem;color:${tc};font-style:italic;line-height:1.6;opacity:0.55">${keyword ? '"'+keyword+'"' : ''}</div>
          <div style="margin-top:auto;padding-top:10px;border-top:1px solid ${accent}22;width:100%">
            <div style="font-size:0.4rem;color:${accent};letter-spacing:0.2em;opacity:0.45">지성소</div>
          </div>
        </div>`;
    } else {
      html = `
        <div style="width:100%;height:100%;display:flex;flex-direction:column;padding:20px 14px 12px;background:${bg};position:relative">
          <div style="font-size:0.42rem;letter-spacing:0.3em;color:${accent};opacity:0.55;text-transform:uppercase">EG</div>
          <div style="font-family:'Playfair Display',serif;font-size:2.8rem;font-weight:900;color:${accent};opacity:0.06;line-height:1;position:absolute;right:8px;top:8px">EG</div>
          <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
            <div style="font-family:${font};font-size:${size};font-weight:${weight};color:${tc};line-height:1.1;${extra}">${book.answer}</div>
            <div style="font-size:0.5rem;color:${accent};letter-spacing:0.12em;margin-top:5px;opacity:0.65">${catLabel}</div>
            <div style="width:100%;height:2px;background:${accent};margin:10px 0;opacity:0.45"></div>

    document.getElementById('f4coverInner').innerHTML = html;
    document.getElementById('f4coverFaceFront').style.background = bg;
