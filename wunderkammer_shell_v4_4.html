      for (const r of prizeRents) {
        const weeks = r.due_at
          ? Math.round((new Date(r.due_at) - new Date(r.starts_at)) / (7 * 86400000))
          : null;
        list.push({ name: metaMap[r.item_id] || r.item_id, type: 'rent', weeks });
      }
    } catch (e) { /* 조용히 */ }
  }
  return list;
}

// 한글 받침 판별 → 조사 자동 선택
function hasJongseong(word) {
  if (!word) return false;
  const last = word.charCodeAt(word.length - 1);
  if (last < 0xAC00 || last > 0xD7A3) return false; // 한글 음절 아님
  return (last - 0xAC00) % 28 !== 0;
}
function josa(word, withJong, withoutJong) {
  return hasJongseong(word) ? withJong : withoutJong;
}

// 개별화 메시지 생성
function buildArrivalMsg(arrivals, nickname) {
  const lines = [];
  for (const a of arrivals) {
    const iga = josa(a.name, '이', '가');   // 수련이 / 무도회가
    if (a.type === 'perm') {
      lines.push(`〈${a.name}〉${iga} ${nickname || ''}님의 분더카머에 영원히 자리합니다.\n이 작품은 오직 한 분의 것 — 유일본으로, 이 갤러리에 영구 소장됩니다.`);
    } else {
      const wk = a.weeks ? `${a.weeks}주` : '한 철';
      lines.push(`〈${a.name}〉${iga} ${nickname || ''}님의 분더카머에 도착했습니다.\n이 작품은 ${wk} 대여로 운영되며, 기간이 마치면 헤리티지에 자동으로 반납됩니다.\n그 동안 즐거운 감상 되세요.`);
    }
  }
  return lines.join('\n\n');
}

// 축포 confetti
function launchConfetti() {
  const canvas = document.getElementById('arrival-confetti');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const COLORS = ['#c8a240','#f0e4b8','#e8c87a','#ffffff','#b8860b','#ffd700'];
  const particles = Array.from({ length: 120 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    r: Math.random() * 5 + 2,
    d: Math.random() * 3 + 1,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    tilt: Math.random() * 10 - 5,
    tiltAngle: 0, tiltSpeed: Math.random() * 0.1 + 0.05
  }));
  let frame;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      ctx.beginPath();
      ctx.lineWidth = p.r;
      ctx.strokeStyle = p.color;
      ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
      ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
      ctx.stroke();
      p.y += p.d; p.tiltAngle += p.tiltSpeed; p.tilt = Math.sin(p.tiltAngle) * 12;
      if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
    }
    frame = requestAnimationFrame(draw);
  }
  draw();
  // 4초 후 confetti 멈춤
  setTimeout(() => { cancelAnimationFrame(frame); ctx.clearRect(0, 0, canvas.width, canvas.height); }, 4000);
}

// 타이핑 효과
// 타이핑 효과음 — game_core.js SND.type()과 동일한 Web Audio API 방식
const _typingAudioCtx = { ctx: null };
function _typeSound() {
  try {
    if (!_typingAudioCtx.ctx)
      _typingAudioCtx.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const c = _typingAudioCtx.ctx;
    const t = c.currentTime;
    const bufLen = Math.floor(c.sampleRate * 0.04);
    const buf = c.createBuffer(1, bufLen, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++)
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufLen, 2.2);
    const src = c.createBufferSource();
    const gain = c.createGain();
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(420 + Math.random() * 120, t);
    filter.Q.value = 2.0;
    src.buffer = buf;
    gain.gain.setValueAtTime(0.06 + Math.random() * 0.02, t);
    src.connect(filter); filter.connect(gain); gain.connect(c.destination);
    src.start(t);
  } catch (e) { /* 소리 실패는 조용히 — 타이핑 표시는 계속 */ }
}

function typeWriter(el, text, speed, onDone) {
  let i = 0;
  let soundTick = 0;
  const cursor = el.querySelector('.ac-cursor');
  function tick() {
    if (i < text.length) {
      const ch = text[i++];
      el.insertBefore(document.createTextNode(ch), cursor);
      // 공백·줄바꿈 제외, 실제 글자 4개마다 한 번만 소리 (속도는 그대로, 소리만 1/4)
      if (ch !== ' ' && ch !== '\n') {
        if (soundTick % 4 === 0) _typeSound();
        soundTick++;
      }
      setTimeout(tick, ch === '\n' ? speed * 4 : speed);
    } else if (onDone) onDone();
  }
  tick();
}

// 팝업 표시
function showArrivalPopup(arrivals, firstTs, lsKey) {
  // 이미 있으면 제거
  document.getElementById('arrival-overlay')?.remove();
  document.getElementById('arrival-confetti')?.remove();

  const nickname = getUser()?.user_metadata?.nickname || getUser()?.email?.split('@')[0] || '';
  const msg = buildArrivalMsg(arrivals, nickname);

  // confetti 캔버스
  const canvas = document.createElement('canvas');
  canvas.id = 'arrival-confetti';
  document.body.appendChild(canvas);

  // 오버레이
  const overlay = document.createElement('div');
  overlay.id = 'arrival-overlay';
  overlay.innerHTML = `
    <div id="arrival-card">
      <div class="ac-msg"><span class="ac-cursor"></span></div>
      <div class="ac-timer" id="ac-timer"></div>
      <button class="ac-close" onclick="closeArrivalPopup()">확인했습니다</button>
    </div>`;
  document.body.appendChild(overlay);

  requestAnimationFrame(() => overlay.classList.add('show'));
  launchConfetti();

  // 타이핑
  const msgEl = overlay.querySelector('.ac-msg');
  typeWriter(msgEl, msg, 28, null);

  // 남은 시간 카운트다운
  const timerEl = overlay.querySelector('#ac-timer');
  function updateTimer() {
    const remain = Math.max(0, firstTs + 60 * 60 * 1000 - Date.now());
    if (remain === 0) { closeArrivalPopup(); return; }
    const m = Math.floor(remain / 60000);
    const s = Math.floor((remain % 60000) / 1000);
    timerEl.textContent = `이 안내는 ${m}분 ${s}초 후 사라집니다`;
  }
  updateTimer();
  const timerInterval = setInterval(updateTimer, 1000);
  overlay._timerInterval = timerInterval;

  // 1시간 후 자동 닫힘
  const autoClose = setTimeout(() => closeArrivalPopup(), firstTs + 60 * 60 * 1000 - Date.now());
  overlay._autoClose = autoClose;
}

function closeArrivalPopup() {
  const ov = document.getElementById('arrival-overlay');
  if (ov) {
    clearInterval(ov._timerInterval);
    clearTimeout(ov._autoClose);
    ov.classList.remove('show');
    setTimeout(() => ov.remove(), 600);
  }
  document.getElementById('arrival-confetti')?.remove();
}

/* ===== 레이어 1: 한 층 그리기 ===== */
function renderFloor(n) {
  const f = floorData(n);
  applyPalette(f);

  /* 층 본업 콘텐츠 — 0728 재배치: 옛 3·4·5층이 2·3·4층으로 한 칸씩 내려왔다.
     모듈 이름(Floor3·Floor4·Floor5)은 옛 번호 그대로다. 이름을 바꾸면
     모듈 내부 수백 곳을 함께 고쳐야 하는데 얻는 것이 없다. */
  const body = (n === 4) ? Floor5.markup()      // 액자방  (옛 5층)

  floorLayer.innerHTML = `
    <div class="floor">
      ${body}
      <div class="room-elevator" id="roomLift">
        <div class="lift-brand">WUNDER<br>KAMMER</div>
        <div class="lift-rows">
          ${[...FLOORS].reverse().map(x=>
          `<div class="lift-row${x.n===n?' now':''}">
             <button class="lift" data-f="${x.n}" data-go="lift" aria-label="${x.roman}층 ${x.kr} — 엘리베이터로">${x.roman}</button>
             <button class="lift-jump" data-f="${x.n}" data-go="jump"
                     title="곧장 건너뛰기" aria-label="${x.kr} 로 곧장 건너뛰기">&#9650;</button>
             <div class="lift-tip"><span class="lt-no">${x.roman}F</span>
               <span class="lt-kr">${x.kr}</span>
               <span class="lt-desc">${x.desc || ''}</span></div>
           </div>`).join('')}
        </div>
        <div class="lift-sep"></div>
        <div class="lift-lamp" id="liftLamp" title="운행등"></div>
      </div>
    </div>`;

  floorLabel.innerHTML = `
    <div class="fl-name">${f.fr.toUpperCase()}</div>
    <div class="fl-floor">ÉTAGE ${f.roman} · ${f.kr}</div>
    `;   /* 0812 — 옛 12방 카테고리 이름표(fl-cat) 걷음. 3층이 한 줄기가 됐다 */
  floorLabel.style.display = '';

  /* 네 층 바로가기 — 4층에서 1층으로 한 번에 간다 */
  const lift = document.getElementById('roomLift');
  if (lift) lift.addEventListener('click', e=>{
    /* ⚠ 0816 소로 — 문이 둘이 됐다. 엘리베이터(문·띵동·4초)와 직행(페이드 0.3초).
         ⚠ .lift-jump 를 먼저 본다 — .lift 로 먼저 찾으면 직행 단추가 안 걸린다. */
    const j = e.target.closest('.lift-jump');
    if (j){ const to = +j.dataset.f; if (to !== n) jumpToFloor(to); return; }
    const b = e.target.closest('.lift'); if (!b) return;
    const to = +b.dataset.f;
    if (to !== n) goToFloor(to);
  });
  applyLiftPos();
  syncLiftLamp();

  if (n === 4) Floor5.mount();   // 액자방
  if (n === 3) Floor4.mount();   // 치타델레
  if (n === 2) Floor3.mount();   // 서고
  if (n === 1) Salon.mount();    // 거실
  /* ⚠⚠ 0818 — 여기서 시간으로 껐다가 틀렸다. 층의 카메라는 rAF 두 겹 뒤가 아니라
       **배경 그림을 다 받은 뒤**(await setBg)에 돈다. 수십 밀리초가 아니라 수백이다.
     ⭐ 그래서 끄는 일은 시계가 아니라 **쓰는 쪽**이 한다 — 각 층 카메라가 읽으면서 끈다.
       한 번에 한 층만 서므로 서로 먹을 일이 없다. */

  renderAnchorList();
}

/* 0809 — 엘리베이터·도크 자리. 네 층 모두에 걸리므로 셸 전역에 둔다.
   값은 eg_settings.living_layout 한 줄에서 온다(거실 편집기가 끌어 정한다). */
const EG_POS = { liftR:2.4, liftT:62, dockR:3, dockT:92.6 };   /* 0818 소로 — 조작반은 눈높이 약간 아래 */
function applyLiftPos(){
  const r = document.documentElement.style;
  r.setProperty('--lift-r', EG_POS.liftR + '%');
  r.setProperty('--lift-t', EG_POS.liftT + '%');
  r.setProperty('--dock-r', EG_POS.dockR + '%');
  r.setProperty('--dock-t', EG_POS.dockT + '%');
  placeBookDockSoon();          /* ⭐ 엘리베이터가 움직이면 도크도 따라간다 */
}

/* ⭐ 0819 — 책장 도크를 엘리베이터 판 바로 위에 얹는다 (소로 0819 캡처).
   ⚠ 엘리베이터 곳은 소로가 끌어 정하는 값이라 도크에 상수를 박으면 언젠가 또 겹친다.
     그래서 실측해서 따라 붙인다 — 어디로 옮기셔도 한 기둥으로 함께 선다.
   ⭐ bottom 으로 앉히므로 메뉴가 위로 자란다. 단추가 늘어도 엘리베이터를 안 침범한다. */
function placeBookDock(){
  var dock = document.getElementById('bk-dock');
  var lift = document.getElementById('roomLift');
  if (!dock || !lift || dock.hidden) return;
  var host = dock.offsetParent; if (!host) return;
  var hr = host.getBoundingClientRect(), lr = lift.getBoundingClientRect();
  if (!lr.width || !hr.width) return;

  var GAP = 8;
  dock.style.width = lr.width + 'px';
  dock.style.right = (hr.right - lr.right) + 'px';
  dock.style.top   = 'auto';

  /* 다 펼쳤을 때 필요한 세로 — 손잡이 + 보이는 단추들 */
  var n = dock.querySelectorAll('.bk-dock-b:not([hidden])').length;
  var need = 18 + 34 + n * 41;
  var room = (lr.top - GAP) - hr.top;
  /* ⚠ 그물 — 엘리베이터가 화면 위쪽에 있으면 판 위에 설 곳이 없다. 그때는 천장에 붙인다 */
  var bottom = (room >= need) ? (hr.bottom - (lr.top - GAP))
                              : (hr.height - need - 12);
  dock.style.bottom = Math.max(bottom, 8) + 'px';
}
var _dockTick = null, _dockTick2 = null;
function placeBookDockSoon(){
  /* ⚠ 층을 갈아탈 때는 판이 아직 움직이는 중이다. 두 번 잰다 —
     한 번만 재면 옮겨 앉는 중인 엘리베이터를 재게 된다(0817 flyTo 와 같은 종류) */
  clearTimeout(_dockTick);  _dockTick  = setTimeout(placeBookDock, 60);
  clearTimeout(_dockTick2); _dockTick2 = setTimeout(placeBookDock, 480);
}
window.addEventListener('resize', placeBookDockSoon);

/* 운행등 — 문이 움직이는 동안만 주황. 층을 다시 그릴 때도 상태를 이어 받는다(0818) */
function syncLiftLamp(){
  const el = document.getElementById('roomLift');
  if (el) el.classList.toggle('moving', transitioning);
}

function renderAnchorList() {
  anchorPanel.querySelectorAll('.floor-item').forEach(el => el.remove());
  [...FLOORS].reverse().forEach(f => {
    const item = document.createElement('div');
    item.className = 'floor-item' + (f.n === currentFloor ? ' current' : '');
    item.innerHTML = `
      <div class="fi-num">${f.roman}</div>
      <div class="fi-body">
        <div class="fi-name">${f.fr}</div>
        <div class="fi-kr">${f.kr}</div>
        <div class="fi-desc">${f.desc || ''}</div>
      </div>
      <div class="fi-go">
        <button class="fi-lift" title="엘리베이터로 — 문이 닫히고 열립니다">⇡</button>
        <button class="fi-jump" title="곧장 건너뛰기 — 화면이 어두워졌다 밝아집니다">⇢</button>
      </div>`;
    /* ⚠ 0816 — 줄 전체를 누르던 것을 문 둘로 갈랐다(소로).
         ⇡ 엘리베이터(문·띵동·4초) · ⇢ 직행(페이드 0.3초).
       ⚠ 단추에서 전파를 끊는다 — 안 그러면 줄 청취기가 함께 듣고 두 번 움직인다. */
    const go = (fn)=> (e)=>{ e.stopPropagation(); closeAnchor(); fn(f.n); };
    item.querySelector('.fi-lift').addEventListener('click', go(goToFloor));
    item.querySelector('.fi-jump').addEventListener('click', go(jumpToFloor));
    item.querySelector('.fi-num').addEventListener('click', go(goToFloor));   /* 원판은 엘리베이터 */
    anchorPanel.appendChild(item);
  });
}

/* ===== 효과음 ===== */
function playSfx() {
  if (muted || !sfx) return;
  try { sfx.currentTime = 0; sfx.play().catch(()=>{}); } catch(e){}
}

/* ============================================================
 *  층 이동 — 4초 효과음 싱크
 *   0    : bar 내려오며 자리잡음 + 문 닫히기 시작 + 소리 재생
 *   1.1s : (철커덩) 문 닫힘 완료
 *   1.4s : (띵동) 출발층 불 꺼지고 목표층 불 딸깍 점등 + 층 교체
 *   2.5s : (스르륵) 문 열리기 시작
 *   3.5s : 문 활짝 → bar 스르륵 올라가 사라짐
 * ============================================================ */
/* ⭐ 0816 소로 — 직행. 엘리베이터는 문·띵동·4초를 다 치르지만 이건 0.3초다.
     ⚠ 층을 바꾸며 해야 할 일은 goToFloor 와 **똑같다** — 주소 갈아 끼우기,
       지구에 알리기, 램프, 문틀. 한 곳에 모아 두 길이 같은 것을 부르게 한다.
     ⚠ transitioning 을 같이 쓴다. 안 그러면 엘리베이터가 오는 중에 직행이 끼어들어
       두 층이 겹쳐 그려진다. */
function landOnFloor(target){
  currentFloor = target;
  try{
    const _u = new URL(location.href);
    _u.searchParams.set('floor', String(target));
    history.replaceState(null, '', _u);
    if (window.top !== window && window.top.egNoteDoorHref)
      window.top.egNoteDoorHref(location.href);
  }catch(e){}
  renderFloor(target);
  syncDoorTop();
  litLamp(target);
}

function jumpToFloor(target){
  if (transitioning) return;
  if (target < 1 || target > TOP_FLOOR || target === currentFloor) return;
  egSkipCamera = true;
  /* ⚠⚠ 안전 시계 — 배경 그림이 안 떠서 층이 카메라를 아예 안 부르면 이 열쇠가 남고,
       그다음 정상 입장에서 연출이 조용히 죽는다. 3초 뒤에는 무조건 되돌린다
       (0817 vesper 의 swapping 과 같은 자리다 — 안 풀리는 깃발은 병이 된다). */
  setTimeout(function(){ egSkipCamera = false; }, 3000);
  transitioning = true; syncLiftLamp();
  if (bootHint) bootHint.style.opacity = '0';
  const veil = document.getElementById('wkJump');
  if (veil) veil.classList.add('on');
  setTimeout(()=>{
    landOnFloor(target);
    if (veil) veil.classList.remove('on');
    setTimeout(()=>{ transitioning = false; syncLiftLamp(); }, 300);
  }, 320);
}

function goToFloor(target) {
  if (transitioning) return;
  if (target < 1 || target > TOP_FLOOR || target === currentFloor) return;
  egSkipCamera = false;        /* ⚠ 엘리베이터는 언제나 들어서는 연출이 산다 (0818) */
  transitioning = true; syncLiftLamp();
  if (bootHint) bootHint.style.opacity = '0';

  const from = currentFloor;

  // bar 자리잡기 + 출발층 불 + 문 닫힘 시작 + 소리
  syncDoorTop();
  litLamp(from);
  elevator.classList.add('active', 'riding', 'closing');
  playSfx();

  // 1.4s 띵동 — 목표층 불 딸깍 + 층 콘텐츠 교체 (문 닫힌 뒤라 안 보임)
  setTimeout(() => {
    /* ⭐ 0816 — 층에 내려서면서 할 일은 직행과 똑같다. landOnFloor 한 곳에 모았다.
         주소 갈아 끼우기(뒤로가기용) · 지구의 걸음 세기 갱신(‹ 용) · 그리기 · 램프 · 문틀. */
    landOnFloor(target);
  }, SFX.ding);

  // 2.5s 스르륵 — 문 열림 시작
  setTimeout(() => {
    elevator.classList.remove('closing');
  }, SFX.open);

  // 3.5s 문 활짝 — bar 사라지고 정리
  setTimeout(() => {
    elevator.classList.remove('riding'); // bar 위로 사라짐
    setTimeout(() => {
      elevator.classList.remove('active');
      transitioning = false; syncLiftLamp();
    }, 500);
  }, SFX.end);
}

document.addEventListener('keydown', (e) => {
  /* ⭐⭐ 0818 — 책을 펼친 동안에는 이 손잡이가 **책장**의 것이다.
       안 막으면 읽다가 ←→ 한 번에 서가가 통째로 넘어가고 ESC 로 층이 흔들린다.
       뮤세움이 같은 자리에 같은 그물을 두고 있다(bibliotheca 0807). */
  { const ov = document.getElementById('f4bookModalOverlay');
    if (ov && ov.classList.contains('open')){
      if (e.key === 'Escape'){ if (window.f4CloseBook) f4CloseBook(); return; }
      if (e.key === 'ArrowLeft'  && window.f4TurnPage){ f4TurnPage(-1); return; }
      if (e.key === 'ArrowRight' && window.f4TurnPage){ f4TurnPage(1);  return; }
      return;
    } }
  // 메시지 보드 모달(글귀 쓰기·헌화)이 열려 있으면: ESC 닫기 · 회전·층이동 전부 차단 (입력 중 ←→가 벽을 돌리는 문제)
  { const mwM = document.getElementById('mw-modal'); if (mwM) { if (e.key === 'Escape') mwM.remove(); return; } }
  // 책방 모달이 열려 있으면 엘리베이터 조작 막음 (모달 자체가 ESC 처리)
  if (document.getElementById('book-modal').classList.contains('open')) return;
  // 진열대가 있는 층에서 ←→ 는 넘김에 양보, ↑↓만 엘리베이터
  if (e.key === 'ArrowUp')   { e.preventDefault(); goToFloor(currentFloor + 1); }
  if (e.key === 'ArrowDown') { e.preventDefault(); goToFloor(currentFloor - 1); }
  /* ⚠⚠ 0818 — 여기가 어긋나 있었다. 층 번호는 셸(1거실·2책의 방·3지성소·4얼굴들)인데
       모듈 이름은 옛 번호(Floor3=책의 방 · Floor4=지성소)라, 3층에서 누른 화살표가
       **2층 진열대**를 넘기고 있었다. 지성소에서는 아무 일도 안 일어났다.

  if (currentFloor === 2 && !transitioning) {          /* 책의 방 — 표지 진열대 */
    if (e.key === 'ArrowLeft')  Floor3.slide(-1);
    if (e.key === 'ArrowRight') Floor3.slide(+1);
  }
  if (currentFloor === 3 && !transitioning) {          /* 지성소 — ▶ 가 다음 쪽(더 과거) */
    if (e.key === 'ArrowLeft')  Floor4.slide(+1);
    if (e.key === 'ArrowRight') Floor4.slide(-1);
  }
  // 1층(갤러리)에서 ←→ 는 방 회전에 양보
  if (currentFloor === 1 && !transitioning) {
  }
});

/* ============================================================

/* ══════════════════════════════════════════════════════════════════════════
 *  ⅠF Le Séjour 모듈 (Salon) — 거실 · 0728 신축 (세 건물 재편 7호)
 *    markup() : 스크롤 무대 + 확대판 + 설명 시트
 *    mount()  : 고른 방 · 시각에 맞는 배경 · 걸린 그림 한 점
 *
 *  · 배경 넉 장 = wk-assets/living/living_NN_{m|d|e|n}.webp (941×1672)
 *  · 그림 좌표 = living_rooms 행 (살롱지기가 admin에서 끌어 맞춘 값)
 *  · 확대·설명 CSS(g1-*)는 옛 갤러리 것을 물려받되, 함수는 여기서 자립한다
 *    (봉인본의 openArtZoom·openArtNote는 Floor1 내부 변수 root·MW_isOwner에
 *     묶여 있어 그대로 못 꺼냈다)
 * ══════════════════════════════════════════════════════════════════════════ */
const Salon = (() => {
  let ROOM = null, ART = null, MW = null, OWNER = null, MINE = false, SEED = 0;
  let QUOTE_DARK = false, TICK_DARK = false, PLAQUE_DARK = false, MEASURED = false;   /* 잉크 — 재기 전엔 안 그린다 */
  const EDIT = new URLSearchParams(location.search).has('edit');

  /* ⭐ 배치 — 전부 **벽 구역에 대한 비율**이다. 방마다 값이 아니라 우주 하나의 값이라
     일곱 방에 그대로 통한다. 저장은 eg_settings.living_layout 한 줄(0809). */
  const K_DEFAULT = {
    quoteTop : 8,     /* 글귀 위    = wall_top + %p */
    quoteH   : 16,    /* 글귀 높이   %p */
    artK     : 0.36,  /* 그림 높이  = 벽 구역 × K */
    artDrop  : 3,     /* 그림 가운데 = 벽 가운데 + %p */
    artX     : 50,    /* 그림 가로 % — 벽이 좌우 대칭이라 50이 기본 */
    tickH    : 4,     /* 꽃 티커 높이 %p · 바닥선이 wall_bot  ⭐ 0816 소로가 고른 값 */
    tickDrop : 0,     /* 꽃 티커 들어올림 %p — 0이면 콘솔 상판에 바로 앉는다 */
    liftR    : 3,     /* 엘리베이터 오른쪽에서 % · 위에서 % (네 층 공통) */
    liftT    : 50,
    dockR    : 3,     /* ⋮ 도크 자리 */
    dockT    : 66,
    tickFont : 0.30,  /* 티커 글자 = 티커 높이 × K  ⭐ 0816 소로가 손잡이로 고른 값
                         ⚠ tickH 와 곱해진다 — 높이를 만지면 글자도 함께 작아진다
                         ⚠ 비율이라 방 크기가 달라도 같은 얼굴로 선다. px으로 박으면
                           폰에서는 거인, 큰 화면에서는 개미가 된다. */
    tickSpeed: 100,   /* 티커 흐르는 속도 px/초  ⭐ 0816 소로가 고른 값 (옛 값 34는 답답했다)
                         ⚠ 시간이 아니라 속도를 못 박는다 — 흔적이 늘어도 읽는 속도가 같다 */
    tickW    : 44     /* 꽃 티커 폭 % — 상판 좌우 끝에 물건이 서 있다(0809 실측).
                         일곱 방에서 물건이 가장 안쪽까지 온 곳이 26%·74%이므로
                         28~72%가 공통으로 비어 있다. 폭 44%가 그 안에 딱 든다. */
  };
  const K = Object.assign({}, K_DEFAULT);
  let K_SAVED = Object.assign({}, K_DEFAULT);
  let ROOMS_ALL = [], REAL_NO = 1;      /* 미리보기로 옮겨 다녀도 돌아올 곳을 기억한다 */

  /* 자리 넷은 네 층 모두에 걸리므로 셸 전역(EG_POS)으로 밀어 넣는다 */
  function pushPos(){
    ['liftR','liftT','dockR','dockT'].forEach(k=> EG_POS[k] = K[k]);
    applyLiftPos();
  }

  async function loadLayout(){
    try{
      const r = await sbFetch('/rest/v1/eg_settings?key=eq.living_layout&select=val');
      const v = r?.[0]?.val;
      if (v && typeof v === 'object'){
        Object.keys(K_DEFAULT).forEach(k=>{ if (typeof v[k] === 'number') K[k] = v[k]; });
        K_SAVED = Object.assign({}, K);
      }
    }catch(e){ console.warn('[거실] 배치 값 조회 실패 — 기본값으로 갑니다', e); }
    pushPos();      /* 읽었든 못 읽었든 자리는 밀어 넣는다 — 기본값도 값이다 */
  }

  function slot(){ return egSky.phase(); }

  /* ⚠ 버전 표시(?v=)가 필수다. Storage 기본 캐시가 max-age=3600이라
     안 붙이면 새 그림을 올려도 한 시간 동안 옛 그림이 나온다.
     living_rooms.updated_at(배경이 실제로 바뀐 시각)을 쓴다. */
  function bgUrl(no, t){
    const v = ROOM && ROOM.updated_at ? '?v=' + Date.parse(ROOM.updated_at) : '';
    return SUPABASE_URL + '/storage/v1/object/public/wk-assets/living/living_'
         + String(no).padStart(2,'0') + '_' + t + '.webp' + v;
  }
  function flowerUrl(t){
    return SUPABASE_URL + '/storage/v1/object/public/flowers/' + encodeURIComponent(t) + '.webp';
  }
  function esc2(x){ return String(x==null?'':x)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function toast(m){
    let t = document.getElementById('sl-toast');
    if(!t){ t=document.createElement('div'); t.id='sl-toast'; document.body.appendChild(t); }
    t.textContent = m; t.classList.add('on');
    clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('on'), 3800);
  }

  /* 이 집 주인 — ?user=닉이면 그 사람, 없으면 나 */
  async function ownerId(){
    const q = new URLSearchParams(location.search).get('user');
    if (q){
      try{
        const u = await sbFetch(`/rest/v1/users?nickname=eq.${encodeURIComponent(q)}&select=id`);
        if (u && u[0]) return u[0].id;
      }catch(e){ return null; }
    }
    return getUser()?.id || null;
  }

  function markup(){
    return `
      <div class="floor-content" data-floor="1">
        <div class="sl-blur" id="sl-blur"></div>
        <div class="sl-scroll" id="sl-scroll"><div class="sl-stage" id="sl-stage"></div></div>
        <div class="g1-zoom" id="sl-zoom" hidden>
          <div class="g1-zoom-stage" id="sl-zoom-stage">
            <img class="g1-zoom-img" id="sl-zoom-img" alt="" draggable="false">
            <button class="g1-zoom-x" id="sl-zoom-x" aria-label="닫기">×</button>
            <div class="g1-zoom-hud" id="sl-zoom-hud">
              <span id="sl-zoom-lv">100%</span>
              <button id="sl-zoom-fit">맞춤</button>
            </div>
            <div class="g1-zoom-wait" id="sl-zoom-wait"><b>원판</b>을 받는 중입니다</div>
            <div class="g1-zoom-bar"><div class="g1-zoom-cap" id="sl-zoom-cap"></div></div>
          </div>
        </div>
        <div class="g1-note" id="sl-note" hidden>
          <div class="g1-note-sheet">
            <button class="g1-note-x" id="sl-note-x" aria-label="닫기">×</button>
            <div class="g1-note-head" id="sl-note-head"></div>
            <div class="g1-note-body" id="sl-note-body"></div>
          </div>
        </div>
      </div>`;
  }

  async function mount(){
    const stage = document.getElementById('sl-stage');
    if (!stage) return;

    await loadLayout();          /* ⚠ 첫 그림 전에 읽는다 — 나중에 읽으면 한 번 튄다 */
    OWNER = await ownerId();
    MINE  = !!OWNER && OWNER === (getUser()?.id || null);

    /* ⭐ 옛 흔적 창을 미는 눈금 — 거실에 들어올 때마다 하나씩 오른다(0816 소로).
       서버가 이 값만큼 창을 밀어 옛 인사를 하나씩 갈아 끼운다. 무작위가 아니라
       순번이라, 밀려나 있던 인사가 반드시 한 번씩 돌아온다.
       ⚠ 방에 들어올 때만 올린다. refreshBoard(꽃을 두고 난 뒤)가 또 올리면
         인사 하나 남겼는데 벽이 통째로 갈린다. */
    try{
      SEED = (parseInt(localStorage.getItem('eg-wk-seed') || '0', 10) || 0) + 1;
      localStorage.setItem('eg-wk-seed', String(SEED));
    }catch(e){ SEED = 0; }

    let no = 1;
    if (OWNER){
      try{
        const w = await sbFetch(`/rest/v1/wunderkammer?user_id=eq.${OWNER}&select=living_no`);
        if (w?.[0]?.living_no) no = w[0].living_no;
      }catch(e){ console.warn('[거실] 방 번호 조회 실패 — 1번으로', e); }
    }

    try{
      const r = await sbFetch(`/rest/v1/living_rooms?no=eq.${no}&select=*`);
      ROOM = r?.[0] || null;
    }catch(e){ console.warn('[거실] 방 조회 실패', e); }
    /* ⚠ 아직 안 잰 방은 뼈대 표준값으로 선다(0809). 폴백이 먼저 서는 것이 아니라
       재는 순간 그 방만 제 값을 갖는 구조다. */
    if (!ROOM) ROOM = { no, wall_top:5, wall_bot:70 };
    if (ROOM.wall_top == null) ROOM.wall_top = 5;
    if (ROOM.wall_bot == null) ROOM.wall_bot = 70;
    REAL_NO = no;

    paintBg(stage, no, slot());
    fitType(stage);

    /* 메시지 보드 — 글귀 한 장 + 방문객 흔적 */
    try{
      MW = await sbFetch('/rest/v1/rpc/get_message_board',
        { method:'POST', body: JSON.stringify({ p_room_owner: OWNER, p_seed: SEED }) });
    }catch(e){ console.warn('[거실] 메시지 보드 조회 실패', e); MW = null; }

    await loadArt(stage, OWNER);
    renderBoard(stage);

    /* ⚠ 확대는 closeZoom이 도맡는다 — 오는 중인 판을 버리고 배율까지 되돌린다.
         옛 hide('sl-zoom')만 부르면 다음에 열 때 지난 배율이 남는다.
         바깥 누르기는 새 엔진(pointerup 자국 판정)이 맡으므로 여기서 걸지 않는다. */
    document.getElementById('sl-zoom-x').onclick = closeZoom;
    armZoom();
    document.getElementById('sl-note-x').onclick = ()=> hide('sl-note');
    {
      const el = document.getElementById('sl-note');

    /* 0809 — 손잡이는 방 안 단추로 연다. 살롱지기에게만 보인다:
       그림 배율·글귀판 높이는 방마다가 아니라 우주 하나의 값이라 손님이 만지면 안 된다.

    await buildDock(stage);

    /* 0804 — 들어서는 3초. 거실은 아래에서 위로 훑는다.
       미술관·음악관은 천장에서 내려오지만, 여기는 내 집 거실이라

    const sc = document.getElementById('sl-scroll');
    if (sc){
      sc.scrollTop = 0;
      if (window.EGCamera){
        /* ▲ 직행이면 훑지 않고 그림 앞에 곧장 선다 (0818 소로) */
        const skip = egSkipCamera; egSkipCamera = false;
        requestAnimationFrame(()=> requestAnimationFrame(()=>

      }
    }
  }
  function hide(id){ const el=document.getElementById(id); if(el) el.hidden = true; }

  /* 글자 크기는 무대 폭을 따라간다 — 폰에서도 노트북에서도 벽에 대한 비율이 같다 */
  function fitType(stage){
    const w = stage.clientWidth || 900;
    stage.style.fontSize = Math.max(9, w * 0.0182) + 'px';
  }

  /* ─────────────────────────────────────────────────────────────
     배치 — wall_top·wall_bot 두 값에서 넉 곳을 계산한다 (0809)
     ───────────────────────────────────────────────────────────── */
  function band(){
    const t = Number(ROOM.wall_top), b = Number(ROOM.wall_bot);
    return { top:t, bot:b, h:b - t, mid:(t + b) / 2 };
  }
  function artBox(){
    const w = band();
    const h = w.h * K.artK;
    const c = w.mid + K.artDrop;
    return { top:c - h/2, h, x:K.artX };
  }
  function quoteBox(){
    const w = band();
    return { top:w.top + K.quoteTop, h:K.quoteH };
  }
  function tickBox(){
    const w = band();
    return { top:w.bot - K.tickH - K.tickDrop, h:K.tickH, w:K.tickW };
  }

  /* 그 시간대가 아직 안 구워졌으면 낮으로 물러선다. 낮마저 없으면 CSS 그라데이션.
     ⭐ 무대 비율은 여기서 그림을 재서 정한다 — 어떤 비율로 구워 와도 안 잘린다. */
  function paintBg(stage, no, t){
    const put = (url, im)=>{
      stage.style.backgroundImage = `url('${url}')`;
      const blur = document.getElementById('sl-blur');
      if (blur) blur.style.backgroundImage = `url('${url}')`;
      if (im && im.naturalWidth && im.naturalHeight){
        stage.style.setProperty('--sl-ar', im.naturalWidth + '/' + im.naturalHeight);
      }
      fitType(stage);
      sampleInk(url, stage);
    };
    const probe = new Image();
    probe.onload  = ()=> put(bgUrl(no,t), probe);
    probe.onerror = ()=>{
      if (t === 'd') return;
      const d = new Image();
      d.onload = ()=> put(bgUrl(no,'d'), d);
      d.src = bgUrl(no,'d');
    };
    probe.src = bgUrl(no, t);
  }

  /* ⭐⭐ 잉크 — 미술관 명패와 같은 부품이다(galerie 0805).
     그 구역 벽을 재서 상아색과 먹색 중 **대비가 큰 쪽**을 고른다.
     벽 밝기가 방마다(95~237) 또 시각마다 갈리므로 관마다 고정값을 박는
     방식은 무너진다 — 프라도 흰 벽도 밤에는 어두워진다.
     ⚠ 재기 전에는 글귀를 안 그린다. 폴백은 대신 서는 것이지 먼저 서는 것이 아니다(0808). */
  const INK_IVORY = 0.82, INK_DARK = 0.02;   /* #f2ead6 · #2a2318 의 상대 휘도 */
  function lum8(r,g,b){
    const f=v=>{ v/=255; return v<=.04045 ? v/12.92 : Math.pow((v+.055)/1.055,2.4); };
    return .2126*f(r) + .7152*f(g) + .0722*f(b);
  }
  function contrast(a,b){ const hi=Math.max(a,b), lo=Math.min(a,b); return (hi+.05)/(lo+.05); }
  function pickDark(L){ return L!=null && contrast(L,INK_DARK) > contrast(L,INK_IVORY); }

  function sampleInk(url, stage){
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = ()=>{
      QUOTE_DARK  = pickDark(readLum(im, quoteBox()));
      TICK_DARK   = pickDark(readLum(im, tickBox()));
      const a = artBox();
      PLAQUE_DARK = pickDark(readLum(im, { top:a.top + a.h + 1.4, h:5 }));   /* 명패가 앉는 곳만 */
      MEASURED = true;
      renderBoard(stage);
      const pl = stage.querySelector('.sl-plaque');
      if (pl) pl.classList.toggle('ink-dark', PLAQUE_DARK);
    };
    /* 교차출처로 막히거나 그림이 없으면 상아색으로 간다 — 어두운 벽이 더 흔하다 */
    im.onerror = ()=>{ QUOTE_DARK = false; TICK_DARK = false; PLAQUE_DARK = false; MEASURED = true; renderBoard(stage); };
    im.src = url;
  }
  function readLum(im, box){
    try{
      const CW = 90;
      const CH = Math.max(1, Math.round(90 * im.naturalHeight / im.naturalWidth));
      const cv = document.createElement('canvas'); cv.width = CW; cv.height = CH;
      const cx = cv.getContext('2d', { willReadFrequently:true });
      cx.drawImage(im, 0, 0, CW, CH);
      const y0 = Math.max(0, Math.round(CH * box.top / 100));
      const y1 = Math.min(CH, Math.round(CH * (box.top + box.h) / 100));
      const x0 = Math.round(CW * 0.22), x1 = Math.round(CW * 0.78);
      if (x1 <= x0 || y1 <= y0) return null;
      const d = cx.getImageData(x0, y0, x1-x0, y1-y0).data;
      let s = 0, n = 0;
      for (let k=0;k<d.length;k+=4){ s += lum8(d[k],d[k+1],d[k+2]); n++; }
      return n ? s/n : null;
    }catch(e){
      /* drawImage는 통과하고 getImageData가 막힌다 — 교차출처면 여기서 처음 걸린다 */
      console.warn('[거실] 벽 읽기 막힘 — 상아색으로 갑니다', e);
      return null;
    }
  }

  async function loadArt(stage, oid){
    stage.querySelectorAll('.sl-art, .sl-empty, .sl-plaque').forEach(el => el.remove());

    let item = null;
    if (oid){
      try{
        const rows = await sbFetch(
          `/rest/v1/heritage_rentals?user_id=eq.${oid}&returned_at=is.null`
          + `&select=item_id,created_at&order=created_at.desc&limit=1`);
        const id = rows?.[0]?.item_id;
        if (id){
          const it = await sbFetch(`/rest/v1/heritage_items?id=eq.${encodeURIComponent(id)}&select=*`);
          item = it?.[0] || null;
        }
      }catch(e){ console.warn('[거실] 그림 조회 실패', e); }
    }
    ART = item;
    const a = artBox(), x = a.x;

    if (!item || !item.img){
      const box = document.createElement('div');
      box.className = 'sl-empty';
      box.style.cssText = `left:${x}%; top:${a.top}%; height:${a.h}%; width:${a.h*0.74}%;`;
      box.innerHTML = '아직<br>아무것도<br>걸려 있지 않습니다<div class="sl-h"></div>';
      stage.appendChild(box);
      if (EDITING) armArt(stage, box);
      return;
    }

    const wrap = document.createElement('div');
    wrap.className = 'sl-art';
    wrap.style.cssText = `left:${x}%; top:${a.top}%; height:${a.h}%;`;
    wrap.innerHTML = `<img src="${item.img}" alt="${esc2(item.name)}"><div class="sl-h"></div>`;
    wrap.onclick = ()=> { if (!EDITING) openZoom(item); };
    stage.appendChild(wrap);
    if (EDITING) armArt(stage, wrap);

    const pl = document.createElement('div');
    pl.className = 'sl-plaque' + (PLAQUE_DARK ? ' ink-dark' : '');
    pl.style.cssText = `left:${x}%; top:${a.top + a.h + 1.4}%;`;
    pl.innerHTML = `<div class="p-name">${esc2(item.name || '무제')}</div>`
                 + `<div class="p-artist">${esc2(item.artist || '')}</div>`
                 + `<div class="p-voice" id="sl-voice"></div>`;
    pl.onclick = (e)=>{ e.stopPropagation(); if (!EDITING) openNote(item); };
    pl.querySelector('.p-voice').onclick = (e)=>{ e.stopPropagation(); toggleArtVoice(); };
    stage.appendChild(pl);
    paintArtVoice(item);
  }

  /* ══════════════════════════════════════════════════════════════
     낭독 — 미술관 명패 부품을 그대로 옮겼다(galerie 0806밤).
     ⭐ 「그림 곁에는 팝업 말고 소리」 — 4겹 시트는 화면을 덮어 그림을 가린다.
     ⚠ 분더카머는 terra 안 액자에서 열리므로 소리는 terra가 든다.
       나가도 안 끊기고, 조종간이 무엇이 흐르는지 말해 준다.
     ⚠ 음성이 있는 그림에만 줄이 뜬다. 없으면 아무 말도 안 한다.
     ══════════════════════════════════════════════════════════════ */
  let ART_VOICE = null, ART_AUDIO = null, VOICE_NOW = null;
  const HAS_PARENT = (()=>{ try{ return window.parent && window.parent !== window; }catch(e){ return false; } })();
  function tellParent(m){ try{ window.parent.postMessage(m,'*'); }catch(e){} }

  async function paintArtVoice(item){
    const el = document.getElementById('sl-voice');
    if (!HAS_PARENT && ART_AUDIO){ try{ ART_AUDIO.pause(); }catch(e){} ART_AUDIO = null; }
    ART_VOICE = null;
    if (!el) return;
    el.classList.remove('on'); el.textContent = '';
    if (!item || !item.id) return;
    try{
      const r = await sbFetch(`/rest/v1/voice_takes?scope=eq.art&ref=eq.${encodeURIComponent(item.id)}`
                            + `&active=is.true&select=url,dur_sec&limit=1`);
      const d = r && r[0];
      if (!d || !d.url) return;                     /* 없으면 줄도 없다 */
      ART_VOICE = d;
      el.classList.add('on');
      paintVoiceLine();
      /* ⚠ 나갔다 다시 들어온 때 — 이미 흐르는 중일 수 있다. 안 물으면 명패와 소리가 어긋난다 */
      if (HAS_PARENT) tellParent({ eg:'voice-ask' });
    }catch(e){ console.warn('[거실] 낭독을 못 받았습니다 — 명패는 그대로 둡니다', e); }
  }

  function paintVoiceLine(txt){
    const el = document.getElementById('sl-voice');
    if (!el || !ART_VOICE) return;
    const d = ART_VOICE.dur_sec;
    const dur = d ? `<span class="vd">${Math.floor(d/60)}:${String(Math.round(d%60)).padStart(2,'0')}</span>` : '';
    let t = txt;
    if (!t){
      if (HAS_PARENT){
        /* ⚠ 갈래(scope)까지 본다 — 장소 낭독이 흐르는데 「듣는 중」이라 적으면 거짓말이 된다 */
        const mine = VOICE_NOW && VOICE_NOW.scope === 'art'
                     && String(VOICE_NOW.ref) === String(ART && ART.id);
        t = !mine             ? '▶ 설명 듣기'
          : VOICE_NOW.playing ? '❚❚ 듣는 중'
          : VOICE_NOW.ended   ? '▶ 다시 듣기'
          :                     '▶ 이어 듣기';
      } else {
        t = (ART_AUDIO && !ART_AUDIO.paused) ? '❚❚ 듣는 중' : '▶ 설명 듣기';
      }
    }
    el.innerHTML = t + dur;
  }

  function toggleArtVoice(){
    if (!ART_VOICE || !ART) return;
    if (HAS_PARENT){
      const mine = VOICE_NOW && String(VOICE_NOW.ref) === String(ART.id);
      if (mine) tellParent({ eg:'voice-toggle' });
      else tellParent({ eg:'voice-play', scope:'art', ref:ART.id, url:ART_VOICE.url,
                        title:(ART.name || '작품 해설'), total:(ART_VOICE.dur_sec || 0) });
      return;
    }
    /* 폴백 — 단독으로 열렸을 때만 여기서 튼다 */
    if (ART_AUDIO && !ART_AUDIO.paused){ ART_AUDIO.pause(); return; }
    if (!ART_AUDIO){
      ART_AUDIO = new Audio(ART_VOICE.url);
      ART_AUDIO.preload = 'none';
      ART_AUDIO.onplay  = ()=> paintVoiceLine('❚❚ 듣는 중');
      ART_AUDIO.onpause = ()=> paintVoiceLine('▶ 이어 듣기');
      ART_AUDIO.onended = ()=> paintVoiceLine('▶ 다시 듣기');
      ART_AUDIO.onerror = ()=>{ paintVoiceLine('음성을 불러오지 못했습니다');
        console.warn('[거실] 낭독 파일을 못 받았습니다:', ART_VOICE.url); };
      try{
        if ('mediaSession' in navigator)
          navigator.mediaSession.metadata = new MediaMetadata({
            title:(ART && ART.name) || '작품 해설', artist:(ART && ART.artist) || 'EG Universe' });
      }catch(e){}
    }
    ART_AUDIO.play().catch(e=> console.warn('[거실] 낭독 재생', e));
  }

  /* terra가 되쏘는 상태 — 명패 줄이 조종간과 같은 말을 하게 한다 */
  window.addEventListener('message', e=>{
    const d = e && e.data;
    if (!d || d.eg !== 'voice-state') return;
    VOICE_NOW = d.ref ? d : null;
    paintVoiceLine();
  });

  /* ─────────────────────────────────────────────────────────────
     메시지 보드 — 글귀 한 장 + 콘솔 위 흐르는 흔적
     ───────────────────────────────────────────────────────────── */
  function renderBoard(stage){
    if (!stage) return;
    stage.querySelectorAll('.sl-mw, .sl-tick').forEach(el => el.remove());
    stage.style.setProperty('--sl-tick-ink', TICK_DARK ? '#2a2318' : '#f0ebe0');
    stage.style.setProperty('--sl-tick-shadow',
      TICK_DARK ? '0 1px 2px rgba(255,255,255,.34)' : '0 1px 3px rgba(0,0,0,.5)');

    const w = (MW && MW.wall) || {};
    const traces = (MW && MW.traces) || [];
    const q = quoteBox(), t = tickBox();
    const nick = esc2((w.nickname || '').toUpperCase());

    /* ⚠ 벽을 재기 전에는 안 그린다. 잘못된 잉크로 한 번 뜨면 매번 껌뻑인다(0808 조항) */
    if (MEASURED){
      const has = !!(w.body || w.title);
      const inner = has
        ? (nick ? `<div class="sl-mw-nick">${nick}</div>` : '')
          + (w.title ? `<div class="sl-mw-title">${esc2(w.title)}</div>` : '')
          + `<div class="sl-mw-body">${esc2(w.body || '')}</div>`
          + (w.signature ? `<div class="sl-mw-sig">— ${esc2(w.signature)}</div>` : '')
        : `<div class="sl-mw-empty">${nick ? nick + '<br>' : ''}아직 글귀가 걸리지 않은 벽</div>`;

      const mw = document.createElement('div');
      mw.className = 'sl-mw' + (QUOTE_DARK ? ' ink-dark' : '');
      mw.style.cssText = `left:50%; top:${q.top}%; height:${q.h}%; width:60%;`;
      mw.innerHTML = inner + '<div class="sl-h"></div>';
      stage.appendChild(mw);
      if (EDITING) armQuote(stage, mw);
    }

    if (traces.length){
      /* ⚠ 옛 흔적(aged)에만 날짜 한 조각을 붙인다. 안 붙이면 「어제 온 인사」와
         「두 달 전 인사」가 같은 얼굴로 서서 벽이 언제 것인지 알 수 없게 된다. */
      const chip = x => `<span class="sl-tick-chip">`
        + `<img src="${flowerUrl(x.flower_type)}" alt="" onerror="this.style.display='none'">`
        + (x.aged ? `<u>${gbWhen(x.created_at)}</u>` : '')
        + `<b>${esc2(x.visitor_nick)}</b>${x.text ? `<i>${esc2(x.text)}</i>` : ''}</span>`;
      /* 끊김 없는 흐름 — 칩 묶음을 두 벌 이어 붙이고 -50%로 민다 */
      const chips = traces.map(chip).join('');
      const tk = document.createElement('div');
      tk.className = 'sl-tick';
      tk.style.cssText = `left:50%; top:${t.top}%; height:${t.h}%; width:${t.w}%;`;
      tk.innerHTML = `<div class="sl-tick-track">${chips}</div><div class="sl-h"></div>`;
      stage.appendChild(tk);
      /* ⚠ 꽃 크기가 티커 높이를 안 따라가면, 상자만 자라고 아무 일도 안 일어나 보인다
         (0809 소로 지적). 칩 글자 크기를 실제 높이에서 뽑아 넣는다. */
      tk._chips = chips;        /* ⚠ 다시 맞출 때 필요하다 — 없으면 되풀이 수를 못 다시 센다 */
      sizeTick(tk);
      flowTicker(tk, chips);
      if (EDITING) armTick(stage, tk);
      /* ⭐ 내 집이면 눌러서 전체를 펼친다. 남의 집에서는 아무 일도 없다 —
         목록은 세어지고, 세어지는 순간 집집의 인사 수가 순위가 된다(헌장 9.2). */
      if (MINE && !EDITING){
        tk.classList.add('can-open');
        tk.title = '다녀간 이들 — 전체 보기';
        tk.onclick = ()=> openGuestAll();
      }
    }
  }

  /* 꽃과 글자는 티커 높이를 따라간다 — 상자만 자라면 맞춰도 아무 일이 안 일어난다 */
  function sizeTick(tk, again){
    const h = tk.clientHeight || 0;
    if (h > 0){ tk.style.fontSize = Math.max(8, h * K.tickFont) + 'px'; return; }
    if (!again) requestAnimationFrame(()=> sizeTick(tk, true));   /* 한 번만 미룬다 */
  }

  /* ⭐ 티커는 시간이 아니라 **속도**를 못 박는 물건이다(0809 소로 관찰).
     64초로 고정해 두었더니 흔적 하나일 때 3.9px/초로 흘러 멈춘 것처럼 보였다.
     ① 한 벌이 통보다 좁으면 통을 채울 만큼 되풀이한다 — 안 그러면 빈 구간이 지나간다
     ② 그렇게 만든 한 벌을 두 벌 이어 붙이고 -50%로 민다 — 이음매가 안 보인다
     ③ 시간 = 한 벌 폭 ÷ 속도. 흔적이 늘어도 읽히는 속도가 그대로다 */
  /* ⚠ 옛 상수 TICK_SPEED 는 K.tickSpeed 로 옮겼다(0816). 두 곳에 값이 있으면
       손잡이를 돌려도 안 움직이는 곳이 생긴다. */
  function flowTicker(tk, chips){
    const track = tk.querySelector('.sl-tick-track');
    if (!track) return;
    requestAnimationFrame(()=>{
      const box = tk.clientWidth || 600;
      const one = track.scrollWidth || 1;
      let reps = 1;
      while (one * reps < box * 1.25 && reps < 60) reps++;
      track.innerHTML = new Array(reps * 2).fill(chips).join('');
      requestAnimationFrame(()=>{
        const half = (track.scrollWidth || one * reps * 2) / 2;
        const sec = Math.max(6, half / Math.max(6, K.tickSpeed));
        track.style.setProperty('--sl-tick-dur', sec.toFixed(1) + 's');
      });
    });
  }

  /* ── 티커 다시 맞추기 (0816 소로 — 글자·속도 손잡이) ──
     ⚠ 끄는 중(input)에 flowTicker 를 통째로 다시 부르면 track 을 새로 채워
       애니메이션이 매번 처음으로 돌아간다 — 보면서 맞출 수가 없다.
       그래서 끄는 중에는 글자와 시간만 갈고, 손을 놓을 때(change) 되풀이 수까지
       다시 센다. 글자를 줄이면 한 벌이 짧아져 통에 빈 구간이 생기기 때문이다. */
  function retuneTick(full){
    const tk = document.querySelector('#sl-stage .sl-tick'); if (!tk) return;
    sizeTick(tk);
    if (full && tk._chips){ flowTicker(tk, tk._chips); return; }
    const track = tk.querySelector('.sl-tick-track'); if (!track) return;
    requestAnimationFrame(()=>{
      const half = (track.scrollWidth || 1) / 2;
      track.style.setProperty('--sl-tick-dur',
        Math.max(6, half / Math.max(6, K.tickSpeed)).toFixed(1) + 's');
    });
  }

  /* ══ 다녀간 이들 — 전체 보기 (0816 소로) ═══════════════════════════
     티커는 흐르는 물건이라 지나간 것을 다시 못 본다. 집주인만 한 장에 펼친다.
     ⚠ get_guestbook_all 은 인자에 방 임자가 없다 — auth.uid() 의 집만 돌려준다.
       남의 집 번호를 넣어 열어 보는 길이 애초에 없다.
     ⚠ 내려둔 것도 함께 선다. 되돌릴 수 있어야 「내리기」가 가벼운 단추가 된다.
     ⚠ 내리기는 PATCH 한 번이다 — 권한이 is_deleted 한 칸으로 좁혀져 있어
       글 내용은 주인도 못 고친다(헌장 4.1). 서버가 막으면 0건이 돌아오므로
       return=representation 으로 받아 실패를 눈으로 잡는다.
     ══════════════════════════════════════════════════════════════ */
  let GB = { rows: [], done: false, busy: false };

  function gbWhen(iso){
    const d = new Date(iso); if (isNaN(d)) return '';
    const y = d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + '년 ' : '';
    return y + (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  }

  async function gbPull(more){
    if (GB.busy || (more && GB.done)) return;
    GB.busy = true;
    try{
      const before = (more && GB.rows.length) ? GB.rows[GB.rows.length - 1].created_at : null;
      const r = await sbFetch('/rest/v1/rpc/get_guestbook_all', { method:'POST',
        body: JSON.stringify({ p_before: before, p_limit: 50 }) }) || [];
      GB.rows = more ? GB.rows.concat(r) : r;
      GB.done = r.length < 50;
    }catch(e){ toast('불러오지 못했습니다 — ' + (e.message || '')); GB.done = true; }
    GB.busy = false;
  }

  async function gbHide(id, on){
    try{
      const r = await sbFetch('/rest/v1/wunderkammer_guestbook?id=eq.' + encodeURIComponent(id), {
        method:'PATCH', headers:{ 'Prefer':'return=representation' },
        body: JSON.stringify({ is_deleted: on }) });
      if (!r || !r.length) throw new Error('내 집의 글이 아닙니다');
      const row = GB.rows.find(x => x.id === id); if (row) row.is_deleted = on;
      gbPaint();
      await refreshBoard();          /* 벽도 함께 고쳐 선다 */
      toast(on ? '벽에서 내렸습니다' : '벽에 다시 올렸습니다');
    }catch(e){ toast('바꾸지 못했습니다 — ' + (e.message || '')); }
  }

  function gbPaint(){
    const box = document.getElementById('gb-list'); if (!box) return;
    if (!GB.rows.length){
      box.innerHTML = '<div class="gb-empty">아직 다녀간 이가 없습니다</div>'; return;
    }
    box.innerHTML = GB.rows.map(x => `
      <div class="gb-row${x.is_deleted ? ' off' : ''}">
        <img src="${flowerUrl(x.flower_type)}" alt="" onerror="this.style.display='none'">
        <div class="gb-main">
          <div><span class="gb-who">${esc2(x.visitor_nick)}</span><span class="gb-when">${gbWhen(x.created_at)}</span></div>
          ${x.text ? `<div class="gb-text">${esc2(x.text)}</div>` : ''}
        </div>
        <button class="gb-act" type="button" data-id="${esc2(x.id)}" data-on="${x.is_deleted ? 0 : 1}">${x.is_deleted ? '올리기' : '내리기'}</button>
      </div>`).join('')
      + (GB.done ? '' : '<button class="gb-more" type="button" id="gb-more">더 보기</button>');
    box.querySelectorAll('.gb-act').forEach(b =>
      b.onclick = ()=> gbHide(b.dataset.id, b.dataset.on === '1'));
    const more = box.querySelector('#gb-more');
    if (more) more.onclick = async ()=>{ more.textContent = '긷는 중…'; await gbPull(true); gbPaint(); };
  }

  /* ── 통합 손잡이 — 엘리베이터 아래 동그란 단추 하나 (0809 소로) ──
     큰 알약 단추 둘을 벽에 띄우면 방이 시끄러워진다. 하나로 접고 눌러야 펴진다. */
  async function buildDock(stage){
    const root = stage.closest('.floor-content');
    if (!root || root.querySelector('.sl-dock')) return;

    const items = [];
    if (MINE) items.push(['✎','내 글귀', openWrite]);
    else      items.push(['✿','꽃 두고 가기', openFlower]);
    if (await isKeeper()) items.push(['⚖','배치 맞추기', ()=>{ buildEditBar(); toggleEditor(stage); }]);
    if (!items.length) return;

    const dock = document.createElement('div');
    dock.className = 'sl-dock';
    dock.innerHTML =
      `<button class="sl-dock-h" type="button" aria-label="이 방에서 할 수 있는 일">⋮</button>
       <div class="sl-dock-menu" hidden></div>`;
    const menu = dock.querySelector('.sl-dock-menu');
    items.forEach(([icon,label,fn],n)=>{
      const b = document.createElement('button');
      b.className = 'sl-dock-b'; b.type = 'button';
      b.textContent = icon; b.title = label; b.setAttribute('aria-label', label);
      if (label === '배치 맞추기') b.dataset.act = 'keeper';
      b.onclick = (e)=>{ e.stopPropagation(); fn(); };
      menu.appendChild(b);
    });
    const h = dock.querySelector('.sl-dock-h');
    h.onclick = (e)=>{
      e.stopPropagation();
      const open = menu.hidden;
      menu.hidden = !open;
      h.classList.toggle('on', open);
      h.textContent = open ? '×' : '⋮';
    };
    root.appendChild(dock);
    if (EDIT){ h.click(); const kb = menu.querySelector('[data-act="keeper"]'); if (kb) kb.click(); }
  }

  async function refreshBoard(){
    try{
      MW = await sbFetch('/rest/v1/rpc/get_message_board',
        { method:'POST', body: JSON.stringify({ p_room_owner: OWNER, p_seed: SEED }) });

  function closeModal(){ const m=document.getElementById('sl-modal'); if(m) m.remove(); }

  /* 내 방 — 글귀 쓰기·고치기 */
  function openWrite(){

        closeModal(); await refreshBoard();

      }catch(e){ toast('저장 실패: ' + (e.message || '')); }
    };

  /* ── 남의 방 — 꽃 두고 가기 ──
     ⭐ 0809 소로: 「이번 주 꽃을 먼저 고르세요(교양자화상)」만 뜨고 끝나 엄청 불편했다.
        고르는 일은 여기서 끝낸다. 자화상까지 다녀오지 않는다.
     ⚠ 주 시작은 서버와 같은 눈금이어야 한다 — Postgres date_trunc('week')는 **월요일**이고
       KST 기준이다. 한쪽만 어긋나면 꽃을 골라도 「먼저 고르세요」가 계속 뜬다. */
  function kstWeekId(){
    const kst = new Date(Date.now() + 9*3600*1000);
    const dow = (kst.getUTCDay() + 6) % 7;                 /* 월=0 */
    kst.setUTCDate(kst.getUTCDate() - dow);
    return kst.toISOString().slice(0,10);
  }
  async function myFlower(){
    try{
      const me = getUser()?.id; if (!me) return null;
      const r = await sbFetch(
        `/rest/v1/flower_balance?user_id=eq.${me}&select=weekly_flower,weekly_flower_wk,balance`);
      const d = r && r[0];
      if (!d) return { flower:null, left:0 };
      const ok = d.weekly_flower && d.weekly_flower_wk === kstWeekId();
      return { flower: ok ? d.weekly_flower : null, left: ok ? (d.balance||0) : 0 };
    }catch(e){ console.warn('[거실] 꽃 조회 실패', e); return null; }
  }

  async function openFlower(){
    closeModal();
    const m = document.createElement('div');
    m.id='sl-modal'; m.className='sl-modal';
    m.innerHTML = `<div class="sl-box"><h3>🌸 꽃 두고 가기</h3>
                   <p class="sl-hint">살펴보는 중…</p></div>`;
    document.body.appendChild(m);
    m.addEventListener('click', e=>{ if(e.target===m) closeModal(); });

    const st = await myFlower();
    if (!st){ m.querySelector('.sl-box').innerHTML =
      `<h3>🌸 꽃 두고 가기</h3><p class="sl-hint">꽃을 확인하지 못했습니다. 잠시 후 다시 들러 주세요.</p>
       <div class="sl-btns"><button class="sl-cancel">닫기</button></div>`;
      m.querySelector('.sl-cancel').onclick = closeModal; return; }

    if (!st.flower) paintPick(m);
    else            paintLeave(m, st);
  }

  /* 열두 송이 중 한 송이 — persona.html의 claim_weekly_flower와 같은 문 */
  function paintPick(m){
    let cells = '';
    for (let i=1;i<=12;i++){
      const t = 'flower' + String(i).padStart(2,'0');
      cells += `<button type="button" class="sl-fpick" data-f="${t}">
                  <img src="${flowerUrl(t)}" alt="" loading="lazy"></button>`;
    }
    m.querySelector('.sl-box').innerHTML =
      `<h3>🌸 이번 주의 꽃</h3>
       <p class="sl-hint">아직 이번 주 꽃을 안 고르셨습니다. 한 송이 고르시면 <b>28송이</b>를 받습니다.
         분더카머를 순례하며 집집마다 한 송이씩 두고 올 수 있어요. (안 쓰면 다음 주에 사라집니다.)</p>
       <div class="sl-fgrid">${cells}</div>
       <div class="sl-btns"><button class="sl-cancel">닫기</button></div>`;
    m.querySelector('.sl-cancel').onclick = closeModal;
    m.querySelector('.sl-fgrid').addEventListener('click', async e=>{
      const b = e.target.closest('.sl-fpick'); if (!b) return;
      const grid = m.querySelector('.sl-fgrid');
      if (grid.classList.contains('busy')) return;
      grid.classList.add('busy');
      try{
        await sbFetch('/rest/v1/rpc/claim_weekly_flower',
          { method:'POST', body: JSON.stringify({ p_flower: b.dataset.f }) });
        const st = await myFlower();                       /* ⚠ 받았겠지 금지 — 되읽어 확인한다 */
        if (st && st.flower) paintLeave(m, st, true);
        else { grid.classList.remove('busy'); toast('꽃을 받지 못했어요'); }
      }catch(err){ grid.classList.remove('busy'); toast(err.message || '꽃을 받지 못했어요'); }
    });
  }

  function paintLeave(m, st, justPicked){
    m.querySelector('.sl-box').innerHTML =
      `<h3>🌸 꽃 두고 가기</h3>
       <div class="sl-fnow"><img src="${flowerUrl(st.flower)}" alt="">
         <div><b>${st.left}</b> 송이 남았습니다${justPicked ? ' · 방금 받으셨어요' : ''}<br>
         <span>한 줄은 남겨도 좋고, 비워도 좋습니다 — 아무 말 없이 두고 가는 것도 인사입니다.</span></div></div>
       <textarea id="sl-f" rows="2" maxlength="50" placeholder="한 줄 남기기 (50자, 선택)"></textarea>
       <div class="sl-btns"><button class="sl-cancel">닫기</button>
         <button class="sl-ok">두고 가기</button></div>`;
    m.querySelector('.sl-cancel').onclick = closeModal;
    m.querySelector('.sl-ok').onclick = async ()=>{
      const text = m.querySelector('#sl-f').value.trim();
      try{
        const res = await sbFetch('/rest/v1/rpc/leave_flower', { method:'POST',
          body: JSON.stringify({ p_room_owner: OWNER, p_text: text||null }) });
        closeModal(); await refreshBoard();
        const left = (res && typeof res.left === 'number') ? res.left : -1;
        toast(left === 0 ? '이번 주 마지막 꽃을 두고 갑니다'
            : left  >  0 ? `꽃을 두고 갑니다 · 이번 주 남은 꽃 ${left}송이`
            :              '꽃을 두고 갑니다');
        setTimeout(offerMaisonStamp, 320);   /* ⚠ 모달을 닫은 뒤에 (v155 §3-1) */
      }catch(e){ closeModal(); toast(e.message || '잠시 후 다시 시도해 주세요'); }
    };
  }

  /* ══ 0814 · 메종 체류 인장 (dom_manere · NEXVS · SOLIDAIRES) ═══════════
     꽃 한 송이를 두고 나온 그 순간에 놓는다.
     ⭐ 왜 「문을 열었을 때」가 아니라 「꽃을 두었을 때」인가 —
        도장은 행동을 가르친다. 여는 순간에 놓으면 문 열고 힐끔, 찍고 나오기를
        가르치게 된다(0814 소로). 꽃과 방명록에 놓으면 온기가 도는 쪽을 가르친다.
     ⚠ 글은 선택이라 묻지 않는다 — leave_flower 하나가 꽃과 방명록을 함께 받는다.
     ⚠ 남의 집에서만. openFlower는 애초에 남의 방에서만 열린다(MINE이 막는다).
     ⚠ 집마다 평생 한 번(once_per_subject). subject는 **메종 번호**다 —
        닉네임을 subject로 쓰면 닉을 바꾼 날 그 집이 새 집이 되어 또 찍힌다.
     ⚠ 집이 아직 없는 임자면 조용히 물러난다 (30호 — 없으면 그냥 없다).
     ⚠ supa를 안 넘긴다 — 이 파일엔 supabase-js가 없다. 부품이 REST로 간다.
     ══════════════════════════════════════════════════════════════════ */
  async function offerMaisonStamp(){
    if (!window.EGStamp || !OWNER) return;
    try{
      const m  = await sbFetch(`/rest/v1/eg_maison?occupant_id=eq.${OWNER}&select=maison_no&limit=1`);
      const no = m && m[0] && m[0].maison_no;
      if (!no) return;
      const u    = await sbFetch(`/rest/v1/users?id=eq.${OWNER}&select=nickname`);
      const nick = (u && u[0] && u[0].nickname) || '';
      EGStamp.offer({
        kind: 'dom_manere',
        subject: String(no),
        inscription: domInscription(no, nick)
      });
    }catch(e){ console.warn('[EGStamp] 메종 인장 물러납니다:', e); }
  }

  /* 각인 — 「MAISON № 07 · 소로」. 번호가 뼈대고 닉이 살이다.
     ⚠ 찍히면 붙박인다(15호). 바뀔 수 있는 것 하나만 적으면 몇 해 뒤
        없는 사람의 집이 된다. 번호는 안 바뀌고 닉은 바뀐다.
     ⚠ 판 밖 한 줄에 날짜가 함께 앉는다(inscribe_out) → 긴 닉은 자른다. */
  function domInscription(no, nick){
    const head = 'MAISON № ' + String(no).padStart(2, '0');
    const n = (nick || '').trim();
    if (!n) return head;
    return head + ' · ' + (n.length > 14 ? n.slice(0, 14) + '…' : n);
  }

  /* 살롱지기인가 — 단추 하나를 내기 위한 한 번의 조회.
     ⚠ 못 재면 잠근다. 통신이 끊겨도 열리지 않는다. */
  let KEEPER = null;
  async function isKeeper(){
    if (KEEPER !== null) return KEEPER;
    const me = getUser()?.id;
    if (!me){ KEEPER = false; return false; }
    try{
      const u = await sbFetch(`/rest/v1/users?id=eq.${me}&select=is_admin`);
      KEEPER = !!(u && u[0] && u[0].is_admin);
    }catch(e){ KEEPER = false; }
    return KEEPER;
  }

  /* ══════════════════════════════════════════════════════════════
     배치 맞추기 — 미술관 문법(galerie 0805). 끌어 옮기고 모서리로 키운다.
     ⚠ 여기서 맞추는 값은 벽 구역에 대한 **비율**이라 일곱 방 전부에 통한다.
       방마다 저장하면 서른 채에 270값이 된다. 저장은 eg_settings 한 줄.
     ⚠ 끌기는 포인터 하나로 받는다 — 폰과 마우스가 같은 길로 들어온다.
     ══════════════════════════════════════════════════════════════ */
  let EDITING = false;

  function stageRect(){
    const st = document.getElementById('sl-stage');
    return st ? st.getBoundingClientRect() : { width:1, height:1 };
  }
  const clamp = (v,lo,hi)=> Math.min(hi, Math.max(lo, v));

  function toggleEditor(stage){
    EDITING = !EDITING;
    document.getElementById('sl-bar').hidden  = !EDITING;
    document.getElementById('sl-info').hidden = !EDITING;
    loadArt(stage, OWNER); renderBoard(stage);
    armFurniture(stage);
    paintInfo();
    const bar0 = document.getElementById('sl-bar');
    if (bar0 && bar0._paintKnob) setTimeout(bar0._paintKnob, 60);   /* 티커가 선 뒤에 잰다 */
  }

  /* 엘리베이터와 도크 — 무대가 아니라 층 위에 떠 있는 물건이라 따로 잡는다.
     ⚠ 자리는 네 층 모두에 걸린다. 거실에서 옮기면 책의 방에서도 옮겨진다. */
  function armFurniture(stage){
    const root = stage.closest('.floor-content');
    const floor = root && root.closest('.floor');
    const lift = floor && floor.querySelector('.room-elevator');
    const dock = root && root.querySelector('.sl-dock');
    [[lift,'lift'],[dock,'dock']].forEach(([el,kind])=>{
      if (!el) return;
      el.classList.toggle('editing', EDITING);
      if (!EDITING || el._armed) return;
      el._armed = true;
      let d = null;
      el.addEventListener('pointerdown', e=>{
        if (!EDITING) return;
        e.preventDefault(); e.stopPropagation();
        el.setPointerCapture(e.pointerId);
        d = { x:e.clientX, y:e.clientY,
              r:K[kind+'R'], t:K[kind+'T'] };
      });
      el.addEventListener('pointermove', e=>{
        if (!EDITING || !d) return;
        const b = (floor||document.body).getBoundingClientRect();
        K[kind+'R'] = clamp(d.r - (e.clientX-d.x)/b.width*100,  0, 80);
        K[kind+'T'] = clamp(d.t + (e.clientY-d.y)/b.height*100, 4, 96);
        pushPos(); paintInfo();
      });
      const end = ()=>{ d = null; };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      el.addEventListener('click', e=>{ if (EDITING) e.stopPropagation(); }, true);
    });
  }

  function paintInfo(){
    const el = document.getElementById('sl-info'); if (!el) return;
    const w = band();
    el.innerHTML =
      `그림 <em>배율</em> ${K.artK.toFixed(3)} · <em>내림</em> ${K.artDrop.toFixed(1)} · <em>가로</em> ${K.artX.toFixed(1)}`
      + `<br>글귀 <em>위</em> ${K.quoteTop.toFixed(1)} · <em>높이</em> ${K.quoteH.toFixed(1)}`
      + `<br>엘베 <em>R</em> ${K.liftR.toFixed(1)} <em>T</em> ${K.liftT.toFixed(1)} · 도크 <em>R</em> ${K.dockR.toFixed(1)} <em>T</em> ${K.dockT.toFixed(1)}`
      + `<br>꽃 <em>올림</em> ${K.tickDrop.toFixed(1)} · <em>높이</em> ${K.tickH.toFixed(1)} · <em>폭</em> ${K.tickW.toFixed(1)}`
      + (K.tickW > 44.1 ? ' <em style="color:#e08f6a">⚠ 상판 물건과 겹침</em>' : '')
      + `<br><em>${ROOM ? String(ROOM.no).padStart(2,'0') + ' ' + esc2(ROOM.name || '') : ''}`
      + ` 벽 ${w.top.toFixed(1)} ~ ${w.bot.toFixed(1)} (${w.h.toFixed(1)})`
      + `${ROOM && ROOM.no !== REAL_NO ? ' · 미리보기' : ''} · 값은 일곱 방 공통</em>`;
  }

  /* 한 물건에 끌기와 모서리를 붙인다. 값이 바뀌면 그 자리에서 다시 그린다. */
  function arm(el, stage, opt){
    const h = el.querySelector('.sl-h');
    el.classList.add('editing');
    let d = null, r = null;

    el.addEventListener('pointerdown', e=>{
      if (!EDITING || e.target === h) return;
      e.preventDefault(); e.stopPropagation();
      el.setPointerCapture(e.pointerId);
      d = { x:e.clientX, y:e.clientY, v:opt.grab() };
    });
    el.addEventListener('pointermove', e=>{
      if (!EDITING || !d) return;
      const b = stageRect();
      opt.move(d.v, (e.clientX-d.x)/b.width*100, (e.clientY-d.y)/b.height*100);
      redraw(stage);
    });
    const end = ()=>{ d = null; };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);

    if (h && opt.size){
      h.addEventListener('pointerdown', e=>{
        if (!EDITING) return;
        e.preventDefault(); e.stopPropagation();
        h.setPointerCapture(e.pointerId);
        r = { x:e.clientX, y:e.clientY, v:opt.grabSize() };
      });
      h.addEventListener('pointermove', e=>{
        if (!EDITING || !r) return;
        const b = stageRect();
        opt.size(r.v, (e.clientX-r.x)/b.width*100, (e.clientY-r.y)/b.height*100);
        redraw(stage);
      });
      const e2 = ()=>{ r = null; };
      h.addEventListener('pointerup', e2);
      h.addEventListener('pointercancel', e2);
    }
  }

  /* ⚠⚠ 끄는 중에는 **다시 만들지 않고 스타일만 고친다.**
     요소를 지웠다 새로 만들면 잡고 있던 물건이 사라져 포인터가 끊긴다
     — 미술관 applyRect()가 스타일만 고치는 까닭이 이것이다(galerie 계보).
     통째로 다시 그리는 것은 편집을 켜고 끌 때뿐이다. */
  function redraw(stage){
    const a = artBox(), q = quoteBox(), t = tickBox();

    const art = stage.querySelector('.sl-art, .sl-empty');
    if (art){
      art.style.left = a.x + '%'; art.style.top = a.top + '%'; art.style.height = a.h + '%';
      if (art.classList.contains('sl-empty')) art.style.width = (a.h * 0.74) + '%';
    }
    const pl = stage.querySelector('.sl-plaque');
    if (pl){ pl.style.left = a.x + '%'; pl.style.top = (a.top + a.h + 1.4) + '%'; }

    const mw = stage.querySelector('.sl-mw');
    if (mw){ mw.style.top = q.top + '%'; mw.style.height = q.h + '%'; }

    const tk = stage.querySelector('.sl-tick');
    if (tk){ tk.style.top = t.top + '%'; tk.style.height = t.h + '%'; tk.style.width = t.w + '%'; sizeTick(tk); }

    paintInfo();
  }

  function armArt(stage, el){
    const w = band();
    arm(el, stage, {
      grab : ()=> ({ drop:K.artDrop, x:K.artX }),
      move : (v, dx, dy)=>{
        K.artDrop = clamp(v.drop + dy, -w.h*0.35, w.h*0.35);
        K.artX    = clamp(v.x + dx, 30, 70);
      },
      grabSize : ()=> K.artK,
      size : (v, dx, dy)=>{ K.artK = clamp(v + (dy*2)/w.h, 0.12, 0.72); }
    });
  }
  function armQuote(stage, el){
    const w = band();
    arm(el, stage, {
      grab : ()=> K.quoteTop,
      move : (v, dx, dy)=>{ K.quoteTop = clamp(v + dy, 0, w.h - K.quoteH); },
      grabSize : ()=> K.quoteH,
      size : (v, dx, dy)=>{ K.quoteH = clamp(v + dy, 6, w.h - K.quoteTop); }
    });
  }
  /* 티커는 바닥선이 wall_bot에 못 박혀 있다 — 위로 끌면 높이가 자란다 */
  /* 티커는 바닥선이 wall_bot에 못 박혀 있다 — 위로 끌면 높이가 자란다.
     ⚠ 폭은 28~72% 안에 머물러야 한다. 상판 좌우 끝에 물건이 서 있고
       그 물건은 방마다 다른 곳까지 들어온다(0809 일곱 방 실측: 가장 안쪽 26%·74%). */
  function armTick(stage, el){
    const w = band();
    arm(el, stage, {
      /* ⚠ 끌면 **옮겨진다.** 앞 판은 끌어도 키만 자라서 「안 움직인다」로 보였다(0809 소로).
         바닥이 콘솔 상판에 매인 것은 그대로고, 거기서 얼마나 들어올릴지가 tickDrop이다. */
      grab : ()=> K.tickDrop,
      move : (v, dx, dy)=>{ K.tickDrop = clamp(v - dy, -6, w.h*0.55); },
      grabSize : ()=> ({ h:K.tickH, w:K.tickW }),
      size : (v, dx, dy)=>{
        K.tickH = clamp(v.h - dy, 4, w.h*0.5);
        K.tickW = clamp(v.w + dx*2, 16, 44);     /* 44%가 천장 — 넘으면 상판 물건을 밟는다 */
      }
    });
  }

  /* ── 방 미리보기 — 맞추면서 일곱 방을 눈으로 넘긴다 (0809 소로) ──
     ⚠ DB를 안 건드린다. 소로의 living_no는 그대로다 — 맞추다가 거실이
       모로칸으로 바뀌어 있으면 안 된다. 끝내면 제 방으로 돌아온다. */
  async function loadRoomList(){
    if (ROOMS_ALL.length) return ROOMS_ALL;
    try{
      const r = await sbFetch('/rest/v1/living_rooms?select=no,name,wall_top,wall_bot,updated_at&order=no');
      ROOMS_ALL = r || [];
    }catch(e){ console.warn('[거실] 방 목록 조회 실패', e); ROOMS_ALL = []; }
    return ROOMS_ALL;
  }
  async function previewRoom(no){
    const list = await loadRoomList();
    const r = list.find(x=>x.no === no);
    if (!r) return;
    ROOM = Object.assign({}, r);
    if (ROOM.wall_top == null) ROOM.wall_top = 5;
    if (ROOM.wall_bot == null) ROOM.wall_bot = 70;
    const stage = document.getElementById('sl-stage');
    MEASURED = false;                 /* 새 벽을 재기 전엔 글귀를 안 그린다 */
    paintBg(stage, no, slot());       /* 다 재고 나면 renderBoard가 저절로 돈다 */
    loadArt(stage, OWNER);
    paintRoomStrip();
    paintInfo();
  }
  function paintRoomStrip(){
    const box = document.getElementById('sl-rooms'); if (!box) return;
    box.innerHTML = ROOMS_ALL.map(r=>{
      const on   = ROOM && r.no === ROOM.no;
      const band = (r.wall_bot ?? 70) - (r.wall_top ?? 5);
      const thin = band === Math.min(...ROOMS_ALL.map(x=>(x.wall_bot ?? 70)-(x.wall_top ?? 5)));
      return `<button type="button" data-no="${r.no}" class="${on?'on':''}${thin?' thin':''}"
                title="${esc2(r.name)} · 벽 ${band.toFixed(1)}">${String(r.no).padStart(2,'0')}</button>`;
    }).join('');
  }

  function buildEditBar(){
    if (document.getElementById('sl-bar')) return;
    const info = document.createElement('div');
    info.id='sl-info'; info.hidden = true;
    document.body.appendChild(info);

    const bar = document.createElement('div');
    bar.id='sl-bar'; bar.hidden = true;
    bar.innerHTML = `<span id="sl-rooms"></span>
                     <span class="sl-sep"></span>
                     <span class="sl-knob">글자<input type="range" id="sl-k-font"
                        min="0.16" max="0.60" step="0.01"><b id="sl-k-font-v"></b></span>
                     <span class="sl-knob">속도<input type="range" id="sl-k-spd"
                        min="14" max="160" step="2"><b id="sl-k-spd-v"></b></span>
                     <span class="sl-sep"></span>
                     <button type="button" class="go" data-a="save">저장</button>
                     <button type="button" data-a="undo">되돌리기</button>
                     <button type="button" data-a="close">끝내기</button>`;
    document.body.appendChild(bar);
    /* ── 글자·속도 손잡이 (0816 소로) ──
       ⚠ 값 표시에 실제 px 을 함께 적는다. 비율만 보이면 바닥값(8px)에 걸렸을 때
         손잡이를 돌려도 안 변하는 까닭을 알 길이 없다. */
    const kf = bar.querySelector('#sl-k-font'), ks = bar.querySelector('#sl-k-spd');
    function paintKnob(){
      /* ⚠ 티커의 글자 크기와 칩의 글자 크기는 다르다 — 칩이 .62em 이다.
           손잡이 값에 0.62를 곱해 적으면 CSS와 JS 두 곳에 같은 값이 생긴다.
           실물 칩에서 읽는다. 그러면 CSS를 고쳐도 표시가 저절로 따라온다. */
      const chip = document.querySelector('#sl-stage .sl-tick-chip');
      const px = chip ? parseFloat(getComputedStyle(chip).fontSize) : 0;
      bar.querySelector('#sl-k-font-v').textContent =
        K.tickFont.toFixed(2) + (px ? ' · ' + px.toFixed(1) + 'px' : '');
      bar.querySelector('#sl-k-spd-v').textContent = Math.round(K.tickSpeed);
    }
    kf.value = K.tickFont;  ks.value = K.tickSpeed;
    kf.addEventListener('input',  ()=>{ K.tickFont  = +kf.value; retuneTick(false); paintKnob(); });
    kf.addEventListener('change', ()=>{ retuneTick(true);  paintKnob(); });
    ks.addEventListener('input',  ()=>{ K.tickSpeed = +ks.value; retuneTick(false); paintKnob(); });
    ks.addEventListener('change', ()=>{ retuneTick(true);  paintKnob(); });
    bar._paintKnob = paintKnob;

    loadRoomList().then(paintRoomStrip);
    document.getElementById('sl-rooms').addEventListener('click', e=>{
      const n = e.target.dataset && e.target.dataset.no;
      if (n) previewRoom(+n);
    });

    bar.addEventListener('click', async e=>{
      const a = e.target.dataset && e.target.dataset.a;
      const stage = document.getElementById('sl-stage');
      if (a === 'save'){
        const val = {};
        Object.keys(K_DEFAULT).forEach(k=> val[k] = +(+K[k]).toFixed(3));
        try{
          await sbFetch('/rest/v1/eg_settings?on_conflict=key', {
            method:'POST',
            headers:{ 'Prefer':'resolution=merge-duplicates' },
            body: JSON.stringify({ key:'living_layout', val, updated_at:new Date().toISOString() })
          });
          K_SAVED = Object.assign({}, K); pushPos();
          toast('배치를 저장했습니다 · 일곱 방에 함께 갑니다');
        }catch(err){ toast('저장 실패: ' + (err.message||'')); }
      }
      if (a === 'undo'){
        Object.assign(K, K_SAVED); pushPos();
        loadArt(stage, OWNER); renderBoard(stage); paintInfo();
        const kf2 = bar.querySelector('#sl-k-font'), ks2 = bar.querySelector('#sl-k-spd');
        if (kf2) kf2.value = K.tickFont;  if (ks2) ks2.value = K.tickSpeed;
        if (bar._paintKnob) bar._paintKnob();
        toast('마지막 저장으로 되돌렸습니다');
      }
      if (a === 'close'){
        toggleEditor(stage);
        if (ROOM && ROOM.no !== REAL_NO) previewRoom(REAL_NO);   /* 제 방으로 돌아온다 */
      }
    });
  }
  /* ── 자세히 보기 (0810) ─────────────────────────────────────────────
     벽에 걸린 것은 액자 낀 webp, 다가가면 뜨는 것은 원화 그 자체.
     원판은 heritage_items.zoom_src — 위키미디어 공용 파일명 또는 http 직접 URL.
     ⭐ 미술관(galerie)과 한 부품이다. 한쪽을 고치면 다른 쪽도 함께 봐야 한다.

     ⚠⚠ 폭은 아무 숫자나 못 쓴다. 위키미디어는 표준 폭이 아닌 직접 요청을 거부한다.
       20·40·60·120·250·330·500·960·1280·1920·3840 — 이 목록 밖은 안 나온다.
     ⚠ 원판이 없으면 예전 그대로 화면 맞춤 한 단계다(폴백이 기본값). */
  const PLATE_DEEP = 3840, W_LIST = [960, 1280, 1920, 3840];
  /* ⚠ art를 여기 붙들어 둔다 — 다른 방을 미리 보시면 ART가 바뀐다 */
  const SZ = { s:1, tx:0, ty:0, fw:0, fh:0, deep:false, got:0, seq:0, art:null };

  const zEl  = ()=> document.getElementById('sl-zoom');
  const zImg = ()=> document.getElementById('sl-zoom-img');
  const zBox = ()=> document.getElementById('sl-zoom-stage');

  /* 첫 판은 이 방에 필요한 만큼만 — 손바닥에 3840px을 던지지 않는다.
     ⚠ 미술관은 창 전체였으나 거실은 방(stage) 안이라 그 크기로 잰다 */
  function platePick(){
    const b = zBox(), w = (b ? b.clientWidth : 0) || window.innerWidth;
    const need = Math.ceil(w * Math.min(devicePixelRatio || 1, 1.25));
    return W_LIST.find(x => x >= need) || PLATE_DEEP;
  }
  function plateUrl(src, w){
    const s = String(src||'').trim();
    if(!s) return '';
    if(/^https?:/i.test(s)) return s;                  /* 남의 소장처 직접 URL */
    return 'https://commons.wikimedia.org/wiki/Special:FilePath/'
         + encodeURIComponent(s.replace(/ /g,'_')) + '?width=' + w;
  }
  /* 깊은 판이 왔으면 원판 100%가 상한 — 그 너머는 없는 정보다 */
  function zmaxNow(){
    const nat = zImg().naturalWidth || 0;
    if(!SZ.fw || !nat) return 1;
    return SZ.got >= 2 ? Math.max(2, Math.min(6, nat / SZ.fw)) : 2.4;
  }

  async function fetchPlate(url){
    const im = new Image();
    im.decoding = 'async';
    im.src = url;
    if(im.decode){ await im.decode(); }
    else await new Promise((ok,no)=>{ im.onload=ok; im.onerror=no; });
    return im;
  }
  /* ⚠ src를 넣은 그 줄에서 naturalWidth를 재면 옛 그림 값이 잡힌다. onload를 기다린다 */
  function swapPlate(src, after){
    const el = zImg();
    el.onload = ()=>{ el.onload = null; after(); };
    el.src = src;
  }

  function zFrame(){
    const b = zBox(); if(!b) return;
    const vw = b.clientWidth, vh = b.clientHeight;
    const W = SZ.fw * SZ.s, H = SZ.fh * SZ.s;
    SZ.tx = (W <= vw) ? (vw - W)/2 : Math.min(0, Math.max(vw - W, SZ.tx));
    SZ.ty = (H <= vh) ? (vh - H)/2 : Math.min(0, Math.max(vh - H, SZ.ty));
    const el = zImg();
    el.style.width  = SZ.fw + 'px';
    el.style.height = SZ.fh + 'px';
    el.style.transform = `translate(${SZ.tx}px, ${SZ.ty}px) scale(${SZ.s})`;
    const lv = document.getElementById('sl-zoom-lv');
    if(lv) lv.textContent = Math.round(SZ.s * 100) + '%';
    zEl().classList.toggle('zoomed', SZ.s > 1.001);   /* 다가가면 명패를 걷는다 */
  }
  function zFit(){
    const b = zBox(); if(!b) return;
    const el = zImg();
    const nw = el.naturalWidth || 4, nh = el.naturalHeight || 3;
    const k = Math.min(b.clientWidth * .94 / nw, b.clientHeight * .88 / nh);
    SZ.fw = nw * k; SZ.fh = nh * k; SZ.s = 1;
    zFrame();
  }
  function zAt(k, cx, cy){
    const z = zEl(); if(!z.classList.contains('deep')) return;
    const r = zBox().getBoundingClientRect();
    const x = cx - r.left, y = cy - r.top;          /* ⚠ 방 안 좌표로 옮긴다 */
    const s2 = Math.min(zmaxNow(), Math.max(1, SZ.s * k));
    if(Math.abs(s2 - SZ.s) < 1e-4) return;
    SZ.tx = x - (x - SZ.tx) * (s2 / SZ.s);
    SZ.ty = y - (y - SZ.ty) * (s2 / SZ.s);
    SZ.s = s2;
    zFrame();
    if(SZ.s > 1.6) wantDeep();
  }

  async function wantDeep(){
    if(SZ.deep || SZ.got !== 1 || !SZ.art || !SZ.art.zoom_src) return;
    SZ.deep = true;
    const my = SZ.seq, url = plateUrl(SZ.art.zoom_src, PLATE_DEEP);
    if(!url) return;
    try{
      const im = await fetchPlate(url);
      if(my !== SZ.seq) return;
      swapPlate(im.src, ()=>{ if(my === SZ.seq) SZ.got = 2; });
    }catch(e){ console.warn('[거실] 깊은 판을 못 받았습니다 — 지금 판으로 갑니다', e); }
  }

  async function loadPlate(my){
    const wait = document.getElementById('sl-zoom-wait');
    const t = setTimeout(()=>{ if(my === SZ.seq) wait.classList.add('on'); }, 700);
    try{
      const im = await fetchPlate(plateUrl(SZ.art.zoom_src, platePick()));
      clearTimeout(t); wait.classList.remove('on');
      if(my !== SZ.seq) return;
      /* ⚠ 액자가 빠져 비율이 달라지므로 맞춤을 다시 잡는다 */
      swapPlate(im.src, ()=>{
        if(my !== SZ.seq) return;
        SZ.got = (platePick() >= PLATE_DEEP) ? 2 : 1;   /* 큰 화면은 첫 판이 이미 끝판이다 */
        zFit();
        zEl().classList.add('deep');
      });
    }catch(e){
      clearTimeout(t); wait.classList.remove('on');
      console.warn('[거실] 원판을 못 받았습니다 — 액자 그림으로 갑니다', e);
    }
  }

  function openZoom(a){
    const z = zEl(), el = zImg();
    SZ.seq++; SZ.deep = false; SZ.got = 0; SZ.s = 1; SZ.art = a;
    z.classList.remove('deep','drag','zoomed');
    document.getElementById('sl-zoom-wait').classList.remove('on');

    const hasPlate = !!(a && a.zoom_src && plateUrl(a.zoom_src, 960));
    document.getElementById('sl-zoom-cap').innerHTML =
      `<b>${esc2(a.name)}</b><span>${esc2(a.artist)}</span>`;

    el.onload = null;
    el.src = a.img || '';                         /* ① 이미 받아 둔 액자 그림 — 빈 화면이 없다 */
    z.hidden = false;
    if(el.complete) zFit(); else el.onload = zFit;

    if(hasPlate) loadPlate(SZ.seq);               /* ② 원판은 뒤에서 */
  }
  function closeZoom(){
    SZ.seq++;                                     /* 오는 중인 판을 버린다 */
    const z = zEl();
    z.classList.remove('deep','drag','zoomed');
    document.getElementById('sl-zoom-wait').classList.remove('on');
    zImg().src = '';
    hide('sl-zoom');
  }

  /* 손놀림 — 마우스·손가락을 한 코드로(pointer). 한 번만 건다 */
  function armZoom(){
    if(armZoom._done) return; armZoom._done = true;
    const z = zEl(), b = zBox(), el = zImg();
    const P = new Map();
    let travel = 0, last = null, pinch = 0;
    /* ⚠ 조종간 위에서 시작한 손놀림은 넘긴다 — 안 그러면 「맞춤」을 누를 때 창이 닫힌다 */
    const onHud = t => !!(t && t.closest && t.closest('.g1-zoom-hud, .g1-zoom-x'));

    b.addEventListener('wheel', e=>{
      if(!z.classList.contains('deep')) return;
      e.preventDefault();
      zAt(Math.exp(-e.deltaY * 0.0018), e.clientX, e.clientY);
    }, { passive:false });

    b.addEventListener('pointerdown', e=>{
      if(onHud(e.target)) return;
      P.set(e.pointerId, { x:e.clientX, y:e.clientY });
      travel = 0; last = { x:e.clientX, y:e.clientY };
      if(P.size === 2) pinch = dist();
      if(z.classList.contains('deep')) z.classList.add('drag');
      b.setPointerCapture(e.pointerId);
    });
    b.addEventListener('pointermove', e=>{
      if(!P.has(e.pointerId)) return;
      P.set(e.pointerId, { x:e.clientX, y:e.clientY });
      if(P.size === 2 && pinch){
        const d = dist(), c = mid();
        zAt(d / pinch, c.x, c.y); pinch = d; return;
      }
      if(!last) return;
      const dx = e.clientX - last.x, dy = e.clientY - last.y;
      travel += Math.abs(dx) + Math.abs(dy);
      last = { x:e.clientX, y:e.clientY };
      if(z.classList.contains('deep') && SZ.s > 1.001){ SZ.tx += dx; SZ.ty += dy; zFrame(); }
    });
    const up = e=>{
      P.delete(e.pointerId);
      if(P.size < 2) pinch = 0;
      if(P.size === 0){
        z.classList.remove('drag'); last = null;
        /* ⚠ 끌기와 누르기를 자국으로 가른다 — 안 그러면 그림을 끌 때마다 창이 닫힌다 */
        if(travel < 7 && (e.target !== el || SZ.s <= 1.001)) closeZoom();
      }
    };
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('dblclick', e=>{
      if(!z.classList.contains('deep') || onHud(e.target)) return;
      e.preventDefault();
      if(SZ.s > 1.001) zFit(); else zAt(2, e.clientX, e.clientY);
    });
    window.addEventListener('resize', ()=>{ if(!z.hidden) zFit(); });
    document.getElementById('sl-zoom-fit').onclick = zFit;

    function dist(){ const v=[...P.values()]; return Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y); }
    function mid(){ const v=[...P.values()]; return { x:(v[0].x+v[1].x)/2, y:(v[0].y+v[1].y)/2 }; }
  }

  /* 카리의 4겹 — 앎·사유·연결·큐레이션. scene은 시적 표지라 맨 위에 따로. */
  const LAYER_KO = { knowledge:'앎', thought:'사유', connection:'연결', curation:'큐레이션' };
  function openNote(a){
    document.getElementById('sl-note-head').innerHTML =
      `<div class="g1-note-t">${esc2(a.name)}</div><div class="g1-note-a">${esc2(a.artist)}</div>`;
    const L = a.layers || {};
    let html = '';
    if (L.scene) html += `<p style="font-style:italic;opacity:.82;margin-bottom:18px">${esc2(L.scene)}</p>`;
    ['knowledge','thought','connection','curation'].forEach(k=>{
      if (!L[k]) return;
      html += `<div style="margin-bottom:16px">
                 <div style="font-size:11px;letter-spacing:.16em;color:#a07c66;margin-bottom:5px">${LAYER_KO[k]}</div>
                 <div>${esc2(L[k]).replace(/\n/g,'<br>')}</div>
               </div>`;
    });
    document.getElementById('sl-note-body').innerHTML = html || '<p style="opacity:.6">아직 적힌 글이 없습니다.</p>';
    document.getElementById('sl-note').hidden = false;
  }

  return { markup, mount };
})();


const Floor3 = (() => {
  /* ⭐ 0809 재건축 — 분더카머 Ⅱ층 책의 방
   *  · 배경 넉 벌 = wk-assets/study/study_NN_{m|d|e|n}.webp (941×1672)
   *  · 감(龕) 좌표 = living_rooms 여섯 값. 1층과 같은 방 번호 = 같은 집
   *  · 아홉 자리 = 밑변 셋(b1·b2·bot) × 중심 셋. 손으로 적은 좌표가 한 줄도 없다
   *
   *  ⚠⚠ 표지는 밑변과 중심에 자석처럼 붙는다 —
   *     top(=밑줄) + translateY(-100%) · left(=가운뎃줄) + translateX(-50%).
   *     크기를 키워도 밑줄과 가운뎃줄이 안 움직인다.
   *     top을 윗변으로 쓰면 키우는 순간 선반을 뚫는다. 바꾸지 말 것.

   *  ⚠ 세 칸의 높이가 조금씩 다르다(원근). 균등 분할하면 7~8px 뜬다 —
   *     그래서 선반 두 줄(b1·b2)을 실측값으로 담는다.

     폴백이 먼저 서는 것이 아니라, 재는 순간 그 방만 제 값을 갖는 구조다 */
  const SHELF0 = { l:21.73, r:78.75, top:22.17, b1:37.71, b2:52.70, bot:67.30 };
  const STAGE_AR = 941 / 1672;        /* 무대 가로/세로 — 폭%↔높이% 환산에 쓴다 */

  function shelf(){

    return { l:g('l',SHELF0.l), r:g('r',SHELF0.r), top:g('top',SHELF0.top),
             b1:g('b1',SHELF0.b1), b2:g('b2',SHELF0.b2), bot:g('bot',SHELF0.bot) };

  /* 아홉 자리 — 위에서 아래로, 왼쪽에서 오른쪽으로.
     새 책(가장 큰 seq)이 첫 번째 자리 = 1면 윗줄 맨 왼쪽에 선다 */
  function slots(){
    const s = shelf();
    const ceil = [s.top, s.b1, s.b2];    /* 그 칸의 천장 */
    const base = [s.b1,  s.b2, s.bot];   /* 그 칸의 바닥 = 표지가 앉는 줄 */
    const col  = (s.r - s.l) / 3;
    const out = [];
    for (let t = 0; t < 3; t++)
      for (let c = 0; c < 3; c++)
        out.push({ i: t*3+c, left: s.l + col*(c+0.5), top: base[t],
                   bay: base[t]-ceil[t], col });
    return out;
  }

        <div id="bk-keep-modal">

            <div id="bkp-status" class="bam-status">여는 중…</div>

        </div>
        <div id="bk-add-modal">
          <div class="bam-panel">

              <p class="t"><span class="eyebrow">ÉTAGE II · 책의 방</span>내가 사랑하는 책 추가하기</p>
              <button class="bam-x" id="bam-close" aria-label="닫기">×</button>

            <div class="bam-search">

            <div id="bam-status" class="bam-status">책 제목을 적고 검색을 눌러보세요.</div>
            <div id="bam-mine" class="bam-mine"></div>
