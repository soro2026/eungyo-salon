<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EG 명단에 담기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;800&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<!--
  EG 명단에 담기 (1001)
  소로가 브라우저로 직접 둘러보다 「이분이다」 싶은 페이지에서 즐겨찾기 단추를 누르면
  이 창이 작게 열려 그 페이지를 eg_leads 에 한 줄로 담는다.
  ⭐ 사람이 고르고, 기계는 받아 적기만 한다 — 담는 순간이 곧 고른 것(status 미접촉 = 발송 대기)
  ⭐ 메일은 소로가 눈으로 확인한 것만 적는다
  살롱지기(eg_is_admin)만. 주소 없이 열면 설치 안내 + 오늘 담은 분.
  1001 오후 — ① 사람의 집으로 모으기: 블로그 글 · 유튜브 영상 · 브런치 글에서 눌러도 그 분의 집 주소로 담는다(같은 분 중복 막기)
              ② 보이는 메일 짚어 주기: 단추가 지금 열린 그 페이지 한 장에서 주인이 적어 둔 메일 글자만 찾아 후보로 띄운다
                 · 고르는 손은 소로 — 저절로 채우지 않는다 · 짐작 주소(아이디@naver.com)는 만들지 않는다
              1001 밤 — 고치기: 담은 분 목록의 「고치기」 · 「이미 담긴 분」 화면의 「고치기」 → 같은 모양의 창에서 고쳐 담기 · 지우기
              ⚠ 단추 코드가 바뀌었다 — 즐겨찾기의 옛 「EG 담기」는 지우고 새로 끌어다 놓는다
-->
<style>
  :root{ --paper:#F8F4EB; --paper2:#FFFDF7; --ink:#1A1916; --ink2:#3A342B; --dim:#8B8478; --gold:#8A6414;
         --line:rgba(26,25,22,.12); --blue:#1D4F9E; --red:#9B2C2C; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Gowun Batang',serif; }
  body{ padding:18px 20px 22px; }
  h1{ margin:0 0 2px; font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:18px; letter-spacing:.02em; }
  h1 small{ font-family:'EB Garamond',serif; font-weight:400; font-size:11.5px; color:var(--gold); letter-spacing:.22em; margin-left:6px; }
  .sub{ font-size:12px; color:var(--dim); margin-bottom:14px; }
  .src{ font-size:12px; color:var(--ink2); background:var(--paper2); border:1px solid var(--line); border-radius:8px;
        padding:8px 10px; margin-bottom:14px; word-break:break-all; line-height:1.5; }
  .src b{ color:var(--gold); font-weight:400; font-family:'EB Garamond',serif; letter-spacing:.08em; margin-right:6px; }
  label{ display:block; font-size:12px; color:var(--ink2); margin:10px 0 4px; }
  label i{ font-style:normal; color:var(--dim); font-size:11px; margin-left:4px; }
  input,select,textarea{ width:100%; font-family:inherit; font-size:14px; color:var(--ink); background:var(--paper2);
        border:1px solid rgba(26,25,22,.18); border-radius:7px; padding:8px 10px; outline:none; }
  input:focus,select:focus,textarea:focus{ border-color:var(--gold); }
  textarea{ resize:vertical; min-height:62px; line-height:1.5; }
  .row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .ways{ display:flex; gap:6px; }
  .ways button{ flex:1; font-family:inherit; font-size:13px; padding:7px 0; border-radius:18px; cursor:pointer;
        border:1px solid rgba(26,25,22,.18); background:transparent; color:var(--ink2); }
  .ways button.on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .warn{ font-size:11.5px; color:var(--dim); margin-top:4px; }
  .go{ margin-top:16px; width:100%; font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:15px; letter-spacing:.06em;
        padding:11px 0; border:none; border-radius:9px; background:var(--ink); color:var(--paper); cursor:pointer; }
  .go:disabled{ opacity:.45; cursor:default; }
  .keys{ text-align:center; font-size:11px; color:var(--dim); margin-top:7px; }
  .note{ background:var(--paper2); border:1px solid var(--line); border-radius:9px; padding:14px 16px; font-size:13.5px; line-height:1.65; }
  .note.dup{ border-color:rgba(138,100,20,.45); }
  .note.ok{ text-align:center; font-size:15px; padding:26px 16px; }
  .note.ok .n{ display:block; font-family:'EB Garamond',serif; color:var(--gold); font-size:13px; letter-spacing:.1em; margin-top:6px; }
  .bm{ display:inline-block; margin:10px 0 6px; padding:9px 18px; border-radius:20px; background:var(--blue); color:#fff;
        text-decoration:none; font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:14px; cursor:grab; }
  ol{ margin:8px 0 0 18px; padding:0; } ol li{ margin:3px 0; }
  .today{ margin-top:16px; }
  /* 1001 — 오늘의 30칸 */
  .bar30{ display:grid; grid-template-columns:repeat(30,1fr); gap:2px; margin:6px 0 4px; }
  .bar30 i{ height:12px; border-radius:2px; background:rgba(26,25,22,.10); }
  .bar30 i.on{ background:var(--gold); }
  .bar30.full i.on{ background:var(--blue); }
  .goal{ font-size:12px; color:var(--ink2); display:flex; justify-content:space-between; }
  .goal b{ font-family:'EB Garamond',serif; font-weight:400; color:var(--gold); font-size:14px; letter-spacing:.04em; }
  .done{ text-align:center; font-family:'Nanum Myeongjo',serif; font-weight:800; color:var(--blue); font-size:13.5px; margin:6px 0 2px; }
  .mini{ font-size:11.5px; color:var(--dim); text-align:right; margin:-8px 0 10px; }
  .today h2{ font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:14px; margin:0 0 6px; }
  .today h2 span{ font-family:'EB Garamond',serif; font-weight:400; color:var(--gold); margin-left:6px; }
  .li{ display:grid; grid-template-columns:62px 1fr auto auto; align-items:center; gap:8px; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--line); }
  .li .k{ color:var(--dim); } .li .m{ color:var(--gold); font-size:11.5px; white-space:nowrap; }
  .li a{ color:var(--ink); text-decoration:none; } .li a:hover{ text-decoration:underline; }
  .gate{ font-size:14px; line-height:1.7; }
  .gate a{ color:var(--blue); }
  .err{ color:var(--red); font-size:12.5px; margin-top:8px; }
  /* 1001 밤 — 고치기 */
  .li .fix{ margin-left:8px; font-size:11.5px; padding:2px 8px; border-radius:10px; cursor:pointer;
        border:1px solid var(--line, rgba(0,0,0,.15)); background:transparent; color:var(--dim); }
  .li .fix:hover{ color:var(--ink); border-color:var(--gold); }
  /* 1001 오후 — 메일 후보 */
  .mails{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .mails .h{ font-size:11.5px; color:var(--dim); width:100%; }
  .mails button{ font-family:'EB Garamond',serif; font-size:13.5px; padding:5px 11px; border-radius:16px; cursor:pointer;
        border:1px solid rgba(138,100,20,.45); background:var(--paper2); color:var(--ink); }
  .mails button.on{ background:var(--gold); color:#fff; border-color:var(--gold); }
</style>
</head>
<body>
<h1>EG 명단에 담기<small>CATCH</small></h1>
<div class="sub" id="sub">사람이 고르고, 기계는 받아 적기만 합니다.</div>
<div id="main"><div class="gate">문을 여는 중입니다…</div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient('https://cyhlotwdisjvoxvfkpnd.supabase.co', 'sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR', {
  auth:{ storageKey:'eungyo-auth', persistSession:true, autoRefreshToken:true }
});
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ⚠ admin_leads.html 의 urlKey 와 한 글자도 달라선 안 된다(표의 생성 칸과 같은 식) */
function urlKey(u){
  let s = String(u||'').trim().toLowerCase();
  s = s.replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/[?#].*$/,'').replace(/\/+$/,'');
  return s || null;
}

/* 주소로 종류를 짐작한다 — 틀리면 소로가 고친다 */
const KIND_BY_HOST = [
  [/event-us\.kr/,'이벤터스'], [/onoffmix\.com/,'온오프믹스'], [/somoim\.co\.kr/,'소모임'], [/munto\.kr/,'문토'],
  [/tumblbug\.com/,'텀블벅'], [/frip\.co\.kr/,'프립'], [/brunch\.co\.kr/,'브런치'], [/maily\.so/,'메일리'],
  [/stibee\.com/,'스티비'], [/cafe\.naver\.com/,'네이버카페'], [/cafe\.daum\.net/,'다음카페'],
  [/blog\.naver\.com|tistory\.com/,'블로그'], [/youtube\.com|youtu\.be/,'유튜브'], [/instagram\.com/,'인스타'],
  [/threads\.(net|com)/,'스레드'], [/podbbang\.com|podcasts\.apple|spotify\.com\/show/,'팟캐스트'],
];
const KINDS = ['이벤터스','온오프믹스','소모임','문토','텀블벅','프립','네이버카페','다음카페','독립서점',
               '메일리','스티비','브런치','유튜브','인스타','스레드','블로그','팟캐스트','기타'];
/* 1001 오후 — 페이지 제목에서 사이트 꼬리와 알림 숫자를 떼어 채널명만 남긴다 */
const cleanTitle = t => String(t||'').trim()
  .replace(/^\(\d+\)\s*/, '')
  .replace(/\s*[:|\-–—]\s*(네이버\s*블로그|NAVER\s*블로그|naver\s*blog|YouTube|브런치스토리|브런치|brunch|티스토리|tistory|Instagram.*|이벤터스|온오프믹스|텀블벅)\s*$/i, '')
  .trim();
const guessKind = u => (KIND_BY_HOST.find(([re]) => re.test(u)) || [null,'기타'])[1];

const today = () => new Date().toLocaleDateString('sv-SE', { timeZone:'Asia/Seoul' });  /* YYYY-MM-DD */

/* 1001 — 하루 몫. 블로그를 매일의 본밭으로 삼는다(소로). 바꿀 땐 이 한 줄 — 칸 수도 따라 바뀐다.
   1001 오후 — 30 → 50 으로 올림(소로) */
const DAILY = 50;
/* 1001 저녁 — 작업일. 몫이 찬 날은 닫고, 그다음 담는 분은 아직 몫이 안 찬 가장 이른 날로 센다(소로).
   오늘 50이 차면 내일 몫으로, 내일도 차면 모레 몫으로 — 미리 담아 두기 */
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00+09:00'); x.setDate(x.getDate() + n); return x.toLocaleDateString('sv-SE', { timeZone:'Asia/Seoul' }); };
const dayLabel = d => { const x = new Date(d + 'T12:00:00+09:00'); return `${x.getMonth()+1}/${x.getDate()}(${'일월화수목금토'[x.getDay()]})`; };
const countOn = async d => {
  const { count } = await sb.from('eg_leads').select('id', { count:'exact', head:true }).eq('found_at', d);
  return count ?? 0;
};
const workDay = async () => {
  for (let i = 0; i < 90; i++) { const d = addDays(today(), i); const c = await countOn(d); if (c < DAILY) return { d, c }; }
  return { d: addDays(today(), 90), c: 0 };
};
const bar30 = (n, d) => {
  const k = Math.min(n, DAILY);
  const ahead = d && d !== today();
  return `<div class="goal"><span>${d ? dayLabel(d) + ' 몫' : '오늘의 몫'}${ahead ? ' — 미리 담는 중' : ''}</span><b>${n} / ${DAILY}</b></div>
    <div class="bar30${n >= DAILY ? ' full' : ''}" style="grid-template-columns:repeat(${DAILY},1fr)">${Array.from({length:DAILY}, (_, i) => `<i${i < k ? ' class="on"' : ''}></i>`).join('')}</div>
    ${n >= DAILY ? `<div class="done">${d ? dayLabel(d) : '오늘'} 몫 끝 — 다음에 담는 분은 ${d ? dayLabel(addDays(d,1)) : '내일'} 몫으로 셉니다</div>` : ''}`;
};
const countToday = async () => (await workDay()).c;

const P = new URLSearchParams(location.search);
const PAGE = { url:(P.get('u')||'').trim(), title:(P.get('t')||'').trim(), sel:(P.get('s')||'').trim(), from:null };

/* 1001 오후 — 단추가 그 페이지에서 찾아 온 메일 글자. 그림 파일 이름(abc@2x.png) 같은 가짜는 걸러 낸다.
   ⭐ 후보로 띄우기만 한다 — 메일 칸에 넣는 것은 소로가 누를 때 */
const MAILS = [...new Set(String(P.get('m')||'').split(/\s+/).map(x => x.trim().toLowerCase())
  .filter(x => /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/.test(x) && !/\.(png|jpe?g|gif|webp|svg|css|js)$/.test(x)))].slice(0, 6);

/* 1001 — 사람의 집으로 담는다. 행사 페이지에서 눌러도 주최자 한 분에 주소 하나.
   눌렀던 원래 주소는 raw.event_url 에 남긴다. 밭이 늘면 여기에 한 줄씩. */
const HOME_RULES = [
  [/^https?:\/\/(www\.)?event-us\.kr\/([^\/?#]+)\/event\//i, m => 'https://event-us.kr/' + m[2]],
  /* 1001 오후 — 네이버 블로그: 글 · 목록 · 모바일 어디서 눌러도 blog.naver.com/아이디 */
  [/^https?:\/\/(m\.)?blog\.naver\.com\/.*[?&]blogId=([A-Za-z0-9_-]+)/i, m => 'https://blog.naver.com/' + m[2]],
  [/^https?:\/\/(m\.)?blog\.naver\.com\/([A-Za-z0-9_-]+)[\/?#]./i, m => 'https://blog.naver.com/' + m[2]],
  [/^https?:\/\/m\.blog\.naver\.com\/([A-Za-z0-9_-]+)\/?$/i, m => 'https://blog.naver.com/' + m[1]],
  /* 티스토리: 아이디.tistory.com */
  [/^https?:\/\/([a-z0-9-]+)\.tistory\.com\/./i, m => 'https://' + m[1] + '.tistory.com'],
  /* 유튜브: 채널의 어느 탭에서 눌러도 채널 첫 화면 */
  [/^https?:\/\/(www\.|m\.)?youtube\.com\/(@[^\/?#]+|channel\/[^\/?#]+|c\/[^\/?#]+|user\/[^\/?#]+)[\/?#]./i, m => 'https://www.youtube.com/' + m[2]],
  /* 브런치: brunch.co.kr/@아이디 */
  [/^https?:\/\/(www\.)?brunch\.co\.kr\/(@[^\/?#]+)[\/?#]./i, m => 'https://brunch.co.kr/' + m[2]],
];
for (const [re, fn] of HOME_RULES){
  const m = PAGE.url.match(re);
  if (m){ PAGE.from = PAGE.url; PAGE.url = fn(m); break; }
}

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    $('#main').innerHTML = `<div class="gate">살롱지기만 쓰는 창입니다.<br>
      이 브라우저에서 <a href="https://app.egsalon.com/" target="_blank">app.egsalon.com</a> 에 lonelywalden 으로 로그인한 뒤 다시 눌러 주십시오.</div>`;
    return;
  }
  const { data:isAdmin } = await sb.rpc('eg_is_admin');
  if(!isAdmin){ $('#main').innerHTML = '<div class="gate">살롱지기만 쓰는 창입니다.</div>'; return; }
  if(PAGE.url) await drawCatch(); else await drawHome();
}

/* ── 주소 없이 열었을 때: 설치 안내 + 오늘 담은 분 ───────────────────────── */
async function drawHome(){
  const here = location.origin + location.pathname;
  /* 1001 오후 — 단추가 지금 열린 페이지 한 장(과 그 안의 같은 집 액자 — 네이버 블로그 mainFrame)의 글자에서 메일 모양만 찾아 함께 넘긴다 */
  const bm = `javascript:(()=>{const s=String(getSelection()).trim().slice(0,600);let t='';const g=d=>{try{t+=' '+(d.body?d.body.innerText:'');d.querySelectorAll('a[href^="mailto:"]').forEach(a=>{t+=' '+a.getAttribute('href').slice(7).split('?')[0]});d.querySelectorAll('iframe').forEach(f=>{try{if(f.contentDocument)g(f.contentDocument)}catch(e){}})}catch(e){}};g(document);const m=[...new Set((t.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}/g)||[]).map(x=>x.toLowerCase()))].slice(0,12).join(' ');window.open('${here}?u='+encodeURIComponent(location.href)+'&t='+encodeURIComponent(document.title)+'&s='+encodeURIComponent(s)+'&m='+encodeURIComponent(m),'egcatch','width=480,height=760');})();`;
  $('#main').innerHTML = `
    <div class="note">
      아래 파란 단추를 <b>마우스로 끌어서</b> 브라우저 위쪽 즐겨찾기 막대에 놓아 주십시오. 한 번이면 됩니다.
      <div><a class="bm" id="bm" href="#">EG 담기</a></div>
      <ol>
        <li>즐겨찾기 막대가 안 보이면 <b>Ctrl + Shift + B</b></li>
        <li>둘러보다 「이분이다」 싶은 페이지에서 <b>EG 담기</b>를 누른다</li>
        <li>모임 이름이나 소개를 마우스로 긁어 둔 채 누르면, 그 글이 「다루는 것」에 미리 들어간다</li>
        <li>그 페이지에 주인이 적어 둔 메일이 있으면 「메일 후보」로 뜬다 — 맞는 것을 눌러 고른다</li>
        <li>블로그 글 · 유튜브 영상에서 눌러도 그 분의 집 주소로 담긴다 — 같은 분이면 「이미 담긴 분」</li>
      </ol>
      <div class="warn">⚠ 10월 1일 오후에 단추가 새로 바뀌었습니다. 즐겨찾기의 옛 「EG 담기」는 오른쪽 클릭 → 삭제하고, 이 단추를 다시 끌어다 놓아 주십시오.</div>
    </div>
    <div class="today" id="today"></div>`;
  $('#bm').setAttribute('href', bm);
  $('#bm').addEventListener('click', e => { e.preventDefault(); alert('누르지 말고, 즐겨찾기 막대로 끌어다 놓아 주십시오.'); });
  await drawToday();
}

/* 1001 밤 — 날짜 넘기기. 기본은 지금 담는 날 · ◀ ▶ 로 지난 날 몫도 열어 고친다 */
let VIEW_DAY = null;
async function drawToday(){
  const box = $('#today'); if(!box) return;
  const wd = await workDay();
  const day = VIEW_DAY || wd.d;
  const { data, error } = await sb.from('eg_leads')
    .select('id,name,channel_name,kind,url,email,contact_way,created_at')
    .eq('found_at', day).order('created_at', { ascending:false }).limit(200);
  if(error){ box.innerHTML = `<div class="err">담은 분을 불러오지 못했습니다 — ${esc(error.message)}</div>`; return; }
  const rows = data || [];
  const shut = !VIEW_DAY && wd.d !== today() ? `<div class="sub" style="margin-bottom:6px">${dayLabel(today())} 몫은 ${DAILY}명으로 닫혔습니다 ✓</div>` : '';
  const nav = `<div class="daynav" style="display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px;font-size:12.5px">
      <button type="button" class="fix" data-day="${addDays(day,-1)}">◀ ${dayLabel(addDays(day,-1))}</button>
      ${day !== wd.d ? `<button type="button" class="fix" data-day="${wd.d}">지금 담는 날로</button>` : '<span></span>'}
      <button type="button" class="fix" data-day="${addDays(day,1)}">${dayLabel(addDays(day,1))} ▶</button></div>`;
  box.innerHTML = shut + nav + bar30(rows.length, day) + `<h2 style="margin-top:12px">${dayLabel(day)} 몫으로 담은 분<span>${rows.length}</span></h2>` + (rows.length ? rows.map(r => `
    <div class="li"><span class="k">${esc(r.kind||'')}</span>
      <a href="${esc(r.url||'#')}" target="_blank">${esc(r.name||r.channel_name||'(이름 없음)')}${r.channel_name && r.name ? ' · '+esc(r.channel_name) : ''}</a>
      <span class="m"${r.email ? '' : ' style="color:var(--red)"'}>${r.email ? '메일 ✓' : (r.contact_way==='DM만' ? 'DM만' : '메일 아직')}</span>
      <button type="button" class="fix" data-fix="${r.id}">고치기</button></div>`).join('')
    : '<div class="sub">아직 없습니다.</div>');
  /* 1001 밤 — 잘못 담은 분 고치기 */
  box.onclick = async e => {
    const d = e.target.closest('[data-day]');
    if (d){ VIEW_DAY = d.dataset.day === wd.d ? null : d.dataset.day; await drawToday(); return; }
    const b = e.target.closest('[data-fix]'); if(!b) return;
    await openEdit(Number(b.dataset.fix));
  };
}

/* 1001 밤 — 고치기: 담긴 한 분을 불러 담기 창과 같은 모양으로 연다 */
let EDIT = null;
async function openEdit(id){
  const { data:row, error } = await sb.from('eg_leads').select('*').eq('id', id).maybeSingle();
  if(error || !row){ alert('불러오지 못했습니다 — ' + (error ? error.message : '없는 분')); return; }
  EDIT = row;
  await drawCatch();
  window.scrollTo(0, 0);
}
async function afterEdit(msg){
  const fromHome = !PAGE.url;
  EDIT = null;
  $('#main').innerHTML = `<div class="note ok">${msg}</div>`;
  if (fromHome) setTimeout(() => drawHome(), 700);
  else setTimeout(() => window.close(), 1200);
}
async function removeLead(){
  if(!EDIT) return;
  if(!confirm(`「${EDIT.name || EDIT.channel_name || '이름 없음'}」 님을 명단에서 지웁니다. 되돌릴 수 없습니다.`)) return;
  const { error } = await sb.from('eg_leads').delete().eq('id', EDIT.id);
  if(error){ $('#err').textContent = '지우지 못했습니다 — ' + error.message; return; }
  await afterEdit('지웠습니다 ✓');
}

/* ── 단추로 열렸을 때: 담기 ──────────────────────────────────────────── */
async function drawCatch(){
  const key = urlKey(PAGE.url);
  const { data:dup } = EDIT ? { data:null } : await sb.from('eg_leads').select('id,name,channel_name,status,found_at').eq('url_key', key).maybeSingle();
  if(dup){
    $('#main').innerHTML = `
      <div class="src"><b>PAGE</b>${esc(PAGE.title || PAGE.url)}</div>
      <div class="note dup">이미 담긴 분입니다.<br>
        <b>${esc(dup.name || dup.channel_name || '(이름 없음)')}</b> · ${esc(dup.status)} · ${esc(dup.found_at || '')} 담음</div>
      <button class="go" id="fixdup" style="margin-top:12px">고치기</button>
      <div class="keys">Esc 로 닫기</div>`;
    $('#fixdup').addEventListener('click', () => openEdit(dup.id));
    return;
  }
  const kind = EDIT ? EDIT.kind : guessKind(PAGE.url);
  const sel = PAGE.sel;
  const kinds = EDIT && EDIT.kind && !KINDS.includes(EDIT.kind) ? [...KINDS, EDIT.kind] : KINDS;
  $('#main').innerHTML = `
    <div class="mini" id="mini"></div>
    ${EDIT
      ? `<div class="src"><b>고치는 중</b>${esc(EDIT.found_at || '')} 담음 · ${esc(EDIT.status || '')}<br>${esc(EDIT.url || '')}</div>`
      : `<div class="src"><b>PAGE</b>${esc(PAGE.title || '')}<br>${esc(PAGE.url)}${PAGE.from ? '<br><span style="color:var(--dim)">글 · 행사 페이지에서 눌러 그 분의 집 주소로 담습니다</span>' : ''}</div>`}

    <label>이름 <i>사람 이름 · 닉네임 (모르면 비워도 됩니다)</i></label>
    <input id="f-name" autocomplete="off">

    <label>모임 · 채널 이름</label>
    <input id="f-ch" autocomplete="off">

    <div class="row">
      <div><label>종류</label>
        <select id="f-kind">${kinds.map(k=>`<option${k===kind?' selected':''}>${k}</option>`).join('')}</select></div>
      <div><label>규모 <i>예) 모임 12회 · 구독 3천</i></label>
        <input id="f-scale" autocomplete="off"></div>
    </div>

    <label>다루는 것 <i>한 줄이면 충분합니다 — 편지 첫 문단의 재료</i></label>
    <textarea id="f-about"></textarea>

    <label>메일 <i>눈으로 확인한 주소만</i></label>
    <input id="f-mail" type="email" autocomplete="off" placeholder="공개된 문의 메일 — 아직 모르면 비워 두기">
    <div class="ways" id="ways">
      <button type="button" data-w="메일">메일</button>
      <button type="button" data-w="DM만">DM만</button>
      <button type="button" data-w="없음" class="on">아직</button>
    </div>
    ${MAILS.length ? `<div class="mails" id="mails"><span class="h">이 페이지에서 찾은 메일 — 맞는 것을 눌러 주십시오</span>${MAILS.map(x => `<button type="button" data-m="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : ''}
    <div class="warn">메일 칸을 채우면 「메일」로 저절로 바뀝니다.</div>

    <label>메모</label>
    <input id="f-memo" autocomplete="off" placeholder="눈에 띈 점 한 줄">

    <button class="go" id="go">${EDIT ? '고쳐 담기' : '담기'}</button>
    ${EDIT ? '<div style="text-align:center;margin-top:10px"><a href="#" id="del" style="color:var(--red);font-size:12.5px">명단에서 지우기</a> · <a href="#" id="cancel" style="color:var(--dim);font-size:12.5px">그만두기</a></div>' : ''}
    <div class="keys">Ctrl + Enter ${EDIT ? '고쳐 담기' : '담기'} · Esc 닫기</div>
    <div class="err" id="err"></div>`;

  /* 미리 채우기 — 긁어 둔 글이 있으면 「다루는 것」에, 없으면 페이지 제목
     1001 오후 — 이름 · 채널 칸에도 제목에서 꼬리(「 : 네이버 블로그」 등)를 뗀 채널명을 넣는다. 소로가 보고 고친다 */
  if (EDIT){
    $('#f-name').value  = EDIT.name || '';
    $('#f-ch').value    = EDIT.channel_name || '';
    $('#f-scale').value = EDIT.scale || '';
    $('#f-about').value = EDIT.about || '';
    $('#f-mail').value  = EDIT.email || '';
    $('#f-memo').value  = EDIT.memo || '';
  } else {
    const chName = cleanTitle(PAGE.title);
    $('#f-ch').value = chName;
    $('#f-name').value = chName;
    $('#f-about').value = sel || chName || PAGE.title;
  }
  if (!EDIT) workDay().then(w => { const m = $('#mini'); if (m) m.textContent = `${w.d !== today() ? dayLabel(w.d) + ' 몫 · 미리 ' : '오늘 '}${w.c} / ${DAILY}`; });
  $('#f-name').focus(); $('#f-name').select();   /* 이름 칸은 칠해 둔다 — 바로 치면 바뀌고, 그대로 두려면 손대지 않으면 된다 */

  let way = '없음';
  if (EDIT){
    $('#del').addEventListener('click', e => { e.preventDefault(); removeLead(); });
    $('#cancel').addEventListener('click', e => { e.preventDefault(); afterEdit('그만두었습니다'); });
  }
  const setWay = w => { way = w; document.querySelectorAll('#ways button').forEach(b => b.classList.toggle('on', b.dataset.w===w)); };
  $('#ways').addEventListener('click', e => { const b = e.target.closest('button'); if(b) setWay(b.dataset.w); });
  $('#f-mail').addEventListener('input', e => { if(e.target.value.trim()) setWay('메일'); else if(way==='메일') setWay('없음'); });
  /* 1001 오후 — 메일 후보를 누르면 메일 칸에. 같은 것을 한 번 더 누르면 비운다 */
  const mb = $('#mails');
  if (mb) mb.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    const off = b.classList.contains('on');
    mb.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    $('#f-mail').value = off ? '' : b.dataset.m;
    if (!off) b.classList.add('on');
    $('#f-mail').dispatchEvent(new Event('input'));
  });

  if (EDIT) setWay(EDIT.email ? '메일' : (EDIT.contact_way || '없음'));
  $('#go').addEventListener('click', requestSave);
}

/* 1001 — 마지막 글자가 사라지던 병.
   한글은 마지막 글자가 「조합 중」인 채로 Ctrl+Enter 를 누르면 그 글자가 아직 값에 안 들어가 있다.
   담기 전에 입력 칸에서 손을 떼게(blur) 해 조합을 마치고, 한 박자 쉰 뒤 읽는다. */
let saving = false;
function requestSave(){
  if (saving) return; saving = true;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  setTimeout(async () => { try { await save(); } finally { saving = false; } }, 60);
}

async function save(){
  const go = $('#go'); if(!go || go.disabled) return;
  const v = id => $(id).value.trim();
  const name = v('#f-name'), ch = v('#f-ch'), mail = v('#f-mail');
  if(!name && !ch){ $('#err').textContent = '이름이나 모임 · 채널 이름 가운데 하나는 적어 주십시오.'; $('#f-name').focus(); return; }
  if(mail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){ $('#err').textContent = '메일 모양이 어긋났습니다.'; $('#f-mail').focus(); return; }
  const on = document.querySelector('#ways button.on');
  go.disabled = true; go.textContent = EDIT ? '고치는 중…' : '담는 중…';
  if (EDIT){
    const patch = {
      name: name || null, channel_name: ch || null, kind: $('#f-kind').value,
      scale: v('#f-scale') || null, about: v('#f-about') || null,
      email: mail || null, contact_way: mail ? '메일' : (on ? on.dataset.w : '없음'),
      memo: v('#f-memo') || null
    };
    const { error } = await sb.from('eg_leads').update(patch).eq('id', EDIT.id);
    if(error){ go.disabled = false; go.textContent = '고쳐 담기'; $('#err').textContent = '고치지 못했습니다 — ' + error.message; return; }
    await afterEdit('고쳤습니다 ✓');
    return;
  }
  const wd = await workDay();   /* 1001 저녁 — 몫이 안 찬 가장 이른 날로 센다 */
  const row = {
    found_at: wd.d,
    name: name || null, channel_name: ch || null, kind: $('#f-kind').value, url: PAGE.url,
    scale: v('#f-scale') || null, about: v('#f-about') || null,
    email: mail || null, contact_way: mail ? '메일' : (on ? on.dataset.w : '없음'),
    memo: v('#f-memo') || null, found_by: '소로 · 담기 단추',
    raw: { page_title: PAGE.title, selection: PAGE.sel || null, event_url: PAGE.from || null, mail_candidates: MAILS.length ? MAILS : null, caught_at: new Date().toISOString() }
  };
  const { error } = await sb.from('eg_leads').insert(row);
  if(error){
    go.disabled = false; go.textContent = '담기';
    $('#err').textContent = /duplicate|unique/i.test(error.message) ? '이미 담긴 분입니다.' : '담지 못했습니다 — ' + error.message;
    return;
  }
  const n = await countOn(wd.d);
  $('#main').innerHTML = `<div class="note ok">담았습니다 ✓ — ${dayLabel(wd.d)} 몫</div><div style="margin-top:12px">${bar30(n, wd.d)}</div>`;
  setTimeout(() => window.close(), n >= DAILY ? 2200 : 1300);
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') window.close();
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); requestSave(); }
});

boot();
</script>
</body>
</html>
