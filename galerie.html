<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>르 그랑 투르 — 미술관</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
 *  galerie.html v1.0 — 0804 · 르 그랑 투르 미술관
 *
 *  2뷰: 정문(gate 16:9 · 밤낮 4벌) → [암전] → 전시실(hall 9:16 · 밤낮 4벌)
 *  그림: tour-assets/galerie/{code}_gate_{m|d|e|n}.webp · {code}_hall_{m|d|e|n}.webp
 *  관:   terra_pins (kind='heritage') — 좌표·카메라·museum_no·frame_rect 한 행에
 *  작품: heritage_items (category='visual') — id 오름차순이 배열의 축
 *
 *  도장(0805): 오늘의 관에서만 체류 — gal_{code} · 각인 = 작품명 · 연도
 *              오늘의 관이 아니면 입국(peregrinatio)으로 물러난다
 *
 *  ⚠ 로테이션 공식은 admin_galerie_assets.html과 반드시 같아야 한다.
 *      그림 = 배열[ (KST날수 + floor(museum_no × N ÷ H)) mod N ]
 *      당번 = 명단[ KST날수 mod H ]            ← terra.html galerieGate()와 형제
 *    한쪽만 고치면 콘솔이 거짓말을 한다. (음악관은 세 곳 — 함정 M)
 *
 *  ⚠ 방은 폭 100%. 작품은 벽의 절반. 디테일은 팝업(0804 소로 결정).
 *    가로 화면에서 방 좌우를 자르는 것 절대 금지.
 * ============================================================ */
:root{--gold:#c9a24a;--gold-l:#e9cf9c;--ink:#2E4A7A;}
*{margin:0;padding:0;box-sizing:border-box;}
/* 0805 소로 — 스크롤바는 어디에도 두지 않는다. 굴러가되 보이지 않는다 */
*{scrollbar-width:none;-ms-overflow-style:none;}
*::-webkit-scrollbar{width:0;height:0;display:none;}
html,body{height:100%;background:#0d0a07;color:#e8ddc4;
  font-family:'Gowun Batang',serif;overflow:hidden;}

.view{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .6s;}
.view.on{opacity:1;pointer-events:auto;}

/* ── 정문 ── */
#gate{background:#000 center/cover no-repeat;display:grid;place-items:end center;
  padding-bottom:max(7vh,54px);cursor:pointer;}
#gateHead{position:absolute;left:0;right:0;top:clamp(16px,4vh,44px);text-align:center;
  text-shadow:0 2px 18px rgba(0,0,0,.65);}
#gateHead .g-eyebrow{font-family:'Cormorant Garamond',serif;font-size:clamp(10px,1.3vw,12px);
  letter-spacing:.34em;color:rgba(233,207,156,.85);}
#gateHead .g-name{font-size:clamp(19px,3vw,27px);color:#f5efdd;margin-top:9px;letter-spacing:.05em;}
#gateHead .g-city{font-family:'Cormorant Garamond',serif;font-size:clamp(10px,1.2vw,12px);
  letter-spacing:.28em;color:rgba(232,221,196,.62);margin-top:7px;}
#enterBtn{font:inherit;font-size:13.5px;letter-spacing:.2em;color:#f0e8d4;
  background:rgba(10,8,5,.52);border:1px solid rgba(233,207,156,.65);border-radius:26px;
  padding:13px 34px;cursor:pointer;backdrop-filter:blur(3px);transition:all .3s;}
#enterBtn:hover{background:rgba(201,162,74,.28);}

/* ── 암전 ── */
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;
  transition:opacity 1s;z-index:20;}
#fade.on{opacity:1;}

/* ── 전시실 ── */
#hall{background:#000;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;}
#hall::-webkit-scrollbar{display:none;}
#hallFit{position:relative;margin:0 auto;}
#hallImg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;}

/* 작품 — 액자 상자 안에 contain */
#frame{position:absolute;display:grid;place-items:center;}
/* ⚠ 0804 실전에서 잡은 병 — 작품 webp는 금박 액자·명패까지 구워진 채 둘레가 투명하다.
   셸이 바탕·테두리를 얹으면 투명이 까맣게 메워진다(이중 액자). 셸은 아무것도 입히지 않는다.
   그림자만 drop-shadow로 — box-shadow와 달리 알파 윤곽(액자 모양)을 따라간다. */
#artImg{max-width:100%;max-height:100%;display:block;cursor:zoom-in;
  filter:drop-shadow(0 10px 30px rgba(0,0,0,.5)) drop-shadow(0 2px 8px rgba(0,0,0,.4));}
#artImg.noart{display:none;}

/* 명패 — 액자 아래 */
/* 명패 — 벽에 새긴 맨글씨 (0804 소로: 「벽에 새기면 근사」 — 칩 안을 물림).
   흰 벽(시카고·우피치)은 meta.plaque_ink='dark'로 먹색 새김. 누르면 4겹이 열린다. */
#plaque{position:absolute;text-align:center;transform:translateX(-50%);
  white-space:nowrap;cursor:pointer;pointer-events:auto;
  text-shadow:0 1px 3px rgba(0,0,0,.35);}
#plaque .p-name{font-size:clamp(12.5px,1.5vw,15px);color:#f2ead6;letter-spacing:.04em;}
#plaque .p-artist{font-family:'Cormorant Garamond',serif;font-size:clamp(10px,1.2vw,12px);
  letter-spacing:.16em;color:rgba(232,221,196,.72);margin-top:5px;}
#plaque .p-rent{font-size:clamp(10.5px,1.2vw,12px);margin-top:8px;letter-spacing:.08em;
  color:rgba(233,207,156,.85);}
#plaque.dark{text-shadow:0 1px 2px rgba(255,255,255,.3);}
#plaque.dark .p-name{color:#2a2318;}
#plaque.dark .p-artist{color:rgba(42,35,24,.62);}
#plaque.dark .p-rent{color:rgba(122,90,26,.9);}

/* ── 4겹 시트 (구 heritage.html 승계) ── */
/* 0805 소로 — 화면 가운데 시트를 폐기하고 terra #story 문법(우측 도킹)으로 옮긴다.
   전시실은 뒤에서 아웃포커싱된다. display 토글이면 미끄러짐이 안 보이므로
   visibility+opacity로 갈았다 — display:none은 transition을 통째로 삼킨다. */
#layers{position:fixed;inset:0;z-index:45;
  background:rgba(4,3,2,.34);backdrop-filter:blur(9px) saturate(.85);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .4s ease, visibility 0s linear .4s;}
#layers.on{opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .4s ease, visibility 0s;}
.sheet{position:absolute;top:0;right:0;bottom:0;
  width:min(430px,92vw);overflow-y:auto;
  background:linear-gradient(to left,#f6efdd,#f2e9d2);color:#2a2318;
  border-left:1px solid rgba(122,90,26,.35);box-shadow:-14px 0 44px rgba(0,0,0,.45);
  padding:58px 30px calc(44px + env(safe-area-inset-bottom));
  transform:translateX(100%);transition:transform .55s cubic-bezier(.22,.61,.36,1);}
#layers.on .sheet{transform:none;}
.sheet-close{position:absolute;top:16px;right:18px;width:30px;height:30px;
  border:0;border-radius:50%;background:rgba(122,90,26,.12);color:rgba(42,35,24,.6);
  font-size:17px;line-height:1;cursor:pointer;transition:color .2s,background .2s;}
.sheet-close:hover{color:#2a2318;background:rgba(122,90,26,.24);}
.sheet-eyebrow{font-family:'Cormorant Garamond',serif;font-size:10.5px;letter-spacing:.3em;
  color:rgba(122,90,26,.85);text-align:center;}
.sheet-title{font-size:17px;font-weight:700;text-align:center;margin-top:9px;line-height:1.5;}
.sheet-sub{font-size:12px;color:rgba(42,35,24,.6);text-align:center;margin-top:5px;}
.layer-block{margin-top:20px;}
.layer-tag{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.24em;
  color:rgba(122,90,26,.9);margin-bottom:8px;}
.layer-text{font-size:13.5px;line-height:2.0;color:#3a3226;word-break:keep-all;}
.layer-divider{height:1px;background:rgba(122,90,26,.18);margin:20px 0 0;}
.cur-links{margin-top:22px;padding-top:16px;border-top:1px solid rgba(122,90,26,.22);}
.cur-links a{display:block;font-size:12.5px;color:#7a5a1a;text-decoration:none;
  padding:7px 0;line-height:1.7;}
.cur-links a:hover{text-decoration:underline;}
.sheet-btn{display:block;margin:24px auto 0;font:inherit;font-size:12px;letter-spacing:.1em;
  color:rgba(42,35,24,.7);background:none;border:1px solid rgba(122,90,26,.4);
  border-radius:20px;padding:9px 26px;cursor:pointer;}

/* ── 대여 확인 팝업 ── */
#rentPop{position:fixed;inset:0;z-index:46;display:none;place-items:center;
  background:rgba(4,3,2,.6);backdrop-filter:blur(3px);}
#rentPop.on{display:grid;}
.rp-box{width:min(92vw,420px);background:#f6efdd;color:#2a2318;border-radius:18px;
  padding:26px 24px;text-align:center;}
.rp-t{font-size:15px;font-weight:700;line-height:1.7;}
.rp-s{font-size:12.5px;color:rgba(42,35,24,.65);margin-top:12px;line-height:1.9;word-break:keep-all;}
.rp-btns{display:flex;gap:10px;justify-content:center;margin-top:22px;}
.rp-btns button{font:inherit;font-size:12.5px;letter-spacing:.06em;border-radius:18px;
  padding:10px 22px;cursor:pointer;border:none;}
.rp-go{background:var(--ink);color:#f2f0ea;}
.rp-no{background:none;border:1px solid rgba(122,90,26,.4);color:rgba(42,35,24,.7);}

#hallHead{position:absolute;left:0;right:0;top:clamp(14px,3.2vh,34px);text-align:center;
  pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.6);z-index:5;}
#hallHead .h-name{font-family:'Cormorant Garamond',serif;font-size:clamp(10px,1.3vw,12px);
  letter-spacing:.3em;color:rgba(233,207,156,.78);}

/* 뒤로 */
#backBtn{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top));z-index:25;
  font:inherit;font-size:11.5px;letter-spacing:.12em;color:rgba(240,232,212,.82);
  background:rgba(10,8,5,.5);border:1px solid rgba(233,207,156,.4);border-radius:20px;
  padding:8px 15px;cursor:pointer;backdrop-filter:blur(3px);display:none;}
/* ⚠ 0804 규칙 3 — 나가기 버튼은 지구가 그린다. iframe 안이면 셸은 손을 뗀다.
   (0805: 좌상단 「← 지구로」가 지구의 우상단 「× 지구로 돌아가기」와 겹쳐 둘이 됐다) */
body.standalone .view.on ~ #backBtn{display:block;}

/* ── 줌 팝업 — 디테일은 여기서 (0804 소로) ── */
#zoom{position:fixed;inset:0;z-index:40;display:none;place-items:center;
  background:rgba(4,3,2,.95);backdrop-filter:blur(6px);cursor:zoom-out;}
#zoom.on{display:grid;}
#zoomImg{max-width:96vw;max-height:88vh;display:block;box-shadow:0 20px 80px rgba(0,0,0,.8);}
#zoomCap{position:fixed;left:0;right:0;bottom:max(20px, env(safe-area-inset-bottom));
  text-align:center;font-size:12.5px;color:rgba(232,221,196,.75);letter-spacing:.06em;
  text-shadow:0 1px 8px #000;pointer-events:none;line-height:1.8;}

/* ── ✎ 편집 (살롱지기) ── */
#editToggle{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;
  font:inherit;font-size:11px;letter-spacing:.1em;color:rgba(233,207,156,.85);
  background:rgba(10,8,5,.55);border:1px solid rgba(233,207,156,.4);border-radius:18px;
  padding:8px 14px;cursor:pointer;display:none;}
#editToggle.show{display:block;}
#frame.editing{outline:2px dashed rgba(233,207,156,.9);outline-offset:2px;cursor:move;}
/* 명패도 따로 끌어 옮긴다(0805) — 액자와 다른 색 점선이라 무엇을 잡았는지 헷갈리지 않는다 */
#plaque.editing{outline:2px dashed rgba(127,179,213,.95);outline-offset:6px;
  border-radius:6px;cursor:move;}
#frame.editing #artImg{cursor:move;}
.ehandle{position:absolute;width:16px;height:16px;right:-9px;bottom:-9px;
  border:2px solid var(--gold-l);background:rgba(10,8,5,.8);border-radius:4px;
  cursor:nwse-resize;display:none;}
#frame.editing .ehandle{display:block;}
#editBar{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom));z-index:31;display:none;gap:9px;}
#editBar.show{display:flex;}
#editBar .btn{font:inherit;font-size:11.5px;letter-spacing:.06em;color:#f2f0ea;
  background:var(--ink);border:none;border-radius:16px;padding:9px 16px;cursor:pointer;}
#editBar .btn.ghost{background:rgba(10,8,5,.6);border:1px solid rgba(233,207,156,.5);
  color:rgba(233,207,156,.9);}
#editInfo{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(64px + env(safe-area-inset-bottom));z-index:31;display:none;
  font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.12em;
  color:rgba(233,207,156,.7);background:rgba(10,8,5,.6);border-radius:12px;padding:7px 15px;
  text-align:center;line-height:1.85;}
#editInfo.show{display:block;}

#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:60;
  background:rgba(240,232,212,.94);color:#241a10;font-size:12.5px;
  padding:10px 20px;border-radius:22px;opacity:0;pointer-events:none;
  transition:opacity .3s;max-width:88vw;text-align:center;}
#toast.show{opacity:1;}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;
  font-size:13px;line-height:2.2;color:rgba(232,221,196,.75);padding:24px;}
</style>
</head>
<body>

<div id="gate" class="view">
  <div id="gateHead">

<script>
const SUPA_URL='https://cyhlotwdisjvoxvfkpnd.supabase.co';
const SUPA_KEY='sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
const supa=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{storageKey:'eungyo-auth'}});
const BUCKET='tour-assets';
const asset=(code,slot)=>`${SUPA_URL}/storage/v1/object/public/${BUCKET}/galerie/${code}_${slot}.webp`;
const HALL_RATIO=941/1672;                     /* 방 그림 가로/세로 (9:16) */
const $=s=>document.querySelector(s);
console.log("%c[EG] galerie v1.6 · 0805 명패 분리 · 우측 도킹 4겹 · 나가기 단일화", "color:#c9a24a");

const qs=new URLSearchParams(location.search);
const CODE=qs.get('code')||'orsay';

/* HALLS — 관 전체 명단. 당번 판정이 boot() 밖(stampHere)에서 필요해 전역으로 올렸다.
   ⚠ active로 거르지 않는다. terra.html의 loadGalerieHallsAll()이 잠든 관까지 싣고
     그 길이로 나머지를 구하므로, 여기서 걸러내면 당번이 타륜과 어긋난다. */
let HALL=null, HALLS=null, ART=null, RECT=null, RECT0=null, moved=false, IS_ADMIN=false, UID=null, MY_RENT=null;
let PLQ=null, PLQ0=null;          /* 명패 좌표 {X:가운데%, Y:윗변%} · null이면 액자를 따라간다 */

/* ── 시각 — egSky 한 벌. 없으면 낮 (함정 F: 시각은 새로 재지 마라) ── */
function phase(){
  try{ return (window.egSky && egSky.phase) ? egSky.phase() : 'd'; }
  catch(e){ return 'd'; }
}
/* KST 날수 — admin_galerie_assets.html과 같은 눈금이어야 한다 */
function kstDay(){ return Math.floor((Date.now() + 9*3600*1000) / 86400000); }

/* ── 로테이션 — 콘솔과 동일 공식 ── */
function todaysArt(arts, museumNo, museumCount){
  const N=arts.length, H=Math.max(museumCount,1);
  if(!N) return null;
  const offset=Math.floor(museumNo * N / H);
  return arts[ ((kstDay() + offset) % N + N) % N ];
}

/* ── 0805. 입국이 먼저다 (결정문 7호) ──
   ⚠ 이 겹이 없어서 오늘 사고가 났다. 오늘의 관에 처음 들어간 손님이 체류부터 받아
     daily_per_area를 써버렸고, 강 건너 다른 관에 가니 입국이 새어 나왔다.
     하루 두 장이 되어 2호를 건드리고, 오르세는 안 되고 루브르는 되는 세관이 된다.
   ⚠⚠ 막지 않는 경우 둘 — 손님이 아닐 때, 그 우주에 **구워진** 입국 판이 없을 때.
     둘 다 막아버리면 아무것도 안 나타난다. 폴백은 조건부가 아니라 기본값(함정 AE).
   ⚠ 판 코드를 'per_intrare'로 박지 않는다. area+family로 찾는다 — 코드가 바뀌어도 산다.
     art_url 조건은 부품 findKind와 똑같이 맞춘다. 어긋나면 여기서는 있다 하고
     부품은 없다 하여 손님 화면이 통째로 빈다.                                      */
async function intrareDone(area){
  try{
    const { data:{ user } } = await supa.auth.getUser();
    if(!user) return true;                       /* 손님이 아니면 어차피 안 찍힌다 */
    const { data:ks } = await supa.from('stamp_kinds')
      .select('code').eq('area', area).eq('family','intrare')
      .eq('active', true).not('art_url','is',null).limit(1);
    const code = ks && ks[0] && ks[0].code;
    if(!code) return true;                       /* 구운 입국 판이 없으면 막지 않는다 */
    const { count } = await supa.from('stamps')
      .select('id', { count:'exact', head:true })
      .eq('user_id', user.id).eq('kind_code', code);
    return !!count;
  }catch(e){ console.warn('[EG] 입국 확인 실패 — 막지 않습니다:', e); return true; }
}

/* ── 0805. 체류 도장 — 알베르게 원칙(몸통은 곳의 얼굴, 각인은 그날의 것) ──
   ⚠⚠ 당번 공식은 terra.html의 galerieGate()와 **같은 것이다.** 관 목록을 sort 차례로
     세우고 날수로 나눈 나머지. 한 곳만 고치면 타륜은 오르세라 적고 도장은 루브르에서
     나온다. 로테이션 공식이 사는 곳이 이제 여섯이므로 관을 늘릴 때 전수 grep 후 함께 고칠 것.
   ⭐ 다섯 관은 매일 다 열려 있지만 도장은 오늘의 관 한 곳에서만 놓인다. 다른 넷에
     들어가도 아무 일이 안 일어나고, 그래서 하루에 다섯 장을 딸 수 없다(결정문 3호).
   ⚠ 도장 자체도 daily_per_area라 그날 미술관에서 한 장이 끝이다. 문지기가 둘인 셈이나
     하나는 「어느 관인가」를, 하나는 「몇 장인가」를 지키므로 하는 일이 다르다.       */
function stampHere(){
  if(!window.EGStamp) return;
  const hs = HALLS || [];
  const opt = { supa: supa, area:'peregrinatio', bottom: 96 };
  /* 입국을 아직 안 받았으면 kind를 안 준다 → 부품이 입국을 찾는다. 체류는 내일부터(7호) */
  intrareDone('peregrinatio').then(done=>{
    if(done && hs.length && HALL){
      const duty = hs[ ((kstDay() % hs.length) + hs.length) % hs.length ];
      if(duty && duty.code === HALL.code && ART){
        opt.kind = 'gal_' + HALL.code;
        opt.subject = HALL.code;
        /* 각인은 찍는 순간 복사해 둔다(15호) — 내일 그림이 바뀌어도 이 도장은 오늘 그림이다.
           ⚠ 화가를 앞에 안 붙인다 — 벽의 새김 명패가 이미 「작품명 · 화가」를 말하고 있어
             두 번 적힌다. 음악관이 곡명에서 정한 것과 같은 문법(0805).
           ⚠ 연도는 heritage_items.period. 비면 작품명만 앉는다 — 폴백이 기본값(함정 AE). */
        const yr = String(ART.period || '').trim();
        opt.inscription = (ART.name || '') + (yr ? ' · ' + yr : '');
      }
    }
    /* 오늘의 관이 아니면 kind를 안 준다 → 부품이 그 우주의 입국 도장을 찾는다.
       아직 안 받았으면 입국이 놓이고, 이미 받았으면 아무것도 안 나타난다(3호). */
    EGStamp.offer(opt);
  });
}

/* 그림 후보를 차례로 걸어 본다 — 저녁이 없으면 낮으로 */
function bgChain(el, cands, asImg){
  const step=i=>{
    if(i>=cands.length) return;
    const im=new Image();
    im.onload=()=>{ asImg ? el.src=im.src : el.style.backgroundImage=`url(${im.src})`; };
    im.onerror=()=>step(i+1);
    im.src=cands[i];
  };
  step(0);
}

function fail(msg){
  $('#err').style.display='grid';
  $('#err').innerHTML=msg;
}

async function boot(){
  /* 지구 안(iframe)이면 나가기 버튼을 그리지 않는다 — 지구가 이미 하나 그려뒀다 */
  if(window.top === window.self) document.body.classList.add('standalone');

  const { data:halls, error:he } = await supa.from('terra_pins')
    .select('code,name,city,active,meta').eq('kind','heritage').order('sort');
  if(he || !halls || !halls.length) return fail('미술관 목록을 불러오지 못했습니다.<br>잠시 뒤 다시 들러 주세요.');
  HALL = halls.find(h=>h.code===CODE) || halls[0];
  HALLS = halls;                                  /* 당번 판정용 — stampHere가 쓴다 */
  const H = halls.length;
  const no = (HALL.meta && HALL.meta.museum_no != null) ? HALL.meta.museum_no : 0;

  const { data:arts, error:ae } = await supa.from('heritage_items')
    .select('id,name,artist,period,img,ratio,status,layers,curation_links')
    .eq('category','visual').eq('status','active').order('id');
  if(ae || !arts || !arts.length) return fail('걸 그림을 불러오지 못했습니다.');
  ART = todaysArt(arts, no, H);

  RECT = (HALL.meta && HALL.meta.frame_rect) || {L:25,T:38,W:50,H:24};
  RECT0 = {...RECT};
  /* 명패는 이제 액자와 다른 물건이다(0805). meta.plaque_pos가 없으면 옛 방식대로
     액자 밑에 따라붙고, 한 번 끌어 옮기는 순간부터 제 좌표로 산다. */
  PLQ  = (HALL.meta && HALL.meta.plaque_pos) ? {...HALL.meta.plaque_pos} : null;
  PLQ0 = PLQ ? {...PLQ} : null;

  /* 정문 */
  const t=phase();
  bgChain($('#gate'), [asset(HALL.code,'gate_'+t), asset(HALL.code,'gate_d')], false);
  $('#gName').textContent = HALL.name;
  $('#gCity').textContent = ((HALL.meta&&HALL.meta.city_en)||'') +
    ((HALL.meta&&HALL.meta.country)? ' · '+HALL.meta.country : '');
  $('#hName').textContent = (HALL.meta&&HALL.meta.name_en) || HALL.name;

  /* 전시실 — 실내도 밤낮 4벌 (음악관과 다른 곳) */
  bgChain($('#hallImg'), [asset(HALL.code,'hall_'+t), asset(HALL.code,'hall_d')], true);
  hangArt();

  $('#gate').classList.add('on');
  $('#enterBtn').addEventListener('click', enterHall);
  $('#gate').addEventListener('click', e=>{ if(e.target.id==='gate') enterHall(); });

  /* 살롱지기면 편집 단추 · 내 거실 상태 */
  const { data:{ user } } = await supa.auth.getUser();
  if(user){
    UID=user.id;
    const { data:u } = await supa.from('users').select('is_admin').eq('id',user.id).single();
    if(u && u.is_admin){ IS_ADMIN=true; $('#editToggle').classList.add('show'); }
    await loadMyRent();
    paintRentLine();
  }
}
/* 내 거실의 미술 1점 — 교체식이므로 살아 있는 것은 최대 하나다 */
async function loadMyRent(){
  if(!UID){ MY_RENT=null; return; }
  const { data } = await supa.from('heritage_rentals')
    .select('item_id, heritage_items!inner(name,category)')
    .eq('user_id',UID).is('returned_at',null)
    .eq('heritage_items.category','visual')
    .order('created_at',{ascending:false}).limit(1);   /* ⚠ 칼럼 실측: rented_at 아님 */
  MY_RENT = (data && data[0]) ? { item_id:data[0].item_id, name:data[0].heritage_items.name } : null;
}

/* ── 작품 걸기 ── */
function applyRect(){
  const f=$('#frame');
  f.style.left=RECT.L+'%'; f.style.top=RECT.T+'%';
  f.style.width=RECT.W+'%'; f.style.height=RECT.H+'%';
  placePlaque();
}
function placePlaque(){
  const p=$('#plaque');
  const x = PLQ ? PLQ.X : (RECT.L+RECT.W/2);
  const y = PLQ ? PLQ.Y : (RECT.T+RECT.H+1.6);
  p.style.left=x+'%';
  p.style.top=y+'%';
}
function hangArt(){
  applyRect();
  /* 흰 벽 관은 먹색 새김 (meta.plaque_ink='dark') */
  $('#plaque').classList.toggle('dark', !!(HALL.meta && HALL.meta.plaque_ink==='dark'));
  const im=$('#artImg');
  if(ART && ART.img){
    im.classList.remove('noart');
    im.src=ART.img;
    im.onclick=openZoom;
    $('#pName').textContent=ART.name||'';
    $('#pArtist').textContent=(ART.artist||'')+(ART.period?' · '+ART.period:'');
  }else{
    im.classList.add('noart');
    $('#pName').textContent=ART?ART.name:'';
    $('#pArtist').textContent='그림이 아직 도착하지 않았습니다';
  }
  paintRentLine();
}
/* 대여 줄 — 값은 온도 모델(art_price RPC)이 정한다. 소수 둘째 자리.
   순위가 아니다: 작품끼리 비교하지 않고 각자 제 대여 이력만으로 제 온도를 갖는다.
   대여 = 장작 · 반감기 14일 · 1.00 × 1.35^온도 · 바닥 1.00 천장 8.00 */
let ART_PRICE=null;
async function paintRentLine(){
  const el=$('#pRent'); if(!ART){ el.textContent=''; return; }
  if(MY_RENT && MY_RENT.item_id===ART.id){ el.textContent='🍎 거실에 걸려 있음'; return; }
  if(ART_PRICE==null){
    const { data } = await supa.rpc('art_price', { p_item_id: ART.id });
    ART_PRICE = (data!=null) ? Number(data) : 1;
  }
  el.textContent='🍎 '+ART_PRICE.toFixed(2)+'알로 거실에 들이기';
}

/* ── 입장 — 암전 뒤 카메라가 천장에서 내려온다 ── */
function enterHall(){
  if(moved) return; moved=true;
  $('#fade').classList.add('on');
  setTimeout(()=>{
    $('#gate').classList.remove('on');
    $('#hall').classList.add('on');

    const opts={ box:'#hall', fit:'#hallFit', ratio:HALL_RATIO, rect:RECT,
      onDone(){
        /* 도장은 카메라가 안착한 뒤에(9-1) — 도는 동안 뜨면 흐름이 끊긴다.
           ⚠ area는 DB 실측 'peregrinatio' — 0804에 'pergrinatio' 오타로 낼 뻔했다 */
        stampHere();
      }};

    /* 폰(세로 화면)은 스크롤 길이가 0이라 카메라가 헛돈다 — 바로 앉힌다 */
    const scrollable = (innerWidth/innerHeight) >= HALL_RATIO;
    setTimeout(()=>$('#fade').classList.remove('on'), 60);
    if(scrollable && window.EGCamera) EGCamera.enter(opts);
    else if(window.EGCamera) EGCamera.settle(opts);
    else stampHere();          /* 카메라 부품이 안 실렸어도 도장은 놓는다(함정 AE) */
  }, 1050);
}
addEventListener('resize', ()=>{ if(window.EGCamera) EGCamera.relayout(); });

function goBack(){ location.href='terra.html'; }

/* ── 줌 팝업 ── */
function openZoom(){
  if(!ART || !ART.img) return;
  $('#zoomImg').src=ART.img;
  $('#zoomCap').innerHTML=`${escapeHtml(ART.name)}<br><span style="opacity:.6">${escapeHtml(ART.artist||'')}${ART.period?' · '+escapeHtml(ART.period):''}</span>`;
  $('#zoom').classList.add('on');
}
function closeZoom(){ $('#zoom').classList.remove('on'); $('#zoomImg').src=''; }
addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeZoom(); if(editing) toggleEdit(); } });
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ══ 4겹 시트 — 구 heritage.html openArtLayers 승계 ══ */
const LAYER_LABELS={scene:'장면',knowledge:'앎',thought:'생각',connection:'이어짐',curation:'큐레이션'};
function mdLite(t){
  return escapeHtml(t)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\n/g,'<br>');
}
function openLayers(){
  if(editing) return;          /* 맞추는 중에는 잡는 손이지 읽는 손이 아니다 */
  if(!ART) return;
  const src=ART.layers;
  if(!src){ toast('이 작품의 4겹은 준비 중이에요'); return; }
  $('#shTitle').textContent=ART.name||'';
  $('#shSub').textContent=(ART.artist||'')+(ART.period?' · '+ART.period:'');
  const order=['scene','knowledge','thought','connection','curation'];
  const keys=[...order.filter(k=>src[k]), ...Object.keys(src).filter(k=>!order.includes(k))];
  let html=keys.map((k,i)=>
    (i? '<div class="layer-divider"></div>':'')
    + `<div class="layer-block"><div class="layer-tag">${LAYER_LABELS[k]||escapeHtml(k)}</div>`
    + `<div class="layer-text">${mdLite(src[k])}</div></div>`).join('');
  const links=ART.curation_links;
  if(Array.isArray(links) && links.length){
    html+='<div class="cur-links">'+links.map(l=>
      `<a href="${escapeHtml(l.url||'#')}" target="_blank" rel="noopener">↗ ${escapeHtml(l.title||l.url||'')}</a>`).join('')+'</div>';
  }
  $('#shBody').innerHTML=html;
  $('#layers').classList.add('on');
}
function closeLayers(){ $('#layers').classList.remove('on'); }

/* ══ 대여 — 교체식. RPC(rent_item)가 반납·차감·대여를 한 트랜잭션으로 ══ */
function askRent(){
  if(editing) return;
  if(!ART) return;
  if(!UID){ toast('입장 후 빌릴 수 있습니다'); return; }
  if(MY_RENT && MY_RENT.item_id===ART.id){ toast('이미 거실에 걸려 있습니다'); return; }
  const price=(ART_PRICE!=null?ART_PRICE:1).toFixed(2);
  $('#rpT').textContent='〈'+ART.name+'〉을 거실에 들일까요?';
  $('#rpS').innerHTML=(MY_RENT
      ? '지금 거실의 〈'+escapeHtml(MY_RENT.name)+'〉은 미술관으로 돌아갑니다.<br>'
      : '분더카머 1층 거실에 걸립니다.<br>')
    + '황금사과 <b>'+price+'알</b>이 듭니다.';
  $('#rpGo').textContent='🍎 '+price+'알로 들이기';
  $('#rentPop').classList.add('on');
}
function closeRent(){ $('#rentPop').classList.remove('on'); }
async function confirmRent(){
  closeRent();
  const nick=localStorage.getItem('eg_nickname')||'';
  const { data, error } = await supa.rpc('rent_item',
    { p_item_id:ART.id, p_user_id:UID, p_nickname:nick });
  if(error){ toast(error.message||'대여하지 못했습니다'); return; }
  const old=data && data.swapped_out;
  const paid=(data && data.price!=null)?Number(data.price).toFixed(2):'';
  toast(old
    ? '〈'+old+'〉이 돌아가고 〈'+(data.name||ART.name)+'〉이 거실에 걸립니다 🍎'+paid
    : '〈'+(data.name||ART.name)+'〉이 분더카머로 떠납니다 🍎'+paid);
  ART_PRICE=null;                        /* 방금의 대여가 장작이다 — 값을 다시 잰다 */
  await loadMyRent(); await paintRentLine();
}

/* ══ ✎ 액자 맞추기 — 화면에서 끌어 옮기고 모서리로 키운다 ══
   저장은 terra_pins.meta.frame_rect 한 줄. 관 단위다(작품 단위 예외는 art_layout, 추후). */
let editing=false;
function toggleEdit(){
  if(!IS_ADMIN) return;
  editing=!editing;
  $('#frame').classList.toggle('editing', editing);
  $('#plaque').classList.toggle('editing', editing);
  $('#editBar').classList.toggle('show', editing);
  $('#editInfo').classList.toggle('show', editing);
  $('#editToggle').textContent = editing ? '✎ 맞추는 중' : '✎ 액자·명패 맞추기';
  if(editing) paintInfo();
}
function paintInfo(){
  const x = PLQ ? PLQ.X : (RECT.L+RECT.W/2);
  const y = PLQ ? PLQ.Y : (RECT.T+RECT.H+1.6);
  $('#editInfo').innerHTML =
    `액자 &nbsp;L ${RECT.L.toFixed(2)} · T ${RECT.T.toFixed(2)} · W ${RECT.W.toFixed(2)} · H ${RECT.H.toFixed(2)}`
    + `<br>명패 &nbsp;X ${x.toFixed(2)} · Y ${y.toFixed(2)}${PLQ?'':'  (액자를 따라가는 중)'}`;
}
function fitH(){ return $('#hallFit').getBoundingClientRect(); }

/* 끌기 — 포인터 하나로 폰·마우스 다 받는다 */
(function(){
  const f=$('#frame'); let drag=null;
  f.addEventListener('pointerdown', e=>{
    if(!editing) return;
    if(e.target.id==='eHandle') return;
    e.preventDefault(); f.setPointerCapture(e.pointerId);
    drag={x:e.clientX,y:e.clientY,L:RECT.L,T:RECT.T};
  });
  f.addEventListener('pointermove', e=>{
    if(!editing||!drag) return;
    const r=fitH();
    RECT.L=Math.min(100-RECT.W, Math.max(0, drag.L+(e.clientX-drag.x)/r.width*100));
    RECT.T=Math.min(100-RECT.H, Math.max(0, drag.T+(e.clientY-drag.y)/r.height*100));
    applyRect(); paintInfo();
  });
  f.addEventListener('pointerup', ()=>{ drag=null; });

  const h=$('#eHandle'); let rs=null;
  h.addEventListener('pointerdown', e=>{
    if(!editing) return;
    e.preventDefault(); e.stopPropagation(); h.setPointerCapture(e.pointerId);
    rs={x:e.clientX,y:e.clientY,W:RECT.W,H:RECT.H};
  });
  h.addEventListener('pointermove', e=>{
    if(!editing||!rs) return;
    const r=fitH();
    RECT.W=Math.min(100-RECT.L, Math.max(8, rs.W+(e.clientX-rs.x)/r.width*100));
    RECT.H=Math.min(100-RECT.T, Math.max(6, rs.H+(e.clientY-rs.y)/r.height*100));
    applyRect(); paintInfo();
  });
  h.addEventListener('pointerup', ()=>{ rs=null; });

  /* 명패 끌기 — 액자와 완전히 갈라진 물건이다(0805 소로).
     ⚠ 잡는 순간 PLQ가 생기고, 그때부터 액자를 움직여도 명패는 그대로 있다. */
  const q=$('#plaque'); let pd=null;
  q.addEventListener('pointerdown', e=>{
    if(!editing) return;
    e.preventDefault(); e.stopPropagation(); q.setPointerCapture(e.pointerId);
    if(!PLQ) PLQ={ X:RECT.L+RECT.W/2, Y:RECT.T+RECT.H+1.6 };
    pd={x:e.clientX,y:e.clientY,X:PLQ.X,Y:PLQ.Y};
  });
  q.addEventListener('pointermove', e=>{
    if(!editing||!pd) return;
    const r=fitH();
    PLQ.X=Math.min(100, Math.max(0, pd.X+(e.clientX-pd.x)/r.width*100));
    PLQ.Y=Math.min(99,  Math.max(0, pd.Y+(e.clientY-pd.y)/r.height*100));
    placePlaque(); paintInfo();
  });
  q.addEventListener('pointerup', ()=>{ pd=null; });
})();

async function saveRect(){
  const rect={L:+RECT.L.toFixed(2), T:+RECT.T.toFixed(2), W:+RECT.W.toFixed(2), H:+RECT.H.toFixed(2)};
  const meta=Object.assign({}, HALL.meta||{}, { frame_rect: rect });
  /* 명패를 한 번도 안 옮겼으면 칸을 만들지 않는다 — 옛 방식(액자 따라가기)이 그대로 산다 */
  if(PLQ) meta.plaque_pos = { X:+PLQ.X.toFixed(2), Y:+PLQ.Y.toFixed(2) };
  const { error } = await supa.from('terra_pins').update({ meta }).eq('kind','heritage').eq('code',HALL.code);
  if(error){ toast('저장 실패: '+error.message); return; }
  /* ⚠ 쓰고 나서 되읽어 확인 — 「잘 됐겠지」 금지 */
  const { data:chk } = await supa.from('terra_pins').select('meta').eq('kind','heritage').eq('code',HALL.code).single();
  const got=chk && chk.meta && chk.meta.frame_rect;
  if(got && Math.abs(got.L-rect.L)<0.01){
    HALL.meta=chk.meta; RECT0={...rect}; PLQ0 = PLQ ? {...PLQ} : null;
    toast('저장했습니다 ✔ 이 관의 모든 그림이 이 곳에 걸립니다');
  }else toast('저장은 했으나 확인이 어긋납니다 — 새로고침해 보세요');
}
function resetRect(){
  RECT={...RECT0}; PLQ = PLQ0 ? {...PLQ0} : null;
  applyRect(); paintInfo();
}
function toast(m){ const t=$('#toast'); t.textContent=m;
  t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),3200); }

boot();
</script>
