<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>에펠탑 각인 시험 · 셋째 판</title>
<!-- 1104 파이스 — 탐험대 에펠탑 셋째 판. 「각인」 하나에 맞춘 판.
     1031 둘째 판에서 바뀐 것
       ① 카메라가 풀렸다 — 끌면 탑을 돌고, 휠(두 손가락)로 바짝 다가간다
       ② 1층 아래 띠 「EG유니버스 탐험대원」을 탑의 네 면에 실제로 붙였다 — 탑이 돌면 글자도 면과 함께 돈다
       ③ 단계 셋 — 공고 날(이름 없음) · 출항 뒤(이름이 불 없이 새겨짐) · 귀환 전야(불이 켜짐 + 폴라리스)
          (1103 오전 결정문 §2 「출항하는 날 새기고, 귀환하는 밤 불을 켠다」)
       ④ 좌표 조절판 — 소로가 눈으로 맞추고 그 자리에서 「확정」 → eg_settings 'eiffel_tune' 한 줄에 박힌다
          (1104 소로 「복사 → 전달이 아니고, 내가 그 자리에서 옮겨서 붙이고 확정」)
          다음에 열면 확정한 값으로 선다 · 확정은 살롱지기만(eg_settings 정책 = users.is_admin)
     ⚠ 구글 키가 앱 주소에만 열려 있어서 app.egsalon.com 아래에서만 타일이 뜬다.
     ⚠ 자리는 에펠탑의 공개된 치수(밑변 125m · 1층 57m · 2층 115m · 3층 276m)로 계산한다 —
       구글 타일에서 탑 모양을 따내지 않는다(구글 약관 3.2.3(c)).
     ⚠ 이름은 예시 — 진짜 명부(eg_crew)와는 아직 잇지 않았다. -->
<script>window.CESIUM_BASE_URL = "https://cdnjs.cloudflare.com/ajax/libs/cesium/1.123.0/";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.123.0/Cesium.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.123.0/Widgets/widgets.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
  html, body, #v { margin:0; width:100%; height:100%; overflow:hidden; background:#000;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  #panel { position:absolute; top:12px; left:12px; z-index:10; width:290px;
    max-height:calc(100% - 24px); overflow:auto; box-sizing:border-box;
    background:#f6f3ea; color:#2a2620; border-radius:10px; padding:12px 14px;
    font-size:13px; line-height:1.5; box-shadow:0 2px 14px rgba(0,0,0,.45); }
  #panel h1 { font-size:14px; margin:0 0 2px; padding-right:24px; }
  #panel .sub { font-size:11px; color:#7a6f5c; margin-bottom:4px; }
  #panel .how { font-size:12px; color:#5a4f3c; background:#ebe4d2; border-radius:6px; padding:6px 8px; margin:6px 0 2px; }
  #panel label, #panel .lab { display:block; margin-top:10px; font-weight:700; }
  #panel input[type=range] { width:100%; }
  #panel button { margin:4px 4px 0 0; padding:5px 9px; border:1px solid #b9ab8a; background:#fff;
    color:#2a2620; border-radius:6px; font-size:12px; cursor:pointer; }
  #panel button.on { background:#2a2620; color:#f6f3ea; border-color:#2a2620; }
  #panel button:disabled { opacity:.45; cursor:default; }
  #panel details { margin-top:10px; border-top:1px solid #d8ceb5; padding-top:6px; }
  #panel summary { cursor:pointer; font-weight:700; }
  #panel .row { display:flex; justify-content:space-between; font-size:12px; margin-top:6px; }
  #panel .row b { font-variant-numeric:tabular-nums; }
  #saveRow { position:sticky; bottom:-12px; margin:10px -14px -12px; padding:8px 14px 12px;
    background:#efe8d6; border-top:1px solid #d8ceb5; border-radius:0 0 10px 10px; }   /* 늘 보이게 — 판이 길어도 바닥에 붙는다 */
  #panel #saveBtn { background:#7a4e12; color:#fff8e6; border-color:#7a4e12; font-weight:700; padding:6px 14px; }
  #panel #saveBtn:disabled { background:#d8ceb5; border-color:#d8ceb5; color:#7a6f5c; cursor:default; }
  #saveState { font-size:12px; margin-top:5px; color:#5a4f3c; }
  #saveState.dirty { color:#a0400e; font-weight:700; }
  #msg { margin-top:10px; font-size:12px; color:#8a5a14; white-space:pre-line; }
  #fold { position:absolute; top:8px; right:8px; margin:0 !important; border:0 !important;
    background:transparent !important; font-size:15px; cursor:pointer; }
  #panel.min > :not(h1):not(#fold) { display:none; }
  #stageTag { position:absolute; right:14px; bottom:34px; z-index:9; padding:6px 12px; border-radius:20px;
    background:rgba(246,243,234,.92); color:#2a2620; font-size:13px; font-weight:700; pointer-events:none; }
  @media (max-width:560px){ #panel { width:calc(100% - 24px); max-height:46%; } }
</style>
</head>
<body>
<div id="v"></div>
<div id="stageTag">출항 뒤 — 이름이 새겨짐</div>
<div id="panel">
  <button id="fold" title="접기">–</button>
  <h1>에펠탑 각인 시험 · 셋째 판</h1>
  <div class="sub">탐험대 에펠탑 — 이름은 예시 · 지도 데이터 © Google</div>
  <div class="how">끌면 탑을 돌고, 휠로 다가갑니다.<br>휴대폰은 한 손가락으로 돌리고 두 손가락으로 다가갑니다.</div>

  <span class="lab">단계</span>
  <div id="stages">
    <button data-s="notice">공고 날</button><button data-s="sailed" class="on">출항 뒤</button><button data-s="eve">귀환 전야</button>
  </div>

  <span class="lab">대원 수 (예시)</span>
  <div id="counts">
    <button data-n="1">1</button><button data-n="10" class="on">10</button><button data-n="100">100</button><button data-n="500">500</button>
  </div>

  <span class="lab">띠 앞으로</span>
  <div id="faces">
    <button data-f="0" class="on">트로카데로 쪽</button><button data-f="2">샹드마르스 쪽</button><button data-f="1">북동 쪽</button><button data-f="3">남서 쪽</button>
  </div>
  <div>
    <button id="wholeBtn">탑 전체</button><button id="topBtn">꼭대기</button><button id="orbitBtn">돌기 꺼짐</button>
  </div>

  <span class="lab">하늘</span>
  <div>
    <button id="dayBtn">낮</button><button id="nightBtn" class="on">밤</button><button id="bloomBtn" class="on">번짐 켜짐</button>
  </div>

  <span class="lab">띠</span>
  <div>
    <button id="line2Btn" class="on">둘째 줄 있음</button><button id="plateBtn" class="on">바탕 있음</button>
  </div>

  <details id="adj" open>
    <summary>좌표 조절</summary>
    <div class="row"><span>탑 방향</span><b id="rotVal"></b></div>
    <input id="rot" type="range" min="-15" max="15" step="0.5">
    <div class="row"><span>땅 높이</span><b id="groundVal"></b></div>
    <input id="ground" type="range" min="40" max="120" step="0.5">
    <div class="row"><span>띠 높이</span><b id="fhVal"></b></div>
    <input id="fh" type="range" min="40" max="66" step="0.5">
    <div class="row"><span>띠 두께</span><b id="bhVal"></b></div>
    <input id="bh" type="range" min="3" max="14" step="0.5">
    <div class="row"><span>띠 너비</span><b id="bwVal"></b></div>
    <input id="bw" type="range" min="40" max="100" step="1">
    <div class="row"><span>면에서 띄우기</span><b id="outVal"></b></div>
    <input id="out" type="range" min="0" max="10" step="0.5">
    <div class="row"><span>꼭대기 별 높이</span><b id="phVal"></b></div>
    <input id="ph" type="range" min="300" max="360" step="1">
  </details>

  <div id="saveRow">
    <button id="saveBtn">확정</button><button id="revertBtn">확정한 값으로</button>
    <div id="saveState">확정한 값을 불러오는 중입니다…</div>
  </div>

  <div id="msg">구글 타일을 불러오는 중입니다…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function () {
  "use strict";

  /* ── 값 ─────────────────────────────────────────────── */
  const GOOGLE_API_KEY = "AIzaSyAAKQijLeTABmyi25BX4_qGsgghOhQCa6A";   // terra.html 과 같은 키
  const TOWER = { lon: 2.294481, lat: 48.858370 };                   // 에펠탑 한가운데
  const GROUND_PROBE = { lon: 2.29588, lat: 48.85742 };              // 샹드마르스 잔디 — 땅 높이를 재는 곳
  const BASE_BEARINGS = [313, 43, 133, 223];                          // 네 면이 바라보는 방위
  /* 탑의 반폭(가운데에서 면까지, m) — 공개 치수로 만든 꺾은선 */
  const PROFILE = [[0, 62.5], [57, 35.3], [115, 20.5], [190, 13.5], [276, 9.3], [300, 4.5], [330, 0.8]];
  const NAMES = ["소로","노란화살표","새벽길","월든의아침","뒷방의몽테뉴","책방고양이","안데스우편기",
    "라탱산책","청음실","별지기","카타딘","오두막","엘리펀트섬","순례자","밤의독서","몽블랑","헌책방",
    "플루트","델프트블루","실스마리아","프로코프","리스본일몰","마우나케아","인듀어런스"];
  const START = { rot: 0, groundH: 79, friezeH: 52, bandH: 7, bandW: 80, out: 2, polarisH: 336 };
  const V = Object.assign({}, START, { line2: true, plate: true });

  const $ = (id) => document.getElementById(id);
  const msg = (t) => { $("msg").textContent = t; };
  const rad = Cesium.Math.toRadians;
  const lerpProfile = (h) => {
    for (let i = 1; i < PROFILE.length; i++) {
      const [h0, w0] = PROFILE[i - 1], [h1, w1] = PROFILE[i];
      if (h <= h1) return w0 + (w1 - w0) * (h - h0) / (h1 - h0);
    }
    return PROFILE[PROFILE.length - 1][1];
  };
  const rng = (seed) => () => {                      // 번호마다 늘 같은 자리 — 받은 자리는 바뀌지 않는다
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  /* 글씨체를 먼저 받아 둔다 — 캔버스와 이름표가 명조로 그려지게 */
  try { await Promise.all([document.fonts.load('800 80px "Nanum Myeongjo"'), document.fonts.load('700 30px "Nanum Myeongjo"')]); } catch (e) {}

  /* ── 확정한 값 — eg_settings 'eiffel_tune' 한 줄 ──────────
     타륜 안의 방으로 열리면 집주인의 클라이언트를 받아 쓴다(한 문서 · 한 클라이언트, terra 0818).
     따로 열면 같은 storageKey 로 제 클라이언트를 만든다. */
  const SUPA_URL = "https://cyhlotwdisjvoxvfkpnd.supabase.co";
  const SUPA_KEY = "sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR";
  const TUNE_KEY = "eiffel_tune";
  const TUNE_FIELDS = ["rot", "groundH", "friezeH", "bandH", "bandW", "out", "polarisH", "line2", "plate"];
  let supa = null, saved = null, isAdmin = false;
  try {
    try { if (window.parent !== window && window.parent.egSupa) supa = window.parent.egSupa; } catch (_) {}
    if (!supa && window.supabase) supa = window.supabase.createClient(SUPA_URL, SUPA_KEY,
      { auth: { storageKey: "eungyo-auth", persistSession: true, autoRefreshToken: true } });
  } catch (e) { console.warn("클라이언트를 만들지 못함", e); }
  const tuneNow = () => { const o = {}; for (const k of TUNE_FIELDS) o[k] = V[k]; return o; };
  const applyTune = (val) => { for (const k of TUNE_FIELDS) if (val && val[k] !== undefined && val[k] !== null) V[k] = val[k]; };
  if (supa) {
    try {
      const { data } = await supa.from("eg_settings").select("val,updated_at").eq("key", TUNE_KEY).maybeSingle();
      if (data && data.val) { saved = data; applyTune(data.val); }
    } catch (e) { console.warn("확정한 값 읽기 실패", e); }
    try { const { data } = await supa.rpc("eg_is_admin"); isAdmin = !!data; } catch (e) {}
  }

  /* ── 뷰어 ───────────────────────────────────────────── */
  const viewer = new Cesium.Viewer("v", {
    baseLayer: false, animation: false, timeline: false, geocoder: false, homeButton: false,
    sceneModePicker: false, baseLayerPicker: false, navigationHelpButton: false,
    fullscreenButton: false, infoBox: false, selectionIndicator: false
  });
  const scene = viewer.scene;
  scene.globe.show = false;                          // 구글 타일이 땅을 맡는다
  if (scene.skyAtmosphere) scene.skyAtmosphere.show = false;
  if (scene.sun) scene.sun.show = false;
  if (scene.moon) scene.moon.show = false;
  if (scene.fog) scene.fog.enabled = false;
  const ssc = scene.screenSpaceCameraController;
  ssc.enableCollisionDetection = false;
  ssc.minimumZoomDistance = 8;
  ssc.maximumZoomDistance = 4000;
  viewer.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);

  /* ── 구글 타일 + 밤 셰이더 ──────────────────────────── */
  const nightShader = new Cesium.CustomShader({
    lightingModel: Cesium.LightingModel.UNLIT,
    uniforms: { u_night: { type: Cesium.UniformType.FLOAT, value: 0.8 } },
    fragmentShaderText: `
      void fragmentMain(FragmentInput fsInput, inout czm_modelMaterial material) {
        vec3 c = material.diffuse;
        float l = dot(c, vec3(0.299, 0.587, 0.114));
        vec3 night = mix(vec3(l), c, 0.25) * vec3(0.42, 0.52, 0.85) * 0.22;
        material.diffuse = mix(c, night, u_night);
      }`
  });
  let night = true;
  const setSky = (isNight) => {
    night = isNight;
    try { nightShader.setUniform("u_night", isNight ? 0.8 : 0); } catch (e) {}
    scene.backgroundColor = Cesium.Color.fromCssColorString(isNight ? "#03050b" : "#9cc0e0");
    $("dayBtn").classList.toggle("on", !isNight); $("nightBtn").classList.toggle("on", isNight);
  };

  let tileset = null, shaderOk = false;
  try {
    try { tileset = await Cesium.createGooglePhotorealistic3DTileset(GOOGLE_API_KEY); }
    catch (e) { tileset = await Cesium.createGooglePhotorealistic3DTileset({ key: GOOGLE_API_KEY }); }
    tileset.showCreditsOnScreen = true;              // 구글 출처 표시 — 약관 3.2.2(b)
    try { tileset.skipLevelOfDetail = false; tileset.maximumScreenSpaceError = 6; } catch (e) {}
    try { tileset.customShader = nightShader; shaderOk = true; }
    catch (e) { console.warn("셰이더 적용 실패", e); }
    scene.primitives.add(tileset);
  } catch (e) {
    msg("구글 타일을 열지 못했습니다.\n이 파일은 app.egsalon.com 아래에서 열어야 합니다.\n(" + (e && e.message ? e.message : e) + ")");
  }
  setSky(true);

  /* ── 번짐(bloom) ───────────────────────────────────── */
  const bloom = scene.postProcessStages.bloom;
  bloom.enabled = true;
  bloom.uniforms.glowOnly = false;
  bloom.uniforms.contrast = 119;
  bloom.uniforms.brightness = -0.35;
  bloom.uniforms.delta = 1.0;
  bloom.uniforms.sigma = 3.2;
  bloom.uniforms.stepSize = 1.0;

  /* ── 탑 좌표계 ─────────────────────────────────────── */
  let enu = null;
  const setFrame = () => {
    enu = Cesium.Transforms.eastNorthUpToFixedFrame(Cesium.Cartesian3.fromDegrees(TOWER.lon, TOWER.lat, V.groundH));
  };
  const local = (x, y, z) => Cesium.Matrix4.multiplyByPoint(enu, new Cesium.Cartesian3(x, y, z), new Cesium.Cartesian3());
  const bearing = (f) => BASE_BEARINGS[f] + V.rot;
  setFrame();

  /* 면 위의 한 점 — h 높이, t 는 면 너비의 비율(-1 왼쪽 … +1 오른쪽, 밖에서 볼 때), out 은 면에서 띄운 거리 */
  function facePoint(f, h, t, out) {
    const th = rad(bearing(f));
    const nx = Math.sin(th), ny = Math.cos(th);      // 면이 바라보는 쪽
    const rx = -Math.cos(th), ry = Math.sin(th);     // 밖에서 볼 때 왼쪽 → 오른쪽
    const w = lerpProfile(h);
    return local(nx * (w + out) + rx * (t * w), ny * (w + out) + ry * (t * w), h);
  }
  function faceNormal(f) {
    const th = rad(bearing(f));
    const v = Cesium.Matrix4.multiplyByPointAsVector(enu, new Cesium.Cartesian3(Math.sin(th), Math.cos(th), 0), new Cesium.Cartesian3());
    return Cesium.Cartesian3.normalize(v, v);
  }

  /* ── 1층 아래 띠 — 네 면에 새긴 「EG유니버스 탐험대원」 ─── */
  const friezeEntities = [];
  function friezeCanvas(widthM) {
    const W = 2400, H = Math.max(120, Math.round(W * V.bandH / widthM));
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const g = c.getContext("2d");
    if (V.plate) {                                   // 청동 띠 — 위아래로 금선 한 줄씩
      const bg = g.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#4b3621"); bg.addColorStop(0.5, "#3a2a19"); bg.addColorStop(1, "#2a1e12");
      g.fillStyle = bg; g.fillRect(0, 0, W, H);
      g.fillStyle = "#b8913f";
      const rule = Math.max(2, Math.round(H * 0.025));
      g.fillRect(0, Math.round(H * 0.07), W, rule); g.fillRect(0, Math.round(H * 0.93) - rule, W, rule);
    }
    const lines = V.line2 ? [["EG유니버스 탐험대원", 0.44, 800, 0.47], ["2026 · 폴라리스호", 0.17, 700, 0.79]]
                          : [["EG유니버스 탐험대원", 0.56, 800, 0.53]];
    g.textAlign = "center"; g.textBaseline = "middle";
    for (const [text, sizeR, weight, yR] of lines) {
      let size = Math.round(H * sizeR);
      const fit = () => { g.font = weight + " " + size + 'px "Nanum Myeongjo", serif'; try { g.letterSpacing = Math.round(size * 0.08) + "px"; } catch (e) {} };
      fit();
      while (g.measureText(text).width > W * 0.9 && size > 10) { size -= 2; fit(); }
      const x = W / 2, y = H * yR, d = Math.max(1, size * 0.035);
      g.fillStyle = "rgba(0,0,0,0.65)"; g.fillText(text, x + d, y + d);            // 판 깊이 — 아래로 진 그늘
      g.fillStyle = "rgba(255,238,190,0.35)"; g.fillText(text, x - d * 0.6, y - d * 0.6); // 깎인 모서리에 닿는 빛
      const gold = g.createLinearGradient(0, y - size / 2, 0, y + size / 2);
      gold.addColorStop(0, "#f8e6a6"); gold.addColorStop(0.45, "#d9ae4b"); gold.addColorStop(1, "#8c6422");
      g.fillStyle = gold; g.fillText(text, x, y);
      g.lineWidth = Math.max(1, size * 0.02); g.strokeStyle = "rgba(70,46,10,0.8)"; g.strokeText(text, x, y);
    }
    return c;
  }
  function buildFrieze() {
    for (const F of friezeEntities) viewer.entities.remove(F.e);
    friezeEntities.length = 0;
    const half = V.bandW / 100;
    const widthM = 2 * lerpProfile(V.friezeH) * half;
    const img = friezeCanvas(widthM);
    const lo = V.groundH + V.friezeH - V.bandH / 2, hi = V.groundH + V.friezeH + V.bandH / 2;
    for (let f = 0; f < 4; f++) {
      const left = facePoint(f, V.friezeH, -half, V.out), right = facePoint(f, V.friezeH, half, V.out);
      const e = viewer.entities.add({
        wall: {
          positions: [left, right],                  // 밖에서 볼 때 왼쪽 → 오른쪽 — 글자가 바로 읽힌다
          minimumHeights: [lo, lo], maximumHeights: [hi, hi],
          material: new Cesium.ImageMaterialProperty({ image: img, transparent: true })
        }
      });
      friezeEntities.push({ e, mid: facePoint(f, V.friezeH, 0, V.out), nrm: faceNormal(f) });
    }
  }

  /* ── 대원 이름 · 불빛 · 폴라리스 ───────────────────── */
  const points = scene.primitives.add(new Cesium.PointPrimitiveCollection());
  const labels = scene.primitives.add(new Cesium.LabelCollection());
  const sparkles = scene.primitives.add(new Cesium.PointPrimitiveCollection());
  const stars = scene.primitives.add(new Cesium.BillboardCollection());
  let stage = "sailed", count = 10, eveUntil = 0, lights = [];

  function seatOf(no) {                              // 대원 번호 → 탑 위 자리 (몇 명이 와도 들어간다)
    const r = rng(no * 2654435761);
    const face = no % 4;                             // 네 면을 번갈아
    let h, t;
    for (let k = 0; k < 60; k++) {
      h = 8 + r() * 285;                             // 넓은 아래쪽에 더 많이
      if (r() > lerpProfile(h) / 62.5) continue;
      if (h < 57) { const s = r() < 0.5 ? -1 : 1; t = s * (0.62 + r() * 0.34); }   // 1층 아래는 다리 위에만
      else t = (r() * 2 - 1) * 0.94;
      if (Math.abs(h - V.friezeH) < V.bandH / 2 + 3 && Math.abs(t) < V.bandW / 100 + 0.04) continue;   // 띠 위는 비워 둔다
      break;
    }
    return { face, h, t, tone: r(), phase: r() * 6.283 };
  }
  const WARM = ["#ffd27a", "#ffe8b0", "#ffb85c"].map((c) => Cesium.Color.fromCssColorString(c));
  const ENGRAVED = Cesium.Color.fromCssColorString("#e2bf6e");
  const RIVET = Cesium.Color.fromCssColorString("#8a6a35");

  function starImage() {                             // 여덟 갈래 빛 — 캔버스로 그린다
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const g = c.getContext("2d"), m = 64;
    const rd = g.createRadialGradient(m, m, 0, m, m, 46);
    rd.addColorStop(0, "rgba(255,255,255,1)"); rd.addColorStop(0.18, "rgba(255,246,214,0.95)");
    rd.addColorStop(0.45, "rgba(255,214,140,0.35)"); rd.addColorStop(1, "rgba(255,200,120,0)");
    g.fillStyle = rd; g.beginPath(); g.arc(m, m, 46, 0, 6.283); g.fill();
    g.strokeStyle = "rgba(255,248,225,0.95)"; g.lineCap = "round";
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4, len = k % 2 ? 34 : 60;
      g.lineWidth = k % 2 ? 2 : 3.5;
      g.beginPath(); g.moveTo(m, m); g.lineTo(m + Math.cos(a) * len, m + Math.sin(a) * len); g.stroke();
    }
    return c;
  }
  const STAR_IMG = starImage();

  function buildCrew() {
    points.removeAll(); labels.removeAll(); sparkles.removeAll(); stars.removeAll();
    lights = [];
    const lit = stage === "eve";
    const n = stage === "notice" ? 0 : count;
    for (let no = 1; no <= n; no++) {
      const s = seatOf(no);
      const pos = facePoint(s.face, s.h, s.t, 3);
      const col = WARM[Math.floor(s.tone * WARM.length)];
      const p = points.add(lit
        ? { position: pos, pixelSize: 6 + s.tone * 3, color: col, outlineColor: col.withAlpha(0.35), outlineWidth: 3 }
        : { position: pos, pixelSize: 3, color: RIVET, outlineWidth: 0 });
      const nm = "No." + String(no).padStart(3, "0") + " " + NAMES[(no - 1) % NAMES.length];
      const l = labels.add({ position: pos, text: nm,
        font: (lit ? "800 16px" : "700 15px") + ' "Nanum Myeongjo", serif',
        fillColor: lit ? Cesium.Color.fromCssColorString("#fff3d6") : ENGRAVED,
        outlineColor: Cesium.Color.fromCssColorString(lit ? "#000000" : "#20160a"), outlineWidth: 3,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE, pixelOffset: new Cesium.Cartesian2(7, -3),
        horizontalOrigin: Cesium.HorizontalOrigin.LEFT,
        distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, lit ? 900 : 520),
        translucencyByDistance: new Cesium.NearFarScalar(180, 1.0, lit ? 900 : 520, 0.45) });
      lights.push({ p, base: col, phase: s.phase });
    }
    /* 전야의 반짝임용 흰 점 — 평소엔 꺼 둔다 */
    for (let i = 0; i < 700; i++) {
      const r = rng(900000 + i);
      const face = i % 4, h = 10 + r() * 300;
      const t = h < 57 ? (r() < 0.5 ? -1 : 1) * (0.6 + r() * 0.38) : (r() * 2 - 1) * 0.96;
      sparkles.add({ position: facePoint(face, h, t, 2.5), pixelSize: 3, color: Cesium.Color.WHITE.withAlpha(0) });
    }
    /* 꼭대기 폴라리스 — 전야 전에는 꺼진 별 */
    stars.add({ position: local(0, 0, V.polarisH), image: STAR_IMG, scale: lit ? 0.8 : 0.5,
      color: lit ? Cesium.Color.WHITE : Cesium.Color.WHITE.withAlpha(0.14) });
  }

  const STAGE_TAG = { notice: "공고 날 — 각인 띠와 꺼진 별만", sailed: "출항 뒤 — 이름이 새겨짐", eve: "귀환 전야 — 모든 이름에 불" };
  function setStage(s) {
    stage = s;
    document.querySelectorAll("#stages button").forEach((b) => b.classList.toggle("on", b.dataset.s === s));
    $("stageTag").textContent = STAGE_TAG[s];
    buildCrew();
    if (s === "eve") eveUntil = performance.now() + 20000;   // 실제 에펠탑의 정각 반짝임을 20초로
  }

  function buildAll() { setFrame(); buildFrieze(); buildCrew(); }
  buildAll();

  /* ── 카메라 — 탑을 가운데 두고 돌리고 다가간다 ─────── */
  const frameAt = (h) => Cesium.Transforms.eastNorthUpToFixedFrame(Cesium.Cartesian3.fromDegrees(TOWER.lon, TOWER.lat, V.groundH + h));
  function look(h, headingDeg, pitchDeg, range, fly) {
    const set = () => viewer.camera.lookAtTransform(frameAt(h), new Cesium.HeadingPitchRange(rad(headingDeg), rad(pitchDeg), range));
    if (!fly) { set(); return; }
    /* 날아가듯 옮긴다 — 지금 자리에서 목표까지 0.9초 */
    viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
    const tmp = new Cesium.Camera(scene);
    tmp.lookAtTransform(frameAt(h), new Cesium.HeadingPitchRange(rad(headingDeg), rad(pitchDeg), range));
    const dest = Cesium.Cartesian3.clone(tmp.positionWC), dir = Cesium.Cartesian3.clone(tmp.directionWC), up = Cesium.Cartesian3.clone(tmp.upWC);
    viewer.camera.flyTo({ destination: dest, orientation: { direction: dir, up }, duration: 0.9, complete: set, cancel: set });
  }
  const faceView = (f, fly) => look(V.friezeH, bearing(f) + 180, -3, 120, fly);
  let orbit = false, last = performance.now();
  faceView(0, false);

  document.querySelectorAll("#faces button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("#faces button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on"); faceView(+b.dataset.f, true);
  }));
  $("wholeBtn").addEventListener("click", () => look(150, bearing(0) + 180, -10, 720, true));
  $("topBtn").addEventListener("click", () => look(V.polarisH - 20, bearing(0) + 180, -6, 150, true));
  $("orbitBtn").addEventListener("click", (e) => {
    orbit = !orbit; e.target.classList.toggle("on", orbit); e.target.textContent = orbit ? "돌기 켜짐" : "돌기 꺼짐";
  });

  scene.preRender.addEventListener(() => {
    const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (orbit && !Cesium.Matrix4.equals(viewer.camera.transform, Cesium.Matrix4.IDENTITY)) {
      viewer.camera.rotateRight(dt * (2 * Math.PI / 90));   // 90초에 한 바퀴
    }
    /* 띠는 카메라 쪽 면만 — 뒷면 글자가 탑 사이로 거꾸로 비치지 않게 */
    const camPos = viewer.camera.positionWC;
    for (const F of friezeEntities) {
      const toCam = Cesium.Cartesian3.subtract(camPos, F.mid, new Cesium.Cartesian3());
      F.e.show = Cesium.Cartesian3.dot(Cesium.Cartesian3.normalize(toCam, toCam), F.nrm) > 0.12;
    }
    /* 불빛 — 전야에만 숨 쉬고, 처음 20초는 반짝인다 */
    const tsec = now / 1000, sparkle = stage === "eve" && now < eveUntil;
    if (stage === "eve") {
      for (const L of lights) {
        const a = 0.78 + 0.22 * Math.sin(tsec * 1.3 + L.phase);
        L.p.color = sparkle && Math.sin(tsec * 23 + L.phase * 9) > 0.6 ? Cesium.Color.WHITE : L.base.withAlpha(a);
      }
    }
    const n = sparkles.length;
    for (let i = 0; i < n; i++) {
      const sp = sparkles.get(i);
      if (!sparkle) { if (sp.color.alpha !== 0) sp.color = Cesium.Color.WHITE.withAlpha(0); continue; }
      sp.color = Cesium.Color.WHITE.withAlpha(Math.sin(tsec * 31 + i * 12.9898) > 0.82 ? 1 : 0);
    }
  });

  /* ── 손잡이 ───────────────────────────────────────── */
  document.querySelectorAll("#stages button").forEach((b) => b.addEventListener("click", () => setStage(b.dataset.s)));
  document.querySelectorAll("#counts button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("#counts button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on"); count = +b.dataset.n;
    if (stage === "notice") setStage("sailed"); else buildCrew();
  }));
  $("dayBtn").addEventListener("click", () => setSky(false));
  $("nightBtn").addEventListener("click", () => setSky(true));
  $("bloomBtn").addEventListener("click", (e) => {
    bloom.enabled = !bloom.enabled; e.target.classList.toggle("on", bloom.enabled);
    e.target.textContent = bloom.enabled ? "번짐 켜짐" : "번짐 꺼짐";
  });
  const showToggles = () => {
    $("line2Btn").classList.toggle("on", V.line2); $("line2Btn").textContent = V.line2 ? "둘째 줄 있음" : "둘째 줄 없음";
    $("plateBtn").classList.toggle("on", V.plate); $("plateBtn").textContent = V.plate ? "바탕 있음" : "글자만";
  };
  $("line2Btn").addEventListener("click", () => { V.line2 = !V.line2; showToggles(); buildFrieze(); markDirty(); });
  $("plateBtn").addEventListener("click", () => { V.plate = !V.plate; showToggles(); buildFrieze(); markDirty(); });
  showToggles();

  /* 좌표 조절 — 값이 바뀌면 띠 · 이름 · 별을 다시 놓는다 */
  const SLIDERS = [
    ["rot", "rot", "°", false], ["ground", "groundH", "m", false], ["fh", "friezeH", "m", false],
    ["bh", "bandH", "m", false], ["bw", "bandW", "%", false], ["out", "out", "m", false], ["ph", "polarisH", "m", false]
  ];
  const showVals = () => { for (const [id, key, unit] of SLIDERS) { $(id).value = V[key]; $(id + "Val").textContent = V[key] + unit; } };
  let rebuildTimer = 0;
  for (const [id, key, unit] of SLIDERS) {
    $(id).addEventListener("input", (e) => {
      V[key] = +e.target.value; $(id + "Val").textContent = V[key] + unit;
      clearTimeout(rebuildTimer); rebuildTimer = setTimeout(buildAll, 60);
      markDirty();
    });
  }
  showVals();

  /* 확정 — 손질한 값을 그 자리에서 박는다 */
  const hhmm = (iso) => { try { return new Date(iso).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
  function markDirty() {
    const st = $("saveState");
    const dirty = !saved || JSON.stringify(tuneNow()) !== JSON.stringify(Object.assign({}, tuneNow(), saved.val));
    $("revertBtn").disabled = !saved || !dirty;
    if (!isAdmin) {
      $("saveBtn").disabled = true;
      st.className = ""; st.textContent = "확정은 살롱지기만 할 수 있습니다." + (saved ? "\n지금 탑은 " + hhmm(saved.updated_at) + "에 확정한 값입니다." : "");
      return;
    }
    $("saveBtn").disabled = !dirty;
    if (dirty) { st.className = "dirty"; st.textContent = saved ? "확정하지 않은 손질이 있습니다." : "아직 확정한 값이 없습니다 — 처음 값으로 서 있습니다."; }
    else { st.className = ""; st.textContent = "확정한 값 그대로입니다 · " + hhmm(saved.updated_at); }
  }
  $("saveBtn").addEventListener("click", async () => {
    if (!supa || !isAdmin) return;
    $("saveBtn").disabled = true; $("saveState").textContent = "확정하는 중…";
    const row = { key: TUNE_KEY, val: tuneNow(), updated_at: new Date().toISOString() };
    const { data, error } = await supa.from("eg_settings").upsert(row, { onConflict: "key" }).select("val,updated_at").maybeSingle();
    if (error || !data) {
      $("saveState").className = "dirty";
      $("saveState").textContent = "⚠ 확정하지 못했습니다 — " + (error ? error.message : "돌아온 줄이 없음");
      $("saveBtn").disabled = false; return;
    }
    saved = data; markDirty();
    $("saveState").textContent = "확정했습니다 · " + hhmm(saved.updated_at) + "\n다음에 열면 이 자리로 섭니다.";
  });
  $("revertBtn").addEventListener("click", () => {
    if (!saved) return;
    applyTune(saved.val); showVals(); showToggles(); buildAll(); markDirty();
  });
  markDirty();
  $("fold").addEventListener("click", () => {
    const p = $("panel"); p.classList.toggle("min"); $("fold").textContent = p.classList.contains("min") ? "+" : "–";
  });

  /* 타일이 서면 땅 높이를 한 번 잰다 — 확정한 땅 높이가 있으면 그것이 이긴다(재기는 참고로만) */
  if (tileset) {
    let measured = null;
    try {
      await tileset.readyPromise?.catch(() => {});
      const res = await scene.sampleHeightMostDetailed([Cesium.Cartographic.fromDegrees(GROUND_PROBE.lon, GROUND_PROBE.lat)]);
      if (res && res[0] && Number.isFinite(res[0].height)) measured = Math.round(res[0].height * 2) / 2;
    } catch (e) { console.warn("땅 높이 재기 실패 — 기본값으로", e); }
    if (measured !== null && !(saved && Number.isFinite(saved.val && saved.val.groundH))) {
      V.groundH = measured; showVals(); buildAll(); faceView(0, false); markDirty();
    }
    msg((shaderOk ? "밤 셰이더를 걸었습니다." : "⚠ 셰이더를 걸지 못했습니다.") +
        "\n땅 높이 " + V.groundH + "m" + (measured !== null ? " (잰 값 " + measured + "m)" : "") +
        "\n\n볼 것: ① 띠 글씨가 면에 붙어 함께 도는지 ② 다가가면 이름이 읽히는지 ③ 귀환 전야의 불");
  }
})();
</script>
</body>
</html>
