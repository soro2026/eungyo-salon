<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EG Voice — 낭독실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bench:#171C26; --bench-2:#1F2633; --line:#2E3646;
  --paper:#FDFCFA; --gold:#C7A24A; --dim:#8A93A6; --text:#E7EAF0;
  --danger:#C4574F; --ok:#5E9C6E; --warn:#D08A3E;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bench);color:var(--text);
  font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:16px 22px;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;background:var(--bench)}
header h1{margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;
  font-size:25px;letter-spacing:.06em}
header h1 em{font-style:normal;color:var(--gold)}
.sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:.14em}
.count{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim)}
.count b{color:var(--text);font-weight:500}
.count .w{color:var(--warn)}

/* ⚠⚠ 0807 진범 — hidden은 UA 스타일(display:none)이라 **작성자 CSS의 display 한 줄에 진다.**
   아래 main{display:grid}와 #gate{display:grid}가 hidden 둘을 동시에 무력화하고 있었다.
   → 문지기가 통과해 gate.hidden=true 를 해도 화면은 꿈쩍도 안 했다. 서버는 결백했다.
   이 한 줄이 앞으로 세울 모든 hidden까지 함께 지킨다(함정 AI — 조항의 사정거리). */
[hidden]{display:none!important}

/* ⭐ 0807 — 왼쪽 목록이 아래로 흘러내려 찾는 데 시간이 들었다(소로 지적).
   창을 세로로 못 박고 **목록만** 따로 구르게 한다. 찾는 칸은 늘 위에 선다.
   ⚠ 픽셀 어림값(calc(100vh - 60px))은 쓰지 않는다 — 머리 높이가 한 줄만 바뀌어도 어긋난다.
     flex:1 + min-height:0 이 그 어림값을 통째로 없앤다. */
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{flex:none}
main{flex:1;min-height:0;display:grid;grid-template-columns:296px 1fr;overflow:hidden}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#list{flex:1;min-height:0;overflow:auto;padding:0 14px 40px}
section{padding:22px 26px 60px;overflow:auto}

/* 찾는 칸 */
.find{flex:none;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.q{width:100%;background:var(--bench-2);border:1px solid var(--line);color:var(--text);
  border-radius:5px;padding:8px 11px;font-size:13px;-webkit-appearance:none}
.q::placeholder{color:var(--dim)}
.q:focus{border-color:var(--gold);outline:none}
.chips{display:flex;gap:5px;margin-top:8px}
.chip{flex:1;padding:5px 3px;border-radius:4px;border:1px solid var(--line);background:transparent;
  color:var(--dim);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:10.5px}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(199,162,74,.08)}
.chip b{font-weight:600;margin-left:3px}
.nohit{color:var(--dim);font-size:12.5px;padding:28px 6px;line-height:1.85}

/* 목소리 고르는 칸 — 목록 아래에 늘 앉아 있다 */
.vbar{flex:none;border-top:1px solid var(--line);padding:10px 14px 12px}
.vbar select{width:100%;background:var(--bench-2);border:1px solid var(--line);color:var(--text);
  border-radius:5px;padding:7px 9px;font-size:12.5px}
.vbar select:focus{border-color:var(--gold);outline:none}
#purse{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-top:7px;line-height:1.65}
#purse b{color:var(--text)}
#purse .w{color:var(--warn)}
#purse .x{color:var(--danger)}

/* 좁은 창에서는 예전처럼 문서가 통째로 구른다 — 다만 목록엔 천장을 준다 */
@media(max-width:880px){
  body{display:block;height:auto;overflow:visible}
  main{display:block;overflow:visible}
  aside{display:block;overflow:visible;border-right:0;border-bottom:1px solid var(--line)}
  #list{max-height:46vh;overflow-y:auto}
}

.grp{display:flex;align-items:center;gap:7px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--line);
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--dim);
  padding:16px 6px 6px}
.grp:hover{color:var(--gold)}
.grp .tw{width:8px;flex:none;font-size:9px}
.grp .f{margin-left:auto;color:var(--gold);letter-spacing:.06em}
.row{display:flex;gap:11px;align-items:center;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--line);padding:9px 6px;color:var(--text)}
.row:hover{background:var(--bench-2)}
.row[aria-current="true"]{background:var(--bench-2);box-shadow:inset 3px 0 0 var(--gold)}
.dot{width:9px;height:9px;flex:none;border-radius:50%;border:1px solid var(--line);background:transparent}
.dot.on{background:var(--ok);border-color:var(--ok)}
.dot.stale{background:var(--warn);border-color:var(--warn)}
.row .t{font-weight:500;line-height:1.25;display:block}
.row .c{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.04em}

.empty{color:var(--dim);max-width:42ch;margin-top:12vh;font-size:15px;line-height:1.85}
h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;margin:0 0 2px}
.meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:.08em;margin-bottom:18px}

.card{border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:18px;background:var(--bench-2)}
.card h3{margin:0 0 10px;font-size:12px;letter-spacing:.14em;color:var(--dim);
  font-family:'IBM Plex Mono',monospace;font-weight:500;text-transform:uppercase}
textarea{width:100%;min-height:190px;resize:vertical;background:var(--bench);color:var(--text);
  border:1px solid var(--line);border-radius:5px;padding:12px 13px;line-height:1.85}
.btn{padding:8px 14px;border-radius:5px;cursor:pointer;border:1px solid var(--line);
  background:transparent;color:var(--text)}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.bad:hover{border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{border-color:var(--line);color:var(--text)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.bar .sp{margin-left:auto}

.drop{border:1px dashed var(--line);border-radius:6px;padding:26px 18px;text-align:center;
  color:var(--dim);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--gold);color:var(--gold);background:rgba(199,162,74,.05)}
.drop.busy{opacity:.5;pointer-events:none}
audio{width:100%;margin-top:12px;filter:invert(.92) hue-rotate(180deg)}
.note{font-size:12.5px;color:var(--dim);line-height:1.8;margin-top:10px}
.note b{color:var(--warn);font-weight:500}
.tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;
  border:1px solid var(--line);border-radius:3px;padding:2px 7px;color:var(--dim);margin-left:8px}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.tag.ok{border-color:var(--ok);color:var(--ok)}
input.line{background:var(--bench);border:1px solid var(--line);color:var(--text);
  border-radius:5px;padding:8px 10px;min-width:220px}

#gate{position:fixed;inset:0;background:var(--bench);display:grid;place-items:center;z-index:60;padding:24px}
#gate .box{max-width:340px;width:100%}
#gate h2{margin:0 0 8px}
#gate p{color:var(--dim);font-size:13px;margin:0 0 18px}
#gate .why{display:block;margin-top:14px;font-family:'IBM Plex Mono',monospace;
  font-size:11px;color:var(--warn);line-height:1.7;word-break:break-all}
#gate input{width:100%;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--bench-2);border:1px solid var(--line);border-radius:6px;padding:11px 18px;
  opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:80vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{border-color:var(--danger)}
#toast.ok{border-color:var(--ok)}
</style>
</head>
<body>

<header>
  <h1>EG <em>Voice</em></h1>
  <span class="sub">낭독실 · 장소 원고</span>
  <span class="count" id="count"></span>
</header>

<main id="app" hidden>
  <aside>
    <div class="find">
      <input id="q" class="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="곳 · 화가 · 코드 찾기   ( / )">
      <div class="chips">
        <button class="chip on" data-flt="all">전체<b id="cAll">·</b></button>
        <button class="chip"    data-flt="left">남은 것<b id="cLeft">·</b></button>
        <button class="chip"    data-flt="stale">낡음<b id="cStale">·</b></button>
      </div>
    </div>
    <div id="list"></div>
    <div class="vbar">
      <select id="voiceSel"><option value="">목소리 불러오는 중…</option></select>
      <div id="purse"></div>
    </div>
  </aside>
  <section id="pane"><p class="empty">왼쪽에서 곳을 고르십시오.<br>낭독 원문을 여기서 만들어 드립니다.</p></section>
</main>

<div id="gate" hidden>
  <div class="box">
    <h2>낭독실</h2>
    <p id="gateMsg">이 문은 살롱지기의 열쇠로만 열립니다. 🗝️</p>
  </div>
</div>

<div id="toast"></div>

<script>

console.log('[EG] admin_voice v6 0807 — 찾는 칸 + 일레븐랩스 배관');

const SUPA_URL = 'https://cyhlotwdisjvoxvfkpnd.supabase.co';
const SUPA_KEY = 'sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
const BUCKET   = 'tour-assets';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY, { auth:{ storageKey:'eungyo-auth' } });

/* ══ 우주 표 ═══════════════════════════════════════════════════════════
   새 우주가 생기면 여기 한 줄. 로직은 안 건드린다.
   (terra.html STORY_DOOR·크레덴시알 GROW 표와 같은 문법) */
const FAMILY = [
  { kind:'hansfoon', ko:'한스푼',  order:'spoon_no'  },
  { kind:'heritage', ko:'미술관',  order:'museum_no' },
  { kind:'museum',   ko:'뮤세움',  order:'museum_no' },
  { kind:'concert',  ko:'음악관',  order:'hall_no'   }
];

/* 미술 4겹 — galerie.html의 order 배열과 같은 차례여야 한다.
   ⚠ 큐레이션(「먼저 목과 어깨를 보세요」)을 맨 뒤에 둔다 — 듣고 나서 그림을 보도록.
   ⚠ 별표 강조(*목과 어깨*)는 눈으로 읽을 때의 표시다. 낭독 원문에서는 걷는다. */
const ART_ORDER = ['scene','knowledge','thought','connection','curation'];

const $ = s => document.querySelector(s);
let items = [], takes = {}, cur = null;

/* ── 찾기 상태 ────────────────────────────────────────────────────────
   q  찾는 말(소문자·앞뒤 공백 없음)   qc  그 말에서 공백까지 뺀 것(초성 대조용)
   flt  all | left | stale            flat 지금 화면에 보이는 차례 — ↑↓ 이동이 이걸 탄다
   folded  접어 둔 무리 이름          ⚠ 찾는 중에는 접힘을 무시한다 */
let q = '', qc = '', flt = 'all', flat = [];
const folded = new Set();

/* 초성 찾기 — 「ㄱㄹㄴ」로 가르니에가 걸린다.
   한글 음절은 0xAC00부터 588자씩 한 초성이 이어진다. */
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const choOf = s => String(s ?? '').replace(/[\uAC00-\uD7A3]/g,
  ch => CHO[Math.floor((ch.charCodeAt(0) - 0xAC00) / 588)]);

let toastT;
function toast(msg, kind){
  const t = $('#toast'); t.textContent = msg; t.className = 'on ' + (kind||'');
  clearTimeout(toastT); toastT = setTimeout(()=>t.className='', 4200);
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ══ 낭독 원문 — terra.html storyBodyFromMeta와 한 글자도 다르지 않아야 한다 ══
   ⚠ 부제(subtitle)는 넣지 않는다. 그것은 문 앞 한 줄이지 판의 본문이 아니다.
   ⚠ 이 함수를 고치면 해시가 전부 어긋나 서른 곳이 한꺼번에 「낡음」이 된다.
     고쳐야 할 일이 생기면 그날 전량을 다시 굽는다고 각오하고 고칠 것. */
function narrationOf(meta){
  const m = meta || {};
  const out = [];
  if (m.lede) out.push(m.lede);
  (Array.isArray(m.body) ? m.body : []).forEach(v => { if(v) out.push(v); });
  if (m.note) out.push(m.note);
  return out.join('\n\n');
}

function narrationOfArt(layers){
  const L = layers || {};
  return ART_ORDER.map(k => (L[k] || '').replace(/\*/g, '').trim())
                  .filter(Boolean).join('\n\n');
}

async function sha256(text){
  const buf = new TextEncoder().encode(text);
  const d = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2,'0')).join('');
}

const keyOf = e => e.scope === 'art'
  ? `voice/art/${e.ref}`
  : `voice/place/${e.ref.replace('/','_')}`;

/* ── 문지기 ────────────────────────────────────────────────────────
   ⚠ 0806밤 — 두 번 막혔다. 첫판은 로그인 칸을 새로 세워서, 둘째 판은 관리자
     확인이 조용히 실패해서. 두 번 다 「왜 막혔는지」를 화면이 말하지 않았다.
   → 이제 두 길로 묻고(함수·표), 둘 다 아니면 **무엇이 아니었는지 적는다.**
     조용히 물러나는 문은 고치는 데 왕복이 한 번 더 든다(함정 AF). */
function deny(html){
  $('#gate').hidden = false;
  $('#gateMsg').innerHTML = html;
}

async function boot(){
  try{
    const { data:ud, error:uErr } = await sb.auth.getUser();
    const user = ud && ud.user;
    if(!user){
      deny('살롱지기 전용 콘솔입니다.<br>은교살롱에 로그인한 뒤 다시 들러 주세요.'
        + (uErr ? '<br><span class="why">auth — ' + esc(uErr.message) + '</span>' : ''));
      return;
    }

    let ok = false, why = [];

    /* ① 함수에게 묻는다 — 크레덴시알 콘솔이 쓰는 길 */
    const r1 = await sb.rpc('eg_is_admin');
    if (r1.data === true) ok = true;
    else if (r1.error) why.push('rpc: ' + r1.error.message);
    else why.push('rpc: ' + JSON.stringify(r1.data));

    /* ② 표에게 묻는다 — 자산 콘솔 여섯 채가 쓰는 길 */
    if(!ok){
      const r2 = await sb.from('users').select('is_admin').eq('id', user.id).maybeSingle();
      if (r2.data && r2.data.is_admin) ok = true;
      else if (r2.error) why.push('users: ' + r2.error.message);
      else why.push('users: ' + (r2.data ? 'is_admin=' + r2.data.is_admin : '행 없음'));
    }

    if(!ok){
      deny('이 문은 살롱지기의 열쇠로만 열립니다. 🗝️'
        + '<br><span class="why">' + esc(user.id) + '<br>' + esc(why.join(' · ')) + '</span>');
      return;
    }

    console.log('[EG] 문지기 통과 —', user.id, why.length ? '(' + why.join(' · ') + ')' : '(rpc 한 번에)');
    $('#gate').hidden = true;
    $('#app').hidden = false;
    wireFind();          /* ⚠ #app을 펴고 나서 건다 — 그 전에는 #q가 아직 없다 */
    await load();
    loadVoices();        /* 그물 다녀오는 동안 목록은 이미 서 있다 — 기다리지 않는다 */
  }catch(e){
    deny('문이 걸렸습니다.<br><span class="why">' + esc(e && e.message || e) + '</span>');
    console.error('[EG] 낭독실 문지기', e);
  }
}

/* ── 싣기 — 두 우주를 한 목록으로 ────────────────────────────────
   한 줄(entry) = { scope, ref, group, name, sub, sort, text, hash }
   ⚠ 원고가 없는 곳은 아예 목록에 안 세운다 — 읽을 것이 없는 칸이다. */
async function load(){
  const next = [];

  /* 장소 — 핀 meta */
  const { data:rows, error } = await sb.from('terra_pins')
    .select('kind,code,name,meta').in('kind', FAMILY.map(f=>f.kind)).eq('active', true);
  if(error){ toast('핀을 읽지 못했습니다 — ' + error.message, 'bad'); return; }
  for (const r of (rows||[])){
    const text = narrationOf(r.meta);
    if(!text) continue;
    const fam = FAMILY.find(f => f.kind === r.kind);
    next.push({ scope:'place', ref:`${r.kind}/${r.code}`, group:fam.ko,
      name:r.name, sub:r.code, sort:+(r.meta?.[fam.order] ?? 99),
      text, hash: await sha256(text) });
  }

  /* 미술 — heritage_items 4겹 */
  const { data:arts } = await sb.from('heritage_items')
    .select('id,name,artist,layers').eq('category','visual').eq('status','active');
  for (const a of (arts||[])){
    const text = narrationOfArt(a.layers);
    if(!text) continue;
    next.push({ scope:'art', ref:a.id, group:'미술 4겹',
      name:a.name, sub:(a.artist||a.id), sort:a.id,
      text, hash: await sha256(text) });
  }

  items = next;

  const { data:tk } = await sb.from('voice_takes').select('*');
  takes = {};
  (tk||[]).forEach(t => { takes[t.scope + ':' + t.ref] = t; });

  paintList(); paintCount();
  if (cur) select(items.find(e => e.scope===cur.scope && e.ref===cur.ref) || null);
}

const takeOf = e => takes[e.scope + ':' + e.ref];

function stateOf(e){
  const t = takeOf(e);
  if(!t) return 'none';
  return (t.src_hash && t.src_hash !== e.hash) ? 'stale' : 'ok';
}

function paintCount(){
  const ok = items.filter(e => stateOf(e)==='ok').length;
  const st = items.filter(e => stateOf(e)==='stale').length;
  $('#count').innerHTML = `구워짐 <b>${ok}</b> / ${items.length}`
    + (st ? ` · <span class="w">낡음 ${st}</span>` : '');
  const put = (id, n) => { const el = document.getElementById(id); if(el) el.textContent = n; };
  put('cAll', items.length); put('cLeft', items.length - ok); put('cStale', st);
  paintPurse();
}

/* 이름·코드·화가·무리 이름 중 하나만 걸려도 통과. 초성만 치면 초성으로 잰다. */
function hit(e){
  if(!q) return true;
  if((e.name + ' ' + e.sub + ' ' + e.group).toLowerCase().includes(q)) return true;
  if(qc && /^[ㄱ-ㅎ]+$/.test(qc)) return choOf(e.name + e.group).includes(qc);
  return false;
}

/* ⚠ 지금 고른 곳은 거르개에 걸려도 목록에 남긴다.
   「남은 것」만 보는 중에 음성을 올리면 그 칸이 눈앞에서 사라져
   방금 앉힌 소리를 들어 볼 수도, 다음 곳으로 ↓ 갈 수도 없게 된다. */
function visible(e){
  if(!hit(e)) return false;
  if(flt === 'all') return true;
  if(cur && cur.scope === e.scope && cur.ref === e.ref) return true;
  return flt === 'left' ? stateOf(e) !== 'ok' : stateOf(e) === 'stale';
}

function paintList(){
  const GROUPS = FAMILY.map(f=>f.ko).concat(['미술 4겹']);
  const bySort = (a,b) => (a.sort > b.sort ? 1 : a.sort < b.sort ? -1 : 0);
  flat = [];
  let html = '';

  GROUPS.forEach(g => {
    const all = items.filter(e => e.group === g).sort(bySort);
    const grp = all.filter(visible);
    if(!grp.length) return;

    const done = all.filter(e => stateOf(e)==='ok').length;
    const fold = !q && folded.has(g);   /* 찾는 중에는 접힌 무리도 편다 */
    html += `<button class="grp" data-grp="${esc(g)}" aria-expanded="${!fold}">
        <span class="tw">${fold ? '▸' : '▾'}</span>${esc(g)} — ${done}/${all.length}
        ${grp.length !== all.length ? `<span class="f">${grp.length}</span>` : ''}
      </button>`;
    if(fold) return;

    grp.forEach(e => {
      flat.push(e);
      const st = stateOf(e);
      html += `<button class="row" data-key="${esc(e.scope+':'+e.ref)}"
          aria-current="${!!(cur && cur.scope===e.scope && cur.ref===e.ref)}">
        <span class="dot ${st==='ok'?'on':st==='stale'?'stale':''}"></span>
        <span><span class="t">${esc(e.name)}</span>
        <span class="c">${esc(e.sub)} · ${e.text.length}자</span></span>
      </button>`;
    });
  });

  $('#list').innerHTML = html || `<p class="nohit">${
      q            ? '찾는 곳이 없습니다.'
    : flt==='stale'? '낡은 음성이 없습니다. 원고와 소리가 다 맞습니다.'
    :                '남은 곳이 없습니다. 서른 곳이 다 소리를 냅니다. 🎙'}</p>`;

  $('#list').querySelectorAll('.row').forEach(b => b.onclick = () =>
    select(items.find(e => (e.scope+':'+e.ref) === b.dataset.key)));
  $('#list').querySelectorAll('.grp').forEach(b => b.onclick = () => {
    const g = b.dataset.grp;
    folded.has(g) ? folded.delete(g) : folded.add(g);
    paintList();
  });
}

/* 고른 칸이 목록 밖으로 밀려나 있으면 끌어온다 — ↑↓ 이동에만 부른다 */
function reveal(){
  const el = $('#list').querySelector('.row[aria-current="true"]');
  if(el) el.scrollIntoView({ block:'nearest' });
}

/* ── 찾는 칸 · 거르개 · 자판 ──────────────────────────────────────────
   ⚠ 이 배선은 **한 번만** 건다. paintList가 목록을 다시 그려도
     찾는 칸은 #list 밖에 있으므로 지워지지 않는다. */
function wireFind(){
  const box = $('#q');

  box.oninput = () => {
    q  = box.value.trim().toLowerCase();
    qc = q.replace(/\s+/g, '');
    paintList();
  };

  document.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    flt = b.dataset.flt;
    document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
    paintList();
  });

  $('#voiceSel').onchange = () => { voiceId = $('#voiceSel').value; };

  document.addEventListener('keydown', e => {
    const inBox  = e.target === box;
    const tag    = (e.target.tagName || '').toLowerCase();
    if((tag === 'input' || tag === 'textarea') && !inBox) return;   /* 목소리 이름 칸 보호 */

    if(e.key === '/' && !inBox){ e.preventDefault(); box.focus(); box.select(); return; }
    if(e.key === 'Escape' && inBox){ box.value=''; q=''; qc=''; paintList(); return; }

    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      if(!flat.length) return;
      e.preventDefault();
      const i = flat.findIndex(x => cur && x.scope===cur.scope && x.ref===cur.ref);
      const n = e.key === 'ArrowDown'
        ? (i < 0 ? 0                : Math.min(i + 1, flat.length - 1))
        : (i < 0 ? flat.length - 1  : Math.max(i - 1, 0));
      select(flat[n]); reveal();
      return;
    }

    if(e.key === 'Enter' && inBox && flat.length){
      e.preventDefault(); select(flat[0]); box.blur(); reveal();
    }
  });
}

function select(p){
  cur = p;
  paintList();
  if(!p){ $('#pane').innerHTML = '<p class="empty">왼쪽에서 곳을 고르십시오.</p>'; return; }
  const t = takeOf(p);
  const s = stateOf(p);
  const tag = s==='ok'    ? '<span class="tag ok">음성 있음</span>'
            : s==='stale' ? '<span class="tag warn">낡음 — 원고가 바뀌었습니다</span>'
            : '<span class="tag">아직 없음</span>';

  $('#pane').innerHTML = `
    <h2>${esc(p.name)}${tag}</h2>
    <div class="meta">${esc(p.scope + ' · ' + p.ref)} · ${p.text.length}자 · 예상 ${Math.round(p.text.length/5.3)}초</div>

    <div class="card">
      <h3>낭독 원문</h3>
      <textarea id="src" readonly>${esc(p.text)}</textarea>
      <div class="bar">
        <button class="btn gold" id="copy">원문 복사</button>
        <span class="note" style="margin:0">일레븐랩스에 붙여 넣고 구우신 뒤, 아래 칸에 던지십시오.</span>
      </div>
    </div>

    <div class="card">
      <h3>음성 파일</h3>
      <div class="drop" id="drop">
        음성 파일을 여기에 던지거나 눌러서 고르십시오<br>
        <span style="font-size:12px">mp3 · m4a · wav</span>
      </div>
      <input type="file" id="file" accept="audio/*" hidden>
      ${t ? `<audio controls preload="none" src="${esc(t.url)}"></audio>
        <div class="note">
          ${t.origin==='bake' ? '파이스가 구움' : '손으로 올림'}
          · ${(t.bytes/1024).toFixed(0)}KB
          ${t.dur_sec ? ' · ' + Math.floor(t.dur_sec/60) + '분 ' + Math.round(t.dur_sec%60) + '초' : ''}
          · ${new Date(t.created_at).toLocaleDateString('ko-KR')}
          ${s==='stale' ? '<br><b>⚠ 이 음성을 녹음한 뒤 원고가 바뀌었습니다. 다시 구워 주십시오.</b>' : ''}
        </div>` : ''}
      <div class="bar">
        <input class="line" id="voice" placeholder="목소리 이름 (예: Jina · 일레븐랩스)"
               value="${esc(t?.voice || lastVoice())}">
        <button class="btn" id="saveVoice">목소리 이름 저장</button>
        <button class="btn bad sp" id="del" ${t?'':'disabled'}>음성 지우기</button>
      </div>
    </div>

    <div class="card">
      <h3>일레븐랩스로 굽기</h3>
      <div class="note" style="margin-top:0">
        왼쪽 아래에서 고른 목소리로 굽습니다. 구워지면 스토리지와 표에 저절로 앉습니다.
      </div>
      <div class="bar">
        <button class="btn gold" id="bake">이 곳 굽기</button>
        <button class="btn" id="bakeAll">보이는 곳 전부 굽기 (${
          flat.filter(x => stateOf(x) !== 'ok').length })</button>
      </div>
    </div>`;

  wirePane(p);
}

function lastVoice(){
  const v = Object.values(takes).filter(t => t.voice);
  return v.length ? v[v.length-1].voice : '';
}

function wirePane(p){
  $('#copy').onclick = async () => {
    try{ await navigator.clipboard.writeText(p.text); toast('원문을 복사했습니다.', 'ok'); }
    catch(_){ $('#src').select(); toast('직접 복사해 주십시오 (Ctrl+C).'); }
  };

  const drop = $('#drop'), file = $('#file');
  drop.onclick = () => file.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over');
    if(e.dataTransfer.files[0]) put(p, e.dataTransfer.files[0]); };
  file.onchange = () => { if(file.files[0]) put(p, file.files[0]); };

  $('#saveVoice').onclick = async () => {
    const t = takeOf(p);
    if(!t){ toast('먼저 음성을 올려 주십시오.', 'bad'); return; }
    const { error } = await sb.from('voice_takes')
      .update({ voice:$('#voice').value.trim() || null, updated_at:new Date().toISOString() })
      .eq('id', t.id);
    if(error){ toast('저장하지 못했습니다 — ' + error.message, 'bad'); return; }
    toast('목소리 이름을 적어 두었습니다.', 'ok'); await load();
  };

  $('#del').onclick = async () => {
    const t = takeOf(p);
    if(!t) return;
    if(!confirm(p.name + ' 의 음성을 지웁니다. 계속할까요?')) return;
    await sb.storage.from(BUCKET).remove([keyOf(p) + '.' + (t.mime === 'audio/wav' ? 'wav' : 'mp3')]);
    const { error } = await sb.from('voice_takes').delete().eq('id', t.id);
    if(error){ toast('지우지 못했습니다 — ' + error.message, 'bad'); return; }
    toast('지웠습니다.', 'ok'); await load();
  };

  $('#bake').onclick    = () => bake([p]);
  $('#bakeAll').onclick = () => bake(flat.filter(x => stateOf(x) !== 'ok'));
}

/* ── 올리기 ──────────────────────────────────────────────────────────
   ⚠ 원문 해시를 파일과 함께 적는다. 이 한 칸이 「낡음」을 알아보는 유일한 근거다.
   ⚠ 주소에 ?v= 를 붙인다. 다시 구운 파일이 같은 이름으로 앉으므로
     이것이 없으면 손님 브라우저가 옛 음성을 며칠 더 들려준다(함정 AD). */
async function put(p, f){
  if(!/^audio\//.test(f.type) && !/\.(mp3|m4a|wav|ogg)$/i.test(f.name)){
    toast('음성 파일이 아닙니다.', 'bad'); return;
  }
  const drop = $('#drop');
  drop.classList.add('busy'); drop.textContent = '올리는 중…';
  try{
    const ext = (f.name.split('.').pop() || 'mp3').toLowerCase();
    const key = keyOf(p) + '.' + ext;
    const { error:upErr } = await sb.storage.from(BUCKET)
      .upload(key, f, { upsert:true, contentType:f.type || 'audio/mpeg' });
    if(upErr) throw upErr;
    const { data:pub } = sb.storage.from(BUCKET).getPublicUrl(key);
    const url = `${pub.publicUrl}?v=${Date.now()}`;

    let dur = null;
    try{ dur = await durationOf(f); }catch(_){}

    const row = {
      scope:p.scope, ref:p.ref, title:p.name, url,
      src_hash:p.hash, chars:p.text.length,
      voice:($('#voice')?.value || '').trim() || null,
      origin:'hand', mime:f.type || null, bytes:f.size, dur_sec:dur,
      active:true, updated_at:new Date().toISOString()
    };
    const { error:dbErr } = await sb.from('voice_takes')
      .upsert(row, { onConflict:'scope,ref' });
    if(dbErr) throw dbErr;

    toast(p.name + ' — 음성이 앉았습니다.', 'ok');
    await load();
  }catch(e){
    console.error(e);
    toast('올리지 못했습니다 — ' + (e.message || e), 'bad');
    drop.classList.remove('busy');
    drop.innerHTML = '음성 파일을 여기에 던지거나 눌러서 고르십시오<br><span style="font-size:12px">mp3 · m4a · wav</span>';
  }
}

function durationOf(f){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(f);
    const a = new Audio();
    a.preload = 'metadata';
    a.onloadedmetadata = () => { URL.revokeObjectURL(u);
      res(isFinite(a.duration) ? Math.round(a.duration*100)/100 : null); };
    a.onerror = () => { URL.revokeObjectURL(u); rej(new Error('길이를 재지 못했습니다')); };
    a.src = u;
  });
}

/* ── 일레븐랩스 배관 ─────────────────────────────────────────────────
   ⚠ 함수는 **한 곳만** 굽는다. 쉰세 곳을 한 발화에 담으면 시간에 걸린다.
     여기서 차례로 부르고, 중간에 끊겨도 구운 것은 남는다.
   ⚠ 첫 실패에서 멈춘다. 같은 실패를 쉰세 번 반복하면 시간만 태운다. */
let voices = [], voiceId = '', purse = null, baking = false;

const voiceName = () => {
  const v = voices.find(x => x.voice_id === voiceId);
  return v ? v.name + ' (ElevenLabs)' : null;
};

/* Edge Function이 2xx가 아니면 supabase-js는 속내용을 context에 숨긴다.
   그것을 꺼내지 않으면 화면에 「non-2xx status code」만 뜬다(함정 AF). */
async function eat(error){
  try{
    const j = await error?.context?.json?.();
    if(j?.error) return new Error(j.error + (j.detail ? ' · ' + j.detail : ''));
  }catch(_){}
  return new Error(error?.message || String(error));
}

async function loadVoices(){
  const sel = $('#voiceSel');
  try{
    const { data, error } = await sb.functions.invoke('voice_bake', { body:{ mode:'voices' } });
    if(error) throw await eat(error);
    if(data?.error) throw new Error(data.error);
    voices = data.voices || [];
    purse  = data.purse  || null;

    sel.innerHTML = '<option value="">— 목소리를 고르십시오 —</option>'
      + voices.map(v => `<option value="${esc(v.voice_id)}">${esc(v.name)}</option>`).join('');

    /* 이미 구운 곳에 적힌 목소리 이름이 있으면 그것으로 맞춰 둔다 */
    const last = lastVoice();
    const m = last && voices.find(v => last.includes(v.name));
    if(m){ sel.value = m.voice_id; voiceId = m.voice_id; }

    paintPurse();
  }catch(e){
    sel.innerHTML = '<option value="">목소리를 못 받았습니다</option>';
    $('#purse').innerHTML = '<span class="x">' + esc(e.message || e) + '</span>';
    console.warn('[EG] voice_bake voices', e);
  }
}

function paintPurse(){
  const el = $('#purse'); if(!el) return;
  if(!purse){ el.textContent = ''; return; }
  const left = purse.left ?? 0;
  const need = items.filter(e => stateOf(e) !== 'ok').reduce((s,e) => s + e.text.length, 0);
  el.innerHTML = `크레딧 <b>${left.toLocaleString()}</b> 남음`
    + ` · 남은 곳 ${need.toLocaleString()}자`
    + (need > left ? ' <span class="w">⚠ 모자랍니다</span>' : '');
}

async function refreshPurse(){
  try{
    const { data } = await sb.functions.invoke('voice_bake', { body:{ mode:'probe' } });
    if(data?.purse){ purse = data.purse; paintPurse(); }
  }catch(_){}
}

async function bake(list){
  if(baking){ toast('이미 굽는 중입니다.'); return; }
  if(!voiceId){ toast('왼쪽 아래에서 목소리를 먼저 고르십시오.', 'bad'); return; }
  if(!list.length){ toast('구울 것이 없습니다.', 'ok'); return; }

  const chars = list.reduce((s,e) => s + e.text.length, 0);
  if(list.length > 1 && !confirm(
      `${list.length}곳 · ${chars.toLocaleString()}자를 굽습니다.\n`
    + `크레딧이 약 ${chars.toLocaleString()} 듭니다.\n\n계속할까요?`)) return;

  baking = true;
  let done = 0, stopped = null;
  for (const e of list){
    toast(`굽는 중 ${done + 1}/${list.length} — ${e.name}`);
    try{
      const { data, error } = await sb.functions.invoke('voice_bake', {
        body:{ mode:'bake', scope:e.scope, ref:e.ref, voice_id:voiceId, voice:voiceName() }
      });
      if(error) throw await eat(error);
      if(data?.error) throw new Error(data.error);
      done++;
    }catch(err){
      console.warn('[EG] voice_bake', e.scope, e.ref, err);
      stopped = { name:e.name, why:(err.message || String(err)) };
      break;
    }
  }
  baking = false;

  await load();
  await refreshPurse();

  if(stopped) toast(`${done}곳 굽고 「${stopped.name}」에서 멈췄습니다 — ${stopped.why}`, 'bad');
  else        toast(`${done}곳을 구웠습니다. 🎙`, 'ok');
}

boot();
</script>
