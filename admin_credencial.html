<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EG Credencial — 도장 공방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bench:#171C26;        /* 작업대 */
  --bench-2:#1F2633;
  --line:#2E3646;
  --paper:#FDFCFA;        /* 정본 종이색 (결정문 18호) */
  --ink:#2E3F63;
  --gold:#C7A24A;
  --dim:#8A93A6;
  --text:#E7EAF0;
  --danger:#C4574F;
  --ok:#5E9C6E;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bench);
  color:var(--text);
  font-family:'Noto Sans KR',system-ui,sans-serif;
  font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ── 머리 ── */
header{
  display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
  padding:18px 24px;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;background:var(--bench);
}
header h1{
  margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;
  font-size:26px;letter-spacing:.06em;
}
header h1 em{font-style:normal;color:var(--gold)}
.sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.who{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim)}

/* ── 판 ── */
main{display:grid;grid-template-columns:320px 1fr;gap:0;min-height:calc(100vh - 63px)}
@media(max-width:900px){main{grid-template-columns:1fr}}

aside{border-right:1px solid var(--line);padding:16px;overflow:auto}
.tools{display:flex;gap:6px;margin-bottom:12px}
.tools input,.tools select{
  background:var(--bench-2);border:1px solid var(--line);color:var(--text);
  border-radius:4px;padding:7px 9px;min-width:0;flex:1
}
.newbtn{
  width:100%;padding:10px;margin-bottom:14px;cursor:pointer;
  background:transparent;border:1px dashed var(--line);color:var(--gold);
  border-radius:5px;letter-spacing:.04em
}
.newbtn:hover{border-color:var(--gold);background:rgba(199,162,74,.06)}

.kind{
  display:flex;gap:11px;align-items:center;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--line);
  padding:10px 6px;color:var(--text)
}
.kind:hover{background:var(--bench-2)}
.kind[aria-current="true"]{background:var(--bench-2);box-shadow:inset 3px 0 0 var(--gold)}
.chip{
  width:38px;height:38px;flex:none;border-radius:3px;background:#0F131B;
  display:grid;place-items:center;overflow:hidden
}
.chip i{display:block;width:32px;height:32px;background:currentColor}
.kind .t{font-weight:500;line-height:1.3}
.kind .c{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.fam{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;padding:1px 5px;border:1px solid var(--line);border-radius:2px;color:var(--dim)}
.off{opacity:.42}

/* ── 작업 ── */
section{padding:22px 26px;overflow:auto}
.empty{color:var(--dim);max-width:38ch;margin-top:14vh;font-size:15px;line-height:1.8}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 18px;max-width:900px}
.f{display:flex;flex-direction:column;gap:5px}
.f.wide{grid-column:1/-1}
label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
label .hint{text-transform:none;letter-spacing:0;font-family:'Noto Sans KR',sans-serif;color:#697487}
input[type=text],input[type=number],input[type=datetime-local],select{
  background:var(--bench-2);border:1px solid var(--line);color:var(--text);
  border-radius:4px;padding:8px 10px;width:100%
}
input[type=text].mono{font-family:'IBM Plex Mono',monospace;letter-spacing:.05em}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer;background:var(--bench-2)}
.chk input{accent-color:var(--gold)}
.chk[data-on="1"]{border-color:var(--gold);color:#F2E6C7}
.inkrow{display:flex;gap:8px;align-items:center}
.inkrow input[type=color]{width:42px;height:38px;padding:0;border:1px solid var(--line);background:none;border-radius:4px;cursor:pointer}

h2{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;letter-spacing:.04em;margin:26px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line);max-width:900px}
h2:first-of-type{margin-top:0}

/* ── 잉크패드(시그니처) ── */
.pad{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;max-width:900px}
.drop{
  width:210px;border:1px dashed var(--line);border-radius:6px;padding:14px;text-align:center;
  cursor:pointer;background:var(--bench-2);color:var(--dim);font-size:12.5px
}
.drop:hover,.drop.over{border-color:var(--gold);color:var(--gold)}
.drop b{display:block;color:var(--text);font-weight:500;margin-bottom:3px;font-size:13px}
.drop .meta{font-family:'IBM Plex Mono',monospace;font-size:10px;margin-top:8px;color:#697487}
.sheet{
  background:var(--paper);border-radius:3px;padding:22px;
  box-shadow:0 12px 30px rgba(0,0,0,.45);
  display:grid;place-items:center;min-width:190px;min-height:190px;
}
.press{mix-blend-mode:multiply;transition:transform .5s cubic-bezier(.32,.72,0,1)}
.press i{display:block;background:currentColor}
.sheetcap{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.1em;margin-top:8px;text-align:center}

/* ── 바닥 ── */
.bar{
  position:sticky;bottom:0;display:flex;gap:10px;align-items:center;
  margin-top:26px;padding:14px 0;background:linear-gradient(transparent,var(--bench) 22%);max-width:900px
}
.btn{padding:10px 20px;border-radius:5px;border:1px solid var(--line);background:var(--bench-2);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1A1408;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--danger);border-color:transparent;margin-left:auto}
.btn.ghost:hover{border-color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ── 문지기 · 알림 ── */
.gate{max-width:340px;margin:16vh auto;padding:0 20px}
.gate h2{border:0;font-size:22px;margin-bottom:6px}
.gate p{color:var(--dim);margin:0 0 18px}
.gate .f{margin-bottom:10px}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:#0E1117;border:1px solid var(--line);border-left:3px solid var(--gold);
  padding:11px 18px;border-radius:5px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:50;max-width:min(560px,90vw)
}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-left-color:var(--danger)}
#toast.good{border-left-color:var(--ok)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <h2>도장 공방</h2>
  <p>관리자만 들어옵니다.</p>
  <div class="f"><label for="em">이메일</label><input id="em" type="text" autocomplete="username"></div>
  <div class="f"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password"></div>
  <button class="btn primary" id="loginBtn" style="width:100%;margin-top:8px">들어가기</button>
</div>

<div id="app" hidden>
<header>
  <h1>EG <em>Credencial</em></h1>
  <span class="sub">도장 공방 · v1.0</span>
  <span class="who" id="who"></span>
</header>

<main>
  <aside>
    <button class="newbtn" id="newBtn">+ 새 판 새기기</button>
    <div class="tools">
      <input id="q" type="text" placeholder="이름·코드 찾기">
      <select id="famF">
        <option value="">전체</option>
        <option value="intrare">입국</option>
        <option value="manere">체류</option>
        <option value="ephemera">한정</option>
      </select>
    </div>
    <div id="list"></div>
  </aside>

  <section>
    <div id="blank" class="empty">
      왼쪽에서 판을 고르거나 새로 새깁니다.<br>
      아직 안 구운 도장은 그냥 없습니다 — 「준비 중」은 어디에도 적지 않습니다.
    </div>

    <form id="form" hidden onsubmit="return false">
      <h2>판</h2>
      <div class="grid">
        <div class="f"><label for="code">코드 <span class="hint">저장 뒤 못 바꿈</span></label>
          <input id="code" class="mono" type="text" placeholder="col_intrare"></div>
        <div class="f"><label for="title">이름</label><input id="title" type="text" placeholder="콜레주 드 콤포스텔라"></div>
        <div class="f"><label for="motto">명각 <span class="hint">라틴어는 U 대신 V</span></label>
          <input id="motto" class="mono" type="text" placeholder="INTRARE"></div>
        <div class="f"><label for="family">종류</label>
          <select id="family">
            <option value="intrare">입국 — 처음 들어간 날</option>
            <option value="manere">체류 — 무언가 일어난 날</option>
            <option value="ephemera">한정 — 문 닫히면 영영</option>
          </select></div>
        <div class="f"><label for="area">우주 <span class="hint">하루 한 장의 단위</span></label>
          <input id="area" class="mono" type="text" list="areas" placeholder="collegium">
          <datalist id="areas"></datalist></div>
        <div class="f"><label for="shape">모양</label><select id="shape"></select></div>
        <div class="f"><label for="refType">잇는 곳</label>
          <select id="refType">
            <option value="">— 없음</option>
            <option value="universe">우주</option>
            <option value="star">별</option>
            <option value="observatory">천문대</option>
            <option value="hall">음악관 홀</option>
            <option value="museum">미술관</option>
            <option value="popup_book">팝업 책</option>
            <option value="college">콜레주</option>
          </select></div>
        <div class="f"><label for="refId">잇는 키</label><input id="refId" class="mono" type="text" placeholder="별 id · 지명 코드 · org"></div>
        <div class="f"><label for="variant">별 갈래</label>
          <select id="variant">
            <option value="">— 별이 아님</option>
            <option value="A">A · 콩파뇽 합류 (SODALIS)</option>
            <option value="B">B · 응답의 정원 (RESPONSVM)</option>
          </select></div>
        <div class="f"><label for="inkTxt">잉크</label>
          <div class="inkrow"><input id="ink" type="color" value="#2E3F63"><input id="inkTxt" class="mono" type="text" value="#2E3F63"></div></div>
        <div class="f"><label for="sort">차례</label><input id="sort" type="number" value="0"></div>
      </div>

      <h2>규칙</h2>
      <div class="grid">
        <div class="f wide"><label>획득 <span class="hint">겹쳐 씁니다 — 천문대는 곳마다 한 번 + 하루 한 곳</span></label>
          <div class="checks" id="rules">
            <label class="chk"><input type="checkbox" value="once">평생 한 번</label>
            <label class="chk"><input type="checkbox" value="once_per_subject">대상마다 한 번</label>
            <label class="chk"><input type="checkbox" value="daily_per_area">하루 한 장</label>
            <label class="chk"><input type="checkbox" value="unlimited">제한 없음</label>
          </div></div>
        <div class="f wide"><label>각인</label>
          <div class="checks">
            <label class="chk"><input type="checkbox" id="withTime">현지 시각도 새김</label>
            <label class="chk"><input type="checkbox" id="inscribeOut">두 줄이라 판 밖으로</label>
            <label class="chk"><input type="checkbox" id="active" checked>열려 있음</label>
          </div></div>
        <div class="f"><label for="opensAt">열리는 때 <span class="hint">한정만</span></label><input id="opensAt" type="datetime-local"></div>
        <div class="f"><label for="closesAt">닫히는 때 <span class="hint">한정만</span></label><input id="closesAt" type="datetime-local"></div>
      </div>

      <h2>잉크패드</h2>
      <div class="pad">
        <div>
          <div class="drop" id="dropArt" tabindex="0" role="button">
            <b>몸통</b>흰 배경 · 검정 한 색 · 1024px<br>던지거나 눌러서 고르기
            <div class="meta" id="metaArt">아직 없음</div>
          </div>
          <div class="drop" id="dropSub" tabindex="0" role="button" style="margin-top:10px">
            <b>아랫단</b>팝업 그 책의 문양
            <div class="meta" id="metaSub">아직 없음</div>
          </div>
          <input type="file" id="fileArt" accept="image/*" hidden>
          <input type="file" id="fileSub" accept="image/*" hidden>
        </div>
        <div>
          <div class="sheet"><div class="press" id="press"></div></div>
          <div class="sheetcap" id="pressCap">종이 위 · 실제 잉크색</div>
        </div>
      </div>

      <div class="bar">
        <button class="btn primary" id="saveBtn">판 저장</button>
        <button class="btn" id="rollBtn" type="button">다시 눌러보기</button>
        <button class="btn ghost" id="delBtn" type="button">판 지우기</button>
      </div>
    </form>
  </section>
</main>
</div>

<div id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPA_URL = 'https://cyhlotwdisjvoxvfkpnd.supabase.co';
const SUPA_KEY = 'sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';
const BUCKET   = 'credencial-assets';
const sb = createClient(SUPA_URL, SUPA_KEY, {
  auth:{ storageKey:'eungyo-auth', persistSession:true, autoRefreshToken:true }
});

const SHAPES = [
  ['circle','원형'],['oval_v','세로 타원'],['oval_h','가로 타원'],
  ['rect_v','세로 직사각'],['rect_h','가로 직사각'],['square_r','둥근 정사각'],
  ['hex','육각'],['oct','팔각'],['shield','방패'],['arch','아치'],
  ['penta','오각'],['diamond','마름모']
];
const AREA_SEEDS = ['collegium','stadium','musaeum','constellatio','cochlear','camera',
                    'peregrinatio','musica','observatorium','domus','palatium','popup'];
const FAM_KO = { intrare:'입국', manere:'체류', ephemera:'한정' };

const $ = s => document.querySelector(s);
let kinds = [], cur = null, pending = { art:null, sub:null };

/* ── 알림 ── */
let toastT;
function toast(msg, kind){
  const t = $('#toast');
  t.textContent = msg; t.className = 'on ' + (kind||'');
  clearTimeout(toastT); toastT = setTimeout(()=>t.className='', 3600);
}

/* ── 문지기 ── */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $('#gate').hidden = false; return; }
  const { data:isAdmin } = await sb.rpc('eg_is_admin');
  if(!isAdmin){
    $('#gate').hidden = false;
    $('#gate').innerHTML = '<h2>도장 공방</h2><p>이 문은 관리자에게만 열립니다.</p>';
    return;
  }
  $('#app').hidden = false;
  $('#who').textContent = session.user.email || '';
  fillStatics();
  await load();
}
$('#loginBtn').addEventListener('click', async () => {
  const { error } = await sb.auth.signInWithPassword({ email:$('#em').value.trim(), password:$('#pw').value });
  if(error){ toast('들어가지 못했습니다 — ' + error.message, 'bad'); return; }
  $('#gate').hidden = true; boot();
});

function fillStatics(){
  $('#shape').innerHTML = SHAPES.map(([v,k])=>`<option value="${v}">${k}</option>`).join('');
  $('#areas').innerHTML = AREA_SEEDS.map(a=>`<option value="${a}">`).join('');
}

/* ── 목록 ── */
async function load(){
  const { data, error } = await sb.from('stamp_kinds').select('*').order('sort').order('code');
  if(error){ toast('판을 불러오지 못했습니다 — ' + error.message, 'bad'); return; }
  kinds = data || [];
  const seen = new Set([...AREA_SEEDS, ...kinds.map(k=>k.area)].filter(Boolean));
  $('#areas').innerHTML = [...seen].sort().map(a=>`<option value="${a}">`).join('');
  render();
}
function render(){
  const q = $('#q').value.trim().toLowerCase(), fam = $('#famF').value;
  const rows = kinds.filter(k =>
    (!fam || k.family === fam) &&
    (!q || (k.code + ' ' + k.title).toLowerCase().includes(q)));
  const box = $('#list');
  if(!rows.length){
    box.innerHTML = '<p style="color:var(--dim);padding:14px 6px">여기 걸린 판이 없습니다. 위에서 하나 새기면 됩니다.</p>';
    return;
  }
  box.innerHTML = rows.map(k => `
    <button class="kind ${k.active?'':'off'}" data-code="${esc(k.code)}"
            aria-current="${cur && cur.code===k.code}">
      <span class="chip" style="color:${esc(k.ink||'#888')}">
        ${k.art_url ? `<i style="-webkit-mask:url('${esc(k.art_url)}') center/contain no-repeat;mask:url('${esc(k.art_url)}') center/contain no-repeat"></i>` : ''}
      </span>
      <span>
        <span class="t">${esc(k.title||'(이름 없음)')}</span>
        <span class="fam">${FAM_KO[k.family]||k.family}</span><br>
        <span class="c">${esc(k.code)}</span>
      </span>
    </button>`).join('');
  box.querySelectorAll('.kind').forEach(b =>
    b.addEventListener('click', () => pick(b.dataset.code)));
}
$('#q').addEventListener('input', render);
$('#famF').addEventListener('change', render);

/* ── 고르기 · 새로 새기기 ── */
function pick(code){
  cur = kinds.find(k => k.code === code) || null;
  pending = { art:null, sub:null };
  fill(cur); render();
}
$('#newBtn').addEventListener('click', () => {
  cur = null; pending = { art:null, sub:null };
  fill({ family:'intrare', shape:'circle', ink:'#2E3F63', rules:['once'], active:true, sort:0 });
  render(); $('#code').focus();
});

function fill(k){
  $('#blank').hidden = !!k; $('#form').hidden = !k;
  if(!k) return;
  $('#code').value = k.code || ''; $('#code').disabled = !!(cur && cur.code);
  $('#title').value = k.title || ''; $('#motto').value = k.motto || '';
  $('#family').value = k.family || 'intrare'; $('#area').value = k.area || '';
  $('#shape').value = k.shape || 'circle'; $('#refType').value = k.ref_type || '';
  $('#refId').value = k.ref_id || ''; $('#variant').value = k.variant || '';
  $('#ink').value = k.ink || '#2E3F63'; $('#inkTxt').value = k.ink || '#2E3F63';
  $('#sort').value = k.sort ?? 0;
  $('#withTime').checked = !!k.with_time;
  $('#inscribeOut').checked = !!k.inscribe_out;
  $('#active').checked = k.active !== false;
  $('#opensAt').value = toLocal(k.opens_at); $('#closesAt').value = toLocal(k.closes_at);
  const rules = k.rules || [];
  $('#rules').querySelectorAll('input').forEach(i => { i.checked = rules.includes(i.value); syncChk(i); });
  document.querySelectorAll('.chk input').forEach(syncChk);
  $('#metaArt').textContent = k.art_url ? '올려둔 것 있음' : '아직 없음';
  $('#metaSub').textContent = k.art_sub_url ? '올려둔 것 있음' : '아직 없음';
  preview();
}
const toLocal = t => t ? new Date(t).toISOString().slice(0,16) : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function syncChk(i){ i.closest('.chk').dataset.on = i.checked ? '1' : '0'; }
document.addEventListener('change', e => { if(e.target.matches('.chk input')) syncChk(e.target); });

/* ── 잉크색 두 칸 물림 ── */
$('#ink').addEventListener('input', () => { $('#inkTxt').value = $('#ink').value; preview(); });
$('#inkTxt').addEventListener('input', () => {
  const v = $('#inkTxt').value.trim();
  if(/^#[0-9a-f]{6}$/i.test(v)){ $('#ink').value = v; preview(); }
});
$('#shape').addEventListener('change', preview);

/* ── 알파 굽기 (작업일지 0803 §5 공정) ── */
async function bake(file){
  const bmp = await createImageBitmap(file);
  const c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  const ctx = c.getContext('2d', { willReadFrequently:true });
  ctx.drawImage(bmp, 0, 0);
  const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data;
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for(let y = 0; y < c.height; y++){
    for(let x = 0; x < c.width; x++){
      const i = (y * c.width + x) * 4;
      const v = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      let a = (238 - v) / 165; a = a < 0 ? 0 : a > 1 ? 1 : a;
      d[i] = d[i+1] = d[i+2] = 0;
      d[i+3] = Math.round(a * 255);
      if(d[i+3] > 6){
        if(x < x0) x0 = x; if(x > x1) x1 = x;
        if(y < y0) y0 = y; if(y > y1) y1 = y;
      }
    }
  }
  if(x1 < 0) throw new Error('잉크가 한 점도 없습니다. 흰 배경에 검정으로 구운 그림이 맞는지 봐 주세요.');
  ctx.putImageData(img, 0, 0);
  const w = x1 - x0 + 1, h = y1 - y0 + 1, s = Math.min(1, 520 / Math.max(w, h));
  const out = document.createElement('canvas');
  out.width = Math.round(w * s); out.height = Math.round(h * s);
  const o = out.getContext('2d');
  o.imageSmoothingQuality = 'high';
  o.drawImage(c, x0, y0, w, h, 0, 0, out.width, out.height);
  const blob = await new Promise(r => out.toBlob(r, 'image/png'));
  return { blob, url:URL.createObjectURL(blob), w:out.width, h:out.height, src:[bmp.width, bmp.height] };
}

function hookDrop(dropId, fileId, slot, metaId){
  const drop = $(dropId), file = $(fileId);
  drop.addEventListener('click', () => file.click());
  drop.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); file.click(); } });
  ['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => take(e.dataTransfer.files[0]));
  file.addEventListener('change', () => take(file.files[0]));
  async function take(f){
    if(!f) return;
    try{
      const r = await bake(f);
      pending[slot] = r;
      $(metaId).textContent = `${r.src[0]}px → ${r.w}×${r.h} · ${(r.blob.size/1024).toFixed(0)}KB`;
      preview();
      toast('구웠습니다. 저장을 눌러야 올라갑니다.');
    }catch(err){ toast(err.message, 'bad'); }
  }
}
hookDrop('#dropArt', '#fileArt', 'art', '#metaArt');
hookDrop('#dropSub', '#fileSub', 'sub', '#metaSub');

/* ── 종이 위 미리보기 ── */
const SIZE = { circle:[126,126], oval_v:[104,140], oval_h:[150,100], rect_v:[104,146],
               rect_h:[156,102], square_r:[126,126], hex:[130,130], oct:[130,130],
               shield:[116,140], arch:[116,140], penta:[126,132], diamond:[134,134] };
function preview(){
  const url = pending.art?.url || cur?.art_url;
  const sub = pending.sub?.url || cur?.art_sub_url;
  const ink = $('#inkTxt').value.trim() || '#2E3F63';
  const [w, h] = SIZE[$('#shape').value] || [126,126];
  const p = $('#press');
  if(!url){
    p.innerHTML = '';
    p.style.cssText = 'width:126px;height:126px;border:1px dashed #DAD5CC;border-radius:3px';
    $('#pressCap').textContent = '아직 안 구운 도장은 그냥 없습니다';
    return;
  }
  const rot = (Math.random()*24 - 12).toFixed(2);
  const a   = (0.68 + Math.random()*0.24).toFixed(3);
  p.style.cssText = `color:${ink};opacity:${a};transform:rotate(${rot}deg)`;
  p.innerHTML =
    `<i style="width:${w}px;height:${h}px;-webkit-mask:url('${esc(url)}') center/contain no-repeat;mask:url('${esc(url)}') center/contain no-repeat"></i>` +
    (sub ? `<i style="width:${w}px;height:${Math.round(h*0.42)}px;margin-top:4px;-webkit-mask:url('${esc(sub)}') center/contain no-repeat;mask:url('${esc(sub)}') center/contain no-repeat"></i>` : '');
  $('#pressCap').textContent = `rot ${rot}° · ink ${a} — 찍을 때마다 다시 굴려집니다`;
}
$('#rollBtn').addEventListener('click', preview);

/* ── 저장 ── */
$('#saveBtn').addEventListener('click', async () => {
  const code = $('#code').value.trim();
  if(!/^[a-z0-9_]{2,48}$/.test(code)){ toast('코드는 소문자·숫자·밑줄로만 짓습니다.', 'bad'); return; }
  if(!$('#title').value.trim()){ toast('이름이 비었습니다.', 'bad'); return; }
  if(!$('#area').value.trim()){ toast('우주가 비었습니다 — 하루 한 장을 세는 단위입니다.', 'bad'); return; }
  const rules = [...$('#rules').querySelectorAll('input:checked')].map(i => i.value);
  if(!rules.length){ toast('획득 규칙을 적어도 하나 고릅니다.', 'bad'); return; }
  if(rules.includes('once') && rules.includes('once_per_subject')){
    toast('평생 한 번과 대상마다 한 번은 같이 못 씁니다.', 'bad'); return;
  }

  const btn = $('#saveBtn'); btn.disabled = true; btn.textContent = '저장하는 중…';
  try{
    const urls = {};
    for(const [slot, path] of [['art','stamp'], ['sub','sub']]){
      if(!pending[slot]) continue;
      const key = `${path}/${code}.png`;
      const { error } = await sb.storage.from(BUCKET)
        .upload(key, pending[slot].blob, { upsert:true, contentType:'image/png' });
      if(error) throw error;
      const { data } = sb.storage.from(BUCKET).getPublicUrl(key);
      urls[slot] = `${data.publicUrl}?v=${Date.now()}`;
    }
    const row = {
      code, family:$('#family').value, area:$('#area').value.trim(),
      ref_type:$('#refType').value || null, ref_id:$('#refId').value.trim() || null,
      variant:$('#variant').value || null,
      title:$('#title').value.trim(), motto:$('#motto').value.trim() || null,
      shape:$('#shape').value, ink:$('#inkTxt').value.trim(), rules,
      with_time:$('#withTime').checked, inscribe_out:$('#inscribeOut').checked,
      active:$('#active').checked, sort:Number($('#sort').value) || 0,
      opens_at:$('#opensAt').value ? new Date($('#opensAt').value).toISOString() : null,
      closes_at:$('#closesAt').value ? new Date($('#closesAt').value).toISOString() : null
    };
    if(urls.art) row.art_url = urls.art;
    if(urls.sub) row.art_sub_url = urls.sub;

    const { error } = await sb.from('stamp_kinds').upsert(row, { onConflict:'code' });
    if(error) throw error;

    pending = { art:null, sub:null };
    await load(); pick(code);
    toast('판을 걸었습니다.', 'good');
  }catch(err){
    toast('저장하지 못했습니다 — ' + (err.message || err), 'bad');
  }finally{
    btn.disabled = false; btn.textContent = '판 저장';
  }
});

/* ── 지우기 ── */
$('#delBtn').addEventListener('click', async () => {
  if(!cur) return;
  if(!confirm(`「${cur.title}」 판을 지웁니다. 이미 찍힌 도장이 있으면 지워지지 않습니다.`)) return;
  const { error } = await sb.from('stamp_kinds').delete().eq('code', cur.code);
  if(error){
    toast('지울 수 없습니다 — 이미 누군가의 수첩에 찍혔습니다. 「열려 있음」을 끄면 새로 안 찍힙니다.', 'bad');
    return;
  }
  cur = null; fill(null); await load();
  toast('판을 내렸습니다.', 'good');
});

boot();
</script>
